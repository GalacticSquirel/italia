[project]
name = "italia-training"
version = "0.1.0"
description = "Distillation, preference tuning, evaluation and GGUF export for the on-device Italian tutor model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
# Core: everything that runs without a GPU (spec, data generation, filters, eval maths, manifest).
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "simplemma==2.0.0",
]

[project.optional-dependencies]
# GPU training stack. Versions are pinned to a set that Unsloth 2026.11.4 declares compatible
# (transformers <= 5.17, trl <= 1.15, torch < 2.15, datasets < 5).
gpu = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "datasets==4.8.5",
  "peft==0.21.2",
  "torch==2.14.1",
  "transformers==5.17.0",
  "trl==1.15.0",
  "unsloth==2026.11.4",
  "unsloth-zoo==2026.11.4",
]
# Optional experiment tracking (off by default in every config).
wandb = ["wandb==0.31.0"]
# CPU smoke test of the exported GGUF (builds llama.cpp from source; needs a C++ toolchain).
export = ["llama-cpp-python==0.3.36"]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.5",
  "types-jsonschema==4.26.0.20261006",
  "types-PyYAML==6.0.12.20261113",
]

[tool.uv]
# Not an installable package: run stages with `uv run python -m <stage> ...` from this folder.
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "out", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PL", "TID"]
ignore = [
  "PLR0913", # config-heavy builders take many keyword arguments
  "PLR2004", # thresholds are named in config; small literals in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]
# GPU stages import torch/trl lazily so the CPU tooling never needs them installed.
"train/**" = ["PLC0415"]
"export/**" = ["PLC0415"]
"eval/**" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^out/", "^work/"]

[[tool.mypy.overrides]]
# Optional heavy dependencies (extras `gpu`, `export`, `wandb`) are not installed in CI.
module = [
  "accelerate.*",
  "datasets.*",
  "llama_cpp.*",
  "peft.*",
  "torch.*",
  "transformers.*",
  "trl.*",
  "unsloth.*",
  "wandb.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

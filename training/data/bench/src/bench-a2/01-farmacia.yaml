- scenario: farmacia-semplice
  level: A2
  persona: en-m-retired
  history: [auxiliary-choice]
  turns:
    - tutor: "Buongiorno, come posso aiutarla?"
    - learner: "Buongiorno. Ho mal di testa perché ieri ho stato tutto il giorno al sole."
      errors: [auxiliary-choice]
      gold: {text: "ho stato", fix: "sono stato"}
    - tutor: "Ho stato? Pensi al primo verbo: è quello giusto?"
      prompt: {text: "ho stato", tags: [auxiliary-choice]}
    - learner: "Sono stato tutto il giorno al sole."
    - tutor: "Esatto! Mi dispiace. Ha anche la febbre?"
      goals: [symptom]
    - learner: "No, non ho temperatura. Può darmi qualcosa?"
      errors: [word-choice]
      gold: {text: "temperatura", fix: "febbre"}
    - tutor: "Bene, non ha la febbre. Le do queste compresse."
      goals: [ask-medicine]
      recast: {text: "temperatura", fix: "la febbre", tags: [word-choice]}
    - learner: "Come devo le prendere?"
      errors: [pronoun-position]
      gold: {text: "devo le prendere", fix: "devo prenderle"}
    - tutor: "Devo le prendere? Guardi dove ha messo «le»."
      prompt: {text: "devo le prendere", tags: [pronoun-position]}
    - learner: "Come devo prenderle? Ecco dieci euro, intanto."
    - tutor: "Bravo! Una dopo i pasti, due volte al giorno. Sono sette euro: ecco il resto."
      goals: [how-take, pay]
      new: [{lemma: pasto, gloss: meal}]

- scenario: farmacia-semplice
  level: A2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, come posso aiutarla?"
    - learner: "Buongiorno. Ho il raffreddore e mi fa male la gola."
    - tutor: "Mi dispiace. Da quanto tempo sta male?"
      goals: [symptom]
    - learner: "Da tre giorni. Vorrei uno sciroppo, ma sono imbarazzata di quattro mesi."
      errors: [false-friend]
      gold: {text: "imbarazzata", fix: "incinta"}
    - tutor: "Ah, è incinta di quattro mesi! Allora le do uno sciroppo naturale."
      goals: [ask-medicine]
      recast: {text: "imbarazzata", fix: "incinta", tags: [false-friend]}
      new: [{lemma: incinta, gloss: pregnant}]
    - learner: "Grazie. Ho che prenderlo ogni giorno?"
      errors: [modal-infinitive]
      gold: {text: "Ho che prenderlo", fix: "Devo prenderlo"}
    - tutor: "Ho che prenderlo? In italiano qui usiamo un altro verbo, senza «che»."
      prompt: {text: "Ho che prenderlo", tags: [modal-infinitive]}
    - learner: "Devo prenderlo ogni giorno?"
    - tutor: "Esatto! Sì, un cucchiaio tre volte al giorno."
      goals: [how-take]
      new: [{lemma: cucchiaio, gloss: spoon}]
    - learner: "Va bene. Posso pagare con carta?"
    - tutor: "Certo. Sono nove euro. Grazie e buona giornata!"
      goals: [pay]

- scenario: farmacia-semplice
  level: A2
  persona: en-f-student
  history: [pronoun-position]
  turns:
    - tutor: "Buonasera, come posso aiutarla?"
    - learner: "Salve. Ho la febbre da ieri sera e sono molto calda."
      errors: [essere-avere]
      gold: {text: "sono molto calda", fix: "ho molto caldo"}
    - tutor: "Sono molto calda? Qui in italiano serve un altro verbo."
      prompt: {text: "sono molto calda", tags: [essere-avere]}
    - learner: "Ho molto caldo."
    - tutor: "Giusto! Quanto ha di febbre?"
      goals: [symptom]
    - learner: "Trentotto e mezzo. Mi può dare qualcosa?"
    - tutor: "Sì, queste compresse vanno bene per la febbre."
      goals: [ask-medicine]
    - learner: "Posso le prendere senza mangiare?"
      errors: [pronoun-position]
      gold: {text: "Posso le prendere", fix: "Posso prenderle"}
    - tutor: "Posso le prendere? Il pronome «le» non è al posto giusto."
      prompt: {text: "Posso le prendere", tags: [pronoun-position]}
      new: [{lemma: pronome, gloss: pronoun}]
    - learner: "Le posso prendere senza mangiare? Ecco dieci euro."
    - tutor: "Brava! Meglio dopo i pasti, ogni otto ore. Sono sei euro: ecco il resto."
      goals: [how-take, pay]
      new: [{lemma: pasto, gloss: meal}]

- scenario: farmacia-semplice
  level: A2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buonasera, come posso aiutarla?"
    - learner: "Buonasera. Lavoro in cucina e ho sempre mal di schiena."
    - tutor: "Mi dispiace. Da quanto tempo ha questo dolore?"
      goals: [symptom]
    - learner: "Da una settimana. Il dolore è più forte a la sera e no posso dormire."
      errors: [articulated-preposition, negation]
      gold: {text: "a la sera", fix: "alla sera"}
    - tutor: "A la sera? In italiano queste due parole diventano una."
      prompt: {text: "a la sera", tags: [articulated-preposition]}
    - learner: "Alla sera. Ha qualcosa per il dolore?"
    - tutor: "Esatto! Sì, c'è questa crema oppure ci sono le compresse."
      goals: [ask-medicine]
      new: [{lemma: crema, gloss: cream}]
    - learner: "Prendo le compresse. Quante volte al giorno devo de prenderle?"
      errors: [modal-infinitive]
      gold: {text: "devo de prenderle", fix: "devo prenderle"}
    - tutor: "Devo de prenderle? Tra i due verbi c'è una parola in più."
      prompt: {text: "devo de prenderle", tags: [modal-infinitive]}
    - learner: "Non capisco. Quante volte devo de prenderle?"
      errors: [modal-infinitive]
      gold: {text: "de prenderle", fix: "prenderle"}
    - tutor: "Deve prenderle due volte al giorno, dopo i pasti."
      goals: [how-take]
      recast: {text: "devo de prenderle", fix: "Deve prenderle", tags: [modal-infinitive]}
      new: [{lemma: pasto, gloss: meal}]
    - learner: "Va bene. Ecco dieci euro."
    - tutor: "Grazie. Sono otto euro, ecco il resto. Buona serata!"
      goals: [pay]

- scenario: farmacia-semplice
  level: A2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, come posso aiutarla?"
    - learner: "Buongiorno. Ho preso un brutto freddo."
      errors: [word-choice]
      gold: {text: "freddo", fix: "raffreddore"}
    - tutor: "Ha preso un brutto raffreddore? Mi dispiace. Ha anche la tosse?"
      goals: [symptom]
      recast: {text: "un brutto freddo", fix: "un brutto raffreddore", tags: [word-choice]}
      new: [{lemma: tosse, gloss: cough}]
    - learner: "Sì, soprattutto di notte. Può mi consigliare qualcosa?"
      errors: [pronoun-position]
      gold: {text: "Può mi consigliare", fix: "Mi può consigliare"}
    - tutor: "Può mi consigliare? Guardi dove ha messo «mi»."
      prompt: {text: "Può mi consigliare", tags: [pronoun-position]}
    - learner: "Mi può consigliare qualcosa?"
    - tutor: "Brava! Per la tosse le consiglio questo sciroppo."
      goals: [ask-medicine]
      new: [{lemma: tosse, gloss: cough}]
    - learner: "Va bene. Come si prende?"
    - tutor: "Un cucchiaio la sera, prima di dormire."
      goals: [how-take]
      new: [{lemma: cucchiaio, gloss: spoon}]
    - learner: "Lo sciroppo ha molti preservativi?"
      errors: [false-friend]
      gold: {text: "preservativi", fix: "conservanti"}
    - tutor: "No, è naturale: non ha conservanti."
      recast: {text: "preservativi", fix: "conservanti", tags: [false-friend]}
      new: [{lemma: conservante, gloss: preservative}]
    - learner: "Benissimo, lo prendo. Posso pagare con il telefono?"
    - tutor: "Certo. Sono nove euro e novanta. Buona giornata!"
      goals: [pay]

- scenario: farmacia-semplice
  level: A2
  persona: en-m-heritage
  history: [subject-verb-agreement]
  turns:
    - tutor: "Buongiorno, come posso aiutarla?"
    - learner: "Buongiorno. Mia nonna ha la febbre e i miei fratelli ha il raffreddore."
      errors: [subject-verb-agreement]
      gold: {text: "i miei fratelli ha", fix: "i miei fratelli hanno"}
    - tutor: "I miei fratelli ha? I fratelli sono più di uno."
      prompt: {text: "i miei fratelli ha", tags: [subject-verb-agreement]}
    - learner: "Sì, i miei fratelli ha tutti il raffreddore."
      errors: [subject-verb-agreement]
      gold: {text: "fratelli ha", fix: "fratelli hanno"}
    - tutor: "Ah, i suoi fratelli hanno il raffreddore. E la nonna ha la febbre alta?"
      goals: [symptom]
      recast: {text: "i miei fratelli ha", fix: "i suoi fratelli hanno", tags: [subject-verb-agreement]}
    - learner: "Trentotto. Che cosa possiamo darle?"
    - tutor: "Per la nonna queste compresse, una ogni otto ore. Per i fratelli uno sciroppo."
      goals: [ask-medicine]
    - learner: "E lo sciroppo? Devono lo prendere la sera?"
      errors: [pronoun-position]
      gold: {text: "Devono lo prendere", fix: "Lo devono prendere"}
    - tutor: "Devono lo prendere? Guardi bene dov'è «lo»."
      prompt: {text: "Devono lo prendere", tags: [pronoun-position]}
    - learner: "Lo devono prendere la sera? Ecco venti euro."
    - tutor: "Giusto! Sì, un cucchiaio la sera. Sono quindici euro: ecco il resto."
      goals: [how-take, pay]
      new: [{lemma: cucchiaio, gloss: spoon}]

- scenario: farmacia-semplice
  level: A2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, come posso aiutarla?"
    - learner: "Buongiorno. Mio figlio ha mal di testa e gli fa male anche la pancia."
    - tutor: "Mi dispiace. Quanti anni ha suo figlio?"
      goals: [symptom]
    - learner: "Ha dieci anni. Può prendere una compressa di adulti?"
      errors: [preposition]
      gold: {text: "di adulti", fix: "per adulti"}
    - tutor: "Di adulti? Qui serve un'altra preposizione."
      prompt: {text: "di adulti", tags: [preposition]}
      new: [{lemma: preposizione, gloss: preposition}]
    - learner: "Sì, di adulti. Ho solo queste a casa."
      errors: [preposition]
      gold: {text: "di adulti", fix: "per adulti"}
    - tutor: "No, una compressa per adulti è troppo forte. Meglio questo sciroppo."
      goals: [ask-medicine]
      recast: {text: "di adulti", fix: "per adulti", tags: [preposition]}
    - learner: "Va bene. Quanto sciroppo lo devo dare?"
      errors: [object-pronoun]
      gold: {text: "lo devo dare", fix: "gli devo dare"}
    - tutor: "Lo devo dare? Pensi: do lo sciroppo a mio figlio."
      prompt: {text: "lo devo dare", tags: [object-pronoun]}
    - learner: "Quanto sciroppo gli devo dare? Ecco dieci euro."
    - tutor: "Perfetto! Un cucchiaio ogni otto ore. Sono sette euro, ecco il resto."
      goals: [how-take, pay]
      new: [{lemma: cucchiaio, gloss: spoon}]

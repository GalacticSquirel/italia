    - tutor: "Anche biglietto? Manca una piccola parola."
      prompt: {text: "anche biglietto", tags: [article-use]}
    - learner: "Sì, anche biglietto per l'autobus."
      errors: [article-use]
      gold: {text: "anche biglietto", fix: "anche un biglietto"}
    - tutor: "Ecco anche un biglietto per l'autobus."
      goals: [ticket]
      recast: {text: "anche biglietto", fix: "anche un biglietto", tags: [article-use]}
    - learner: "Quanto pago? Ecco dieci euro."
    - tutor: "Sono cinque euro e cinquanta. Ecco il resto, buona giornata!"
      goals: [price, pay]


- scenario: edicola
  level: A1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Che cosa le serve?"
    - learner: "Buongiorno. Mi serve un giornale per mio marito e una rivista per me."
    - tutor: "Benissimo. Quale giornale legge suo marito?"
    - learner: "Legge La Stampa. Io voglio una rivista de cucina."
      errors: [preposition]
      gold: {text: "de cucina", fix: "di cucina"}
    - tutor: "De cucina? Come si dice «de» in italiano?"
      prompt: {text: "de cucina", tags: [preposition]}
    - learner: "De cucina, sì. Mi piace cucinare."
      errors: [preposition]
      gold: {text: "De cucina", fix: "di cucina"}
    - tutor: "Una rivista di cucina, ecco. E La Stampa."
      goals: [newspaper]
      recast: {text: "De cucina", fix: "di cucina", tags: [preposition]}
    - learner: "Vendete anche i biglietti dell'autobus?"
    - tutor: "Sì. Quanti biglietti vuole?"
    - learner: "Due. Quanto vale tutto?"
      errors: [word-choice]
      gold: {text: "vale", fix: "costa"}
    - tutor: "Ecco due biglietti. In tutto costa nove euro."
      goals: [ticket, price]
      recast: {text: "vale", fix: "costa", tags: [word-choice]}
    - learner: "Ecco dieci euro."
    - tutor: "Grazie. Ecco un euro di resto. Arrivederci!"
      goals: [pay]

- scenario: edicola
  level: A1
  persona: en-f-professional
  turns:
    - tutor: "Buongiorno! Che cosa le serve?"
    - learner: "Buongiorno. Vorrei un magazzino di moda."
      errors: [false-friend]
      gold: {text: "un magazzino", fix: "una rivista"}
    - tutor: "Ah, una rivista di moda! Ecco."
      goals: [newspaper]
      recast: {text: "un magazzino", fix: "una rivista", tags: [false-friend]}
    - learner: "Grazie. Vorrei anche un biglietto per l'autobus."
    - tutor: "Ecco il biglietto."
      goals: [ticket]
    - learner: "Come molto costa?"
      errors: [question-form]
      gold: {text: "Come molto costa", fix: "Quanto costa"}
    - tutor: "Come molto? In italiano basta una parola sola."
      prompt: {text: "Come molto", tags: [question-form]}
    - learner: "Come molto costa tutto?"
      errors: [question-form]
      gold: {text: "Come molto costa", fix: "Quanto costa"}
    - tutor: "Quanto costa tutto? Sono cinque euro."
      goals: [price]
      recast: {text: "Come molto costa", fix: "Quanto costa", tags: [question-form]}
    - learner: "Ecco dieci euro."
    - tutor: "Grazie. Ecco il resto. Buona giornata!"
      goals: [pay]

- scenario: edicola
  level: A1
  persona: es-m-worker
  history: [article-form]
  turns:
    - tutor: "Buongiorno! Che cosa le serve?"
    - learner: "Buongiorno. Uno giornale, per favore."
      errors: [article-form]
      gold: {text: "Uno giornale", fix: "Un giornale"}
    - tutor: "Uno giornale? Guardi bene la prima parola."
      prompt: {text: "Uno giornale", tags: [article-form]}
    - learner: "Un giornale!"
    - tutor: "Esatto! Quale giornale vuole?"
    - learner: "La Gazzetta dello Sport."
    - tutor: "Ecco la Gazzetta. Altro?"
      goals: [newspaper]
    - learner: "Sì. Un billete per l'autobus."
      errors: [word-choice]
      gold: {text: "billete", fix: "biglietto"}
    - tutor: "Un biglietto per l'autobus, ecco."
      goals: [ticket]
      recast: {text: "Un billete", fix: "Un biglietto", tags: [word-choice]}
    - learner: "Quanto costa todo?"
      errors: [word-choice]
      gold: {text: "todo", fix: "tutto"}
    - tutor: "Quanto costa tutto? Tre euro e cinquanta."
      goals: [price]
      recast: {text: "todo", fix: "tutto", tags: [word-choice]}
    - learner: "Ecco. Grazie."
    - tutor: "Grazie a Lei. Arrivederci!"
      goals: [pay]

- scenario: edicola
  level: A1
  persona: en-m-retired
  history: [question-form]
  turns:
    - tutor: "Buongiorno! Che cosa le serve?"
    - learner: "Buongiorno. Avete giornali inglesi?"
    - tutor: "Sì, abbiamo il Times. Lo vuole?"
    - learner: "Sì, grazie. Dove posso comprare una biglietto dell'autobus?"
      errors: [noun-gender]
      gold: {text: "una biglietto", fix: "un biglietto"}
    - tutor: "Una biglietto? Biglietto finisce con la o."
      prompt: {text: "una biglietto", tags: [noun-gender]}
    - learner: "Un biglietto!"
    - tutor: "Bravo! Ecco il giornale e un biglietto."
      goals: [newspaper, ticket]
    - learner: "Cosa è il prezzo?"
      errors: [question-form]
      gold: {text: "Cosa è il prezzo", fix: "Qual è il prezzo"}
    - tutor: "Cosa è il prezzo? Provi con un'altra parola, non «cosa»."
      prompt: {text: "Cosa è il prezzo", tags: [question-form]}
    - learner: "Che è il prezzo?"
      errors: [question-form]
      gold: {text: "Che è il prezzo", fix: "Qual è il prezzo"}
    - tutor: "Qual è il prezzo? Quattro euro e cinquanta in tutto."
      goals: [price]
      recast: {text: "Che è il prezzo", fix: "Qual è il prezzo", tags: [question-form]}
    - learner: "Ecco cinque euro."
    - tutor: "Grazie. Ecco cinquanta centesimi di resto."
      goals: [pay]
      new: [{lemma: centesimo, gloss: cent}]

- scenario: edicola

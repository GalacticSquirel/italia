- scenario: gelateria
  level: A1
  persona: en-m-retired
  history: [noun-gender]
  turns:
    - tutor: "Buonasera! Cono o coppetta?"
    - learner: "Buonasera. Vorrei una cono piccolo, per favore."
      errors: [noun-gender]
      gold: {text: "una cono", fix: "un cono"}
    - tutor: "Una cono? Cono è una parola maschile."
      prompt: {text: "una cono", tags: [noun-gender]}
      new: [{lemma: maschile, gloss: masculine}]
    - learner: "Ah, un cono! Un cono piccolo."
    - tutor: "Bravo! Che gusti vuole?"
      goals: [choose-size]
    - learner: "Vorrei due gusto: cioccolato e fragola."
      errors: [noun-number]
      gold: {text: "due gusto", fix: "due gusti"}
    - tutor: "Due gusto? Sono due, non uno."
      prompt: {text: "due gusto", tags: [noun-number]}
    - learner: "Due gusto: cioccolato e fragola."
      errors: [noun-number]
      gold: {text: "Due gusto", fix: "Due gusti"}
    - tutor: "Due gusti, benissimo: cioccolato e fragola."
      goals: [choose-flavours]
      recast: {text: "Due gusto", fix: "Due gusti", tags: [noun-number]}
    - learner: "Grazie. Quanto costa? Ho solo dieci euro."
    - tutor: "Costa due euro e cinquanta. Ecco il resto. Arrivederci!"
      goals: [pay]


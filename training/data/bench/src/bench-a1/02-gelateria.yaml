- scenario: gelateria
  level: A1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: "Buonasera! Cono o coppetta?"
    - learner: "Buonasera. Vorrei una coppetta grande."
    - tutor: "Certo. Che gusti vuole?"
      goals: [choose-size]
    - learner: "Mi piace i gusti alla frutta. Limone e fragola."
      errors: [piacere]
      gold: {text: "Mi piace i gusti", fix: "Mi piacciono i gusti"}
    - tutor: "Mi piace i gusti? I gusti sono più di uno."
      prompt: {text: "Mi piace i gusti", tags: [piacere]}
    - learner: "Mi piacciono i gusti alla frutta!"
    - tutor: "Brava! Ecco limone e fragola."
      goals: [choose-flavours]
    - learner: "Grazie. La fragola è molto buono!"
      errors: [adjective-agreement]
      gold: {text: "è molto buono", fix: "è molto buona"}
    - tutor: "Molto buono? Fragola è una parola femminile."
      prompt: {text: "molto buono", tags: [adjective-agreement]}
      new: [{lemma: femminile, gloss: feminine}]
    - learner: "Sì, è molto buono."
      errors: [adjective-agreement]
      gold: {text: "è molto buono", fix: "è molto buona"}
    - tutor: "Grazie! Sì, la fragola è molto buona. Sono tre euro."
      recast: {text: "è molto buono", fix: "è molto buona", tags: [adjective-agreement]}
    - learner: "Ecco tre euro."
    - tutor: "Grazie a Lei! Arrivederci!"
      goals: [pay]


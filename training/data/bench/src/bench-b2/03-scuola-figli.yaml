# B2 benchmark: parent-teacher meeting (focus: congiuntivo presente, relative pronouns).
- scenario: scuola-figli
  level: B2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera, grazie. Ho letto il rapporto di Tommaso e vorrei capire meglio come va in italiano."
      errors: [false-friend]
      gold: {text: "il rapporto", fix: "la pagella"}
    - tutor: "Certo. Nella pagella di Tommaso l'italiano è la materia più debole, ma sta migliorando: legge molto e con piacere."
      goals: [progress]
      recast: {text: "il rapporto di Tommaso", fix: "la pagella di Tommaso", tags: [false-friend]}
    - learner: "Mi fa piacere. Però a casa ho l'impressione che lui non ha amici in classe: non parla mai dei compagni."
      errors: [subjunctive-use]
      gold: {text: "che lui non ha amici", fix: "che lui non abbia amici"}
    - tutor: "«Ho l'impressione che lui non ha»? Dopo «ho l'impressione che» serve un altro modo."
      prompt: {text: "che lui non ha amici", tags: [subjunctive-use]}
    - learner: "Sì, ho l'impressione che non ha amici, e questo mi preoccupa."
      errors: [subjunctive-use]
      gold: {text: "che non ha amici", fix: "che non abbia amici"}
    - tutor: "La capisco. Però, che non abbia amici non direi proprio: gioca spesso con due compagni."
      goals: [concern]
      recast: {text: "che non ha amici", fix: "che non abbia amici", tags: [subjunctive-use]}
    - learner: "Davvero? Che sollievo. Che cosa mi consiglia per aiutarlo a parlare di più della scuola?"
    - tutor: "Potrebbe invitare un compagno a casa, ogni tanto. E la sera gli faccia domande precise sulla giornata."
      goals: [advice]
    - learner: "Buona idea. Allora inviterò un compagno il sabato, e ogni sera gli chiederò una cosa bella della giornata."
    - tutor: "Perfetto. Ci sentiamo tra un mese per vedere come va."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera, maestra. Lavoro molto e vedo poco Tommaso. Come va a scuola?"
    - tutor: "Tommaso è un bambino sveglio. In matematica va bene; in lettura è un po' indietro."
      goals: [progress]
    - learner: "Ecco, questo è il problema di che volevo parlare. A casa non vuole mai leggere."
      errors: [relative-pronoun]
      gold: {text: "di che", fix: "di cui"}
    - tutor: "«Il problema di che volevo parlare»? Dopo una preposizione, quale pronome usiamo al posto di «che»?"
      prompt: {text: "di che volevo parlare", tags: [relative-pronoun]}
    - learner: "Sì, il problema di che volevo parlare è la lettura. Lui dice che è noiosa."
      errors: [relative-pronoun]
      gold: {text: "di che", fix: "di cui"}
    - tutor: "Capisco: il problema di cui voleva parlare è la lettura. Succede a molti bambini della sua età, sa?"
      goals: [concern]
      recast: {text: "di che volevo parlare", fix: "di cui voleva parlare", tags: [relative-pronoun]}
    - learner: "Ho visto che le sue note di lettura sono basse. Che cosa posso fare? Io arrivo tardi dal lavoro."
      errors: [false-friend]
      gold: {text: "le sue note", fix: "i suoi voti"}
    - tutor: "I suoi voti di lettura sono un po' bassi, è vero, ma possono migliorare. Legga con lui dieci minuti prima di dormire: storie brevi, che scelga lui."
      goals: [advice]
      recast: {text: "le sue note", fix: "I suoi voti", tags: [false-friend]}
    - learner: "Dieci minuti li trovo. E la domenica, quando non lavoro, lo porto in biblioteca."
    - tutor: "Ottima idea. Dieci minuti ogni sera e la biblioteca la domenica: vedrà che funziona."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: en-m-heritage
  history: [subjunctive-form]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera. Sì, volentieri. Come se la cava quest'anno?"
    - tutor: "Bene, nel complesso. È curioso e partecipa. Deve solo imparare ad aspettare il suo turno."
      goals: [progress]
    - learner: "Ah. A casa è uguale. Ho paura che lui dia fastidio ai compagni e che non facci attenzione."
      errors: [subjunctive-form]
      gold: {text: "che non facci", fix: "che non faccia"}
    - tutor: "«Che non facci»? Il congiuntivo ci vuole, ma la forma di fare non è questa."
      prompt: {text: "che non facci", tags: [subjunctive-form]}
    - learner: "Che non faccia attenzione. È così?"
    - tutor: "Esatto. Un po' sì: si distrae e parla con i vicini di banco, ma non lo fa per dare fastidio."
      goals: [concern]
    - learner: "Capisco. Che cosa possiamo fare a casa? Mia moglie pensa che lui deve fare più sport."
      errors: [subjunctive-use]
      gold: {text: "che lui deve fare", fix: "che lui debba fare"}
    - tutor: "«Pensa che lui deve»? Dopo «pensa che», il verbo cambia modo."
      prompt: {text: "che lui deve fare", tags: [subjunctive-use]}
    - learner: "Lei pensa che deve fare sport, per stancarsi."
      errors: [subjunctive-use]
      gold: {text: "pensa che deve fare", fix: "pensa che debba fare"}
    - tutor: "Sua moglie pensa che debba fare più sport, e ha ragione: il movimento aiuta la concentrazione. Anche dieci minuti di lettura insieme, ogni sera, aiutano."
      goals: [advice]
      recast: {text: "pensa che deve fare", fix: "pensa che debba fare", tags: [subjunctive-use]}
    - learner: "D'accordo: sport due volte alla settimana e lettura la sera. Proviamo così."
    - tutor: "Benissimo. Tra un mese mi dice com'è andata."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera. Sono un po' in ansia: è la prima pagella di Tommaso in Italia."
    - tutor: "Non si preoccupi. Si è inserito bene e il suo italiano migliora di settimana in settimana. In scienze è bravissimo."
      goals: [progress]
    - learner: "Meno male. Però c'è una cosa che mi preoccupa: non credo che Tommaso capisce tutto quello che deve fare nei compiti."
      errors: [subjunctive-use]
      gold: {text: "non credo che Tommaso capisce", fix: "non credo che Tommaso capisca"}
    - tutor: "«Non credo che Tommaso capisce»? Lei lo sa bene: dopo «non credo che»... ?"
      prompt: {text: "non credo che Tommaso capisce", tags: [subjunctive-use]}
    - learner: "...che Tommaso capisca, naturalmente. In spagnolo lo direi senza pensarci!"
    - tutor: "Appunto! E ha ragione: a volte le istruzioni dei compiti sono difficili per lui."
      goals: [concern]
    - learner: "Che cosa mi consiglia? Nei testi ci sono molte parole che lui non conosce il significato."
      errors: [relative-pronoun]
      gold: {text: "parole che lui non conosce il significato", fix: "parole di cui lui non conosce il significato"}
    - tutor: "«Parole che lui non conosce il significato»? Qui «che» da solo non basta: quale pronome serve?"
      prompt: {text: "parole che lui non conosce il significato", tags: [relative-pronoun]}
    - learner: "Sì, parole che non conosce il significato, soprattutto in storia."
      errors: [relative-pronoun]
      gold: {text: "parole che non conosce il significato", fix: "parole di cui non conosce il significato"}
    - tutor: "Per le parole di cui non conosce il significato, le consiglio un piccolo quaderno: Tommaso le scrive e poi le cercate insieme."
      goals: [advice]
      recast: {text: "parole che non conosce il significato", fix: "parole di cui non conosce il significato", tags: [relative-pronoun]}
      new: [{lemma: quaderno, gloss: notebook}]
    - learner: "Mi piace. Allora ogni sera guardiamo insieme il quaderno, e poi lui fa i compiti da solo."
    - tutor: "Perfetto, facciamo così. Ci rivediamo a fine mese."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: en-m-retired
  history: [relative-pronoun, article-use]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera. Sì, grazie. Volevo chiederle se Tommaso attende bene le lezioni."
      errors: [false-friend]
      gold: {text: "attende bene le lezioni", fix: "segue bene le lezioni"}
    - tutor: "In generale sì, segue bene le lezioni. Ha buoni voti in storia e in inglese; in matematica fa più fatica."
      goals: [progress]
      recast: {text: "attende bene le lezioni", fix: "segue bene le lezioni", tags: [false-friend]}
    - learner: "Proprio la matematica mi preoccupa. La maestra dell'anno scorso, che ho parlato spesso con, diceva lo stesso."
      errors: [relative-pronoun]
      gold: {text: "che ho parlato spesso con", fix: "con cui ho parlato spesso"}
    - tutor: "«La maestra che ho parlato spesso con»? In italiano la preposizione non può restare alla fine: dove va, e con quale pronome?"
      prompt: {text: "che ho parlato spesso con", tags: [relative-pronoun]}
    - learner: "La maestra con cui ho parlato spesso. Diceva che Tommaso ha paura di sbagliare."
    - tutor: "Esatto, ed è vero: la paura di sbagliare lo blocca."
      goals: [concern]
    - learner: "Come potrei aiutarlo? Io sono ingegnere, ma quando gli spiego io un esercizio finisce sempre in un argomento."
      errors: [false-friend]
      gold: {text: "un argomento", fix: "un litigio"}
    - tutor: "Capisco: se finisce sempre in un litigio, non serve a nessuno. Provi a chiedere a lui di spiegare l'esercizio a lei, e premi l'impegno, non il risultato."
      goals: [advice]
      recast: {text: "in un argomento", fix: "in un litigio", tags: [false-friend]}
      new: [{lemma: litigio, gloss: quarrel}]
    - learner: "Interessante. Quindi lui fa l'insegnante e io lo studente. Lo proveremo questo fine settimana."
    - tutor: "Proprio così. Poi mi faccia sapere se ha funzionato."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: en-m-traveller
  history: [word-order]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera! Grazie. Allora, com'è Tommaso in classe? È un bravo ragazzo, no?"
    - tutor: "È un bambino simpatico e pieno di energia. Impara in fretta, ma si stanca presto di stare seduto."
      goals: [progress]
    - learner: "Eh, lo so. Il mio preoccupazione è il comportamento: è vero che ha litigato con un compagno?"
      errors: [noun-gender]
      gold: {text: "Il mio preoccupazione", fix: "La mia preoccupazione"}
    - tutor: "«Il mio preoccupazione»? Attenzione al genere: pensi ad altre parole come «stazione» o «lezione»."
      prompt: {text: "Il mio preoccupazione", tags: [noun-gender]}
    - learner: "La mia preoccupazione! Giusto. Allora, ha litigato davvero?"
    - tutor: "Sì, una volta, per un gioco. Hanno già fatto pace, non si preoccupi."
      goals: [concern]
    - learner: "Meno male. Ma cosa posso fare perché lui è più tranquillo? A casa salta sempre sul divano."
      errors: [subjunctive-use]
      gold: {text: "perché lui è", fix: "perché lui sia"}
    - tutor: "«Perché lui è»? Qui «perché» indica uno scopo: che modo vuole?"
      prompt: {text: "perché lui è", tags: [subjunctive-use]}
    - learner: "Perché lui è più tranquillo... no? Non mi viene."
      errors: [subjunctive-use]
      gold: {text: "Perché lui è", fix: "Perché lui sia"}
    - tutor: "Perché lui sia più tranquillo serve movimento: gli faccia fare sport prima dei compiti."
      goals: [advice]
      recast: {text: "Perché lui è", fix: "Perché lui sia", tags: [subjunctive-use]}
    - learner: "Sport prima dei compiti, d'accordo. Lo porto al parco ogni giorno alle quattro e poi studiamo insieme mezz'ora."
    - tutor: "Ottimo programma. Sono sicura che in classe vedremo presto la differenza."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-form]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera. Sì, vorrei sapere come sta andando, perché a casa non conta niente della scuola."
      errors: [false-friend]
      gold: {text: "non conta niente", fix: "non racconta niente"}
    - tutor: "Se a casa non racconta niente, glielo dico io: sta andando bene. Ha fatto grandi progressi in lettura e ha ottimi voti in inglese."
      goals: [progress]
      recast: {text: "non conta niente", fix: "non racconta niente", tags: [false-friend]}
    - learner: "Che bello! Mi preoccupa solo che lui tenga pochi amici. È possibile che i compagni lo lascino da parte?"
      errors: [word-choice]
      gold: {text: "tenga pochi amici", fix: "abbia pochi amici"}
    - tutor: "Non si preoccupi: non direi che abbia pochi amici, e nessuno lo lascia da parte. È solo un po' riservato."
      goals: [concern]
      recast: {text: "tenga pochi amici", fix: "abbia pochi amici", tags: [word-choice]}
    - learner: "Sono contenta. E per la scrittura? Vedo che scrive molto piano."
    - tutor: "Sì, è lento, ma preciso. Con un po' di esercizio migliorerà."
    - learner: "Che cosa mi consiglia? Vorrei che scrivesse di più, ma è difficile che lui scrivi senza protestare."
      errors: [subjunctive-form]
      gold: {text: "lui scrivi", fix: "lui scriva"}
    - tutor: "«È difficile che lui scrivi»? Il congiuntivo ci vuole, ma la terza persona finisce in un altro modo."
      prompt: {text: "che lui scrivi", tags: [subjunctive-form]}
    - learner: "Sì, è difficile che lui scrivi. Si arrabbia subito."
      errors: [subjunctive-form]
      gold: {text: "lui scrivi", fix: "lui scriva"}
    - tutor: "Capisco. Perché lui scriva volentieri, gli proponga un diario: tre righe al giorno su una cosa che gli è piaciuta."
      goals: [advice]
      recast: {text: "che lui scrivi", fix: "Perché lui scriva", tags: [subjunctive-form]}
    - learner: "Un diario! Gliene compro uno domani, e lo scriviamo insieme dopo cena."
    - tutor: "Benissimo. Tre righe ogni sera, senza fretta: tra un mese lo leggiamo insieme."
      goals: [plan]

- scenario: scuola-figli
  level: B2
  persona: en-f-student
  history: [conditional-form]
  turns:
    - tutor: "Buonasera, si accomodi. Parliamo un po' di Tommaso?"
    - learner: "Buonasera. Sì, grazie. Sono curiosa di sapere come va, perché questo è il suo primo anno qui."
    - tutor: "Tommaso si è inserito benissimo. È bravo in disegno e in matematica; quando deve parlare in italiano è ancora timido."
      goals: [progress]
    - learner: "Lo immaginavo. A casa parliamo inglese, e mi domando se questo è un problema. Lui è spesso imbarazzato quando deve parlare davanti a tutti?"
    - tutor: "Un po' sì, ma l'inglese a casa non è affatto un problema. Gli serve solo più fiducia."
      goals: [concern]
    - learner: "Che cosa potremmo fare? Se suo padre parlerebbe italiano con lui, sarebbe strano: è inglese anche lui."
      errors: [hypothetical]
      gold: {text: "Se suo padre parlerebbe", fix: "Se suo padre parlasse"}
    - tutor: "«Se suo padre parlerebbe»? Dopo «se», in una frase così, il condizionale non va: che forma serve?"
      prompt: {text: "Se suo padre parlerebbe", tags: [hypothetical]}
    - learner: "Se suo padre parlerebbe... parlerà? Mi confondo sempre."
      errors: [hypothetical]
      gold: {text: "Se suo padre parlerebbe", fix: "Se suo padre parlasse"}
    - tutor: "Nessun problema. Se suo padre parlasse italiano con lui, sarebbe poco naturale, sono d'accordo. Meglio un'attività in italiano fuori casa: sport, teatro, biblioteca."
      goals: [advice]
      recast: {text: "Se suo padre parlerebbe", fix: "Se suo padre parlasse", tags: [hypothetical]}
    - learner: "Il teatro gli piacerebbe! Lo iscrivo al corso del giovedì e lo accompagno io."
    - tutor: "Ottima scelta. A teatro parlerà italiano e si divertirà."
      goals: [plan]

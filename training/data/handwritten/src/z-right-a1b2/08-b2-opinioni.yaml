# Set z-right-a1b2, file 8: B2 opinions and negotiations; correct but unfussy choices left alone.
- scenario: medico-specialista
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Meglio, grazie. Però ogni tanto mi manca il fiato quando faccio le scale."
  - tutor: "Capisco. Quante volte le è successo?"
    goals: [symptoms]
  - learner: "Tre o quattro volte. L'ultima volta mi sono dovuta fermare a metà."
  - tutor: "Ci sono stati problemi di cuore in famiglia?"
  - learner: "Sì, mio padre ha avuto un infarto a sessant'anni."
  - tutor: "Va bene, è importante saperlo."
    goals: [history]
  - learner: "In questi giorni sono anche un po' costipata: ho la tosse e il naso chiuso."
    errors: [false-friend]
  - tutor: "Se è un po' raffreddata, rimandiamo la prova da sforzo di qualche giorno."
    recast: {text: "un po' costipata", fix: "un po' raffreddata", tags: [false-friend]}
    new: [{lemma: "raffreddato", gloss: "having a cold"}]
  - learner: "D'accordo. Ma ho paura che è qualcosa di grave."
    errors: [subjunctive-use]
  - tutor: "Ha paura che è qualcosa di grave? Dopo «avere paura che», quale modo usiamo?"
    prompt: {text: "è qualcosa di grave", tags: [subjunctive-use]}
  - learner: "Sì, ho paura che è qualcosa di grave."
    errors: [subjunctive-use]
  - tutor: "La capisco, ma non credo che sia qualcosa di grave: la pressione e il battito sono quasi normali."
    recast: {text: "è qualcosa di grave", fix: "sia qualcosa di grave", tags: [subjunctive-use]}
    goals: [understand]
  - learner: "Allora cosa devo fare?"
  - tutor: "Un controllo del battito per ventiquattro ore e meno sale a tavola. Poi ci rivediamo."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-student
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Lo immaginiamo semplice, all'aperto, con pochi invitati."
  - tutor: "Che bello. Quanti, più o meno?"
    goals: [vision]
  - learner: "Una sessantina. Il budget è di quindicimila euro al massimo."
  - tutor: "È fattibile, se scegliamo bene."
    goals: [budget]
  - learner: "Per il pranzo ci piacerebbe un agriturismo in campagna. Ce ne consiglia uno?"
  - tutor: "Sì, gliene mostro tre bellissimi, tutti in collina."
    goals: [choices]
  - learner: "Le foto ce lo può mandare per email?"
    errors: [combined-pronouns]
  - tutor: "Le foto... ce lo? Attenzione: le foto sono femminili e plurali."
    prompt: {text: "ce lo", tags: [combined-pronouns]}
  - learner: "Ce le può mandare per email?"
  - tutor: "Certo, gliele mando stasera."
  - learner: "Grazie. Vorremmo anche dei fiori sui tavoli per i ospiti."
    errors: [article-form]
  - tutor: "Per i ospiti? Ascolti l'articolo davanti a «ospiti»."
    prompt: {text: "i ospiti", tags: [article-form]}
  - learner: "Sì, i fiori per i ospiti."
    errors: [article-form]
  - tutor: "Fiori per gli ospiti, ottima idea: fiori di campo, magari."
    recast: {text: "i ospiti", fix: "gli ospiti", tags: [article-form]}
  - learner: "Un'ultima cosa: se piovesse, ci sarebbe un piano B?"
  - tutor: "Sì, tutti e tre hanno una sala interna molto bella."
    goals: [conditions]

- scenario: politica-lavoro
  level: B2
  persona: en-m-traveller
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri. Alcuni lavori spariranno, ma ne nasceranno altri."
  - tutor: "Sì, ma quali? E per chi?"
    goals: [opinion]
  - learner: "Se le aziende investissero nella formazione, molte persone potrebbero cambiare lavoro."
  - tutor: "Bella teoria, ma non sempre funziona."
    goals: [hypothesis]
  - learner: "Mio padre faceva il tipografo. Quando sono arrivati i computer, ha perso il posto."
  - tutor: "Mi dispiace. E non ha trovato altro?"
  - learner: "No. Se avrebbe imparato a usare il computer, forse lavorerebbe ancora."
    errors: [hypothetical]
  - tutor: "Se avrebbe imparato? Rifletti: dopo «se», quale modo serve?"
    prompt: {text: "Se avrebbe imparato", tags: [hypothetical]}
  - learner: "Sì, se avrebbe imparato, avrebbe trovato un altro lavoro."
    errors: [hypothetical]
  - tutor: "Eh, se avesse imparato, forse sì. Ma nessuno gli ha dato la possibilità."
    recast: {text: "se avrebbe imparato", fix: "se avesse imparato", tags: [hypothetical]}
    goals: [example]
  - learner: "Esatto. Quindi il punto è la formazione, non la tecnologia."
  - tutor: "Va bene, su questo hai ragione tu."
    goals: [conclude]

- scenario: recensione-ristorante
  level: B2
  persona: en-f-professional
  history: [comparative]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Sì. Abbiamo aspettato quasi un'ora per i secondi."
  - tutor: "Mi dispiace molto, è davvero troppo."
    goals: [complain]
  - learner: "E quando sono arrivati, la carne era fredda. L'ho fatta notare al cameriere, ma non si è scusato."
  - tutor: "Questo non doveva succedere."
    goals: [detail]
  - learner: "Di solito noi viene qui spesso e il servizio è ottimo, ma stasera era più peggio del solito."
    errors: [comparative, subject-verb-agreement]
  - tutor: "Più peggio? Pensi a che cosa significa già «peggio»."
    prompt: {text: "più peggio", tags: [comparative]}
  - learner: "Sì, stasera era più peggio."
    errors: [comparative]
  - tutor: "Sì, peggio del solito, ha ragione: avevamo due persone in meno in sala."
    recast: {text: "più peggio", fix: "peggio", tags: [comparative]}
  - learner: "Capisco, ma mi sarei aspettata che il cameriere chiamava qualcuno."
    errors: [subjunctive-use]
  - tutor: "Che il cameriere chiamava? Dopo «mi sarei aspettata che»..."
    prompt: {text: "chiamava", tags: [subjunctive-use]}
  - learner: "Che chiamasse qualcuno, ecco."
  - tutor: "Ha perfettamente ragione."
    goals: [expectation]
  - learner: "Non voglio un rimborso, ma mi piacerebbe che la cosa non si ripetesse."
  - tutor: "Glielo assicuro. E la prossima cena la offriamo noi."
    goals: [resolve]

- scenario: riunione-lavoro
  level: B2
  persona: es-f-erasmus
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Siamo in linea con il piano. La prima versione sarà pronta lunedì."
  - tutor: "Ottimo."
    goals: [update]
  - learner: "C'è solo un problema: il fornitore dei server ha ritardato la consegna."
  - tutor: "Di quanto?"
    goals: [problem]
  - learner: "Di due settimane. Propongo che usiamo intanto un servizio esterno."
  - tutor: "Mi sembra una buona idea. Costa molto?"
    goals: [proposal]
  - learner: "Poco. Però per il lancio dobbiamo posporre la data."
    errors: [word-choice]
  - tutor: "Va bene, rimandare la data di una settimana si può fare."
    recast: {text: "posporre la data", fix: "rimandare la data", tags: [word-choice]}
  - learner: "Il cliente vorrà vedere una prova. La prepararemo noi."
    errors: [future-form]
  - tutor: "La prepararemo? Ascolta bene il futuro di «preparare»."
    prompt: {text: "prepararemo", tags: [future-form]}
  - learner: "La prepareremo noi, entro venerdì."
  - tutor: "Perfetto. Allora la nuova scadenza è il venti?"
  - learner: "Sì, il venti."
  - tutor: "D'accordo, lo comunico io al cliente."
    goals: [deadline]

- scenario: smartworking
  level: B2
  persona: en-f-student
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Ormai solo da casa. L'azienda ha chiuso l'ufficio di Milano l'anno scorso."
  - tutor: "Davvero? E come ti trovi?"
    goals: [situation]
  - learner: "Ci sono dei vantaggi: dormo di più e mangio meglio."
  - tutor: "Non male!"
    goals: [pros]
  - learner: "Però lavoro più ore di prima, perché non stacco mai."
  - tutor: "È il rischio classico, purtroppo."
    goals: [cons]
  - learner: "E a casa non riesco sempre a concentrare, c'è il rumore della strada."
    errors: [reflexive]
  - tutor: "Non riesci a concentrare? Chi devi concentrare?"
    prompt: {text: "a concentrare", tags: [reflexive]}
  - learner: "Non riesco a concentrarmi, ecco."
  - tutor: "Ti capisco. Quindi cosa preferiresti?"
  - learner: "È più meglio un sistema ibrido, secondo me."
    errors: [comparative]
  - tutor: "Più meglio? «Meglio» ha già un significato forte..."
    prompt: {text: "più meglio", tags: [comparative]}
  - learner: "È meglio un sistema ibrido. Almeno vedrei i colleghi ogni tanto."
  - tutor: "Sono d'accordo con te."
    goals: [preference]

- scenario: trattativa-affitto
  level: B2
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto. È luminoso e la zona è comoda per il lavoro."
  - tutor: "Sono contento."
    goals: [interest]
  - learner: "Il canone però è un po' alto. Accettereste settecento euro invece di ottocento?"
  - tutor: "Settecento è poco. Settecentocinquanta?"
  - learner: "Se firmo un contratto di quattro anni, potreste scendere a settecentotrenta?"
  - tutor: "Con quattro anni, credo di sì. Devo sentire il proprietario."
    goals: [negotiate]
  - learner: "Va bene. Vorrei anche che la caldaia viene controllata prima dell'ingresso."
    errors: [subjunctive-use]
  - tutor: "Che la caldaia viene controllata? Con «vorrei che», quale modo serve?"
    prompt: {text: "viene controllata", tags: [subjunctive-use]}
  - learner: "Sì, che viene controllata prima."
    errors: [subjunctive-use]
  - tutor: "Certo, faremo in modo che venga controllata prima del suo ingresso."
    recast: {text: "viene controllata", fix: "venga controllata", tags: [subjunctive-use]}
    goals: [conditions]
  - learner: "Perfetto. Se il proprietario è d'accordo, firmiamo la settimana prossima."
  - tutor: "Ottimo, la chiamo domani con la risposta."
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Sono venuta per un anno di Erasmus e non sono più ripartita."
  - tutor: "Una storia comune! Cosa l'ha fatta restare?"
  - learner: "Il mio sposo, prima di tutto. L'ho conosciuto all'università."
    errors: [false-friend]
  - tutor: "Ah, suo marito è italiano, allora! Una bella storia."
    recast: {text: "sposo", fix: "marito", tags: [false-friend]}
    goals: [story]
  - learner: "Sì. E poi la gente: tutti mi parlavano come se mi conoscessero da sempre."
  - tutor: "E le difficoltà?"
  - learner: "La burocrazia, senza dubbio. Per il permesso di soggiorno ho fatto la fila per sei ore."
  - tutor: "Sei ore! Che pazienza."
    goals: [difficulties]
  - learner: "Sono cambiata molto: prima ero sempre di corsa, adesso mi godo di più la vita."
  - tutor: "Che bella trasformazione."
    goals: [change]
  - learner: "A chi vuole venire consiglio di imparare la lingua prima che arriva."
    errors: [subjunctive-use]
  - tutor: "Prima che arriva? Dopo «prima che», quale modo usiamo?"
    prompt: {text: "prima che arriva", tags: [subjunctive-use]}
  - learner: "Sì, prima che arriva in Italia."
    errors: [subjunctive-use]
  - tutor: "Imparare la lingua prima che arrivi in Italia: un consiglio prezioso, grazie mille."
    recast: {text: "prima che arriva", fix: "prima che arrivi", tags: [subjunctive-use]}
    goals: [advice]

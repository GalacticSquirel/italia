# Set z-right-a1b2, file 7: B2; correct subjunctives, passives and pronouns left alone.
- scenario: affittare-appartamento
  level: B2
  persona: es-m-worker
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "È più grande di quanto pensassi. Quanto chiede di affitto?"
  - tutor: "Ottocentocinquanta euro al mese, spese di condominio comprese."
    goals: [rent]
  - learner: "Il contratto sarebbe di quattro anni più quattro?"
  - tutor: "Sì, il classico quattro più quattro, con due mesi di caparra."
    goals: [contract]
  - learner: "Se dovessi trasferirmi per lavoro prima della scadenza, quanto preavviso dovrei dare?"
  - tutor: "Sei mesi, con una lettera raccomandata. È la regola."
  - learner: "Capito. E i mobili? Li ha comprato di recente?"
    errors: [participle-agreement]
  - tutor: "Li ha comprato? Pensi a che cosa si riferisce «li»."
    prompt: {text: "Li ha comprato", tags: [participle-agreement]}
  - learner: "Sì, scusi: li ha comprato l'anno scorso?"
    errors: [participle-agreement]
  - tutor: "Sì, li ha comprati mia moglie l'anno scorso: la cucina e il divano sono nuovi."
    recast: {text: "li ha comprato", fix: "li ha comprati", tags: [participle-agreement]}
    goals: [condition]
  - learner: "Molto bene. E il quartiere com'è? C'è molti negozi qui vicino?"
    errors: [ce-ci-sono]
  - tutor: "C'è molti negozi? Ascolti bene il verbo."
    prompt: {text: "C'è molti negozi", tags: [ce-ci-sono]}
  - learner: "Ci sono molti negozi qui vicino?"
  - tutor: "Sì, e anche un mercato il sabato. La sera, poi, è una zona molto tranquilla."
    goals: [neighbourhood]
  - learner: "È proprio quello che cercavo. Ci penso un giorno e le faccio sapere."
  - tutor: "Benissimo, aspetto sue notizie entro domani."
    goals: [decide]

- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi colpisce la luce. Sembra che arrivi da una finestra che non si vede."
  - tutor: "Bella osservazione, è proprio così."
    goals: [react]
  - learner: "E il pittore usa colori molto eccitanti, soprattutto il rosso."
    errors: [false-friend]
  - tutor: "Sì, colori molto intensi, quasi violenti. Guarda lo sfondo, invece."
    recast: {text: "molto eccitanti", fix: "molto intensi", tags: [false-friend]}
    new: [{lemma: "intenso", gloss: "intense"}]
  - learner: "Lo sfondo è sfumato, quasi nebbioso. In primo piano ci sono due donne che si parlano sottovoce."
  - tutor: "Esatto, e non ci guardano."
    goals: [describe]
  - learner: "Credo che il pittore vuole mostrare un segreto tra loro."
    errors: [subjunctive-use]
  - tutor: "Credo che il pittore vuole? Dopo «credo che», quale modo usiamo?"
    prompt: {text: "vuole mostrare", tags: [subjunctive-use]}
  - learner: "Sì, credo che vuole mostrare un segreto."
    errors: [subjunctive-use]
  - tutor: "Può darsi che voglia mostrare proprio un segreto, sì: guarda come si toccano le mani."
    recast: {text: "vuole mostrare", fix: "voglia mostrare", tags: [subjunctive-use]}
    goals: [interpret]
  - learner: "Rispetto all'altro quadro, questo mi sembra più intimo."
  - tutor: "D'accordo, l'altro è più freddo, quasi ufficiale."
    goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-retired
  history: [passive]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Ieri mattina, mentre ero fermo al semaforo, sono stato tamponato da un furgone."
  - tutor: "Mi dispiace. Lei si è fatto male?"
  - learner: "No, per fortuna. Ma la paraurti è tutta rotta."
    errors: [noun-gender]
  - tutor: "La paraurti? Attenzione al genere di questa parola."
    prompt: {text: "la paraurti", tags: [noun-gender]}
  - learner: "Sì, la paraurti è tutta rotta, e anche una luce."
    errors: [noun-gender]
  - tutor: "Capisco: il paraurti rotto e una luce. Un danno abbastanza serio."
    recast: {text: "la paraurti", fix: "il paraurti", tags: [noun-gender]}
    goals: [what]
  - learner: "Il conducente ha ammesso che guardava il telefono. Ha detto che era colpa sua."
  - tutor: "Bene, quindi la responsabilità è chiara."
    goals: [responsibility]
  - learner: "Abbiamo compilato la constatazione amichevole. Ho fatto anche delle foto e le ho mandato ieri sera."
    errors: [participle-agreement]
  - tutor: "Le ho mandato? Attenzione all'accordo con «le»."
    prompt: {text: "le ho mandato", tags: [participle-agreement]}
  - learner: "Le ho mandate ieri sera, per email."
  - tutor: "Perfetto, le abbiamo già ricevute."
    goals: [documents]
  - learner: "E la perizia quando verrà fatto?"
    errors: [passive]
  - tutor: "Quando verrà fatto? Pensi alla perizia: è femminile."
    prompt: {text: "verrà fatto", tags: [passive]}
  - learner: "Sì, la perizia quando verrà fatto?"
    errors: [passive]
  - tutor: "La perizia verrà fatta entro tre giorni: la chiamerà direttamente il nostro tecnico."
    recast: {text: "verrà fatto", fix: "verrà fatta", tags: [passive]}
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-teacher
  history: [subjunctive-form]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Vorrei chiedere la residenza: mi sono trasferita qui il mese scorso."
  - tutor: "Benissimo. Ha già compilato il modulo?"
    goals: [request]
  - learner: "Sì, eccolo. Ho portato anche il contratto d'affitto e il passaporto."
  - tutor: "Perfetto. Le serve anche il codice fiscale."
    goals: [documents]
    new: [{lemma: "fiscale", gloss: "tax (adj.)"}]
  - learner: "Ah, il codice fiscale non lo trovo. Credo che lo ho lasciato a casa."
    errors: [subjunctive-form]
  - tutor: "Credo che lo ho lasciato? Dopo «credo che», il verbo cambia."
    prompt: {text: "lo ho lasciato", tags: [subjunctive-form]}
  - learner: "Sì, credo che l'ho lasciato a casa, sul tavolo."
    errors: [subjunctive-form]
  - tutor: "Può darsi che l'abbia lasciato a casa, succede spesso. Non si preoccupi."
    recast: {text: "l'ho lasciato", fix: "l'abbia lasciato", tags: [subjunctive-form]}
    goals: [problem]
  - learner: "Posso mandarlo per email più tardi?"
  - tutor: "Sì, all'indirizzo che trova sul modulo."
  - learner: "E poi quanto tempo ci vuole, di solito?"
  - tutor: "Entro quarantacinque giorni passano i vigili per il controllo. Poi riceverà la conferma."
    goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Grazie. Sono laureata in economia e da tre anni lavoro nel marketing digitale."
  - tutor: "Molto bene. Di cosa si occupa, esattamente?"
    goals: [intro]
  - learner: "Gestisco le campagne sui social per un'azienda di moda. L'anno scorso le vendite online sono aumentate del trenta per cento."
  - tutor: "Un ottimo risultato. E prima?"
  - learner: "Prima ho fatto uno stage in un'agenzia, dove dovevo contestare i clienti."
    errors: [false-friend]
  - tutor: "Ah, rispondere ai clienti è un'ottima scuola. Lo faceva per telefono?"
    recast: {text: "contestare i clienti", fix: "rispondere ai clienti", tags: [false-friend]}
  - learner: "Per email, soprattutto. Ogni giorno ho scritto più di cento risposte."
    errors: [tense-aspect]
  - tutor: "Ogni giorno ho scritto? Parla di un'abitudine: quale tempo ci vuole?"
    prompt: {text: "ho scritto", tags: [tense-aspect]}
  - learner: "Ogni giorno scrivevo più di cento risposte."
  - tutor: "Esatto. Un bel ritmo!"
    goals: [experience]
  - learner: "Il mio punto di forza è che so analizzare i dati senza perdere la creatività."
  - tutor: "Interessante. E perché proprio noi?"
    goals: [strengths]
  - learner: "Perché lavorate nel settore sostenibile, e vorrei che il mio lavoro avesse un senso."
  - tutor: "La capisco. Ha domande da farmi?"
    goals: [why]
  - learner: "Sì: sarebbe possibile lavorare da casa un giorno a settimana?"
  - tutor: "Sì, è previsto dal contratto per tutti."
    goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Quest'anno il mio team ha chiuso tre progetti in anticipo."
  - tutor: "Lo so, avete lavorato benissimo."
    goals: [results]
  - learner: "Lo sai anche tu che non è stato facile."
    errors: [register]
  - tutor: "Lo sai anche tu? Ricordi con chi sta parlando, qui in ufficio."
    prompt: {text: "Lo sai anche tu", tags: [register]}
  - learner: "Mi scusi: lo sa anche lei che non è stato facile."
  - tutor: "Certo che lo so. Mi dica pure."
  - learner: "Proprio per questo vorrei che si valutasse una mia promozione a responsabile."
  - tutor: "Capisco. Non è una decisione semplice, però."
    goals: [request]
  - learner: "Me ne rendo conto. Credo che ne valga la pena."
  - tutor: "Il problema è il budget di quest'anno."
  - learner: "Potrei accettare un aumento più piccolo adesso, a patto che il titolo cambia subito."
    errors: [subjunctive-use]
  - tutor: "A patto che il titolo cambia? Dopo «a patto che», quale modo serve?"
    prompt: {text: "cambia", tags: [subjunctive-use]}
  - learner: "Sì, a patto che il titolo cambia subito."
    errors: [subjunctive-use]
  - tutor: "A patto che il titolo cambi subito... Mi sembra una proposta ragionevole."
    recast: {text: "cambia", fix: "cambi", tags: [subjunctive-use]}
    goals: [handle]
  - learner: "Quando potremmo riparlarne?"
  - tutor: "Ne parlo con la direzione e ci rivediamo entro fine mese."
    goals: [next-steps]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la sua preoccupazione, ma non sono d'accordo."
  - tutor: "E perché, scusi?"
    goals: [position]
  - learner: "In molte città europee che hanno chiuso il centro, i negozi hanno più clienti di prima."
  - tutor: "Sì, ma lì i parcheggi fuori città funzionano. Qui no."
    goals: [argue]
  - learner: "È un problema il cui la soluzione esiste già: le navette gratuite."
    errors: [relative-pronoun]
  - tutor: "Il cui la soluzione? Ci pensi un attimo: dopo «cui» serve qualcosa?"
    prompt: {text: "il cui la soluzione", tags: [relative-pronoun]}
  - learner: "Sì, un problema il cui la soluzione esiste."
    errors: [relative-pronoun]
  - tutor: "Un problema la cui soluzione esiste, dice lei. Ma chi le paga, le navette?"
    recast: {text: "il cui la soluzione", fix: "la cui soluzione", tags: [relative-pronoun]}
    new: [{lemma: "navetta", gloss: "shuttle bus"}]
    goals: [counter]
  - learner: "Il comune, all'inizio. Ammetto che i costi siano alti, ma alla larga i commercianti ci guadagneranno."
    errors: [word-choice]
  - tutor: "Forse a lungo andare ci guadagneranno, sì. Su questo posso darle ragione."
    recast: {text: "alla larga", fix: "a lungo andare", tags: [word-choice]}
    goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Ho letto un romanzo che racconta la storia di una famiglia di Torino."
  - tutor: "Interessante! Di che epoca?"
  - learner: "Dagli anni Venti al dopoguerra. Mentre i figli crescevano, il fascismo cambiava tutto."
  - tutor: "Un bel periodo da raccontare."
    goals: [summary]
  - learner: "Il padre è il personaggio che ho amato di più: urlava sempre, ma era molto tenero."
  - tutor: "Un tipo da romanzo, insomma!"
    goals: [characters]
  - learner: "E poi è un libro molto umoroso, mi ha fatto ridere tanto."
    errors: [word-choice]
  - tutor: "Ah, un libro molto divertente: non me l'aspettavo, con quella storia!"
    recast: {text: "molto umoroso", fix: "molto divertente", tags: [word-choice]}
  - learner: "Da piccola ho letto sempre libri di famiglie come questo."
    errors: [tense-aspect]
  - tutor: "Ho letto sempre? Parli di un'abitudine di quando eri piccola..."
    prompt: {text: "ho letto sempre", tags: [tense-aspect]}
  - learner: "Leggevo sempre libri così!"
  - tutor: "Allora questo era perfetto per te."
    goals: [opinion]
  - learner: "Lo consiglierei a chiunque ami le storie vere."
  - tutor: "Me lo segno, grazie!"
    goals: [recommend]

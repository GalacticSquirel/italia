# Set z-right-a1b2, file 2: A1, people and daily life; correct short answers left alone.
- scenario: famiglia
  level: A1
  persona: es-m-worker
  history: [possessive]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono i miei figli, Pablo e Ana."
  - tutor: "Che belli! Quanti anni hanno?"
    goals: [who]
  - learner: "Pablo ha otto anni e Ana cinque."
  - tutor: "Sono piccoli! Com'è Pablo?"
    goals: [ages]
  - learner: "È molto alto e sportivo. Gioca a calcio."
  - tutor: "Bravo! E Ana?"
  - learner: "Ana è molto simpatico."
    errors: [adjective-agreement]
  - tutor: "Molto simpatico? Ana è una bambina!"
    prompt: {text: "molto simpatico", tags: [adjective-agreement]}
  - learner: "Sì, è simpatico e allegra."
    errors: [adjective-agreement]
  - tutor: "Ah, è simpatica e allegra! Come il papà?"
    recast: {text: "simpatico e allegra", fix: "simpatica e allegra", tags: [adjective-agreement]}
    new: [{lemma: "simpatico", gloss: "nice"}]
    goals: [describe]
  - learner: "Sì! E tu hai figli?"
  - tutor: "No, ma ho un fratello piccolo."
    goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  history: [reflexive]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi alzo alle sette. Poi faccio la doccia."
  - tutor: "Presto! Fai colazione a casa?"
    goals: [wake]
  - learner: "No, al bar vicino all'università."
  - tutor: "E a che ora hai lezione?"
  - learner: "Alle nove. Studio fino all'una."
  - tutor: "E il pomeriggio?"
    goals: [work]
  - learner: "Lavoro in un negozio di vestiti. Finisco a le sette."
    errors: [articulated-preposition]
  - tutor: "Finisci a le sette? Ascolta bene l'ora."
    prompt: {text: "a le sette", tags: [articulated-preposition]}
  - learner: "A le sette, sì."
    errors: [articulated-preposition]
  - tutor: "Alle sette? È tardi! E la sera?"
    recast: {text: "A le sette", fix: "Alle sette", tags: [articulated-preposition]}
  - learner: "La sera mi riposo. Guardo una serie e vado a letto."
  - tutor: "Che bella sera!"
    goals: [evening]
  - learner: "E tu, a che ora ti svegli?"
  - tutor: "Alle otto. Io dormo tanto!"
    goals: [ask]

- scenario: hotel-checkin
  level: A1
  persona: en-m-retired
  history: [essere-avere]
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Sì, a nome Smith. Due notti."
  - tutor: "Sì, eccola. Ha un documento?"
    goals: [booking]
  - learner: "Sì, ecco il passaporto."
  - tutor: "Grazie, perfetto."
    goals: [document]
  - learner: "La colazione è compresa?"
  - tutor: "Sì, è dalle sette alle dieci."
    goals: [breakfast]
  - learner: "Bene. Noi siamo molto stanco."
    errors: [adjective-agreement]
  - tutor: "Molto stanco? Siete in due!"
    prompt: {text: "molto stanco", tags: [adjective-agreement]}
  - learner: "Sì, siamo molto stanco."
    errors: [adjective-agreement]
  - tutor: "Siete molto stanchi, certo, dopo il viaggio! Ecco la chiave."
    recast: {text: "molto stanco", fix: "molto stanchi", tags: [adjective-agreement]}
    new: [{lemma: "stanco", gloss: "tired"}]
    goals: [key]
  - learner: "Grazie. Che piano?"
  - tutor: "Secondo piano, camera ventuno."
  - learner: "Grazie, buonanotte."
  - tutor: "Buonanotte, a domani!"

- scenario: numero-telefono
  level: A1
  persona: es-f-teacher
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, bellissima. La professoressa è brava."
  - tutor: "Sì, molto! Anche tu parli bene."
  - learner: "Grazie! Vuoi studiare insieme, qualche volta?"
  - tutor: "Sì, certo! Mi dai il tuo numero?"
    goals: [propose]
  - learner: "Certo. Tu hai un penna?"
    errors: [noun-gender]
  - tutor: "Un penna? «Penna» è femminile."
    prompt: {text: "un penna", tags: [noun-gender]}
  - learner: "Sì, un penna. Ce l'hai?"
    errors: [noun-gender]
  - tutor: "Sì, ecco una penna. Dimmi pure."
    recast: {text: "un penna", fix: "una penna", tags: [noun-gender]}
  - learner: "Tre quattro sette, due uno nove, otto cinque zero sei."
  - tutor: "Fatto! Ti mando un messaggio."
    goals: [number]
  - learner: "Quando ci vediamo? Domani, forse?"
  - tutor: "Domani non posso. Giovedì?"
  - learner: "Sì, giovedì va bene. In biblioteca alle quattro?"
  - tutor: "Perfetto, a giovedì!"
    goals: [when]

- scenario: ristorante-ordinare
  level: A1
  persona: en-f-professional
  history: [article-use]
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Siamo in tre. C'è un tavolo fuori?"
  - tutor: "Sì, questo qui. Prego!"
    goals: [ask-table]
  - learner: "Grazie. Io vorrei gli spaghetti al pomodoro."
  - tutor: "Ottimo. E per gli altri?"
  - learner: "Per mio marito il pesce, e per mia figlia una pizza."
  - tutor: "Benissimo. Da bere?"
    goals: [order-food]
  - learner: "Una bottiglia di acqua e due bicchiere di vino rosso."
    errors: [noun-number]
  - tutor: "Due bicchiere? Ascolti la fine della parola."
    prompt: {text: "due bicchiere", tags: [noun-number]}
  - learner: "Sì, due bicchiere."
    errors: [noun-number]
  - tutor: "Allora, due bicchieri di rosso e l'acqua."
    recast: {text: "due bicchiere", fix: "due bicchieri", tags: [noun-number]}
    new: [{lemma: "bicchiere", gloss: "glass"}]
    goals: [order-drink]
  - learner: "Tutto buonissimo! Il conto, per favore."
  - tutor: "Subito. Sono quarantotto euro."
    goals: [ask-bill]

- scenario: tempo-libero
  level: A1
  persona: en-m-heritage
  history: [piacere]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Mi piacciono le passeggiate. Il sabato cammino in campagna."
  - tutor: "Che bello! Da solo?"
    goals: [hobby]
  - learner: "Con il mio cane."
  - tutor: "E ci vai ogni sabato?"
  - learner: "Sì, quasi sempre. Ci vado anche la domenica, se fa bello."
  - tutor: "Bravo! E la sera?"
    goals: [frequency]
  - learner: "La sera cucino. Mi piace la cucina di mia nonna."
  - tutor: "Buona! Cucini bene, allora."
  - learner: "E tu, cosa ti piace fare? Ti piace i film?"
    errors: [piacere]
  - tutor: "Ti piace i film? Attenzione: qui «film» è plurale."
    prompt: {text: "Ti piace i film", tags: [piacere]}
  - learner: "Ti piacciono i film?"
  - tutor: "Sì, molto! Vado al cinema ogni settimana."
    goals: [ask]
  - learner: "Allora domenica andiamo al cinema insieme?"
  - tutor: "Sì, che bella idea!"
    goals: [propose]

- scenario: abbigliamento
  level: A1
  persona: es-f-erasmus
  history: [demonstrative]
  turns:
  - tutor: "Buongiorno! Posso aiutarla?"
  - learner: "Sì, grazie. Cerco una maglietta."
  - tutor: "Le magliette sono qui. Che taglia porta?"
    goals: [ask-item]
  - learner: "La quarantadue."
  - tutor: "E che colore preferisce?"
  - learner: "Blu o nera."
  - tutor: "Ecco, questa è blu."
    goals: [size-colour]
  - learner: "Quella nera mi piace di più. Posso provarla?"
  - tutor: "Certo, il camerino è lì."
    goals: [try]
  - learner: "Mi sta un po' larga. Ha una taglia più piccolo?"
    errors: [adjective-agreement]
  - tutor: "Una taglia più piccolo? «Taglia» è femminile."
    prompt: {text: "più piccolo", tags: [adjective-agreement]}
  - learner: "Sì, una taglia più piccolo."
    errors: [adjective-agreement]
  - tutor: "Ecco una taglia più piccola, la quaranta. Come va?"
    recast: {text: "più piccolo", fix: "più piccola", tags: [adjective-agreement]}
  - learner: "Perfetta! La prendo."
  - tutor: "Ottimo, può pagare qui."
    goals: [decide]

- scenario: chiedere-strada
  level: A1
  persona: en-f-student
  history: [ce-ci-sono]
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Sì, scusi. C'è una farmacia qui vicino?"
  - tutor: "Sì, c'è. È in via Roma."
    goals: [get-attention, ask-place]
  - learner: "Posso andare in piedi?"
    errors: [preposition]
  - tutor: "In piedi? Scusi, non ho capito."
    prompt: {text: "in piedi", tags: [preposition]}
  - learner: "Sì, in piedi."
    errors: [preposition]
  - tutor: "Sì, a piedi sono cinque minuti."
    recast: {text: "in piedi", fix: "a piedi", tags: [preposition]}
  - learner: "Bene. Vado dritto?"
  - tutor: "Sì, dritto e poi la seconda a destra."
    goals: [understand]
  - learner: "La seconda a destra. Grazie mille!"
  - tutor: "Prego, di niente!"
    goals: [thank]

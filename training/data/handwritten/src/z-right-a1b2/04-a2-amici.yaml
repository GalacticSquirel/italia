# Set z-right-a1b2, file 4: A2 friends and memories; present for future, passato prossimo, ne/ci.
- scenario: compleanno
  level: A2
  persona: es-m-worker
  history: [future-form]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo una festa a sorpresa sabato sera?"
  - tutor: "Ottima idea! Sabato è il diciotto, giusto?"
    goals: [date]
  - learner: "Sì. La facciamo a casa mia, ho una terrazza grande."
  - tutor: "Perfetto. Chi invitiamo?"
  - learner: "Gli amici dell'università. Sono una ventina."
  - tutor: "Bene, li chiamo io domani."
    goals: [guests]
  - learner: "E per mangiare io cucinarò la paella!"
    errors: [future-form]
  - tutor: "Cucinarò? Attenzione al futuro di «cucinare»."
    prompt: {text: "cucinarò", tags: [future-form]}
  - learner: "Cucinerò la paella!"
  - tutor: "Che buona! Allora io porto la torta."
    goals: [food]
  - learner: "E il regalo? Le compriamo un libro?"
  - tutor: "Sì, le piacciono i gialli. Lo compro io."
    goals: [gift]

- scenario: cucina-ricetta
  level: A2
  persona: en-f-professional
  history: [object-pronoun]
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "La pasta al pomodoro. È facile e veloce."
  - tutor: "Perfetto! Cosa ci serve?"
  - learner: "Pomodori, aglio, basilico e olio. Il basilico l'ho comprato stamattina."
  - tutor: "Brava! Il resto c'è già."
    goals: [ingredients]
  - learner: "Prima tagliamo l'aglio e lo mettiamo nella pentola con l'olio."
  - tutor: "Sì, a fuoco basso. E poi?"
  - learner: "Poi prendiamo i pomodori e lo tagliamo a pezzi."
    errors: [object-pronoun]
  - tutor: "Lo tagliamo? I pomodori sono tanti!"
    prompt: {text: "lo tagliamo", tags: [object-pronoun]}
  - learner: "Sì, lo tagliamo a pezzi piccoli."
    errors: [object-pronoun]
  - tutor: "Sì, li tagliamo a pezzi piccoli e li aggiungiamo. Quanto cuociono?"
    recast: {text: "lo tagliamo", fix: "li tagliamo", tags: [object-pronoun]}
    goals: [steps]
  - learner: "Venti minuti, più o meno."
  - tutor: "Bene. E la pasta, quando la buttiamo?"
    goals: [time]
  - learner: "Quando l'acqua bolle. Poi la serviamo con il parmigiano."
  - tutor: "Che fame! Io preparo la tavola."
    goals: [serve]

- scenario: prenotare-tavolo
  level: A2
  persona: en-m-traveller
  history: [modal-infinitive]
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera. Vorrei prenotare un tavolo per domani sera."
  - tutor: "Certo. Per quante persone?"
    goals: [book]
  - learner: "Per quattro, alle otto."
  - tutor: "Va bene. Dentro o fuori?"
  - learner: "Fuori, se possibile."
  - tutor: "Sì, nessun problema."
    goals: [details]
  - learner: "Uno di noi è vegetariano. Ci sono piatti senza carne?"
  - tutor: "Sì, ne abbiamo tanti. Pasta con le verdure, per esempio."
    goals: [special]
  - learner: "Ottimo. Possiamo portare una torta? È il compleanno di mio amico."
    errors: [articulated-preposition]
  - tutor: "Di mio amico? Ascolti: davanti a «mio amico» manca qualcosa."
    prompt: {text: "di mio amico", tags: [articulated-preposition]}
  - learner: "Il compleanno del mio amico."
  - tutor: "Esatto. Sì, certo, la porti pure. A che nome prenoto?"
  - learner: "Smith."
  - tutor: "Perfetto, signor Smith. A domani!"
    goals: [name]

- scenario: ricordi-infanzia
  level: A2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
  - learner: "In un paese vicino a Siviglia. Era molto piccolo."
  - tutor: "Che bello! E cosa facevi di solito?"
    goals: [place]
  - learner: "Giocavo a calcio in piazza con i miei cugini."
  - tutor: "Tutti i giorni?"
    goals: [habits]
  - learner: "Sì, dopo la scuola. La scuola era vicino a casa."
  - tutor: "E ti piaceva la scuola?"
  - learner: "Sì, molto. La maestra era brava. Io era un bambino tranquillo."
    errors: [imperfetto-form]
  - tutor: "Io era? Ascolta bene il verbo."
    prompt: {text: "Io era", tags: [imperfetto-form]}
  - learner: "Io ero un bambino tranquillo!"
  - tutor: "Davvero? Io no, ero terribile!"
    goals: [school]
  - learner: "Una volta, a otto anni, sono caduto da un albero."
  - tutor: "Oh no! Ti sei fatto male?"
  - learner: "Mi sono rotto un braccio. Ma ero contento: niente scuola per un mese!"
  - tutor: "Ma dai! Bella storia."
    goals: [event]

- scenario: serata-cinema
  level: A2
  persona: en-f-student
  history: [piacere]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  - learner: "Sì! Andiamo al cinema?"
  - tutor: "Sì, bella idea! Cosa ti va di vedere?"
    goals: [propose]
  - learner: "Mi piacciono i film d'azione. A te?"
  - tutor: "Non tanto. Preferisco le commedie."
    goals: [genre]
  - learner: "Va bene, una commedia allora. Al cinema in centro ce n'è una nuova."
  - tutor: "Perfetto, la vediamo! A che ora?"
    goals: [choose]
  - learner: "Il film comincia a nove e mezza."
    errors: [articulated-preposition]
  - tutor: "A nove e mezza? Scusa, come?"
    prompt: {text: "a nove e mezza", tags: [articulated-preposition]}
  - learner: "Sì, a nove e mezza."
    errors: [articulated-preposition]
  - tutor: "Ah, alle nove e mezza! Ci vediamo alle nove davanti al cinema?"
    recast: {text: "a nove e mezza", fix: "alle nove e mezza", tags: [articulated-preposition]}
  - learner: "Sì, perfetto. Prendo io i biglietti."
  - tutor: "Grazie! A stasera."
    goals: [meet]

- scenario: ufficio-postale
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
  - tutor: "Buongiorno, mi dica."
  - learner: "Buongiorno. Devo spedire questo pacco in Germania."
  - tutor: "Va bene. Normale o veloce?"
    goals: [send]
  - learner: "Quanto ci mette quello normale?"
  - tutor: "Una settimana. Quello veloce, tre giorni."
  - learner: "Allora veloce. È un regalo per mia madre."
  - tutor: "Bene. Compili questo modulo, per favore."
    goals: [speed]
  - learner: "Dove firmo? Qui o in quello parte?"
    errors: [demonstrative]
  - tutor: "In quello parte? «Parte» è femminile."
    prompt: {text: "quello parte", tags: [demonstrative]}
  - learner: "Sì, in quello parte?"
    errors: [demonstrative]
  - tutor: "No, non in quella parte: qui in basso. Sono quindici euro."
    recast: {text: "quello parte", fix: "quella parte", tags: [demonstrative]}
    goals: [form]
  - learner: "Posso pagare con il bancomat?"
  - tutor: "Sì, certo. Ecco la ricevuta."
    goals: [pay]

- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "In Sicilia, con mia moglie. Siamo stati a Palermo una settimana."
  - tutor: "Che bello! Che tempo ha fatto?"
    goals: [where]
  - learner: "Caldo, molto caldo. Sempre sole."
  - tutor: "Che fortuna! E cosa avete fatto?"
    goals: [weather]
  - learner: "Abbiamo visitato i musei e siamo andato al mare."
    errors: [participle-agreement]
  - tutor: "Siamo andato? Ma siete in due!"
    prompt: {text: "siamo andato", tags: [participle-agreement]}
  - learner: "Siamo andati al mare quasi ogni giorno."
  - tutor: "Al mare ogni giorno, che bello!"
    goals: [activities]
  - learner: "E abbiamo mangiato i cannoli. Ne ho mangiati tantissimi!"
  - tutor: "Ti capisco! Qual è stato il momento più bello?"
  - learner: "Una sera sulla spiaggia. Il cielo era tutto rosso."
  - tutor: "Che bel ricordo!"
    goals: [best]

- scenario: weekend-scorso
  level: A2
  persona: es-f-erasmus
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Benissimo! Sabato sono andata a Verona con due amiche."
  - tutor: "Che bello! Cosa avete fatto?"
    goals: [where]
  - learner: "Abbiamo visto l'Arena e abbiamo mangiato i tortellini."
  - tutor: "Buoni! E chi sono le tue amiche?"
    goals: [what]
  - learner: "Due ragazze del mio corso, una tedesca e una francese."
  - tutor: "Che bel gruppo!"
    goals: [with-who]
  - learner: "Il viaggio in treno è stato molto largo."
    errors: [false-friend]
  - tutor: "Eh sì, molto lungo! Ma Verona ti è piaciuta?"
    recast: {text: "molto largo", fix: "molto lungo", tags: [false-friend]}
  - learner: "Sì, tantissimo. È la città più romantica d'Italia!"
  - tutor: "Sono d'accordo, è bellissima."
    goals: [opinion]

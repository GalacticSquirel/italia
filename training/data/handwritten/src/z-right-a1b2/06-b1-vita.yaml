# Set z-right-a1b2, file 6: B1 work and everyday life; correct but simple choices left alone.
- scenario: restituire-prodotto
  level: B1
  persona: en-f-student
  history: [object-pronoun]
  turns:
  - tutor: "Buongiorno, mi dica pure."
  - learner: "Buongiorno. Ho comprato queste cuffie la settimana scorsa e non funzionano."
  - tutor: "Mi dispiace. Che problema hanno?"
  - learner: "Si accendono, ma dopo due minuti si spengono."
  - tutor: "Capisco. Ha ancora lo scontrino?"
    goals: [problem]
  - learner: "Sì, l'ho conservato, eccolo."
  - tutor: "Grazie, perfetto."
    goals: [proof]
  - learner: "Vorrei restituirle e avere indietro i soldi."
  - tutor: "Possiamo sostituirle con un paio nuovo, oppure darle un buono."
  - learner: "Non voglio un buono, preferisco i soldi. Mi li può dare?"
    errors: [combined-pronouns]
  - tutor: "Mi li? Attenzione: con due pronomi insieme, il primo cambia."
    prompt: {text: "Mi li", tags: [combined-pronouns]}
  - learner: "Me li può dare?"
  - tutor: "Esatto. Sì, certo, le faccio il rimborso sulla carta."
    goals: [request]
  - learner: "Va bene, grazie. Devo firmare qualcosa?"
  - tutor: "Sì, solo qui in basso. Ecco fatto."
    goals: [agree]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Abbiamo finito la prima parte la settimana scorsa."
  - tutor: "Ottimo! E adesso?"
    goals: [update]
  - learner: "Adesso c'è un problema: il cliente vuole cambiare il design."
  - tutor: "Di nuovo? Cosa vuole cambiare?"
    goals: [problem]
  - learner: "I colori e il logo. Ne abbiamo già parlato con lui due volte."
  - tutor: "Che pazienza. E tu cosa proponi?"
  - learner: "Propongo un incontro. Lo chiamerò domani e lo spiegherò tutto."
    errors: [object-pronoun]
  - tutor: "Lo spiegherò tutto? Pensa: spieghi qualcosa a chi?"
    prompt: {text: "lo spiegherò", tags: [object-pronoun]}
  - learner: "Gli spiegherò tutto, così capisce i tempi."
  - tutor: "Perfetto, mi sembra giusto."
    goals: [proposal]
  - learner: "Se tutto va bene, finiamo entro fine mese."
  - tutor: "Bene: allora la scadenza resta il trenta."
    goals: [deadline]

- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [comparative]
  turns:
  - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
  - learner: "Lavoro tanto, mangio male e dormo poco."
  - tutor: "Insomma, tre problemi! Fai sport?"
    goals: [habits]
  - learner: "Poco. Prima giocavo a calcio, adesso non ho tempo."
  - tutor: "Capisco. E qual è il tuo obiettivo?"
  - learner: "Voglio perdere cinque chili e sentirmi meno stanco."
  - tutor: "Ottimo obiettivo, si può fare."
    goals: [goal]
  - learner: "Il problema è il lavoro: finisce tardi. Sono più stanco che gli altri."
    errors: [comparative]
  - tutor: "Più stanco che gli altri? Ascolta bene la tua frase."
    prompt: {text: "più stanco che gli altri", tags: [comparative]}
  - learner: "Sì, più stanco che gli altri, davvero."
    errors: [comparative]
  - tutor: "Sì, più stanco degli altri: lavori troppe ore. Ma possiamo organizzarci."
    recast: {text: "più stanco che gli altri", fix: "più stanco degli altri", tags: [comparative]}
    goals: [obstacles]
  - learner: "Allora cosa mi consigli?"
  - tutor: "Tre allenamenti brevi a settimana, la mattina presto. Cominciamo lunedì?"
  - learner: "Va bene, lunedì alle sette."
  - tutor: "Perfetto, ti scrivo il programma."
    goals: [plan]

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [stare-gerund]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tutti e due: tre giorni a casa e due in ufficio."
  - tutor: "Ah, un po' e un po'. Ti trovi bene?"
    goals: [situation]
  - learner: "Sì. A casa risparmio un'ora di treno e sono più concentrato."
  - tutor: "Certo, il tempo è prezioso."
    goals: [pros]
  - learner: "Però a volte mi sento solo. Mi mancano i colleghi."
  - tutor: "Ti capisco, succede a tanti."
    goals: [cons]
  - learner: "Adesso sto scrivendo un progetto con due colleghi, e da casa è più difficile."
  - tutor: "Eh sì, insieme si lavora meglio."
  - learner: "Se potrei scegliere, lavorerei a casa solo due giorni."
    errors: [hypothetical]
  - tutor: "Se potrei? Dopo «se», quale forma ci vuole?"
    prompt: {text: "Se potrei", tags: [hypothetical]}
  - learner: "Se potessi scegliere, lavorerei a casa solo due giorni."
  - tutor: "Bravo! Magari ne parli con il tuo capo."
    goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [imperfetto-form]
  turns:
  - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
  - learner: "Anche da noi! La cena più importante è la sera del ventiquattro."
  - tutor: "Come qui! E cosa si mangia?"
    goals: [compare]
  - learner: "Il pesce, soprattutto. E dopo cena si cantano canzoni."
  - tutor: "Che bello! E quando eri piccola?"
  - learner: "Andavamo dalla nonna. Eravamo in venti a tavola!"
  - tutor: "In venti! Che festa."
    goals: [past]
  - learner: "E voi? Si fa i regali il venticinque?"
    errors: [subject-verb-agreement]
  - tutor: "Si fa i regali? Attenzione: «regali» è plurale."
    prompt: {text: "Si fa i regali", tags: [subject-verb-agreement]}
  - learner: "Sì, si fa i regali il venticinque?"
    errors: [subject-verb-agreement]
  - tutor: "Sì, si fanno i regali il venticinque, la mattina, sotto l'albero."
    recast: {text: "si fa i regali", fix: "si fanno i regali", tags: [subject-verb-agreement]}
    goals: [ask]
  - learner: "Quest'anno resto in Italia. Festeggiamo insieme?"
  - tutor: "Certo, vieni a casa nostra!"
    goals: [plan]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [conditional-form]
  turns:
  - tutor: "Sì? Buonasera, posso aiutarla?"
  - learner: "Buonasera. Sono il vicino del piano di sotto."
  - tutor: "Ah, piacere. Mi dica."
    goals: [greet]
  - learner: "Mi scusi, ma la sera sento molto rumore. Ieri la musica è andata avanti fino all'una."
  - tutor: "Oh, mi dispiace. Era la festa di mio figlio."
    goals: [problem]
  - learner: "Capisco. Potrebbe dire a suo figlio di abbassare il volume dopo le undici?"
  - tutor: "Ha ragione, glielo dico stasera."
    goals: [request]
  - learner: "Grazie. E nel fine settimana potete fare più tardo, non è un problema."
    errors: [word-choice]
  - tutor: "Lei è molto gentile. Allora nel fine settimana possiamo fare più tardi, ma non dopo le dodici."
    recast: {text: "più tardo", fix: "più tardi", tags: [word-choice]}
  - learner: "Sì, mi sembra giusto."
  - tutor: "Perfetto, allora siamo d'accordo. Buona serata!"
    goals: [compromise]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [relative-pronoun]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  - learner: "Sì, molto. Vorrei aiutare le persone che sono sole."
  - tutor: "Bellissimo. Perché proprio questo?"
  - learner: "Mia nonna vive sola in Spagna e so cosa significa."
  - tutor: "Capisco. E cosa sai fare?"
    goals: [motivation]
  - learner: "Ho studiato da infermiera e so cucinare bene."
  - tutor: "Utilissimo!"
    goals: [skills]
  - learner: "Posso venire due pomeriggi a la settimana."
    errors: [articulated-preposition]
  - tutor: "Due pomeriggi a la settimana? Scusa, non ho capito."
    prompt: {text: "a la settimana", tags: [articulated-preposition]}
  - learner: "Due pomeriggi a la settimana, il martedì e il venerdì."
    errors: [articulated-preposition]
  - tutor: "Ah, due pomeriggi alla settimana! Il martedì e il venerdì vanno benissimo."
    recast: {text: "a la settimana", fix: "alla settimana", tags: [articulated-preposition]}
    goals: [time]
  - learner: "C'è un'attività dove cucinate per gli anziani?"
  - tutor: "Sì, il pranzo del venerdì. È quella che fa per te!"
  - learner: "Allora scelgo quella!"
  - tutor: "Perfetto, ti aspettiamo venerdì."
    goals: [choose]

- scenario: prenotare-tavolo
  level: B1
  persona: en-m-traveller
  history: [ce-ci-sono]
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera. Avreste un tavolo per sabato sera? Siamo in sei."
  - tutor: "Sabato... sì, alle otto e mezza."
    goals: [book]
  - learner: "Perfetto. Si può stare fuori, in terrazza?"
  - tutor: "Sì, se non piove."
    goals: [details]
  - learner: "Una mia amica è celiaca. Avete la pasta senza glutine?"
  - tutor: "Sì, ce l'abbiamo sempre."
    goals: [special]
  - learner: "Ottimo. Vengono anche due bambini. C'è dei seggiolini?"
    errors: [ce-ci-sono]
  - tutor: "C'è dei seggiolini? Sono più di uno..."
    prompt: {text: "C'è dei seggiolini", tags: [ce-ci-sono]}
  - learner: "Sì, c'è dei seggiolini?"
    errors: [ce-ci-sono]
  - tutor: "Sì, ci sono dei seggiolini: ne abbiamo due. Li preparo io."
    recast: {text: "c'è dei seggiolini", fix: "ci sono dei seggiolini", tags: [ce-ci-sono]}
  - learner: "Grazie. A nome Brown, allora."
  - tutor: "Perfetto, signor Brown. Ci vediamo sabato!"
    goals: [name]

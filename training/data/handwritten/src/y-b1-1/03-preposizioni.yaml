# B1, round 3: simple and articulated prepositions (da tre anni, interessato a, alle 8:45).
- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Tom, sono canadese ma lavoro in Italia per tre anni."
      errors: [preposition]
      gold: {text: "per tre anni", fix: "da tre anni"}
    - tutor: "«Per tre anni»? Ma lei lavora ancora qui, giusto? Per un'azione che continua, quale preposizione serve?"
      prompt: {text: "per tre anni", tags: [preposition]}
    - learner: "Lavoro in Italia di tre anni."
      errors: [preposition]
    - tutor: "Ah, da tre anni, quindi conosce già bene il paese. Che esperienza ha?"
      recast: {text: "di tre anni", fix: "da tre anni", tags: [preposition]}
      goals: [intro]
    - learner: "Prima lavoravo per una compagnia di Torino. Facevo siti web per negozi e ristoranti."
      errors: [word-choice]
      gold: {text: "una compagnia", fix: "un'azienda"}
    - tutor: "Bene, un'azienda di Torino. E qual è il suo punto forte?"
      recast: {text: "una compagnia", fix: "un'azienda", tags: [word-choice]}
      goals: [experience]
    - learner: "Sono bravo a risolvere problemi e sono interessato in tutto quello che è nuovo."
      errors: [preposition]
      gold: {text: "interessato in", fix: "interessato a"}
    - tutor: "Interessato «in»? Ci pensi: dopo «interessato» la preposizione è un'altra."
      prompt: {text: "interessato in", tags: [preposition]}
    - learner: "Sono interessato a tutto quello che è nuovo."
    - tutor: "Perfetto. E un punto debole? Poi mi dica perché vuole lavorare da noi."
    - learner: "A volte perdo troppo tempo sui dettagli. Vorrei lavorare da voi perché i vostri progetti sono molto creativi."
    - tutor: "Grazie, è una risposta sincera. Ha qualche domanda per me?"
      goals: [strengths, why]
    - learner: "Sì: quando saprò la vostra risposta?"
    - tutor: "Entro dieci giorni, la chiamo io. Grazie per essere venuto!"
      goals: [questions]

- scenario: medico-base
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno. Ho un dolore forte a la testa e un po' di febbre."
      errors: [articulated-preposition]
      gold: {text: "a la testa", fix: "alla testa"}
    - tutor: "Un dolore forte... dove, scusi? Ripeta unendo bene le parole."
      prompt: {text: "a la testa", tags: [articulated-preposition]}
    - learner: "Alla testa, dottore."
    - tutor: "Capisco. E da quando ha la febbre?"
      goals: [symptoms]
    - learner: "Da domenica. Sabato sono uscita con le amiche e ho preso freddo."
    - tutor: "Ah, ecco. È allergica a qualche medicina?"
      goals: [since-when]
    - learner: "No, non sono allergica de niente."
      errors: [preposition]
      gold: {text: "allergica de niente", fix: "allergica a niente"}
    - tutor: "Allergica «de» niente? Questa preposizione è spagnola. In italiano?"
      prompt: {text: "allergica de niente", tags: [preposition]}
    - learner: "Non sono allergica di niente."
      errors: [preposition]
    - tutor: "Bene, se non è allergica a niente, le do uno sciroppo. Lo prenda tre volte al giorno, dopo aver mangiato, per una settimana. Mi ripete?"
      recast: {text: "di niente", fix: "a niente", tags: [preposition]}
      goals: [history]
      new: [{lemma: sciroppo, gloss: syrup}]
    - learner: "Tre volte al giorno dopo aver mangiato, per una settimana. Posso andare a lezione domani?"
    - tutor: "Meglio di no: resti a casa due giorni e riposi. Poi può tornare all'università."
      goals: [instructions]

- scenario: biglietto-treno
  level: B1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno! Vorrei un ticket per Venezia per sabato mattina, verso le otto."
      errors: [word-choice]
      gold: {text: "un ticket", fix: "un biglietto"}
    - tutor: "Un biglietto per Venezia, certo. C'è un treno alle 8:12 e uno alle 8:45. Quale preferisce?"
      recast: {text: "un ticket", fix: "un biglietto", tags: [word-choice]}
      goals: [destination]
    - learner: "Prendo quello a le 8:45, perché la mattina dormo tanto."
      errors: [articulated-preposition]
      gold: {text: "a le 8:45", fix: "alle 8:45"}
    - tutor: "Quello «a le»...? Ci pensi: qui serve una parola sola."
      prompt: {text: "a le 8:45", tags: [articulated-preposition]}
    - learner: "Quello alle 8:45."
    - tutor: "Perfetto. Solo andata o anche ritorno?"
    - learner: "Andata e ritorno. Torno domenica, ma non so ancora l'orario. Posso cambiarlo dopo?"
    - tutor: "Sì, con questa tariffa può cambiarlo gratis fino a un'ora prima della partenza."
      goals: [type]
      new: [{lemma: tariffa, gloss: fare}]
    - learner: "Bene. Vorrei un posto in la carrozza silenziosa, se c'è."
      errors: [articulated-preposition]
      gold: {text: "in la carrozza", fix: "nella carrozza"}
    - tutor: "«In la carrozza»? Anche qui le due parole si uniscono, ma cambiano un po'."
      prompt: {text: "in la carrozza", tags: [articulated-preposition]}
    - learner: "Nel carrozza silenziosa?"
      errors: [articulated-preposition]
    - tutor: "Sì, nella carrozza silenziosa c'è ancora un posto, il 14A."
      recast: {text: "Nel carrozza", fix: "nella carrozza", tags: [articulated-preposition]}
      goals: [class]
      new: [{lemma: carrozza, gloss: train carriage}]
    - learner: "Grazie! Da quale binario parte il treno?"
    - tutor: "Di solito dal binario 3, ma controlli sempre gli orari in stazione. Buon viaggio!"
      goals: [platform]

- scenario: compleanno
  level: B1
  persona: en-m-traveller
  history: [preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a sorpresa a Marco? Lui ha un giardino grande."
      errors: [preposition]
      gold: {text: "a Marco", fix: "da Marco"}
    - tutor: "«A Marco»? Così sembra una festa per lui! Per dire «a casa sua», che preposizione usiamo?"
      prompt: {text: "a Marco", tags: [preposition]}
    - learner: "Da Marco! Sabato sera, va bene?"
    - tutor: "Giusto, sabato sera da lui è perfetto. Chi invitiamo?"
      goals: [date]
    - learner: "Invitiamo i suoi colleghi, sua sorella e i vecchi compagni di scuola."
    - tutor: "Ottimo, saremo almeno venti. E da mangiare?"
      goals: [guests]
    - learner: "Possiamo ordinare le pizze e una torta di la pasticceria vicino a casa sua."
      errors: [articulated-preposition]
      gold: {text: "di la pasticceria", fix: "della pasticceria"}
    - tutor: "Una torta «di la» pasticceria? Prova a unire le due parole."
      prompt: {text: "di la pasticceria", tags: [articulated-preposition]}
    - learner: "Una torta della pasticceria!"
    - tutor: "Esatto, lì fanno dolci buonissimi. E per il regalo?"
      goals: [food]
    - learner: "Sara ama viaggiare. Le regaliamo un trip in Toscana?"
      errors: [word-choice]
      gold: {text: "un trip", fix: "un viaggio"}
    - tutor: "Un viaggio in Toscana, che bella idea! Le piacerà tantissimo."
      recast: {text: "un trip", fix: "un viaggio", tags: [word-choice]}
      goals: [gift]
    - learner: "Allora domani cerchiamo insieme un albergo carino?"
    - tutor: "Sì, domani pomeriggio ci sentiamo e lo scegliamo insieme."


- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Lavoro in cucina, sto in piedi tutto il giorno e mangio a tutte le ore."
    - tutor: "Capisco, con il tuo lavoro non è facile. E fai sport?"
      goals: [habits]
    - learner: "No, niente. Ma voglio cominciare a correre e perdere cinque chili prima de l'estate."
      errors: [articulated-preposition]
      gold: {text: "prima de l'estate", fix: "prima dell'estate"}
    - tutor: "Prima «de l'estate»? Questa forma è spagnola. In italiano?"
      prompt: {text: "prima de l'estate", tags: [articulated-preposition]}
    - learner: "Prima dell'estate!"
    - tutor: "Perfetto, è un buon obiettivo. E che cosa ti ferma, di solito?"
      goals: [goal]
    - learner: "Quando finisco a lavorare sono stanchissimo, ed è già mezzanotte."
      errors: [preposition]
      gold: {text: "finisco a lavorare", fix: "finisco di lavorare"}
    - tutor: "«Finisco a lavorare»? Con «finire» la preposizione è un'altra. Quale?"
      prompt: {text: "finisco a lavorare", tags: [preposition]}
    - learner: "Finisco per lavorare?"
      errors: [preposition]
    - tutor: "Ah, quando finisci di lavorare è molto tardi, certo. Allora ti alleni la mattina?"
      recast: {text: "Finisco per lavorare", fix: "finisci di lavorare", tags: [preposition]}
      goals: [obstacles]
    - learner: "Sì, la mattina sono libero. Posso correre il lunedì, il mercoledì e il venerdì."
    - tutor: "Perfetto: trenta minuti di corsa tre volte alla settimana, e la domenica un giro in bicicletta. Ci stai?"
    - learner: "Ci sto! Comincerò lunedì prossimo."
    - tutor: "Bravo! Allora lunedì alle otto ci vediamo al parco."
      goals: [plan]

- scenario: banca-conto
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Sono spagnola, vivo in Torino da un mese e vorrei aprire un conto."
      errors: [preposition]
      gold: {text: "in Torino", fix: "a Torino"}
    - tutor: "Benvenuta! Vive... dove? Ripeta la frase, e attenzione alla piccola parola prima della città."
      prompt: {text: "in Torino", tags: [preposition]}
    - learner: "Vivo a Torino da un mese."
    - tutor: "Esatto. Che tipo di conto le serve?"
      goals: [purpose]
    - learner: "Un conto semplice, per ricevere lo stipendio. Lavoro in una scuola de lingue."
      errors: [preposition]
      gold: {text: "scuola de lingue", fix: "scuola di lingue"}
    - tutor: "Una scuola «de» lingue? Qui la preposizione è ancora spagnola."
      prompt: {text: "scuola de lingue", tags: [preposition]}
    - learner: "Una scuola da lingue."
      errors: [preposition]
    - tutor: "Una scuola di lingue, che bello! Allora le consiglio il nostro conto base."
      recast: {text: "scuola da lingue", fix: "scuola di lingue", tags: [preposition]}
    - learner: "Va bene. Quali documenti devo portare?"
    - tutor: "Il passaporto, il codice fiscale e il contratto di lavoro."
      goals: [documents]
    - learner: "Li ho tutti qui. Quanto costa mensualmente? E la carta è gratis?"
      errors: [word-choice]
      gold: {text: "mensualmente", fix: "al mese"}
    - tutor: "Il conto costa due euro al mese. La carta di debito è gratis, e c'è anche l'app per i bonifici."
      recast: {text: "mensualmente", fix: "al mese", tags: [word-choice]}
      goals: [costs, card]
    - learner: "Perfetto, allora lo apro oggi stesso."
    - tutor: "Benissimo, cominciamo subito. Mi dà il passaporto?"


- scenario: prenotare-tavolo
  level: B1
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per domenica a pranzo."
    - tutor: "Certo. Per quante persone, e a che ora?"
      goals: [book]
    - learner: "Per quattro persone, a l'una."
      errors: [articulated-preposition]
      gold: {text: "a l'una", fix: "all'una"}
    - tutor: "«A l'una»? Quando l'articolo è «l'», si unisce alla preposizione. Come diventa?"
      prompt: {text: "a l'una", tags: [articulated-preposition]}
    - learner: "Al'una?"
      errors: [articulated-preposition]
    - tutor: "Sì, all'una per quattro persone va benissimo. Ha qualche richiesta?"
      recast: {text: "Al'una", fix: "all'una", tags: [articulated-preposition]}
      goals: [details]
    - learner: "Sì: se fa bello, preferiamo mangiare a fuori, in giardino."
      errors: [preposition]
      gold: {text: "mangiare a fuori", fix: "mangiare fuori"}
    - tutor: "Mangiare «a fuori»? Ci pensi: c'è una parola di troppo."
      prompt: {text: "mangiare a fuori", tags: [preposition]}
    - learner: "Preferiamo mangiare fuori, in giardino."
    - tutor: "Esatto. Le tengo un tavolo all'ombra, sotto l'albero. A che nome prenoto?"
      goals: [special]
    - learner: "A nome Brown. Grazie mille, arrivederci."
    - tutor: "Grazie a lei. Allora domenica all'una, quattro persone in giardino. Arrivederci!"
      goals: [name]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì sera, dopo il lavoro. Vado con la mia collega Giulia."
    - tutor: "Che bello! E dove dormite?"
    - learner: "Dormiamo a un piccolo albergo vicino a la stazione."
      errors: [preposition, articulated-preposition]
      gold: {text: "a un piccolo albergo", fix: "in un piccolo albergo"}
    - tutor: "Dormite «a» un albergo? Per un albergo usiamo un'altra preposizione."
      prompt: {text: "a un piccolo albergo", tags: [preposition]}
    - learner: "Dormiamo in un piccolo albergo vicino alla stazione."
    - tutor: "Perfetto, comodo per i treni. Che cosa vuoi sapere?"
      goals: [plans]
    - learner: "Cosa ci consigli di visitare? Amo l'arte antica."
    - tutor: "Allora visita il museo nazionale: è pieno di arte antica. E mangia una pizza in centro!"
      goals: [advice]
    - learner: "Sì! E come andiamo in Pompei? In treno?"
      errors: [preposition]
      gold: {text: "in Pompei", fix: "a Pompei"}
    - tutor: "«In Pompei»? Pompei è una città: che preposizione usiamo?"
      prompt: {text: "in Pompei", tags: [preposition]}
    - learner: "Come andiamo da Pompei?"
      errors: [preposition]
    - tutor: "Per andare a Pompei c'è un treno dalla stazione centrale, ci vuole mezz'ora."
      recast: {text: "da Pompei", fix: "a Pompei", tags: [preposition]}
      goals: [transport]
    - learner: "Perfetto. C'è qualcosa che dobbiamo evitare?"
    - tutor: "Evitate i taxi senza tassametro e tenete la borsa sempre chiusa sull'autobus."
      goals: [warnings]
      new: [{lemma: tassametro, gloss: taxi meter}]

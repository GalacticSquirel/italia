# B1 real-learner set (round 6): friends back from holidays, and tips before a trip to Naples.
- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100455-1
    - learner: "Sono di ritorno dalla Francia, dove sono stata per un mese."
    - tutor: "Un mese in Francia, che fortuna! E che tempo faceva?"
      goals: [where]
    # merlin-1325_1001015-4
    - learner: "In augosto faceva molto caldo, ma l'aria condizionata non ha funzionato nella nostra camera."
      errors: [tense-aspect, spelling]
    - tutor: "Che caldo! Ma «non ha funzionato»: è successo una volta sola o per tutto il mese?"
      prompt: {text: "non ha funzionato", tags: [tense-aspect]}
    - learner: "Per tutto il mese: l'aria condizionata non funzionava mai!"
    - tutor: "Esatto. Povera te, con quel caldo! E che cosa hai fatto di bello?"
      goals: [weather]
    # merlin-1365_0100455-3
    - learner: "La scuola si trovava a Parigi e ho visitato molti musei e tutti i monumenti interessanti della città come \"La tour Eiffel\", \"sacré coeur\" e \"Notre Dame\"."
    - tutor: "Una scuola di francese a Parigi, che bello! E qual è il ricordo più bello di quel mese?"
      goals: [activities]
    # merlin-1365_0100211-9
    - learner: "Non mi ricordo se ti l'ho gia detto ma sono innamorata!"
      errors: [combined-pronouns, spelling]
    - tutor: "Davvero?! Aspetta, «ti l'ho detto»? Prova a unire meglio i due pronomi."
      prompt: {text: "ti l'ho", tags: [combined-pronouns]}
    - learner: "Ti l'ho detto? Si chiama Julien, è un compagno del corso."
      errors: [combined-pronouns]
    - tutor: "«Te l'ho già detto?» No, non me l'avevi detto! Allora il ricordo più bello ha un nome: Julien!"
      recast: {text: "Ti l'ho", fix: "Te l'ho", tags: [combined-pronouns]}
      goals: [best]
    # merlin-1365_0100270-5
    - learner: "Che cosa pensi?"
    - tutor: "Penso che sia una bellissima notizia! Voglio vedere subito una foto."

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100073-1
    - learner: "Ho passato una settimana a Berlino."
    - tutor: "A Berlino, con tutta la famiglia? E come state?"
      goals: [where]
    # merlin-1395_0000449-0
    - learner: "Stiamo abbastanza bene."
    - tutor: "Meno male! E il tempo? Lì l'estate a volte è fresca."
    - learner: "No, faceva caldo, ma non troppo."
    - tutor: "Perfetto per camminare in città. Cosa hai visto?"
      goals: [weather]
    # merlin-1365_0100073-2
    - learner: "Ho visitato qualche museo e castello."
    - tutor: "I castelli intorno a Berlino sono bellissimi. E la sera uscivi?"
    - learner: "Sì, una sera ho andato a un concerto in un vecchio teatro."
      errors: [auxiliary-choice]
    - tutor: "Un concerto, che bello! Ma «ho andato»? Pensa bene al verbo «andare» al passato."
      prompt: {text: "ho andato", tags: [auxiliary-choice]}
    - learner: "Sono andato a un concerto. Era musica jazz."
    - tutor: "Perfetto. E cosa ti è piaciuto di più del viaggio?"
      goals: [activities]
    # merlin-1325_9000214-1
    - learner: "In particolare la possibilità di fare molto sport mi è piaciuta tanto."
    - tutor: "In bicicletta dappertutto, immagino! Berlino è perfetta per questo."
      goals: [best]
    # merlin-1395_0000513-7
    - learner: "Senti, è possibile d'incontrarti in gennaio?"
      errors: [preposition]
    - tutor: "Con piacere! Ma «è possibile d'incontrarti»: dopo «è possibile», quella preposizione serve?"
      prompt: {text: "possibile d'incontrarti", tags: [preposition]}
    - learner: "È possibile d'incontrarti, sì?"
      errors: [preposition]
    - tutor: "Certo che è possibile incontrarti, anzi, mi fa molto piacere! Ci vediamo dopo le feste, allora."
      recast: {text: "possibile d'incontrarti", fix: "possibile incontrarti", tags: [preposition]}
    # merlin-1365_0100276-16
    - learner: "Spero di rivederti presto."
    - tutor: "Anch'io! Buone feste, allora."

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [ce-ci-sono]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Al lago, in un residence. Ma è stata una vacanza terribile."
    - tutor: "Oh no, cosa è successo?"
      goals: [where]
    # merlin-1325_1001015-2
    - learner: "Ma quando siamo arrivati al residence, noi abbiamo visto una casa vecchia."
    - tutor: "Che peccato! E le foto sul sito?"
    # merlin-1325_1001015-10
    - learner: "Io non sono contenta, perché erano molte differenze tra la realtá e l'annuncio pubblicitario."
      errors: [ce-ci-sono, spelling]
    - tutor: "Ti capisco. Ma «erano molte differenze»? Manca una piccola parola all'inizio."
      prompt: {text: "erano molte differenze", tags: [ce-ci-sono]}
    - learner: "Erano molte differenze, sì, tante."
      errors: [ce-ci-sono]
    - tutor: "Eh sì, c'erano molte differenze, purtroppo. Almeno il tempo è stato bello?"
      recast: {text: "Erano molte differenze", fix: "c'erano molte differenze", tags: [ce-ci-sono]}
    # merlin-1325_9000602-2
    - learner: "Il residence era vecchio, l'aria condizionata non funzionava, la piscina era sempre affollata, il lago era lontanissimo e i collegamenti erano scarsi."
    - tutor: "Che disastro, e con il caldo senza aria condizionata! Avete fatto almeno qualcosa di bello?"
      goals: [weather]
    # merlin-1325_1001119-4
    - learner: "Ma i campi da tennis e da palla a volo erano sempre occupati."
    - tutor: "Quindi niente sport, peccato! Proprio niente di positivo?"
      goals: [activities]
    # merlin-1325_9000316-23
    - learner: "Sono sicura di non tornarci più."
    - tutor: "Ti capisco! Ma dimmi almeno una cosa bella di quella settimana."
    - learner: "Il gelato in paese era buonissimo, e il tramonto sul lago."
    - tutor: "Almeno quello! L'anno prossimo vieni con noi in montagna, te lo prometto."
      goals: [best]
    # merlin-1395_0000557-8
    - learner: "Spero che entro due mesi possiamo incontrarci."
    - tutor: "Facciamo prima: ti chiamo questo fine settimana!"

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000551-2
    - learner: "Michele ed io abbiamo fatto un viaggio in Italia."
    - tutor: "Che bello! E dove siete stati di preciso?"
    # merlin-1395_0001073-3
    - learner: "A Venezia e in Toscana. È bellissimo, Venezia mi piace molto."
    - tutor: "Venezia è unica! Ma ad agosto c'è tanta gente, e faceva caldo?"
      goals: [where]
    # merlin-1325_9000316-10
    - learner: "Sì, molto. Tutti i giorni devo andare a piedi, se voglio prendere il sole."
    - tutor: "A piedi si vede tutto meglio, però! Cosa avete fatto in Toscana?"
      goals: [weather]
    # merlin-1325_1001009-7
    - learner: "I campi di tennis erano in riparazione."
      errors: [preposition]
    - tutor: "Peccato! Ma «campi di tennis»: per un campo fatto per giocare, quale preposizione usiamo?"
      prompt: {text: "campi di tennis", tags: [preposition]}
    - learner: "I campi per tennis?"
      errors: [preposition]
    - tutor: "Ah, i campi da tennis erano chiusi, che peccato! Allora avete camminato molto?"
      recast: {text: "campi per tennis", fix: "campi da tennis", tags: [preposition]}
    # merlin-1395_0000376-4
    - learner: "Al mercato ho comprato due camicie blu e una borsa elegante."
    - tutor: "Hai fatto anche spese, bravo! E cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Le serate in piazza a Siena, con la musica e il vino."
    - tutor: "Che bello! Ti vedo proprio rilassato, le vacanze ti hanno fatto bene."
      goals: [best]
    # merlin-1395_0000376-1
    - learner: "Io sto bene. E tu?"
    - tutor: "Anch'io, grazie! Dai, raccontami ancora davanti a un caffè."

- scenario: consigli-viaggio
  level: B1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1365_0100073-7
    - learner: "Andrò a Napoli per tre mesi."
    - tutor: "Tre mesi, che bello! Ci sei già stato?"
    - learner: "No, non sono mai stato, è la prima volta."
      errors: [ci-ne]
    - tutor: "Allora sarà tutto nuovo! Ma «non sono mai stato»: a Napoli... manca una piccola parola, quale?"
      prompt: {text: "non sono mai stato", tags: [ci-ne]}
    - learner: "Non ci sono mai stato!"
    - tutor: "Perfetto! Vedrai, ti innamorerai della città."
      goals: [plans]
    # merlin-1395_0001119-8
    - learner: "Ma che cosa facciamo la sera?"
    - tutor: "La sera vai sul lungomare e mangia una pizza. E il sabato andiamo a Procida, in treno e poi in barca!"
      goals: [advice]
      new: [{lemma: lungomare, gloss: seafront}]
    # merlin-1395_0000376-5
    - learner: "Non amo viaggiare con il treno."
    - tutor: "Allora prendi il traghetto direttamente dal porto: è più comodo e anche più bello! Solo una cosa: sull'autobus fai attenzione alla borsa."
      goals: [transport, warnings]
      new: [{lemma: traghetto, gloss: ferry}]
    # merlin-1395_0001115-3
    - learner: "Grazie! Mi piacerebbe rivederti presto."
    - tutor: "Ci vediamo appena arrivi, allora!"

- scenario: consigli-viaggio
  level: B1
  persona: es-f-erasmus
  history: [adjective-agreement]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0001158-2
    - learner: "Arriverò in treno alle 8 di sera"
    - tutor: "Benissimo! Il venerdì, giusto? Quanto tempo resti?"
    # merlin-1395_0001073-2
    - learner: "Sono qui per 2 settimane."
    - tutor: "Due settimane sono perfette per Napoli. Cosa vuoi vedere?"
      goals: [plans]
    # merlin-1395_0001158-7
    - learner: "Spero che passeremo assieme belli giorni."
      errors: [adjective-agreement, word-order]
    - tutor: "Certo che sì! Ma «belli giorni»: davanti a «giorni», che forma prende «bello»?"
      prompt: {text: "belli giorni", tags: [adjective-agreement]}
    - learner: "Bei giorni! Passeremo bei giorni assieme."
    - tutor: "Esatto! Allora comincia dal centro e a colazione prova una sfogliatella."
      new: [{lemma: sfogliatella, gloss: Neapolitan pastry}]
      goals: [advice]
    # merlin-1325_1001083-1
    - learner: "Mi interessa la cucina italiana e mi piace mangiare."
    - tutor: "Allora sei nella città giusta! Ti porto io a mangiare la pizza più buona del quartiere."
    # merlin-1395_0001016-4
    - learner: "Puoi chiamarmi a questo numero: 0345 - 11111111."
    - tutor: "Salvato! Ti chiamo quando arrivi. Dalla stazione prendi la metro, linea uno: in dieci minuti sei in centro. E attenta alla borsa nei bar!"
      goals: [transport, warnings]
    # merlin-1365_0100212-12
    - learner: "Va bene. Spero di sentirti presto!"
    - tutor: "Ti chiamo domani sera, promesso!"

- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0000626-9
    - learner: "In aprile andiamo nelle vacanze."
      errors: [articulated-preposition]
    - tutor: "Ad aprile, che bello! Ma «andiamo nelle vacanze»: come diciamo, in modo più semplice?"
      prompt: {text: "andiamo nelle vacanze", tags: [articulated-preposition]}
    - learner: "Andiamo in vacanza! Con mia sorella."
    - tutor: "Perfetto. E questa volta Napoli! Quanti giorni restate?"
    # merlin-1395_0001164-7
    - learner: "Sei giorni, dal dieci al sedici: tre in città e tre al mare. Che ne dici?"
    - tutor: "Dico che è il programma perfetto! Visitate il Museo Archeologico, poi andate a Sorrento in treno: in macchina è un incubo!"
      goals: [plans, advice, transport]
    - learner: "E di sera, ci sono zone pericolosi?"
      errors: [adjective-agreement]
    - tutor: "Bella domanda! Ma «zone pericolosi»: guarda bene la parola «zone», è maschile o femminile?"
      prompt: {text: "zone pericolosi", tags: [adjective-agreement]}
    - learner: "Zone pericolosi, sì. Ci sono?"
      errors: [adjective-agreement]
    - tutor: "Zone pericolose? Non tante: evita solo le strade buie vicino alla stazione, il resto è tranquillo."
      recast: {text: "Zone pericolosi", fix: "Zone pericolose", tags: [adjective-agreement]}
      goals: [warnings]
    # merlin-1365_0100233-12
    - learner: "Grazie! Forse possiamo vederci presto, a Napoli."
    - tutor: "Certo, vi porto io a mangiare la pizza!"

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [pronoun-position]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1365_0100221-3
    - learner: "Comunque domani parto per andare in Italia e ci potremo vederci presto."
      errors: [pronoun-position]
    - tutor: "Domani, che bello! Ma «ci potremo vederci»: quante volte serve quel «ci»?"
      prompt: {text: "ci potremo vederci", tags: [pronoun-position]}
    - learner: "Potremo vederci presto!"
    - tutor: "Esatto, finalmente! Hai già qualche idea per la settimana?"
      goals: [plans]
    # merlin-1395_0000533-8
    - learner: "Dimmi, che cosa potremmo fare la sera?"
    - tutor: "La sera andiamo ai Quartieri Spagnoli: musica, gente e pizza per strada! Dall'aeroporto prendi l'Alibus, in venti minuti sei in centro. E attento alle moto: non si fermano mai!"
      goals: [advice, transport, warnings]
    # merlin-1395_0000514-6
    - learner: "Spero che ci vediamo presto!"
    - tutor: "Prestissimo! Ti aspetto all'uscita dell'aeroporto con un buon caffè."

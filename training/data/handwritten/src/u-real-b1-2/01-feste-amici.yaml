# B1 real-learner set (round 6): planning birthdays and family celebrations with friends.
# Most learner turns are real, acceptable learner Italian that the tutor leaves alone.
- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1385_0001717-7
    - learner: "Potremmo andare a cena in centro."
    - tutor: "Mi piace l'idea! Conosci un posto carino, non troppo caro?"
    # merlin-1365_0100285-10
    - learner: "Conosco un buon ristorante."
    - tutor: "Perfetto, allora sabato sera andiamo lì. Ah, lo sai? Ieri ho finalmente dato l'esame orale di inglese, ed è andato benissimo!"
      goals: [date]
    # merlin-1365_0100456-0
    - learner: "Mi fa grande piacere che tu hai superato l'esame orale con un risultato ottimo."
      errors: [subjunctive-use]
    - tutor: "Grazie! Ma «che tu hai superato»: dopo «mi fa piacere che», quale modo del verbo usiamo?"
      prompt: {text: "tu hai superato", tags: [subjunctive-use]}
    - learner: "Mi fa grande piacere che tu abbia superato l'esame!"
    - tutor: "Esatto, grazie mille! Allora sabato festeggiamo due volte: invito io i colleghi di Sara e le ragazze della palestra. E il regalo?"
      goals: [guests]
    # merlin-1365_0100136-8
    - learner: "Forse un buono?"
    - tutor: "Un buono è sempre utile! Magari per un corso di ceramica: Sara ne parla da mesi. E per la torta?"
      goals: [gift]
      new: [{lemma: ceramica, gloss: pottery}]
    - learner: "La torta la preparo io: so fare una torta al cioccolato buonissimo."
      errors: [adjective-agreement]
    - tutor: "Che bello! Ma «una torta... buonissimo»: «torta» è femminile, quindi?"
      prompt: {text: "torta al cioccolato buonissimo", tags: [adjective-agreement]}
    - learner: "Una torta al cioccolato buonissima!"
    - tutor: "Esatto! Allora siamo a posto: tu pensi alla torta, io prenoto il ristorante."
      goals: [food]
    # merlin-1395_0000388-11
    - learner: "Aspetto la tua risposta."
    - tutor: "Ti scrivo appena prenoto il tavolo!"

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a sorpresa a casa mia, venerdì sera?"
    - tutor: "Una festa a casa tua? Grande! Ma venerdì non hai il turno di notte?"
    # merlin-1395_0000533-2
    - learner: "Ho sei giorni liberi."
    - tutor: "Ah, sei in vacanza, che fortuna! Sai che Sara ha un colloquio di lavoro a Milano la settimana prossima?"
      goals: [date]
      new: [{lemma: colloquio, gloss: interview}]
    # merlin-1365_0100121-9
    - learner: "Speriamo che trovarà un lavoro a Milano e potremo vederci nell'estate!"
      errors: [future-form, articulated-preposition]
    - tutor: "Speriamo davvero! Ma «trovarà»: prova a ripetere il futuro di «trovare»."
      prompt: {text: "trovarà", tags: [future-form]}
    - learner: "Speriamo che trovarà un lavoro, sì!"
      errors: [future-form]
    - tutor: "Sì, speriamo che troverà un lavoro a Milano! Allora venerdì da te: però ci servono sedie in più."
      recast: {text: "trovarà", fix: "troverà", tags: [future-form]}
    # merlin-1365_0100221-4
    - learner: "Ho un amico che lavora in un albergo nelle tue vicinanze."
    - tutor: "Ottimo, magari ci presta qualche sedia! Tu scrivi ai colleghi di Sara e io agli amici dell'università, va bene?"
    - learner: "Sì, ci penso io. Per la comida preparo una paella grande."
      errors: [word-choice]
    - tutor: "Una paella per la cena, per venti persone? Che coraggio! Io porto la torta e qualcosa da bere."
      recast: {text: "Per la comida", fix: "Per la cena", tags: [word-choice]}
      goals: [guests, food]
    # merlin-1325_9000302-9
    - learner: "Ci sono tanti posti da visitare."
    - tutor: "Esatto, per questo un fine settimana a Firenze è il regalo perfetto: Sara non ci è mai stata! Dividiamo la spesa tra tutti."
      goals: [gift]
    # merlin-1365_0100263-9
    - learner: "Perfetto. Non vedo l'ora di vederti."
    - tutor: "Ci vediamo venerdì da te, allora! Porto io qualcosa da bere."

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Luca? Compie quarant'anni!"
    - learner: "Una cena tutti insieme, ma sabato o domenica."
    - tutor: "Perché non durante la settimana? Sarebbe più facile trovare un tavolo."
    # merlin-1395_0000387-5
    - learner: "Durante la settimana sono quasi sempre da sola con i bambini."
    - tutor: "Ah, certo, allora meglio sabato diciotto a casa mia, così i bambini restano con i nonni. Invitiamo i colleghi di Luca e i suoi genitori?"
      goals: [date]
    - learner: "Sì, tutti. Allora tanti antipasti e un dolce grande. Luca è molto goloso."
    - tutor: "Lo so bene! Ordino una torta grande al cioccolato, la sua preferita."
      goals: [guests, food]
    - learner: "E per il regalo hai alcuni idee? Io non lo so."
      errors: [adjective-agreement]
    - tutor: "Ho pensato a una bicicletta! Ma tu dici «alcuni idee»: guarda bene il nome, «idea» com'è?"
      prompt: {text: "alcuni idee", tags: [adjective-agreement]}
    - learner: "Sì, alcuni idee. Una bicicletta va bene."
      errors: [adjective-agreement]
    - tutor: "Alcune idee le avevo anch'io, ma la bicicletta è la migliore! Domani passo al negozio e chiedo il prezzo."
      recast: {text: "alcuni idee", fix: "alcune idee", tags: [adjective-agreement]}
      goals: [gift]
    # merlin-1365_0100006-5
    - learner: "Aspetto la tua risposta!"
    - tutor: "Ti scrivo domani sera, promesso!"

- scenario: compleanno
  level: B1
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1385_0001724-4
    - learner: "Hai voglia di andare a cena in un ristorante tailandese?"
    - tutor: "Sì, a Sara piace tantissimo la cucina tailandese! Prenotiamo per sabato sera?"
    # merlin-1395_0000551-4
    - learner: "Ma la settimana prossima io devo lavorare."
    - tutor: "Anche sabato sera? Allora facciamo domenica a pranzo, il ristorante è aperto."
      goals: [date]
    - learner: "Domenica va bene. Invitiamo solo gli amici più vicini, il ristorante è piccolo."
      errors: [word-choice]
    - tutor: "Giusto, solo gli amici più stretti: otto persone al massimo. Chiedo anche se possiamo portare una torta da fuori."
      recast: {text: "amici più vicini", fix: "amici più stretti", tags: [word-choice]}
      new: [{lemma: stretto, gloss: close (friend)}]
      goals: [guests]
    - learner: "La torta la compro io nella pastelería vicino all'università."
      errors: [word-choice]
    - tutor: "Nella pasticceria vicino all'università? Fa dolci buonissimi! Ora manca solo il regalo."
      recast: {text: "pastelería", fix: "pasticceria", tags: [word-choice]}
      goals: [food]
      new: [{lemma: pasticceria, gloss: cake shop}]
    # merlin-1395_0000513-5
    - learner: "Ho comprato una bicicletta nuova - non è pesante, ma è superveloce!"
    - tutor: "Davvero? Sara va al lavoro a piedi e si lamenta sempre: potremmo regalarne una anche a lei!"
    - learner: "Sì! Il negozio è vicino a casa mia, gli lo chiedo domani."
      errors: [combined-pronouns]
    - tutor: "Ottimo! Ma «gli lo chiedo»: come uniamo questi due pronomi?"
      prompt: {text: "gli lo chiedo", tags: [combined-pronouns]}
    - learner: "Glielo chiedo domani, al negozio."
    - tutor: "Esatto. Poi mi mandi il prezzo e dividiamo tra tutti."
      goals: [gift]
    # merlin-1395_0000360-3
    - learner: "Sono veramente contenta."
    - tutor: "Anch'io! Sara sarà felicissima."

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Quest'anno compie trent'anni."
    # merlin-1365_0100475-10
    - learner: "Forse noi ci possiamo incontrare."
    - tutor: "Certo, vediamoci domani al bar per organizzare tutto. Ma tu pensavi già a un posto per la festa?"
    - learner: "Al parco, se fa bello. Facciamo un picnic, domenica."
    - tutor: "Un picnic al parco, che bella idea! Domenica ventidue, verso l'una, con i compagni di corso e la sua famiglia. E da mangiare cosa portiamo?"
      goals: [date, guests]
    - learner: "Io porto i panini e una torta di mele. Ho imparato farla da mia nonna."
      errors: [preposition]
    - tutor: "La torta della nonna! Ma «ho imparato farla»: tra «imparato» e «farla» manca qualcosa?"
      prompt: {text: "imparato farla", tags: [preposition]}
    - learner: "Ho imparato farla, sì, quando ero piccolo."
      errors: [preposition]
    - tutor: "Hai imparato a farla da piccolo, che bello! Allora io porto da bere e i piatti di carta."
      recast: {text: "imparato farla", fix: "imparato a farla", tags: [preposition]}
      goals: [food]
    # merlin-1365_0100136-7
    - learner: "Che cosa posso regalare?"
    - tutor: "Facciamo un regalo tutti insieme! A Sara piace tanto la fotografia."
    - learner: "Allora una camera. Ne ho vista una bellissima in centro."
      errors: [false-friend]
    - tutor: "Una macchina fotografica, ottima idea! Ci passiamo domani dopo il lavoro e vediamo il prezzo."
      recast: {text: "una camera", fix: "una macchina fotografica", tags: [false-friend]}
      new: [{lemma: fotografico, gloss: photographic}]
      goals: [gift]
    # merlin-1365_0100120-16
    - learner: "La prossima volta che ci vediamo ti invito a mangiare!"
    - tutor: "Allora domani, dopo il negozio, andiamo a mangiare qualcosa insieme!"

- scenario: compleanno
  level: B1
  persona: en-m-retired
  history: [word-order]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1365_0100187-0
    - learner: "Prima di tutto vorrei fare le mie congratulazioni per questa novità e tanti, tanti auguri a voi!"
    - tutor: "Ah, hai saputo del bambino! Grazie mille, siamo felicissimi. Ma torniamo alla festa: dove la facciamo?"
    - learner: "A casa nostra, in giardino. Sabato pomeriggio?"
    - tutor: "Perfetto, sabato dalle quattro in poi!"
      goals: [date]
    # merlin-1365_0100282-7
    - learner: "Vorrei incontrare anche i vostri genitori."
    - tutor: "I miei genitori e quelli di Sara? Certo, li invitiamo tutti, anche gli zii di Bologna."
      goals: [guests]
    - learner: "Mia moglie prepara le lasagne. E la torta compriamo in pasticceria."
      errors: [word-order]
    - tutor: "Le lasagne di tua moglie sono famose! Ma «la torta compriamo»: quando «la torta» viene prima del verbo, cosa serve?"
      prompt: {text: "la torta compriamo", tags: [word-order]}
    - learner: "La torta compriamo, sì."
      errors: [word-order]
    - tutor: "D'accordo, la torta la compriamo in pasticceria. E il regalo?"
      recast: {text: "La torta compriamo", fix: "la torta la compriamo", tags: [word-order]}
      goals: [food]
      new: [{lemma: pasticceria, gloss: cake shop}]
    # merlin-1365_0100020-7
    - learner: "Non lo so."
    - tutor: "Lavora sempre tanto, forse un buono per una giornata alle terme?"
      new: [{lemma: terme, gloss: spa}]
    # merlin-1365_0100211-11
    - learner: "È tanto romantico, no?"
    - tutor: "Sì, e così ci va con me! Lo prendo io e poi dividiamo."
      goals: [gift]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [ce-ci-sono]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    # merlin-1395_0000387-3
    - learner: "Tutti sono sani e contenti."
    - tutor: "È questo che conta! Ma raccontami: cosa si mangia da voi il giorno di Natale?"
    - learner: "Il tacchino, le patate e un dolce con la frutta secca."
    - tutor: "Il tacchino, come nei film! E quando eri piccola, come passavate la vigilia?"
      goals: [compare]
      new: [{lemma: vigilia, gloss: Christmas Eve}]
    # merlin-1365_0100223-2
    - learner: "Durante questo periodo, per me, la vita era più calma."
    - tutor: "Capisco, niente scuola e tanto tempo in famiglia. Andavate anche in chiesa?"
    - learner: "Sì, la sera. Ma prima erano sempre le canzoni in piazza."
      errors: [ce-ci-sono]
    - tutor: "Prima della chiesa... come dici? «Erano sempre le canzoni»?"
      prompt: {text: "erano sempre le canzoni", tags: [ce-ci-sono]}
    - learner: "Erano le canzoni, sì, tutti insieme."
      errors: [ce-ci-sono]
    - tutor: "Ah, c'erano le canzoni, tutti insieme! Anche mia nonna ci portava alla messa di mezzanotte."
      recast: {text: "Erano le canzoni", fix: "c'erano le canzoni", tags: [ce-ci-sono]}
      goals: [past]
      new: [{lemma: mezzanotte, gloss: midnight}]
    # merlin-1365_0100175-5
    - learner: "Avete un desiderio speciale?"
    - tutor: "Per il pranzo? Non devi portare niente! Ma un dolce del tuo paese ci farebbe molto piacere."
      goals: [plan]
    # merlin-1395_0001073-1
    - learner: "Che cosa fate di bello?"
    - tutor: "Il giorno dopo, per Santo Stefano? Mangiamo quello che resta del pranzo e giochiamo a tombola tutto il pomeriggio!"
      goals: [ask]
      new: [{lemma: tombola, gloss: Italian bingo}]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [possessive]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia il pesce la sera della vigilia, e poi si va a messa."
    - tutor: "Il pesce, come in molte case italiane! E da bambina che cosa ti piaceva di più?"
      goals: [compare]
    - learner: "I regali dei Re Magi, il sei gennaio."
    - tutor: "Ah, aspettavate i Re Magi! E come vi sentivate la mattina?"
    # merlin-1325_1001123-7
    - learner: "E quello era una gioia per me."
    - tutor: "Ci credo! Qui invece il sei gennaio arriva la Befana con le calze piene di dolci."
      goals: [past]
    - learner: "E qual è il dolce tipico del vostro Natale?"
    - tutor: "Il panettone, un grande dolce con l'uvetta. Domani lo provi!"
      goals: [ask]
      new: [{lemma: panettone, gloss: Christmas cake}, {lemma: uvetta, gloss: raisins}]
    # merlin-1395_0000366-1
    - learner: "Ho letto con grande interesse tue notizie."
      errors: [possessive]
    - tutor: "Il mio messaggio sul pranzo? Hai letto... «tue notizie»? Davanti a «tue» manca qualcosa."
      prompt: {text: "tue notizie", tags: [possessive]}
    - learner: "Ho letto le tue notizie. Allora, cosa porto?"
    - tutor: "Esatto! Porta solo una bottiglia di vino, a mio padre farà piacere."
      goals: [plan]
    # merlin-1365_0100262-5
    - learner: "Va bene. Non vedo l'ora di rivedervi!"
    - tutor: "Anche noi! A domani, allora."

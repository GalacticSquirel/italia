# B1 real-learner set (round 6): more interviews, renting a room, cooking with a friend, a noisy neighbour.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001077-3
    - learner: "Grazie. Mi vorrei presentare un po'."
    - tutor: "Prego, la ascolto."
    # merlin-1325_1001011-3
    - learner: "Ho 24 anni e parlo tre lingue: inglese, tedesco e l'italiano."
    - tutor: "Tre lingue, molto bene! E quanto sono importanti per lei?"
      goals: [intro]
    # merlin-1325_1001042-7
    - learner: "Le lingue stranieri sono molto utili, quando cerchi un lavoro, perchè ci sono molte ditte multinazionali."
      errors: [adjective-agreement, spelling]
    - tutor: "Ha ragione. Ma «le lingue stranieri»: guardi bene, «lingue» è femminile..."
      prompt: {text: "lingue stranieri", tags: [adjective-agreement]}
    - learner: "Le lingue straniere, sì."
    - tutor: "Esatto. E che esperienze di lavoro ha?"
    # merlin-1325_1001154-6
    - learner: "Ho una breve, ma significativa esperienza lavorativa."
    - tutor: "Mi racconti."
    # merlin-1325_1001153-5
    - learner: "Ho lavorato con i clienti e anche in ufficio."
    - tutor: "Bene, da noi serve proprio questo. E i suoi punti di forza?"
      goals: [experience]
    # merlin-1325_1001155-5
    - learner: "Penso che non mi faccia difficoltà parlare con la gente sconosciuta, così non mi farebbe difficoltà tenere i contatti e assistere il personale in ufficio."
    - tutor: "Ottimo. E perché ha scelto proprio noi?"
      goals: [strengths]
    # merlin-1325_1001154-1
    - learner: "Ho un particolare interesse per il mondo della moda."
    - tutor: "Allora è nel posto giusto. Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001086-8
    - learner: "Quando comincia lo stage? O da quale mese?"
    - tutor: "Da settembre, per sei mesi. Le faremo sapere entro la fine del mese."
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [verb-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000504-4
    - learner: "Parlo le lingue straniere: l'inglese, l'italiano, il francese."
    - tutor: "E lo spagnolo, immagino! Che studi ha fatto?"
    # merlin-1325_9000099-4
    - learner: "Ho fatto con buoni risultati il test TELC A1, A2 e B1."
    - tutor: "Bravo, il suo italiano è ottimo! E che lavoro fa adesso?"
      goals: [intro]
    # merlin-1325_9000144-5
    - learner: "Dopo la mia formazione ho lavorato nel consolato italiano nei servizi turistici."
    - tutor: "Interessante! Si trova bene con i computer?"
    # merlin-1325_1001093-8
    - learner: "Ho una buona conoscenza del sistema Windows."
    - tutor: "Ottimo. E un suo punto debole?"
      goals: [experience]
    - learner: "A volte parlo troppo veloce, e i clienti non mi capiscono."
    - tutor: "Questo si può risolvere! Perché vuole questo lavoro?"
      goals: [strengths]
    # merlin-1325_1001089-9
    - learner: "Allora vorrei lavorare in un negozio di abbigliamento e spero di aver ricevere questo lavoro."
      errors: [verb-form]
    - tutor: "Lo speriamo anche noi! Ma «spero di aver ricevere»: dopo «spero di», basta un verbo solo?"
      prompt: {text: "aver ricevere", tags: [verb-form]}
    - learner: "Spero di aver ricevuto questo lavoro."
      errors: [verb-form]
    - tutor: "Spera di ricevere questo lavoro, capisco: lo vedremo presto! Ha domande?"
      recast: {text: "aver ricevuto", fix: "ricevere", tags: [verb-form]}
      goals: [why]
    # merlin-1325_1001157-9
    - learner: "Sì. Posso parlare che quanti soldi riceverei?"
      errors: [preposition]
    - tutor: "Certo. Ma «parlare che quanti soldi»: si parla... «di» qualcosa, quindi?"
      prompt: {text: "parlare che quanti", tags: [preposition]}
    - learner: "Posso parlare di quanti soldi riceverei?"
    - tutor: "Esatto. Sono mille euro al mese, per sei mesi."
      goals: [questions]
    # merlin-1325_9000700-8
    - learner: "Per qualche domanda sono a Sua disposizione!"
    - tutor: "Perfetto, la chiamiamo presto. Arrivederci!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000215-4
    - learner: "Studio economia a Londra. A settembre inizio il mio terzo ed ultimo anno."
    - tutor: "Quindi cerca un lavoro per l'estate?"
    # merlin-1325_1001091-12
    - learner: "Sì. Anche il contratto di stage retribuito di 6 mesi è buono per me."
    - tutor: "Molto bene. Che esperienze ha?"
      goals: [intro]
    # merlin-1325_1001154-3
    - learner: "Ho frequentato un corso per approfondire la mia conoscenza del pacchetto Office."
    - tutor: "Utile! E ha già lavorato?"
    # merlin-1325_1001032-10
    - learner: "Conosco i diversi tipi di lavoro: tenere i contatti con i clienti, utilizzare programmi informatici per la gestione del personale, condurre ricerche di mercato, assistere il personale in ufficio."
    - tutor: "Vedo che conosce bene il nostro lavoro! Ma ha fatto anche esperienze pratiche?"
    - learner: "Sì, ho lavorato due estati in un'agenzia di viaggi."
    - tutor: "Bene. E perché le piacerebbe lavorare qui?"
      goals: [experience]
    # merlin-1325_1001134-5
    - learner: "La mia lingua preferita è l'italiano perché preferisco le lingue mediterranei, vivaci."
      errors: [adjective-agreement]
    - tutor: "Che bello! Ma «le lingue mediterranei»: com'è l'aggettivo con «lingue»?"
      prompt: {text: "lingue mediterranei", tags: [adjective-agreement]}
    - learner: "Le lingue mediterranee."
    - tutor: "Esatto. E qual è un suo punto di forza?"
      goals: [why]
    # merlin-1325_9000239-1
    - learner: "Penso che la mia formazione e le mie conoscenze del commercio siano utili per la vostra ditta e per i miei studi."
    - tutor: "Sono d'accordo. Ha una domanda per me?"
      goals: [strengths]
    # merlin-1365_0100226-4
    - learner: "Posso cominciare a giugno, dopo gli esami. Che ne dice?"
    - tutor: "Giugno va benissimo. Le mandiamo il contratto la settimana prossima."
      goals: [questions]

- scenario: affittare-appartamento
  level: B1
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    # merlin-1325_1001155-8
    - learner: "Buongiorno. Ho letto il vostro annuncio sulla stampa."
    - tutor: "Sì, quello per gli studenti. È sola o cerca con altre persone?"
    # merlin-1365_0100148-5
    - learner: "Preferisco prenotare un appartamento con altri studenti."
    - tutor: "Allora va benissimo: ci sono tre camere e due sono già occupate da ragazze che studiano qui."
    # merlin-1395_0001010-0
    - learner: "Perfetto. Sto facendo un corso di italiano per imparare la lingua."
    - tutor: "Allora con due ragazze italiane imparerà in fretta! L'affitto è di quattrocento euro al mese, spese comprese."
      goals: [rent]
    # merlin-1365_0100102-7
    - learner: "Sarebbe fantastico se mi potreste fare un'offerta per l'alloggio."
      errors: [hypothetical]
    - tutor: "Un prezzo più basso, dice? Ma «se mi potreste»: dopo «se», quale forma del verbo usiamo?"
      prompt: {text: "se mi potreste", tags: [hypothetical]}
    - learner: "Se mi poteste fare un'offerta."
    - tutor: "Esatto. Per un contratto di un anno posso scendere a trecentocinquanta euro."
    - learner: "E la caparra? Un mese mi sembra giusto."
    - tutor: "Di solito chiedo due mesi, ma un mese può andare bene. Il riscaldamento funziona benissimo."
      goals: [contract, condition]
      new: [{lemma: caparra, gloss: deposit}]
    # merlin-1365_0100071-4
    - learner: "C'è una università molto conosciuta a Bologna. È lontana da qui?"
    - tutor: "Venti minuti a piedi, o cinque in autobus. Il quartiere è tranquillo e pieno di studenti."
      goals: [neighbourhood]
    # merlin-1325_1001016-7
    - learner: "Mi piace molto. Mi scriva, per favore, se è possibile prestissimo."
    - tutor: "Le mando il contratto stasera stessa. Benvenuta!"
      goals: [decide]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1395_0000391-5
    - learner: "Sì, molto. Sono ingegnere alla Fiat."
    - tutor: "Un ingegnere, che bello! E perché vuoi fare volontariato?"
    # merlin-1325_9000137-9
    - learner: "Ho un po' di tempo libero e mi piace stare con la gente. Spero che posso aiutarvi!"
      errors: [subjunctive-use]
    - tutor: "Ne siamo sicuri! Ma «spero che posso»: dopo «spero che», quale modo del verbo usiamo?"
      prompt: {text: "Spero che posso", tags: [subjunctive-use]}
    - learner: "Spero che possa aiutarvi!"
    - tutor: "Esatto, e potrai aiutarci di sicuro! Che cosa sai fare, oltre al tuo lavoro?"
      goals: [motivation]
    # merlin-1325_1001098-6
    - learner: "Conosco bene tre lingue, l'italiano, l'inglese e il francese."
    - tutor: "Perfetto, ci serve qualcuno per aiutare le famiglie straniere."
    # merlin-1325_9000685-1
    - learner: "Ho vissuto due anni a Torino. Perciò sono in grado di lavorare in Italia."
    - tutor: "Benissimo. Organizziamo anche campi d'estate per ragazzi: ti interessano?"
      goals: [skills]
    # merlin-1325_9000186-3
    - learner: "Sì! Sarò disponibile per il primo campo, il quale comincerà in luglio."
    - tutor: "Ottimo, dal primo al quindici luglio. Preferisci aiutare con i giochi o con la cucina?"
      goals: [time]
    - learner: "Con i giochi, e la sera posso insegnare un po' di francese ai ragazzi."
    - tutor: "Che bella idea! Ti scrivo per i giochi e per il francese."
      goals: [choose]
    # merlin-1325_1001084-6
    - learner: "Grazie. Mi potrebbe dare i dati degli incontri?"
    - tutor: "Certo, ti mando un messaggio con le date delle riunioni per i volontari."

- scenario: cucina-ricetta
  level: B1
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    # merlin-1325_1001084-1
    - learner: "Mi piace cucinare, preparo qualcosa speciale da mangiare ogni giorno."
      errors: [preposition]
    - tutor: "Che fortuna i tuoi amici! Ma «qualcosa speciale»: tra «qualcosa» e «speciale» manca una piccola parola."
      prompt: {text: "qualcosa speciale", tags: [preposition]}
    - learner: "Qualcosa di speciale!"
    - tutor: "Esatto. E stasera cosa c'è di speciale?"
    # merlin-1395_0000388-9
    - learner: "Mangeremo un piatto di pasta, tipica sarda, ce ho imparato a cucinare."
      errors: [relative-pronoun]
    - tutor: "Sarda, che bello! Ma «ce ho imparato»: per unire le due frasi, quale pronome ci vuole?"
      prompt: {text: "ce ho imparato", tags: [relative-pronoun]}
    - learner: "Un piatto che ho imparato a cucinare in Sardegna."
    - tutor: "Perfetto. Ci servono pasta, pomodori, pecorino e basilico, giusto? Come si comincia?"
      new: [{lemma: pecorino, gloss: sheep cheese}, {lemma: basilico, gloss: basil}]
      goals: [ingredients]
    - learner: "Prima taglia i pomodori e mettili in una pentola con l'olio."
    - tutor: "Fatto. Quanto devono cuocere i pomodori?"
      goals: [steps]
    - learner: "Venti minuti. Poi cuociamo la pasta, dieci minuti."
    - tutor: "E poi come la serviamo?"
      goals: [time]
    # merlin-1365_0100469-7
    - learner: "Con tanto formaggio sopra. Che ne pensi?"
    - tutor: "Dico che non vedo l'ora di mangiarla!"
      goals: [serve]

- scenario: affittare-appartamento
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, scuola di lingue, ufficio case per gli studenti. Come posso aiutarLa?"
    # merlin-1365_0100194-1
    - learner: "Quest'estate mi piacerebbe frequentare uno dei Vostri corsi d'italiano."
    - tutor: "Benissimo! Abbiamo corsi di due, tre o quattro settimane. In che periodo vorrebbe venire?"
    # merlin-1325_9000677-1
    - learner: "Sono libera in periodo dal 3 luglio fino al 20 luglio."
      errors: [articulated-preposition]
    - tutor: "Luglio va benissimo. Ma «libera in periodo»: qui serve una preposizione con l'articolo."
      prompt: {text: "in periodo", tags: [articulated-preposition]}
    - learner: "In periodo dal 3 al 20, sì."
      errors: [articulated-preposition]
    - tutor: "Nel periodo dal 3 al 20 luglio c'è un corso di due settimane, perfetto. E per dormire, ha già un posto?"
      recast: {text: "In periodo", fix: "Nel periodo", tags: [articulated-preposition]}
    # merlin-1365_0100102-6
    - learner: "Come sono i prezzi per un alloggio in una casa privata?"
    - tutor: "Una camera in una famiglia costa trecento euro per due settimane, con la colazione. Le case sono tutte vicino alla scuola."
      goals: [rent, neighbourhood]
    # merlin-1365_0100080-2
    - learner: "Ci sono altri studenti con cui posso abitare in un appartamento?"
    - tutor: "Sì, c'è un appartamento in centro con tre camere. Ci abitano già due ragazze tedesche, e la cucina è in comune."
      goals: [condition]
    # merlin-1365_0100148-8
    - learner: "Potreste darmi i prezzi dell'alloggio e del corso."
    - tutor: "Certo: il corso costa quattrocento euro, la camera nell'appartamento duecento. Il contratto è per le due settimane del corso."
      goals: [contract]
    - learner: "Allora prendo l'appartamento: mi piace abitare con altri studenti."
    - tutor: "Ottima scelta! Le mando il contratto oggi pomeriggio."
      goals: [decide]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [adjective-agreement]
  turns:
    - tutor: "Sabato io e mia sorella Giulia compiamo trent'anni! Facciamo una festa a casa nostra, e sei invitata."
    # merlin-1365_0100285-1
    - learner: "Grazie tanto per il vostro invito."
    - tutor: "Figurati! Si comincia sabato alle otto. Venerdì invece hai la cena con i colleghi, vero?"
      goals: [date]
    - learner: "Sì, purtroppo non posso dire di no al capo."
    - tutor: "Che peccato! Almeno sabato ti divertirai: vengono anche i nostri cugini da Torino. Io adesso sto già cucinando, vieni a darmi una mano?"
      goals: [guests]
    # merlin-1365_0100252-7
    - learner: "Mi dispiace non posso darti una mano ora."
    - tutor: "Non importa, ce la faccio da sola! Sto preparando la pasta al forno per trenta persone."
      goals: [food]
    # merlin-1365_0100182-7
    - learner: "Che cosa vi posso regalare?"
    - tutor: "Niente, davvero! Ci basta la tua compagnia."
    # merlin-1365_0100447-5
    - learner: "Se non mi date una proposta, io vi inviterò a casa mia nell'estate prossimo."
      errors: [adjective-agreement, preposition]
    - tutor: "Ah ah, che bella idea! Ma «nell'estate prossimo»: «estate» è maschile o femminile?"
      prompt: {text: "nell'estate prossimo", tags: [adjective-agreement]}
    - learner: "L'estate prossimo, sì, vi aspetto a Londra!"
      errors: [adjective-agreement]
    - tutor: "L'estate prossima a Londra? Allora accettiamo subito! Scherzo, a Giulia piacciono i libri gialli."
      recast: {text: "L'estate prossimo", fix: "L'estate prossima", tags: [adjective-agreement]}
      goals: [gift]
    # merlin-1365_0100447-8
    - learner: "Vi auguro buona continuazione per organizzare tutto e non vedo l'ora di rivedervi."
    - tutor: "Anche noi! Allora a sabato, e porta anche il tuo ragazzo."

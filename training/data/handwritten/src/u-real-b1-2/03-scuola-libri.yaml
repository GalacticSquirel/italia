# B1 real-learner set (round 6): childhood, school and languages; a book club.
- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    # merlin-1325_1001110-1
    - learner: "In un paese vicino al mare, in Galles. Da piccola avevo una passione per le culture e le lingue diverse."
    - tutor: "Al mare, che fortuna! E a scuola studiavi qualche lingua straniera?"
      goals: [place]
    # merlin-1325_1001035-1
    - learner: "Essendo attiva e motivata da bambina ho deciso di imparare molte lingue straniere."
    - tutor: "Brava! E l'italiano quando l'hai incontrato la prima volta?"
      goals: [habits]
    # merlin-1325_1001051-1
    - learner: "A dodici anni, in vacanza in Toscana. Mi è piaciuta lingua, ma non ho saputo parlare."
      errors: [article-use, tense-aspect]
    - tutor: "A dodici anni, che bello! Ma «non ho saputo parlare»: parli di un momento o di come eri in quel periodo?"
      prompt: {text: "non ho saputo parlare", tags: [tense-aspect]}
    - learner: "Di quel periodo: non sapevo parlare."
    - tutor: "Esatto, ma la lingua ti piaceva già! E a scuola com'era?"
    # merlin-1395_0000446-3
    - learner: "La nostra insegnante è molto simpatica."
    - tutor: "Ah, la vedi ancora? Che bello avere una maestra così."
      goals: [school]
    # merlin-1325_1001057-1
    - learner: "Mi piace molto questa lingua e anche le persone."
    - tutor: "E si vede che anche le persone amano te! Andiamo a prendere un gelato in piazza?"
      goals: [event]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la festa più importante è la notte del ventiquattro."
    - tutor: "Come in molte case italiane! E da piccola com'era il Natale a casa tua?"
      goals: [compare]
    - learner: "Mia nonna cucinava due giorni per trenta personas, e noi bambini giocavamo in cortile."
      errors: [word-choice]
    - tutor: "Per trenta persone, che lavoro! Sai la novità? Io e Paolo ci sposiamo a settembre!"
      recast: {text: "trenta personas", fix: "trenta persone", tags: [word-choice]}
      goals: [past]
    # merlin-1365_0100261-0
    - learner: "Sono molto contenta che tu abbia trovato l'uomo giusto."
    - tutor: "Grazie, sei un tesoro! Ci conosciamo dal liceo, sai?"
    # merlin-1365_0100177-6
    - learner: "Silvia, hai già comprato il tuo vestito?"
    - tutor: "Non ancora! Vieni con me a sceglierlo, la settimana prossima?"
    # merlin-1365_0100184-3
    - learner: "Certo! E per il regalo: che cosa volete?"
    - tutor: "In Italia si fa la lista di nozze: gli sposi scelgono i regali e gli invitati li comprano."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100177-4
    - learner: "Forse avete bisogno di qualcosa per la vostra cucina?"
    - tutor: "Proprio così, la nostra cucina è vuota!"
    - learner: "Un momento: per il pranzo di domani posso portare qualcosa?"
    - tutor: "Se vuoi, un dolce del tuo paese. A mia madre piacerà tantissimo."
      goals: [plan]
    # merlin-1365_0100135-1
    - learner: "Va bene. Tanti auguri per il vostro matrimonio e futuro."
    - tutor: "Grazie di cuore! Adesso andiamo a tavola."

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-heritage
  history: [stare-gerund]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    # merlin-1325_1001110-10
    - learner: "A Toronto, con i miei genitori italiani. Adesso sono in Italia, studiando l'italiano."
      errors: [stare-gerund]
    - tutor: "Che bella storia! Ma «sono in Italia, studiando»: per dire cosa fai in questo periodo, quale verbo usiamo?"
      prompt: {text: "studiando l'italiano", tags: [stare-gerund]}
    - learner: "Sto studiando l'italiano."
    - tutor: "Esatto. E a casa, da bambino, che lingua parlavate?"
      goals: [place]
    # merlin-1325_1001051-8
    - learner: "In casa inglese. Quando sono uscito io ho parlato italiano solo con la nonna."
    - tutor: "Con la nonna, che dolce! E la scuola ti piaceva?"
      goals: [habits]
    # merlin-1365_0100475-3
    - learner: "Non molto. Ma l'ultimo periodo era fantastico per me."
    - tutor: "Perché? Cosa è cambiato alla fine?"
      goals: [school]
    - learner: "Ho conosciuto la mia prima ragazza e abbiamo fatto un viaggio insieme in Italia, a diciotto anni."
    - tutor: "Il primo viaggio in Italia con la prima ragazza: un ricordo perfetto!"
      goals: [event]
    # merlin-1325_9000099-2
    - learner: "Sì. Mi piace molto l'italiano."
    - tutor: "E si sente! Vieni, ti offro un caffè in piazza."

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, sono il direttore del Residence del Lago. Ho letto la Sua lettera, mi dica pure."
    # merlin-1365_0100103-0
    - learner: "Leggendo il giornale ho scoperto quest'annuncio che è molto adatto a me per fare le ferie."
    - tutor: "Sì, è la nostra offerta per l'estate. Che cosa non è andato bene?"
    # merlin-1325_1001013-5
    - learner: "Ma il mio viaggio è diventato un inbuco."
      errors: [spelling]
    - tutor: "Mi dispiace molto. Ma «un inbuco»: guarda bene l'ordine delle lettere in questa parola."
      prompt: {text: "inbuco", tags: [spelling]}
    - learner: "Un incubo, sì! Il primo giorno l'aria condizionata non funzionava."
    - tutor: "Questo non va bene, ha ragione. E il problema è continuato per tutta la vacanza?"
      goals: [problem]
    # merlin-1325_9000209-1
    - learner: "Anche campi da palla a volo sono stati organizzati troppo presto di mattina mentre i cambi da tennis sono stati in riparazione."
      errors: [tense-aspect, article-use, spelling]
    - tutor: "Capisco. Ma «i campi sono stati in riparazione»: era una situazione che durava. Che tempo usiamo?"
      prompt: {text: "sono stati in riparazione", tags: [tense-aspect]}
    - learner: "Sì, i campi da tennis sono stati in riparazione tutta la settimana."
      errors: [tense-aspect]
    - tutor: "Lo so, i campi da tennis erano in riparazione tutta la settimana. Che cosa Le possiamo offrire?"
      recast: {text: "sono stati in riparazione", fix: "erano in riparazione", tags: [tense-aspect]}
      goals: [since]
    - learner: "Vorrei avere indietro una parte dei soldi, almeno il trenta per cento."
    - tutor: "Va bene, il trenta per cento. Devo solo parlare con il proprietario, poi La richiamo."
      goals: [request]
    # merlin-1325_1001092-14
    - learner: "Aspetto al più presto la Sua risposta."
    - tutor: "Certo, La chiamo domani mattina. E ancora scusi per i problemi."
      goals: [agree]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Allora, com'è Perugia? Sei lì da una settimana ormai."
    # merlin-1395_0001145-1
    - learner: "Questa città è bella e tranquilla."
    - tutor: "Che fortuna! E la scuola di lingua com'è?"
      goals: [where]
    # merlin-1365_0100475-7
    - learner: "Partecipo ai un corso di lingua e il professore è molto simpatico."
      errors: [articulated-preposition]
    - tutor: "Bene! Ma «partecipo ai un corso»: guarda la piccola parola prima di «un corso»."
      prompt: {text: "Partecipo ai un corso", tags: [articulated-preposition]}
    - learner: "Ai un corso... al un corso?"
      errors: [articulated-preposition]
    - tutor: "Partecipo a un corso, sì, è più semplice! E fuori dalla scuola, cosa avete fatto?"
      recast: {text: "ai un corso", fix: "a un corso", tags: [articulated-preposition]}
    # merlin-1395_0000409-5
    - learner: "L'insegnante ci ha consigliato dove possiamo mangiare bene."
    - tutor: "Un insegnante molto utile! E il tempo com'è stato? Qui piove da giorni."
      goals: [activities]
    - learner: "Ha fatto caldissimo, trentacinque gradi ogni giorno!"
    - tutor: "Che caldo! Siete andati almeno in piscina?"
      goals: [weather]
    # merlin-1325_9000138-3
    - learner: "Cercando un modo per rinfrescarci, siamo andati alla piscina del residence, che tra l'altro era l'offerta più attraente per noi, trovandola completamente sovraffolata."
      errors: [spelling]
    - tutor: "Che peccato! Ma «sovraffolata»: in questa parola manca una lettera."
      prompt: {text: "sovraffolata", tags: [spelling]}
    - learner: "Sovraffollata! C'erano più persone che acqua."
    - tutor: "Ah ah, ti capisco! E il momento più bello della settimana qual è stato?"
    - learner: "Sabato siamo andati ad Assisi con tutta la classe: è stato bellissimo."
    - tutor: "Assisi è magica! Mandami qualche foto, allora."
      goals: [best]

- scenario: film-libro
  level: B1
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai visto o letto questo mese?"
    # merlin-1395_0000387-7
    - learner: "La settimana scorsa abbiamo visto il musical \"Mamma mia\" a Milano; è stato molto divertente!"
    - tutor: "Un musical! Ci racconti la storia in due parole?"
    - learner: "Una ragazza vuole sapere chi è suo padre e invita tre uomini al suo matrimonio."
    - tutor: "Tre possibili padri allo stesso matrimonio, che storia! E com'è lei?"
      goals: [summary]
    - learner: "È allegra e coraggiosa. Sua madre ha un albergo in un'isola greca."
    - tutor: "Che posto da sogno! A chi consiglieresti lo spettacolo?"
      goals: [characters, opinion]
    - learner: "A tutti quelli che piace ballare e cantare."
      errors: [relative-pronoun]
    - tutor: "Bella idea! Ma «quelli che piace ballare»: a chi piace? Quale pronome ci vuole?"
      prompt: {text: "quelli che piace", tags: [relative-pronoun]}
    - learner: "A tutti quelli che piace cantare, sì."
      errors: [relative-pronoun]
    - tutor: "A tutti quelli a cui piace cantare? Allora lo consiglio subito a mia sorella!"
      recast: {text: "quelli che piace", fix: "quelli a cui piace", tags: [relative-pronoun]}
      goals: [recommend]
    # merlin-1365_0100227-13
    - learner: "Sì! E il prossimo mese guardiamo un film insieme. Che ne pensi?"
    - tutor: "Ottima idea, il film lo scegli tu!"

- scenario: film-libro
  level: B1
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Un giallo di Simenon. Un uomo sparisce e un commissario lo cerca a Parigi."
    - tutor: "Simenon, un classico! Chi è il personaggio principale?"
      goals: [summary]
    - learner: "Il commissario Maigret. È molto sensibile: non fa niente senza pensare."
      errors: [false-friend]
    - tutor: "Ah, Maigret è un uomo ragionevole, sì, molto calmo. E a te è piaciuto?"
      new: [{lemma: ragionevole, gloss: sensible}]
      recast: {text: "sensibile", fix: "ragionevole", tags: [false-friend]}
      goals: [characters]
    # merlin-1325_9000534-14
    - learner: "Penso che sia ottima."
    - tutor: "La storia, dici? E perché ti è piaciuta così tanto?"
    # merlin-1325_9000534-7
    - learner: "Parla di Parigi negli anni Trenta. Questo è molto importante per me!"
    - tutor: "Ah, hai un legame con Parigi?"
      goals: [opinion]
    - learner: "Mio padre lavorava lì in quegli anni, e mi raccontava molte storie."
    - tutor: "Allora capisco perché ti piace tanto! A chi consiglieresti il libro?"
    # merlin-1325_1001041-11
    - learner: "A tutti. È un po' vecchio, però non credo che vada male per i giovani."
    - tutor: "Hai ragione, i classici vanno bene per tutti. Lo metto nella lista del prossimo mese!"
      goals: [recommend]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Ho finito la carrera in economia a Siviglia l'anno scorso."
      errors: [word-choice]
    - tutor: "Ah, una laurea in economia, molto bene! E poi?"
      recast: {text: "carrera", fix: "laurea", tags: [word-choice]}
      new: [{lemma: laurea, gloss: degree}]
    # merlin-1325_1001155-1
    - learner: "Io sono neolaureata con un esame di ECDL, significa che conosco il computer, e anche il pacchetto Office."
    - tutor: "Molto utile. Ha già lavorato fuori dalla Spagna?"
      goals: [intro]
    # merlin-1325_1001113-0
    - learner: "Grazie alle mie conoscenze linguistiche (tedesco, inglese, francese) ho trovato un lavoro in Italia senza sapere la lingua nazionale."
    - tutor: "Senza parlare italiano, che coraggio! E adesso lo parla benissimo."
      goals: [experience]
    # merlin-1325_1001063-7
    - learner: "Grazie! Adesso parlo molto bene il francese, e l'italiano un po' meno."
    - tutor: "Lo parla molto bene anche lei! Quanto usa le lingue nel lavoro?"
    # merlin-1325_1001035-5
    - learner: "Per me l'uso delle lingue straniere è necessario ogni giorno."
    - tutor: "Da noi è lo stesso: i nostri clienti sono di tutta Europa. E nel tempo libero?"
      goals: [strengths]
    # merlin-1325_1001123-8
    - learner: "Secondariamente, uso queste lingue durante l'uso di Internet."
    - tutor: "Quindi le lingue sono la sua vita! Perché ha scelto proprio la nostra azienda?"
    - learner: "Perché lavorate con clienti di tutto il mondo e mi piace il design."
    - tutor: "Ottima risposta. Ha qualche domanda per me?"
      goals: [why]
    # merlin-1325_1001016-8
    - learner: "Quando posso sapere qualcosa? Sto aspettando la Sua risposta impazientemente."
    - tutor: "Le scriveremo entro venerdì, promesso!"
      goals: [questions]

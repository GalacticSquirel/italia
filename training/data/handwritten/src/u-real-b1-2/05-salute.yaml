# B1 real-learner set (round 6): a first session with a personal trainer; the GP; booking a visit.
- scenario: salute-stile-vita
  level: B1
  persona: es-f-erasmus
  history: [false-friend, articulated-preposition]
  turns:
    - tutor: "Ultimamente sei sempre al telefono! Come mai passi tanto tempo online?"
      new: [{lemma: online, gloss: on the internet}]
    # merlin-1325_9000554-4
    - learner: "En Friendscout24 ho avuto un acount per conoscere nuova gente."
      errors: [false-friend, spelling]
    - tutor: "Ah, un sito per conoscere gente! Ma «en Friendscout24»: «en» è una parola spagnola. Con un sito, in italiano, che preposizione usiamo?"
      prompt: {text: "En Friendscout24", tags: [false-friend]}
    - learner: "En Friendscout24, sì, ci vado ogni sera."
      errors: [false-friend]
    - tutor: "Su Friendscout24 ogni sera? È tanto! E hai conosciuto persone interessanti?"
      recast: {text: "En Friendscout24", fix: "Su Friendscout24", tags: [false-friend]}
      goals: [habits]
    # merlin-1325_1001130-2
    - learner: "La conoscenza con queste persone è buona, ma non è possibile dimenticare gli amici veri."
    - tutor: "Sono d'accordo, una chat non sostituisce un amico vero. E poi online non sai mai chi c'è dall'altra parte."
      new: [{lemma: chat, gloss: chat}, {lemma: online, gloss: on the internet}]
    # merlin-1325_9000323-5
    - learner: "Sul Chat si può dire qualcosa ma forse non è la verità!"
      errors: [articulated-preposition]
    - tutor: "Proprio così! Ma «sul chat»: con la parola «chat», che preposizione usiamo?"
      prompt: {text: "Sul Chat", tags: [articulated-preposition]}
    - learner: "In chat! In chat tutti sembrano più belli e più simpatici."
    - tutor: "Ah ah, è vero! Allora, cosa vuoi cambiare nei prossimi mesi?"
      goals: [obstacles]
    - learner: "Voglio usare il telefono meno di un'ora al giorno e uscire di più con gli amici."
    - tutor: "Ottimo obiettivo! Io farò lo stesso: ieri ho lasciato il telefono a casa tutto il giorno."
      goals: [goal, plan]
    # merlin-1365_0100125-2
    - learner: "Hai fatto bene."
    - tutor: "Sì, e mi sono sentita benissimo! Domani usciamo a camminare insieme, senza telefono?"

- scenario: salute-stile-vita
  level: B1
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1365_0100163-0
    - learner: "Ho molto da fare con il mio nuovo lavoro in banca."
    - tutor: "Un lavoro nuovo, bravo! E lo sport?"
    # merlin-1365_0100217-4
    - learner: "Niente. C'è sempre molto lavoro da fare."
    - tutor: "Capisco. E dormi abbastanza?"
    - learner: "Sei ore, forse. E bevo troppo caffè."
    - tutor: "Sei ore sono poche. Qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Fra un anno correrò la maratona di Roma con i miei colleghi."
    - tutor: "La maratona, che bella sfida! Quali sono i problemi più grandi per te?"
      goals: [goal]
      new: [{lemma: sfida, gloss: challenge}]
    - learner: "Il tempo, e la pigrizia. Ma da lunedì cominciarò a correre ogni mattina."
      errors: [future-form]
    - tutor: "Bravo! Ma «cominciarò»: prova a ripetere il futuro di «cominciare»."
      prompt: {text: "cominciarò", tags: [future-form]}
    - learner: "Comincerò. Comincerò a correre ogni mattina."
    - tutor: "Esatto! Allora il piano è questo: tre corse alla settimana, e il sabato una più lunga."
      goals: [obstacles]
    # merlin-1395_0001060-2
    - learner: "Va bene. Dopo un mese io sto benissimo!"
    - tutor: "Ne sono sicuro! Ci vediamo sabato alle otto al parco."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1365_0100163-1
    - learner: "Studio tutto il giorno per la maturità. Studio anche per l'esame di francese."
    - tutor: "Che periodo pieno! E il movimento?"
    - learner: "Cammino dieci minuti per andare a scuola, e basta. E mangio molti snack davanti al computer."
    - tutor: "Un po' poco, ma succede a chi studia tanto. Cosa vorresti cambiare?"
      goals: [habits]
    - learner: "Vorrei sentirmi meno stanca e dormire meglio."
    - tutor: "Ottimo obiettivo. Cosa ti impedisce di farlo adesso?"
      goals: [goal]
    # merlin-1365_0100476-2
    - learner: "Lo stress. Ma non penso che io lo superarò con il massimo dei voti anche se studio tutto il giorno."
      errors: [future-form]
    - tutor: "Lo supererai! Ma «superarò»: prova a ripetere il futuro di «superare»."
      prompt: {text: "superarò", tags: [future-form]}
    - learner: "Non penso che lo superarò bene."
      errors: [future-form]
    - tutor: "«Non lo supererò bene»: lo dicono tutti prima di un esame importante, e invece va sempre bene! Ora pensiamo allo stress."
      recast: {text: "superarò", fix: "supererò", tags: [future-form]}
      goals: [obstacles]
    # merlin-1365_0100476-7
    - learner: "Adesso devo continuare a studiare per il mio esame orale."
    - tutor: "Allora facciamo così: mezz'ora di camminata ogni giorno dopo pranzo, e il computer spento alle dieci."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1395_0000360-2
    - learner: "Ho cambiato il lavoro. Adesso lavoro di notte in un albergo."
    - tutor: "Lavorare di notte è difficile! Come dormi?"
    - learner: "Male. Dormo meno che prima, solo cinque ore."
      errors: [comparative]
    - tutor: "Cinque ore sono pochissime. Ma «meno che prima»: dopo «meno», qui quale parola usiamo?"
      prompt: {text: "meno che prima", tags: [comparative]}
    - learner: "Meno di prima!"
    - tutor: "Esatto. E fai sport?"
    # merlin-1325_1001013-2
    - learner: "In oltre sono una persona sportiva ma non ho potuto fare niente di sport quest'anno."
      errors: [word-choice, spelling]
    - tutor: "Peccato! Ma «niente di sport»: come diciamo meglio, con «nessuno»?"
      prompt: {text: "niente di sport", tags: [word-choice]}
    - learner: "Non ho potuto fare nessuno sport."
    - tutor: "Perfetto. Allora qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Tornare a giocare a calcio con l'equipo del quartiere."
      errors: [word-choice]
    - tutor: "Con la squadra del quartiere, bellissimo obiettivo! Cosa ti ferma, a parte il lavoro di notte?"
      recast: {text: "l'equipo", fix: "la squadra", tags: [word-choice]}
      goals: [goal]
    # merlin-1385_0001730-2
    - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarti."
    - tutor: "Allora niente giovedì. Facciamo lunedì e venerdì pomeriggio, prima del turno?"
      goals: [obstacles]
    # merlin-1365_0100225-9
    - learner: "Lunedì e venerdì alle quattro. Va bene così?"
    - tutor: "Va benissimo. E il sabato, se puoi, una partita con gli amici!"
      goals: [plan]

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [article-use, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di Lei: che lavoro fa adesso?"
    # merlin-1395_0000514-1
    - learner: "Al lavoro, faccio ancora il giurista, ma vorrei cambiare il professione."
      errors: [article-use]
    - tutor: "Interessante. Ma «cambiare il professione»: qui l'articolo serve davvero?"
      prompt: {text: "cambiare il professione", tags: [article-use]}
    - learner: "Vorrei cambiare professione, sì. Le lingue mi piacciono molto di più."
    - tutor: "Capisco. E che studi ha fatto?"
      goals: [intro]
    # merlin-1325_1001133-4
    - learner: "Nel 2004 ho ricevuto il mio diploma di maturità nel Liceo linguistico."
      errors: [articulated-preposition]
    - tutor: "Bene. Ma «il diploma nel liceo»: per una scuola, quale preposizione usiamo di solito?"
      prompt: {text: "nel Liceo linguistico", tags: [articulated-preposition]}
    - learner: "Nel liceo linguistico di Valencia, sì."
      errors: [articulated-preposition]
    - tutor: "Al liceo linguistico di Valencia, quindi parla bene anche l'inglese. Noi cerchiamo spesso interpreti per le riunioni con i clienti stranieri."
      new: [{lemma: interprete, gloss: interpreter}]
      recast: {text: "Nel liceo linguistico", fix: "Al liceo linguistico", tags: [articulated-preposition]}
      goals: [experience]
    # merlin-1325_9000684-6
    - learner: "Nel caso in cui siate alla ricerca d'interprete gradirei una eventuale collaborazione."
      errors: [article-use]
    - tutor: "Molto bene. Ma «alla ricerca d'interprete»: davanti a «interprete» manca una piccola parola."
      prompt: {text: "alla ricerca d'interprete", tags: [article-use]}
    - learner: "Alla ricerca di un interprete, scusi. Io sono libero da subito."
    - tutor: "Perfetto. Secondo Lei, oggi le lingue sono importanti nel mondo del lavoro?"
      goals: [strengths]
    # merlin-1325_1001132-4
    - learner: "E poi un paese ha bisogno dei rapporti internazionali, e così quegli uomini che parlano le lingue troveranno lavoro."
    - tutor: "Sono d'accordo con Lei. Ha portato i documenti dei suoi corsi di lingua?"
      goals: [why]
    # merlin-1325_1001167-7
    - learner: "Le accludo le copie dei certificati necessari."
    - tutor: "Grazie, li guardo con calma. Ha domande per me?"
    - learner: "Sì: quando posso sapere la vostra decisione?"
    - tutor: "Le faremo sapere entro venerdì, al telefono."
      goals: [questions]
    # merlin-1325_9000503-5
    - learner: "Grazie per l'attenzione riservatami."
    - tutor: "Grazie a Lei, e buona giornata!"

- scenario: medico-base
  level: B1
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Sono molto constipata: ho il naso chiuso e mi fa male la testa."
      errors: [false-friend]
    - tutor: "Ah, è molto raffreddata, capisco. Da quando ha questi sintomi?"
      recast: {text: "molto constipata", fix: "molto raffreddata", tags: [false-friend]}
      goals: [symptoms]
      new: [{lemma: raffreddato, gloss: having a cold}]
    # merlin-1385_0001717-2
    - learner: "Da tre giorni. Domani ho un esame all'università. Purtroppo devo andarci."
    - tutor: "Capisco. Prende qualcosa per il dolore?"
      goals: [since-when]
    - learner: "Sì, l'ho preso ieri sera, un'aspirina."
    - tutor: "Va bene. Ha qualche allergia?"
    - learner: "No, nessuna. Ma il mese scorso il dottore in Spagna mi ha dato una receta per gli antibiotici."
      errors: [false-friend]
    - tutor: "Ah, le ha dato una ricetta per gli antibiotici, ma ora non servono: è un virus. Basta riposo e acqua."
      recast: {text: "una receta", fix: "una ricetta", tags: [word-choice]}
      goals: [history]
    - learner: "Posso andare all'esame domani?"
    - tutor: "Sì, ma prenda una medicina per il dolore ogni otto ore e la sera vada a letto presto."
    - learner: "Allora una medicina ogni otto ore, e a letto presto."
    - tutor: "Perfetto. In bocca al lupo per l'esame!"
      goals: [instructions]

- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Ciao, quanto tempo! Come stai? Lavori ancora da casa o vai in ufficio?"
    # merlin-1365_0100474-0
    - learner: "Io sto bene. Lavoro da casa quattro giorni alla settimana."
    - tutor: "Quattro giorni, che fortuna! E il tuo capo è d'accordo?"
      goals: [situation]
    # merlin-1365_0100262-2
    - learner: "Sì. Ho già parlato con il mio capo, mi ha detto che posso prendere tre giorni di vacanze."
    - tutor: "Che capo gentile! Quindi a casa ti trovi bene?"
    - learner: "Sì, adesso ho più tempo: leggo molti magazzini e cucino."
      errors: [false-friend]
    - tutor: "Leggi molte riviste? Bello, io non ho mai tempo! E non ci sono svantaggi?"
      recast: {text: "molti magazzini", fix: "molte riviste", tags: [false-friend]}
      goals: [pros]
      new: [{lemma: rivista, gloss: magazine}]
    - learner: "Lo svantaggio è che a casa mangio di più che in ufficio."
    - tutor: "Succede anche a me! Io invece ho appena cambiato lavoro: sono diventato il capo del mio ufficio."
      goals: [cons]
    # merlin-1365_0100226-1
    - learner: "Sono contento per te."
    - tutor: "Grazie! Ma devo andare in ufficio tutti i giorni. Tu torneresti in ufficio?"
    - learner: "No, preferirei restare a casa. Ma vorrei una casa più grande, con un giardino."
    - tutor: "Ti capisco, un giardino è perfetto per lavorare all'aria aperta!"
      goals: [preference]
    # merlin-1395_0000398-4
    - learner: "E come stanno i tuoi?"
    - tutor: "Benissimo, grazie! Mia madre ti saluta sempre."
    # merlin-1365_0100267-8
    - learner: "Salutala da parte mia. Spero di avere presto tue notizie."
    - tutor: "Ci sentiamo presto, promesso!"

- scenario: prenotare-visita
  level: B1
  persona: es-m-worker
  history: [conditional-form]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno. Mi servirebbe una visita dall'oculista, ho problemi agli occhi."
    - tutor: "Certo, abbiamo un oculista il lunedì e il mercoledì. Quando preferisce?"
      goals: [type]
    # merlin-1365_0100079-2
    - learner: "Io voglio iniziare dal 3 luglio, prima lavoro sempre."
    - tutor: "Va bene, allora mercoledì cinque luglio alle nove e mezza?"
    - learner: "Alle nove e mezza non posso, entro al lavoro alle otto. Avete qualcosa nel pomeriggio?"
    - tutor: "Il pomeriggio abbiamo un posto alle diciassette e trenta, sempre mercoledì."
      goals: [availability]
    - learner: "Perfetto. Quanto costarebbe la visita?"
      errors: [conditional-form]
    - tutor: "Le dico subito. Ma «costarebbe»: prova a ripetere il condizionale di «costare»."
      prompt: {text: "costarebbe", tags: [conditional-form]}
    - learner: "Quanto costarebbe, scusi?"
      errors: [conditional-form]
    - tutor: "Quanto costerebbe? Settanta euro. Se ha l'impegnativa del medico, costa meno."
      recast: {text: "costarebbe", fix: "costerebbe", tags: [conditional-form]}
      goals: [cost]
      new: [{lemma: impegnativa, gloss: doctor's referral}]
    # merlin-1325_1001092-12
    - learner: "Potrebbe darmi un numero di telefono oppure posso parlare con Lei personalmente"
    - tutor: "Il numero è questo, ma può anche passare da noi. Allora: mercoledì cinque luglio, alle diciassette e trenta."
    - learner: "Mercoledì cinque, alle diciassette e trenta. Grazie mille!"
    - tutor: "A lei, arrivederci!"
      goals: [confirm]

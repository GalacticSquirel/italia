# B1 real-learner set (round 6): wedding news at Christmas lunch; friends comparing jobs; team meetings.
- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia il tacchino e si aprono i regali la mattina presto."
    - tutor: "Il tacchino, come nei film! Ah, ti devo dire una cosa: io e Marco ci sposiamo a maggio!"
      goals: [compare]
    # merlin-1365_0100175-1
    - learner: "Mi piace molto che avete deciso di sposare!"
      errors: [subjunctive-use, reflexive]
    - tutor: "Grazie! Ma «che avete deciso»: dopo «mi piace che», quale modo del verbo usiamo?"
      prompt: {text: "avete deciso", tags: [subjunctive-use]}
    - learner: "Mi piace molto che abbiate deciso di sposarvi!"
    - tutor: "Esatto, grazie! E tu sei invitata, naturalmente."
    # merlin-1365_0100200-4
    - learner: "Sono sicura che siete la coppia perfetta!"
    - tutor: "Che carina! Stiamo insieme da dieci anni, ormai. E tu, da bambina, come passavi il Natale?"
    - learner: "Andavamo tutti dai nonni in campagna e giocavamo nella neve con i cugini."
    - tutor: "Che bello, il Natale con la neve! Qui al sud non nevica quasi mai."
      goals: [past]
    # merlin-1365_0100201-3
    - learner: "Avrei ancora una piccola domanda; che cosa posso regalarvi?"
    - tutor: "In Italia si fa la lista di nozze. Gli sposi scelgono i regali in un negozio e gli invitati li comprano lì."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100134-5
    - learner: "È difficile trovare un regalo per voi. E per il pranzo di oggi, cosa porto?"
    - tutor: "Per oggi niente, solo il tuo sorriso! Al regalo ci pensi con calma."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la cena della vigilia è più importante del pranzo di Natale."
    - tutor: "Interessante! E da bambino, cosa facevate quella sera?"
      goals: [compare]
    - learner: "Andavamo dalla nonna. Mio nonno suonava la chitarra e tutti ballavono fino a tardi."
      errors: [imperfetto-form]
    - tutor: "Che bella festa! Ma «tutti ballavono»: prova a ripetere quel verbo."
      prompt: {text: "ballavono", tags: [imperfetto-form]}
    - learner: "Tutti ballavano!"
    - tutor: "Esatto. A proposito di feste: hai visto l'invito? Io e Marco ci sposiamo a giugno!"
      goals: [past]
    # merlin-1365_0100169-0
    - learner: "Ho ricevuto il vostro invito - mille grazie!"
    - tutor: "Allora è arrivato! Ero preoccupata, con la posta di dicembre."
    # merlin-1365_0100177-1
    - learner: "Voi andate veramente bene insieme!"
    - tutor: "Grazie, sei gentilissimo. Saremo in campagna, in una vecchia casa."
    # merlin-1365_0100262-6
    - learner: "Che cosa posso regalarvi?"
    - tutor: "In Italia di solito si fa la lista di nozze, ma molti sposi oggi preferiscono un aiuto per il viaggio."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100176-8
    - learner: "Oppure volete soldi e fiori? E oggi, che cosa porto per il pranzo?"
    - tutor: "I fiori no, ce ne sono già troppi! Per oggi porta solo un po' di vino, se vuoi."
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Ciao! Come va? Tu lavori ancora da casa o vai in ufficio?"
    # merlin-1395_0001090-1
    - learner: "Da me tutto va bene."
    - tutor: "Che bello sentirlo! E il lavoro?"
    # merlin-1365_0100211-8
    - learner: "Ogni giorno devo sviluppare altri sistemi informativi dunque è molto interessante."
    - tutor: "Che lavoro! E lo fai da casa o in ufficio?"
    - learner: "Tre giorni a casa e due in ufficio."
    - tutor: "Mi sembra giusto. E a casa come ti trovi?"
      goals: [situation]
    - learner: "Benissimo. A casa lavoro più veloce che i miei colleghi in ufficio."
      errors: [comparative]
    - tutor: "Ah sì? Ma «più veloce che i miei colleghi»: tra due persone, quale parola usiamo dopo «più»?"
      prompt: {text: "più veloce che i miei colleghi", tags: [comparative]}
    - learner: "Più veloce che loro, sì."
      errors: [comparative]
    - tutor: "Più veloce di loro? Che fortuna! E non c'è niente che non va, a casa?"
      recast: {text: "più veloce che loro", fix: "più veloce di loro", tags: [comparative]}
      goals: [pros]
    - learner: "Sì: sono sempre sola e a volte lavoro fino alle nove di sera."
    - tutor: "Eh, questo è il problema di tanti. Io invece sono in ufficio tutti i giorni, e vorrei stare a casa almeno un giorno."
      goals: [cons]
    # merlin-1365_0100061-2
    - learner: "Se io avessi la possibilità, lo deciderei anch'io!"
    - tutor: "Quindi anche tu preferiresti stare a casa tutta la settimana?"
    - learner: "No, preferisco così: tre e due. È la soluzione migliore."
    - tutor: "Hai ragione, il giusto mezzo! Ne parlo con il mio capo lunedì."
      goals: [preference]
    # merlin-1365_0100212-11
    - learner: "Fammi sapere allora per il lavoro."
    - tutor: "Ti faccio sapere, promesso!"

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    # merlin-1365_0100226-10
    - learner: "Mi sono licenziato ed ora lavoro in proprio."
    - tutor: "Davvero? Che coraggio! E di cosa ti occupi?"
    # merlin-1365_0100212-6
    - learner: "Adesso ti spiego un po' che cosa si fa dove lavoro io."
    - tutor: "Dai, racconta! Lavori sempre da casa? E quali sono i vantaggi?"
      goals: [situation]
    # merlin-1365_0100479-7
    - learner: "Puoi lavorare tardi."
    - tutor: "E la mattina dormi, giusto? Sai che ci penso anch'io? Ma devo preparare un sacco di documenti per il mio capo."
      goals: [pros]
    # merlin-1365_0100223-11
    - learner: "Ti consiglio di priparare i tuoi documenti, così le potrai mandare rapidamente."
      errors: [object-pronoun, spelling]
    - tutor: "Buon consiglio! Ma «le potrai mandare»: «i documenti» sono maschili o femminili?"
      prompt: {text: "le potrai mandare", tags: [object-pronoun]}
    - learner: "Maschili: li potrai mandare rapidamente."
    - tutor: "Esatto. E gli svantaggi di lavorare da solo?"
    - learner: "Sono sempre solo, e a veces lavoro anche la domenica."
      errors: [word-choice]
    - tutor: "A volte anche la domenica? Eh, la libertà ha un prezzo. Ma torneresti in ufficio?"
      recast: {text: "a veces", fix: "a volte", tags: [word-choice]}
      goals: [cons]
    - learner: "Mai! Preferisco così: sono più libero di prima."
    - tutor: "Allora hai fatto la scelta giusta. Alla salute del tuo lavoro nuovo!"
      goals: [preference]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  history: [preposition, conditional-form]
  turns:
    - tutor: "Indovina? Ho superato la maturità con cento su cento!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100223-1
    - learner: "Me ne avevi parlato l'ultima volta che ci siamo incontrati, ma non pensavo di sentirti con una buona notizia così velocemente!"
    - tutor: "Grazie! Adesso però non so cosa fare: università subito o un anno all'estero?"
      new: [{lemma: estero, gloss: abroad}]
      goals: [plans]
    # merlin-1365_0100227-9
    - learner: "Credo che sia una buona idea di trovarti un lavoro prima degli studi universitari, sono convinta che gli studi siano la cosa giusta per te."
    - tutor: "Un lavoro in un altro paese, magari! Pensavo alla Germania: il tedesco mi piace tantissimo."
    # merlin-1365_0100478-3
    - learner: "Puoi viaggiare a Germania per studiare tedesco, perchè sei così interessti in altre lingue."
      errors: [preposition, article-use, spelling]
    - tutor: "Esatto! Ma «viaggiare a Germania»: con il nome di un paese, che preposizione usiamo?"
      prompt: {text: "a Germania", tags: [preposition]}
    - learner: "In Germania! Puoi andare a Berlino o a Monaco."
    - tutor: "Berlino mi piace di più. Però mia madre vuole che io vada subito all'università."
      goals: [advice]
    # merlin-1365_0100071-3
    - learner: "Al posto tuo studiarei le lingue."
      errors: [conditional-form]
    - tutor: "Anche secondo me! Ma «studiarei»: come fa il condizionale di «studiare»?"
      prompt: {text: "studiarei", tags: [conditional-form]}
    - learner: "Io studiarei tedesco e inglese, sono le più utili."
      errors: [conditional-form]
    - tutor: "Anch'io studierei tedesco e inglese, hai ragione. E per andare a Berlino, meglio il treno o l'aereo?"
      recast: {text: "studiarei", fix: "studierei", tags: [conditional-form]}
    - learner: "L'aereo è più veloce, ma il treno costa meno e vedi le Alpi."
    - tutor: "Allora treno! Mi aiuti anche a scrivere il curriculum in tedesco?"
      new: [{lemma: curriculum, gloss: CV}]
      goals: [transport]
    # merlin-1365_0100451-10
    - learner: "Basta mandarmi via mail il tuo curriculum."
    - tutor: "Te lo mando stasera. Sei un'amica fantastica!"

- scenario: vacanze-passate
  level: B1
  persona: es-f-teacher
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000515-0
    - learner: "Ciao Elena, come stai? Io sono stata a Siena, a un corso di italiano con mia sorella."
    - tutor: "Io bene, grazie! Siena, che bello! Perché proprio un corso?"
      goals: [where]
    # merlin-1395_0001145-3
    - learner: "In Polonia abbiamo cominciato a studiare la lingua italiana perciò qui abbiamo scelto il corso di italiano."
    - tutor: "Ottima idea! E com'era il tempo in Toscana?"
    - learner: "Caldo, ma la sera c'era sempre un po' di vento."
    - tutor: "Perfetto per uscire la sera! E il corso com'era?"
      goals: [weather]
    # merlin-1395_0001010-2
    - learner: "L'insegnante si chiamava Laura. Lei è molto brava e fa il corso molto strutturato."
      errors: [article-use]
    - tutor: "Che fortuna! Ma «fa il corso molto strutturato»: è un corso tra tanti, quindi quale articolo?"
      prompt: {text: "fa il corso", tags: [article-use]}
    - learner: "Fa il corso molto strutturato, sì, con tanti esercizi."
      errors: [article-use]
    - tutor: "Fa un corso molto strutturato, quindi avete imparato tanto! E gli altri studenti?"
      recast: {text: "fa il corso", fix: "fa un corso", tags: [article-use]}
      goals: [activities]
    # merlin-1395_0000409-1
    - learner: "Il livello non è alto. Ma i participanti e anche l'insegnante sono bellissimi persone."
      errors: [adjective-agreement, spelling]
    - tutor: "Che bello! Ma «bellissimi persone»: «persone» è femminile, quindi?"
      prompt: {text: "bellissimi persone", tags: [adjective-agreement]}
    - learner: "Bellissime persone! La cosa più bella era la cena con tutti, l'ultima sera."
    - tutor: "Esatto. Una cena tutti insieme è il ricordo più bello di un corso!"
      goals: [best]
    # merlin-1395_0001119-4
    - learner: "Come sta la tua famiglia?"
    - tutor: "Tutti bene, grazie! Mia madre chiede sempre di te."

- scenario: riunione-lavoro
  level: B1
  persona: es-f-erasmus
  history: [future-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Bene. Abbiamo finito la prima parte del sito per il cliente di Torino."
    - tutor: "Ottimo! E ci sono problemi?"
      goals: [update]
    - learner: "Sì, il cliente vuole cambiare i colori. Così perdiamo una settimana."
    - tutor: "Capisco, è un ritardo importante. Come possiamo risolverlo?"
      goals: [problem]
    # merlin-1325_1001045-4
    - learner: "Consiglio di fare due cose."
    - tutor: "Sentiamo!"
    - learner: "Prima chiamiamo il cliente, poi io lavorarò anche il sabato."
      errors: [future-form]
    - tutor: "Che bravo! Ma «lavorarò»: prova a ripetere il futuro di «lavorare»."
      prompt: {text: "lavorarò", tags: [future-form]}
    - learner: "Lavorerò anche il sabato."
    - tutor: "Esatto. Ma il sabato no, troviamo un'altra soluzione."
      goals: [proposal]
    # merlin-1365_0100071-12
    - learner: "Che ne pensi? Possiamo chiedere aiuto a Luca?"
    - tutor: "Ottima idea, Luca ha tempo questa settimana. Allora consegniamo venerdì prossimo?"
    # merlin-1365_0100455-14
    - learner: "Va bene. Ti darò notizie al più presto."
    - tutor: "Perfetto: venerdì prossimo è la scadenza. Grazie a tutti!"
      goals: [deadline]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [verb-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia l'agnello e poi si gioca a carte fino a tardi."
    - tutor: "L'agnello a Natale, interessante! Ah, a proposito: hai ricevuto l'invito al matrimonio mio e di Marco?"
      goals: [compare]
    # merlin-1365_0100213-2
    - learner: "Sì! Vi ringrazio dell'invito."
    - tutor: "Figurati, ci teniamo tanto ad averti con noi!"
    # merlin-1365_0100182-1
    - learner: "Finalmente avete deciso che volete vivere insieme come moglie e marito."
    - tutor: "Eh sì, dopo otto anni! Mia madre non ci credeva più."
    # merlin-1365_0100215-4
    - learner: "Ci fareste sapere che cosa desiderete?"
      errors: [verb-form]
    - tutor: "Per il regalo? Ma «desiderete»: prova a ripetere quel verbo."
      prompt: {text: "desiderete", tags: [verb-form]}
    - learner: "Che cosa desiderate?"
    - tutor: "Esatto. In Italia si fa la lista di nozze: scegliamo i regali in un negozio e voi li comprate lì."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100169-5
    - learner: "Va bene. Sarò nella chiesa alle 17.00."
    - tutor: "Perfetto, ma arriva un po' prima! E da bambino, a Natale, cosa facevate?"
    - learner: "Andavamo dai nonni in montagna e aprivamo i regali a mezzanotte."
    - tutor: "A mezzanotte, che emozione per un bambino!"
      goals: [past]
      new: [{lemma: mezzanotte, gloss: midnight}]
    - learner: "E oggi, per il pranzo, che cosa porto?"
    - tutor: "Niente, davvero! Se vuoi, un po' di vino rosso."
      goals: [plan]
    # merlin-1365_0100177-9
    - learner: "Il vostro matrimonio mi piace molto!"
    - tutor: "Grazie, sarà una bellissima festa!"

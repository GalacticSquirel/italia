# B1 real-learner set (round 6): catching up with friends, helping a friend find work, hotel complaints.
- scenario: tradizioni-feste
  level: B1
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia molto anche, ma il pranzo è più corto: due ore, non cinque!"
    - tutor: "Cinque ore, sì, da noi è normale! E da piccolo cosa facevi a Natale?"
      goals: [compare]
    - learner: "Cantavamo davanti alle case dei vicini e loro ci davano i biscotti."
    - tutor: "Che bella tradizione! Ah, lo sai? Io e Marco ci sposiamo a novembre, e tu sei invitato."
      goals: [past]
    # merlin-1365_0100262-1
    - learner: "Vi ringrazio dell'invito al vostro matrimonio."
    - tutor: "Ci teniamo tanto! Sarà una festa piccola, in un ristorante in campagna."
    # merlin-1365_0100176-6
    - learner: "Io anche non so, che cosa posso regalare."
      errors: [word-order]
    - tutor: "Non preoccuparti! Ma «io anche non so»: con «non», come diciamo «anche io»?"
      prompt: {text: "Io anche non so", tags: [word-order]}
    - learner: "Neanch'io so cosa regalare."
    - tutor: "Esatto. Non è facile, lo so!"
    # merlin-1365_0100095-2
    - learner: "Avete una lista di Noci, o alcuni idee per un regalo?"
      errors: [word-choice, adjective-agreement]
    - tutor: "Una lista di... noci? Le noci si mangiano! Come si chiama la lista degli sposi?"
      prompt: {text: "lista di Noci", tags: [word-choice]}
    - learner: "Una lista di nozze!"
    - tutor: "Esatto, in Italia la fanno quasi tutti: è in un negozio in centro."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100203-3
    - learner: "Perfetto. Ma non credo che arriverò al ristorante. Perché ho già un altro appuntamento."
    - tutor: "Peccato! Allora vieni almeno in chiesa? E per il pranzo di oggi, porta solo te stesso."
      goals: [plan]
    # merlin-1365_0100184-4
    - learner: "Certo, in chiesa vengo. Ci vediamo in Novembre!"
    - tutor: "Ci vediamo prima, a Capodanno! Ma adesso, buon appetito!"

- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io sto cercando lavoro, adesso che ho finito la scuola."
    # merlin-1365_0100226-2
    - learner: "Posso aiutarti a trovare un lavoro."
    - tutor: "Davvero? Grazie! Ma prima dimmi di te: sei ancora in banca?"
    - learner: "Sì, ma lavoro quasi sempre da casa. In ufficio vado solo il lunedì."
    - tutor: "E ti piace così?"
      goals: [situation]
    - learner: "Sì, molto: niente traffico, niente rumore. Ma mi mancano i colleghi e il caffè insieme alle undici."
    - tutor: "Il caffè con i colleghi è importante! Allora, mi aiuti davvero con il lavoro?"
      goals: [pros, cons]
    # merlin-1365_0100229-7
    - learner: "Forse puoi mandarmi il tuo curriculum."
    - tutor: "Te lo mando stasera! Secondo te è meglio lavorare un po' prima dell'università?"
    # merlin-1365_0100457-0
    - learner: "Al tuo posto continuerei studiare le lingue all'università."
      errors: [preposition]
    - tutor: "Interessante! Ma «continuerei studiare»: tra i due verbi manca qualcosa?"
      prompt: {text: "continuerei studiare", tags: [preposition]}
    - learner: "Continuerei studiare, sì, all'università."
      errors: [preposition]
    - tutor: "Continuerei a studiare anch'io, hai ragione. E tu, se potessi, torneresti in ufficio tutti i giorni?"
      recast: {text: "continuerei studiare", fix: "continuerei a studiare", tags: [preposition]}
    - learner: "No, mai! Preferisco la mia cucina al mio vecchio ufficio."
    - tutor: "Ti capisco benissimo!"
      goals: [preference]

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000551-0
    - learner: "Io sto molto bene! Sono stata in Ungheria, a Budapest, con mia sorella."
    - tutor: "Budapest, che bello! Che tempo avete trovato?"
      goals: [where]
    - learner: "Faceva molto caldo, trentacinque gradi ogni giorno."
    - tutor: "Che caldo! E cosa avete fatto?"
      goals: [weather]
    # merlin-1325_1001125-3
    - learner: "Abbiamo fatto le terme e una scuola di lingua. Con l'aiuta della lingua straniera si può conoscere la gente straniera e i costumi di un'altra paese."
      errors: [noun-gender, spelling]
    - tutor: "È verissimo! Ma «un'altra paese»: «paese» è maschile o femminile?"
      prompt: {text: "un'altra paese", tags: [noun-gender]}
    - learner: "Maschile: un altro paese."
    - tutor: "Esatto. E qual è la cosa che ti è piaciuta di più?"
      goals: [activities]
    - learner: "Una sera abbiamo visto un'opera al teatro; è stato molto divertido!"
      errors: [word-choice]
    - tutor: "Molto divertente, l'opera? Che serata! Ma come stanno i tuoi? Non li vedo da tanto."
      recast: {text: "divertido", fix: "divertente", tags: [word-choice]}
      goals: [best]
    # merlin-1395_0000387-2
    - learner: "Anche la mia famiglia sta bene. E come stanno i tuoi?"
    - tutor: "Bene, grazie! Mia madre ti saluta tanto."
    # merlin-1395_0000365-8
    - learner: "Quando ci vediamo, devi raccontare tutto."
    - tutor: "Promesso: sabato a cena da me, e mi racconti anche di Budapest con le foto!"

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [article-use]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000376-0
    - learner: "Ciao Elena, come stai? Noi siamo stati in Sardegna, in campeggio."
    - tutor: "Benissimo, grazie! In campeggio in Sardegna, che bello! Com'era il tempo?"
      goals: [where]
    # merlin-1395_0000557-2
    - learner: "Sempre sole. Mia moglie ed io stiamo abbastanza bene, ma siamo un po' bruciati."
    - tutor: "Ah ah, il sole in Sardegna è forte! Cosa avete fatto, oltre al mare?"
      goals: [weather]
    # merlin-1325_9000302-8
    - learner: "Niente. Per due settimane non abbiamo potuto organizzare nessuna la gita."
      errors: [article-use]
    - tutor: "Nessuna gita, peccato! Ma «nessuna la gita»: con «nessuna», ci vuole l'articolo?"
      prompt: {text: "nessuna la gita", tags: [article-use]}
    - learner: "Nessuna gita, niente."
    - tutor: "Esatto. Ma una vacanza solo al mare non è male!"
    # merlin-1325_9000316-16
    - learner: "Le vacanze costano molto, ma non sono contento."
    - tutor: "Davvero? Non ti è piaciuto niente?"
      goals: [activities]
    - learner: "Il campeggio era molto rumoroso, ma la spiaggia era bellissima, la più bella che ho mai visto."
    - tutor: "Almeno quella! Le spiagge della Sardegna sono famose in tutto il mondo."
      goals: [best]
    # merlin-1395_0000449-3
    - learner: "Allora, come va il lavoro?"
    - tutor: "Tutto bene, tanto lavoro come sempre. Ne parliamo davanti a un caffè?"

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [verb-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001009-0
    - learner: "Buonasera. Il numero del nostro appartamento è 19."
    - tutor: "Sì, l'appartamento diciannove. Che cosa succede?"
    # merlin-1325_1001024-6
    - learner: "Il residence era vecchio, non funzionava il rubinetto, e neanche l'aria condizionata."
    - tutor: "Mi dispiace molto. Da quando avete questi problemi?"
      goals: [problem]
    - learner: "Da ieri sera. Abbiamo chiamato la ricezione due volte, ma nessuno è venuto."
      errors: [false-friend]
    - tutor: "Le chiedo scusa: la sera alla reception c'è poco personale. Con chi ha parlato?"
      recast: {text: "la ricezione", fix: "la reception", tags: [false-friend]}
      new: [{lemma: reception, gloss: hotel front desk}]
      goals: [since]
    # merlin-1325_9000214-4
    - learner: "Anche l'aria condizionata non funzionava e il receptionist è stato molto scortese."
    - tutor: "Questo non va bene, parlerò con lui domani. Cosa possiamo fare per voi?"
    # merlin-1325_9000316-21
    - learner: "Vogli dirVi che vorrei solo i miei soldi."
      errors: [verb-form]
    - tutor: "Capisco. Ma «vogli dirvi»: prova a ripetere il verbo «volere»."
      prompt: {text: "Vogli dirVi", tags: [verb-form]}
    - learner: "Voglio dirvi che vorrei un rimborso."
    - tutor: "Esatto. Posso offrirvi un altro appartamento, nuovo, e uno sconto per le notti passate."
      goals: [request]
      new: [{lemma: sconto, gloss: discount}]
    # merlin-1325_9000214-6
    - learner: "Un quarto del prezzo totale mi sembra adeguato."
    - tutor: "Va bene, il venticinque per cento. Vi preparo subito l'appartamento ventidue."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-m-worker
  history: [article-use]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Sì. In camera fa un caldo terribile: l'aria condizionata è rotta."
    - tutor: "Mi dispiace. Da quando non funziona?"
      goals: [problem]
    - learner: "Da tre giorni. L'ho detto anche ieri alla ragazza della reception."
    - tutor: "Le chiedo scusa, possono ripararla solo domani mattina."
      goals: [since]
    # merlin-1325_9000136-4
    - learner: "Oltre a ciò non c'era la possibilità di fare un altro sport."
    - tutor: "Lo sport? Ah, la piscina, è chiusa per lavori, purtroppo. Cosa le posso proporre?"
    # merlin-1325_9000674-9
    - learner: "A mio parere 30 % del prezzo pagato all'inizio sarebbe sufficiente per me."
      errors: [article-use]
    - tutor: "Il trenta per cento? Ma «a mio parere 30 %»: davanti a «30 %», manca qualcosa?"
      prompt: {text: "30 %", tags: [article-use]}
    - learner: "A mio parere il 30 % è sufficiente."
    - tutor: "Esatto. Posso darle il venti per cento e, già stanotte, una camera con l'aria condizionata nuova."
      goals: [request]
    # merlin-1365_0100475-20
    - learner: "Va bene. Spero che la camera sia ancora libera."
    - tutor: "Sì, è libera: la trecentodue. Le do subito la chiave."
      goals: [agree]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [adjective-agreement]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si va in chiesa la notte e il giorno dopo si mangia tutti insieme."
    - tutor: "Come qui, allora! E da bambina cosa ti piaceva di più?"
      goals: [compare]
    - learner: "Il ventiquattro sera aspettavo Babbo Natale e non dormivo mai."
    - tutor: "Che dolce! A proposito, lo sai? Io e Davide ci sposiamo a giugno!"
      goals: [past]
    # merlin-1365_0100183-14
    - learner: "Ancora molti congratulazioni!"
      errors: [adjective-agreement]
    - tutor: "Grazie! Ma «molti congratulazioni»: «congratulazioni» è maschile o femminile?"
      prompt: {text: "molti congratulazioni", tags: [adjective-agreement]}
    - learner: "Molte congratulazioni!"
    - tutor: "Esatto, grazie mille! Ci sarai, vero?"
    # merlin-1365_0100261-6
    - learner: "Certo! Non vedo l'ora di vederti al tuo matrimonio."
    - tutor: "Anch'io! Faremo una festa in campagna, all'aperto."
    # merlin-1365_0100289-8
    - learner: "C'è una cosa che manca nella casa o nella vita?"
    - tutor: "Nella vita niente! Per la casa, in Italia si fa la lista di nozze: si sceglie tutto in un negozio."
      goals: [ask]
      new: [{lemma: nozze, gloss: wedding}]
    # merlin-1365_0100289-1
    - learner: "Sole, amore, salute per tutta la vita. E oggi, cosa posso portare per il pranzo?"
    - tutor: "Che bell'augurio! Per oggi porta solo una bottiglia di vino bianco."
      goals: [plan]

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1365_0100258-2
    - learner: "Sabato. Vengo con il treno e arrivo alla stazione a mezzogiorno."
    - tutor: "Perfetto, vengo a prenderti io! Vieni da solo?"
    # merlin-1395_0000446-5
    - learner: "No, con il corso di italiano. C'sono dieci persone in mio gruppo, ma di Polonia sono solo io."
      errors: [ce-ci-sono, articulated-preposition]
    - tutor: "Un bel gruppo! Ma «in mio gruppo»: tra «in» e «mio» manca qualcosa?"
      prompt: {text: "in mio gruppo", tags: [articulated-preposition]}
    - learner: "Nel mio gruppo."
    - tutor: "Esatto. E perché avete scelto proprio Napoli?"
      goals: [plans]
    # merlin-1365_0100148-6
    - learner: "Penso che sia molto interessante fare conoscenza con diverse culture."
    - tutor: "Allora Napoli ti piacerà: è una città piena di storia e di gente diversa."
    # merlin-1385_0001757-3
    - learner: "Hai tempo sabato sera?"
    - tutor: "Per te sempre! Ti porto a mangiare la pizza più buona della città."
      goals: [advice]
    # merlin-1365_0100278-3
    - learner: "Un buon amico nostro, ha un ristorante a Napoli."
    - tutor: "Davvero? Allora domenica andiamo da lui! E per muoverti, prendi la metro: è comoda e veloce."
      goals: [transport]
    - learner: "C'è qualcosa che non devo fare?"
    - tutor: "Non lasciare il telefono sul tavolo al bar, e la sera non prendere strade buie da solo."
      goals: [warnings]
    # merlin-1365_0100163-11
    - learner: "Va bene. Così potremo anche rivederci."
    - tutor: "Finalmente! Ti aspetto sabato al binario."

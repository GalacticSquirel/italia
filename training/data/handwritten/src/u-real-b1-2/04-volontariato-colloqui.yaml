# B1 real-learner set (round 6): an open day at a volunteering association; two job interviews.
- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000304-2
    - learner: "Sì! Vorrei offrire subito il mio aiuto."
    - tutor: "Che bello sentirlo! Raccontami un po' di te: perché vuoi fare volontariato?"
    # merlin-1325_9000296-1
    - learner: "Mi piace aiutare alle persone che arrivano dai poveri paesi."
      errors: [articulated-preposition, word-order]
    - tutor: "È un motivo bellissimo. Ma «aiutare alle persone»: aiutare qualcuno... serve davvero quell'«alle»?"
      prompt: {text: "aiutare alle persone", tags: [articulated-preposition]}
    - learner: "Sì, aiutare alle persone che non hanno niente."
      errors: [articulated-preposition]
    - tutor: "Capisco, aiutare le persone che non hanno niente. Qui ne arrivano tante ogni settimana. Cosa sai fare?"
      recast: {text: "aiutare alle persone", fix: "aiutare le persone", tags: [articulated-preposition]}
      goals: [motivation]
    # merlin-1325_1001027-8
    - learner: "Posso comunicare bene con la gente."
    - tutor: "Questo qui è molto importante. Parli altre lingue, oltre allo spagnolo e all'italiano?"
    # merlin-1325_9000684-1
    - learner: "Conosco anche la lingua inglese."
    - tutor: "Perfetto, tre lingue sono preziose per noi. Quanto tempo hai?"
      goals: [skills]
    # merlin-1325_9000137-7
    - learner: "Posso aiutarvi dal 29 luglio al 29 agosto."
    - tutor: "Un mese intero, fantastico! Preferisci l'ufficio informazioni o il corso di italiano per le famiglie?"
      goals: [time]
    - learner: "L'ufficio informazioni, perché mi piace parlare con la gente e ascoltare le sue storie."
    - tutor: "Allora ti scrivo per l'ufficio informazioni. Ti aspettiamo il ventinove!"
      goals: [choose]
    # merlin-1365_0100451-11
    - learner: "Spero di sentirti presto."
    - tutor: "Ti chiamo la settimana prossima per i dettagli!"

- scenario: volontariato
  level: B1
  persona: en-m-traveller
  history: [article-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001093-0
    - learner: "Sì. Sono un studente che vuole lavorare da voi."
      errors: [article-form]
    - tutor: "Benvenuto! Ma «un studente»: davanti a «studente», quale articolo usiamo?"
      prompt: {text: "un studente", tags: [article-form]}
    - learner: "Uno studente! Studio medicina a Bologna."
    - tutor: "Esatto. Medicina, interessante! E perché vuoi fare volontariato?"
    # merlin-1365_0100480-2
    - learner: "Il prossimo anno finisco l'università. Così ho bisogno di pensare al futuro."
    - tutor: "Capisco, e vuoi fare qualcosa di utile adesso. Cosa sai fare bene?"
      goals: [motivation]
    # merlin-1325_1001088-7
    - learner: "E posso guidare molto bene."
    - tutor: "Ottimo! Ci serve proprio qualcuno per portare gli anziani alle visite mediche. Hai altre esperienze?"
    # merlin-1325_9000186-4
    - learner: "L'ultima esperienza in un campo di lavoro l'ho fatta due mesi fa."
    - tutor: "Allora sai già come funziona! Quanto tempo puoi darci?"
      goals: [skills]
    # merlin-1395_0001090-4
    - learner: "Il martedì e il giovedì non ho lezioni. Così ho molto tempo libero."
    - tutor: "Due giorni a settimana vanno benissimo. Allora, accompagni gli anziani con il nostro pulmino?"
      goals: [time]
      new: [{lemma: pulmino, gloss: minibus}]
    - learner: "Sì, va bene. Sono molto eccitato di cominciare!"
      errors: [false-friend]
    - tutor: "Sei molto emozionato? Che bello, anche noi! Ti aspetto martedì alle nove."
      recast: {text: "molto eccitato", fix: "molto emozionato", tags: [false-friend]}
      new: [{lemma: emozionato, gloss: excited}]
      goals: [choose]
    # merlin-1365_0100458-7
    - learner: "Posso portare anche un amico. Che ne dici?"
    - tutor: "Certo, più siamo e meglio è!"

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001014-1
    - learner: "Prima, vorrei presentarmi: mi chiamo Hannah e ho 19 anni."
    - tutor: "Ciao Hannah, piacere! Perché vuoi fare volontariato?"
    # merlin-1365_0100120-4
    - learner: "So che adesso è un periodo brutto per l'economia del paese, ma davvero ho bisogno di fare qualcosa subito."
    - tutor: "Ti capisco, e ogni aiuto conta. Cosa ti piace fare?"
      goals: [motivation]
    # merlin-1325_1001095-4
    - learner: "Mi piace organizzare le feste e i programmi."
    - tutor: "Perfetto per noi! Organizziamo spesso pomeriggi di giochi per i bambini del quartiere."
    - learner: "Ho lavorato con i bambini in una libreria, a Londra, ogni sabato."
      errors: [false-friend]
    - tutor: "In una biblioteca? Che bello, leggevi le storie ai bambini? Allora hai esperienza!"
      recast: {text: "una libreria", fix: "una biblioteca", tags: [false-friend]}
      new: [{lemma: biblioteca, gloss: library}]
      goals: [skills]
    # merlin-1325_1001016-5
    - learner: "Adesso lavoro presso una ditta e nel mio ex università, ma sono in vacanza dal 15 agosto al 31 agosto, allora in questo periodo posso aiutarvi."
      errors: [noun-gender]
    - tutor: "Benissimo, due settimane. Ma «nel mio ex università»: «università» è maschile o femminile?"
      prompt: {text: "nel mio ex università", tags: [noun-gender]}
    - learner: "Femminile: nella mia ex università."
    - tutor: "Esatto! Allora ti metto nel gruppo dei giochi per i bambini, dal quindici agosto?"
      goals: [time]
    - learner: "Sì, perfetto. Posso portare anche la mia chitarra?"
    - tutor: "Certo, ai bambini piacerà tantissimo! A presto, Hannah."
      goals: [choose]
    # merlin-1365_0100061-10
    - learner: "Ci sentiamo via e-mail!"
    - tutor: "Certo, ti scrivo stasera!"

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001016-1
    - learner: "Sì. Ho 24 anni."
    - tutor: "Bene! E perché vuoi aiutarci?"
    # merlin-1325_1001021-6
    - learner: "D'altra parte, sono sicuro che i campi estivi sarebbero ideali per me, perché una volta lavoravo in un campo di questo tipo."
    - tutor: "Allora conosci già i campi estivi! Che cosa facevi lì?"
      goals: [motivation]
    # merlin-1325_1001088-1
    - learner: "Cucinavo per tutti. Amo lavorare di persone e voglio lavorare in buona brigata."
      errors: [preposition, article-use]
    - tutor: "Un cuoco, che fortuna per noi! Ma «lavorare di persone»: si lavora... «di» qualcuno?"
      prompt: {text: "lavorare di persone", tags: [preposition]}
    - learner: "Lavorare con le persone!"
    - tutor: "Esatto. E in cucina con noi non lavori mai solo, te lo prometto. Quando sei libero?"
      goals: [skills]
    # merlin-1325_1001014-3
    - learner: "Sarò libero dal luglio al agosto."
      errors: [articulated-preposition]
    - tutor: "Due mesi, ottimo! Ma «dal luglio al agosto»: con i mesi, ci vuole l'articolo?"
      prompt: {text: "dal luglio al agosto", tags: [articulated-preposition]}
    - learner: "Dal luglio ad agosto."
      errors: [articulated-preposition]
    - tutor: "Da luglio ad agosto, perfetto, è proprio il periodo dei campi! Preferisci il campo al mare o quello in montagna?"
      recast: {text: "Dal luglio", fix: "Da luglio", tags: [articulated-preposition]}
      goals: [time]
    - learner: "Al mare, sicuramente. Amo il sole."
    - tutor: "Allora il mare è perfetto per te! Ti scrivo per il campo di luglio a Rimini."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001027-1
    - learner: "Sì, molto. Ho ventidue anni."
    - tutor: "Benvenuta! Cosa ti porta qui?"
    # merlin-1325_9000685-2
    - learner: "Dopo la laurea ho fatto il Servizio Volontario Europeo lavorando per il periodo di nove mesi presso il Comune di Torino dove ho avuto la possibilità di sviluppare di più la mia capacità di usare la lingua italiana."
    - tutor: "Nove mesi a Torino, ecco perché parli così bene! E adesso vuoi continuare con il volontariato?"
    # merlin-1325_1001076-2
    - learner: "Sì. Quindi questa sarebbe una grande possibilità per me."
    - tutor: "Anche per noi! Cosa hai fatto a Torino, di preciso?"
      goals: [motivation]
    # merlin-1325_9000317-2
    - learner: "Lavoravo in un ufficio per i giovani. Lì ho raccolto diverse esperienze lavorative."
    - tutor: "Ottimo. Qui abbiamo bisogno di qualcuno per l'ufficio e per il sito. Te la cavi con il computer?"
      goals: [skills]
    # merlin-1365_0100080-1
    - learner: "Sì. Sarà possibile da andarci dal 15 luglio al 14 agosto?"
      errors: [preposition]
    - tutor: "Andare al campo, intendi? Ma «possibile da andarci»: dopo «possibile», serve quel «da»?"
      prompt: {text: "possibile da andarci", tags: [preposition]}
    - learner: "Sarà possibile andarci?"
    - tutor: "Esatto, e sì, è possibile! Il campo è proprio dal quindici luglio."
      goals: [time]
    - learner: "Allora preferisco il campo e non l'ufficio. Ho preso una decisione!"
    - tutor: "Benissimo, ti scrivo subito per il campo di luglio."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [article-use]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì. Sono ritirato da un anno e ho troppo tempo."
      errors: [false-friend]
    - tutor: "Ah, in pensione da un anno! Allora sei nel posto giusto. Perché proprio il volontariato?"
      recast: {text: "ritirato", fix: "in pensione", tags: [false-friend]}
    # merlin-1325_9000323-12
    - learner: "Mia moglie lo fa da anni, aiuta gli anziani. Così si sente sempre bene."
    - tutor: "È vero, aiutare gli altri fa bene anche a noi. Cosa sai fare?"
      goals: [motivation]
    # merlin-1325_1001157-3
    - learner: "Posso usare il computer."
    - tutor: "Ottimo, ci serve aiuto con i documenti dei volontari. Hai fatto altre cose prima?"
    - learner: "Per trent'anni ho lavorato in una fattoria di automobili, come ingegnere."
      errors: [false-friend]
    - tutor: "In una fabbrica di automobili! Allora sai anche riparare le cose, immagino."
      recast: {text: "una fattoria", fix: "una fabbrica", tags: [false-friend]}
      new: [{lemma: fabbrica, gloss: factory}]
      goals: [skills]
    # merlin-1325_9000090-8
    - learner: "Sì, un po'. Ho tempo durante tutto il Maggio fin a Ottobre e posso cominciare subito a lavorare."
      errors: [article-use, preposition]
    - tutor: "Che bello, sei mesi! Ma «tutto il Maggio»: con i nomi dei mesi, ci vuole l'articolo?"
      prompt: {text: "il Maggio", tags: [article-use]}
    - learner: "No, senza: tutto maggio."
    - tutor: "Esatto. Allora preferisci l'ufficio o la piccola officina dove ripariamo le biciclette?"
      goals: [time]
      new: [{lemma: officina, gloss: workshop}]
    - learner: "L'officina, sicuramente!"
    - tutor: "Lo sapevo! Ti aspettiamo lunedì mattina."
      goals: [choose]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [article-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001157-0
    - learner: "Ho ventiquattro anni e ho finito i miei studi un anno fa."
    - tutor: "Molto bene. E che studi ha fatto?"
    # merlin-1325_1001167-2
    - learner: "Mi sono laureata nella facoltà di Economia e Commercio nel 2010."
    - tutor: "Ottimo. Ha già lavorato in un'azienda?"
      goals: [intro]
    # merlin-1325_1001120-7
    - learner: "Sì, in uno studio di architetti. In sintesi ho lavorato là 3 anni come un assistente."
      errors: [article-use]
    - tutor: "Tre anni, bene. Ma «come un assistente»: parlando di un ruolo, serve l'articolo?"
      prompt: {text: "come un assistente", tags: [article-use]}
    - learner: "Come assistente, senza articolo."
    - tutor: "Esatto. E che cosa faceva di preciso?"
    # merlin-1325_1001091-3
    - learner: "Ho dovuto organizzare i suoi appunti, tenere i contatti con i clienti ed anche aiutare a fare contabilità."
      errors: [article-use]
    - tutor: "Molte responsabilità! Ma «aiutare a fare contabilità»: prima di «contabilità» manca una piccola parola."
      prompt: {text: "fare contabilità", tags: [article-use]}
    - learner: "Aiutare a fare la contabilità."
    - tutor: "Esatto. Quindi conosce anche i numeri, ottimo."
      goals: [experience]
    # merlin-1325_9000088-7
    - learner: "Sì. Sono molto ricettiva ma anche responsabile."
    - tutor: "Due qualità importanti. E un suo difetto?"
      new: [{lemma: difetto, gloss: flaw}]
    - learner: "A volte sono troppo precisa e lavoro lentamente."
    - tutor: "Qui essere precisi è importante! Perché vuole lavorare con noi?"
      goals: [strengths]
    # merlin-1325_1001092-9
    - learner: "Mi piace molto la moda e condurre ricerche di mercato."
    - tutor: "È proprio quello che cerchiamo. Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001167-8
    - learner: "Le vorrei chiedere dell'orario di lavoro, e se riceverò il posto quando posso cominciare"
    - tutor: "Si lavora dalle nove alle sei. Se tutto va bene, può cominciare il primo marzo."
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001032-2
    - learner: "Sono nato a Leeds nel 1987."
    - tutor: "E come mai parla così bene l'italiano?"
    # merlin-1325_1001050-4
    - learner: "Studio la lingua italiana da 4 anni e la lingua inglese da 12 anni."
    - tutor: "Ah, quindi l'inglese non è la sua prima lingua?"
    - learner: "No, i miei parenti sono polacchi, mio padre e mia madre. A casa parliamo polacco."
      errors: [false-friend]
    - tutor: "Ah, i genitori sono polacchi: quindi tre lingue, bravissimo! Che esperienze di lavoro ha?"
      recast: {text: "parenti", fix: "genitori", tags: [false-friend]}
      goals: [intro]
    # merlin-1325_1001167-3
    - learner: "Ho lavorato a Roma per un mezzo anno così ho una minima esperienza."
      errors: [article-use]
    - tutor: "Bene! Ma «per un mezzo anno»: con «mezzo», ci vuole l'articolo?"
      prompt: {text: "un mezzo anno", tags: [article-use]}
    - learner: "Per mezzo anno, sei mesi. In un piccolo ufficio."
    - tutor: "Esatto. E perché ha lasciato quel lavoro?"
    # merlin-1325_1001155-4
    - learner: "Era un piccolo ufficio e volevo già cambiare posto perché questi compiti sono molto semplici per me."
      errors: [tense-aspect]
    - tutor: "Capisco. Ma «questi compiti sono molto semplici»: parla di allora o di oggi?"
      prompt: {text: "sono molto semplici", tags: [tense-aspect]}
    - learner: "Di allora: questi compiti erano molto semplici."
    - tutor: "Esatto. Qui avrà compiti più interessanti, glielo assicuro! Quali sono i suoi punti forti?"
      goals: [experience]
    # merlin-1325_1001087-3
    - learner: "Ho già organizzato molti eventi. Così questo lavoro non è sconosciuto per me."
    - tutor: "Molto bene. E perché proprio la nostra azienda?"
      goals: [strengths]
    # merlin-1325_9000099-9
    - learner: "Sarebbe molto bello e un suono per me lavorare in Italia presso una ditta di design."
      errors: [word-choice]
    - tutor: "Proprio un sogno? Ci fa molto piacere! Ha qualche domanda per me?"
      recast: {text: "un suono", fix: "un sogno", tags: [word-choice]}
      goals: [why]
    # merlin-1365_0100282-9
    - learner: "Sì, alla fine una ultima domanda: quando posso sapere la risposta?"
      errors: [article-form]
    - tutor: "Certo, ma «una ultima»: davanti a «ultima», come diventa «una»?"
      prompt: {text: "una ultima", tags: [article-form]}
    - learner: "Un'ultima domanda!"
    - tutor: "Perfetto. Le faremo sapere entro venerdì."
      goals: [questions]
    # merlin-1325_1001083-16
    - learner: "Grazie della vostra risposta!"
    - tutor: "Grazie a lei, arrivederci!"

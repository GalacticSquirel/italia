# B1, telling a friend about the holidays and talking to a noisy neighbour: aspect, ci/ne, clitics.
- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono stato in Grecia, su un'isola piccola. Ci sono andato con due amici."
    - tutor: "In Grecia, che fortuna! E che tempo faceva?"
      goals: [where]
    - learner: "Ha fatto caldissimo tutti i giorni, quaranta gradi."
      errors: [tense-aspect]
      gold: {text: "Ha fatto caldissimo", fix: "Faceva caldissimo"}
    - tutor: "Ha fatto caldissimo? Stai descrivendo com'era il tempo: quale forma del passato usiamo?"
      prompt: {text: "Ha fatto caldissimo", tags: [tense-aspect]}
    - learner: "Ha fatto molto caldo, sì. Anche di notte."
      errors: [tense-aspect]
    - tutor: "Faceva molto caldo anche di notte? Quaranta gradi sono tanti! E cosa facevate tutto il giorno?"
      recast: {text: "Ha fatto", fix: "Faceva", tags: [tense-aspect]}
      goals: [weather]
    - learner: "Di giorno nuotavamo e la sera mangiavamo pesce in il porto."
      errors: [articulated-preposition]
      gold: {text: "in il porto", fix: "al porto"}
    - tutor: "In il porto? Pensa alla preposizione giusta, e poi unisci le parole."
      prompt: {text: "in il porto", tags: [articulated-preposition]}
    - learner: "Al porto, in un ristorante piccolo con i tavoli sull'acqua."
    - tutor: "Che bello! E qual è stata la cosa più bella?"
      goals: [activities]
    - learner: "Il tramonto dalla montagna. Un giorno siamo saliti in cima e lo guardavamo per un'ora."
      errors: [tense-aspect]
      gold: {text: "lo guardavamo per un'ora", fix: "l'abbiamo guardato per un'ora"}
    - tutor: "Lo guardavamo per un'ora? È un'ora precisa, con un inizio e una fine: che tempo serve?"
      prompt: {text: "lo guardavamo per un'ora", tags: [tense-aspect]}
    - learner: "L'abbiamo guardato per un'ora, in silenzio."
    - tutor: "Perfetto. Un'ora a guardare il cielo in silenzio: hai fatto venire voglia di partire anche a me!"
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Ho andato in Sicilia con la mia amica Lucía."
      errors: [auxiliary-choice]
      gold: {text: "Ho andato", fix: "Sono andata"}
    - tutor: "Ho andato? Con andare, usiamo avere o un altro verbo?"
      prompt: {text: "Ho andato", tags: [auxiliary-choice]}
    - learner: "Sono andata in Sicilia!"
    - tutor: "Brava! E com'era il tempo?"
      goals: [where]
    - learner: "Perfetto, sempre sole. Solo un giorno ha piovuto un po'."
    - tutor: "Che fortuna! E cosa avete fatto?"
      goals: [weather]
    - learner: "Abbiamo visitato Palermo e poi siamo salito sull'Etna."
      errors: [participle-agreement]
      gold: {text: "siamo salito", fix: "siamo salite"}
    - tutor: "Siamo salito? Tu e la tua amica... attenzione alla fine della parola."
      prompt: {text: "siamo salito", tags: [participle-agreement]}
    - learner: "Sì, siamo salito fino in cima, a piedi."
      errors: [participle-agreement]
    - tutor: "Siete salite fino in cima a piedi? Che brave, non è facile!"
      recast: {text: "salito", fix: "salite", tags: [participle-agreement]}
      goals: [activities]
    - learner: "Molto! Ma la cosa più bella è stata il cibo. Gli arancini... ho mangiato tre al giorno."
      errors: [ci-ne]
      gold: {text: "ho mangiato tre", fix: "ne ho mangiati tre"}
    - tutor: "Ho mangiato tre? Tre di che cosa? Manca una piccola parola."
      prompt: {text: "ho mangiato tre", tags: [ci-ne]}
    - learner: "Ne ho mangiati tre al giorno!"
    - tutor: "Tre al giorno, sei una campionessa! La Sicilia ti è proprio piaciuta."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [pronoun-position]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono stata in montagna, in Trentino, con la mia famiglia."
    - tutor: "Che bello! E com'era il tempo lassù?"
      goals: [where]
    - learner: "Era fresco, ma un pomeriggio è arrivato un temporale e ci siamo bagnato tutti."
      errors: [participle-agreement]
      gold: {text: "ci siamo bagnato", fix: "ci siamo bagnati"}
    - tutor: "Ci siamo bagnato? Eravate in tanti: attenzione all'ultima lettera."
      prompt: {text: "ci siamo bagnato", tags: [participle-agreement]}
    - learner: "Ci siamo bagnati tutti, anche il cane!"
    - tutor: "Anche il povero cane! E cosa avete fatto?"
      goals: [weather]
    - learner: "Abbiamo camminato molto. Mio padre ha comprato una mappa, ma ha perso la il secondo giorno."
      errors: [pronoun-position]
      gold: {text: "ha perso la", fix: "l'ha persa"}
    - tutor: "Ha perso la? Con il passato prossimo, dove va il pronome?"
      prompt: {text: "ha perso la", tags: [pronoun-position]}
    - learner: "Sì, ha perso la nel bosco."
      errors: [pronoun-position]
    - tutor: "L'ha persa nel bosco? Povero papà! E come avete fatto?"
      recast: {text: "ha perso la", fix: "L'ha persa", tags: [pronoun-position]}
      goals: [activities]
    - learner: "Un signore molto gentile ci ha aiutato a trovare la strada indietro."
      errors: [word-choice]
      gold: {text: "la strada indietro", fix: "la strada del ritorno"}
    - tutor: "Per fortuna! Senza di lui, chissà quando trovavate la strada del ritorno. E la cosa più bella?"
      recast: {text: "la strada indietro", fix: "la strada del ritorno", tags: [word-choice]}
    - learner: "Il lago. Era così bello che ho fatto più di cento foto."
    - tutor: "Più di cento foto! Allora domani me le fai vedere."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [imperfetto-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono tornato a mio paese, in Andalusia, a trovare la famiglia."
      errors: [articulated-preposition]
      gold: {text: "a mio paese", fix: "al mio paese"}
    - tutor: "A mio paese? Con «paese» manca l'articolo: prova a unirlo alla preposizione."
      prompt: {text: "a mio paese", tags: [articulated-preposition]}
    - learner: "Al mio paese, vicino a Cordova."
    - tutor: "Che bello tornare a casa! Faceva caldo?"
      goals: [where]
    - learner: "Sì, un caldo terribile. Non potiamo uscire prima delle sette di sera."
      errors: [imperfetto-form]
      gold: {text: "potiamo", fix: "potevamo"}
    - tutor: "Non potiamo? Stai parlando del passato: prova con l'imperfetto."
      prompt: {text: "potiamo", tags: [imperfetto-form]}
    - learner: "Non potiamo uscire, no, era impossibile."
      errors: [imperfetto-form]
    - tutor: "Non potevate uscire prima delle sette? Che caldo! E allora cosa facevate?"
      recast: {text: "potiamo", fix: "potevate", tags: [imperfetto-form]}
      goals: [weather]
    - learner: "La mattina andavo al mare con i miei nipoti, e la sera mangiavamo tutti in la terrazza della mia madre."
      errors: [articulated-preposition, possessive]
      gold: {text: "in la terrazza", fix: "sulla terrazza"}
    - tutor: "In la terrazza? Pensa alla preposizione: siete dentro o sopra la terrazza?"
      prompt: {text: "in la terrazza", tags: [articulated-preposition]}
    - learner: "Sulla terrazza di mia madre, con tutta la famiglia."
    - tutor: "Che bello, tutti insieme! E qual è stata la cosa più bella?"
      goals: [activities]
    - learner: "La festa del paese. Abbiamo ballato fino alle quattro, e mio padre ha ballato con tutte le signore."
    - tutor: "Tuo padre balla meglio di tutti, allora! Che bella estate in famiglia."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono andato a Lisbona per una settimana. Era la prima volta."
      errors: [participle-agreement]
      gold: {text: "Sono andato", fix: "Sono andata"}
    - tutor: "Sono andato? Sei tu che sei partita: attenzione all'ultima lettera."
      prompt: {text: "Sono andato", tags: [participle-agreement]}
    - learner: "Sono andata a Lisbona, sola."
    - tutor: "Brava, da sola! E che tempo hai trovato?"
      goals: [where]
    - learner: "Il primo giorno ha piovuto, poi c'è stato il sole fino alla fine."
    - tutor: "Meno male! E cosa hai fatto?"
      goals: [weather]
    - learner: "Ogni mattina ho fatto colazione in una pasticceria diversa."
      errors: [tense-aspect]
      gold: {text: "ho fatto colazione", fix: "facevo colazione"}
    - tutor: "Ogni mattina ho fatto colazione? Succedeva tutti i giorni..."
      prompt: {text: "ho fatto colazione", tags: [tense-aspect]}
    - learner: "Ho fatto colazione, sì, sempre con i dolci tipici."
      errors: [tense-aspect]
    - tutor: "Facevi colazione ogni mattina con i dolci tipici? Che bella vita!"
      recast: {text: "Ho fatto colazione", fix: "Facevi colazione", tags: [tense-aspect]}
    - learner: "Sì! Poi ho fatto una gita di giorno a Sintra, per vedere i castelli."
      errors: [word-choice]
      gold: {text: "una gita di giorno", fix: "una gita in giornata"}
    - tutor: "Una gita in giornata a Sintra, che bello! E la cosa che ti è piaciuta di più?"
      recast: {text: "una gita di giorno", fix: "Una gita in giornata", tags: [word-choice]}
      goals: [activities]
    - learner: "La musica, il fado. Una sera l'ho sentito in un piccolo locale e piangevo."
      errors: [tense-aspect]
      gold: {text: "piangevo", fix: "ho pianto"}
    - tutor: "E piangevo? È successo in quel momento preciso: che tempo usiamo?"
      prompt: {text: "piangevo", tags: [tense-aspect]}
    - learner: "Ho pianto. Era bellissimo e triste insieme."
    - tutor: "Ti capisco, quella musica tocca il cuore. Che bel viaggio!"
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono andato in Puglia, nel paese di mio nonno. Non c'ero mai stato prima."
    - tutor: "Finalmente! E com'era il tempo?"
      goals: [where]
    - learner: "Caldo, ma c'era sempre un po' di vento, quindi stavamo bene."
    - tutor: "Il vento del sud, perfetto. E cosa hai fatto laggiù?"
      goals: [weather]
    - learner: "Ho conosciuto i cugini di mio padre. Non sapevo che erano così tanti: lui ha dodici!"
      errors: [ci-ne]
      gold: {text: "lui ha dodici", fix: "lui ne ha dodici"}
    - tutor: "Lui ha dodici? Dodici di che cosa? Manca una piccola parola."
      prompt: {text: "lui ha dodici", tags: [ci-ne]}
    - learner: "Ha dodici, sì, incredibile!"
      errors: [ci-ne]
    - tutor: "Ne ha dodici? Che famiglia grande!"
      recast: {text: "Ha dodici", fix: "Ne ha dodici", tags: [ci-ne]}
    - learner: "Sì! Ogni sera un cugino diverso ci invitava a cena. Ho guadagnato tre chili!"
      errors: [word-choice]
      gold: {text: "Ho guadagnato tre chili", fix: "Ho preso tre chili"}
    - tutor: "Hai preso tre chili? Ci credo, in Puglia si mangia benissimo! E la cosa più bella?"
      recast: {text: "guadagnato tre chili", fix: "preso tre chili", tags: [word-choice]}
      goals: [activities]
    - learner: "Quando siamo andati a trovare la casa del nonno. Mia zia mi raccontava di lui per tutta la giornata."
      errors: [tense-aspect]
      gold: {text: "mi raccontava di lui per tutta la giornata", fix: "mi ha raccontato di lui per tutta la giornata"}
    - tutor: "Mi raccontava per tutta la giornata? È un periodo chiuso, con una fine: che tempo serve?"
      prompt: {text: "mi raccontava", tags: [tense-aspect]}
    - learner: "Mi raccontava di lui, sì, tante storie."
      errors: [tense-aspect]
    - tutor: "Ti ha raccontato di lui per tutta la giornata? Che regalo prezioso."
      recast: {text: "Mi raccontava", fix: "Ti ha raccontato", tags: [tense-aspect]}
    - learner: "Sì, è stato il giorno più bello di tutta l'estate."
    - tutor: "Lo immagino. Adesso conosci un pezzo della tua storia: devi tornarci presto!"
      goals: [best]

- scenario: vicino-rumoroso
  level: B1
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, mi scusi. Sono la vecina del terzo piano, abito proprio sotto di lei."
      errors: [word-choice]
      gold: {text: "vecina", fix: "vicina"}
    - tutor: "Ah, la vicina del terzo piano! Piacere, signora. Mi dica pure."
      recast: {text: "vecina", fix: "vicina", tags: [word-choice]}
      goals: [greet]
    - learner: "Ecco, ogni notte sento il suo cane che abbaia. Ieri ha abbaiato fino a la una."
      errors: [articulated-preposition]
      gold: {text: "fino a la una", fix: "fino all'una"}
    - tutor: "Fino a la una? Unisca la preposizione e l'articolo."
      prompt: {text: "a la una", tags: [articulated-preposition]}
    - learner: "Fino all'una, e io mi alzo alle sei."
    - tutor: "Oh, mi dispiace davvero! Quando esco la sera, resta solo e non è tranquillo."
      goals: [problem]
    - learner: "Capisco. Potrebbe lasciarlo con qualcuno? Per esempio il signore del primo piano ama i cani: lo potrebbe chiedere."
      errors: [object-pronoun]
      gold: {text: "lo potrebbe chiedere", fix: "gli potrebbe chiedere"}
    - tutor: "Lo potrebbe chiedere? Si chiede qualcosa «a» qualcuno: quale pronome serve?"
      prompt: {text: "lo potrebbe chiedere", tags: [object-pronoun]}
    - learner: "Lo potrebbe chiedere, sì, a lui."
      errors: [object-pronoun]
    - tutor: "Sì, gli potrei chiedere di tenerlo quando esco: è una buona idea."
      recast: {text: "Lo potrebbe chiedere", fix: "gli potrei chiedere", tags: [object-pronoun]}
      goals: [request]
    - learner: "E gli altri giorni potrebbe tornare prima delle undici? Saresti molto gentile."
      errors: [register]
      gold: {text: "Saresti", fix: "Sarebbe"}
    - tutor: "Saresti? Noi due ci diamo del Lei..."
      prompt: {text: "Saresti", tags: [register]}
    - learner: "Sarebbe molto gentile, grazie."
    - tutor: "D'accordo: quando esco la sera, il cane va dal signore del primo piano, e comunque torno prima delle undici."
      goals: [compromise]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [pronoun-position]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Sono il vicino del secondo piano. Mi scusi se le disturbo a quest'ora."
      errors: [object-pronoun]
      gold: {text: "le disturbo", fix: "la disturbo"}
    - tutor: "Se le disturbo? Disturbare qualcuno: che pronome serve con lei?"
      prompt: {text: "le disturbo", tags: [object-pronoun]}
    - learner: "Mi scusi se la disturbo."
    - tutor: "Nessun disturbo, buonasera a lei. Mi dica."
      goals: [greet]
    - learner: "Ogni mattina alle sei sento dei colpi forti. Mia moglie non riesce a dormire più."
      errors: [word-order]
      gold: {text: "non riesce a dormire più", fix: "non riesce più a dormire"}
    - tutor: "Non riesce a dormire più? Provi a mettere «più» in un altro punto della frase."
      prompt: {text: "non riesce a dormire più", tags: [word-order]}
    - learner: "Non riesce più a dormire, poverina."
    - tutor: "Mi dispiace! Sto rifacendo il bagno da solo, e la mattina presto è l'unico momento libero."
      goals: [problem]
    - learner: "Capisco. Ma vorrei le chiedere di cominciare più tardi, almeno alle nove."
      errors: [pronoun-position]
      gold: {text: "vorrei le chiedere", fix: "vorrei chiederle"}
    - tutor: "Vorrei le chiedere? Il pronome è nel posto sbagliato: provi a spostarlo."
      prompt: {text: "vorrei le chiedere", tags: [pronoun-position]}
    - learner: "Vorrei chiederle di cominciare alle nove."
    - tutor: "Il problema è che alle nove vado al lavoro. Che ne dice delle otto, e nel fine settimana niente rumori?"
      goals: [request]
    - learner: "Le otto vanno bene. Il sabato e la domenica mia moglie dorme fino tardi, quindi sarebbe perfetto."
      errors: [preposition]
      gold: {text: "fino tardi", fix: "fino a tardi"}
    - tutor: "Dorme fino tardi? Manca una piccola parola dopo «fino»."
      prompt: {text: "fino tardi", tags: [preposition]}
    - learner: "Fino a tardi, sì. Allora siamo d'accordo."
    - tutor: "D'accordo: dalle otto durante la settimana, e nel fine settimana silenzio. Saluti a sua moglie!"
      goals: [compromise]

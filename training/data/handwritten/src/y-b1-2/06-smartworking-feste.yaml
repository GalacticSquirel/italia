# B1, working from home and Christmas traditions: imperfetto, aspect, relative pronouns, ci/ne.
- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Vado in ufficio, ma il venerdì lavoro da casa. Il mio capo mi lo permette da gennaio."
      errors: [combined-pronouns]
      gold: {text: "mi lo permette", fix: "me lo permette"}
    - tutor: "Mi lo permette? Quando due pronomi stanno insieme, il primo cambia un po'."
      prompt: {text: "mi lo permette", tags: [combined-pronouns]}
    - learner: "Me lo permette da gennaio."
    - tutor: "Esatto. Il venerdì a casa, perfetto prima del fine settimana! Ti piace?"
      goals: [situation]
    - learner: "Sì, il venerdì dormo di più e cucino un pranzo vero. È più rilassante che l'ufficio."
      errors: [comparative]
      gold: {text: "più rilassante che l'ufficio", fix: "più rilassante dell'ufficio"}
    - tutor: "Più rilassante che l'ufficio? Davanti a un nome, quale parola usiamo nel confronto?"
      prompt: {text: "più rilassante che l'ufficio", tags: [comparative]}
    - learner: "Più rilassante dell'ufficio, certo."
    - tutor: "Giusto. E ci sono anche degli svantaggi?"
      goals: [pros]
    - learner: "Sì, i colleghi mi chiamano sempre. Ieri un collega lo ho detto che ero occupato, ma ha chiamato tre volte."
      errors: [object-pronoun]
      gold: {text: "lo ho detto", fix: "gli ho detto"}
    - tutor: "Lo ho detto? Hai detto una cosa a lui: che pronome serve?"
      prompt: {text: "lo ho detto", tags: [object-pronoun]}
    - learner: "Lo ho detto, sì, ma lui non ascolta mai."
      errors: [object-pronoun]
    - tutor: "Gli hai detto che eri occupato e ha chiamato lo stesso? Che pazienza!"
      recast: {text: "Lo ho detto", fix: "Gli hai detto", tags: [object-pronoun]}
      goals: [cons]
    - learner: "Preferirei lavorare da casa due giorni, ma con il telefono spento!"
    - tutor: "Ah ah, due giorni a casa e telefono spento: firmo subito anch'io!"
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Io insegno, quindi vado a scuola tutti i giorni. Ma durante la pandemia facevo lezione da casa."
    - tutor: "Ah, giusto! E com'era insegnare da casa?"
      goals: [situation]
    - learner: "Era comodo. Il vantaggio era che non ho dovuto alzarmi presto la mattina."
      errors: [tense-aspect]
      gold: {text: "non ho dovuto", fix: "non dovevo"}
    - tutor: "Non ho dovuto? Era così ogni giorno: quale tempo usiamo per le cose di tutti i giorni?"
      prompt: {text: "non ho dovuto", tags: [tense-aspect]}
    - learner: "Non ho dovuto alzarmi alle sei, sì."
      errors: [tense-aspect]
    - tutor: "Ah, non dovevi alzarti alle sei: questo sì che è un vantaggio! E gli svantaggi?"
      recast: {text: "Non ho dovuto", fix: "non dovevi", tags: [tense-aspect]}
      goals: [pros]
    - learner: "La connessione si cortava sempre, e gli alunni si distraevano molto."
      errors: [word-choice]
      gold: {text: "si cortava", fix: "cadeva"}
    - tutor: "La connessione cadeva sempre? Che problema, con una classe intera davanti! E adesso cosa preferiresti?"
      recast: {text: "si cortava", fix: "cadeva", tags: [word-choice]}
      goals: [cons]
    - learner: "Adesso preferisco la scuola. Ma l'anno prossimo farò un corso online, e così saperò se mi piace ancora."
      errors: [future-form]
      gold: {text: "saperò", fix: "saprò"}
    - tutor: "Così... saperò? Il futuro di sapere è un po' più corto."
      prompt: {text: "saperò", tags: [future-form]}
    - learner: "Saprò se mi piace ancora lavorare da casa."
    - tutor: "Esatto. Insomma, la scuola resta la tua prima scelta: ti capisco, i ragazzi dal vivo sono un'altra cosa."
      goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia il tacchino il 25, con le patate e le verdure. E poi c'è un dolce scuro con la frutta secca."
    - tutor: "Il tacchino, come in America! E da bambina come festeggiavi?"
      goals: [compare]
    - learner: "Ogni anno siamo andati dai nonni in campagna. C'era sempre la neve."
      errors: [tense-aspect]
      gold: {text: "siamo andati", fix: "andavamo"}
    - tutor: "Ogni anno siete andati? Con «ogni anno», che tempo è più naturale?"
      prompt: {text: "siamo andati", tags: [tense-aspect]}
    - learner: "Andavamo dai nonni ogni anno."
    - tutor: "Esatto. Natale con la neve, che sogno! E cosa facevate?"
    - learner: "La mattina aprevamo i regali tutti insieme, ancora in pigiama."
      errors: [imperfetto-form]
      gold: {text: "aprevamo", fix: "aprivamo"}
    - tutor: "Aprevamo? Pensa all'infinito, aprire: prova di nuovo."
      prompt: {text: "aprevamo", tags: [imperfetto-form]}
    - learner: "Aprevamo... non sono sicura."
      errors: [imperfetto-form]
    - tutor: "Ah, aprivate i regali tutti insieme, che bello! Anche noi facevamo così."
      recast: {text: "Aprevamo", fix: "aprivate", tags: [imperfetto-form]}
      goals: [past]
    - learner: "E qui cosa si mangia a Natale? Ho sentito parlare di un dolce alto, con l'uvetta."
    - tutor: "È il panettone, il dolce di Milano! Da noi lo mangiamo anche a colazione, per tutte le feste."
      goals: [ask]
      new: [{lemma: panettone, gloss: panettone (Christmas cake)}]
    - learner: "Che buono! Cosa posso portare domani a il pranzo?"
      errors: [articulated-preposition]
      gold: {text: "a il pranzo", fix: "al pranzo"}
    - tutor: "A il pranzo? Unisci le due parole."
      prompt: {text: "a il pranzo", tags: [articulated-preposition]}
    - learner: "Al pranzo, scusa. Posso portare qualcosa?"
    - tutor: "Porta un dolce del tuo paese, così lo proviamo tutti!"
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la festa più importante per i bambini è il 6 gennaio, con i Re Magi. Arrivano i regali quel giorno."
    - tutor: "Il 6 gennaio! Qui invece arriva la Befana. E tu da piccolo cosa facevi?"
      goals: [compare]
    - learner: "La sera del 5 io e mio fratello lasciavamo le scarpe vicino alla porta e mettavamo acqua per i cammelli."
      errors: [imperfetto-form]
      gold: {text: "mettavamo", fix: "mettevamo"}
    - tutor: "Mettavamo? Mettere è un verbo in -ere: prova a cambiare una lettera."
      prompt: {text: "mettavamo", tags: [imperfetto-form]}
    - learner: "Mettavamo, sì, e anche biscotti per i Re."
      errors: [imperfetto-form]
    - tutor: "Che bello: mettevate l'acqua per gli animali e i biscotti per i Re!"
      recast: {text: "Mettavamo", fix: "mettevate", tags: [imperfetto-form]}
      goals: [past]
    - learner: "Sì! E qui chi è la Befana? È la signora di chi parlano tutti i bambini?"
      errors: [relative-pronoun]
      gold: {text: "di chi parlano", fix: "di cui parlano"}
    - tutor: "La signora di chi parlano? Dopo «di», in una frase così, quale pronome usiamo?"
      prompt: {text: "di chi parlano", tags: [relative-pronoun]}
    - learner: "La signora di chi parlano... sì, quella con la scopa."
      errors: [relative-pronoun]
    - tutor: "Sì, la Befana è la vecchina di cui parlano tutti i bambini: porta dolci ai buoni e carbone ai cattivi."
      recast: {text: "di chi parlano", fix: "di cui parlano", tags: [relative-pronoun]}
      goals: [ask]
      new: [{lemma: vecchina, gloss: little old lady}, {lemma: carbone, gloss: coal}]
    - learner: "Che bello! Domani posso portare un dolce spagnolo, se volete."
    - tutor: "Sarebbe perfetto! Quale porterai?"
    - learner: "Il turrón, che è di mandorle. Lo compro in un negozio spagnolo vicino a la stazione."
      errors: [articulated-preposition]
      gold: {text: "vicino a la stazione", fix: "vicino alla stazione"}
    - tutor: "Vicino a la stazione? Queste due parole si uniscono."
      prompt: {text: "vicino a la stazione", tags: [articulated-preposition]}
    - learner: "Vicino alla stazione. Domani lo porto!"
    - tutor: "Perfetto, allora il dolce lo porti tu. Non vedo l'ora di provarlo!"
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la festa più grande è il Ringraziamento, a novembre. Si riunisce tutta la famiglia."
    - tutor: "Ah, il Ringraziamento! E da bambino com'era?"
      goals: [compare]
    - learner: "Mia madre cucinava per venti persone. E ogni anno mio zio ha raccontato le stesse barzellette."
      errors: [tense-aspect]
      gold: {text: "ha raccontato", fix: "raccontava"}
    - tutor: "Ogni anno ha raccontato? Era una cosa che si ripeteva..."
      prompt: {text: "ha raccontato", tags: [tense-aspect]}
    - learner: "Sì, ogni anno ha raccontato le stesse, e rideva solo lui."
      errors: [tense-aspect]
    - tutor: "Raccontava sempre le stesse storie e rideva solo lui? Ogni famiglia ha uno zio così!"
      recast: {text: "ha raccontato", fix: "Raccontava", tags: [tense-aspect]}
    - learner: "Esatto! E un anno, quando avevo dieci anni, il cane mangiava il tacchino prima del pranzo."
      errors: [tense-aspect]
      gold: {text: "il cane mangiava", fix: "il cane ha mangiato"}
    - tutor: "Il cane mangiava il tacchino? È successo una volta sola, quel giorno: che tempo serve?"
      prompt: {text: "il cane mangiava", tags: [tense-aspect]}
    - learner: "Il cane ha mangiato il tacchino! Abbiamo mangiato pizza, alla fine."
    - tutor: "Che disastro, ma che bel ricordo!"
      goals: [past]
    - learner: "Ma dimmi: qui in Italia è vero che la sera del 24 non si mangia la carne?"
    - tutor: "Sì, in molte famiglie la sera del 24 si mangia solo pesce. Mia nonna prepara sette piatti diversi!"
      goals: [ask]
    - learner: "Sette! Allora domani posso portare una torta di zucca? Ho fatto una la settimana scorsa ed era buonissima."
      errors: [ci-ne]
      gold: {text: "Ho fatto una", fix: "Ne ho fatta una"}
    - tutor: "Ho fatto una...? Una di che cosa? Manca una piccola parola."
      prompt: {text: "Ho fatto una", tags: [ci-ne]}
    - learner: "Ne ho fatta una la settimana scorsa."
    - tutor: "Perfetto, allora portala! Una torta americana a un pranzo italiano: tutti saranno curiosi."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la cena più importante è il 24. E il 31 si mangiano dodici uve a mezzanotte."
      errors: [word-choice]
      gold: {text: "dodici uve", fix: "dodici acini d'uva"}
    - tutor: "Dodici acini d'uva a mezzanotte? Che tradizione divertente!"
      recast: {text: "dodici uve", fix: "dodici acini d'uva", tags: [word-choice]}
      goals: [compare]
      new: [{lemma: acino, gloss: grape (single one)}]
    - learner: "Sì! Uno per ogni colpo dell'orologio. Da piccola non riuscivo mai a mangiarli tutti."
    - tutor: "Ah ah, ci credo! E con chi festeggiavi?"
    - learner: "Con tutta la famiglia, da mia nonna. Lei abitava in un paese e andavamo ogni anno."
      errors: [ci-ne]
      gold: {text: "andavamo ogni anno", fix: "ci andavamo ogni anno"}
    - tutor: "E dove? Manca una piccola parola prima del verbo."
      prompt: {text: "andavamo ogni anno", tags: [ci-ne]}
    - learner: "Andavamo ogni anno, sì, in macchina."
      errors: [ci-ne]
    - tutor: "Ci andavate ogni anno in macchina, che bello! Una festa in famiglia."
      recast: {text: "Andavamo ogni anno", fix: "Ci andavate ogni anno", tags: [ci-ne]}
      goals: [past]
    - learner: "Sì. E qui, cos'è il panettone esattamente? Lo vedo in tutti i supermercati."
    - tutor: "È un dolce di Milano, alto, con la frutta dentro. Da noi si mangia per tutte le feste, anche a colazione!"
      goals: [ask]
    - learner: "Allora domani porto io il panettone! Ho già comprato uno ieri."
      errors: [ci-ne]
      gold: {text: "Ho già comprato uno", fix: "Ne ho già comprato uno"}
    - tutor: "Ho già comprato uno? Uno di che cosa? Prova con la piccola parola di prima."
      prompt: {text: "Ho già comprato uno", tags: [ci-ne]}
    - learner: "Ne ho già comprato uno!"
    - tutor: "Perfetto, allora portalo tu. Il caffè lo facciamo noi!"
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Irlanda si va a messa a mezzanotte e il giorno dopo si fa un grande pranzo con tutti i parenti."
    - tutor: "Anche qui molti vanno a messa a mezzanotte! E tu da piccola?"
      goals: [compare]
    - learner: "Io e mia sorella scrivavamo una lettera a Babbo Natale ogni anno."
      errors: [imperfetto-form]
      gold: {text: "scrivavamo", fix: "scrivevamo"}
    - tutor: "Scrivavamo? Scrivere è un verbo in -ere..."
      prompt: {text: "scrivavamo", tags: [imperfetto-form]}
    - learner: "Scrivavamo, sì, e la mettevamo vicino al camino."
      errors: [imperfetto-form]
    - tutor: "Ah, scrivevate la lettera e la mettevate vicino al camino, che bello!"
      recast: {text: "Scrivavamo", fix: "scrivevate", tags: [imperfetto-form]}
      goals: [past]
    - learner: "Ma dimmi, cos'è il presepe di che tutti parlano qui?"
      errors: [relative-pronoun]
      gold: {text: "di che", fix: "di cui"}
    - tutor: "Il presepe di che...? Attenzione al pronome dopo «di»."
      prompt: {text: "di che", tags: [relative-pronoun]}
    - learner: "Il presepe di cui tutti parlano."
    - tutor: "Esatto. È una piccola scena con Gesù bambino, le case e i personaggi. A Napoli c'è una strada piena di negozi che li vendono!"
      goals: [ask]
    - learner: "Che bello, voglio vederla! Per domani, penso che un vino è una buona idea."
      errors: [subjunctive-use]
      gold: {text: "che un vino è", fix: "che un vino sia"}
    - tutor: "Penso che un vino... è? Dopo «penso che», quale modo usiamo?"
      prompt: {text: "che un vino è", tags: [subjunctive-use]}
    - learner: "Penso che un vino è perfetto, no?"
      errors: [subjunctive-use]
    - tutor: "Sì, penso anch'io che un vino sia perfetto. Rosso o bianco?"
      recast: {text: "che un vino è", fix: "che un vino sia", tags: [subjunctive-use]}
    - learner: "Rosso, allora. Lo compro domani mattina."
    - tutor: "Perfetto, un rosso va benissimo con il pranzo della mamma. A domani!"
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Australia Natale è in estate, quindi si va al mare e si fa il barbecue a il parco."
      errors: [articulated-preposition]
      gold: {text: "a il parco", fix: "al parco"}
    - tutor: "A il parco? Prova a unire le due parole."
      prompt: {text: "a il parco", tags: [articulated-preposition]}
    - learner: "Al parco, scusa. Con trenta gradi!"
    - tutor: "Natale con trenta gradi, incredibile! E da piccolo com'era?"
      goals: [compare]
    - learner: "La mattina andavamo al mare con i cugini, e la nonna preparava un dolce con dentro una moneta."
    - tutor: "Una moneta nel dolce! E chi la trovava?"
    - learner: "Chi la trovava era fortunato per tutto l'anno. Io non l'ho mai trovata!"
    - tutor: "Peccato! Ma che bella tradizione."
      goals: [past]
    - learner: "Qui invece ho sentito parlare della signora in cui parlano tutti, la Befana."
      errors: [relative-pronoun]
      gold: {text: "in cui parlano", fix: "di cui parlano"}
    - tutor: "La signora in cui parlano? Si parla «di» qualcuno: allora il pronome...?"
      prompt: {text: "in cui parlano", tags: [relative-pronoun]}
    - learner: "La signora in cui parlano tutti, sì."
      errors: [relative-pronoun]
    - tutor: "Sì, la Befana è la signora di cui parlano tutti a gennaio: arriva la notte del 5 con una scopa."
      recast: {text: "in cui parlano", fix: "di cui parlano", tags: [relative-pronoun]}
      goals: [ask]
      new: [{lemma: scopa, gloss: broom}]
    - learner: "Divertente! E per domani, posso portare un dolce che il mio madre faceva sempre?"
      errors: [possessive]
      gold: {text: "il mio madre", fix: "mia madre"}
    - tutor: "Il mio madre? Pensa a come parliamo della famiglia."
      prompt: {text: "il mio madre", tags: [possessive]}
    - learner: "Che mia madre faceva sempre, una torta con la frutta e la panna."
    - tutor: "Che buona! Portala, così domani proviamo un dolce del tuo paese."
      goals: [plan]

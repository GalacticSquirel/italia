- scenario: film-libro
  level: B1
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Anche tu hai letto «Amici in rete», vero? Che cosa pensi di Luca?"
    # merlin-1325_1001130-0
    - learner: "Io conosco la sua problema."
      errors: [noun-gender]
    - tutor: "Ah sì? Ma «la sua problema»? «Problema» finisce in -a, ma è maschile!"
      prompt: {text: "la sua problema", tags: [noun-gender]}
    - learner: "Sì, la sua problema è la solitudine."
      errors: [noun-gender]
    - tutor: "Esatto, il suo problema è la solitudine: passa tutto il giorno al computer. E tu, come sei con gli amici in rete?"
      recast: {text: "la sua problema", fix: "il suo problema", tags: [noun-gender]}
      goals: [summary, characters]
    # merlin-1325_9000105-7
    - learner: "Parlo solo con persone che conosco, non sono aperta per nove amicizie, non so sicura sulle chat."
      errors: [verb-form, preposition, spelling]
    - tutor: "Capisco. Ma «non so sicura»? Qui il verbo non è «sapere»..."
      prompt: {text: "non so sicura", tags: [verb-form]}
    - learner: "Non sono sicura delle chat. Il libro mi ha fatto pensare molto."
    - tutor: "Esatto. Quindi il libro ti è piaciuto? Lo consiglieresti ai ragazzi?"
      goals: [opinion]
    # merlin-1365_0100475-16
    - learner: "Penso che sia una buona idea per te."
    - tutor: "Per me e per i ragazzi, allora! Lo mettiamo nella lista dei libri per la scuola."
      goals: [recommend]

- scenario: colloquio-lavoro
  level: B1

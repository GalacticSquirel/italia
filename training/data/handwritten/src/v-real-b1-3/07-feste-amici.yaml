# File 7: parties, a wedding announcement, and more volunteering, interviews and job tips.
- scenario: compleanno
  level: B1
  persona: es-f-teacher
  history: [essere-avere]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Quest'anno lo festeggiamo insieme, visto che siamo nati lo stesso giorno! Pensavamo al 20 o al 21 novembre, da noi."
    # merlin-1365_0100258-1
    - learner: "Per fortuna ho libero il 20 e il 21 novembre e posso venire da voi."
      errors: [essere-avere]
    - tutor: "Che bello! Ma «ho libero»? Per dire che quel giorno non lavori, quale verbo usiamo?"
      prompt: {text: "ho libero", tags: [essere-avere]}
    - learner: "Sono libera il 20 e il 21, quindi vengo sicuramente!"
    - tutor: "Perfetto, allora facciamo sabato 20. Vieni con il tuo ragazzo?"
      goals: [date]
    # merlin-1365_0100186-6
    - learner: "Forse Pablo può accompagnarmi, ma sapete che Pablo deve lavorare molto."
    - tutor: "Speriamo di sì! Poi ci sono i colleghi di Sara e i miei amici del calcio, con tutti i bambini."
    # merlin-1365_0100290-4
    - learner: "Sentite, per il 20 novembre, ho provato a trovare qualcuno che fa qualcosa con i bambini."
    - tutor: "Qualcuno che gioca con i bambini, che bella idea! Da mangiare ci pensa la mamma: pasta al forno per tutti."
      goals: [guests, food]
    # merlin-1365_0100187-3
    - learner: "Alla fine vi vorrei chiedere cosa vi potrei regalare."
    - tutor: "Ma no, non serve niente!"
    # merlin-1365_0100173-6
    - learner: "Se avete qualche desideri potete dimmi che cose sono."
      errors: [noun-number, verb-form]
    - tutor: "Sei gentilissima. Ma «qualche desideri»? Dopo «qualche», singolare o plurale?"
      prompt: {text: "qualche desideri", tags: [noun-number]}
    - learner: "Va bene, ma se avete qualche desideri, ditemelo!"
      errors: [noun-number]
    - tutor: "Se proprio abbiamo qualche desiderio... una macchina del caffè nuova! La nostra è rotta."
      recast: {text: "qualche desideri", fix: "qualche desiderio", tags: [noun-number]}
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? E per il mio, ovviamente: io e lei facciamo trent'anni lo stesso giorno!"
    # merlin-1365_0100256-0
    - learner: "Presto è un giorno molto importante nella tua vita e vado con piacere!"
      errors: [ce-ci-sono]
    - tutor: "Grazie! Ma «presto è un giorno importante»? Per dire che un giorno arriva, che cosa usiamo?"
      prompt: {text: "Presto è un giorno", tags: [ce-ci-sono]}
    - learner: "Presto c'è un giorno molto importante!"
    - tutor: "Esatto! La festa la facciamo sabato 14 a Napoli, da noi. Ci saranno circa trenta persone. Tu riesci a venire?"
      goals: [date, guests]
    # merlin-1365_0100184-2
    - learner: "Dopo è molto difficile d'arrivare a Napoli in punto ma voglio festeggiare con voi quando arrivo!"
      errors: [preposition, word-choice]
    - tutor: "Ma certo! Però «difficile d'arrivare»? Dopo «è difficile», serve quel «di»?"
      prompt: {text: "d'arrivare", tags: [preposition]}
    - learner: "Sì, è difficile d'arrivare prima delle dieci, finisco tardi."
      errors: [preposition]
    - tutor: "Lo so, è difficile arrivare prima delle dieci, ma non importa: la pizza la teniamo in caldo per te! E il regalo? Dicci almeno qualcosa!"
      recast: {text: "d'arrivare", fix: "arrivare", tags: [preposition]}
      goals: [food]
    # merlin-1365_0100182-2
    - learner: "Siete un po' curiosi?"
    - tutor: "Tantissimo! Dai, dimmi almeno di che colore è."
    # merlin-1365_0100183-9
    - learner: "Non dico che cosa porterò per voi."
    - tutor: "Va bene, va bene, aspettiamo sabato. Ma niente di troppo caro, eh!"
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [word-order]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Io pensavo a una cena sabato 9, a casa nostra, con i suoi amici dell'università."
    # merlin-1365_0100183-5
    - learner: "Sicuramente mi piace andare da voi."
    - tutor: "Perfetto! Cucino io: pasta al forno e torta al cioccolato. Tu pensi al regalo con me?"
      goals: [date, guests, food]
    # merlin-1365_0100178-8
    - learner: "Allora, vorreste una poltra o un tavolo?"
      errors: [word-choice]
    - tutor: "Una poltrona! Sara ne vuole una da tanto per leggere vicino alla finestra."
      new: [{lemma: poltrona, gloss: armchair}]
      recast: {text: "una poltra", fix: "una poltrona", tags: [word-choice]}
    # merlin-1365_0100097-4
    - learner: "Però, noi abbiamo per voi il regalo - una macchina BMW."
      errors: [word-order]
    - tutor: "Ahah, magari! Ma «abbiamo per voi il regalo»: l'ordine suona strano. Dove metti «per voi»?"
      prompt: {text: "abbiamo per voi il regalo", tags: [word-order]}
    - learner: "Noi abbiamo il regalo per voi: una BMW!"
    - tutor: "Esatto! E con quali soldi la compri, questa BMW?"
    # merlin-1365_0100031-3
    - learner: "Sono gentile e ho molti soldi!"
    - tutor: "Ahah, fortunata! Scherzi a parte, la sua idea è perfetta: la compriamo insieme sabato mattina?"
      goals: [gift]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia? Quest'anno resti qui con gli amici Erasmus, vero? Che cosa farete?"
    # merlin-1395_0000446-8
    - learner: "Visitiamo la città, assaggiamo i piatti tipici italiani e parliamo italiano certamente."
    - tutor: "Ottimo programma, all'italiana! E da piccola, in Spagna, com'era il Natale?"
      goals: [compare]
    - learner: "Andavamo dai nonni a Granada ed eravamo sempre in trenta a tavola!"
    - tutor: "Che bello! Senti, ho una notizia: io e Stefano ci sposiamo, il 20 novembre!"
      goals: [past]
    # merlin-1365_0100177-0
    - learner: "Mi piace molto che sposate!"
      errors: [reflexive]
    - tutor: "Grazie! Ma «che sposate»? Con il verbo «sposarsi», manca un pronome."
      prompt: {text: "che sposate", tags: [reflexive]}
    - learner: "Che bello che vi sposate!"
    - tutor: "Esatto! E naturalmente sei invitata."
    # merlin-1365_0100093-5
    - learner: "C'è qualcosa della Spagna, che posso portare?"
      errors: [articulated-preposition]
    - tutor: "Che gentile! Ma «qualcosa della Spagna»: lo porti da lì, no? Quale preposizione serve?"
      prompt: {text: "della Spagna", tags: [articulated-preposition]}
    - learner: "Sì, qualcosa della Spagna per la festa."
      errors: [articulated-preposition]
    - tutor: "Qualcosa dalla Spagna? Un po' di prosciutto spagnolo sarebbe perfetto per il rinfresco!"
      recast: {text: "della Spagna", fix: "dalla Spagna", tags: [articulated-preposition]}
      goals: [ask]
      new: [{lemma: rinfresco, gloss: buffet reception}]
    # merlin-1365_0100138-0
    - learner: "Vi auguro tante belle cose per il vostro futuro e mi piace venire a Napoli per festeggiare con voi."
    - tutor: "Grazie di cuore! Allora ci vediamo il 20 novembre a Napoli, con il prosciutto!"
      goals: [plan]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Raccontami qualcosa di te."
    # merlin-1325_1001029-0
    - learner: "Sono Thomas Green, monaco - sacerdote benedettino nel monastero di S. Mauro in Inghilterra."
    - tutor: "Che sorpresa, benvenuto! E come mai vuoi fare volontariato con noi?"
    # merlin-1325_9000107-2
    - learner: "Ho già fatto diverse lavori de solidarietà perchè ho sempre avuto interesse in aiutare quelle, che disfortunatamente, vivono in posti che sono sottosviluppate e che non hanno le nostre opportunità."
      errors: [adjective-agreement, preposition, word-choice, spelling]
    - tutor: "Che bello. Ma «diverse lavori»? «Lavoro» è maschile..."
      prompt: {text: "diverse lavori", tags: [adjective-agreement]}
    - learner: "Sì, diverse lavori, in Africa e in Brasile."
      errors: [adjective-agreement]
    - tutor: "Hai fatto diversi lavori in Africa e in Brasile, che esperienza! E adesso, qui in Italia?"
      recast: {text: "diverse lavori", fix: "diversi lavori", tags: [adjective-agreement]}
      goals: [motivation]
    # merlin-1325_1001025-5
    - learner: "E anche qui faccio questi tipi di lavoro."
    - tutor: "Benissimo. E l'inglese è la tua lingua: potresti insegnarlo ai ragazzi stranieri! Abbiamo un corso il martedì sera e il sabato mattina."
      goals: [skills]
    # merlin-1325_1001029-3
    - learner: "Tra questi due terminazioni sono assolutamente libero."
      errors: [adjective-agreement, word-choice]
    - tutor: "Ottimo! Ma «questi due terminazioni»? Pensa al genere... e forse c'è anche una parola più semplice."
      prompt: {text: "questi due terminazioni", tags: [adjective-agreement]}
    - learner: "Tra queste due date sono libero, tutte e due."
    - tutor: "Perfetto. Allora preferisci il martedì sera o il sabato mattina, che è più tranquillo?"
      goals: [time]
    # merlin-1325_1001048-9
    - learner: "Magari è meglio."
    - tutor: "D'accordo, allora il sabato mattina. I ragazzi saranno felicissimi!"
      goals: [choose]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Lei è qui per il posto di insegnante di spagnolo, vero? Mi parli delle sue lingue."
    # merlin-1325_1001036-3
    - learner: "Finlandese è soltanto un passatempo preferito, ho una lezione per una settimana da 2 anni."
      errors: [preposition, article-use]
    - tutor: "Anche il finlandese, interessante! Ma «una lezione per una settimana»? Lei vuole dire ogni settimana: come si dice?"
      prompt: {text: "per una settimana", tags: [preposition]}
    - learner: "Sì, una lezione per una settimana, il lunedì."
      errors: [preposition]
    - tutor: "Una lezione a settimana, il lunedì: brava! E l'italiano come lo ha imparato?"
      recast: {text: "per una settimana", fix: "a settimana", tags: [preposition]}
      goals: [intro]
    # merlin-1325_9000533-2
    - learner: "Ma lo faccio anché ascoltando la musica italiana e leggere giornali italiani."
      errors: [verb-form, spelling]
    - tutor: "Ottima idea. Ma «ascoltando la musica e leggere»? I due verbi dovrebbero avere la stessa forma."
      prompt: {text: "leggere", tags: [verb-form]}
    - learner: "Sì, ascoltando la musica e leggere i giornali."
      errors: [verb-form]
    - tutor: "Ascoltando musica e leggendo giornali: perfetto per imparare. Che cosa dice sempre ai suoi studenti?"
      recast: {text: "leggere", fix: "leggendo", tags: [verb-form]}
      goals: [experience]
    # merlin-1325_1001035-9
    - learner: "Vale la pena di studiare molto."
    - tutor: "Un ottimo consiglio! Studiare con calma ogni giorno è proprio un punto di forza per un'insegnante. Perché vuole lavorare da noi?"
      goals: [strengths]
    # merlin-1325_9000533-8
    - learner: "Penso che le mie esperienze saranno necessarie per Lei."
    - tutor: "Ne sono sicuro. Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001087-9
    - learner: "Com'è l'orario di lavoro?"
    - tutor: "Le lezioni sono il pomeriggio, dalle tre alle sette. Le faremo sapere entro venerdì. Arrivederci!"
      goals: [questions]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [article-use]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io sono sempre a casa, ma sto cercando un altro lavoro."
    # merlin-1365_0100456-14
    - learner: "Mi dispiace tanto ma per il momento no ho sentito nulla di un albergo o di altre ditte che cercano personale."
      errors: [negation]
    - tutor: "Grazie lo stesso! Ma ripeti: «no ho sentito»? Davanti al verbo, che parola usiamo?"
      prompt: {text: "no ho sentito", tags: [negation]}
    - learner: "Non ho sentito nulla, mi dispiace."
    - tutor: "Esatto. Non importa, cerco anche sui giornali."
    # merlin-1365_0100223-7
    - learner: "Ho guardato già tutti giornali queste ultime settimane, ma non c'è niente."
      errors: [article-use]
    - tutor: "Che gentile! Ma «tutti giornali»? Tra «tutti» e il nome manca qualcosa."
      prompt: {text: "tutti giornali", tags: [article-use]}
    - learner: "Sì, ho guardato tutti giornali di Milano."
      errors: [article-use]
    - tutor: "Tutti i giornali di Milano? Sei un tesoro! E tu, sei ancora a casa anche tu?"
      recast: {text: "tutti giornali", fix: "tutti i giornali", tags: [article-use]}
    - learner: "Sì, lavoro da casa: è conveniente, ma a volte mi sento sola."
      errors: [false-friend]
    - tutor: "È comodo, sì, ma ti capisco: niente traffico, ma niente colleghi."
      recast: {text: "conveniente", fix: "comodo", tags: [false-friend]}
      goals: [situation, pros, cons]
    # merlin-1365_0100117-3
    - learner: "Se tu sei interessato, potrei domandare al mio capo se tu potresti mandare il tuo curriculum."
    - tutor: "Davvero lo faresti? Sarebbe fantastico!"
    # merlin-1365_0100212-9
    - learner: "Sarebbe divertente se andassimo al lavoro insieme."
    - tutor: "Bellissimo! Allora per te è meglio l'ufficio, con un amico vicino. Ti mando i miei documenti stasera."
      goals: [preference]


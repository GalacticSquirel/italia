# Set v-real-b1-3: B1 dialogues built around real learner sentences (pool b1-3).
# File 1: volunteering (an information day at an association).
- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000137-3
    - learner: "Ho letto il vostro annuncio e subito ho voluto di aiutarvi!"
      errors: [modal-infinitive]
    - tutor: "Che bello, grazie! Però ripeti un attimo: «ho voluto di aiutarvi»? Dopo «volere» ci va quel «di»?"
      prompt: {text: "ho voluto di aiutarvi", tags: [modal-infinitive]}
    - learner: "No, scusa: ho voluto aiutarvi subito!"
    - tutor: "Esatto! E come mai ti interessa proprio il volontariato?"
    # merlin-1325_9000279-4
    - learner: "Ho la figlia di 4 anni e ogni volta guardando i bambini poveri sulla TV divento triste."
      errors: [article-use, articulated-preposition]
    - tutor: "Ti capisco. Ma dimmi: «ho la figlia»? Quando parli di lei per la prima volta, quale articolo usi?"
      prompt: {text: "Ho la figlia", tags: [article-use]}
    - learner: "Sì, ho la figlia di quattro anni. Quando vedo i bambini poveri in TV, divento triste."
      errors: [article-use]
    - tutor: "Ah, hai una figlia di quattro anni! Ti capisco, succede anche a me. E con i bambini sei una persona paziente?"
      recast: {text: "la figlia", fix: "una figlia", tags: [article-use]}
      goals: [motivation]
    # merlin-1325_1001110-0
    - learner: "Sono sempre stata così."
    - tutor: "Allora sei perfetta per il nostro doposcuola, dove aiutiamo i bambini con i compiti il mercoledì, dalle tre alle sei. Ti piacerebbe?"
      goals: [skills]
      new: [{lemma: doposcuola, gloss: after-school club}]
    # merlin-1365_0100211-6
    - learner: "Questo lavoro è veramente ottimo!"
    - tutor: "Che bello sentirlo! Allora ti segno per il mercoledì pomeriggio. Benvenuta tra noi!"
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Raccontami qualcosa di te."
    # merlin-1325_9000278-0
    - learner: "Sono una studentessa di storia e lingue."
    - tutor: "Benvenuta! Sai, noi raccogliamo oggetti usati e li vendiamo per aiutare i nostri progetti. Che cosa ne pensi?"
    # merlin-1325_9000137-4
    - learner: "Penso che la vostra idea del materiale reciclabile sia fantastica e mi diverto molto quando vendo le cose nei mercantini dell'usato."
      errors: [word-choice, spelling]
    - tutor: "Che bello! Scusa, dove vendi le cose? Nei «mercantini»?"
      prompt: {text: "mercantini", tags: [word-choice]}
    - learner: "Nei mercatini dell'usato, la domenica mattina."
    - tutor: "Ah, ecco! Allora hai già esperienza con la vendita, e ti piace pure. Quanto tempo potresti darci?"
      goals: [motivation, skills]
    # merlin-1325_9000137-8
    - learner: "So che potrebbe essere difficile trovare un posto per me, ma dopo il 29 agosto, comincerò studiare in Francia."
      errors: [preposition]
    - tutor: "Nessun problema, abbiamo anche turni brevi. Ma senti come suona: «comincerò studiare». Manca qualcosa tra i due verbi?"
      prompt: {text: "comincerò studiare", tags: [preposition]}
    - learner: "Comincerò a studiare in Francia, quindi sono libera solo a luglio e ad agosto."
    - tutor: "Esatto! Luglio e agosto vanno benissimo. Il nostro mercatino si fa ogni sabato: ti va di lavorare lì?"
      goals: [time]
      new: [{lemma: mercatino, gloss: flea market}]
    # merlin-1365_0100120-15
    - learner: "È molto interessante!"
    - tutor: "Allora siamo d'accordo: sabato prossimo ti presento gli altri volontari del sabato."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Dimmi qualcosa di te."
    # merlin-1325_9000536-2
    - learner: "Sono una persona seriosa, curiosa e desideroso di imparare."
      errors: [adjective-agreement, false-friend]
    - tutor: "Piacere! Ma aspetta: «una persona... desideroso»? Guarda bene la fine dell'ultimo aggettivo."
      prompt: {text: "desideroso", tags: [adjective-agreement]}
    - learner: "Ah, desiderosa! Persona è femminile, anche se sono un uomo."
    - tutor: "Proprio così, bravo. E perché vuoi fare volontariato?"
    # merlin-1325_1001025-2
    - learner: "Ho 26 anni e aiuto per tutti, perchè secondo me questo e un positivo gesto."
      errors: [preposition, word-order, spelling]
    - tutor: "Bellissimo motivo. Però dimmi: «aiuto per tutti»? Con il verbo «aiutare» serve quella preposizione?"
      prompt: {text: "aiuto per tutti", tags: [preposition]}
    - learner: "Hai ragione, aiuto tutti. Senza preposizione."
    - tutor: "Perfetto. E che cosa sai fare? Abbiamo bisogno di tante cose diverse."
      goals: [motivation]
    - learner: "Faccio il muratore, ma la domenica sono libero e so anche cocinare. Mi piacerebbe cucinare per qualcuno."
      errors: [word-choice]
    - tutor: "Sai cucinare e la domenica sei libero? Perfetto per la nostra mensa per le persone senza casa! Ti aspettiamo domenica alle dieci."
      recast: {text: "cocinare", fix: "cucinare", tags: [word-choice]}
      goals: [skills, time, choose]
      new: [{lemma: mensa, gloss: soup kitchen}]

- scenario: volontariato
  level: B1
  persona: en-m-heritage
  history: [piacere]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Quanti anni hai?"
    # merlin-1325_1001096-0
    - learner: "Ho 17 anni."
    - tutor: "Perfetto, dai sedici anni puoi già fare volontariato con noi. Perché ti interessa?"
    # merlin-1325_1001014-4
    - learner: "Mi piace i bambini per questo posso fare attenzione da loro."
      errors: [piacere, preposition]
    - tutor: "Che bello! Però ripeti: «mi piace i bambini»? I bambini sono tanti..."
      prompt: {text: "Mi piace i bambini", tags: [piacere]}
    - learner: "Mi piacciono i bambini! Ho tre fratelli più piccoli."
    - tutor: "Esatto! E con tre fratelli piccoli hai già tanta esperienza. Vai ancora a scuola, vero?"
      goals: [motivation, skills]
    # merlin-1365_0100233-1
    - learner: "Vado ancora alla scuola ma dopo le prossime vacanze d'estate fra una settimana dovrò andare solo un anno al liceo."
      errors: [articulated-preposition]
    - tutor: "Quindi ti manca solo un anno, che bello! Ma come hai detto: «vado ancora alla scuola»? Qui l'articolo ci vuole davvero?"
      prompt: {text: "alla scuola", tags: [articulated-preposition]}
    - learner: "Sì, vado ancora alla scuola. Però d'estate sono libero tutto il giorno."
      errors: [articulated-preposition]
    - tutor: "Quindi vai ancora a scuola, ma d'estate sei libero: benissimo! Il nostro campo per bambini è proprio a luglio. Sai che viene anche il tuo amico Luca?"
      recast: {text: "alla scuola", fix: "a scuola", tags: [articulated-preposition]}
      goals: [time]
    # merlin-1365_0100212-9
    - learner: "Sarebbe divertente se andassimo al lavoro insieme."
    - tutor: "Allora vi metto nello stesso gruppo: il campo dei bambini, dal primo luglio. Ci vediamo lì!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [noun-number]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001011-9
    - learner: "Avrei qualche domande: c'è un colloquio personale per le persone che vogliono partecipare?"
      errors: [noun-number]
    - tutor: "Certo, chiedi pure! Ma prima ripeti l'inizio: «qualche domande»? Dopo «qualche», singolare o plurale?"
      prompt: {text: "qualche domande", tags: [noun-number]}
    - learner: "Singolare: avrei qualche domanda."
    - tutor: "Brava! E sì, facciamo un breve incontro con tutti, così conosciamo le persone che vogliono aiutarci. Perché vorresti farlo?"
    # merlin-1325_1001144-6
    - learner: "Inoltre, secondo me se uno vuole carriera nella vita, bisogna che impari almeno una lingua straniera."
      errors: [word-choice]
    - tutor: "Hai ragione: se uno vuole fare carriera, le lingue sono importantissime. Quindi vorresti insegnare le lingue da noi?"
      recast: {text: "vuole carriera", fix: "vuole fare carriera", tags: [word-choice]}
    - learner: "Sì, sono profesora di inglese e il lunedì e il giovedì pomeriggio ho tempo per i ragazzi stranieri."
      errors: [word-choice]
    - tutor: "Una professoressa di inglese, perfetto! Il nostro corso gratis è proprio il lunedì e il giovedì dalle quattro. Prendi tu il gruppo dei principianti?"
      recast: {text: "profesora", fix: "professoressa", tags: [word-choice]}
      goals: [motivation, skills, time]
      new: [{lemma: principiante, gloss: beginner}, {lemma: professoressa, gloss: teacher}]
    # merlin-1325_1001048-9
    - learner: "Magari è meglio."
    - tutor: "D'accordo, allora quel gruppo è tuo. Ci vediamo lunedì alle quattro!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [noun-number]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Organizziamo eventi per aiutare una scuola in Kenya."
    # merlin-1325_1001019-5
    - learner: "Ho lavorato 3 anni per un aziende, che organizza eventi."
      errors: [noun-number]
    - tutor: "Interessante! Per «un aziende»? Ascolta bene: «un» e poi una parola al plurale?"
      prompt: {text: "un aziende", tags: [noun-number]}
    - learner: "Per un'azienda, scusa. Organizzavo feste e concerti."
    - tutor: "Esatto! Allora sai già organizzare eventi, è proprio quello che ci serve. Come mai vuoi aiutarci?"
      goals: [skills]
    - learner: "Mi piacerebbe aiutare i bambini che non possono andare a scuola, ma lavoro molto: potrei dare due sere al mese."
    - tutor: "È anche il nostro obiettivo, e due sere al mese vanno benissimo. Stiamo preparando una cena di beneficenza per dicembre: ti interesserebbe?"
      goals: [motivation, time]
      new: [{lemma: beneficenza, gloss: charity}]
    # merlin-1365_0100211-6
    - learner: "Questo lavoro è veramente ottimo!"
    - tutor: "Fantastico! Allora la prossima riunione per la cena è giovedì alle sette. Ti aspetto!"
      goals: [choose]

# File 8: a book club on a novel about online friendships, and school memories.
- scenario: film-libro
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Tu hai letto «Amici in rete», vero? Com'è cominciata la storia di Luca in rete?"
    # merlin-1325_9000750-5
    - learner: "Da un amico ne sono diventati decine."
    - tutor: "Esatto, e alla fine non esce più di casa. Se potessi parlare con Luca, che cosa gli diresti?"
      goals: [summary]
    # merlin-1325_1001041-1
    - learner: "Il tuo primo errore era che volevi fare grandi amicizie via internet."
      errors: [tense-aspect]
    - tutor: "Bella idea! Ma «il tuo primo errore era»: è un fatto chiuso, un errore preciso. Quale passato usiamo?"
      prompt: {text: "Il tuo primo errore era", tags: [tense-aspect]}
    - learner: "Sì, il primo errore era cercare amici solo lì."
      errors: [tense-aspect]
    - tutor: "Giusto, il suo primo errore è stato cercare amici solo lì. E gli altri personaggi?"
      recast: {text: "errore era", fix: "errore è stato", tags: [tense-aspect]}
    # merlin-1325_1001136-4
    - learner: "Forse uno degli amici virtuali è un gente molto pericoloso e vuole sapere il tuo indirizzo o altre informazioni."
      errors: [word-choice, adjective-agreement]
    - tutor: "Vero, c'è un uomo che vuole il suo indirizzo. Ma «un gente»? «Gente» vuol dire tante persone: per uno solo, che parola usi?"
      prompt: {text: "un gente", tags: [word-choice]}
    - learner: "Una persona molto pericolosa, sì!"
    - tutor: "Esatto! E a te il libro è piaciuto? Lo consiglieresti?"
      goals: [characters]
    # merlin-1365_0100120-15
    - learner: "È molto interessante!"
    - tutor: "Allora lo mettiamo nella lista per i ragazzi della scuola. Grazie, ottima presentazione!"
      goals: [opinion, recommend]

- scenario: film-libro
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Tu hai letto «Amici in rete» in spagnolo, vero? Che cosa ti ha colpito della storia?"
    # merlin-1325_1001059-2
    - learner: "Lo fa tanta gente, tutti chattano."
    - tutor: "È vero, non è solo un problema di Luca. E sua sorella Anna, che aiuta il fratello?"
      goals: [summary]
    # merlin-1325_1001056-1
    - learner: "Si può fare finta di essere un'altra persona, dire bugie e cose false."
    - tutor: "Infatti Anna lo scopre così: l'amico perfetto di Luca non esiste! Tu che cosa diresti a Luca alla fine?"
      goals: [characters]
    # merlin-1325_1001039-8
    - learner: "Spero che ho potuto aiutarti con i miei consigli."
      errors: [subjunctive-use]
    - tutor: "Molto dolce! Ma dopo «spero che»... «ho potuto» va bene? Che modo usiamo?"
      prompt: {text: "che ho potuto", tags: [subjunctive-use]}
    - learner: "Spero che abbia potuto aiutarti... no: spero di averti aiutato!"
    - tutor: "Perfetto, la seconda è ancora meglio! E il libro, ti è piaciuto?"
    # merlin-1325_1001046-0
    - learner: "Vorrei scrivere la mia opinione e anche vorrei dare un consiglio."
    - tutor: "Certo, dicci tutto!"
    # merlin-1325_1001046-2
    - learner: "Primo di tutto, secondo me, fare conoscere sull'Internet distruggere i contatti personali."
      errors: [verb-form, articulated-preposition, word-choice]
    - tutor: "Interessante. Ma «fare conoscere sull'Internet distruggere»: qual è il verbo principale? Così resta all'infinito."
      prompt: {text: "distruggere", tags: [verb-form]}
    - learner: "Fare conoscenza su internet distrugge i contatti veri. Per questo consiglio il libro ai genitori."
    - tutor: "Esatto. Un'opinione chiara e un consiglio utile: grazie!"
      goals: [opinion, recommend]

- scenario: film-libro
  level: B1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Tu hai letto «La stanza di Marco», giusto? Non lo conosco: com'è la prima frase?"
    # merlin-1365_0100212-2
    - learner: "Vengo da tornare da Bologna dove ho visitato un'altra ditta che potrebbe essere utile per il mio nuovo prodotto che sto sviluppando."
      errors: [word-choice]
    - tutor: "Ah, «sono appena tornato da Bologna»: comincia così, con un viaggio di lavoro! E chi è questo Marco?"
      recast: {text: "Vengo da tornare", fix: "Sono appena tornato", tags: [word-choice]}
      goals: [summary]
    # merlin-1365_0100269-2
    - learner: "Lo sai che incontro molti, chi può aiutarci."
      errors: [relative-pronoun]
    - tutor: "Mmm, «molti, chi può aiutarci»? Dopo «molti», quale pronome usiamo per unire le due parti?"
      prompt: {text: "chi può aiutarci", tags: [relative-pronoun]}
    - learner: "Molti che possono aiutarci! Così dice Marco alla moglie."
    - tutor: "Perfetto. Quindi Marco crede di avere tanti amici. E tu, che ne pensi del libro?"
      goals: [characters]
    # merlin-1325_1001055-8
    - learner: "Però era stato un sogno per alcuni anni."
    - tutor: "Capisco: il sogno di Marco, ma anche il tuo, di leggerlo? Lo consiglieresti al gruppo?"
      goals: [opinion]
    # merlin-1365_0100475-16
    - learner: "Penso che sia una buona idea per te."
    - tutor: "Allora lo leggo anch'io! Lo mettiamo per il mese prossimo."
      goals: [recommend]

- scenario: film-libro
  level: B1
  persona: es-m-worker
  history: [passive]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Tu questo mese hai visto un film, «L'amico perfetto», vero? Raccontaci la storia."
    # merlin-1325_1001046-8
    - learner: "Ho un amico che è stata molto gentile e caro ma una volta ha voluto incontrare con me."
      errors: [participle-agreement, reflexive]
    - tutor: "Ah, comincia così? Ma attento: un amico che «è stata» gentile? Guarda la fine."
      prompt: {text: "è stata", tags: [participle-agreement]}
    - learner: "Che è stato molto gentile. Così dice la protagonista, Sara, all'inizio."
    - tutor: "Esatto. E poi che cosa succede quando si incontrano?"
      goals: [summary]
    # merlin-1325_1001128-5
    - learner: "Non ho saputo cosa devo fare, perche ho ricevuto tantissimi messaggi, ma 4 settimane dopo questo è stato finito."
      errors: [verb-form, passive, spelling]
    - tutor: "Che storia! Ma «questo è stato finito»? Qualcosa finisce da solo: serve davvero «stato»?"
      prompt: {text: "è stato finito", tags: [passive]}
    - learner: "Sì, dopo quattro settimane è stato finito tutto."
      errors: [passive]
    - tutor: "Quindi dopo quattro settimane è finito tutto, per fortuna! E Sara, come personaggio, ti è piaciuta?"
      recast: {text: "è stato finito", fix: "è finito", tags: [passive]}
      goals: [characters]
    # merlin-1325_9000323-11
    - learner: "Non faccia qualcosa che non vuole."
    - tutor: "Sì, è proprio questo il messaggio del film. Lo consigli a tutti?"
      goals: [opinion]
    # merlin-1365_0100212-9
    - learner: "Sarebbe divertente se andassimo al cinema insieme."
    - tutor: "Ottima idea! Allora venerdì lo guardiamo tutti insieme qui al club."
      goals: [recommend]

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu sei cresciuta vicino a Manchester, vero? E tuo padre aveva un ristorante?"
    # merlin-1365_0100461-1
    - learner: "Mio padre lavora in un ristorante piccola e così ho studiato cucinare presto."
      errors: [adjective-agreement, word-choice]
    - tutor: "Che bello! Ma «un ristorante piccola»? «Ristorante» è maschile..."
      prompt: {text: "un ristorante piccola", tags: [adjective-agreement]}
    - learner: "Un ristorante piccolo, sì. Così ho imparato a cucinare da bambina."
    - tutor: "Esatto. E la scuola com'era? Ti piaceva?"
      goals: [place, habits]
    # merlin-1395_0000443-3
    - learner: "Per la scuola, abbiamo un sacco da fare ma il professore è molto simpatico."
    - tutor: "Parli di adesso, all'università? E da piccola, invece?"
    # merlin-1365_0100481-1
    - learner: "Nella mia scuola non è successo molto!"
    - tutor: "Ahah, una scuola tranquilla! Allora i ricordi più belli sono quelli del ristorante, con il papà."
      goals: [school, event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu sei cresciuto a Valencia, vicino al mare, vero? E la scuola com'era?"
    # merlin-1365_0100233-11
    - learner: "Il mio esame superato era un po'difficile ma finalmente era abbastanza bene."
      errors: [tense-aspect, word-choice]
    - tutor: "Parli dell'esame finale? Ma «finalmente era abbastanza bene»: è il risultato finale, un fatto concluso. Quale passato usiamo?"
      prompt: {text: "finalmente era abbastanza bene", tags: [tense-aspect]}
    - learner: "Alla fine è andato abbastanza bene!"
    - tutor: "Esatto! E i compagni di scuola?"
      goals: [place, habits]
    # merlin-1395_0000398-3
    - learner: "Mio fratello lavora tutto il giorno, e deve studiare tanto per l'esame, e poi va sempre in giro con la sua nuova ragazza."
    - tutor: "Ahah, tuo fratello adesso è proprio impegnato! Ma da piccoli, studiavate insieme?"
      goals: [school]
    # merlin-1395_0001060-1
    - learner: "Non ti ho visto per un anno!"
    - tutor: "Ah, è vero, anche noi non ci vedevamo da un anno! Questo è il ricordo più bello: ritrovarsi."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Che bello qui! Tu da piccola abitavi in Scozia, vero? Che cosa facevi dopo la scuola?"
    # merlin-1365_0100480-11
    - learner: "Allora, devo finire la lettera perché devo imparare per il compito in classe domani."
      errors: [preposition]
    - tutor: "Ahah, questo lo dici adesso o lo dicevi da piccola? Ma «compito in classe domani»: manca qualcosa prima di «domani»."
      prompt: {text: "compito in classe domani", tags: [preposition]}
    - learner: "Per il compito in classe di domani! Lo dicevo sempre alla mia amica di penna."
    - tutor: "Esatto. Allora studiavi tanto! E com'era la tua scuola?"
      goals: [place, habits]
    # merlin-1395_0000443-3
    - learner: "Per la scuola, abbiamo un sacco da fare ma il professore è molto simpatico."
    - tutor: "Parli della scuola di oggi, vedo! Ma da bambina avevi un insegnante preferito?"
    # merlin-1395_0000649-2
    - learner: "La insegnante parla lentemente e io capisco quasi tutto."
      errors: [article-form, spelling]
    - tutor: "Ah, la tua insegnante d'italiano di adesso! Ma «la insegnante»? Ascolta l'inizio di «insegnante»: l'articolo cambia."
      prompt: {text: "La insegnante", tags: [article-form]}
    - learner: "L'insegnante parla piano. Ma da piccola la mia maestra preferita era la signora Brown."
    - tutor: "Esatto. La signora Brown, la maestra preferita: che bel ricordo!"
      goals: [school, event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [ce-ci-sono]
  turns:
    - tutor: "Che bello qui! Tu sei cresciuta a Siviglia, giusto? Nel tuo quartiere c'erano tanti bambini?"
    # merlin-1365_0100233-8
    - learner: "In più il prossimo anno c'è la mia maturità."
    - tutor: "Ah, quindi sei ancora al liceo? Ma da piccola, cosa facevi il pomeriggio?"
    - learner: "Giocavo in strada con i vicini, e la sera faceva i compiti con mia nonna."
      errors: [subject-verb-agreement]
    - tutor: "Che bello! Ma «la sera faceva i compiti»: chi li faceva, tu o la nonna?"
      prompt: {text: "faceva i compiti", tags: [subject-verb-agreement]}
    - learner: "Io! La sera facevo i compiti con la nonna."
    - tutor: "Esatto. E a scuola com'era?"
      goals: [place, habits]
    # merlin-1365_0100481-1
    - learner: "Nella mia scuola non è successo molto!"
    - tutor: "Una scuola tranquilla, allora. Ma un ricordo speciale ce l'hai?"
      goals: [school]
    # merlin-1325_1001048-4
    - learner: "Quando sono stata a Caserta, tutti i giorni ho imparato qualcosa di nuovo."
    - tutor: "Ah, Caserta, con la scuola di lingua! Quello è un ricordo più recente, ma bellissimo."
      goals: [event]

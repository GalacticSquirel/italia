# File 3: language courses and trips (advice for a trip to Naples, past holidays).
- scenario: consigli-viaggio
  level: B1
  persona: es-f-teacher
  history: [verb-form]
  turns:
    - tutor: "Allora, quando parti per Napoli? E come va con l'italiano?"
    # merlin-1395_0000446-0
    - learner: "Sto facendo un corso di lingua italiana."
    - tutor: "Si sente, parli già benissimo! E quest'estate, allora, la passi a studiare?"
    # merlin-1365_0100105-1
    - learner: "Per questo motivo mi piacerebbe frequentare il corso di due settimane nel comune di Pisciotta."
    - tutor: "Pisciotta, sul mare del Cilento! È un posto bellissimo. Ci vai da sola?"
      goals: [plans]
    # merlin-1365_0100148-3
    - learner: "Mentre frequento il corso i figli e il marito possono approfittare delle spiagge."
    - tutor: "Perfetto, le spiagge lì sono stupende. Un consiglio: cercate una casa vicino al mare, non in paese. E come ci arrivate?"
      goals: [advice]
    - learner: "Non sapiamo ancora. C'è un treno da Napoli?"
      errors: [verb-form]
    - tutor: "Sì, c'è. Ma aspetta: «non sapiamo»? Il verbo «sapere» con «noi» è un po' particolare."
      prompt: {text: "Non sapiamo", tags: [verb-form]}
    - learner: "Ah, sì: non sapiamo, perché è la prima volta."
      errors: [verb-form]
    - tutor: "Tranquilla, lo sappiamo noi di Napoli: prendete il treno, in tre ore siete lì. Ma attenzione: ad agosto i treni sono sempre pieni, quindi comprate i biglietti qualche giorno prima!"
      recast: {text: "sapiamo", fix: "sappiamo", tags: [verb-form]}
      goals: [transport, warnings]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-professional
  history: [conditional-form]
  turns:
    - tutor: "Allora, quando parti per Napoli? Hai già trovato una scuola di lingua?"
    # merlin-1365_0100100-3
    - learner: "Mi piacerei un corso di due o tre settimane a Napoli e, se possibile, di abitare in casa privata."
      errors: [conditional-form, preposition, article-use]
    - tutor: "Ottimo piano. Ma senti: «mi piacerei»? Pensa a che cosa ti piace: il corso. Allora il verbo come cambia?"
      prompt: {text: "Mi piacerei", tags: [conditional-form]}
    - learner: "Mi piacerebbe un corso di tre settimane, sì."
    - tutor: "Esatto! E vuoi stare in albergo o in una casa?"
      goals: [plans]
    # merlin-1365_0100102-5
    - learner: "Non voglio provitare solamente a scuola. Per questo preferirei vivere con una famiglia."
      errors: [word-choice]
    - tutor: "Hai ragione, imparare solo a scuola non basta. Chiedi subito alla scuola una famiglia: le migliori finiscono presto!"
      recast: {text: "provitare", fix: "imparare", tags: [word-choice]}
      goals: [advice]
    # merlin-1395_0000533-7
    - learner: "Ho veramente fretta di uscire con te, di discoprire la tua città!"
      errors: [word-choice]
    - tutor: "Anch'io non vedo l'ora di farti scoprire Napoli! Dall'aeroporto prendi l'autobus per la stazione: costa poco ed è veloce. Però tieni sempre la borsa davanti a te!"
      recast: {text: "discoprire", fix: "scoprire", tags: [word-choice]}
      goals: [transport, warnings]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-retired
  history: [object-pronoun]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0000369-4
    - learner: "Senti Valentina, vorrei fare con te un appuntamento per incontrarci."
    - tutor: "Certo, con piacere! Arrivate il 12 maggio, giusto? Allora vi aspetto a cena da me il 13."
      goals: [plans]
    # merlin-1365_0100136-3
    - learner: "Non vedo l'ora di rivederti e la tua famiglia."
      errors: [object-pronoun]
    - tutor: "Anch'io! Ma senti: «rivederti e la tua famiglia». Con due persone, il pronome attaccato al verbo funziona?"
      prompt: {text: "rivederti e la tua famiglia", tags: [object-pronoun]}
    - learner: "Non vedo l'ora di rivedere te e la tua famiglia!"
    - tutor: "Bravissimo! Allora ci vediamo da me, in via Toledo."
    # merlin-1395_0001016-3
    - learner: "Ma non sapiamo come arriviamo a casa tua."
      errors: [verb-form]
    - tutor: "Facile! Ma prima: «non sapiamo»? Il verbo «sapere» con «noi» è un po' particolare."
      prompt: {text: "non sapiamo", tags: [verb-form]}
    - learner: "Non sappiamo come arrivare, scusa."
    - tutor: "Esatto. Prendete la metro fino a piazza Dante: io abito a due passi. E attenti alle borse sulla metro!"
      goals: [transport, warnings]
    # merlin-1395_0001119-6
    - learner: "Sono molto curioso di fare conoscenza con i tuoi parenti."
    - tutor: "Anche loro sono curiosi di conoscervi! Un consiglio: venite con tanta fame, mia madre cucina per dieci."
      goals: [advice]

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli? Venerdì sera, vero? Io purtroppo questa settimana lavoro molto."
    # merlin-1395_0000551-8
    - learner: "Quando hai un po tempo libero?"
      errors: [preposition, spelling]
    - tutor: "Ci provo! Ma attento: dopo «un po'», davanti a un nome, manca una piccola parola. Prova di nuovo?"
      prompt: {text: "un po tempo", tags: [preposition]}
    - learner: "Quando hai un po' di tempo libero?"
    - tutor: "Perfetto! Sabato pomeriggio sono libera: ti porto in giro per il centro."
      goals: [plans]
    # merlin-1395_0000533-7
    - learner: "Ho veramente fretta di uscire con te, di discoprire la tua città!"
      errors: [word-choice]
    - tutor: "Anch'io non vedo l'ora di farti scoprire la città! E il lavoro nuovo come va?"
      recast: {text: "discoprire", fix: "scoprire", tags: [word-choice]}
    # merlin-1395_0001061-8
    - learner: "Voglio raccontarti un po'più al nostro prossimo incontro."
      errors: [preposition]
    - tutor: "Va bene! Ma «un po' più»? Come prima: dopo «un po'» manca qualcosa."
      prompt: {text: "un po'più", tags: [preposition]}
    - learner: "Sì, ti racconto un po' più sabato."
      errors: [preposition]
    - tutor: "D'accordo, sabato mi racconti un po' di più. Dalla stazione prendi la metro, e attento ai soldi in centro!"
      recast: {text: "un po' più", fix: "un po' di più", tags: [preposition]}
      goals: [advice, transport, warnings]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000514-3
    - learner: "Per la vacanza, sono stato per una settimana a Venezia."
    - tutor: "A Venezia! Che bello. E che tempo ha fatto?"
      goals: [where]
    # merlin-1395_0001060-5
    - learner: "Era fantastico, c'era sempre il sole!"
      errors: [tense-aspect]
    - tutor: "Che fortuna! Ma «era fantastico»: parli di tutta la settimana, che è finita. Che tempo usi per dire com'è andata?"
      prompt: {text: "Era fantastico", tags: [tense-aspect]}
    - learner: "Sì, era fantastico! Mai una nuvola."
      errors: [tense-aspect]
    - tutor: "È stato fantastico, allora, e con il sole Venezia è ancora più bella. Che cosa avete fatto?"
      recast: {text: "Era fantastico", fix: "È stato fantastico", tags: [tense-aspect]}
      goals: [weather]
    # merlin-1395_0000551-3
    - learner: "Siamo andati in macchina e abbiamo visto molte cose bellissime."
    - tutor: "Quindi avete visto anche i paesi lì vicino. Qual è stato il momento più bello?"
      goals: [activities]
    # merlin-1395_0000376-3
    - learner: "C'era il sole e ho mangiato tre gelati."
    - tutor: "Tre gelati in un giorno, grande! Hai fatto delle foto?"
    # merlin-1395_0000388-10
    - learner: "E dopo ti farò vedere alquni foto."
      errors: [adjective-agreement, spelling]
    - tutor: "Sì, dai! Ma «alquni foto»? «Foto» è femminile: come cambia la parola prima?"
      prompt: {text: "alquni foto", tags: [adjective-agreement]}
    - learner: "Ti farò vedere alcune foto, promesso!"
    - tutor: "Perfetto, allora stasera mi fai vedere tutte le foto!"
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [comparative]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100192-2
    - learner: "Quest'estate sono andata a Reggio Calabria dove ho trascorso due mesi e ho frequentato l'università Dante Alighieri per stranieri."
    - tutor: "Due mesi in Calabria a studiare italiano! Faceva molto caldo?"
      goals: [where]
    - learner: "Sì, era molto caldo, quasi quaranta gradi."
      errors: [word-choice]
    - tutor: "Faceva molto caldo, lo immagino! E dove abitavi?"
      recast: {text: "era molto caldo", fix: "faceva molto caldo", tags: [word-choice]}
      goals: [weather]
    # merlin-1395_0001061-7
    - learner: "Ma la cosa la più importante per me: la famiglia da cui sono stata era veramente \"la mia famiglia\"!"
      errors: [comparative]
    - tutor: "Che bello! Ma «la cosa la più importante»? In italiano quell'articolo lo ripetiamo?"
      prompt: {text: "la cosa la più importante", tags: [comparative]}
    - learner: "La cosa più importante: la famiglia era veramente la mia famiglia."
    - tutor: "Esatto! E con questa famiglia che cosa facevate?"
    - learner: "Il fine settimana andavamo al mare e la sera mangiavamo tutti juntos."
      errors: [word-choice]
    - tutor: "Mangiare tutti insieme la sera, che vacanza perfetta! E adesso, quando parli italiano, come ti senti?"
      recast: {text: "tutti juntos", fix: "tutti insieme", tags: [word-choice]}
      goals: [activities]
    # merlin-1325_1001055-10
    - learner: "Da quel momento mi sento a mio agio."
    - tutor: "Si vede! Allora il regalo più bello di quest'estate è stato proprio il tuo italiano."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1325_1001020-1
    - learner: "Sono stata con il mio fidanzato al Residence del Lago, ma non è stato tutto buono."
    - tutor: "Oh no! Che cosa è successo?"
      goals: [where]
    # merlin-1325_9000316-9
    - learner: "Il lago è molto lontano dall'albergo."
    - tutor: "Che peccato, e il nome promette il contrario! Almeno il tempo era bello?"
    - learner: "Sì, c'era il sole, ma era troppo caldo e l'aria condizionata non funzionava."
      errors: [word-choice]
    - tutor: "Mamma mia, faceva troppo caldo e senza aria condizionata! E allora che cosa avete fatto?"
      recast: {text: "era troppo caldo", fix: "faceva troppo caldo", tags: [word-choice]}
      goals: [weather]
    # merlin-1325_1001015-7
    - learner: "Io preferito fare la gita, ma il lago é lontano del residence."
      errors: [auxiliary-choice, articulated-preposition, spelling]
    - tutor: "Capisco. Ma «io preferito»? Manca qualcosa prima di «preferito»."
      prompt: {text: "Io preferito", tags: [auxiliary-choice]}
    - learner: "Io ho preferito fare una gita in montagna, con la funivia."
    - tutor: "Esatto. In montagna almeno era fresco! Ma alla fine, com'è stata la vacanza?"
      goals: [activities]
      new: [{lemma: funivia, gloss: cable car}]
    # merlin-1325_9000141-9
    - learner: "Dunque questa vacanza è stata orribile per me."
    - tutor: "Mi dispiace! Allora il momento più bello è stato la montagna. La prossima volta vieni con me in Trentino."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0001061-0
    - learner: "E da lungo tempo che non ci abbiamo visto!"
      errors: [tense-aspect, spelling]
    - tutor: "Hai ragione! Ma «non ci abbiamo visto»: è una cosa che dura fino a oggi. Quale tempo usiamo?"
      prompt: {text: "non ci abbiamo visto", tags: [tense-aspect]}
    - learner: "È da tanto tempo che non ci vediamo!"
    - tutor: "Esatto, da troppo tempo! Allora, dove sei stato?"
    # merlin-1395_0000513-1
    - learner: "Non ho visto te e la tua famiglia per quattro mesi."
    - tutor: "Lo so, ci siamo mancati! Ma le vacanze? Dimmi dove sei andato."
    # merlin-1395_0000514-3
    - learner: "Per la vacanza, sono stato per una settimana in Sicilia."
    - tutor: "In Sicilia! D'estate è bellissima, anche se fa un caldo terribile. E che cosa avete fatto?"
      goals: [where, weather]
    # merlin-1395_0000551-3
    - learner: "Siamo andati in macchina e abbiamo visto molte cose bellissime."
    - tutor: "Che bello girare in macchina! E il momento più bello?"
      goals: [activities]
    # merlin-1395_0000398-3
    - learner: "Mio fratello lavora tutto il giorno, e deve studiare tanto per l'esame, e poi va sempre in giro con la sua nuova ragazza."
    - tutor: "Ah, ecco perché non è venuto con voi! Allora il viaggio in macchina con tuo cugino è stato il momento più bello. La prossima volta portami con te!"
      goals: [best]

# File 5: a friend who translates from home after school, a room to rent, a bank, more interviews.
- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io, da quando ho finito la scuola, faccio traduzioni da casa."
    # merlin-1365_0100217-0
    - learner: "Mi rallegro vivamente che tu abbia passato la maturità linguistica, perfino con il massimo dei punti possibili."
    - tutor: "Grazie! E tu? Sempre a scuola, con i tuoi studenti?"
    # merlin-1395_0001070-4
    - learner: "Anche al lavoro tutto è a posto."
    - tutor: "Meno male! Ma il mio lavoro non mi piace tanto: traduco sempre cose noiose."
      goals: [situation]
    # merlin-1365_0100472-4
    - learner: "Penso che un lavoro, che ti accompagni tutto la tua vità, ti deve piacere."
      errors: [subjunctive-use, adjective-agreement, spelling]
    - tutor: "Hai ragione. Ma dopo «penso che»... «ti deve piacere»: quale modo usiamo?"
      prompt: {text: "ti deve piacere", tags: [subjunctive-use]}
    - learner: "Penso che ti debba piacere, se è per tutta la vita!"
    - tutor: "Esatto. Però da casa sono libero: lavoro quando voglio e non perdo tempo nel traffico."
      goals: [pros]
    # merlin-1365_0100269-3
    - learner: "Penso che devi studiare un'altra lingua straniera e con queste conoscienze potrei cercare lavoro anche in altri paesi."
      errors: [subjunctive-use, future-form, spelling]
    - tutor: "Bella idea! Ma di nuovo: «penso che devi»? Pensa alla frase di prima."
      prompt: {text: "che devi studiare", tags: [subjunctive-use]}
    - learner: "Sì, penso che devi studiare il tedesco, per esempio."
      errors: [subjunctive-use]
    - tutor: "Pensi che debba studiare il tedesco? Non è male! Ma da solo, a casa, mi sento un po' triste. Tu preferiresti lavorare da casa?"
      recast: {text: "devi studiare", fix: "debba studiare", tags: [subjunctive-use]}
      goals: [cons]
    - learner: "Mai! Io ho bisogno dei miei alumnos e dei colleghi."
      errors: [word-choice]
    - tutor: "Lo sapevo, tu hai bisogno dei tuoi studenti! Allora tu resti a scuola e io comincio con il tedesco."
      recast: {text: "alumnos", fix: "studenti", tags: [word-choice]}
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [reflexive]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io, da quando ho finito la scuola, faccio traduzioni da casa."
    # merlin-1365_0100233-0
    - learner: "Sono contenta della tua maturità linguistica."
    - tutor: "Grazie! È stato un anno difficile, ma ce l'ho fatta."
    # merlin-1365_0100224-8
    - learner: "E vorrei complimentarti per i tuoi voti."
      errors: [reflexive]
    - tutor: "Che gentile! Ma «vorrei complimentarti»? Chi parla sei tu: il pronome deve essere il tuo."
      prompt: {text: "complimentarti", tags: [reflexive]}
    - learner: "Sì, vorrei complimentarti per tutto."
      errors: [reflexive]
    - tutor: "Ah, «vorrei complimentarmi con te»! Grazie mille, sei gentile. Ma adesso lavori in un ufficio, vero? Ti piace più del negozio di libri?"
      new: [{lemma: complimentarsi, gloss: to congratulate}]
      recast: {text: "complimentarti", fix: "complimentarmi", tags: [reflexive]}
    - learner: "Sì, è più tranquillo, ma il viaggio è lungo e lo stipendio è più basso."
    - tutor: "Capisco, un lato buono e due meno buoni. Io da casa non viaggio, ma sono sempre solo."
      goals: [situation, pros, cons]
    # merlin-1365_0100212-9
    - learner: "Sarebbe divertente se andassimo al lavoro insieme."
    - tutor: "Ahah, magari! Quindi tu preferisci lavorare con le persone, non da sola. Ti capisco."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io, da quando ho finito la scuola, faccio traduzioni da casa, ma vorrei andare all'università."
    # merlin-1365_0100211-3
    - learner: "Anzi, se ti piacerebbe te posso dare una mano per scegliere un'università famosa."
      errors: [hypothetical, object-pronoun]
    - tutor: "Grazie! Ma «te posso dare»? Prima del verbo, quale pronome usiamo?"
      prompt: {text: "te posso dare", tags: [object-pronoun]}
    - learner: "Ti posso dare una mano, sì."
    - tutor: "Esatto, grazie. E tu, nel nuovo ufficio pubblico, ti trovi bene?"
    # merlin-1395_0000376-2
    - learner: "Con i colleghi vado d'accordo, sono molto gentili."
    - tutor: "Questa è la cosa più importante. E c'è qualcosa che non va?"
      goals: [situation, pros]
    # merlin-1365_0100220-10
    - learner: "Non avevo molto tempo per altre cose."
    - tutor: "Ah, prima, in quella ditta? E adesso preferisci il tuo ufficio o lavoreresti da casa come me?"
      goals: [cons]
    # merlin-1365_0100266-7
    - learner: "Io avendo diplomi di lingue non posso trovare un lavoro buono."
    - tutor: "Lo so, è difficile. Però in ufficio hai colleghi gentili, e questo conta più di tutto. Allora tu resti lì e io cerco un'università!"
      goals: [preference]

- scenario: banca-conto
  level: B1
  persona: en-f-student
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    # merlin-1325_1001092-1
    - learner: "Io mi chiamo Emma Taylor."
    - tutor: "Piacere, signora Taylor. Che cosa desidera?"
    # merlin-1325_1001153-1
    - learner: "Sono neolaureata in materie economiche."
    - tutor: "Brava! E adesso lavora qui in Italia?"
    - learner: "Sì, ho trovato un lavoro a Milano e devo di aprire un conto per lo stipendio."
      errors: [modal-infinitive]
    - tutor: "Benissimo. Ma «devo di aprire»? Dopo «dovere», serve «di»?"
      prompt: {text: "devo di aprire", tags: [modal-infinitive]}
    - learner: "Devo aprire un conto per lo stipendio, scusi."
    - tutor: "Esatto. Per lei c'è il conto giovani. Ha un documento e il codice fiscale?"
      goals: [purpose]
    - learner: "Sì, ecco il passaporto e il codice fiscale. Quanto costa il conto al mese?"
    - tutor: "Fino a trent'anni è gratis. Paga solo due euro all'anno per la carta."
      goals: [documents, costs]
    # merlin-1325_9000677-0
    - learner: "Conosco la lingua italiana."
    - tutor: "Lo vedo, parla benissimo! Allora firmiamo qui e la carta arriva a casa tra una settimana."
      goals: [card]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001077-0
    - learner: "Prima di tutto Vi vorrei dire le mie esperienze lavorative!"
    - tutor: "Prego, la ascolto."
      goals: [intro]
    - learner: "Ho lavorato in un'agenzia viaggi. Appunto per questo sarei il migliore assistente al Vostro Agenzia Lavoro!"
      errors: [articulated-preposition, noun-gender]
    - tutor: "Che sicurezza! Ma «al Vostro Agenzia»? Pensi a «agenzia»: maschile o femminile? E quale preposizione?"
      prompt: {text: "al Vostro Agenzia", tags: [articulated-preposition, noun-gender]}
    - learner: "Il migliore assistente per la vostra agenzia!"
    - tutor: "Esatto. E quali sono i suoi punti di forza?"
      goals: [experience]
    # merlin-1325_1001157-4
    - learner: "Conosco e ama la modo e conosco qualche azienda e posso prendere in contatto con loro."
      errors: [subject-verb-agreement, word-choice, preposition]
    - tutor: "Interessante. Ma «conosco e ama»? Con «io», come finisce il secondo verbo?"
      prompt: {text: "ama", tags: [subject-verb-agreement]}
    - learner: "Conosco e amo la moda, e posso prendere contatti con le aziende."
    - tutor: "Perfetto. E perché proprio la nostra agenzia?"
      goals: [strengths]
    # merlin-1325_9000505-3
    - learner: "Ho letto nel giornale il vostro annuncio e subito ho pensato, che questo lavoro potrebbe essere utile per me per cambiare tutta la mia vita."
    - tutor: "Un motivo forte! Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001087-10
    - learner: "Quanto pagano per un mese?"
    - tutor: "Mille e cento euro, per cominciare. Le faremo sapere entro lunedì. Arrivederci!"
      goals: [questions]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [noun-number]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Raccogliamo vestiti e giochi per le famiglie povere. Hai già esperienza?"
    - learner: "L'anno passato sono stata ad un campo di lavoro, e là ho conosciuto tante persone che erano molto brave e hanno riuscito di raccogliere centomila dollari."
      errors: [auxiliary-choice, preposition]
    - tutor: "Centomila, che bravi! Ma «hanno riuscito»? Con «riuscire», usiamo «avere» o un altro verbo?"
      prompt: {text: "hanno riuscito", tags: [auxiliary-choice]}
    - learner: "Sono riusciti a raccogliere centomila dollari!"
    - tutor: "Esatto! Allora hai già esperienza. Perché vuoi farlo di nuovo?"
      goals: [skills]
    # merlin-1325_9000677-2
    - learner: "Mi piacerebbe aiutare la Vostra associazione per finanziare progetti che realizzate in paesi africani."
    - tutor: "È proprio quello che facciamo. Quanto tempo hai?"
      goals: [motivation]
    - learner: "So che potrebbe essere difficile trovare un posto per me, ma fino al 29 agosto sono qui."
    - tutor: "Benissimo, fino a fine agosto abbiamo bisogno di persone per sistemare i vestiti. Ti va?"
      goals: [time]
    # merlin-1365_0100120-15
    - learner: "È molto interessante!"
    - tutor: "Perfetto, allora ti aspetto lunedì mattina in magazzino!"
      goals: [choose]
      new: [{lemma: magazzino, gloss: storeroom}]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    # merlin-1365_0100233-1
    - learner: "Vado ancora alla scuola ma dopo le prossime vacanze d'estate fra una settimana dovrò andare solo un anno al liceo."
      errors: [articulated-preposition]
    - tutor: "Ah, sei ancora piccolo, allora! Ma «vado alla scuola»? Con «scuola», qui, l'articolo ci vuole?"
      prompt: {text: "alla scuola", tags: [articulated-preposition]}
    - learner: "Sì, vado alla scuola qui a Bologna, ma da piccolo abitavo a Boston."
      errors: [articulated-preposition]
    - tutor: "Vai a scuola a Bologna, ma da piccolo abitavi a Boston: che cambiamento! Com'era la tua giornata lì?"
      recast: {text: "alla scuola", fix: "a scuola", tags: [articulated-preposition]}
      goals: [place]
    # merlin-1365_0100479-5
    - learner: "Inoltre gli studenti fanno tanto, come andare a discoteca, imparare o guidare al mare con l'autobus."
      errors: [preposition]
    - tutor: "Parli degli studenti di oggi! Ma «andare a discoteca»? Pensa a «andare in montagna»..."
      prompt: {text: "a discoteca", tags: [preposition]}
    - learner: "Andare in discoteca! Ma da piccolo giocavo a baseball tutti i pomeriggi."
    - tutor: "Esatto! Il baseball, che americano! E la scuola com'era?"
      goals: [habits]
    # merlin-1365_0100481-1
    - learner: "Nella mia scuola non è successo molto!"
    - tutor: "Ahah, va bene. Ma ricordi un giorno speciale?"
      goals: [school]
    # merlin-1395_0001060-1
    - learner: "Non ti ho visto per un anno!"
    - tutor: "Ah, è vero, l'anno che sei partito per l'America! Quello sì che è stato un giorno speciale."
      goals: [event]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [possessive]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi si mangia il tacchino, e da piccola ero così eccitata che aprivo i regali alle sei di mattina!"
      errors: [false-friend]
    - tutor: "Eri così emozionata da aprirli alle sei, che bello! Senti, ho una notizia: io e Stefano ci sposiamo il 20 novembre."
      recast: {text: "eccitata", fix: "emozionata", tags: [false-friend]}
      goals: [compare, past]
      new: [{lemma: emozionato, gloss: excited}]
    # merlin-1365_0100256-5
    - learner: "Invio le miei congratulazioni!"
      errors: [possessive]
    - tutor: "Grazie! Ma «le miei congratulazioni»? «Congratulazioni» è femminile plurale..."
      prompt: {text: "le miei", tags: [possessive]}
    - learner: "Le mie congratulazioni, Silvia!"
    - tutor: "Grazie mille! Sei invitata, naturalmente. Ma tu sai come si festeggia un matrimonio in Italia?"
    # merlin-1365_0100200-6
    - learner: "Suppongo che ci sarà molto gente al vostro matrimonio e vorrei evitare che ci saranno tutte le cose due volte."
      errors: [adjective-agreement, subjunctive-use]
    - tutor: "Vuoi dire i regali uguali? Ma prima: «molto gente»? «Gente» è femminile."
      prompt: {text: "molto gente", tags: [adjective-agreement]}
    - learner: "Molta gente! E per i regali, avete una lista?"
    - tutor: "Esatto. Sì, da noi si fa la lista dei regali, così nessuno regala due volte la stessa cosa."
      goals: [ask]
    # merlin-1365_0100095-4
    - learner: "Vi auguro belli momenti insieme!"
      errors: [adjective-agreement]
    - tutor: "Grazie, che dolce! Ma «belli momenti»? Davanti a «momenti», «bello» diventa più corto."
      prompt: {text: "belli momenti", tags: [adjective-agreement]}
    - learner: "Bei momenti! Allora ci vediamo il 20."
    - tutor: "Perfetto, ti aspettiamo il 20 novembre!"
      goals: [plan]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [noun-gender]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Pensavo a una festa sabato sera, ma lontano da casa nostra."
    # merlin-1365_0100186-8
    - learner: "Perché ritornare a casa dopo il festo è molto stressante per noi."
      errors: [noun-gender]
    - tutor: "Hai ragione. Ma «il festo»? Ascolta bene la parola."
      prompt: {text: "il festo", tags: [noun-gender]}
    - learner: "Sì, dopo il festo siamo sempre stanchi."
      errors: [noun-gender]
    - tutor: "Lo so, dopo la festa siamo sempre stanchi. Allora la facciamo da noi, sabato 12, così nessuno guida."
      recast: {text: "il festo", fix: "la festa", tags: [noun-gender]}
      goals: [date]
    # merlin-1395_0000409-8
    - learner: "Venite a trovarmi."
    - tutor: "Ah, vuoi fare la festa a casa tua? Che gentile! Allora invitiamo i suoi colleghi e la sua famiglia."
      goals: [guests]
    # merlin-1365_0100094-6
    - learner: "Esperiamo che ci sara il sole tutto il giorno."
      errors: [verb-form, spelling]
    - tutor: "Così mangiamo in giardino! Ma «esperiamo»? In italiano la parola comincia in un altro modo."
      prompt: {text: "Esperiamo", tags: [verb-form]}
    - learner: "Speriamo! Così facciamo la grigliata in giardino."
    - tutor: "Perfetto, la grigliata! La carne la compro io. E il regalo?"
      goals: [food]
    # merlin-1365_0100177-5
    - learner: "Oppure qualche cosa per il giardino?"
    - tutor: "Ottima idea: una bella pianta di limoni! Sara la vuole da anni."
      goals: [gift]

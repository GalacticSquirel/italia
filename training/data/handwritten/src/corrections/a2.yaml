# A2: error correction (auxiliaries, participles, tense, reflexives, pronouns), mixed input,
# off-topic turns, grammar questions and free conversation.
- scenario: weekend-scorso
  level: A2
  persona: en-f-student
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Ciao Chiara! Bene, sabato ho andato a Verona."
    errors: [auxiliary-choice]
  - tutor: "Verona, che bella! Ma attenzione: andare non vuole il verbo avere. Sabato tu...?"
    prompt: {text: "ho andato", tags: [auxiliary-choice]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Ah sì, sabato sono andata a Verona!"
  - tutor: "Esatto! E cosa hai fatto lì?"
    goals: [where]
  - learner: "Ho visto l'Arena e ho mangiato un gelato enorme."
  - tutor: "Che buono! Anch'io amo l'Arena. Con chi eri?"
    goals: [what]
  - learner: "Con due amiche dell'università. Abbiamo prenduto il treno."
    errors: [past-participle-form]
  - tutor: "Abbiamo...? Il passato di prendere è un po' strano. Prova ancora!"
    prompt: {text: "prenduto", tags: [past-participle-form]}
  - learner: "Mmm... abbiamo prendato il treno?"
    errors: [past-participle-form]
  - tutor: "Quasi! Avete preso il treno, ho capito. E ti è piaciuta la giornata?"
    recast: {text: "prendato", fix: "preso", tags: [past-participle-form]}
    goals: [with-who]
  - learner: "Preso, ok! Sì, mi sono divertita molto. E tu, cosa hai fatto?"
  - tutor: "Io sono rimasta a casa e ho dormito tanto. Che bel fine settimana, il tuo!"
    goals: [opinion]
    done: true

- scenario: vacanze-passate
  level: A2
  persona: en-m-traveller
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Ciao Elena! Sono stato in Sicilia, due settimane. È stato amazing!"
    errors: [word-choice]
  - tutor: "In Sicilia, fantastico! Io la amo. E che tempo faceva?"
    recast: {text: "amazing", fix: "fantastico", tags: [word-choice]}
    goals: [where]
  - learner: "Ogni giorno ha fatto molto caldo, quaranta gradi!"
    errors: [tense-aspect]
  - tutor: "Quaranta gradi! Ma ogni giorno non è un momento solo. Quale tempo del verbo usi?"
    prompt: {text: "ha fatto", tags: [tense-aspect]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Ah, giusto... ogni giorno faceva molto caldo."
  - tutor: "Proprio così! E cosa hai fatto con quel caldo?"
    goals: [weather]
  - learner: "Ho nuotato tanto e ho visitato Siracusa. How do you say 'boat trip'?"
  - tutor: "Si dice gita in barca. Hai fatto una gita in barca?"
    new: [{lemma: gita, gloss: trip}]
  - learner: "Sì, ho fatto una gita in barca alle isole. Ma tu sei mai stata in Irlanda?"
  - tutor: "No, mai, ma voglio venire! Dicono che è molto verde. Allora, cosa ti è piaciuto di più?"
    goals: [activities]
  - learner: "Il cibo! Ho mangiato la pasta alla norma ogni sera."
  - tutor: "Ti capisco, è buonissima! Adesso ho fame anch'io."
    goals: [best]
    done: true

- scenario: medico-base
  level: A2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
  - learner: "Buongiorno, dottore. Ho mal di gola e sono molto freddo."
    errors: [essere-avere]
  - tutor: "Mi dispiace. Attenzione però: per il freddo non usiamo essere. Lei...?"
    prompt: {text: "sono molto freddo", tags: [essere-avere]}
  - learner: "Ah, mi scusi. Ho molto freddo."
  - tutor: "Ecco, bene. Da quando si sente così?"
    goals: [symptoms]
  - learner: "Da tre giorni. Ieri ho avuto anche la febbre."
  - tutor: "Capisco. È allergico a qualche medicina?"
    goals: [since-when]
  - learner: "Sorry, I don't understand 'allergico'."
  - tutor: "Nessun problema. Ci sono medicine che Le fanno male?"
  - learner: "Ah, no, nessuna. Prendo solo una medicina per il cuore, ogni mattina."
  - tutor: "Va bene. Prenda questa medicina due volte al giorno, dopo pranzo e dopo cena."
    goals: [history]
  - learner: "Allora, due volte al giorno, dopo pranzo e dopo cena. Grazie, dottore, Lei è molto educato."
    errors: [false-friend]
  - tutor: "Grazie, anche Lei è molto gentile! Resti a casa due giorni e beva molta acqua."
    recast: {text: "educato", fix: "gentile", tags: [false-friend]}
  - learner: "Certo, resto a casa e bevo molta acqua. Arrivederci!"
  - tutor: "Perfetto. Arrivederci e torni se la febbre non passa!"
    goals: [instructions]
    done: true

- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  - learner: "Sì, volentieri! Andiamo al cine?"
    errors: [word-choice]
  - tutor: "Al cinema? Ottima idea! Che film ti piacciono?"
    recast: {text: "al cine", fix: "al cinema", tags: [word-choice]}
    goals: [propose]
  - learner: "Mi piacciono le commedie. I film di paura no, grazie!"
  - tutor: "Anche a me! Guarda, c'è una commedia nuova alle otto. La conosci?"
    goals: [genre]
  - learner: "Sì, ma non l'ho visto ancora."
    errors: [participle-agreement]
  - tutor: "Quasi! Guarda l'ultima lettera di visto. Parliamo di una commedia..."
    prompt: {text: "l'ho visto", tags: [participle-agreement]}
  - learner: "Ah, certo! Non l'ho vista ancora."
  - tutor: "Brava! Allora prendiamo i biglietti per le otto?"
  - learner: "Sì, alle otto va bene. Una domanda: perché 'vista' e non 'visto'?"
  - tutor: "Perché parliamo della commedia: la commedia, l'ho vista. Per il film dici l'ho visto. Dove ci vediamo?"
    goals: [choose]
  - learner: "Ah, ho capito. Ci vediamo davanti al cinema alle sette e mezza?"
  - tutor: "Perfetto, alle sette e mezza davanti al cinema. A stasera!"
    goals: [meet]
    done: true

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-heritage
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
  - learner: "Abitavo a Toronto, in una casa vicino al lago. Con i miei nonni italiani!"
  - tutor: "Che fortuna, i nonni in casa! E cosa facevi d'estate?"
    goals: [place]
  - learner: "Ogni estate giocavo a calcio e mia nonna faciva la pasta."
    errors: [imperfetto-form]
  - tutor: "Che buona! Ma guarda bene il verbo fare. Tua nonna...?"
    prompt: {text: "faciva", tags: [imperfetto-form]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Mia nonna... faceva la pasta!"
  - tutor: "Ecco! Anche la mia la faceva ogni domenica. E la scuola ti piaceva?"
    goals: [habits]
  - learner: "No! Ero un bambino molto timido. Sorry, my Italian is so bad, I make too many mistakes."
  - tutor: "Ma no, parli bene! Gli errori sono normali. Allora, eri timido a scuola?"
  - learner: "Sì, ma avevo un'amica, Julia. Lei era molto simpatica e mi aiutava sempre."
  - tutor: "Che bello. E hai un ricordo speciale di quegli anni?"
    goals: [school]
  - learner: "Sì. Una volta mio nonno mi ha portato in Italia, a Bari. Ho visto il mare per la prima volta."
  - tutor: "Che ricordo bellissimo! Il primo mare resta sempre nel cuore."
    goals: [event]
    done: true

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [piacere]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Di solito vado a correre al parco. Mi piace molto gli sport all'aperto."
    errors: [piacere]
  - tutor: "Anche a me! Però senti: gli sport sono tanti. Allora mi...?"
    prompt: {text: "Mi piace molto gli sport", tags: [piacere]}
  - learner: "Ah, sì. Mi piacciono molto gli sport all'aperto."
  - tutor: "Esatto! E quante volte vai a correre?"
    goals: [hobby]
  - learner: "Tre volte alla settimana. E la domenica gioco tennis con una collega."
    errors: [preposition]
  - tutor: "Che brava! Però manca una piccola parola prima di tennis. La domenica...?"
    prompt: {text: "gioco tennis", tags: [preposition]}
  - learner: "La domenica gioco il tennis?"
    errors: [preposition]
  - tutor: "Si dice gioco a tennis. Io invece non faccio mai sport!"
    recast: {text: "gioco il tennis", fix: "gioco a tennis", tags: [preposition]}
    goals: [frequency]
  - learner: "A tennis, ok. Davvero mai? E allora cosa fai nel tempo libero?"
  - tutor: "Leggo molto e guardo vecchi film. Il sabato vado spesso al mercato."
    goals: [ask]
  - learner: "Che bello! Sabato possiamo andare al mercato insieme? Così abbiamo un buon tempo."
    errors: [word-choice]
  - tutor: "Certo, così ci divertiamo! Ci vediamo sabato alle dieci in piazza?"
    recast: {text: "abbiamo un buon tempo", fix: "ci divertiamo", tags: [word-choice]}
    goals: [propose]
  - learner: "Alle dieci va benissimo. A sabato!"
  - tutor: "A sabato, allora! Adesso torniamo al lavoro, purtroppo."
    new: [{lemma: purtroppo, gloss: unfortunately}]
    done: true

- scenario: autobus
  level: A2
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno! Dove deve andare?"
  - learner: "Buongiorno! Questo autobus va a il Duomo?"
    errors: [articulated-preposition]
  - tutor: "Sì, ci va! Ma attenzione: a e il insieme diventano una parola sola."
    prompt: {text: "a il Duomo", tags: [articulated-preposition]}
  - learner: "Ah, giusto: va al Duomo. Bene! E dove compro il ticket?"
    errors: [word-choice]
  - tutor: "Il biglietto lo compra in tabaccheria, lì davanti. Sono due euro."
    recast: {text: "ticket", fix: "biglietto", tags: [word-choice]}
    goals: [route, ticket]
  - learner: "Grazie. Puoi dirmi quando devo scendere?"
    errors: [register]
  - tutor: "Certo! Però noi due non ci conosciamo: con me usa tu o Lei?"
    prompt: {text: "Puoi dirmi", tags: [register]}
  - learner: "Oh, mi scusi! Può dirmi quando devo scendere?"
  - tutor: "Così va bene! Deve scendere alla terza fermata, dopo il ponte."
    new: [{lemma: ponte, gloss: bridge}]
    goals: [stop]
  - learner: "Terza fermata, dopo il ponte. How long does it take?"
  - tutor: "Poco tempo: dieci minuti, più o meno."
  - learner: "Perfetto, dieci minuti. Grazie mille, molto gentile!"
  - tutor: "Prego! Si ricordi di timbrare il biglietto. Buona giornata!"
    goals: [thank]
    done: true

- scenario: cucina-ricetta
  level: A2
  persona: es-m-worker
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "Pasta al pomodoro. Necesitamos pomodori, aglio, olio e sale."
    errors: [word-choice]
  - tutor: "Buona! Allora ci servono pomodori, aglio, olio e sale. Ecco tutto. Da dove cominciamo?"
    recast: {text: "Necesitamos", fix: "ci servono", tags: [word-choice]}
    goals: [ingredients]
  - learner: "Prima taglio l'aglio. Poi lo metto nella pentola con l'olio."
  - tutor: "Va bene. E i pomodori? Li taglio io?"
  - learner: "Sì, grazie. Tagliali piccoli. Poi li aggiungiamo."
  - tutor: "Fatto! Quanto tempo devono cuocere?"
    goals: [steps]
  - learner: "Venti minuti. La pasta cuoce dieci minuti. Metto la dopo."
    errors: [pronoun-position]
  - tutor: "Dieci minuti, bene. Ma la parola la non resta dopo il verbo. La pasta...?"
    prompt: {text: "Metto la", tags: [pronoun-position]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "La pasta la metto dopo."
  - tutor: "Giusto! E poi come la portiamo in tavola?"
    goals: [time]
  - learner: "Con basilico fresco e un po' di formaggio. Semplice."
  - tutor: "Semplice e buona! Tu cucini davvero bene. Io adesso preparo la tavola."
    goals: [serve]
    done: true

- scenario: hotel-checkin
  level: A2
  persona: en-m-retired
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, ho una prenotazione per due notti. Il mio nome è Robert Miller."
  - tutor: "Benvenuto, signore. Ecco: una camera per due notti. Ha un documento, per favore?"
    goals: [booking]
  - learner: "Ecco la mia carta d'identità. Abbiamo viaggiato tutto il giorno. Mia moglie si ha addormentato in macchina!"
    errors: [auxiliary-choice]
  - tutor: "Capisco, un viaggio lungo! Ma i verbi con si non vogliono avere. Sua moglie...?"
    prompt: {text: "si ha addormentato", tags: [auxiliary-choice]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Mia moglie si è addormentata in macchina."
  - tutor: "Esatto. Allora per voi c'è una camera tranquilla al secondo piano."
    goals: [document]
  - learner: "Grazie. Di solito viaggiamo con il nostro cane, Max, ma questa volta è rimasto con nostra figlia."
  - tutor: "Che bel nome, Max! Anch'io ho un cane a casa. Volete fare colazione qui domani?"
  - learner: "Sì, grazie. A che ora è la colazione?"
  - tutor: "Dalle sette alle dieci, al piano terra."
    goals: [breakfast]
  - learner: "Benissimo. Possiamo avere la chiave, per favore?"
  - tutor: "Certo, ecco la chiave: camera 12, secondo piano. Buona serata!"
    goals: [key]
    done: true

- scenario: weekend-scorso
  level: A2
  persona: en-m-retired
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Molto bene, grazie. Domenica mia moglie e io siamo andato al lago di Garda."
    errors: [participle-agreement]
  - tutor: "Che bello, il lago! Ma siete in due: guarda l'ultima lettera di andato."
    prompt: {text: "siamo andato", tags: [participle-agreement]}
  - learner: "Siamo andati al lago di Garda. But why does it change? With 'ho mangiato' it doesn't."
  - tutor: "Con essere il verbo segue la persona: lui è andato, loro sono andati. Con avere no. E cosa avete fatto al lago?"
    new: [{lemma: verbo, gloss: verb}]
    goals: [where]
  - learner: "Ah, ho capito. Abbiamo camminato vicino all'acqua e abbiamo pranzato in un piccolo ristorante."
  - tutor: "Che buona idea! Eravate soli, tu e tua moglie?"
    goals: [what]
  - learner: "No, c'erano anche i parenti di mia moglie. Suo padre ha novant'anni!"
    errors: [false-friend]
  - tutor: "Novant'anni, che forza! Allora c'erano anche i genitori di tua moglie. Vi siete divertiti?"
    recast: {text: "i parenti", fix: "i genitori", tags: [false-friend]}
    goals: [with-who]
  - learner: "Sì, ci siamo divertiti molto. E tu, cosa hai fatto?"
  - tutor: "Io ho lavorato in giardino tutto sabato. Sono ancora stanca!"
    new: [{lemma: giardino, gloss: garden}]
    goals: [opinion]
  - learner: "Hai un giardino? In Ohio avevo un giardino grande, con molte rose."
  - tutor: "Davvero? Io ho solo qualche fiore. Un giorno vieni a vederlo!"
    done: true

- scenario: vacanze-passate
  level: A2
  persona: en-f-professional
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Ciao Elena! Sono andata in Sardegna con il mio ragazzo. Ero così eccitata!"
    errors: [false-friend]
  - tutor: "In Sardegna, che bello! Capisco, eri molto contenta. E il tempo com'era?"
    recast: {text: "eccitata", fix: "contenta", tags: [false-friend]}
    goals: [where]
  - learner: "C'era sempre il sole, ma la sera c'era un po' di vento."
  - tutor: "Meglio così, con il vento si dorme bene! E cosa avete fatto?"
    goals: [weather]
  - learner: "Abbiamo visitato tante spiagge con una macchina a noleggio. Ho preso molte foto!"
    errors: [word-choice]
  - tutor: "Hai fatto molte foto? Dopo le voglio vedere! Siete rimasti sempre al mare?"
    recast: {text: "Ho preso molte foto", fix: "Hai fatto molte foto", tags: [word-choice]}
  - learner: "No, un giorno abbiamo... ugh, this is hard. Can we speak English for a minute?"
  - tutor: "Dai, parli già bene! Parliamo piano, in italiano. Un giorno siete andati in montagna?"
  - learner: "Ok, ok. Sì, un giorno siamo andati in montagna e abbiamo camminato quattro ore."
  - tutor: "Quattro ore, che bravi! E cosa ti è piaciuto di più?"
    goals: [activities]
  - learner: "Mi è piaciuta molto una cena sulla spiaggia, l'ultima sera."
  - tutor: "Che bella serata! Anch'io sogno una cena così."
    goals: [best]
    done: true

- scenario: ricordi-infanzia
  level: A2
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccola?"
  - learner: "Abitavo in un paese piccolo vicino a Leeds. C'erano più animali che persone!"
  - tutor: "Che bello, tanti animali! E cosa facevi dopo la scuola?"
    goals: [place]
  - learner: "Dopo la scuola ho giocato sempre fuori con mio fratello."
    errors: [tense-aspect]
  - tutor: "Sempre, quindi tutti i giorni. Allora il passato giusto è un altro. Io...?"
    prompt: {text: "ho giocato", tags: [tense-aspect]}
  - learner: "Io... sono giocata sempre fuori?"
    errors: [tense-aspect]
  - tutor: "Ah, giocavi sempre fuori! Anch'io giocavo in strada con mia sorella. E la scuola com'era?"
    recast: {text: "sono giocata", fix: "giocavi", tags: [tense-aspect]}
    goals: [habits]
  - learner: "Giocavo, giusto! La scuola era piccola. La mia maestra era molto severa, ma brava."
  - tutor: "Anche la mia! Avevo sempre paura di lei. Hai un ricordo speciale?"
    goals: [school]
  - learner: "Sì! Un giorno la neve era così alta che la scuola è rimasta chiusa. Mi sono divertita tantissimo!"
  - tutor: "Che fortuna! Un giorno di neve senza scuola è il più bello."
    goals: [event]
  - learner: "E tu, Matteo? Sei cresciuto qui?"
  - tutor: "Sì, proprio in questa strada. Vieni, ti mostro la mia vecchia casa!"
    done: true

- scenario: biglietto-treno
  level: A2
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno, dove deve andare?"
  - learner: "Buongiorno. Domani mattina andarò a Firenze."
    errors: [future-form]
  - tutor: "A Firenze, bene. Ma attenzione: al futuro questo verbo perde una lettera. Domani...?"
    prompt: {text: "andarò", tags: [future-form]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Domani andrò a Firenze, verso le nove."
  - tutor: "Perfetto. Vuole solo andata o anche ritorno?"
    goals: [destination]
  - learner: "Andata e ritorno, per favore. Torno domenica sera."
  - tutor: "Benissimo. Prima o seconda classe?"
    goals: [type]
  - learner: "Seconda classe. È possibile avere un posto vicino alla ventana?"
    errors: [word-choice]
  - tutor: "Certo, un posto vicino al finestrino. Sono 32 euro."
    recast: {text: "alla ventana", fix: "al finestrino", tags: [word-choice]}
    new: [{lemma: finestrino, gloss: train window}]
    goals: [class]
  - learner: "Al finestrino, grazie. Ecco la carta. Da quale binario parte il treno?"
  - tutor: "Dal binario 5, alle nove e dieci."
  - learner: "Binario cinque, alle nove e dieci. Grazie, buona giornata!"
  - tutor: "Grazie a Lei e buon viaggio!"
    goals: [platform]
    done: true

- scenario: giorno-tipico
  level: A2
  persona: en-m-heritage
  history: [reflexive]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao Anna! Di solito sveglio alle sei e mezza. Troppo presto!"
    errors: [reflexive]
  - tutor: "Le sei e mezza, povero te! Ma manca una piccola parola prima di sveglio. Io...?"
    prompt: {text: "sveglio", tags: [reflexive]}
  - learner: "Io mi sveglio alle sei e mezza."
  - tutor: "Ecco! E la mattina cosa fai?"
    goals: [wake]
  - learner: "Faccio colazione, poi prendo il tram e vado in ufficio. Lavoro fino all'una."
  - tutor: "E la sera? Torni tardi a casa?"
    goals: [work]
  - learner: "Torno alle sette e ceno. Poi chiamo mia nonna a Toronto. La telefono ogni sera."
    errors: [object-pronoun]
  - tutor: "Che bravo! Ma tu telefoni a tua nonna. Con a, quel la cambia."
    prompt: {text: "La telefono", tags: [object-pronoun]}
    new: [{lemma: telefonare, gloss: to phone}]
  - learner: "Ah... le telefono ogni sera?"
  - tutor: "Sì, giusto! Di sicuro è molto contenta."
    goals: [evening]
  - learner: "Sì, parliamo in italiano, così imparo. E tu, Anna? Com'è la tua giornata?"
  - tutor: "Io lavoro in un negozio, dalle nove alle sei. La sera sono sempre stanca!"
    goals: [ask]
  - learner: "Allora stasera cucino io. Ti piace il riso?"
  - tutor: "Che gentile! Sì, mi piace tanto. Ti aiuto io."
    done: true

- scenario: casa-mia
  level: A2
  persona: en-f-student
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Abito in un appartamento con altre tre ragazze. È piccolo ma carino."
  - tutor: "In quattro, che bello! E quante camere avete?"
    goals: [type]
  - learner: "C'è quattro camere, una cucina e un bagno solo."
    errors: [ce-ci-sono]
  - tutor: "Un bagno solo in quattro! Ma le camere sono tante: va bene c'è?"
    prompt: {text: "C'è quattro camere", tags: [ce-ci-sono]}
  - learner: "No! Ci sono quattro camere."
  - tutor: "Giusto. E qual è la tua stanza preferita?"
    goals: [rooms]
  - learner: "La cucina, perché è più grande che la mia camera. E ha un balcone!"
    errors: [comparative]
  - tutor: "Più grande... che? Tra due cose usiamo un'altra piccola parola."
    prompt: {text: "che la mia camera", tags: [comparative]}
  - learner: "Più grande di la mia camera?"
    errors: [comparative]
  - tutor: "Ci sei quasi: è più grande della tua camera. Con il balcone è perfetta! Cosa fate lì?"
    recast: {text: "di la mia camera", fix: "della tua camera", tags: [comparative]}
    goals: [favourite]
  - learner: "Mangiamo insieme e parliamo tanto. E tu, Luca? Abiti da solo?"
  - tutor: "No, abito con mio fratello in una casa vecchia. Abbiamo un giardino piccolo."
    new: [{lemma: giardino, gloss: garden}]
    goals: [ask]
    done: true

- scenario: compleanno
  level: A2
  persona: en-m-traveller
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo una festa a sorpresa! Sabato sera, a casa mia?"
  - tutor: "Sì, sabato va benissimo! Casa tua è grande. Chi invitiamo?"
    goals: [date]
  - learner: "Io sto pensare... i suoi amici dell'università e sua sorella."
    errors: [stare-gerund]
  - tutor: "Buona idea! Però dopo sto il verbo cambia forma. Io sto...?"
    prompt: {text: "sto pensare", tags: [stare-gerund]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Sto pensando! Sì. Dieci persone, più o meno."
  - tutor: "Dieci persone, perfetto. E da mangiare cosa prepariamo?"
    goals: [guests]
  - learner: "Pizza per tutti, è facile. And a cake... come si dice 'cake'?"
  - tutor: "Si dice torta. Che torta piace a Sara?"
  - learner: "Le piace la torta al cioccolato. La compro io. Hey, hai visto la partita ieri?"
  - tutor: "Sì, che brutta partita! Meglio pensare alla festa. E il regalo?"
    goals: [food]
  - learner: "Non so. Dobbiamo fare una decisione oggi?"
    errors: [word-choice]
  - tutor: "Sì, dobbiamo prendere una decisione oggi: sabato è vicino! Un libro?"
    recast: {text: "fare una decisione", fix: "prendere una decisione", tags: [word-choice]}
  - learner: "Un libro va bene. Sara legge sempre."
  - tutor: "Allora un bel libro e una torta. Sarà una festa bellissima!"
    goals: [gift]
    done: true

- scenario: tempo-libero
  level: A2
  persona: es-f-erasmus
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Mi piace molto bailar! Vado a un corso di salsa."
    errors: [word-choice]
  - tutor: "Ti piace ballare? Che bello! Vai spesso al corso?"
    recast: {text: "bailar", fix: "ballare", tags: [word-choice]}
    goals: [hobby]
  - learner: "Due volte alla settimana, il martedì e il venerdì."
  - tutor: "Brava! Io ballo molto male. Lo fai da tanto tempo?"
    goals: [frequency]
  - learner: "Da cinque anni. A Siviglia ballavo con mia madre in cucina!"
  - tutor: "Che bel ricordo! Tua madre balla ancora?"
  - learner: "Sì, sempre. E tu, Sara? Cosa fai quando non lavori?"
  - tutor: "Vado in bicicletta e la domenica cucino per gli amici."
    goals: [ask]
  - learner: "Che buono! Senti, venerdì vuoi vieni al corso con me?"
    errors: [modal-infinitive]
  - tutor: "Che bella idea! Ma dopo vuoi il verbo non cambia. Venerdì vuoi...?"
    prompt: {text: "vuoi vieni", tags: [modal-infinitive]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Venerdì vuoi venire al corso con me?"
  - tutor: "Sì, vengo! Ma ti dico subito: non so ballare."
  - learner: "Non importa, ti aiuto io!"
  - tutor: "Allora a venerdì. Grazie, sarà divertente!"
    goals: [propose]
    done: true

- scenario: serata-cinema
  level: A2
  persona: en-m-heritage
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  - learner: "Sì! Vuoi andare al cinema? C'è un nuovo film d'azione."
  - tutor: "Beh, i film d'azione non sono i miei preferiti. A te piacciono tanto?"
    goals: [propose]
  - learner: "Sì, ma mi piacciono anche le commedie. Ho visto una commedia ieri ed era molto divertente."
  - tutor: "Allora scegliamo una commedia! C'è uno spettacolo alle sette e uno alle nove."
    goals: [genre]
  - learner: "Alle nove è meglio. Prima voglio mangiare, sono molto fame!"
    errors: [essere-avere]
  - tutor: "Anch'io! Ma sei sicuro di quel sono? Con la fame usiamo un altro verbo."
    prompt: {text: "sono molto fame", tags: [essere-avere]}
    new: [{lemma: verbo, gloss: verb}]
  - learner: "Ho molta fame! Scusa, faccio sempre questo errore."
  - tutor: "Non ti preoccupare, capita a tutti! Allora mangiamo una pizza prima?"
    goals: [choose]
  - learner: "Sì, una pizza veloce. Dove ci incontriamo?"
  - tutor: "In piazza, davanti al cinema, alle sette e mezza?"
  - learner: "Perfetto. I biglietti li compro io online."
  - tutor: "Grazie! Allora la pizza la pago io. A dopo!"
    goals: [meet]
    done: true

- scenario: parrucchiere
  level: A2
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
  - learner: "Buongiorno. Ho realizzato che i miei capelli sono troppo lunghi. Vorrei tagliarli."
    errors: [false-friend]
  - tutor: "Ha capito che sono troppo lunghi? È vero! Quanto li tagliamo?"
    recast: {text: "Ho realizzato", fix: "Ha capito", tags: [false-friend]}
    goals: [book]
  - learner: "Fino alle spalle, più o meno. Non troppo corti, per favore."
  - tutor: "Va bene, fino alle spalle. Facciamo anche la frangia?"
    goals: [length]
  - learner: "Sorry, what is 'frangia'?"
  - tutor: "Sono i capelli corti qui davanti, sopra gli occhi."
  - learner: "Ah! No, grazie, niente frangia. Non mi sta bene."
  - tutor: "D'accordo, niente frangia. Prima li lavo, poi tagliamo."
    goals: [style]
  - learner: "Va bene. Senti, tagli anche i capelli dei bambini? Ho due figli."
    errors: [register]
  - tutor: "Certo, i bambini sono benvenuti! Ma con me usa il tu o il Lei?"
    prompt: {text: "Senti, tagli", tags: [register]}
  - learner: "Oh, mi scusi! Taglia anche i capelli dei bambini?"
  - tutor: "Sì, certo. Li porti quando vuole! Ecco fatto: si guardi allo specchio."
  - learner: "Mi piace molto, grazie! Quanto pago?"
  - tutor: "Sono 28 euro. Sta benissimo con i capelli così!"
    goals: [pay]
    done: true

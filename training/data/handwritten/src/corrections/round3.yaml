# Round 3: the same recurring error corrected more than once, spelling and accents, correct
# fragments left alone, unprompted self-correction, "is this correct?" questions, Spanish
# interference, and register slips that come back after a repair.
- scenario: supermercato
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, cerca qualcosa?"
  - learner: "Sì. La manteca."
    errors: [word-choice]
  - tutor: "Ah, il burro! È in fondo, vicino al latte."
    recast: {text: "La manteca", fix: "il burro", tags: [word-choice]}
    new: [{lemma: "burro", gloss: "butter"}]
    goals: [ask-product]
  - learner: "Burro? In spagnolo burro è un animale!"
  - tutor: "Davvero? Qui il burro è buono con il pane!"
  - learner: "Ah ah, va bene. E tengo bisogno di uova."
    errors: [word-choice]
  - tutor: "Ha bisogno di uova? Sono nel reparto qui a destra."
    recast: {text: "tengo bisogno", fix: "Ha bisogno", tags: [word-choice]}
    goals: [ask-other]
  - learner: "Quante uova in una scatola?"
  - tutor: "Sono 6 uova. Vuole altro?"
  - learner: "No. Solo questo."
  - tutor: "Bene. La cassa è lì davanti."
  - learner: "Grazie. Lei è muy gentile... molto gentile!"
  - tutor: "Grazie a Lei! Buona giornata!"
    goals: [thank]
    done: true

- scenario: presentarsi
  level: A1
  persona: en-f-student
  history: [essere-avere]
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao! Mi chiamo Hannah. Sono 20 anni."
    errors: [essere-avere]
  - tutor: "Piacere, Hannah! Sono 20 anni? Che verbo usi per gli anni?"
    prompt: {text: "Sono 20 anni", tags: [essere-avere]}
    new: [{lemma: "verbo", gloss: "verb"}]
    goals: [say-name]
  - learner: "Oh! Ho 20 anni."
  - tutor: "Ecco! E di dove sei?"
  - learner: "Di Leeds."
  - tutor: "Che bello! È una città grande?"
    goals: [say-origin]
  - learner: "Sì, grande. Studio storia all'università."
  - tutor: "Storia, interessante! Io lavoro in un bar."
    goals: [say-job]
  - learner: "Ti piace il bar? Mia sorella lavora in un bar, e lei è 17 anni."
    errors: [essere-avere]
  - tutor: "Sì, mi piace molto! Ma tua sorella... è 17 anni?"
    prompt: {text: "è 17 anni", tags: [essere-avere]}
    goals: [ask-back]
  - learner: "Ehm... lei sono 17 anni?"
    errors: [essere-avere]
  - tutor: "Tua sorella ha 17 anni, è giovane! Anche lei studia?"
    recast: {text: "sono 17 anni", fix: "ha 17 anni", tags: [essere-avere]}
  - learner: "Ha 17 anni, ok. No, lei lavora solo. E tu di dove sei?"
  - tutor: "Io sono di Roma. È un piacere, Hannah!"
    done: true

- scenario: hotel-checkin
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, ho una prenotazione. Il nome e Walker."
    errors: [spelling]
  - tutor: "Benvenuto! Attenzione: qui sulla \"e\" manca l'accento."
    prompt: {text: "nome e Walker", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}]
  - learner: "Ah, certo: il nome è Walker. Una camera per due notti."
  - tutor: "Perfetto, signor Walker. Ha un documento?"
    goals: [booking]
  - learner: "Ecco il passaporto. Una domanda: \"A che ora è la colazione?\" È corretto?"
  - tutor: "Sì, è perfetto! La colazione è dalle 7 alle 10."
    goals: [document, breakfast]
  - learner: "Bene. E la camera, dove?"
  - tutor: "È al secondo piano. Ecco la chiave."
    goals: [key]
  - learner: "Grazie. La citta è molto bella... scusi, città, con l'accento!"
  - tutor: "Sì, è bellissima! Buona notte, signor Walker."
    done: true

- scenario: casa-mia
  level: A1
  persona: en-m-heritage
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "È un appartamento. Piccolo ma bello."
  - tutor: "Che bello! Quante camere ci sono?"
    goals: [type]
  - learner: "Due camera... no, due camere! E una cucina grande."
  - tutor: "Una cucina grande, che fortuna! E il bagno?"
  - learner: "C'è due bagni. È giusto?"
    errors: [ce-ci-sono]
  - tutor: "Quasi! Con due bagni, \"c'è\" cambia un po'."
    prompt: {text: "C'è due bagni", tags: [ce-ci-sono]}
  - learner: "Ah! Ci sono due bagni."
  - tutor: "Ora è giusto! Qual è la tua stanza preferita?"
    goals: [rooms]
  - learner: "Il balcone. La sera bevo un caffè lì."
  - tutor: "Bello! Anch'io amo stare sul balcone."
    goals: [favourite]
  - learner: "E la tua casa? È grande?"
  - tutor: "No, è piccola. Ma ha una bella cucina!"
    goals: [ask]
    done: true

- scenario: taxi
  level: A1
  persona: es-f-teacher
  history: [register]
  turns:
  - tutor: "Buongiorno! Dove la porto?"
  - learner: "Buongiorno. All'albergo Milano, per favore. Sai dov'è?"
    errors: [register]
  - tutor: "Sì, certo. Ma \"sai\"? Io sono un signore di 60 anni!"
    prompt: {text: "Sai", tags: [register]}
    goals: [destination]
  - learner: "Mi scusi! Sa dov'è?"
  - tutor: "Certo, è in centro. Andiamo!"
  - learner: "Quanto tempo ci vuole? Ho molto equipaje."
    errors: [word-choice]
  - tutor: "Sono 15 minuti. Ha molte valigie, ma c'è posto!"
    recast: {text: "molto equipaje", fix: "molte valigie", tags: [word-choice]}
    goals: [ask-time]
  - learner: "Grazie. Oggi fa molto calore, vero?"
    errors: [word-choice]
  - tutor: "Sì, oggi fa molto caldo! Per fortuna siamo vicini."
    recast: {text: "calore", fix: "caldo", tags: [word-choice]}
  - learner: "Bene. E quanto costa? Puoi dirmi il prezzo?"
    errors: [register]
  - tutor: "Signora, ancora il \"tu\"? Come si dice con Lei?"
    prompt: {text: "Puoi", tags: [register]}
  - learner: "Ay, è vero... tu può dirmi il prezzo?"
    errors: [register]
  - tutor: "Può dirmi il prezzo? Certo: sono 20 euro."
    recast: {text: "tu può dirmi", fix: "Può dirmi", tags: [register]}
    goals: [ask-price]
  - learner: "Può dirmi, grazie! Posso pagare con la carta?"
  - tutor: "Sì, certo. Ecco l'albergo, buona giornata!"
    goals: [pay]
    done: true

- scenario: panetteria
  level: A1
  persona: en-m-traveller
  history: [noun-number]
  turns:
  - tutor: "Buongiorno! Mi dica."
  - learner: "Buongiorno! Pane, per favore."
  - tutor: "Certo! Quanto pane vuole?"
    goals: [greet]
  - learner: "Mezzo chilo."
  - tutor: "Ecco mezzo chilo di pane. Altro?"
    goals: [order-bread]
  - learner: "Sì, due focaccia."
    errors: [noun-number]
  - tutor: "Due focaccia? Una o più di una?"
    prompt: {text: "due focaccia", tags: [noun-number]}
  - learner: "Ah, due focacce!"
  - tutor: "Bene, due focacce. Sono ancora calde!"
  - learner: "Buono! How do you say 'breadsticks'?"
  - tutor: "Si dice \"grissini\". Sono qui, vuole provare?"
  - learner: "Grissini, ok! Un sacchetto. E tre pizza piccole."
    errors: [noun-number]
  - tutor: "Un sacchetto, bene. Tre pizza? Come prima!"
    prompt: {text: "tre pizza", tags: [noun-number]}
  - learner: "Tre... pizzas?"
    errors: [noun-number]
  - tutor: "Ecco tre pizze piccole. È tutto?"
    recast: {text: "pizzas", fix: "pizze", tags: [noun-number]}
    goals: [order-extra]
  - learner: "Sì, è tutto. Quant'è?"
  - tutor: "Sono 9 euro. Grazie e buona giornata!"
    goals: [pay]
    done: true

- scenario: autobus
  level: A2
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno! Dove deve andare?"
  - learner: "Buongiorno! Tengo che andare al Duomo. Quale autobus prendo?"
    errors: [word-choice]
  - tutor: "Deve andare al Duomo? Allora prende la linea 14, da questa fermata."
    recast: {text: "Tengo che andare", fix: "Deve andare", tags: [word-choice]}
    goals: [route]
  - learner: "La 14, bene. E il biglietto? Lo compro qui?"
  - tutor: "No, sull'autobus non lo vendono. Lo compra in tabaccheria, lì davanti."
    goals: [ticket]
  - learner: "Ah, in tabaccheria. E dopo, dove devo salire? Voglio dire... dove finisce il mio viaggio?"
    errors: [false-friend]
  - tutor: "Deve scendere dopo 5 fermate, in piazza Duomo. Salire è all'inizio, scendere è alla fine!"
    recast: {text: "dove devo salire", fix: "Deve scendere", tags: [false-friend]}
    goals: [stop]
  - learner: "Ay, in spagnolo 'salir' è il contrario! Allora salgo qui e scendo dopo 5 fermate. È giusto così?"
  - tutor: "Giustissimo, ha detto tutto bene! E si ricordi di timbrare il biglietto."
  - learner: "Timbrare? No entiendo... non capisco questa parola."
  - tutor: "Sull'autobus c'è una piccola macchina gialla. Lei mette il biglietto dentro, così va bene."
  - learner: "Ah, ho capito! Grazie mille, è stato molto gentile."
  - tutor: "Di niente! Ecco, arriva proprio la 14. Buona giornata!"
    goals: [thank]
    done: true

- scenario: parrucchiere
  level: A2
  persona: en-f-professional
  history: [register]
  turns:
  - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
  - learner: "Buongiorno! Vorrei tagliare i capelli. Hai tempo adesso?"
    errors: [register]
  - tutor: "Sì, certo. Ma \"hai\"? Qui ci diamo del Lei, signora."
    prompt: {text: "Hai tempo", tags: [register]}
  - learner: "Scusi! Ha tempo adesso?"
  - tutor: "Sì, ho tempo. Come li vuole, corti o lunghi?"
    goals: [book]
  - learner: "Non troppo corti. Fino alle spalle, più o meno."
  - tutor: "Fino alle spalle, va bene. E la frangia, la facciamo?"
    goals: [length]
  - learner: "Frangia... sorry, what is 'frangia'?"
  - tutor: "La frangia sono i capelli corti qui davanti, sopra gli occhi."
  - learner: "Ah! No, niente frangia. Ho trovato una foto di un'attrice... guarda, ti faccio vedere sul telefono."
    errors: [register]
  - tutor: "Certo! Però attenzione, è tornato il \"tu\": come me lo dice?"
    prompt: {text: "guarda, ti faccio vedere", tags: [register]}
  - learner: "Uffa, sempre! Guardi... ti faccio vedere?"
    errors: [register]
  - tutor: "Quasi: \"Guardi, Le faccio vedere\". Che bella foto! Li facciamo proprio così."
    recast: {text: "ti faccio vedere", fix: "Le faccio vedere", tags: [register]}
    goals: [style]
  - learner: "Le faccio vedere, ok. Sì, proprio così, grazie. Quanto costa?"
  - tutor: "Lavare e tagliare, sono 35 euro. Può pagare alla fine, con calma."
  - learner: "Perfetto. Posso pagare con la carta?"
  - tutor: "Certo, signora. Allora prima laviamo i capelli, venga con me."
    goals: [pay]
    done: true

- scenario: weekend-scorso
  level: A2
  persona: en-m-heritage
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Bene! Sabato ho andato a Verona."
    errors: [auxiliary-choice]
  - tutor: "Verona, che bella! Ma sabato tu...? Con questo verbo \"ho\" non va bene."
    prompt: {text: "ho andato", tags: [auxiliary-choice]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Ah sì, mia nonna me lo dice sempre! Sono andato a Verona."
  - tutor: "Brava la nonna! E cosa hai fatto a Verona?"
    goals: [where]
  - learner: "Ho visto l'Arena e ho mangiato tanto. Troppo!"
  - tutor: "Eh sì, a Verona si mangia bene! Eri da solo?"
    goals: [what]
  - learner: "No. Con mio cugino."
  - tutor: "Che bello! E lui abita lì?"
    goals: [with-who]
  - learner: "Sì, abita lì da due anni. La sera abbiamo usciti con i suoi amici."
    errors: [auxiliary-choice]
  - tutor: "Bella serata allora! Ma la sera voi...? È come con andare, ricordi?"
    prompt: {text: "abbiamo usciti", tags: [auxiliary-choice]}
  - learner: "Abbiamo... no, aspetta. Avete usciti? Non lo so!"
    errors: [auxiliary-choice]
  - tutor: "Tranquillo: siete usciti con i suoi amici. E ti sei divertito?"
    recast: {text: "Avete usciti", fix: "siete usciti", tags: [auxiliary-choice]}
  - learner: "Siamo usciti, ecco! Sì, mi sono divertito molto. Verona è bellissima di notte."
  - tutor: "Sono d'accordo, è una città speciale. La prossima volta vengo anch'io!"
    goals: [opinion]
    done: true

- scenario: lavanderia
  level: A2
  persona: en-m-traveller
  turns:
  - tutor: "Tutto bene? Hai bisogno di una mano?"
  - learner: "Sì, grazie! La lavatrice non funziona e non so perche."
    errors: [spelling]
  - tutor: "Vediamo subito. Prima una cosa: nella tua ultima parola manca l'accento."
    prompt: {text: "perche", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}]
  - learner: "Ah, perché! Sul telefono non lo scrivo mai."
  - tutor: "Succede a tutti! Allora, hai messo il gettone?"
    goals: [problem]
  - learner: "Gettone? No. Solo monete."
  - tutor: "Ecco il problema! Questa lavatrice vuole il gettone, non le monete."
  - learner: "Ah! E poi come funziona? Quale programma?"
  - tutor: "Metti il detersivo qui sopra e scegli il programma 2. Poi metti il gettone e parte da sola."
    goals: [ask-how]
  - learner: "Ok. E dove compro... no, dove lo compro, il gettone?"
  - tutor: "Lo compri da quella macchina vicino alla porta. Sono 4 euro."
    goals: [payment]
  - learner: "Quattro euro, va bene. E l'asciugatrice è piu cara?"
    errors: [spelling]
  - tutor: "No, per quella bastano 2 euro. E attenzione, anche qui manca l'accento: su quale parola?"
    prompt: {text: "piu", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}]
  - learner: "Ehm... 'piu cara', con la u? Non vedo l'errore."
    errors: [spelling]
  - tutor: "È un errore piccolo: si scrive \"più cara\", con l'accento sulla u. E no, l'asciugatrice è meno cara!"
    recast: {text: "piu cara", fix: "più cara", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}]
  - learner: "Più, con l'accento. Capito! Grazie mille per l'aiuto."
  - tutor: "Di niente! Se hai bisogno, io sono qui a leggere."
    goals: [thank]
    done: true

- scenario: cercare-lavoro-a2
  level: A2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno! Ha visto il cartello?"
  - learner: "Buongiorno. Sì. Cercate un cameriere?"
  - tutor: "Sì, ci serve un cameriere per l'estate. Lei ha già fatto questo lavoro?"
    goals: [ask]
  - learner: "Cameriere, poco. Io soy cuoco."
    errors: [word-choice]
  - tutor: "Ah, Lei è cuoco! Interessante. Dove ha lavorato?"
    recast: {text: "soy cuoco", fix: "è cuoco", tags: [word-choice]}
    new: [{lemma: "cuoco", gloss: "cook"}]
  - learner: "Ho lavorato 5 anni in un ristorante a Buenos Aires. È corretto, 'ho lavorato'?"
  - tutor: "Sì, è corretto! E 5 anni sono tanti. Ha lavorato anche come cameriere?"
    goals: [experience]
  - learner: "Un'estate, in un bar."
  - tutor: "Bene, allora conosce il lavoro. Quando è libero?"
  - learner: "Sto disponibile tutte le sere. E il sabato tutto il giorno."
    errors: [word-choice]
  - tutor: "Perfetto, è disponibile tutte le sere: proprio quello che ci serve. L'orario è dalle 18 alle 23."
    recast: {text: "Sto disponibile", fix: "è disponibile", tags: [word-choice]}
    goals: [availability]
  - learner: "Va bene. E lo stipendio?"
  - tutor: "Sono 9 euro all'ora. Mi lascia il suo numero di telefono?"
  - learner: "Sì. 333 45 67 890. Mi chiamo Diego."
  - tutor: "Grazie, Diego. La chiamo domani mattina per una prova."
    goals: [contact]
    done: true

- scenario: palestra
  level: A2
  persona: en-f-student
  history: [modal-infinitive]
  turns:
  - tutor: "Ciao! Vuoi informazioni sull'abbonamento?"
  - learner: "Ciao! Sì. Quanto costa un mese? Si dice così?"
  - tutor: "Sì, si dice proprio così! Un mese sono 40 euro, con tutti i corsi."
    goals: [ask-membership]
  - learner: "Non male! Voglio a fare yoga. C'è?"
    errors: [modal-infinitive]
  - tutor: "Sì, c'è! Ma senti la tua frase: lì c'è una parola di troppo."
    prompt: {text: "Voglio a fare", tags: [modal-infinitive]}
  - learner: "Una parola di troppo... ah! Voglio fare yoga."
  - tutor: "Ecco. Yoga c'è il martedì e il giovedì sera."
    goals: [classes]
  - learner: "A che ora?"
  - tutor: "Alle 19, e dura un'ora. Dopo puoi restare ancora un po'."
  - learner: "Perfetto. E lo spogliatoio? Posso a lasciare lo zaino lì?"
    errors: [modal-infinitive]
  - tutor: "Certo, lì c'è posto per tutto. Però attenzione: è il problema di prima!"
    prompt: {text: "Posso a lasciare", tags: [modal-infinitive]}
  - learner: "Oh no, di nuovo! Posso lasciare lo zaino lì?"
  - tutor: "Brava, adesso sì! Allora, facciamo l'iscrizione?"
    goals: [timetable]
  - learner: "Sì! Che cosa serve?"
  - tutor: "Solo un documento e una foto. Benvenuta, ci vediamo martedì a yoga!"
    goals: [sign-up]
    done: true

- scenario: banca-conto
  level: B1
  persona: en-m-retired
  history: [register]
  turns:
  - tutor: "Buongiorno, come posso esserle utile?"
  - learner: "Buongiorno. Vorrei aprire un conto, perché mi sono trasferito qui a Lucca a settembre. Puoi aiutarmi?"
    errors: [register]
  - tutor: "Certo, benvenuto a Lucca! Solo una cosa: in banca è meglio non usare il \"tu\". Come me lo chiede?"
    prompt: {text: "Puoi aiutarmi", tags: [register]}
  - learner: "Ha ragione, mi scusi. Può aiutarmi?"
  - tutor: "Certo. Il conto le serve per la pensione o per le spese di tutti i giorni?"
  - learner: "Per tutte e due. La pensione arriva dall'America, ma qui devo pagare l'affitto e le bollette."
  - tutor: "Capisco, allora le consiglio un conto semplice. Ha con sé un documento e il codice fiscale?"
    goals: [purpose]
  - learner: "Ho il passaporto. Il codice fiscale... un momento. \"L'ho richiesto la settimana scorsa\": è giusto dire così?"
  - tutor: "Sì, è giustissimo! Se l'ha richiesto la settimana scorsa, dovrebbe arrivare tra pochi giorni. Senza quel codice purtroppo non posso aprire il conto."
    goals: [documents]
  - learner: "Capisco, torno quando arriva. Intanto, quanto costa il conto? E dimmi anche se c'è una carta."
    errors: [register]
  - tutor: "Glielo spiego subito. Però ha sentito? Nella seconda frase è tornato il \"tu\"."
    prompt: {text: "dimmi", tags: [register]}
  - learner: "Oh, è l'abitudine! Mi dici... no. Dimmi Lei?"
    errors: [register]
  - tutor: "Non si preoccupi, succede: la forma giusta è \"mi dica\". Per il conto si pagano 3 euro al mese e la carta è compresa."
    recast: {text: "Dimmi Lei", fix: "mi dica", tags: [register]}
    goals: [costs, card]
  - learner: "Mi dica, mi dica... devo ricordarlo! Tre euro al mese va benissimo. Posso usare la carta anche all'estero?"
  - tutor: "Certo, funziona in tutto il mondo e la controlla dall'app. Allora la aspetto con il codice fiscale, buona giornata!"
    done: true

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  turns:
  - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
  - learner: "Anche da noi! A Valencia la cena più importante è la sera del 24, e dura tantissimo: è una cena molto larga."
    errors: [false-friend]
  - tutor: "Una cena molto lunga, come il nostro pranzo del 25! E cosa mangiate di solito quella sera?"
    recast: {text: "molto larga", fix: "molto lunga", tags: [false-friend]}
  - learner: "Pesce, carne e alla fine il turrón, un dolce con le mandorle. Si dice \"mandorle\", vero?"
  - tutor: "Sì, mandorle, perfetto! Noi abbiamo il torrone, che è quasi uguale. Credo che sia un'usanza arrivata proprio dalla Spagna."
    new: [{lemma: "torrone", gloss: "nougat"}]
    goals: [compare]
  - learner: "Che curioso! Da piccola aspettavo soprattutto i Re Magi: il 6 gennaio portavano i regali, non Babbo Natale."
  - tutor: "Da noi invece il 6 gennaio arriva la Befana, una vecchia signora che porta dolci! E com'era quella giornata a casa tua?"
    new: [{lemma: "Befana", gloss: "the Epiphany witch who brings sweets"}]
  - learner: "La mattina aprivamo i regali e dopo salivamo tutti in strada per vedere i vicini. Uy, no: uscivamo tutti in strada!"
  - tutor: "Che bel ricordo! Immagino la strada piena di bambini con i giochi nuovi."
    goals: [past]
  - learner: "Esatto. E voi italiani? Tengo una curiosità: è vero che a Capodanno mangiate le lenticchie?"
    errors: [word-choice]
  - tutor: "Hai una curiosità giusta: sì, le mangiamo perché si dice che portino soldi! Io le preparo ogni anno, anche se non divento mai ricca."
    recast: {text: "Tengo una curiosità", fix: "Hai una curiosità", tags: [word-choice]}
    goals: [ask]
  - learner: "Noi invece mangiamo l'uva a mezzanotte. Quest'anno resto in Italia per le feste, e spero che i miei genitori vengono qui."

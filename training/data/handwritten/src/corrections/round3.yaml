- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [reflexive]
  turns:
  - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
  - learner: "Mah, così così. Lavoro tanto, e la mattina sveglio alle sei per andare in ufficio."
    errors: [reflexive]
  - tutor: "Alle sei, presto! Ma chi svegli, tuo figlio? Se parli di te, manca qualcosa."
    prompt: {text: "sveglio alle sei", tags: [reflexive]}
  - learner: "Ah ah, no, mi sveglio alle sei!"
  - tutor: "Ecco. E fai colazione o esci subito?"
  - learner: "Solo caffè."
  - tutor: "Come mio fratello: caffè e via! E la sera riesci a dormire abbastanza?"
    goals: [habits]
  - learner: "No. Cinque ore, forse sei. Voglio cambiare: il mio obiettivo è dormire di più e perdere... perso? No: perdere cinque chili."
  - tutor: "Sono due ottimi obiettivi, e vanno insieme: chi dorme poco mangia peggio. Perché non riesci ad andare a letto prima?"
    goals: [goal]
  - learner: "Lo stress. Torno a casa tardi, guardo il telefono e poi la mattina sento stanco."
    errors: [reflexive]
  - tutor: "Ti capisco, il telefono la sera è un problema! Però \"sento stanco\"... è come prima con \"sveglio\", ricordi?"
    prompt: {text: "sento stanco", tags: [reflexive]}
  - learner: "Ehm... sento me stanco?"
    errors: [reflexive]
  - tutor: "Quasi: la mattina ti senti stanco perché dormi poco. E quindi mangi male, immagino."
    recast: {text: "sento me stanco", fix: "ti senti stanco", tags: [reflexive]}
    goals: [obstacles]
  - learner: "Mi sento stanco, giusto. Sì, mangio panini davanti al computer. Che cosa posso fare?"
  - tutor: "Io inizierei da una cosa sola: telefono spento alle 10 e mezza. Poi potresti aggiungere due allenamenti alla settimana, anche brevi."
  - learner: "Va bene, ci provo. Telefono spento alle dieci e mezza, e camminata il martedì e il sabato."
  - tutor: "Ottimo piano! Tra un mese mi dici se stai meglio."
    goals: [plan]
    done: true

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"

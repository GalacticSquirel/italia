  - learner: "Con essere! Mi sono abituata. In spagnolo usiamo sempre \"haber\", per questo sbaglio."
  - tutor: "Lo immaginavo, succede a tanti che parlano spagnolo. E qual è per te il vantaggio più grande di lavorare da casa?"
  - learner: "Il tempo. Non devo prendere l'autobus, mi alzo più tardi, e riesco a concentrarmi meglio. Si dice \"riesco a concentrarmi\" o \"riesco di concentrarmi\"?"
  - tutor: "\"Riesco a concentrarmi\", come hai detto: perfetto. Io invece a casa mi distraggo con qualsiasi cosa, anche con il telefono!"
    goals: [pros]
  - learner: "Anch'io, a volte! E c'è un altro svantaggio: mi sento sola. La settimana scorsa ho rimasta a casa cinque giorni e non ho parlato con nessuno."
    errors: [auxiliary-choice]
  - tutor: "Cinque giorni senza parlare con nessuno sono tanti, ti capisco. Ma attenta, è tornato l'amico spagnolo: la settimana scorsa tu...?"
    prompt: {text: "ho rimasta", tags: [auxiliary-choice]}
  - learner: "Uy... ho rimasto a casa?"
    errors: [auxiliary-choice]
  - tutor: "Quasi: sei rimasta a casa, perché anche \"rimanere\" vuole essere. E in ufficio, invece, con i colleghi parli volentieri?"
    recast: {text: "ho rimasto a casa", fix: "sei rimasta a casa", tags: [auxiliary-choice]}
    goals: [cons]
  - learner: "Sono rimasta, ok! Sì, in ufficio sono simpatici, pranziamo insieme. Se potessi scegliere, farei metà e metà."
  - tutor: "Mi sembra la scelta migliore: la concentrazione a casa e la compagnia in ufficio. Farei così anch'io!"
    goals: [preference]
    done: true

- scenario: giorno-tipico
  level: A1
  persona: en-f-professional
  history: [verb-form]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao! Io svegliare alle 6. Troppo presto!"
    errors: [verb-form]
  - tutor: "Alle 6, che presto! Ma \"svegliare\"? Con \"io\" come cambia?"
    prompt: {text: "Io svegliare", tags: [verb-form]}
  - learner: "Ah, sì! Io mi sveglio alle 6."
  - tutor: "Giusto! E poi fai colazione?"
    goals: [wake]
  - learner: "Sì. Caffè e pane."
  - tutor: "Buona! E dove lavori?"
  - learner: "In un ufficio a Milano. Io lavorare fino alle 7 di sera."
    errors: [verb-form]
  - tutor: "Fino alle 7, è tanto! Ma \"io lavorare\" è come prima."
    prompt: {text: "Io lavorare", tags: [verb-form]}
  - learner: "Ehm... io lavora fino alle 7?"
    errors: [verb-form]
  - tutor: "Quasi! Tu dici: io lavoro fino alle 7. E la sera cosa fai?"
    recast: {text: "io lavora", fix: "io lavoro", tags: [verb-form]}
    goals: [work]
  - learner: "Io lavoro, ok! La sera sono stanca. Cena, poi letto."
  - tutor: "Ti capisco! Anch'io la sera dormo presto."
    goals: [evening]
  - learner: "E tu? A che ora ti svegli?"
  - tutor: "Alle 7. Poi prendo sempre un caffè al bar!"
    goals: [ask]
    done: true

- scenario: ristorante-ordinare
  level: A2
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Buongiorno. Siamo in tre. Abbiamo prenotato a nome Ferrer."
  - tutor: "Sì, ho trovato il nome. Prego, il vostro tavolo è vicino alla finestra."
    goals: [ask-table]
  - learner: "Grazie. Per iniziare, avete un caldo di verdure? Oggi fa freddo."
    errors: [false-friend]
  - tutor: "Sì, abbiamo un brodo di verdure molto buono, fatto stamattina. E come secondo?"
    recast: {text: "un caldo di verdure", fix: "un brodo di verdure", tags: [false-friend]}
    new: [{lemma: "brodo", gloss: "broth"}]
  - learner: "Brodo! In spagnolo \"caldo\" è la zuppa, che confusione. Come secondo, il pesce con l'insalata. \"Il pesce è fresco?\" Si chiede così?"
  - tutor: "Si chiede proprio così, e la risposta è sì: è arrivato oggi. Vuole altro da mangiare?"
    goals: [order-food]
  - learner: "No, basta così. Ma può portare l'aceto di oliva per l'insalata, per favore?"
    errors: [false-friend]
  - tutor: "Certo, le porto l'olio d'oliva. L'aceto è un'altra cosa, più forte: vuole anche quello?"
    recast: {text: "l'aceto di oliva", fix: "l'olio d'oliva", tags: [false-friend]}
    new: [{lemma: "olio", gloss: "oil"}]
  - learner: "No, no, solo olio! E da bere, acqua. Naturale."
  - tutor: "Acqua naturale, benissimo. Arriva tutto subito."
    goals: [order-drink]
  - learner: "Grazie. Più tardi... il conto, per favore. Abbiamo un treno alle tre."
  - tutor: "Non si preoccupi, lo preparo già adesso. Così alle tre siete in stazione!"
    goals: [ask-bill]
    done: true

- scenario: dal-meccanico
  level: B1
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno! Che problema ha la macchina?"
  - learner: "Buongiorno. Un rumore. Forte."
  - tutor: "Un rumore forte, capisco. Da dove viene, dal motore o dai freni?"
  - learner: "Dai freni, credo. Quando freno, fa... non so la parola. Come un grido."
  - tutor: "Ho capito, un fischio quando frena. Lo fa sempre o solo ogni tanto?"
    new: [{lemma: "fischio", gloss: "whistle, squeal"}]
    goals: [describe]
  - learner: "Sempre. Da lunedì."
  - tutor: "Da lunedì, quindi da pochi giorni. E lunedì è successo qualcosa di particolare?"
    goals: [when]
  - learner: "Sì. Ha piovuto molto e ho passato per una strada con molta acqua."
    errors: [auxiliary-choice]
  - tutor: "Ah, l'acqua può dare fastidio ai freni. Solo una cosa sul verbo: con \"passare per una strada\" quale ausiliare ci vuole?"
    prompt: {text: "ho passato", tags: [auxiliary-choice]}
    new: [{lemma: "verbo", gloss: "verb"}, {lemma: "ausiliare", gloss: "auxiliary verb"}]
  - learner: "Essere? Sono passato per una strada con molta acqua."
  - tutor: "Esatto. Allora devo controllare i freni: forse basta pulirli, forse bisogna cambiare un pezzo."
  - learner: "E quanto costa?"
  - tutor: "Se basta pulire, 40 euro. Se devo cambiare i pezzi, il preventivo è di circa 180 euro."
    goals: [cost]
  - learner: "Va bene. Quando sta pronta? Lavoro in un ristorante, la macchina mi serve."
    errors: [word-choice]
  - tutor: "Se le serve per lavorare, facciamo presto: la macchina è pronta domani alle 5. Le va bene?"
    recast: {text: "sta pronta", fix: "è pronta", tags: [word-choice]}
    goals: [time]
  - learner: "Domani alle 5. Perfetto, grazie."
  - tutor: "Grazie a lei. Mi lasci le chiavi e a domani!"
    done: true

- scenario: trattativa-affitto
  level: B2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto, soprattutto la luce del soggiorno. Però credo che il canone è un po' alto per la zona."
    errors: [subjunctive-use]
  - tutor: "La luce è il suo punto forte, in effetti. Del canone parliamo subito, ma prima: dopo \"credo che\" quale modo si aspetta un italiano?"
    prompt: {text: "che il canone è", tags: [subjunctive-use]}
  - learner: "Il congiuntivo, naturalmente. Credo che il canone sia un po' alto."
  - tutor: "Perfetto. Il proprietario chiede 950 euro, ma il prezzo è trattabile. Lei a quanto pensava?"
    goals: [interest]
  - learner: "Pensavo a 850. Ho guardato altri appartamenti nel quartiere e costano meno. È corretto dire \"trattare il prezzo\"?"
  - tutor: "Sì, è corretto: il prezzo si tratta, e infatti questo è trattabile. A 850 non credo che arriviamo, ma 900 mi sembra possibile."
  - learner: "Novecento potrebbe andare, a una condizione: vorrei che il proprietario cambia la caldaia, perché mi è sembrata molto vecchia."
    errors: [subjunctive-use]
  - tutor: "È una richiesta giusta, la caldaia ha i suoi anni. Però attenzione, è il problema di prima: dopo \"vorrei che\" il presente non basta."
    prompt: {text: "che il proprietario cambia", tags: [subjunctive-use]}
  - learner: "Vorrei che il proprietario cambierà la caldaia?"
    errors: [subjunctive-use]
  - tutor: "Qui ci vuole il congiuntivo imperfetto: vorrei che il proprietario cambiasse la caldaia. Glielo propongo oggi, e credo che accetterà."
    recast: {text: "cambierà", fix: "cambiasse", tags: [subjunctive-use]}
    new: [{lemma: "congiuntivo", gloss: "subjunctive"}, {lemma: "imperfetto", gloss: "imperfect"}]
    goals: [negotiate]
  - learner: "Cambiasse, grazie. Un'altra domanda: se devo andare via prima, quanti mesi servono per la disdetta?"
  - tutor: "Per la disdetta servono 3 mesi, con una lettera raccomandata. La garanzia invece è di 2 mesi di canone, che le tornano alla fine."
    goals: [conditions]
  - learner: "Mi sembra corretto. E la provvigione dell'agenzia? Mi dica la verita... verità, mi scusi, questa tastiera!"
  - tutor: "La verità è semplice: un mese di canone, una volta sola. Allora, se il proprietario accetta 900 euro e la caldaia nuova, firmiamo?"
  - learner: "Sì, a queste condizioni firmo volentieri. Mi faccia sapere appena ha una risposta."
  - tutor: "La chiamo entro domani sera. È stato un piacere, a presto!"
    goals: [conclude]
    done: true

    goals: [motivation]
  - learner: "Sì, a Siviglia. Ho lavorato con ancianos... come si dice? Persone di ottanta, novanta anni."
  - tutor: "Si dice \"anziani\". Che bello, noi abbiamo proprio un'attività con gli anziani del quartiere! Che cosa facevi con loro?"
  - learner: "Leggevo il giornale per loro e giocavamo a carte. Sono molto paziente, credo. \"Paziente\" è corretto in italiano?"
  - tutor: "Sì, è corretto, e la pazienza qui serve davvero. Quanto tempo libero hai durante la settimana?"
    goals: [skills]
  - learner: "Il martedì e il giovedì pomeriggio sto libera. La mattina no, c'è lezione."
    errors: [word-choice]
  - tutor: "Perfetto, se sei libera il martedì e il giovedì possiamo organizzarci bene. Preferisci stare con gli anziani o aiutare i bambini con i compiti?"
    recast: {text: "sto libera", fix: "sei libera", tags: [word-choice]}
    goals: [time]
  - learner: "Gli anziani! E posso cominciare pronto, anche questa settimana."
    errors: [false-friend]
  - tutor: "Allora puoi cominciare presto: giovedì alle 4 c'è il pomeriggio di carte. In italiano \"pronto\" vuol dire che sei preparata, e tu lo sei!"
    recast: {text: "cominciare pronto", fix: "cominciare presto", tags: [false-friend]}
  - learner: "Ah, come \"listo\"! Sono pronta e comincio presto. Devo portare qualcosa giovedì?"
  - tutor: "Solo la tua pazienza e tanta voglia di parlare. Ci vediamo giovedì, grazie!"
    goals: [choose]
    done: true

- scenario: vita-in-italia
  level: B2
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. All'inizio è stato per amore, come in tante storie: ho conosciuto mio marito durante un corso estivo e sei anni fa sono arrivata in Torino con due valigie."
    errors: [preposition]
  - tutor: "Una storia d'amore, che bell'inizio! Solo una domanda sulla lingua: con il nome di una città, quale preposizione usiamo in italiano?"
    prompt: {text: "in Torino", tags: [preposition]}
    new: [{lemma: "preposizione", gloss: "preposition"}]
  - learner: "Ah, certo: sono arrivata a Torino. In spagnolo diciamo \"en\", è più forte di me."
  - tutor: "Succede spesso tra lingue così vicine. E i primi mesi a Torino come sono stati?"
    goals: [story]
  - learner: "Duri, sinceramente. Non trovavo lavoro come insegnante perché il mio titolo non era riconosciuto, e negli uffici nessuno contestava alle mie email."
    errors: [false-friend]
  - tutor: "Capisco: nessuno rispondeva alle sue email, e la burocrazia italiana purtroppo è famosa per questo. Che cosa l'ha aiutata a non perdere la fiducia?"
    recast: {text: "contestava alle mie email", fix: "rispondeva alle sue email", tags: [false-friend]}
    goals: [difficulties]
  - learner: "Le persone. Una vicina mi ha accompagnata all'anagrafe, e alla fine mi sono abituata. \"Mi sono abituata\" è la forma corretta? In spagnolo sarebbe \"acostumbrada\"."
  - tutor: "Sì, è la forma corretta, e ha fatto bene a evitare la versione spagnola. Che cosa è cambiato in lei in questi sei anni?"
  - learner: "Tante cose. Sono diventata più paziente, e ho imparato a godermi il pranzo: prima mangiavo in dieci minuti davanti al computer. Ora penso che la tavola sia sacra."
  - tutor: "La tavola è sacra: lo metteremo come titolo di oggi! E la nostalgia di casa c'è ancora?"
    goals: [change]
  - learner: "Sì, soprattutto in primavera, quando in Valencia ci sono le Fallas e tutta la mia famiglia è in strada."
    errors: [preposition]
  - tutor: "Immagino, dev'essere una festa bellissima. Però mi permetta: ha sentito che cosa ha detto prima del nome della città?"
    prompt: {text: "in Valencia", tags: [preposition]}
  - learner: "Oh no, ancora! Quando a Valencia ci sono le Fallas. Sei anni e quell'errore è sempre lì."
  - tutor: "Ma lo sente da sola, ed è questo che conta. Per chiudere: che consiglio darebbe a chi sta per trasferirsi in Italia?"
  - learner: "Di non chiudersi nel gruppo dei connazionali. Bisogna uscire, sbagliare, chiedere aiuto ai vicini: gli italiani aiutano volentieri, se glielo chiedi."
  - tutor: "Un ottimo consiglio, e detto in un italiano bellissimo. Grazie per essere stata con noi, e buona vita a Torino!"
    goals: [advice]
    done: true

- scenario: recensione-ristorante
  level: B2
  persona: en-m-traveller
  history: [register]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, purtroppo. Abbiamo aspettato quasi un'ora per i primi, e quando sono arrivati il mio risotto era freddo. Guarda, tocca il piatto."
    errors: [register]
  - tutor: "Mi dispiace davvero, un'ora di attesa non è accettabile. Mi permetta solo una nota: tra noi, in sala, userei una forma più formale. Come mi inviterebbe a controllare il piatto?"
    prompt: {text: "Guarda, tocca", tags: [register]}
  - learner: "Giusto, scusi. Guardi, tocchi il piatto: è freddo."
  - tutor: "Ha ragione, è freddo, e me ne scuso. C'è stato altro che non è andato bene?"
    goals: [complain]
  - learner: "La cottura. Il risotto era... how do you say 'overcooked'?"
  - tutor: "Si dice \"scotto\". Quindi freddo e anche scotto: capisco perfettamente."
    new: [{lemma: "scotto", gloss: "overcooked"}]
  - learner: "Scotto, esatto. E mi dispiace dirlo, perché sono venuto qui apposta: un amico di Dublino mi aveva detto che è il miglior risotto di Milano. Mi aspettavo molto di più."
  - tutor: "E aveva tutto il diritto di aspettarselo. Stasera in cucina manca un cuoco e abbiamo lavorato male, ma non è una scusa."
    goals: [detail, expectation]
  - learner: "Apprezzo l'onestà. Ma adesso cosa fai per noi? Abbiamo ancora fame, lo sai."
    errors: [register]
  - tutor: "Ha ragione a chiederlo. Prima, però, ha notato? Con la fame è tornata anche la forma di prima."
    prompt: {text: "cosa fai", tags: [register]}
  - learner: "Ah, damn. Cosa fa per noi? Abbiamo ancora fame, lo sai."
    errors: [register]
  - tutor: "Quasi perfetto: resta solo quel \"lo sai\" finale, che con me diventa \"lo sa\". Per voi faccio preparare subito due risotti nuovi, e i primi di stasera non li pagate."
    recast: {text: "lo sai", fix: "lo sa", tags: [register]}
    goals: [resolve]
  - learner: "Lo sa, lo sa... lo imparerò prima del dolce! Va bene, accettiamo. Grazie per la disponibilità."
  - tutor: "Grazie a voi per la pazienza. E il dolce, naturalmente, lo offre la casa."
    done: true

- scenario: politica-lavoro
  level: B2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Metà mi sembra esagerato. Nel marketing, per esempio, la tecnologia fa già molte cose, ma qualcuno deve ancora decidere la strategia."
  - tutor: "Per ora sì. Però ammetterai che certi lavori sempre uguali stanno già sparendo, no?"
    goals: [opinion]
  - learner: "Certo. Se io sarei una giovane che inizia adesso, sceglierei un settore creativo."
    errors: [hypothetical]
  - tutor: "Scelta furba! Ma torna all'inizio della frase: dopo quel \"se\" il condizionale non regge. Che modo ci vuole?"
    prompt: {text: "Se io sarei", tags: [hypothetical]}
    new: [{lemma: "condizionale", gloss: "conditional"}]
  - learner: "Il congiuntivo, lo so, lo so. Se io fossi una giovane che inizia adesso, sceglierei un settore creativo."
  - tutor: "Ecco. Anche se, a dirla tutta, pure i creativi rischiano: hai visto cosa sanno fare oggi i programmi con le immagini?"
    goals: [hypothesis]
  - learner: "Sì, ed è impressionante. Nella mia agenzia abbiamo provato a usarli per una campagna: il risultato era bello ma freddo, e il cliente l'ha... l'ha rifiutata? No, scusa: l'ha rifiutato, il risultato."
  - tutor: "Interessante, quindi il cliente ha sentito la differenza. E i tuoi colleghi come l'hanno presa, hanno paura?"
    goals: [example]
  - learner: "Alcuni sì. Io penso che il rischio vero sia per chi non si aggiorna. Se le aziende investirebbero di più nella formazione, nessuno avrebbe paura."
    errors: [hypothetical]
  - tutor: "Sulla formazione mi trovi d'accordo. Però attenta: è scappato di nuovo, proprio dopo il \"se\"."
    prompt: {text: "investirebbero", tags: [hypothetical]}
  - learner: "Uffa. Se le aziende avrebbero investito? No... non mi viene."
    errors: [hypothetical]
  - tutor: "Tranquilla, capita: se le aziende investissero di più, dicevi, nessuno avrebbe paura. E secondo me hai ragione, ma chi dovrebbe pagarla, questa formazione?"
    recast: {text: "avrebbero investito", fix: "investissero", tags: [hypothetical]}
  - learner: "Investissero, ecco! Secondo me dovrebbero pagarla insieme lo Stato e le aziende. In conclusione, non credo alla tua metà: i lavori cambieranno, ma non spariranno."
  - tutor: "Va bene, mi hai quasi convinto: diciamo un terzo e non se ne parla più!"
    goals: [conclude]
    done: true

- scenario: film-libro
  level: B2
  persona: en-m-heritage
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Inizio io. Ho letto \"Il barone rampante\" di Calvino. Parla di un ragazzo nobile che litiga con il padre, sale su un albero e non scende mai più."
  - tutor: "Un classico, l'ho amato al liceo! E come mai non scende più, secondo te?"
    goals: [summary]
  - learner: "All'inizio per rabbia, poi diventa una scelta. Benché lui è lontano da tutti, partecipa alla vita del paese. Aspetta: \"benché lui è\"... si può dire?"
    errors: [subjunctive-use]
  - tutor: "Bella domanda, e il tuo dubbio è giusto: \"benché\" vuole un altro modo del verbo. Quale?"
    prompt: {text: "Benché lui è", tags: [subjunctive-use]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Il congiuntivo: benché lui sia lontano da tutti, partecipa alla vita del paese."
  - tutor: "Esatto. Ed è proprio questo il bello del personaggio: guarda il mondo dall'alto ma non lo abbandona mai."
    goals: [characters]
  - learner: "Sì! Mi ha fatto pensare a mio nonno. Lui era venuto... no, è venuto in Canada a vent'anni e guardava sempre l'Italia da lontano, come dall'albero."
  - tutor: "Che bella immagine, davvero. E lo stile ti è piaciuto, o l'hai trovato difficile?"
  - learner: "Difficile all'inizio, tante parole di piante! Ma è divertente. Il finale e un po' triste, pero giusto."
    errors: [spelling]
  - tutor: "Sono d'accordo, quel finale resta dentro. Piccola nota di scrittura: nell'ultima frase mancano due accenti, li trovi?"
    prompt: {text: "pero", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}]
  - learner: "Vediamo... \"il finale è un po' triste\", e poi... \"pero\"? Non vedo l'altro."
    errors: [spelling]
  - tutor: "Il primo l'hai trovato! L'altro è su \"però\", che senza accento sarebbe un albero di pere: Calvino avrebbe apprezzato."
    recast: {text: "pero", fix: "però", tags: [spelling]}
    new: [{lemma: "accento", gloss: "accent mark"}, {lemma: "pera", gloss: "pear"}]
    goals: [opinion]
  - learner: "Ah ah, un pero! Però adesso non lo dimentico più. Comunque lo consiglio a tutti, soprattutto a chi ama le storie strane."
  - tutor: "Ottima scelta e ottima presentazione. Lo mettiamo nella lista del mese prossimo!"
    goals: [recommend]
    done: true


# Round 2: failed repairs, two errors in one turn, recurring errors from history,
# long switches to English, off-topic tangents and free conversation at B1 and B2.
- scenario: biglietto-treno
  level: B1
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
  - tutor: "Buongiorno, dove deve andare?"
  - learner: "Buongiorno! Vorrei andare a Firenze domani mattina, verso le nove. C'è un treno?"
  - tutor: "Sì, c'è un regionale alle 9 e 10 e un treno veloce alle 9 e 25. Quale preferisce?"
    goals: [destination]
  - learner: "Il veloce. Vorrei un biglietto di andata e ritorno: torno domenica sera, a le 8 più o meno."
    errors: [articulated-preposition]
  - tutor: "Andata e ritorno, bene. Scusi, domenica a che ora? Attenzione: qui due parole piccole diventano una sola."
    prompt: {text: "a le 8", tags: [articulated-preposition]}
  - learner: "Ehm... a la 8?"
    errors: [articulated-preposition]
  - tutor: "Alle 8, benissimo: domenica c'è un treno che parte alle 8 e un quarto. Preferisce la prima o la seconda classe?"
    recast: {text: "a la 8", fix: "alle 8", tags: [articulated-preposition]}
    goals: [type]
  - learner: "Alle 8, ok. Seconda classe. Scusi, how do you say 'window seat'?"
  - tutor: "Si dice \"posto vicino al finestrino\". Lo vuole così?"
    new: [{lemma: "finestrino", gloss: "train window"}]
  - learner: "Sì, un posto vicino al finestrino, grazie. A proposito, lei è di Firenze? Che cosa devo mangiare lì?"
  - tutor: "No, sono di qui, ma a Firenze provi la bistecca: è famosa! Ecco il suo biglietto, seconda classe, vicino al finestrino."
    new: [{lemma: "bistecca", gloss: "steak"}]
    goals: [class]
  - learner: "La bistecca, perfetto! Da quale binario parte il treno domani?"
  - tutor: "Parte dal binario 6. Buon viaggio, e mangi bene a Firenze!"
    goals: [platform]
    done: true

- scenario: cucina-ricetta
  level: B1
  persona: en-f-student
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "Stasera facciamo il curry di mia nonna! Servono pollo, cipolle, pomodori, riso e molte spezie."
  - tutor: "Buono, non l'ho mai fatto in casa! Da dove iniziamo?"
    goals: [ingredients]
  - learner: "Prima prendi le cipolle e taglia loro molto piccole. Poi metti l'olio su la pentola."
    errors: [object-pronoun, articulated-preposition]
  - tutor: "Ok, prendo le cipolle. Aspetta, cosa faccio con loro? Qui serve un pronome corto vicino al verbo."
    prompt: {text: "taglia loro", tags: [object-pronoun]}
    new: [{lemma: "pronome", gloss: "pronoun"}, {lemma: "verbo", gloss: "verb"}]
  - learner: "Ah... taglia li molto piccole?"
    errors: [object-pronoun]
  - tutor: "Ci sei quasi: le cipolle le taglio molto piccole, così. Guarda, ho già finito! E dopo l'olio cosa metto?"
    recast: {text: "taglia li", fix: "le taglio", tags: [object-pronoun]}
    new: [{lemma: "cipolla", gloss: "onion"}]
  - learner: "Dopo aggiungi il pollo e le spezie. Sorry, è difficile spiegare in italiano, faccio tanti errori!"
  - tutor: "Ma no, ti capisco benissimo e sto imparando un piatto nuovo! Quanto tempo deve cuocere il pollo?"
    goals: [steps]
  - learner: "Circa venti minuti, insieme ai pomodori. Do you like spicy food?"
  - tutor: "Sì, mi piace molto il cibo piccante! Venti minuti, perfetto. E alla fine come lo serviamo?"
    new: [{lemma: "piccante", gloss: "spicy"}]
    goals: [time]
  - learner: "Piccante, ok! Lo serviamo con il riso bianco e un po' di yogurt sopra."
  - tutor: "Che buono, ho già fame! Io preparo la tavola, tu controlla la pentola."
    goals: [serve]
    done: true

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo una festa a sorpresa! Sabato sera a casa mia, che ne dici?"
  - tutor: "Ottima idea, casa tua è grande. Chi invitiamo?"
    goals: [date]
  - learner: "Tutti gli amici dell'università e anche sua sorella. Voglio che viene anche Luca, anche se loro due hanno litigato."
    errors: [subjunctive-use]
  - tutor: "Luca, sei sicuro? Comunque dopo \"voglio che\" il verbo cambia forma, lo sai. Come lo dici?"
    prompt: {text: "che viene", tags: [subjunctive-use]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Uffa, sempre quello! Voglio che venga anche Luca."
  - tutor: "Giusto. Va bene, lo invito io e speriamo che facciano pace! E da mangiare?"
    goals: [guests]
  - learner: "Aspetta, a proposito di Luca: hai visto la partita ieri sera? Lui era allo stadio!"
  - tutor: "No, l'ho persa, ero a cena da mia madre. Com'è finita?"
  - learner: "Due a zero per noi! È stata una partita bellissima, e il secondo gol è arrivato all'ultimo minuto."
  - tutor: "Che peccato non averla vista! Dai, torniamo alla festa: cosa prepariamo da mangiare?"
  - learner: "Possiamo fare la pizza, e la torta la ordino io. Sara ama il cioccolato, quindi prendo una torta al cioccolato."
  - tutor: "Perfetto, la torta al cioccolato le piacerà di sicuro. E come regalo hai qualche idea?"
    goals: [food]
  - learner: "Sì, un libro di fotografia. Io la regalo il libro e tu puoi comprare i fiori."
    errors: [object-pronoun]
  - tutor: "Bella idea, a Sara piace tanto fare foto! Però il libro lo regali a Sara: quale pronome serve allora?"
    prompt: {text: "la regalo", tags: [object-pronoun]}
    new: [{lemma: "pronome", gloss: "pronoun"}]
  - learner: "A Sara... allora io le regalo il libro!"
  - tutor: "Esatto. E io le porto i fiori, così sabato sarà una serata perfetta!"
    goals: [gift]
    done: true

- scenario: medico-base
  level: B1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
  - learner: "Buongiorno dottore. Ho un forte mal di gola e la tosse, soprattutto di notte."
  - tutor: "Mi dispiace. Ha anche la febbre?"
  - learner: "Ieri sera sì, 38. Sorry, I'm really tired and I can't think in Italian today."
  - tutor: "Non si preoccupi, parlo lentamente e uso parole semplici. Da quanti giorni sta male?"
    goals: [symptoms]
  - learner: "Since Monday. It started with a headache and then my throat."
  - tutor: "Da lunedì, quindi da 4 giorni: prima il mal di testa, poi la gola. Prende qualche medicina di solito?"
    goals: [since-when]
  - learner: "No, nothing regular. But I'm allergic to penicillin."
  - tutor: "Capisco: è allergica alla penicillina, lo scrivo subito. Allora le preparo la ricetta per un'altra medicina."
    new: [{lemma: "penicillina", gloss: "penicillin"}]
    goals: [history]
  - learner: "Va bene, grazie. Ora provo di nuovo in italiano: quante volte al giorno devo prenderla?"
  - tutor: "Brava, la domanda è perfetta! Una compressa due volte al giorno, dopo i pasti, per 5 giorni."
    new: [{lemma: "pasto", gloss: "meal"}, {lemma: "compressa", gloss: "tablet"}]
  - learner: "Due volte al giorno dopo i pasti, per 5 giorni. Ma il mio capo vuole che torno in ufficio domani."
    errors: [subjunctive-use]
  - tutor: "No, domani deve riposare! E attenzione alla frase: il suo capo vuole che lei...? Qui il verbo cambia."
    prompt: {text: "che torno", tags: [subjunctive-use]}
    new: [{lemma: "verbo", gloss: "verb"}]
    goals: [instructions]
  - learner: "Vuole che io tornerò?"
    errors: [subjunctive-use]
  - tutor: "Il suo capo vuole che lei torni, ma il medico dice di no! Resti a casa almeno 3 giorni e beva molta acqua."
    recast: {text: "che io tornerò", fix: "che lei torni", tags: [subjunctive-use]}
  - learner: "Vuole che io torni, ho capito. Va bene, dottore, resto a casa."
  - tutor: "Ecco, così va bene. Se la febbre non passa, torni da me. Buona giornata!"
    done: true

- scenario: prenotare-tavolo
  level: B1
  persona: es-m-worker
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera. Quisiera prenotare un tavolo."
    errors: [word-choice]
  - tutor: "Buonasera! Certo, lei vorrebbe prenotare un tavolo: per quando?"
    recast: {text: "Quisiera", fix: "vorrebbe", tags: [word-choice]}
    goals: [book]
  - learner: "Vorrei, sì. Per sabato, alle 9. Siamo 6 persone."
  - tutor: "Sabato alle 9 per 6 persone, va bene. Avete qualche richiesta particolare?"
    goals: [details]
  - learner: "Sì. Es il compleanno di mia moglie e voglio che il tavolo è fuori."
    errors: [subjunctive-use, word-choice]
  - tutor: "Auguri a sua moglie! Scusi, la linea non è buona: lei vuole che il tavolo...?"
    prompt: {text: "che il tavolo è", tags: [subjunctive-use]}
  - learner: "Voglio che il tavolo sia fuori, in giardino."
  - tutor: "Benissimo, un tavolo fuori in giardino. Le serve altro?"
  - learner: "Sì, una... cómo se dice, a chair for a baby?"
  - tutor: "Si dice \"seggiolone\". Certo, ne abbiamo uno! A che nome prenoto?"
    new: [{lemma: "seggiolone", gloss: "high chair"}]
    goals: [special]
  - learner: "Martín Ferrari. Lei mi può confirmare l'ora, per favore?"
    errors: [word-choice]
  - tutor: "Certo, signor Ferrari, le posso confermare tutto: sabato alle 9, 6 persone, tavolo fuori con seggiolone."
    recast: {text: "confirmare", fix: "confermare", tags: [word-choice]}
    new: [{lemma: "seggiolone", gloss: "high chair"}]
    goals: [name]
  - learner: "Perfetto, grazie. A sabato!"
  - tutor: "Grazie a lei, a sabato!"
    done: true

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
  - learner: "Abitavo in una piccola città in Ohio, vicino a un lago. La nostra casa era bianca, con un grande giardino."
  - tutor: "Che bel posto per un bambino! E cosa facevi dopo la scuola?"
    goals: [place]
  - learner: "D'estate ho pescato ogni giorno con mio padre. Tornavamo a casa solo per cena."
    errors: [tense-aspect]
  - tutor: "Ogni giorno, che fortuna! Ma era una cosa di tutti i giorni, quindi \"ho pescato\" qui non funziona. Come lo cambi?"
    prompt: {text: "ho pescato", tags: [tense-aspect]}
  - learner: "Hai ragione, ci casco sempre. D'estate pescavo ogni giorno con mio padre."
  - tutor: "Proprio così. Io invece passavo l'estate dai nonni, in campagna. E a scuola com'eri?"
    goals: [habits]
  - learner: "Ero bravo in matematica ma terribile in musica. A proposito, tu suoni qualche strumento? Ho visto una chitarra a casa tua."
  - tutor: "Sì, suono la chitarra da 20 anni, ma solo per gli amici! E tu non hai mai provato?"
  - learner: "Ho provato il pianoforte a sessant'anni. Mia moglie dice che il gatto scappa quando suono."
  - tutor: "Povero gatto! Però ci vuole coraggio per iniziare a quell'età. E a scuola il maestro di musica com'era?"
  - learner: "Molto severo. Una volta mi ha mandato fuori perché ridevo. La maestra di matematica invece era fantastica: grazie a lei sono diventato ingegnere."
  - tutor: "Che bello avere una maestra così. C'è un ricordo di quegli anni che non dimenticherai mai?"
    goals: [school]
  - learner: "Sì. Quando avevo dieci anni il lago è diventato tutto ghiaccio e la città intera pattinava sopra. Mio padre mi teneva la mano."
  - tutor: "Che immagine meravigliosa, tu e tuo padre sul lago! Grazie per questi ricordi. Adesso ci prendiamo un caffè?"
    goals: [event]
    done: true

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Ciao! Ho andato a Sardegna con le mie coinquiline, per due settimane."
    errors: [auxiliary-choice, preposition]
  - tutor: "La Sardegna, che bello! Ma con \"andare\" non usiamo \"avere\". Come lo dici?"
    prompt: {text: "Ho andato", tags: [auxiliary-choice]}
  - learner: "Ah... ho andata in Sardegna?"
    errors: [auxiliary-choice]
  - tutor: "Quasi! Sei andata in Sardegna, con \"essere\". E che tempo avete trovato?"
    recast: {text: "ho andata", fix: "Sei andata", tags: [auxiliary-choice]}
    goals: [where]
  - learner: "Sono andata, ok! Il tempo era perfetto, sempre sole e 30 gradi. Solo un giorno ha piovuto."
  - tutor: "Che fortuna, qui ha piovuto tutta l'estate! E cosa avete fatto di bello?"
    goals: [weather]
  - learner: "Tanto mare! Abbiamo noleggiato una macchina e visitato le spiagge del nord. Ho anche provato il surf, ma sono caduta mille volte."
  - tutor: "Che coraggio, io non ci ho mai provato! E ti sei divertita comunque?"
    goals: [activities]
  - learner: "Tantissimo! Senti, cambio discorso: tu sei rimasta in città tutta l'estate? Mi dispiace per te!"
  - tutor: "Eh sì, ho lavorato fino a metà agosto, poi sono stata 3 giorni in montagna dai miei. Poco, ma mi sono riposata."
  - learner: "In montagna! Io non sono mai stata sulle Alpi. È caro lì?"
  - tutor: "Dipende dal posto, ma se dormi in un rifugio spendi poco. Un giorno ci andiamo insieme! Torniamo alla Sardegna: cosa ti è piaciuto di più?"
    new: [{lemma: "rifugio", gloss: "mountain hut"}]
  - learner: "La cosa più bella è stata una spiaggia piccola dove siamo arrivate a piedi. Non c'era nessuno, solo noi e il mare."
  - tutor: "Sembra un sogno. La prossima estate voglio venire anch'io!"
    goals: [best]
    done: true

- scenario: dal-meccanico
  level: B1
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Buongiorno! Che problema ha la macchina?"
  - learner: "Buongiorno. La macchina fa un rumore strano quando freno, tipo un fischio. Puoi guardare?"
    errors: [register]
  - tutor: "Un fischio quando frena, ho capito. Però qui in officina ci diamo del Lei: come mi chiede di guardare?"
    prompt: {text: "Puoi guardare", tags: [register]}
    new: [{lemma: "officina", gloss: "garage, workshop"}]
  - learner: "Scusi, con mio nonno parlavo sempre così! Può guardare i freni, per favore?"
  - tutor: "Certo, li controllo subito. Da quando sente questo rumore?"
    goals: [describe]
  - learner: "Da una settimana circa. Prima il rumore c'era solo la mattina, adesso lo sento sempre."
  - tutor: "Allora è meglio non aspettare. Lei usa molto la macchina?"
    goals: [when]
  - learner: "Sì, ogni giorno. Sa, mio nonno aveva una Fiat 500 del 1965, come quella lì fuori! È sua?"
  - tutor: "Sì, è mia, l'ho rimessa a posto io in due anni! Suo nonno la guidava in Italia?"
  - learner: "Sì, in Calabria. Mi portava al mare con quella macchina, e noi bambini stavamo in quattro dietro!"
  - tutor: "In quattro dietro, che tempi! Erano macchine piccole ma forti. Torniamo alla sua: bisogna cambiare i freni davanti."
  - learner: "Va bene. E quanto costarà?"
    errors: [future-form]
  - tutor: "Scusi, con questo rumore non ho sentito bene: quanto...? Attenzione alla forma del futuro."
    prompt: {text: "costarà", tags: [future-form]}
  - learner: "Quanto costarà la riparazione? Non sento la differenza!"
    errors: [future-form]
  - tutor: "Si dice \"costerà\", con la e: il lavoro costerà circa 180 euro, pezzi compresi. Le preparo subito il preventivo."
    recast: {text: "costarà", fix: "costerà", tags: [future-form]}
    goals: [cost]
  - learner: "Costerà, con la e. Va bene per 180 euro. E quando sarà pronta la macchina?"
  - tutor: "Domani sera dopo le 6. La chiamo io quando ho finito."
    goals: [time]
    done: true

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  turns:
  - tutor: "Buonasera. Mi dica, c'è qualche problema?"
  - learner: "Buonasera. Sì, purtroppo. Nella mia camera l'aria condizionata non funziona e fa un caldo terribile."
  - tutor: "Mi dispiace molto. Da quando non funziona?"
    goals: [problem]
  - learner: "Da quando sono arrivata, alle 4. Ho chiamato due volte la reception, ma nessuno ha contestato."
    errors: [false-friend]
  - tutor: "Mi scuso davvero: nessuno ha risposto perché oggi c'era un solo collega. Adesso ci penso io."
    recast: {text: "ha contestato", fix: "ha risposto", tags: [false-friend]}
    goals: [since]
  - learner: "La ringrazio. Sono molto stanca: mi potrebbe cambiare la camera? Altrimenti vorrei parlare con il direttore."
  - tutor: "Non serve, la capisco benissimo. Ho una camera libera al terzo piano, più grande e più fresca. Le va bene?"
    goals: [request]
  - learner: "Sì, grazie. E gli asciugamani? Nella mia camera c'è solo uno."
    errors: [ci-ne]
  - tutor: "Gli asciugamani arrivano subito. Ma nella sua frase manca una parola piccola prima di \"solo uno\": quale?"
    prompt: {text: "c'è solo uno", tags: [ci-ne]}
  - learner: "Ci è solo uno?"
    errors: [ci-ne]
  - tutor: "Si dice \"ce n'è solo uno\". Nella camera nuova ne trova già quattro, puliti e grandi."
    recast: {text: "Ci è solo uno", fix: "ce n'è solo uno", tags: [ci-ne]}
  - learner: "Ce n'è solo uno... Perché si usa \"ne\"? Nella mia lingua non esiste."
  - tutor: "Perché \"ne\" sta al posto di \"di asciugamani\": ce n'è uno, cioè c'è un asciugamano. Ecco la chiave della camera 305."
    new: [{lemma: "asciugamano", gloss: "towel"}]
  - learner: "Adesso è chiaro. Accetto la camera 305, grazie, è stato molto gentile."
  - tutor: "Grazie a lei per la pazienza. Buona notte!"
    goals: [agree]
    done: true

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-traveller
  turns:
  - tutor: "Sì? Buonasera, posso aiutarla?"
  - learner: "Buonasera, scusi il disturbo. Sono Conor, abito al piano di sotto da un mese."
  - tutor: "Ah, piacere, io sono Paola. Mi dica pure."
    goals: [greet]
  - learner: "Ecco... la sera sento molto rumore da qui. La musica, e anche i footsteps. Non riesco a dormire."
    errors: [word-choice]
  - tutor: "Oh, mi dispiace! Sente la musica e i passi, quindi. A che ora, di solito?"
    recast: {text: "i footsteps", fix: "i passi", tags: [word-choice]}
  - learner: "Dopo mezzanotte, quasi ogni giorno. Can we speak English, please? È troppo difficile per me."
  - tutor: "Purtroppo l'inglese non lo parlo, ma lei si spiega bene! Userò parole semplici. Dopo mezzanotte è mio figlio che suona."
    goals: [problem]
  - learner: "Ok, provo. Io lavoro presto la mattina. Lei lo potrebbe chiedere di suonare prima delle 11?"
    errors: [object-pronoun]
  - tutor: "Ha ragione, certo. Solo una cosa: chiedo qualcosa a mio figlio, quindi \"lo\" qui non va bene. Quale pronome serve?"
    prompt: {text: "lo potrebbe chiedere", tags: [object-pronoun]}
    new: [{lemma: "pronome", gloss: "pronoun"}]
  - learner: "La potrebbe chiedere?"
    errors: [object-pronoun]
  - tutor: "Quasi: gli potrei chiedere, e infatti lo faccio stasera. Dopo le 11 userà le cuffie, promesso."
    recast: {text: "La potrebbe chiedere", fix: "gli potrei chiedere", tags: [object-pronoun]}
    new: [{lemma: "cuffia", gloss: "headphones"}]
    goals: [request]
  - learner: "Gli, ok! Grazie mille. E per i passi, forse un tappeto?"
  - tutor: "Buona idea, ne metto uno in corridoio. E se sente ancora rumore, mi scriva un messaggio."
    goals: [compromise]
  - learner: "Perfetto, è molto gentile. Buona serata, signora!"
  - tutor: "Buona serata a lei, e benvenuto nel palazzo!"
    done: true

- scenario: banca-conto
  level: B1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, come posso esserle utile?"
  - learner: "Buongiorno. Mi sono appena trasferita a Milano e avrei bisogno di aprire un conto."
  - tutor: "Benvenuta a Milano! Certo. È un conto personale o per un'attività?"
    goals: [purpose]
  - learner: "Personale. La mia compagnia mi paga lo stipendio a fine mese, quindi mi serve presto. Quali documenti devo portare?"
    errors: [false-friend]
  - tutor: "Capisco, se la sua azienda la paga a fine mese facciamo in fretta. Servono un documento e il codice fiscale."
    recast: {text: "compagnia", fix: "azienda", tags: [false-friend]}
    goals: [documents]
  - learner: "Li ho tutti e due. E quanto costa il conto? Se pago con la carta all'estero, c'è un costo in più?"
  - tutor: "Il conto costa 3 euro al mese. Fuori dall'Europa c'è un piccolo costo, in Europa no."
    goals: [costs]
  - learner: "Bene. Mi piacerebbe una carta anche, e io volerei usare l'app per fare i bonifici."
    errors: [conditional-form, word-order]
  - tutor: "La carta è compresa. Scusi, può ripetere l'ultima parte? Il verbo \"volere\" al condizionale ha un'altra forma."
    prompt: {text: "volerei", tags: [conditional-form]}
    new: [{lemma: "verbo", gloss: "verb"}, {lemma: "condizionale", gloss: "conditional"}]
  - learner: "Ah sì, scusi: vorrei usare l'app per fare i bonifici."
  - tutor: "Benissimo, con l'app può fare tutto dal telefono. La carta arriva a casa sua in 5 giorni."
    goals: [card]
  - learner: "Great. One question: why 'vorrei' and not 'volerei'? I always get that wrong."
  - tutor: "Perché \"volere\" è irregolare: al condizionale diventa vorrei, vorresti, vorrebbe. Succede anche con \"potere\" e \"dovere\". Adesso mi serve la sua firma."
    new: [{lemma: "irregolare", gloss: "irregular"}, {lemma: "condizionale", gloss: "conditional"}]
  - learner: "Grazie, adesso è chiaro. Dove devo firmare?"
  - tutor: "Qui sotto, per favore. Ecco fatto: il suo conto è aperto!"
    done: true

- scenario: restituire-prodotto
  level: B1
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno, mi dica pure."

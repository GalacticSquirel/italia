  - tutor: "Si dice \"più pazienti di me\". E di me di sicuro: io perdo la calma dopo cinque minuti! Ma se un giorno i tuoi studenti preferissero il programma, che faresti?"
    recast: {text: "pazienti come me", fix: "pazienti di me", tags: [comparative]}
  - learner: "Di me, certo. Se lo preferissero, cambierei il mio modo di insegnare: farei meno grammatica e più conversazione, più teatro. Quello una macchina non lo sa fare."
  - tutor: "Teatro in classe, bella idea. Hai già provato?"
    goals: [hypothesis]
  - learner: "Sì! A Valencia facevo teatro con gli adolescenti. E a proposito: sabato recito in uno spettacolo in italiano, qui in città. Sono nervosissima. Tu vai mai a teatro?"
  - tutor: "Poco, purtroppo, ma da ragazzo recitavo anch'io, sempre nella parte del cattivo! Che spettacolo è?"
  - learner: "Una commedia di Goldoni, faccio la serva furba. Il regista dice che il mio accento spagnolo è perfetto per il personaggio."
  - tutor: "Allora sabato vengo a vederti, promesso. Vedi, questo è un buon esempio: un attore vero sul palco non lo puoi sostituire."
    new: [{lemma: "palco", gloss: "stage"}]
    goals: [example]
  - learner: "Esatto! Tutto quello che si fa dal vivo, davanti a persone vere, resterà. Quindi la mia conclusione è: meno paura e più formazione, a scuola e in azienda."
  - tutor: "Mi hai quasi convinto: formazione sì, ma un po' di paura la tengo. Ci vediamo sabato a teatro!"
    goals: [conclude]
    done: true

- scenario: arte-mostra
  level: B2
  persona: en-m-traveller
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Wow, è enorme! Mi fa un'impressione forte, quasi di paura. È tutto buio e poi c'è quella luce sul viso della donna."
  - tutor: "Anche a me colpisce ogni volta. Cosa vedi esattamente nella scena?"
    goals: [react]
  - learner: "Vedo una donna che tiene una spada e un uomo per terra. C'è molto sangue. Onestamente lo trovo un po' morbido, ma non riesco a smettere di guardare."
    errors: [false-friend]
  - tutor: "Sì, è un soggetto macabro, ma il pittore voleva proprio questo effetto. E lo sfondo, come lo descriveresti?"
    recast: {text: "morbido", fix: "macabro", tags: [false-friend]}
    new: [{lemma: "macabro", gloss: "morbid, gruesome"}]
  - learner: "Lo sfondo è... ugh, I don't have the words for this. Art vocabulary is impossible in Italian."
  - tutor: "Non servono parole difficili, te la stai cavando benissimo. Lo sfondo è chiaro o scuro? Pieno o vuoto?"
  - learner: "Scuro e vuoto. Non c'è niente dietro, solo nero, così tutta l'attenzione va alle figure. Sembra una scena di teatro."
  - tutor: "Esatto, sembra un palco con una sola luce accesa. Secondo te, perché il pittore ha scelto un momento così violento?"
    new: [{lemma: "palco", gloss: "stage"}]
    goals: [describe]
  - learner: "Forse vuole mostrare che la donna è più forte dell'uomo: lei è calma, concentrata. Ho letto che il pittore si ha ispirato a una storia della Bibbia."
    errors: [auxiliary-choice]
  - tutor: "Sì, è proprio una storia della Bibbia. Però un verbo con \"si\" al passato non vuole \"avere\". Come diventa la tua frase?"
    prompt: {text: "si ha ispirato", tags: [auxiliary-choice]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Il pittore si è ispirato a una storia della Bibbia."
  - tutor: "Giusto. E sulla donna hai ragione: è lei la più forte nella scena, senza paura. Guarda ora il quadro accanto, che racconta la stessa storia: che differenze noti?"
    goals: [interpret]
  - learner: "Questo è molto più chiaro e più \"pulito\". La donna quasi non guarda, sembra che non voglia sporcarsi. Preferisco il primo, è più vero. By the way, tu dipingi? Parli come un artista."
  - tutor: "Magari! Disegno un po' la domenica, ma i miei quadri restano in cantina. Anch'io preferisco il primo: è meno elegante, ma più sincero."
    goals: [compare]
  - learner: "In cantina! Un giorno me li fai vedere. Andiamo alla prossima sala?"
  - tutor: "Volentieri, c'è una sala intera di ritratti che ti piacerà. E i miei quadri te li mostro solo dopo un caffè!"
    done: true

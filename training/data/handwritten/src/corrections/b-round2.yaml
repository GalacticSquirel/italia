  - learner: "La constatazione è stato firmata?"
    errors: [passive]
  - tutor: "Quasi: la constatazione è stata firmata da tutti e due, benissimo. Ricorda anche la targa del furgone?"
    recast: {text: "è stato firmata", fix: "è stata firmata", tags: [passive]}
  - learner: "È stata firmata, grazie. La targa è scritta nel modulo. Una domanda: lei conosce un buon meccanico qui a Bologna? Il mio ha chiuso."

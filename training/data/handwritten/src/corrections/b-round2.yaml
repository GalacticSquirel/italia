- scenario: trattativa-affitto
  level: B2
  persona: en-m-traveller
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto, soprattutto il balcone. Però il canone mi sembra un po' alto per la zona: 1.100 euro è tanto."
  - tutor: "La capisco, ma la zona è molto richiesta e l'appartamento ha cucina e bagno nuovi. Che cifra aveva in mente?"
    goals: [interest]
  - learner: "Pensavo a 950. Ho visto un altro appartamento simile per meno soldi, e sinceramente... sorry, this is getting too technical for my Italian."
  - tutor: "Nessun problema, andiamo con calma e uso parole più semplici. Il proprietario può scendere un po', ma 950 è troppo poco. Lei quanto può pagare al massimo?"
  - learner: "Honestly, a thousand is my limit. And I'd need the washing machine fixed before I move in."
  - tutor: "Quindi 1.000 euro al mese e la lavatrice riparata prima del suo arrivo: mi sembra una proposta seria. Chiamo il proprietario oggi pomeriggio."
    goals: [negotiate]
  - learner: "Great, thanks. What about the contract, how long is it? I might have to go back to Dublin next year."
  - tutor: "Il contratto dura 4 anni, ma lei può andare via prima. Deve solo mandare la disdetta, cioè una lettera, 6 mesi prima."
  - learner: "Ok, torno all'italiano, ci provo! Sei mesi sono troppi per me. È possibile che la disdetta è di tre mesi?"
    errors: [subjunctive-use]
  - tutor: "Ha fatto bene a riprovare! Una cosa sola: dopo \"è possibile che\" il secondo verbo deve cambiare. In che modo?"
    prompt: {text: "che la disdetta è", tags: [subjunctive-use]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "È possibile che la disdetta sia di tre mesi?"
  - tutor: "Perfetto. Sì, possiamo aggiungere una clausola con 3 mesi di preavviso, se lei lascia due mensilità di garanzia."
    new: [{lemma: "preavviso", gloss: "notice"}, {lemma: "mensilità", gloss: "month's rent"}]
    goals: [conditions]
  - learner: "Due mensilità vanno bene. E la provvigione dell'agenzia quant'è?"
  - tutor: "È una mensilità, come sempre. Se il proprietario accetta 1.000 euro, firmiamo venerdì?"
  - learner: "D'accordo: se lui accetta, venerdì firmo. Grazie per la pazienza con il mio italiano!"
  - tutor: "Ma si figuri, se l'è cavata benissimo. La chiamo domani con la risposta."
    goals: [conclude]
    done: true

- scenario: assicurazione-sinistro
  level: B2

- scenario: presentarsi
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao! Sono Liam. Sono da Dublino, in Irlanda."
    errors: [preposition]
  - tutor: "Piacere, Liam! Da Dublino? Qui serve un'altra parola."
    prompt: {text: "da Dublino", tags: [preposition]}
  - learner: "Um... sono a Dublino? No... sono in Dublino?"
    errors: [preposition]
  - tutor: "Sei di Dublino, che bello! E adesso dove vivi?"
    recast: {text: "in Dublino", fix: "di Dublino", tags: [preposition]}
    goals: [say-name, say-origin]

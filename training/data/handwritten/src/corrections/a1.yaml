  - learner: "Sì, mi piace. Ma voglio imparo bene l'italiano."
    errors: [modal-infinitive]
  - tutor: "Voglio imparo? Dopo voglio, il verbo non cambia."
    prompt: {text: "voglio imparo", tags: [modal-infinitive]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Okay... Voglio imparare bene l'italiano!"
  - tutor: "Ecco, bravo! E parli già bene."
  - learner: "Grazie! E tu, Giulia, di dove sei?"

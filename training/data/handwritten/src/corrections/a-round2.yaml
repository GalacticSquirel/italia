- scenario: weekend-scorso
  level: A2
  persona: en-m-traveller
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Ciao! Benissimo. Sabato sono andato a Napoli in treno."
  - tutor: "Napoli, che bella città! Era la prima volta?"
    goals: [where]
  - learner: "Sì, la prima. Ho mangiato tre pizze in due giorni e ho preso tante foto."
    errors: [word-choice]
  - tutor: "Tre pizze, bravo! E hai fatto tante foto: dopo le voglio vedere. Eri da solo?"
    recast: {text: "ho preso tante foto", fix: "hai fatto tante foto", tags: [word-choice]}
    goals: [what]
  - learner: "No, ero con Liam, un amico irlandese. Mentre abbiamo camminato in centro, lui ha perso il telefono!"
    errors: [tense-aspect]
  - tutor: "Oh no, povero amico! Ma con mentre l'azione è lunga. Quale passato serve?"
    prompt: {text: "abbiamo camminato", tags: [tense-aspect]}
  - learner: "Mentre... siamo camminati in centro?"
    errors: [tense-aspect]
  - tutor: "Ah, mentre camminavate in centro! E poi l'ha trovato?"
    recast: {text: "siamo camminati", fix: "camminavate", tags: [tense-aspect]}
    goals: [with-who]
  - learner: "Camminavamo, ok. No, mai più! But why not 'abbiamo camminato'? It's the past too."
  - tutor: "Sì, ma era un'azione lunga, non finita: camminavamo. Poi succede una cosa di un momento: ha perso il telefono."
  - learner: "Ah, adesso capisco. E a te piace Napoli? Ci sei mai stata?"
  - tutor: "Tante volte! Mia zia abita lì e cucina benissimo. E a te è piaciuta la città?"
  - learner: "Tantissimo! La gente è simpatica e il mare è bello. Ma il traffico è terribile."
  - tutor: "Eh sì, lì guidano in un modo speciale! Pensi di tornare?"
    goals: [opinion]
  - learner: "Sì, forse a maggio, con mia sorella."
  - tutor: "Bella idea, a maggio fa già caldo. Allora portala a mangiare la pizza!"
    done: true

- scenario: vacanze-passate
  level: A2
  persona: es-f-erasmus
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Ciao! Sono tornata a Siviglia e poi siamo andati una settimana in Portogallo."
  - tutor: "Che bello! Con chi sei andata in Portogallo?"
    goals: [where]
  - learner: "Con i miei genitori e mio fratello. Abbiamo affittato una casa vicino alla spiaggia."
  - tutor: "Una casa vicino alla spiaggia, che sogno! Faceva caldo?"
  - learner: "Sì, ma c'era molto vento e l'acqua era freddissima. Mi ho bagnato solo due volte!"
    errors: [word-choice, auxiliary-choice]
  - tutor: "Hai fatto il bagno solo due volte? Mi dispiace! E oltre al mare, cosa avete fatto?"
    recast: {text: "Mi ho bagnato", fix: "Hai fatto il bagno", tags: [word-choice]}
    goals: [weather]
  - learner: "Abbiamo visitato Lisbona e mi ha piaciuto moltissimo."
    errors: [auxiliary-choice]
  - tutor: "Lisbona è bellissima, lo so! Ma attenzione: al passato piacere non vuole avere."
    prompt: {text: "mi ha piaciuto", tags: [auxiliary-choice]}
  - learner: "Ah, sì... mi è piaciuta moltissimo!"
  - tutor: "Proprio così! Anche a me è piaciuta tanto. Cosa avete visto lì?"
  - learner: "Il castello e il quartiere vecchio. Abbiamo camminato tanto e mangiato pesce ogni sera. E tu, sei rimasta in Italia?"
  - tutor: "Sì, sono andata in montagna con mio marito. Niente mare, ma tanto silenzio!"
    goals: [activities]
  - learner: "In montagna! Io non ho mai visto le Alpi. Si può andare da Bologna in treno?"
  - tutor: "Certo, in tre ore sei a Bolzano. Ma senti: qual è stato il momento più bello della vacanza?"
  - learner: "L'ultima sera. Abbiamo cenato sulla spiaggia e mio padre ha cantato per tutti!"
  - tutor: "Che bel ricordo! E tuo padre canta bene?"
    goals: [best]
  - learner: "No, malissimo! Ma era molto divertente."
  - tutor: "Allora è stata la serata perfetta!"
    done: true

- scenario: ricordi-infanzia
  level: A2
  persona: en-f-professional
  history: [article-form]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccola?"
  - learner: "Abitavo vicino a Sydney. La nostra casa era a cinque minuti dal mare."
  - tutor: "Così vicino, che bello! E cosa facevate tu e i tuoi fratelli?"
    goals: [place]
  - learner: "Io e mia sorella eramo sempre in spiaggia."
    errors: [imperfetto-form]
  - tutor: "Sempre in spiaggia, che bella vita! Ma guarda bene il verbo: noi...?"
    prompt: {text: "eramo", tags: [imperfetto-form]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Noi... eravano sempre in spiaggia?"
    errors: [imperfetto-form]
  - tutor: "Quasi! Eravate sempre in spiaggia, ho capito. E facevate il bagno ogni giorno?"
    recast: {text: "eravano", fix: "Eravate", tags: [imperfetto-form]}
  - learner: "Eravamo, right. Sì, ogni giorno, anche d'inverno. Tu sai nuotare?"
  - tutor: "Sì, ma male: io sono cresciuta in montagna! E la scuola com'era?"
    goals: [habits]
  - learner: "Mi piaceva. Ero molto brava in matematica. Attualmente lavoro nel marketing, che strano!"
    errors: [false-friend]
  - tutor: "Adesso lavori nel marketing? Allora la matematica serve ancora! Hai un ricordo speciale di quegli anni?"
    recast: {text: "Attualmente", fix: "Adesso", tags: [false-friend]}
    goals: [school]
  - learner: "Sì! Una volta ho visto un squalo vicino alla spiaggia e ho corso a casa."
    errors: [article-form, auxiliary-choice]
  - tutor: "Che paura! Ma attenzione alla piccola parola prima di squalo."
    prompt: {text: "un squalo", tags: [article-form]}
  - learner: "Uno squalo! Ho visto uno squalo."
  - tutor: "Esatto! E sei corsa a casa, ti capisco. Sei tornata in acqua dopo?"
    goals: [event]
  - learner: "Sì, il giorno dopo. Mio padre mi ha detto: lo squalo ha più paura di te!"
  - tutor: "Tuo padre aveva ragione! Che bei ricordi, grazie."
    done: true

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Lunga! Mi alzo alle dieci perché lavoro di notte."
  - tutor: "Alle 10, che fortuna! E la mattina cosa fai?"
    goals: [wake]
  - learner: "Faccio la spesa per il ristorante. Compro le verdure al mercato e le porto in cucina."
  - tutor: "Ah, le scegli tu! E a che ora cominci a lavorare?"
  - learner: "Alle quattro. Adesso è estate e ogni sera sono cucinando per cento persone!"
    errors: [stare-gerund]
  - tutor: "Cento persone, bravo! Ma con cucinando serve un altro verbo, non essere."
    prompt: {text: "sono cucinando", tags: [stare-gerund]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Ah, sì! Sto cucinando per cento persone."
  - tutor: "Ecco! E dopo il lavoro cosa fai?"
    goals: [work]
  - learner: "Torno a casa in bici, a mezzanotte. Sono morto e mi dormo subito."
    errors: [reflexive]
  - tutor: "Ti capisco! Ma dormire non vuole mi. Qui serve un verbo un po' diverso."
    prompt: {text: "mi dormo", tags: [reflexive]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Mi... dormento subito?"
    errors: [reflexive]
  - tutor: "Ah, ti addormenti subito! Dopo tante ore è normale."
    recast: {text: "Mi... dormento", fix: "ti addormenti", tags: [reflexive]}
    new: [{lemma: "addormentarsi", gloss: "to fall asleep"}]
    goals: [evening]
  - learner: "Mi addormento, ok. E tu? Lavori molto?"
  - tutor: "Abbastanza: insegno la mattina e il pomeriggio preparo le lezioni. La sera sono libera."
    goals: [ask]
  - learner: "Allora vieni al ristorante una sera! Ti faccio le tagliatelle."
  - tutor: "Che bella idea, le amo! Va bene venerdì?"
  - learner: "Venerdì, perfetto. Ti aspetto."
  - tutor: "Grazie! A venerdì, e buon lavoro stasera."
    done: true

- scenario: abbigliamento
  level: A2
  persona: en-f-student
  turns:
  - tutor: "Buongiorno! Posso aiutarla?"
  - learner: "Buongiorno. Cerco un vestito per un matrimonio. La mia amica si sposa a giugno."
  - tutor: "Che bello! Ha già un'idea del colore?"
    goals: [ask-item]
  - learner: "Sì, mi piace il blu. Ho visto quello vestito lì fuori, è bellissimo."
    errors: [demonstrative]
  - tutor: "È vero, è molto bello! Ma davanti alla parola vestito, quello diventa più corto."
    prompt: {text: "quello vestito", tags: [demonstrative]}
  - learner: "Ah... quel vestito!"
  - tutor: "Esatto! Che taglia porta?"
  - learner: "Una 40. Posso provarlo?"
  - tutor: "Certo, il camerino è lì in fondo. Lo porto subito."
    goals: [size-colour, try]
  - learner: "È un po' grande. Avete una taglia più piccolo? Devo decidere oggi, sabato parto a Londra."
    errors: [adjective-agreement, preposition]
  - tutor: "Certo! Ma attenzione: taglia finisce in a, quindi più...?"
    prompt: {text: "più piccolo", tags: [adjective-agreement]}
  - learner: "Più piccola! Una taglia più piccola."
  - tutor: "Ecco la 38. Allora sabato parte per Londra: il matrimonio è lì?"
  - learner: "Sì, in un castle vicino a Londra. Sono un po' nervosa, devo leggere una poesia!"
    errors: [word-choice]
  - tutor: "In un castello, che bello! Non si preoccupi, andrà benissimo. Come va la 38?"
    recast: {text: "castle", fix: "castello", tags: [word-choice]}
    new: [{lemma: "castello", gloss: "castle"}]
  - learner: "Perfetta! Quanto costa?"
  - tutor: "Sono 80 euro, ma oggi c'è uno sconto: 65."
  - learner: "Allora lo prendo. Grazie mille!"
  - tutor: "Grazie a Lei! Buon viaggio e tante belle cose alla sua amica!"
    goals: [decide]
    done: true

- scenario: ristorante-ordinare
  level: A2
  persona: en-m-heritage
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Buongiorno! Siamo in tre, ma mia cugina arriva più tardi."
  - tutor: "Va bene. Preferite dentro o fuori?"
  - learner: "Fuori, grazie. Sa, mio nonno è nato in questo paese! Si chiamava Rossi."
  - tutor: "Davvero? Qui ci sono tanti Rossi! Allora benvenuto a casa. Ecco il menù."
    goals: [ask-table]
  - learner: "Grazie. Come primo prendo le tagliatelle al ragù. Mia nonna li faceva ogni domenica."
    errors: [object-pronoun]
  - tutor: "Ottima scelta! Ma guardi quel li: tagliatelle è una parola femminile."
    prompt: {text: "li faceva", tags: [object-pronoun]}
    new: [{lemma: "femminile", gloss: "feminine"}]
  - learner: "Mia nonna... la faceva ogni domenica?"
    errors: [object-pronoun]
  - tutor: "Sua nonna le faceva ogni domenica? Che fortuna! E per gli altri?"
    recast: {text: "la faceva", fix: "le faceva", tags: [object-pronoun]}
  - learner: "Le faceva, giusto. Per loro due pizze. Senta, Lei conosce la vera ricetta del ragù?"
  - tutor: "Certo: carne, pomodoro e tre ore sul fuoco! E da bere cosa prendete?"
    goals: [order-food]
  - learner: "Mezzo litro di vino rosso e una bottiglia d'acqua."
  - tutor: "Benissimo, arrivo subito con il vino."
    goals: [order-drink]
  - learner: "Era tutto buonissimo, come a casa di mia nonna. Possiamo avere il conto?"
  - tutor: "Che belle parole, grazie! Ecco il conto: sono 54 euro."
    goals: [ask-bill]
  - learner: "Ecco a Lei. Torniamo presto!"
  - tutor: "Grazie a voi, vi aspettiamo!"
    done: true

- scenario: tempo-libero
  level: A2
  persona: en-m-retired
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Da quando non lavoro più ho molto tempo. Mi piace pescare e riparare vecchie radio."
  - tutor: "Vecchie radio, che bello! Quante radio hai?"
    goals: [hobby]
  - learner: "Circa trenta. La più vecchia è del 1935 e funziona ancora. Ma preferisco pescare."
  - tutor: "Incredibile! E a pescare vai spesso?"
  - learner: "Ogni sabato, con il mio vicino. Sabato scorso pescavo un pesce enorme!"
    errors: [tense-aspect]
  - tutor: "Enorme, che bravo! Ma è successo una volta sola, sabato. Quale passato serve?"
    prompt: {text: "pescavo", tags: [tense-aspect]}
  - learner: "Ah, certo. Sabato scorso ho pescato un pesce enorme."
  - tutor: "Proprio così! E poi l'avete mangiato?"
    goals: [frequency]
  - learner: "Sì, mia moglie l'ha cucinato con il limone. E tu, cosa fai nel tempo libero?"
  - tutor: "Io sono in un coro, il giovedì sera. Non sono brava, ma mi diverto!"
    goals: [ask]
    new: [{lemma: "coro", gloss: "choir"}]
  - learner: "Un coro! Io cantavo in chiesa da giovane. Why do you say 'mi diverto' and not just 'diverto'?"
  - tutor: "Perché divertirsi è un verbo con si: io mi diverto, tu ti diverti. È come svegliarsi!"
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Ah, come 'mi sveglio'. Sometimes I think I'm too old to learn all this."
  - tutor: "Ma no, impari in fretta! E poi adesso hai tempo, no? Senti, sabato vieni a sentire il coro?"
    new: [{lemma: "coro", gloss: "choir"}]
  - learner: "Con piacere! Dove cantate?"
  - tutor: "Nella chiesa di San Marco, alle 18. Dopo c'è anche un bicchiere di vino!"
    new: [{lemma: "bicchiere", gloss: "glass"}]
  - learner: "Allora vengo di sicuro. Grazie!"
  - tutor: "Perfetto, ti aspetto sabato!"
    goals: [propose]
    done: true

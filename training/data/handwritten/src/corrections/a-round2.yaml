# Round 2 (A1 + A2): failed repairs with recast, two errors in one turn, repeated off-topic turns,
# longer free conversation, and scenarios round 1 barely used.
- scenario: supermercato
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno, cerca qualcosa?"
  - learner: "Buongiorno. Sì, cerco il zucchero."
    errors: [article-form]
  - tutor: "Certo! Ma attenzione alla parola prima di zucchero."
    prompt: {text: "il zucchero", tags: [article-form]}
  - learner: "Ehm... un zucchero?"
    errors: [article-form]
  - tutor: "Lo zucchero è qui, vicino al caffè."
    recast: {text: "un zucchero", fix: "Lo zucchero", tags: [article-form]}
    goals: [ask-product]
  - learner: "Lo zucchero, ok. Grazie! E avete eggs?"
    errors: [word-choice]
  - tutor: "Sì, abbiamo le uova. Sono in fondo, dopo il latte."
    recast: {text: "eggs", fix: "le uova", tags: [word-choice]}
    goals: [ask-other]
  - learner: "Perfetto. Lei è di Napoli? Io amo Napoli!"
  - tutor: "No, sono di Bari! Ma Napoli è bellissima. Cerca altro?"
  - learner: "No, grazie. Dov'è la cassa?"
  - tutor: "La cassa è lì, a sinistra."
  - learner: "Grazie mille, arrivederci!"
  - tutor: "Prego, buona giornata!"
    goals: [thank]
    done: true

- scenario: taxi
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno! Dove la porto?"
  - learner: "Buongiorno. Vado a l'albergo Roma, per favore. Sono due valigie."
    errors: [essere-avere, articulated-preposition]
  - tutor: "Sono due valigie? Lei è una valigia?"
    prompt: {text: "Sono due valigie", tags: [essere-avere]}
  - learner: "Ah, no! Ho due valigie."
  - tutor: "Ecco! Le metto dietro. Andiamo all'albergo Roma."
    goals: [destination]
  - learner: "Grazie. L'albergo è lontano?"
  - tutor: "No, è vicino. Sono 10 minuti."
    goals: [ask-time]
  - learner: "Bene. Fa molto caldo oggi! A Lei piace questa città?"
  - tutor: "Sì, molto! Oggi però fa troppo caldo."
  - learner: "Capisco. E quanto costa per l'albergo?"
  - tutor: "Sono 15 euro. Contanti o carta?"
    goals: [ask-price]
  - learner: "Posso pagare con card?"
    errors: [word-choice]
  - tutor: "Sì, certo, può pagare con la carta. Siamo arrivati!"
    recast: {text: "card", fix: "carta", tags: [word-choice]}
  - learner: "Ecco la carta. Grazie e arrivederci!"
  - tutor: "Grazie a Lei! Ecco le valigie. Buona giornata!"
    goals: [pay]
    done: true

- scenario: chiedere-strada
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Sì, scusi! Dov'è la stazione?"
  - tutor: "È vicina. Lei va dritto fino al semaforo."
    goals: [get-attention, ask-place]
  - learner: "Sorry, I don't understand. Semaforo?"
  - tutor: "Il semaforo è la luce rossa e verde. Lì gira a destra."
  - learner: "Ah, ok! Dritto, poi a destra. È lontano?"
  - tutor: "No, sono 5 minuti a piedi."
    goals: [understand]
  - learner: "Bene! Lei abita qui? Mi piace molto questa città."
  - tutor: "Sì, abito qui dietro. È piccola ma bella, vero?"
  - learner: "Sì! E c'è un ristorante buono qui vicino?"
  - tutor: "In piazza c'è una buona pizza. Ma Lei non prende il treno?"
  - learner: "Sì, sì! Il mio treno parte a le tre."
    errors: [articulated-preposition]
  - tutor: "A le tre? Sono due parole o una sola?"
    prompt: {text: "a le tre", tags: [articulated-preposition]}
  - learner: "Una! Parte alle tre. Grazie mille, arrivederci!"
  - tutor: "Giusto! Allora ha tempo. Buon viaggio!"
    goals: [thank]
    done: true

- scenario: ristorante-ordinare
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Buongiorno. Siamo dos."
    errors: [word-choice]
  - tutor: "Siete in due? Ecco un tavolo vicino alla finestra."
    recast: {text: "dos", fix: "due", tags: [word-choice]}
    goals: [ask-table]
  - learner: "Grazie. Per me la pasta al pomodoro. E per mio amico il pesce."
    errors: [possessive]
  - tutor: "Per mio amico? Qui manca una piccola parola."
    prompt: {text: "per mio amico", tags: [possessive]}
  - learner: "Per... mi amico?"
    errors: [possessive]
  - tutor: "Va bene: il pesce per il suo amico. E da bere?"
    recast: {text: "mi amico", fix: "il suo amico", tags: [possessive]}
    goals: [order-food]
  - learner: "Una bottiglia di acqua e un bicchiere di vino rosso."
  - tutor: "Benissimo, li porto subito."
    goals: [order-drink]
  - learner: "Una domanda: perché 'il suo amico' ma 'mio padre'?"
  - tutor: "Con la famiglia non c'è l'articolo: mio padre. Con amico sì!"
    new: [{lemma: "articolo", gloss: "article"}]
  - learner: "Ah, capisco. Il mio amico! Il conto, per favore."
  - tutor: "Subito! Sono 30 euro in tutto."
    goals: [ask-bill]
  - learner: "Ecco. Grazie, tutto molto buono!"
  - tutor: "Grazie a voi! Buona giornata!"
    done: true

- scenario: orari-negozio
  level: A1
  persona: es-f-teacher
  turns:
  - tutor: "Pronto, negozio Bianchi, buongiorno!"
  - learner: "Buongiorno. A che ora chiude il negozio oggi?"
  - tutor: "Buongiorno! Oggi chiudiamo alle 19."
    goals: [greet, ask-hours]
  - learner: "Bene. E il negozio è abierto la domenica?"
    errors: [word-choice]
  - tutor: "No, la domenica non è aperto. Apriamo dal lunedì al sabato."
    recast: {text: "abierto", fix: "aperto", tags: [word-choice]}
    new: [{lemma: "aperto", gloss: "open"}]
    goals: [ask-day]
  - learner: "Capisco. Io lavoro in una scuola e la mattina non posso. Tu sei aperto il pomeriggio?"
    errors: [register]
  - tutor: "Tu? Signora, con un negozio serve un'altra parola."
    prompt: {text: "Tu sei aperto", tags: [register]}
  - learner: "Ah, mi scusi! Siete aperti il pomeriggio?"
  - tutor: "Sì, il pomeriggio apriamo alle 15."
  - learner: "Perfetto. Allora vengo lunedì dopo la scuola. Grazie e arrivederci!"
  - tutor: "Grazie a Lei, a lunedì! Arrivederci!"
    goals: [goodbye]
    done: true

- scenario: abbigliamento
  level: A1
  persona: en-m-heritage
  turns:
  - tutor: "Buongiorno! Posso aiutarla?"
  - learner: "Buongiorno. Sì, cerco una maglietta per una festa."
  - tutor: "Certo! Che taglia porta?"
    goals: [ask-item]
  - learner: "La taglia media. Avete una maglietta rosso?"
    errors: [adjective-agreement]
  - tutor: "Sì! Ma il colore non finisce in o."
    prompt: {text: "maglietta rosso", tags: [adjective-agreement]}
  - learner: "Una maglietta rossi, taglia media?"
    errors: [adjective-agreement]
  - tutor: "Ecco una maglietta rossa, taglia media."
    recast: {text: "maglietta rossi", fix: "maglietta rossa", tags: [adjective-agreement]}
    goals: [size-colour]
  - learner: "Rossa, giusto. La festa è per mia nonna. She turns ninety on Sunday!"
  - tutor: "90 anni, che bello! È una grande festa."
  - learner: "Grazie! Lei è di Bari e parla sempre italiano con me. How do you say 'try on'?"
  - tutor: "Si dice provare. Vuole provare la maglietta?"
  - learner: "Sì, grazie. Dov'è il camerino?"
  - tutor: "Il camerino è lì, a destra."
    goals: [try]
  - learner: "È perfetta! Quanto viene?"
  - tutor: "Sono 20 euro. Oggi però c'è lo sconto: 15."
  - learner: "Bene, la prendo!"
  - tutor: "Benissimo, grazie! Buona festa e arrivederci!"
    goals: [decide]
    done: true

- scenario: tempo-libero
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Di solito gioco a football con amici. E poi andiamo al bar!"
    errors: [word-choice]
  - tutor: "Ah, giochi a calcio! Giochi ogni settimana?"
    recast: {text: "a football", fix: "a calcio", tags: [word-choice]}
    new: [{lemma: "calcio", gloss: "football"}]
    goals: [hobby]
  - learner: "Sì, ogni sabato. Ma tu di dove sei? Sei di Roma?"
  - tutor: "No, sono di Torino. Ma parliamo di te: sei bravo?"
    goals: [frequency]
  - learner: "No! Io gioco no bene."
    errors: [negation]
  - tutor: "Scusa, come? Gioco no bene?"
    prompt: {text: "gioco no bene", tags: [negation]}
  - learner: "Ehm... io no gioco bene?"
    errors: [negation]
  - tutor: "Ah, non giochi bene! Neanche io."
    recast: {text: "no gioco bene", fix: "non giochi bene", tags: [negation]}
  - learner: "Non gioco bene, ok. Italian is so hard, sorry!"
  - tutor: "Ma no, parli già bene! All'inizio è normale."
  - learner: "Grazie! E tu cosa fai il sabato?"
  - tutor: "Io vado spesso al mare. E leggo molto."
    goals: [ask]
  - learner: "Il mare! In Irlanda il mare è molto freddo. Quanto costa una casa a Torino?"
  - tutor: "Eh, troppo! Senti, sabato c'è un concerto in piazza."
    new: [{lemma: "concerto", gloss: "concert"}]
  - learner: "Davvero? Andiamo insieme?"
  - tutor: "Sì, certo! Ci vediamo sabato alle 8."
    goals: [propose]
    done: true

- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  history: [subject-verb-agreement]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao! Mi sveglio alle sette e faccio colazione a casa."
  - tutor: "Presto! E cosa mangi a colazione?"
    goals: [wake]
  - learner: "Pane e tè. Poi io va a università in autobus."
    errors: [subject-verb-agreement, preposition]
  - tutor: "Io va? Attenzione al verbo: io...?"
    prompt: {text: "io va", tags: [subject-verb-agreement]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Ah! Io vado."
  - tutor: "Giusto! Vai all'università in autobus. Fino a che ora resti lì?"
    goals: [work]
  - learner: "Fino alle cinque. Poi torno a casa e cucino con... how do you say 'flatmates'?"
  - tutor: "Si dice coinquiline. Cosa cucinate la sera?"
    new: [{lemma: "coinquilina", gloss: "flatmate"}]
  - learner: "Pasta, sempre pasta! Non mi piace cucinare, ma mi piace mangiare."
  - tutor: "Anche a me piace mangiare! E dopo cena cosa fate?"
  - learner: "Guardiamo un film e a mezzanotte vado a dormire."
  - tutor: "A mezzanotte, tardi! Io dormo alle 10."
    goals: [evening]
  - learner: "Alle dieci? E tu a che ora ti svegli?"
  - tutor: "Alle 6! Lavoro presto la mattina."
    goals: [ask]
  - learner: "Alle sei! No, no, troppo presto per me."
  - tutor: "Hai ragione, è presto! Buona giornata, ciao!"
    done: true

- scenario: casa-mia
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "La mia casa è in Ohio. È grande e ha un giardino."
  - tutor: "Bella! E com'è il giardino?"
    goals: [type]
  - learner: "È molto verde. Nel giardino sono tre alberi."
    errors: [ce-ci-sono]
  - tutor: "Sono tre alberi? Manca una piccola parola prima."
    prompt: {text: "sono tre alberi", tags: [ce-ci-sono]}
  - learner: "Nel giardino... là sono tre alberi?"
    errors: [ce-ci-sono]
  - tutor: "Ah, ci sono tre alberi, che bello! E dentro, quante camere?"
    recast: {text: "là sono tre alberi", fix: "ci sono tre alberi", tags: [ce-ci-sono]}
  - learner: "Ci sono tre camere, due bagni e una cucina piccola."
  - tutor: "Una bella casa grande! Qual è la tua stanza preferita?"
    goals: [rooms]
  - learner: "Il garage! I'm an engineer, you know. I build things there."
  - tutor: "Ah, lavori nel garage! Che cosa fai lì?"
    goals: [favourite]
  - learner: "Faccio tavoli e sedie. Adesso faccio un tavolo per mia figlia."
  - tutor: "Che bravo! Tua figlia abita con voi?"
  - learner: "No, lei abita a Chicago. E tu? Com'è la tua casa?"
  - tutor: "Io ho un appartamento piccolo. Ma c'è un bel balcone!"
    goals: [ask]
  - learner: "Un balcone, che bello. Hai molti fiori?"
  - tutor: "Sì, tanti fiori rossi! Li amo molto."
    done: true

- scenario: numero-telefono
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, molto! Ma io faccio troppi errori. Sorry for all my mistakes."
  - tutor: "Ma no, parli bene! Anch'io faccio errori in inglese."
  - learner: "Grazie! Senti, vuoi prendere un caffè con me? Così parliamo italiano."
  - tutor: "Sì, che bella idea! Quando sei libera?"
    goals: [propose]
  - learner: "Sabato sono libera. La domenica no: vado alla libreria per studiare, tutto il giorno."
    errors: [false-friend]
  - tutor: "Ah, vai in biblioteca! Allora sabato. A che ora?"
    recast: {text: "alla libreria", fix: "in biblioteca", tags: [false-friend]}
    new: [{lemma: "biblioteca", gloss: "library"}]
  - learner: "Biblioteca, giusto! Sabato alle dieci va bene?"
  - tutor: "Sì, alle 10 è perfetto. Qual è il tuo numero?"
    goals: [when]
  - learner: "Il mio numero è 347 555 0182. E il tuo?"
  - tutor: "Il mio è 333 555 0147. Ti mando un messaggio."
    goals: [number]
  - learner: "Ecco il messaggio! A sabato allora."
  - tutor: "A sabato! Ciao, buona giornata!"
    done: true

- scenario: lavanderia
  level: A2
  persona: en-f-student
  turns:
  - tutor: "Tutto bene? Hai bisogno di una mano?"
  - learner: "Ciao! Sì, grazie. Ho messo le monete nella lavatrice, ma non ha partito."
    errors: [auxiliary-choice]
  - tutor: "Che strano! Ma attenzione: partire non vuole avere. La lavatrice...?"
    prompt: {text: "non ha partito", tags: [auxiliary-choice]}
  - learner: "La lavatrice non ha partita?"
    errors: [auxiliary-choice]
  - tutor: "Ah, non è partita! Succede spesso. Hai scelto il programma?"
    recast: {text: "non ha partita", fix: "non è partita", tags: [auxiliary-choice]}
    goals: [problem]
  - learner: "Il programma? No... how does it work?"
  - tutor: "È facile. Scegli un numero, per esempio il 3. Poi spingi il bottone verde."
    new: [{lemma: "bottone", gloss: "button"}]
  - learner: "Ah, ecco, adesso funziona! Tu vieni spesso qui? Sei uno studente anche tu?"
  - tutor: "Sì, studio qui vicino e vengo ogni domenica. A casa non ho la lavatrice!"
    goals: [ask-how]
  - learner: "Neanch'io! La mia casa è piccolissima. Senti, c'è un bar qui vicino? Ho fame."
  - tutor: "Sì, proprio di fronte, e si mangia bene. Ma prima: hai il detersivo?"
  - learner: "Oh no, l'ho dimenticato! Posso comprarlo qui? E quanto costa l'asciugatrice?"
  - tutor: "Il detersivo è in quella macchina, un euro. Per l'asciugatrice servono due gettoni."
    goals: [payment]
  - learner: "E dove compro i gettoni?"
  - tutor: "Alla macchina vicino alla porta. Prende monete e carta."
  - learner: "Perfetto. Grazie mille, sei stato molto gentile!"
  - tutor: "Di niente! Se vuoi, dopo andiamo insieme a quel bar."
    goals: [thank]
    done: true

- scenario: palestra
  level: A2
  persona: en-m-heritage
  history: [past-participle-form]
  turns:
  - tutor: "Ciao! Vuoi informazioni sull'abbonamento?"
  - learner: "Ciao! Sì. Quanto costa l'abbonamento per un mese?"
  - tutor: "Sono 40 euro al mese. Se prendi tre mesi, sono 100."
    goals: [ask-membership]
  - learner: "Non male. Mio cugino ha venuto qui l'anno scorso e ha dicuto che è una bella palestra."
    errors: [past-participle-form, auxiliary-choice]
  - tutor: "Tuo cugino ha ragione! Ma dire al passato è un po' strano. Lui ha...?"
    prompt: {text: "ha dicuto", tags: [past-participle-form]}
  - learner: "Lui ha... detto! Ha detto che è una bella palestra."
  - tutor: "Esatto! E lui è venuto qui spesso? Abbiamo anche molti corsi."
  - learner: "Sì, ogni giorno. C'è un corso di yoga? La mia ragazza vuole fare yoga, io preferisco i pesi."
  - tutor: "Sì, c'è yoga il martedì e il giovedì sera. La sala pesi è sempre libera."
    goals: [classes]
  - learner: "A che ora comincia yoga? Lei lavora fino alle sei."
  - tutor: "Comincia alle 19, quindi va bene per lei. Noi apriamo alle 7 e chiudiamo alle 22."
    goals: [timetable]
  - learner: "Perfetto. Una domanda: si dice 'vado in palestra' o 'vado alla palestra'?"
  - tutor: "Di solito diciamo in palestra: vado in palestra. Allora, facciamo l'iscrizione oggi?"
  - learner: "Sì, per tre mesi. Devo portare qualcosa?"
  - tutor: "Solo un documento, per favore. Lo spogliatoio è in fondo a destra."
  - learner: "Ecco il documento. Grazie!"
  - tutor: "Grazie a te e benvenuto! Ci vediamo domani."
    goals: [sign-up]
    done: true

- scenario: noleggio-bici
  level: A2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno! Vuole una bicicletta?"
  - learner: "Buongiorno. Sì, vorrei noleggiare due biciclette, per me e per mia moglie."
  - tutor: "Benissimo! Per quanto tempo le vuole?"
    goals: [ask]
  - learner: "Per tutta la giornata. Noi tornaremo alle sei di sera."
    errors: [future-form]
  - tutor: "Tutta la giornata, va bene. Scusi, come ha detto? Alle sei voi...?"
    prompt: {text: "tornaremo", tags: [future-form]}
  - learner: "Alle sei noi... tornaramo?"
    errors: [future-form]
  - tutor: "Ho capito, tornerete alle sei. Va bene, noi chiudiamo alle sette."
    recast: {text: "tornaramo", fix: "tornerete", tags: [future-form]}
    goals: [duration]
  - learner: "Torneremo, con la e. Grazie. Quanto costa per due?"
  - tutor: "Sono 15 euro a bicicletta, quindi 30 in tutto, con casco e lucchetto."
    goals: [price]
  - learner: "Bene. Mia moglie non ama le hills. C'è un percorso facile?"

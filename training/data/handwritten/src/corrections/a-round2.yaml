  - learner: "Ho... servito ai tavoli."
  - tutor: "Esatto! E adesso vive qui a Bologna?"
  - learner: "Sì. Sono arrivato due anni fa per una vacanza e ho rimasto qui per amore."
    errors: [auxiliary-choice]
  - tutor: "Per amore, che bello! Ma rimanere è come arrivare, con un altro verbo. Lei...?"
    prompt: {text: "ho rimasto", tags: [auxiliary-choice]}
    new: [{lemma: "verbo", gloss: "verb"}]
  - learner: "Io... ho rimanuto qui?"
    errors: [auxiliary-choice, past-participle-form]
  - tutor: "Ho capito: è rimasto qui per amore. E adesso lavora?"
    recast: {text: "ho rimanuto", fix: "è rimasto", tags: [auxiliary-choice]}
    goals: [experience]
  - learner: "Sono rimasto, va bene. Sì, lavoro in una cucina, ma solo la sera. Di giorno sono disponibile."
  - tutor: "Perfetto. Ci serve una persona dalle 11 alle 16. Può cominciare lunedì?"
  - learner: "Sì, posso. E quanto è lo stipendio?"
  - tutor: "Sono 9 euro all'ora, più le mance."
    goals: [availability]
    new: [{lemma: "mancia", gloss: "tip"}]
  - learner: "Va bene. Vi lascio il mio numero: 320 555 0199."
  - tutor: "Grazie. La chiamo domani mattina e Le dico tutto."
    goals: [contact]
  - learner: "Grazie mille. A domani!"
  - tutor: "A domani e buona giornata!"

    goals: [ask-membership, classes]
  # merlin-1395_0001058-0
  - learner: "Il corso mi piace molto."
  - tutor: "Che bello! Allora conosci già la nostra insegnante."
  # merlin-1395_0001058-2
  - learner: "Nel suo corso posso imparare molto."
  - tutor: "Sì, è bravissima. Le sue lezioni sono il martedì e il giovedì sera."
    goals: [timetable]

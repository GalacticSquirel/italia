  # merlin-1395_0000451-1
  - learner: "Oggi non sto molto bene, perché ho avuto un grande concerto ieri sera."
  - tutor: "Ah, ieri sera avete suonato! Com'è andata?"
  # merlin-1395_0001069-7
  - learner: "Era molto divertente."
  - tutor: "Che bello! La prossima volta vengo anch'io."
  # merlin-1385_0000102-3

# Set u-real-a2, file 2: A2, work, job hunting and daily routines (real learner sentences, MERLIN pool 6).

- scenario: giorno-tipico
  level: A2
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi alzo alle sette, faccio colazione e vado in ufficio."
  - tutor: "Brava! E il lavoro com'è?"
    goals: [wake]
  # merlin-1395_0000631-3
  - learner: "Al lavoro mi va veramente bene."
  - tutor: "Che bello sentirlo! E la sera?"
    goals: [work]
  # merlin-1395_0000597-4
  - learner: "I miei amici nel corso sono molto simpatici e andiamo insieme a bere qualcosa alla sera."
  - tutor: "Ah, fai un corso! E poi cenate insieme?"
  # merlin-1395_0000593-8
  - learner: "La sera mangio sola il ristorante."
    errors: [articulated-preposition, preposition]
    gold: {text: "il ristorante", fix: "al ristorante"}
  - tutor: "«Mangio il ristorante»? Mangi il ristorante?!"
    prompt: {text: "il ristorante", tags: [articulated-preposition]}
  - learner: "No! Mangio da sola al ristorante, vicino a casa."
  - tutor: "Esatto, così è meglio! Io invece cucino ogni sera."
    goals: [evening]
  # merlin-1385_0001775-1
  - learner: "Che cosa fai?"
  - tutor: "Io? Lavoro da casa, quindi mi alzo tardi!"
    goals: [ask]

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [word-order]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi alzo alle sei, lavoro in un supermercato e la sera sono stanco."
  - tutor: "Che giornata! Io invece cerco un lavoro nuovo."
    goals: [wake, work, evening]
  # merlin-1385_0001787-1
  - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
  - tutor: "Grazie, sei gentile! Chiedi pure."
  # merlin-1385_0000042-2
  - learner: "Puoi dirmi dove lavori adesso?"
  - tutor: "In un negozio di scarpe, ma non mi piace molto."
  # merlin-1385_0001156-3
  - learner: "Anche vorrei sapere che tipo di lavoro vuoi fare?"
    errors: [word-order]
    gold: {text: "Anche vorrei sapere", fix: "Vorrei anche sapere"}
  - tutor: "Bella domanda! Ma «anche vorrei»: «anche» sta bene lì all'inizio?"
    prompt: {text: "Anche vorrei", tags: [word-order]}
  # merlin-1385_0001733-4
  - learner: "Vorrei sapere quale professione hai e che tipo di lavoro ti piace"
  - tutor: "Perfetto! Vendo scarpe, ma vorrei lavorare in un negozio di libri."
    goals: [ask]
  # merlin-1385_0000049-5
  - learner: "Quando vuoi cominciare?"
  - tutor: "Subito, se trovo qualcosa!"

- scenario: cercare-lavoro-a2
  level: A2
  persona: es-f-erasmus
  history: [subject-verb-agreement]
  turns:
  - tutor: "Buongiorno! Ha visto il cartello?"
  - learner: "Sì, buongiorno. Cercate una ragazza per il bar? Ho lavorato due anni in un bar a Valencia."
  - tutor: "Sì, per servire ai tavoli. Due anni, bene! E adesso cosa fa?"
    goals: [ask, experience]
  # merlin-1395_0000598-1
  - learner: "Sono a Firenze per seguire un corso d'italiano."
  - tutor: "Ah, studia l'italiano! E quando può lavorare?"
  # merlin-1385_0001167-6
  - learner: "Non devo lavorare il fine settimana."
  - tutor: "Allora è libera il sabato e la domenica? Perfetto per noi."
    goals: [availability]
  # merlin-1395_0001118-5
  - learner: "Mi posso telefonare oggi o domani a casa?"
    errors: [subject-verb-agreement]
    gold: {text: "Mi posso telefonare", fix: "Mi può telefonare"}
  - tutor: "«Mi posso telefonare»? Chi telefona, io o Lei?"
    prompt: {text: "Mi posso telefonare", tags: [subject-verb-agreement]}
  - learner: "Lei! Mi può telefonare oggi o domani? Il mio numero è 347 2216580."
  - tutor: "Esatto! La chiamo domani mattina. Arrivederci!"
    goals: [contact]

- scenario: cercare-lavoro-a2
  level: A2
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
  - tutor: "Buongiorno! Ha visto il cartello?"

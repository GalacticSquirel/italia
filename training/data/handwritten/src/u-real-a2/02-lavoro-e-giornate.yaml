  - tutor: "Niente di speciale, sto a casa. Perché?"
    goals: [ask]
  # merlin-1385_0001746-5
  - learner: "Ci vediamo in sabato"
    errors: [preposition]
    gold: {text: "in sabato", fix: "sabato"}

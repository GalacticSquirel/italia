# Set u-real-a2, file 1: A2, evenings out and dinners (real learner sentences, MERLIN pool 6).

- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  # merlin-1385_0001768-1
  - learner: "Io sto bene, ma è una settimana orribile."
  - tutor: "Oh, mi dispiace! Allora stasera resta a casa. Un altro giorno?"
  # merlin-1385_0001746-3
  - learner: "Possiamo andare a cena in sabato sera?"
    errors: [preposition]
  - tutor: "A cena, che bello! Ma «in» prima di un giorno della settimana? Pensaci un attimo."
    prompt: {text: "in sabato sera", tags: [preposition]}
  - learner: "Sì, possiamo andare a cena in sabato sera?"
    errors: [preposition]
  - tutor: "Sì, sabato sera sono libera! E dopo cena?"
    recast: {text: "in sabato sera", fix: "sabato sera", tags: [preposition]}
  - learner: "Dopo andiamo al cinema? Mi piacciono i film comici."
  - tutor: "Perfetto! Alle dieci danno una commedia francese al cinema Odeon."
    goals: [propose, genre, choose]
  # merlin-1385_0000127-2
  - learner: "Ci vediamo sabato sera?"
  - tutor: "Sì, alle otto davanti al ristorante. Poi andiamo insieme al cinema!"
    goals: [meet]

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [comparative]
  turns:
  - tutor: "Ciao! Stasera sono libera. Facciamo qualcosa?"
  # merlin-1385_0001756-3
  - learner: "Il mio capo ha organizzato una riunione."
  - tutor: "Stasera? Che peccato! Finisce tardi?"
  # merlin-1385_0001107-3
  - learner: "Il capo ha organizzato una riunione giovedì pomeriggio e non ho tempo."
  - tutor: "Ah, giovedì! Allora stasera sei libero, no?"
  # merlin-1385_0001740-6
  - learner: "Che ne dici di andare al ristorante?"
  - tutor: "Buona idea, ma ho già mangiato. Andiamo al cinema invece?"
  - learner: "Va bene! Io preferisco i film d'azione. Sono più divertenti delle commedie."
  - tutor: "Anche per me! Alle nove c'è un film d'azione americano. Ti va?"
    goals: [propose, genre, choose]
  - learner: "Va bene per te alle nove?"
  - tutor: "Benissimo. Ci vediamo alle nove meno un quarto davanti al cinema!"
    goals: [meet]

- scenario: serata-cinema

- scenario: tempo-libero
  level: A2
  persona: en-m-retired
  history: [article-use]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1385_0000129-1
  - learner: "Senti, questa settimana è una settimana orribile."
  - tutor: "Mi dispiace! Allora il fine settimana stai a casa?"
  - learner: "No, il sabato cucino sempre per gli amici. Mi piace la cucina tailandese."
  - tutor: "Che bello, ogni sabato! Io non l'ho mai mangiata."
    goals: [hobby, frequency]
  # merlin-1385_0001522-4
  - learner: "Voglio andare con tua a ristorante tailandese."
    errors: [object-pronoun, articulated-preposition]
    gold: {text: "a ristorante", fix: "al ristorante"}
  - tutor: "Con me? Che gentile! Ma «a ristorante»: manca qualcosa."
    prompt: {text: "a ristorante", tags: [articulated-preposition]}
  # merlin-1385_0001773-3
  - learner: "Andiamo in un ristorante tailandese sabato sera?"
  - tutor: "Perfetto, sabato sera in un ristorante tailandese!"
    goals: [propose]
  # merlin-1385_0001798-4
  - learner: "Puoi dirmi che cosa ti piace?"
  - tutor: "Nel tempo libero? Leggere e camminare in montagna."
    goals: [ask]

- scenario: prenotare-tavolo
  level: A2
  persona: es-m-worker
  history: [noun-number]
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera, vorrebbi prenotare per domani sera."
    errors: [conditional-form]
    gold: {text: "vorrebbi", fix: "vorrei"}
  - tutor: "Buonasera! «Vorrebbi»? Prova di nuovo con il verbo volere."
    prompt: {text: "vorrebbi", tags: [conditional-form]}
  - learner: "Vorrei prenotare per domani sera, alle nove, per sei persone."
  - tutor: "Esatto! Domani alle nove, sei persone. Serve altro?"
    goals: [book, details]
  - learner: "Sì, abbiamo un bambino piccolo: avete un seggiolone? Io mi chiamo García."
  - tutor: "Sì, certo, il seggiolone lo prepariamo noi, signor García."
    goals: [special, name]
    new: [{lemma: seggiolone, gloss: high chair}]
  - learner: "Grazie! Possiamo portare noi la torta?"
  - tutor: "Certo! Ci pensiamo noi. A domani!"

- scenario: ristorante-ordinare
  level: A2
  persona: en-f-student
  history: [article-form]
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Siamo in due. C'è un tavolo vicino alla finestra?"
  - tutor: "Sì, prego, da questa parte. Ecco il menù."
    goals: [ask-table]
  # merlin-1385_0001771-5
  - learner: "Ti piace mangiare tailandese?"
  - tutor: "Qui però facciamo solo cucina italiana, signorina!"
  - learner: "Sì, scusi. Allora per me il spaghetti al pomodoro."
    errors: [article-form]
    gold: {text: "il spaghetti", fix: "gli spaghetti"}
  - tutor: "Ottima scelta! Ma «il spaghetti»? Pensa all'articolo giusto."
    prompt: {text: "il spaghetti", tags: [article-form]}
  - learner: "Sì, il spaghetti al pomodoro e una bottiglia di acqua, per favore."
    errors: [article-form]
  - tutor: "Benissimo, gli spaghetti al pomodoro e l'acqua arrivano subito."
    recast: {text: "il spaghetti", fix: "gli spaghetti", tags: [article-form]}
    goals: [order-food, order-drink]
  - learner: "Grazie. Dopo ci porta il conto, per favore?"
  - tutor: "Certo, dopo il caffè vi porto il conto. Buon appetito!"
    goals: [ask-bill]


- scenario: cucina-ricetta
  level: A2
  persona: en-f-student
  history: [noun-gender]
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "La pasta con due salse, al pomodoro e ai funghi. Ci servono pomodori, funghi, olio e sale."

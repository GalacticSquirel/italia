  - tutor: "Va bene! Ma «mettila»: i funghi sono maschili e plurali, no?"
    prompt: {text: "mettila", tags: [object-pronoun]}
  - learner: "Sì! Mettili nella pentola con l'olio: cuociono venti minuti, poi la pasta dieci."
  - tutor: "Esatto! Benissimo. Hai già cucinato questa pasta?"
    goals: [steps, time]
  # merlin-1395_0001093-9
  - learner: "La pasta con i salse diversi sono delicioso."
    errors: [noun-gender, adjective-agreement, subject-verb-agreement, spelling]
    gold: {text: "i salse diversi", fix: "le salse diverse"}
  - tutor: "Ci credo! Ma «i salse diversi»: «salse» è maschile o femminile?"

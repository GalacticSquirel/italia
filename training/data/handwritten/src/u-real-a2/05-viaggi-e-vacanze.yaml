# Set u-real-a2, file 5: A2, holidays, hotels and getting around (real learner sentences, MERLIN pool 6).
- scenario: vacanze-passate
  level: A2
  persona: en-m-traveller
  history: [false-friend]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1325_1001137-1
  - learner: "Dopo cinque anni ho avuto la possibilità spendere un mese a Londra."
    errors: [preposition, false-friend]
    gold: {text: "spendere un mese", fix: "passare un mese"}
  - tutor: "Che fortuna passare un mese a Londra! E com'era il tempo?"
    recast: {text: "spendere un mese", fix: "passare un mese", tags: [false-friend]}
    goals: [where]
  - learner: "Ha piovuto quasi tutti i giorni, ma non faceva freddo."
  - tutor: "Classico! E cosa hai fatto con la pioggia?"
    goals: [weather]
  # merlin-1395_0001023-1
  - learner: "Mi piacono molto i musei della città."
    errors: [verb-form]
    gold: {text: "piacono", fix: "piacciono"}
  - tutor: "Ottima idea con la pioggia! Ma «piacono»: manca qualcosa nel verbo."
    prompt: {text: "piacono", tags: [verb-form]}
  - learner: "Sì, mi piacono tanto i musei. Sono tutti gratis!"
    errors: [verb-form]
  - tutor: "Ti piacciono i musei gratis, eh? Anche a me! Qual è stata la cosa più bella?"
    recast: {text: "piacono", fix: "piacciono", tags: [verb-form]}
    goals: [activities]
  # merlin-1395_0000547-5
  - learner: "La musica era molto bella."
  - tutor: "Ah, hai sentito musica dal vivo! Com'era la serata?"
  # merlin-1395_0000338-5
  - learner: "Era buene anzi fantastiche!"
    errors: [adjective-agreement, spelling]
    gold: {text: "buene anzi fantastiche", fix: "bella, anzi fantastica"}
  - tutor: "Che bello! Ma «fantastiche»: la serata è una sola, no?"
    prompt: {text: "buene anzi fantastiche", tags: [adjective-agreement]}
  - learner: "Era bella, anzi fantastica!"
  - tutor: "Esatto! A Londra la musica è fantastica."
    goals: [best]

- scenario: vacanze-passate
  level: A2
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0001015-1
  - learner: "Siamo arrivati al croazia con la macchina."
    errors: [articulated-preposition]
    gold: {text: "al croazia", fix: "in Croazia"}
  - tutor: "In macchina, che viaggio! Ma «al Croazia»? Con i paesi quale parola usiamo?"
    prompt: {text: "al croazia", tags: [articulated-preposition]}
  - learner: "Siamo arrivati alla Croazia dopo dieci ore."
    errors: [articulated-preposition]
  - tutor: "Dieci ore per arrivare in Croazia! Che viaggio lungo. E il tempo?"
    recast: {text: "alla Croazia", fix: "in Croazia", tags: [articulated-preposition]}
    goals: [where]
  # merlin-1395_0000644-2
  - learner: "La reggione e bellissima."
    errors: [spelling]
    gold: {text: "reggione", fix: "regione"}
  - tutor: "Ci credo! Ma «reggione»: guarda bene come si scrive."
    prompt: {text: "reggione", tags: [spelling]}
  - learner: "Una! La regione è bellissima e faceva molto caldo."
  - tutor: "Esatto! Con il caldo, al mare tutti i giorni?"
    goals: [weather]
  - learner: "Sì, al mare la mattina e la sera visitavamo le città vecchie."
  - tutor: "Che belle vacanze! Cosa ti è piaciuto di più?"
    goals: [activities]
  # merlin-1395_0000642-4
  - learner: "Mi piace molto questo mercato."
  - tutor: "Ah, mi mostri la foto del mercato! Che colori, che bello!"
    goals: [best]

- scenario: vacanze-passate

- scenario: hotel-checkin
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Sì, buonasera. Ho una prenotazione a nome Taylor. Ecco il passaporto."
  - tutor: "Grazie, signor Taylor. La colazione è dalle sette alle dieci."
    goals: [booking, document, breakfast]
  # merlin-1395_0001074-4
  - learner: "Che cosa si puó fare da sera?"
    errors: [preposition, spelling]
    gold: {text: "da sera", fix: "di sera"}
  - tutor: "Bella domanda! Ma «da sera»? Prova con un'altra piccola parola."
    prompt: {text: "da sera", tags: [preposition]}
  - learner: "Sì. Che cosa si può fare da sera, qui vicino?"
    errors: [preposition]
  - tutor: "C'è musica in piazza di sera, proprio qui vicino."
    recast: {text: "da sera", fix: "di sera", tags: [preposition]}
  # merlin-1395_0001117-7
  - learner: "C'è una discoteca per uscire la sera?"
  - tutor: "Sì, ma è un po' lontana. Ecco la chiave: camera 214, secondo piano."
    goals: [key]

- scenario: hotel-checkin
  level: A2
  persona: es-f-teacher
  history: [verb-form]
  turns:
  - tutor: "Buonasera e benvenuta! Ha una prenotazione?"
  - learner: "Sì, a nome Ruiz, per una settimana. Ecco la carta d'identità."
  - tutor: "Grazie, signora Ruiz. Tutto a posto. Domande?"
    goals: [booking, document]
  # merlin-1395_0001074-8
  - learner: "Quanto tempo potrei rimanere?"
  - tutor: "La prenotazione è per sette notti. Vuole rimanere di più?"
  # merlin-1395_0001114-6
  - learner: "In Germania non è possibile di fare shopping alla sera"
    errors: [preposition, articulated-preposition]
    gold: {text: "possibile di fare", fix: "possibile fare"}
  - tutor: "Ah, Lei vive in Germania! Ma «possibile di fare»: serve quel «di»?"
    prompt: {text: "possibile di fare", tags: [preposition]}
  - learner: "Sì, in Germania non è possibile di fare shopping la sera."
    errors: [preposition]
  - tutor: "Ah, in Germania non è possibile fare shopping la sera? Qui i negozi chiudono alle otto."
    recast: {text: "possibile di fare", fix: "possibile fare", tags: [preposition]}
  - learner: "E la colazione? A che ora è?"
  - tutor: "Dalle sette alle dieci, al primo piano. Ecco la chiave: camera 105."
    goals: [breakfast, key]

- scenario: autobus
  level: A2
  persona: en-f-student
  history: [question-form]
  turns:
  - tutor: "Buongiorno! Dove deve andare?"
  # merlin-1395_0001023-2
  - learner: "Vado al liceo con il treno, ma arrivo a casa mia con il bus."
  - tutor: "Ah, quindi adesso torna a casa! Dove abita?"
  - learner: "In via Roma. Questo autobus va in via Roma?"
  - tutor: "Sì, è la linea giusta. Ha il biglietto?"
    goals: [route]
  - learner: "Non ce l'ho. Dove posso comprare il biglietto? E a quale fermata devo scendere?"
  - tutor: "In tabaccheria, lì a destra. Poi scende alla quarta fermata, davanti alla farmacia."
    goals: [ticket, stop]
  - learner: "Grazie mille, è molto gentile!"
  - tutor: "Prego, signorina. Buona giornata!"
    goals: [thank]

- scenario: biglietto-treno
  level: A2
  persona: es-m-worker
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, dove deve andare?"
  - learner: "Buongiorno, vorrei andare a Napoli domani mattina."
  - tutor: "C'è un treno alle otto e uno alle dieci."
    goals: [destination]
  # merlin-1365_0100171-3
  - learner: "Ma non conosco la chiesa di Santa Chiara perché non sono a Napoli da otto anni."
  - tutor: "Otto anni, tanto tempo! Allora andata e ritorno?"
  - learner: "Sì, andata e ritorno, con il ritorno domenica sera. Seconda classe, vicino al finestrino."
  - tutor: "Ecco il posto. Sono sessanta euro."
    goals: [type, class]
  - learner: "Grazie. Da quale binario parte il treno delle otto?"
  - tutor: "Dal binario tre. Buon viaggio a Napoli!"
    goals: [platform]

- scenario: noleggio-bici
  level: A2
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
  - tutor: "Buongiorno! Vuole una bicicletta?"
  - learner: "Sì, vorrei noleggiare una bicicletta per oggi pomeriggio."
  - tutor: "Certo. Per quante ore?"
    goals: [ask]
  - learner: "Quattro ore, fino alle sei. Quanto costa?"
  - tutor: "Dieci euro, con il casco e il lucchetto."
    goals: [duration, price]
  - learner: "C'è un bel percorso qui vicino? Il lago è lontano?"
  - tutor: "No, il percorso del lago è facile: un'ora e siete lì."
    goals: [route]
  # merlin-1365_0100181-7
  - learner: "Sono così felice!"
  - tutor: "Che bello! Buon giro al lago!"

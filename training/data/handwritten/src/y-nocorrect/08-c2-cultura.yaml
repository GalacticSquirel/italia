# Set y-nocorrect, file 8: C2. Correct choices left alone: "credo sia" without che, "più
# politica che linguistica" (che between adjectives), "di rosso ne ho portate due", "non so se è".
- scenario: circolo-lettura
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io no, anzi: Cosimo l'ho invidiato per tutto il libro. Che un ragazzino resti sugli alberi per tutta la vita è assurdo, lo so, ma è proprio lì la forza del romanzo."
  - tutor: "Invidia, addirittura! Però ammetterai che il suo rifiuto ha qualcosa di capriccioso, almeno all'inizio: un piatto di lumache non è una gran causa."
    goals: [impression]
  - learner: "All'inizio sì, è un capriccio. Ma poi diventa una scelta: Cosimo non scappa dal mondo, lo guarda da una distanza che gli permette di capirlo meglio. Pensa all'episodio in cui organizza i contadini contro gli incendi."
  - tutor: "Bell'esempio: la distanza come forma di impegno, non di fuga. E lo stile, che cosa ti ha colpito?"
    goals: [theme]
  - learner: "Soprattutto il narratore, Biagio, del quale punto di vista è sempre un po' più basso, letteralmente: racconta tutto da terra."
    errors: [relative-pronoun]
  - tutor: "Osservazione finissima. Però, «Biagio, del quale punto di vista»? In questa costruzione il relativo si sistema in un altro modo."
    prompt: {text: "del quale punto di vista", tags: [relative-pronoun]}
  - learner: "Sì, Biagio, del quale punto di vista è sempre più basso."
    errors: [relative-pronoun]
  - tutor: "Biagio, il cui punto di vista resta sempre un po' più in basso: hai ragione. E quell'ironia leggerissima nasce proprio da lì, dal fratello prudente che racconta il fratello folle."
    recast: {text: "del quale punto di vista", fix: "il cui punto di vista", tags: [relative-pronoun]}
    goals: [style]
  - learner: "Però non sono d'accordo che Cosimo sia insopportabile. Insopportabile è chi giudica senza mai salire su un albero, e nel romanzo ce ne sono parecchi."
  - tutor: "Colpito e affondato: forse l'insopportabile ero io, a rileggerlo. E per il prossimo mese che cosa proponi?"
    goals: [disagree]
  - learner: "Restiamo su Calvino: «Le città invisibili». Se ci è piaciuta la leggerezza del barone, lì la troviamo allo stato puro."
  - tutor: "Proposta approvata, ma vi avverto: lì di alberi non ce ne sono, solo città che non esistono."
    goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [imperative-form]
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
  - learner: "Ci mancherebbe. Ci tenevo a esserci. Le porgo le mie più sincere condoglianze, a lei e a tutta la famiglia."
  - tutor: "Grazie, è molto gentile. È stata una cosa improvvisa, nessuno se l'aspettava."
    goals: [condolences]
  - learner: "Mi dispiace tantissimo. Sua madre la ricordo bene: quella volta che è venuta in ufficio con i taralli per tutti e si è fermata a chiacchierare con ognuno di noi."
  - tutor: "Sì, era fatta così: non conosceva l'imbarazzo. Mi fa bene sentire che se ne ricorda."
    goals: [memory]
  - learner: "Volevo dirle che le sono molto simpatetico, e che in ufficio pensiamo tutti a lei."
    errors: [false-friend]
  - tutor: "So che mi è vicino, e anche i colleghi: in questi giorni conta più di quanto immagini."
    recast: {text: "simpatetico", fix: "vicino", tags: [false-friend]}
  - learner: "Per il lavoro, non si preoccupa: i suoi clienti li seguo io finché non torna."
    errors: [imperative-form]
  - tutor: "È un pensiero che mi solleva. Solo una cosa, visto che all'italiano ci teniamo tutti e due: «non si preoccupa», detto come invito a me, va bene così?"
    prompt: {text: "non si preoccupa", tags: [imperative-form]}
  - learner: "Ah, certo: non si preoccupi per il lavoro, ci penso io."
  - tutor: "Ecco, così. E grazie davvero: non sa quanto mi alleggerisce."
    goals: [offer-help]
  - learner: "Non voglio disturbarla oltre. Se ha bisogno di qualsiasi cosa, anche solo di fare due passi, mi chiami a qualunque ora."
  - tutor: "Lo farò, glielo prometto. Grazie ancora di essere venuto fin qui."
    goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  history: [comparative]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Figurati! Ho capito sì e no la metà. Però una cosa l'ho notata: le vocali finali quasi spariscono, e sembra che cantino."
  - tutor: "Hai orecchio: è la cadenza tipica, le parole si chiudono in una specie di vocale neutra, appena accennata."
    goals: [notice]
  - learner: "A un certo punto uno ha detto «guaglione». Me l'ha spiegato una mia amica, vuol dire ragazzo, no? Ma si usa ancora anche tra i giovani?"
  - tutor: "Eccome se si usa! Anzi, i ragazzi lo usano tra loro con orgoglio, quasi come una bandiera."
    goals: [example]
  - learner: "Mi sembra che il napoletano sia molto più musicale che l'italiano standard."
    errors: [comparative]
  - tutor: "Musicalissimo, nessun dubbio. Ma riascoltati: «più musicale che l'italiano»? Quando confronti due nomi, quale parola viene dopo più?"
    prompt: {text: "più musicale che l'italiano", tags: [comparative]}
  - learner: "Sì, più musicale che l'italiano, e anche più espressivo, secondo me."
    errors: [comparative]
  - tutor: "Più musicale dell'italiano, sì, e più espressivo: tanti napoletani ti direbbero che certe cose in italiano proprio non si possono dire. Ma tu lo consideri una lingua o un dialetto?"
    recast: {text: "più musicale che l'italiano", fix: "più musicale dell'italiano", tags: [comparative]}
  - learner: "Non so se è giusto chiamarlo dialetto. Ha una letteratura, un teatro, canzoni famose in tutto il mondo... Credo che la differenza sia più politica che linguistica."
  - tutor: "Lo diceva anche un famoso linguista: una lingua è un dialetto con un esercito e una marina."
    goals: [standard]
  - learner: "Esatto! E secondo me i dialetti vanno protetti, ma senza imporli: se a scuola se ne parlasse di più, nessuno se ne vergognerebbe."
  - tutor: "Sono d'accordo a metà: protetti sì, ma senza farne un museo. Il dialetto vive per strada, mica sui libri di scuola."
    goals: [opinion]

- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie a voi, è un piacere essere qui. Incoscienza, sì: credo sia la parola giusta. Il libro si intitola «Caffè al banco» e racconta i miei primi cinque anni a Torino."
  - tutor: "Titolo invitante. Ma perché un libro proprio su di noi? Non bastavano i nostri lamenti?"
  - learner: "Proprio per quello! Gli italiani si lamentano di tutto, ma guai se lo fa uno straniero. Io volevo raccontare l'Italia con affetto, senza fare né la turista incantata né la critica acida."
  - tutor: "Ecco allora la domanda provocatoria: non teme di aver rafforzato qualche stereotipo? La pizza, il mandolino, il caffè..."
    goals: [present-book]
  - learner: "Gli stereotipi li ho usati come porte d'ingresso: si entra dal cliché e si esce da un'altra parte. Il caffè al banco, per esempio, non è folklore: è un rito sociale di trenta secondi in cui si scambiano più notizie che in un telegiornale."
  - tutor: "Risposta elegante e, devo dire, disarmante. Ci racconta un episodio che le è rimasto addosso?"
    goals: [stereotype]
  - learner: "I primi mesi non conoscevo nessuno, e ogni mattina sono andata allo stesso bar. Dopo tre settimane il barista mi ha preparato il caffè senza che io dicessi niente."
    errors: [tense-aspect]
  - tutor: "Che bella immagine. Ma un attimo: «ogni mattina sono andata»? Per un'abitudine che si ripete, quale tempo ci vuole?"
    prompt: {text: "sono andata", tags: [tense-aspect]}
  - learner: "Ha ragione: ogni mattina andavo allo stesso bar, finché un giorno il barista mi ha preparato il caffè senza che io aprissi bocca. Quel giorno mi sono sentita torinese."
  - tutor: "Ecco l'Italia in un gesto. E l'italiano, invece, che cosa le ha cambiato dentro?"
    goals: [anecdote]
  - learner: "Mi ha insegnato a gesticolare, ovviamente! Ma soprattutto, imparandolo, sono diventata più paziente: in spagnolo vado dritta al punto, in italiano ho imparato a girarci intorno con grazia."
  - tutor: "Girarci intorno con grazia: potremmo farne il motto nazionale. Ci lascia con una frase per i nostri ascoltatori?"
    goals: [language]
  - learner: "Dico solo questo: venite in Italia per i monumenti, ma restateci per il caffè al banco."
  - tutor: "E noi restiamo con lei, almeno fino alla prossima puntata. Grazie, e buona lettura a tutti!"
    goals: [farewell]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Meno male! Ne è rimasta un po' anche per me? Me ne basta un pezzettino, giuro."
  - tutor: "Per te si trova sempre. Sai cosa dice mia nonna? Chi tardi arriva, male alloggia. Ma oggi facciamo un'eccezione."
  - learner: "Chi tardi arriva, male alloggia... quindi chi arriva tardi trova il posto peggiore, giusto? Ce l'ho fatta per un pelo, in effetti: il treno era in ritardo."
  - tutor: "Esatto, hai capito al volo. E il vino, l'hai portato?"
    goals: [react]
  - learner: "Certo, è nel sacchetto. Bottiglie di rosso ho portato due, non sapevo quante persone c'erano."
    errors: [ci-ne]
  - tutor: "Bravo! Però, «bottiglie di rosso ho portato due»? Quando anticipi il nome così, davanti al verbo manca una parolina."
    prompt: {text: "ho portato due", tags: [ci-ne]}
  - learner: "Ah, giusto: di rosso ne ho portate due."
  - tutor: "Perfetto. Dai, raccontaci com'è andato il viaggio, che sei arrivato con una faccia..."
  - learner: "Un disastro: ho perso la connessione a Firenze e ho dovuto aspettare due ore. Ma alla fine ho conosciuto una signora simpaticissima che mi ha offerto mezzo panino. Come si dice? Non tutto il male vien per nuocere!"
    errors: [false-friend]
  - tutor: "La coincidenza persa a Firenze, un classico! Ma allora sei dei nostri: proverbio perfetto, usato al momento giusto."
    goals: [use-idiom, anecdote]
    recast: {text: "la connessione", fix: "la coincidenza", tags: [false-friend]}
  - learner: "In inglese diciamo «every cloud has a silver lining»: ogni nuvola ha un bordo d'argento. È più poetico, ma il senso è lo stesso."
  - tutor: "Un bordo d'argento! Noi siamo più pratici: niente nuvole, solo il male e quello che ne viene di buono. Tieni, intanto, l'ultimo pezzo di lasagna: te lo sei meritato."
    goals: [compare]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Me l'aspettavo, questa. Dimmi pure dove l'ho tradito: scommetto che è il passo del funerale."
  - tutor: "Esatto, proprio quello. L'autrice scrive che la vedova era «terribly polite», e tu hai messo «gentilissima»."
  - learner: "Lo so, si perde il veleno. In inglese «terribly polite» è un complimento avvelenato; «gentilissima» è solo un complimento."
  - tutor: "Appunto. E le alternative?"
    goals: [problem]
  - learner: "Potrei mettere «di una cortesia micidiale», oppure «educata in modo quasi offensivo». La seconda è più esplicita, ma pesante. Però non mi sembra che il lettore italiano capisce l'ironia con la prima."
    errors: [subjunctive-use]
  - tutor: "Su questo ci torniamo, ma prima: «non mi sembra che il lettore capisce»? Rileggi il verbo che segue «non mi sembra che»."
    prompt: {text: "capisce", tags: [subjunctive-use]}
  - learner: "Sì, dicevo che non mi sembra che il lettore italiano capisce l'ironia così."
    errors: [subjunctive-use]
  - tutor: "Io invece credo che il lettore la capisca benissimo, se gli diamo un po' di fiducia: «micidiale» fa tutto il lavoro. Nel resto del capitolo, altre trappole?"
    goals: [options]
    recast: {text: "capisce", fix: "capisca", tags: [subjunctive-use]}
  - learner: "Una sola, credo: più avanti la figlia è descritta come «sensible», e l'ho resa con «assennata», non con «sensibile». Quella almeno l'ho schivata."
  - tutor: "Brava, è il falso amico per eccellenza: metà delle bozze che correggo ci cascano in pieno."
    goals: [false-friend]
  - learner: "Allora deciso: «di una cortesia micidiale», e lasciamo che sia il lettore a sentirne il veleno."
  - tutor: "Approvato. Vedi che quando ti fidi del testo l'autrice torna a parlare? Mandami il capitolo rivisto entro lunedì."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Va bene, lo ammetto: non l'ho capita. Ho riso per educazione. Me la spieghi?"
  - tutor: "Allora: il ministro aveva detto in televisione che nella carbonara ci va la panna, e da noi è un reato peggiore dell'evasione fiscale. Ecco perché la sala è esplosa."
    goals: [missed]
  - learner: "Ah, ecco! Se l'avessi saputo, avrei riso più degli altri, fidati. Quella sul traffico invece mi ha fatto morire."
  - tutor: "Quella del motorino in doppia fila? È la mia preferita. Perché ti ha fatto così ridere?"
  - learner: "Perché è vera: a Roma perfino i motorini parcheggiano in doppia fila! E poi i tempi erano perfetti, con quella pausa prima della battuta finale."
  - tutor: "Hai ragione, è tutto nella pausa: tre secondi in più e la battuta muore."
    goals: [favourite]
  - learner: "Invece il gioco di parole tra «ministro» e «minestra» l'ho preso solo alla fine dello spettacolo."
    errors: [word-choice]
  - tutor: "L'hai capito solo alla fine? Normale, era velocissimo. Prova a spiegarmelo, vediamo se l'hai capito davvero."
    recast: {text: "preso", fix: "capito", tags: [word-choice]}
  - learner: "C'è il proverbio «o mangi questa minestra o salti dalla finestra», e lui l'ha cambiato in «o ti tieni questo ministro o salti dalla finestra»: cioè non abbiamo scelta."
  - tutor: "Esatto, e la parola quasi uguale fa tutto il lavoro: per questo è così perfida. Ma senti, secondo te quella sul ministro era troppo?"
    goals: [wordplay]
  - learner: "Penso che la satira deve avere dei limiti, ma non con i potenti: con loro tutto è permesso."
    errors: [subjunctive-use]
  - tutor: "Posizione chiara. Però riascoltati: «penso che la satira deve»? Dopo «penso che», quale modo ti aspetti?"
    prompt: {text: "la satira deve", tags: [subjunctive-use]}
  - learner: "Sì, penso che la satira deve avere dei limiti solo verso chi non può difendersi."
    errors: [subjunctive-use]
  - tutor: "Allora pensi che la satira debba avere dei limiti solo verso i deboli: su questo brindo con te. Un altro giro?"
    recast: {text: "la satira deve", fix: "la satira debba", tags: [subjunctive-use]}
    goals: [limits]

- scenario: email-rettore
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Il mio progetto di ricerca è stato escluso dal bando per un errore formale: la domanda è arrivata con un giorno di ritardo perché la piattaforma era bloccata."
  - tutor: "Capisco. E lei che cosa vorrebbe ottenere, esattamente?"
  - learner: "Vorrei che la domanda venisse riesaminata. Ho già avuto un argomento con l'ufficio ricerca al telefono, ma non hanno voluto sentire ragioni."
    errors: [false-friend]
  - tutor: "Se ha già avuto una discussione con l'ufficio ricerca senza risultato, scrivere al Rettore è il passo giusto. Partiamo dall'intestazione: lei come comincerebbe?"
    goals: [situation]
    recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
  - learner: "Pensavo a «Gentile Rettore». È troppo semplice?"
  - tutor: "Per un Rettore la formula consacrata è «Magnifico Rettore», per quanto possa sembrarle pomposa. E nel testo, Lei e Sua sempre con la maiuscola."
    goals: [opening-formula]
  - learner: "Magnifico Rettore, d'accordo: non lo sapevo. Poi ho scritto questa frase: «La vostra decisione è ingiusta e pretendo che venga annullata». Mi sembra chiara, ma forse è troppo diretta."
  - tutor: "Chiara lo è, ma un Rettore la leggerebbe come una sfida. Provi a trasformare la pretesa in una richiesta: che cosa chiede, e con quale tono?"
  - learner: "Allora: «Mi permetto di sottoporre alla Sua cortese attenzione la mia situazione, confidando che la domanda possa essere riesaminata»."
  - tutor: "Perfetto: ferma nella sostanza, impeccabile nella forma."
    goals: [tone]
  - learner: "E per chiudere? «Distinti saluti» va bene, o serve qualcosa di più solenne?"
  - tutor: "«Con osservanza» è la scelta più adatta; poi nome, qualifica e, in allegato, le prove del blocco della piattaforma. E naturalmente: in attesa di cortese riscontro."
    goals: [closing]

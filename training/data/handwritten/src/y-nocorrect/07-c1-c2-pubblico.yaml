# Set y-nocorrect, file 7: C1 and C2. Correct choices left alone: "non è che" + indicative,
# a fronted che-clause with the subjunctive, "testare", present in real conditionals, ce ne.
- scenario: modi-di-dire
  level: C1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, oggi me ne sono capitate di tutti i colori. Stamattina la sveglia non è suonata e sono arrivato al ristorante con un'ora di ritardo."
  - tutor: "Cominciamo bene! E scommetto che non è finita lì."
  - learner: "Magari! Il capo mi ha guardato storto: ce l'ha con me da settimane. A mezzogiorno, poi, avevo appena acceso i forni quando è saltata la corrente."
  - tutor: "Insomma, piove sul bagnato! E dopo?"
    goals: [tell]
  - learner: "Proprio così, piove sul bagnato. E non è finita: quando sono uscito, il vigile ha già scritto la multa per la macchina."
    errors: [tense-aspect]
  - tutor: "Che sfortuna! Però aspetta: «quando sono uscito, il vigile ha già scritto»? La multa c'era già prima che tu uscissi: che tempo ci vuole?"
    goals: [react]
    prompt: {text: "ha già scritto", tags: [tense-aspect]}
  - learner: "Sì, quando sono uscito il vigile ha già scritto la multa, e se n'era pure andato."
    errors: [tense-aspect]
  - tutor: "Ah, quindi il vigile aveva già scritto la multa e se n'era andato: nemmeno la soddisfazione di discutere! Ma alla fine, di chi è la colpa?"
    recast: {text: "ha già scritto", fix: "aveva già scritto", tags: [tense-aspect]}
  - learner: "Un po' mia, lo ammetto: la macchina l'avevo lasciata in divieto di sosta. Ma della sveglia e della corrente non mi si può dare la colpa!"
  - tutor: "Diciamo metà colpa tua e metà della sfortuna, che oggi ti ha preso di mira."
    goals: [blame]
  - learner: "E la morale? Che quando una giornata comincia storta, è meglio tornare a letto!"
  - tutor: "Oppure che non tutto il male vien per nuocere: almeno stasera l'aperitivo te lo offro io."
    goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, l'ho letta in treno. In pratica il governo vuole limitare gli affitti brevi nei centri storici, con un tetto di giorni all'anno per ogni appartamento."
  - tutor: "Esatto, novanta giorni, se ho capito bene. E tu da che parte stai?"
    goals: [summarise]
  - learner: "Secondo me è una buona idea, anche se non risolve tutto. A Milano gli studenti non trovano più una stanza, e chi ci vive da sempre viene spinto fuori."
  - tutor: "Sì, ma i piccoli proprietari? Per molti quell'affitto è uno stipendio."
  - learner: "Lo so, ed è il punto debole. Però mi sembra strano che nessuno ne ha parlato prima, visto che il problema c'è da anni."
    errors: [subjunctive-use]
  - tutor: "Vero, se ne parla da anni. Ma «mi sembra strano che nessuno ne ha parlato»? Dopo «mi sembra strano che», il modo è un altro."
    prompt: {text: "ne ha parlato", tags: [subjunctive-use]}
  - learner: "Hai ragione: mi sembra strano che nessuno ne abbia parlato prima."
  - tutor: "Esatto. E i giornali come l'hanno raccontata? Io ho trovato titoli diversissimi."
    goals: [opinion]
  - learner: "Un quotidiano ha scritto che la legge entrerà in vigore a gennaio, mentre un altro diceva che i comuni avrebbero potuto decidere da soli. Non so più a chi credere."
  - tutor: "Ecco, è proprio questo che mi fa diffidare: ogni testata tira acqua al suo mulino."
    goals: [sources]
  - learner: "E le conseguenze? Eventualmente molti proprietari affitteranno agli studenti, credo."
    errors: [false-friend]
  - tutor: "Alla fine molti proprietari affitteranno agli studenti, forse sì. Oppure lasceranno gli appartamenti vuoti, e allora saremo punto e a capo."
    goals: [consequences]
    recast: {text: "Eventualmente", fix: "Alla fine", tags: [false-friend]}

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Bastano cinque minuti. Vorremmo creare un'app per i nostri clienti, così possono ordinare i ricambi direttamente dal telefono, senza passare dal call center."
  - tutor: "Un'app. Ce ne sono già mille. Che cosa ci guadagniamo, concretamente?"
    goals: [pitch]
  - learner: "Oggi il call center gestisce trecento ordini al giorno, e il venti per cento contiene errori. Se il progetto funziona, gli errori si ridurrebbero quasi a zero."
    errors: [hypothetical]
  - tutor: "Numeri interessanti. Però, «se il progetto funziona, gli errori si ridurrebbero»: le due metà della frase non vanno d'accordo."
    prompt: {text: "si ridurrebbero", tags: [hypothetical]}
  - learner: "Giusto: se il progetto funziona, gli errori si ridurranno quasi a zero. E i dati ce li ha forniti il reparto vendite, non sono stime nostre."
  - tutor: "Bene. E in termini di fatturato?"
  - learner: "Contiamo su un aumento del cinque per cento il primo anno. Abbiamo già testato un prototipo con dodici clienti, e undici lo userebbero subito."
  - tutor: "D'accordo, ma il budget che mi chiede è il doppio di quello previsto. Chi mi garantisce che non lo sforeremo?"
    goals: [benefits]
  - learner: "È vero che il costo iniziale è alto. Proprio per questo proponiamo di procedere per fasi: se dopo tre mesi i risultati non ci sono, ci fermiamo e lei non avrà speso più di un terzo."
  - tutor: "Questo cambia le cose: un rischio limitato posso accettarlo."
    goals: [objection]
  - learner: "Allora, se è d'accordo, preparo un piano dettagliato della prima fase per la prossima settimana."
  - tutor: "Me lo mandi entro venerdì e ne parliamo lunedì con l'amministratore delegato. Buon lavoro."
    goals: [next-steps]

- scenario: reclamo-comune
  level: C1
  persona: es-f-erasmus
  history: [passive]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Sono qui per il cantiere in via Mazzini: è stato aperto due mesi fa e da allora nessuno ci ha più messo piede."
  - tutor: "Capisco. Mi sa dire esattamente che tipo di disagio crea?"
  - learner: "Il marciapiede è chiuso, quindi chi ha un passeggino o una carrozzina deve camminare in mezzo alla strada. E di sera non c'è nemmeno un lampione acceso."
  - tutor: "È una situazione seria. Purtroppo i lavori sono gestiti da una ditta esterna: io posso solo inoltrare la sua segnalazione."
    goals: [describe]
  - learner: "La segnalazione l'ho già fatta online a ottobre. Mi era stato detto che i lavori sarebbero finiti in tre settimane, e invece sono stati interrotto senza nessuna spiegazione."
    errors: [passive]
  - tutor: "Ne prendo nota. Solo un dettaglio, già che ci siamo: «sono stati interrotto»? Il participio deve accordarsi con lavori."
    prompt: {text: "sono stati interrotto", tags: [passive]}
  - learner: "Sì, sono stati interrotto e nessuno mi ha spiegato perché. Non è che posso aspettare in eterno, capisce?"
    errors: [passive]
  - tutor: "La capisco perfettamente: se i lavori sono stati interrotti senza spiegazioni, ha tutto il diritto di pretendere una risposta precisa."
    recast: {text: "sono stati interrotto", fix: "sono stati interrotti", tags: [passive]}
    goals: [insist]
  - learner: "Quali sono i miei diritti, in concreto? Posso presentare un reclamo formale?"
  - tutor: "Sì: può presentare un reclamo scritto all'ufficio tecnico, che è tenuto a rispondere entro trenta giorni."
    goals: [rights]
  - learner: "Allora lo presento adesso. Mi può dare un numero di protocollo, così posso fare un sollecito se non ricevo risposta?"
  - tutor: "Ecco a lei: protocollo numero 2418. E le assicuro che domani stesso chiamo l'ufficio tecnico per sapere quando riprendono i lavori."
    goals: [commitment]

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Esatto, il listino l'ho ricevuto lunedì. Capisco la situazione, ma un aumento del quindici per cento non ce lo possiamo permettere."
  - tutor: "Lo capisco, ma noi stessi paghiamo la carta il venti per cento in più rispetto all'anno scorso."
    goals: [problem]
  - learner: "Lavoriamo insieme da otto anni e non abbiamo mai saltato un pagamento. Credo che questo valga qualcosa."
  - tutor: "Vale moltissimo, e infatti a nessun altro cliente sto offrendo margini di trattativa."
    goals: [argue]
  - learner: "Allora le faccio una proposta. Vorremmo che il prezzo vecchio resta valido fino a giugno; poi accettiamo un aumento del sette per cento."
    errors: [subjunctive-use]
  - tutor: "La ascolto con interesse. Mi permetta però: «vorremmo che il prezzo resta valido»? Dopo un condizionale come vorremmo, quale tempo del congiuntivo serve?"
    prompt: {text: "resta valido", tags: [subjunctive-use]}
  - learner: "Sì, vorremmo che il prezzo resta valido fino a giugno, come dicevo."
    errors: [subjunctive-use]
  - tutor: "Chiaro: vorreste che il prezzo vecchio restasse valido fino a giugno. Giugno è troppo lontano, ma fino ad aprile posso farlo, con un aumento del nove per cento da maggio."
    goals: [counteroffer]
    recast: {text: "resta valido", fix: "restasse valido", tags: [subjunctive-use]}
  - learner: "Nove è ancora tanto. Facciamo otto, e da maggio raddoppiamo l'ordine delle vaschette. Se ci venite incontro, firmiamo un contratto di due anni."
  - tutor: "Otto per cento, ordine doppio e contratto di due anni: affare fatto. Le mando la conferma scritta entro stasera."
    goals: [agreement]

- scenario: turismo-di-massa
  level: C1
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno! Mi chiamo Emma, abito a Venezia da quattro anni e sono contraria. Secondo me il ticket è una tassa e basta."
  - tutor: "Contraria, quindi. Ma qualcosa bisognerà pur fare, non crede?"
    goals: [introduce]
  - learner: "Certo. Ma pensi alla mia calle: nel 2019 c'erano sei famiglie, adesso ce n'è una sola. Le altre si sono mosse a Mestre perché gli affitti brevi rendono di più."
    errors: [false-friend]
  - tutor: "Quindi le famiglie si sono trasferite a Mestre e le case sono diventate alloggi per turisti: un esempio molto concreto. Però il ticket almeno riduce la folla nei giorni di punta, no?"
    goals: [example]
    recast: {text: "si sono mosse", fix: "si sono trasferite", tags: [false-friend]}
  - learner: "Non penso che il ticket risolve il problema. Chi viene per un giorno paga cinque euro e viene lo stesso."
    errors: [subjunctive-use]
  - tutor: "Lei è molto netta. Ma per i nostri ascoltatori: «non penso che il ticket risolve»? Dopo «non penso che», quale modo usiamo?"
    prompt: {text: "il ticket risolve", tags: [subjunctive-use]}
  - learner: "Giusto: non penso che il ticket risolva il problema. I dati del primo anno lo dimostrano: le presenze sono rimaste quasi uguali."
  - tutor: "Esatto. E allora lei che cosa propone, in concreto?"
    goals: [rebut]
  - learner: "Limitare gli affitti brevi e dare incentivi a chi affitta ai residenti. Se tornano le famiglie, torna anche la città."
  - tutor: "Una proposta chiara: meno affitti brevi, più residenti. Grazie per la telefonata, e alla prossima!"
    goals: [proposal]

- scenario: assemblea-condominio
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Premetto che non sono contraria ai lavori, sia chiaro. Quello che chiedo è che si rimandi la facciata di un anno, perché molte famiglie quest'anno non ce la fanno."
  - tutor: "Posizione esposta con garbo, gliene do atto. Però il signore del terzo piano mormora che chi vuole rimandare è sempre chi non vuole pagare. Che cosa gli risponde?"
    goals: [position]
  - learner: "Che i ponteggi costino una fortuna lo sappiamo tutti. Io ho sempre pagato le rate puntualmente, quindi il sospetto lo rimando al mittente, con tutta la cortesia del caso."
  - tutor: "Risposta pacata ma ferma: mi pare che il signore l'abbia incassata. Rimandare e basta, però, non risolve nulla: il tetto continua a perdere. Ha un'alternativa concreta?"
    goals: [defuse]
  - learner: "Sì. Ripariamo subito il tetto, che è l'urgenza vera, e la facciata la spalmiamo su tre anni, con rate più leggere. Mi sembra la soluzione più sensibile, anche per chi ha poca liquidità."
    errors: [false-friend]
  - tutor: "È senz'altro la soluzione più sensata, e vedo parecchie teste che annuiscono. Qualcuno però teme che, rimandando, i prezzi salgano: accetterebbe di bloccare il preventivo con una scadenza precisa?"
    goals: [alternative]
    recast: {text: "sensibile", fix: "sensata", tags: [false-friend]}
  - learner: "Certo. Avrei voluto che l'amministrazione ci informi prima di questi costi, ma meglio tardi che mai: blocchiamo il preventivo entro gennaio."
    errors: [subjunctive-use]
  - tutor: "D'accordo sulla data. Prima di verbalizzare, però: «avrei voluto che l'amministrazione ci informi»? Con quel condizionale passato, la concordanza chiede un altro tempo."
    prompt: {text: "ci informi", tags: [subjunctive-use]}
  - learner: "Ha ragione: avrei voluto che l'amministrazione ci informasse prima. Ma lo dico senza polemica."
  - tutor: "Preso atto, e senza polemica. Metto a verbale: tetto subito, facciata in tre rate annuali, preventivo bloccato entro gennaio. Per una volta usciamo di qui con un accordo, e prima di mezzanotte."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Eccomi qua, in carne e ossa! Spero di non deludervi. Che profumo, però: questo è stracotto, se non sbaglio?"
  - tutor: "Ha naso! Stracotto al Chianti, ricetta di mia suocera. Mia figlia dice che Lei di cucina se ne intende."
  - learner: "Un po', sì: faccio il cuoco a Bologna da dieci anni. E glielo dico da cuoco: la carne è cotta alla perfezione, tenera ma non sfatta."
  - tutor: "Detto da un professionista, lo prendo come un'onorificenza: mia moglie ne andrà fiera per settimane. E i suoi progetti, se non sono indiscreto?"
    goals: [compliment]
  - learner: "Per niente. Fra un paio d'anni penso di aprire un locale mio, piccolo, con pochi coperti. Non so se Giulia gliel'ha detto, ma ci tengo a fare le cose per bene, senza fretta."
  - tutor: "Un ristorante, nientemeno. Spero solo che non ci porti via la figlia per metterla a lavare i piatti!"
    goals: [background]
  - learner: "Su questo può stare tranquillo: i piatti li lavo io, è il destino dei cuochi. Giulia invece terrà i conti, e meglio di me."
  - tutor: "Ah, quindi comanderà lei. Buon segno: in questa casa funziona allo stesso modo da quarant'anni."
    goals: [irony]
  - learner: "Allora sono in buona compagnia. Grazie, sei davvero molto gentile ad avermi invitato."
    errors: [register]
  - tutor: "Oh, già al tu? Non che mi dispiaccia, ma di solito, in questa casa, è il padrone di casa a proporlo."
    prompt: {text: "sei davvero molto gentile", tags: [register]}
  - learner: "Mi scusi, mi è scappato! È davvero molto gentile ad avermi invitato."
  - tutor: "Ma si figuri, anzi: mi ha dato un'idea. Visto che, a quanto pare, entrerà in famiglia, che ne dice se ci diamo del tu?"
  - learner: "Con piacere, ne sono onorato. Allora, se posso, ti chiedo un'altra fetta di stracotto."
  - tutor: "Ecco, adesso sì che sei di famiglia! Te la servo subito, e abbondante."
    goals: [tu-lei]

# Set y-nocorrect, file 6: B2 and C1. Correct choices left alone: real conditionals with the
# present, "ammetto che" + indicative, "me l'avevano detto che", ci ho messo, ne ho viste tante.
- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri un po'. È vero che alcuni lavori spariranno, ma ne nasceranno altri."
  - tutor: "Sì, ma chi perde il lavoro a cinquant'anni non trova un altro lavoro dall'oggi al domani."
    goals: [opinion]
  - learner: "Questo è vero. Però se lo Stato investe nella formazione, la gente si adatta. È sempre successo."
  - tutor: "Ammettiamo pure. E tu, se fossi un ragazzo di oggi, cosa faresti?"
  - learner: "Se avrei vent'anni, studierei informatica, o forse farei un lavoro manuale."
    errors: [hypothetical]
  - tutor: "Interessante. Ma «se avrei»? Dopo quel se, il condizionale non va."
    prompt: {text: "Se avrei", tags: [hypothetical]}
  - learner: "Sì, se avrei vent'anni, farei così."
    errors: [hypothetical]
  - tutor: "Beh, se avessi vent'anni anch'io, forse farei lo stesso. Ma perché proprio un lavoro con le mani?"
    recast: {text: "se avrei", fix: "se avessi", tags: [hypothetical]}
    goals: [hypothesis]
  - learner: "Perché alcune cose una macchina non le sa fare. Io faccio il cuoco: un robot che cucina come mia nonna non l'ho ancora visto!"
  - tutor: "Ah, su questo ti do ragione: il ragù di mia nonna nessun robot lo farà mai uguale."
    goals: [example]
  - learner: "Quindi siamo d'accordo: la tecnologia cambia i lavori, ma non li cancella tutti."
  - tutor: "Diciamo che mi hai convinto a metà. Però beviamo lo stesso alla salute delle nonne!"
    goals: [conclude]

- scenario: recensione-ristorante
  level: B2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Sì, purtroppo. Abbiamo aspettato quaranta minuti per i primi, e quando sono arrivati erano tiepidi."
  - tutor: "Mi dispiace davvero, non è il nostro livello. Mi racconta meglio?"
    goals: [complain]
  - learner: "Le tagliatelle le avevamo chieste al dente, ma erano scotte. E il secondo l'abbiamo dovuto rimandare in cucina."
  - tutor: "Capisco, una serata da dimenticare. È la prima volta che viene da noi?"
    goals: [detail]
  - learner: "No, veniamo spesso, per questo ci sono rimasta male. Avrei voluto che qualcuno ci spiegava il motivo del ritardo."
    errors: [subjunctive-use]
  - tutor: "Ha perfettamente ragione. Mi permetta solo una piccola nota: «avrei voluto che qualcuno ci spiegava»? Dopo «avrei voluto che», quale modo serve?"
    prompt: {text: "ci spiegava", tags: [subjunctive-use]}
  - learner: "Sì, avrei voluto che qualcuno ci spiegava, almeno."
    errors: [subjunctive-use]
  - tutor: "È giusto: avrebbe voluto che qualcuno spiegasse il motivo, e invece nessuno è venuto al tavolo. Che cosa si aspettava da noi?"
    recast: {text: "spiegava", fix: "spiegasse", tags: [subjunctive-use]}
  - learner: "Da un ristorante come il vostro mi aspettavo che il servizio fosse più attento, tutto qui."
  - tutor: "Ha ragione, e me ne scuso. Per questo la cena di stasera la offriamo noi, e la prossima volta il dolce è a nostro carico."
    goals: [expectation, resolve]
  - learner: "È molto gentile, grazie. Allora torneremo, e speriamo che le tagliatelle siano al dente!"
  - tutor: "Glielo garantisco io: le controllerò personalmente. Buona serata!"

- scenario: trattativa-affitto
  level: B2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto. È luminoso, silenzioso e la zona mi piace. Il canone però è un po' alto: milletrecento euro sono tanti."
  - tutor: "Capisco, ma è un prezzo in linea con il quartiere. E poi è trattabile, entro certi limiti."
    goals: [interest]
  - learner: "Allora le faccio una proposta: milleduecento, e firmo un contratto di quattro anni. È possibile che il proprietario accetta?"
    errors: [subjunctive-use]
  - tutor: "Una proposta seria, la apprezzo. Ma ripeta la domanda: «è possibile che il proprietario accetta»? Dopo «è possibile che», quale modo serve?"
    prompt: {text: "il proprietario accetta", tags: [subjunctive-use]}
  - learner: "Sì, è possibile che il proprietario accetta la mia proposta?"
    errors: [subjunctive-use]
  - tutor: "È possibile che il proprietario accetti, sì, soprattutto se gli garantisce la durata. Glielo chiedo oggi stesso."
    recast: {text: "il proprietario accetta", fix: "il proprietario accetti", tags: [subjunctive-use]}
    goals: [negotiate]
  - learner: "Perfetto. E la provvigione dell'agenzia? Se la togliete o almeno la riducete, firmo anche domani."
  - tutor: "La provvigione è di un mese, ma posso chiederne solo la metà. La garanzia invece resta di tre mesi."
    goals: [conditions]
  - learner: "Tre mesi di garanzia vanno bene. Sono sicuro che troveremo un accordo."
  - tutor: "Lo penso anch'io. La chiamo domani mattina con la risposta del proprietario e, se è sì, prepariamo il contratto."
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Per amore, come tanti! Ero venuta a Bologna per un Erasmus e alla fine ci sono rimasta."
  - tutor: "Una storia che ai nostri ascoltatori piacerà. E com'è stato l'inizio?"
    goals: [story]
  - learner: "I primi mesi sono stati durissimi. Non conoscevo nessuno e per il permesso di soggiorno ho dovuto fare un sacco di gestioni."
    errors: [false-friend]
  - tutor: "Eh, le pratiche per il permesso di soggiorno sono un classico, purtroppo! E come ne è uscita?"
    goals: [difficulties]
    recast: {text: "gestioni", fix: "pratiche", tags: [false-friend]}
  - learner: "Con pazienza, e con l'aiuto di una vicina che mi accompagnava in questura. Se non l'avessi conosciuta, forse sarei tornata in Spagna."
  - tutor: "Che fortuna! E oggi, che cosa è cambiato rispetto ai primi tempi?"
  - learner: "Adesso mi sento a casa, anche se a volte mi manca il mare. Sono contenta che i miei genitori sono venuti a trovarmi l'estate scorsa: hanno capito perché sono rimasta."
    errors: [subjunctive-use]
  - tutor: "Bellissimo. Però, «sono contenta che i miei genitori sono venuti»: dopo un'emozione come «sono contenta che», quale modo usiamo?"
    prompt: {text: "i miei genitori sono venuti", tags: [subjunctive-use]}
  - learner: "Sì, sono contenta che i miei genitori sono venuti, davvero."
    errors: [subjunctive-use]
  - tutor: "Si capisce: è bello che i suoi genitori siano venuti a vedere la sua nuova vita. E che consiglio darebbe a chi sta pensando di trasferirsi in Italia?"
    recast: {text: "sono venuti", fix: "siano venuti", tags: [subjunctive-use]}
    goals: [change]
  - learner: "Di imparare la lingua prima di partire, e di non prendersela con la burocrazia: è uguale per tutti!"
  - tutor: "Un consiglio saggio e divertente. Grazie di essere stata con noi!"
    goals: [advice]

- scenario: club-lettura
  level: C1
  persona: en-f-student
  history: [conditional-form]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, ce l'ho fatta, ma ci ho messo due settimane. All'inizio è lento, poi non riuscivo più a smettere."
  - tutor: "Succede spesso con i romanzi che partono piano. Quindi, nel complesso, ti è piaciuto?"
  - learner: "Sì, molto, anche se il finale me l'aspettavo diverso. Mi ha fatto realizzare quanto conta il silenzio in una famiglia."
    errors: [word-choice]
  - tutor: "Ti ha fatto capire quanto conta il silenzio, sì: è il cuore del libro. Quello che i personaggi non si dicono pesa più di tutto il resto. E il protagonista?"
    goals: [impression]
    recast: {text: "realizzare", fix: "capire", tags: [word-choice]}
  - learner: "Il protagonista non l'ho mai sopportato. Al posto di Elena, io l'avessi lasciato al primo capitolo."
    errors: [conditional-form]
  - tutor: "Severa! Però attenta: «io l'avessi lasciato» è metà di una frase con il se. Qui, da sola, quale forma ci vuole?"
    prompt: {text: "io l'avessi lasciato", tags: [conditional-form]}
  - learner: "Hai ragione: io l'avrei lasciato al primo capitolo, senza pensarci due volte."
  - tutor: "Ecco, così sì. Eppure io lo trovo umanissimo: sbaglia tutto, ma si capisce sempre perché."
    goals: [character]
  - learner: "Forse. Mi sembra che l'autrice abbia voluto proprio questo: farci odiare qualcuno che ci somiglia. Lo stile invece è la cosa migliore: frasi brevi, quasi secche."
  - tutor: "Concordo, è uno stile asciutto ma mai freddo. A chi lo consiglieresti?"
    goals: [style]
  - learner: "Lo consiglierei, ma non a tutti: a chi ha pazienza e non ha bisogno di colpi di scena."
  - tutor: "Allora lo proporrò al gruppo del giovedì, che di pazienza ne ha da vendere."
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco la paura, ma secondo me è esagerata. Io ho fatto l'ingegnere per quarant'anni e ne ho viste tante, di rivoluzioni."
  - tutor: "Sì, ma questa è diversa: le macchine adesso scrivono, disegnano, perfino ragionano, o così sembra."
    goals: [position]
  - learner: "Anche quando sono arrivati i computer negli uffici si diceva che saremmo rimasti tutti senza lavoro. Invece i lavori sono cambiati, e ne sono nati di nuovi."
  - tutor: "D'accordo, ma allora ci sono voluti decenni. Qui parliamo di pochi anni."
    goals: [evidence]
  - learner: "Non dico che non ci siano rischi. Se i governi investirebbero nella formazione, però, il passaggio sarebbe molto meno doloroso."
    errors: [hypothetical]
  - tutor: "Su questo forse hai ragione. Ma fermati un attimo: «se i governi investirebbero»? Che cosa ci va dopo il se, in un'ipotesi del genere?"
    prompt: {text: "investirebbero", tags: [hypothetical]}
  - learner: "Sì, se i governi investirebbero nella formazione, intendo."
    errors: [hypothetical]
  - tutor: "Ho capito: se i governi investissero davvero nella formazione, sarei meno pessimista anch'io. Ma tu conosci un governo che pensa a lungo termine?"
    recast: {text: "investirebbero", fix: "investissero", tags: [hypothetical]}
  - learner: "Bella domanda. Ammetto che la politica è lenta, e che chi ha cinquant'anni rischia più di tutti."
  - tutor: "Ecco, almeno questo me lo concedi!"
    goals: [concede]
  - learner: "Te lo concedo. Ma resto convinto che, alla fine, il lavoro non sparirà: cambierà faccia, come sempre."
  - tutor: "Speriamo che tu abbia ragione. Intanto, per sicurezza, mi iscrivo a un corso di aggiornamento!"
    goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Per caso, come tutte le cose belle. Ero partito per un mese di viaggio e non me ne sono più andato. Sono passati sei anni!"
  - tutor: "Un classico! E perché proprio l'Italia, e non la Spagna o la Grecia?"
  - learner: "Avevo già girato mezza Europa, ma a Bologna è scattato qualcosa. Me l'avevano detto tutti che si mangiava bene, ma non pensavo fino a questo punto."
  - tutor: "Ah, la cucina bolognese ha conquistato più di un viaggiatore. E lo shock culturale più grande?"
    goals: [story]
  - learner: "Gli orari! Prima di venire qui, non sono mai stato in un paese dove si cena alle nove di sera."
    errors: [tense-aspect]
  - tutor: "Ti capisco benissimo. Ma aspetta: «prima di venire qui, non sono mai stato»? Parli di un passato che viene prima di un altro passato."
    prompt: {text: "non sono mai stato", tags: [tense-aspect]}
  - learner: "Giusto: prima di venire qui, non ero mai stato in un paese dove si cena alle nove."
  - tutor: "Perfetto. E adesso, a che ora ceni?"
    goals: [culture-shock]
  - learner: "Alle nove, ovviamente! Mi sono adattato. Però una cosa non la sopporto: la burocrazia. Per avere il codice fiscale ci ho messo tre mesi."
  - tutor: "Su questo, purtroppo, non posso prendere le nostre difese. E che cosa diresti a un irlandese che vuole trasferirsi qui?"
    goals: [critique]
  - learner: "Di venire senza fretta e senza troppe aspettative. E di imparare a dire «pazienza» con il tono giusto!"
  - tutor: "Consiglio d'oro! Grazie mille, è stato un piacere averti qui."
    goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Si figuri, ha fatto bene a venire. Si sieda e mi racconti con calma."
  - tutor: "Ecco... il report sui clienti l'ho preparato io, per settimane. Ieri Marco l'ha presentato come se fosse tutto merito suo, e nessuno ha detto niente."
  - learner: "Mi dispiace molto che lei si è sentita messa da parte. Me ne sono accorta anch'io: c'era tensione."
    errors: [subjunctive-use]
  - tutor: "Grazie, lo apprezzo. Una piccola cosa, visto che ci stiamo esercitando: «mi dispiace che lei si è sentita»? Dopo «mi dispiace che», quale modo serve?"
    prompt: {text: "si è sentita", tags: [subjunctive-use]}
  - learner: "Ha ragione: mi dispiace che lei si sia sentita messa da parte."
  - tutor: "Ecco. E non è la prima volta, sa? Anche il mese scorso è successa una cosa simile."
    goals: [listen]
  - learner: "Capisco. Mi aiuti a capire bene: Marco ha detto esplicitamente che l'idea era sua, o semplicemente non ha citato il suo contributo?"
  - tutor: "Non l'ha detto esplicitamente, ma non mi ha nominata neanche una volta. È questo che mi ha ferita."
    goals: [clarify]
  - learner: "Conosco Marco da anni: non credo che l'abbia fatto a proposito. Tende a parlare a nome di tutto il gruppo, ma questo non giustifica niente."
    errors: [false-friend]
  - tutor: "Forse non l'ha fatto apposta, ma il risultato non cambia: davanti al direttore il lavoro sembra suo."
    goals: [perspective]
    recast: {text: "a proposito", fix: "apposta", tags: [false-friend]}
  - learner: "Ha ragione. Le propongo questo: alla prossima riunione presenterà lei la seconda parte del report, e d'ora in poi ogni documento porterà i nomi di chi l'ha scritto. Con Marco ne parlo io, oggi stesso."
  - tutor: "Mi sembra giusto, la ringrazio. Mi sento già più tranquilla."
    goals: [solution]

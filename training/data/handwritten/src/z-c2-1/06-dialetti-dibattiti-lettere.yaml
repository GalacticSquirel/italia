# Round 4, set z-c2-1, file 6: regional speech, a city debate, a letter to the Rector.
- scenario: dialetti-regionali
  level: C2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Più o meno: in spagnolo ci sono parole simili. Ho capito che parlavano del figlio, che è constipato, e ho notato che le vocali finali quasi non si sentono."
      errors: [false-friend]
    - tutor: "Raffreddato, vorrai dire! «Costipato», in italiano, è un problema di tutt'altro tipo, e a Napoli ci avrebbero riso su per una settimana. Hai sentito qualche altra espressione?"
      recast: {text: "constipato", fix: "raffreddato", tags: [false-friend]}
      goals: [notice]
    - learner: "Sì, uno dei due ha detto «stamme bbuono», che credo sia un saluto. È un'espressione di cui non conosco l'origine."
    - tutor: "Vuol dire «stammi bene», un saluto affettuoso. Viene dritta dal latino parlato, come quasi tutto il napoletano."
      goals: [example]
    - learner: "Quindi il napoletano non è un italiano sbagliato, ma una lingua a che l'italiano deve parecchio."
      errors: [relative-pronoun]
    - tutor: "Proprio così. Però «una lingua a che l'italiano deve»: dopo la preposizione, quel relativo non regge."
      prompt: {text: "una lingua a che", tags: [relative-pronoun]}
    - learner: "Ah... una lingua alla che l'italiano deve parecchio?"
      errors: [relative-pronoun]
    - tutor: "Esatto, una lingua a cui l'italiano deve parecchio: pensa a «pizza», a «scugnizzo», a tutte le canzoni. Ma andrebbe protetta, secondo te?"
      recast: {text: "una lingua alla che", fix: "una lingua a cui", tags: [relative-pronoun]}
      goals: [standard]
    - learner: "Sì, ma non so se sia compito della scuola. Forse basterebbe che i genitori non si vergognassero di parlarla con i figli."
    - tutor: "Sono d'accordo con te: le lingue si salvano in cucina più che in classe. E a casa mia, ti assicuro, nessuno se ne vergogna."
      goals: [opinion]

- scenario: dialetti-regionali
  level: C2
  persona: en-m-retired
  history: [word-choice]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Neanche una parola, a dire il vero! Ma ho notato che parlavano con le mani almeno quanto con la bocca. E uno continuava a dire «jamme»: che cosa vuol dire?"
    - tutor: "Ah, la gestualità: a Napoli è una seconda grammatica. «Jamme» vuol dire «andiamo», come nella canzone «Funiculì funiculà»."
      goals: [notice, example]
    - learner: "Ma certo, la canzone! Pensa che da giovane ho atteso un corso di napoletano a Londra, ma ho imparato solo quella."
      errors: [false-friend]
    - tutor: "Hai frequentato un corso di napoletano a Londra? Questa è nuova! Almeno la canzone giusta l'hai imparata."
      recast: {text: "atteso un corso", fix: "frequentato un corso", tags: [false-friend]}
    - learner: "Ma la gente qui parla dialetto perché è poco educata, o per scelta?"
      errors: [false-friend]
    - tutor: "Poco istruita? No, anzi: qui anche i professori universitari parlano napoletano a casa. È una scelta d'identità, non un limite."
      recast: {text: "poco educata", fix: "poco istruita", tags: [false-friend]}
    - learner: "Allora è come in Scozia: lo scots è venuto considerato per secoli una lingua da contadini."
      errors: [passive]
    - tutor: "Paragone azzeccato. Ma «è venuto considerato», con il passato prossimo, ti sembra che regga?"
      prompt: {text: "è venuto considerato", tags: [passive]}
    - learner: "No, hai ragione: è stato considerato per secoli una lingua da contadini, e oggi invece lo si insegna perfino all'università."
    - tutor: "Esattamente come il napoletano, che ormai ha le sue cattedre. E tu, pensi che i dialetti vadano protetti?"
      goals: [standard]
    - learner: "Sì, ma con equilibrio: se un bambino parla solo dialetto, a scuola rischia di restare indietro. L'ideale sarebbe crescere bilingui, come i miei nipoti a Glasgow."
    - tutor: "Bilingui, ecco la parola giusta: il dialetto in cortile e l'italiano in classe, senza vergogna né per l'uno né per l'altro."
      goals: [opinion]

- scenario: dibattito-ambiente
  level: C2
  persona: en-f-professional
  history: [relative-pronoun]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Non sono d'accordo. Penso che chiudere il centro alle auto è l'unico modo per renderlo di nuovo vivibile."
      errors: [subjunctive-use]
    - tutor: "Posizione netta. Ma riascolti: «penso che chiudere il centro è». Dopo un verbo d'opinione, quel modo La convince?"
      prompt: {text: "Penso che chiudere il centro alle auto è", tags: [subjunctive-use]}
    - learner: "Ha ragione: penso che chiudere il centro alle auto sarebbe l'unico modo per renderlo di nuovo vivibile."
    - tutor: "Va bene. Ma mi porti degli argomenti, non solo delle speranze."
      goals: [position]
    - learner: "Primo, l'inquinamento: in via Garibaldi le polveri sottili rompono i limiti quasi duecento giorni l'anno. Secondo, i negozi: nelle città che l'hanno fatto, il commercio è aumentato, non diminuito."
      errors: [word-choice]
    - tutor: "Se le polveri sottili superano i limiti duecento giorni l'anno, il problema esiste, lo ammetto. Ma gli anziani che abitano in centro come faranno a muoversi? Non tutti possono prendere la bicicletta."
      recast: {text: "rompono i limiti", fix: "superano i limiti", tags: [word-choice]}
      goals: [argue]
    - learner: "Per loro si potrebbe prevedere un servizio di navette elettriche, di cui l'efficacia è dimostrata in molte città europee."
      errors: [relative-pronoun]
    - tutor: "Proposta concreta. Però «di cui l'efficacia»: esiste un relativo che si mette proprio davanti a efficacia, e la frase diventa più elegante."
      prompt: {text: "di cui l'efficacia", tags: [relative-pronoun]}
    - learner: "Ah, sì: un servizio le cui efficacia è dimostrata."
      errors: [relative-pronoun]
    - tutor: "Un servizio la cui efficacia è dimostrata, d'accordo. Ma chi lo paga? Il bilancio del Comune è già in rosso."
      recast: {text: "le cui efficacia", fix: "la cui efficacia", tags: [relative-pronoun]}
      goals: [counter]
    - learner: "Su questo ha ragione: i costi sono un problema reale. Potremmo cominciare con una chiusura solo nei fine settimana e valutare i risultati dopo sei mesi."
    - tutor: "Una sperimentazione nei fine settimana: su questo posso essere d'accordo anch'io. Proponiamola insieme al prossimo consiglio di quartiere."
      goals: [concede]

- scenario: dibattito-ambiente
  level: C2
  persona: es-m-worker
  history: [hypothetical]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io la vedo diversamente. Sono commerciante anch'io, ma credo che la zona pedonale porterebbe più clienti, non meno."
    - tutor: "Interessante, detto da un commerciante. Su che cosa si basa?"
      goals: [position]
    - learner: "La gente a piedi si ferma davanti alle vetrine, chi è in macchina no. E sono sicuro che i clienti tornerebbero se si darebbe loro un centro più tranquillo."
      errors: [hypothetical]
    - tutor: "Il primo argomento mi colpisce. Sul secondo, però: «se si darebbe»? Dopo se, quel condizionale non va."
      prompt: {text: "se si darebbe", tags: [hypothetical]}
    - learner: "Se si desse loro un centro più tranquillo, voglio dire. Oggi le famiglie scappano verso i centri commerciali."
    - tutor: "Va bene, i Suoi argomenti reggono. Ma i residenti anziani come faranno con la spesa, senza macchina?"
      goals: [argue]
    - learner: "Non è conveniente lasciarli soli, è vero. Ma si potrebbe organizzare un servizio di consegne a domicilio gestito dai negozi stessi."
      errors: [false-friend]
    - tutor: "Non è opportuno lasciarli soli, appunto, e l'idea delle consegne mi incuriosisce. Ma chi pagherebbe i fattorini?"
      recast: {text: "Non è conveniente", fix: "Non è opportuno", tags: [false-friend]}
      goals: [counter]
    - learner: "Su questo ha ragione, i costi non sono pochi. Propongo una prova di sei mesi, solo il sabato e la domenica, con le spese divise tra Comune e commercianti."
    - tutor: "Una prova limitata nel tempo e nei costi: così anche gli scettici come me possono giudicare dai fatti."
      goals: [concede]

- scenario: dibattito-ambiente
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Ma dai, un disastro? Secondo me è una bufala che i negozi ci perdono."
      errors: [register]
    - tutor: "Capisco la foga, ma siamo in un'assemblea pubblica: «ma dai», «una bufala»... Come lo direbbe al microfono?"
      prompt: {text: "Ma dai, un disastro? Secondo me è una bufala", tags: [register]}
    - learner: "Mi scusi. Volevo dire che non credo che i negozi ci perderebbero, anzi."
    - tutor: "Così è più efficace. E su che cosa si basa?"
      goals: [position]
    - learner: "Il primo argomento è la salute, di cui nessuno ne parla mai in queste riunioni."
      errors: [ci-ne]
    - tutor: "Argomento importante. Ma «di cui nessuno ne parla»: in quella frase c'è una parola che dice due volte la stessa cosa."
      prompt: {text: "di cui nessuno ne parla", tags: [ci-ne]}
    - learner: "Giusto: la salute, di cui nessuno parla mai. Il secondo è il turismo: un centro senza auto attira visitatori che spendono."
    - tutor: "Il turismo, d'accordo. Ma chi abita fuori e lavora in centro? Dovrà alzarsi un'ora prima."
      goals: [argue]
    - learner: "Per loro ci vorrebbero più autobus e parcheggi di scambio. E comunque, se il Comune avrebbe investito nei mezzi pubblici dieci anni fa, oggi non saremmo qui a discutere."
      errors: [hypothetical]
    - tutor: "Stoccata efficace. Però: «se il Comune avrebbe investito»? Lì il periodo ipotetico zoppica."
      prompt: {text: "se il Comune avrebbe investito", tags: [hypothetical]}
    - learner: "Se il Comune investiva dieci anni fa, intendo."
      errors: [hypothetical]
    - tutor: "Se il Comune avesse investito dieci anni fa, certo, e su questo nessuno La contraddice. Ma c'è qualcosa che concede a chi la pensa come me?"
      recast: {text: "Se il Comune investiva", fix: "Se il Comune avesse investito", tags: [hypothetical]}
      goals: [counter]
    - learner: "Sì: chiudere tutto subito sarebbe troppo brusco. Potremmo partire da due vie, e allargare la zona pedonale solo se i dati sul commercio saranno positivi."
    - tutor: "Due vie e dei dati alla mano: è un compromesso che posso firmare anch'io."
      goals: [concede]

- scenario: email-rettore
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il mio contratto di ricerca non è venuto rinnovato, benché il dipartimento abbia votato a favore."
      errors: [passive]
    - tutor: "Mi dispiace. Ma «non è venuto rinnovato»: con il passato prossimo, quel venire non funziona."
      prompt: {text: "non è venuto rinnovato", tags: [passive]}
    - learner: "Non è stato rinnovato, appunto. Vorrei chiedere al Rettore di riesaminare la decisione."
    - tutor: "Chiaro. Partiamo dall'intestazione: come pensava di rivolgersi a lui?"
      goals: [situation]
    - learner: "Pensavo di scrivere «Caro Rettore» e poi di andare subito al punto."
      errors: [register]
    - tutor: "Al punto ci arriviamo, ma «Caro Rettore» qui sarebbe un passo falso: per i rettori esiste una formula tradizionale, piuttosto solenne."
      prompt: {text: "Caro Rettore", tags: [register]}
    - learner: "Ah, «Magnifico Rettore»! L'avevo sentito alla cerimonia di laurea, ma pensavo che fosse ironico."
    - tutor: "Niente affatto ironico, è d'obbligo. Bene: e la frase centrale, come l'aveva pensata?"
      goals: [opening-formula]
    - learner: "Così: «La decisione è ingiusta e pretendo una spiegazione»."
      errors: [register]
    - tutor: "Il contenuto è legittimo, il tono molto meno. Come potrebbe dire la stessa cosa senza mettere il Rettore sulla difensiva?"
      prompt: {text: "La decisione è ingiusta e pretendo una spiegazione", tags: [register]}
    - learner: "Forse: «La decisione è ingiusta, e Le chiedo una spiegazione»?"
      errors: [register]
    - tutor: "Proverei con «La decisione appare poco equa», e poi «Le sarei grata per un chiarimento»: il messaggio resta fermo, ma è cortese."
      recast: {text: "La decisione è ingiusta", fix: "La decisione appare poco equa", tags: [register]}
      goals: [tone]
    - learner: "Perfetto. E per chiudere pensavo a «In attesa di un Suo cortese riscontro, porgo distinti saluti»."
    - tutor: "Impeccabile. Aggiunga titolo, nome e recapito, e la lettera è pronta per il protocollo."
      goals: [closing]

- scenario: email-rettore
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Mi hanno esclusa dal bando per le borse di ricerca perché il mio titolo spagnolo non è stato riconosciuto. Eppure l'anno scorso la stessa università l'aveva riconosciuto senza problemi."
    - tutor: "Una contraddizione evidente, che conviene far notare con eleganza. Come pensava di cominciare?"
      goals: [situation]
    - learner: "«Magnifico Rettore», e poi: «Mi rivolgo a Lei affinché la decisione viene rivista»."
      errors: [subjunctive-use]
    - tutor: "L'apertura è perfetta. Ma «affinché la decisione viene rivista»: affinché non tollera l'indicativo."
      prompt: {text: "affinché la decisione viene rivista", tags: [subjunctive-use]}
    - learner: "Allora: «affinché la decisione è rivista»?"
      errors: [subjunctive-use]
    - tutor: "Scriviamo così: «Mi rivolgo a Lei affinché la decisione venga rivista». Poi però va spiegato il motivo, senza accusare nessuno."
      recast: {text: "affinché la decisione è rivista", fix: "affinché la decisione venga rivista", tags: [subjunctive-use]}
      goals: [opening-formula]
    - learner: "Pensavo a: «Mi permetto di segnalare che il medesimo titolo era stato riconosciuto dall'Ateneo nel precedente anno accademico». È abbastanza cortese?"
    - tutor: "È perfetto: fermo, documentato e senza accuse. Il Rettore non potrà ignorarlo."
      goals: [tone]
    - learner: "E per chiudere: «Ringraziando per l'attenzione, Le mando cordiali saluti»?"
      errors: [word-choice]
    - tutor: "Quasi: «Le porgo cordiali saluti» va benissimo, anche se con un Rettore molti preferiscono «distinti»."
      recast: {text: "Le mando cordiali saluti", fix: "Le porgo cordiali saluti", tags: [word-choice]}
      goals: [closing]
    - learner: "Allora metto «distinti saluti»: meglio abbondare in formalità che rischiare."
    - tutor: "Saggia scelta. La firmi, la protocolli entro venerdì e mi faccia sapere la risposta."

- scenario: email-rettore
  level: C2
  persona: en-m-traveller
  history: [passive]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Il mio progetto è stato escluso dai finanziamenti per un errore formale: secondo l'ufficio, la domanda sarebbe arrivata con un giorno di ritardo, ma ho la ricevuta che dimostra il contrario."
    - tutor: "Allora abbiamo un argomento solido. Come vorrebbe aprire la lettera?"
      goals: [situation]
    - learner: "Pensavo: «Gentile Rettore, Le scrivo per un problema»."
      errors: [register]
    - tutor: "«Gentile» va bene con un collega, ma per il Rettore c'è un'apertura più solenne. E «un problema» è un po' vago, non trova?"
      prompt: {text: "Gentile Rettore, Le scrivo per un problema", tags: [register]}
    - learner: "Allora: «Magnifico Rettore, mi permetto di rivolgermi alla Sua cortese attenzione in merito all'esclusione del mio progetto»."
    - tutor: "Ottimo, così si apre una lettera al Rettore. Poi?"
      goals: [opening-formula]
    - learner: "Poi spiego che la domanda è venuta inviata il 3 marzo, cioè entro il termine."
      errors: [passive]
    - tutor: "Bene il contenuto. Ma la domanda, il 3 marzo... con il passato prossimo passivo, quale ausiliare ci vuole?"
      prompt: {text: "è venuta inviata", tags: [passive]}
    - learner: "La domanda era venuta inviata il 3 marzo?"
      errors: [passive]
    - tutor: "Sì: «la domanda era stata inviata il 3 marzo, entro il termine previsto», con la ricevuta allegata. E la richiesta finale?"
      recast: {text: "era venuta inviata", fix: "era stata inviata", tags: [passive]}
    - learner: "«Confido che la questione possa essere riesaminata con la solita attenzione»."
      errors: [word-choice]
    - tutor: "Quasi perfetto: con la consueta attenzione, però, perché «solita» rischia di suonare ironico."
      recast: {text: "con la solita attenzione", fix: "con la consueta attenzione", tags: [word-choice]}
      goals: [tone]
    - learner: "Giusto, non vorrei sembrare sarcastico. E chiudo con «In attesa di un cortese riscontro, porgo distinti saluti»."
    - tutor: "Perfetto. Ricordi di allegare la ricevuta e una copia del documento: la lettera è pronta."
      goals: [closing]

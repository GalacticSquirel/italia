# Round 4, set z-c2-1, file 3: dinner with the in-laws, two book clubs.
- scenario: cena-suoceri
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "La ringrazio, ma Le assicuro che esisto, e sono anche abbastanza puntuale. Che profumo arriva dalla cucina!"
    - tutor: "Arista al forno, la specialità di mia moglie. Lei cucina?"
    - learner: "Pochissimo, e male: per questo apprezzo ancora di più chi lo sa fare. Questa arista è squisita, e il vino è perfetto."
    - tutor: "Il vino è di un amico del Chianti: glielo farò sapere, ne sarà felice. Mia figlia mi dice che Lei lavora in una casa editrice?"
      goals: [compliment]
    - learner: "Sì, sono editrice: correggo i testi, controllo le traduzioni e tengo i rapporti con gli autori."
      errors: [false-friend]
    - tutor: "Ah, redattrice, quindi: per un attimo ho pensato che la casa editrice fosse Sua! E pensa di restare in quel mondo?"
      recast: {text: "editrice", fix: "redattrice", tags: [false-friend]}
    - learner: "Per ora sì. Mi piacerebbe che un giorno mi affidano una collana di narrativa straniera, ma so che ci vogliono anni di gavetta."
      errors: [subjunctive-use]
    - tutor: "Ambizione legittima. Ma ascolti: «mi piacerebbe che mi affidano»? Dopo un condizionale così, il verbo che segue va accordato meglio."
      prompt: {text: "Mi piacerebbe che un giorno mi affidano", tags: [subjunctive-use]}
    - learner: "Ha ragione: mi piacerebbe che un giorno mi affidassero una collana di narrativa straniera."
    - tutor: "Ecco, così suona come un progetto. Anni di gavetta e stipendi da monaco: mia figlia ha sempre avuto un debole per le cause perse."
      goals: [background]
    - learner: "Spero almeno di essere una causa persa simpatica. E comunque, da quello che ho visto stasera, il gusto per le scelte coraggiose deve averlo preso da qualcuno in questa casa."
    - tutor: "Colpito e affondato. Senta, a questo punto continuare con il Lei mi sembra ridicolo: diamoci del tu, che ne dice?"
      goals: [irony]
    - learner: "Volentieri, se non Le... se non ti dispiace. Scusa, è che non ci sono ancora abituata."
    - tutor: "Ci si abitua in fretta, vedrai. Allora, un'altra fetta di arista? Qui da noi rifiutare è considerato un affronto."
      goals: [tu-lei]

- scenario: cena-suoceri
  level: C2
  persona: es-m-worker
  history: [combined-pronouns]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "È un piacere conoscervi, finalmente. Le assicuro che sono reale, anche se forse meno interessante di come mi ha descritto Sua figlia."
    - tutor: "Questo lo giudicheremo noi. Intanto assaggi i crostini di fegatini: la ricetta è di mia suocera, buonanima."
    - learner: "Sono deliziosi. Se la signora me lo permette, vorrei chiederle la ricetta per mia madre: in Spagna non li conosce nessuno."
    - tutor: "Mia moglie gliela scriverà volentieri, ne stia certo. E Lei di che cosa si occupa?"
      goals: [compliment]
    - learner: "Sono ingegnere in un'azienda che progetta impianti solari. Il lavoro mi piace, ma da anni la meta è aprire un piccolo studio di consulenza qui a Firenze."
      errors: [false-friend]
    - tutor: "Ah, quindi l'obiettivo è restare a Firenze: mia figlia ne sarà contenta. Un ingegnere spagnolo che vuole convincere i fiorentini a seguire i suoi consigli: ammiro l'ottimismo."
      recast: {text: "la meta", fix: "l'obiettivo", tags: [false-friend]}
      goals: [background]
    - learner: "Non pretendo di convincerli: mi accontenterei che mi pagassero. I consigli, poi, sono liberi di non seguirli."
    - tutor: "Risposta da vero fiorentino, glielo concedo. Facciamo così: diamoci del tu, che il Lei a tavola mi mette sempre a disagio."
      goals: [irony]
    - learner: "Molto volentieri. Allora, se ti va, il vino ti lo verso io."
      errors: [combined-pronouns]
    - tutor: "Gentilissimo. Ma «ti lo verso»? Quei due pronomi, quando stanno insieme, cambiano un po' forma."
      prompt: {text: "ti lo verso", tags: [combined-pronouns]}
    - learner: "Certo, che sbadato: te lo verso io!"
    - tutor: "Perfetto, e con il tu ti viene già naturale. Alla salute, allora, e allo studio di consulenza."
      goals: [tu-lei]

- scenario: cena-suoceri
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Grazie. In effetti ho fatto di tutto per rimandare questo momento, ma solo perché temevo di non essere all'altezza."
    - tutor: "Sincerità disarmante, la apprezzo. Le piacciono le lasagne? Mia moglie ne ha fatte per un reggimento."
    - learner: "Le adoro, e queste sono le più buone che abbia mai mangiato. E non lo dico per piaggeria."
    - tutor: "Per piaggeria, addirittura: parla meglio di mio cognato. Mia figlia mi dice che Lei fa il ricercatore, ma non ho capito bene in che campo."
      goals: [compliment]
    - learner: "Storia economica: studio le banche fiorentine del Trecento. Mio padre, che è medico, sperava che anch'io seguo le sue orme, ma per fortuna ha cambiato idea presto."
      errors: [subjunctive-use]
    - tutor: "Un medico deluso, capisco. Però riascolti: sperava che anche Lei... le sue orme? Quel verbo, lì, non era proprio quello giusto."
      prompt: {text: "sperava che anch'io seguo", tags: [subjunctive-use]}
    - learner: "Ah, sì: sperava che anch'io seguissi le sue orme."
    - tutor: "Ecco. Un ricercatore, dunque: mestiere nobile, anche se le banche fiorentine del Trecento non pagano più interessi da un pezzo."
      goals: [background]
    - learner: "No, ma in compenso non falliscono più. Diciamo che ho scelto un settore senza rischi."
    - tutor: "Ha la risposta pronta, mi piace. Facciamo così: diamoci del tu, altrimenti mia figlia penserà che la stia interrogando."
      goals: [irony]
    - learner: "Ne sarei onorato. Allora grazie, e ti avverto: sui fiorini d'oro sono imbattibile."
    - tutor: "Lo terrò presente quando dovrò chiedere un prestito. Benvenuto in famiglia, e prendi ancora un po' di lasagne."
      goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io sì, un pochino! Ammiro la sua coerenza, ma a volte mi sembrava più capriccioso che coraggioso."
    - tutor: "Capriccioso, ecco una parola che mi piace. Ma qual è, secondo te, il tema di fondo?"
      goals: [impression]
    - learner: "La libertà, ma una libertà che ha un prezzo. Cosimo è un personaggio a cui tutto è concesso tranne una cosa: tornare indietro. È il punto in che il romanzo diventa tragico."
      errors: [relative-pronoun]
    - tutor: "Riflessione profonda. Però fermati su «il punto in che»: dopo una preposizione, quel relativo non funziona."
      prompt: {text: "il punto in che", tags: [relative-pronoun]}
    - learner: "Allora... il punto in quale il romanzo diventa tragico?"
      errors: [relative-pronoun]
    - tutor: "Sì, è proprio il punto in cui il romanzo si incupisce: muore il padre e Cosimo non scende nemmeno allora. E lo stile? Calvino ti ha divertita?"
      recast: {text: "il punto in quale", fix: "il punto in cui", tags: [relative-pronoun]}
      goals: [theme]
    - learner: "Moltissimo. Calvino ha un senso dell'umore leggero ma mai superficiale, e anche le scene più assurde sono raccontate con una precisione quasi scientifica."
      errors: [false-friend]
    - tutor: "Un senso dell'umorismo leggero e preciso: stai citando le Lezioni americane senza saperlo. Io però continuo a pensare che Cosimo sia un egoista travestito da eroe."
      recast: {text: "senso dell'umore", fix: "senso dell'umorismo", tags: [false-friend]}
      goals: [style]
    - learner: "Non sono d'accordo. Se fosse un egoista, non aiuterebbe i contadini a spegnere gli incendi né organizzerebbe la difesa del bosco. La sua distanza è un modo diverso di esserci."
    - tutor: "Argomentazione solida, mi arrendo a metà. E il prossimo libro, chi lo propone?"
      goals: [disagree]
    - learner: "Io propongo Le città invisibili: restiamo con Calvino, ma ne scopriamo un lato completamente diverso."
    - tutor: "Ottima idea: dalla foresta alle città che non esistono. Segno sulla lavagna e ci vediamo tra un mese, stesso tavolo, stesso vino."
      goals: [recommend]

- scenario: circolo-lettura
  level: C2
  persona: es-m-worker
  history: [hypothetical]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: mi ha fatto invidia. Chi non ha mai desiderato alzarsi da un pranzo di famiglia e non tornare più?"
    - tutor: "Ah, una lettura autobiografica! Quindi per te il romanzo parla soprattutto di ribellione?"
      goals: [impression]
    - learner: "Di ribellione, sì, ma anche di fedeltà. Se Cosimo sarebbe sceso dopo una settimana, sarebbe stato solo un capriccio di ragazzino."
      errors: [hypothetical]
    - tutor: "Giusto, è la durata che trasforma il gesto. Ma «se Cosimo sarebbe sceso»: ti suona bene, quel condizionale dopo se?"
      prompt: {text: "Se Cosimo sarebbe sceso", tags: [hypothetical]}
    - learner: "Hmm... se Cosimo scendeva dopo una settimana, sarebbe stato un capriccio?"
      errors: [hypothetical]
    - tutor: "Esatto: se Cosimo fosse sceso dopo una settimana, nessuno avrebbe scritto un romanzo su di lui. È la fedeltà a renderlo un personaggio."
      recast: {text: "se Cosimo scendeva", fix: "se Cosimo fosse sceso", tags: [hypothetical]}
      goals: [theme]
    - learner: "E poi c'è il narratore, il fratello Biagio, che guarda tutto da terra con una mistura di affetto e di invidia. È lui a rendere la storia ironica."
      errors: [word-choice]
    - tutor: "Ottima osservazione: un misto di affetto e di invidia, il narratore borghese che ammira e non osa. Io però trovo il finale troppo poetico, quasi zuccheroso."
      recast: {text: "una mistura", fix: "un misto", tags: [word-choice]}
      goals: [style]
    - learner: "Zuccheroso? Io lo trovo malinconico. Cosimo se ne va aggrappato a una mongolfiera: non tocca terra neanche da morto, è coerente fino all'ultimo."
    - tutor: "Messa così, mi hai quasi convinto. Hai già un'idea per il prossimo incontro?"
      goals: [disagree]
    - learner: "Proporrei Il Gattopardo: anche lì c'è un nobile che guarda il mondo cambiare, ma da tutt'altra prospettiva."
    - tutor: "Dagli alberi al palazzo di Donnafugata: bel salto. Approvato, ma questa volta il vino lo porti tu."
      goals: [recommend]

- scenario: circolo-lettura
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Insopportabile forse no, ma devo confessare che a metà libro mi sono annoiato. Poi però la seconda parte mi ha vinto."
      errors: [word-choice]
    - tutor: "Conquistato alla fine, eh? Succede a molti: la prima parte è quasi una commedia di costume. Secondo te, di che cosa parla davvero il romanzo?"
      recast: {text: "vinto", fix: "conquistato", tags: [word-choice]}
      goals: [impression]
    - learner: "Secondo me il tema principale è la cultura. Cosimo è un ragazzo molto educato: legge Voltaire e Rousseau, scrive perfino agli enciclopedisti."
      errors: [false-friend]
    - tutor: "Molto colto, sì, e per niente educato, visto come tratta i genitori! La cultura come forma di libertà, dunque: dove la vedi meglio nel testo?"
      recast: {text: "molto educato", fix: "molto colto", tags: [false-friend]}
    - learner: "Nell'episodio dei libri: Cosimo si fa portare sugli alberi intere biblioteche, e alla fine è lui a far innamorare dei romanzi il brigante Gian dei Brughi."
    - tutor: "Esempio perfetto: il brigante che smette di rubare per leggere. E lo stile, che effetto ti fa?"
      goals: [theme]
    - learner: "Quello che amo di Calvino è che riesce a essere ironico senza mai diventare cinico. Si sente che vuole bene ai suoi personaggi, anche a quelli ridicoli."
    - tutor: "Sarà, ma per me la sua ironia resta fredda, da ingegnere."
      goals: [style]
    - learner: "Fredda? Non credo proprio. Se Calvino fosse stato freddo, non avrebbe fatto morire Gian dei Brughi mentre aspetta di sapere come finisce un romanzo: quella scena è piena di tenerezza."
    - tutor: "Va bene, su Gian dei Brughi ti do ragione. Chi propone il prossimo libro?"
      goals: [disagree]
    - learner: "Proporrei Il sentiero dei nidi di ragno: è la prima novella di Calvino, ed è completamente diversa."
      errors: [false-friend]
    - tutor: "Ottima scelta: è il primo romanzo di Calvino, scritto a ventitré anni, e lì la guerra non ha niente di fiabesco."
      recast: {text: "è la prima novella", fix: "è il primo romanzo", tags: [false-friend]}
      goals: [recommend]
    - learner: "Esatto, è proprio il contrasto che mi interessa. E questa volta il vino lo porto io."
    - tutor: "Affare fatto: un romanzo partigiano e un rosso piemontese, così restiamo in tema. A fra un mese!"

- scenario: circolo-lettura
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no! Mi sembrava che avesse ragione su tutto: la sua famiglia era ridicola e lui ha avuto il coraggio di dirlo."
    - tutor: "Che passione! Ma il coraggio, secondo te, è il tema principale?"
      goals: [impression]
    - learner: "Non solo. Secondo me Calvino voleva che il lettore si chiede quanto vale la coerenza quando ti isola da tutti."
      errors: [subjunctive-use]
    - tutor: "Bella domanda, davvero. Ma «voleva che il lettore si chiede»: con quel voleva al passato, il verbo dopo non è accordato bene."
      prompt: {text: "voleva che il lettore si chiede", tags: [subjunctive-use]}
    - learner: "Ah... voleva che il lettore si chieda quanto vale la coerenza?"
      errors: [subjunctive-use]
    - tutor: "Sì, voleva che il lettore si chiedesse proprio questo, e la risposta non ce la dà mai. Hai un passo del libro in mente?"
      recast: {text: "il lettore si chieda", fix: "il lettore si chiedesse", tags: [subjunctive-use]}
    - learner: "Penso a Viola: Cosimo la ama, ma non scende nemmeno per lei, e alla fine la perde."
    - tutor: "Esempio perfetto, e anche il più crudele. E lo stile di Calvino, come lo descriveresti?"
      goals: [theme]
    - learner: "Limpidissimo, sembra una fabula del Settecento. Ma ci sono momenti in cui l'ironia diventa amara, come quando muore il padre."
      errors: [false-friend]
    - tutor: "Sì, una favola, ma con le unghie. Però, per me, il personaggio più riuscito è Viola, non Cosimo."
      recast: {text: "una fabula", fix: "una favola", tags: [false-friend]}
      goals: [style]
    - learner: "Riuscita sì, ma è un personaggio di cui il romanzo potrebbe fare a meno: serve soprattutto a mettere alla prova Cosimo."
    - tutor: "Che severità con la povera Viola! Ma l'argomento regge. Che cosa leggiamo il mese prossimo?"
      goals: [disagree]
    - learner: "Io porterei Lessico famigliare di Natalia Ginzburg: anche lì c'è una famiglia, ma vista da dentro."
    - tutor: "Scelta finissima, e ci farà ridere parecchio. Lo segno: Ginzburg, fra quattro settimane."
      goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma a fatica: le prime cento pagine mi sono sembrate lentissime. Poi però non riuscivo più a smettere."
    - tutor: "Succede a molti. Chi dei personaggi ti è rimasto più impresso?"
      goals: [impression]
    - learner: "La madre, Ada. Credo che abbia fatto la scelta più dura del romanzo: restare con un marito che non amava per non perdere la casa."
    - tutor: "Giudizio severo o comprensivo, il tuo?"
    - learner: "Comprensivo. Al suo posto, nel 1948, forse avrei fatto lo stesso. E poi lei ha giocato un ruolo enorme nel tenere insieme la famiglia."
      errors: [word-choice]
    - tutor: "Ha svolto un ruolo enorme, sì, pagando un prezzo che nessuno le ha mai riconosciuto. E lo stile dell'autrice ti ha convinto?"
      recast: {text: "giocato un ruolo", fix: "svolto un ruolo", tags: [word-choice]}
      goals: [character]
    - learner: "Molto. Scrive frasi brevissime, quasi secche, che però alla fine di ogni capitolo ti rompono il cuore."
      errors: [word-choice]
    - tutor: "Vero, è una prosa trattenuta che non spiega mai, e proprio per questo quelle chiuse ti spezzano il cuore. A chi lo consiglieresti?"
      recast: {text: "ti rompono il cuore", fix: "ti spezzano il cuore", tags: [word-choice]}
      goals: [style]
    - learner: "A chi ama le saghe familiari ma non sopporta il melodramma. A mio padre no: avrebbe voluto che il finale sia più chiaro."
      errors: [subjunctive-use]
    - tutor: "Ah, uno che vuole tutte le risposte! Ma «avrebbe voluto che il finale sia»: dopo quel condizionale passato, il verbo deve fare un passo indietro nel tempo."
      prompt: {text: "avrebbe voluto che il finale sia", tags: [subjunctive-use]}
    - learner: "Giusto: avrebbe voluto che il finale fosse più chiaro. Lui ama i libri in cui alla fine tutto torna."
    - tutor: "Allora niente regalo di Natale per lui, almeno non questo. Per tutti gli altri, invece, è una lettura che lascia il segno."
      goals: [recommend]

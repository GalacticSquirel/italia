      errors: [register]
    - tutor: "È un pensiero che apprezzo molto. Però, mi perdoni, ci siamo sempre dati del Lei, e mia zia qui accanto è attentissima a queste cose."
      prompt: {text: "Se ti serve qualcosa, chiamami a qualsiasi ora", tags: [register]}
    - learner: "Ha ragione, mi scusi: se Le serve qualcosa, mi chiami a qualsiasi ora. Mia moglie può tenere i bambini qualche pomeriggio."
    - tutor: "Grazie, credo che accetterò: questa settimana è un via vai continuo di parenti."
      goals: [offer-help]
    - learner: "Allora vado, non voglio rubarLe altro tempo. Le sono vicino, e mi saluti la Sua famiglia."
    - tutor: "Lo farò. Grazie di essere passato, davvero."
      goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Solo in parte! Ho riso perché uno dei due parlava così veloce che sembrava una canzone. Ho notato che alla fine delle parole le vocali quasi spariscono."
    - tutor: "Esatto, è la tipica cadenza napoletana. E ti ha colpito qualche parola in particolare?"
      goals: [notice]
    - learner: "Sì, uno ha chiamato l'altro «guagliò». Ma come si abitua a sentire queste cose senza capire niente?"
      errors: [ci-ne]
    - tutor: "«Guagliò» vuol dire «ragazzo», ed è affettuoso. Ma «come si abitua»: con un verbo riflessivo, l'impersonale vuole una particella in più."
      prompt: {text: "come si abitua", tags: [ci-ne]}
    - learner: "Ah... come si ci abitua?"
      errors: [ci-ne]
    - tutor: "Ci si abitua più in fretta di quanto pensi: dopo un mese a Napoli capirai metà delle battute, e dopo un anno le farai tu."
      recast: {text: "si ci abitua", fix: "ci si abitua", tags: [ci-ne]}
      goals: [example]
    - learner: "Ma il napoletano è una lingua vera o una corruzione dell'italiano? Ho letto che i linguisti hanno argomenti molto forti in tutte e due le direzioni."
    - tutor: "Per i linguisti non è una corruzione: viene dal latino come l'italiano, è un fratello, non un figlio."
    - learner: "Quindi l'italiano è il dialetto che ha avuto più fortuna, cioè il fiorentino di Dante."
    - tutor: "Esattamente: una lingua è un dialetto con un esercito e una flotta, diceva qualcuno. E secondo te i dialetti vanno protetti?"
      goals: [standard]
    - learner: "Sì, ma senza imposizioni. Non credo che vadano insegnati a scuola come materia, però sarebbe un peccato se sparirebbero."
      errors: [hypothetical]
    - tutor: "Posizione equilibrata. Solo: «sarebbe un peccato se sparirebbero»? Due condizionali in fila, uno è di troppo."
      prompt: {text: "se sparirebbero", tags: [hypothetical]}
    - learner: "Sarebbe un peccato se sparissero, certo. Una lingua che muore porta via anche un modo di ridere."
    - tutor: "Bellissima, questa: me la segno per la mia prossima lezione. E adesso, visto che scendi a Napoli, ti insegno tre parole che ti serviranno subito."
      goals: [opinion]

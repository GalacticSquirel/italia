    - tutor: "Grazie: venire a porgere le condoglianze di persona, con questo freddo, non era scontato. Si sieda, prego."
      recast: {text: "dare le condoglianze", fix: "porgere le condoglianze", tags: [word-choice]}
      goals: [condolences]
    - learner: "La conoscevo poco, ma ricordo che alla cena di Natale raccontava storie della guerra, di quelle che fanno ridere e piangere insieme. Non la dimenticherò."
    - tutor: "Le raccontava a tutti, e ogni anno un po' diverse. Mi fa piacere che se ne ricordi."

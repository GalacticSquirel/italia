# Round 4, set z-c2-1, file 5: promotions, condolence visits, regional speech.
- scenario: colloquio-promozione
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Volevo mostrarLe i dati del semestre: le iscrizioni ai miei corsi sono salite del trenta per cento, e il numero di abbandoni è molto più basso che l'anno scorso."
      errors: [comparative]
    - tutor: "Dati ottimi, li ho visti. Solo un dettaglio: «più basso che l'anno scorso»... in un confronto fra due cifre, quel «che» Le sembra la scelta giusta?"
      prompt: {text: "più basso che l'anno scorso", tags: [comparative]}
    - learner: "Più basso come l'anno scorso, voglio dire. Per questo vorrei essere promossa a coordinatrice didattica: di fatto svolgo già quel lavoro da un anno."
      errors: [comparative]
    - tutor: "Sì, molto più basso di quello dell'anno scorso: i dati li conosco. La richiesta è legittima, ma la coordinatrice attuale va in pensione solo a settembre, e la direzione potrebbe preferire qualcuno da fuori."
      recast: {text: "come l'anno scorso", fix: "di quello dell'anno scorso", tags: [comparative]}
      goals: [results, request]
    - learner: "Lo capisco, ma mi sembra strano che la direzione cerca fuori una persona che ha già in casa."
      errors: [subjunctive-use]
    - tutor: "Argomento forte. Ma «mi sembra strano che la direzione cerca»: dopo un giudizio del genere, quale modo ci vuole?"
      prompt: {text: "mi sembra strano che la direzione cerca", tags: [subjunctive-use]}
    - learner: "Mi sembra strano che la direzione cercherebbe fuori, voglio dire."
      errors: [subjunctive-use]
    - tutor: "Effettivamente sarebbe strano che la direzione cerchi fuori una persona che ha già in casa: glielo farò notare. Resta però la questione del budget."
      recast: {text: "la direzione cercherebbe", fix: "la direzione cerchi", tags: [subjunctive-use]}
    - learner: "Per il budget, sarei disposta a cominciare con un aumento ridotto e a rivederlo dopo sei mesi, se i risultati restano questi."
    - tutor: "Proposta sensata, e difficile da rifiutare. Come vorrebbe procedere?"
      goals: [handle]
    - learner: "Le chiederei di fissare un incontro con la direzione entro aprile, e intanto mi piacerebbe ricevere un'evaluazione scritta del mio lavoro."
      errors: [false-friend]
    - tutor: "Una valutazione scritta posso prepararla io entro venerdì; l'incontro con la direzione lo fissiamo per metà aprile."
      recast: {text: "un'evaluazione scritta", fix: "una valutazione scritta", tags: [false-friend]}
      goals: [next-steps]
    - learner: "Perfetto, La ringrazio per la disponibilità."
    - tutor: "Grazie a Lei. E continui così: i numeri parlano per Lei meglio di qualsiasi lettera."

- scenario: colloquio-promozione
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Le ho portato un riassunto dei miei risultati: ho corso tre progetti europei e li ho chiusi tutti nei tempi e sotto budget."
      errors: [word-choice]
    - tutor: "Ha gestito tre progetti europei, e tutti chiusi nei tempi: ottimo lavoro, non lo nego. Che cosa mi vuole chiedere?"
      recast: {text: "corso tre progetti europei", fix: "gestito tre progetti europei", tags: [word-choice]}
      goals: [results]
    - learner: "Un aumento. A Milano, con lo stipendio attuale, non la faccio più: l'affitto si mangia metà di quello che guadagno."
      errors: [ci-ne]
    - tutor: "Lo so, Milano è spietata. Ma «non la faccio più»: in quell'espressione manca qualcosa, prima del pronome."
      prompt: {text: "non la faccio più", tags: [ci-ne]}
    - learner: "Non ce la faccio più, ecco. Mi scusi la franchezza."
    - tutor: "La franchezza la apprezzo. Il problema è che gli aumenti sono bloccati fino a gennaio, per tutti."
      goals: [request]
    - learner: "Capisco. Allora forse si potrebbe valutare un'altra forma di compensazione: un premio di risultato, per esempio, o due giorni di lavoro da casa."
      errors: [word-choice]
    - tutor: "Un'altra forma di compenso, dice: un premio di risultato si può discutere. Sul lavoro da casa, invece, la direzione è ancora molto rigida."
      recast: {text: "forma di compensazione", fix: "forma di compenso", tags: [word-choice]}
      goals: [handle]
    - learner: "Allora partiamo dal premio. Per il lavoro da casa, vorrei che ne parliamo di nuovo a gennaio, insieme all'aumento."
      errors: [subjunctive-use]
    - tutor: "Mi sembra giusto. Ma «vorrei che ne parliamo»: dopo vorrei, quel verbo va spostato un po' indietro nel tempo."
      prompt: {text: "vorrei che ne parliamo", tags: [subjunctive-use]}
    - learner: "Vorrei che ne parleremo a gennaio?"
      errors: [subjunctive-use]
    - tutor: "Quasi: Lei vorrebbe che ne parlassimo a gennaio, e così sarà, lo segno in agenda. Il premio, invece, lo porto in direzione già questa settimana."
      recast: {text: "che ne parleremo", fix: "che ne parlassimo", tags: [subjunctive-use]}
      goals: [next-steps]
    - learner: "Grazie. E per il premio, quando potrei avere una risposta?"
    - tutor: "Entro la fine del mese, glielo prometto. E grazie per avermene parlato apertamente."

- scenario: colloquio-promozione
  level: C2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, se ha cinque minuti. Ho preparato un documento in cui sono riassunti i progetti che ho seguito quest'anno."
    - tutor: "Me lo illustri pure."
    - learner: "Il più importante è il nuovo magazzino di Verona, del quale ho gestito tutta la logistica: lo abbiamo aperto con un mese di anticipo e un risparmio del dieci per cento rispetto al presupposto."
      errors: [false-friend]
    - tutor: "Un risparmio del dieci per cento rispetto al preventivo: lo ricordo bene, ottimo lavoro. Quindi?"
      recast: {text: "rispetto al presupposto", fix: "rispetto al preventivo", tags: [false-friend]}
      goals: [results]
    - learner: "Quindi vorrei chiederLe di valutare la mia promozione a capo reparto. È un ruolo che lo conosco bene, perché lo copro già quando il mio responsabile è in ferie."
      errors: [relative-pronoun]
    - tutor: "Richiesta legittima. Però «un ruolo che lo conosco»: in quella relativa c'è un pronome di troppo."
      prompt: {text: "un ruolo che lo conosco", tags: [relative-pronoun]}
    - learner: "Giusto: è un ruolo che conosco bene."
    - tutor: "Va bene. Le dico però con franchezza che in direzione qualcuno La trova poco diplomatico con i fornitori."
      goals: [request]
    - learner: "Lo so, e ammetto che a volte ho una attitudine troppo dura."
      errors: [false-friend]
    - tutor: "Un atteggiamento troppo duro, sì, è proprio questa la critica. Come pensa di rispondere?"
      recast: {text: "una attitudine troppo dura", fix: "un atteggiamento troppo duro", tags: [false-friend]}
    - learner: "Che i fornitori con cui sono stato duro erano quelli che non rispettavano i contratti: se fossi stato più morbido, avremmo perso migliaia di euro. Comunque sono disposto a seguire un corso di negoziazione."
    - tutor: "Questa è la risposta che speravo di sentire. Come procediamo?"
      goals: [handle]
    - learner: "Proporrei di rivederci a settembre, dopo il corso, e di decidere in base ai risultati dei quali abbiamo parlato oggi."
    - tutor: "D'accordo: iscrizione al corso entro maggio e nuovo colloquio a settembre. Lo metto per iscritto e glielo mando oggi stesso."
      goals: [next-steps]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe. Ho saputo di Sua madre solo ieri sera, e volevo farLe sentire un po' di simpatia, almeno di persona."
      errors: [false-friend]
    - tutor: "Grazie: un po' di vicinanza, in giorni come questi, conta più di quanto si creda. È stato tutto così improvviso."
      recast: {text: "un po' di simpatia", fix: "un po' di vicinanza", tags: [false-friend]}
      goals: [condolences]
    - learner: "Me l'aveva presentata alla festa di fine anno, si ricorda? Mi raccontò che da giovane aveva insegnato latino, e che i suoi studenti la temevano e l'adoravano."
    - tutor: "Sì, era proprio così: severa e tenerissima. Mi fa bene sentirlo dire da qualcun altro."
      goals: [memory]
    - learner: "Se nei prossimi giorni ha bisogno di qualcosa, anche di cose pratiche come la spesa o qualche commissione, non esita a chiamarmi."
      errors: [imperative-form]
    - tutor: "È molto gentile. Mi scusi, sono un po' frastornato: «non esita a chiamarmi», ha detto?"
      prompt: {text: "non esita a chiamarmi", tags: [imperative-form]}
    - learner: "Sì, scusi: non esiti a chiamarmi, mi raccomando, anche solo per due chiacchiere."
    - tutor: "Lo farò, grazie. In questi giorni è la burocrazia la cosa più faticosa, più ancora del dolore."
      goals: [offer-help]
    - learner: "Allora non La trattengo oltre: immagino che abbia ancora molte persone da ricevere. Le sono vicino, e mi saluti la Sua famiglia."
    - tutor: "Grazie di cuore, sarà fatto. Vada pure, e guidi piano."
      goals: [leave]

- scenario: condoglianze
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ma figurati, era il minimo. Mi dispiace un casino per tua madre."
      errors: [register]
    - tutor: "Grazie. Però, mi perdoni, mia zia qui accanto ha alzato un sopracciglio: in casa, davanti ai parenti, quel «un casino» e quel tu stonano un po'."
      prompt: {text: "Mi dispiace un casino per tua madre", tags: [register]}
    - learner: "Ha ragione, mi scusi. Mi dispiace moltissimo per la scomparsa di Sua madre: Le faccio le mie più sentite condoglianze."
    - tutor: "Grazie, davvero. Se n'è andata nel sonno, almeno non ha sofferto."
      goals: [condolences]
    - learner: "Ricordo quando è venuta in ufficio con una teglia di focaccia per tutti. Era molto orgogliosa di Lei: parlava della Sua carriera come di un esito personale."
      errors: [false-friend]
    - tutor: "Sì, ne parlava come di un successo personale, povera mamma, anche quando non lo era affatto. E quella focaccia la ricordano ancora tutti."
      recast: {text: "come di un esito", fix: "come di un successo", tags: [false-friend]}
      goals: [memory]
    - learner: "Senta, per qualsiasi cosa conti su di me. Il progetto di Bari lo porto avanti io finché non torna: se ne occupi pure con calma della famiglia."
      errors: [ci-ne]
    - tutor: "È un'offerta preziosa. Solo una cosa: «se ne occupi pure della famiglia»... ci sono due elementi che dicono la stessa cosa."
      prompt: {text: "se ne occupi pure con calma della famiglia", tags: [ci-ne]}
    - learner: "Giusto: si occupi pure con calma della famiglia, al resto penso io."
    - tutor: "Grazie, mi toglie un peso enorme. Tornerò tra una decina di giorni, credo."
      goals: [offer-help]
    - learner: "Allora La lascio, ci saranno altre persone che vogliono salutarLa. Mi chiami se ha bisogno, davvero."
    - tutor: "Lo farò. Grazie ancora di essere passato: non lo dimenticherò."
      goals: [leave]

- scenario: condoglianze
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Non dica così, era il minimo. Le porgo le mie più sentite condoglianze, a nome mio e di tutto l'ufficio."
    - tutor: "La ringrazio, e ringrazi anche gli altri. Mamma aveva novantun anni, ma non si è mai pronti."
      goals: [condolences]
    - learner: "È vero, non lo si è mai. Penso che Sua madre è stata una donna straordinaria: Lei me ne parlava sempre con tanto affetto."
      errors: [subjunctive-use]
    - tutor: "Lo era, sì. Mi scusi, però: «penso che Sua madre è stata»... dopo penso che, quel verbo non Le suona un po' piatto?"
      prompt: {text: "Penso che Sua madre è stata", tags: [subjunctive-use]}
    - learner: "Ah, sì: penso che Sua madre fosse stata una donna straordinaria."
      errors: [subjunctive-use]
    - tutor: "Grazie. Che sia stata una donna straordinaria me lo dicono in tanti, in questi giorni, e mi consola più di quanto pensassi."
      recast: {text: "fosse stata una donna straordinaria", fix: "sia stata una donna straordinaria", tags: [subjunctive-use]}
      goals: [memory]
    - learner: "Se Le servirebbe una mano con le carte della successione, sono a disposizione: l'ho appena fatto per mio padre."
      errors: [hypothetical]
    - tutor: "È gentilissima. Ma «se Le servirebbe»: dopo se, quel condizionale non va."
      prompt: {text: "Se Le servirebbe", tags: [hypothetical]}
    - learner: "Se Le servisse una mano con le carte della successione, io ci sono: conosco bene i passaggi."
    - tutor: "Perfetto, accetto volentieri: quei moduli mi spaventano più di tutto il resto."
      goals: [offer-help]
    - learner: "Allora La lascio riposare. Mi faccia sapere quando sarà il funerale: vorrei esserci."
    - tutor: "L'ho scritto stamattina nel gruppo dell'ufficio: giovedì alle dieci, nella chiesa del paese. Grazie di tutto."
      goals: [leave]

- scenario: condoglianze
  level: C2

# Round 4, set z-c2-1, file 8: a podcast, a live radio show, mediating between colleagues.
- scenario: intervista-podcast
  level: C2
  persona: en-m-traveller
  history: [false-friend]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a te! È stato quasi un caso: ero venuto in vacanza a Bologna, ho conosciuto una ragazza e, come si dice, non sono più ripartito."
    - tutor: "Classico! E la ragazza c'è ancora?"
      goals: [story]
    - learner: "Sì, adesso è mia moglie. All'inizio però è stata dura: non conoscevo nessuno e lavoravo in un call center, un lavoro molto miserabile."
      errors: [false-friend]
    - tutor: "Un lavoro molto deprimente, immagino: i call center non li augurerei a nessuno. C'è qualche abitudine italiana che ti ha spiazzato?"
      recast: {text: "molto miserabile", fix: "molto deprimente", tags: [false-friend]}
    - learner: "Sì: il fatto che si cenasse alle nove di sera! E che tutti volevano sapere cosa avevo mangiato a pranzo, come se fosse una notizia."
      errors: [subjunctive-use]
    - tutor: "Per noi lo è! Ma senti: «il fatto che si cenasse», e poi «che tutti volevano». Il secondo verbo non è nello stesso modo del primo."
      prompt: {text: "che tutti volevano sapere", tags: [subjunctive-use]}
    - learner: "Giusto: e che tutti vogliano sapere cosa avevo mangiato a pranzo!"
      errors: [subjunctive-use]
    - tutor: "Già, che tutti volessero sapere del tuo pranzo: per noi è una forma d'affetto! E c'è qualcosa che proprio non ti va giù, dell'Italia? Con tatto, mi raccomando."
      recast: {text: "che tutti vogliano", fix: "che tutti volessero", tags: [subjunctive-use]}
      goals: [culture-shock]
    - learner: "Con tatto, allora: la burocrazia. Per avere la residenza ho messo otto mesi, e nessuno sapeva spiegarmi perché."
      errors: [ci-ne]
    - tutor: "Otto mesi, un grande classico. Ma «ho messo otto mesi»: per il tempo impiegato, quel verbo vuole una particella."
      prompt: {text: "ho messo otto mesi", tags: [ci-ne]}
    - learner: "Ci ho messo otto mesi, e ho girato quattro uffici diversi."
    - tutor: "Critica sacrosanta, e detta con il sorriso. Che consiglio daresti a chi ci sta pensando?"
      goals: [critique]
    - learner: "Di imparare la lingua prima di partire e di portare tanta pazienza. E, se fossi in loro, cercherei casa fuori dal centro: si vive meglio e si spende la metà."
    - tutor: "Consiglio pratico e prezioso. Grazie mille, è stata una chiacchierata bellissima."
      goals: [advice]

- scenario: intervista-podcast
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Grazie a te! Sono arrivata con l'Erasmus nel 2009 e dopo il dottorato ho deciso di restare, anche se i miei genitori speravano che torno a Siviglia."
      errors: [subjunctive-use]
    - tutor: "Che storia! Ma «speravano che torno»: con quello speravano al passato, il verbo dopo non si accorda."
      prompt: {text: "speravano che torno", tags: [subjunctive-use]}
    - learner: "Ah, sì: speravano che torni a Siviglia."
      errors: [subjunctive-use]
    - tutor: "Immagino: speravano che tornassi a casa, e invece eccoti qui, quindici anni dopo. Che cosa ti ha sorpresa di più, all'inizio?"
      recast: {text: "che torni", fix: "che tornassi", tags: [subjunctive-use]}
      goals: [story]
    - learner: "Che nessuno rispettasse la fila alla posta! In Spagna si fa la coda in modo ordinato; qui sembrava una battaglia."
    - tutor: "Ormai abbiamo i numeretti, ma la battaglia continua. E c'è qualcosa che critichi, dell'Italia?"
      goals: [culture-shock]
    - learner: "La mentalità verso le donne che lavorano: ai colloqui mi hanno chiesto più di una volta se avevo intenzione di restare incinta."
    - tutor: "Una critica pesante, ma giusta, e detta con garbo. Che consiglio daresti a una donna che vuole trasferirsi qui?"
      goals: [critique]
    - learner: "Di non idealizzare l'Italia, di imparare bene la lingua e di salire molto, per conoscere gente."
      errors: [false-friend]
    - tutor: "Uscire molto, sì, e conoscere gente fuori dal giro degli stranieri: è il consiglio migliore che si possa dare."
      recast: {text: "salire molto", fix: "uscire molto", tags: [false-friend]}
      goals: [advice]
    - learner: "Esatto, il giro degli stranieri è comodo, ma è una trappola."
    - tutor: "Lo segno come titolo della puntata. Grazie, è stato un piacere averti qui."

- scenario: intervista-podcast
  level: C2
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Per me è stato un ritorno: i miei nonni erano di Lecce. Quando sono arrivato, però, morivano già da dieci anni, e in città non conoscevo nessuno."
      errors: [tense-aspect]
    - tutor: "Che storia toccante. Ma «quando sono arrivato, morivano già da dieci anni»: per un'azione conclusa prima di un'altra, quale tempo ci vuole?"
      prompt: {text: "morivano già da dieci anni", tags: [tense-aspect]}
    - learner: "Quando sono arrivato, sono morti già da dieci anni?"
      errors: [tense-aspect]
    - tutor: "Capisco: quando sei arrivato erano morti già da dieci anni, eppure hai scelto proprio la loro città. Che cosa ti ha colpito di più?"
      recast: {text: "sono morti già", fix: "erano morti già", tags: [tense-aspect]}
      goals: [story]
    - learner: "Il tempo: qui nessuno ha fretta, e all'inizio pensavo che fossero tutti in ferie."
    - tutor: "Benvenuto nel Salento! E se dovessi criticare qualcosa?"
      goals: [culture-shock]
    - learner: "Che per trovare lavoro conta più chi conosci di cosa sai fare."
      errors: [comparative]
    - tutor: "Critica che sentiamo spesso. Ma «più chi conosci di cosa sai fare»: quando metti a confronto due frasi, quel di funziona?"
      prompt: {text: "più chi conosci di cosa sai fare", tags: [comparative]}
    - learner: "Conta più chi conosci di quello che sai fare, ecco."
      errors: [comparative]
    - tutor: "Sì, conta più chi conosci che quello che sai fare: detto così, è ancora più amaro. Che consiglio daresti a chi vuole fare il tuo stesso percorso?"
      recast: {text: "di quello che sai fare", fix: "che quello che sai fare", tags: [comparative]}
      goals: [critique]
    - learner: "Di non arrivare con l'idea della cartolina: i nonni raccontano un paese che non c'è più. Bisogna conoscere quello di oggi, con i suoi problemi e le sue sorprese."
    - tutor: "Il paese di oggi, non quello della cartolina: grazie, è un pensiero che molti nostri ascoltatori capiranno benissimo."
      goals: [advice]

- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere essere qui. Il libro si intitola «Mezz'ora di ritardo» ed è nato da dieci anni di appunti presi in Italia, quasi tutti in sala d'attesa."
    - tutor: "Titolo provocatorio! Allora devo chiederglielo: gli italiani sono davvero sempre in ritardo?"
      goals: [present-book]
    - learner: "Ma no, dai, è un luogo comune un po' scemo."
      errors: [register]
    - tutor: "Gli ascoltatori La ringraziano per la difesa, ma siamo in diretta nazionale: «dai», «scemo»... Come lo direbbe in un salotto?"
      prompt: {text: "Ma no, dai, è un luogo comune un po' scemo", tags: [register]}
    - learner: "Diciamo che è un luogo comune piuttosto superficiale: gli italiani sono puntualissimi quando conta, cioè a pranzo."
    - tutor: "Questa la mettiamo nei titoli di coda. Ci racconta un episodio del libro?"
      goals: [stereotype]
    - learner: "Il primo giorno a Roma chiedevo a un vigile dove fosse la fermata dell'autobus, e lui, invece di rispondere, mi ha chiesto se avessi già mangiato."
      errors: [tense-aspect]
    - tutor: "Comincia benissimo. Però «il primo giorno chiedevo»: era un'abitudine o un episodio preciso?"
      prompt: {text: "Il primo giorno a Roma chiedevo", tags: [tense-aspect]}
    - learner: "Un episodio: il primo giorno ho chiesto a un vigile dove fosse la fermata, e lui mi ha chiesto se avessi già mangiato."
    - tutor: "Tipicamente romano. E imparare l'italiano che cosa ha cambiato in Lei?"
      goals: [anecdote]
    - learner: "Mi ha resa più teatrale: adesso gesticolo tanto che i miei amici inglesi mi trovano molto eccitata."
      errors: [false-friend]
    - tutor: "Molto animata, diciamo, che in radio suona meglio! È il segno che l'italiano Le è entrato nelle mani. Ci saluta con una frase del libro?"
      recast: {text: "molto eccitata", fix: "molto animata", tags: [false-friend]}
      goals: [language]
    - learner: "Volentieri: in Italia non si arriva mai in ritardo, si arriva quando si arriva."
    - tutor: "Filosofia pura. Grazie di essere stata con noi, e a voi ascoltatori: a domani, puntuali."
      goals: [farewell]

- scenario: intervista-radio
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie a voi. Il mio libro si chiama «Lezioni di caffè»: racconta il mio primo anno in Italia attraverso i bar in cui ho fatto colazione."
    - tutor: "Bel titolo. Ma diciamolo: voi spagnoli pensate che noi italiani siamo tutti mammoni, vero?"
      goals: [present-book]
    - learner: "Un po' sì, lo confesso! Ma vivendo qui ho capito che non è pigrizia: con gli stipendi che ci sono, restare con i genitori è una scelta molto sensibile."
      errors: [false-friend]
    - tutor: "Una scelta molto sensata, dice, e i nostri ascoltatori sotto i trentacinque anni La ringraziano! Ci racconta un episodio del libro?"
      recast: {text: "molto sensibile", fix: "molto sensata", tags: [false-friend]}
      goals: [stereotype]
    - learner: "Una sera, in un bar di Bologna, una signora anziana mi vedeva ordinare un cappuccino dopo cena e mi ha detto: «Signorina, ma Lei vuole morire?»"
      errors: [tense-aspect]
    - tutor: "Meraviglioso. Però «una signora mi vedeva ordinare»: è un fatto puntuale, di quella sera. Che tempo userebbe?"
      prompt: {text: "una signora anziana mi vedeva ordinare", tags: [tense-aspect]}
    - learner: "Una signora anziana mi ha vista ordinare un cappuccino dopo cena: da quella sera lo bevo solo al mattino."
    - tutor: "Ottima scuola, le signore bolognesi. E l'italiano, che cosa le ha insegnato?"
      goals: [anecdote]
    - learner: "A dire di no con tre condizionali e un sorriso. In Spagna sono sempre stata molto diretta; qui ho imparato che la gentilezza è anche una questione di grammatica."
    - tutor: "Una lezione che molti italiani dovrebbero ripassare. Ci saluta con una frase per chi ci ascolta?"
      goals: [language]
    - learner: "Venite in Italia per il caffè, ma restate per le persone che vi insegnano a berlo."
    - tutor: "Splendida chiusura. Grazie, e buon caffè a tutti, rigorosamente prima di mezzogiorno."
      goals: [farewell]

- scenario: intervista-radio
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie dell'invito! Il libro si chiama «Il congiuntivo e altri amori difficili»: è il diario del mio primo anno di dottorato a Padova, raccontato attraverso gli errori che ho fatto in italiano."
    - tutor: "Titolo irresistibile. Ma confessi: prima di arrivare, che idea aveva di noi?"
      goals: [present-book]
    - learner: "Ero convinta che tutti cantano a tavola. Invece a Padova si mangia in silenzio, come in Inghilterra."
      errors: [subjunctive-use]
    - tutor: "Delusione cocente! Ma «ero convinta che tutti cantano»: dopo «ero convinta che», quel verbo non regge."
      prompt: {text: "Ero convinta che tutti cantano", tags: [subjunctive-use]}
    - learner: "Ero convinta che tutti cantino a tavola?"
      errors: [subjunctive-use]
    - tutor: "Era convinta che tutti cantassero a tavola, e invece ha trovato i veneti: una bella doccia fredda! Ci racconta un episodio?"
      recast: {text: "tutti cantino", fix: "tutti cantassero", tags: [subjunctive-use]}
      goals: [stereotype]
    - learner: "Il primo giorno, volendo fare la simpatica, ho salutato il mio professore con «Ci vediamo, ciao!», e lui mi ha guardata come se l'avessi insultato."
    - tutor: "Il «ciao» al professore, un classico intramontabile. E l'italiano, oltre al Lei, che cosa le ha insegnato?"
      goals: [anecdote]
    - learner: "A discutere con eleganza. All'inizio avevo argomenti con tutti, perfino con il barista; adesso uso tre condizionali e vinco sempre."
      errors: [false-friend]
    - tutor: "Discussioni con tutti, perfino con il barista? Allora i condizionali Le hanno salvato la colazione! Ci lascia con una frase?"
      recast: {text: "argomenti con tutti", fix: "discussioni con tutti", tags: [false-friend]}
      goals: [language]
    - learner: "L'ultima riga del libro: in Italia ho imparato che si può essere precisi anche quando si dubita."
    - tutor: "E con questo congiuntivo dell'anima chiudiamo la puntata. Grazie, e buona lettura a tutti."
      goals: [farewell]

- scenario: mediazione-colleghi
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si figuri, ha fatto bene a venire. Capisco che Lei si è sentito messo da parte: me ne sono accorto anch'io."
      errors: [subjunctive-use]
    - tutor: "Grazie. Però, scusi, «capisco che Lei si è sentito»: detto così, quel verbo suona un po' troppo sicuro."
      prompt: {text: "Capisco che Lei si è sentito", tags: [subjunctive-use]}
    - learner: "Ha ragione: capisco che Lei si sia sentito messo da parte. Mi racconta com'è andata, dal Suo punto di vista?"
    - tutor: "Bianchi ha presentato il progetto come se l'avesse fatto da solo. Metà di quelle slide sono mie, e nessuno mi ha nominato."
      goals: [listen]
    - learner: "Mi aiuti a capire: prima della riunione, Bianchi Le aveva detto che La citerà nella presentazione?"
      errors: [conditional-form]
    - tutor: "Me l'aveva promesso, sì. Ma, se posso, «Le aveva detto che La citerà»: in un discorso riferito al passato, quel futuro stona."
      prompt: {text: "Le aveva detto che La citerà", tags: [conditional-form]}
    - learner: "Giusto: Bianchi Le aveva detto che L'avrebbe citato?"
    - tutor: "Sì, davanti alla macchinetta del caffè. Poi, in riunione, niente di niente."
      goals: [clarify]
    - learner: "Le dico una cosa che forse non sa: il direttore gli aveva tagliato il tempo all'ultimo momento. Non credo che l'abbia fatto con intenzione."
      errors: [word-choice]
    - tutor: "Forse non l'ha fatto di proposito, ma il risultato non cambia: il direttore crede che il lavoro sia tutto suo."
      recast: {text: "con intenzione", fix: "di proposito", tags: [word-choice]}
      goals: [perspective]
    - learner: "Ha ragione, e va chiarito. Scriverò io al direttore oggi stesso: il credito per le slide deve andare a chi le ha fatte."
      errors: [false-friend]
    - tutor: "Che il merito per le slide vada a chi le ha fatte è tutto quello che chiedo. E con Bianchi, come pensa di fare?"
      recast: {text: "il credito per le slide", fix: "il merito per le slide", tags: [false-friend]}
    - learner: "Ci parlo domattina, e alla prossima riunione presenterete insieme. La metto in copia nella mail al direttore."
    - tutor: "Mi sembra giusto. Grazie per avermi ascoltato: entrando ero furioso, adesso sono solo un po' arrabbiato."
      goals: [solution]

- scenario: mediazione-colleghi
  level: C2
  persona: es-f-teacher
  history: [ci-ne]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Ha fatto bene a venire subito. Mi dica pure: che cosa non Le è andato giù?"
    - tutor: "Che Ferri si sia preso il merito del lavoro di tutti e due. Io ho passato tre notti sui dati, e lui ha parlato come se fossero suoi."
    - learner: "Tre notti sui dati e nessun riconoscimento: al Suo posto sarei furiosa anch'io. Mi aiuti però a ricostruire: vi eravate messi d'accordo su chi avrebbe presentato?"
    - tutor: "Avevamo detto che avremmo presentato insieme. Poi lui ha cominciato a parlare e non mi ha più passato la parola."
      goals: [listen, clarify]
    - learner: "Capisco. Non lo giustifico, ma Ferri è in prova fino a giugno, e forse ha voluto lucirsi davanti al direttore."
      errors: [false-friend]
    - tutor: "Mettersi in mostra sulle spalle degli altri, però... Va bene, capisco la pressione, ma questo non cambia quello che ha fatto."
      recast: {text: "lucirsi", fix: "mettersi in mostra", tags: [false-friend]}
      goals: [perspective]
    - learner: "No, non lo cambia. Ne parlerò con lui oggi stesso, perché va della fiducia di tutta la squadra."
      errors: [ci-ne]
    - tutor: "Lo spero. Ma «va della fiducia»: in quell'espressione manca una particella all'inizio."
      prompt: {text: "va della fiducia", tags: [ci-ne]}
    - learner: "Perché ci va della fiducia di tutta la squadra?"
      errors: [ci-ne]
    - tutor: "Esatto, ne va della fiducia di tutta la squadra, e mi fa piacere che lo dica Lei. Come pensa di sistemare le cose?"
      recast: {text: "ci va della fiducia", fix: "ne va della fiducia", tags: [ci-ne]}
    - learner: "Gli chiederò di scrivere una mail al direttore con i nomi di chi ha lavorato ai dati, e d'ora in poi le presentazioni le divideremo per iscritto prima di ogni riunione."
    - tutor: "Una mail e delle regole chiare: è più di quanto sperassi. Grazie, vado a lavorare un po' più tranquilla."
      goals: [solution]

# Set u-right-b2, file 7: B1 friends; parties, trips, cooking, memories, holidays, health, volunteering.
- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [object-pronoun, future-form]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Io farei una festa a sorpresa a casa mia, sabato prossimo. Il soggiorno è grande."
  - tutor: "Ottima idea! E chi invitiamo?"
    goals: [date]
  - learner: "Tutti i colleghi dell'ufficio e i suoi amici del corso di ballo. Saranno una ventina."
  - tutor: "Una ventina, perfetto. E da mangiare?"
    goals: [guests]
  - learner: "Io prepararò una paella, e la torta la ordiniamo in pasticceria."
    errors: [future-form]
  - tutor: "Prepararò? Ascolta bene il futuro di questo verbo."
    prompt: {text: "prepararò", tags: [future-form]}
  - learner: "Preparerò una paella, scusa."
  - tutor: "Esatto. La paella! Sara la adorerà. E il regalo?"
    goals: [food]
  - learner: "Pensavo a un buono per un massaggio. Lei mi ha detto che è sempre stanca."
  - tutor: "Bellissima idea. E come facciamo a tenerla lontana da casa tua?"
    goals: [gift]
  - learner: "Sabato pomeriggio io la porto a fare un giro in centro. La dico che è solo per noi due."
    errors: [object-pronoun]
  - tutor: "La dico? Pensa: si dice qualcosa a qualcuno."
    prompt: {text: "La dico", tags: [object-pronoun]}
  - learner: "Le dico che è solo per noi due."
  - tutor: "Esatto. Così noi prepariamo tutto con calma. Che bella sorpresa!"

- scenario: consigli-viaggio
  level: B1
  persona: es-f-teacher
  turns:
  - tutor: "Allora, quando parti per Napoli?"
  - learner: "Parto venerdì e resto cinque giorni. È la prima volta che ci vado!"
  - tutor: "Che bello! Cosa vuoi vedere?"
    goals: [plans]
  - learner: "Il centro storico, Pompei e forse Capri. Tu cosa mi consigli?"
  - tutor: "Il centro storico è bellissimo, ma Capri d'estate è troppo piena. Vai a Procida, invece!"
    goals: [advice]
  - learner: "Procida? Non ne ho mai sentito parlare. Com'è?"
  - tutor: "È un'isola piccola, colorata e tranquilla. Ci arrivi in nave in un'ora."
  - learner: "E per andare a Pompei, prendo un treno o un autobus?"
  - tutor: "Prendi il treno locale dalla stazione centrale: non è comodo, ma costa poco."
    goals: [transport]
  - learner: "Va bene. C'è qualcosa a cui devo stare attenta?"
  - tutor: "Sì: sui mezzi tieni lo zaino davanti, e non lasciare mai il telefono sul tavolo al bar."
    goals: [warnings]
  - learner: "Grazie, sei un tesoro! Ti mando tante foto."
  - tutor: "Divertiti, e mangia una pizza anche per me!"

- scenario: cucina-ricetta
  level: B1
  persona: en-m-traveller
  history: [imperative-form]
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "Stasera cuciniamo un curry di pollo, una ricetta che ho imparato in India."
  - tutor: "Che bello! Cosa ci serve?"
  - learner: "Ci servono pollo, cipolle, pomodori, latte di cocco e tante spezie."
  - tutor: "Ho tutto tranne il latte di cocco. Vado a comprarlo?"
    goals: [ingredients]
  - learner: "Sì, grazie. Io taglio le cipolle. Tu, quando torni, taglia il pollo a pezzi piccoli."
  - tutor: "Va bene, capo! E poi?"
  - learner: "Poi metti le cipolle in padella con l'olio. Non le bruciare, mi raccomando!"
  - tutor: "Promesso. E quanto tempo deve cuocere?"
    goals: [steps]
  - learner: "Il pollo cuoce venti minuti. Poi aggiungere il latte di cocco e cuoci altri dieci minuti."
    errors: [imperative-form]
  - tutor: "Poi aggiungere? Mi stai dicendo cosa fare, no?"
    prompt: {text: "aggiungere", tags: [imperative-form]}
  - learner: "Sì: aggiungere il latte e cuoci ancora dieci minuti."
    errors: [imperative-form]
  - tutor: "Allora aggiungi tu il latte, e io giro il pollo. Trenta minuti in tutto, quindi. Con cosa lo serviamo?"
    recast: {text: "aggiungere", fix: "aggiungi", tags: [imperative-form]}
    goals: [time]
  - learner: "Con il riso bianco e un po' di yogurt sopra. In India lo mangiano con le mani!"
  - tutor: "Con le mani io no, ma con il riso sì! Preparo la tavola."
    goals: [serve]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect, essere-avere]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccola?"
  - learner: "Io abitavo in un paese vicino a Salamanca. Era piccolo, c'erano solo due bar e una chiesa."
  - tutor: "Due bar e una chiesa, il classico paese! Cosa facevi il pomeriggio?"
    goals: [place]
  - learner: "Quando ero sei o sette anni, giocavo in piazza con mio cugino fino a sera."
    errors: [essere-avere]
  - tutor: "Quando ero sei anni? Per l'età, quale verbo usiamo?"
    prompt: {text: "ero sei o sette anni", tags: [essere-avere]}
  - learner: "Quando avevo sei o sette anni, giocavo in piazza."
  - tutor: "Esatto. Senza telefono, immagino! E a scuola com'eri?"
    goals: [habits]
  - learner: "Ero brava in matematica, ma parlavo troppo. La maestra mi metteva sempre al primo banco."
  - tutor: "Ah, parlavi tanto! Hai un ricordo speciale di quegli anni?"
    goals: [school]
  - learner: "Sì. Una volta, a nove anni, mi perdevo nel bosco con mio fratello."
    errors: [tense-aspect]
  - tutor: "Mi perdevo? È successo una volta sola, no?"
    prompt: {text: "mi perdevo", tags: [tense-aspect]}
  - learner: "Ah, sì: mi sono persa nel bosco con mio fratello. Ci hanno trovati di notte!"
  - tutor: "Che paura! I tuoi genitori saranno stati molto preoccupati."
    goals: [event]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [articulated-preposition, question-form]
  turns:
  - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
  - learner: "Da noi, in Australia, Natale è d'estate! Spesso mangiamo al mare, con il barbecue."
  - tutor: "Natale al mare, incredibile! E quando eri piccola, cosa facevate?"
    goals: [compare]
  - learner: "La mattina aprivamo i regali sotto l'albero, e poi andavamo tutti a la spiaggia."
    errors: [articulated-preposition]
  - tutor: "A la spiaggia? Come si uniscono queste due parole?"
    prompt: {text: "a la spiaggia", tags: [articulated-preposition]}
  - learner: "Alla spiaggia, con i cugini e i nonni."
  - tutor: "Esatto. Che bel ricordo! Vuoi sapere qualcosa delle nostre feste?"
    goals: [past]
  - learner: "Sì! Cosa mangiate la sera prima di Natale?"
  - tutor: "La sera della Vigilia mangiamo solo pesce, poi a mezzanotte andiamo in chiesa."
    goals: [ask]
    new: [{lemma: Vigilia, gloss: Christmas Eve}, {lemma: mezzanotte, gloss: midnight}]
  - learner: "Interessante. E per il pranzo, cosa io posso portare?"
    errors: [question-form]
  - tutor: "Cosa io posso portare? Ascolta l'ordine delle parole."
    prompt: {text: "cosa io posso portare", tags: [question-form]}
  - learner: "Cosa posso portare io? Del vino o un dolce?"
  - tutor: "Esatto. Un dolce è perfetto! Ma non portare dolci di Natale, ne abbiamo già tre."
    goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Sono stato in Sardegna con mia moglie, per due settimane."
  - tutor: "Che bello! Che tempo avete trovato?"
    goals: [where]
  - learner: "Caldo, ma c'era sempre un po' di vento, quindi si stava bene."
  - tutor: "Lì il vento non manca mai! E cosa avete fatto?"
    goals: [weather]
  - learner: "Abbiamo preso una barca per girare la costa. Un giorno abbiamo salito anche su una montagna."
    errors: [auxiliary-choice]
  - tutor: "Abbiamo salito? Pensa all'ausiliare di «salire»."
    prompt: {text: "abbiamo salito", tags: [auxiliary-choice]}
    new: [{lemma: ausiliare, gloss: auxiliary verb}]
  - learner: "Sì, abbiamo salito fino in cima, era altissima."
    errors: [auxiliary-choice]
  - tutor: "Che bello! Anche noi siamo saliti in cima a una montagna lì, due anni fa. Qual è stata la cosa più bella?"
    recast: {text: "abbiamo salito", fix: "siamo saliti", tags: [auxiliary-choice]}
    goals: [activities]
  - learner: "Le spiagge, senza dubbio. L'acqua era così chiara che si vedevano i pesci."
  - tutor: "Ti credo! Mi hai fatto venire voglia di partire."
    goals: [best]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [comparative]
  turns:
  - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
  - learner: "Non molto sane. Lavoro in ufficio tutto il giorno e la sera sono troppo stanco per fare sport."
  - tutor: "Capisco. E come mangi?"
  - learner: "Mangio spesso fuori, panini e pizza. Mia madre dice che mangio peggio di quando ero studente."
  - tutor: "Allora c'è da lavorare! Qual è il tuo obiettivo?"
    goals: [habits]
  - learner: "Vorrei perdere cinque chili e sentirmi più in forma."
  - tutor: "Obiettivo giusto. Cosa ti ha fermato finora?"
    goals: [goal]
  - learner: "La pigrizia, soprattutto. E poi la palestra è più cara che la piscina, quindi non ci vado."
    errors: [comparative]
  - tutor: "Più cara che la piscina? Pensa alla parola che viene dopo «più cara»."
    prompt: {text: "più cara che la piscina", tags: [comparative]}
  - learner: "Sì, la palestra è più cara che la piscina, quasi il doppio."
    errors: [comparative]
  - tutor: "Se la palestra è più cara della piscina, andiamo in piscina! Due volte a settimana, più una lunga camminata la domenica?"
    recast: {text: "più cara che la piscina", fix: "più cara della piscina", tags: [comparative]}
    goals: [obstacles]
  - learner: "Va bene. Martedì e giovedì in piscina, domenica camminata. Proverò!"
  - tutor: "Non proverai: lo farai! Ci vediamo martedì."
    goals: [plan]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [relative-pronoun, piacere]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  - learner: "Sì, molto. Sono qui per studiare e vorrei fare qualcosa di utile per la città."
  - tutor: "Che bello! Cosa sai fare?"
    goals: [motivation]
  - learner: "Parlo inglese e francese, e mi piace molto i bambini."
    errors: [piacere]
  - tutor: "Mi piace i bambini? Pensa al verbo: i bambini sono tanti."
    prompt: {text: "mi piace molto i bambini", tags: [piacere]}
  - learner: "Mi piacciono molto i bambini. Al liceo aiutavo i ragazzi più piccoli con i compiti."
  - tutor: "Esatto. Perfetto, abbiamo un doposcuola per bambini stranieri. Quanto tempo hai?"
    goals: [skills]
    new: [{lemma: doposcuola, gloss: after-school club}]
  - learner: "Due pomeriggi a settimana, il martedì e il giovedì."
  - tutor: "Ottimo. Ci sono due attività: il doposcuola o la cucina per le persone senza casa."
    goals: [time]
    new: [{lemma: doposcuola, gloss: after-school club}]
  - learner: "Preferisco il doposcuola. È l'attività che ho più esperienza."
    errors: [relative-pronoun]
  - tutor: "L'attività che ho più esperienza? Manca qualcosa per unire le due parti."
    prompt: {text: "l'attività che", tags: [relative-pronoun]}
  - learner: "Sì, è l'attività che ho fatto di più, l'attività che ho più esperienza."
    errors: [relative-pronoun]
  - tutor: "Allora il doposcuola è l'attività in cui hai più esperienza: perfetto! Ti aspetto martedì alle tre."
    recast: {text: "l'attività che", fix: "l'attività in cui", tags: [relative-pronoun]}
    goals: [choose]
    new: [{lemma: doposcuola, gloss: after-school club}]
  - learner: "Grazie! A martedì, allora."
  - tutor: "A martedì! I bambini saranno contenti."

# Set u-right-b2, file 2: B2 work; interviews, promotions and meetings.
- scenario: colloquio-lavoro
  level: B2
  persona: en-f-professional
  history: [false-friend, subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono australiana, vivo a Milano da quattro anni e lavoro nella comunicazione."
  - tutor: "Molto bene. Che cosa faceva nel suo lavoro precedente?"
    goals: [intro]
  - learner: "Lavoravo per un marchio di cosmetici. Ho cominciato come assistente, ma eventualmente sono diventata responsabile dei social."
    errors: [false-friend]
  - tutor: "Quindi alla fine è diventata responsabile: un bel percorso. In quanto tempo?"
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
  - learner: "In circa due anni. Ero molto contenta, anche se il lavoro era tanto."
  - tutor: "Immagino. Qual è secondo lei il suo punto di forza?"
    goals: [experience]
  - learner: "Penso che sono molto organizzata. Un mio difetto è che a volte voglio controllare tutto io."
    errors: [subjunctive-use]
  - tutor: "Penso che sono...? Ripensi a come continua la frase dopo «penso»."
    prompt: {text: "Penso che sono", tags: [subjunctive-use]}
  - learner: "Ah, sì: penso di essere molto organizzata."
  - tutor: "Esatto. E almeno conosce il suo difetto, che è già un buon inizio. Perché vorrebbe lavorare con noi?"
    goals: [strengths]
    new: [{lemma: difetto, gloss: flaw}]
  - learner: "Perché ho visto i vostri progetti e mi piacciono molto. Credo che il vostro stile sia vicino al mio."
  - tutor: "Ci fa piacere. Ha qualche domanda per me?"
    goals: [why]
  - learner: "Sì: quante persone ci sono nel gruppo, e con chi lavorerei di più?"
  - tutor: "Il gruppo è di sei persone, e lavorerebbe soprattutto con la nostra direttrice."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Ho trentaquattro anni, sono spagnolo e faccio il grafico da dieci anni."
  - tutor: "Dieci anni sono tanti. Dove ha lavorato finora?"
    goals: [intro]
  - learner: "Prima in una tipografia a Siviglia, poi in uno studio a Torino. A Torino ho rimasto cinque anni."
    errors: [auxiliary-choice]
  - tutor: "Ho rimasto? Pensi all'ausiliare di «rimanere»."
    prompt: {text: "ho rimasto", tags: [auxiliary-choice]}
    new: [{lemma: ausiliare, gloss: auxiliary verb}]
  - learner: "Sono rimasto cinque anni, sì."
  - tutor: "Perfetto. E cosa faceva, di preciso, in quello studio?"
  - learner: "Disegnavo soprattutto loghi e cataloghi per aziende di vini. Mi piaceva molto."
  - tutor: "Bel settore. Quali sono i suoi punti di forza?"
    goals: [experience]
  - learner: "Sono preciso e rispetto sempre le scadenze. Il mio punto debole è che parlo poco nelle riunioni."
  - tutor: "Qui le riunioni sono brevi, per fortuna! Perché ha scelto la nostra azienda?"
    goals: [strengths]
  - learner: "Mi hanno detto che qui c'è un bel ambiente. E poi mia moglie lavora vicino, in centro."
    errors: [article-form]
  - tutor: "Un bel ambiente? Ascolti il suono che viene prima di «ambiente»."
    prompt: {text: "un bel ambiente", tags: [article-form]}
  - learner: "Un bell'ambiente, scusi."
  - tutor: "Esatto. Ed è vero, qui si sta bene. Vuole chiedermi qualcosa?"
    goals: [why]
  - learner: "Sì, vorrei sapere se è possibile lavorare da casa qualche giorno."
  - tutor: "Sì, due giorni a settimana, dopo il periodo di prova."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Grazie. Sono nato a Boston, ma i miei nonni erano di Lecce. Sono ingegnere informatico."
  - tutor: "Che bello, una famiglia del Sud! Che esperienza ha nel settore?"
    goals: [intro]
  - learner: "Ho lavorato sei anni per una banca americana. Mi occupavo della sicurezza delle app."
  - tutor: "Un'esperienza importante. Quali sono i suoi punti forti?"
    goals: [experience]
  - learner: "Sono paziente e so semplificare. Ai clienti dovevo spiegarli i problemi tecnici ogni giorno."
    errors: [object-pronoun]
  - tutor: "Spiegarli? Pensi: si spiega qualcosa a qualcuno."
    prompt: {text: "spiegarli", tags: [object-pronoun]}
  - learner: "Sì, dovevo spiegarli i problemi in modo semplice."
    errors: [object-pronoun]
  - tutor: "Spiegargli i problemi in modo semplice è una dote rara, mi creda. E un suo difetto?"
    recast: {text: "spiegarli", fix: "spiegargli", tags: [object-pronoun]}
    new: [{lemma: dote, gloss: talent}, {lemma: difetto, gloss: flaw}]
  - learner: "Forse sono troppo diretto. A volte dico quello che penso senza pensarci due volte."
  - tutor: "Meglio diretto che poco chiaro, almeno per noi. Come mai vuole lavorare qui?"
    goals: [strengths]
  - learner: "La mia famiglia vuole tornare in Italia, e voi siete una delle poche aziende che lavorano in inglese."
  - tutor: "Sì, metà del gruppo è straniera. Ha domande?"
    goals: [why]
  - learner: "Quando sapreste dirmi qualcosa?"
  - tutor: "Entro la fine del mese: le scriveremo noi."
    goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-use, word-choice]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Volevo parlare del mio lavoro di quest'anno e del mio futuro qui."
  - tutor: "Certo. Mi dica pure come è andato secondo lei."
  - learner: "Credo che sia andato bene. Ho chiuso tre progetti in anticipo e abbiamo guadagnato due clienti nuovi."
    errors: [word-choice]
  - tutor: "Sì, avete acquisito due clienti nuovi, lo so bene, e i numeri parlano chiaro. Cosa vorrebbe chiedermi?"
    recast: {text: "guadagnato due clienti nuovi", fix: "acquisito due clienti nuovi", tags: [word-choice]}
    goals: [results]
    new: [{lemma: acquisire, gloss: to gain (clients)}]
  - learner: "Vorrei diventare coordinatrice del gruppo. Penso che sono pronta."
    errors: [subjunctive-use]
  - tutor: "Penso che sono pronta? Ricordi cosa ci vuole dopo «penso»."
    prompt: {text: "Penso che sono pronta", tags: [subjunctive-use]}
  - learner: "Ah, sì: penso di essere pronta."
  - tutor: "Esatto. Il problema è che quest'anno i soldi per le promozioni sono molto pochi."
    goals: [request]
  - learner: "Capisco. Però se non è possibile adesso, almeno si potrebbe fissare una data?"
  - tutor: "Mi sembra ragionevole. Ne parlo con la direzione e le do una risposta."
    goals: [handle]
  - learner: "Grazie. Spero che la risposta arrivi prima dell'estate."
  - tutor: "Ci vediamo di nuovo a maggio: a quel punto sapremo anche quanto possiamo spendere."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-traveller
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Lavoro qui da tre anni, e in questo periodo le vendite del mio settore sono cresciute molto."
  - tutor: "Lo so, ha fatto un ottimo lavoro. Di quanto sono cresciute?"
  - learner: "Del venti per cento. Quanto ai clienti nuovi, ne ho portati dodici solo quest'anno."
  - tutor: "Numeri notevoli. Quindi cosa mi chiede, esattamente?"
    goals: [results]
  - learner: "Vorrei un aumento di stipendio. Sono sicuro che lei capisce il motivo."
  - tutor: "Lo capisco, ma gli aumenti si decidono a gennaio, non prima."
    goals: [request]
  - learner: "Lo so, ma a gennaio mancano otto mesi. Non ci sarebbe una soluzione prima?"
  - tutor: "Potrei darle un premio legato ai risultati dei prossimi tre mesi. Che ne dice?"
  - learner: "Un premio mi va bene, se poi a gennaio parliamo anche dell'aumento."
  - tutor: "Affare fatto. Le scrivo oggi con gli obiettivi dei prossimi tre mesi."
    goals: [handle, next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: es-m-worker
  history: [combined-pronouns, preposition]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Da quando Marco è andato via, faccio anche il suo lavoro."
  - tutor: "L'ho notato, e la ringrazio. Come sta andando?"
  - learner: "Bene: ho finito il progetto per il cliente tedesco e l'ho consegnato a tempo."
    errors: [preposition]
  - tutor: "L'ha consegnato a tempo? Ascolti bene la preposizione."
    prompt: {text: "a tempo", tags: [preposition]}
  - learner: "Sì, l'ho consegnato a tempo, una settimana fa."
    errors: [preposition]
  - tutor: "Sì, l'ha consegnato in tempo, e il cliente era molto soddisfatto. Quindi?"
    recast: {text: "a tempo", fix: "in tempo", tags: [preposition]}
    goals: [results]
  - learner: "Quindi vorrei un contratto da responsabile. Il lavoro lo faccio già, manca solo il titolo."
  - tutor: "Capisco. Ma per quel ruolo l'azienda chiede anche un corso di gestione."
    goals: [request]
    new: [{lemma: gestione, gloss: management}]
  - learner: "Il corso lo posso fare di sera. Se l'azienda lo paga, lo comincio subito."
  - tutor: "Mi sembra una buona idea. Il modulo per il corso ce l'ho io: le serve?"
    goals: [handle]
  - learner: "Sì, mi lo può mandare oggi? Così lo compilo stasera."
    errors: [combined-pronouns]
  - tutor: "Mi lo? Quando i due pronomi stanno insieme, il primo cambia."
    prompt: {text: "mi lo", tags: [combined-pronouns]}
  - learner: "Me lo può mandare oggi?"
  - tutor: "Esatto. Glielo mando entro un'ora, e a fine corso parliamo del contratto."
    goals: [next-steps]

- scenario: riunione-lavoro
  level: B2
  persona: en-f-student
  history: [future-form, false-friend]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Ho finito l'analisi dei dati e i risultati sono abbastanza consistenti."
    errors: [false-friend]
  - tutor: "Bene, se sono abbastanza coerenti siamo a buon punto. Ci sono stati problemi?"
    recast: {text: "abbastanza consistenti", fix: "abbastanza coerenti", tags: [false-friend]}
    goals: [update]
    new: [{lemma: coerente, gloss: consistent}]
  - learner: "Sì, uno: i dati di marzo mancano. Il collega che li doveva mandare sarà in ferie, non risponde da giorni."
  - tutor: "Sì, è in ferie fino a lunedì. Cosa proponi?"
    goals: [problem]
  - learner: "Per ora uso i dati di febbraio. Quando torna il collega, aggiornarò il rapporto."
    errors: [future-form]
  - tutor: "Aggiornarò? Guarda bene la forma del futuro."
    prompt: {text: "aggiornarò", tags: [future-form]}
  - learner: "Aggiornerò il rapporto, scusa."
  - tutor: "Esatto. Mi sembra una buona soluzione. Per quando pensi di finire?"
    goals: [proposal]
  - learner: "Penso che finirò venerdì, se va tutto bene."
  - tutor: "Venerdì va benissimo. Allora segno venerdì come scadenza."
    goals: [deadline]

- scenario: riunione-lavoro
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Va avanti. Abbiamo chiuso la prima fase e ieri ho presentato il prototipo al cliente."
  - tutor: "E com'è andata?"
    goals: [update]
  - learner: "Bene, ma il cliente vuole delle modifiche. La persona con chi ho parlato vuole cambiare i colori."
    errors: [relative-pronoun]
  - tutor: "La persona con chi? Dopo una preposizione, come cambia il pronome?"
    prompt: {text: "con chi", tags: [relative-pronoun]}
  - learner: "Sì, la persona con chi ho parlato è la direttrice."
    errors: [relative-pronoun]
  - tutor: "Ah, la persona con cui hai parlato è la direttrice? Allora le modifiche sono serie. È un problema per i tempi?"
    recast: {text: "con chi", fix: "con cui", tags: [relative-pronoun]}
  - learner: "Sì, abbastanza. Credo che ci servano almeno due settimane in più."
  - tutor: "Due settimane... Hai qualche idea per recuperare?"
    goals: [problem]
  - learner: "Si potrebbe chiedere aiuto a Paolo per la parte grafica. Lui ne sa più di me."
  - tutor: "Buona idea, glielo chiedo io oggi. Allora che scadenza diamo al cliente?"
    goals: [proposal]
  - learner: "Direi il venti del mese prossimo, così abbiamo un po' di margine."
  - tutor: "D'accordo, il venti. Lo comunico al cliente nel pomeriggio."
    goals: [deadline]

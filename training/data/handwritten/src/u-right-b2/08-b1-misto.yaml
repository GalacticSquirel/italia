# Set u-right-b2, file 8: B1 mixed; neighbours, work, books, a flat, a restaurant, a trip.
- scenario: vicino-rumoroso
  level: B1
  persona: es-f-teacher
  history: [conditional-form, word-choice]
  turns:
  - tutor: "Sì? Buonasera, posso aiutarla?"
  - learner: "Buonasera, scusi il disturbo. Sono la vicina del secondo piano, mi chiamo Carmen."
  - tutor: "Piacere, Carmen. Mi dica pure."
    goals: [greet]
  - learner: "Ecco, la sera sento molto ruido dal suo appartamento, soprattutto dopo mezzanotte."
    errors: [word-choice]
  - tutor: "Mi dispiace per il rumore, sarà la lavatrice. La faccio partire tardi perché costa meno."
    recast: {text: "ruido", fix: "rumore", tags: [word-choice]}
    goals: [problem]
  - learner: "Capisco, ma io mi alzo alle sei per andare a scuola. Poteria usarla prima delle undici?"
    errors: [conditional-form]
  - tutor: "Poteria? Il condizionale di «potere» è un po' diverso."
    prompt: {text: "Poteria", tags: [conditional-form]}
    new: [{lemma: condizionale, gloss: conditional}]
  - learner: "Potrebbe usarla prima delle undici?"
  - tutor: "Esatto. Prima delle undici è difficile, torno tardi dal lavoro."
    goals: [request]
  - learner: "E se la mettesse la mattina presto? Ci sono i programmi con l'orologio."
  - tutor: "Non ci avevo pensato. Va bene, da domani la faccio partire alle sette di mattina."
    goals: [compromise]
  - learner: "Grazie mille, è molto gentile. Se ha bisogno di qualcosa, sono qui sotto."
  - tutor: "Grazie a lei, e scusi per le notti passate. Buonanotte!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [possessive, reflexive]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, quasi sempre. Vado in ufficio solo il primo lunedì del mese."
  - tutor: "Che fortuna! Ti piace?"
    goals: [situation]
  - learner: "Sì. Posso lavorare in tuta e pranzare con la mia figlia."
    errors: [possessive]
  - tutor: "Con la mia figlia? Con i nomi di famiglia al singolare, cosa cambia?"
    prompt: {text: "la mia figlia", tags: [possessive]}
  - learner: "Pranzo con mia figlia tutti i giorni, è bellissimo."
  - tutor: "Esatto. Che bello! E non c'è niente che non ti piaccia?"
    goals: [pros]
  - learner: "Sì, a volte lavoro troppo. Il computer è sempre lì e non so quando fermare."
    errors: [reflexive]
  - tutor: "Non so quando fermare? Chi si ferma, il computer o tu?"
    prompt: {text: "quando fermare", tags: [reflexive]}
  - learner: "Io! Non so quando fermarmi."
  - tutor: "Esatto. Succede a molti. Se potessi scegliere, cosa preferiresti?"
    goals: [cons]
  - learner: "Preferirei andare in ufficio una volta a settimana, per vedere i colleghi. Mi mancano un po'."
  - tutor: "Mi sembra una buona idea. Prova a chiederlo al tuo capo!"
    goals: [preference]

- scenario: riunione-lavoro
  level: B1
  persona: es-f-erasmus
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene. Ho finito le domande per i clienti e ho già raccolto duecento risposte."
  - tutor: "Ottimo lavoro! Ci sono problemi?"
    goals: [update]
  - learner: "Sì, uno piccolo: molte persone non hanno risposto all'ultima domanda. Forse era troppo lunga."
  - tutor: "Può darsi. Cosa proponi di fare?"
    goals: [problem]
  - learner: "Potrei mandare una mail con solo quella domanda, più corta."
  - tutor: "Buona idea. Quando pensi di avere i risultati?"
    goals: [proposal]
  - learner: "Penso che li avrò la settimana prossima, entro mercoledì."
  - tutor: "Perfetto, allora mercoledì li presentiamo al cliente."
    goals: [deadline]

- scenario: film-libro
  level: B1
  persona: es-f-teacher
  history: [past-participle-form]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Ho letto un giallo italiano, che succede a Trieste. L'ho finito ieri sera."
  - tutor: "Un giallo, bene! Di cosa parla, senza dire troppo?"
    new: [{lemma: giallo, gloss: crime novel}]
  - learner: "Un commissario deve capire chi ha ucciso un uomo ricco. L'hanno scoprito nel porto, una mattina d'inverno."
    errors: [past-participle-form]
  - tutor: "L'hanno scoprito? Il participio di «scoprire» è diverso."
    prompt: {text: "L'hanno scoprito", tags: [past-participle-form]}
    new: [{lemma: participio, gloss: participle}]
  - learner: "Sì, l'hanno scoprito vicino alle barche."
    errors: [past-participle-form]
  - tutor: "Ah, l'hanno scoperto vicino alle barche: che inizio! Com'è il commissario?"
    recast: {text: "l'hanno scoprito", fix: "l'hanno scoperto", tags: [past-participle-form]}
    goals: [summary]
    new: [{lemma: scoperto, gloss: discovered}, {lemma: commissario, gloss: police inspector}]
  - learner: "È un uomo triste e solo, ma molto intelligente. Mi è piaciuto tantissimo."
  - tutor: "Personaggi così piacciono sempre! E la storia, invece?"
    goals: [characters]
  - learner: "Mi è piaciuto, ma il finale è un po' lento. Lo consiglio a chi ama i gialli classici."
  - tutor: "Perfetto, lo metto nella lista del prossimo mese."
    goals: [opinion, recommend]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [noun-number]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono australiana, ho trentadue anni e vivo a Bologna da un anno."
  - tutor: "Benvenuta. Che lavoro faceva in Australia?"
    goals: [intro]
  - learner: "Lavoravo in un albergo, alla reception. Parlavo ogni giorno con clienti di tanti paesi."
  - tutor: "Bene. E perché ha lasciato quel lavoro?"
  - learner: "Perché mio marito ha trovato lavoro qui. Ho lasciato il lavoro, ma non mi pento."
  - tutor: "Capisco. Quali sono i suoi punti forti?"
    goals: [experience]
  - learner: "Sono paziente e parlo tre lingue: inglese, francese e un po' di giapponese. Però sono troppo critica con me stessa."
  - tutor: "Le lingue qui sono molto utili. Perché vuole lavorare con noi?"
    goals: [strengths]
  - learner: "Ho letto ottime recensione del vostro studio."
    errors: [noun-number]
  - tutor: "Ottime recensione? Ascolti bene il plurale."
    prompt: {text: "ottime recensione", tags: [noun-number]}
  - learner: "Sì, ottime recensione su internet."
    errors: [noun-number]
  - tutor: "Le ottime recensioni ci fanno sempre piacere! Ha qualche domanda per me?"
    recast: {text: "ottime recensione", fix: "ottime recensioni", tags: [noun-number]}
    goals: [why]
    new: [{lemma: recensione, gloss: review}]
  - learner: "Sì: l'orario è flessibile?"
  - tutor: "Abbastanza: si entra tra le otto e le dieci. Le faremo sapere entro venerdì."
    goals: [questions]

- scenario: affittare-appartamento
  level: B1
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno. Che bello, c'è tanta luce! Quanto costa l'affitto?"
  - tutor: "Seicentocinquanta euro al mese, con le spese."
    goals: [rent]
  - learner: "E il contratto? Quanti mesi di deposito volete?"
  - tutor: "Due mesi di deposito, e il contratto è di quattro anni."
    goals: [contract]
  - learner: "Va bene. Il riscaldamento funziona bene? D'inverno io ho sempre freddo."
  - tutor: "Sì, è tutto nuovo, l'abbiamo cambiato a ottobre."
    goals: [condition]
  - learner: "Perfetto. E il quartiere? C'è un parco vicino? Ho un cane."
  - tutor: "Sì, a cinque minuti c'è un parco con uno spazio per i cani."
    goals: [neighbourhood]
  - learner: "Allora l'appartamento mi interessa molto. Posso pensarci fino a domani?"
  - tutor: "Certo, mi chiami domani entro le dodici."
    goals: [decide]

- scenario: prenotare-tavolo
  level: B1
  persona: es-f-erasmus
  history: [false-friend, verb-form]
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera! Vorrei prenotare un tavolo per stasera, siamo in quattro."
  - tutor: "Stasera è un po' pieno... A che ora volete venire?"
    goals: [book]
  - learner: "Alle nove e mezza. Forse siamo in cinque: mio cugino non sa ancora se vene."
    errors: [verb-form]
  - tutor: "Se vene? Ascolti bene la forma di «venire»."
    prompt: {text: "vene", tags: [verb-form]}
  - learner: "Non sa ancora se viene."
  - tutor: "Esatto. Va bene, alle nove e mezza ho un tavolo per cinque."
    goals: [details]
  - learner: "Perfetto. Una mia amica è imbarazzata, può sedersi vicino alla finestra? Ha bisogno di aria."
    errors: [false-friend]
  - tutor: "Ah, se è incinta, vi do il tavolo vicino alla finestra, così sta più comoda."
    recast: {text: "è imbarazzata", fix: "è incinta", tags: [false-friend]}
    goals: [special]
    new: [{lemma: incinta, gloss: pregnant}]
  - learner: "Grazie mille, è molto gentile."
  - tutor: "Si figuri. A che nome prenoto?"
  - learner: "A nome Marta Ruiz."
  - tutor: "Perfetto: stasera alle nove e mezza, cinque persone, tavolo vicino alla finestra."
    goals: [name]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-retired
  history: [ci-ne, word-order]
  turns:
  - tutor: "Allora, quando parti per Napoli?"
  - learner: "Partiamo lunedì, io e mia moglie. Restiamo una settimana."
  - tutor: "Una settimana intera, che bello! Avete già un programma?"
    goals: [plans]
  - learner: "Io voglio vedere i musei, ma mia moglie preferisce i negozi. Lei sempre compra troppo!"
    errors: [word-order]
  - tutor: "Lei sempre compra? Ascolta dove mettiamo «sempre»."
    prompt: {text: "Lei sempre compra", tags: [word-order]}
  - learner: "Lei compra sempre troppo!"
  - tutor: "Esatto! Allora andate al Museo Archeologico, e poi lei può girare per i negozi del centro."
    goals: [advice]
  - learner: "Ottima idea. Mia moglie vuole anche mangiare la pizza ogni giorno. Io di pizzerie famose conosco solo una."
    errors: [ci-ne]
  - tutor: "Conosco solo una? Qui manca una piccola parola."
    prompt: {text: "conosco solo una", tags: [ci-ne]}
  - learner: "Ah, sì: ne conosco solo una."
  - tutor: "Esatto. Ma ce ne sono tantissime: chiedete in albergo quali sono le più vecchie del centro!"
  - learner: "Va bene. Per andare dall'aeroporto al centro, ci sono autobus?"
  - tutor: "Sì, c'è un autobus ogni venti minuti, costa cinque euro."
    goals: [transport]
  - learner: "E i taxi? Ho letto che sono cari. Ne prendiamo uno o è meglio l'autobus?"
  - tutor: "Il taxi ha un prezzo fisso, circa venti euro. Ma attenzione sull'autobus: tenete il portafoglio nella tasca davanti."
    goals: [warnings]
    new: [{lemma: portafoglio, gloss: wallet}]
  - learner: "Grazie del consiglio. Allora prendiamo il taxi, è più tranquillo."
  - tutor: "Ottima scelta. Buon viaggio, e mangiate un dolce anche per me!"

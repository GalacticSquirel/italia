# Set u-right-b2, file 4: B2 opinions; cars in the centre, the future of work, working from home.
- scenario: dibattito-ambiente
  level: B2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io non sono d'accordo. Penso che sia una buona idea, almeno nel fine settimana."
  - tutor: "Ma perché? Chi fa la spesa in centro ha bisogno della macchina."
    goals: [position]
  - learner: "Per due motivi. L'aria sarebbe più pulita, e la gente camminerebbe di più nelle vie dei negozi."
  - tutor: "Sì, ma gli anziani? Non tutti possono camminare tanto."
    goals: [argue]
  - learner: "È vero, ci ho pensato anch'io. Ho settantadue anni e non cammino molto. Però ci sono gli autobus. Mi sembra che passano ogni dieci minuti."
    errors: [subjunctive-use]
  - tutor: "Mi sembra che passano? Dopo «mi sembra che» si usa un altro modo."
    prompt: {text: "passano", tags: [subjunctive-use]}
  - learner: "Sì, mi sembra che passano spesso, anche la sera."
    errors: [subjunctive-use]
  - tutor: "Credo anch'io che passino spesso, almeno in centro. Però chi ha un negozio resta preoccupato."
    recast: {text: "passano", fix: "passino", tags: [subjunctive-use]}
    goals: [counter]
  - learner: "Lo capisco. Si potrebbe chiudere solo il sabato e la domenica, e lasciare i parcheggi vicino alle mura."
  - tutor: "Questa soluzione potrebbe piacere anche a me. Ne parliamo alla prossima riunione?"
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-erasmus
  history: [ci-ne, subject-verb-agreement]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io invece sono favorevole. Il centro è pieno di traffico e di rumore."
  - tutor: "Sì, ma i negozi vivono anche dei clienti che arrivano in macchina."
    goals: [position]
  - learner: "Secondo me no, la maggior parte delle persone ci va a piedi o in bici. E senza auto si potrebbero fare più feste in piazza."
  - tutor: "Più feste, d'accordo. Ma quanti parcheggi ci sono fuori dal centro? Pochissimi."
    goals: [argue]
  - learner: "Non è vero, io ho contato quattro grandi vicino alla stazione."
    errors: [ci-ne]
  - tutor: "Ho contato quattro grandi? Manca una piccola parola prima del verbo."
    prompt: {text: "ho contato quattro grandi", tags: [ci-ne]}
  - learner: "Ah, sì: ne ho contati quattro, vicino alla stazione."
  - tutor: "Va bene, quattro. Ma sono lontani, e chi fa la spesa non vuole camminare."
  - learner: "Si potrebbe mettere un autobus gratis ogni dieci minuti. La gente lo usano volentieri, se è gratis."
    errors: [subject-verb-agreement]
  - tutor: "La gente lo usano? Pensi a «gente»: è singolare o plurale?"
    prompt: {text: "lo usano", tags: [subject-verb-agreement]}
  - learner: "Sì, la gente lo usano di più quando non paga."
    errors: [subject-verb-agreement]
  - tutor: "Forse è vero, la gente lo usa se non paga. Ma un autobus costa: chi lo paga?"
    recast: {text: "lo usano", fix: "lo usa", tags: [subject-verb-agreement]}
    goals: [counter]
  - learner: "Ha ragione, i costi sono un problema. Forse il Comune e i negozi insieme?"
  - tutor: "Ecco, su questo potremmo trovarci d'accordo. Lo proponiamo insieme?"
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-m-heritage
  history: [false-friend, auxiliary-choice]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la preoccupazione, ma io sono a favore. Penso che i negozi ne guadagnerebbero."
  - tutor: "Davvero? A me sembra il contrario. Perché?"
    goals: [position]
  - learner: "In molte città europee le vendite sono aumentate. Io ho stato in Olanda l'estate scorsa, e il centro senza auto era bellissimo."
    errors: [auxiliary-choice]
  - tutor: "Ho stato? Ripensi all'ausiliare."
    prompt: {text: "ho stato", tags: [auxiliary-choice]}
    new: [{lemma: ausiliare, gloss: auxiliary verb}]
  - learner: "Sono stato in Olanda l'estate scorsa."
  - tutor: "Esatto. Va bene, l'Olanda. E il secondo argomento?"
  - learner: "La sicurezza: ci sono molti bambini che vanno a scuola a piedi, e adesso è pericoloso."
  - tutor: "D'accordo, ma chi abita in centro? Come porta a casa la spesa?"
    goals: [argue]
  - learner: "I residenti potrebbero avere un permesso. Attualmente ce l'hanno già i taxi."
  - tutor: "Un permesso per chi abita lì, va bene. Ma i controlli costano, e le multe non piacciono a nessuno."
    goals: [counter]
    new: [{lemma: multa, gloss: fine}]
  - learner: "È vero, ma è un argomento molto sensibile, bisogna discuterlo con calma."
    errors: [false-friend]
  - tutor: "Su un argomento molto delicato come questo, sì. Magari si potrebbe cominciare con una prova di sei mesi?"
    recast: {text: "molto sensibile", fix: "molto delicato", tags: [false-friend]}
  - learner: "Sì, una prova di sei mesi mi sembra una buona via di mezzo. Poi si vede."
  - tutor: "Bene, almeno su questo la pensiamo allo stesso modo. Lo proponiamo alla riunione."
    goals: [concede]

- scenario: politica-lavoro
  level: B2
  persona: es-f-teacher
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri. Alcuni lavori spariranno, ma ne nasceranno altri."
  - tutor: "Tipo quali? Io non ne vedo tanti."
    goals: [opinion]
  - learner: "Per esempio, qualcuno dovrà controllare le macchine e i programmi. E poi gli infermieri resteranno sempre."
  - tutor: "Gli infermieri, d'accordo. Ma pensa a chi lavora alla cassa, agli autisti..."
    goals: [example]
  - learner: "Sì, è vero. Se tutti gli autisti perderebbero il lavoro, sarebbe un problema enorme."
    errors: [hypothetical]
  - tutor: "Se perderebbero? Pensa alla struttura della frase con «se»."
    prompt: {text: "perderebbero", tags: [hypothetical]}
  - learner: "Sì, se perderebbero il lavoro tutti insieme, sarebbe un disastro."
    errors: [hypothetical]
  - tutor: "Appunto: se perdessero il lavoro tutti insieme, sarebbe un disastro. E lo Stato cosa dovrebbe fare, secondo te?"
    recast: {text: "perderebbero", fix: "perdessero", tags: [hypothetical]}
    goals: [hypothesis]
  - learner: "Dovrebbe pagare dei corsi per imparare un nuovo mestiere. Mia sorella l'ha fatto e adesso lavora in un laboratorio."
  - tutor: "Bella storia, ma non tutti hanno la sua forza di volontà."
  - learner: "Forse. Comunque io resto ottimista. E tu, alla fine, cosa faresti al posto del governo?"
  - tutor: "Io? Farei pagare più tasse alle aziende che usano i robot, e con quei soldi pagherei i corsi."
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: en-m-traveller
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Non lo so. So che molte aziende stanno già usando l'intelligenza artificiale, ma metà mi sembra troppo."
  - tutor: "Troppo? Nella mia banca hanno già chiuso tre uffici."
    goals: [opinion]
  - learner: "Sì, ma le banche sono un caso speciale. Nel mio lavoro, per esempio, servono ancora le persone."
  - tutor: "E tu che lavoro fai, di preciso?"
  - learner: "Faccio la guida turistica. Un robot non può raccontare una città come la racconto io."
  - tutor: "Beh, oggi ci sono già le guide sul telefono. Immagina se un giorno parlassero come te."
    goals: [example]
  - learner: "Se parlassero come me, i turisti si annoierebbero!"
  - tutor: "Ah, questo è sicuro! Allora, in conclusione, cosa pensi?"
    goals: [hypothesis]
  - learner: "Penso che cambieranno molte cose, ma non credo che spariscano così tanti lavori. E tu, sei davvero così pessimista?"
  - tutor: "Un po' sì. Ma stasera, con questo vino, voglio credere che tu abbia ragione."
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [preposition, spelling]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me hai ragione solo in parte."
  - tutor: "Solo in parte? Spiegati meglio."
    goals: [opinion]
  - learner: "Nella mia fabbrica le macchine fanno già molto, ma ci servono sempre persone per ripararle. Per questo io sono tranquilo."
    errors: [spelling]
  - tutor: "Tranquilo? Controlla bene come si scrive."
    prompt: {text: "tranquilo", tags: [spelling]}
  - learner: "Tranquillo, con due elle. Scusa."
  - tutor: "Perfetto. Per ora va bene, ma tra dieci anni le macchine si ripareranno da sole."
    goals: [example]
  - learner: "Non credo. Se succedesse, però, dovremmo pensare a uno stipendio per tutti."
  - tutor: "Uno stipendio per tutti? E chi lo pagherebbe?"
    goals: [hypothesis]
  - learner: "Le grandi aziende. In Spagna si parla di una tassa sui robot, e io penso in quella idea da tempo."
    errors: [preposition]
  - tutor: "Penso in quella idea? Con «pensare», quale preposizione usiamo?"
    prompt: {text: "penso in quella idea", tags: [preposition]}
  - learner: "Penso a quella idea da tempo."
  - tutor: "Esatto. Una tassa sui robot... non è una cattiva idea."
  - learner: "Allora, in conclusione: il lavoro cambierà, ma non sparirà. Tu cosa ne pensi, davvero?"
  - tutor: "Penso che tu sia più positivo di me, ma forse è meglio così."
    goals: [conclude]

- scenario: smartworking
  level: B2
  persona: en-f-student
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tutti e due: lunedì e venerdì sono a casa, gli altri giorni vado in ufficio."
  - tutor: "Ah, un po' e un po'! E come ti trovi?"
    goals: [situation]
  - learner: "Bene. A casa dormo di più e non perdo tempo sul treno."
  - tutor: "Eh, il treno la mattina è un incubo. Non c'è niente che ti manchi dell'ufficio?"
    goals: [pros]
  - learner: "Sì, i colleghi. A casa sono più sola e a volte mi annoio."
  - tutor: "Ti capisco. Se potessi scegliere, cosa faresti?"
    goals: [cons]
  - learner: "Lavorerei a casa tre giorni. A casa sono più concentrata che in ufficio."
  - tutor: "Tre giorni mi sembra una buona via di mezzo. Hai provato a chiederlo al tuo capo?"
    goals: [preference]
  - learner: "Non ancora. Il mio capo è un po' all'antica, però ci proverò."
  - tutor: "Fai bene, al massimo ti dice di no."

- scenario: smartworking
  level: B2
  persona: es-f-teacher
  history: [noun-gender]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Sempre da casa. Do lezioni di spagnolo online, a studenti di tutto il mondo."
  - tutor: "Che bello! E ti piace lavorare così?"
    goals: [situation]
  - learner: "Abbastanza. Posso organizzare i miei orari e risparmio un sacco di soldi."
  - tutor: "Immagino. E i lati negativi?"
    goals: [pros]
  - learner: "Il mio computer è vecchio e la sistema è molto lenta. A volte la lezione si blocca."
    errors: [noun-gender]
  - tutor: "La sistema? Attenzione: è una parola un po' particolare."
    prompt: {text: "la sistema", tags: [noun-gender]}
  - learner: "Sì, la sistema è vecchia, devo cambiare computer."
    errors: [noun-gender]
  - tutor: "Eh, se il sistema è vecchio, conviene cambiare computer. Altri problemi?"
    recast: {text: "la sistema", fix: "il sistema", tags: [noun-gender]}
  - learner: "Sì: non vedo mai nessuno. Mi sento un po' sola, soprattutto d'inverno."
  - tutor: "Ti capisco. Allora, se potessi, cosa cambieresti?"
    goals: [cons]
  - learner: "Mi piacerebbe lavorare in un ufficio condiviso due volte a settimana, per stare con altre persone."
  - tutor: "Ce n'è uno nuovo vicino alla stazione: se vuoi, ci andiamo a vederlo insieme."
    goals: [preference]

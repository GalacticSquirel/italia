# B1, broad coverage: booking a table, working from home, traditions, habits, a return, volunteering.
- scenario: prenotare-tavolo
  level: B1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera! Vorrei prenotare una mesa per sabato sera."
      errors: [word-choice]
    - tutor: "Certo, un tavolo per sabato sera. Per quante persone?"
      recast: {text: "una mesa", fix: "un tavolo", tags: [word-choice]}
      goals: [book]
    - learner: "Per sei persone, a le nove."
      errors: [articulated-preposition]
    - tutor: "«A le nove»? Mi ripete l'ora, con le parole unite?"
      prompt: {text: "a le nove", tags: [articulated-preposition]}
    - learner: "Alle nove, scusi."
    - tutor: "Perfetto: sabato alle nove, sei persone."
      goals: [details]
    - learner: "Potremmo mangiare fuori? È il compleanno di una mia amica e le vorremo fare una sorpresa."
      errors: [conditional-form]
    - tutor: "Che bella idea! Ma «le vorremo fare»? È un desiderio: quale forma del verbo usiamo?"
      prompt: {text: "vorremo", tags: [conditional-form]}
    - learner: "Le vorremmo fare una sorpresa con una torta."
    - tutor: "Esatto. Allora vi do il tavolo in giardino, e la torta la potete portare voi."
      goals: [special]
    - learner: "Perfetto. Mi chiamo Lucía Fernández. Le devo dare il mio numero de telefono?"
      errors: [preposition]
    - tutor: "Il numero... «de» telefono? In italiano la preposizione è un'altra."
      prompt: {text: "numero de telefono", tags: [preposition]}
    - learner: "Il mio numero di telefono, sì: è il 347 2215890."
    - tutor: "Perfetto, signora Fernández: sabato alle nove, sei persone in giardino. A sabato!"
      goals: [name]

- scenario: prenotare-tavolo
  level: B1
  persona: en-m-heritage
  history: [modal-infinitive]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei a prenotare un tavolo per stasera, se è possibile."
      errors: [modal-infinitive]
    - tutor: "«Vorrei a prenotare»? Dopo «vorrei», l'infinito ha bisogno di qualcosa?"
      prompt: {text: "Vorrei a prenotare", tags: [modal-infinitive]}
    - learner: "No: vorrei prenotare un tavolo per stasera."
    - tutor: "Perfetto, nessun problema. Per quante persone e a che ora?"
      goals: [book]
    - learner: "Siamo in quattro, alle otto e mezza. Festeggiamo gli ottant'anni di mio nonno."
    - tutor: "Ottant'anni, auguri al nonno! Allora quattro persone alle otto e mezza."
      goals: [details]
    - learner: "Mio nonno ha problemi a camminare: sarebbe possibile un tavolo vicino a l'entrata?"
      errors: [articulated-preposition]
    - tutor: "Certo. Vicino a... ? Ripeta un po' la fine, per favore."
      prompt: {text: "vicino a l'entrata", tags: [articulated-preposition]}
    - learner: "Vicino a la entrata?"
      errors: [articulated-preposition]
    - tutor: "Sì, vi preparo il tavolo vicino all'entrata, così il nonno non deve fare le scale."
      recast: {text: "a la entrata", fix: "all'entrata", tags: [articulated-preposition]}
      goals: [special]
    - learner: "Grazie mille. La prenotazione è a nome di Marco Bianchi."
    - tutor: "Benissimo, signor Bianchi. Vi aspettiamo stasera!"
      goals: [name]

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera! Vorrei prenotare per domani notte, siamo in otto."
      errors: [word-choice]
    - tutor: "Domani sera per otto, certo. A che ora?"
      recast: {text: "domani notte", fix: "domani sera", tags: [word-choice]}
      goals: [book]
    - learner: "Alle otto, e se possibile fuori. Avete piatti vegani? Due mie amiche mangiano mai la carne."
      errors: [negation]
    - tutor: "Alle otto fuori va bene. «Mangiano mai la carne»? Con «mai», cosa manca prima del verbo?"
      goals: [details]
      prompt: {text: "mangiano mai", tags: [negation]}
    - learner: "Non mangiano mai la carne!"
    - tutor: "Giusto. Sì, abbiamo diversi piatti senza carne e senza formaggio. Altro?"
    - learner: "Sì, una mia amica viene con il suo bambino. Il seggiolone, avete uno?"
      errors: [ci-ne]
    - tutor: "«Avete uno»? Manca la piccola parola che sostituisce «seggiolone»."
      prompt: {text: "avete uno", tags: [ci-ne]}
      new: [{lemma: seggiolone, gloss: high chair}]
    - learner: "Ne avete uno? Ah, e il nome è Sophie Clarke."
    - tutor: "Esatto. Sì, ne abbiamo due: lo preparo io. Allora a domani alle otto, Sophie!"
      goals: [special, name]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [spelling]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Faccio uno stage tutto da casa, per un'azienda di Madrid. Lavoro con il computer in camera mia."
    - tutor: "Tutto da casa? E come ti trovi?"
      goals: [situation]
    - learner: "Bene! Posso lavorare in pigiama e non devo prendere l'autobus. È molto più comodo che andare in ufficio."
    - tutor: "Ah, il pigiama è un grande vantaggio! E gli svantaggi?"
      goals: [pros]
    - learner: "La mia camera è piccola e la mia coinquilina fa molto ruido."
      errors: [word-choice]
    - tutor: "Se la tua coinquilina fa tanto rumore, dev'essere difficile concentrarsi."
      recast: {text: "ruido", fix: "rumore", tags: [word-choice]}
      goals: [cons]
    - learner: "Sì! La settimana scorsa ho tenuto mal di testa ogni giorno."
      errors: [word-choice]
    - tutor: "Hai avuto mal di testa ogni giorno? Povera! E se potessi scegliere?"
      recast: {text: "tenuto", fix: "avuto", tags: [word-choice]}
    - learner: "Preferirei due giorni in ufficio e tre a casa. Così vedrei i colleghi e starei più tranquila."
      errors: [spelling]
    - tutor: "Ottima idea. Ma «tranquila»? Controlla le lettere: in italiano una è doppia."
      prompt: {text: "tranquila", tags: [spelling]}
    - learner: "Tranquilla, con due l!"
    - tutor: "Brava! Due giorni in ufficio e tre a casa: mi sembra la soluzione perfetta."
      goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Australia Natale è d'estate! Si mangia gamberi e si va alla spiaggia."
      errors: [subject-verb-agreement, preposition]
    - tutor: "Natale al mare, che bello! Ma «si mangia gamberi»? I gamberi sono tanti: il verbo cambia?"
      prompt: {text: "Si mangia gamberi", tags: [subject-verb-agreement]}
      new: [{lemma: gambero, gloss: prawn}]
    - learner: "Si mangiano i gamberi!"
    - tutor: "Esatto. Tutto il contrario del nostro Natale, con il freddo e la neve! E da piccola?"
      goals: [compare]
    - learner: "Da piccola andavamo dalla nonna. Lei facevava sempre un dolce con le monete dentro."
      errors: [imperfetto-form]
    - tutor: "«Facevava»? Mi sembra un po' troppo lungo!"
      prompt: {text: "facevava", tags: [imperfetto-form]}
    - learner: "Faceva un dolce con le monete dentro. E qui, è vero che il 24 non si mangia carne?"
    - tutor: "Esatto! In molte famiglie, la sera del 24 si mangia solo pesce. La carne si mangia il 25."
      goals: [past, ask]
    - learner: "Allora per il pranzo porto del vino australiano. È più buono che quello italiano!"
      errors: [comparative]
    - tutor: "Ah ah, questo lo dici tu! Ma «più buono che quello italiano»? Davanti a «quello», cosa usiamo?"
      prompt: {text: "più buono che quello", tags: [comparative]}
    - learner: "Più buono che quello, sì!"
      errors: [comparative]
    - tutor: "Più buono di quello italiano? Vedremo! Porta il tuo vino, così lo prova mio padre e decide lui."
      recast: {text: "Più buono che quello", fix: "Più buono di quello", tags: [comparative]}
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Lavoro seduto in ufficio otto ore al giorno. La sera guardo la TV, mangio dolci e bevo tre birra."
      errors: [noun-number]
    - tutor: "Tre... «birra»?"
      prompt: {text: "tre birra", tags: [noun-number]}
    - learner: "Tre birra, sì, ogni sera."
      errors: [noun-number]
    - tutor: "Tre birre ogni sera sono tante! Qual è il tuo obiettivo?"
      recast: {text: "Tre birra", fix: "Tre birre", tags: [noun-number]}
      goals: [habits]
    - learner: "Vorrei essere più in forma che l'anno scorso. Il mese prossimo vado al matrimonio di mio cugino."
      errors: [comparative]
    - tutor: "Più in forma «che l'anno scorso»? Prima di un nome, come «l'anno scorso», cosa ci mettiamo?"
      prompt: {text: "più in forma che l'anno scorso", tags: [comparative]}
    - learner: "Più in forma che l'anno scorso, sì."
      errors: [comparative]
    - tutor: "Vuoi essere più in forma dell'anno scorso per il matrimonio: ottimo obiettivo! Cosa ti ferma, di solito?"
      recast: {text: "più in forma che l'anno scorso", fix: "più in forma dell'anno scorso", tags: [comparative]}
      goals: [goal]
    - learner: "La sera sono troppo stanco per allenare."
      errors: [reflexive]
    - tutor: "«Per allenare»? Allenare chi? Qui la persona che si allena sei tu."
      prompt: {text: "per allenare", tags: [reflexive]}
    - learner: "Sono troppo stanco per allenarmi."
    - tutor: "Giusto. Allora facciamo un piano: tre volte a settimana alle sette di mattina, prima del lavoro. Che ne dici?"
      goals: [obstacles]
    - learner: "Va bene, ci provo. E il sabato berrò solo una birra!"
    - tutor: "Promesso? Allora ci vediamo lunedì alle sette in punto!"
      goals: [plan]

- scenario: restituire-prodotto
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato questo frullatore martedì, ma quando ho aprito la scatola, il vetro era rotto."
      errors: [past-participle-form]
    - tutor: "Mi dispiace. Quando ha... «aprito»? Ci pensi un attimo: il verbo è «aprire»."
      prompt: {text: "aprito", tags: [past-participle-form]}
    - learner: "Quando ho aperto la scatola, il vetro era già rotto."
    - tutor: "Esatto. Che peccato! Ha lo scontrino?"
      goals: [problem]
    - learner: "Sì, lo scontrino ho in tasca."
      errors: [object-pronoun]
    - tutor: "«Lo scontrino ho»? Quando l'oggetto è all'inizio della frase, manca un pronome."
      prompt: {text: "lo scontrino ho", tags: [object-pronoun]}
    - learner: "Lo scontrino ce l'ho in tasca. Eccolo."
    - tutor: "Perfetto, grazie: comprato martedì. Preferisce un frullatore nuovo o il rimborso?"
      goals: [proof]
      new: [{lemma: frullatore, gloss: blender}]
    - learner: "Il rimborso, perché ho visto lo stesso frullatore più economico in un altro negocio."
      errors: [word-choice]
    - tutor: "Capisco, se in un altro negozio costa meno, ha ragione. Le faccio il rimborso sulla carta: lo vede entro cinque giorni."
      recast: {text: "negocio", fix: "negozio", tags: [word-choice]}
      goals: [request]
    - learner: "Va bene, d'accordo. Grazie."
    - tutor: "Grazie a lei. Ecco la ricevuta del rimborso, buona giornata!"
      goals: [agree]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [conditional-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao! Sì, studio psicologia e voglio guadagnare esperienza con le persone."
      errors: [word-choice]
    - tutor: "Fare esperienza con le persone è un ottimo motivo per cominciare! Cosa sai fare?"
      recast: {text: "guadagnare esperienza", fix: "fare esperienza", tags: [word-choice]}
      goals: [motivation]
    - learner: "Sono brava ad ascoltare e parlo inglese e francese. Posso anche guidare."
    - tutor: "Chi guida ci serve sempre! Quanto tempo hai?"
      goals: [skills]
    - learner: "Ogni sabato posso venire per quattro ore, ma la domenica ho a studiare."
      errors: [preposition]
    - tutor: "Il sabato va benissimo. Ma «ho a studiare»? Con «avere», qui serve un'altra preposizione."
      goals: [time]
      prompt: {text: "ho a studiare", tags: [preposition]}
    - learner: "La domenica ho da studiare."
    - tutor: "Giusto. Puoi accompagnare gli anziani dal medico con la macchina, oppure fare compagnia a chi è in ospedale."
    - learner: "Penso che sceglierò di accompagnare gli anziani. Quando comincerebbo?"
      errors: [conditional-form]
    - tutor: "Ottima scelta! Quando... «comincerebbo»? Prova di nuovo questa forma."
      prompt: {text: "comincerebbo", tags: [conditional-form]}
    - learner: "Quando comincerei?"
    - tutor: "Già sabato prossimo! Ti mando un messaggio con l'indirizzo e il nome della prima signora."
      goals: [choose]

# B1, broad coverage: planning a birthday, cooking together, holiday traditions.
- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a sorpresa! Sabato prossimo, a casa di mio cugino: ha un giardino grande."
    - tutor: "Perfetto, in giardino è ancora meglio. Chi invitiamo?"
      goals: [date]
    - learner: "I compagni dell'università e la sua sorella Giulia. La telefono io stasera."
      errors: [possessive, object-pronoun]
    - tutor: "Ottimo. Ma «la telefono»? Si telefona a qualcuno: quale pronome ci vuole?"
      prompt: {text: "La telefono", tags: [object-pronoun]}
    - learner: "Le telefono io stasera."
    - tutor: "Esatto! Allora saremo una ventina di persone. E da mangiare?"
      goals: [guests]
      new: [{lemma: ventina, gloss: about twenty}]
    - learner: "Io porterò le lasagne e mia mamma farà la torta. Sara ama il cioccolato."
    - tutor: "Perfetto, una torta al cioccolato non sbaglia mai. E il regalo?"
      goals: [food]
    - learner: "Le compriamo una bicicletta? La sua si è rotta. Se ognuno mette dieci euro, bastarà."
      errors: [future-form]
    - tutor: "Bella idea! Scusa, «bastarà»? Non ho capito bene l'ultima parola."
      prompt: {text: "bastarà", tags: [future-form]}
    - learner: "Basterà, scusa!"
    - tutor: "Sì, sì! Allora la compro io e voi mi date i soldi alla festa."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [pronoun-position]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Una cena! Io sono cuoco, cucino per tutti. Facciamo venerdì 12 al mio ristorante, dopo la chiusura."
    - tutor: "Che bello, al tuo ristorante! Chi invitiamo?"
      goals: [date]
    - learner: "La famiglia e i colleghi di Sara. Posso telefonarli domani."
      errors: [object-pronoun]
    - tutor: "«Telefonarli»? Ricorda che si telefona a qualcuno. Come cambia il pronome?"
      prompt: {text: "telefonarli", tags: [object-pronoun]}
    - learner: "Posso telefonargli domani."
    - tutor: "Giusto! Allora saremo circa quindici. Cosa cucini?"
      goals: [guests]
    - learner: "Faccio un asado argentino. La torta, invece, la compro in una confitería: non so farla."
      errors: [word-choice]
    - tutor: "Meglio comprarla in una pasticceria, hai ragione: quella qui sotto fa una torta alle fragole buonissima."
      recast: {text: "una confitería", fix: "una pasticceria", tags: [word-choice]}
      goals: [food]
      new: [{lemma: pasticceria, gloss: cake shop}]
    - learner: "Perfetto. E per il regalo? Sara vuole andare al concerto di Vasco. Potremmo le regalare due biglietti."
      errors: [pronoun-position]
    - tutor: "«Potremmo le regalare»? Con «potere» e un infinito, il pronome non sta lì in mezzo."
      prompt: {text: "Potremmo le regalare", tags: [pronoun-position]}
    - learner: "Potremmo regalarle due biglietti!"
    - tutor: "Esatto, e sarà felicissima! Li cerco stasera, speriamo che ci siano ancora."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [article-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Io avrei un'idea: sabato andiamo tutti a mangiare la pizza e poi al karaoke! Giovedì, il giorno del compleanno, lei lavorerà fino a tardi."
    - tutor: "Il karaoke, Sara lo adora! Sabato va benissimo. Chi invitiamo?"
      goals: [date]
    - learner: "Gli amici della palestra, i suoi coinquilini e anche i zii, che abitano qui vicino."
      errors: [article-form]
    - tutor: "«I zii»? Pensa a «lo zio»: al plurale, quale articolo ci vuole?"
      prompt: {text: "i zii", tags: [article-form]}
    - learner: "Gli zii!"
    - tutor: "Esatto. Allora prenoto per dodici. E per la torta?"
      goals: [guests]
    - learner: "Ho già passato in pizzeria e ho parlato con il proprietario: la torta la preparano loro."
      errors: [auxiliary-choice]
    - tutor: "Brava, sei veloce! Ma «ho passato»? Con «passare» nel senso di andare in un posto, serve «avere» o «essere»?"
      prompt: {text: "Ho già passato", tags: [auxiliary-choice]}
    - learner: "Sono già passata in pizzeria. La fanno con le fragole e la panna."
    - tutor: "Perfetto, con le fragole è la sua preferita. E il regalo?"
      goals: [food]
    - learner: "Possiamo comprare due libro del suo scrittore preferito."
      errors: [noun-number]
    - tutor: "Due... «libro»?"
      prompt: {text: "due libro", tags: [noun-number]}
    - learner: "Sì, due libro."
      errors: [noun-number]
    - tutor: "Due libri per Sara: ottima idea, legge sempre! Li compro io domani."
      recast: {text: "due libro", fix: "due libri", tags: [noun-number]}
      goals: [gift]

- scenario: cucina-ricetta
  level: B1
  persona: en-f-professional
  history: [pronoun-position]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Stasera facciamo il risotto ai funghi, la ricetta di mia suocera. Ci servono riso, funghi, una cipolla, burro e parmigiano."
    - tutor: "Adoro il risotto! Ho tutto, anche il vino bianco. Da dove comincio?"
      goals: [ingredients]
    - learner: "Prima taglia la cipolla molto piccola e metti la in una pentola con un po' d'olio."
      errors: [pronoun-position]
    - tutor: "«Metti la»? Quando dai un ordine, il pronome dove lo mettiamo?"
      prompt: {text: "metti la", tags: [pronoun-position]}
    - learner: "Mettila in una pentola con l'olio!"
    - tutor: "Brava! Fatto. E adesso?"
    - learner: "Adesso aggiungi il riso e giralo per due minuti. Non aggiungi ancora il vino!"
      errors: [imperative-form]
    - tutor: "Va bene, aspetto. Ma «non aggiungi»? Per dire a un amico di non fare una cosa, quale forma usiamo?"
      prompt: {text: "Non aggiungi", tags: [imperative-form]}
    - learner: "Non aggiungere ancora il vino! Prima il riso deve diventare caldo."
    - tutor: "Perfetto, ho capito. Quanto deve cuocere?"
      goals: [steps]
    - learner: "Più o meno diciotto minuti. Devi aggiungere lo stock poco a poco e girare spesso."
      errors: [word-choice]
    - tutor: "Diciotto minuti, e il brodo poco a poco: ricevuto! E alla fine?"
      recast: {text: "lo stock", fix: "il brodo", tags: [word-choice]}
      goals: [time]
      new: [{lemma: brodo, gloss: stock, broth}]
    - learner: "Alla fine metti il burro e il parmigiano, e lo servi subito, molto caldo."
    - tutor: "Subito e caldissimo, allora. Prendo i piatti: ho una fame da lupi!"
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: es-f-erasmus
  history: [imperative-form]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Facciamo la tortilla de patatas! È un piatto spagnolo, molto fácile."
      errors: [spelling]
    - tutor: "Che bello! Però «fácile»: in italiano ci vuole l'accento?"
      prompt: {text: "fácile", tags: [spelling]}
    - learner: "No, facile senza accento! Ci servono sei uova, quattro patate, una cipolla e tanto olio."
    - tutor: "Esatto, niente accento. Perfetto, ho tutto in casa."
      goals: [ingredients]
    - learner: "Prima sbuccia le patate e tagliale sottili. Poi friggile nell'olio a fuoco basso."
    - tutor: "Fatto, le patate sono già nell'olio. E le uova?"
    - learner: "Sbatte le uova in una ciotola e mettigli dentro le patate."
      errors: [imperative-form, ci-ne]
    - tutor: "«Sbatte»? Lo stai dicendo a me: come diventa il verbo?"
      prompt: {text: "Sbatte", tags: [imperative-form]}
    - learner: "Sbatti le uova!"
    - tutor: "Giusto! Ecco, uova sbattute e patate dentro."
      goals: [steps]
    - learner: "Poi la cuoci in padella cinque minuti per lato. Ma attenta: l'olio è molto caliente!"
      errors: [word-choice]
    - tutor: "Lo so, l'olio caldo mi fa un po' paura! Cinque minuti per lato, va bene. E come la serviamo?"
      recast: {text: "caliente", fix: "caldo", tags: [word-choice]}
      goals: [time]
      new: [{lemma: padella, gloss: frying pan}]
    - learner: "Calda o fredda, come vuoi. In Spagna si mangia anche dentro un panino."
    - tutor: "Dentro un panino? Allora domani la porto al lavoro!"
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: en-m-retired
  history: [passive]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "La torta di mele di mia madre! Ci servono sei mele, farina, burro, il zucchero e un po' di cannella."
      errors: [article-form]
    - tutor: "Che buona! «Il zucchero»? Ripeta un po' quella parola con il suo articolo."
      prompt: {text: "il zucchero", tags: [article-form]}
    - learner: "Il zucchero, sì, bianco."
      errors: [article-form]
    - tutor: "Ah, lo zucchero bianco: ce l'ho. Allora ci siamo. Da dove cominciamo?"
      recast: {text: "Il zucchero", fix: "Lo zucchero", tags: [article-form]}
      goals: [ingredients]
    - learner: "Prima mescoliamo la farina con il burro freddo. Poi le mele devono essere tagliate in fette sottili."
      errors: [preposition]
    - tutor: "Tagliate «in» fette? Con le fette si usa un'altra preposizione."
      prompt: {text: "in fette", tags: [preposition]}
    - learner: "A fette sottili."
    - tutor: "Perfetto. Le taglio io, così lei prepara la base."
      goals: [steps]
    - learner: "Grazie. Poi la torta è cotta per cinquanta minuti a 180 gradi."
      errors: [passive]
    - tutor: "«È cotta per cinquanta minuti»? Così sembra che sia già pronta! Per un'azione che si fa, quale verbo usiamo al posto di «essere»?"
      prompt: {text: "è cotta per cinquanta minuti", tags: [passive]}
    - learner: "Ah, la torta viene cotta per cinquanta minuti."
    - tutor: "Giusto! Cinquanta minuti, allora. E come la serviamo?"
      goals: [time]
    - learner: "Calda, con una pallina di gelato alla vaniglia, come in America."
    - tutor: "Calda con il gelato? Questa ricetta americana mi piace sempre di più!"
      goals: [serve]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-heritage
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Canada si mangia il tacchino. Ma la mia famiglia fa anche le tradizione italiane dei nonni."
      errors: [noun-number]
    - tutor: "Le... «tradizione»? Sono tante: come diventa la parola?"
      prompt: {text: "le tradizione", tags: [noun-number]}
    - learner: "Sì, le tradizione italiane."
      errors: [noun-number]
    - tutor: "Le tradizioni italiane dei nonni, che bello! Un Natale metà Canada e metà Italia."
      recast: {text: "le tradizione", fix: "le tradizioni", tags: [noun-number]}
      goals: [compare]
    - learner: "Da piccolo, mia nonna cucinava sette tipi di pesce per la sera del 24. Noi bambini aiutavimo in cucina."
      errors: [imperfetto-form]
    - tutor: "Che bel ricordo! «Aiutavimo»? Ripeti questo verbo con calma."
      prompt: {text: "aiutavimo", tags: [imperfetto-form]}
    - learner: "Aiutavamo! Ma solo per mangiare, credo."
    - tutor: "Ah ah, giusto così! La cena dei sette pesci si fa anche qui al Sud."
      goals: [past]
    - learner: "E qui in Italia, chi porta i regali? Babbo Natale o la Befana?"
    - tutor: "Tutti e due! Babbo Natale il 25, e la Befana il 6 gennaio porta dolci ai bambini buoni e carbone ai cattivi."
      goals: [ask]
      new: [{lemma: carbone, gloss: coal}]
    - learner: "Allora domani cosa porto? Non so cosa piace i tuoi parenti."
      errors: [piacere]
    - tutor: "Cosa piace... «i tuoi parenti»? Ascolta bene: una cosa piace a qualcuno."
      prompt: {text: "piace i tuoi parenti", tags: [piacere]}
    - learner: "Non so cosa piace ai tuoi parenti!"
    - tutor: "Esatto! Ai miei parenti piace tutto, tranquillo. Porta un dolce del Canada, così lo proviamo."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la cena più importante è il 24 sera, e il 6 gennaio arrivano i Re Magi con i regali."
    - tutor: "Quindi da voi i regali arrivano a gennaio, un po' come con la nostra Befana! E quando eri piccola?"
      goals: [compare]
    - learner: "Quando ero piccola, ogni anno siamo andati a casa dei nonni, in un paese vicino a Valencia."
      errors: [tense-aspect]
    - tutor: "«Ogni anno siamo andati»? Succedeva ogni anno: quale tempo del passato ci vuole?"
      prompt: {text: "ogni anno siamo andati", tags: [tense-aspect]}
    - learner: "Ogni anno andavamo dai nonni. Mio nonno cantava sempre canzoni vecchie."
    - tutor: "Perfetto. Che bel ricordo, un nonno che canta! C'è qualcosa che vuoi sapere del nostro Natale?"
      goals: [past]
    - learner: "Sì: che differenza c'è tra panettone e pandoro?"
    - tutor: "Il panettone ha l'uvetta e la frutta candita, il pandoro no: è più semplice, con lo zucchero sopra."
      goals: [ask]
      new: [{lemma: uvetta, gloss: raisins}, {lemma: candito, gloss: candied}]
    - learner: "Allora preferisco il pandoro! Per il pranzo, cosa posso portare? Una botella di vino?"
      errors: [word-choice]
    - tutor: "Una bottiglia di vino va benissimo! Mio padre ne sarà contentissimo."
      recast: {text: "botella", fix: "bottiglia", tags: [word-choice]}
      goals: [plan]

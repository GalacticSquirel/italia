# B1 real-learner letters (round 8): how one learned foreign languages, told to a friend on a walk
# through the town where the learner grew up, or in an interview where languages matter.
- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [article-use, tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "In un paese vicino a Budapest. A scuola studiavamo il tedesco tutti i giorni."
    - tutor: "Il tedesco da bambina, tutti i giorni! È stata la tua prima lingua straniera?"
      goals: [place, habits]
    # merlin-1325_1001036-1
    - learner: "Tedesco è la mia prima lingua, l'ho cominciato 8 anni fa."
      errors: [article-use]
    - tutor: "Otto anni, quindi la parli bene. Ma all'inizio della frase, davanti al nome di una lingua, che cosa mettiamo?"
      prompt: {text: "Tedesco è", tags: [article-use]}
    - learner: "Il tedesco è la mia prima lingua straniera."
    - tutor: "Esatto. E l'italiano, come mai?"
      goals: [school]
    # merlin-1325_1001036-5
    - learner: "Vorrei lavorare in Italia (a Maranello, dove c'è la sede della Ferrari), così ho scelto la mia «seconda lingua»."
    - tutor: "Proprio alla Ferrari? E le lingue le hai mai usate davvero, in viaggio?"
    # merlin-1325_1001036-7
    - learner: "Ho potuto incontrare già le lingue tedesco e italiano (in Finlandia non ero mai)."
      errors: [tense-aspect, word-order]
    - tutor: "Ma in Finlandia non sei mai andata, fino a oggi. «Non ero mai» va bene, o ci vuole un altro tempo?"
      prompt: {text: "non ero mai", tags: [tense-aspect]}
    - learner: "In Finlandia non sono mai stata, ma ricordo la gita a Vienna con la classe: parlavo tedesco con tutti!"
    - tutor: "Esatto. Che bel ricordo, la prima volta che una lingua serve davvero."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [past-participle-form]
  turns:
    - tutor: "Che bello qui! Tu, invece, dove abitavi da piccola?"
    # merlin-1325_1001108-0
    - learner: "Sono nata e crescuta in Ungheria e durante il periodo della mia educazione, ho cominciato ad imparare due lingue - inglese e tedesco, e poi italiano."
      errors: [past-participle-form]
    - tutor: "Tre lingue! Ma «crescuta» è il participio di «crescere»: come fa, di preciso?"
      prompt: {text: "crescuta", tags: [past-participle-form]}
      new: [{lemma: participio, gloss: participle}]
    - learner: "Sono nata e cresciuta in Ungheria, vicino al lago Balaton."
    - tutor: "Esatto. E a scuola le hai cominciate tutte insieme?"
      goals: [place]
    - learner: "No: l'inglese alle elementari, il tedesco alle medie. E ogni estate andavo al lago con i nonni."
    - tutor: "Al lago tutte le estati, che fortuna. E l'italiano quando è arrivato?"
      goals: [school, habits]
    - learner: "A sedici anni, dopo una vacanza a Firenze con mia madre. Mi ricordo ancora il primo gelato ordinato in italiano!"
    - tutor: "Il primo gelato in italiano non si dimentica mai! Andiamo a prenderne uno qui all'angolo?"
      goals: [event]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [article-use, adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001109-0
    - learner: "Sono una studentessa universitaria di economia."
    - tutor: "Bene, l'economia è proprio quello che serve in banca. Quanti anni ha?"
    # merlin-1325_1001109-1
    - learner: "Ho ventidue anni."
    - tutor: "E le lingue? Qui lavoriamo molto con clienti stranieri."
      goals: [intro]
    # merlin-1325_1001109-3
    - learner: "Da due anni che sto imparando inglese."
      errors: [article-use]
    - tutor: "Due anni di inglese! Ma con «imparare» e il nome di una lingua, che cosa mettiamo davanti a «inglese»?"
      prompt: {text: "imparando inglese", tags: [article-use]}
    - learner: "Sto imparando l'inglese da due anni."
    - tutor: "Esatto. E come pensa di migliorarlo?"
      goals: [experience]
    # merlin-1325_1001109-5
    - learner: "Percio l'anno prossimo mi piacerebbe andare in America."
    - tutor: "Ottima idea. Perché le lingue sono così importanti, per lei?"
    # merlin-1325_1001109-6
    - learner: "Imparando altre lingue abbiamo grande possibilità."
      errors: [adjective-agreement]
    - tutor: "Vero. Ma qui le possibilità sono tante, non una sola. Allora come diventa «grande»?"
      prompt: {text: "grande possibilità", tags: [adjective-agreement]}
    - learner: "Abbiamo grandi possibilità, anche nel lavoro."
    - tutor: "Esatto. Per questo cerchiamo persone come lei."
      goals: [strengths, why]
    # merlin-1325_1001109-9
    - learner: "Penso, che tutti dobbiamo cercare di imparare lingue straniere."
    - tutor: "Sono d'accordo. Ha qualche domanda per me?"
    - learner: "Sì: lo stage si può fare anche part-time?"
    - tutor: "Sì, venti ore alla settimana, così può continuare a studiare. Le scriviamo entro venerdì."
      goals: [questions]
      new: [{lemma: stage, gloss: internship}]
    # merlin-1325_1001109-10
    - learner: "Vi porgo cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi."

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [preposition, adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Ho visto che parla diverse lingue: me ne parli."
    # merlin-1325_1001123-3
    - learner: "Quando avevo quattordici anni ho cominciato studiare l'italiano e adesso lo parlo abbastanza bene."
      errors: [preposition]
    - tutor: "Lo parla bene, sì. Ma dopo «cominciare», prima di un infinito, che cosa ci vuole?"
      prompt: {text: "cominciato studiare", tags: [preposition]}
    - learner: "Ho cominciato a studiare l'italiano a quattordici anni, a scuola."
    - tutor: "Esatto. E secondo lei le lingue servono, in uno studio di avvocati?"
      goals: [intro, experience]
    # merlin-1325_1001123-4
    - learner: "Secondo me, imparare lingue stranieri è molto importante e utile."
      errors: [adjective-agreement, article-use]
    - tutor: "Sono d'accordo. Ma «lingue stranieri»: «lingua» è femminile. Allora l'aggettivo?"
      prompt: {text: "lingue stranieri", tags: [adjective-agreement]}
    - learner: "Le lingue straniere, scusi. Parlo anche inglese e spagnolo."
    - tutor: "Esatto. Quattro lingue sono un punto forte, per noi. Perché vuole fare pratica qui?"
      goals: [strengths]
    # merlin-1325_1001123-11
    - learner: "Inoltre avrò bisogno di parlare molte lingue, perché vorrei essere un'avvocato."
    - tutor: "Allora qui imparerà molto: abbiamo tanti clienti stranieri. Ha domande?"
      goals: [why]
    - learner: "Sì: la pratica dura sei mesi?"
    - tutor: "Sì, da marzo ad agosto. Le faremo sapere entro due settimane."
      goals: [questions]
    # merlin-1325_1001123-13
    - learner: "Le porgo distinti saluti."
    - tutor: "Arrivederci, e grazie."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [subject-verb-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Lei parla molto bene l'italiano: come l'ha imparato?"
    # merlin-1325_1001111-0
    - learner: "Inizialmente, ho cominciato a studiare questa lingua perchè è obbligatoria nel mio paese, ma dopo, ho scoperto che mi piacciono le lingue straniere, e ho cominciato a studiare."
    - tutor: "Un amore nato a scuola, allora. È stata anche in Italia?"
    - learner: "Sì, ho fatto un anno di Erasmus a Bologna."
    - tutor: "Un anno intero! È servito?"
      goals: [intro]
    # merlin-1325_1001111-2
    - learner: "Questa sperienza mi ha aiutato moltissimo ad impararla meglio."
    - tutor: "Si vede. E l'inglese, lo usa ancora?"
      goals: [experience]
    # merlin-1325_1001111-4
    - learner: "Invece, l'inglese, che lo aveva usato prima moltissimo quando lavorava, solo l'uso quando stiamo con gli amici stranieri che non parlano italiano."
      errors: [subject-verb-agreement, relative-pronoun, word-order]
    - tutor: "Capisco. Ma chi lavorava, prima? Lei. Allora «aveva» e «lavorava» come diventano?"
      prompt: {text: "lo aveva usato prima moltissimo quando lavorava", tags: [subject-verb-agreement]}
    - learner: "L'inglese, che usavo molto quando lavoravo, adesso lo uso poco."
    - tutor: "Esatto. Due lingue straniere sono un vantaggio, qui. Perché vuole lavorare con noi?"
      goals: [strengths]
    # merlin-1325_1001111-5
    - learner: "Veramente spero che, con l'impegno messo ad imparare bene l'italiano, adesso sia il momento per me di poter trovare un bel'lavoro."
    - tutor: "Il suo impegno si sente. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì: quante persone lavorano nel vostro ufficio?"
    - tutor: "Siamo in dodici, quasi tutti giovani. Le scriviamo entro la fine della settimana."
      goals: [questions]
    # merlin-1325_1001111-7
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi."

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [adjective-agreement, preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Organizziamo anche corsi d'italiano a Pavia."
    # merlin-1325_1001132-1
    - learner: "Studio l'italiano da 6 anni, ma penso che sia buono frequentare un corso estiva in Italia, perché vorrei ottenere le mie conoscenze di grammatica e vorrei parlare l'italiano molto."
      errors: [adjective-agreement, word-choice]
    - tutor: "Sei anni, brava! Ma «corso» è maschile. Allora «estiva» come diventa?"
      prompt: {text: "un corso estiva", tags: [adjective-agreement]}
    - learner: "Un corso estivo, sì. Voglio parlare di più."
    - tutor: "Esatto. Con noi si parla tutto il giorno!"
      goals: [motivation]
    # merlin-1325_1001132-6
    - learner: "Come sono i corsi mensili?"
    - tutor: "Quattro settimane, tre ore ogni mattina, in gruppi piccoli."
    # merlin-1325_1001132-7
    - learner: "L'Università degli Studi di Pavia offre i corsi italiani?"
    - tutor: "Sì, ma costano di più. Da noi il corso costa poco, e in cambio aiuti l'associazione il pomeriggio. Che cosa sai fare?"
    - learner: "Cucino bene, quindi scelgo la cena del venerdì. E sono libera tutto agosto."
    - tutor: "Perfetto: corso ad agosto e cucina il venerdì sera."
      goals: [skills, time, choose]
    # merlin-1325_1001132-8
    - learner: "Grazie l'aiuto!"
      errors: [preposition]
    - tutor: "Figurati! Ma dopo «grazie», per dire il motivo, che cosa ci vuole davanti a «l'aiuto»?"
      prompt: {text: "Grazie l'aiuto", tags: [preposition]}
    - learner: "Grazie per l'aiuto!"
    - tutor: "Esatto. Ti mando il programma stasera."
    # merlin-1325_1001132-9
    - learner: "In attesa di una Vostra risposta, mando i miei migliori ringraziamenti!"
    - tutor: "Ciao, a presto!"

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "In un paesino vicino a Pécs. Andavo a scuola in bicicletta, anche d'inverno."
    - tutor: "In bicicletta, anche con la neve! E a scuola che lingue studiavi?"
      goals: [place, habits]
    # merlin-1325_1001144-3
    - learner: "Presto ho imparato la lingua tedesca ho scelto questa quando ho iniziato a frequentare al liceo."
      errors: [preposition, word-order]
    - tutor: "Il tedesco al liceo, bene. Ma «frequentare» vuole la scuola subito dopo, come «frequento l'università». E con «liceo»?"
      prompt: {text: "frequentare al liceo", tags: [preposition]}
    - learner: "Quando ho iniziato a frequentare il liceo, ho scelto il tedesco."
    - tutor: "Esatto. E l'italiano?"
      goals: [school]
    # merlin-1325_1001144-2
    - learner: "Studio la lingua italiana quattro anni fa."
      errors: [preposition]
    - tutor: "Ma lo studi ancora adesso, vero? Allora «quattro anni fa» va bene, o ci vuole un'altra parola?"
      prompt: {text: "quattro anni fa", tags: [preposition]}
    - learner: "Studio la lingua italiana da quattro anni. La prima lezione me la ricordo ancora: abbiamo cantato una canzone!"
    - tutor: "Esatto. Una canzone alla prima lezione, che bel ricordo! E perché proprio l'italiano?"
      goals: [event]
    # merlin-1325_1001144-5
    - learner: "Dopo l'esame di maturità vorrei trasferirmi a Roma così è necessario che possa parlare in italiano."
    - tutor: "A Roma! Allora quando vieni ti faccio io da guida."

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-retired
  history: [demonstrative, subjunctive-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000534-0
    - learner: "Sto studiando la lingua italiana molto volentieri da quindici anni."
    - tutor: "Quindici anni! E adesso la insegna, vero?"
      goals: [intro]
    # merlin-1325_9000534-2
    - learner: "I miei studenti studiano molto volentieri questi lingua."
      errors: [demonstrative]
    - tutor: "Che bello. Ma «lingua» è femminile e singolare. Come diventa «questi»?"
      prompt: {text: "questi lingua", tags: [demonstrative]}
    - learner: "Studiano molto volentieri questa lingua."
    - tutor: "Esatto. E come lavora, in classe?"
      goals: [experience]
    # merlin-1325_9000534-4
    - learner: "Io preferisco fare tanti piccoli - brevi testi di grammatica e traduzione."
    - tutor: "Così si impara bene, mi piace. Perché vuole lavorare con la nostra scuola?"
      goals: [strengths]
    # merlin-1325_9000534-6
    - learner: "E al fine vorrei che tutti i miei studenti andarono in Italia per un anno all'Università di Milano per continuare questa lingua, ma nel paese dove si parla in italiano."
      errors: [subjunctive-form, articulated-preposition]
    - tutor: "Un bel progetto! Ma dopo «vorrei che», «andarono» va bene? Ci vuole un'altra forma del verbo."
      prompt: {text: "andarono", tags: [subjunctive-form]}
    - learner: "Vorrei che tutti i miei studenti andassero in Italia per un anno."
    - tutor: "Esatto. E noi possiamo trovare una casa per loro, proprio qui a Milano."
      goals: [why]
    # merlin-1325_9000534-9
    - learner: "Quando loro sono per un anno in Italia sicuramente conosceranno ancora meglio questa lingua."
    - tutor: "Sicuramente. Un anno qui cambia tutto."
    # merlin-1325_9000534-12
    - learner: "I miei studenti, anche loro hanno possibilità di conoscere tutto questo."
    - tutor: "Ha ragione, è un'occasione unica."
    # merlin-1325_9000534-13
    - learner: "Perché per un anno si può. Questa è la mia esperienza."
    - tutor: "Ed è un'esperienza preziosa. Ha qualche domanda per me?"
    - learner: "Sì: dove possono abitare i ragazzi?"
    - tutor: "Con famiglie italiane, a dieci minuti dalla scuola. Le mando i prezzi la settimana prossima."
      goals: [questions]

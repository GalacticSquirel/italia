# B1 real-learner letters (round 8): advice to a friend, Giorgio, who wrote to a magazine because
# online chats took over his life. The tutor is Giorgio (tu); one friend plans a course by the sea.
- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [possessive, subjunctive-use]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera sul giornale? Ho chiuso con tutti gli amici di internet, e adesso mi sento un po' solo."
    # merlin-1325_1001041-3
    - learner: "Avresti dovuto vivere in società con i suoi veri amici."
      errors: [possessive]
    - tutor: "Forse hai ragione. Ma «i suoi veri amici»: stai parlando con me, e gli amici sono miei. Allora come diventa?"
      prompt: {text: "i suoi veri amici", tags: [possessive]}
    - learner: "Con i tuoi veri amici, volevo dire. Quelli di scuola, per esempio."
    - tutor: "Esatto. Il problema è che con loro non parlo da mesi: stare sempre al computer mi ha allontanato da tutti."
      goals: [cons]
    # merlin-1325_1001041-6
    - learner: "Sono sicuro che ti capiranno."
    - tutor: "Speriamo. E tu, come usi internet?"
    - learner: "Poco: lo uso per lavoro e per leggere le notizie, ed è comodo. Ma gli amici preferisco vederli al bar."
    - tutor: "Hai ragione, al bar è un'altra cosa. E con gli amici di internet, che cosa faccio? Li cancello e basta?"
      goals: [situation, pros, preference]
    # merlin-1325_1001041-7
    - learner: "Ma non guasterebbe se tu scrivessi ai «chat amici» per spiegargli che le cose sono cambiate e che tu abbia veri amici i quali meritono l'attenzione."
      errors: [subjunctive-use, verb-form, word-order]
    - tutor: "Mi sembra giusto. Ma «che tu abbia veri amici» è un fatto vero e sicuro. Ci vuole il congiuntivo?"
      prompt: {text: "che tu abbia veri amici", tags: [subjunctive-use]}
      new: [{lemma: congiuntivo, gloss: subjunctive}]
    - learner: "Spiegagli che hai dei veri amici, e basta."
    - tutor: "Esatto. Stasera scrivo a tutti e due, te lo prometto."
    # merlin-1325_1001041-12
    - learner: "Tanti Auguri!"
    - tutor: "Grazie, ne ho proprio bisogno. Ci sentiamo presto!"

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [article-use, verb-form]
  turns:
    - tutor: "Ciao! Avete letto la mia lettera, tu e tua sorella? Ho cancellato tutti i numeri delle persone conosciute su internet."
    # merlin-1325_1001054-1
    - learner: "L'internet è un mondo «falso»."
      errors: [article-use]
    - tutor: "Lo penso anch'io. Ma davanti alla parola «Internet», in italiano, mettiamo l'articolo?"
      prompt: {text: "L'internet", tags: [article-use]}
    # merlin-1325_1001054-5
    - learner: "L'internet e utile e una buona cosa ma po essere anche pericoloso."
      errors: [article-use, spelling]
    - tutor: "Sì, Internet è utile, ma può essere anche pericoloso: io ci passavo tutte le notti. E se quei ragazzi mi scrivono ancora?"
      recast: {text: "L'internet", fix: "Internet", tags: [article-use]}
      goals: [pros, cons]
    # merlin-1325_1001054-4
    - learner: "Se decidi che non voi vedere più i ragazzi, meglio se cambi il tuo numero di cellulare."
      errors: [verb-form]
    - tutor: "Buona idea. Ma «non voi vedere»: è il verbo «volere» con «tu». Come fa?"
      prompt: {text: "non voi vedere", tags: [verb-form]}
    - learner: "Se non vuoi vederli più, cambia numero."
    - tutor: "Esatto. Domani vado al negozio e cambio numero. Voi come fate con internet?"
    - learner: "Lo usiamo solo per studiare. Gli amici li vediamo di persona, è molto meglio."
    - tutor: "Avete ragione. Io devo imparare di nuovo a uscire!"
      goals: [situation, preference]
    # merlin-1325_1001054-6
    - learner: "Devi stare sempre attento con gli occhi aperti."
    - tutor: "Starò attento, promesso. Grazie a te e a tua sorella!"
    # merlin-1325_1001054-8
    - learner: "Ti salutiamo cordialmente."
    - tutor: "Ciao, un abbraccio a tutte e due!"

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [preposition, imperative-form]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera? Alla fine ho chiuso con la ragazza conosciuta su internet."
    # merlin-1325_1001056-3
    - learner: "Hai fatto bene di chiudere questa conoscienza."
      errors: [preposition, spelling]
    - tutor: "Grazie! Ma con «hai fatto bene», davanti all'infinito, quale preposizione usiamo?"
      prompt: {text: "di chiudere", tags: [preposition]}
    - learner: "Hai fatto bene a chiudere."
    - tutor: "Esatto. Il guaio è che lei mi scrive ancora, tutti i giorni."
      goals: [cons]
    - learner: "Io uso internet solo per tenere i contatti dei miei veri amici: è utile, ma niente di più."
    - tutor: "Forse devo fare come te. Che cosa mi consigli?"
      goals: [situation, pros]
    # merlin-1325_1001056-13
    - learner: "Ti consiglio di cambiare il numero di telefono, e ricordatevi usare l'internet con più attenzione!"
      errors: [imperative-form, preposition, article-use]
    - tutor: "Va bene. Ma «ricordatevi»: stai parlando solo con me. Allora come diventa?"
      prompt: {text: "ricordatevi", tags: [imperative-form]}
    - learner: "Ricordati di usare internet con più attenzione!"
    - tutor: "Esatto, me lo ricorderò. Amici veri prima di tutto, allora."
      goals: [preference]
    # merlin-1325_1001056-15
    - learner: "Ti saluto."
    - tutor: "Ciao, e grazie del consiglio!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [article-form, relative-pronoun]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera sul giornale? Passavo tutte le notti su internet, e adesso mi sento solo."
    # merlin-1325_1001128-0
    - learner: "La storia che hai raccontato sul giornale mi interessa perché avevo avuto il stesso problema."
      errors: [article-form]
    - tutor: "Davvero? Ma «il stesso»: davanti a «stesso», quale articolo usiamo?"
      prompt: {text: "il stesso", tags: [article-form]}
    - learner: "Lo stesso problema, sì. Proprio come te."
    - tutor: "Esatto. Racconta, com'è andata?"
    # merlin-1325_1001128-1
    - learner: "Nell'anno scorso ho passato molto tempo sul'internet e ho chattato con persone di cui non conoscevo nella realtà."
      errors: [relative-pronoun, articulated-preposition]
    - tutor: "Come me! Ma pensa a «conosco una persona», senza preposizione. Allora «di cui non conoscevo» va bene?"
      prompt: {text: "di cui non conoscevo", tags: [relative-pronoun]}
    - learner: "Persone che non conoscevo nella realtà."
    - tutor: "Esatto. E come hai fatto a smettere?"
      goals: [situation, cons]
    - learner: "Così ho deciso di dire basta, come te, e ho cancellato tutti i contatti."
    - tutor: "Che coraggio! E adesso internet lo usi ancora?"
    - learner: "Sì, ma solo per lavoro e per le notizie: lì è utile. Gli amici li vedo di persona."
    - tutor: "Hai ragione. Questo fine settimana chiamo i miei amici di scuola."
      goals: [pros, preference]
    # merlin-1325_1001128-9
    - learner: "Tanti auguri!"
    - tutor: "Grazie, ci sentiamo presto!"

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [object-pronoun, imperative-form]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera sul giornale? Ho detto basta con tutti, anche con i miei amici veri."
    # merlin-1325_1001130-3
    - learner: "Perchè hai detto basta, e hai cancellato dal cellulare tutti i numeri?"
    - tutor: "Perché ero stanco: passavo le notti a scrivere su internet, e di giorno lavoravo da casa."
    # merlin-1325_1001130-4
    - learner: "E perchè hai rotto i contatti con tutti?"
    - tutor: "Non lo so. Avevo paura delle loro domande. Tu hai mai usato le chat?"
      new: [{lemma: chat, gloss: chat room}]
      goals: [cons]
    # merlin-1325_1001130-1
    - learner: "In dicembre andavo anch'io sulle chat, per conoscere nuova gente e anche ciacchierare, ma io non vivevo per questi ragazzi, e non dedicavo ogni giorno."
      errors: [object-pronoun, spelling]
    - tutor: "Capisco. Ma «dedicare» vuole sempre «a qualcuno». Per dire «a questi ragazzi» con un pronome, che cosa metti prima di «dedicavo»?"
      prompt: {text: "non dedicavo", tags: [object-pronoun]}
    - learner: "Non gli dedicavo ogni giorno, solo qualche sera."
    - tutor: "Esatto. Tu le usavi poco, io invece troppo."
      goals: [situation]
    # merlin-1325_1001130-10
    - learner: "Invece andavo anche sulle chat, perchè è possibile conoscere nuova gente gentile."
    - tutor: "È vero, ci sono anche persone gentili. Ma adesso i miei amici non mi parlano più."
      goals: [pros]
    # merlin-1325_1001130-5
    - learner: "Secondo me queste persone ti amano, e non capiscono, che è successo."
    - tutor: "Forse. Che cosa dovrei fare, secondo te?"
    # merlin-1325_1001130-7
    - learner: "Non litiga con tutti!"
      errors: [imperative-form]
    - tutor: "Lo so. Ma per dire a un amico di non fare una cosa, con «tu», come si forma il verbo?"
      prompt: {text: "Non litiga", tags: [imperative-form]}
    - learner: "Non litigare con tutti!"
    - tutor: "Esatto, hai ragione. Domani chiamo Marco e gli chiedo scusa."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [negation, conditional-form]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera sul giornale? Ho cancellato tutti gli amici di internet."
    # merlin-1325_1001136-0
    - learner: "Secondo me è una buona cosa di avere amici virtuali, ma non mai dimenticare gli tuoi amici vicini!"
      errors: [negation, preposition, article-form]
    - tutor: "Lo terrò a mente. Ma «non mai dimenticare»: «non» va prima del verbo, d'accordo. E «mai», dove va?"
      prompt: {text: "non mai dimenticare", tags: [negation]}
    # merlin-1325_1001136-3
    - learner: "Ma non mai dimenticare dell'Internet può essere pericoloso."
      errors: [negation, preposition, article-use]
    - tutor: "Giusto: non dimenticare mai che è pericoloso. Me lo ripeto ogni giorno! Tu lo usi molto?"
      recast: {text: "non mai dimenticare", fix: "non dimenticare mai", tags: [negation]}
      goals: [cons]
    - learner: "Poco, soprattutto per lavoro: è comodo per scrivere ai clienti."
    - tutor: "Per me era il contrario, solo amici in rete e niente lavoro. Che cosa faresti al posto mio?"
      goals: [situation, pros]
    # merlin-1325_1001136-5
    - learner: "Al posto tuo, io provrei controllare la mia vita e la mia vita virtuale."
      errors: [conditional-form, preposition]
    - tutor: "Buon consiglio. Ma «provrei» è il condizionale di «provare»: come fa, di preciso?"
      prompt: {text: "provrei", tags: [conditional-form]}
      new: [{lemma: condizionale, gloss: conditional}]
    - learner: "Proverei a controllare la mia vita, e anche quella virtuale."
    - tutor: "Esatto. Un'ora di internet la sera, e il resto con gli amici veri."
      goals: [preference]
    # merlin-1325_1001136-6
    - learner: "Spero che la mia lettera possa aiutarti e risolvere il tuo problema."
    - tutor: "Mi ha già aiutato, davvero. Grazie!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [reflexive, preposition]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera? Ho deciso di smettere con gli amici di internet."
    # merlin-1325_9000106-0
    - learner: "Secondo me tu hai deciso bene di fermare."
      errors: [reflexive]
    - tutor: "Grazie! Ma «fermare» vuole sempre una cosa da fermare. Qui chi si ferma? Io. Allora come diventa?"
      prompt: {text: "di fermare", tags: [reflexive]}
    - learner: "Hai deciso bene di fermarti."
    - tutor: "Esatto. Però adesso mi mancano gli amici di internet."
      goals: [cons]
    # merlin-1325_9000106-7
    - learner: "Anchio parlo con i miei amici con Internet, ma questi sono i miei amici veri che conosco da molto tempo."
      errors: [preposition, spelling]
    - tutor: "Capisco la differenza. Ma «con Internet»: per un luogo dove si scrive, come una pagina o un sito, quale preposizione usiamo?"
      prompt: {text: "con Internet", tags: [preposition]}
    - learner: "Su Internet. Ci scriviamo ogni giorno, ma ci vediamo anche."
    - tutor: "Esatto. Quindi per te è utile solo con chi conosci già."
      goals: [situation, pros]
    # merlin-1325_9000106-8
    - learner: "Penso che questa strada sia giusta per tutti."
    - tutor: "Forse hai ragione. Mi aiuti a ricominciare con gli amici veri?"
    # merlin-1325_9000106-11
    - learner: "Incontriamo domani sera alle 8. 00 in piazza Tante."
      errors: [reflexive]
    - tutor: "Va bene! Ma «incontriamo»: chi incontriamo? Noi due, uno con l'altro. Allora come diventa?"
      prompt: {text: "Incontriamo", tags: [reflexive]}
    - learner: "Incontriamoci domani sera alle otto in piazza."
    - tutor: "Esatto, perfetto: domani alle otto in piazza Tante. Così vedo un amico vero!"
      goals: [preference]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-professional
  history: [possessive]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1365_0100148-2
    - learner: "Vorrei frequentare un corso estivo al mare perchè si può combinare con le vacanze della famiglia."
    - tutor: "Che bell'idea! A Sorrento ci sono buone scuole di italiano, proprio sul mare. E i bambini quanti anni hanno?"
      goals: [plans]
    # merlin-1365_0100148-9
    - learner: "I bambini hanno dieci e quattro anni."
    - tutor: "Allora mentre studi loro possono stare in spiaggia. Ma con chi?"
    # merlin-1365_0100148-1
    - learner: "Sono una madre di due figli e i corsi offerti hanno luogo durante un periodo in cui il mio marito si può occupare di loro."
      errors: [possessive, article-use]
    - tutor: "Così siete tranquilli. Ma «il mio marito»: con un parente al singolare, dopo «mio», ci vuole l'articolo?"
      prompt: {text: "il mio marito", tags: [possessive]}
    - learner: "Mio marito si può occupare di loro la mattina."
    - tutor: "Esatto. Siete a posto, allora! Come pensate di arrivare a Sorrento?"
    - learner: "In aereo fino a Napoli. E poi? Che cosa ci consigli di vedere?"
    - tutor: "Dall'aeroporto c'è un autobus diretto per Sorrento. Con i bambini, andate a Pompei e a Capri in barca!"
      goals: [transport, advice]
    - learner: "E c'è qualcosa da evitare?"
    - tutor: "Ad agosto evitate la strada della costa in macchina: c'è traffico tutto il giorno."
      goals: [warnings]

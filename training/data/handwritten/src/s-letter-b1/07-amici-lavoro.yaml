# B1 real-learner letters (round 8): answers to a friend who has just finished school and is
# looking for work. The tutor is that friend (tu); the learner talks about their own job and helps.
- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [adjective-agreement, possessive]
  turns:
    - tutor: "Ciao! Hai saputo? Ho finito la maturità! Adesso cerco lavoro. Tu come stai, sempre in quell'albergo?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100072-2
    - learner: "Il lavoro mi piace e anche i collaboratori sono molto gentile."
      errors: [adjective-agreement]
    - tutor: "Che bello! Ma i collaboratori sono tanti. Allora «gentile» come diventa?"
      prompt: {text: "molto gentile", tags: [adjective-agreement]}
    - learner: "I collaboratori sono molto gentili. Lavoro alla reception, ma a volte anche di notte."
    - tutor: "Esatto. Di notte è pesante, però! E per me, nel tuo albergo c'è qualcosa?"
      goals: [situation, pros, cons]
    # merlin-1365_0100072-5
    - learner: "Se voui posso parlare con il mio direttore se lui ce l'ha un posto anche per il miliore amico."
      errors: [possessive, spelling]
    - tutor: "Sei un tesoro! Ma «il miliore amico»: di chi è l'amico? Tuo. Allora che cosa ci vuole?"
      prompt: {text: "il miliore amico", tags: [possessive]}
    - learner: "Per il mio migliore amico, cioè tu!"
    - tutor: "Esatto. Grazie davvero! Che lavoro potrei fare?"
    # merlin-1365_0100072-6
    - learner: "Se non ti fa niente lavorare durante la notte poi fare il portiere di notte all'allbergho vicino."
      errors: [verb-form, articulated-preposition, spelling]
    - tutor: "Il portiere di notte? Perché no! Ma «poi fare»: è il verbo «potere» con «tu». Come fa?"
      prompt: {text: "poi fare", tags: [verb-form]}
    - learner: "Puoi fare il portiere di notte nell'albergo qui vicino. Io preferisco il giorno, ma tu sei giovane!"
    - tutor: "Esatto. La notte non mi fa paura: parla pure con il tuo direttore, grazie!"
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Ho superato la maturità! Ma adesso non so: università o lavoro?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100211-2
    - learner: "Penso che sia una buona idea di continuare con i tuoi studi universitari perché sei ancora molto giovane ed è sempre meglio di tenere alcuni certificati di più per trovare un lavoro piacevole!"
      errors: [preposition]
    - tutor: "Forse hai ragione. Ma dopo «è meglio», prima dell'infinito, quel «di» ci va?"
      prompt: {text: "meglio di tenere", tags: [preposition]}
    - learner: "È sempre meglio tenere qualche certificato in più."
    - tutor: "Esatto. Allora vado all'università! E tu? Il lavoro nuovo com'è?"
      goals: [preference]
    - learner: "All'inizio è stato difficile, ma guadagno di più e i colleghi sono simpatici. Solo che finisco tardi."
    - tutor: "Finire tardi è pesante, ma i soldi contano. E per il resto, novità?"
      goals: [situation, pros, cons]
    # merlin-1365_0100211-10
    - learner: "Si chiama Mario e mi ha fatto un regalo molto piacevole: un fine settimana a Roma."
    - tutor: "Mario? Non me ne avevi mai parlato! Un fine settimana a Roma, che romantico. Sono felicissimo per te!"
    # merlin-1365_0100211-5
    - learner: "Sono, anch'io, molto felice!"
    - tutor: "Si sente! Devi presentarmelo, eh."
    # merlin-1365_0100211-14
    - learner: "Tanti saluti e un caro abbraccio!"
    - tutor: "Un abbraccio anche a te, e salutami Mario!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [article-form]
  turns:
    - tutor: "Ciao Michele! Hai saputo? Ho superato la maturità, con l'esame di lingue!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100221-0
    - learner: "Ti ringrazio e ti do i miei tantissimi auguri per aver aprovato il esame di maturita linguistica."
      errors: [article-form, spelling]
    - tutor: "Grazie mille! Ma «il esame»: davanti a una parola che comincia con «e», come diventa «il»?"
      prompt: {text: "il esame", tags: [article-form]}
    - learner: "Tanti auguri per l'esame, davvero."
    - tutor: "Esatto. E tu, hai trovato lavoro alla fine?"
    - learner: "Sì! Mi sono presentato a tre ditte, e una mi ha preso: lavoro in un magazzino. È faticoso, ma pagano bene, e preferisco lavorare che stare a casa."
    - tutor: "Faticoso ma pagato bene, non è male. Sono contento per te."
      goals: [situation, pros, cons, preference]
    # merlin-1365_0100221-6
    - learner: "Caro Francesco ti ringrazio ancora tantissimo per la tua lettera e spero di vederti presto."
    - tutor: "Anch'io! Vieni a trovarmi a luglio, quando ho finito con i documenti per l'università."
    # merlin-1365_0100221-7
    - learner: "Tanti Saluti da Michele Rossi."
    - tutor: "Ciao Michele, a presto!"

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Volevo dirtelo subito: ho finito la maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100225-0
    - learner: "Auguri per l'esame."
    - tutor: "Grazie! È andata benissimo, non ci credevo."
    # merlin-1365_0100225-1
    - learner: "Ho pensato che tu lo fai."
    - tutor: "Che fiducia! Adesso vorrei passare un'estate da te, in Italia, e lavorare un po'. Che ne dici?"
    # merlin-1365_0100225-5
    - learner: "La cucina italiana, il mare, la gente... Si, ti aiuto per cercare un lavoro."
      errors: [preposition]
    - tutor: "Grazie! Ma con «aiutare», prima di un infinito, quale preposizione usiamo?"
      prompt: {text: "ti aiuto per cercare", tags: [preposition]}
    - learner: "Ti aiuto a cercare un lavoro, certo."
    - tutor: "Esatto. E tu, come ti trovi al ristorante?"
    - learner: "Faccio il cameriere sul mare: si lavora tanto, ma con i turisti è divertente. Lo preferisco all'ufficio."
    - tutor: "Ti capisco, meglio il mare che l'ufficio! Pensi che ci sia un posto anche per me?"
      goals: [situation, pros, cons, preference]
    # merlin-1365_0100225-7
    - learner: "Vado anche a telefonare un amico per sapere se lui sa qualcosa."
      errors: [preposition]
    - tutor: "Gentilissimo. Ma «telefonare un amico»: si telefona sempre a qualcuno. Allora?"
      prompt: {text: "telefonare un amico", tags: [preposition]}
    - learner: "Telefono a un amico che lavora in un albergo."
    - tutor: "Esatto. Allora aspetto tue notizie!"
    # merlin-1365_0100225-10
    - learner: "Ci vediamo in settembre a Bari per la festa di Eva."
    - tutor: "Certo, alla festa di Eva non manco! A settembre, allora."
    # merlin-1365_0100225-11
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti a te!"

- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [article-form, participle-agreement]
  turns:
    - tutor: "Ciao! Ho finito la scuola e cerco lavoro per l'estate. Mi hai detto che a Rimini cercano personale?"
    # merlin-1365_0100226-5
    - learner: "Per l'indirizzi chiamami sul cellulare 0345 - 11111111."
      errors: [article-form]
    - tutor: "Grazie! Ma «indirizzi» è plurale. Allora «l'indirizzi» va bene?"
      prompt: {text: "l'indirizzi", tags: [article-form]}
    - learner: "Per gli indirizzi chiamami sul cellulare."
    - tutor: "Esatto, ti chiamo stasera. E tu come stai? Con Maria tutto bene?"
    # merlin-1365_0100226-7
    - learner: "Maria mi a piantata."
      errors: [participle-agreement, spelling]
    - tutor: "Mi dispiace tanto! Ma tu sei un uomo: allora «piantata» va bene?"
      prompt: {text: "mi a piantata", tags: [participle-agreement]}
    - learner: "Maria mi ha piantato, la settimana scorsa."
    - tutor: "Esatto. Ma perché?"
    # merlin-1365_0100226-8
    - learner: "C'è un altro."
    - tutor: "Che brutto. Almeno il lavoro va bene?"
    - learner: "Sì, per fortuna: in ufficio sono tutti gentili, anche se lavoro fino alle sette. Preferisco così che restare a casa a pensare."
    - tutor: "Hai ragione, il lavoro aiuta. Questo fine settimana ti porto fuori io!"
      goals: [situation, pros, cons, preference]
    # merlin-1365_0100226-13
    - learner: "Cari saluti!"
    - tutor: "Ciao, a sabato!"

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [object-pronoun, article-use]
  turns:
    - tutor: "Ciao! Indovina? Ho preso la maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100229-12
    - learner: "È bello che hai preso la maturità linguistica."
    - tutor: "Grazie! Sono contentissimo."
    # merlin-1365_0100229-13
    - learner: "Hai superato con il massimo dei voti?"
      errors: [object-pronoun]
    - tutor: "Sì! Ma «superare» vuole sempre una cosa. Che cosa ho superato? Con un pronome, come diventa la domanda?"
      prompt: {text: "Hai superato", tags: [object-pronoun]}
    - learner: "L'hai superata con il massimo dei voti?"
    - tutor: "Esatto: cento su cento! E tu, che cosa fai adesso?"
    # merlin-1365_0100229-1
    - learner: "Ho cominciato a studiare la veterinaria."
      errors: [article-use]
    - tutor: "Che bello! Ma quando dici che cosa studi all'università, dopo «studiare», mettiamo l'articolo?"
      prompt: {text: "studiare la veterinaria", tags: [article-use]}
    - learner: "Ho cominciato a studiare veterinaria. È difficile, ma è il mio sogno."
    - tutor: "Esatto. Io invece non so ancora cosa fare."
      goals: [situation, pros, cons]
    # merlin-1365_0100229-4
    - learner: "Inoltre ho un'idea per te."
    - tutor: "Davvero? Dimmi!"
    # merlin-1365_0100229-6
    - learner: "Loro sono sempre in contatto con altri paesi e so che tu ami il tedesco, l'italiano, il francese e l'inglese."
    - tutor: "Chi, scusa? Di chi parli?"
    - learner: "Di un ufficio nella mia città: cercano un aiuto. Io al posto tuo preferirei lavorare un anno, prima dell'università."
    - tutor: "Un ufficio che lavora con altri paesi sarebbe perfetto per me! Mandami il loro indirizzo."
      goals: [preference]
    # merlin-1365_0100229-17
    - learner: "Mi rispondi presto, bacio!"
    - tutor: "Ti rispondo stasera, promesso. Un bacio!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [reflexive, preposition]
  turns:
    - tutor: "Ciao! Ho fatto la maturità, finalmente!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100267-6
    - learner: "Allora, sei molto bravo che finalmente hai fatto la maturità linguistica!"
    - tutor: "Grazie! È stato un anno durissimo, però."
    # merlin-1365_0100267-0
    - learner: "Era molto difficile, questo periodo, dovevo solo sedere nella camera, e leggere, leggere, scrivere, scrivere... Ma ho fatto tutto!"
      errors: [reflexive]
    - tutor: "Ti capisco. Ma qui «sedere» vuole il pronome, come «alzarsi». Allora «dovevo sedere» come diventa?"
      prompt: {text: "dovevo solo sedere", tags: [reflexive]}
    - learner: "Dovevo solo sedermi in camera e studiare."
    - tutor: "Esatto. Proprio come me! E adesso tu che cosa fai?"
    # merlin-1365_0100267-3
    - learner: "Io adesso ho deciso di fare qualcosa più diretto e attivo come la filosofia, e vorrei lavorare per un'associazione civile."
      errors: [preposition]
    - tutor: "Interessante! Ma dopo «qualcosa», davanti a un aggettivo, che cosa mettiamo?"
      prompt: {text: "qualcosa più diretto", tags: [preposition]}
    - learner: "Qualcosa di più diretto. In ufficio non sto bene: preferisco stare con la gente."
    - tutor: "Esatto. Lo capisco, otto ore al computer sono tante."
      goals: [situation, cons, preference]
    # merlin-1365_0100267-2
    - learner: "Parli bene inglese?"
    - tutor: "Abbastanza bene, perché?"
    - learner: "L'associazione cerca persone per un gruppo di dialogo con altri paesi. Si viaggia molto ed è pagato bene!"
    - tutor: "Viaggiare e lavorare, sarebbe un sogno! Mandami il nome del gruppo."
      goals: [pros]
    # merlin-1365_0100267-7
    - learner: "Sono molto - molto contenta!"
    - tutor: "Anch'io! Grazie, ti chiamo domani."

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [adjective-agreement, noun-number]
  turns:
    - tutor: "Ciao! Ho finito la maturità! Adesso devo trovare un lavoro per l'estate."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100451-0
    - learner: "Prima di tutto ti mando i miei migliori auguri!"
    - tutor: "Grazie! E tu come stai? Sempre nella stessa ditta?"
    - learner: "No, purtroppo la ditta ha chiuso qualche mese fa. Adesso lavoro in un hotel: guadagno meno, ma mi piace di più."
    - tutor: "Mi dispiace per la ditta, ma meglio così, allora. Nel tuo hotel cercano qualcuno?"
      goals: [situation, pros, cons]
    # merlin-1365_0100451-7
    - learner: "Visto che loro cercano qualcuno con la lingua madre italiano, per l'estate."
      errors: [adjective-agreement]
    - tutor: "Perfetto per me! Ma «lingua» è femminile. Allora «la lingua madre italiano» va bene?"
      prompt: {text: "la lingua madre italiano", tags: [adjective-agreement]}
    - learner: "Cercano qualcuno di lingua madre italiana."
    - tutor: "Esatto. E quanto tempo potrei restare?"
    # merlin-1365_0100451-8
    - learner: "Cosi potrei lavorare qualche mesi, e decidere come va avanti in autuno."
      errors: [noun-number, spelling]
    - tutor: "Mi piace. Ma dopo «qualche», il nome è singolare o plurale?"
      prompt: {text: "qualche mesi", tags: [noun-number]}
    - learner: "Qualche mese, sì. Io al posto tuo preferirei provare, prima di decidere."
    - tutor: "Esatto. Hai ragione: provo per l'estate, e a settembre decido."
      goals: [preference]
    # merlin-1365_0100451-13
    - learner: "Cari saluti!"
    - tutor: "Cari saluti a te, e grazie mille!"

# B1 real-learner letters (round 8): applications for an internship or a job, retold in the
# interview. The tutor is the person who reads the application; formal register (Lei) throughout.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [preposition, article-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001032-0
    - learner: "Sono Maria Rossi."
    - tutor: "Piacere, signora Rossi. Che cosa fa in questo periodo?"
    # merlin-1325_1001032-4
    - learner: "Adesso cerco di lavoro."
      errors: [preposition]
    - tutor: "Capisco. Ma «cercare di» va bene davanti a un verbo, come in «cerco di dormire». Davanti a un nome come «lavoro», serve quel «di»?"
      prompt: {text: "cerco di lavoro", tags: [preposition]}
    - learner: "Cerco lavoro, sì. Ho scelto voi perché qualche anno fa ho già lavorato con la vostra agenzia."
    - tutor: "Esatto. Allora ci conosce già! Che lingue parla?"
      goals: [intro, experience, why]
    # merlin-1325_1001032-6
    - learner: "Parlo l'inglese e francese oltre all'italiano."
      errors: [article-use]
    - tutor: "Tre lingue, benissimo. Ma se mette l'articolo davanti alla prima lingua, che cosa ci vuole anche davanti alla seconda?"
      prompt: {text: "l'inglese e francese", tags: [article-use]}
    - learner: "Parlo l'inglese e il francese."
    - tutor: "Perfetto. Con i clienti stranieri è un grande vantaggio. Le andrebbe di cominciare con tre mesi di stage?"
      goals: [strengths]
      new: [{lemma: stage, gloss: internship}]
    # merlin-1325_1001032-9
    - learner: "Volentieri sarei una stagista da Voi."
    - tutor: "Ne sono contenta. Ha qualche domanda per me?"
    - learner: "Sì: quante ore al giorno si lavora?"
    - tutor: "Sei ore, dal lunedì al venerdì. Mi lascia un numero di telefono?"
      goals: [questions]
    # merlin-1325_1001032-13
    - learner: "Il mio numero di telefono: 0345 - 11111111."
    - tutor: "Grazie, l'ho segnato. La chiamiamo entro venerdì."
    # merlin-1325_1001032-14
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [demonstrative]
  turns:
    - tutor: "Buongiorno, si accomodi. Ha già lavorato, prima?"
    # merlin-1325_1001080-7
    - learner: "Altrimenti ho lavorato un anno fa come assistente e mi hanno detto che facevo bene il mio lavoro."
    - tutor: "Bene, un'esperienza da assistente è utile qui. Come mai è andato via?"
    # merlin-1325_1001080-8
    - learner: "Purtroppo ho dovuto lasciare quello posto di lavoro perché mi sono trasferito in un altra città."
      errors: [demonstrative, spelling]
    - tutor: "Capisco. Ma «quello posto»: davanti a «posto», «quello» diventa più corto. Come si dice?"
      prompt: {text: "quello posto", tags: [demonstrative]}
    - learner: "Quel posto, scusi. Mi sono trasferito qui a Reggio Emilia."
    - tutor: "Esatto. E adesso quanto tempo ha per lavorare?"
      goals: [intro, experience]
    # merlin-1325_1001080-10
    - learner: "Ho tanto tempo libero così spero che posso lavorare non solo in part - time."
    - tutor: "Benissimo, ci serve proprio una persona disponibile anche a tempo pieno. Perché ha scelto la nostra agenzia?"
      goals: [strengths]
    - learner: "Perché siete vicini a casa mia. Ma quando dovrei iniziare? La settimana prossima vado in vacanza."
    - tutor: "Si comincia il primo del mese, quindi dopo la sua vacanza. Venerdì la chiamo io per la risposta."
      goals: [why, questions]
    # merlin-1325_1001080-12
    - learner: "In attesa delle vostre informazioni."
    - tutor: "A venerdì, allora. E buona vacanza!"
    # merlin-1325_1001080-13
    - learner: "Distinti saluti, Michele Rossi."
    - tutor: "Arrivederci, signor Rossi."

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [participle-agreement, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Come mai ha risposto alla nostra offerta?"
    # merlin-1325_1001088-0
    - learner: "Voglio presentarmi per questo lavoro perchè ha svegliàta la mia curiosità."
      errors: [participle-agreement]
    - tutor: "Mi fa piacere. Ma «ha svegliàta»: con «avere», se prima non c'è un pronome, il participio cambia la finale?"
      prompt: {text: "ha svegliàta", tags: [participle-agreement]}
      new: [{lemma: participio, gloss: participle}]
    - learner: "Ha svegliato la mia curiosità, scusi. Lavoro nella moda da tanti anni."
    - tutor: "Esatto. Dove lavora, adesso?"
    # merlin-1325_1001088-4
    - learner: "Lavoro come assistante presso l'agenzia Elle di 2015."
      errors: [articulated-preposition, spelling]
    - tutor: "Bene. Ma «di 2015»: per un lavoro cominciato in quell'anno e che continua ancora oggi, quale preposizione usiamo davanti all'anno?"
      prompt: {text: "di 2015", tags: [articulated-preposition]}
    - learner: "Dal 2015, sì: da più di dieci anni."
    - tutor: "Esatto, è un'esperienza lunga. Perché vuole cambiare?"
      goals: [intro, experience]
    # merlin-1325_1001088-2
    - learner: "Preferisco la moda italiana."
    - tutor: "Allora è nel posto giusto: qui lavoriamo solo con case di moda italiane. Quali sono i suoi punti forti?"
      goals: [why]
    - learner: "Sono precisa e uso molto bene il computer. Quando comincia il lavoro?"
    - tutor: "A marzo, se tutto va bene. Mi ha portato i suoi documenti?"
      goals: [strengths, questions]
    # merlin-1325_1001088-12
    - learner: "Vi accludo il mio curriculum vitae e le copie dei certificati."
    - tutor: "Grazie, li leggo con calma e la chiamo entro lunedì. Arrivederci."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [piacere, question-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei: come ci ha trovati?"
    # merlin-1325_1001098-0
    - learner: "Ho letto con piacere su «Il Corriere della Sera» il vostro annuncio e sono molto interessata."
    - tutor: "Ci fa piacere. Ha già lavorato nella moda?"
      goals: [intro]
    # merlin-1325_1001098-2
    - learner: "Mi piacevo questo lavoro molto."
      errors: [piacere, word-order]
    - tutor: "Bene! Ma «mi piacevo»: qui chi è che piace, lei o il lavoro?"
      prompt: {text: "Mi piacevo", tags: [piacere]}
    - learner: "Mi piaceva molto questo lavoro, in un negozio di vestiti a Budapest."
    - tutor: "Esatto. E perché adesso ha scelto noi?"
      goals: [experience]
    # merlin-1325_1001098-5
    - learner: "Mi interessa la moda e gli affari esteri perciò mi appello a Voi."
    - tutor: "Siamo le persone giuste, allora: lavoriamo molto con altri paesi. Che cosa sa fare meglio?"
      goals: [why]
    - learner: "Parlo tre lingue e sono molto organizzata."
    - tutor: "Sono due qualità importanti per noi. Ha qualche domanda?"
      goals: [strengths]
    # merlin-1325_1001098-8
    - learner: "Non ho trovato alcune circostanze nel vostro annuncio."
    - tutor: "Che cosa vorrebbe sapere, di preciso?"
    # merlin-1325_1001098-10
    - learner: "Per esempio qual'è sarebbe il mio orario di lavoro?"
      errors: [question-form, spelling]
    - tutor: "Buona domanda. Ma «qual è sarebbe»: qui ci sono due verbi, e uno è di troppo. Quale tiene?"
      prompt: {text: "qual'è sarebbe", tags: [question-form]}
    - learner: "Per esempio, quale sarebbe il mio orario di lavoro?"
    - tutor: "Perfetto. Dalle nove alle cinque, con un'ora di pausa. Le scriviamo entro la fine del mese."
      goals: [questions]
    # merlin-1325_1001098-12
    - learner: "In attesa di una cortese risposta, Vi porgo i miei più distinti saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, e grazie di essere venuta."

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli della sua esperienza."
    - learner: "Buongiorno. Ho lavorato un anno in un negozio di vestiti a Milano, e adesso vorrei lavorare nella moda."
    - tutor: "Un anno intero a Milano! Com'era?"
      goals: [intro, experience, why]
    # merlin-1325_1001160-3
    - learner: "Ma mi è piaciuto molto a lavorarci, perchè tutti erano carini, ho avuto buono contatto con il mio capo e con in colleghi."
      errors: [preposition, article-use, spelling]
    - tutor: "Bene! Ma dopo «mi è piaciuto», l'infinito che segue ha bisogno di quella «a»?"
      prompt: {text: "a lavorarci", tags: [preposition]}
    - learner: "Mi è piaciuto molto lavorarci. Andavo d'accordo con tutti."
    - tutor: "Esatto. Quindi lavora bene in squadra: per noi è importante. Ha qualche domanda?"
      goals: [strengths]
    # merlin-1325_1001160-7
    - learner: "Come sarebbe il mio orario di lavoro e quanto sarebbe lo stipendio?"
    - tutor: "Si lavora dalle nove alle cinque, e lo stipendio è di seicento euro al mese. Le scriviamo entro venerdì."
      goals: [questions]
    # merlin-1325_1001160-9
    - learner: "Grazie mille - per avanti."
      errors: [word-choice]
    - tutor: "Non deve ringraziarci in anticipo! Prima vediamo se il lavoro le piace."
      recast: {text: "per avanti", fix: "in anticipo", tags: [word-choice]}
      new: [{lemma: anticipo, gloss: advance}]
    # merlin-1325_1001160-11
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, a presto."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [subject-verb-agreement, preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000087-0
    - learner: "Io ho 18 anni e fanno la mia maturità in quest'anno."
      errors: [subject-verb-agreement, preposition]
    - tutor: "Diciotto anni, quindi è ancora a scuola. Ma «fanno la mia maturità»: chi fa la maturità? Allora come diventa il verbo?"
      prompt: {text: "fanno", tags: [subject-verb-agreement]}
      new: [{lemma: maturità, gloss: school-leaving exam}]
    - learner: "Faccio la maturità quest'anno, a giugno."
    - tutor: "Esatto. E dopo la maturità, che cosa vuole fare?"
      goals: [intro]
    # merlin-1325_9000087-1
    - learner: "Dopo questo voglio fare qualcosa creativa con moda per questo sono molto interessata in fare uno stage alla vostra ditta."
      errors: [preposition, adjective-agreement, article-use]
    - tutor: "Un sogno preciso! Ma «interessata in fare»: con «interessata» e un verbo all'infinito, quale preposizione usiamo?"
      prompt: {text: "interessata in fare", tags: [preposition]}
    - learner: "Sono molto interessata a fare uno stage da voi. A scuola organizzo già piccole sfilate."
    - tutor: "Esatto. Quindi ha già un po' di esperienza. E nel tempo libero?"
      goals: [why, experience]
    # merlin-1325_9000087-3
    - learner: "Nel mio tempo libero amo incontrare gli amici, fare lo shopping e leggere."
    - tutor: "Le piace stare con la gente, ed è un punto forte nella moda. Ha domande per me?"
      goals: [strengths]
    - learner: "Sì: lo stage è pagato?"
    - tutor: "Sì, quattrocento euro al mese per tre mesi, da luglio."
      goals: [questions]
    # merlin-1325_9000087-6
    - learner: "In attesa di una risposta buona porgo i miei cordiali saluti."
    - tutor: "Le rispondiamo entro due settimane. E in bocca al lupo per la maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000090-1
    - learner: "Al momento frequento il liceo in Debrecen e quest anno finirà la scuola con la maturità."
      errors: [preposition, spelling]
    - tutor: "Bene. Ma «in Debrecen»: con il nome di una città, quale preposizione usiamo?"
      prompt: {text: "in Debrecen", tags: [preposition]}
    - learner: "A Debrecen, sì. Finisco il liceo a giugno."
    - tutor: "Esatto. E ha già qualche esperienza?"
      goals: [intro]
    # merlin-1325_9000090-3
    - learner: "Mentre il mio tempo libero organizzo spesso vacanze estive per i ragazzi i miei amici."
      errors: [preposition]
    - tutor: "Interessante! Ma «mentre» va bene davanti a un verbo. Davanti a «il mio tempo libero», che cosa ci vuole?"
      prompt: {text: "Mentre il mio tempo libero", tags: [preposition]}
    - learner: "Nel mio tempo libero organizzo vacanze per i ragazzi: per questo vorrei lavorare con voi."
    - tutor: "Esatto. Allora sa già organizzare, e da noi è la cosa più importante. Ha domande?"
      goals: [experience, why, strengths]
    - learner: "Sì: lo stage dura tutta l'estate?"
    - tutor: "Dura due mesi, luglio e agosto, nel nostro ufficio di Rimini."
      goals: [questions]
    # merlin-1325_9000090-9
    - learner: "Porgo i miei distinti saluti in attesa di una vostra risposta."
    - tutor: "Le scriviamo entro maggio. Arrivederci, e buono studio!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa la porta da noi?"
    # merlin-1325_9000211-1
    - learner: "Se sia possibile, vorrei fare uno stage presso la Vostra ditta."
      errors: [subjunctive-use]
    - tutor: "Ci fa piacere. Ma «se sia possibile»: dopo «se», in una frase come questa, il congiuntivo è necessario?"
      prompt: {text: "Se sia possibile", tags: [subjunctive-use]}
      new: [{lemma: congiuntivo, gloss: subjunctive}]
    - learner: "Se è possibile, vorrei fare uno stage da voi."
    - tutor: "Esatto. Ha già lavorato nella moda?"
      goals: [intro]
    - learner: "No, sarebbe il mio primo lavoro. Ma ho organizzato mostre di fotografia nella mia città."
    - tutor: "È un'esperienza utile: si impara a lavorare con le immagini. Che cosa si aspetta da noi?"
      goals: [experience, strengths]
    # merlin-1325_9000211-4
    - learner: "Il mio gran sogno sia aver possibilità di osservare il modo di lavoro nella Vostra ditta e forse nel futuro creare la propria collezione."
      errors: [subjunctive-use, article-use]
    - tutor: "Un bel sogno! Ma anche qui: «il mio sogno sia» parla di una cosa certa, che lei sa. Serve il congiuntivo?"
      prompt: {text: "Il mio gran sogno sia", tags: [subjunctive-use]}
    - learner: "Il mio gran sogno è creare una mia collezione."
    - tutor: "Esatto. Allora da noi impara proprio questo. Qualche domanda?"
      goals: [why]
    - learner: "Sì: lo stage è a tempo pieno?"
    - tutor: "Sì, otto ore al giorno, per sei mesi. Le scriveremo entro la fine del mese."
      goals: [questions]
    # merlin-1325_9000211-8
    - learner: "Porgo i miei distinti saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi."

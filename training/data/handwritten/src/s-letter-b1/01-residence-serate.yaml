# B1 real-learner letters (round 8): complaints about a holiday residence, a volunteering camp and
# a cooking evening. The tutor is the person the letter was written to and moves the request on.
- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [auxiliary-choice, possessive]
  turns:
    - tutor: "Buonasera, qui Residence del Lago. Mi dica, c'è qualche problema?"
    # merlin-1325_1001015-11
    - learner: "Noi (il mio marito ed io) non siamo contenti."
      errors: [possessive]
    - tutor: "Mi dispiace sentirlo. Solo una cosa: «marito» è un parente, al singolare. Dopo «mio», in questo caso, ci vuole l'articolo?"
      prompt: {text: "il mio marito", tags: [possessive]}
    - learner: "No, scusi: mio marito ed io non siamo contenti della vacanza."
    - tutor: "Perfetto. Mi racconti: che cosa non è andato bene?"
    # merlin-1325_1001015-6
    - learner: "Io pratico lo sporta, ma io non sono potuto giocar a tennis, perché campi da tennis era in riparazione durante tutta la settimana."
      errors: [auxiliary-choice, article-use, subject-verb-agreement, spelling]
    - tutor: "Una settimana di sport senza tennis, capisco bene. Ma «non sono potuto»: qui «potere» va con «giocare», e al passato «giocare» prende «avere». Come diventa allora?"
      prompt: {text: "non sono potuto", tags: [auxiliary-choice]}
    - learner: "Non ho potuto giocare a tennis, nemmeno una volta."
    - tutor: "Esatto. Una settimana intera! E poi, che altro non andava?"
      goals: [problem]
    # merlin-1325_1001015-8
    - learner: "I mezzi pubblici sono andati raramente."
    - tutor: "Purtroppo d'estate gli autobus per il lago sono pochi, lo sappiamo. Che cosa chiede alla direzione, signora?"
      goals: [since]
    - learner: "Un rimborso parziale: il venti per cento ci sembra giusto."
    - tutor: "Mi sembra giusto. Le confermo il venti per cento entro domani mattina, e ancora scuse a nome di tutti noi."
      goals: [request, agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use, noun-gender]
  turns:
    - tutor: "Buonasera, sono la responsabile del Residence del Lago. Ho letto il suo messaggio: mi dica pure."
    # merlin-1325_1001028-1
    - learner: "C'erano molte differenze, per esempio abbiate anniunciato che il residence era di recente costruzione."
      errors: [subjunctive-use, spelling]
    - tutor: "Capisco. Però lei qui racconta un fatto sicuro, quello che c'era nell'annuncio. Serve davvero il congiuntivo?"
      prompt: {text: "abbiate anniunciato", tags: [subjunctive-use]}
      new: [{lemma: congiuntivo, gloss: subjunctive}, {lemma: annuncio, gloss: advert}]
    - learner: "Avete annunciato che il residence era nuovo, ma non era vero."
    - tutor: "Esatto. Che cosa avete trovato, invece?"
    # merlin-1325_1001028-2
    - learner: "Invece il residenza era vecchia, l'aria condizionata non funzionava, il lago era lontanto dall'appartamento, e non abbiamo potuto fare gli sport, perché i campi da tennis era in riparazione."
      errors: [noun-gender, subject-verb-agreement, spelling]
    - tutor: "È una lista lunga, mi dispiace. Ma prima ha detto «il residence», adesso «il residenza». «Residenza» finisce in -a: è maschile o femminile?"
      prompt: {text: "il residenza", tags: [noun-gender]}
    - learner: "La residenza era vecchia, sì. E i campi sono rimasti chiusi per tutte e due le settimane."
    - tutor: "Esatto. Due settimane senza aria condizionata e senza tennis: capisco perché è arrabbiata. Che cosa ci chiede?"
      goals: [problem, since]
    - learner: "Vorrei un rimborso parziale."
    - tutor: "D'accordo: possiamo restituirle il quindici per cento, sul suo conto entro dieci giorni. Le mando la conferma oggi stesso."
      goals: [request, agree]
    # merlin-1325_1001028-5
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, e ancora scuse."

- scenario: reclamo-hotel
  level: B1
  persona: en-f-student
  history: [article-use, reflexive]
  turns:
    - tutor: "Buongiorno, signora Rossi, sono il direttore. Ho ricevuto la sua lettera: che cosa è successo, esattamente?"
    # merlin-1325_9000138-2
    - learner: "Invece ci siamo trovati in un residence in cui rilassamento non era possibile, a causa del tremendo calore nelle stanze, che risultava dalla mancanza d'aria condizionata."
      errors: [article-use]
    - tutor: "Mi dispiace molto per il caldo. Ma davanti a «rilassamento», che qui è il nome di cui parla la frase, che cosa mettiamo in italiano?"
      prompt: {text: "rilassamento", tags: [article-use]}
    - learner: "In cui il rilassamento non era possibile. Faceva trenta gradi in camera!"
    - tutor: "Esatto. E l'aria condizionata non ha mai funzionato, in tutta la settimana?"
      goals: [problem]
    - learner: "Mai, dal primo all'ultimo giorno. E c'era un altro problema."
    - tutor: "Mi dica."
      goals: [since]
    # merlin-1325_9000138-5
    - learner: "I miei fratelli ed io abbiamo portato le nostre raccette, nella speranza di potersi allenare, ma anche questa promessa dell'annuncio non è stata mantenuta."
      errors: [reflexive, spelling]
    - tutor: "I campi da tennis, immagino. Però attenzione a «potersi allenare»: chi doveva allenarsi? Lei e i suoi fratelli. Allora quale pronome ci vuole?"
      prompt: {text: "potersi allenare", tags: [reflexive]}
    - learner: "Di poterci allenare. Noi volevamo allenarci per un torneo."
    - tutor: "Giusto. Ha ragione, i campi erano in riparazione. Che cosa ci chiede, allora?"
    - learner: "Chiedo un rimborso parziale, almeno il trenta per cento."
    - tutor: "Il trenta per cento per tre persone è tanto, ma con il problema del caldo è giusto. Glielo mandiamo sul conto entro fine mese."
      goals: [request, agree]
    # merlin-1325_9000138-12
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, e grazie della pazienza."

- scenario: reclamo-hotel
  level: B1
  persona: en-m-retired
  history: [imperfetto-form, relative-pronoun]
  turns:
    - tutor: "Buongiorno, qui Residence del Lago. Il signor Rossi? Ho letto la sua lettera: mi dica pure."
    # merlin-1325_9000241-4
    - learner: "In somma, sono rimasto molto dispiaciuto del mio soggiorno, anche se, devo dire, la zona è veramente splendida."
    - tutor: "Grazie per la parola sulla zona, almeno. Che cosa non ha funzionato, invece?"
    # merlin-1325_9000241-2
    - learner: "Mi lamento anche per altre difficoltà di fare dello sport: i campi di tennis eravano in riparazione e il lago, invece di essere nelle vicinanze, era tutto sommato molto lontano della «residence»."
      errors: [imperfetto-form, preposition, articulated-preposition]
    - tutor: "Mi dispiace. Ma «eravano» è l'imperfetto di «essere», terza persona plurale: come fa, di preciso?"
      prompt: {text: "eravano", tags: [imperfetto-form]}
    - learner: "Erano in riparazione, scusi. Tutti i campi, per tutto il mese di agosto."
    - tutor: "Esatto. Purtroppo i lavori sono durati più del previsto. Per questo che cosa ci chiede?"
      goals: [problem, since]
    # merlin-1325_9000241-5
    - learner: "Di conseguenza, vorrei introdurre una domanda di parziale rimborso: secondo me, 30 % di sconto sarebbe adeguato visto le sorprese e i disagi cui sono stato sottoposto."
      errors: [relative-pronoun, article-use, adjective-agreement]
    - tutor: "Ne parliamo subito. Ma pensi alla frase normale: «sono stato sottoposto a molti disagi». Con «cui», allora, come diventa?"
      prompt: {text: "cui sono stato sottoposto", tags: [relative-pronoun]}
    - learner: "I disagi a cui sono stato sottoposto."
    - tutor: "Perfetto. Il trenta per cento è molto, però: posso offrirle il venti, più due notti gratis a settembre. Le mando tutto per posta domani."
      goals: [request, agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-erasmus
  history: [noun-gender, article-use]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000316-3
    - learner: "Adesso sono al vostro villa, ma non sono contenta."
      errors: [noun-gender, articulated-preposition]
    - tutor: "Mi dispiace. Ma «al vostro villa»: «villa» finisce in -a. È maschile o femminile?"
      prompt: {text: "al vostro villa", tags: [noun-gender]}
    - learner: "Nella vostra villa, scusi. La villa numero sei."
    - tutor: "Esatto. La numero sei, vedo. Che cosa non va?"
    # merlin-1325_9000316-4
    - learner: "Tutto e diverso."
    - tutor: "Diverso dall'annuncio, vuole dire? Mi spieghi meglio."
      new: [{lemma: annuncio, gloss: advert}]
    # merlin-1325_9000316-11
    - learner: "Non ho visto nessun l'autobus."
      errors: [article-use]
    - tutor: "L'autobus per il lago, dice? Ma dopo «nessun», davanti al nome, serve anche l'articolo?"
      prompt: {text: "nessun l'autobus", tags: [article-use]}
    - learner: "Non ho visto nessun autobus in tre giorni."
    - tutor: "Giusto. Tre giorni, quindi: da quando è arrivata."
      goals: [problem, since]
    # merlin-1325_9000316-14
    - learner: "Ho visto un'animazione."
    - tutor: "Una sola, in tre giorni? Ha ragione, nella nostra pubblicità c'è «tanta animazione». Che cosa posso fare per lei?"
    - learner: "Vorrei uno sconto per questi giorni, almeno il venti per cento."
    - tutor: "Il venti per cento per i giorni passati si può fare. Per il rimborso, però, mi serve il suo conto."
      goals: [request]
    # merlin-1325_9000316-26
    - learner: "Il mio numero di banca: 1234567."
    - tutor: "L'ho scritto. Il rimborso arriva entro una settimana, e domani mattina le porto io gli orari dell'autobus. Buonanotte, signora."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [articulated-preposition, article-use]
  turns:
    - tutor: "Buongiorno, qui Residence del Lago, mi dica."
    # merlin-1325_9000675-0
    - learner: "Due settimane fa sono stata al vostro «Residence del Lago» per passare una vacanza di sport e relax, come avete scritto sul vostro annuncio."
    - tutor: "Sì, il nostro programma per l'estate. Com'è andata?"
    # merlin-1325_9000675-1
    - learner: "Invece di passare il tempo gioccando a tennis oppure nuotando, dovevo rimanere al bar (l'unico posto che era aperto in villaggio)."
      errors: [articulated-preposition, spelling]
    - tutor: "Al bar tutto il giorno, che peccato. Ma «in villaggio»: lei parla di un villaggio preciso, il nostro. Basta «in», o serve anche l'articolo?"
      prompt: {text: "in villaggio", tags: [articulated-preposition]}
    - learner: "Nel villaggio, sì. Il bar era l'unico posto aperto."
    - tutor: "Esatto. Quindi la piscina e i campi erano chiusi?"
      goals: [problem]
    - learner: "Tutti in riparazione, per tutte e due le settimane."
    - tutor: "Mi dispiace davvero, i lavori sono finiti solo ieri. Che cosa le possiamo offrire?"
      goals: [since]
    # merlin-1325_9000675-7
    - learner: "Dopo tutto questo vi chiedo rimborso."
      errors: [article-use]
    - tutor: "Capisco. Ma in italiano si chiede sempre «una cosa»: «chiedo un consiglio», «chiedo un favore». E con «rimborso»?"
      prompt: {text: "vi chiedo rimborso", tags: [article-use]}
    - learner: "Vi chiedo un rimborso, almeno per metà del prezzo."
    - tutor: "Esatto. La metà è tanto: posso offrirle il trenta per cento, oppure una settimana gratis l'anno prossimo."
      goals: [request]
    - learner: "Preferisco il trenta per cento."
    - tutor: "D'accordo, il trenta per cento. Le mando la conferma oggi stesso."
      goals: [agree]
    # merlin-1325_9000675-8
    - learner: "Cordiali saluti, Maria Rossi."
    - tutor: "Arrivederci, signora, e grazie di averci avvisato."

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Con i soldi della festa di Natale aiutiamo progetti in altri paesi."
    # merlin-1325_9000322-0
    - learner: "Io trovo benissimo che il denaro guadagnato sia usato per finanziare progetti di sviluppo in paesi come l'Africa, l'Asia o l'America latina."
      errors: [word-choice]
    - tutor: "Lo troviamo bellissimo anche noi! Quest'anno, per esempio, costruiamo una scuola in Kenya."
      recast: {text: "benissimo", fix: "bellissimo", tags: [word-choice]}
    # merlin-1325_9000322-1
    - learner: "Per questi motivi vorrei fare domanda per il vostro campo."
    - tutor: "Che bella notizia! Allora parlami un po' di te: che cosa sai fare?"
      goals: [motivation]
    # merlin-1325_9000322-2
    - learner: "Vorrei presentarmi in breve e darVi alcuni informazioni sulla mia persona."
      errors: [adjective-agreement]
    - tutor: "Certo! Ma «alcuni informazioni»: «informazione» è maschile o femminile?"
      prompt: {text: "alcuni informazioni", tags: [adjective-agreement]}
    - learner: "Alcune informazioni, sì! Ho ventitré anni, studio medicina e so fare il primo soccorso."
    - tutor: "Esatto. Il primo soccorso in un campo è utilissimo! Quanto tempo hai quest'estate?"
      goals: [skills]
    - learner: "Sono libera da metà luglio fino alla fine di agosto."
    - tutor: "Perfetto. Abbiamo due campi: uno in Kenya a luglio, uno in Perù ad agosto. Quale preferisci?"
      goals: [time]
    - learner: "Il Perù, perché parlo anche spagnolo."
    - tutor: "Ottima scelta! Stasera ti mando tutte le informazioni."
      goals: [choose]

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-student
  history: [adjective-agreement]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera, chiamo per le serate di cucina internazionale."
    - tutor: "Benissimo! La prima serata è giovedì 5 marzo alle otto: ogni settimana cucina con noi un ospite di un paese diverso."
    # merlin-1325_1001084-0
    - learner: "È un iniziativa molto attesa da me."
    - tutor: "Che piacere sentirlo! Vuole prenotare? Per quante persone?"
      goals: [book]
    # merlin-1325_1001084-2
    - learner: "Mio marito trova squisite i miei piatti ma vuole provare altre sapori."
      errors: [adjective-agreement]
    - tutor: "Allora venite in due! Però, «squisite i miei piatti»: «piatti» è maschile plurale. L'aggettivo è d'accordo?"
      prompt: {text: "squisite i miei piatti", tags: [adjective-agreement]}
    - learner: "Squisiti, scusi! Allora due persone: io e mio marito."
    - tutor: "Esatto. Due posti per giovedì alle otto, allora."
      goals: [details]
    # merlin-1325_1001084-7
    - learner: "Lavoro a turni, e devo parlare con i miei collegi prima."
      errors: [word-choice]
    - tutor: "Certo, prima deve sentire i colleghi per i turni. Le tengo i due posti fino a lunedì, va bene?"
      recast: {text: "collegi", fix: "colleghi", tags: [word-choice]}
    # merlin-1325_1001084-9
    - learner: "Voi date gli ingredienti?"
    - tutor: "Sì, sono compresi nel prezzo: trentacinque euro a persona, con la cena. Ha qualche richiesta particolare?"
    # merlin-1325_1001084-5
    - learner: "È possibile fare attenzione alla mia malattia?"
    - tutor: "Certo. Di che cosa si tratta?"
    - learner: "Ho il diabete, quindi niente dolci per me."
    - tutor: "Nessun problema: al posto del dolce le prepariamo della frutta."
      goals: [special]
    # merlin-1325_1001084-10
    - learner: "Quali sono le prime due ospiti?"
    - tutor: "Una signora indiana giovedì e una signora del Messico la settimana dopo. A che nome prenoto?"
    - learner: "Rossi, Maria Rossi."
    - tutor: "Perfetto, signora Rossi: due posti giovedì alle otto, menù senza dolce per lei. A giovedì!"
      goals: [name]

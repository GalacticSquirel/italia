# B1 real-learner letters (round 8): internship applications, phone calls about international
# cooking evenings, and enquiries about Italian courses at a volunteering association.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [noun-number]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli della sua esperienza."
    # merlin-1325_9000144-3
    - learner: "Durante la mia vita professionale ho sempre potuto applicare le mie conoscenze linguistiche nei servizi di vendità o di marketing."
    - tutor: "Bene, le lingue nella vendita sono molto importanti. E ha lavorato anche in Italia?"
    # merlin-1325_9000144-6
    - learner: "Questo lavoro mi ha permesso di conoscere meglio le regione turistiche italiane e anche gli abitudine regionale."
      errors: [noun-number, article-use, adjective-agreement]
    - tutor: "Che fortuna. Ma «le regione turistiche»: l'articolo e l'aggettivo sono al plurale. E il nome?"
      prompt: {text: "le regione turistiche", tags: [noun-number]}
    - learner: "Le regioni turistiche, sì. Conosco bene la Toscana e la Sicilia."
    - tutor: "Esatto. Per un'agenzia come la nostra, questa conoscenza è preziosa. Perché vuole lavorare con noi?"
      goals: [intro, experience, strengths]
    - learner: "Perché il turismo è la mia passione. Posso chiedere dove sarebbe l'ufficio?"
    - tutor: "A Firenze, vicino alla stazione. Le scriviamo entro due settimane."
      goals: [why, questions]
    # merlin-1325_9000144-8
    - learner: "In attesa di una risposta, Vi porgo i miei più cordiali saluti."
    - tutor: "Grazie a lei. Arrivederci, signora."

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [preposition, comparative]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000314-0
    - learner: "Mi sono laureata del turismo all'Universita in Szeged l'anno scorso."
      errors: [preposition, spelling]
    - tutor: "Laureata l'anno scorso, bene. Ma dopo «mi sono laureata», davanti a quello che ha studiato, «del» va bene?"
      prompt: {text: "del turismo", tags: [preposition]}
    - learner: "Mi sono laureata in turismo, e poi ho lavorato un anno in un'agenzia di viaggi."
    - tutor: "Esatto. E come mai adesso vuole venire in Italia?"
      goals: [intro, experience]
    # merlin-1325_9000314-4
    - learner: "Anchè l'Italia mi piace tantissimo e cerco occasioni di abitarci e farci quello che amo."
    - tutor: "Allora vivere qui le piacerà. Ma perché proprio la nostra ditta?"
    # merlin-1325_9000314-6
    - learner: "Ho scelto la Vostra ditta perchè secondo me è la più famosa in Italia e vorrei prendere la prattica presso l'ufficio il più migliore."
      errors: [comparative, article-use, spelling]
    - tutor: "Grazie! Ma «il più migliore»: «migliore» vuol dire già «più buono». Serve anche «il più»?"
      prompt: {text: "il più migliore", tags: [comparative]}
    - learner: "Vorrei fare pratica nell'ufficio migliore, cioè il vostro."
    - tutor: "Esatto, e ci fa piacere. Qual è il suo punto forte?"
      goals: [why]
    # merlin-1325_9000314-7
    - learner: "Sono sicura che sarete molto contenti del mio aiuto."
    - tutor: "Mi piace la sua sicurezza! Ha qualche domanda per me?"
      goals: [strengths]
    - learner: "Sì: quando potrei cominciare?"
    - tutor: "A settembre, dopo l'estate. Le scriviamo entro la fine del mese."
      goals: [questions]
    # merlin-1325_9000314-9
    - learner: "Distinti saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [noun-gender, possessive]
  turns:
    - tutor: "Buongiorno, si accomodi. Come mai è qui?"
    # merlin-1325_9000504-0
    - learner: "In risposta al vostro annuncio voglio presentarmi e chiedere della possibilità di fare uno stage o un tirocinio nella vostra società."
    - tutor: "Ci fa piacere. Che cosa ha studiato?"
      goals: [intro]
    # merlin-1325_9000504-3
    - learner: "Ho fatto anche un corso dei guidi turistici."
      errors: [noun-gender, articulated-preposition]
    - tutor: "Interessante! Ma attenzione: «guidi» non esiste. La parola è femminile anche per un uomo, come «la persona». Allora come diventa tutto?"
      prompt: {text: "dei guidi turistici", tags: [noun-gender]}
    - learner: "Un corso di guida turistica, scusi. L'ho finito a maggio."
    - tutor: "Esatto. Perché le piace questo lavoro?"
      goals: [experience]
    # merlin-1325_9000504-5
    - learner: "Mi piace viaggiare, conoscere altri paesi e le sue culture, mi piacerebbe conoscere sempre le persone nuove."
      errors: [possessive, word-order]
    - tutor: "Bello. Ma «le sue culture»: le culture di chi? Degli altri paesi, cioè di tanti. Allora che cosa ci vuole al posto di «sue»?"
      prompt: {text: "le sue culture", tags: [possessive]}
    - learner: "Le loro culture. E mi piace stare con la gente: posso chiedere dove si fa lo stage?"
    - tutor: "Perfetto. Qui a Siena, nel nostro ufficio in centro. Le scriviamo la settimana prossima."
      goals: [why, strengths, questions]

- scenario: prenotare-tavolo
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition, noun-gender]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera! Chiama per le serate di cucina dal mondo?"
    # merlin-1325_1001076-3
    - learner: "Vorrei chiedere informazioni dei prezzi."
      errors: [articulated-preposition]
    - tutor: "Certo. Ma con «informazioni», per dire di che cosa si parla, «dei» va bene?"
      prompt: {text: "informazioni dei prezzi", tags: [articulated-preposition]}
    - learner: "Vorrei informazioni sui prezzi delle serate di luglio."
    - tutor: "Esatto. Ogni serata costa trenta euro, cena compresa: per tutte e quattro sono centoventi."
    # merlin-1325_1001076-5
    - learner: "Quando inizia esattamente il corso, e gli incontri da quale a quale ora durano?"
    - tutor: "Si comincia giovedì 2 luglio, dalle sette alle dieci di sera. Vuole prenotare?"
    - learner: "Sì, due posti per tutti i giovedì, a nome Rossi: per me e mia sorella."
    - tutor: "Va bene: due posti per quattro serate. Ha qualche richiesta particolare?"
      goals: [book, details, name]
    # merlin-1325_1001076-6
    - learner: "Se fosse possibile, mi piacerebbe avere un libro pieno dei ricetti dei cibi che avremo mangiato, perché così li potrei preparare nella mia casa quando lo voglio."
      errors: [noun-gender, tense-aspect, articulated-preposition]
    - tutor: "Che bella idea! Ma «ricetta» finisce in -a, quindi è femminile. Al plurale, come diventa «dei ricetti»?"
      prompt: {text: "dei ricetti", tags: [noun-gender]}
    - learner: "Un libro pieno di ricette, per cucinare anche a casa."
    - tutor: "Esatto. Alla fine di ogni serata diamo le ricette su carta, quindi alla fine avrà il suo libro. Ci vediamo giovedì 2."
      goals: [special]
    # merlin-1325_1001076-8
    - learner: "Distinti saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, a giovedì!"

- scenario: prenotare-tavolo
  level: B1
  persona: en-m-traveller
  history: [verb-form, preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera! Ha visto il nostro programma di serate di cucina?"
    # merlin-1325_1001082-0
    - learner: "Mi sembre che sia divertento."
      errors: [verb-form, spelling]
    - tutor: "Lo speriamo! Ma «mi sembre» è il verbo «sembrare», al presente: come fa con «mi»?"
      prompt: {text: "Mi sembre", tags: [verb-form]}
    - learner: "Mi sembra divertente, sì!"
    - tutor: "Esatto. Ogni giovedì cucina con noi un cuoco di un paese diverso."
    # merlin-1325_1001082-1
    - learner: "Prima di tutto voglio chiedere quando sarà esattamente il primo ciclo di serate perchè il maggio dovrò lavorare tanto ma se conosco la data in tempo sicuro che ci possa andare."
      errors: [preposition]
    - tutor: "Capisco. Ma per dire «durante quel mese», «il maggio» va bene?"
      prompt: {text: "il maggio", tags: [preposition]}
    - learner: "A maggio dovrò lavorare tanto, per questo mi serve la data."
    - tutor: "Esatto. Allora va bene: la prima serata è giovedì 11 giugno."
      goals: [book]
    # merlin-1325_1001082-2
    - learner: "L'altra cosa che è molto importante è il costo."
    - tutor: "Venticinque euro a serata, cena compresa. Per quante persone prenoto?"
    - learner: "Due persone, a nome Rossi. Mia moglie però non mangia pesce."
    - tutor: "Nessun problema, signor Rossi: per sua moglie prepariamo un piatto senza pesce. Due posti per i giovedì di giugno, allora."
      goals: [details, special, name]

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera! Chiama per le serate di cucina di aprile? Mi dica pure."
    # merlin-1325_1001164-0
    - learner: "Prima di tutto mi interessebbero il prezzo del programma."
      errors: [conditional-form, subject-verb-agreement]
    - tutor: "Certo. Ma «interessebbero» è il condizionale di «interessare»: lo provi di nuovo? E attenzione: la cosa che le interessa è una sola, il prezzo."
      prompt: {text: "mi interessebbero", tags: [conditional-form]}
    - learner: "Mi interesserebbe il prezzo del programma."
    - tutor: "Esatto. Le sei serate di aprile costano centocinquanta euro in tutto, con la cena."
    # merlin-1325_1001164-1
    - learner: "Il prezzo contiene gli ingredenti della cena o devo portargli con me?"
      errors: [object-pronoun, spelling]
    - tutor: "Buona domanda. Ma «gli» vuol dire «a lui». Lei parla di cose da portare: allora quale pronome ci vuole?"
      prompt: {text: "portargli", tags: [object-pronoun]}
    - learner: "Devo portarli con me?"
    - tutor: "Esatto. No, li compriamo noi, sono compresi nel prezzo. Le prenoto un posto?"
    - learner: "Sì, un posto a nome Rossi per tutte le serate. Sono allergica alle noci."
    - tutor: "Perfetto, signora Rossi: un posto per tutte le serate, e niente noci nei suoi piatti."
      goals: [book, details, special, name]
    # merlin-1325_1001164-11
    - learner: "Distinti saluti, Maria Rossi."
    - tutor: "Arrivederci, signora Rossi, a presto!"

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Abbiamo anche corsi d'italiano per stranieri."
    # merlin-1365_0100100-0
    - learner: "Per caso ho letto oggi al giornale il vostro annuncio e i vostro corsi mi interressono molto perchè iniziavo ad imparare la lingua italiana tre anni fa."
      errors: [tense-aspect, preposition, possessive, verb-form]
    - tutor: "Allora sei nel posto giusto! Ma tre anni fa è un momento preciso, finito: «iniziavo» va bene, o ci vuole un altro tempo?"
      prompt: {text: "iniziavo", tags: [tense-aspect]}
    - learner: "Ho iniziato a imparare l'italiano tre anni fa."
    - tutor: "Esatto. E perché vuoi venire proprio qui da noi?"
      goals: [motivation]
    # merlin-1365_0100100-4
    - learner: "Credo che sia la migliore possibilità di studiare la lingua, perchè potrei parlare l'italiano anche dopo il corso regolare."
    - tutor: "Proprio così: dopo la lezione, chi fa volontariato parla italiano tutto il giorno. Che cosa sai fare?"
    - learner: "Sono brava con il computer, e sono libera tre settimane a luglio."
    - tutor: "Perfetto, a luglio ci serve aiuto con il sito: corso la mattina e sito il pomeriggio. Ti mando orari e prezzi per email stasera."
      goals: [skills, time, choose]
      new: [{lemma: email, gloss: email}]
    # merlin-1365_0100100-7
    - learner: "In attesa di una risposta, ringrazio e invio cordiali saluti."
    - tutor: "Ciao, a presto!"

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Organizziamo anche corsi d'italiano per stranieri."
    # merlin-1365_0100145-0
    - learner: "Il vostro annuncio mi ha interessato molto."
    - tutor: "Che piacere! Vuoi seguire un corso, allora?"
      goals: [motivation]
    # merlin-1365_0100145-3
    - learner: "Penso che sia un vantaggio seguire un corso individuale."
    - tutor: "Costa un po' di più, ma si impara più in fretta. E nel volontariato, con chi ti piacerebbe lavorare?"
    # merlin-1365_0100145-6
    - learner: "È più facile comunicare con i bambini: mi incorreggiano e non mi sento offesa!"
      errors: [word-choice]
    - tutor: "È vero, i bambini incoraggiano sempre, e non giudicano! Abbiamo un doposcuola il martedì e il giovedì. Hai tempo il pomeriggio?"
      recast: {text: "incorreggiano", fix: "incoraggiano", tags: [word-choice]}
      goals: [skills]
      new: [{lemma: doposcuola, gloss: after-school club}, {lemma: incoraggiare, gloss: to encourage}]
    - learner: "Sì, sono libera tutti i pomeriggi tranne il venerdì. Scelgo il doposcuola!"
    - tutor: "Perfetto: corso la mattina e bambini il pomeriggio. Ti mando il programma per email."
      goals: [time, choose]
      new: [{lemma: email, gloss: email}]
    # merlin-1365_0100145-8
    - learner: "Vi ringrazio in anticipo per l'invio e vi presento i miei cordiali saluti."
    - tutor: "Ciao, ci vediamo al primo incontro!"

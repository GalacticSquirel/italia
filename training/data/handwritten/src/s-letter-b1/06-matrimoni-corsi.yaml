# B1 real-learner letters (round 8): answers to a wedding invitation, told to the couple, and news
# from an Italian course told on the phone to friends. Plural address («vi», «voi») is correct.
- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [subjunctive-form, future-form]
  turns:
    - tutor: "Ciao! Allora, è arrivato il nostro invito? Io e Stefano ci sposiamo il 20 novembre!"
    # merlin-1365_0100282-0
    - learner: "Cari Beatrice e Stefano, ho ricevuto il vostro invitato."
      errors: [word-choice]
    - tutor: "Che bello che l'invito è arrivato! Allora, ci sarai?"
      recast: {text: "invitato", fix: "invito", tags: [word-choice]}
    # merlin-1365_0100282-2
    - learner: "Sono molto contenta che mi abbiamo invitato alla vostra cerimonia di matrimonio."
      errors: [subjunctive-form]
    - tutor: "Ci mancherebbe! Ma chi ti ha invitato? Noi due, cioè «voi». Allora «abbiamo» come diventa, dopo «che»?"
      prompt: {text: "mi abbiamo invitato", tags: [subjunctive-form]}
    - learner: "Sono contenta che mi abbiate invitato!"
    - tutor: "Esatto! E quando arrivi a Verona?"
    # merlin-1365_0100282-6
    - learner: "Probabilmente arrivò il 18 novembre e resterò fino al 22 novembre."
      errors: [future-form]
    - tutor: "Quattro giorni, che bello! Ma «arrivò» è un passato. Tu parli di novembre, cioè di dopo: come diventa?"
      prompt: {text: "arrivò", tags: [future-form]}
    - learner: "Arriverò il 18 novembre, in treno."
    - tutor: "Esatto. Ti veniamo a prendere noi alla stazione, e al pranzo ti mettiamo con i nostri amici dell'università."
      goals: [date, guests]
    # merlin-1365_0100282-10
    - learner: "Vorrei comprarvi un bel regalo, cosi potreste inviare una lista del regalo che vorreste?"
      errors: [articulated-preposition, noun-number]
    - tutor: "Che cara! Ma nella lista ci sono tante cose, non una sola. Allora «del regalo» come diventa?"
      prompt: {text: "una lista del regalo", tags: [noun-number]}
    - learner: "Una lista di regali, sì."
    - tutor: "Esatto. Te la mando stasera. E al pranzo ci sarà tanto pesce, spero che ti piaccia!"
      goals: [gift, food]
    # merlin-1365_0100282-11
    - learner: "Aspetto la vostra risposta."
    - tutor: "Arriva stasera, promesso! Un abbraccio."

- scenario: compleanno
  level: B1
  persona: en-m-traveller
  history: [imperative-form, object-pronoun]
  turns:
    - tutor: "Ciao Michele! Hai ricevuto l'invito? Io e Stefano ci sposiamo, finalmente!"
    # merlin-1365_0100139-3
    - learner: "Sono certo che è l'ottima decisione della vostra vita."
    - tutor: "Lo pensiamo anche noi, dopo dieci anni insieme! Spero che tu venga."
    # merlin-1365_0100139-4
    - learner: "Mille grazie anché dell'invito!"
    - tutor: "Figurati. Il 20 novembre alle undici in chiesa, poi pranzo al ristorante sul lago."
      goals: [date]
    # merlin-1365_0100139-8
    - learner: "Sieti certi, alloro, che verrò."
      errors: [imperative-form, spelling]
    - tutor: "Che bello! Ma «sieti» non esiste. Il verbo «essere», per dire a «voi» di fare una cosa, come fa?"
      prompt: {text: "Sieti certi", tags: [imperative-form]}
    - learner: "Siate certi che verrò!"
    - tutor: "Esatto! Ma ti prego, in chiesa si comincia alle undici in punto."
    # merlin-1365_0100139-9
    - learner: "E per questa volta, sarò in punto."
      errors: [word-choice]
    - tutor: "Sarai puntuale, davvero? Ci credo solo quando ti vedo! Ti mettiamo al tavolo con Luca e Giulia."
      recast: {text: "in punto", fix: "puntuale", tags: [word-choice]}
      new: [{lemma: puntuale, gloss: on time}]
      goals: [guests]
    # merlin-1365_0100139-10
    - learner: "Ma dite, che posso regalare?"
      errors: [object-pronoun]
    - tutor: "Non serve niente, davvero. Però «che posso regalare»: a chi? A noi. Con un pronome, come diventa?"
      prompt: {text: "che posso regalare", tags: [object-pronoun]}
    - learner: "Che cosa posso regalarvi?"
    - tutor: "Esatto. Abbiamo una piccola lista in un negozio del centro, ma va bene anche un pensiero semplice."
    # merlin-1365_0100139-11
    - learner: "Ho un'idea... vi piace una sorpresa?"
    - tutor: "Una sorpresa? Allora non ci dire niente! Al pranzo, poi, si mangia pesce di lago."
      goals: [gift, food]
    # merlin-1365_0100139-12
    - learner: "Saluti cordiali, Michele."
    - tutor: "Un abbraccio, Michele, a presto!"

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [participle-agreement, adjective-agreement]
  turns:
    - tutor: "Ciao Michele! Hai ricevuto l'invito? Io e Beatrice ci sposiamo il 20 novembre!"
    # merlin-1365_0100281-6
    - learner: "Vi ringrazio che mi avete invitati."
      errors: [participle-agreement]
    - tutor: "Figurati! Ma «mi avete invitati»: hai detto «mi», cioè solo tu. Allora il participio come diventa?"
      prompt: {text: "mi avete invitati", tags: [participle-agreement]}
      new: [{lemma: participio, gloss: participle}]
    - learner: "Mi avete invitato, scusa. Grazie davvero."
    - tutor: "Esatto! Sai, sono un po' nervoso."
      goals: [date]
    # merlin-1365_0100281-2
    - learner: "Secondo me Beatrice vale la pena, diventerà una buona moglie."
    - tutor: "Lo so, sono fortunato. Senti, ci daresti una mano con la musica alla festa?"
    # merlin-1365_0100281-7
    - learner: "Certo io posso aiutare."
    - tutor: "Grazie! Allora ti mettiamo al tavolo vicino a quello della musica. Hai già il vestito?"
      goals: [guests]
    # merlin-1365_0100281-10
    - learner: "Per fortuna la settimana scorso ho comprato un bellissimo giacca d'uomo e un pantaloni."
      errors: [adjective-agreement, noun-gender, article-use]
    - tutor: "Già pronto, allora! Ma «settimana» è femminile. Allora «la settimana scorso» va bene?"
      prompt: {text: "la settimana scorso", tags: [adjective-agreement]}
    - learner: "La settimana scorsa ho comprato una giacca e dei pantaloni."
    - tutor: "Esatto. Sarai bellissimo!"
    # merlin-1365_0100281-13
    - learner: "E che cosa vi piacerebbe per regalo di matrimonio?"
      errors: [preposition]
    - tutor: "Che pensiero! Ma «per regalo» qui non va: serve la parola di «lavoro come cameriere». Quale?"
      prompt: {text: "per regalo", tags: [preposition]}
    - learner: "Che cosa vi piacerebbe come regalo?"
    - tutor: "Esatto. Una macchina del caffè, la nostra è rotta da mesi! E al pranzo ci sarà tanto pesce."
      goals: [gift, food]
    # merlin-1365_0100281-15
    - learner: "Tanti baci!"
    - tutor: "Tanti baci anche a te, ci vediamo a novembre!"

- scenario: compleanno
  level: B1
  persona: es-f-teacher
  history: [reflexive, object-pronoun]
  turns:
    - tutor: "Ciao Maria! Hai ricevuto l'invito? Ci sposiamo il 20 novembre!"
    # merlin-1365_0100183-0
    - learner: "Saluti Stefano e Beatrice, tanti auguri a voi."
    - tutor: "Grazie mille! Ci credi?"
    # merlin-1365_0100183-1
    - learner: "Finalmente voi sposate."
      errors: [reflexive]
    - tutor: "Eh sì, dopo otto anni! Ma chi sposiamo? Ci sposiamo noi due, uno con l'altro. Allora con «voi» come diventa?"
      prompt: {text: "voi sposate", tags: [reflexive]}
    - learner: "Finalmente vi sposate!"
    - tutor: "Esatto! Il 20 alle undici, in chiesa a Verona. Ci sarai?"
      goals: [date]
    # merlin-1365_0100183-6
    - learner: "Spero che non deva lavorare."
    - tutor: "Speriamo! E quando lo sai?"
    # merlin-1365_0100183-15
    - learner: "La prossima settimana, io so, se devo lavorare oppure no."
    - tutor: "Va bene, aspettiamo. Per ora ti mettiamo al tavolo con i tuoi cugini."
      goals: [guests]
    # merlin-1365_0100183-7
    - learner: "Ma non so che cosa posso regalare."
      errors: [object-pronoun]
    - tutor: "Non ti preoccupare. Ma «posso regalare»: a chi? A noi due. Con un pronome, come diventa?"
      prompt: {text: "che cosa posso regalare", tags: [object-pronoun]}
    - learner: "Non so che cosa vi posso regalare."
    - tutor: "Esatto. Ti mando la nostra piccola lista stasera. E il pranzo è tutto di pesce: ti va bene?"
      goals: [gift]
    # merlin-1365_0100183-16
    - learner: "Sono molto contenta partecipare nel vostro matrimonio!"
      errors: [preposition, articulated-preposition]
    - tutor: "Anche noi! Ma dopo «contenta», prima di un infinito, che cosa ci vuole?"
      prompt: {text: "contenta partecipare", tags: [preposition]}
    - learner: "Sono molto contenta di partecipare, e il pesce mi piace tantissimo!"
    - tutor: "Esatto, perfetto! Allora pesce per tutti. A presto, cara!"
      goals: [food]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [negation]
  turns:
    - tutor: "Ciao Maria! È arrivato il nostro invito?"
    # merlin-1365_0100178-0
    - learner: "Chiaro Stefano e chiara Beatrice, grazie mille per il vostro invito."
      errors: [word-choice]
    - tutor: "«Cara Beatrice» sono io, che dolce! Grazie a te. Allora, ci sarai?"
      recast: {text: "chiara Beatrice", fix: "cara Beatrice", tags: [word-choice]}
    # merlin-1365_0100178-2
    - learner: "Voglio fare la mia congratulazione a voi."
    - tutor: "Grazie, cara! È il 20 novembre, a Bologna."
    - learner: "Certo che vengo, con il mio ragazzo! Ho già chiesto due giorni di ferie."
    - tutor: "Benissimo, allora vi teniamo due posti. Sai che a dicembre andiamo nell'appartamento nuovo?"
      goals: [date, guests]
    # merlin-1365_0100178-7
    - learner: "E no sarà ancora ammobiliato."
      errors: [negation]
    - tutor: "Infatti è ancora vuoto. Ma per dire di no davanti a un verbo, «no» va bene?"
      prompt: {text: "E no sarà", tags: [negation]}
    - learner: "E non sarà ancora ammobiliato. Allora vi regalo un tavolo?"
    - tutor: "Esatto. Un tavolo è un'idea, ma è grande da portare!"
    # merlin-1365_0100178-9
    - learner: "O oppure un televisore?"
    - tutor: "Il televisore ce l'abbiamo già! Facciamo il tavolo: lo scegliamo insieme. E al pranzo c'è pesce per tutti, ci vediamo a Bologna!"
      goals: [gift, food]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [article-form]
  turns:
    - tutor: "Pronto? Ciao! Che bello sentirti! Ma dove siete, tu e Maria?"
    # merlin-1395_0001145-0
    - learner: "Ciao cari miei! come state?"
    - tutor: "Noi bene, Giulia ti saluta! E voi due? Com'è il corso?"
    # merlin-1395_0001145-2
    - learner: "Abitiamo in albergo «La Stella», abbiamo una camera comoda (con bagno) per 4 persone ma abita con noi solo uno ragazza russa Maria."
      errors: [article-form, articulated-preposition]
    - tutor: "Una camera grande, che fortuna! Ma «ragazza» è femminile. Allora «uno ragazza» va bene?"
      prompt: {text: "uno ragazza", tags: [article-form]}
    - learner: "Una ragazza russa, si chiama Maria come mia moglie."
    - tutor: "Esatto. E il tempo, lì a Perugia?"
      goals: [where]
    - learner: "Fa caldo, trenta gradi, ma la sera c'è un po' di vento."
    - tutor: "Che bello. E le lezioni?"
      goals: [weather]
    # merlin-1395_0001145-4
    - learner: "Frequentiamo il corso ogni giorno, studiamo circa 5 - 7 ore dal lunedi al venerdi."
    - tutor: "Sette ore al giorno, siete bravissimi! E il fine settimana?"
      goals: [activities]
    # merlin-1395_0001145-7
    - learner: "Avete tempo libero?"
    - tutor: "Noi? Ad agosto sì, abbiamo due settimane. Perché?"
    - learner: "La cosa più bella qui è il lago, a mezz'ora dalla città: venite a trovarci!"
    - tutor: "Il lago Trasimeno, ci siamo stati! Ne parlo con Giulia stasera."
      goals: [best]
    # merlin-1395_0001145-10
    - learner: "Vi abbracciamo."
    - tutor: "Un abbraccio a tutti e due!"

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Pronto? Ciao Maria, che sorpresa! Sono qui con Giorgio."
    # merlin-1395_0001073-0
    - learner: "Cari Alberto e Giorgio, come state?"
    - tutor: "Benissimo! E tu? Dove sei?"
    - learner: "Sono a Siena, per un corso d'italiano. C'è sempre il sole, ma non fa troppo caldo."
    - tutor: "Siena con il sole, che fortuna! E com'è il corso?"
      goals: [where, weather]
    # merlin-1395_0001073-5
    - learner: "Nel mio corso ci sono molti giovanni di tutto il mondo: Messico, Stati Uniti, Brasile..."
      errors: [word-choice]
    - tutor: "Tanti giovani da tutto il mondo, bellissimo! E che cosa fate dopo le lezioni?"
      recast: {text: "giovanni", fix: "giovani", tags: [word-choice]}
    - learner: "La sera andiamo tutti in piazza del Campo. È la cosa che mi piace di più."
    - tutor: "Seduti in piazza la sera, con quel cielo: ti capisco!"
      goals: [activities, best]
    # merlin-1395_0001073-6
    - learner: "Se volete, fate un salto da me!"
    - tutor: "Un salto a Siena? Ci pensiamo davvero: ad agosto siamo liberi."

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [ce-ci-sono, adjective-agreement]
  turns:
    - tutor: "Ciao Maria! Allora, com'è andata la prima settimana a Firenze?"
    # merlin-1395_0000649-0
    - learner: "Abito in un appartamento con tre altre ragazze gentili."
    - tutor: "Quattro ragazze insieme, sarà divertente! E il corso?"
      goals: [where]
    # merlin-1395_0000649-4
    - learner: "Li sono personi di tutto il mondo."
      errors: [ce-ci-sono, noun-gender]
    - tutor: "Interessante! Ma per dire che in un posto ci sono delle persone, «li sono» va bene?"
      prompt: {text: "Li sono", tags: [ce-ci-sono]}
    - learner: "Ci sono persone di tutto il mondo."
    - tutor: "Esatto. Da dove, per esempio?"
    # merlin-1395_0000649-5
    - learner: "C'è un huomo di Russia, ha settanta anni e gli piace andare a studiare lingue in tutto il mondo, parla gia sei lingue e io ho tanti promplemi con una lingua solo."
      errors: [adjective-agreement, preposition, spelling]
    - tutor: "Sei lingue a settant'anni, che forza! Ma «lingua» è femminile. Allora «una lingua solo» come diventa?"
      prompt: {text: "una lingua solo", tags: [adjective-agreement]}
    - learner: "Con una lingua sola! Ma studiamo tanto, e il pomeriggio andiamo nei musei."
    - tutor: "Esatto. E il tempo com'è?"
      goals: [activities]
    - learner: "Caldissimo, ma la cosa più bella è il tramonto dal ponte, la sera."
    - tutor: "Il tramonto sull'Arno è il migliore del mondo, hai ragione."
      goals: [weather, best]
    # merlin-1395_0000649-7
    - learner: "Cari saluti!"
    - tutor: "Cari saluti a te, e buono studio!"

# B1 real-learner letters (round 8): more answers to a friend who has finished school, and news
# for old friends after a long time. The tutor is the friend the letter was written to.
- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [auxiliary-choice, articulated-preposition]
  turns:
    - tutor: "Ciao! Hai ricevuto la mia lettera? Ho superato l'esame di maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100455-0
    - learner: "Ho letto le tue segne con piacere."
      errors: [word-choice]
    - tutor: "Erano poche righe, ero troppo contento per scrivere di più! E tu, che cosa hai fatto quest'estate?"
      recast: {text: "segne", fix: "righe", tags: [word-choice]}
      new: [{lemma: riga, gloss: line}]
    # merlin-1365_0100455-2
    - learner: "Sono andata in una scuola di lingua e ho migliorato il mio francese."
    - tutor: "Il francese! Ti serve per il lavoro?"
    - learner: "Sì, in agenzia rispondo al telefono in francese tutto il giorno. È stancante, ma imparo tanto."
    - tutor: "Stancante, ma utile. Io invece ho passato l'estate sui libri."
      goals: [situation, pros, cons]
    # merlin-1365_0100455-10
    - learner: "Sono anche molto felice che abbia riuscito l'esame."
      errors: [auxiliary-choice]
    - tutor: "Grazie! Ma «riuscire» al passato vuole «essere» o «avere»?"
      prompt: {text: "abbia riuscito", tags: [auxiliary-choice]}
    - learner: "Sono felice che tu sia riuscito!"
    - tutor: "Esatto. Adesso però devo trovare un lavoro."
    # merlin-1365_0100455-11
    - learner: "Tutti i miei auguri."
    - tutor: "Grazie, ne ho bisogno! Sono stanchissimo."
    # merlin-1365_0100455-13
    - learner: "A desso ti puoi risposare un momento in attesa di un lavoro."
      errors: [word-choice]
    - tutor: "Riposare un momento? Magari, ma mi servono soldi!"
      recast: {text: "risposare", fix: "riposare", tags: [word-choice]}
    # merlin-1365_0100455-7
    - learner: "Io andrò anche al ufficio turistico per domandare se cerca una guida."
      errors: [articulated-preposition]
    - tutor: "Che cara! Ma «al ufficio»: davanti a «ufficio», «al» come diventa?"
      prompt: {text: "al ufficio", tags: [articulated-preposition]}
    - learner: "All'ufficio turistico, sì. Io al posto tuo preferirei fare la guida che stare in un bar."
    - tutor: "Esatto. Anch'io preferisco la guida! Fammi sapere."
      goals: [preference]
    # merlin-1365_0100455-16
    - learner: "Tanti saluti e a presto."
    - tutor: "A presto, e grazie!"

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [ce-ci-sono, article-use]
  turns:
    - tutor: "Ciao! Ho superato la maturità con il massimo dei voti!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100474-2
    - learner: "C'è fantastico che tu hai superato con il massimo dei voti, so che tu sai intelligente."
      errors: [ce-ci-sono, verb-form, subjunctive-use]
    - tutor: "Grazie! Ma per dire che una cosa è fantastica, «c'è» va bene?"
      prompt: {text: "C'è fantastico", tags: [ce-ci-sono]}
    - learner: "È fantastico! Sei proprio intelligente."
    - tutor: "Esatto. Ma non esagerare! E tu, come va il lavoro?"
    # merlin-1365_0100474-1
    - learner: "Adesso lavoro come l'insegnante in una scuola linguistica a Graz e mi piace questo lavoro molto."
      errors: [article-use, word-order]
    - tutor: "Che bello! Ma dopo «lavoro come», davanti al lavoro che fai, mettiamo l'articolo?"
      prompt: {text: "come l'insegnante", tags: [article-use]}
    - learner: "Lavoro come insegnante in una scuola di lingue. Ho molte ore, ma mi piace."
    - tutor: "Esatto. E Graz com'è?"
      goals: [situation, pros, cons]
    # merlin-1365_0100474-4
    - learner: "Devi sapere che Graz è una città molto bellissimo con una culturella molto interessante."
      errors: [comparative, adjective-agreement]
    - tutor: "Ci credo! Ma «bellissimo» vuol dire già «molto bello». Serve anche «molto»?"
      prompt: {text: "molto bellissimo", tags: [comparative]}
    - learner: "Graz è una città bellissima. Io preferisco vivere lì che in una grande città."
    - tutor: "Esatto. E a dicembre hai il secondo esame di tedesco: hai paura? Il primo com'era?"
      goals: [preference]
    # merlin-1365_0100474-11
    - learner: "Non ho paura l'esame non era molto difficile."
    - tutor: "Allora andrà benissimo!"
    # merlin-1365_0100474-14
    - learner: "Tanti saluti."
    - tutor: "Tanti saluti a te, e in bocca al lupo!"

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [piacere, relative-pronoun]
  turns:
    - tutor: "Ciao! Hai saputo? Ho preso la maturità con il massimo dei voti!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100478-6
    - learner: "Credo che tu sia il migliore!"
    - tutor: "Esagerata! E tu, come va lo studio?"
    # merlin-1365_0100478-1
    - learner: "Nell'ultimo periodo ho studiato duramente, perchè io farò la mia maturità quest'anno, che sarà molto difficile."
    - tutor: "Ce la farai benissimo. Io invece non so cosa fare: lavoro o università?"
      goals: [situation, cons]
    # merlin-1365_0100478-8
    - learner: "Trovare un lavoro o iscriverti all Università è una domanda, che è importante per la tua vita."
    - tutor: "Lo so, è proprio questo il problema. Ti ho detto le mie idee: lavorare in banca o studiare all'università."
    # merlin-1365_0100478-2
    - learner: "Mi molto piace le sue idee, ma forse ho una altra possibilità."
      errors: [piacere, word-order, possessive, article-form]
    - tutor: "Grazie! Ma le idee sono tante: allora «piace» va bene?"
      prompt: {text: "Mi molto piace", tags: [piacere]}
    - learner: "Mi piacciono molto le tue idee, ma ho un'altra possibilità: puoi lavorare un anno nel bar di mio zio, si guadagna bene. Io preferirei così, prima di decidere."
    - tutor: "Esatto. Un anno nel bar di tuo zio, prima dell'università? Non ci avevo pensato."
      goals: [pros, preference]
    # merlin-1365_0100478-4
    - learner: "Cosa dici, Francesco?"
    - tutor: "Dico che mi sembra una buona idea! Ne parlo con i miei."
    # merlin-1365_0100478-10
    - learner: "Sono sicura, tu farai che è corretto."
      errors: [relative-pronoun]
    - tutor: "Grazie della fiducia! Ma «farai che è corretto»: «fare» vuole una cosa. Che cosa ci vuole prima di «che»?"
      prompt: {text: "farai che è corretto", tags: [relative-pronoun]}
    - learner: "Tu farai quello che è corretto."
    - tutor: "Esatto. Ci penso stanotte e domani ti chiamo."
    # merlin-1365_0100478-11
    - learner: "Tanti saluti!"
    - tutor: "Ciao, e grazie!"

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Ho preso la maturità! Adesso però non so cosa fare."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100481-0
    - learner: "È fantastico che abbia la tua maturità."
    - tutor: "Grazie! Ma sono un po' confusa: lavorare o studiare?"
    # merlin-1365_0100481-5
    - learner: "È importante che faccia qualcosa volentieri."
    - tutor: "Hai ragione, ma che cosa mi piace davvero? E tu, i tuoi progetti?"
    # merlin-1365_0100481-7
    - learner: "Io faccio il mio maturità il prossimo anno."
      errors: [noun-gender]
    - tutor: "Ah, l'anno prossimo! Ma «maturità» è femminile. Allora «il mio» come diventa?"
      prompt: {text: "il mio maturità", tags: [noun-gender]}
    - learner: "Faccio la mia maturità il prossimo anno. Adesso lavoro in un negozio il sabato: è poco, ma mi pago le vacanze."
    - tutor: "Esatto. Brava, almeno hai i tuoi soldi! E dopo la maturità?"
      goals: [situation, pros, cons]
    # merlin-1365_0100481-9
    - learner: "Dopo vorrei iscrivermi all'Università."
    - tutor: "Subito?"
    # merlin-1365_0100481-8
    - learner: "Poi voglio spendere un'anno in una paese inglese."
      errors: [noun-gender, word-choice]
    - tutor: "Che bel piano! Ma «paese» è maschile. Allora «una paese» va bene?"
      prompt: {text: "una paese", tags: [noun-gender]}
    - learner: "Voglio passare un anno in un paese inglese. Lo preferisco a un anno in ufficio!"
    - tutor: "Esatto. Forse dovrei fare come te, un anno all'estero."
      goals: [preference]
      new: [{lemma: estero, gloss: abroad}]
    # merlin-1365_0100481-16
    - learner: "Ti scrivo subito!"
    - tutor: "Va bene, aspetto la tua lettera!"

- scenario: smartworking
  level: B1
  persona: en-m-retired
  turns:
    - tutor: "Ciao Michele! Quanto tempo! Come stai?"
    # merlin-1395_0000391-0
    - learner: "Caro Luca, Spero che tutto va bene per te."
    - tutor: "Sì, tutto bene, grazie! E tu? Ho saputo che hai un lavoro nuovo."
    - learner: "Sì, lavoro in una banca, in centro. E due giorni alla settimana lavoro da casa."
    - tutor: "Da casa, che comodo! E ti piace?"
      goals: [situation]
    # merlin-1395_0000391-4
    - learner: "Mi piace veramente, non vedo l'ora quando lavoro."
    - tutor: "Che bello sentirlo! Ma c'è anche qualcosa che non va?"
      goals: [pros]
    - learner: "Solo una cosa: la sera sono stanchissimo, e da casa vedo poca gente. Preferisco i giorni in ufficio."
    - tutor: "Ti capisco. Allora vediamoci! Sabato sei libero?"
      goals: [cons, preference]
    # merlin-1395_0000391-10
    - learner: "Vorrei veramente parlare di nuovo con te."
    - tutor: "Anch'io! Sabato alle sei al solito bar, va bene?"
    # merlin-1395_0000391-12
    - learner: "A più tardi, spero."
    - tutor: "Sicuro, a sabato!"

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [article-form]
  turns:
    - tutor: "Ciao Michele! Che sorpresa sentirti!"
    # merlin-1395_0000557-0
    - learner: "Caro Berto, da molto tempo non ci siamo visti."
    - tutor: "Vero, più di un anno! Come stai?"
    # merlin-1395_0000557-1
    - learner: "Spero che tu stia bene."
    - tutor: "Io sì, grazie. E tu? Il lavoro?"
    # merlin-1395_0000557-3
    - learner: "Il mio lavoro è un po'stressante, ma penso chè oggi questo sia normale."
    - tutor: "Purtroppo sì. Sei andato in vacanza, almeno?"
    - learner: "Sì, ad agosto sono andato in bicicletta dalla Germania all'Italia. Quasi sempre sole!"
    - tutor: "In bicicletta fino in Italia? Ma come hai fatto?"
      goals: [where, weather]
    # merlin-1395_0000557-7
    - learner: "È stata una esperienza straordinaria di attraversare gli Alpi."
      errors: [article-form, preposition]
    - tutor: "Incredibile! Ma «Alpi» è una parola femminile plurale. Allora «gli Alpi» va bene?"
      prompt: {text: "gli Alpi", tags: [article-form]}
    - learner: "Attraversare le Alpi in bicicletta è stata la cosa più bella delle vacanze."
    - tutor: "Esatto. Mi devi far vedere le foto!"
      goals: [activities, best]
    # merlin-1395_0000557-10
    - learner: "Cari saluti!"
    - tutor: "Ciao Michele, ci sentiamo presto!"

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [negation, preposition]
  turns:
    - tutor: "Ciao! Ma sei tu? Quanto tempo!"
    # merlin-1395_0000626-0
    - learner: "Ciao Pietro No ti ho visto per mese!"
      errors: [negation, noun-number]
    - tutor: "È vero! Ma per dire di no davanti al verbo, «no» va bene?"
      prompt: {text: "No ti ho visto", tags: [negation]}
    - learner: "Non ti ho visto per mesi!"
    - tutor: "Esatto! Come state, tu e Laura?"
    # merlin-1395_0000626-1
    - learner: "Da noi va bene!"
    - tutor: "Meno male. E Laura si trova bene in montagna? Prima viveva a Roma."
    # merlin-1395_0000626-3
    - learner: "Ma a lei piace questa vita."
    - tutor: "Che bello. E tu, novità al lavoro?"
    # merlin-1395_0000626-6
    - learner: "Dal Maggio fino da oggi ho lavorato a Zurigo, ma dal 1 Aprile vado a Lugano."
      errors: [preposition, articulated-preposition]
    - tutor: "A Lugano! Ma «fino da oggi»: per dire dove finisce un periodo, dopo «fino», quale preposizione usiamo?"
      prompt: {text: "fino da oggi", tags: [preposition]}
    - learner: "Da maggio fino a oggi ho lavorato a Zurigo."
    - tutor: "Esatto. E a Lugano che lavoro fai?"
      goals: [situation]
    - learner: "Lo stesso, in banca, ma lo stipendio è più basso. Però la vita è più tranquilla e si parla italiano: preferisco così."
    - tutor: "Meno soldi ma una vita più tranquilla: mi sembra una buona scelta."
      goals: [pros, cons, preference]

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect, word-order]
  turns:
    - tutor: "Ciao Maria! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0001060-0
    - learner: "Cara Antonella, Come va?"
    - tutor: "Bene, grazie! Allora, sei stata da tua cugina in Sardegna, vero?"
      goals: [where]
    # merlin-1395_0001060-4
    - learner: "Abita in una carina casa al mare."
      errors: [word-order]
    - tutor: "Che fortuna! Ma in italiano «carina» di solito va prima o dopo «casa»?"
      prompt: {text: "una carina casa", tags: [word-order]}
    - learner: "Abita in una casa carina, proprio sul mare."
    - tutor: "Esatto. E che cosa facevate tutto il giorno?"
    # merlin-1395_0001060-6
    - learner: "Erano spesso sulla spiaggia e siamo andati in disco la sera."
      errors: [tense-aspect, subject-verb-agreement, word-choice]
    - tutor: "Che belle vacanze! Ma andare a ballare era una cosa che facevate quasi tutte le sere. Quale tempo usiamo per queste cose?"
      prompt: {text: "siamo andati in disco", tags: [tense-aspect]}
    - learner: "Andavamo in discoteca la sera, e di giorno al mare: c'era sempre il sole. La cosa più bella era ballare sulla spiaggia!"
    - tutor: "Esatto. Che fortuna! Mi devi raccontare tutto con calma."
      goals: [activities, weather, best]
    # merlin-1395_0001060-8
    - learner: "Puoi mi chiamare sul cellulare per la risposta."
      errors: [pronoun-position]
    - tutor: "Certo! Ma con «puoi» e un infinito, «mi» dove va?"
      prompt: {text: "Puoi mi chiamare", tags: [pronoun-position]}
    - learner: "Puoi chiamarmi sul cellulare stasera."
    - tutor: "Esatto. Ti chiamo dopo cena!"
    # merlin-1395_0001060-10
    - learner: "Un bacio e a presto!"
    - tutor: "Un bacio, Maria!"

    gold: {text: "all'ristorante", fix: "al ristorante"}
  - tutor: "Buona! Ma «all'ristorante»: «al» o «all'»?"
    prompt: {text: "all'ristorante", tags: [articulated-preposition]}
  - learner: "Vado al ristorante."
  - tutor: "Esatto. Io la sera cucino a casa."
    goals: [evening]
  # merlin-1395_0000582-5
  - learner: "Ciao, mille baci!"
  - tutor: "Ciao, a presto!"

- scenario: giorno-tipico
  level: A2
  persona: es-f-erasmus
  history: [reflexive]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Io e Giulia pensiamo sempre a te!"
  # merlin-1395_0000593-0
  - learner: "Care Anna e Giulia, come state?"
  - tutor: "Stiamo bene, grazie! E tu?"
  # merlin-1395_0000593-1
  - learner: "Io sto bene."
  - tutor: "E il corso d'italiano? Com'è una giornata lì?"
  - learner: "La mattina io sveglio alle sette e vado a lezione alle otto."
    errors: [reflexive]
    gold: {text: "io sveglio", fix: "io mi sveglio"}
  - tutor: "Presto! Ma «io sveglio»: svegli chi? Pensa a «svegliarsi»."
    prompt: {text: "io sveglio", tags: [reflexive]}

    recast: {text: "tutte e due", fix: "tutti e due", tags: [adjective-agreement]}
  - learner: "Mi sveglio alle sette, ho lezione la mattina e la sera cucino con l'altro studente. E la tua?"
  - tutor: "La mia è tranquilla: lavoro e torno a casa alle sei."
    goals: [wake, work, evening, ask]
  # merlin-1395_0001126-5
  - learner: "Cari saluti!"
  - tutor: "Ciao, buono studio!"


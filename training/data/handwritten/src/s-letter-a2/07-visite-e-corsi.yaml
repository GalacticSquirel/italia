  - tutor: "Esatto. Una bella vita, allora!"
    goals: [wake, work, evening]
  # merlin-1395_0000593-4
  - learner: "L'Italia mi piace molto."
  - tutor: "Siamo contente. E quando torni a casa?"
  # merlin-1395_0000593-9
  - learner: "Ritorno in Francia il mese prossimo."
  - tutor: "Così presto! Allora prima vieni da noi a Pisa?"
  - learner: "Sì, volentieri! E voi, cosa fate adesso tutto il giorno?"
  - tutor: "Lavoriamo tanto, ma la sera siamo libere. Ti aspettiamo!"
    goals: [ask]
  # merlin-1395_0000593-10
  - learner: "A presto!"
  - tutor: "A presto, un bacio!"

- scenario: giorno-tipico
  level: A2
  persona: en-m-heritage
  history: [adjective-agreement]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? E com'è il corso d'italiano?"
  # merlin-1395_0001126-0
  - learner: "La mia insegnante si ciama Giada, fa la letioni molto interessante."
    errors: [spelling, article-use, adjective-agreement]
    gold: {text: "molto interessante", fix: "molto interessanti"}
  - tutor: "Che fortuna! Ma le lezioni sono tante: «molto interessante» va bene?"
    prompt: {text: "molto interessante", tags: [adjective-agreement]}
  - learner: "Fa delle lezioni molto interessanti."
  - tutor: "Esatto. E quanti studenti siete? Tanti?"
  # merlin-1395_0001126-2
  - learner: "L'altro è inglese e io svizzero tedesco."
  - tutor: "Solo due? Allora parlate tanto!"
  # merlin-1395_0001126-3

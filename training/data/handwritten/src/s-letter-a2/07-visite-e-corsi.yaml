# Set s-letter-a2, file 7: A1-A2, visits to friends and news from an Italian course (one real MERLIN text per dialogue, pool 8).

- scenario: vacanze-passate
  level: A2
  persona: es-f-teacher
  history: [participle-agreement, articulated-preposition]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0000552-0
  - learner: "Mi sono rilassata un po' e insomma sto bene."
  - tutor: "Si vede, hai una bella faccia! Ma dove sei stata?"
  - learner: "Sono andato in Sardegna con mia sorella, al mare."
    errors: [participle-agreement]
    gold: {text: "Sono andato", fix: "Sono andata"}
  - tutor: "In Sardegna! Ma «sono andato»: parli di te, una donna. Allora?"
    prompt: {text: "Sono andato", tags: [participle-agreement]}
  - learner: "Sono andata in Sardegna!"
  - tutor: "Esatto. E com'era il tempo?"
    goals: [where]
  - learner: "Sempre sole. Abbiamo nuotato tanto, e la cosa più bella era il mare la sera."
  - tutor: "Che bello. E adesso vieni a trovarci, vero?"
    goals: [weather, activities, best]
  # merlin-1395_0000552-3
  - learner: "Mi piacerebbe incontrarti e la tua famiglia."
    errors: [object-pronoun]
    gold: {text: "incontrarti e la tua famiglia", fix: "incontrare te e la tua famiglia"}
  - tutor: "Anche a noi! Ma «incontrarti e la tua famiglia»: con «e», il pronome non sta attaccato al verbo. Come diventa?"
    prompt: {text: "incontrarti e la tua famiglia", tags: [object-pronoun]}
  - learner: "Mi piacerebbe incontrare te e la tua famiglia."
  - tutor: "Perfetto. I bambini ti aspettano!"
  # merlin-1395_0000552-5
  - learner: "Fammi sapere quando sarete liberi."
  - tutor: "Siamo liberi dal 10 agosto. Dove dormi?"
  # merlin-1395_0000552-6
  - learner: "Abiterò nel albergo vicino alla stazione."
    errors: [articulated-preposition]
    gold: {text: "nel albergo", fix: "nell'albergo"}
  - tutor: "Va bene. Ma «nel albergo»: davanti ad «albergo», come diventa «nel»?"
    prompt: {text: "nel albergo", tags: [articulated-preposition]}
  - learner: "Abiterò nel albergo piccolo, vicino alla stazione."
    errors: [articulated-preposition]
  - tutor: "Nell'albergo piccolo vicino alla stazione? Lo conosco, è carino."
    recast: {text: "nel albergo", fix: "nell'albergo", tags: [articulated-preposition]}
  # merlin-1395_0000552-7
  - learner: "Posso andare in autobus per arrivare a casa tua?"
  - tutor: "Sì, il 12 si ferma proprio davanti a casa."
  # merlin-1395_0000552-8
  - learner: "Cari saluti a tutti!"
  - tutor: "Un bacio, a presto!"

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [possessive, verb-form]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana? E a novembre, vieni a trovarmi?"
  # merlin-1395_0001117-0
  - learner: "Cara Sara, come stai?"
  - tutor: "Bene, grazie! Allora, a novembre?"
  # merlin-1395_0001117-4
  - learner: "Ho una settimana di vacanze (dal 10 al 17 novembre) in novembre, puoi prendere anche due o tre giorni di vacanze?"
  - tutor: "Due giorni sì, forse tre."
  # merlin-1395_0001117-5
  - learner: "E hai voglia di vedermi tua città?"
    errors: [possessive, word-choice]
    gold: {text: "tua città", fix: "la tua città"}
  - tutor: "Certo! Ma «tua città»: prima di «tua», qui serve l'articolo."
    prompt: {text: "tua città", tags: [possessive]}
  - learner: "Hai voglia di farmi vedere la tua città?"
  - tutor: "Moltissimo. Ti porto in centro e al mercato."
  # merlin-1395_0001117-8
  - learner: "O che cosa possimo fare la sera?"
    errors: [verb-form]
    gold: {text: "possimo", fix: "possiamo"}
  - tutor: "Tante cose! Ma «possimo»: con «noi», come fa «potere»?"
    prompt: {text: "possimo", tags: [verb-form]}
  - learner: "Cosa possiamo fare la sera?"
  - tutor: "Il cinema, la musica in piazza... E a te cosa piace fare la sera?"
    goals: [ask]
  - learner: "Io vado spesso a teatro, due volte al mese. Andiamo insieme a teatro una sera?"
  - tutor: "Sì, bella idea! Guardo cosa c'è a novembre."
    goals: [hobby, frequency, propose]
  # merlin-1395_0001117-9
  - learner: "Posso dormire e rimanere da te per sei notte?"
    errors: [noun-number]
    gold: {text: "sei notte", fix: "sei notti"}
  - tutor: "Certo! Ma «sei notte»: sono sei, quindi plurale. Come diventa?"
    prompt: {text: "sei notte", tags: [noun-number]}
  - learner: "Sei notti! Posso stare da te sei notti?"
  - tutor: "Sì, preparo la camera. Ti aspetto il 10!"

- scenario: serata-cinema
  level: A2
  persona: en-f-student
  history: [articulated-preposition, negation]
  turns:
  - tutor: "Stasera sono libera, e tu arrivi oggi! Facciamo qualcosa insieme?"
  # merlin-1395_0001076-0
  - learner: "Ciao Laura! Come stai?"
  - tutor: "Benissimo! A che ora arriva il tuo treno? Alle sei?"
  # merlin-1395_0001076-2
  - learner: "C'é una possibilità mi prendi del binario?"
    errors: [articulated-preposition]
    gold: {text: "del binario", fix: "dal binario"}
  - tutor: "Certo! Ma «del binario»: vuoi dire da dove parti, quindi «di» o «da»?"
    prompt: {text: "del binario", tags: [articulated-preposition]}
  - learner: "Mi prendi dal binario?"
  - tutor: "Sì, ti aspetto lì alle sei."
    goals: [meet]
  - learner: "Grazie! Poi andiamo al cinema? Mi piacciono tanto i film d'amore."
  - tutor: "Allora c'è un film d'amore francese alle otto e una commedia alle dieci."
    goals: [propose, genre]
  - learner: "Il film francese, alle otto!"
  - tutor: "D'accordo. E domenica c'è anche musica in piazza."
    goals: [choose]
  # merlin-1395_0001076-10
  - learner: "Se abbiamo nessuna altra cosa ci andiamo li?"
    errors: [negation]
    gold: {text: "abbiamo nessuna", fix: "non abbiamo nessuna"}
  - tutor: "Buona idea. Ma «se abbiamo nessuna altra cosa»: con «nessuna», cosa serve prima del verbo?"
    prompt: {text: "abbiamo nessuna", tags: [negation]}
  - learner: "Se non abbiamo nessun'altra cosa, ci andiamo?"
  - tutor: "Esatto! Sì, ci andiamo."
  # merlin-1395_0001076-12
  - learner: "Ti abbraccio e un bacio!"
  - tutor: "Un bacio, a stasera!"

- scenario: tempo-libero
  level: A2
  persona: es-m-worker
  history: [word-choice, subject-verb-agreement]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana? Sei ancora a Milano?"
  # merlin-1395_0000563-0
  - learner: "Ciao Sara, come stai?"
  - tutor: "Bene! E tu, cosa fai a Milano?"
  # merlin-1395_0000563-3
  - learner: "Adesso siamo nella piazza a mangiare una pizza."
  - tutor: "Buon appetito! E stasera cosa fate?"
  # merlin-1395_0000563-4
  - learner: "Sta sera andiamo a vedere la partita del AC Milan contra Napoli."
    errors: [word-choice, article-use]
    gold: {text: "contra", fix: "contro"}
  - tutor: "Bello! Ma «contra» è spagnolo. In italiano?"
    prompt: {text: "contra", tags: [word-choice]}
  - learner: "Contro! Andiamo a vedere il Milan contro il Napoli."
  - tutor: "Esatto. Ti piace così tanto il calcio?"
  - learner: "Sì, moltissimo! Vado alla partita ogni mese. E tu guardi le partite?"
  - tutor: "No, io preferisco il tennis."
    goals: [hobby, frequency, ask]
  # merlin-1395_0000563-6
  - learner: "Spero che vinciamo!"
  - tutor: "Speriamo! E sei sempre a casa di Paola?"
  # merlin-1395_0000563-7
  - learner: "La sua famiglia sono molto gentili."
    errors: [subject-verb-agreement]
    gold: {text: "sono molto gentili", fix: "è molto gentile"}
  - tutor: "Che bello. Ma «la famiglia sono»: la famiglia è una sola. E il verbo?"
    prompt: {text: "sono molto gentili", tags: [subject-verb-agreement]}
  - learner: "La sua famiglia è molto gentile."
  - tutor: "Esatto. Ti trattano bene, allora."
  # merlin-1395_0000563-8
  - learner: "La sua mamma è una bellissima cuciniera!"
  - tutor: "Allora mangi benissimo! Quando torni?"
  - learner: "Lunedì. Facciamo una cena insieme martedì? Cucino io!"
  - tutor: "Sì, a martedì! Porto io il vino."
    goals: [propose]

- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  history: [verb-form, articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Dove sei adesso?"
  # merlin-1395_0000582-0
  - learner: "Come vai?"
  - tutor: "Bene, grazie! E tu dove sei?"
  # merlin-1395_0000582-1
  - learner: "Io sono in sicile per seguito un corso di italiani."
    errors: [verb-form, spelling, adjective-agreement]
    gold: {text: "per seguito", fix: "per seguire"}
  - tutor: "Ma «per seguito»? Dopo «per», pensa a «per mangiare»."
    prompt: {text: "per seguito", tags: [verb-form]}
  - learner: "Sono in Sicilia per seguire un corso di italiano."
  - tutor: "Brava! E com'è il corso?"
  # merlin-1395_0000582-2
  - learner: "el mio insegnante si ciamo daniella e molto simpatica."
    errors: [verb-form, noun-gender, spelling]
    gold: {text: "si ciamo", fix: "si chiama"}
  - tutor: "Bene! Ma «si ciamo»: lei... come si...?"
    prompt: {text: "si ciamo", tags: [verb-form]}
  - learner: "La mia insegnante si chiama Daniela ed è molto simpatica."
  - tutor: "Esatto! A che ora ti svegli?"
  - learner: "Alle sette. La lezione è alle nove. E tu?"

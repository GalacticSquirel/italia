    errors: [preposition, adjective-agreement]
    gold: {text: "tutte è due", fix: "tutti e due"}
  - tutor: "Ci credo. Ma «tutte è due»: siete due ragazzi. Allora?"
    prompt: {text: "tutte è due", tags: [adjective-agreement]}
  - learner: "È difficile per tutte e due."
    errors: [adjective-agreement]

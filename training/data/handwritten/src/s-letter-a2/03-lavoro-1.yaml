# Set s-letter-a2, file 3: A2, helping a friend who is looking for work (one real MERLIN text per dialogue, pool 8).

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [noun-number, verb-form]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? La mia è troppo lunga: cerco un lavoro nuovo."
  # merlin-1385_0001785-1
  - learner: "Che tipo di lavoro vuoi fare et che lingui parli?"
    errors: [noun-number, spelling]
    gold: {text: "lingui", fix: "lingue"}
  - tutor: "Buone domande! Ma «che lingui»: «lingua» al plurale come diventa?"
    prompt: {text: "lingui", tags: [noun-number]}
  - learner: "Che tipo di lavoro vuoi fare e che lingue parli?"
  - tutor: "Vorrei lavorare in un albergo. Parlo inglese e un po' di tedesco."
  # merlin-1385_0001785-3
  - learner: "Dove lavori adesso?"
  - tutor: "In un bar vicino alla stazione. Comincio alle sei di mattina!"
    goals: [ask]
  # merlin-1385_0001785-2
  - learner: "Vorrei sapere quanto ore pó lavorare per la settimana."
    errors: [adjective-agreement, verb-form]
    gold: {text: "pó", fix: "puoi"}
  - tutor: "Ma «pó»: con «tu», come fa il verbo «potere»?"
    prompt: {text: "pó", tags: [verb-form]}
  - learner: "Vorrei sapere quante ore puoi lavorare la settimana."
  - tutor: "Anche quaranta, non ho paura di lavorare. E tu, com'è la tua giornata?"
  - learner: "Io mi sveglio alle sette e lavoro in banca fino alle quattro. La sera vado in palestra."
  - tutor: "Lavori in banca? Allora chiedi se cercano qualcuno anche lì!"
    goals: [wake, work, evening]


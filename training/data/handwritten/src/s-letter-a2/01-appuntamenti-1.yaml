  # merlin-1385_0001147-8
  - learner: "Grazia per la tua compressione."
    errors: [spelling, word-choice]
    gold: {text: "compressione", fix: "comprensione"}
  - tutor: "Di niente! Ma «compressione» non è la parola giusta qui. Pensa al verbo «capire»: quale parola cerchi?"
    prompt: {text: "compressione", tags: [word-choice]}
  - learner: "Grazie per la tua comprensione!"
  - tutor: "Esatto. Allora a sabato, alle otto!"

- scenario: numero-telefono

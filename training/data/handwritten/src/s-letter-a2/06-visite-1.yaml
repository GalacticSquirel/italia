  - tutor: "Andiamo a mangiare il pesce, o al cinema all'aperto."
  # merlin-1395_0001109-4
  - learner: "I tuoi genitori?"
  - tutor: "Mia madre sta bene. Mio padre è in ospedale, ma sta già meglio."
    goals: [ask]
  # merlin-1395_0001109-6
  - learner: "Io e mia ragazza arrivare, prossima settimana a lunedi."
    errors: [possessive, verb-form]
    gold: {text: "mia ragazza", fix: "la mia ragazza"}
  - tutor: "Benissimo! Ma «mia ragazza»: con «ragazza», prima di «mia» va l'articolo?"
    prompt: {text: "mia ragazza", tags: [possessive]}
  - learner: "Sì! Io e la mia ragazza arriviamo lunedì."
  - tutor: "Perfetto, vi prendo alla stazione."
  # merlin-1395_0001109-7
  - learner: "Va bene per te?"
  - tutor: "Certo, lunedì sono libero tutto il giorno."
  # merlin-1395_0001109-8
  - learner: "Tanti saluti!"
  - tutor: "A lunedì, allora!"

- scenario: tempo-libero

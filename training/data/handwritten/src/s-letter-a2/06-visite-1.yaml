# Set s-letter-a2, file 6: A1-A2, planning a visit to a friend in another city (one real MERLIN text per dialogue, pool 8).

- scenario: casa-mia
  level: A2
  persona: en-f-student
  history: [reflexive, articulated-preposition]
  turns:
  - tutor: "Ciao, da quanto tempo! Allora, com'è la tua casa nuova?"
  # merlin-1395_0001019-0
  - learner: "Caro Luca, come ti stai?"
    errors: [reflexive]
    gold: {text: "come ti stai", fix: "come stai"}
  - tutor: "Bene! Ma «come ti stai»: il verbo «stare» qui non vuole «ti». Come dici?"
    prompt: {text: "come ti stai", tags: [reflexive]}
  - learner: "Come stai?"
  - tutor: "Benissimo, grazie! E la casa?"
  - learner: "È un appartamento piccolo, con due camere e una cucina. La stanza che preferisco è la cucina, perché è piena di luce. E la tua casa?"
  - tutor: "La mia è vecchia, ma ha un bel balcone. E qui a Lecce fa già caldo!"
    goals: [type, rooms, favourite, ask]
  # merlin-1395_0001019-1
  - learner: "Come fa il tempo?"
  - tutor: "Sole tutti i giorni, ventotto gradi."
  # merlin-1395_0001019-3
  - learner: "E come sta la tua famiglia?"
  - tutor: "Stanno tutti bene, e ti aspettano!"
  # merlin-1395_0001019-6
  - learner: "Quando posso venire alla tua casa?"
    errors: [articulated-preposition]
    gold: {text: "alla tua casa", fix: "a casa tua"}
  - tutor: "Quando vuoi! Ma «alla tua casa»: con «casa» diciamo «a casa mia», «a casa di Luca». E per te?"
    prompt: {text: "alla tua casa", tags: [articulated-preposition]}
  - learner: "Posso venire alla tua casa a giugno?"
    errors: [articulated-preposition]
  - tutor: "«Posso venire a casa tua a giugno?» Certo, giugno va benissimo!"
    recast: {text: "alla tua casa", fix: "a casa tua", tags: [articulated-preposition]}
  # merlin-1395_0001019-10
  - learner: "Ciao e a presto!"
  - tutor: "A presto! Ti aspetto a giugno."


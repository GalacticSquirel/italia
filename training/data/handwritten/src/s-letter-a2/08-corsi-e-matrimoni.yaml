# Set s-letter-a2, file 8: A2, news from an Italian course and answers to wedding invitations (one real MERLIN text per dialogue, pool 8).

- scenario: giorno-tipico
  level: A2
  persona: es-f-teacher
  history: [article-use, verb-form]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Raccontami del corso!"
  # merlin-1395_0001133-0
  - learner: "Anna, come stai?"
  - tutor: "Bene, grazie! E il corso? Com'è l'insegnante?"
  # merlin-1395_0001133-4
  - learner: "Signor Bianchi è molto gentile."
    errors: [article-use]
    gold: {text: "Signor Bianchi", fix: "Il signor Bianchi"}
  - tutor: "Che bello. Ma «signor Bianchi è»: quando parli di lui, prima di «signor» va l'articolo."
    prompt: {text: "Signor Bianchi", tags: [article-use]}
  - learner: "Il signor Bianchi è molto gentile."
  - tutor: "Giusto. E impari tanto con lui?"
  # merlin-1395_0001133-5
  - learner: "Ma non imparato tutto il tempo."
    errors: [verb-form]
    gold: {text: "non imparato", fix: "non imparo"}
  - tutor: "Ma «non imparato»: parli di adesso o del passato?"
    prompt: {text: "non imparato", tags: [verb-form]}
  - learner: "Di adesso! Non imparo tutto il tempo: la sera esco con gli amici."
  - tutor: "Fai bene. E la mattina a che ora ti svegli?"
  - learner: "Alle sette, perché la lezione comincia alle otto e mezza. E tu, come va il lavoro?"
  - tutor: "Bene, ma sono sempre stanca. Però il venerdì sera esco sempre!"
    goals: [wake, work, evening, ask]
  # merlin-1395_0001133-7
  - learner: "Allora, devo finire la lettera, perché devo andare alla lezione."
  - tutor: "Vai, vai! Ci sentiamo stasera."
  # merlin-1395_0001133-8
  - learner: "Ciao e tanti baci!"
  - tutor: "Ciao, baci anche a te!"

- scenario: tempo-libero
  level: A2
  persona: es-f-erasmus
  history: [article-use, noun-number]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana? Sei ancora a Siena?"
  # merlin-1395_0000448-0
  - learner: "Io e Michele faciamo qui corso di italiano."
    errors: [article-use, spelling]
    gold: {text: "corso di italiano", fix: "un corso di italiano"}
  - tutor: "Che bello! Ma «faciamo qui corso»: davanti a «corso», qui va un articolo. Quale?"
    prompt: {text: "corso di italiano", tags: [article-use]}
  - learner: "Io e Michele facciamo qui un corso di italiano."
  - tutor: "Esatto. E come si chiama la vostra insegnante?"
  # merlin-1395_0000448-3
  - learner: "Si chiama Maria."
  - tutor: "È brava?"
  # merlin-1395_0000448-4
  - learner: "Lei e molto inteligente."
    errors: [spelling]
    gold: {text: "inteligente", fix: "intelligente"}
  - tutor: "Che fortuna! Ma «inteligente»: la l è doppia o semplice?"
    prompt: {text: "inteligente", tags: [spelling]}
  - learner: "Doppia! Lei è molto intelligente."
  - tutor: "Giusto. E quando non avete lezione?"
  # merlin-1395_0000448-5
  - learner: "Quando non c'è lezioni abiamo tempo libero per noi."
    errors: [noun-number, spelling]
    gold: {text: "c'è lezioni", fix: "c'è lezione"}
  - tutor: "Ma «non c'è lezioni»: dopo «c'è», una cosa sola o tante?"
    prompt: {text: "c'è lezioni", tags: [noun-number]}
  - learner: "Una! Quando non c'è lezione abbiamo tempo libero."
  - tutor: "E cosa fate nel tempo libero?"
  - learner: "Andiamo al mare quasi ogni pomeriggio. E tu, cosa fai nel fine settimana? Vieni a trovarci?"
  - tutor: "Io gioco a tennis, ma sabato vengo da voi con piacere!"
    goals: [hobby, frequency, ask, propose]


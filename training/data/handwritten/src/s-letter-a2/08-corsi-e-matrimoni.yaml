- scenario: compleanno
  level: A2
  persona: es-m-worker
  history: [reflexive, pronoun-position]
  turns:
  - tutor: "Allora, cosa facciamo per il matrimonio? Hai ricevuto il nostro invito?"
  # merlin-1365_0100185-0
  - learner: "Cara Beatrice, caro Stefano, congratulazioni per il vostro Matrimonio!"
  - tutor: "Grazie! Siamo felicissimi."
  # merlin-1365_0100185-1
  - learner: "È bellissimo chè decidete di sposare e restare nella futura insieme."
    errors: [reflexive, tense-aspect, word-choice]
    gold: {text: "di sposare", fix: "di sposarvi"}
  - tutor: "Grazie! Ma «decidete di sposare»: sposare chi? Qui il verbo è «sposarsi»."
    prompt: {text: "di sposare", tags: [reflexive]}
  - learner: "È bellissimo che avete deciso di sposarvi!"
  - tutor: "Esatto. Allora vieni il 20 settembre?"
  # merlin-1365_0100185-3
  - learner: "Sono molto felice che invitatemi."
    errors: [pronoun-position]
    gold: {text: "che invitatemi", fix: "che mi invitate"}
  - tutor: "Ci mancherebbe! Ma «che invitatemi»: qui il pronome va prima del verbo. Come diventa?"
    prompt: {text: "che invitatemi", tags: [pronoun-position]}
  - learner: "Sono molto felice che mi invitate."
  - tutor: "Allora ci sei il 20?"
  # merlin-1365_0100185-5
  - learner: "Però c'è un problema: Siccome devo lavorare al questo giorno arrivo un po tardi."
    errors: [articulated-preposition]
    gold: {text: "al questo giorno", fix: "questo giorno"}
  - tutor: "Non importa. Ma «al questo giorno»: con «questo», serve «al»?"
    prompt: {text: "al questo giorno", tags: [articulated-preposition]}
  - learner: "No. Devo lavorare quel giorno, arrivo un po' tardi."
  - tutor: "Va bene, la festa finisce tardi."
    goals: [date]
  - learner: "Perfetto! Chi viene? E cosa volete come regalo?"
  - tutor: "Vengono cento amici. Per il regalo non lo sappiamo ancora."
    goals: [guests]
  # merlin-1365_0100185-7
  - learner: "Se no, ho una sorpresa meravigliosa!"
  - tutor: "Una sorpresa? Allora va bene, ci fidiamo di te!"
    goals: [gift]
  - learner: "E la cena? C'è il pesce?"
  - tutor: "Sì, pesce e una torta enorme. A settembre, allora!"
    goals: [food]


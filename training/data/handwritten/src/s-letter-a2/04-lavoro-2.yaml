    prompt: {text: "come tu", tags: [object-pronoun]}
  - learner: "Sì, cerca persone come tu!"
    errors: [object-pronoun]
  - tutor: "«Persone come te»: che bello! Com'è questo lavoro?"
    recast: {text: "come tu", fix: "come te", tags: [object-pronoun]}
  # merlin-1385_0000124-5
  - learner: "Il lavoro è molto interessante e i colleghi sono simpatici."
  - tutor: "Mi piace! Tu lavori lì? Com'è la tua giornata?"
  - learner: "Sì. Mi sveglio alle sette, lavoro fino alle cinque e la sera vado a correre."
  - tutor: "Allora parli tu con il capo per me?"
    goals: [wake, work, evening]
  - learner: "Sì, domani gli parlo."
  - tutor: "Grazie mille, sei un tesoro!"
  # merlin-1385_0000124-6
  - learner: "A presto e cari saluti!"
  - tutor: "A presto!"

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [modal-infinitive, adjective-agreement]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Hai letto il mio messaggio? Cerco un lavoro diverso."
  # merlin-1385_0001798-0
  - learner: "Ciao Anna, grazie per la tua email."
  - tutor: "Prego! Mi puoi aiutare?"
  # merlin-1385_0001798-1
  - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
  - tutor: "Va bene, chiedi."
  # merlin-1385_0001798-2
  - learner: "Puoi dove lavori adesso?"
    errors: [modal-infinitive]
    gold: {text: "Puoi dove", fix: "Puoi dirmi dove"}
  - tutor: "«Puoi dove lavori»? Dopo «puoi» ci vuole un verbo. Puoi... cosa?"
    prompt: {text: "Puoi dove", tags: [modal-infinitive]}
  - learner: "Puoi dirmi dove lavori adesso?"
  - tutor: "Sì, in un hotel vicino al mare."
    goals: [ask]
  # merlin-1385_0001798-3
  - learner: "Che tipo di lavoro vuoi fare?"
  - tutor: "Qualcosa con gli animali, forse in un parco."
  # merlin-1385_0001798-5
  - learner: "Vorrei sapere queste informazioni per cercare un bello nuovo posto di lavoro per te!"
    errors: [adjective-agreement]
    gold: {text: "un bello nuovo posto", fix: "un bel posto nuovo"}
  - tutor: "Sei gentile! Ma «un bello nuovo posto»: davanti a una parola come «nuovo», «bello» diventa più corto."
    prompt: {text: "un bello nuovo posto", tags: [adjective-agreement]}
  - learner: "Per cercare un bel posto nuovo per te!"
  - tutor: "Esatto, grazie! E tu, com'è la tua giornata?"
  - learner: "Mi sveglio alle otto, studio all'università e la sera lavoro in un bar."
  - tutor: "Che giornata piena! Se senti di un lavoro, dimmelo."
    goals: [wake, work, evening]
  # merlin-1385_0001798-6
  - learner: "Buona fine settimana!"
  - tutor: "Anche a te, ciao!"

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Io bene, ma mio fratello cerca lavoro."
  # merlin-1385_0000123-0
  - learner: "Cara Anna, grazie per la tua email."
  - tutor: "Di niente. Mio fratello è molto triste, sai."
  # merlin-1385_0000123-1
  - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
  - tutor: "Certo, chiedi pure."
  # merlin-1385_0000123-2
  - learner: "Puoi dirmi dove lavora oggi?"
  - tutor: "In un supermercato, ma solo due giorni alla settimana."
    goals: [ask]
  # merlin-1385_0000123-4
  - learner: "Hai una preferenza per una città?"
  - tutor: "Io no, ma lui vuole restare qui a Bologna."
  # merlin-1385_0000123-5
  - learner: "Vorrei sapere anche quando desidera iniziare il nuovo lavoro."
  - tutor: "Subito! Ha bisogno di soldi. Tu dove lavori adesso?"
  - learner: "In un ristorante. Mi sveglio tardi, lavoro dal pomeriggio e la sera torno a casa all'una."
  - tutor: "Che giornata lunga! Nel tuo ristorante cercano qualcuno?"
    goals: [wake, work, evening]
  - learner: "Sì, cercano un cameriere. Il tuo fratello mi può chiamare."
    errors: [possessive]
    gold: {text: "Il tuo fratello", fix: "Tuo fratello"}
  - tutor: "Fantastico! Ma «il tuo fratello»: con «fratello», l'articolo ci va?"
    prompt: {text: "Il tuo fratello", tags: [possessive]}
  - learner: "No! Tuo fratello mi può chiamare."
  - tutor: "Esatto. Gli do il tuo numero stasera."
  # merlin-1385_0000123-6
  - learner: "Espero tue risposte."
    errors: [false-friend, possessive]
    gold: {text: "Espero", fix: "Aspetto"}
  - tutor: "Certo! Ma «espero» è spagnolo. In italiano, per una risposta che arriva, che verbo usi?"
    prompt: {text: "Espero", tags: [false-friend]}
  - learner: "Aspetto le tue risposte!"
  - tutor: "Giusto. Ti rispondo domani, va bene?"


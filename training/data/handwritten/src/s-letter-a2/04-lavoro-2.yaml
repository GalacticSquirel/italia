# Set s-letter-a2, file 4: A2, more friends looking for work (one real MERLIN text per dialogue, pool 8).

- scenario: giorno-tipico
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? La mia è sempre la stessa: voglio cambiare lavoro."
  # merlin-1385_0001174-0
  - learner: "Ciao Anna, come va?"
  - tutor: "Non molto bene. Mi aiuti a trovare qualcosa di nuovo?"
  # merlin-1385_0001174-1
  - learner: "Voglio aiutare ma ho bisogno anche informatione."
    errors: [object-pronoun, preposition, spelling]
    gold: {text: "bisogno anche informatione", fix: "bisogno di informazioni"}
  - tutor: "Grazie! Ma «ho bisogno informatione»: dopo «bisogno», quale preposizione usi?"
    prompt: {text: "bisogno anche informatione", tags: [preposition]}
  - learner: "Sì, ho bisogno informazioni."
    errors: [preposition]
  - tutor: "Hai bisogno di informazioni? Certo, chiedi pure."
    recast: {text: "bisogno informazioni", fix: "bisogno di informazioni", tags: [preposition]}
  # merlin-1385_0001174-3
  - learner: "Che lavoro vuoi fare dopo?"
  - tutor: "Mi piacerebbe lavorare in una scuola, con i bambini."
    goals: [ask]
  # merlin-1385_0001174-4
  - learner: "Perche vuoi cambiare il tuo lavoro?"
  - tutor: "Perché in ufficio sono sempre sola davanti al computer. E la tua giornata com'è?"
  - learner: "Mi sveglio alle sette e lavoro in un ospedale. La sera leggo un libro."
  - tutor: "Un lavoro importante, il tuo! Grazie per le domande."
    goals: [wake, work, evening]
  # merlin-1385_0001174-5
  - learner: "Grazie per le risposte e una buona serrata."
    errors: [word-choice]
  - tutor: "Una buona serata anche a te!"
    recast: {text: "serrata", fix: "serata", tags: [word-choice]}

- scenario: giorno-tipico
  level: A2
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:

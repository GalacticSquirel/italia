# Set s-letter-a2, file 2: A1-A2, more busy weeks and new dates, and news after a long time (one real MERLIN text per dialogue, pool 8).

- scenario: tempo-libero
  level: A2
  persona: en-m-traveller
  history: [negation, ci-ne]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana? Giovedì prendiamo il caffè insieme?"
  # merlin-1385_0001165-0
  - learner: "Ciao Sara, è una settimana orribile."
  - tutor: "Perché? Cosa succede?"
  # merlin-1385_0001165-1
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio no posso incontrarti perchè c'è una riunione organizzata del mio capo e così non ho tempo di vederti."
    errors: [negation, articulated-preposition]
    gold: {text: "no posso", fix: "non posso"}
  - tutor: "Mi dispiace. Ma «no posso»: davanti a un verbo, «no» va bene?"
    prompt: {text: "no posso", tags: [negation]}
  - learner: "Non posso! Giovedì pomeriggio non posso incontrarti."
  - tutor: "Esatto. E allora quando ci vediamo?"
  # merlin-1385_0001165-2
  - learner: "Forse possiamo incontrarci sabato sera?"
  - tutor: "Sabato sera sono libera. Cosa facciamo?"
    goals: [propose]
  # merlin-1385_0001165-3
  - learner: "Ti va di andare a cena in un ristorante tailandese?"
  - tutor: "Mi va, ma qui non conosco nessun ristorante tailandese."
  # merlin-1385_0001165-4
  - learner: "Conosco un veramente buonissimo!"
    errors: [ci-ne]
    gold: {text: "Conosco un", fix: "Ne conosco uno"}
  - tutor: "Davvero? Ma per non ripetere «ristorante», cosa metti prima di «conosco»?"
    prompt: {text: "Conosco un", tags: [ci-ne]}
  - learner: "Conosco uno buonissimo, davvero!"
    errors: [ci-ne]
  - tutor: "«Ne conosco uno buonissimo»: allora mi fido! Tu ci vai spesso?"
    recast: {text: "Conosco uno", fix: "Ne conosco uno", tags: [ci-ne]}
  - learner: "Sì, mi piace tanto: ci vado ogni venerdì con i colleghi. E tu, cosa fai il sabato?"
  - tutor: "Il sabato faccio sport. Allora a sabato, alle otto al ristorante!"
    goals: [hobby, frequency, ask]
  # merlin-1385_0001165-6
  - learner: "Un abbraccio!"
  - tutor: "Un abbraccio anche a te!"


# Set s-recast-native, file 2: A2, a friend's wedding, holidays and plans with friends (real
# learner sentences corrected by a native speaker; recasts use the native fix of the learner's span).

- scenario: casa-mia
  level: A2
  persona: en-f-student
  history: [reflexive]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "È un appartamento piccolo: due camere, una cucina e un bagno. La mia stanza preferita è la cucina."
  - tutor: "La cucina, bello! Ho una notizia: io e Giulia a giugno ci sposiamo!"
    goals: [type, rooms, favourite]
  # merlin-1365_0100174-2
  - learner: "Dopo dieci anni, ci conosciamo, Voi sposate."
    errors: [reflexive]
  - tutor: "Eh sì, dieci anni! Ma «Voi sposate»: con «sposarsi», per noi due quale pronome usiamo?"
    prompt: {text: "Voi sposate", tags: [reflexive]}
  - learner: "Sì, voi sposate a giugno! Che bella notizia."
    errors: [reflexive]
  - tutor: "«Voi vi sposate a giugno»: sì, il 12! E tu e Mark siete invitati, naturalmente."
    recast: {text: "voi sposate", fix: "Voi vi sposate", tags: [reflexive]}
  # merlin-1365_0100151-2
  - learner: "Noi vi ringraziamo per il invito."
    errors: [article-form]
  - tutor: "Prego! Però «il invito»: la parola comincia con la «i». L'articolo cambia?"
    prompt: {text: "il invito", tags: [article-form]}
  - learner: "Ah, sì: per l'invito. E la vostra casa nuova com'è?"
  - tutor: "Esatto! È una casa grande, fuori città. Dopo il matrimonio venite a vederla?"
    goals: [ask]
  # merlin-1395_0001116-5
  - learner: "C'è un parccheggio vicino a casa tua?"
  - tutor: "Sì, proprio davanti a casa. Allora venite in macchina, vi aspettiamo!"

- scenario: famiglia
  level: A2
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone? E come state tutti?"
  # merlin-1395_0000512-1
  - learner: "Sto abbastanza bene anche mia moglie e mia figlia Maria."
  - tutor: "Meno male! Allora questa ragazza qui è Maria?"
  - learner: "Sì, è mia figlia. Ha trentadue anni e fa la dottoressa a Monaco."
  - tutor: "Brava! Senti, io e Beatrice ci sposiamo il 20 novembre. Venite anche voi?"
    goals: [who, describe, ages]
  # merlin-1365_0100166-2
  - learner: "Devo dire, che andare non è possibile per me, perchè al 20 novembre sono in Germania con la mia famiglia."
    errors: [articulated-preposition]
  - tutor: "Oh no! Ma «al 20 novembre»: con le date, usiamo proprio «al»?"
    prompt: {text: "al 20 novembre", tags: [articulated-preposition]}
  - learner: "Sì, al 20 novembre sono a Monaco, per il compleanno di mia moglie."
    errors: [articulated-preposition]
  - tutor: "Il 20 novembre è il compleanno di tua moglie? Allora capisco, la famiglia prima di tutto!"
    recast: {text: "al 20 novembre", fix: "il 20 novembre", tags: [articulated-preposition]}
  # merlin-1365_0100166-6
  - learner: "Sono molto triste, perchè non può vedere il vestito di Beatrice."
    errors: [subject-verb-agreement]
  - tutor: "Peccato davvero! Ma «non può vedere»: chi non vede il vestito? Tu, quindi...?"
    prompt: {text: "non può vedere", tags: [subject-verb-agreement]}
  - learner: "Io non posso vedere il vestito. Ma voglio tutte le foto! E la tua famiglia viene?"
  - tutor: "Esatto! Le foto te le mando io. Sì, vengono tutti, anche mia nonna di novant'anni."
    goals: [ask]

- scenario: weekend-scorso
  level: A2
  persona: es-f-teacher
  history: [conditional-form]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Benissimo! Sono andata al lago con mio marito e abbiamo fatto un giro in barca."
  - tutor: "In barca, che bello! E il paese sul lago com'era?"
    goals: [where, what, with-who]
  # merlin-1395_0000340-6
  - learner: "Era magnifico e la gente è molto simpatica."
  - tutor: "Ci torni, allora?"
  - learner: "Sì, sicuro! E tu, cosa hai fatto?"
  - tutor: "Una cosa speciale: Paolo mi ha chiesto di sposarlo! Il matrimonio è a maggio e sei invitata."
    goals: [opinion]
  # merlin-1365_0100010-0
  - learner: "Porrei venire con mio marito."
    errors: [conditional-form]
  - tutor: "Ma certo! Però «porrei»: il verbo è «potere». Allora come si dice?"
    prompt: {text: "Porrei", tags: [conditional-form]}
  - learner: "Sì, porrei venire con lui, se va bene."
    errors: [conditional-form]
  - tutor: "«Potrei venire con mio marito?» Certo che sì: siete invitati tutti e due!"
    recast: {text: "porrei", fix: "Potrei", tags: [conditional-form]}
  # merlin-1365_0100024-3
  - learner: "Ringraziandovi dell'invito, dica me che cosa volete come regalo?"
    errors: [imperative-form]
  - tutor: "Che gentile! Ma «dica me»: parli a me e a Paolo, con il «voi». Come diventa?"
    prompt: {text: "dica me", tags: [imperative-form]}
  - learner: "Ditemi che cosa volete come regalo!"
  - tutor: "Esatto! Non vogliamo niente, solo voi due alla festa."

- scenario: giorno-tipico
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi sveglio alle sette, faccio colazione e alle otto vado in ufficio a piedi."
  - tutor: "Brava! Io invece mi alzo tardi. Ah, una notizia: io e Luca ci sposiamo a Napoli, a settembre! Vieni?"
    goals: [wake, work]
  # merlin-1365_0100004-0
  - learner: "Vi Ringrazio il vostro invito, sarò molto contenta di essere nel vostro matrimonio e anche perchè per me è una opportunità per conoscere la città di Napoli."
    errors: [preposition, articulated-preposition]
  - tutor: "Che bello che vieni! Ma «ringrazio il vostro invito»: con «ringraziare», ci vuole una preposizione. Quale?"
    prompt: {text: "Ringrazio il vostro invito", tags: [preposition]}
  - learner: "Sì, vi ringrazio il vostro invito. Non conosco Napoli!"
    errors: [preposition]
  - tutor: "«Vi ringrazio per il vostro invito»: prego, siamo felici! E sai? I miei genitori fanno trent'anni di matrimonio lo stesso giorno."
    recast: {text: "ringrazio il vostro invito", fix: "per il vostro invito", tags: [preposition]}
  # merlin-1365_0100174-4
  - learner: "Anche congratulazioni ai Vostri genitori."
    errors: [word-order]
  - tutor: "Grazie! Ma «Anche congratulazioni»: «anche» va proprio all'inizio?"
    prompt: {text: "Anche congratulazioni", tags: [word-order]}
  - learner: "No: congratulazioni anche ai vostri genitori! Trent'anni, che bello."
  - tutor: "Giusto! Glielo dico stasera. E tu la sera cosa fai, dopo il lavoro?"
  - learner: "Vado in palestra e poi guardo un film. E tu, come passi la sera?"
  - tutor: "Io cucino e telefono a Luca. Stasera però preparo la lista degli invitati!"
    goals: [evening, ask]

- scenario: vacanze-passate
  level: A2
  persona: en-m-traveller
  history: [noun-number]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0000636-1
  - learner: "Sono andato in Sardegna una settimana fa."
  - tutor: "In Sardegna, che bello! E com'era il tempo?"
    goals: [where]
  # merlin-1395_0000529-3
  - learner: "Il tempo fa molto bello e l'appartamento era vicino al mare con una spiaggia splendida."
    errors: [tense-aspect]
  - tutor: "Che fortuna! Ma «il tempo fa»: parli della vacanza, che è finita. Quale tempo del verbo usi?"
    prompt: {text: "Il tempo fa", tags: [tense-aspect]}
  - learner: "Sì, il tempo fa molto bello, sempre sole e caldo."
    errors: [tense-aspect]
  - tutor: "Il tempo faceva molto bello, con sole e caldo: perfetto! E cosa facevi tutto il giorno?"
    goals: [weather]
    recast: {text: "il tempo fa", fix: "Il tempo faceva", tags: [tense-aspect]}
  - learner: "La mattina nuotavo e la sera mangiavo il pesce al porto."
  - tutor: "Che vita! Cosa ti è piaciuto di più?"
    goals: [activities]
  # merlin-1395_0001040-4
  - learner: "Il mare à bellissimo."
  - tutor: "Lo so, quel mare è unico. Ci torno anch'io l'anno prossimo!"
    goals: [best]

- scenario: tempo-libero
  level: A2
  persona: en-m-traveller
  history: [reflexive]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Vado in montagna con due amici. Camminiamo tutto il giorno."
  - tutor: "Che bello! Ci vai spesso?"
    goals: [hobby]
  - learner: "Una volta al mese, quando fa bel tempo. E tu?"
  - tutor: "Io corro al parco il sabato mattina. Senti, giovedì pomeriggio prendiamo un caffè e parliamo del progetto?"
    goals: [frequency, ask]
  # merlin-1385_0001758-1
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarvo con tu."
    errors: [reflexive, object-pronoun]
  - tutor: "Peccato! Ma «incontrarvo»: parli di te. Quale pronome va alla fine del verbo?"
    prompt: {text: "incontrarvo", tags: [reflexive]}
  # merlin-1385_0001103-0
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non posso incontrarvi con ti."
    errors: [reflexive, object-pronoun]
  - tutor: "«Giovedì non posso incontrarmi con te», ho capito. Allora quando sei libero?"
    recast: {text: "incontrarvi", fix: "incontrarmi", tags: [reflexive]}
  - learner: "Venerdì mattina alle nove, al bar sotto l'ufficio?"
  - tutor: "Perfetto, venerdì alle nove al bar. Offro io!"
    goals: [propose]

- scenario: casa-mia
  level: A2
  persona: es-m-worker
  history: [pronoun-position]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Vivo in una casa vecchia con un giardino. Ci sono tre camere e due bagni."
  - tutor: "Un giardino, che bello! Qual è la tua stanza preferita?"
    goals: [type, rooms]
  - learner: "Il salotto, perché c'è un grande divano davanti al camino."
  - tutor: "Che bello in inverno! Io vivo a Torino, in un appartamento piccolo ma bello."
    goals: [favourite]
  # merlin-1395_0000527-3
  - learner: "Voglio ti incontrare il 27 Dicembre."
    errors: [pronoun-position]
  - tutor: "Davvero? Che bello! Ma «voglio ti incontrare»: il pronome va proprio lì, in mezzo?"
    prompt: {text: "Voglio ti incontrare", tags: [pronoun-position]}
  - learner: "Sì, voglio ti incontrare a Torino. È possibile?"
    errors: [pronoun-position]
  - tutor: "«Ti voglio incontrare a Torino»: ma certo che è possibile! Hai un posto dove dormire?"
    recast: {text: "voglio ti incontrare", fix: "Ti voglio incontrare", tags: [pronoun-position]}
  # merlin-1395_0000630-7
  - learner: "È possibile di incontrarci?"
    errors: [preposition]
  - tutor: "Sì, ci incontriamo! Però «possibile di incontrarci»: dopo «è possibile», ci vuole «di»?"
    prompt: {text: "possibile di incontrarci", tags: [preposition]}
  - learner: "Ah, senza: è possibile incontrarci il 27? E posso dormire da te?"
  - tutor: "Giusto! Certo, il divano è grande. Dimmi a che ora arriva il treno."
    goals: [ask]
  # merlin-1395_0000630-8
  - learner: "Dai mi un telefono!"
    errors: [imperative-form]
  - tutor: "Va bene, ti chiamo! Ma «dai mi»: con «dai», il pronome si attacca al verbo. Come diventa?"
    prompt: {text: "Dai mi", tags: [imperative-form]}
  - learner: "Dammi un colpo di telefono, allora! Così ti dico l'orario."
  - tutor: "Esatto! Ti chiamo domani sera."

- scenario: famiglia
  level: A2
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono i miei genitori e il mio cane, Lex. Lui ha cinque anni."
  - tutor: "Lex è bellissimo! Ma è un cane bravo o un po' matto?"
    goals: [who, ages]
  # merlin-1395_0000451-5
  - learner: "Lex va alla scuola di cane."
    errors: [articulated-preposition, preposition]
  - tutor: "Una scuola per cani, che forte! Ma «alla scuola»: per dire che uno ci va a imparare, serve l'articolo?"
    prompt: {text: "alla scuola", tags: [articulated-preposition]}
  - learner: "Sì, Lex va alla scuola il martedì e il giovedì."
    errors: [articulated-preposition]
  - tutor: "Lex va a scuola due volte alla settimana? Allora è più bravo di me!"
    goals: [describe]
    recast: {text: "alla scuola", fix: "a scuola", tags: [articulated-preposition]}
  - learner: "E tu? Hai una famiglia grande?"
  - tutor: "Sì, ho tre fratelli. Vivono tutti a Bari, la mia città."
    goals: [ask]
  # merlin-1395_0000564-2
  - learner: "Io voglio andare nella tu città."
    errors: [possessive]
  - tutor: "Che bello! Però «nella tu città»: con «città», come diventa «tu»?"
    prompt: {text: "nella tu città", tags: [possessive]}
  - learner: "Nella tua città! Bari è sul mare, vero?"
  - tutor: "Esatto, sul mare! In estate ti porto io a vederla."

# Set s-recast-native, file 5: B1, job interviews, volunteering and a team meeting (real learner
# sentences corrected by a native speaker; recasts use the native fix of the learner's own span).

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [noun-number]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  # merlin-1325_1001077-1
  - learner: "Lavoravo in un Ufficcio come ragioniere, ed inoltre ero assistente all'Ufficcio di Viaggio."
  - tutor: "Ragioniere e assistente in un ufficio viaggi: un'esperienza interessante! Perché ha lasciato quel lavoro?"
    goals: [intro, experience]
  # merlin-1325_1001033-4
  - learner: "Non sono riuscito ad abituarmi alle condizione di lavoro e non ero soddisfatto del mio stipendio e mi sono dimesso."
    errors: [noun-number]
  - tutor: "Capisco. Ma «alle condizione»: con «alle», la parola è singolare o plurale?"
    prompt: {text: "alle condizione", tags: [noun-number]}
  - learner: "Sì, le condizione di lavoro erano difficili: troppe ore e niente pause."
    errors: [noun-number]
  - tutor: "Le condizioni di lavoro erano difficili, quindi: capisco. Quali sono i suoi punti forti?"
    recast: {text: "le condizione", fix: "le condizioni", tags: [noun-number]}
  # merlin-1325_1001120-5
  - learner: "Sono certo che potrò assistere il personale in uffiicio, perché sono paziente e accurato."
  - tutor: "La pazienza è molto utile da noi. E perché vuole lavorare proprio qui?"
    goals: [strengths]
  # merlin-1325_1001079-3
  - learner: "Il prossimo anno vorrei sviluppare le mie conoscenze sulla lingua italiana, perciò sarebbe bello se scegliessero proprio a me."
    errors: [preposition]
  - tutor: "Lo terrò presente! Ma «scegliessero proprio a me»: con «scegliere», la persona ha bisogno della «a»?"
    prompt: {text: "proprio a me", tags: [preposition]}
  - learner: "No: sarebbe bello se scegliessero proprio me. Posso fare una domanda?"
  - tutor: "Esatto. Certo, mi dica pure."
    goals: [why]
  # merlin-1325_1001167-9
  - learner: "E vorrei chiedere quanto salario potrebbe avere."
    errors: [conditional-form]
  - tutor: "È una domanda giusta. Ma «potrebbe avere»: chi lo riceve? Lei stesso, quindi...?"
    prompt: {text: "potrebbe avere", tags: [conditional-form]}
  - learner: "Sì, quanto salario potrebbe avere io, nel primo anno?"
    errors: [conditional-form]
  - tutor: "«Quanto salario potrei avere»: il primo anno sono ottocento euro al mese."
    goals: [questions]
    recast: {text: "potrebbe avere", fix: "potrei avere", tags: [conditional-form]}

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [subject-verb-agreement]
  turns:
  - tutor: "Buongiorno, si accomodi pure. Mi parli un po' di lei."
  # merlin-1325_9000213-0
  - learner: "Comincerà a studiare la geografia presso l'Università di Bologna in ottobre."
    errors: [subject-verb-agreement, article-use]
  - tutor: "Bene! Ma «comincerà»: così sembra che parli di un'altra persona. Chi comincia?"
    prompt: {text: "Comincerà", tags: [subject-verb-agreement]}
  - learner: "Io! Comincerò a studiare geografia a ottobre. Prima vorrei fare uno stage da voi, perché lavorate con l'estero."
  - tutor: "Esatto. Un motivo chiaro! E le lingue? Per noi sono molto importanti."
    goals: [intro, why]
  # merlin-1325_1001035-3
  - learner: "Poi all'università continuavo a sviluppare la mia conoscenza dell'inglese, quando mi sono messo a imparare anche l'italiano."
    errors: [tense-aspect]
  - tutor: "Interessante! Ma «continuavo»: parli di un periodo chiuso, con un inizio e una fine. Quale passato usiamo?"
    prompt: {text: "continuavo", tags: [tense-aspect]}
  - learner: "Sì, all'università continuavo a studiare l'inglese per tre anni."
    errors: [tense-aspect]
  - tutor: "«All'università ho continuato a studiare l'inglese per tre anni»: ottimo. Ha anche esperienza di lavoro?"
    recast: {text: "continuavo", fix: "ho continuato", tags: [tense-aspect]}
  # merlin-1325_1001055-0
  - learner: "Parlo adesso 3 lingue e ho studiato un'altra."
    errors: [ci-ne]
  - tutor: "Bravo! Ma «ho studiato un'altra»: per non ripetere «lingua», quale pronome mettiamo prima del verbo?"
    prompt: {text: "ho studiato un'altra", tags: [ci-ne]}
  - learner: "Sì, ho studiato un'altra al liceo, il francese. E ho lavorato un anno in un hotel a Valencia."
    errors: [ci-ne]
  - tutor: "«Ne ho studiata un'altra al liceo», il francese: bene. Un anno in hotel è utile. Qual è il suo punto forte?"
    goals: [experience]
    recast: {text: "ho studiato un'altra", fix: "ne ho studiata un'altra", tags: [ci-ne]}
  - learner: "Imparo in fretta. Il mio difetto è che sono un po' timido. Posso chiedere quante ore si lavora?"
  - tutor: "Otto ore al giorno, dalle nove alle cinque e mezza. Le faremo sapere entro venerdì."
    goals: [strengths, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  # merlin-1325_1001079-2
  - learner: "Parlo perfettamente in inglese e il tedesco."
    errors: [preposition]
  - tutor: "Ottimo! Ma «parlo in inglese e il tedesco»: per dire che conosce una lingua, si usa «in»?"
    prompt: {text: "in inglese", tags: [preposition]}
  - learner: "Parlo perfettamente l'inglese e il tedesco. Insegno lingue da dieci anni in una scuola privata."
  - tutor: "Esatto. Dieci anni a scuola: bene. Ha avuto anche esperienze difficili?"
    goals: [intro, experience]
  # merlin-1325_1001050-3
  - learner: "Non ho avuto niente male esperienza con le lingue."
    errors: [word-choice]
  - tutor: "Nessuna brutta esperienza con le lingue, quindi: mi fa piacere! E l'italiano dove l'ha imparato?"
    recast: {text: "niente male esperienza", fix: "nessuna brutta esperienza", tags: [word-choice]}
  # merlin-1325_1001057-5
  - learner: "Ho fatto molte amicizie a Reggio di Calabria e per questo sempre posso practicare la lingua e posso impararmi."
    errors: [reflexive, word-order, spelling]
  - tutor: "Che bello! Ma «posso impararmi»: quel «mi» alla fine del verbo serve?"
    prompt: {text: "posso impararmi", tags: [reflexive]}
  - learner: "Sì, così posso impararmi bene l'italiano, parlando ogni giorno."
    errors: [reflexive]
  - tutor: "«Posso imparare bene l'italiano»: certo, parlando ogni giorno. E perché vuole lavorare con noi?"
    recast: {text: "posso impararmi", fix: "posso imparare", tags: [reflexive]}
  # merlin-1365_0100079-0
  - learner: "Mà non solo la lingua italiana anche l'Italia come paese mi piace tanto."
  - tutor: "Un bel motivo. Qual è il suo punto forte, secondo lei?"
    goals: [why]
  - learner: "Sono paziente e organizzata. Il mio punto debole: parlo troppo! Quando comincia lo stage?"
  - tutor: "A marzo, per sei mesi. Le faremo sapere entro la fine del mese."
    goals: [strengths, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Mi chiamo David, ho ventisei anni e faccio l'interprete. Ho lavorato due anni in un'agenzia a Londra."
  - tutor: "Un interprete, interessante! Noi progettiamo tavoli e sedie con materiali usati: cosa potrebbe portare da noi?"
    goals: [intro, experience]
  # merlin-1325_9000684-3
  - learner: "Ritengo che le mie competenze da me acquiste possono essere utili per organizzare il recupero di materiale riciclabile anche all'estero in caso in cui l'interprete è necessario."
    errors: [subjunctive-use, past-participle-form, preposition]
  - tutor: "Molto interessante. Ma «ritengo che... possono»: dopo «ritengo che», quale modo del verbo usiamo?"
    prompt: {text: "possono essere utili", tags: [subjunctive-use]}
  - learner: "Sì, ritengo che le mie lingue possono essere utili con i clienti stranieri."
    errors: [subjunctive-use]
  - tutor: "«Ritengo che le mie lingue possano essere utili»: sono d'accordo. E il suo punto debole?"
    goals: [strengths]
    recast: {text: "possono essere utili", fix: "possano essere utili", tags: [subjunctive-use]}
  - learner: "Forse sono troppo preciso: controllo tutto due volte. Ma voglio lavorare qui perché lavorate con tanti paesi."
  - tutor: "Non è un grande problema! Infatti abbiamo clienti in tutta Europa. Con quali lingue lavora di più?"
    goals: [why]
  # merlin-1325_1001055-5
  - learner: "Tutti documenti, tutti software arrivano prima in inglese."
    errors: [article-use]
  - tutor: "Vero! Ma «Tutti documenti»: dopo «tutti», cosa mettiamo prima del nome?"
    prompt: {text: "Tutti documenti", tags: [article-use]}
  - learner: "Tutti i documenti arrivano prima in inglese, sì. Posso chiedere com'è il gruppo di lavoro?"
  - tutor: "Esatto. Siamo in otto, giovani e molto uniti. Le faremo sapere presto."
    goals: [questions]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  # merlin-1325_1001014-6
  - learner: "È un buon occassione per practicare le lingue e impiegare la responsabilità."
    errors: [noun-gender, spelling]
  - tutor: "Bene! Ma «un buon»: la parola che segue è femminile. Allora?"
    prompt: {text: "un buon occassione", tags: [noun-gender]}
  - learner: "Una buona occasione! E poi mi piace aiutare gli altri."
  - tutor: "Esatto! E cosa sai fare? Abbiamo tante attività."
    goals: [motivation]
  # merlin-1325_9000107-0
  - learner: "Sono una persona molto socievole e me piace il contatto con le persone."
    errors: [object-pronoun]
  - tutor: "Ottimo per noi! Ma «me piace»: con «piace», quale pronome usiamo?"
    prompt: {text: "me piace", tags: [object-pronoun]}
  - learner: "Sì, me piace tanto parlare con la gente."
    errors: [object-pronoun]
  - tutor: "«Mi piace tanto parlare con la gente»: allora il lavoro con le famiglie è perfetto per te! Quanto tempo hai?"
    goals: [skills]
    recast: {text: "me piace", fix: "mi piace", tags: [object-pronoun]}
  # merlin-1325_9000107-6
  - learner: "Come sono docente e lavoro in una scuola ho tempo libero nelle vacanze estive."
    errors: [word-choice]
  - tutor: "«Siccome sono docente», hai l'estate libera: perfetto! D'estate abbiamo un campo per bambini stranieri."
    goals: [time]
    new: [{lemma: siccome, gloss: since}]
    recast: {text: "Come sono docente", fix: "Siccome sono docente", tags: [word-choice]}
  # merlin-1325_1001023-4
  - learner: "Che cosa fará esattamente?"
  - tutor: "Il volontario aspetta le famiglie alla stazione, le aiuta con i documenti e organizza giochi per i bambini. Ti va?"
  - learner: "Sì, scelgo questa attività! Posso cominciare a luglio."
  - tutor: "Perfetto, ti scrivo la settimana prossima con tutti i dettagli."
    goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-traveller
  history: [future-form]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  # merlin-1325_9000137-0
  - learner: "Finiscerò la scuola quest'anno e comincerò studiare la legge internazionale."
    errors: [future-form, preposition, article-use]
  - tutor: "Bravo! Ma «finiscerò»: il futuro di «finire» è regolare. Come fa?"
    prompt: {text: "Finiscerò", tags: [future-form]}
  - learner: "Finirò la scuola a giugno. Poi vorrei aiutare in un progetto, prima dell'università."
  - tutor: "Esatto! Un'esperienza così ti aiuta anche negli studi. Cosa sai fare?"
    goals: [motivation]
  # merlin-1325_9000104-2
  - learner: "Dando che sono un informatico posso participare a recuperare dei pezzi ancora valide dei computere, questi vengono venduti dopo."
    errors: [adjective-agreement, word-choice, spelling]
  - tutor: "Utilissimo! Ma «pezzi ancora valide»: «pezzi» è maschile plurale. E l'aggettivo?"
    prompt: {text: "pezzi ancora valide", tags: [adjective-agreement]}
  - learner: "Sì, recupero i pezzi ancora valide e poi li vendiamo."
    errors: [adjective-agreement]
  - tutor: "I pezzi ancora validi si vendono e con i soldi aiutiamo le scuole: ottimo! Il campo dura dieci giorni, ad agosto."
    goals: [skills]
    new: [{lemma: valido, gloss: still usable}]
    recast: {text: "pezzi ancora valide", fix: "pezzi ancora validi", tags: [adjective-agreement]}
  # merlin-1325_9000296-6
  - learner: "In questi dieci giorni vedrò di venire all quinto giorno è resterò circa due giorni."
  - tutor: "Due giorni vanno benissimo. Allora scegli: laboratorio dei computer o cucina?"
    goals: [time]
  - learner: "Il laboratorio, naturalmente! Lì sono più utile."
  - tutor: "D'accordo, ti metto nel laboratorio. Ti aspettiamo il quinto giorno!"
    goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  # merlin-1325_9000304-1
  - learner: "Il vostro annuncio ho letto sul giornale e subito ho deciso a scrivevi."
    errors: [preposition, object-pronoun, spelling]
  - tutor: "Che bello! Ma «ho deciso a»: dopo «decidere», quale preposizione va prima dell'infinito?"
    prompt: {text: "deciso a", tags: [preposition]}
  - learner: "Ho deciso di scrivervi subito! Voglio fare qualcosa di utile per gli altri."
  - tutor: "Giusto! E cosa sai fare bene?"
    goals: [motivation]
  # merlin-1325_9000107-1
  - learner: "Sono de professione docente di lingue, e penso che potrebbe aiutare nel contatto con le altre persone."
    errors: [preposition, word-order]
  - tutor: "Una docente, utilissimo! Ma «de professione»: in italiano, quale preposizione usiamo?"
    prompt: {text: "de professione", tags: [preposition]}
  - learner: "Sì, de professione insegno inglese e spagnolo."
    errors: [preposition]
  - tutor: "«Di professione insegno inglese e spagnolo»: perfetto per i nostri corsi! Quanto tempo hai?"
    goals: [skills]
    recast: {text: "de professione", fix: "di professione", tags: [preposition]}
  # merlin-1325_1001023-2
  - learner: "Purtroppo non ho molto tempo libero, perchè devo studiare molto, perciò se c'è possibilità vorrei andare in agosto."
    errors: [article-use]
  - tutor: "Agosto va benissimo! Ma «se c'è possibilità»: davanti a «possibilità» non ci vuole un articolo?"
    prompt: {text: "c'è possibilità", tags: [article-use]}
  - learner: "Sì: se c'è la possibilità, vorrei venire in agosto."
  - tutor: "Esatto! Ad agosto c'è il corso d'italiano per le famiglie appena arrivate. Ti va?"
    goals: [time]
  - learner: "Sì, scelgo il corso d'italiano! Ho già in mente tante attività."
  - tutor: "Fantastico, le famiglie ne hanno davvero bisogno."
    goals: [choose]
  # merlin-1325_9000296-11
  - learner: "Spero che queste cose che ho in mente sarrano le cose giuste per dare un pezzeto di forza per svilluppare i paesi."
  - tutor: "Ne sono sicura. Ti mando il programma del corso entro venerdì."

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  # merlin-1365_0100117-2
  - learner: "La settimana scorsa hanno comminciato cinque nuove persone!"
  - tutor: "Ottimo, il gruppo cresce! E ci sono problemi?"
    goals: [update]
  - learner: "Sì: non abbiamo abbastanza computer per tutti. Due persone lavorano con il loro portatile."
  - tutor: "Questo non va bene, per la sicurezza dei dati. Hai una proposta?"
    goals: [problem]
  - learner: "Potremmo comprare cinque computer nuovi. Ho già chiesto un prezzo a un negozio qui vicino."
  - tutor: "Mi sembra una buona idea. Mi mandi il prezzo e il contatto del negozio?"
    goals: [proposal]
  # merlin-1365_0100070-7
  - learner: "Allora, ti mandrò anche il numero di telefono della nostra segretaria per organizare un incontro."
    errors: [future-form, spelling]
  - tutor: "Perfetto. Ma «mandrò»: nel futuro di «mandare» c'è una lettera in più. Quale?"
    prompt: {text: "mandrò", tags: [future-form]}
  - learner: "Sì, ti mandrò tutto oggi pomeriggio."
    errors: [future-form]
  - tutor: "«Ti manderò tutto oggi pomeriggio»: va bene. Allora decidiamo entro venerdì?"
    recast: {text: "ti mandrò", fix: "ti manderò", tags: [future-form]}
  - learner: "Sì, entro venerdì. Così lunedì i nuovi colleghi hanno il loro computer."
  - tutor: "Perfetto, grazie. Passiamo al prossimo punto."
    goals: [deadline]

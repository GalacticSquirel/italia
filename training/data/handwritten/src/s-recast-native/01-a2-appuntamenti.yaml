# Set s-recast-native, file 1: A2, a cancelled Thursday and a new date (real learner sentences
# corrected by a native speaker; every recast uses the native fix of the learner's own span).

- scenario: serata-cinema
  level: A2
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
  - tutor: "Allora, giovedì pomeriggio andiamo al cinema? Io sono libera."
  # merlin-1385_0001724-0
  - learner: "Non sto bene, è una settimana orribile."
  - tutor: "Oh, mi dispiace! Cosa succede?"
  # merlin-1385_0000098-2
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non posso incontro con te."
    errors: [modal-infinitive]
  - tutor: "Che peccato! Ma «non posso incontro»: dopo «posso», in che forma va il verbo?"
    prompt: {text: "non posso incontro", tags: [modal-infinitive]}
  - learner: "Sì, giovedì non posso incontro con te. Il mio capo ha una riunione."
    errors: [modal-infinitive]
  - tutor: "«Giovedì non posso incontrarmi con te»: va bene, ho capito. Il lavoro prima di tutto!"
    recast: {text: "non posso incontro", fix: "non posso incontrarmi", tags: [modal-infinitive]}
  # merlin-1385_0000098-3
  - learner: "Che ne dici di incontrare sabato sera?"
    errors: [reflexive]
  - tutor: "Sabato sera mi va bene! Però «di incontrare»: siamo in due, io e te. Come cambia il verbo?"
    prompt: {text: "di incontrare", tags: [reflexive]}
  - learner: "Che ne dici di incontrarci sabato sera? Possiamo andare al cinema."
  - tutor: "Esatto! Sì, al cinema. C'è un giallo alle otto e una commedia alle dieci. Cosa preferisci?"
    goals: [propose]
  - learner: "La commedia, perché i gialli mi fanno paura!"
  - tutor: "Allora la commedia delle dieci. Ci vediamo davanti al cinema o al bar di fronte?"
    goals: [genre, choose]
  - learner: "Al bar di fronte, alle nove e mezza. Così prendiamo un caffè."
  - tutor: "Perfetto, alle nove e mezza al bar. A sabato!"
    goals: [meet]

- scenario: serata-cinema
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Ciao! Giovedì pomeriggio facciamo qualcosa, vero?"
  # merlin-1385_0001766-1
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarti perché devo participare a una riunione del lavoro."
    errors: [articulated-preposition, spelling]
  - tutor: "Peccato! Ma «una riunione del lavoro»: qui ci vuole proprio l'articolo dopo la preposizione?"
    prompt: {text: "riunione del lavoro", tags: [articulated-preposition]}
  - learner: "Sì, è una riunione del lavoro con tutto l'ufficio. Finisce tardi."
    errors: [articulated-preposition]
  - tutor: "Ah, una riunione di lavoro che finisce tardi: capisco. Allora un altro giorno?"
    recast: {text: "riunione del lavoro", fix: "riunione di lavoro", tags: [articulated-preposition]}
  # merlin-1385_0001524-2
  - learner: "Che tu fai sabato sera?"
    errors: [question-form]
  - tutor: "Sabato sera? Aspetta: «Che tu fai». In una domanda, dove mettiamo «tu»?"
    prompt: {text: "Che tu fai", tags: [question-form]}
  - learner: "Che fai tu sabato sera? Io sono libero."
  - tutor: "Esatto! Sono libera anch'io. Prima mangiamo qualcosa? Conosco un ristorante tailandese."
    new: [{lemma: tailandese, gloss: Thai}]
  # merlin-1385_0001104-1
  - learner: "Certo, voglio andare al ristorante di tailandese con te!"
    errors: [preposition]
  - tutor: "Che bello! Ma «al ristorante di tailandese»: ci vuole quel «di»?"
    prompt: {text: "ristorante di tailandese", tags: [preposition]}
  - learner: "No, senza: al ristorante tailandese. E dopo andiamo al cinema?"
  - tutor: "Giusto! Dopo cena c'è un giallo alle dieci o una commedia alle dieci e mezza."
    goals: [propose]
  - learner: "Il giallo. Le commedie non mi piacciono tanto."
  - tutor: "D'accordo, alle dieci. Dove ci vediamo per la cena?"
    goals: [genre, choose]
  - learner: "Davanti al ristorante, alle otto."
  - tutor: "Va bene, alle otto davanti al ristorante. Ciao, a sabato!"
    goals: [meet]

- scenario: tempo-libero
  level: A2
  persona: en-m-heritage
  history: [article-use]
  turns:
  - tutor: "Allora, cosa fai di bello questa settimana? Giovedì pomeriggio vieni in piscina con noi?"
    new: [{lemma: piscina, gloss: swimming pool}]
  # merlin-1385_0001167-2
  - learner: "Il mio capo ha organizzato una riunione giovedi pomeriggio e c'è molto lavoro."
  - tutor: "Oh, una riunione! Allora nuotiamo insieme un altro giorno. Vai spesso a nuotare?"
  - learner: "Sì, nuoto due volte alla settimana, il martedì e il venerdì mattina."
  - tutor: "Bravo! Io invece corro al parco la domenica."
    goals: [hobby, frequency]
  # merlin-1385_0001724-3
  - learner: "Ma forse tu hai tempo prossimo sabato sera."
    errors: [article-use]
  - tutor: "Sabato sera, forse sì! Però «prossimo sabato sera»: con «prossimo», l'articolo ci vuole o no?"
    prompt: {text: "prossimo sabato sera", tags: [article-use]}
  - learner: "Sì, prossimo sabato sera sono libero. Andiamo a ballare?"
    errors: [article-use]
  - tutor: "Il prossimo sabato sera va benissimo: andiamo a ballare! Conosco un locale con musica molto bella."
    goals: [propose]
    recast: {text: "prossimo sabato sera", fix: "il prossimo sabato sera", tags: [article-use]}
  - learner: "Fantastico! E tu, cosa fai di solito il sabato?"
  - tutor: "Di solito vado al mercato e poi cucino per gli amici. Allora ci vediamo sabato alle dieci?"
    goals: [ask]
  - learner: "Sì, alle dieci. Porto anche mia sorella, se va bene."
  - tutor: "Certo, più siamo e meglio è! A sabato."

- scenario: compleanno
  level: A2
  persona: es-f-teacher
  history: [noun-number]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo una festa a sorpresa a casa mia, sabato sera?"
  - tutor: "Ottima idea, casa tua è grande! Chi invitiamo?"
    goals: [date]
  - learner: "I colleghi dell'ufficio e la sorella di Sara. Anche Marco, il suo amico."
  - tutor: "Benissimo, siamo in dodici. Giovedì pomeriggio andiamo insieme a comprare il regalo?"
    goals: [guests]
  # merlin-1385_0000095-1
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non posso."
  - tutor: "Ah, peccato. Allora il regalo lo compro io. E per mangiare? Cuciniamo noi?"
  # merlin-1385_0001760-2
  - learner: "Ma possiamo andare sabato sere in un ristorante tailandese, se vuoi"
    errors: [noun-number]
  - tutor: "Al ristorante, buona idea! Ma «sabato sere»: parli di un solo sabato, quindi singolare o plurale?"
    prompt: {text: "sabato sere", tags: [noun-number]}
  - learner: "Una sola: sabato sera! Sara adora la cucina tailandese. E dopo, la torta a casa mia."
  - tutor: "Esatto! Allora prima il ristorante e poi la torta da te. Cosa le regaliamo?"
    goals: [food]
  - learner: "Una borsa rossa. Sara ama il rosso."
  - tutor: "Bella idea! La compro io sabato mattina, in centro."
    goals: [gift]

- scenario: compleanno
  level: A2
  persona: en-f-student
  history: [reflexive]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara? Ne parliamo giovedì pomeriggio?"
  # merlin-1385_0001749-1
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non possiamo incontrarse con te."
    errors: [reflexive]
  - tutor: "Ah, tu e la tua collega? Ma «incontrarse»: con «noi», come finisce il verbo?"
    prompt: {text: "incontrarse", tags: [reflexive]}
  - learner: "Sì, io e Giulia. Giovedì non possiamo incontrarse con te, abbiamo una riunione."
    errors: [reflexive]
  - tutor: "«Giovedì non possiamo incontrarci con te»: va bene, allora parliamo adesso! Dove facciamo la festa?"
    recast: {text: "incontrarse", fix: "incontrarci", tags: [reflexive]}
  - learner: "Al ristorante vicino all'ufficio, sabato prossimo alle otto."
  - tutor: "Ottimo, sabato alle otto. E chi invitiamo?"
    goals: [date]
  - learner: "Tutta la classe di yoga, perché Sara va a yoga ogni settimana."
  - tutor: "Sono quindici persone, bene! Per la torta chiedo al ristorante?"
    goals: [guests]
  - learner: "Sì, una torta alla frutta. Sara non mangia il cioccolato."
  - tutor: "Giusto, alla frutta. E il regalo? Hai un'idea?"
    goals: [food]
  - learner: "Un tappetino nuovo per lo yoga! Il suo è vecchio."
  - tutor: "Che bella idea, lo prendo io domani."
    goals: [gift]
    new: [{lemma: tappetino, gloss: mat}]

- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Allora, giovedì sera andiamo al cinema?"
  # merlin-1385_0001189-1
  - learner: "In ufficio c'è molto lavoro e giovedi non posso andare a nostro appuntamento."
    errors: [articulated-preposition]
  - tutor: "Che peccato! Ma «a nostro appuntamento»: con «nostro», la preposizione «a» cambia?"
    prompt: {text: "a nostro appuntamento", tags: [articulated-preposition]}
  - learner: "Sì: non posso andare al nostro appuntamento. Mi dispiace tanto."
  - tutor: "Esatto. Tranquilla, capita! Facciamo un altro giorno?"
  # merlin-1385_0001136-2
  - learner: "Ho tempo la sabato sero per noi incontro."
    errors: [article-use, possessive, spelling]
  - tutor: "Sabato va bene! Ma «la sabato»: con i giorni della settimana, ci vuole «la»?"
    prompt: {text: "la sabato sero", tags: [article-use]}
  - learner: "No, senza: ho tempo sabato sera. Andiamo a vedere un film italiano?"
  - tutor: "Perfetto! C'è un film italiano nuovo alle otto e mezza. Ti piace il cinema italiano?"
    goals: [propose]
  - learner: "Sì, molto! Mi piacciono i film italiani più di quelli americani."
  - tutor: "Anche a me! Allora alle otto e mezza. Dove ci vediamo?"
    goals: [genre, choose]
  - learner: "Alla fermata dell'autobus vicino al cinema, alle otto."
  - tutor: "Va bene, alle otto alla fermata. Ciao!"
    goals: [meet]

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Sabato vado al mercato con mio marito e domenica leggo un libro in giardino."
  - tutor: "Che fine settimana tranquillo! Leggi spesso?"
    goals: [hobby]
  - learner: "Ogni sera, prima di dormire. E tu? Cosa fai nel tempo libero?"
  - tutor: "Io faccio teatro con un gruppo di amici, il giovedì pomeriggio. Vieni a vedere le prove questo giovedì?"
    goals: [frequency, ask]
  # merlin-1385_0001730-4
  - learner: "Devo partecipare à una riunione con il nostro capo."
  - tutor: "Ah, la riunione di giovedì, è vero! Allora quando vieni?"
  # merlin-1385_0001189-5
  - learner: "Hai anche molto di lavoro?"
    errors: [preposition]
  - tutor: "Sì, tantissimo! Ma «molto di lavoro»: dopo «molto», ci va «di»?"
    prompt: {text: "molto di lavoro", tags: [preposition]}
  - learner: "Ah no. Hai anche tu molto lavoro? Allora andiamo a teatro insieme sabato prossimo?"
  - tutor: "Giusto! Sì, sabato c'è lo spettacolo alle nove. Ti prendo un biglietto?"
    goals: [propose]
  - learner: "Sì, grazie! Due biglietti: uno per me e uno per mio marito."
  - tutor: "Benissimo, due biglietti. Ci vediamo sabato alle nove meno un quarto."

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [subject-verb-agreement]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa? Giovedì invece lavoro fino a tardi."
  # merlin-1385_0001773-1
  - learner: "In ufficio c'è molto lavoro e giovedi non posso vado al cinema."
    errors: [modal-infinitive]
  - tutor: "Ma io parlo di stasera! E «non posso vado»: dopo «posso», come va il verbo?"
    prompt: {text: "non posso vado", tags: [modal-infinitive]}
  - learner: "Sì, giovedì non posso vado. Ma stasera sì, sono libero!"
    errors: [modal-infinitive]
  - tutor: "«Giovedì non posso andare al cinema», ho capito. Ma stasera sì: perfetto! Che film ti va?"
    recast: {text: "non posso vado", fix: "non posso andare", tags: [modal-infinitive]}
  - learner: "Un film comico, per ridere un po'."
  - tutor: "C'è una commedia nuova alle nove. È più lunga delle altre, quasi tre ore!"
    goals: [propose, genre]
  - learner: "Va bene, la commedia delle nove. Prima mangiamo una pizza? Prenoto io."
  - tutor: "Ottima idea! Dove prenoti?"
    goals: [choose]
  - learner: "In pizzeria, vicino al cinema. Ci vediamo lì alle sette e mezza?"
  - tutor: "Va bene, alle sette e mezza in pizzeria. A stasera!"
    goals: [meet]

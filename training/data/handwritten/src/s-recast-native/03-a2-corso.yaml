# Set s-recast-native, file 3: A2, life on a language course in Italy, told to friends (real
# learner sentences corrected by a native speaker; recasts use the native fix of the learner's span).

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [article-use]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito, qui a Firenze?"
  - learner: "Mi alzo alle sette e alle otto e mezza comincia il corso d'italiano."
  - tutor: "Presto! E com'è la scuola? Ti piace l'insegnante?"
    goals: [wake, work]
  # merlin-1395_0001123-2
  - learner: "Mia insegnante è molto simpatica."
    errors: [article-use]
  - tutor: "Bene! Ma «Mia insegnante»: qui, davanti a «mia», l'articolo serve o no?"
    prompt: {text: "Mia insegnante", tags: [article-use]}
  - learner: "Sì, mia insegnante si chiama Laura ed è giovane."
    errors: [article-use]
  - tutor: "«La mia insegnante si chiama Laura»: che bel nome! E la sera, cosa fai dopo il corso?"
    recast: {text: "mia insegnante", fix: "La mia insegnante", tags: [article-use]}
  # merlin-1395_0001123-6
  - learner: "Nel mio tempo libero, io visito la città e faccio di sport."
    errors: [preposition]
  - tutor: "Brava! Ma «faccio di sport»: con «fare sport», ci vuole quel «di»?"
    prompt: {text: "faccio di sport", tags: [preposition]}
  - learner: "No: faccio sport. Corro lungo l'Arno. E tu, cosa fai la sera?"
  - tutor: "Esatto! Io la sera cucino. Stasera faccio la pasta: mangi con me?"
    goals: [evening, ask]

- scenario: tempo-libero
  level: A2
  persona: es-m-worker
  history: [noun-number]
  turns:
  - tutor: "Allora, cosa fai di bello nel tempo libero?"
  - learner: "Il martedì e il giovedì sera faccio un corso d'italiano in centro."
  - tutor: "Un corso, bravo! E com'è la classe?"
    goals: [hobby, frequency]
  # merlin-1395_0000575-2
  - learner: "Nel corso ci sono dieci altri studenti che vieni de tutta l'Europa per imparare l'Italiano."
    errors: [subject-verb-agreement, word-order, preposition]
  - tutor: "Che bello, tutta l'Europa! Ma «studenti che vieni»: chi viene? Loro, tanti. Quindi?"
    prompt: {text: "studenti che vieni", tags: [subject-verb-agreement]}
  - learner: "Sì, dieci studenti che vieni dalla Francia, dalla Polonia, dalla Grecia..."
    errors: [subject-verb-agreement]
  - tutor: "Dieci studenti che vengono da tanti paesi: che bella classe! E l'insegnante ti piace?"
    recast: {text: "studenti che vieni", fix: "studenti che vengono", tags: [subject-verb-agreement]}
  # merlin-1395_0000470-2
  - learner: "Mi piace perche C'é sempre molto gentile."
    errors: [ce-ci-sono]
  - tutor: "Bene! Ma «c'è sempre molto gentile»: parli di com'è lei. Ci vuole «c'è»?"
    prompt: {text: "C'é sempre molto gentile", tags: [ce-ci-sono]}
  - learner: "No: è sempre molto gentile. E tu, fai qualcosa la sera?"
  - tutor: "Esatto! Io canto, il mercoledì sera. Sabato canto in chiesa: vieni?"
    goals: [ask]
  - learner: "Vengo volentieri! E dopo andiamo a mangiare una pizza insieme?"
  - tutor: "Ottima idea! Allora sabato alle sei davanti alla chiesa."
    goals: [propose]

- scenario: casa-mia
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
  - tutor: "Allora, com'è la tua casa qui a Siena?"
  - learner: "Abito con una famiglia italiana, in un appartamento grande con quattro camere. La mia stanza preferita è la cucina, perché lì parliamo sempre."
  - tutor: "In cucina si impara tanto! E com'è la vita con loro?"
    goals: [type, rooms, favourite]
  # merlin-1395_0000646-3
  - learner: "È sempre molto divertimento."
    errors: [ce-ci-sono]
  - tutor: "Bello! Ma «È sempre molto divertimento»: vuoi dire che il divertimento si trova lì, in casa. Allora?"
    prompt: {text: "È sempre molto divertimento", tags: [ce-ci-sono]}
  - learner: "C'è sempre molto divertimento! I bambini giocano e parlano tanto."
  - tutor: "Esatto! Così impari in fretta. E fuori casa, cosa fai?"
  # merlin-1395_0001150-2
  - learner: "Quando non c'é lezione passo il tempo in modo attivo; faccio i passegiate e trovo i miei nuovi amici italiano."
    errors: [adjective-agreement, article-form, spelling]
  - tutor: "Brava! Ma «i miei nuovi amici italiano»: gli amici sono tanti. E «italiano»?"
    prompt: {text: "amici italiano", tags: [adjective-agreement]}
  - learner: "Sì, amici italiano dell'università. Usciamo il venerdì sera."
    errors: [adjective-agreement]
  - tutor: "Che bello avere amici italiani dell'università! Ma non mi chiedi niente della mia casa?"
    recast: {text: "amici italiano", fix: "amici italiani", tags: [adjective-agreement]}
  - learner: "Hai ragione! E la tua casa com'è?"
  - tutor: "Piccola, in centro a Roma, ma con tanta luce. Vieni a trovarmi!"
    goals: [ask]

- scenario: weekend-scorso
  level: A2
  persona: en-f-professional
  history: [tense-aspect, preposition]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Sabato sono andata a Ostia con le compagne del corso d'italiano. Abbiamo fatto il bagno."
  - tutor: "A Ostia, al mare! Ti è piaciuto?"
    goals: [where, what, with-who]
  # merlin-1395_0000404-5
  - learner: "Era veramento un bel giorno."
    errors: [tense-aspect, spelling]
  - tutor: "Che bello! Ma «era»: parli di sabato, una giornata finita. Quale passato usi?"
    prompt: {text: "Era veramento un bel giorno", tags: [tense-aspect]}
  - learner: "Sì, era veramente un bel giorno, con tanto sole."
    errors: [tense-aspect]
  - tutor: "È stato veramente un bel giorno, allora! E durante la settimana, com'è il corso?"
    recast: {text: "era veramente un bel giorno", fix: "È stato veramente un bel giorno", tags: [tense-aspect]}
  # merlin-1395_0000447-4
  - learner: "Di solito facciamo tre, quatro ore di corso, in seguito andiamo visitare città."
    errors: [preposition, article-use]
  - tutor: "Tante ore! Ma «andiamo visitare»: dopo «andare», prima di un altro verbo, cosa mettiamo?"
    prompt: {text: "andiamo visitare", tags: [preposition]}
  - learner: "Andiamo a visitare la città! E tu, cosa hai fatto nel fine settimana?"
  - tutor: "Esatto! Io sono rimasta a casa e ho dormito tanto!"
    goals: [opinion]

- scenario: famiglia
  level: A2
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono i miei compagni del corso d'italiano, qui a Perugia."
  - tutor: "Ah, la tua classe! Siete in tanti?"
    goals: [who]
  # merlin-1395_0001123-3
  - learner: "A nostro corso, noi siamo dei studenti diversi."
    errors: [articulated-preposition, article-form]
  - tutor: "Siete in tanti! Ma «A nostro corso»: per dire dove, quale preposizione usiamo con «corso»?"
    prompt: {text: "A nostro corso", tags: [articulated-preposition]}
  - learner: "A nostro corso siamo dodici, di sei paesi."
    errors: [articulated-preposition]
  - tutor: "«Nel nostro corso siamo dodici»: una bella classe! E la signora a sinistra chi è?"
    recast: {text: "A nostro corso", fix: "Nel nostro corso", tags: [articulated-preposition]}
  # merlin-1395_0000606-0
  - learner: "La mia insegnante è una segnora molta simpatica qui si chiama Maria."
    errors: [adjective-agreement, relative-pronoun, spelling]
  - tutor: "Ah, l'insegnante! Ma «molta simpatica»: qui la parola dice quanto è simpatica. Cambia o no?"
    prompt: {text: "molta simpatica", tags: [adjective-agreement]}
  # merlin-1395_0001080-2
  - learner: "Lei è molto competenta è simpatica."
    errors: [adjective-agreement]
  - tutor: "«Lei è molto competente e simpatica»: allora siete fortunati! Quanti anni ha?"
    goals: [describe]
    new: [{lemma: competente, gloss: competent}]
    recast: {text: "competenta", fix: "competente", tags: [adjective-agreement]}
  - learner: "Cinquant'anni, credo. E tu, hai fratelli o sorelle?"
  - tutor: "Ho una sorella, Giulia: ha ventotto anni e vive a Londra."
    goals: [ages, ask]

- scenario: giorno-tipico
  level: A2
  persona: es-f-teacher
  history: [noun-number]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Tu sei qui per il corso, vero?"
  # merlin-1395_0000447-0
  - learner: "Stiamo seguendo un corso di letteratura è ogni giorno stiamo imparando le nuove cose."
    errors: [article-use]
  - tutor: "Letteratura, che bello! Ma «imparando le nuove cose»: parli di cose in generale. L'articolo serve?"
    prompt: {text: "le nuove cose", tags: [article-use]}
  - learner: "No: stiamo imparando nuove cose. Mi sveglio alle sette per studiare e la mattina ho lezione dalle nove all'una."
  - tutor: "Esatto! Brava, alle sette! E dopo la lezione cosa fate?"
    goals: [wake, work]
  # merlin-1395_0000610-1
  - learner: "Cuando abbiamo tempo o alla sera, visitiamo la città, e mangiamo in ristorante tipici."
    errors: [noun-number, spelling]
  - tutor: "Bello! Ma «in ristorante tipici»: «tipici» è plurale. E l'altra parola?"
    prompt: {text: "ristorante tipici", tags: [noun-number]}
  - learner: "Sì, mangiamo in ristorante tipici, con la pasta fatta a mano."
    errors: [noun-number]
  - tutor: "Mangiate in ristoranti tipici con la pasta fatta a mano: che fortuna! E la sera cosa fate?"
    goals: [evening]
    recast: {text: "ristorante tipici", fix: "ristoranti tipici", tags: [noun-number]}
  # merlin-1395_0001124-2
  - learner: "Nel mio tempo libero vado spesso in pizzeria oppure facciamo una spassegiata."
  - tutor: "Che bello! Io invece la sera vado a correre."

- scenario: casa-mia
  level: A2
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Allora, com'è la tua casa? Io e Sofia vogliamo sapere tutto!"
  - learner: "Abito in una casa per studenti vicino alla scuola: una camera e un piccolo bagno. La mia stanza preferita è la cucina, perché è grande."
  - tutor: "Bene! E la scuola com'è? Cosa fate dopo le lezioni?"
    goals: [type, rooms, favourite]
  # merlin-1395_0000609-3
  - learner: "Dopo il corso, visitiamo la grande città di Roma, i musei, le chiese."
  - tutor: "Che bello, Roma! E l'italiano? Lo parli già bene?"
  # merlin-1395_0000404-1
  - learner: "Mi piacerebbe di sapere già tutto."
    errors: [preposition]
  - tutor: "Anche a me! Ma «mi piacerebbe di sapere»: dopo «piacerebbe», ci va «di»?"
    prompt: {text: "piacerebbe di sapere", tags: [preposition]}
  - learner: "Sì, mi piacerebbe di sapere parlare come voi!"
    errors: [preposition]
  - tutor: "«Mi piacerebbe sapere parlare come voi»: ma parli già bene! E alla fine del corso ci dici com'è andata, vero?"
    recast: {text: "piacerebbe di sapere", fix: "piacerebbe sapere", tags: [preposition]}
  # merlin-1395_0000612-4
  - learner: "Vi lo dirò."
    errors: [combined-pronouns]
  - tutor: "Promesso? Ma «vi lo»: quando «vi» va prima di «lo», cambia una lettera. Quale?"
    prompt: {text: "Vi lo dirò", tags: [combined-pronouns]}
  - learner: "Ve lo dirò! Il corso finisce venerdì. E la vostra casa com'è?"
  - tutor: "Esatto! La nostra è piccola, ma piena di fiori. Buona fortuna per venerdì!"
    goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Il sabato mattina faccio un corso d'italiano per stranieri."
  - tutor: "Bravo! E com'è? Ti piace?"
    goals: [hobby, frequency]
  # merlin-1395_0001080-3
  - learner: "Le lezione sono interessante perché l'insegnante parla non solo della grammatica ma anché della cultura italiana."
    errors: [noun-number, adjective-agreement, spelling]
  - tutor: "Che bello! Ma «Le lezione»: con «le», la parola è plurale. Come finisce?"
    prompt: {text: "Le lezione", tags: [noun-number]}
  - learner: "Sì, le lezione sono belle e l'insegnante è bravissima."
    errors: [noun-number]
  - tutor: "Le lezioni sono belle e l'insegnante è bravissima: perfetto! Come si chiama?"
    recast: {text: "le lezione", fix: "Le lezioni", tags: [noun-number]}
  # merlin-1395_0000575-1
  - learner: "La nostra insegnante si chiama Paola e è molto simpatica."
  - tutor: "Paola, che bel nome. Io invece il sabato vado in bicicletta al parco."
  - learner: "Che bello! Ci vai spesso? Andiamo insieme sabato prossimo, dopo il corso?"
  - tutor: "Ogni sabato pomeriggio! Va bene, ti aspetto alle due davanti alla scuola."
    goals: [ask, propose]

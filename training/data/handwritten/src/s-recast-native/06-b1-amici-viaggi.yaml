# Set s-recast-native, file 6: B1, friends, work from home, trips, a party and two weddings (real
# learner sentences corrected by a native speaker; recasts use the native fix of the learner's span).

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio? Io sono sempre a casa, davanti al computer."
  - learner: "Io vado in ufficio quasi tutti i giorni, ma il venerdì lavoro da casa."
  - tutor: "Che fortuna! Io invece non vedo nessuno: passo tutta la sera su internet."
    goals: [situation]
  # merlin-1325_1001045-10
  - learner: "Secondo me l'internet sia una cosa sana, ma soltanto se non esageriamo."
    errors: [subjunctive-use, article-use]
  - tutor: "Lo spero! Ma «secondo me... sia»: dopo «secondo me», serve davvero il congiuntivo?"
    prompt: {text: "sia una cosa sana", tags: [subjunctive-use]}
  - learner: "Sì, secondo me sia una cosa sana, se la usi poco."
    errors: [subjunctive-use]
  - tutor: "«Secondo me è una cosa sana», d'accordo, ma io la uso troppo! Tu che vantaggi vedi nel lavoro da casa?"
    recast: {text: "sia una cosa sana", fix: "è una cosa sana", tags: [subjunctive-use]}
  - learner: "Non perdi tempo in macchina e puoi lavorare in pigiama!"
  - tutor: "Vero, un'ora al giorno risparmiata! E gli svantaggi, secondo te?"
    goals: [pros]
  # merlin-1325_9000323-3
  - learner: "Secondo me è importante fare le amicizie fuori dell'Internet, sono più vere."
    errors: [article-use, preposition]
  - tutor: "Hai ragione. Ma «fuori dell'Internet»: con «Internet», in italiano usiamo l'articolo?"
    goals: [cons]
    prompt: {text: "dell'Internet", tags: [article-use]}
  # merlin-1325_1001045-9
  - learner: "Usa l'internet non più di due ore al giorno."
    errors: [article-use]
  - tutor: "«Usa internet non più di due ore al giorno»: va bene, ci provo! E poi cosa faccio la sera?"
    recast: {text: "Usa l'internet", fix: "Usa internet", tags: [article-use]}
  # merlin-1325_1001039-7
  - learner: "Insomma, penso che sia meglio sfruttare il tuo tempo libero e fare cose più utili, per esempio, incontrare con gli amici nel bar, fare baldorie insieme, e non stare a casa davanti al computer ogni giorno."
    errors: [preposition, articulated-preposition]
  - tutor: "Saggia! Ma «incontrare con gli amici»: il verbo «incontrare» vuole quel «con»?"
    prompt: {text: "incontrare con gli amici", tags: [preposition]}
  - learner: "No: incontrare gli amici al bar. Io preferisco l'ufficio proprio per questo: lì vedo i colleghi ogni giorno."
  - tutor: "Esatto. Hai ragione: domani chiamo due amici e andiamo al bar!"
    goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [verb-form]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "In ufficio, in una ditta di software. Il lunedì lavoro da casa: è più comodo, ma mi sento un po' sola."
  - tutor: "Ti capisco. Io invece ho perso il lavoro il mese scorso: l'azienda ha chiuso."
    goals: [situation, pros, cons]
  # merlin-1365_0100117-1
  - learner: "Inoltre la mia ditta divente sempre più grande."
    errors: [verb-form]
  - tutor: "Davvero? Ma «divente»: controlla bene la terza persona. Con «la ditta», come fa?"
    prompt: {text: "divente", tags: [verb-form]}
  - learner: "Sì, la ditta divente grande: adesso siamo in cinquanta."
    errors: [verb-form]
  - tutor: "La tua ditta diventa sempre più grande, allora! Cercate persone?"
    recast: {text: "divente", fix: "diventa", tags: [verb-form]}
  # merlin-1365_0100117-4
  - learner: "Sono sicura che stanno cercando ancora più persone con ottima qualificazioni."
    errors: [adjective-agreement]
  - tutor: "Interessante! Ma «ottima qualificazioni»: il nome è plurale. E l'aggettivo?"
    prompt: {text: "ottima qualificazioni", tags: [adjective-agreement]}
  - learner: "Ottime qualificazioni, sì. Ma tu sei bravissimo con i computer!"
  - tutor: "Esatto. Beh, me la cavo! Mi aiuti a entrare?"
  # merlin-1365_0100269-4
  - learner: "Mandarmi il tuo curriculum."
    errors: [imperative-form]
  - tutor: "Subito! Ma «mandarmi» è un infinito: per chiedere qualcosa a un amico, quale forma usi?"
    prompt: {text: "Mandarmi", tags: [imperative-form]}
  - learner: "Mandami il curriculum stasera! E sai, da noi puoi lavorare anche da casa due giorni. Io però preferisco l'ufficio."
  - tutor: "Esatto, te lo mando stasera. Io invece preferirei proprio due giorni a casa!"
    goals: [preference]

- scenario: consigli-viaggio
  level: B1
  persona: es-f-erasmus
  history: [article-form]
  turns:
  - tutor: "Allora, quando parti per Napoli?"
  - learner: "Parto il 3 maggio e resto una settimana. Vorrei vedere il centro storico e Pompei."
  - tutor: "Che bello! E dove dormi?"
    goals: [plans]
  # merlin-1395_0001132-2
  - learner: "Vedendo i prezzi dei alberghi mi chiedevo se mi ospitate, sempre se non disturbo, giusto per qualche giorno"
    errors: [article-form]
  - tutor: "Ma certo che puoi stare da noi! Però «dei alberghi»: davanti a «alberghi», quale forma prende l'articolo?"
    prompt: {text: "dei alberghi", tags: [article-form]}
  - learner: "Grazie mille! I prezzi dei alberghi a maggio sono altissimi."
    errors: [article-form]
  - tutor: "I prezzi degli alberghi a maggio sono davvero alti, hai ragione. Da noi c'è il divano letto!"
    recast: {text: "dei alberghi", fix: "degli alberghi", tags: [article-form]}
  # merlin-1395_0001132-4
  - learner: "Come ci arrivo a casa tua?"
  - tutor: "Dalla stazione prendi la metro, linea 1, e scendi a Piazza Vanvitelli: dieci minuti."
    goals: [transport]
  # merlin-1395_0001119-9
  - learner: "Mi piacerebbe andare in teatro e ti invitero cenare in un ristorante Piemontese."
    errors: [preposition, spelling]
  - tutor: "Che gentile! Ma «andare in teatro»: con «teatro», quale preposizione usiamo?"
    prompt: {text: "andare in teatro", tags: [preposition]}
  - learner: "Andare a teatro! C'è uno spettacolo bello in quei giorni? E cosa devo mangiare assolutamente?"
  - tutor: "Esatto! Al San Carlo c'è sempre qualcosa di bello. E devi provare la pizza: qui è la migliore!"
    goals: [advice]
  - learner: "Perfetto. E c'è qualcosa da evitare?"
  - tutor: "Non lasciare il telefono sul tavolo nei bar pieni di gente, e non prendere la macchina in centro!"
    goals: [warnings]

- scenario: consigli-viaggio
  level: B1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
  - tutor: "Allora, quando parti per Napoli? Il matrimonio è il 21 novembre, ricordi?"
  # merlin-1365_0100012-0
  - learner: "Vendrei con la mia ragazza, Anna e arriverei il 20 novembre verso le 16 ore a Napoli con la mia macchina."
    errors: [conditional-form, word-order]
  - tutor: "Che bello, venite insieme! Ma «vendrei» sembra il verbo «vendere». Il condizionale di «venire» come fa?"
    goals: [plans]
    prompt: {text: "Vendrei", tags: [conditional-form]}
  - learner: "Sì, vendrei con Anna in macchina, perché il treno costa tanto."
    errors: [conditional-form]
  - tutor: "«Verrei con Anna in macchina»: va bene, ma attenzione al traffico di Napoli!"
    recast: {text: "vendrei", fix: "Verrei", tags: [conditional-form]}
  # merlin-1365_0100012-1
  - learner: "Vi telefonerei sta settimana per sapere se ci sono alberghi vicino al ristorante per prenotare una camera e anche che cosa posso vi regalare."
    errors: [pronoun-position]
  - tutor: "Certo, chiamaci! Ma «posso vi regalare»: con «posso», dove mettiamo «vi»?"
    prompt: {text: "posso vi regalare", tags: [pronoun-position]}
  - learner: "Che cosa vi posso regalare? E dall'albergo al ristorante come ci arriviamo?"
  - tutor: "Esatto! Per il regalo c'è una lista in un negozio di Via Toledo. Dall'albergo al ristorante sono dieci minuti a piedi: non prendete la macchina, parcheggiare è impossibile!"
    goals: [transport, warnings]
  # merlin-1365_0100256-4
  - learner: "Mi piacere di rivederti, e Stefano... è molto tempo fa che sono stata a Napoli."
    errors: [verb-form, preposition]
  - tutor: "Anche a noi! Ma «mi piacere»: «piacere» è all'infinito. Qui che forma serve?"
    prompt: {text: "Mi piacere", tags: [verb-form]}
  - learner: "Mi piace rivederti! Sono passati dieci anni: cosa devo vedere in città?"
  - tutor: "Esatto! Devi vedere il Museo Archeologico e mangiare un dolce al bar in piazza."
    goals: [advice]

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0000551-1
  - learner: "Ieri, sono ritornata di un viaggio fantastico!"
    errors: [preposition]
  - tutor: "Che bello! Ma «ritornata di un viaggio»: per dire da dove torni, quale preposizione usi?"
    prompt: {text: "ritornata di un viaggio", tags: [preposition]}
  - learner: "Sì, sono ritornata di un viaggio in montagna, in Trentino."
    errors: [preposition]
  - tutor: "«Sono ritornata da un viaggio in montagna»: che bello! Quanto tempo sei stata via?"
    goals: [where]
    recast: {text: "ritornata di un viaggio", fix: "ritornata da un viaggio", tags: [preposition]}
  # merlin-1395_0000388-3
  - learner: "Avevo tre settimane libero."
    errors: [tense-aspect, adjective-agreement]
  - tutor: "Tre settimane, che fortuna! Ma «avevo»: parli di un periodo finito e chiuso. Quale passato usiamo?"
    prompt: {text: "Avevo tre settimane", tags: [tense-aspect]}
  - learner: "Ho avuto tre settimane libere! Siamo andati a sciare con mio fratello."
  - tutor: "Esatto! E com'era il tempo? C'era neve?"
  # merlin-1395_0001070-6
  - learner: "Faceva bel tempo, però non c'era troppo neve."
    errors: [adjective-agreement]
  - tutor: "Peccato! Ma «troppo neve»: «neve» è femminile. E «troppo»?"
    prompt: {text: "troppo neve", tags: [adjective-agreement]}
  - learner: "Sì, troppo neve no, ma abbastanza per sciare."
    errors: [adjective-agreement]
  - tutor: "Non c'era troppa neve, ma abbastanza per sciare: meno male! E la sera cosa facevate?"
    goals: [weather]
    recast: {text: "troppo neve", fix: "troppa neve", tags: [adjective-agreement]}
  - learner: "Giocavamo a carte nel rifugio. La cosa più bella? Ho rivisto un vecchio amico di scuola."
  - tutor: "Che sorpresa! Da quanto tempo non lo vedevi?"
    goals: [activities, best]
  # merlin-1395_0000369-0
  - learner: "Da due anni non ci siamo più visti."
    errors: [preposition]
  - tutor: "Due anni! Ma con «da due anni» sembra che ancora non vi vedete, e invece vi siete visti in vacanza. Che preposizione usi?"
    prompt: {text: "Da due anni", tags: [preposition]}
  - learner: "Ah, giusto: per due anni non ci siamo visti, e poi ci siamo incontrati sulla neve!"
  - tutor: "Esatto! Allora è stata una vacanza davvero speciale."

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [article-use]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  # merlin-1395_0000376-6
  - learner: "Vorrei fare una festa il sabato prossimo."
    errors: [article-use]
  - tutor: "Bella idea! Ma «il sabato prossimo»: con «il» sembra «ogni sabato». Per un sabato solo, ci vuole?"
    prompt: {text: "il sabato prossimo", tags: [article-use]}
  # merlin-1395_0000369-6
  - learner: "Per me andrebbe bene il lunedi prossimo, cioè lundi di pasqua."
    errors: [article-use, spelling]
  - tutor: "«Per me andrebbe bene lunedì prossimo», a Pasquetta: perfetto, è proprio il giorno del suo compleanno! Facciamo una festa al parco?"
    goals: [date]
    recast: {text: "il lunedi prossimo", fix: "lunedì prossimo", tags: [article-use]}
  - learner: "Sì, al parco! Invitiamo gli amici dell'università e sua sorella."
  - tutor: "Siamo in quindici, allora. Chi porta da mangiare?"
    goals: [guests]
  - learner: "Io porto le lasagne e una torta al limone. Tu porti le bevande?"
  - tutor: "Va bene, le bevande le porto io. E il regalo? Hai qualche idea?"
    goals: [food]
  # merlin-1365_0100203-7
  - learner: "Non vorrei regalare qualcosa inutile."
    errors: [preposition]
  - tutor: "Giusto! Ma «qualcosa inutile»: tra «qualcosa» e l'aggettivo, cosa ci va?"
    prompt: {text: "qualcosa inutile", tags: [preposition]}
  - learner: "Sì, qualcosa inutile no. Forse un corso di fotografia?"
    errors: [preposition]
  - tutor: "Esatto, qualcosa di inutile non serve a nessuno. Un corso di fotografia è perfetto: Sara adora fare foto!"
    goals: [gift]
    recast: {text: "qualcosa inutile", fix: "qualcosa di inutile", tags: [preposition]}
  - learner: "Allora lo prenoto io domani."
  - tutor: "Perfetto, e dividiamo la spesa tra tutti."

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
  - tutor: "Da noi a Natale si mangia tantissimo! E quest'anno c'è anche il mio matrimonio, il 28 dicembre. Hai letto il mio messaggio?"
  # merlin-1365_0100199-0
  - learner: "Ero veramente felice di sentire questa novità meravigliosa!"
    errors: [tense-aspect]
  - tutor: "Grazie! Ma «ero felice»: parli di un momento preciso, quando hai letto il messaggio. Quale passato usi?"
    prompt: {text: "Ero veramente felice", tags: [tense-aspect]}
  - learner: "Sì, ero veramente felice quando ho letto il messaggio!"
    errors: [tense-aspect]
  - tutor: "«Sono stata veramente felice»: che carina! E da voi, in Spagna, come si festeggia il Natale?"
    recast: {text: "ero veramente felice", fix: "Sono stata veramente felice", tags: [tense-aspect]}
  - learner: "Da noi la festa grande è il 6 gennaio, con i Re Magi. Da piccola scrivevo sempre una lettera ai Re."
  - tutor: "Come la nostra Befana! Per il matrimonio, invece, ci sposiamo in una piccola chiesa in montagna."
    goals: [compare, past]
  # merlin-1365_0100203-2
  - learner: "Arrivo con piacere alla ceremonia."
    errors: [spelling]
  - tutor: "Che bello! Solo una cosa: «ceremonia» non si scrive così. Come si scrive?"
    prompt: {text: "ceremonia", tags: [spelling]}
  - learner: "Ah, sì: alla cerimonia! Ci sarò sicuramente."
  - tutor: "Esatto! Dopo la chiesa pranziamo tutti insieme in montagna."
  # merlin-1365_0100187-4
  - learner: "Avete un desidero certo oppure una idea?"
    errors: [word-choice]
  - tutor: "Un desiderio? Sì: un viaggio in Islanda! Con gli amici mettiamo insieme i soldi."
    recast: {text: "desidero", fix: "desiderio", tags: [word-choice]}
  # merlin-1365_0100279-6
  - learner: "Questo sarebbe una parte di mio regalo."
    errors: [articulated-preposition]
  - tutor: "Che gentile! Ma «di mio regalo»: davanti a «mio regalo», la preposizione «di» cambia?"
    prompt: {text: "di mio regalo", tags: [articulated-preposition]}
  - learner: "Del mio regalo! E per il pranzo di Natale cosa posso portare? Il panettone si mangia solo a Natale?"
  - tutor: "Esatto! Porta un dolce spagnolo. Il panettone sì, si mangia soprattutto a Natale."
    goals: [ask, plan]

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [conditional-form]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio? Io ho una notizia: a ottobre mi sposo con Chiara, il 20, a Lucca!"
  # merlin-1365_0100021-0

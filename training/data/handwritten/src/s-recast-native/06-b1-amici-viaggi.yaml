    prompt: {text: "porrei venire", tags: [conditional-form]}
  - learner: "Sì, non porrei venire, mi dispiace tanto."
    errors: [conditional-form]
  - tutor: "«Non posso venire», capisco: il lavoro nuovo è importante. Ma cos'è questo Club Ulivi?"
    recast: {text: "non porrei venire", fix: "non posso venire", tags: [conditional-form]}
  - learner: "È un villaggio turistico al mare: faccio l'animatore. Lavoro sempre all'aperto, mai da casa! Il vantaggio è il mare, lo svantaggio è che lavoro anche la domenica."
  - tutor: "Eh, la domenica è dura. Io da casa lavoro meglio, ma a volte mi sento solo."
    goals: [situation, pros, cons]
  # merlin-1365_0100279-2
  - learner: "Anche se non sarò stato lì, vorrei mandare a voi qualche bella cosa, ma non so che potrei regalarvi."
    errors: [future-form]
  - tutor: "Che pensiero carino! Ma «non sarò stato lì»: il giorno del matrimonio non ci sei, e basta. Serve quel «stato»?"
    prompt: {text: "non sarò stato lì", tags: [future-form]}
  - learner: "No: anche se non sarò lì, vi mando un regalo. Avete una lista di nozze?"
  - tutor: "Esatto! Sì, in un negozio di Lucca. E tu, alla fine, preferisci il villaggio o un ufficio?"
  - learner: "Il villaggio, sicuro! Non potrei mai stare tutto il giorno in un ufficio."
  - tutor: "Ti capisco! Ti mando le foto del matrimonio, promesso."

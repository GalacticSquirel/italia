# Set s-recast-native, file 4: A2, helping a friend who is looking for work, and getting back in
# touch with friends (real learner sentences corrected by a native speaker; recasts use the
# native fix of the learner's own span).

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [verb-form]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? La mia adesso è strana: non lavoro più e cerco un posto nuovo."
  # merlin-1385_0001172-1
  - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in piu."
  - tutor: "Grazie, sei gentile! Chiedi pure."
  # merlin-1385_0000022-2
  - learner: "Mi puoi spiegare che lavoro cerci?"
    errors: [verb-form]
  - tutor: "Certo! Ma «cerci»: senti il suono? Con «tu», il verbo «cercare» come fa?"
    prompt: {text: "cerci", tags: [verb-form]}
  - learner: "Sì, che lavoro cerci? In un negozio, in un ufficio...?"
    errors: [verb-form]
  - tutor: "«Che lavoro cerchi?» Un lavoro in un ristorante, in cucina. Ho già lavorato tre anni in un bar."
    recast: {text: "che lavoro cerci", fix: "che lavoro cerchi", tags: [verb-form]}
  # merlin-1385_0001737-4
  - learner: "Quando voresti iniziare il tuo nuovo lavoro?"
  - tutor: "Subito, anche domani! Ma tu invece, come passi la giornata?"
  - learner: "Mi alzo alle sei, lavoro in fabbrica fino alle due e la sera vado a un corso di cucina."
  - tutor: "Un corso di cucina? Allora conosci tanti ristoranti!"
    goals: [wake, work, evening]
  # merlin-1365_0100098-8
  - learner: "I prossimi giorni vado cercare un lavoro per te."
    errors: [preposition, articulated-preposition]
  - tutor: "Davvero? Grazie! Ma «vado cercare»: tra «vado» e «cercare», cosa ci va?"
    prompt: {text: "vado cercare", tags: [preposition]}
  - learner: "Vado a cercare! Chiedo al mio insegnante. E tu, cosa fai oggi?"
  - tutor: "Esatto! Oggi scrivo a tre ristoranti e poi vado a correre."
    goals: [ask]

- scenario: serata-cinema
  level: A2
  persona: en-f-student
  history: [article-use]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa? Ho bisogno di pensare ad altro: cerco lavoro da un mese!"
  # merlin-1385_0000043-2
  - learner: "Poui dirmi dove è il tuo ultimo lavoro?"
  - tutor: "In un negozio di vestiti in centro, ma ha chiuso a settembre."
  # merlin-1385_0001737-7
  - learner: "Ti piace lavoro movimento o tranquillo?"
    errors: [article-use, word-choice]
  - tutor: "Bella domanda! Ma «Ti piace lavoro»: qui, davanti a «lavoro», ci vuole l'articolo?"
    prompt: {text: "Ti piace lavoro", tags: [article-use]}
  - learner: "Sì, ti piace lavoro tranquillo, in un ufficio?"
    errors: [article-use]
  - tutor: "No, mi piace il lavoro con tanta gente intorno. In ufficio sto male!"
    recast: {text: "piace lavoro", fix: "piace il lavoro", tags: [article-use]}
  # merlin-1385_0001737-6
  - learner: "Mi scrivi dove voresti lavorare; in città o in campagna?"
  - tutor: "In città, così vado a piedi. Ma adesso basta lavoro: cosa facciamo stasera?"
  - learner: "Andiamo al cinema? Io preferisco i film d'azione."
  - tutor: "Perfetto! Alle nove c'è un film d'azione nuovo. Ci vediamo alle otto e mezza davanti al cinema?"
    goals: [propose, genre, choose]
  - learner: "Va bene, a dopo!"
  - tutor: "A dopo!"
    goals: [meet]

- scenario: famiglia
  level: A2
  persona: en-m-retired
  history: [negation]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questa è mia moglie e questo è mio figlio Tom, in vacanza in Spagna. Tom ha diciannove anni."
  - tutor: "Che bella famiglia! E tua moglie com'è?"
    goals: [who, ages]
  # merlin-1395_0000399-7
  - learner: "La mia signora é un po noiosa."
  - tutor: "Ma no, non ci credo! Sembra così contenta. E Tom viene ancora in vacanza con voi?"
    goals: [describe]
  # merlin-1395_0000399-4
  - learner: "Io penso che lui viene mai piu con noi in vacanza."
    errors: [negation]
  - tutor: "Davvero? Ma «viene mai più»: con «mai», cosa mettiamo prima del verbo?"
    prompt: {text: "viene mai piu", tags: [negation]}
  - learner: "Sì, lui viene mai più: adesso ha la ragazza!"
    errors: [negation]
  - tutor: "«Lui non verrà mai più con noi»? Eh, a diciannove anni è normale!"
    recast: {text: "lui viene mai più", fix: "lui non verrà mai più", tags: [negation]}
  - learner: "Hai ragione. E tu, hai figli?"
  - tutor: "Sì, due bambine piccole: Anna e Lucia. Ecco la foto!"
    goals: [ask]

- scenario: casa-mia
  level: A2
  persona: es-f-teacher
  history: [pronoun-position, preposition]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Vivo in un appartamento al terzo piano, con due camere e un balcone. La mia stanza preferita è il balcone, perché ci sono tante piante."
  - tutor: "Che bello! Io adesso abito a Verona, in una casa vecchia ma grande."
    goals: [type, rooms, favourite]
  # merlin-1395_0001114-0
  - learner: "Vorrei andare a ti trovare in Italia."
    errors: [pronoun-position]
  - tutor: "Che bello, vieni! Ma «a ti trovare»: con l'infinito, dove va «ti»?"
    prompt: {text: "a ti trovare", tags: [pronoun-position]}
  # merlin-1395_0000564-6
  - learner: "Quando possiamo ti trovare?"
    errors: [pronoun-position]
  - tutor: "«Quando possiamo trovarti?» Quando volete! A maggio Verona è bellissima."
    recast: {text: "possiamo ti trovare", fix: "possiamo trovarti", tags: [pronoun-position]}
  # merlin-1395_0001118-0
  - learner: "Prossima settimana vengo a te."
    errors: [preposition, article-use]
  - tutor: "Così presto? Che sorpresa! Ma «vengo a te»: per dire a casa di una persona, quale preposizione usiamo?"
    prompt: {text: "vengo a te", tags: [preposition]}
  - learner: "Vengo da te! Arrivo martedì con il treno. La tua casa ha un giardino?"
  - tutor: "Esatto! Sì, un piccolo giardino con tanti fiori. Ti aspetto alla stazione martedì."
    goals: [ask]

- scenario: compleanno
  level: A2
  persona: en-f-professional
  history: [combined-pronouns]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Una cena a casa tua, sabato 14? Tu hai una casa grande."
  - tutor: "Va bene, casa mia. Ma sabato lavoro fino alle sette: devo ancora organizzare tutto!"
    goals: [date]
  # merlin-1385_0000047-8
  - learner: "Poi io posso aiutarti più."
    errors: [preposition]
  - tutor: "Grazie! Ma «aiutarti più»: prima di «più», alla fine della frase, ci vuole una preposizione. Quale?"
    prompt: {text: "aiutarti più", tags: [preposition]}
  - learner: "Posso aiutarti di più: compro io le bevande e la torta."
  - tutor: "Esatto, perfetto! E chi invitiamo?"
    goals: [food]
  - learner: "Tutti i colleghi e la sua amica Paola."
  - tutor: "Va bene. Il regalo invece lo cerco io in centro, poi ti dico."
    goals: [guests]
  # merlin-1395_0000341-2
  - learner: "Mi chiami per dirmi."
    errors: [combined-pronouns]
  - tutor: "Certo! Ma «per dirmi»: dirmi che cosa? Il regalo. Allora come uniamo i due pronomi?"
    prompt: {text: "per dirmi", tags: [combined-pronouns]}
  - learner: "Sì, sì: mi chiami per dirmi, va bene?"
    errors: [combined-pronouns]
  - tutor: "«Mi chiami per dirmelo?» Certo, ti chiamo domani sera!"
    recast: {text: "per dirmi", fix: "per dirmelo", tags: [combined-pronouns]}
  # merlin-1395_0000512-5
  - learner: "Chiamami o chiamero te al cellulare."
  - tutor: "Va bene, al cellulare. Per il regalo pensavo a un libro di cucina: cosa dici?"
  - learner: "Sì, perfetto! A Sara piace tanto cucinare."
  - tutor: "Allora deciso! A domani."
    goals: [gift]

- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  history: [reflexive]
  turns:
  - tutor: "Ciao! Sono ancora in Australia, ma la settimana prossima torno. Facciamo qualcosa?"
  # merlin-1395_0000451-0
  - learner: "Ciao Laura, non vediamo da molto tempo, perché sei in Australia."
    errors: [reflexive]
  - tutor: "Eh sì, troppo tempo! Ma «non vediamo»: io e te, l'una con l'altra. Quale pronome serve?"
    prompt: {text: "non vediamo", tags: [reflexive]}
  - learner: "Sì, non vediamo da un anno! Mi manchi."
    errors: [reflexive]
  - tutor: "Non ci vediamo da un anno, è vero! Anche tu mi manchi. Sai, qui ho lavorato in un albergo."
    recast: {text: "non vediamo", fix: "non ci vediamo", tags: [reflexive]}
  # merlin-1395_0000399-6
  - learner: "Comera il tuo nuovo posto di lavoro"
  - tutor: "Bellissimo, sul mare! Ma adesso dimmi: sabato andiamo al cinema? Ti piacciono ancora le commedie?"
  - learner: "Sì, sempre! Andiamo al cinema sabato e vediamo una commedia."
  - tutor: "Perfetto! Sabato alle nove c'è una commedia francese. Ci vediamo alle otto e mezza in piazza?"
    goals: [propose, genre, choose]
  - learner: "Sì, in piazza. Non vedo l'ora!"
  - tutor: "Neanch'io! A sabato."
    goals: [meet]

- scenario: famiglia
  level: A2
  persona: en-m-heritage
  history: [preposition]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono io con i miei genitori a Monaco. Mio padre ha settant'anni, mia madre sessantotto."
  - tutor: "Sembrano felici! Anch'io sono felice: ho finito l'università. Adesso però cerco lavoro."
    goals: [who, ages]
  # merlin-1365_0100051-1
  - learner: "Sono molto felice tu!"
    errors: [preposition]
  - tutor: "Grazie! Ma «felice tu»: tra «felice» e la persona, cosa ci va? E «tu» resta così?"
    prompt: {text: "felice tu", tags: [preposition]}
  - learner: "Sì, sono felice tu! Bravissimo!"
    errors: [preposition]
  - tutor: "«Sono molto felice per te»: grazie! Ma trovare lavoro non è facile."
    recast: {text: "felice tu", fix: "felice per te", tags: [preposition]}
  # merlin-1365_0100098-13
  - learner: "E difficile ma va."
  - tutor: "Speriamo! Mi aiuti a cercare?"
  # merlin-1385_0000012-1
  - learner: "Vorrei sappere, che tipo di lavoro vuoi fare. Che cosa ti piace e che cosa ti dispiace."
  - tutor: "Mi piace stare con i bambini. Non mi piace stare tutto il giorno al computer."
  - learner: "Mia madre è maestra ed è molto paziente: chiedo a lei! E la tua famiglia dov'è?"
  - tutor: "Che bello, grazie! I miei sono a Lecce, vicino al mare."
    goals: [describe, ask]

- scenario: tempo-libero
  level: A2
  persona: en-m-traveller
  history: [imperative-form]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Vado a pescare al lago con mio fratello. Ci andiamo ogni domenica."
  - tutor: "A pescare? Io non so pescare!"
    goals: [hobby, frequency]
  - learner: "Vieni con noi domenica prossima? E tu, cosa fai di solito nel fine settimana?"
  - tutor: "Sì, vengo! Io di solito vado in montagna. Per domenica ti scrivo un messaggio con l'ora."
    goals: [propose, ask]
  # merlin-1385_0000017-2
  - learner: "Scusa Sara, qual e il tuo numero di cellulare?"
  - tutor: "È 347 221 8905. Ma prima devo sapere a che ora partite."
  # merlin-1385_0000050-5
  - learner: "Scrivermi presto, per favore"
    errors: [imperative-form]
  - tutor: "Certo! Ma «scrivermi»: chiedi una cosa a me, con il «tu». Come diventa il verbo?"
    prompt: {text: "Scrivermi", tags: [imperative-form]}
  - learner: "Sì, scrivermi stasera, così preparo tutto."
    errors: [imperative-form]
  - tutor: "«Scrivimi stasera»: va bene, ti scrivo dopo cena!"
    recast: {text: "scrivermi", fix: "Scrivimi", tags: [imperative-form]}
  # merlin-1385_0001788-4
  - learner: "Aspetto la tua email presto."
  - tutor: "Ti scrivo un messaggio, è più veloce! A domenica, allora."

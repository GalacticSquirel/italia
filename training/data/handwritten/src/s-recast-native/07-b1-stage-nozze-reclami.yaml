# Set s-recast-native, file 7: B1, after the summer, an internship interview, a language course,
# two hotel complaints and three weddings (real learner sentences corrected by a native speaker;
# recasts use the native fix of the learner's own span).

- scenario: vacanze-passate
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Ciao! Com'è andata l'estate? Io ho finito la scuola, finalmente!"
  # merlin-1365_0100118-1
  - learner: "Anché io ho finito il mio corso di cucina e ho fatto un piccolo viaggio in Toscana, una parte d'Italia che mi piace molto per la cultura e la natura."
  - tutor: "Che bello, la Toscana! Io invece ti ho mandato un messaggio a luglio per un consiglio, ricordi? E niente risposta!"
    goals: [where]
  # merlin-1365_0100277-3
  - learner: "Scusa, che ti hai dovuto aspettare così lungo alla mia risposta."
    errors: [preposition, object-pronoun]
  - tutor: "Non ti preoccupare! Ma «aspettare così lungo»: per una durata, davanti a «lungo» non ci vuole una preposizione?"
    prompt: {text: "così lungo", tags: [preposition]}
  # merlin-1365_0100277-4
  - learner: "Nell'ultimo periodo avevo molto lavoro nella ditta e ho dovuto aiutare miei genitore da trovare una altra casa perché la loro li ha dato troppo lavoro."
    errors: [preposition, possessive, noun-number, article-form, object-pronoun]
  - tutor: "«Ho dovuto aiutare i miei genitori a trovare un'altra casa»: che periodo! E adesso è tutto a posto?"
    goals: [activities]
    recast: {text: "da trovare", fix: "a trovare", tags: [preposition]}
  # merlin-1365_0100277-5
  - learner: "Adesso, questo è in ordine e per te - mio amico - ho già alcune idee."
  - tutor: "Davvero? Dimmi tutto, perché io non so proprio da dove cominciare."
  # merlin-1365_0100120-5
  - learner: "Veramente Ci vuole un pò di tempo per trovare un bel lavoro."
  - tutor: "Lo so, lo so... ma io vorrei cominciare subito!"
  # merlin-1365_0100479-4
  - learner: "Per questo ti consiglio di studiare in questa citta, che é grande, antica e molto interessante."
  - tutor: "Studiare a Bologna? Non ci avevo pensato! Ma una tua collega non aveva una stanza libera vicino all'università?"
    goals: [best]
  # merlin-1365_0100479-10
  - learner: "Penso, che questa stanza é perfetta per te."
    errors: [subjunctive-use]
  - tutor: "Che bello! Ma «penso che... è»: dopo «penso che», quale modo usiamo?"
    prompt: {text: "che questa stanza é perfetta", tags: [subjunctive-use]}
  - learner: "Sì, penso che è perfetta: è piccola ma costa poco."
    errors: [subjunctive-use]
  - tutor: "«Penso che questa stanza sia perfetta»: allora la voglio vedere! Come posso chiamare la tua collega?"
    recast: {text: "è perfetta", fix: "sia perfetta", tags: [subjunctive-use]}
  # merlin-1365_0100479-9
  - learner: "Il suo numero del telefono é 0345 2233445."
    errors: [articulated-preposition]
  - tutor: "Grazie! Ma «numero del telefono»: qui ci vuole proprio l'articolo?"
    prompt: {text: "numero del telefono", tags: [articulated-preposition]}
  - learner: "No: il suo numero di telefono è 0345 2233445. Si chiama Paola."
  - tutor: "Esatto, la chiamo stasera. E noi due quando ci rivediamo?"
  # merlin-1365_0100277-11
  - learner: "Mi piacerebbe molto di vederti più e spero che tutti vada bene!"
    errors: [preposition, word-choice]
  - tutor: "Anche a me! Ma «mi piacerebbe molto di vederti»: dopo «mi piacerebbe», serve quel «di»?"
    prompt: {text: "molto di vederti", tags: [preposition]}
  - learner: "No: mi piacerebbe molto vederti! Vengo a Bologna a ottobre."
  - tutor: "Esatto! Allora ti aspetto a ottobre."

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [article-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Perché vuole lavorare con noi, nella moda?"
  # merlin-1325_1001079-4
  - learner: "Il mio hobby la moda, mi interessa tanto."
    errors: [verb-form]
  - tutor: "Bene! Ma «il mio hobby la moda»: tra «hobby» e «la moda», che verbo ci vuole?"
    prompt: {text: "Il mio hobby la moda", tags: [verb-form]}
  - learner: "Il mio hobby è la moda, da sempre."
  - tutor: "Esatto. E cos'altro le interessa?"
    goals: [intro]
  # merlin-1325_1001087-1
  - learner: "Mi interessa anche sul diritto internazionale."
    errors: [preposition]
  - tutor: "Interessante! Ma «mi interessa sul diritto»: con «interessare», serve quel «sul»? E che esperienze ha?"
    prompt: {text: "interessa anche sul diritto", tags: [preposition]}
  # merlin-1325_1001033-2
  - learner: "Ma finalmente un'azienda leader che stava cercando le persone nel settore delle attività amministrative mi ha chiesto di lavorare per loro."
    errors: [preposition, subject-verb-agreement, article-use]
  - tutor: "«Ma finalmente in un'azienda leader mi hanno chiesto di lavorare per loro»: e com'è andata?"
    goals: [experience]
    recast: {text: "Ma finalmente un'azienda", fix: "Ma finalmente in un'azienda", tags: [preposition]}
  # merlin-1325_1001033-3
  - learner: "Quando ho capito che avevo preso una decisione sbagliata."
    errors: [article-use, word-choice]
  - tutor: "Ah, peccato. Ma «una decisione sbagliata»: era proprio quella sbagliata. Quale articolo usa, allora?"
    prompt: {text: "una decisione sbagliata", tags: [article-use]}
  # merlin-1325_1001033-6
  - learner: "Mi piacerebbe lavorare per una società che prende in considerazione la persona che parla le lingue diverse"
    errors: [article-use, word-order]
  - tutor: "«Una società che prende in considerazione una persona che parla diverse lingue»: da noi è così. Lei quali lingue parla?"
    goals: [why]
    recast: {text: "la persona", fix: "una persona", tags: [article-use]}
  - learner: "Parlo inglese, spagnolo e un po' di francese. Il mio difetto? Sono troppo preciso."
  - tutor: "Non è un brutto difetto, nella moda! Ha qualche domanda per noi?"
    goals: [strengths]
  # merlin-1325_1001153-7
  - learner: "Vorrei chiedere alcuni informazioni sul lavoro."
    errors: [adjective-agreement]
  - tutor: "Certo! Ma «alcuni informazioni»: la parola «informazioni» è femminile, quindi?"
    prompt: {text: "alcuni informazioni", tags: [adjective-agreement]}
  - learner: "Alcune informazioni, sì: quante ore si lavora al giorno?"
  - tutor: "Esatto. Si lavora otto ore, dalle nove alle cinque."
    goals: [questions]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  history: [verb-form]
  turns:
  - tutor: "Ciao! Allora, come va il corso a Siena? E quando vieni a Napoli?"
  # merlin-1395_0000446-1
  - learner: "Mi piacono molto queste lezione perché tutto il tempo devo parlare solo italiano."
    errors: [verb-form, noun-number]
  - tutor: "Che bello! Ma «mi piacono»: il verbo è «piacere». Al plurale come fa?"
    prompt: {text: "Mi piacono", tags: [verb-form]}
  - learner: "Sì, mi piacono tanto, anche la città."
    errors: [verb-form]
  - tutor: "«Mi piacciono molto queste lezioni», allora! E nel tempo libero cosa fai?"
    recast: {text: "mi piacono", fix: "Mi piacciono", tags: [verb-form]}
  # merlin-1395_0001010-4
  - learner: "In mio tempo libero sto facendo un corso di tennis, che mi piace molto."
    errors: [articulated-preposition]
  - tutor: "Brava! Ma «in mio tempo libero»: davanti a «mio», la preposizione cambia?"
    prompt: {text: "In mio tempo libero", tags: [articulated-preposition]}
  # merlin-1395_0000596-4
  - learner: "Pendante mia tempo libero, io visito la città, faccio di shopping."
    errors: [articulated-preposition, possessive, word-choice]
  - tutor: "«Durante il mio tempo libero, io visito la città e faccio dello shopping»: a Napoli i negozi ti piaceranno!"
    recast: {text: "faccio di shopping", fix: "faccio dello shopping", tags: [articulated-preposition]}
  # merlin-1395_0000596-5
  - learner: "Noi mangiamo del specialite regionale."
    errors: [noun-number, adjective-agreement, articulated-preposition]
  - tutor: "Che buono! Ma «del specialite regionale»: è un piatto solo o tanti?"
    prompt: {text: "del specialite regionale", tags: [noun-number]}
  - learner: "Tanti! Mangiamo delle specialità regionali, come i pici al ragù."
  - tutor: "Esatto. Però aspetta la pizza di Napoli! E con i compagni ti trovi bene?"
  # merlin-1395_0000443-2
  - learner: "Posso incontrare molti persone veramente gentili."
    errors: [adjective-agreement]
  - tutor: "Che fortuna! Ma «molti persone»: «persone» è femminile. E l'aggettivo?"
    prompt: {text: "molti persone", tags: [adjective-agreement]}
  - learner: "Molte persone, sì! Allora, quando posso venire da te?"
  - tutor: "Esatto. Vieni quando vuoi! Prendi il treno veloce da Firenze: in tre ore sei qui."
    goals: [plans, transport]
  # merlin-1395_0000446-9
  - learner: "Spero che incontriamoci dopo finire il mio corso."
    errors: [verb-form, pronoun-position]
  - tutor: "Anch'io! Ma «dopo finire»: dopo «dopo», il verbo va al passato. Come si dice?"
    prompt: {text: "dopo finire", tags: [verb-form]}
  - learner: "Dopo aver finito il corso, a fine luglio. Cosa devo assolutamente vedere?"
  - tutor: "Esatto! Visita il centro a piedi, ma non portare la borsa aperta in metro."
    goals: [advice, warnings]

- scenario: reclamo-hotel

# C1, correction-dense (continued): concordanza dei tempi, congiuntivo dopo timore e giudizio, calchi dall'inglese e dallo spagnolo.
- scenario: intervista-podcast
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Grazie a voi! È stato per amore, come in un film: trent'anni fa ho conosciuto mia moglie a Londra, dove lei faceva un master. Quando sono andato in pensione abbiamo deciso di tornare nel suo paese, in Friuli."
  - tutor: "Una storia d'amore con ritorno a casa, bellissima. E c'è stato qualcosa che ti ha sorpreso davvero, all'inizio?"
    goals: [story]
  - learner: "Sì, il pranzo della domenica. Mi ha preso tre anni per capire che non si può dire di no alla seconda porzione senza offendere la suocera!"
    errors: [word-choice]
  - tutor: "Ci hai messo tre anni, ma alla fine hai capito la regola più importante d'Italia! E c'è qualcosa che invece ti dà fastidio?"
    recast: {text: "Mi ha preso tre anni", fix: "Ci hai messo tre anni", tags: [word-choice]}
    goals: [culture-shock]
  - learner: "Diciamo che la puntualità non è il punto forte di tutti. Prima di venire speravo che almeno i treni locali partano in orario, ma ho imparato a portarmi sempre un libro."
    errors: [subjunctive-use]
  - tutor: "Detto con grande gentilezza! Però \"speravo che... partano\": la speranza è nel passato. E il verbo che segue, cambia anche lui?"
    prompt: {text: "speravo che almeno i treni locali partano", tags: [subjunctive-use]}
  - learner: "Speravo che almeno i treni locali partissero in orario."
  - tutor: "Perfetto. E per chi ci ascolta e sogna di trasferirsi qui, qual è il tuo consiglio?"
    goals: [critique]
  - learner: "Di imparare la lingua, prima di tutto, e di non aspettarsi che tutto funzioni come a casa propria. Se mi fossi aspettato meno, mi sarei goduto di più i primi mesi."
  - tutor: "Consiglio prezioso: aspettarsi meno per godersi di più. Grazie mille, è stato un piacere averti qui!"
    goals: [advice]

- scenario: medico-specialista
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio di prima, ma non del tutto. La settimana scorsa ho sentito un dolore al petto mentre ho corso per prendere l'autobus. È durato un paio di minuti, poi è passato."
    errors: [tense-aspect]
  - tutor: "Questo è importante, ne parliamo subito. Però \"mentre ho corso\": l'azione era in corso quando è arrivato il dolore. Quale tempo descrive meglio quello sfondo?"
    prompt: {text: "mentre ho corso", tags: [tense-aspect]}
  - learner: "Mentre correvo per prendere l'autobus."
  - tutor: "Esatto. Le era già capitato altre volte, sotto sforzo? E in famiglia qualcuno ha avuto problemi di cuore?"
    goals: [symptoms]
  - learner: "No, era la prima volta. Mio padre ha avuto un infarto a sessant'anni, e anche suo fratello soffriva di pressione alta."
  - tutor: "Grazie, è un dato utile. Gli esami mostrano una pressione un po' alta e un battito irregolare sotto sforzo: niente di grave, per ora."
    goals: [history]
  - learner: "Che cosa significa esattamente \"battito irregolare\"? È possibile che sia ereditario, visto quello che è successo a mio padre?"
  - tutor: "Significa che ogni tanto il cuore fa un battito in più, una cosa abbastanza comune. La storia familiare conta, certo: per questo le propongo una terapia leggera e un controllo tra tre mesi."
    goals: [understand]
  - learner: "D'accordo. Ho solo paura che il farmaco mi fa sentire stanco: lavoro molte ore e non posso permettermi di addormentarmi alla scrivania."
    errors: [subjunctive-use]
  - tutor: "La capisco bene. Ma ascolti ancora una volta \"ho paura che il farmaco mi fa\": dopo un verbo che esprime paura, il modo è quello giusto?"
    prompt: {text: "Ho solo paura che il farmaco mi fa", tags: [subjunctive-use]}
  - learner: "Ho paura che il farmaco mi faccia sentire stanco."
  - tutor: "Perfetto. Nelle prime settimane un po' di affaticamento è possibile, ma di solito passa. Se dovesse durare, mi chiami e cambiamo la dose."
    goals: [treatment]

- scenario: modi-di-dire
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, è stata una giornata da dimenticare. Stamattina la sveglia non ha suonato, e quando sono arrivata alla stazione il treno è già partito."
    errors: [tense-aspect]
  - tutor: "Cominciamo bene! Aspetta però: \"il treno è già partito\". È partito prima che tu arrivassi, no? Allora che tempo ci vuole?"
    prompt: {text: "il treno è già partito", tags: [tense-aspect]}
  - learner: "Il treno era già partito, appunto. Così sono arrivata a scuola con quaranta minuti di ritardo, proprio il giorno dell'ispezione."
  - tutor: "Esatto. E proprio il giorno dell'ispezione! Come si dice, piove sempre sul bagnato."
  - learner: "Altro che pioggia, è stato un diluvio! Il preside era molto molesto e mi ha fatto una ramanzina davanti a tutti i colleghi."
    errors: [false-friend]
  - tutor: "Era molto seccato, ci credo, ma fartela davanti a tutti è stato di cattivo gusto. Però dimmi la verità: la colpa era solo della sveglia?"
    recast: {text: "molto molesto", fix: "molto seccato", tags: [false-friend]}
    goals: [tell, react]
  - learner: "Diciamo di no. Avevo messo la sveglia sul telefono, ma la sera prima mi ero dimenticata di metterlo in carica. Quindi metà colpa è mia e metà della tecnologia."
  - tutor: "Metà e metà, mi sembra giusto! E che cosa ti ha insegnato questa giornata?"
    goals: [blame]
  - learner: "Che domani mi compro una sveglia vecchio stile, di quelle con il campanello. E che, come diceva mia nonna, non tutto il male viene per nuocere: almeno il preside si ricorderà di me!"
  - tutor: "Ben detto, tua nonna aveva ragione! Dai, il prossimo giro lo offro io: te lo sei meritato."
    goals: [moral]

- scenario: organizzare-matrimonio
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Immaginiamo una cosa elegante ma non formale: cerimonia civile al tramonto, poi cena all'aperto con lunghe tavolate e musica dal vivo. Gli invitati saranno circa centoventi."
  - tutor: "Tramonto e tavolate, molto suggestivo. Qual è il budget che avete in mente?"
    goals: [vision]
  - learner: "Abbiamo previsto trentamila euro, tutto compreso. È fondamentale che il fotografo è bravo: le foto sono l'unica cosa che resta."
    errors: [subjunctive-use]
  - tutor: "Sono d'accordo, le foto restano per sempre. Però riascolti \"è fondamentale che il fotografo è bravo\": dopo un giudizio come questo, che modo usiamo?"
    prompt: {text: "È fondamentale che il fotografo è bravo", tags: [subjunctive-use]}
  - learner: "È fondamentale che il fotografo sia bravo."
  - tutor: "Esatto. Con trentamila euro ho due proposte: una villa sul lago di Como, più cara, oppure un agriturismo in collina, più semplice ma con una vista splendida."
    goals: [budget]
  - learner: "Ci piacciono entrambe, ma dobbiamo fare una decisione entro la settimana. Il lago è più elegante, però l'agriturismo ci permetterebbe di spendere di più per la musica."
    errors: [word-choice]
  - tutor: "Allora prendete una decisione con calma, ma entro venerdì: le date si riempiono in fretta. Se volete, organizzo una visita all'agriturismo sabato mattina."
    recast: {text: "fare una decisione", fix: "prendete una decisione", tags: [word-choice]}
  - learner: "Sì, grazie. Anzi, a pensarci bene, scegliamo l'agriturismo: è più nel nostro stile. Le chiedo solo una cosa: il preventivo definitivo ci lo può mandare per iscritto entro lunedì?"
    errors: [combined-pronouns]
  - tutor: "Ottima scelta. Solo un dettaglio: \"ci lo può mandare\"? Quando due pronomi si incontrano, il primo cambia forma."
    prompt: {text: "ci lo può mandare", tags: [combined-pronouns]}
    goals: [choices]
  - learner: "Ce lo può mandare per iscritto entro lunedì? E vorremmo che ogni cambiamento sopra i cinquecento euro venisse approvato prima da noi."
  - tutor: "Esatto. Preventivo entro lunedì e nessuna spesa extra senza il vostro via libera: lo scrivo nel contratto."
    goals: [conditions]

- scenario: politica-lavoro
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me è un'esagerazione. Molti lavori cambieranno, questo sì, ma dire che sparirà la metà dei posti mi sembra un po' catastrofico."
  - tutor: "Catastrofico? Realistico, direi. Guarda le casse automatiche al supermercato: prova a immaginare che cosa succederebbe se le usassero tutti i negozi."
    goals: [opinion]
  - learner: "Se tutti i negozi usassero solo casse automatiche, molte cassiere perderanno il lavoro, è vero. Ma qualcuno dovrà comunque riparare le macchine e aiutare i clienti."
    errors: [hypothetical]
  - tutor: "Allora ammetti che ho ragione! Però nella tua ipotesi qualcosa non torna: \"se usassero... perderanno\". Le due parti sono coerenti?"
    prompt: {text: "molte cassiere perderanno il lavoro", tags: [hypothetical]}
  - learner: "Se tutti i negozi usassero solo casse automatiche, molte cassiere perderebbero il lavoro."
  - tutor: "Esatto. Ma riparare macchine non è un lavoro per tutti. Hai un esempio concreto di qualcuno che è riuscito a cambiare mestiere?"
    goals: [hypothesis]
  - learner: "Sì, mia zia. Lavorava in banca allo sportello, poi hanno chiuso la filiale. Ha fatto un corso di sei mesi e adesso si occupa di sicurezza informatica nella stessa banca. Però tutto questo dipende sulla formazione che offrono le aziende."
    errors: [preposition]
  - tutor: "Brava tua zia! Solo una cosa: \"dipende sulla formazione\"? In inglese funzionerebbe, ma in italiano questo verbo vuole un'altra preposizione."
    prompt: {text: "dipende sulla formazione", tags: [preposition]}
  - learner: "Dipende dalla formazione che offrono le aziende."
  - tutor: "Perfetto. E qui ti do ragione: senza formazione restano solo i disoccupati. Allora, in conclusione?"
    goals: [example]
  - learner: "In conclusione, non credo che il lavoro sparisca, ma cambierà moltissimo, a meno che lo Stato non investa nella formazione. E tu, Riccardo, sei ancora così pessimista?"
  - tutor: "Un po' meno, lo ammetto. Ma se tra dieci anni avrò ragione io, mi offri una cena!"
    goals: [conclude]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie, direttore, sarò breve. Proponiamo un'app che permetta ai nostri clienti di ordinare i ricambi direttamente dal telefono. Oggi il settanta per cento degli ordini arriva ancora per telefono o via fax."
  - tutor: "Via fax, lo so, è imbarazzante. Ma che cosa ci guadagniamo, concretamente?"
    goals: [pitch]
  - learner: "Prevediamo di ridurre gli errori negli ordini del quaranta per cento e di liberare due persone del servizio clienti. Nonostante l'investimento iniziale è alto, il progetto si ripaga in diciotto mesi."
    errors: [subjunctive-use]
  - tutor: "Numeri interessanti. Ma \"nonostante l'investimento iniziale è alto\": dopo questa congiunzione, l'indicativo ci può stare?"
    prompt: {text: "Nonostante l'investimento iniziale è alto", tags: [subjunctive-use]}
    new: [{lemma: congiunzione, gloss: conjunction}]
  - learner: "Nonostante l'investimento iniziale sia alto, il progetto si ripaga in diciotto mesi."
  - tutor: "Bene. Però parliamo di una spesa importante, e l'ultimo progetto informatico che abbiamo pagato è arrivato con sei mesi di ritardo. Chi mi garantisce che non succeda di nuovo?"
    goals: [benefits]
  - learner: "Capisco la preoccupazione. Guarda, questa volta lavoreremo per fasi: se la prima versione non è pronta entro marzo, il fornitore paga una penale del dieci per cento."
    errors: [register]
  - tutor: "Una penale mi piace. Ma mi permetta: \"guarda\"? In questa sala, con me, mi sembra che ci diamo del lei."
    prompt: {text: "Guarda", tags: [register]}
  - learner: "Mi scusi, guardi: lavoreremo per fasi, con una penale del dieci per cento in caso di ritardo."
  - tutor: "Ecco. Il lavoro per fasi e la penale mi fanno stare più tranquillo. Che cosa le serve da me, adesso?"
    goals: [objection]
  - learner: "Avrei bisogno della sua approvazione per avviare la prima fase, che costa quarantamila euro. Se ce la dà entro venerdì, potremmo firmare con il fornitore all'inizio di dicembre."
  - tutor: "D'accordo per la prima fase. Mi mandi entro giovedì il contratto con la penale: se è tutto in ordine, firmo venerdì."
    goals: [next-steps]

- scenario: recensione-ristorante
  level: C1
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, mi dispiace disturbarla, ma siamo un po' delusi. Abbiamo aspettato quasi un'ora per i secondi, e nessuno ci ha detto niente."
  - tutor: "Mi dispiace davvero, stasera la cucina è in difficoltà. Che cosa avevate ordinato, esattamente?"
    goals: [complain]
  - learner: "Io la tagliata e il mio amico il branzino. Il pesce era buono, ma la tagliata era troppo fatta, quasi grigia dentro, e io l'avevo chiesta al sangue."
    errors: [word-choice]
  - tutor: "Era troppo cotta, e lei l'aveva chiesta al sangue: ha ragione, questo non doveva succedere. Ma mi dica, che cosa si aspettava da noi stasera?"
    recast: {text: "troppo fatta", fix: "troppo cotta", tags: [word-choice]}
    goals: [detail]
  - learner: "Ci avevano parlato molto bene di questo ristorante, quindi mi aspettavo che il servizio era all'altezza della cucina. E avrei preferito che qualcuno ci avvisava del ritardo, invece di lasciarci lì senza una parola."
    errors: [subjunctive-use]
  - tutor: "Capisco perfettamente. Però, in \"mi aspettavo che il servizio era\", dopo un'attesa nel passato, quale modo ci vuole?"
    prompt: {text: "mi aspettavo che il servizio era", tags: [subjunctive-use]}
  - learner: "Mi aspettavo che il servizio fosse all'altezza. E avrei preferito che qualcuno ci avesse avvisato del ritardo."
  - tutor: "Ha perfettamente ragione su tutte e due le cose. Per scusarci vorremmo offrirvi i dolci e il caffè, e togliere la tagliata dal conto."
    goals: [expectation]
  - learner: "La ringrazio, è un gesto gentile e lo accettiamo volentieri. Spero che la prossima volta vada meglio, perché la cucina lo merita."
  - tutor: "Ci conto. E la prossima volta chieda di me: la tagliata gliela faccio preparare personalmente dallo chef."
    goals: [resolve]

- scenario: riunione-lavoro
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Il nuovo catalogo è quasi pronto: mancano solo le schede di dieci prodotti e le foto della linea estiva."
  - tutor: "Ottimo. E c'è qualcosa che ti preoccupa?"
    goals: [update]
  - learner: "Sì, le foto. Avevo assunto che il fotografo le avesse già consegnate, invece ieri ho scoperto che non le ha neanche scattate, perché il cliente non aveva approvato i campioni."
    errors: [false-friend]
  - tutor: "Quindi avevi dato per scontato che fossero pronte, e invece niente. Classico! Hai già un'idea per uscirne?"
    recast: {text: "Avevo assunto", fix: "avevi dato per scontato", tags: [false-friend]}
    goals: [problem]
  - learner: "Potrei chiamare il cliente oggi stesso e chiedergli di approvare i campioni entro domani. Se dice di sì, il fotografo può scattare giovedì e io rimanerò in ufficio fino a tardi per finire le schede."
    errors: [future-form]
  - tutor: "Mi piace, è un piano concreto. Solo una cosa: \"rimanerò\"? Questo futuro è irregolare: prova a ricostruirlo."
    prompt: {text: "rimanerò", tags: [future-form]}
  - learner: "Rimarrò in ufficio fino a tardi, scusa."
  - tutor: "Esatto. Però niente straordinari eroici, eh. Allora, che scadenza ci diamo?"
    goals: [proposal]
  - learner: "Direi martedì prossimo per il catalogo completo. Sarebbe meglio che lo vedi anche tu lunedì, prima di mandarlo al cliente."
    errors: [subjunctive-use]
  - tutor: "Martedì va bene. Ma riascolta \"sarebbe meglio che lo vedi\": ti suona naturale, dopo un condizionale?"
    prompt: {text: "Sarebbe meglio che lo vedi", tags: [subjunctive-use]}
  - learner: "Sarebbe meglio che lo vedessi anche tu lunedì."
  - tutor: "Perfetto: lunedì pomeriggio lo guardiamo insieme e martedì parte. Bene, passiamo al prossimo punto."
    goals: [deadline]

- scenario: film-libro
  level: C1
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Questo mese ho letto un giallo ambientato in Sicilia. Un commissario indaga sulla scomparsa di un farmacista, in un paese dove tutti sanno qualcosa e nessuno parla. Mi fermo qui, perché il bello è scoprire il resto da soli."
  - tutor: "Un giallo, finalmente! E il commissario com'è? Uno di quelli duri, o un tipo diverso?"
    goals: [summary]
  - learner: "È un uomo colto e ironico, che ama mangiare bene. Ha una fidanzata lontana, con la quale litiga spesso al telefono. La cosa di cui mi è piaciuta di più è che non è un eroe: sbaglia, si arrabbia, cambia idea."
    errors: [relative-pronoun]
  - tutor: "Un commissario umano, insomma. Senti però: \"la cosa di cui mi è piaciuta\"? Qui la cosa è il soggetto di \"piacere\": serve davvero quella preposizione davanti al relativo?"
    prompt: {text: "La cosa di cui mi è piaciuta", tags: [relative-pronoun]}
    new: [{lemma: relativo, gloss: relative pronoun}]
  - learner: "No, è vero: la cosa che mi è piaciuta di più è che non è un eroe."
  - tutor: "Giusto. E il libro nel suo insieme ti ha convinta?"
    goals: [characters]
  - learner: "Sì, soprattutto per la lingua, che mescola italiano e siciliano. All'inizio mi costava capire certe parole, ma poi ci si abitua. L'unico difetto è che il colpevole si indovina un po' presto."
    errors: [word-choice]
  - tutor: "Anch'io all'inizio facevo fatica a capire certe parole, e sono italiano! Però hai ragione, dopo venti pagine non ci pensi più. A chi lo consiglieresti?"
    recast: {text: "mi costava capire", fix: "facevo fatica a capire", tags: [word-choice]}
    goals: [opinion]
  - learner: "A chi ama i gialli in cui l'atmosfera conta più del mistero. E a chiunque abbia voglia di sentire il sapore della Sicilia senza prendere l'aereo."
  - tutor: "Mi hai fatto venire fame e voglia di partire. Lo segno per il mese prossimo, grazie!"
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Paura no, ma un po' di rispetto sì. Io in cucina la uso già per gli ordini e per calcolare i costi, e mi fa risparmiare un'ora al giorno. Però nessuna macchina sa quando un sugo è pronto. Quindi dipende molto dal settore."
  - tutor: "Il sugo, d'accordo. Ma i camerieri? Ho letto che in Giappone ci sono già i robot ai tavoli."
    goals: [position]
  - learner: "Ci sono anche qui: un ristorante vicino alla stazione ne ha comprati due l'anno scorso. Sai com'è finita? Dopo sei mesi li hanno tolti, perché i clienti si lamentavano. La gente vuole che qualcuno le sorride."
    errors: [subjunctive-use]
  - tutor: "Questa non la sapevo, e mi fa sentire un po' meglio. Però ascolta: \"vuole che qualcuno le sorride\"? Dopo \"volere che\" l'indicativo non regge."
    prompt: {text: "vuole che qualcuno le sorride", tags: [subjunctive-use]}
    new: [{lemma: indicativo, gloss: indicative}]
  - learner: "Vuole che qualcuno le sorrida."
  - tutor: "Esatto. Resta il fatto che chi lavora in fabbrica o in ufficio rischia molto più di te."
    goals: [evidence]
  - learner: "Questo è vero, non lo discuto. Un mio amico faceva il contabile e l'anno scorso l'hanno lasciato a casa: il suo lavoro adesso lo fa un programma. A cinquant'anni non è facile ricominciare, e lui la sta passando male."
    errors: [reflexive]
  - tutor: "Mi dispiace per il tuo amico, ed è proprio quello che temo. Un appunto: \"la sta passando male\"? A quell'espressione manca un pronome davanti."
    prompt: {text: "lui la sta passando male", tags: [reflexive]}
  - learner: "Se la sta passando male, giusto."
  - tutor: "Ecco. Quindi un po' di ragione, alla fine, ce l'ho anch'io."
    goals: [concede]
  - learner: "Ce l'hai. Ma se le aziende fossero obbligate a formare chi perde il posto, la tecnologia farebbe meno paura a tutti. Su questo possiamo essere d'accordo, no?"
  - tutor: "Su questo sì, ci sto. Formazione per tutti, e il sugo lo lasciamo a te. A proposito, stasera che cosa cucini?"
    goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-m-heritage
  history: [subject-verb-agreement]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Ciao, grazie a te! È una storia di famiglia. I miei nonni erano partiti dalla Calabria negli anni Cinquanta, e io sono cresciuto a Toronto sentendo parlare di un paese che non avevo mai visto. A trent'anni ho deciso di venire a vedere, e non sono più ripartito."
  - tutor: "Che bella storia, un ritorno al contrario! E quando sei arrivato, l'Italia era come te l'avevano raccontata?"
    goals: [story]
  - learner: "Per niente! Mia nonna mi aveva descritto un paese dove tutti si conoscono e le porte restano aperte. Io sono arrivato a Milano, dove nessuno salutava in ascensore. E il mio dialetto faceva ridere tutti: pensavo che il mio italiano è perfetto, invece parlavo una lingua di settant'anni fa."
    errors: [subjunctive-use]
  - tutor: "Una lingua di settant'anni fa, che meraviglia! Però ascolta di nuovo: \"pensavo che il mio italiano è perfetto\". Con \"pensavo che\", al passato, quel verbo come diventa?"
    prompt: {text: "pensavo che il mio italiano è perfetto", tags: [subjunctive-use]}
  - learner: "Pensavo che il mio italiano fosse perfetto."
  - tutor: "Adesso lo è quasi davvero. Passiamo alle cose meno belle: c'è qualcosa dell'Italia che criticheresti, con gentilezza?"
    goals: [culture-shock]
  - learner: "Con gentilezza, sì. Trovo che qui si dia troppa importanza alle conoscenze. Per trovare lavoro, spesso conta più chi conosci di quello che sai fare. Ho mandato cinquanta domande e nessuno mi ha risposto, finché un amico non ha fatto una telefonata."
  - tutor: "È una critica dura ma giusta, e purtroppo la sentiamo spesso. Che consiglio daresti a chi ci ascolta e sta pensando di trasferirsi?"
    goals: [critique]
  - learner: "Di non idealizzare. L'Italia delle vacanze e l'Italia di tutti i giorni sono due paesi diversi. E di avere pazienza: i primi due anni sono duri, poi tutto diventa più facile. Io ho quasi mollato dopo il primo inverno, e sarei stato un errore."
    errors: [subject-verb-agreement]
  - tutor: "Meno male che non hai mollato! Solo un attimo sull'ultima frase: \"sarei stato un errore\"? Chi è il soggetto, tu o il fatto di mollare?"
    prompt: {text: "sarei stato un errore", tags: [subject-verb-agreement]}
  - learner: "Il fatto di mollare, certo: sarebbe stato un errore."
  - tutor: "Esatto. Grazie per la sincerità e per questa bella chiacchierata; un saluto alla nonna, se ci ascolta!"
    goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ha fatto bene a venire. Mi sono accorta che ieri è uscita dalla riunione senza salutare nessuno. Mi spieghi che cosa l'ha ferita, la ascolto."
  - tutor: "La ringrazio. Ho proposto io il nuovo orario dei turni, a marzo. Ieri la collega Bianchi l'ha presentato alla direzione, e io l'ho saputo solo in riunione, davanti a tutti."
  - learner: "Capisco, e al suo posto mi sarei sentita allo stesso modo. Mi permetta una domanda, per essere sicura dei fatti: la sua proposta di marzo era scritta, o ne avevate parlato solo a voce?"
  - tutor: "L'avevo mandata per iscritto a tutta la squadra, con tutti i numeri. Ho ancora il messaggio."
    goals: [listen, clarify]
  - learner: "Bene, questo è importante. Ho parlato stamattina con la collega: mi ha detto che la direzione le aveva chiesto una proposta urgente e che aveva usato la sua perché era la migliore. Pensava di citarla alla fine, ma non le ha dato tempo."
    errors: [word-choice]
  - tutor: "Non ha fatto in tempo a farlo? Mi scusi, ma per dire un nome bastano due secondi."
    recast: {text: "non le ha dato tempo", fix: "Non ha fatto in tempo", tags: [word-choice]}
    goals: [perspective]
  - learner: "Ha ragione, e gliel'ho detto anch'io. Non la sto giustificando: credo solo che non ci fosse cattiva intenzione. Questo non toglie che il suo merito andasse riconosciuto."
  - tutor: "Apprezzo che lo dica. E adesso? Per la direzione quei turni sono un'idea di Bianchi."
  - learner: "Le propongo questo. Oggi stesso scrivo alla direzione per precisare che la proposta è sua. Poi vorrei che voi due vi parlate, con me presente se preferisce. E d'ora in poi ogni proposta porterà il nome di chi l'ha scritta."
    errors: [subjunctive-use]
  - tutor: "Sono tre cose che mi stanno bene. Una nota, se permette: in \"vorrei che voi due vi parlate\" il verbo dopo \"vorrei che\" non può restare così."
    prompt: {text: "vorrei che voi due vi parlate", tags: [subjunctive-use]}
  - learner: "Vorrei che voi due vi parlaste."
  - tutor: "Esatto. D'accordo, parlerò con Bianchi, purché sia presente anche lei. Grazie per avermi ascoltata."
    goals: [solution]

- scenario: medico-specialista
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Così così. Da un mese ho delle palpitazioni, soprattutto di notte, e mi sveglio con il cuore in gola. Durante il giorno sono sempre stanca, anche se dormo otto ore."
  - tutor: "Capisco. Le palpitazioni arrivano all'improvviso o dopo uno sforzo? E quanto durano?"
  - learner: "All'improvviso, anche quando sono a riposo. Durano qualche minuto. La settimana scorsa stavo presentando un progetto e a un tratto ho sentito il battito fortissimo: ho dovuto sedermi. Devo dire che al lavoro sono molto sotto pressione, ultimamente."
  - tutor: "Lo stress conta, ma voglio escludere altre cause. In famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Mia nonna è morta di infarto, ma aveva ottant'anni. E mio padre ha la pressione alta da quando era giovane. Io invece sono sempre stata in buona forma: prima giocavo tennis due volte alla settimana."
    errors: [preposition]
  - tutor: "Sono informazioni utili. Mi scusi, \"giocavo tennis\"? In italiano tra il verbo e lo sport manca una piccola parola."
    prompt: {text: "giocavo tennis", tags: [preposition]}
  - learner: "Giocavo a tennis, certo."
  - tutor: "Esatto. Veniamo agli esami: il cuore è sano, ma il battito ogni tanto è irregolare e il ferro è molto basso."
    goals: [history]
  - learner: "Che cosa significa, esattamente? È possibile che il ferro basso sia la causa di tutto, anche della stanchezza?"
  - tutor: "È molto probabile. Il ferro basso spiega la stanchezza e, insieme allo stress, anche il battito irregolare. Non è niente di grave, ma va curato."
    goals: [understand]
  - learner: "Meno male. E la terapia in che cosa consiste? Spero che non ha troppi effetti collaterali, perché viaggio spesso per lavoro."
    errors: [subjunctive-use]
  - tutor: "Consiste in una compressa di ferro al giorno per tre mesi. Sugli effetti le rispondo subito; prima guardi il verbo dopo \"spero che\": le sembra il modo giusto?"
    prompt: {text: "Spero che non ha", tags: [subjunctive-use]}
  - learner: "Spero che non abbia troppi effetti collaterali."
  - tutor: "Perfetto. No, pochi: a volte un po' di mal di stomaco, che passa se prende la compressa dopo i pasti. Tra tre mesi ripetiamo gli esami e facciamo un controllo."
    goals: [treatment]

- scenario: modi-di-dire
  level: C1
  persona: es-m-worker
  history: [reflexive]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Non me ne parlare. Stamattina è arrivato l'ispettore sanitario, senza avvisare, proprio il giorno in cui il frigorifero grande si era rotto. Avevamo spostato tutto nell'altro, ma era un caos. E io ero solo, perché il mio aiutante si era addormentato."
  - tutor: "L'ispettore il giorno del frigo rotto? Quando si dice la sfortuna! E com'è andata, ti ha fatto la multa?"
  - learner: "No, per fortuna. Ha controllato tutto per due ore e alla fine ha trovato solo un'etichetta scaduta. Mi ha detto di sistemare il frigo entro una settimana. Ma io sudavo freddo, te lo giuro."
  - tutor: "Allora ti è andata benissimo! Te la sei cavata per il rotto della cuffia."
    goals: [tell]
  - learner: "Per il rotto della cuffia? Non l'ho mai sentita. Vuol dire per pochissimo? Allora sì: oggi mi sono cavato per il rotto della cuffia, e anche del frigo!"
    errors: [reflexive]
  - tutor: "Vuol dire proprio per pochissimo, e la battuta sul frigo è ottima! Però \"mi sono cavato\" non sta in piedi: in questa espressione il verbo si porta dietro un altro pronome, e cambia anche il finale."
    prompt: {text: "mi sono cavato", tags: [reflexive]}
  - learner: "Me la sono cavata per il rotto della cuffia!"
  - tutor: "Adesso sì. Ma la colpa del caos di chi era? Del frigo, del tuo aiutante o un po' anche tua?"
    goals: [react]
  - learner: "Un po' di tutti. Il frigo è vecchio e il padrone non vuole cambiarlo, il ragazzo dorme troppo, e io avrei dovuto chiamare il tecnico già ieri sera. Diciamo che ognuno ha messo il suo granello di sabbia."
    errors: [word-choice]
  - tutor: "Ho capito: ognuno ci ha messo del suo, tu compreso. E che cosa hai imparato, da questa mattinata da incubo?"
    recast: {text: "ognuno ha messo il suo granello di sabbia", fix: "ognuno ci ha messo del suo", tags: [word-choice]}
    goals: [blame]
  - learner: "Che i guai non arrivano mai da soli, e che il tecnico si chiama subito, non domani. E che al mio aiutante regalo una sveglia per Natale."
  - tutor: "Una sveglia che faccia molto rumore, mi raccomando! Dai, tutto è bene quel che finisce bene. Stasera cucino io, tu riposati."
    goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "L'ho letta di corsa stamattina. Se ho capito bene, il Comune vuole limitare gli affitti brevi nel centro storico, e i proprietari sono sul piede di guerra. Per noi studenti sarebbe una buona notizia, in teoria."
  - tutor: "In teoria, appunto. E in pratica che ne pensi?"
    goals: [summarise]
  - learner: "Penso che sia una misura necessaria ma non sufficiente. Nel mio palazzo quattro appartamenti su sei sono per turisti, e io pago seicento euro per una stanza. Però, anche se limitassero gli affitti brevi, non è detto che i prezzi scendono."
    errors: [subjunctive-use]
  - tutor: "Seicento euro per una stanza, roba da matti. Ma torna su \"non è detto che i prezzi scendono\": dopo \"non è detto che\" quale modo ci vuole?"
    prompt: {text: "non è detto che i prezzi scendono", tags: [subjunctive-use]}
  - learner: "Non è detto che i prezzi scenderanno?"
    errors: [subjunctive-use]
  - tutor: "Appunto, non è detto che i prezzi scendano: i proprietari potrebbero lasciare le case vuote. E i giornali? Io ne ho letti tre e sembravano tre storie diverse."
    recast: {text: "che i prezzi scenderanno", fix: "che i prezzi scendano", tags: [subjunctive-use]}
    goals: [opinion]
  - learner: "Anch'io l'ho notato. Il giornale locale parlava solo dei proprietari arrabbiati. Un sito nazionale invece ha intervistato una studentessa che aveva cambiato casa tre volte in un anno. Mi fido di più di chi riporta dei numeri e cita la fonte."
  - tutor: "Sui numeri sono d'accordo, anche se pure quelli si possono scegliere con cura. E secondo te, come andrà a finire?"
    goals: [sources]
  - learner: "Secondo me la legge passerà, ma con tante eccezioni che cambierà poco. Se fossi il sindaco, punterei piuttosto su nuove case per studenti. Alla fine del giorno, però, i sindaci pensano alle elezioni, non agli studenti."
    errors: [word-choice]
  - tutor: "In fin dei conti hai ragione: i sindaci pensano alle elezioni. Allora siamo in due a crederci poco."
    recast: {text: "Alla fine del giorno", fix: "In fin dei conti", tags: [word-choice]}
  - learner: "In due nello stesso ufficio, siamo messi bene! Vediamo tra sei mesi chi aveva ragione."
  - tutor: "Affare fatto: chi sbaglia paga il pranzo. Adesso però torniamo a lavorare, che il capo ci guarda."
    goals: [consequences]

- scenario: organizzare-matrimonio
  level: C1
  persona: en-m-traveller
  history: [object-pronoun]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille! Io e la mia fidanzata sogniamo un matrimonio all'aperto, magari in un uliveto, con musica dal vivo. Niente di troppo formale: vorremmo che gli invitati ballassero fino a tardi."
  - tutor: "Un uliveto con la musica: mi piace già. In quanti sarete, e che budget avete previsto?"
    goals: [vision]
  - learner: "Saremo circa sessanta. Per il budget, pensavamo a ventimila euro. So che non è tantissimo, ma siamo flessibili su molte cose. L'importante è che il cibo è eccezionale."
    errors: [subjunctive-use]
  - tutor: "Con sessanta invitati ventimila euro bastano, se scegliamo bene. Un dettaglio di lingua: dopo \"l'importante è che\" il verbo va cambiato. Come lo direbbe?"
    prompt: {text: "L'importante è che il cibo è", tags: [subjunctive-use]}
  - learner: "L'importante è che il cibo sia eccezionale."
  - tutor: "Perfetto, e lo sarà. Ho due location da proporvi: una tenuta con uliveto in Puglia, più lontana, oppure una cascina in Toscana, più comoda per chi arriva dall'estero."
    goals: [budget]
    new: [{lemma: tenuta, gloss: country estate}, {lemma: cascina, gloss: farmhouse}]
  - learner: "Sono tutte e due una tentazione. Però metà degli invitati arriva dall'Irlanda, quindi la Toscana è più pratica. Scegliamo la cascina, se ha spazio per un gruppo musicale."
  - tutor: "Lo spazio c'è, e anche un bel giardino per ballare. Avete richieste particolari, prima che io cominci a chiedere i prezzi?"
    goals: [choices]
  - learner: "Sì, un paio. Il menù vorremmo assaggiarlo prima, e il preventivo finale ce lo deve mandare entro un mese. E per favore, quando parla con il fotografo, dica lui che non vogliamo foto in posa."
    errors: [object-pronoun]
  - tutor: "L'assaggio del menù è già previsto, e il preventivo arriverà in tempo. Mi ripete l'ultima richiesta? In \"dica lui\" il pronome non è quello giusto, e nemmeno al posto giusto."
    prompt: {text: "dica lui", tags: [object-pronoun]}
  - learner: "Gli dica che non vogliamo foto in posa."
  - tutor: "Esatto, glielo dirò: solo foto spontanee. Vi mando tutto per iscritto entro venerdì. Sarà un matrimonio splendido!"
    goals: [conditions]

# C1, correction-dense (continued): congiuntivo dopo congiunzioni, concordanza, calchi, falsi amici.
- scenario: turismo-di-massa
  level: C1
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno, mi chiamo Marco e insegno a Firenze da otto anni. Sono contrario al ticket, almeno nella forma attuale: trasforma la città in un parco a tema e non risolve niente."
  - tutor: "Posizione netta, grazie Marco. Però mi lasci fare l'avvocato del diavolo: i numeri dicono che qualcosa bisogna pur fare. Ha un esempio concreto di quello che non funziona?"
    goals: [introduce]
  - learner: "Certo. A Venezia il ticket è stato introdotto in via sperimentale, ma nei giorni peggiori la folla era la stessa. E il Comune ha incassato milioni senza che i residenti ne vedevano un euro."
    errors: [subjunctive-use]
  - tutor: "Un dato che fa riflettere. Si fermi però su \"senza che\": dopo questa espressione il verbo non può restare così. Come lo direbbe?"
    prompt: {text: "senza che i residenti ne vedevano", tags: [subjunctive-use]}
  - learner: "Senza che i residenti ne vedessero un euro, volevo dire."
  - tutor: "Ecco, così è impeccabile. Ma le faccio un'obiezione: senza il ticket, con quali soldi si pagano la pulizia e i servizi che i turisti consumano?"
    goals: [example]
  - learner: "Non nego che i turisti abbiano un costo. Però ci sono strumenti più efficaci: limitare le grandi navi da crociera, che scaricano migliaia di persone in poche ore, e fissare un tetto agli affitti brevi nel centro storico."
  - tutor: "Le crociere, un tema sempre caldo. E se domani mattina dovesse proporre al sindaco una soluzione realistica, da dove partirebbe?"
    goals: [rebut]
  - learner: "Partirei dalle prenotazioni obbligatorie per i gruppi organizzati, che sono quelli che intasano i ponti. Bisognerebbe che il Comune li distribuirebbe su tutta la giornata, invece di concentrarli al mattino."
    errors: [subjunctive-use]
  - tutor: "Proposta interessante. Dopo \"bisognerebbe che\", però, quel condizionale non va: quale modo, e quale tempo, ci vogliono qui?"
    prompt: {text: "il Comune li distribuirebbe", tags: [subjunctive-use]}
    new: [{lemma: condizionale, gloss: conditional}]
  - learner: "Bisognerebbe che il Comune li distribuisse su tutta la giornata."
  - tutor: "Perfetto. Prenotazioni per i gruppi e orari distribuiti sull'intera giornata: lo giro subito all'assessore, che magari ci sta ascoltando. Grazie della telefonata, Marco!"
    goals: [proposal]

- scenario: turismo-di-massa
  level: C1
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno! Mi chiamo Javier e da sei anni lavoro come cuoco in una trattoria vicino a Rialto. Sono a favore del ticket, anche se lo farei molto più caro."
  - tutor: "Più caro, addirittura! Ma lei lavora proprio con chi viene in vacanza: non ha paura di perdere clienti?"
    goals: [introduce]
  - learner: "Al contrario: la mia trattoria dipende dei residenti e dei turisti che restano qualche giorno, non di quelli che arrivano alle nove e ripartono alle cinque con un panino in mano."
    errors: [preposition]
  - tutor: "Distinzione interessante. Solo una cosa: \"dipende dei\"? In spagnolo funzionerebbe, ma in italiano questo verbo regge un'altra preposizione. Quale?"
    prompt: {text: "dipende dei residenti", tags: [preposition]}
  - learner: "Ah, sì: dipende dai residenti e da quelli che restano qualche giorno."
  - tutor: "Esatto. Mi faccia allora un esempio concreto: che cosa le complica la vita, oggi?"
  - learner: "Per esempio, a maggio la nostra calle è così piena che i fornitori non riescono a passare con i carrelli. Una mattina il pesce è arrivato alle undici, quando avevamo già cominciato a servire."
  - tutor: "Un'immagine che rende bene l'idea. Ma qui faccio l'avvocato del diavolo: un ticket più caro non rischia di trasformare Venezia in una città per ricchi?"
    goals: [example]
  - learner: "Capisco l'obiezione, ma la città è già per ricchi: negli ultimi anni gli affitti sono saliti in forma esagerata e molti residenti se ne sono andati."
    errors: [word-choice]
  - tutor: "Saliti in modo esagerato, eccome: lo confermano anche i dati sullo spopolamento. Allora, se il sindaco fosse lei, che cosa proporrebbe?"
    recast: {text: "in forma esagerata", fix: "in modo esagerato", tags: [word-choice]}
    goals: [rebut]
  - learner: "Proporrei un ticket più caro nei giorni di punta e gratuito per chi dorme in città. Con i soldi incassati offrirei case a prezzi bassi alle giovani famiglie."
  - tutor: "Prezzi diversi a seconda dei giorni e case per le famiglie: una proposta chiara, di cui sicuramente si parlerà. Grazie, Javier, e buon lavoro!"
    goals: [proposal]

- scenario: vita-in-italia
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie per l'invito. Sono arrivata da Valencia nove anni fa per un dottorato in archeologia, e alla fine sono rimasta: ho trovato lavoro in un liceo di Bari e, soprattutto, ho trovato casa."
  - tutor: "Da Valencia a Bari: almeno il mare non le è mancato! E qual è stata la parte più difficile?"
    goals: [story]
  - learner: "Paradossalmente, non la lingua ma i rapporti con i colleghi. Prima di arrivare pensavo che gli italiani sono più aperti degli spagnoli, invece a scuola ci ho messo anni per integrare davvero."
    errors: [subjunctive-use, reflexive]
  - tutor: "Interessante, ribalta un luogo comune. Torniamo però a \"pensavo che sono\": la principale è al passato ed esprime un'opinione. Che cosa succede al verbo che segue?"
    prompt: {text: "pensavo che gli italiani sono", tags: [subjunctive-use]}
  - learner: "Pensavo che gli italiani fossero più aperti degli spagnoli."
  - tutor: "Esatto, adesso il ragionamento fila. E in questi anni lei come è cambiata?"
    goals: [difficulties]
  - learner: "Sono diventata più paziente. In Spagna mi arrabbiavo se una pratica richiedeva un mese; qui ho imparato che le cose arrivano, prima o poi. E ho smesso di cenare alle dieci!"
  - tutor: "Quindi l'Italia l'ha resa più paziente e anche un po' più italiana a tavola! Che consiglio darebbe a un ascoltatore che sta pensando di trasferirsi?"
    goals: [change]
  - learner: "Gli direi di non avere fretta. Se io avrei saputo che servivano due anni per farmi degli amici veri, non mi sarei scoraggiata così tanto all'inizio."
    errors: [hypothetical]
  - tutor: "Un consiglio prezioso. Ascolti però l'inizio dell'ipotesi: dopo quel \"se\" il condizionale non trova posto. Ci riprova?"
    prompt: {text: "Se io avrei saputo", tags: [hypothetical]}
  - learner: "Se avessi saputo che servivano due anni, non mi sarei scoraggiata così tanto."
  - tutor: "Perfetto. Pazienza e niente fretta: un consiglio che vale per tutti, anche per chi è nato qui. Grazie di essere stata con noi!"
    goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie a voi. Sono arrivata a Milano sette anni fa per un trasferimento interno: la mia banca aveva aperto una sede qui e cercava qualcuno che parlasse inglese e conoscesse il mercato europeo."
  - tutor: "Quindi, all'inizio, l'Italia l'ha scelta la sua banca più di lei! Qual è stata la difficoltà più grande?"
    goals: [story]
  - learner: "Senz'altro la burocrazia. Ricordo che dopo tre mesi non avevo ancora il codice fiscale, e solo allora ho realizzato che senza quel numero non potevo nemmeno fare un contratto per il telefono."
    errors: [false-friend]
  - tutor: "Il famoso codice fiscale! Quando si è resa conto che senza quel numero era bloccata, avrà avuto voglia di ripartire subito. E oggi, dopo sette anni, si sente cambiata?"
    recast: {text: "ho realizzato", fix: "si è resa conto", tags: [false-friend]}
    goals: [difficulties]
  - learner: "Molto. Prima separavo nettamente il lavoro e la vita privata; adesso pranzo con i colleghi e parliamo di tutto. All'inizio mi sembrava strano, ora non ne potrei più fare a meno."
  - tutor: "Non poterne più fare a meno: questa sì che è integrazione! Che consiglio darebbe a chi sta pensando di trasferirsi?"
    goals: [change]
  - learner: "Di imparare la lingua prima di partire, benché il lavoro si svolge spesso in inglese. Se l'avessi studiata prima, mi sarei integrata molto più in fretta."
    errors: [subjunctive-use]
  - tutor: "Ottimo consiglio. Un dettaglio su \"benché\", però: a differenza di \"anche se\", dopo questa parola il verbo cambia modo. Quale?"
    prompt: {text: "benché il lavoro si svolge", tags: [subjunctive-use]}
  - learner: "Benché il lavoro si svolga spesso in inglese. E poi direi di non prendere tutto sul personale quando gli uffici sono lenti: non ce l'hanno con te."
  - tutor: "Esatto. Studiare prima e non prendersela: due consigli d'oro. Grazie di essere stata con noi!"
    goals: [advice]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Dai, non essere così catastrofico! Io credo che alcuni lavori cambieranno, ma non spariranno. Anche quando sono arrivati i computer tutti dicevano la stessa cosa, e invece guarda quanti mestieri nuovi sono nati."
  - tutor: "Sì, ma i computer non scrivevano articoli e non facevano le visite mediche. Stavolta tocca anche a chi ha studiato, non solo agli operai."
    goals: [position]
  - learner: "Su questo hai ragione, è diverso. Però guarda il mio caso: faccio la traduttrice e uso questi strumenti ogni giorno. Il lavoro non è sparito, è cambiato. Se non li userei, sarei più lenta e meno competitiva."
    errors: [hypothetical]
  - tutor: "Un esempio concreto, finalmente! Ma quel \"se non li userei\" mi suona strano: nell'ipotesi, dopo \"se\", che cosa ci vuole?"
    prompt: {text: "Se non li userei", tags: [hypothetical]}
  - learner: "Se non li usassi, sarei più lenta e meno competitiva."
  - tutor: "Brava. Però ammetterai che non tutti i traduttori se la cavano come te: tanti colleghi avranno perso clienti."
    goals: [evidence]
  - learner: "Questo è vero, non lo nego. Una mia amica ha perso il suo cliente principale l'anno scorso, e non perché lavorasse male: semplicemente l'agenzia ha deciso di risparmiare."
  - tutor: "Ecco, vedi? E l'agenzia risparmia sulla pelle di chi lavora bene. Allora, dove ci incontriamo noi due?"
    goals: [concede]
  - learner: "Direi che il problema non è lo strumento, ma come lo si usa. Sarebbe ora che le aziende investono nella formazione invece di licenziare alla prima occasione."
    errors: [subjunctive-use]
  - tutor: "Qui mi trovi d'accordo. Però \"sarebbe ora che\" è un'espressione esigente: con quel condizionale davanti, il verbo che segue non può restare all'indicativo."
    prompt: {text: "Sarebbe ora che le aziende investono", tags: [subjunctive-use]}
  - learner: "Sarebbe ora che le aziende investissero nella formazione."
  - tutor: "Perfetto. Allora brindiamo a questo: meno paura della tecnologia e più formazione per tutti. Su questo, almeno, siamo d'accordo!"
    goals: [conclude]

- scenario: notizie-attualita
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, l'ho letta ieri sera. Il governo vuole introdurre un codice identificativo per ogni appartamento e un limite di notti nei centri storici. Chi non si mette in regola rischia multe salate."
  - tutor: "Questo è quello che dicono i comunicati. Ma tu che ne pensi, è una buona idea?"
    goals: [summarise]
  - learner: "Secondo me l'idea fa senso, perché nelle città d'arte i residenti non trovano più case in affitto. Però temo che senza controlli seri resti solo sulla carta."
    errors: [word-choice]
  - tutor: "L'idea ha senso sulla carta, appunto: ma chi li fa questi controlli, con i pochi vigili che ci sono? Hai visto come l'hanno raccontata i vari giornali?"
    recast: {text: "l'idea fa senso", fix: "l'idea ha senso", tags: [word-choice]}
    goals: [opinion]
  - learner: "Sì, e la differenza mi ha colpito. Un quotidiano economico titolava che la legge avrebbe ammazzato il turismo, mentre un giornale locale l'ha presentata come la salvezza dei residenti. Sembrava che parlavano di due leggi diverse."
    errors: [subjunctive-use]
  - tutor: "Bella osservazione. Torna però sull'ultima frase: dopo \"sembrava che\" il verbo non può restare così. Prova a sistemarla."
    prompt: {text: "Sembrava che parlavano", tags: [subjunctive-use]}
  - learner: "Sembrava che parlassero di due leggi diverse."
  - tutor: "Esatto. Del resto è il bello dei giornali: ognuno ci vede quello che vuole. E secondo te come andrà a finire?"
    goals: [sources]
  - learner: "Credo che eventualmente molti proprietari torneranno agli affitti lunghi, almeno nelle grandi città. Ma qualcuno troverà il modo di aggirare la legge, come sempre."
    errors: [false-friend]
  - tutor: "Alla fine, dici? Speriamo, ma io ho i miei dubbi: i furbi una scappatoia la trovano sempre. Tu, se avessi un appartamento in centro, che cosa faresti?"
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    goals: [consequences]
  - learner: "Probabilmente lo affitterei a uno studente con un contratto regolare: guadagnerei meno, ma dormirei sonni tranquilli."
  - tutor: "Saggio, molto più di tanti proprietari che conosco. Dai, il caffè è finito: torniamo di sopra prima che il capo ci veda."

- scenario: mediazione-colleghi
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Nessun disturbo, anzi, ha fatto bene a venire. Si sieda pure e mi racconti con calma che cosa l'ha ferita."
  - tutor: "Ieri Luca ha presentato al direttore l'analisi dei costi come se fosse tutta sua. Ci ho lavorato tre settimane, anche nei fine settimana, e lui non mi ha nemmeno nominata."
  - learner: "Capisco perfettamente, al suo posto sarei arrabbiato anch'io. Mi aiuti a capire una cosa: è possibile che Luca volesse presentare il lavoro a nome di tutta la squadra?"
  - tutor: "Può darsi, ma allora perché ha detto \"ho calcolato\" e non \"abbiamo calcolato\"? Le parole contano."
    goals: [listen]
  - learner: "Ha ragione, le parole contano. Prima di trarre conclusioni, però, vorrei sapere una cosa: lei gli aveva detto che voleva presentare i risultati insieme, o lo dava per supposto?"
    errors: [word-choice]
  - tutor: "Lo davo per scontato, lo ammetto: lavoriamo insieme da anni. Ma non credo che serva un accordo scritto per ringraziare una collega."
    recast: {text: "per supposto", fix: "per scontato", tags: [word-choice]}
    goals: [clarify]
  - learner: "Certo che no. Però conosco Luca: davanti al direttore si agita molto. Non escludo che abbia parlato così per nervosismo, senza rendersi conto che stava cancellando il suo contributo."
  - tutor: "Nervoso, lui? Ha parlato per dieci minuti senza esitare. Comunque, ammettiamo pure che sia così: adesso che cosa propone?"
    goals: [perspective]
  - learner: "Propongo di parlarne tutti e tre insieme domani mattina. Vorrei che Luca le chiede scusa direttamente e che, nella prossima riunione, fosse lei a presentare la seconda parte dell'analisi."
    errors: [subjunctive-use]
  - tutor: "Mi sembra un buon inizio. Solo una cosa: nella seconda parte della frase il verbo l'ha concordato bene con \"vorrei che\". E nella prima, con Luca?"
    prompt: {text: "Vorrei che Luca le chiede scusa", tags: [subjunctive-use]}
  - learner: "Vorrei che Luca le chiedesse scusa direttamente."
  - tutor: "Così va benissimo, e anche la proposta mi convince. D'accordo, domani mattina alle nove: però voglio che sia lui a cominciare."
    goals: [solution]

- scenario: reclamo-comune
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Abito in via dei Mille, al numero 12. Da due mesi davanti a casa mia c'è uno scavo aperto, recintato con transenne di plastica, e dalla fine di settembre non si vede un operaio."
  - tutor: "Capisco. Ha già fatto una segnalazione, oppure è la prima volta che si rivolge a noi?"
    goals: [describe]
  - learner: "Ne ho fatto due, per telefono, ma nessuno mi ha richiamato. Il marciapiede è bloccato e mia moglie, che usa il deambulatore, deve camminare in mezzo alla strada."
    errors: [participle-agreement]
  - tutor: "Mi dispiace molto per sua moglie. Una cosa su \"ne ho fatto due\": quel \"ne\" sta per le segnalazioni, e il participio dovrebbe tenerne conto."
    prompt: {text: "Ne ho fatto due", tags: [participle-agreement]}
  - learner: "Ne ho fatte due, giusto. Ma nessuno mi ha mai richiamato."
  - tutor: "Perfetto. Guardi, il cantiere è di competenza dell'ufficio tecnico: probabilmente stanno aspettando qualche materiale. Le consiglierei di pazientare ancora qualche settimana."
  - learner: "Con tutto il rispetto, \"qualche settimana\" non mi basta. Sono già stati due mesi e nessuno ci ha spiegato niente. Vorrei sapere chi è il responsabile e quando i lavori saranno conclusi."
    errors: [word-choice]
  - tutor: "Ha ragione, sono già passati due mesi ed è comprensibile che lei voglia una risposta precisa. Posso protocollare un reclamo formale: a quel punto l'ufficio tecnico è tenuto a risponderle per iscritto entro trenta giorni."
    recast: {text: "Sono già stati due mesi", fix: "sono già passati due mesi", tags: [word-choice]}
    goals: [insist]
  - learner: "E se entro trenta giorni non si riceve nessuna risposta, che cosa si può fare?"
  - tutor: "In quel caso può presentare un sollecito e, se necessario, rivolgersi al difensore civico. Trova tutto spiegato anche sul retro del modulo."
    goals: [rights]
  - learner: "Benissimo, allora procediamo con il reclamo formale. Mi può dare un numero di protocollo, così posso seguire la pratica?"
  - tutor: "Certo. Ecco la ricevuta, con il numero di protocollo 2318 di oggi. Sopra trova anche il nome del responsabile dell'ufficio tecnico."
    goals: [commitment]

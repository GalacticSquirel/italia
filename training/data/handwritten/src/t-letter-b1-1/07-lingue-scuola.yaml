# B1 real-learner letters (round 7): describing how one learned foreign languages, at school and
# abroad. The tutor is a friend walking with the learner and asking about their school years.
- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [possessive, tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "In un piccolo paese in campagna, lontano dalla città."
    - tutor: "E lì a scuola si studiavano le lingue straniere?"
      goals: [place]
    # merlin-1325_1001110-2
    - learner: "Purtroppo, nel mio paese non c'erano e anche oggi non ci sono tante opportunità per imparare una lingua straniera."
    - tutor: "Davvero? Neanche l'inglese?"
    # merlin-1325_1001110-3
    - learner: "Si studiano al massimo due lingue e queste sono di solito il russo e l'inglese."
    - tutor: "Ah, quindi un po' di inglese sì. E dove l'hai imparato bene, allora?"
      goals: [school]
    # merlin-1325_1001110-4
    - learner: "Grazie a miei genitori sono andata a Londra tre anni fa ad imparare l'inglese."
      errors: [possessive]
    - tutor: "Che fortuna! Ma «grazie a miei genitori»: con «genitori», al plurale, davanti a «miei» ci vuole l'articolo. Come diventa con «a»?"
      prompt: {text: "a miei genitori", tags: [possessive]}
    - learner: "Grazie ai miei genitori, sì. Loro hanno pagato il corso."
    - tutor: "Esatto. Che bel regalo! E com'è stata Londra?"
    # merlin-1325_1001110-5
    - learner: "Era una delle più belle esperienza che io abbia mai vissuto."
      errors: [tense-aspect, noun-number]
    - tutor: "Che bello! Ma «era»: parli di un'esperienza finita, che giudichi tutta intera. Che tempo usiamo?"
      prompt: {text: "Era una delle più belle", tags: [tense-aspect]}
    - learner: "È stata una delle più belle esperienze della mia vita."
    - tutor: "Esatto. E che cosa facevate a lezione?"
      goals: [event]
    # merlin-1325_1001110-8
    - learner: "Facevamo molti esercizi insieme, parlavamo, discutevamo sui diversi argomenti."
    - tutor: "Una scuola molto diversa da quella del tuo paese, allora!"
      goals: [habits]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-heritage
  history: [tense-aspect, demonstrative]
  turns:
    - tutor: "Che bello qui! Ti ricordi la tua scuola? Adesso sei all'ultimo anno, vero?"
    # merlin-1325_1001121-1
    - learner: "Quest'anno è l'ultimo anno nel mio liceo."
    - tutor: "E poi? Hai già deciso?"
      goals: [school]
    # merlin-1325_1001121-2
    - learner: "Vorrei andare all'università di legge."
    - tutor: "Legge, che bello! E le lingue? Ti serviranno."
    # merlin-1325_1001121-5
    - learner: "Un anno fa cominciavo studiare l'italiano."
      errors: [tense-aspect, preposition]
    - tutor: "Lo parli già bene! Ma «un anno fa cominciavo»: è un momento preciso, un inizio. Che tempo usiamo?"
      prompt: {text: "Un anno fa cominciavo", tags: [tense-aspect]}
    - learner: "Un anno fa ho cominciato a studiare l'italiano."
    - tutor: "Esatto. E prima, da piccolo, dove abitavi?"
    - learner: "A Leeds, in una casa vicino al parco. Giocavo a calcio tutti i giorni."
    - tutor: "Anche io giocavo sempre a calcio, qui in piazza! E le lingue, adesso, le usi spesso?"
      goals: [place, habits]
    # merlin-1325_1001121-7
    - learner: "Attualmente io non uso le queste lingue spesso solo quando andiamo all'estero con la mia famiglia o la mia classe."
      errors: [demonstrative]
    - tutor: "Capisco. Ma «le queste lingue»: con «queste», ci vuole anche «le»?"
      prompt: {text: "le queste lingue", tags: [demonstrative]}
    - learner: "Non uso spesso queste lingue, solo in viaggio."
    - tutor: "Esatto. E qual è il viaggio che ricordi di più?"
    - learner: "Il viaggio a Roma con la classe: ho parlato italiano con un tassista per mezz'ora!"
    - tutor: "Mezz'ora con un tassista di Roma, che coraggio!"
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-retired
  history: [tense-aspect, preposition]
  turns:
    - tutor: "Che bello qui! Tu, quando eri piccolo, studiavi già le lingue?"
    # merlin-1325_1001138-3
    - learner: "Prima di tutto vorrei raccontare qualche parola sulle lingue che ho studiato queste lingue erano l'inglese e l'italiano."
    - tutor: "L'inglese e l'italiano, bene! E quale hai cominciato prima?"
    # merlin-1325_1001138-4
    - learner: "Avevo cominciato studiare l'inglese e poi ho fatto un corso estivo dove ho conosciuto la lingua italiana."
      errors: [preposition]
    - tutor: "Un corso d'estate, che bello! Ma «cominciato studiare»: tra «cominciare» e l'infinito, che preposizione mettiamo?"
      prompt: {text: "cominciato studiare", tags: [preposition]}
    - learner: "Avevo cominciato a studiare l'inglese a scuola, a dieci anni."
    - tutor: "Esatto. E il corso d'estate dov'era?"
      goals: [school]
    - learner: "A Perugia. Ogni mattina avevamo lezione e il pomeriggio andavamo in giro."
    - tutor: "Perugia è bellissima! E da allora non hai più smesso?"
      goals: [place, habits]
    # merlin-1325_1001138-5
    - learner: "Ho studiato queste lingue da cinque anni e sono riuscito a fare gli esami."
      errors: [tense-aspect]
    - tutor: "Bravo per gli esami! Ma «ho studiato... da cinque anni»: le studi ancora oggi? Allora che tempo usiamo con «da»?"
      prompt: {text: "Ho studiato queste lingue da cinque anni", tags: [tense-aspect]}
    - learner: "Studio queste lingue da cinque anni, e continuo."
    - tutor: "Esatto. E adesso le usi?"
    # merlin-1325_1001138-6
    - learner: "Uso queste due lingue per il mio lavoro, perché sono un giurista e devo fare conversazioni e devo scrivere documenti in lingue straniere."
    - tutor: "Un giurista che scrive in italiano, che bravo! Ti ricordi il primo documento?"
    - learner: "Sì, un contratto per un cliente di Milano: ci ho messo tre giorni!"
    - tutor: "Tre giorni! Ma ce l'hai fatta."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Che bello qui! Raccontami: com'era la tua scuola, quando hai cominciato con le lingue?"
    # merlin-1325_1001125-0
    - learner: "Vorrei presentare i miei costumi e le mie esperienze d'imparare delle lingue straniere."
      errors: [false-friend, preposition]
    - tutor: "Con piacere! Ma «i miei costumi»? Il costume è quello per il mare, o per Carnevale. Che parola vuoi dire?"
      prompt: {text: "i miei costumi", tags: [false-friend]}
    - learner: "Le mie abitudini, scusa! Come studio le lingue."
    - tutor: "Esatto, ecco! Allora dimmi."
    # merlin-1325_1001125-1
    - learner: "Studio all'Università di Budapest nel Dipartimento d'Italiano così uso la lingua italiana spesso, ma parlo anche inglese, l'ho imparato al liceo e negli anni d'Università lo pratico."
    - tutor: "Quindi l'inglese a scuola e l'italiano all'università. Abitavi già a Budapest da bambina?"
      goals: [school, habits]
    - learner: "No, abitavo in un piccolo paese vicino al lago Balaton."
    - tutor: "Il Balaton! Che bello, d'estate ci andavate a nuotare?"
      goals: [place]
    - learner: "Sì, ogni giorno. Una volta ho visto una tempesta enorme sul lago, avevo paura!"
    - tutor: "Che ricordo! E da grande cosa vuoi fare?"
      goals: [event]
    # merlin-1325_1001125-5
    - learner: "Io vorrei diventare una professoressa d'italiano perché secondo me per gli studenti è utile che possono comunicare in un altra lingua con la gente."
    - tutor: "Saresti una professoressa bravissima, si sente quanto ami le lingue!"

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-traveller
  history: [relative-pronoun, articulated-preposition]
  turns:
    - tutor: "Che bello qui! Al liceo che lingue studiavi?"
    # merlin-1325_1001134-3
    - learner: "Ora imparo due lingue: l'italiano e naturalmente l'inglese."
    - tutor: "E le hai cominciate al liceo?"
    - learner: "Sì, l'italiano quasi quattro anni fa. Avevamo una professoressa di Torino, simpaticissima."
    - tutor: "Che fortuna! E dove andavi a scuola?"
      goals: [school]
    - learner: "A Graz, in un liceo vicino a casa. Ci andavo in bicicletta."
    - tutor: "In bicicletta, anche d'inverno? Che coraggio!"
      goals: [place, habits]
    # merlin-1325_1001134-7
    - learner: "Vorrei inoltre spendere qualche parola sull'effetto mi fa imparare una lingua straniera."
      errors: [relative-pronoun]
    - tutor: "Dimmi! Ma «l'effetto mi fa»: tra «effetto» e «mi fa», che parola serve per collegarli?"
      prompt: {text: "l'effetto mi fa", tags: [relative-pronoun]}
    - learner: "L'effetto che mi fa: mi sento un'altra persona!"
    - tutor: "Esatto. Bello, succede anche a me con l'inglese."
    # merlin-1325_1001134-11
    - learner: "A dire la verità attualmente la lingua italiana è più importante per me perché vorrei studiare e poi lavorare in Italia."
    - tutor: "Allora ci vedremo spesso! C'è un ricordo della scuola che ti ha fatto amare l'italiano?"
    - learner: "Sì, una gita a Venezia in quarta: ho ordinato un gelato in italiano e ha funzionato!"
    - tutor: "Il primo gelato ordinato in italiano non si dimentica mai!"
      goals: [event]
    # merlin-1325_1001134-12
    - learner: "Alle fine a mio parere imparare la lingua straniera è molto utile per tutti."
      errors: [articulated-preposition]
    - tutor: "Sono d'accordo! Ma «alle fine»: «fine» qui è singolare. Come diventa «alle»?"
      prompt: {text: "Alle fine", tags: [articulated-preposition]}
    - learner: "Alla fine, sì. Imparare una lingua è utile per tutti."
    - tutor: "Esatto, e anche divertente."

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-teacher
  history: [tense-aspect, preposition]
  turns:
    - tutor: "Che bello qui! Tu l'italiano l'hai studiato a scuola, da ragazza?"
    # merlin-1325_1001048-0
    - learner: "Io non ho studiato mai l'italiano nell'scuola, solo all'estero."
      errors: [preposition]
    - tutor: "Davvero? Ma «nell'scuola»: per dire che si studia lì, di solito, con «scuola» che preposizione usiamo?"
      prompt: {text: "nell'scuola", tags: [preposition]}
    - learner: "A scuola, sì. A scuola studiavo solo inglese e francese."
    - tutor: "Esatto. E dove l'hai imparato, allora?"
      goals: [school]
    # merlin-1325_1001048-6
    - learner: "Ero a Caserta italia da tre mesi, quando ho studiato all'estero."
      errors: [tense-aspect, preposition]
    - tutor: "Caserta, che bello! Ma «ero... da tre mesi»: è un periodo chiuso, finito. Che tempo usiamo?"
      prompt: {text: "Ero a Caserta", tags: [tense-aspect]}
    - learner: "Sono stata a Caserta per tre mesi, all'università."
    - tutor: "Esatto. E com'era la vita lì?"
      goals: [place]
    - learner: "Ogni sera mangiavamo la pizza con gli amici e parlavamo fino a tardi."
    - tutor: "Il modo migliore per imparare! Secondo te, basta studiare sui libri?"
      goals: [habits]
    # merlin-1325_1001048-3
    - learner: "Allora secondo me è molto importante se vuoi conoscere l'altra cultura, non solo la lingua."
    - tutor: "Hai proprio ragione. E adesso usi ancora l'italiano?"
    # merlin-1325_1001048-7
    - learner: "Attualmente uso il mio italiano quando parlo con i miei amici italiani."
    - tutor: "Quelli di Caserta? Vi sentite ancora?"
    - learner: "Sì, e l'anno scorso sono venuti al mio matrimonio, è stato bellissimo."
    - tutor: "Che bel ricordo, gli amici di Caserta al matrimonio! Ora però devo scappare, ho lezione."
      goals: [event]
    # merlin-1325_1001048-12
    - learner: "Buona giornata!"
    - tutor: "Buona giornata anche a te, ci sentiamo!"

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-professional
  history: [article-use, preposition]
  turns:
    - tutor: "Che bello qui! Ma tu come mai parli così bene l'italiano?"
    # merlin-1325_9000533-0
    - learner: "Studio la lingua italiana da anni perché ho la famiglia in Italia e da bambina ero sempre legata all'italiano."
    - tutor: "Ah, la famiglia italiana! E da bambina dove abitavi?"
    - learner: "A Melbourne, ma ogni estate andavamo dai nonni in Sicilia."
    - tutor: "Che estati! Al mare tutti i giorni, immagino."
      goals: [place, habits]
    - learner: "Sì, e a scuola in Australia facevo anche un'ora di italiano al sabato."
    - tutor: "Anche il sabato, che brava! E adesso a cosa ti serve?"
      goals: [school]
    # merlin-1325_9000533-3
    - learner: "Ma in futuro vorrei usare italiano per esempio nel lavoro."
      errors: [article-use]
    - tutor: "Ottima idea. Ma «usare italiano»: con il nome della lingua dopo «usare», ci vuole qualcosa davanti?"
      prompt: {text: "usare italiano", tags: [article-use]}
    - learner: "Vorrei usare l'italiano nel lavoro, magari in un'azienda di vini."
    - tutor: "Esatto. Con i nonni in Sicilia, i vini li conosci già!"
    # merlin-1325_9000533-6
    - learner: "Ai questi tempi se uno vuole avere un lavoro buono, deve conoscere bene almeno una lingua straniera."
      errors: [preposition]
    - tutor: "Verissimo. Ma «ai questi tempi»: davanti a «questi», che preposizione semplice usiamo?"
      prompt: {text: "Ai questi tempi", tags: [preposition]}
    - learner: "In questi tempi, sì."
    - tutor: "Esatto. Ti ricordi la prima parola italiana che hai imparato?"
    # merlin-1325_9000533-7
    - learner: "Per questo ho scelto l'italiano."
    - tutor: "Certo, per il lavoro e per la famiglia. Ma la prima parola?"
    - learner: "«Basta!», perché la nonna me lo diceva sempre."
    - tutor: "Ahah, «basta!», classico delle nonne italiane!"
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-heritage
  history: [adjective-agreement, auxiliary-choice]
  turns:
    - tutor: "Che bello qui! E tu, ti piacciono le lingue?"
    # merlin-1325_1001042-1
    - learner: "Amo molto le lingue stranieri e ne parlo due."
      errors: [adjective-agreement]
    - tutor: "Due, bravo! Ma «le lingue stranieri»: «lingue» è femminile plurale. E allora «stranieri»?"
      prompt: {text: "lingue stranieri", tags: [adjective-agreement]}
    - learner: "Le lingue straniere, giusto."
    - tutor: "Esatto. E dove le hai imparate? Da piccolo abitavi già qui?"
    # merlin-1325_1001042-2
    - learner: "Quando ero piccolo, ho abituato in Olanda per quattro anni e sono potuto parlare la lingua olandese, ma purtroppo l'ho dimenticata dopo che ero ritornato in Ungheria."
      errors: [word-choice, auxiliary-choice]
    - tutor: "In Olanda, che bello! Ma «sono potuto parlare»: con «parlare», il verbo che usa «potere» prende quale ausiliare?"
      prompt: {text: "sono potuto parlare", tags: [auxiliary-choice]}
      new: [{lemma: ausiliare, gloss: auxiliary verb}]
    - learner: "Ho potuto parlare olandese, ma poi l'ho dimenticato."
    - tutor: "Esatto. Peccato, però! E a scuola, poi, in Ungheria?"
      goals: [place]
    - learner: "Al liceo ho fatto una classe con tante ore di inglese."
    - tutor: "Ecco la seconda lingua! E come la tieni viva oggi?"
      goals: [school]
    # merlin-1325_1001042-4
    - learner: "Oggigiorno uso molto la lingua inglese perché leggo molti libri e vedo i film in inglese."
    - tutor: "Ottima idea. Ti ricordi qualcosa dell'Olanda?"
      goals: [habits]
    - learner: "Sì, andavo a scuola in bicicletta, anche sotto la pioggia, e una volta sono caduto in un canale!"
    - tutor: "In un canale! Questo sì che è un ricordo speciale."
      goals: [event]

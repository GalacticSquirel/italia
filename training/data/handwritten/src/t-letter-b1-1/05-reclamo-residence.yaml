# B1 real-learner letters (round 7): complaints about a holiday residence that did not match
# its advert. The tutor is the receptionist the complaint was written to.
- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [subject-verb-agreement, object-pronoun]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000136-0
    - learner: "Sono stato contentissimo di andare in vacanze, perché lavoro tanto e così ho prenotato direttamente dopo aver letto il vostro annuncio una vacanza da voi."
    - tutor: "Grazie per averci scelto. Ma mi sembra che qualcosa non sia andato bene?"
    # merlin-1325_9000136-3
    - learner: "Ma quasi nessuna delle cose che offrite nel vostro annuncio sono state realizzate."
      errors: [subject-verb-agreement]
    - tutor: "Mi dispiace. Ma «quasi nessuna delle cose... sono state»: «nessuna» è singolare o plurale? E allora il verbo?"
      prompt: {text: "sono state realizzate", tags: [subject-verb-agreement]}
    - learner: "Quasi nessuna è stata realizzata."
    - tutor: "Esatto. Mi spieghi meglio: che cosa mancava?"
      goals: [problem]
    # merlin-1325_9000136-2
    - learner: "Io come giocatore professionale di tennis avevo già tanta voglia di giocare col visto sul lago."
    - tutor: "Ah, lei gioca a tennis! E i campi non andavano bene?"
    - learner: "I campi sono chiusi da lunedì, e anche le barche non si possono noleggiare."
    - tutor: "Ha ragione, purtroppo i campi sono in riparazione da una settimana. Mi dispiace davvero."
      goals: [since]
    # merlin-1325_9000136-6
    - learner: "Allora, come fare dello sport?"
    - tutor: "Capisco benissimo. Che cosa possiamo fare per lei?"
    # merlin-1325_9000136-7
    - learner: "Tutto sommato, io prego di cambiare il vostro annuncio così non si aspetta qualcosa delle vacanze che non viene affatto realizzato!"
      errors: [object-pronoun, reflexive, articulated-preposition]
    - tutor: "Ha ragione. Ma «io prego di cambiare»: chi prega lei? Prima di «prego» ci vuole la parola per «voi»."
      prompt: {text: "io prego", tags: [object-pronoun]}
    - learner: "Io vi prego di cambiare l'annuncio, e vorrei anche uno sconto."
    - tutor: "Esatto. Cambieremo l'annuncio, e le offriamo il venti per cento di sconto. Le va bene?"
      goals: [request]
    - learner: "Sì, va bene, grazie."
    - tutor: "Grazie a lei per la pazienza. Buona serata!"
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [noun-number, article-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001009-4
    - learner: "Il residence è molto vecchio e i muri sono sporchi."
    - tutor: "Mi dispiace molto, lo so che i muri vanno dipinti di nuovo. C'è anche altro?"
      goals: [problem]
    # merlin-1325_1001009-6
    - learner: "Il lago è più lontano e l'autobus c'è solo 2 volta al giorno."
      errors: [noun-number]
    - tutor: "È vero, è un problema. Ma «2 volta»: con «due», il nome resta singolare?"
      prompt: {text: "2 volta", tags: [noun-number]}
    - learner: "Due volte al giorno, e siamo qui da cinque giorni!"
    - tutor: "Esatto, solo due. Cinque giorni così, la capisco. Cosa posso fare per lei?"
      goals: [since]
    # merlin-1325_1001009-8
    - learner: "Vi prego se è possibile un sconto di 30 percento."
      errors: [article-form, articulated-preposition]
    - tutor: "Vediamo. Ma «un sconto»: davanti a parole come «studente» o «sconto», che articolo usiamo?"
      prompt: {text: "un sconto", tags: [article-form]}
    - learner: "Vorrei uno sconto del 30 per cento, se è possibile."
    - tutor: "Esatto. Il trenta è tanto, ma posso darle il venti per cento e un passaggio in macchina al lago ogni mattina."
      goals: [request]
    - learner: "Va bene, accetto. Grazie."
    - tutor: "Grazie a lei, signora. Buonanotte!"
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-heritage
  history: [preposition, reflexive]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000302-6
    - learner: "Avete scritto, ci sono tanti posti per fare lo sport."
    - tutor: "Sì, abbiamo campi da tennis e da calcio. Non li ha trovati?"
    # merlin-1325_9000302-7
    - learner: "È vero ci sono, ma non si possono usare, sono sporchi, non hanno tutto per giocare."
    - tutor: "Ha ragione, mi dispiace: sono chiusi per lavori da due settimane."
      goals: [problem]
    # merlin-1325_9000302-10
    - learner: "Non avete collegamenti per uscire, da vedere i laghi, le montagne."
      errors: [preposition]
    - tutor: "È vero, la zona è un po' lontana da tutto. Ma «da vedere i laghi»: per dire lo scopo, «da» va bene?"
      prompt: {text: "da vedere", tags: [preposition]}
    - learner: "Non c'è niente per vedere i laghi e le montagne."
    - tutor: "Esatto. C'è solo un autobus la mattina. Da quanti giorni siete qui?"
    - learner: "Da sabato, con i bambini."
    - tutor: "Quasi una settimana, allora. Mi dispiace molto."
      goals: [since]
    # merlin-1325_9000302-12
    - learner: "Non c'era niente per rilassare, giocare."
    - tutor: "Capisco, con i bambini è ancora più difficile."
    # merlin-1325_9000302-15
    - learner: "Voi non siete occupati per i vostri ospiti."
      errors: [reflexive, articulated-preposition]
    - tutor: "Mi dispiace che lo pensi. Ma «non siete occupati»: «occuparsi» ha il «si». Come diventa con «voi»?"
      prompt: {text: "non siete occupati", tags: [reflexive]}
    - learner: "Voi non vi siete occupati dei vostri ospiti!"
    - tutor: "Esatto, e ha ragione. Possiamo restituirvi due notti, o trovarvi un albergo sul lago. Cosa preferite?"
      goals: [request]
    # merlin-1325_9000302-14
    - learner: "Voi prendete i soldi e non avete niente per dare."
      errors: [preposition]
    - tutor: "Capisco la rabbia. Ma «niente per dare»: dopo «niente», per una cosa che si può dare, che preposizione usiamo?"
      prompt: {text: "niente per dare", tags: [preposition]}
    - learner: "Non avete niente da dare. Va bene, prendiamo i soldi di due notti."
    - tutor: "Esatto. Allora preparo subito il rimborso per due notti."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000139-0
    - learner: "Il mio soggiorno l'ultima settimana non è stato così grandioso come me lo avevo immagginato."
      errors: [auxiliary-choice, spelling]
    - tutor: "Mi dispiace sentirlo. Ma «me lo avevo...»: con «immaginarsi», che ausiliare usiamo?"
      prompt: {text: "me lo avevo", tags: [auxiliary-choice]}
      new: [{lemma: ausiliare, gloss: auxiliary verb}]
    - learner: "Non è stato così bello come me l'ero immaginato."
    - tutor: "Esatto. Che cosa non è andato bene?"
    # merlin-1325_9000139-1
    - learner: "Già il nome dell'albergo non è realtà."
    - tutor: "Il nome? Vuole dire «Residence del Lago»? Il lago, in effetti, è a quattro chilometri."
    # merlin-1325_9000139-4
    - learner: "In più la stanza è stata caldissima perché l'aria condizionata non funzionava e fuori sono stati 35 °C."
      errors: [tense-aspect, ce-ci-sono]
    - tutor: "Che caldo, mi dispiace! Ma «la stanza è stata caldissima»: parla di com'era la stanza in quei giorni. Che tempo usiamo?"
      prompt: {text: "è stata caldissima", tags: [tense-aspect]}
    - learner: "La stanza era caldissima, ogni notte."
    - tutor: "Esatto. E da quando non funzionava l'aria condizionata?"
      goals: [problem]
    - learner: "Da martedì. L'ho detto due volte alla reception."
    - tutor: "Ha ragione, e nessuno l'ha riparata. Non doveva succedere. Che cosa possiamo fare per lei?"
      goals: [since]
    - learner: "Vorrei un rimborso per le notti con il caldo."
    - tutor: "È giusto: le restituiamo il prezzo di tre notti. Le va bene?"
      goals: [request]
    # merlin-1325_9000139-11
    - learner: "Grazie e tanti saluti."
    - tutor: "Grazie a lei, e mi scusi ancora. Buon viaggio!"
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-erasmus
  history: [adjective-agreement, preposition]
  turns:
    - tutor: "Buongiorno, qui è il Residence del Lago. Mi dica, c'è qualche problema?"
    # merlin-1325_1001018-0
    - learner: "In seguito al soggiorno nel vostro albergo nel mese scorso, ho deciso di scrivere la mia esperienza."
    - tutor: "Certo, la ascolto. Che cosa non le è piaciuto?"
    # merlin-1325_1001018-1
    - learner: "In riferimento al annuncio del albergo, tante cose non erano confortevole."
      errors: [articulated-preposition, adjective-agreement]
    - tutor: "Mi dispiace. Ma «tante cose non erano confortevole»: «cose» è plurale, quindi l'aggettivo?"
      prompt: {text: "confortevole", tags: [adjective-agreement]}
    - learner: "Tante cose non erano confortevoli."
    - tutor: "Esatto. Per esempio?"
    # merlin-1325_1001018-3
    - learner: "Non era possibile a giocare a tennis, perché i campi da tennis era sotto riparazione."
      errors: [preposition, subject-verb-agreement]
    - tutor: "Lo so, purtroppo. Ma «possibile a giocare»: dopo «era possibile», serve quella «a»?"
      prompt: {text: "possibile a giocare", tags: [preposition]}
    - learner: "Non era possibile giocare a tennis, per tutta la settimana."
    - tutor: "Esatto, i campi sono chiusi da inizio luglio."
      goals: [problem, since]
    # merlin-1325_1001018-7
    - learner: "Ho liquidato le spese del mio soggiorno personalmente e direttamente con carta di credito, invece ora Vi prego di trasferirmi un parziale rimborso in ricompensa della mia esperienza."
    - tutor: "Capisco. Possiamo rimborsarle il trenta per cento sulla stessa carta di credito. Va bene?"
      goals: [request]
    - learner: "Sì, va bene così."
    - tutor: "Perfetto, riceverà i soldi entro una settimana."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-student
  history: [articulated-preposition, subject-verb-agreement, tense-aspect]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000135-3
    - learner: "Sono una persona atletica che ama fare dello sport."
    - tutor: "Benissimo, qui di sport se ne può fare tanto!"
    # merlin-1325_9000135-4
    - learner: "Dunque ho scelto il vostro residence per il mio viaggio."
    - tutor: "E qualcosa non è andato come voleva?"
    # merlin-1325_9000135-5
    - learner: "Da voi non c'era la possibilità di nuotare perché la piscina era sempre sovraffollata e anche i corsi di nuoto erano pieni dei partecipanti."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Ma «pieni dei partecipanti»: dopo «pieno», per dire di che cosa, ci vuole proprio l'articolo?"
      prompt: {text: "pieni dei partecipanti", tags: [articulated-preposition]}
    - learner: "I corsi erano pieni di partecipanti."
    - tutor: "Esatto. È vero, in agosto ci sono tanti ospiti."
      goals: [problem]
    # merlin-1325_9000135-7
    - learner: "Normalmente nel mio tempo libero mi piace giocare a tennis ma purtroppo il campo da tennis era in riparazione."
    - tutor: "Sì, i lavori sono cominciati il primo agosto. Sono durati tutta la sua vacanza?"
    - learner: "Sì, tutti i dieci giorni."
    - tutor: "Che peccato. Che cosa possiamo fare per lei?"
      goals: [since]
    # merlin-1325_9000135-8
    - learner: "Tutte queste differenze tra la realtà e l'annuncio pubblicitario mi costringe a richiedere di un parziale rimborso."
      errors: [subject-verb-agreement, preposition]
    - tutor: "Capisco. Ma «tutte queste differenze... mi costringe»: il soggetto è plurale, quindi il verbo?"
      prompt: {text: "mi costringe", tags: [subject-verb-agreement]}
      new: [{lemma: soggetto, gloss: subject}]
    - learner: "Mi costringono a chiedere un rimborso."
    - tutor: "Esatto. Le possiamo restituire il prezzo di tre giorni."
      goals: [request]
    # merlin-1325_9000135-9
    - learner: "Veramente, tutto sommato, il viaggio era piuttosto un inferno che un paradiso."
      errors: [tense-aspect]
    - tutor: "Un inferno, davvero? Ma «il viaggio era»: parla di tutta la vacanza, ormai finita. Che tempo usiamo per dire com'è andata?"
      prompt: {text: "il viaggio era", tags: [tense-aspect]}
    - learner: "Il viaggio è stato un inferno, sì. Ma accetto il rimborso."
    - tutor: "Esatto. Allora le preparo subito il rimborso per tre giorni."
      goals: [agree]
    # merlin-1325_9000135-10
    - learner: "Vi ringrazio in anticipo per la vostra risposta."
    - tutor: "Grazie a lei, e speriamo di rivederla con i campi aperti!"

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition, tense-aspect]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000214-0
    - learner: "Ho prenotato questa vacanza perché ho letto l'annuncio nel giornale «La Repubblica» e mi sembrava un bel posto per trascorrere le nostre vacanze."
      errors: [articulated-preposition]
    - tutor: "Grazie per la fiducia. Ma «nel giornale»: per un articolo o un annuncio, si legge «nel» giornale o con un'altra preposizione?"
      prompt: {text: "nel giornale", tags: [articulated-preposition]}
    - learner: "Ho letto l'annuncio sul giornale. Ma qui non è come nella foto."
    - tutor: "Esatto. Mi dispiace, che cosa non va?"
    # merlin-1325_9000214-2
    - learner: "Però quando siamo arrivati ci siamo accorti subito che i campi da tennis sono in riparazioni e che andare al lago per nuotare è difficile perché è lontano dal residence e ci sono solo pochi collegamenti."
      errors: [tense-aspect, noun-number]
    - tutor: "Ha ragione. Ma «quando siamo arrivati... i campi sono»: parla di quel momento passato. Che tempo usiamo per «sono»?"
      prompt: {text: "sono in riparazioni", tags: [tense-aspect]}
    - learner: "Erano in riparazione, sì, già quando siamo arrivati."
    - tutor: "Esatto. Purtroppo i lavori sono cominciati due settimane fa."
      goals: [problem, since]
    # merlin-1325_9000214-3
    - learner: "C'era infatti una grande differenza tra la realtà e l'annuncio pubblicitario."
    - tutor: "Lo riconosco. Che cosa le possiamo offrire?"
    - learner: "Per questo vi prego di darci un parziale rimborso."
    - tutor: "È giusto. Le rimborsiamo due notti e le diamo le biciclette gratis per andare al lago. Va bene?"
      goals: [request]
    - learner: "Va bene, grazie."
    - tutor: "Grazie a lei. Buona serata!"
      goals: [agree]

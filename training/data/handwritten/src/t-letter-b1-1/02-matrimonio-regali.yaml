# B1 real-learner letters (round 7): more answers to wedding invitations (presents, guests,
# dates). The tutor is the bride or the groom; plural address to the couple is correct.
- scenario: compleanno
  level: B1
  persona: es-f-teacher
  turns:
    - tutor: "Ciao Maria! Hai ricevuto il nostro invito? Ci sposiamo il 20 novembre!"
    # merlin-1365_0100175-0
    - learner: "Congratulazioni per il vostro matrimonio e mille grazie per l'invito!"
    - tutor: "Grazie a te! Allora, pensi di venire?"
    # merlin-1365_0100175-2
    - learner: "Ho tempo per andare e sono molto contenta che posso partecipare!"
    - tutor: "Che bello! Ci sposiamo in Comune alle dieci, poi tutti al ristorante sul lago. Porta anche Paolo, così finalmente lo conosciamo!"
      goals: [date, guests]
    # merlin-1365_0100175-6
    - learner: "Forse avete bisogno di qualcosa per la vostra nuova cucina?"
    - tutor: "Sai che hai ragione? Ci serve proprio un servizio di piatti nuovo. E al ristorante faranno un menù di pesce, se vi va bene."
      goals: [gift, food]
    # merlin-1365_0100175-8
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti a te e a Paolo, a presto!"

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [noun-number, preposition]
  turns:
    - tutor: "Ciao! Allora, hai saputo la notizia? Io e Stefano ci sposiamo!"
    # merlin-1365_0100176-1
    - learner: "Per l'inizio: congratulazione per il vostro matrimonio."
      errors: [noun-number]
    - tutor: "Grazie! Ma «congratulazione»: quando fai gli auguri, la parola è singolare o plurale?"
      prompt: {text: "congratulazione", tags: [noun-number]}
    - learner: "Congratulazioni, scusa! Sono felicissima per voi."
    - tutor: "Esatto! Grazie, cara."
    # merlin-1365_0100176-3
    - learner: "Vorrei anche dire «grazie mille» per il vostro invito."
    - tutor: "Ma figurati! Ci tenevamo tanto. Allora, il 14 giugno sei libera?"
    # merlin-1365_0100176-4
    - learner: "Posso andare e sono felice, perché ho la possibilità di partecipare a questo giorno importante e ho anche una altra domanda: posso andare con il mio nuovo ragazzo Michele?"
    - tutor: "Ma certo che puoi venire con Michele! Non vediamo l'ora di conoscerlo. Vi mettiamo al tavolo dei giovani."
      goals: [date, guests]
    - learner: "Grazie! E per il regalo, cosa vi piacerebbe?"
    - tutor: "Un bel libro di cucina: Stefano vuole imparare a cucinare! A proposito, al pranzo ci saranno solo piatti di pesce."
      goals: [gift, food]
    # merlin-1365_0100176-9
    - learner: "Spero di ricevere una lettera di voi e di vedervi presto!"
      errors: [preposition]
    - tutor: "Ti scriviamo di sicuro! Ma «una lettera di voi»: per dire chi la manda, la lettera, che preposizione usiamo?"
      prompt: {text: "una lettera di voi", tags: [preposition]}
    - learner: "Spero di ricevere una lettera da voi!"
    - tutor: "Esatto! Ti mandiamo tutte le informazioni per posta, promesso."
    # merlin-1365_0100176-10
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti a te e a Michele!"

- scenario: compleanno
  level: B1
  persona: es-f-erasmus
  history: [preposition, relative-pronoun]
  turns:
    - tutor: "Ciao Maria! Hai saputo? Io e Beatrice abbiamo deciso la data: ci sposiamo il 3 maggio!"
    # merlin-1365_0100201-0
    - learner: "Di sentirlo mi fa molto contenta."
      errors: [preposition]
    - tutor: "Che bello! Ma la frase comincia con «di sentirlo»: lì, all'inizio, quel «di» ci vuole davvero?"
      prompt: {text: "Di sentirlo", tags: [preposition]}
    - learner: "Sentirlo mi fa molto contenta! Che bella notizia."
    - tutor: "Esatto! Siamo felicissimi anche noi."
    # merlin-1365_0100201-1
    - learner: "Ma soprattutto vi vorrei ringraziare per l'invito."
    - tutor: "Ci mancherebbe! Allora vieni a festeggiare con noi a Firenze?"
    # merlin-1365_0100201-2
    - learner: "Volentieri vengo da voi a festeggiare, con voi, quel giorno magico."
    - tutor: "Che gioia! Ci sposiamo in una piccola chiesa in campagna, e dopo tutti a pranzo sotto gli alberi."
      goals: [date]
    # merlin-1365_0100201-4
    - learner: "C'è in giro una lista, che ci sono scritto le cose che vi potreste bisognare?"
      errors: [relative-pronoun, participle-agreement]
    - tutor: "Una lista c'è! Ma «una lista, che ci sono scritto»: per dire «nella lista», «che ci» va bene? Quale relativo useresti?"
      prompt: {text: "che ci sono scritto", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Una lista dove sono scritte le cose che vi servono?"
    - tutor: "Esatto, proprio così! È in un negozio di via Roma: piatti, bicchieri, cose per la casa."
      goals: [gift]
    # merlin-1365_0100201-5
    - learner: "O vorreste un po' di soldi per la prossima vacanza?"
    - tutor: "Anche quella è un'idea! Il viaggio lo facciamo in Grecia, quindi va bene tutto. Vieni con tua sorella?"
    - learner: "No, vengo da sola, mia sorella è in Australia."
    - tutor: "Allora ti mettiamo al tavolo con i nostri amici dell'università, sono simpaticissimi. E al pranzo ci saranno piatti di casa nostra."
      goals: [guests, food]
    # merlin-1365_0100201-7
    - learner: "Carissimi saluti!"
    - tutor: "Carissimi saluti anche a te, a presto!"

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao Maria! Ti è arrivato l'invito? Il matrimonio è il 12 settembre!"
    # merlin-1365_0100173-0
    - learner: "Tanti auguri per il vostro matrimonio e grazie per l'invito."
    - tutor: "Grazie a te! Allora, ci sei?"
    # merlin-1365_0100173-1
    - learner: "Naturalmente vengo volentieri al vostro matrimonio."
    - tutor: "Che bello! Dopo la chiesa andiamo tutti al ristorante «Da Ciro», sul mare."
      goals: [date]
    # merlin-1365_0100173-2
    - learner: "Penso che il ristorante «Da Ciro» è molto bello."
      errors: [subjunctive-use]
    - tutor: "Lo conosci già? Ma dopo «penso che», il verbo «è» va bene o serve un altro modo?"
      prompt: {text: "è molto bello", tags: [subjunctive-use]}
    - learner: "Penso che sia molto bello, ci sono stata l'anno scorso."
    - tutor: "Esatto! Allora sai già che il pesce lì è fantastico."
      goals: [food]
    # merlin-1365_0100173-4
    - learner: "Ma adesso ho una domanda: che posso regolarvi?"
      errors: [word-choice]
    - tutor: "Cosa regalarvi? Davvero, niente di speciale: ci basta che vieni! Al massimo, qualcosa per la casa nuova."
      recast: {text: "regolarvi", fix: "regalarvi", tags: [word-choice]}
      goals: [gift]
    - learner: "Va bene. Posso venire con mio fratello? Lui conosce Stefano."
    - tutor: "Certo, più siamo e meglio è! Lo mettiamo al tavolo con i ragazzi del calcio."
      goals: [guests]
    # merlin-1365_0100173-7
    - learner: "Non posso vedere l'ora del matrimonio."
      errors: [word-choice]
    - tutor: "Non vedo l'ora anch'io! Mancano solo tre settimane."
      recast: {text: "Non posso vedere l'ora", fix: "Non vedo l'ora", tags: [word-choice]}
    # merlin-1365_0100173-8
    - learner: "Tanti saluti e a dopo!"
    - tutor: "A dopo, Maria! Ci sentiamo stasera."

- scenario: compleanno
  level: B1
  persona: es-f-teacher
  history: [subject-verb-agreement, relative-pronoun]
  turns:
    - tutor: "Ciao Maria! Allora, hai letto l'invito? Il 15 luglio mi sposo! Dopo la chiesa c'è la festa, fino a notte."
    # merlin-1365_0100169-2
    - learner: "Ma io non posso andare perché non vuole lasciare mia bambina a casa."
      errors: [subject-verb-agreement, possessive]
    - tutor: "Oh, capisco. Ma «non vuole lasciare»: chi è che non vuole? Stai parlando di te..."
      prompt: {text: "non vuole lasciare", tags: [subject-verb-agreement]}
    - learner: "Non voglio lasciare la mia bambina a casa, ha solo sei mesi."
    - tutor: "Esatto, è piccolissima! Ti capisco benissimo, non preoccuparti."
    # merlin-1365_0100169-3
    - learner: "Scusami, per favore!"
    - tutor: "Ma figurati, non devi scusarti! Lei viene prima di tutto."
    # merlin-1365_0100169-4
    - learner: "Ma certo visiterò la cerimonia!"
    - tutor: "Davvero? Allora vieni almeno in chiesa, alle undici: dura solo un'ora. Puoi portare anche la piccola!"
      goals: [date, guests]
    # merlin-1365_0100169-7
    - learner: "Dimmi, cosa posso regalare?"
    - tutor: "Non lo so ancora... Io e Luca abbiamo già quasi tutto per la casa."
    # merlin-1365_0100169-9
    - learner: "Perché non vorrei realarti qualcosa che di non hai bisogno."
      errors: [relative-pronoun, spelling]
    - tutor: "Hai ragione! Ma «qualcosa che di non hai bisogno»: si dice «avere bisogno di qualcosa». Quale relativo va con «di»?"
      prompt: {text: "che di non hai bisogno", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Qualcosa di cui non hai bisogno!"
    - tutor: "Esatto! Allora ti mando la lista del negozio. E dopo la chiesa c'è una piccola festa con i dolci: resta un po'!"
      goals: [gift, food]
    # merlin-1365_0100169-11
    - learner: "A presto, un grande abbraccio!"
    - tutor: "Un abbraccio a te e un bacio alla piccola!"

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [preposition, pronoun-position]
  turns:
    - tutor: "Ciao! Hai saputo la novità? Io e Stefano ci sposiamo a settembre!"
    # merlin-1365_0100133-0
    - learner: "E già in quest'anno!"
      errors: [preposition]
    - tutor: "Eh sì! Ma «in quest'anno»: con «questo» davanti, serve anche la preposizione?"
      prompt: {text: "in quest'anno", tags: [preposition]}
    - learner: "E già quest'anno! Che bella notizia."
    - tutor: "Esatto, non volevamo aspettare! Il 21 settembre, a Bologna. Vieni, vero?"
      goals: [date]
    # merlin-1365_0100133-5
    - learner: "Volete una certa moda di vestito per noi invitati?"
    - tutor: "No, niente di speciale! Solo un consiglio: non vestirti di bianco, quello è per la sposa."
    - learner: "Certo! E a che ora comincia la festa? Mi mandate l'orario?"
    - tutor: "La messa è alle undici, poi pranzo fino a sera. Te lo scrivo nel messaggio con l'indirizzo."
      goals: [food]
    # merlin-1365_0100133-11
    - learner: "Così posso essere puntuale."
    - tutor: "Brava! E per il regalo non preoccuparti: ci basta che vieni con Paolo."
      goals: [guests, gift]
    # merlin-1365_0100133-8
    - learner: "Vi telefonerò presto e ci possiamo parlarne."
      errors: [pronoun-position]
    - tutor: "Con piacere! Ma «ci possiamo parlarne»: hai messo un pronome prima del verbo e uno dopo. Servono tutti e due?"
      prompt: {text: "ci possiamo parlarne", tags: [pronoun-position]}
    - learner: "Vi telefono presto e possiamo parlarne con calma."
    - tutor: "Esatto! Allora aspetto la tua telefonata."

- scenario: compleanno
  level: B1
  persona: en-m-retired
  history: [subjunctive-use, future-form]
  turns:
    - tutor: "Ciao Michele! È arrivato il nostro invito?"
    # merlin-1365_0100200-0
    - learner: "Vi ringrazio di cuore del vostro invito alla cerimonia e alla cena."
    - tutor: "Siamo noi che ringraziamo te! Ci tenevamo tanto ad averti."
    # merlin-1365_0100200-2
    - learner: "Comunque, in primo luogo, vorrei fare le mie congratulazioni per il vostro matrimonio."
    - tutor: "Grazie mille, sei gentilissimo! Allora ti aspettiamo il 20 giugno, alle quattro, in chiesa."
      goals: [date]
    # merlin-1365_0100200-3
    - learner: "Vi auguro che tutto che pianificate per il futuro diventerà realtà."
      errors: [relative-pronoun, subjunctive-use]
    - tutor: "Che bell'augurio! Ma dopo «vi auguro che», il verbo «diventerà» va bene? Quale modo usiamo?"
      prompt: {text: "diventerà", tags: [subjunctive-use]}
    - learner: "Vi auguro che tutto diventi realtà!"
    - tutor: "Esatto, grazie! Speriamo davvero. A cena saremo in sessanta, con tutti i parenti di Beatrice."
      goals: [guests]
    # merlin-1365_0100200-5
    - learner: "Potreste farmi sapere per favore che cosa portrò regalarvi?"
      errors: [future-form]
    - tutor: "Ma certo! Però «portrò»: è il futuro di «potere». Prova a dirlo di nuovo."
      prompt: {text: "portrò", tags: [future-form]}
    - learner: "Che cosa potrò regalarvi? Vorrei qualcosa di utile."
    - tutor: "Esatto! Ci serve un bel servizio di bicchieri. E per la cena, preferisci carne o pesce?"
      goals: [gift]
    - learner: "Pesce, grazie."
    - tutor: "Perfetto, te lo segno."
      goals: [food]
    # merlin-1365_0100200-8
    - learner: "Vi ringrazio di nuovo del cortese invito e porgo i miei migliori saluti."
    - tutor: "Grazie a te, Michele! Ci vediamo il 20."

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao Maria! Hai visto il nostro invito? Io e Stefano ci sposiamo il 4 ottobre!"
    # merlin-1365_0100134-1
    - learner: "Grazie tante per l'invito al vostro matrimonio."
    - tutor: "Figurati! Riesci a venire anche se abiti in Germania?"
    - learner: "Certo, prendo l'aereo per Napoli il giorno prima."
    - tutor: "Che bello averti con noi! Ci saranno anche i tuoi vecchi compagni del corso di italiano."
      goals: [date, guests]
    # merlin-1365_0100134-6
    - learner: "Avete un desidero?"
      errors: [word-choice]
    - tutor: "Un desiderio? Sì: che tutti si divertano! Ma se pensi al regalo, abbiamo una lista in un negozio."
      recast: {text: "un desidero", fix: "un desiderio", tags: [word-choice]}
    # merlin-1365_0100134-7
    - learner: "Forse potrei portare qualche cosa speciale di Germania."
      errors: [preposition, articulated-preposition]
    - tutor: "Che pensiero carino! Ma «di Germania»: per dire da dove arriva una cosa, che preposizione usi con un paese?"
      prompt: {text: "di Germania", tags: [articulated-preposition]}
    - learner: "Qualche cosa di speciale dalla Germania!"
    - tutor: "Esatto! Una cosa tedesca ci farebbe piacere: magari dei dolci di Natale per il tavolo dei dolci."
      goals: [gift, food]
    # merlin-1365_0100134-8
    - learner: "Mi fate sapere che cosa volete."
    - tutor: "Promesso, ti scriviamo noi questa settimana."
    # merlin-1365_0100134-9
    - learner: "Tanti saluti e a presto!"
    - tutor: "A presto, Maria! Buon viaggio."

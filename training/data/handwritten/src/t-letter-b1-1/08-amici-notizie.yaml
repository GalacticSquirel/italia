# B1 real-learner letters (round 7): news and advice for friends (chats, a new job, a language
# course abroad, a missed appointment, a cooking evening). The tutor is the friend written to.
- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [noun-gender, relative-pronoun]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera sul giornale? Lavoro sempre da casa, e ormai passo tutto il giorno a scrivere su internet."
    # merlin-1325_9000750-0
    - learner: "Caro Giorgio, avendo letto la tua lettera sul giornale «Settimana Giovani», non riesco a non risponderti, per raccontare la mia esperienza, molto simile alla tua."
    - tutor: "Davvero? Anche tu hai avuto questo problema?"
      goals: [situation]
    # merlin-1325_9000750-1
    - learner: "Qualche tempo fa, ho avuto un periodo non molto felice nella mia vita."
    - tutor: "Mi dispiace. E che cosa è successo?"
    # merlin-1325_9000750-3
    - learner: "Non avevo voglia di frequentare nessuno e così ho cominciato a chattare."
    - tutor: "Proprio come me! All'inizio ti piaceva?"
    # merlin-1325_9000750-4
    - learner: "Che bella scoperta!"
    - tutor: "Eh sì, all'inizio è bellissimo: sempre qualcuno con cui parlare."
      goals: [pros]
    # merlin-1325_9000750-6
    - learner: "Sono diventata lo schiavo del computer."
      errors: [noun-gender]
    - tutor: "Ti capisco benissimo! Ma «lo schiavo»: parli di te, che sei una donna. Come diventa?"
      prompt: {text: "lo schiavo", tags: [noun-gender]}
    - learner: "Sono diventata la schiava del computer!"
    - tutor: "Esatto. Ed è proprio quello che succede a me: non esco più."
      goals: [cons]
    # merlin-1325_9000750-9
    - learner: "Perciò, ho chiuso con tantissime amicizie virtuali e sono rimasta in contatto solamente con le persone con quali mi sentivo bene, rilassata e tranquilla."
      errors: [relative-pronoun]
    - tutor: "Una scelta coraggiosa! Ma «le persone con quali»: con «quale» come pronome relativo, che cosa ci vuole davanti?"
      prompt: {text: "con quali", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Con le quali mi sentivo bene."
    - tutor: "Esatto. E tu che cosa mi consigli?"
    # merlin-1325_9000750-11
    - learner: "Scegliere solamente alcuni amici virtuali e stabilire quanto tempo vuoi e soprattutto puoi passare con loro."
    - tutor: "Tipo un'ora la sera, e basta? Ci posso provare."
    # merlin-1325_9000750-12
    - learner: "Nel mio caso funziona benissimo."
    - tutor: "E il resto del tempo cosa fai?"
    # merlin-1325_9000750-14
    - learner: "Insomma, cerco di vivere la vita reale."
    - tutor: "Hai ragione: preferisco anch'io gli amici veri a quelli di internet."
      goals: [preference]
    # merlin-1325_9000750-15
    - learner: "Perciò, dai, forza, che ci riuscirai anche tu."
    - tutor: "Grazie, mi hai dato coraggio!"
    # merlin-1325_9000750-16
    - learner: "Con tanti auguri, la tua amica non virtuale!"
    - tutor: "Ahah, la mia amica più vera di tutte! Grazie."

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Lavoro da casa e la sera scrivo tanto su internet, ma con alcune persone non mi trovo più bene."
    - learner: "Ti capisco, anche a me è successo con un ragazzo che conoscevo solo su internet."
    - tutor: "Davvero? Dove l'avevi conosciuto?"
      goals: [situation]
    # merlin-1325_1001046-7
    - learner: "C'è il sito web dove possiamo fare amicizia."
    - tutor: "Ah, uno di quei siti per conoscere gente. All'inizio sono divertenti."
      goals: [pros]
    - learner: "Sì, ma dopo qualche mese mi mandava messaggi cattivi, tutti i giorni."
    - tutor: "Che brutto! Questo è il lato peggiore di internet."
      goals: [cons]
    # merlin-1325_1001046-10
    - learner: "Tutto sommato la mia opinione sull'uso di Internet è che non proviamo trovare amici ma usiamo per trovare informazioni nuovi."
      errors: [preposition, object-pronoun, adjective-agreement]
    - tutor: "Interessante. Ma «informazioni nuovi»: «informazioni» è femminile. E allora l'aggettivo?"
      prompt: {text: "informazioni nuovi", tags: [adjective-agreement]}
    - learner: "Informazioni nuove, scusa!"
    - tutor: "Esatto. Forse hai ragione: meglio cercare amici veri al bar che su internet."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [article-form]
  turns:
    - tutor: "Ciao Michele! Quanto tempo che non ci sentiamo!"
    # merlin-1395_0000513-2
    - learner: "È troppo lungo."
    - tutor: "Hai ragione, troppo! Come sta la famiglia?"
    # merlin-1395_0000513-3
    - learner: "Mia moglie e i miei ragazzi vanno molto bene."
    - tutor: "Che bello! E tu? Lavori ancora da casa?"
    # merlin-1395_0000513-4
    - learner: "Ho trovato uno posto alla banca, e adesso faccio il contabile."
      errors: [article-form, articulated-preposition]
    - tutor: "In banca, bravo! Ma «uno posto»: davanti a «posto», «uno» va bene?"
      prompt: {text: "uno posto", tags: [article-form]}
    - learner: "Un posto in banca, sì. Da marzo."
    - tutor: "Esatto. E ti trovi meglio in ufficio o a casa?"
      goals: [situation]
    - learner: "In ufficio, perché ho dei colleghi simpatici. Ma devo prendere il treno ogni mattina."
    - tutor: "Eh, il treno è il prezzo da pagare! Comunque i colleghi valgono la pena."
      goals: [pros, cons, preference]
    # merlin-1395_0000513-9
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti a te e alla famiglia, Michele!"

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [article-use]
  turns:
    - tutor: "Ciao Maria! Da quanto tempo! Come va? Lavori ancora da casa?"
    - learner: "No, adesso vado in ufficio tutti i giorni."
    - tutor: "E come va?"
      goals: [situation]
    # merlin-1395_0000360-4
    - learner: "Lavoro va benissimo."
      errors: [article-use]
    - tutor: "Che bello! Ma «lavoro va benissimo»: quando parli del tuo lavoro in generale, cosa mettiamo davanti a «lavoro»?"
      prompt: {text: "Lavoro va", tags: [article-use]}
    - learner: "Il lavoro va benissimo! Mi piace stare con i colleghi."
    - tutor: "Esatto. Allora l'ufficio ti fa bene! Io invece da casa mi sento un po' solo."
      goals: [pros, cons]
    # merlin-1395_0000360-5
    - learner: "Ci possiamo vedere lunedì pomeriggio verso le 17 al bar «Grigio»."
    - tutor: "Ottima idea, il «Grigio» mi piace: hanno i dolci migliori della città."
    # merlin-1395_0000360-6
    - learner: "Fammi sapere se ti sta bene."
    - tutor: "Lunedì alle cinque va benissimo. Preferisco vederti dal vivo che al telefono!"
      goals: [preference]
    # merlin-1395_0000360-7
    - learner: "Un abbraccio forte."
    - tutor: "Anche a te, a lunedì!"
    # merlin-1395_0000360-8
    - learner: "Ti saluto!"
    - tutor: "Ciao Maria!"

- scenario: consigli-viaggio
  level: B1
  persona: en-m-traveller
  turns:
    - tutor: "Allora, Michele, noi tre partiamo la settimana prossima per venirti a trovare! Com'è la vita lì?"
    # merlin-1395_0000409-0
    - learner: "Ciao Franca, Luca e Remo!"
    - tutor: "Ciao! Siamo tutti e tre qui al telefono. Allora, come va il corso di italiano?"
    # merlin-1395_0000409-2
    - learner: "È molto divertente."
    - tutor: "Che bello! E dopo le lezioni che fate?"
    # merlin-1395_0000409-3
    - learner: "Nel tempo libero visitiamo la bella città."
    - tutor: "Che cosa ci consigli di vedere, allora?"
      goals: [plans]
    # merlin-1395_0000409-4
    - learner: "Mi piacciono i palazzi vecchi e i piccoli e grandi ponti."
    - tutor: "Allora vedremo i ponti di sicuro! Ci muoviamo a piedi o in vaporetto?"
      goals: [advice]
      new: [{lemma: vaporetto, gloss: water bus}]
    - learner: "A piedi, è più bello. Il vaporetto costa tanto."
    - tutor: "Perfetto, scarpe comode allora! E c'è qualcosa da evitare?"
      goals: [transport]
    - learner: "Sì, i ristoranti vicino a San Marco: sono cari e non buoni."
    - tutor: "Grazie del consiglio, mangeremo dove mangi tu!"
      goals: [warnings]
    # merlin-1395_0000409-6
    - learner: "Spero di vedervi in questo periodo."
    - tutor: "Certo che ci vediamo! Arriviamo venerdì sera."
    # merlin-1395_0000409-7
    - learner: "Abito in un appartamento e così ho posto per voi."
    - tutor: "Davvero possiamo dormire da te? Sei fantastico!"
    # merlin-1395_0000409-9
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti da tutti e tre, a venerdì!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Ciao! Allora, giovedì pomeriggio ci vediamo per il caffè? Io lavoro da casa, quindi per me va bene."
    # merlin-1385_0001717-0
    - learner: "Devo dirti che non posso incontrarti a giovedi pomeriggio."
      errors: [preposition]
    - tutor: "Oh, peccato! Ma per dire quando, prima del nome di un giorno, ci vuole la «a»?"
      prompt: {text: "a giovedi", tags: [preposition]}
    - learner: "Non posso incontrarti giovedì pomeriggio."
    - tutor: "Esatto. Che succede?"
    # merlin-1385_0001717-1
    - learner: "Mi dispiace molto, ma in ufficio c'è molto lavoro e il mio capo ha organizzato una riunione per giovedì pomeriggio."
    - tutor: "Ecco il problema dell'ufficio: le riunioni all'ultimo momento!"
      goals: [situation, cons]
    # merlin-1385_0001717-5
    - learner: "Avrei tempo per incontrarti senza disturbo del mio capo."
      errors: [articulated-preposition]
    - tutor: "Quando? Ma «senza disturbo del mio capo»: se è il capo che disturba, quale preposizione usiamo?"
      prompt: {text: "disturbo del mio capo", tags: [articulated-preposition]}
    - learner: "Senza disturbo dal mio capo. Sabato mattina, per esempio."
    - tutor: "Esatto. Il vantaggio di lavorare da casa è che io sono libero quasi sempre."
      goals: [pros]
    # merlin-1385_0001717-6
    - learner: "Che ne dici?"
    - tutor: "Sabato mattina è perfetto, anzi lo preferisco: abbiamo più tempo."
      goals: [preference]
    # merlin-1385_0001717-9
    - learner: "Ti abbraccio!"
    - tutor: "Un abbraccio anche a te, a sabato!"

- scenario: cucina-ricetta
  level: B1
  persona: en-f-student
  history: [piacere, adjective-agreement]
  turns:
    - tutor: "Che profumo! Mi piace tanto cucinare con te. Cosa cuciniamo stasera?"
    # merlin-1365_0100461-0
    - learner: "Anch'io mi piace cucinare!"
      errors: [piacere]
    - tutor: "Lo so! Ma «anch'io mi piace»: con «piacere», la persona non è «io». Come si dice, allora?"
      prompt: {text: "Anch'io mi piace", tags: [piacere]}
    - learner: "Anche a me piace cucinare! Stasera faccio un piatto del mio paese."
    - tutor: "Esatto. Che cosa?"
    # merlin-1365_0100461-5
    - learner: "Questi sono i piatti tipiche ungherese, ma io invece mangio dei cibi sgrassati."
      errors: [adjective-agreement]
    - tutor: "Interessante! Ma «i piatti tipiche ungherese»: «piatti» è maschile plurale. E gli aggettivi?"
      prompt: {text: "piatti tipiche ungherese", tags: [adjective-agreement]}
    - learner: "I piatti tipici ungheresi. Ma stasera faccio un gulash leggero, con poca carne."
    - tutor: "Esatto. Un gulash leggero, mi piace! Che cosa serve?"
    - learner: "Carne di manzo, cipolle, patate, pomodori e tanta paprica."
    - tutor: "Le cipolle le taglio io! E poi?"
      goals: [ingredients]
    - learner: "Prima cuoci le cipolle con un po' di olio, poi aggiungi la carne e la paprica."
    - tutor: "E quanto tempo deve cuocere?"
      goals: [steps]
    - learner: "Più o meno un'ora e mezza, a fuoco basso."
    - tutor: "Allora io preparo la tavola. Lo serviamo con il pane?"
      goals: [time]
    - learner: "Sì, con il pane caldo e un po' di panna acida sopra."
    - tutor: "Perfetto, non vedo l'ora di mangiarlo!"
      goals: [serve]

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [verb-form, article-form]
  turns:
    - tutor: "Ciao! Lavoro da casa da un anno e sono stanco. Vorrei lavorare in un albergo, ma dove?"
    # merlin-1365_0100069-4
    - learner: "Sì, à Calabria ho conosco un albergo molto bello."
      errors: [preposition, verb-form]
    - tutor: "Davvero? Ma «ho conosco»: vuoi dire che lo conosci adesso? Allora il verbo come va?"
      prompt: {text: "ho conosco", tags: [verb-form]}
    - learner: "Conosco un albergo molto bello in Calabria, sul mare."
    - tutor: "Esatto. Che bello, un albergo sul mare! E com'è lavorare lì?"
      goals: [preference]
    - learner: "Si lavora tanto d'estate, ma si conoscono persone di tutto il mondo."
    - tutor: "Ecco, questo mi manca da casa: le persone. Però lavorare tanto non mi spaventa."
      goals: [situation, pros, cons]
    # merlin-1365_0100069-8
    - learner: "Ti auguri un splendido periodo."
      errors: [verb-form, article-form]
    - tutor: "Grazie! Ma «ti auguri»: sei tu che fai l'augurio a me. Come diventa il verbo?"
      prompt: {text: "Ti auguri", tags: [verb-form]}
    - learner: "Ti auguri un buon periodo."
      errors: [verb-form]
    - tutor: "Grazie, ti auguro anch'io un buon periodo! Ti scrivo stasera con tutte le informazioni."
      recast: {text: "Ti auguri", fix: "Ti auguro", tags: [verb-form]}
    # merlin-1365_0100069-9
    - learner: "Tanti baci e tanti saluti."
    - tutor: "Baci anche a te!"

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "In Islanda, con mia sorella. Abbiamo girato tutta l'isola in macchina."
    - tutor: "In Islanda! E com'era?"
      goals: [where]
    # merlin-1365_0100073-3
    - learner: "Era molto interessante."
    - tutor: "Immagino! E il tempo? Lì piove spesso."
      goals: [activities]
    # merlin-1365_0100073-4
    - learner: "Di più avevo la fortuna di aver bel tempo."
      errors: [word-choice]
    - tutor: "In più anche il bel tempo, che fortuna! Cosa ti è piaciuto di più?"
      recast: {text: "Di più", fix: "In più", tags: [word-choice]}
      goals: [weather]
    - learner: "Le cascate, erano enormi."
    - tutor: "Che bello! E adesso, di nuovo al lavoro?"
      goals: [best]
    # merlin-1365_0100073-6
    - learner: "La settimana prossima cambierò di posto di lavoro."
      errors: [preposition]
    - tutor: "Che notizia! Ma «cambierò di posto»: con «cambiare lavoro» o «cambiare casa», ci vuole quel «di»?"
      prompt: {text: "cambierò di posto", tags: [preposition]}
    - learner: "Cambierò posto di lavoro: vado in un ufficio a Lugano."
    - tutor: "Esatto. A Lugano, vicino a me!"
    # merlin-1365_0100073-9
    - learner: "Mi mandi un messaggio quando vieni in Svizzera?"
    - tutor: "Certo, a ottobre passo da te."
    # merlin-1365_0100073-12
    - learner: "A presto e mille baci a tua sorella!"
    - tutor: "Glieli do subito, è qui con me!"

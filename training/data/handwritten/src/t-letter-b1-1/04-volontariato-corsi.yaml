# B1 real-learner letters (round 7): asking an association about its aid projects, cooking
# evenings and a language course. The tutor is the coordinator the letter was written to.
- scenario: volontariato
  level: B1
  persona: en-m-heritage
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, vorrei aiutare in un vostro progetto quest'estate."
    - tutor: "Benissimo! Raccontami un po' di te: che cosa fai adesso?"
    # merlin-1325_1001025-0
    - learner: "Il mio estate è tutto libero, e adesso ho finito i miei studi, e ad oggi non ho trovato nessun lavoro fisso."
      errors: [noun-gender, adjective-agreement]
    - tutor: "Capisco, allora hai tempo! Ma «il mio estate»: «estate» è maschile o femminile?"
      prompt: {text: "Il mio estate", tags: [noun-gender]}
    - learner: "La mia estate è tutta libera, da giugno a settembre."
    - tutor: "Esatto. Perfetto, i nostri campi sono proprio in quei mesi."
      goals: [time]
    # merlin-1325_1001025-4
    - learner: "Ho molte esperienze lavorare in paesi sottosviluppati."
      errors: [word-choice]
    - tutor: "Hai molte esperienze lavorative in paesi poveri? Allora sai già com'è la vita lì. Dove sei stato?"
      recast: {text: "esperienze lavorare", fix: "esperienze lavorative", tags: [word-choice]}
      new: [{lemma: lavorativo, gloss: work-related}]
    - learner: "In Perù e in Bolivia, ho costruito case con altri ragazzi."
    - tutor: "Che esperienza! E perché vuoi partire di nuovo?"
      goals: [skills]
    - learner: "Perché anche il mio paese è povero, e so che l'aiuto è importante."
    - tutor: "Lo capisco bene. Allora ti proporrei il campo in Ecuador, dove si costruisce una scuola: ti scrivo il programma entro domani."
      goals: [motivation, choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001021-0
    - learner: "In riferimento al questo annuncio permettetemi di rivolgermi a Voi con una richiesta di impiego e lavoro."
      errors: [articulated-preposition]
    - tutor: "Certo, sei nel posto giusto! Ma «al questo annuncio»: davanti a «questo», ci vuole anche l'articolo?"
      prompt: {text: "al questo annuncio", tags: [articulated-preposition]}
    - learner: "In riferimento a questo annuncio, vorrei lavorare con voi."
    - tutor: "Esatto. Benvenuta! Dimmi qualcosa di te."
    # merlin-1325_1001021-1
    - learner: "Sono una studentessa ungherese di 21 anni."
    - tutor: "Piacere! E perché vuoi fare volontariato?"
    # merlin-1325_1001021-8
    - learner: "Sono una ragazza amichevole con il sogno di aiutare i Vostri progetti."
    - tutor: "Che bello sentirlo! Quanto tempo avresti?"
      goals: [motivation]
    # merlin-1325_1001021-3
    - learner: "D'estate ho molto tempo libero, così questo periodo sarebbe perfetto per lavoro."
      errors: [word-choice]
    - tutor: "Perfetto per lavorare con noi, allora: i campi d'estate durano da giugno ad agosto."
      recast: {text: "per lavoro", fix: "per lavorare", tags: [word-choice]}
      goals: [time]
    # merlin-1325_1001021-7
    - learner: "Farei il lavoro con gran entusiasmo."
    - tutor: "Si vede! E che cosa sai fare? Parli altre lingue?"
    - learner: "Parlo inglese e un po' di tedesco."
    - tutor: "Utilissimo con i ragazzi stranieri. E nel tempo libero cosa ti piace fare?"
      goals: [skills]
    # merlin-1325_1001021-9
    - learner: "Inoltre, mi piace anche frequentare lo studio."
    - tutor: "Cioè ti piace studiare? Allora potresti aiutare i bambini con i compiti: ti metto nel turno del pomeriggio, a luglio."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-traveller
  history: [verb-form, articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto. Studio storia all'università e seguo i problemi dei paesi poveri."
    - tutor: "Interessante! E perché vuoi aiutare proprio adesso?"
    # merlin-1325_1001012-2
    - learner: "Vorrei fare qualcosa, perché mi soffro molto dal pensiero che ogni giorno molti morono da fame."
      errors: [reflexive, articulated-preposition, verb-form, preposition]
    - tutor: "Ti capisco, è terribile. Ma «molti morono»: è il presente di «morire», e qui il verbo cambia molto. Come si dice?"
      prompt: {text: "morono", tags: [verb-form]}
    - learner: "Molti muoiono di fame, ogni giorno."
    - tutor: "Esatto, purtroppo. È una buona ragione per partire."
      goals: [motivation]
    # merlin-1325_1001012-6
    - learner: "Perché hanno diritto alla vita!"
    - tutor: "Hai ragione. E che cosa sai fare? Hai già lavorato in un campo?"
    - learner: "No, ma so cucinare per tanti e parlo spagnolo."
    - tutor: "Lo spagnolo ci serve moltissimo in Guatemala! Da quando potresti partire?"
      goals: [skills]
    # merlin-1325_1001012-3
    - learner: "Se tutto va bene, sarò libero da prossima settimana."
      errors: [articulated-preposition]
    - tutor: "Benissimo! Ma «da prossima settimana»: davanti a «prossima», «da» va da sola?"
      prompt: {text: "da prossima settimana", tags: [articulated-preposition]}
    - learner: "Da la prossima settimana, sì."
      errors: [articulated-preposition]
    - tutor: "Dalla prossima settimana, perfetto! Allora puoi partire con il gruppo del 10 luglio, in cucina."
      recast: {text: "Da la prossima settimana", fix: "Dalla prossima settimana", tags: [articulated-preposition]}
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [object-pronoun, preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000102-1
    - learner: "Innanzitutto vorrei dire che sono interessata e potrei dare il mio aiuto: a casa ho tante cose come vestiti, scarpe, borse eccetera."
    - tutor: "Che bello! Raccogliamo proprio vestiti per le famiglie dei campi. Sono in buono stato?"
    # merlin-1325_9000102-2
    - learner: "Che da tanto tempo non li uso più."
      errors: [object-pronoun]
    - tutor: "Ah, non li usi più. Però in questa frase «che» indica già le cose: serve anche «li»?"
      prompt: {text: "non li uso", tags: [object-pronoun]}
    - learner: "Cose che da tanto tempo non uso più, ma sono quasi nuove."
    - tutor: "Esatto. Allora vanno benissimo!"
    # merlin-1325_9000102-3
    - learner: "Così anche i giocattoli per i bambini che sono ben curati."
    - tutor: "Anche i giocattoli? I bambini saranno felicissimi!"
    # merlin-1325_9000102-4
    - learner: "Quindi sono disponibile di regalarli a voi."
      errors: [preposition]
    - tutor: "Grazie mille! Ma «disponibile di regalarli»: dopo «disponibile», che preposizione si usa con un verbo?"
      prompt: {text: "disponibile di", tags: [preposition]}
    - learner: "Sono disponibile a regalarli a voi."
    - tutor: "Esatto, grazie davvero. E tu chi sei, che cosa fai?"
      goals: [motivation]
    # merlin-1325_9000102-6
    - learner: "Di origine sono macedone ma da 3 anni vivo e lavoro come infermiera in Svizzera."
    - tutor: "Un'infermiera! Nei campi serve sempre qualcuno che sa curare. Parli altre lingue?"
    # merlin-1325_9000102-7
    - learner: "Parlo la mia lingua madre, il macedone, e italiano."
    - tutor: "Bene, l'italiano basta. Quando saresti libera?"
      goals: [skills]
    # merlin-1325_9000102-8
    - learner: "Questa settimana, dal 20 luglio al primo agosto, sono in vacanza quindi non lavoro e sono a vostra disposizione per aiutare."
    - tutor: "Perfetto! Allora ti metterei nel campo per bambini vicino a Como: lì un'infermiera ci serve davvero."
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [preposition, article-use]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Ho letto che cercate persone per i mercatini."
    - tutor: "Esatto, vendiamo cose usate per aiutare i nostri progetti. Che cosa potresti fare?"
    # merlin-1325_9000677-3
    - learner: "Posso lavorare come venditrice oggetti nei mercatini dell'usato."
      errors: [preposition]
    - tutor: "Ottimo! Ma «venditrice oggetti»: tra queste due parole, che cosa mettiamo per dire che cosa vendi?"
      prompt: {text: "venditrice oggetti", tags: [preposition]}
    - learner: "Venditrice di oggetti, sì. Ho già fatto la commessa."
    - tutor: "Esatto. Allora sai già trattare con i clienti!"
      goals: [skills]
    # merlin-1325_9000677-4
    - learner: "Sono persona comunicativa e mi piacerebbe lavorare con altre persone."
      errors: [article-use]
    - tutor: "Si sente! Ma «sono persona comunicativa»: prima di «persona», qui, ci vuole qualcosa?"
      prompt: {text: "Sono persona", tags: [article-use]}
    - learner: "Sono una persona comunicativa."
    - tutor: "Esatto. E perché hai scelto la nostra associazione?"
    - learner: "Perché vorrei capire meglio i problemi dei paesi poveri."
    - tutor: "Allora ti piacerà anche il nostro piccolo corso del giovedì sera su questi temi."
      goals: [motivation]
    # merlin-1325_9000677-7
    - learner: "Vi sarei molto grata se m'inviaste informazioni su questo corso e lo studio."
    - tutor: "Certo, ti mando tutto stasera. Quante ore alla settimana potresti darci?"
    - learner: "Il sabato mattina sono sempre libera."
    - tutor: "Perfetto: vendiamo proprio il sabato, in piazza. Ti aspettiamo!"
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [article-use, noun-gender]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, devo scrivere la tesi sulla solidarietà tra i paesi e vorrei fare un'esperienza vera."
    - tutor: "Ottima idea, così impari sul campo! Che lingue parli?"
      goals: [motivation]
    # merlin-1325_1001019-4
    - learner: "Parlo la lingua ungherese, inglese, tedesca e italiana."
    - tutor: "Quattro lingue, fantastico! E che altro sai fare?"
    # merlin-1325_1001019-6
    - learner: "Ho patente, categoria B e sono capace usare PC."
      errors: [article-use, preposition]
    - tutor: "Molto utile! Ma «ho patente»: per dire che hai il documento per guidare, ci vuole un articolo?"
      prompt: {text: "Ho patente", tags: [article-use]}
    - learner: "Ho la patente B, e uso bene il computer."
    - tutor: "Esatto. Allora potresti guidare il nostro furgone!"
      goals: [skills]
      new: [{lemma: furgone, gloss: van}]
    # merlin-1325_1001019-9
    - learner: "Con questa esperienza e con quell lavoro con l'azienda, secondo me potrei essere un mano utile nell Vostro campo."
      errors: [noun-gender, spelling]
    - tutor: "Ne sono sicura! Ma «un mano»: «mano» finisce in -o, però è maschile o femminile?"
      prompt: {text: "un mano", tags: [noun-gender]}
    - learner: "Una mano! Potrei essere una mano utile."
    - tutor: "Esatto, è femminile. Quando saresti libera?"
    - learner: "Dal 3 luglio fino alla fine di settembre."
    - tutor: "Benissimo, allora ti propongo il campo in Albania, con i ragazzi delle scuole."
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [object-pronoun, noun-gender, preposition]
  turns:
    - tutor: "Ciao! Ti interessano le nostre serate di cucina da tutto il mondo?"
    # merlin-1325_1001168-0
    - learner: "Mi chiamo Michele."
    - tutor: "Piacere, Michele! Come hai saputo delle serate?"
    # merlin-1325_1001168-1
    - learner: "Ho letto il vostro annuncio delle «Serate di cucina internazionale» e devo dire, che lo è stato molto interessante per me."
      errors: [object-pronoun]
    - tutor: "Che piacere! Ma «che lo è stato»: il soggetto è già l'annuncio. Quel «lo» serve?"
      prompt: {text: "lo è stato", tags: [object-pronoun]}
      new: [{lemma: soggetto, gloss: subject}]
    - learner: "Devo dire che è stato molto interessante per me."
    - tutor: "Esatto. E perché ti interessano le serate?"
      goals: [motivation]
    # merlin-1325_1001168-4
    - learner: "Anche, io sono un cuoco della ristorante «Tacchino Farcito»."
      errors: [noun-gender]
    - tutor: "Un cuoco, fantastico! Ma «della ristorante»: «ristorante» è maschile o femminile?"
      prompt: {text: "della ristorante", tags: [noun-gender]}
    - learner: "Del ristorante, è maschile. Lavoro lì da cinque anni."
    - tutor: "Esatto. Allora potresti anche cucinare tu una sera!"
      goals: [skills]
    # merlin-1325_1001168-6
    - learner: "Prima di tutto, voglio domandare del prezzo di questo programma."
    - tutor: "Il primo gruppo di serate costa ottanta euro, tutto compreso."
    # merlin-1325_1001168-7
    - learner: "C'è un tipo di acconto per pagare?"
      errors: [preposition]
    - tutor: "Sì, venti euro. Ma «un acconto per pagare»: se è una cosa che si deve pagare, che preposizione usiamo?"
      prompt: {text: "acconto per pagare", tags: [preposition]}
    - learner: "C'è un acconto da pagare, quindi."
    - tutor: "Esatto. Le serate sono il martedì, dalle sette alle dieci."
      goals: [time]
    # merlin-1325_1001168-12
    - learner: "Aspetto la tua risposta."
    - tutor: "Te la do subito: ti metto nel primo gruppo, con la cucina del Messico!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [preposition, noun-gender]
  turns:
    - tutor: "Ciao! Ti interessano i nostri corsi di lingua a Roma?"
    # merlin-1365_0100192-4
    - learner: "Quest'anno abbiamo deciso di andare a Roma, quindi la Vostra offerta mi sembra interessante."
    - tutor: "Che bella scelta! Perché proprio Roma?"
    - learner: "Mio marito ama l'arte, e io vorrei migliorare il mio italiano."
    - tutor: "Allora siete nel posto giusto: corsi la mattina e musei il pomeriggio!"
      goals: [motivation]
    # merlin-1365_0100192-5
    - learner: "Vorremmo participare la programma di Natale dal 26 dicembre al 6 gennaio."
      errors: [preposition, noun-gender, spelling]
    - tutor: "Ottimo periodo! Ma «participare la programma»: con questo verbo, che preposizione ci vuole?"
      prompt: {text: "participare la programma", tags: [preposition]}
    - learner: "Vorremmo partecipare al programma di Natale."
    - tutor: "Esatto. Ci sono ancora due posti!"
      goals: [time, choose]
    # merlin-1365_0100192-7
    - learner: "Potreste farmi sapere il prezzo della programma di Natale?"
      errors: [noun-gender]
    - tutor: "Certo. Ma «della programma»: «programma» finisce in -a, però è maschile o femminile?"
      prompt: {text: "della programma", tags: [noun-gender]}
    - learner: "Del programma, giusto, è maschile."
    - tutor: "Esatto, come «problema». Costa quattrocento euro a persona, con le visite."
    # merlin-1365_0100192-8
    - learner: "Potreste consigliarmi se ci sono altri programmi e farmi sapere se è necessario prenotare?"
    - tutor: "C'è anche un corso di cucina, e sì, meglio prenotare subito. Il tuo livello di italiano com'è?"
    - learner: "Direi B1: capisco quasi tutto, ma parlo ancora piano."
    - tutor: "Perfetto, allora ti metto nel gruppo di livello medio."
      goals: [skills]

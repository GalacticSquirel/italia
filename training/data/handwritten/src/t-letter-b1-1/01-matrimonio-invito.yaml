# B1 real-learner letters (round 7): answering a wedding invitation. Each dialogue follows one
# learner's letter; the tutor is one of the couple, so plural address («vi», «voi») is correct.
- scenario: compleanno
  level: B1
  persona: en-m-traveller
  history: [possessive]
  turns:
    - tutor: "Allora, Michele, è arrivato il nostro invito per il matrimonio?"
    # merlin-1365_0100093-0
    - learner: "Prima, vorrei fare le miei congratulazioni."
      errors: [possessive]
    - tutor: "Che carino! Però guarda bene: «congratulazioni» è femminile plurale. «Le miei» ti sembra giusto?"
      prompt: {text: "le miei congratulazioni", tags: [possessive]}
    - learner: "Le mie congratulazioni, volevo dire!"
    - tutor: "Perfetto, grazie di cuore! Siamo felicissimi."
    # merlin-1365_0100093-1
    - learner: "Vi ringrazio dell'invito."
    - tutor: "Ci mancherebbe, sei uno dei nostri amici più cari! Allora, il 20 novembre riesci a venire a Napoli?"
    # merlin-1365_0100093-3
    - learner: "Verrò con piacere al matrimonio e possibilmente posso restare qualche giorni a Napoli."
      errors: [noun-number]
    - tutor: "Che bella notizia! Solo una cosa: dopo «qualche», il nome va al singolare o al plurale?"
      prompt: {text: "qualche giorni", tags: [noun-number]}
    - learner: "Qualche giorno, certo. Non conosco ancora bene la città."
    - tutor: "Esatto. Allora ti facciamo da guida noi! Vieni da solo o con la tua ragazza?"
      goals: [date]
    - learner: "Vengo da solo, Anna lavora quel fine settimana."
    - tutor: "Peccato, salutala tanto da parte nostra. Al ristorante ci sarà pesce, e per il regalo c'è una lista in Via Toledo: stasera ti mando l'indirizzo."
      goals: [guests, food, gift]
    # merlin-1365_0100093-6
    - learner: "Un caro saluto e a presto!"
    - tutor: "A presto, Michele! Ti aspettiamo a Napoli."

- scenario: compleanno
  level: B1
  persona: es-f-teacher
  history: [possessive, preposition]
  turns:
    - tutor: "Ciao! Hai visto l'invito? Io e Stefano ci sposiamo, finalmente!"
    # merlin-1365_0100285-0
    - learner: "Congratulazioni per i suoi matrimonio."
      errors: [possessive]
    - tutor: "Grazie mille! Ma «i suoi matrimonio»? Stai parlando con me e con Stefano: di chi è il matrimonio?"
      prompt: {text: "i suoi matrimonio", tags: [possessive]}
    - learner: "Per il vostro matrimonio, scusa! Congratulazioni a tutti e due."
    - tutor: "Esatto, grazie! Allora, venite anche tu e la tua famiglia?"
    # merlin-1365_0100285-2
    - learner: "Con piacere veniamo al matrimonio."
    - tutor: "Che gioia! Ci sposiamo alle undici nella chiesa di San Zeno, poi pranzo fuori città."
      goals: [date]
    # merlin-1365_0100285-3
    - learner: "A 20 Novembre mio fratello fa il suo compleanno."
      errors: [preposition]
    - tutor: "Proprio quel giorno? Ma attenzione alla data: davanti al numero del giorno, «a» va bene o serve un'altra parola?"
      prompt: {text: "A 20 Novembre", tags: [preposition]}
    - learner: "Il 20 novembre, sì. Facciamo un pranzo per lui a mezzogiorno, poi veniamo alla festa."
    - tutor: "Esatto. Nessun problema, la festa dura fino a sera! Vi teniamo tre posti al tavolo degli amici."
      goals: [guests]
    - learner: "Grazie! E per il regalo, avete qualche idea?"
    - tutor: "Abbiamo una piccola lista in un negozio di casa, ma va bene anche un pensiero semplice."
      goals: [gift]
    # merlin-1365_0100285-9
    - learner: "Conosco Verona così bene e posso consigliare un albergo carino specialmente per una coppia matrimoniale."
    - tutor: "Davvero? Allora dimmi il nome, così lo consigliamo agli zii di Stefano che arrivano da Bari. E al pranzo si mangia benissimo, vedrai!"
      goals: [food]

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao Maria! Allora, è arrivato il nostro invito?"
    # merlin-1365_0100447-0
    - learner: "Grazie mille per il vostro invito per la festa del matrimonio."
    - tutor: "Figurati! Volevamo che fossi tra i primi a saperlo."
    # merlin-1365_0100447-1
    - learner: "Mi ha fatto un gran piacere e sono veramente contenta per voi due che finalmente abbiate deciso di sposarvi."
    - tutor: "Eh sì, dopo otto anni insieme era ora! Pensi di farcela, il 20 novembre?"
    # merlin-1365_0100447-3
    - learner: "Benché io abbia tanto da fare al lavoro, non vorrei evitare d'essere parte della festa grande."
    - tutor: "Quindi vuoi dire che ci sarai, anche con tutto quel lavoro? Sarebbe bellissimo!"
    # merlin-1365_0100447-7
    - learner: "Sono felice che io riesca a venire."
      errors: [subjunctive-use]
    - tutor: "Che bello! Ma nella frase il soggetto è sempre lo stesso, cioè tu. Dopo «sono felice» ci vuole davvero «che io»?"
      prompt: {text: "che io riesca", tags: [subjunctive-use]}
      new: [{lemma: soggetto, gloss: subject}]
    - learner: "Sono felice di riuscire a venire!"
    - tutor: "Esatto! Allora ti mettiamo al tavolo con Giulia e Marco, i nostri compagni dell'università."
      goals: [date, guests]
    # merlin-1365_0100447-4
    - learner: "Inoltre, vi voglio chiedere se avete una idea per un regalo."
    - tutor: "Abbiamo una piccola lista in un negozio del centro, ma la cosa più importante è che ci sei tu."
      goals: [gift]
    # merlin-1365_0100447-6
    - learner: "Faremo una bella cena perciò ci vediamo di nuovo."
    - tutor: "Una cena da te quando torniamo dal viaggio? Con piacere! Al matrimonio, invece, ci sarà tanto pesce."
      goals: [food]
    # merlin-1365_0100447-9
    - learner: "Baci e abbracci!"
    - tutor: "Un abbraccio grande anche a te, Maria. A presto!"

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [participle-agreement, possessive]
  turns:
    - tutor: "Ciao! Hai saputo? Io e Beatrice ci sposiamo il 20 novembre!"
    # merlin-1365_0100027-1
    - learner: "Mi accorgo di quando vi siete incontrato sulla panchina dell'università."
      errors: [participle-agreement]
    - tutor: "Ah, quella panchina! Ma «vi siete incontrato»: eravamo in due, io e Beatrice. Come cambia la fine del participio?"
      prompt: {text: "vi siete incontrato", tags: [participle-agreement]}
      new: [{lemma: participio, gloss: participle}]
    - learner: "Vi siete incontrati, scusa! Sto sorridendo, che ricordi."
    - tutor: "Esatto! Sono passati dieci anni, incredibile. Allora, il 20 ci sei?"
    # merlin-1365_0100027-2
    - learner: "Afortunatamente, non potrò venire al vostro matrimonio."
      errors: [word-choice]
    - tutor: "Sfortunatamente non puoi venire? Che peccato, ci mancherai! Hai un impegno di lavoro?"
      recast: {text: "Afortunatamente", fix: "Sfortunatamente", tags: [word-choice]}
      new: [{lemma: sfortunatamente, gloss: unfortunately}]
      goals: [date]
    - learner: "Sì, ho un corso a Madrid proprio quella settimana."
    - tutor: "Capisco. Allora faremo una cena con te e gli amici che non possono venire, a dicembre. Ti teniamo anche un pezzo di torta!"
      goals: [guests, food]
    # merlin-1365_0100027-4
    - learner: "Potreste dirmi quello che vi piacerebbe per vostra nuova vita?"
      errors: [possessive]
    - tutor: "Che pensiero gentile! Ma «per vostra nuova vita»: prima di «vostra», con un nome singolare, ci vuole l'articolo o no?"
      prompt: {text: "per vostra nuova vita", tags: [possessive]}
    - learner: "Per la vostra nuova vita, giusto. Qualcosa per la casa, forse?"
    - tutor: "Proprio così! Ci serve una macchina del caffè: la nostra è rotta da mesi."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [articulated-preposition, article-form]
  turns:
    - tutor: "Ciao! Hai ricevuto l'invito? Ti aspettiamo in chiesa e poi al ristorante!"
    - learner: "Sì, grazie! Che bella notizia, sono felicissima per voi."
    - tutor: "Grazie, cara! Allora, ci sarai?"
    # merlin-1365_0100094-1
    - learner: "Ma al 20 novembre non è possibile per me."
      errors: [articulated-preposition]
    - tutor: "Oh no! Ma senti la data: «al 20 novembre». Per dire un giorno preciso, cosa usiamo davanti al numero?"
      prompt: {text: "al 20 novembre", tags: [articulated-preposition]}
    - learner: "Il 20 novembre non è possibile, ho un esame a Parigi."
    - tutor: "Esatto. Peccato, ma l'esame è importante! E poi quel giorno siamo già in pochi: lo zio di Stefano si è rotto una gamba."
      goals: [date]
    # merlin-1365_0100094-3
    - learner: "Mi dispiace molto per il infortunato!"
      errors: [article-form]
    - tutor: "Sì, povero zio! Ma «il infortunato»: la parola comincia con una «i». L'articolo resta così?"
      prompt: {text: "il infortunato", tags: [article-form]}
    - learner: "Mi dispiace molto per l'infortunato."
    - tutor: "Esatto, glielo diremo. Verrà lo stesso, e anche i suoi tre nipoti."
      goals: [guests]
    # merlin-1365_0100094-4
    - learner: "Avete voi una lista per le regali?"
      errors: [noun-gender]
    - tutor: "Una lista per «le regali»? Pensa all'articolo: «regalo» è maschile o femminile?"
      prompt: {text: "le regali", tags: [noun-gender]}
    - learner: "Per le regali, sì."
      errors: [noun-gender]
    - tutor: "Sì, abbiamo una lista per i regali in un negozio di Napoli, ma non devi sentirti obbligata."
      recast: {text: "le regali", fix: "i regali", tags: [noun-gender]}
      goals: [gift]
    - learner: "Allora vi porto qualcosa di buono da Parigi: macarons per tutti!"
    - tutor: "Che idea! Li mettiamo sul tavolo dei dolci, vicino alla torta."
      goals: [food]

- scenario: compleanno
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Avete letto il nostro invito? Ci sposiamo il 20 novembre!"
    # merlin-1365_0100289-0
    - learner: "Tanti auguri per voi due!"
    - tutor: "Grazie mille! Tu e Michele venite, vero?"
    # merlin-1365_0100289-2
    - learner: "Che fortuna bellissima... Grazie mille per l'invito alla cerimonia e al ristorante."
    - tutor: "Figurati, senza di voi non sarebbe una vera festa! Allora il 20 siete liberi?"
    # merlin-1365_0100289-4
    - learner: "Abbiamo già prenotato tutto il giorno e lo abbiamo marcato con un cuore rosso sul calendario."
    - tutor: "Un cuore rosso, che dolci! Allora vi mettiamo al tavolo con i miei cugini di Torino, sono simpaticissimi."
      goals: [date, guests]
    # merlin-1365_0100289-5
    - learner: "C'è una cosa che possiamo regalarvi?"
    - tutor: "Ci piacerebbe qualcosa per il viaggio in Giappone, ma decidete voi, davvero."
      goals: [gift]
    # merlin-1365_0100289-7
    - learner: "Con che possiamo aiutarvi?"
    - tutor: "Che gentili! Magari con i dolci: la torta la fa mia madre, ma servono biscotti per il caffè. E poi abbiamo una notizia: Stefano ha trovato casa per noi due!"
      goals: [food]
    # merlin-1365_0100289-9
    - learner: "Siamo contenti saperla... Aspettiamo il vostro giorno più bello del mondo."
      errors: [preposition]
    - tutor: "Che carini! Ma «siamo contenti saperla»: dopo «contenti», che preposizione mettiamo prima del verbo?"
      prompt: {text: "contenti saperla", tags: [preposition]}
    - learner: "Siamo contenti di saperla! Vi mandiamo tanti baci."
    - tutor: "Esatto! Baci anche a voi due, ci vediamo il 20."

- scenario: compleanno
  level: B1
  persona: en-m-retired
  history: [hypothetical, possessive]
  turns:
    - tutor: "Allora, Michele, hai visto l'invito? Il 20 novembre ci sposiamo!"
    - learner: "Sì, che bella notizia! Però quella settimana ho un congresso a Vienna."
    - tutor: "Oh no, proprio quella settimana? Non puoi spostarlo?"
    # merlin-1365_0100092-3
    - learner: "Sarei molto contento se porrei annulare la mia participazion a questo congresso."
      errors: [hypothetical, spelling]
    - tutor: "Lo spero anch'io! Ma «se porrei»: dopo «se», in una frase così, che modo del verbo usiamo?"
      prompt: {text: "se porrei", tags: [hypothetical]}
    - learner: "Se potessi annullarla, sarei molto contento. Ma non è possibile."
    - tutor: "Esatto. Che peccato, però! Ci mancherai tanto."
      goals: [date]
    # merlin-1365_0100092-4
    - learner: "Avrei un proposto concreto."
      errors: [word-choice]
    - tutor: "Una proposta concreta? Dimmi tutto, sono curioso!"
      recast: {text: "un proposto concreto", fix: "una proposta concreta", tags: [word-choice]}
      new: [{lemma: concreto, gloss: concrete}]
    - learner: "Venite da me il 19 dicembre e facciamo una piccola festa a casa mia."
    - tutor: "Che bello! Portiamo anche i nostri testimoni, Luca e Chiara? E il dolce lo prepara Beatrice."
      goals: [guests, food]
    # merlin-1365_0100092-5
    - learner: "Potete dirmi doppo vostro matrimonio cosa posso regalarvi."
      errors: [possessive, spelling]
    - tutor: "Certo! Ma «vostro matrimonio» così, da solo? Con «vostro» davanti a un nome, che cosa mettiamo prima?"
      prompt: {text: "vostro matrimonio", tags: [possessive]}
    - learner: "Dopo il vostro matrimonio, scusa."
    - tutor: "Esatto. Va bene, te lo diciamo dopo il viaggio: per ora non pensarci."
      goals: [gift]
    # merlin-1365_0100092-6
    - learner: "Allora a più tardi!"
    - tutor: "A più tardi, Michele, e grazie per la proposta!"

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [noun-gender]
  turns:
    - tutor: "Ciao! È arrivato il nostro invito? Ci sposiamo a Napoli, il 20 novembre."
    - learner: "Sì, l'ho ricevuto ieri. Congratulazioni a tutti e due!"
    - tutor: "Grazie! So che sei lontano, ma ci terremmo tanto ad averti con noi."
    # merlin-1365_0100172-2
    - learner: "Anche vi ringrazio per la vostra invitazione e anche se Napoli è lontano da Germania, posso andare a Napoli in novembre per vedere il vostro matrimonio."
      errors: [articulated-preposition]
    - tutor: "Che bello, allora vieni! Ma «lontano da Germania»: con i nomi di paese, la preposizione «da» va da sola?"
      prompt: {text: "da Germania", tags: [articulated-preposition]}
    - learner: "Lontano dalla Germania, giusto. Ma prendo l'aereo, è facile."
    - tutor: "Esatto. Allora ti prenotiamo un posto al tavolo con i miei colleghi, sono simpatici."
      goals: [date, guests]
    # merlin-1365_0100172-3
    - learner: "Ho una problema perché non posso ballare, ma forse posso fare un corso di balla."
      errors: [noun-gender, word-choice]
    - tutor: "Ahah, nessuno ti obbliga! Ma «una problema»: questa parola finisce in -a, però è maschile o femminile?"
      prompt: {text: "una problema", tags: [noun-gender]}
    - learner: "Un problema! Però vorrei imparare almeno un valzer."
    - tutor: "Esatto, è maschile. E per il valzer ti insegna Beatrice: lei balla benissimo. Dopo la cena, poi, c'è musica fino a tardi!"
      goals: [food]
    - learner: "Perfetto. E vi porto un regalo dalla Germania, una sorpresa."
    - tutor: "Una sorpresa? Allora non chiediamo niente!"
      goals: [gift]
    # merlin-1365_0100172-5
    - learner: "Tanti auguri!"
    - tutor: "Grazie, a presto!"

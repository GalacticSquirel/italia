# B1 real-learner letters (round 7): applications for internships, turned into interviews.
# The tutor is the HR manager the letter was written to.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [possessive, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000143-1
    - learner: "Mi sono laureata in Scienza della Comunicazione, Scienza dell'Arte ed Italiano e ho una buona conoscenza sia della lingua inglese sia di quella italiana."
    - tutor: "Che studi interessanti! E perché ha scelto proprio la nostra azienda?"
      goals: [intro]
    # merlin-1325_9000143-0
    - learner: "Vi contatto perché so che Vostra ditta gestisce un grande reparto per le relazioni pubbliche e che pone l'accento sulla comunicazione interculturale, specialmente con la Germania."
      errors: [possessive]
    - tutor: "È vero, lavoriamo molto con Berlino e Monaco. Ma «so che Vostra ditta»: davanti a «Vostra», che cosa ci vuole?"
      prompt: {text: "Vostra ditta", tags: [possessive]}
    - learner: "So che la Vostra ditta lavora molto con la Germania."
    - tutor: "Esatto. Per noi la Germania è il primo cliente. E con i programmi del computer, che esperienza ha?"
      goals: [why]
    # merlin-1325_9000143-2
    - learner: "Possiedo buone conoscenze di Word, Office ed Excel."
    - tutor: "Bene, li usiamo ogni giorno. E come si trova quando lavora con gli altri?"
      goals: [experience]
    # merlin-1325_9000143-3
    - learner: "Ho facilità di relazione, capacità di operare in équipe e mi adatto sulle esigenze della struttura in cui lavoro."
      errors: [articulated-preposition]
    - tutor: "Questo è importante qui. Ma «mi adatto sulle esigenze»: dopo «mi adatto», che preposizione usiamo?"
      prompt: {text: "sulle esigenze", tags: [articulated-preposition]}
    - learner: "Mi adatto alle esigenze della struttura."
    - tutor: "Esatto. Da noi i progetti cambiano spesso, quindi serve proprio questo. Ha domande per me?"
      goals: [strengths]
    - learner: "Sì: in che periodo potrei fare lo stage?"
    - tutor: "Pensavamo all'estate. Lei quando sarebbe libera?"
      goals: [questions]
    # merlin-1325_9000143-4
    - learner: "Sarei disponibile per lo stage sia in tutto il mese di giugno sia nelle prime due settimane di luglio."
    - tutor: "Perfetto, allora le proponiamo tutto giugno. Le scriviamo entro venerdì. Arrivederci!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [article-use, noun-number]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001089-0
    - learner: "Sono una assistente e vorrei lavorare in un negozio di abbigliamento."
    - tutor: "Piacere! E che cosa sa fare, in pratica?"
      goals: [intro]
    # merlin-1325_1001089-1
    - learner: "Secondo me io posso tenere i contatti con i clienti o posso utilizzare i programmi informatici per la gestione del personale."
    - tutor: "Ottimo, il computer ci serve per organizzare i turni. Ha già lavorato?"
      goals: [strengths]
    # merlin-1325_1001089-5
    - learner: "Sono molto giovanile e così purtroppo non ho lavorato molto, ma l'estate scorsa ho lavorato come un «baby sitter»."
      errors: [article-use, word-choice]
    - tutor: "Capisco. Ma «come un baby sitter»: dopo «come», per dire un lavoro, l'articolo serve?"
      prompt: {text: "come un «baby sitter»", tags: [article-use]}
    - learner: "Come baby sitter, sì, per tre mesi."
    - tutor: "Esatto. È un lavoro di responsabilità! E com'è finita?"
      goals: [experience]
    # merlin-1325_1001089-7
    - learner: "Ho dovuto abbandonare due ragazze piccole."
    - tutor: "Cioè, alla fine ha dovuto lasciare quel lavoro? Mi dispiace per le bambine! E perché ora vuole lavorare proprio nella moda?"
    - learner: "Perché mi piacciono tantissimo i vestiti e parlare con la gente."
    - tutor: "Sono due cose importanti in negozio. Ha qualche domanda per me?"
      goals: [why]
    # merlin-1325_1001089-3
    - learner: "Ho quache domande per esempio quando si deve cominciare il lavoro, e quanto si deve lavorare durante un giorno?"
      errors: [noun-number, spelling]
    - tutor: "Certo! Ma attenzione: dopo «quache», il nome resta plurale o diventa singolare?"
      prompt: {text: "quache domande", tags: [noun-number]}
    - learner: "Ho qualche domanda: quando si comincia e quante ore si lavora al giorno?"
    - tutor: "Esatto. Si comincia il primo marzo, sei ore al giorno, dal lunedì al venerdì. Le faremo sapere presto!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Mi chiamo Pablo Ruiz, ho ventotto anni e vengo da Valencia."
    - tutor: "Benvenuto! Vedo che ha lavorato in un negozio di scarpe."
      goals: [intro]
    # merlin-1325_1001157-2
    - learner: "Ho lavorato lì tre anni."
    - tutor: "Tre anni, bene. E che cosa faceva di preciso?"
    - learner: "Servivo i clienti e controllavo le scarpe in magazzino."
    - tutor: "Un'esperienza utile. Preferisce lavorare da solo o con altre persone?"
      goals: [experience]
    # merlin-1325_1001157-5
    - learner: "Mi piace lavorare in un gruppo."
    - tutor: "Ottimo, qui siamo una squadra di otto persone. Perché vuole questo posto?"
      goals: [strengths]
    - learner: "Perché vorrei lavorare nella moda, è la mia passione."
    - tutor: "Si vede! Ha domande per me?"
      goals: [why]
    # merlin-1325_1001157-8
    - learner: "Posso parlare qualche informazione dell'orario di lavoro e la data del lavoro?"
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «informazione dell'orario»: per dire di che cosa parla un'informazione, che preposizione usiamo?"
      prompt: {text: "dell'orario", tags: [articulated-preposition]}
    - learner: "Qualche informazione sull'orario di lavoro e sulla data di inizio."
    - tutor: "Esatto. Si lavora dalle nove alle cinque e si comincia il 2 maggio."
      goals: [questions]
    # merlin-1325_1001157-11
    - learner: "Se avesse qualche domanda sono nella Sua disposizione."
      errors: [articulated-preposition]
    - tutor: "Grazie! Ma «nella Sua disposizione»: in questa frase fissa, «nella» non va bene. Che preposizione ci vuole?"
      prompt: {text: "nella Sua disposizione", tags: [articulated-preposition]}
    - learner: "Sono nella Sua disposizione per tutte le domande."
      errors: [articulated-preposition]
    - tutor: "Grazie, anch'io resto a Sua disposizione. Le scriviamo entro la fine della settimana!"
      recast: {text: "nella Sua disposizione", fix: "a Sua disposizione", tags: [articulated-preposition]}

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [article-use, tense-aspect, preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Vedo dal curriculum che viene da un giornale di moda: mi parli un po' di lei."
    # merlin-1325_1001091-2
    - learner: "Lì lavoravo come la assistente del direttore generale."
      errors: [article-use]
    - tutor: "Interessante! Ma «come la assistente»: quando dice il suo lavoro dopo «come», l'articolo serve?"
      prompt: {text: "come la assistente", tags: [article-use]}
    - learner: "Lavoravo come assistente del direttore generale."
    - tutor: "Esatto. Un ruolo importante! E per quanto tempo?"
      goals: [intro]
    # merlin-1325_1001091-4
    - learner: "Lavoravo a Vogue per 8 anni."
      errors: [tense-aspect, preposition]
    - tutor: "Otto anni, molto bene! Ma «lavoravo per 8 anni»: è un periodo chiuso, finito. Che tempo usiamo?"
      prompt: {text: "Lavoravo", tags: [tense-aspect]}
    - learner: "Ho lavorato lì per otto anni."
    - tutor: "Esatto. E perché ha lasciato il giornale?"
      goals: [experience]
    # merlin-1325_1001091-7
    - learner: "Ho smesso lavorare a Vogue grazie alla crisi."
      errors: [preposition, word-choice]
    - tutor: "Capisco. Ma «ho smesso lavorare»: dopo «smettere», prima dell'infinito, che preposizione mettiamo?"
      prompt: {text: "smesso lavorare", tags: [preposition]}
    - learner: "Ho smesso di lavorare lì per colpa della crisi."
    - tutor: "Esatto. Purtroppo la crisi ha colpito molti giornali. Qual è il suo punto di forza?"
    # merlin-1325_1001091-5
    - learner: "Il mio forte è che sono puntuale, posso avere rapporti facilmente e non ho paura di domandare quando non so qualcosa."
    - tutor: "Sono qualità preziose qui. A volte però lavoriamo fino a tardi: è un problema?"
      goals: [strengths]
    # merlin-1325_1001091-11
    - learner: "L'orario di lavoro non è importante per me perché non avendo famiglia posso lavorare tanto."
    - tutor: "Bene, ma non vogliamo farla lavorare troppo! Perché ha scelto proprio noi?"
    - learner: "Mi piacciono molto i vostri cataloghi. E quando comincerei, se mi prendete?"
    - tutor: "Il primo del mese prossimo. Le faremo sapere entro lunedì, arrivederci!"
      goals: [why, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition, preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000215-2
    - learner: "Due anni fa mi sono diplomata nel «gymnasium» che corrisponde al liceo."
      errors: [articulated-preposition]
    - tutor: "Bene. Ma «diplomata nel gymnasium»: con questo verbo, «nel» è la preposizione giusta?"
      prompt: {text: "nel «gymnasium»", tags: [articulated-preposition]}
    - learner: "Mi sono diplomata al gymnasium, cioè al liceo."
    - tutor: "Esatto. E dopo la scuola?"
      goals: [intro]
    - learner: "Mi sono iscritta a un'accademia di lingue, dove studio inglese e italiano. E d'estate lavoro in un ufficio turistico."
    - tutor: "Ecco perché parla così bene! Che cosa le riesce meglio, in ufficio?"
      goals: [experience]
    # merlin-1325_9000215-7
    - learner: "Inoltre sono molto capace ad organizzare viaggi e gite."
      errors: [preposition]
    - tutor: "Molto utile per noi! Ma «capace ad organizzare»: con «capace», che preposizione va prima del verbo?"
      prompt: {text: "capace ad organizzare", tags: [preposition]}
    - learner: "Sono molto capace di organizzare viaggi e gite."
    - tutor: "Esatto. E perché proprio la nostra agenzia?"
      goals: [strengths]
    # merlin-1325_9000215-8
    - learner: "Credo che la Vostra ditta sia il posto giusto per me."
    - tutor: "Grazie! Perché lo pensa?"
    # merlin-1325_9000215-10
    - learner: "Perciò penso che forse uno stage in Italia sia proprio il modo giusto e una buonissima opportunità per migliorare."
    - tutor: "Sono d'accordo, qui imparerà moltissimo. Ha domande per me?"
      goals: [why]
    - learner: "Sì: lo stage è a tempo pieno?"
    - tutor: "Sì, otto ore al giorno, per tre mesi. Le scriviamo la settimana prossima!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [possessive, participle-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001092-2
    - learner: "Io sono studentessa all'università di Bologna."
    - tutor: "Bene! E come ha saputo di questo posto?"
      goals: [intro]
    # merlin-1325_1001092-0
    - learner: "Io ho letto Suo annuncio."
      errors: [possessive]
    - tutor: "Ah, l'annuncio sul sito? Ma «ho letto Suo annuncio»: con «Suo», davanti, cosa ci vuole?"
      prompt: {text: "Suo annuncio", tags: [possessive]}
    - learner: "Ho letto il Suo annuncio su internet."
    - tutor: "Esatto. E ha già lavorato?"
    # merlin-1325_1001092-10
    - learner: "Io ho lavorata a cinama, si chiama cinema centro."
      errors: [participle-agreement, preposition, spelling]
    - tutor: "Ah, interessante! Ma «ho lavorata»: con il verbo «avere», il participio cambia anche se lei è una donna?"
      prompt: {text: "ho lavorata", tags: [participle-agreement]}
      new: [{lemma: participio, gloss: participle}]
    - learner: "Ho lavorato in un cinema, il Cinema Centro."
    - tutor: "Esatto. E cosa faceva al cinema?"
      goals: [experience]
    - learner: "Vendevo i biglietti e parlavo con i clienti."
    - tutor: "Quindi è abituata al pubblico. Come si trova con i clienti?"
    # merlin-1325_1001092-5
    - learner: "Sono molto contenta con i clienti."
    - tutor: "Ottimo, qui ne vediamo tanti ogni giorno! Perché vuole lavorare nella moda?"
      goals: [strengths]
    - learner: "Perché amo i vestiti e un giorno vorrei aprire un negozio."
    - tutor: "Un bel sogno! Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001092-6
    - learner: "Io posso comincare al lavoro a lunedi."
      errors: [articulated-preposition, preposition, spelling]
    - tutor: "Certo! Ma con i giorni della settimana, davanti al giorno, serve quella «a»?"
      prompt: {text: "a lunedi", tags: [preposition]}
    - learner: "Posso cominciare il lavoro lunedì?"
    - tutor: "Esatto. Sì, lunedì va benissimo: alle nove, qui in negozio."
      goals: [questions]
    # merlin-1325_1001092-13
    - learner: "La ringrazio per la gentile attenzione."
    - tutor: "Grazie a lei! A lunedì, allora."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [subject-verb-agreement, adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001162-1
    - learner: "Tre anni fa ho fatto l'esame di maturità in un liceo bilingue."
    - tutor: "Un liceo bilingue, interessante! E adesso che cosa fa?"
    # merlin-1325_1001162-2
    - learner: "In quest'anno farà il mio lavoro di diploma come MR manager."
      errors: [preposition, subject-verb-agreement]
    - tutor: "Bene! Ma «farà»: sta parlando di sé stessa, quindi come diventa il verbo?"
      prompt: {text: "farà", tags: [subject-verb-agreement]}
    - learner: "Quest'anno farò il mio lavoro di diploma come manager."
    - tutor: "Esatto. E ha già un po' di esperienza in questo lavoro?"
      goals: [intro]
    # merlin-1325_1001162-6
    - learner: "Ho già una minima esperienza nel settore perché tutte l'estate ho lavorato in una grande agenzia come una assistente."
      errors: [adjective-agreement, article-use]
    - tutor: "Ottimo! Ma «tutte l'estate»: l'estate è una sola, quindi come diventa «tutte»?"
      prompt: {text: "tutte l'estate", tags: [adjective-agreement]}
    - learner: "Tutta l'estate ho lavorato in una grande agenzia."
    - tutor: "Esatto. E che cosa faceva lì?"
      goals: [experience]
    # merlin-1325_1001162-9
    - learner: "E ancora ho dovuto assistere il personale in ufficio."
    - tutor: "Quindi conosce già il lavoro d'ufficio. Qual è il suo punto di forza?"
    - learner: "Sono precisa e imparo in fretta."
    - tutor: "Qualità utili. Perché vuole venire proprio da noi?"
      goals: [strengths]
    - learner: "Perché la vostra agenzia lavora con tutta l'Europa."
    - tutor: "È vero, abbiamo clienti in dodici paesi. Ha domande?"
      goals: [why]
    # merlin-1325_1001162-12
    - learner: "Questo lavoro è fisso o no?"
    - tutor: "Il primo periodo è di sei mesi, poi possiamo offrire un contratto. Le faremo sapere presto!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [noun-gender, adjective-agreement, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001086-1
    - learner: "Ecco la mia candidattura e come vedrà la mia curriculum vitae."
      errors: [noun-gender, spelling]
    - tutor: "Grazie. Ma «la mia curriculum»: «curriculum» è maschile o femminile?"
      prompt: {text: "la mia curriculum", tags: [noun-gender]}
    - learner: "Il mio curriculum, scusi. Eccolo."
    - tutor: "Esatto, grazie. Vedo che ha finito l'università e che ha già lavorato in banca. Perché sarebbe la persona giusta per noi?"
      goals: [intro, experience]
    # merlin-1325_1001086-4
    - learner: "Secondo me sono un ottimo candidata, perché sono responsabile, carine e gentile, amo lavorare fra genti."
      errors: [adjective-agreement]
    - tutor: "Mi piace la sicurezza! Ma «un ottimo candidata»: lei è una donna, quindi?"
      prompt: {text: "un ottimo candidata", tags: [adjective-agreement]}
    - learner: "Sono un'ottima candidata, perché sono responsabile e gentile, e amo lavorare con la gente."
    - tutor: "Esatto! E qui si lavora sempre con la gente. Ha domande sull'orario?"
      goals: [strengths, why]
    # merlin-1325_1001086-6
    - learner: "Da mattina al pomerrigio?"
      errors: [articulated-preposition, spelling]
    - tutor: "«Da mattina»: davanti a «mattina», qui, «da» va da sola o insieme all'articolo?"
      prompt: {text: "Da mattina", tags: [articulated-preposition]}
    - learner: "Dalla mattina al pomeriggio?"
    - tutor: "Esatto: dalle nove alle cinque, con un'ora di pausa."
    - learner: "Benissimo. E posso cominciare il mese prossimo?"
    - tutor: "Sì, dal primo giugno. Le faremo sapere entro venerdì, arrivederci!"
      goals: [questions]

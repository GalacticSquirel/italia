# B1 real-learner letters (round 7): helping a friend who is looking for work. The tutor is the
# friend the letter was written to; the learner talks about their own job and gives advice.
- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [verb-form, preposition]
  turns:
    - tutor: "Ciao! Hai visto il mio messaggio? Io lavoro ancora da casa, ma sto cercando un altro lavoro."
    # merlin-1385_0001736-0
    - learner: "Grazie per la tua risposta, sono molto contenta che tutto vada bene!"
    - tutor: "Sì, la famiglia sta bene, grazie! Il lavoro invece un po' meno."
    # merlin-1385_0001736-1
    - learner: "Adesso io so che tu cherchi un nuovo posto di lavoro."
      errors: [verb-form]
    - tutor: "Eh sì. Ma «cherchi»: il verbo è «cercare». Come si dice con «tu»?"
      prompt: {text: "cherchi", tags: [verb-form]}
    - learner: "Tu cerchi un nuovo posto di lavoro, vero?"
    - tutor: "Esatto, lo cerco da un mese."
    # merlin-1385_0001736-2
    - learner: "Io voglio aiutarti, ma ho bisogno di qualche informazione in più."
    - tutor: "Grazie, sei un tesoro! Chiedimi pure."
    # merlin-1385_0001736-3
    - learner: "Soprattutto: dove lavori adesso?"
    - tutor: "In una piccola ditta, a Verona. Ma lavoro quasi sempre da casa."
      goals: [situation]
    # merlin-1385_0001736-4
    - learner: "Questa ditta è grande o piccola?"
    - tutor: "È piccola, siamo in venti. Per questo non posso fare carriera."
      goals: [cons]
    # merlin-1385_0001736-5
    - learner: "In che cosa consiste il tuo lavoro?"
    - tutor: "Preparo le fatture e parlo con i clienti al telefono. Il vantaggio è che decido io il mio orario."
      goals: [pros]
    # merlin-1385_0001736-7
    - learner: "Invece che tipo di lavoro vuoi fare?"
    - tutor: "Mi piacerebbe lavorare con le lingue, magari in un'agenzia di viaggi. E in ufficio, con i colleghi!"
      goals: [preference]
    # merlin-1385_0001736-10
    - learner: "Io aspetto la tua email e spero che rivederti presto."
      errors: [preposition]
    - tutor: "Te la scrivo stasera! Ma «spero che rivederti»: se dopo «spero» c'è un infinito, si usa «che»?"
      prompt: {text: "spero che rivederti", tags: [preposition]}
    - learner: "Spero di rivederti presto!"
    - tutor: "Esatto! Anch'io, magari a Natale."
    # merlin-1385_0001736-11
    - learner: "Baci ed abbracci!"
    - tutor: "Baci anche a te, a presto!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [subject-verb-agreement, hypothetical]
  turns:
    - tutor: "Ciao Michele! Quanto tempo! Come va?"
    # merlin-1365_0100071-1
    - learner: "La mia vita è cambiata."
    - tutor: "Davvero? Racconta!"
    # merlin-1365_0100071-2
    - learner: "Vivo insieme con la mia ragazza."
    - tutor: "Che bello, salutala da parte mia! Io ho appena finito la maturità e cerco lavoro. Pensavo all'università, ma costa tanto."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100071-6
    - learner: "Oppure potresti fare una formazione in un albergo."
    - tutor: "In un albergo? Non è una cattiva idea. Tu come hai cominciato?"
    # merlin-1365_0100071-7
    - learner: "Anch'io ho fatto una formazione in una ditta."
    - tutor: "E adesso che cosa fai?"
    # merlin-1365_0100071-8
    - learner: "Adesso lavoro per il settore alimentare e costruisco macchine."
    - tutor: "Macchine per il cibo, interessante! E ti trovi bene?"
      goals: [situation]
    # merlin-1365_0100071-9
    - learner: "Sono contento con la mia vita e non mi manco niente."
      errors: [subject-verb-agreement]
    - tutor: "Che bello! Ma «non mi manco niente»: qui il soggetto è «niente». Come va il verbo, allora?"
      prompt: {text: "non mi manco niente", tags: [subject-verb-agreement]}
      new: [{lemma: soggetto, gloss: subject}]
    - learner: "Non mi manca niente, sono davvero contento."
    - tutor: "Esatto! E nella tua ditta, secondo te, ci sarebbe posto anche per me?"
      goals: [pros]
    # merlin-1365_0100071-11
    - learner: "Se vorresti, chiedo il mio capo se tu potresti fare una formazione nella ditta."
      errors: [hypothetical, preposition]
    - tutor: "Sarebbe fantastico! Ma «se vorresti»: dopo «se», per una cosa possibile adesso, usiamo il condizionale?"
      prompt: {text: "Se vorresti", tags: [hypothetical]}
    - learner: "Se vuoi, chiedo al mio capo."
    - tutor: "Esatto! Sì, ti prego, chiediglielo. Stare a casa ad aspettare non mi piace: meglio imparare un lavoro vero."
      goals: [cons, preference]
    # merlin-1365_0100071-13
    - learner: "Ti mando tanti auguri per il tuo esame."
    - tutor: "Grazie! Ormai è passato, e l'ho superato!"
    # merlin-1365_0100071-14
    - learner: "Hai fatto benissimo, caspita!"
    - tutor: "Ahah, grazie! Sono ancora felicissimo."
    # merlin-1365_0100071-15
    - learner: "Aspetto le tue notizie oppure quando sei in zona fammi uno squillo."
    - tutor: "Promesso, ti chiamo quando passo da Zurigo."
    # merlin-1365_0100071-16
    - learner: "Ti saluto!"
    - tutor: "Ciao Michele, a presto!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [verb-form, noun-gender, noun-number]
  turns:
    - tutor: "Ciao! Lo sai che ho passato la maturità? Adesso però devo trovare un lavoro."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100224-0
    - learner: "Preparando il mio viaggio in Namibia, ho dimenticato di mandare un messaggio per augurti «In bocca al lupo» per la tua maturità."
      errors: [verb-form]
    - tutor: "Non importa, è andata bene lo stesso! Ma «augurti»: l'infinito è «augurare». Con «ti» attaccato, come diventa?"
      prompt: {text: "augurti", tags: [verb-form]}
    - learner: "Volevo augurarti in bocca al lupo!"
    - tutor: "Esatto, grazie! Ora però non so proprio dove cercare."
    # merlin-1365_0100224-4
    - learner: "Penso che presso la ditta dove lavora mia sorella abbia l'opportunità di dare un mano nel reparto della spedizione."
      errors: [noun-gender]
    - tutor: "Davvero? Sarebbe perfetto! Ma «un mano»: «mano» finisce in -o, ma è maschile o femminile?"
      prompt: {text: "un mano", tags: [noun-gender]}
    - learner: "Una mano, scusa! Puoi aiutare a preparare i pacchi."
    - tutor: "Esatto. Un lavoro semplice, ma per cominciare va benissimo. E tu, come va il lavoro?"
      goals: [preference]
    # merlin-1365_0100224-6
    - learner: "Durante il mese scorso ho viaggiato tre settimane per fare la promozione d'un nuovo prodotto che abbiamo sviluppato."
    - tutor: "Tre settimane in giro! E dove sei andata?"
      goals: [situation]
    # merlin-1365_0100224-7
    - learner: "Sono andata per presentarlo a qualche mostri e anche a nuovi clienti che sembrano molto interessati."
      errors: [noun-number]
    - tutor: "Che bello! Ma «qualche mostri»: dopo «qualche», il nome è singolare o plurale?"
      prompt: {text: "qualche mostri", tags: [noun-number]}
    - learner: "Qualche mostra, a Berlino e a Vienna."
    - tutor: "Esatto. Viaggiare per lavoro è bello, ma alla fine si è stanchi, no?"
      goals: [pros]
    - learner: "Sì, alla fine ero stanchissima, ma ho conosciuto tante persone."
    - tutor: "Il lato negativo è che ci si stanca, ma le persone nuove valgono la pena. Grazie per l'idea della ditta di tua sorella!"
      goals: [cons]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Ciao! Indovina: ho superato la maturità! Ma adesso non so se lavorare o studiare."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100265-5
    - learner: "Vorrei ringraziarti alla tua maturità linguistica!"
      errors: [word-choice, articulated-preposition]
    - tutor: "Ringraziarmi? Ma «ringraziare» vuol dire dire grazie: è davvero questo che vuoi dirmi per la maturità?"
      prompt: {text: "ringraziarti", tags: [word-choice]}
    - learner: "No, volevo farti i complimenti per la tua maturità!"
    - tutor: "Ah, ecco, grazie mille! Allora, tu che cosa mi consigli?"
    # merlin-1365_0100265-1
    - learner: "Vorrei raccomandarti di continuare gli studi universitari."
    - tutor: "Dici? Così però lavoro solo tra cinque anni. Tu sei contenta del tuo lavoro di insegnante?"
      goals: [preference]
    # merlin-1365_0100265-2
    - learner: "Secondo me è difficile insegnare questa materia, ma mi piace."
    - tutor: "Insegnare non è facile per nessuno! E adesso sei in vacanza, vero?"
      goals: [situation]
    # merlin-1365_0100265-4
    - learner: "Ma adesso c'è la vacanza finalmente e posso fare molte cose, che mi mancano o piacciono."
    - tutor: "Ecco il grande vantaggio del tuo lavoro: le vacanze lunghe! Io vorrei trovare un lavoro per l'estate."
      goals: [pros]
    # merlin-1365_0100265-6
    - learner: "Se vuoi, mandami il tuo curriculum, perché posso aiutarti."
    - tutor: "Grazie, te lo mando stasera. Non è molto lungo, purtroppo: ho poca esperienza."
      goals: [cons]
    # merlin-1365_0100265-8
    - learner: "Ti abbraccio forte!"
    - tutor: "Anch'io, grazie di tutto!"

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [object-pronoun, auxiliary-choice]
  turns:
    - tutor: "Ciao! Io ho finito la scuola e lavoro un po' da casa, traduzioni. E tu, hai già deciso cosa fare dopo la maturità?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100480-3
    - learner: "Ma, come tu, non ho ancora un'idea che cosa voglio fare."
      errors: [object-pronoun]
    - tutor: "Ti capisco! Ma «come tu»: dopo «come», il pronome resta «tu»?"
      prompt: {text: "come tu", tags: [object-pronoun]}
    - learner: "Come te, non ho ancora un'idea."
    - tutor: "Esatto. Siamo in due, allora!"
    # merlin-1365_0100480-5
    - learner: "Ci puoi mandare il suo curriculum."
    - tutor: "Il curriculum di chi? Di tuo fratello? Certo, mandamelo pure, lo faccio vedere al mio capo."
      goals: [situation]
    # merlin-1365_0100480-6
    - learner: "Adesso cambiamo il tema: magari puoi aiutarmi a trovare una soluzione per il mio futuro."
    - tutor: "Ci provo! Tu cosa preferiresti?"
    # merlin-1365_0100480-7
    - learner: "Non sono sicura se andare all'università o se fare un lavoro."
    - tutor: "Lavorare da casa come me ha un vantaggio: sei libera. Ma ti senti un po' sola."
      goals: [pros, cons]
    # merlin-1365_0100480-9
    - learner: "Dove ti hai informato sulle possibilità che cosa fare quando la scuola è finita?"
      errors: [auxiliary-choice, preposition]
    - tutor: "Bella domanda! Ma «ti hai informato»: con un verbo con «si», come «informarsi», che ausiliare usiamo?"
      prompt: {text: "ti hai informato", tags: [auxiliary-choice]}
      new: [{lemma: ausiliare, gloss: auxiliary verb}]
    - learner: "Dove ti sei informato?"
    - tutor: "Esatto. All'ufficio per i giovani del Comune: è gratis, e sono bravissimi. Io al tuo posto andrei lì."
      goals: [preference]
    # merlin-1365_0100480-13
    - learner: "Tanti saluti!"
    - tutor: "Ciao, fammi sapere com'è andata!"

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [articulated-preposition, preposition]
  turns:
    - tutor: "Ciao! Allora, che fai adesso? Lavori in ufficio o da casa?"
    # merlin-1365_0100270-0
    - learner: "Nell'ultime settimane ho fatto tante cose."
      errors: [articulated-preposition]
    - tutor: "Racconta! Ma «nell'ultime settimane»: «settimane» è femminile plurale. Davanti, «nell'» va bene?"
      prompt: {text: "Nell'ultime", tags: [articulated-preposition]}
    - learner: "Nelle ultime settimane, sì. Ho trovato lavoro in un teatro!"
    - tutor: "Esatto. Un teatro, che bello! Com'è?"
    # merlin-1365_0100270-3
    - learner: "Questo teatro, dove ho trovato il mio posto, è molto carino."
    - tutor: "Ed è grande?"
    # merlin-1365_0100270-4
    - learner: "È piccolo, non è il Teatro Nazionale, ma per l'inizio secondo me è perfetto."
    - tutor: "Certo, si comincia così. E lavori tutti i giorni lì, non da casa?"
      goals: [situation, pros]
    # merlin-1365_0100270-6
    - learner: "Con la mia laurea, storia dell'arte e film, non è facile di trovare un lavoro, sai."
      errors: [preposition]
    - tutor: "Lo immagino. Ma «non è facile di trovare»: dopo «è facile», prima del verbo, ci vuole «di»?"
      prompt: {text: "facile di trovare", tags: [preposition]}
    - learner: "Non è facile trovare un lavoro, lo so bene."
    - tutor: "Esatto. Ed è pagato poco, immagino."
      goals: [cons]
    - learner: "Sì, poco, ma preferisco un lavoro bello a uno con tanti soldi."
    - tutor: "Hai ragione, anch'io la penso così."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [preposition, adjective-agreement]
  turns:
    - tutor: "Ciao! Allora, tu lavori ancora o hai deciso di studiare?"
    # merlin-1365_0100163-3
    - learner: "Alla fine mi sono decisa di iscrivermi all'università perché è meglio studiare prima di lavorare nella vita."
      errors: [preposition]
    - tutor: "Brava! Ma «mi sono decisa di iscrivermi»: con «decidersi», che preposizione va prima del verbo?"
      prompt: {text: "decisa di iscrivermi", tags: [preposition]}
    - learner: "Mi sono decisa a iscrivermi, sì."
    - tutor: "Esatto. Io invece ho finito la scuola e cerco qualcosa da fare."
      goals: [preference]
    # merlin-1365_0100163-4
    - learner: "Così hai una buona formazione nel tuo curriculum."
    - tutor: "Anche questo è vero. E il tuo lavoro in ditta?"
      goals: [pros]
    # merlin-1365_0100163-7
    - learner: "Ho una meravigliosa notizia per te: la mia ditta cerca ancora uno stagista per due mesi."
    - tutor: "Davvero? In che ufficio?"
      goals: [situation]
    # merlin-1365_0100163-8
    - learner: "Se hai voglia di lavorare nella divisione delle comunicazioni esterni dove potresti anche parlare sia in tedesco sia in italiano, scrivimi."
      errors: [adjective-agreement, spelling]
    - tutor: "Mi piacerebbe tantissimo! Ma «comunicazioni esterni»: «comunicazioni» è femminile. E allora l'aggettivo?"
      prompt: {text: "comunicazioni esterni", tags: [adjective-agreement]}
    - learner: "Comunicazioni esterne, scusa!"
    - tutor: "Esatto. L'unico problema è che non so se il mio tedesco basta."
      goals: [cons]
    # merlin-1365_0100163-9
    - learner: "Che cosa ne pensi?"
    - tutor: "Penso che ci provo! Grazie di aver pensato a me."
    # merlin-1365_0100163-13
    - learner: "Congratulazioni per l'eccellente risulto!"
      errors: [word-choice]
    - tutor: "Grazie! Sì, un risultato che non mi aspettavo per niente."
      recast: {text: "risulto", fix: "risultato", tags: [word-choice]}
    # merlin-1365_0100163-14
    - learner: "Aspetto una tua risposta e ti mando tanti saluti."
    - tutor: "Ti rispondo domani, promesso!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  turns:
    - tutor: "Ciao! Finalmente ti fai sentire! Lavori ancora tanto in ufficio?"
    # merlin-1365_0100061-0
    - learner: "Visto che c'è molto lavoro in ufficio, non ho mai trovato un'oretta libera per rispondere."
    - tutor: "Lo immaginavo! Io invece sono a casa e non trovo lavoro. Hai qualche idea?"
      goals: [situation]
    # merlin-1365_0100061-3
    - learner: "Potresti fare uno stage in un albergo."
    - tutor: "In un albergo? Mi piacerebbe: si lavora con la gente e si parlano le lingue."
      goals: [pros]
    # merlin-1365_0100061-5
    - learner: "Mandami per favore subito il tuo curriculum."
    - tutor: "Subito? Va bene, ma ho paura: non ho mai lavorato davvero."
      goals: [cons]
    # merlin-1365_0100061-6
    - learner: "Potresti mandarmelo anche via e-mail così posso già cominciare a cercare."
    - tutor: "Grazie mille, te lo mando stasera. Preferirei un albergo al mare, se possibile!"
      goals: [preference]
    # merlin-1365_0100061-8
    - learner: "Volevo farti inoltre tanti auguri per l'esame."
    - tutor: "Grazie! È andato bene: ottantacinque su cento."
    # merlin-1365_0100061-11
    - learner: "A presto!"
    - tutor: "A presto, e grazie ancora!"

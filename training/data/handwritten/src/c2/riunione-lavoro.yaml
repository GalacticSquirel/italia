- scenario: riunione-lavoro
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, direi, anche se col fiato corto. Il prototipo per il cliente di Bologna è pronto all'ottanta per cento: l'interfaccia è finita, i test sono a metà. La settimana scorsa abbiamo chiuso anche la parte dei pagamenti, che era quella che mi toglieva il sonno."
  - tutor: "Ottimo, i pagamenti erano la gatta da pelare e ve la siete cavata. Però ti conosco: quando dici «bene, direi», dietro l'angolo c'è un «ma» grosso come una casa. Dov'è l'inghippo?"
    goals: [update]
    new: [{lemma: gatta da pelare, gloss: a tricky problem to deal with}, {lemma: inghippo, gloss: snag, catch}]
  - learner: "L'inghippo è il cliente. Ha cambiato idea sulla grafica per la terza volta e non ci ha ancora mandato i contenuti definitivi. Gli ho scritto ieri. Quando risponda, ti avviso subito, ma intanto su quella parte siamo fermi."
    errors: [subjunctive-use]
  - tutor: "Tre volte la grafica, andiamo bene. Aspetta però: «quando risponda»? Lo so che in spagnolo fila, ma da noi, dopo «quando», per una cosa che deve ancora succedere il congiuntivo non si usa. Come lo dici?"
    goals: [problem]
    prompt: {text: "Quando risponda", tags: [subjunctive-use]}
  - learner: "Vero, è lo spagnolo che spinge. Quando risponderà, ti avviso subito."
  - tutor: "Così. Nel frattempo non possiamo restare con le mani in mano ad aspettare i suoi comodi. Tu che lo conosci meglio di tutti, che cosa proponi per sbloccare la situazione?"
    new: [{lemma: stare con le mani in mano, gloss: to sit idle}, {lemma: fare i propri comodi, gloss: to take one's own sweet time}]
  - learner: "Proporrei di smettere di rincorrerlo per iscritto. Gli fissiamo una riunione di un'ora, gli mostriamo due versioni della grafica e gli facciamo firmare quella che sceglie. E nel contratto scriviamo che ogni cambio ulteriore si paga a parte: vedrai che gli passa la voglia."
  - tutor: "Mi piace, soprattutto la parte in cui paga: è l'unica lingua che certi clienti capiscono al volo. Allora, patti chiari: se lui firma entro venerdì, quando mi consegni tutto finito?"
    goals: [proposal]
    new: [{lemma: capire al volo, gloss: to catch on immediately}]
  - learner: "Se firma entro venerdì, mi servono dieci giorni lavorativi per finire i test, quindi direi il venti. Ma mettiamo attenzione a una cosa: se slitta lui, slitto anch'io, e vorrei che fosse scritto nel verbale."
    errors: [word-choice]
  - tutor: "Il venti mi sta bene. E hai ragione, facciamo attenzione a una cosa: lo metto a verbale, se slitta lui la scadenza si sposta di pari passo. Così nessuno potrà dire che hai menato il can per l'aia. Dai, avanti il prossimo."
    goals: [deadline]
    recast: {text: "mettiamo attenzione a una cosa", fix: "facciamo attenzione a una cosa", tags: [word-choice]}
    new: [{lemma: menare il can per l'aia, gloss: to beat about the bush, stall}, {lemma: di pari passo, gloss: in step, accordingly}, {lemma: slittare, gloss: to slip (of a date)}]

- scenario: riunione-lavoro
  level: C2
  persona: en-f-professional
  history: [preposition]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Va, ma a singhiozzo. Il rapporto per il cliente svizzero è scritto per due terzi, e l'analisi dei dati è conclusa. Mi mancano il capitolo sui costi e le conclusioni, che però dipendono da numeri che non ho ancora."
  - tutor: "A singhiozzo, addirittura: non è da te. E questi numeri che ti mancano, chi li tiene in ostaggio? Sputa il rospo."
    goals: [update]
    new: [{lemma: a singhiozzo, gloss: in fits and starts}, {lemma: sputare il rospo, gloss: to spit it out}, {lemma: ostaggio, gloss: hostage}]
  - learner: "Li tiene l'amministrazione, e il rospo è questo: per avere i dati serve una firma del direttore finanziario, che è in ferie fino al quindici. Ho chiesto per un'eccezione, ma mi hanno risposto che le regole sono regole."
    errors: [preposition]
  - tutor: "Le regole sono regole, certo, finché non servono a loro. Prima di arrabbiarmi con l'amministrazione, però: «ho chiesto per un'eccezione»? Quel «per» è inglese travestito. In italiano il verbo come regge la cosa richiesta?"
    goals: [problem]
    prompt: {text: "Ho chiesto per un'eccezione", tags: [preposition]}
  - learner: "Hai ragione... ho chiesto di un'eccezione?"
    errors: [preposition]
  - tutor: "No, niente preposizione: ho chiesto un'eccezione, e basta. Si chiede qualcosa a qualcuno. Detto questo, con il direttore in ferie fino al quindici siamo in un vicolo cieco. Tu come ne usciresti?"
    recast: {text: "ho chiesto di un'eccezione", fix: "ho chiesto un'eccezione", tags: [preposition]}
    new: [{lemma: vicolo cieco, gloss: dead end}]
  - learner: "Ci ho pensato stanotte. La vice del direttore ha la delega di firma per le urgenze: se tu le scrivi due righe spiegando che c'è di mezzo un cliente importante, credo che firmi in giornata. Nel frattempo io scrivo le conclusioni con i dati provvisori e poi aggiorno le cifre."
  - tutor: "Questa sì che è un'idea: aggirare l'ostacolo senza scavalcare nessuno. Le scrivo appena usciamo di qui, e ci metto anche un pizzico di dramma, che non guasta. Supponendo che firmi domani, per quando mi dai il rapporto completo?"
    goals: [proposal]
    new: [{lemma: aggirare l'ostacolo, gloss: to get round the obstacle}, {lemma: scavalcare, gloss: to go over someone's head}]
  - learner: "Se firma domani, giovedì prossimo hai tutto sulla scrivania, riletto e impaginato. Se invece dobbiamo aspettare il quindici, non prima del ventidue. Preferirei non promettere una data che poi non riesco a mantenere."
  - tutor: "Giusto, meglio una data vera che una bella bugia. Segno giovedì come scadenza, con il ventidue come paracadute, e avviso io il cliente. E grazie di non avermi venduto fumo: di questi tempi non è poco. Passiamo al prossimo punto."
    goals: [deadline]
    new: [{lemma: vendere fumo, gloss: to sell hot air}, {lemma: paracadute, gloss: parachute, fallback}]

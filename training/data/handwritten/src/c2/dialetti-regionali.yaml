- scenario: dialetti-regionali
  level: C2
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile, eh."
  - learner: "Qualche parola sì, ma mi hanno perso quasi subito. Ridevo più che altro per la musica: sembrava che cantassero."
  - tutor: "Eh, la cadenza napoletana è una mezza canzone, hai ragione. Io sono di Napoli e studio proprio queste cose. Tu che giri l'Italia, hai notato altre differenze nel modo di parlare tra una regione e l'altra?"
  - learner: "Eccome. A Firenze mi ha colpito il modo che pronunciano la c: una signora mi ha offerto «una hoha-hola» e non ho capito niente."
    errors: [relative-pronoun]
  - tutor: "La famosa gorgia toscana, bell'esempio! Però aspetta: «il modo che pronunciano»? Tra «modo» e il verbo ci vuole qualcosa di più di un semplice «che». Come lo diresti meglio?"
    goals: [notice]
    prompt: {text: "il modo che pronunciano", tags: [relative-pronoun]}
    new: [{lemma: gorgia, gloss: "the Tuscan aspirated c"}]
  - learner: "Il modo in cui pronunciano la c, scusa. E a Napoli c'è qualcosa di simile, un suono che vi tradisce subito?"
  - tutor: "Perfetto. Da noi più che un suono ci tradisce la fine delle parole, che ci mangiamo, e le consonanti, che raddoppiamo volentieri. C'è una parola napoletana che hai sentito e ti è rimasta in testa?"
  - learner: "Sì: «jamme». Quei due signori lo ripetevano di continuo. Vuol dire «andiamo», come nel «jamme jà» della canzone?"
  - tutor: "Bravo, vuol dire proprio «andiamo», e ripetuto così diventa un invito a darsi una mossa. La canzone è quella sulla funicolare del Vesuvio, scritta nel 1880, pensa un po'. Ma secondo te il napoletano è un italiano parlato male, come dice qualcuno?"
    goals: [example]
  - learner: "Non credo proprio. Per quanto ne so, i dialetti vengono dal latino tanto quanto l'italiano, che poi era solo il fiorentino che ha avuto più fortuna."
  - tutor: "Sottoscrivo ogni parola: sono fratelli dell'italiano, non figli. Il fiorentino ha vinto grazie a Dante e compagnia. Allora ultima domanda, da collega: vale la pena proteggerli, i dialetti, o è una battaglia persa?"
    goals: [standard]
  - learner: "Proteggerli sì, ma senza chiuderli in un museo. Li insegnerei attraverso canzoni e teatro, purché nessuno sia obbligato: una lingua imposta finisce per essere odiata."
  - tutor: "Parole sante, e te lo dice uno che ci campa. Il dialetto vive se lo si parla, non se lo si mette sotto vetro. Guarda, siamo quasi a Bologna: ti offro un caffè al bar del treno, jamme!"
    goals: [opinion]

- scenario: dialetti-regionali
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile, eh."
  - learner: "Pochissimo, lo ammetto. Ridevo perché uno dei due gesticolava esattamente come mio zio di Siviglia."
  - tutor: "Ah, spagnola! Allora a Napoli ti sentirai a casa: siamo stati sotto la Spagna per due secoli, e si sente. Io insegno sociolinguistica, perdona la curiosità: nella città dove vivi, che cosa hai notato di come parla la gente?"
    new: [{lemma: sociolinguistica, gloss: sociolinguistics}]
  - learner: "Vivo a Torino da tre anni. Lì la gente finisce le frasi con «neh» e dice «solo più»: «ho solo più dieci euro». All'inizio mi sembrava un errore."
  - tutor: "Ottimo orecchio! «Solo più» è piemontese fino al midollo, e fuori dal Piemonte quasi nessuno lo capisce. E del napoletano c'è qualche parola che ti incuriosisce, visto che gli spagnoli ci hanno lasciato parecchio?"
    goals: [notice]
  - learner: "Sì, ho letto che «guappo» viene dallo spagnolo «guapo». Però il viaggio della parola è stato largo, perché da voi non significa bello, vero?"
    errors: [false-friend]
  - tutor: "Vero, il viaggio è stato lungo e la parola è cambiata per strada: il guappo da noi è un prepotente, il bullo del quartiere. Bello non direi! Ma dimmi: nelle scuole italiane il dialetto come viene trattato, rispetto alla lingua standard?"
    goals: [example]
    recast: {text: "è stato largo", fix: "è stato lungo", tags: [false-friend]}
    new: [{lemma: guappo, gloss: "Neapolitan bully, swaggering tough"}]
  - learner: "Come un parente povero, direi. Sebbene molti studenti lo parlano a casa, in classe si vergognano di usarlo."
    errors: [subjunctive-use]
  - tutor: "Il parente povero, bella immagine, e purtroppo giusta. Ma ascolta la tua frase: «sebbene... lo parlano». Quel «sebbene» è esigente, vuole un altro modo del verbo. Me la ridici?"
    goals: [standard]
    prompt: {text: "Sebbene molti studenti lo parlano", tags: [subjunctive-use]}
  - learner: "Sebbene molti studenti lo parlavano a casa?"
    errors: [subjunctive-use]
  - tutor: "Non il tempo, il modo: sebbene molti studenti lo parlino a casa, in classe se ne vergognano. Colpa di decenni in cui lo si puniva. Tu allora che faresti: andrebbe protetto, magari per legge, o lasciato al suo destino?"
    recast: {text: "Sebbene molti studenti lo parlavano", fix: "sebbene molti studenti lo parlino", tags: [subjunctive-use]}
  - learner: "Protetto sì, ma con intelligenza. Una legge non basta se i nonni smettono di parlarlo ai nipoti; io punterei su musica e teatro, più che su esami e voti."
  - tutor: "Sono d'accordo dalla prima all'ultima parola: una lingua si salva in cucina, non in tribunale. Pensa a Pino Daniele, ha fatto più lui di cento leggi. Quando scendi a Napoli ti porto a teatro, promesso."
    goals: [opinion]

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho vista ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile, eh."
  - learner: "Macché! Ho capito solo «guagliò», e ridevo perché a Milano, dove studio, nessuno parla così forte in treno."
  - tutor: "Eh già, a Milano si sussurra, da noi si recita. Io torno a casa a Napoli e faccio la linguista di mestiere. E i milanesi, a sentirli tutti i giorni, cos'hanno di particolare quando parlano?"
  - learner: "Mettono l'articolo davanti ai nomi: «la Giulia», «il Marco». E poi usano «piuttosto che» per dire «oppure», e ogni volta mi confondo."
  - tutor: "Due osservazioni da manuale! Quel «piuttosto che» fa venire l'orticaria a mezza Italia, sappilo. E una parola tutta milanese l'hai imparata, in questi anni?"
    goals: [notice]
    new: [{lemma: orticaria, gloss: "hives (far venire l'orticaria = to really irritate)"}]
  - learner: "Sì, «sciura»! La mia padrona di casa è la classica sciura: elegante, col cagnolino. Ma vorrei sapere se dipende della classe sociale o se si dice di qualsiasi signora."
    errors: [preposition]
  - tutor: "La signora col cagnolino, l'hai dipinta! Ti rispondo subito, ma prima: «dipende della classe»? Quel verbo vuole un'altra preposizione. Quale?"
    goals: [example]
    prompt: {text: "dipende della classe sociale", tags: [preposition]}
  - learner: "Dipende dalla classe sociale, certo. Colpa dell'inglese: da noi si dipende «su» qualcosa."
  - tutor: "Esatto. E sì, un po' dipende: «sciura» è la signora benestante, spesso detto con un filo d'ironia. Ma eccoti una domanda seria: quando un milanese usa quella parola parlando italiano, sta usando il dialetto o l'italiano?"
  - learner: "Direi italiano regionale. Il dialetto vero è un altro sistema, con la sua grammatica; qui invece è l'italiano che prende in prestito una parola e un accento."
  - tutor: "Promossa con lode: hai appena riassunto mezzo corso mio. Tra dialetto e lingua standard c'è tutta una scala di gradini. E i dialetti veri, quelli che si stanno perdendo, secondo te vanno difesi?"
    goals: [standard]
  - learner: "Sì, anche se non a tutti i costi. Mi sembra giusto documentarli e usarli nell'arte, ma sarebbe ipocrita pretendere che i giovani li parlino se servono poco per lavorare."
  - tutor: "Risposta onesta, e per niente ipocrita. Io aggiungo solo che un dialetto serve a ridere e a litigare meglio, e non è poco. Guarda, siamo a Firenze: preparati a sentire le c che spariscono."
    goals: [opinion]

- scenario: dialetti-regionali
  level: C2
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile, eh."
  - learner: "Quasi niente, a dire il vero. Però lavoro in un cantiere a Milano con due ragazzi di Napoli e riconosco la musica."
  - tutor: "Allora hai già l'orecchio allenato! Io sono napoletano e di mestiere studio come parla la gente. Sul cantiere, tra colleghi di regioni diverse, cosa ti ha colpito di più?"
  - learner: "Che i siciliani usano sempre il passato remoto, anche per cose di stamattina: «arrivai alle sette». I milanesi invece non lo usano mai, nemmeno per parlare della guerra."
  - tutor: "Osservazione finissima: al Nord il passato remoto è quasi morto, al Sud è vivo e vegeto. A te che parli spagnolo verrà naturale, immagino. E i tuoi colleghi napoletani, qualche parola te l'hanno insegnata?"
    goals: [notice]
  - learner: "Certo! Quando salgo dal lavoro mi dicono «statte buono». E poi c'è «mo»: «mo vengo», «mo lo faccio». È come «ora», no?"
    errors: [false-friend]
  - tutor: "Proprio «ora», e viene dritto dal latino «modo». «Statte buono» è un saluto affettuoso: quando esci dal lavoro ti augurano di stare bene. Ma dimmi: con te cambiano lingua, rispetto a quando parlano tra loro?"
    goals: [example]
    recast: {text: "salgo dal lavoro", fix: "esci dal lavoro", tags: [false-friend]}
  - learner: "Sì, con me passano all'italiano, ma un italiano con l'accento loro. È come se avessero due marce: il dialetto per la famiglia e la lingua standard per il resto."
  - tutor: "Le due marce, mi piace! Noi la chiamiamo commutazione di codice, ma la tua immagine è più bella. E secondo te vale la pena difenderli, questi dialetti, o bastano l'italiano e buonanotte?"
    goals: [standard]
    new: [{lemma: commutazione, gloss: "switching (commutazione di codice = code-switching)"}]
  - learner: "Vanno difesi. Io parlo anche galiziano, e se i miei figli lo parlerebbero male mi dispiacerebbe molto. Però una lingua si difende usandola, non con le prediche."
    errors: [hypothetical]
  - tutor: "Un galiziano sul cantiere, ecco perché capisci tutto! Sul contenuto ti seguo, sulla forma un po' meno: «se i miei figli lo parlerebbero»? Dopo quel «se» il condizionale non ci può stare."
    prompt: {text: "se i miei figli lo parlerebbero", tags: [hypothetical]}
  - learner: "Hai ragione: se i miei figli lo parlassero male, mi dispiacerebbe. In galiziano non sbaglierei mai, giuro!"
  - tutor: "Ti credo sulla parola! E sono d'accordo: una lingua si difende a tavola e sul cantiere, non con le prediche. Ora ti saluto, che devo preparare la valigia: statte buono, e salutami i colleghi."
    goals: [opinion]

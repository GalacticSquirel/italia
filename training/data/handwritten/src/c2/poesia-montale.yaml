- scenario: poesia-montale
  level: C2
  persona: en-f-student
  history: [passive]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasta una sensazione fisica, quasi di sete. Pensavo che una poesia sul dolore fosse piena di lacrime, invece qui non piange nessuno: ci sono solo cose, una dopo l'altra, e fanno più male così."
  - tutor: "«Non piange nessuno»: lei ha già detto mezza lezione al posto mio. Montale non confessa, mostra. Scelga allora una di queste cose, quella che l'ha colpita di più, e mi dica che cosa fa esattamente quella parola nel verso."
    goals: [first-reading]
  - learner: "Scelgo il rivo «strozzato». È un verbo che si usa per le persone, non per l'acqua. Così il ruscello è venuto trasformato in una gola che non respira, e il male si vede senza essere nominato."
    errors: [passive]
  - tutor: "Una gola che non respira: lettura esatta, ed è così che funziona il correlativo oggettivo. Solo un dettaglio di grammatica: «è venuto trasformato». Con «venire» il passivo non sopporta i tempi composti; provi a ridirlo."
    goals: [image]
    prompt: {text: "è venuto trasformato", tags: [passive]}
  - learner: "Ha ragione: il ruscello è stato trasformato in una gola. O meglio ancora, viene trasformato, perché nella poesia succede sotto i nostri occhi."
  - tutor: "Benissimo, e la sua seconda versione è la più fine. Passiamo dall'occhio all'orecchio. Rilegga a mezza voce quei primi versi: che cosa sente nei suoni, prima ancora che nel senso?"
  - learner: "Sento suoni duri, che grattano: tante erre, la doppia zeta di «strozzato», e poi «gorgoglia», che fa il rumore dell'acqua che fatica a passare. E c'è quel «era» ripetuto tre volte, come un elenco che non lascia spazio."
  - tutor: "Orecchio eccellente. Quell'«era» ripetuto è un'anafora, e ha notato bene che i suoni fanno ciò che le parole dicono. Resta la seconda strofa, che è il vero enigma. Che cosa ci propone Montale, alla fine, contro il male di vivere?"
    goals: [sound]
    new: [{lemma: anafora, gloss: "anaphora (repetition at the start of clauses)"}, {lemma: enigma, gloss: riddle}]
  - learner: "Ci propone poco, onestamente. L'unico bene è l'indifferenza, e la chiama «divina» con la maiuscola. Secondo me non è una soluzione felice: la statua, la nuvola e il falco stanno sempre più in alto e più lontano, come se salvarsi significasse non sentire più niente."
  - tutor: "«Sempre più in alto e più lontano»: ha colto il movimento della strofa, e anche il suo prezzo. Non è una consolazione, è una tregua. Per stasera ci fermiamo qui; la prossima volta le chiederò se quel falco, per lei, è libero o soltanto distante."
    goals: [meaning]
    new: [{lemma: tregua, gloss: truce}, {lemma: falco, gloss: hawk}]

- scenario: poesia-montale
  level: C2
  persona: es-f-teacher
  history: [register, false-friend]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasto un freddo strano, professore. E anche un po' di rabbia, se devo essere sincera: la poesia è brevissima e sembra chiudermi la porta in faccia."
  - tutor: "La rabbia è un'ottima compagna di lettura, molto meglio dell'ammirazione di cortesia. Montale chiude spesso la porta, ma lascia sempre una fessura. Mi indichi il punto preciso in cui si è sentita respinta."
    goals: [first-reading]
    new: [{lemma: fessura, gloss: "crack, chink"}]
  - learner: "Nel cavallo «stramazzato». Gli altri due esempi sono piccoli, un ruscello e una foglia, e poi arriva questo animale grande che cade di colpo. È un'immagine quasi violenta, dopo due così delicate."
  - tutor: "Giustissimo: dal piccolo al grande, dalla pianta all'animale, e la caduta arriva a fine strofa come un colpo. Montale costruisce una scala. E sul piano dei suoni, quella parola che cosa le fa sentire?"
    goals: [image]
  - learner: "Fa rumore, direi. Senti come pesa: «stramazzato» ha quattro sillabe e quella doppia zeta, e rima con «incontrato» del primo verso, così la strofa si chiude su sé stessa."
    errors: [register]
  - tutor: "L'analisi è impeccabile, e la rima che chiude la strofa come un cerchio è proprio il punto. Una piccola cosa, però: «Senti come pesa»? Siamo in un'aula universitaria, e io ho qualche capello bianco."
    prompt: {text: "Senti come pesa", tags: [register]}
    new: [{lemma: impeccabile, gloss: flawless}]
  - learner: "Mi scusi, professore: senta come pesa. In spagnolo passiamo al tu molto più in fretta, e ogni tanto mi scappa."
  - tutor: "Scuse accettate, e capisco bene: tra Madrid e Milano il confine del Lei non passa nello stesso punto. Torniamo ai versi. Nella seconda strofa compare quella divina Indifferenza con la maiuscola: lei come la intende?"
    goals: [sound]
  - learner: "La intendo come una divinità che esiste ma non si occupa di noi. Non è cattiva, è lontana. La statua, la nuvola e il falco stanno nel mondo senza soffrire, e l'ultimo verso, molto più largo degli altri, sembra allontanarsi anche lui."
    errors: [false-friend]
  - tutor: "Bellissima osservazione: l'ultimo verso è davvero più lungo degli altri, supera l'endecasillabo e pare seguire il falco che sale. Attenta solo a «largo», che in italiano misura la larghezza: un falso amico dello spagnolo. Dunque, per lei, il bene è non soffrire. È poco o è molto?"
    goals: [meaning]
    recast: {text: "più largo degli altri", fix: "più lungo degli altri", tags: [false-friend]}
    new: [{lemma: falso amico, gloss: false friend}]
  - learner: "È poco, ma è onesto. Montale non promette niente che non possa mantenere. Preferisco un poeta che mi offre una tregua vera a uno che mi vende una felicità finta."
  - tutor: "«Una tregua vera»: non avrei saputo dirlo meglio, e lo ripeterò a lezione citando la fonte. Aveva cominciato con la rabbia e finisce con il rispetto, che è il percorso di ogni buon lettore di Montale. Grazie, per stasera basta così."

- scenario: poesia-montale
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasta addosso la voce di mia nonna, a dire il vero. Era di Genova, come Montale, e aveva lo stesso modo di parlare del dolore: poche parole, asciutte, e mai un lamento."
  - tutor: "Che fortuna, una nonna genovese: i liguri hanno fama di gente che non spreca né soldi né aggettivi, e Montale conferma la regola. Partiamo da lì. C'è nel testo una parola asciutta, come dice lei, che le sembra particolarmente riuscita?"
    goals: [first-reading]
  - learner: "Sì, «riarsa». La foglia non è semplicemente secca: è bruciata dalla sete, e si chiude su sé stessa. Benché è una parola rara, l'ho capita subito, forse perché dentro ci sento «arsa», bruciata."
    errors: [subjunctive-use]
  - tutor: "Ottimo: dentro «riarsa» c'è proprio il fuoco, e quel chiudersi della foglia è un gesto di difesa. Ma mi fermo su «Benché è una parola rara». Quella congiunzione è esigente: che modo vuole dopo di sé?"
    goals: [image]
    prompt: {text: "Benché è una parola rara", tags: [subjunctive-use]}
  - learner: "Vuole il congiuntivo, lo so, ma a casa nostra non si usava mai. Allora... Benché era rara? Mi confondo sempre con questa."
    errors: [subjunctive-use]
  - tutor: "Nessun dramma, il congiuntivo si perde spesso nell'italiano di famiglia. Benché sia una parola rara, lei l'ha capita al volo: ecco la frase. Ora ascoltiamo i versi invece di guardarli. Che cosa nota nel ritmo o nei suoni della prima strofa?"
    recast: {text: "Benché era rara", fix: "Benché sia una parola rara", tags: [subjunctive-use]}
  - learner: "Noto che inciampa. I versi sono endecasillabi, credo, ma non scorrono: ci sono troppe consonanti dure, «strozzato», «gorgoglia», «stramazzato». Si fa fatica a pronunciarli, e penso che la fatica sia voluta."
  - tutor: "«Inciampa» è perfetto, e ha visto che questa volta il congiuntivo le è venuto da solo. Sì, la fatica è voluta: il verso soffre insieme alle cose che nomina. Arriviamo al cuore. Come legge, nel complesso, questi otto versi?"
    goals: [sound]
    new: [{lemma: inciampare, gloss: to stumble}]
  - learner: "Li leggo come una lezione di sopravvivenza. Il male è dappertutto e non si può eliminare; l'unica difesa è guardare da lontano, come la statua o il falco. Ma non credo che Montale ne sia contento: mi sembra più una resa che una vittoria."
  - tutor: "Una resa lucida, direi, e la sua lettura tiene: «bene non seppi» dice proprio che altro bene non ha conosciuto. Mi tolga una curiosità, però. Sua nonna, davanti a questa indifferenza, sarebbe stata d'accordo?"
    goals: [meaning]
  - learner: "Credo di sì, ma a modo suo. Avrebbe detto che lamentarsi non serve e che bisogna tirare avanti. Però poi dava da mangiare a tutti i gatti del quartiere, quindi tanto indifferente non era."
  - tutor: "Allora sua nonna aveva capito Montale meglio di molti critici: asciutta nelle parole, non nel cuore. Tenga da parte i gatti del quartiere, perché la settimana prossima leggiamo «I limoni» e ci torneranno utili. Grazie, bellissima lettura."

- scenario: poesia-montale
  level: C2
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Sinceramente? Poco, la prima volta. L'ho trovata fredda, quasi una lista della spesa del dolore. Poi l'ho riletta in treno e qualcosa ha cominciato a muoversi."
  - tutor: "«Una lista della spesa del dolore»: mi permetta di rubargliela, è irriverente ma non sbagliata. L'elenco c'è davvero. Mi interessa di più quel qualcosa che si è mosso in treno. Da quale parola è partito?"
    goals: [first-reading]
    new: [{lemma: irriverente, gloss: irreverent}]
  - learner: "Da «incontrato». Di solito il male si subisce o si combatte; qui invece lo si incontra per strada, come un conoscente. All'inizio non mi faceva senso, poi ho capito che è proprio questa normalità a fare paura."
    errors: [word-choice]
  - tutor: "Capisco che all'inizio per lei non aveva senso: è una scelta che spiazza. E noti che in italiano «fare senso» vuol dire dare ribrezzo, il che qui sarebbe quasi comico. Il male come un conoscente, dunque. E il verso, come cammina?"
    goals: [image]
    recast: {text: "non mi faceva senso", fix: "non aveva senso", tags: [word-choice]}
    new: [{lemma: spiazzare, gloss: to wrong-foot}, {lemma: ribrezzo, gloss: disgust}]
  - learner: "Cammina male, e credo apposta. Sono endecasillabi, ma pieni di ostacoli. Io sono molto interessato nella poesia inglese, e mi ricorda certi versi di Eliot, dove il ritmo si rompe proprio quando il contenuto si fa duro."
    errors: [preposition]
  - tutor: "Il confronto con Eliot è tutt'altro che casuale, ci torniamo subito. Prima, però: «interessato nella poesia»? Qui l'inglese le ha fatto lo sgambetto: ci ripensi un attimo."
    prompt: {text: "interessato nella poesia", tags: [preposition]}
    new: [{lemma: fare lo sgambetto, gloss: to trip someone up}]
  - learner: "Interessato alla poesia inglese, certo. Dicevo: in Eliot, come qui, l'emozione non viene dichiarata, viene affidata agli oggetti."
  - tutor: "Esatto, e ora la preposizione è al suo posto. Quello che descrive ha un nome: correlativo oggettivo, formula di Eliot che la critica ha poi applicato a Montale. Ritmo rotto, oggetti al posto dei sentimenti. Con questi elementi, che interpretazione complessiva si sente di proporre?"
    goals: [sound]
  - learner: "Proporrei questa: la poesia non spiega il male, lo constata. E come rimedio offre soltanto la distanza. Ma, se posso, non sono d'accordo con chi la legge come saggezza. A me pare una sconfitta raccontata con molta dignità."
  - tutor: "Può, eccome: in quest'aula il disaccordo è benvenuto. E la sua formula, «una sconfitta raccontata con dignità», coglie bene il tono degli «Ossi di seppia». Io aggiungerei solo che per Montale constatare è già resistere. Ci pensi durante il prossimo viaggio in treno."
    goals: [meaning]
    new: [{lemma: constatare, gloss: "to note, to ascertain"}]

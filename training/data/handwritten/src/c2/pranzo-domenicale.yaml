- scenario: pranzo-domenicale
  level: C2
  persona: en-m-retired
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Grazie dell'invito! Che profumo... ma davvero litigate per una lasagna?"
  - tutor: "Altroché! Qui a tavola non si guarda in faccia a nessuno. E mia zia, che al mercato ha le mani bucate, con la lasagna ha il braccino corto. Secondo te che vuol dire «avere il braccino corto»?"
    new: [{lemma: braccino, gloss: "little arm (avere il braccino corto = to be stingy)"}]
  - learner: "Direi che è tirchia: chi ha il braccio corto non arriva mai al portafoglio, giusto?"
  - tutor: "Centro! L'hai capita al volo. Adesso però tocca a te: raccontami di una volta in cui sei rimasto senza un soldo, e mettici dentro un modo di dire, se ti riesce."
    goals: [react]
  - learner: "Volentieri. A vent'anni ero al verde a Lisbona: di soldi non avevo più, nemmeno per un panino."
    errors: [ci-ne]
  - tutor: "«Essere al verde» ci sta a pennello, bravo. Però «di soldi non avevo più» mi zoppica un po': lì in mezzo manca una paroletta piccola piccola. Quale?"
    goals: [use-idiom]
    prompt: {text: "di soldi non avevo più", tags: [ci-ne]}
  - learner: "Ah, certo: di soldi non ne avevo più. Quel «ne» me lo scordo sempre."
  - tutor: "Ecco, adesso fila liscio. E dimmi, in inglese come lo dite, «essere al verde»? Sono curioso di sapere se anche da voi c'entrano i colori."
  - learner: "Noi diciamo «to be broke», cioè essere rotti. Niente colori lì, però diciamo «essere in rosso» per il conto in banca, proprio come voi."
  - tutor: "Rotti, addirittura! Noi al massimo siamo «in bolletta». Vedi che il rosso mette d'accordo tutti, almeno in banca. Dai, chiudi in bellezza: ce l'hai una storiella che finisca con un bel proverbio?"
    goals: [compare]
    new: [{lemma: bolletta, gloss: "bill (essere in bolletta = to be broke)"}]
  - learner: "Ce l'ho. A Lisbona ho trovato lavoro in una panetteria alle quattro del mattino, e dopo un mese avevo i soldi per tornare. Come si dice: il mattino ha l'oro in bocca."
  - tutor: "Perfetto, e in una panetteria poi! Più in tema di così si muore. Te la sei guadagnata, quest'ultima lasagna: passami il piatto prima che la zia cambi idea."
    goals: [anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Ciao a tutti! Scusate il ritardo, ho perso l'autobus e sono venuta a piedi."
  - tutor: "Figurati, tanto qui prima delle due non si mangia mai. Però occhio a mio cugino Dario: quello è come il prezzemolo. Tu come la intendi, questa espressione?"
    new: [{lemma: prezzemolo, gloss: "parsley (essere come il prezzemolo = to turn up everywhere)"}]
  - learner: "Mmm, il prezzemolo si mette in tutti i piatti... quindi è uno che sta sempre in mezzo, che trovi a ogni festa?"
  - tutor: "Esatto, sta in ogni minestra. Vedo che non ti si può nascondere niente. Ora stupiscimi tu: raccontami qualcosa del tuo Erasmus usando un modo di dire italiano."
    goals: [react]
  - learner: "Allora: al mio primo esame orale il professore mi ha fatto una domanda e io non ho contestato niente. Ho fatto scena muta!"
    errors: [false-friend]
  - tutor: "«Fare scena muta», che meraviglia, l'hai piazzata benissimo! Quindi non hai risposto niente, muta come un pesce. E il professore come l'ha presa?"
    goals: [use-idiom]
    recast: {text: "non ho contestato niente", fix: "non hai risposto niente", tags: [false-friend]}
  - learner: "Male! In spagnolo abbiamo quasi lo stesso: «quedarse en blanco», restare in bianco. Benché in italiano «andare in bianco» significa un'altra cosa, credo."
    errors: [subjunctive-use]
  - tutor: "Bel confronto, e hai ragione: da noi «andare in bianco» vuol dire tornare a casa a mani vuote, soprattutto in amore. Ma senti come suona: «benché... significa»? Dopo «benché» il verbo vuole un altro modo."
    goals: [compare]
    prompt: {text: "Benché in italiano «andare in bianco» significa", tags: [subjunctive-use]}
  - learner: "Ah sì... benché in italiano significherebbe un'altra cosa?"
    errors: [subjunctive-use]
  - tutor: "Quasi: ci vuole il congiuntivo, quindi benché in italiano significhi un'altra cosa. Capita anche ai bolognesi, tranquilla. Adesso il gran finale: una storiella tua che finisca con un proverbio."
    recast: {text: "benché in italiano significherebbe", fix: "benché in italiano significhi", tags: [subjunctive-use]}
  - learner: "Va bene. Dopo quell'esame ho studiato tutta l'estate, l'ho ripetuto a settembre e ho preso trenta. Insomma, sbagliando s'impara."
  - tutor: "Trenta! Altro che scena muta. E «sbagliando s'impara» vale pure per i congiuntivi, come vedi. Dai, passa il piatto, che la lasagna te la sei meritata."
    goals: [anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Eccomi! Ho portato il vino, spero che vada bene con le lasagne."
  - tutor: "Un Sangiovese, brava: hai preso due piccioni con una fava, fai contenta la nonna e fai tacere mio padre. Scommetto che questa la conosci: che cosa vuol dire, secondo te?"
    new: [{lemma: piccione, gloss: pigeon}, {lemma: fava, gloss: broad bean}]
  - learner: "Certo che la conosco: ottenere due risultati con una sola mossa. Da noi però si usa una pietra e gli uccelli muoiono, voi almeno li prendete vivi!"
  - tutor: "Ah ah, vero, noi siamo più gentili: la fava era l'esca, mica un'arma. Bella sfumatura, non ci avevo mai pensato. Ora però voglio sentirne uno tuo: com'è andata con quel trasloco di cui mi parlavi?"
    goals: [react, compare]
    new: [{lemma: esca, gloss: bait}]
  - learner: "Non me ne parlare! Dovevo fare una decisione tra due appartamenti e ho voluto la botte piena e la moglie ubriaca: stare in centro e pagare poco."
    errors: [word-choice]
  - tutor: "La botte piena e la moglie ubriaca, questa è da applauso! Certo che prendere una decisione così non è uno scherzo. E com'è finita, l'hai trovato davvero un posto in centro a poco?"
    goals: [use-idiom]
    recast: {text: "fare una decisione", fix: "prendere una decisione", tags: [word-choice]}
  - learner: "Macché. Li ho persi tutti e due: mentre trattavo sul prezzo, li hanno affittati ad altri. Chi troppo vuole nulla stringe, come dice la mia vicina."
  - tutor: "Povera te! Però l'hai raccontata con il proverbio giusto al posto giusto, e questo vale più di un affitto basso. E adesso dove dormi, se non sono indiscreto?"
    goals: [anecdote]
  - learner: "Da un'amica, in periferia. Dice che posso restare finché voglio, ma si sa: l'ospite è come il pesce, dopo tre giorni puzza."
  - tutor: "Senti qua, parla meglio di noi! Allora brindiamo alla tua amica e al prossimo appartamento. E prendi la lasagna, prima che qualcuno te la soffi sotto il naso."

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Meno male! Mia nonna diceva sempre che a tavola non si invecchia, quindi arrivo preparato."
  - tutor: "Senti senti, abbiamo un intenditore! Allora te ne tiro una più difficile: ieri mio fratello ha promesso di lavare i piatti e poi ha fatto orecchie da mercante. Secondo te, cos'ha combinato?"
    new: [{lemma: mercante, gloss: "merchant (fare orecchie da mercante = to turn a deaf ear)"}]
  - learner: "Ha fatto finta di non sentire, immagino. Il mercante ascolta solo quello che gli conviene."
  - tutor: "Bravissimo, proprio così: sordo a comando. Tua nonna ti ha fatto una bella scuola. Te ne ricordi uno suo, magari legato a una storia di famiglia?"
    goals: [react]
  - learner: "Sì. Quando mio zio comprò una macchina troppo cara, lei disse che aveva fatto il passo più lungo della gamba. Lui non capiva e io gli lo ho spiegato in inglese."
    errors: [combined-pronouns]
  - tutor: "Il passo più lungo della gamba: usato alla perfezione. Solo una cosa mi stride: «gli lo ho spiegato». Quando quei due pronomi si incontrano, da noi si fondono in una parola sola. Ci riprovi?"
    goals: [use-idiom]
    prompt: {text: "gli lo ho spiegato", tags: [combined-pronouns]}
  - learner: "Giusto: gliel'ho spiegato in inglese. E lì è venuto fuori che noi diciamo «mordere più di quanto si possa masticare»."
  - tutor: "Ecco, così va liscio come l'olio. E che bella, la vostra: voi esagerate con la bocca, noi con le gambe. Quale delle due immagini rende meglio l'idea, per te?"
    goals: [compare]
  - learner: "La vostra, forse. Eventualmente mio zio ha venduto la macchina, quindi il passo l'ha dovuto rifare all'indietro."
    errors: [false-friend]
  - tutor: "Alla fine l'ha venduta, quindi! Un passo indietro fatto bene. Manca solo la ciliegina sulla torta: mi racconti un episodio che si chiuda con uno dei detti di tua nonna?"
    recast: {text: "Eventualmente", fix: "Alla fine", tags: [false-friend]}
  - learner: "Eccolo. Da bambino rubai i biscotti e diedi la colpa al cane, ma avevo le briciole sulla maglietta. La nonna mi guardò e disse: le bugie hanno le gambe corte."
  - tutor: "Meravigliosa, tua nonna, e pure il tuo passato remoto: si sente la sua scuola. Le bugie hanno le gambe corte, ma tu oggi hai fatto strada. Vieni, che la lasagna si fredda."
    goals: [anecdote]

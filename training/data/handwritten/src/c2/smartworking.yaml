- scenario: smartworking
  level: C2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Metà e metà, ormai. In ufficio ne vado due volte alla settimana, il martedì e il giovedì; gli altri giorni lavoro dalla cucina di casa, col portatile tra la moka e il cesto della frutta."
    errors: [ci-ne]
  - tutor: "Tra la caffettiera e la frutta, che quadretto! Però fermo lì: «in ufficio ne vado»? Per un luogo dove si va, quella particella non è quella giusta. Quale useresti?"
    goals: [situation]
    prompt: {text: "ne vado", tags: [ci-ne]}
    new: [{lemma: quadretto, gloss: charming little scene}]
  - learner: "Ci vado, certo: in ufficio ci vado due volte alla settimana. Mia nonna mi avrebbe tirato le orecchie."
  - tutor: "Tua nonna aveva ragione, e io mi limito a tirartele a parole. Comunque ti invidio: io sono in ufficio cinque giorni su cinque, come ai tempi di Fantozzi. Dimmi che cosa ci guadagni, così soffro meglio."
    new: [{lemma: tirare le orecchie, gloss: to tell off (lit. pull the ears)}]
  - learner: "Ci guadagno un'ora e mezza al giorno di metropolitana, tanto per cominciare. Poi l'orario è flessibile: se alle tre voglio andare a correre, vado e recupero la sera. E quando devo scrivere qualcosa di difficile, a casa riesco a concentrarmi come in ufficio non mi capita mai."
  - tutor: "Correre alle tre del pomeriggio: roba da ricchi. Però non me la racconti giusta, nessuno sta così bene. Non è tutto oro quel che luccica: dov'è la fregatura?"
    goals: [pros]
    new: [{lemma: non è tutto oro quel che luccica, gloss: all that glitters is not gold}, {lemma: fregatura, gloss: catch, rip-off}, {lemma: non raccontarla giusta, gloss: not to be telling the whole story}]
  - learner: "La fregatura c'è, eccome. Spendo troppo tempo da solo, e certi giorni l'unica persona con cui parlo è il corriere. E poi il lavoro non finisce mai: il portatile è sempre lì che mi guarda, anche la domenica."
    errors: [word-choice]
  - tutor: "Il corriere come migliore amico, siamo messi bene. Ti capisco, però: quando passo troppo tempo da solo, io dopo due giorni parlo coi muri. E il portatile che ti fissa la domenica è roba da film dell'orrore. Se potessi scegliere tu, senza capi di mezzo, come ti organizzeresti?"
    goals: [cons]
    recast: {text: "Spendo troppo tempo da solo", fix: "passo troppo tempo da solo", tags: [word-choice]}
    new: [{lemma: parlare coi muri, gloss: to talk to the walls}, {lemma: corriere, gloss: courier}]
  - learner: "Se potessi scegliere, farei tre giorni in ufficio e due a casa, ma decisi da me, non dal calendario aziendale. I colleghi mi servono per le idee, la casa per metterle in ordine. Tutto a casa o tutto in ufficio mi sembrano due modi diversi di impazzire."
  - tutor: "«Due modi diversi di impazzire»: questa me la rivendo domani alla macchinetta del caffè. Tre e due, scelti da te: firmerei subito. Intanto brindiamo al tuo corriere, che almeno lui si fa vivo tutti i giorni."
    goals: [preference]
    new: [{lemma: farsi vivo, gloss: to get in touch, show up}]

- scenario: smartworking
  level: C2
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tutte e due le cose, purtroppo, e non per scelta mia. L'azienda ha deciso che il lunedì e il venerdì stiamo a casa, così risparmia sul riscaldamento, e in mezzo tutti in ufficio. Io però divido l'appartamento con tre persone, quindi «casa» vuol dire la mia camera."
  - tutor: "Ah, quindi l'azienda risparmia sul riscaldamento e la bolletta la paghi tu: furbi come volpi. Però dai, qualche vantaggio ci sarà pure, a lavorare in pigiama. O vuoi dirmi che è tutto da buttare?"
    goals: [situation]
    new: [{lemma: furbo come una volpe, gloss: sly as a fox}, {lemma: bolletta, gloss: utility bill}]
  - learner: "No, da buttare no. Il vantaggio più grande è il silenzio la mattina presto, quando i miei coinquilini dormono: in due ore faccio quello che in ufficio faccio in cinque. E poi a pranzo cucino, invece di mangiare un panino triste davanti allo schermo."
  - tutor: "Il panino triste davanti allo schermo è il mio ritratto, grazie tante. Ma tre coinquilini e una camera sola: scommetto che dopo le dieci di mattina la musica cambia. Com'è, davvero?"
    goals: [pros]
    new: [{lemma: la musica cambia, gloss: things change (for the worse)}, {lemma: coinquilino, gloss: flatmate}]
  - learner: "Cambia eccome. Uno suona il basso, un'altra fa lezioni di yoga in salotto, e la connessione va a singhiozzo. Ho fatto una riunione col direttore seduta sul letto, con l'armadio aperto alle spalle. E poi mi manca il caffè con i colleghi, che è dove si viene a sapere tutto."
  - tutor: "La riunione con l'armadio aperto è una figuraccia d'autore, complimenti. E hai ragione: le notizie vere girano alla macchinetta, mica nei messaggi ufficiali. Allora dimmi: se dipendesse solo da te, che vita lavorativa ti sceglieresti?"
    goals: [cons]
    new: [{lemma: mica, gloss: "not at all (colloquial negative reinforcer)"}, {lemma: figuraccia, gloss: embarrassing blunder}]
  - learner: "Se potrei scegliere, andrei in ufficio quattro giorni e ne terrei uno a casa per i lavori che chiedono concentrazione."
    errors: [hypothetical]
  - tutor: "Quattro e uno, interessante, me lo spieghi tra un attimo. Ma «se potrei scegliere»? Dai, questa è la buccia di banana più famosa dell'italiano: dopo il «se» il condizionale scivola sempre. Riprova."
    prompt: {text: "Se potrei scegliere", tags: [hypothetical]}
    new: [{lemma: buccia di banana, gloss: banana skin, classic trap}]
  - learner: "Uffa, hai ragione. Se potevo scegliere, andrei in ufficio quattro giorni."
    errors: [hypothetical]
  - tutor: "Ci sei quasi, ma l'imperfetto lascialo al bar dello sport: se potessi scegliere, andresti in ufficio quattro giorni. E fin qui ti seguo. Ma perché proprio tu, che a casa in due ore fai il lavoro di cinque, vorresti stare in ufficio quasi sempre?"
    recast: {text: "Se potevo scegliere", fix: "se potessi scegliere", tags: [hypothetical]}
  - learner: "Perché quelle due ore buone le pago con tutto il resto della giornata. Finché non avrò una casa mia, l'ufficio è l'unico posto dove il lavoro ha dei confini. Con una stanza in più, forse ti direi il contrario."
  - tutor: "Quindi il problema non è il lavoro da casa, è la casa: chiarissimo, e anche un po' amaro. Tieni duro, che prima o poi il bassista trasloca. Nel frattempo il prossimo spritz lo pago io, così almeno risparmi sull'aperitivo."
    goals: [preference]
    new: [{lemma: tenere duro, gloss: to hang in there}, {lemma: traslocare, gloss: to move house}]

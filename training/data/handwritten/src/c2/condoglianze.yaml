- scenario: condoglianze
  level: C2
  persona: en-m-traveller
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non si doveva disturbare, con tutto il lavoro che ha."
    - learner: "Non è nessun disturbo, ci mancherebbe. Le faccio le mie più sentite condoglianze, a Lei e a tutta la famiglia. Ho saputo solo ieri della scomparsa di Sua madre."
    - tutor: "La ringrazio, di cuore. Se n'è andata nel sonno, a novantadue anni: si è spenta come una candela, dice mio fratello. Venga, si sieda qui. Lei l'aveva conosciuta, vero, alla festa del patrono?"
      goals: [condolences]
      new: [{lemma: spegnersi come una candela, gloss: "to fade away peacefully (lit. go out like a candle)"}]
    - learner: "Sì, due anni fa. Mi ricordo che, benché ero uno straniero appena arrivato, mi ha fatto sedere accanto a lei e mi ha spiegato tutta la processione."
      errors: [subjunctive-use]
    - tutor: "Non lasciava nessuno in un angolo. Ha insegnato alle elementari per quarant'anni, sa? E mi perdoni, ma sentendo «benché ero» avrebbe alzato il dito, con dolcezza. Mi viene da farlo al posto suo: come avrebbe voluto sentirlo?"
      prompt: {text: "benché ero", tags: [subjunctive-use]}
    - learner: "Ha ragione, e lo prendo come un regalo della maestra: benché fossi uno straniero appena arrivato, mi ha trattato come uno di casa. Non lo dimenticherò."
    - tutor: "Ecco, adesso sarebbe contenta. «Uno di casa»: è la cosa più bella che potesse dirmi. In questi giorni la casa è piena di gente, e poi, da lunedì, il silenzio. È quello che temo di più."
      goals: [memory]
    - learner: "Lo immagino. Senta, non vorrei essere invadente, ma se Le fa comodo posso occuparmi io della riunione di giovedì e delle pratiche in sospeso. Lei si prenda tutto il tempo che Le serve."
    - tutor: "È un pensiero gentile, e l'accetto volentieri: la riunione sì, me la tolga pure dalle spalle. Alle pratiche ci penso io, mi aiuta tenere la testa occupata. Prende un caffè? Da questa casa non si esce senza."
      goals: [offer-help]
    - learner: "Un caffè lo prendo volentieri, grazie, e poi La lascio ai Suoi cari. Non voglio trattenerLa oltre: sappia però che può contare su di me, per qualsiasi cosa."
    - tutor: "Lo so, e mi è di conforto. Grazie ancora della visita e della Sua vicinanza. Ci vediamo in ufficio la settimana prossima, con calma."
      goals: [leave]

- scenario: condoglianze
  level: C2
  persona: es-f-teacher
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non si doveva disturbare, con tutto il lavoro che ha."
    - learner: "Buonasera. Ho saputo di Sua madre stamattina e mi dispiace un sacco, davvero. Non potevo non venire."
      errors: [register]
    - tutor: "La ringrazio. «Un sacco»... mia madre avrebbe sorriso: lo diceva delle olive, mai dei dispiaceri. In una casa in lutto, da queste parti, ci si aspetta una parola più raccolta. Come lo direbbe a mia zia, che è di là?"
      prompt: {text: "mi dispiace un sacco", tags: [register]}
    - learner: "Ha ragione, mi perdoni. Le porgo le mie più sentite condoglianze: Le sono vicina in questo momento di dolore."
    - tutor: "Grazie, queste parole me le porto dentro. Si spense ieri all'alba, con tutti noi intorno. Lei la conobbe appena, mi pare, il primo anno che venne a lavorare qui?"
      goals: [condolences]
    - learner: "Sì, ma non l'ho mai dimenticata. Ho guardato per anni il biglietto che mi scrisse quando arrivai: «Benvenuta, figlia mia, qui nessuno è forestiero»."
      errors: [false-friend]
    - tutor: "Davvero ha conservato quel biglietto per tutti questi anni? Mi commuove. E sento che dice «scrisse», «arrivai»: ormai parla come noi del Sud. A Milano direbbero «ha scritto» anche di una cosa di cent'anni fa."
      goals: [memory]
      recast: {text: "Ho guardato", fix: "ha conservato", tags: [false-friend]}
    - learner: "Me l'hanno attaccato i colleghi di qui, e ne vado fiera. Senta, so che in questi giorni la casa è piena di parenti: se può servire, domani porto io qualcosa per cena, così nessuno deve pensare ai fornelli."
    - tutor: "È l'usanza di qui, sa? Nei giorni del lutto sono i vicini a cucinare per la famiglia: lo chiamiamo «il consolo». Che ci abbia pensato Lei, venuta da così lontano, mi tocca più di quanto sappia dire. Accetto, grazie."
      goals: [offer-help]
      new: [{lemma: consolo, gloss: "meal brought to a bereaved family (southern custom)"}, {lemma: usanza, gloss: custom}]
    - learner: "Allora a domani sera. Adesso tolgo il disturbo: La lascio riposare, e La prego di salutare da parte mia i Suoi fratelli."
    - tutor: "Lo farò senz'altro. Grazie della visita e del conforto: in giorni così le parole giuste valgono molto. A domani, e vada piano con questa pioggia."
      goals: [leave]

- scenario: condoglianze
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non si doveva disturbare, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe altro, sono venuto appena ho saputo. Condoglianze vivissime, a Lei e ai Suoi. Mia nonna, che era di Bitonto, diceva che nel lutto non si lascia solo nessuno."
    - tutor: "Di Bitonto? Allora è quasi di casa. Sua nonna aveva ragione, e qui la regola vale ancora: da ieri la porta è aperta e la caffettiera non riposa. Mia madre teneva molto a queste cose. Gliene avevo mai parlato?"
      goals: [condolences]
    - learner: "Sì, spesso. E io ho preso una foto di Sua madre l'anno scorso, quando è passata in ufficio a portarci i taralli. Rideva di gusto. Se vuole, gliela faccio stampare."
      errors: [word-choice]
    - tutor: "Ha fatto una foto quel giorno? Non lo sapevo, e mi farebbe un piacere enorme averla. I taralli erano la sua firma: diceva che un ufficio senza taralli è un ufficio triste. Me la stampi, sì, quando ha tempo."
      goals: [memory]
      recast: {text: "ho preso una foto", fix: "Ha fatto una foto", tags: [word-choice]}
    - learner: "Senz'altro, entro la settimana. E poi, senti, se hai bisogno di qualcosa per il funerale, anche solo andare a prendere i parenti alla stazione, dimmelo."
      errors: [register]
    - tutor: "Lei è generoso, e i parenti da Torino arrivano davvero domani. Però mi lasci sorridere, ché oggi mi serve: «senti», «se hai bisogno»? Con Sua nonna andava benissimo, ma noi due, in tutti questi anni, ci siamo sempre parlati in un altro modo. Me lo ridice?"
      prompt: {text: "se hai bisogno di qualcosa", tags: [register]}
    - learner: "Mi scusi, è l'abitudine di famiglia. Se ha bisogno di qualcosa, dimmelo senza problemi."
      errors: [register]
    - tutor: "A metà strada: «se ha bisogno, me lo dica». Ma non si preoccupi, l'affetto è arrivato lo stesso, con il tu e con il Lei. E accetto: il treno da Torino arriva domani alle dieci. Se la sente?"
      goals: [offer-help]
      recast: {text: "dimmelo", fix: "me lo dica", tags: [register]}
    - learner: "Certo, alle dieci sarò in stazione. Ora La lascio alla Sua famiglia, non voglio rubarLe altro tempo. Mi stia bene, per quanto si può."
    - tutor: "Grazie, di cuore. La Sua visita mi ha fatto bene, più di quanto immagini. A domani, allora, e porti un saluto ai colleghi."
      goals: [leave]

- scenario: condoglianze
  level: C2
  persona: en-f-professional
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non si doveva disturbare, con tutto il lavoro che ha."
    - learner: "Il lavoro può aspettare. Volevo dirLe di persona quanto mi dispiace: Le porgo le mie più sincere condoglianze. Confesso che in italiano ho sempre paura di sbagliare formula, in momenti come questo."
    - tutor: "Non ha sbagliato niente, stia tranquilla. E poi, mi creda, non c'è formula che tenga: conta esserci, e Lei c'è. Mia madre diceva che al lutto si va con i piedi, non con le parole. La conosceva un poco, vero?"
      goals: [condolences]
      new: [{lemma: non c'è formula che tenga, gloss: "no formula really matters (non c'è ... che tenga)"}]
    - learner: "Un poco, ma abbastanza da ricordarla bene. Non aveva peli sulla lingua: la prima volta che mi ha vista mi ha detto che ero troppo magra e che a Londra, evidentemente, non si mangia."
    - tutor: "È tutta lei! Lo diceva a chiunque, pure al medico. Novant'anni di sincerità senza anestesia, eppure nessuno se la prendeva. Mi mancherà perfino essere sgridato. Lei ha ancora i Suoi, se posso chiedere?"
      goals: [memory]
      new: [{lemma: sgridare, gloss: to scold}]
    - learner: "Mio padre sì, mia madre è mancata tre anni fa. Penso spesso di lei, soprattutto in giorni come questo. Forse per questo sono venuta subito."
      errors: [preposition]
    - tutor: "Allora sa di che cosa parlo, e la Sua visita vale doppio. Solo una cosa, e gliela dico come avrebbe fatto mia madre, senza giri di parole: «penso spesso di lei»? L'inglese Le ha fatto lo sgambetto su quella preposizione. Quale ci vuole?"
      prompt: {text: "Penso spesso di lei", tags: [preposition]}
      new: [{lemma: fare lo sgambetto, gloss: to trip someone up}]
    - learner: "Ha ragione, grazie: penso spesso a lei. E Sua madre mi avrebbe corretta molto meno gentilmente, credo."
    - tutor: "Senza dubbio, e poi Le avrebbe riempito il piatto. Il funerale è domani alle quattro, nella chiesa madre. Dopo, come si usa qui, la casa resta aperta per chi vuole passare."
    - learner: "Ci sarò. E se posso rendermi utile senza intralciare: so che Sua sorella arriva da Bruxelles. Potrei andare io a prenderla all'aeroporto di Bari, così Lei non deve muoversi da qui."
    - tutor: "Mi toglierebbe un gran pensiero. Atterra alle undici, Le mando il numero del volo. Non so come ringraziarLa."
      goals: [offer-help]
    - learner: "Non deve ringraziarmi. Adesso La lascio, vedo che arrivano altre persone. Si riguardi, e cerchi di riposare un poco stanotte."
    - tutor: "Ci proverò. Grazie della vicinanza: mi è stata di conforto più di quanto pensi. A domani."
      goals: [leave]

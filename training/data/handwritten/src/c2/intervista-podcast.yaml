- scenario: intervista-podcast
  level: C2
  persona: en-m-heritage
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a voi. Diciamo che l'Italia è arrivata prima di me: i miei nonni erano di un paesino in Calabria, e io sono cresciuto a Toronto con il loro dialetto in cucina. A trent'anni sono venuto a vedere da dove veniva tutto quel rumore."
    - tutor: "«Da dove veniva tutto quel rumore»: abbiamo già il titolo della puntata! E quando sei arrivato al paese, com'è andata? Ti hanno accolto come il figliol prodigo o come un forestiero con l'accento strano?"
      goals: [story]
      new: [{lemma: figliol prodigo, gloss: prodigal son}, {lemma: forestiero, gloss: "outsider, stranger"}, {lemma: puntata, gloss: episode}]
    - learner: "Tutte e due le cose. Mi hanno fatto sedere a tavola in dieci minuti, ma ridevano quando parlavo: usavo parole che lì nessuno diceva più da cinquant'anni. La cosa che mi ha sorpreso di più, però, è stato il rapporto con il tempo. Nessuno aveva fretta, e se chiedevo un appuntamento mi rispondevano «poi vediamo»."
    - tutor: "Il dialetto dei nonni conservato sotto vetro dall'altra parte dell'oceano: succede spesso, la lingua degli emigrati si ferma al giorno della partenza. E quel «poi vediamo», che può voler dire sì, no o mai! Oggi come lo traduci?"
      goals: [culture-shock]
      new: [{lemma: sotto vetro, gloss: under glass}, {lemma: emigrato, gloss: emigrant}]
    - learner: "Oggi so che vuol dire «non ti voglio dire di no in faccia». All'inizio pensavo che erano maleducati, poi ho capito che era una forma di delicatezza."
      errors: [subjunctive-use]
    - tutor: "Una delicatezza, esatto: da noi il no si serve tiepido. Senti, però, tu che l'italiano l'hai bevuto con il latte: «pensavo che erano»? In cucina dalla nonna passava, al microfono un po' meno. Come lo dici in bella copia?"
      prompt: {text: "pensavo che erano", tags: [subjunctive-use]}
      new: [{lemma: in bella copia, gloss: in fair copy}, {lemma: tiepido, gloss: lukewarm}]
    - learner: "In bella copia: pensavo che fossero maleducati. La nonna, per la cronaca, i congiuntivi li ignorava con grande dignità."
    - tutor: "Onore alla nonna! Adesso però ti metto in difficoltà. Sei qui da anni, ci vuoi bene, si sente. Ma c'è qualcosa dell'Italia che proprio non ti va giù? Dillo pure, non ci offendiamo: al massimo tagliamo in montaggio."
      new: [{lemma: montaggio, gloss: editing}, {lemma: non andare giù, gloss: to be hard to swallow}]
    - learner: "Una cosa c'è, e la dico con affetto. Qui il talento dei giovani viene spesso sprecato: troppe porte si aprono solo se conosci qualcuno. Ho visto ragazzi bravissimi partire, e a me dispiace due volte, perché i miei nonni partirono per lo stesso motivo."
    - tutor: "Con affetto, ma hai messo il dito nella piaga. E quel «partirono», con il passato remoto, mi dice che il Sud ti è rimasto in bocca. Ultima domanda: a chi ci ascolta e sogna di trasferirsi qui, che cosa diresti?"
      goals: [critique]
      new: [{lemma: mettere il dito nella piaga, gloss: to touch a sore point}, {lemma: passato remoto, gloss: "past historic tense, still used in speech in the South"}]
    - learner: "Direi di venire per la vita vera, non per la cartolina. Imparate la lingua prima di fare le valigie: vi sentirete molto più confidenti. E accettate gli inviti a pranzo: l'integrazione, qui, passa dalla tavola."
      errors: [false-friend]
    - tutor: "Meno cartolina e più pranzi della domenica: lo sottoscrivo. E con la lingua in tasca ci si sente più sicuri, altro che. Grazie davvero, sei stato un ospite coi fiocchi. Salutaci il paese, quando ci torni."
      goals: [advice]
      recast: {text: "più confidenti", fix: "più sicuri", tags: [false-friend]}
      new: [{lemma: coi fiocchi, gloss: "first-rate, excellent"}, {lemma: cartolina, gloss: postcard}]

- scenario: intervista-podcast
  level: C2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Per sbaglio, o quasi. La mia azienda mi ha mandata a Milano per sei mesi, a seguire un cliente. Sono passati nove anni, il cliente non c'è più, e io sono ancora qui. Mi sono innamorata con la città prima ancora che di una persona."
      errors: [preposition]
    - tutor: "Sei mesi diventati nove anni: il più bel fallimento di un piano aziendale che abbia mai sentito! Una cosa sola, da ficcanaso della lingua: «innamorata con»? In italiano l'amore regge un'altra preposizione. Quale?"
      prompt: {text: "innamorata con la città", tags: [preposition]}
      new: [{lemma: ficcanaso, gloss: busybody}, {lemma: reggere, gloss: to govern (grammar); to hold}]
    - learner: "Innamorata della città, certo: «con» è l'inglese che parla. E pensare che di Milano, all'inizio, mi avevano detto solo peste e corna."
    - tutor: "Peste e corna, ma senti che repertorio! Di Milano ci si innamora di rado a prima vista, quindi complimenti per il coraggio. E i primi tempi? Raccontami una cosa che ti ha lasciata a bocca aperta."
      goals: [story]
      new: [{lemma: dire peste e corna, gloss: to badmouth}, {lemma: repertorio, gloss: repertoire}]
    - learner: "Il caffè al banco. Il primo giorno ho visto la gente entrare, bere in piedi in trenta secondi e uscire, e sono rimasta di sasso: non ho mai visto una cosa simile prima di allora. A Londra un caffè dura mezz'ora e si porta in giro come un neonato."
      errors: [tense-aspect]
    - tutor: "Come un neonato, è verissimo! Ma fermati un attimo sul verbo: «non ho mai visto, prima di allora»? Stai guardando ancora più indietro di quel primo giorno, e ti serve un tempo che arrivi fin là. Ce l'hai?"
      prompt: {text: "non ho mai visto una cosa simile", tags: [tense-aspect]}
      new: [{lemma: neonato, gloss: newborn baby}]
    - learner: "Un tempo che arriva più indietro... non vedevo mai una cosa simile?"
      errors: [tense-aspect]
    - tutor: "Quasi: ci vuole il trapassato, «non avevo mai visto una cosa simile». Capita, è un tempo dispettoso. E quel caffè in piedi dice tutto di Milano: qui anche la pausa ha fretta. C'è invece qualcosa che, dopo nove anni, ancora ti fa storcere il naso?"
      goals: [culture-shock]
      recast: {text: "non vedevo mai una cosa simile", fix: "non avevo mai visto una cosa simile", tags: [tense-aspect]}
      new: [{lemma: storcere il naso, gloss: to turn up one's nose}, {lemma: dispettoso, gloss: "spiteful, mischievous"}]
    - learner: "Una sì, e spero di dirla con garbo. Trovo che gli italiani siano severissimi con il proprio paese a parole e poi pochissimo disposti a cambiarlo nei fatti. Ci si lamenta di tutto, ma guai a toccare un'abitudine."
    - tutor: "Con garbo, ma hai fatto centro: il lamento è il nostro sport nazionale, molto più del calcio. «Piove, governo ladro» lo ripetiamo da più di un secolo. Prima di salutarci: a chi sta pensando di fare il tuo stesso salto, che cosa consigli?"
      goals: [critique]
      new: [{lemma: "piove, governo ladro", gloss: "it's raining, thieving government (blaming the government for everything)"}, {lemma: fare centro, gloss: to hit the bull's-eye}]
    - learner: "Di non fidarsi né degli entusiasti né dei disfattisti. Venite con un lavoro o con un piano, date alla città almeno un inverno prima di giudicarla, e trovatevi un bar dove vi chiamano per nome: da lì in poi siete a casa."
    - tutor: "Un inverno di prova e un bar che ti conosce: è il consiglio più milanese che abbia mai sentito, e te lo dice uno nato in Porta Romana. Grazie di cuore, è stata una chiacchierata splendida. Alla prossima puntata!"
      goals: [advice]
      new: [{lemma: chiacchierata, gloss: chat}, {lemma: puntata, gloss: episode}]

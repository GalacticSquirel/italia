- scenario: club-lettura
  level: C2
  persona: en-f-student
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma a fatica, lo ammetto. Le prime cento pagine mi hanno conquistata; poi, tra cugini, zii e matrimoni, ho perso il filo e la trama mi è sembrata girare a vuoto."
    - tutor: "Ahi, cominciamo bene! Guarda però che quel girare a vuoto è voluto: le famiglie vere sono così, un gran polverone e poi non succede niente. Io ti aspetto al varco su Adele: l'hai capita, tu, una che pianta il fidanzato per restare in bottega con il padre?"
      goals: [impression]
      new: [{lemma: polverone, gloss: "fuss, cloud of dust"}, {lemma: piantare, gloss: to dump (someone)}, {lemma: aspettare al varco, gloss: to lie in wait for someone}]
    - learner: "Capita sì, e anzi l'ho ammirata. Penso che non l'ha fatto per sacrificio, ma per orgoglio: in bottega era qualcuno, da sposata sarebbe stata solo la moglie del geometra."
      errors: [subjunctive-use]
    - tutor: "Per orgoglio! Questa lettura mi spiazza, e mi piace. Peccato per quel «penso che non l'ha fatto», che a Torino ti costerebbe un'occhiataccia della libraia. Me lo sistemi?"
      prompt: {text: "Penso che non l'ha fatto", tags: [subjunctive-use]}
      new: [{lemma: spiazzare, gloss: to wrong-foot}, {lemma: occhiataccia, gloss: dirty look}]
    - learner: "Subito, prima che mi senta la libraia: penso che non l'abbia fatto per sacrificio, ma per orgoglio."
    - tutor: "Salvata in corner. E se hai ragione tu, cambia tutto il finale: Adele non è una vittima, è l'unica che sceglie. Mi tocca rileggerlo, accidenti a te. E lo stile? C'è chi dice che l'autrice scriva come si scriveva negli anni Cinquanta."
      goals: [character]
      new: [{lemma: salvarsi in corner, gloss: to save oneself at the last moment}]
    - learner: "Per me è il pregio maggiore. La frase è lunga ma mai pesante, e il narratore non giudica nessuno. Mi ha ricordato la Ginzburg di «Lessico famigliare», con quelle frasi di casa ripetute come un ritornello."
    - tutor: "«Lessico famigliare», proprio lui: anche lì una famiglia torinese che sta insieme a forza di modi di dire. Hai fatto centro. Detto questo, a chi lo consiglieresti, un mattone così? Sii sincera."
      goals: [style]
      new: [{lemma: mattone, gloss: "heavy read (lit. brick)"}, {lemma: fare centro, gloss: to hit the bull's-eye}]
    - learner: "A mia nonna di sicuro, e a chiunque abbia pazienza e una poltrona comoda. A chi cerca una trama che corre, invece, no: lo lascerebbe a metà."
    - tutor: "Alla nonna e ai pazienti: sottoscrivo. Agli altri diremo che è colpa loro. Il mese prossimo tocca a te scegliere il libro, e bada: se porti un giallo svedese ti tolgo il saluto."
      goals: [recommend]
      new: [{lemma: sottoscrivere, gloss: "to endorse, to agree fully"}, {lemma: togliere il saluto, gloss: to stop speaking to someone}]

- scenario: club-lettura
  level: C2
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Finito, finito. E ti dirò, sono tra quelli a cui non è piaciuto. Bella l'ambientazione, la Torino delle fabbriche, ma i personaggi mi sono sembrati di cartone."
    - tutor: "Di cartone? Ma se il vecchio Tonio è scolpito nel granito! Va be', i gusti sono gusti. Però non te la cavi con una battuta: prendi un personaggio e dimostrami che non sta in piedi. Ti ascolto, con il coltello tra i denti."
      goals: [impression]
      new: [{lemma: scolpire, gloss: "to carve, to sculpt"}, {lemma: cavarsela, gloss: to get away with it}, {lemma: con il coltello tra i denti, gloss: "fiercely, ready for a fight"}]
    - learner: "Prendiamo Tonio, appunto. Torna dalla prigionia, trova la fabbrica in rovina e non dice una parola per vent'anni. So che il romanzo ha avuto un grande esito, ma per me quel silenzio non è profondità: è un personaggio a cui l'autore non ha saputo dare voce."
      errors: [false-friend]
    - tutor: "Che abbia avuto un grande successo conta poco, su questo ti do ragione: i premi non fanno i libri. Ma quel silenzio è il cuore del romanzo! Tonio tace perché chi tornava dai campi non veniva creduto, e allora tanto valeva stare zitti. Non ti ha sfiorato il dubbio?"
      recast: {text: "un grande esito", fix: "un grande successo", tags: [false-friend]}
      new: [{lemma: sfiorare, gloss: "to brush, to cross (one's mind)"}, {lemma: tanto valeva, gloss: one might as well}]
    - learner: "Mi ha sfiorato, sì. Ma allora il narratore doveva farmelo sentire, quel peso. Invece sta sempre un passo indietro, elegante, distaccato. Di emozione, in trecento pagine, non ci ho trovato quasi."
      errors: [ci-ne]
    - tutor: "Distaccato, dici: e qui tocchi lo stile, ci arriviamo. Prima però una cosa: «di emozione non ci ho trovato quasi»? Quando si parla di quantità, il pronome giusto è un altro, piccolo piccolo. Quale?"
      goals: [character]
      prompt: {text: "non ci ho trovato quasi", tags: [ci-ne]}
    - learner: "Vero, è il mio punto debole: di emozione non ne ho trovata quasi. E lo stile, appunto, è il motivo: frasi perfette, levigate, ma fredde come il marmo."
    - tutor: "Fredde come il marmo o asciutte come il Piemonte, dipende da dove guardi. Qui da noi il pudore è una forma di affetto: Pavese, sulla pagina, non ha mai alzato la voce. Comunque sia, ti sei difeso bene. Lo sconsiglieresti a tutti, quindi?"
      goals: [style]
      new: [{lemma: pudore, gloss: "reserve, modesty"}, {lemma: levigato, gloss: "polished, smooth"}, {lemma: sconsigliare, gloss: to advise against}]
    - learner: "A tutti no, sarei ingiusto. Lo consiglierei a chi ama le atmosfere e non ha fretta, magari a chi ha conosciuto quel mondo. A un ventenne che vuole essere trascinato dalla storia, invece, direi di lasciar perdere."
    - tutor: "Verdetto equo: a malincuore, lo metto a verbale. Vedi che a litigare sui libri ci si capisce meglio che ad andare d'accordo? Vieni, che di là stanno stappando il vino, e sul finale ho ancora due cosette da dirti."
      goals: [recommend]
      new: [{lemma: a malincuore, gloss: reluctantly}, {lemma: mettere a verbale, gloss: to put on record}, {lemma: stappare, gloss: to uncork}]

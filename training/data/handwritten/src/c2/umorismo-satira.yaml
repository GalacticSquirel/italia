- scenario: umorismo-satira
  level: C2
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Colpevole. Ho riso per educazione, ma se avrei capito il gioco sul guanciale, mi sarei divertita davvero. Me lo spieghi?"
    errors: [hypothetical]
  - tutor: "Te lo spiego, ma prima sistemami quella frase: «se avrei capito»? Con un «se» così, a Roma ti tolgono la cittadinanza. Riprova, poi ti do la spiegazione."
    goals: [missed]
    prompt: {text: "se avrei capito", tags: [hypothetical]}
  - learner: "Se avessi capito il gioco sul guanciale, mi sarei divertita. Va meglio?"
  - tutor: "Molto meglio. Allora: il comico ha detto che il ministro, sul guanciale, ci dorme. Il guanciale è la carne della carbonara, ma è anche una vecchia parola per cuscino. Quindi il ministro dorme invece di lavorare. Spiegata fa già meno ridere, vero?"
    new: [{lemma: guanciale, gloss: "cured pork cheek; (old-fashioned) pillow"}]
  - learner: "Ah, ecco! No, anzi, adesso mi piace. Però la mia preferita è stata quella del giardiniere: il colmo è piantare la fidanzata. L'ho capita da sola, per questo ha funzionato."
  - tutor: "Una freddura dell'anteguerra, ma regge sempre: «piantare» come mettere in terra e come mollare. Capirla da soli è metà del piacere, hai ragione. Dai, adesso tocca a te: inventami un colmo, anche brutto."
    goals: [favourite]
    new: [{lemma: colmo, gloss: "'what's the height of...' riddle joke"}]
  - learner: "Ci provo. Qual è il colmo per un sarto? Perdere il filo... del discorso."
  - tutor: "Ammazza, è terribile. Cioè perfetta: una freddura deve far male. Ti assumo. Senti però, quello sul ministro c'è andato pesante stasera. Secondo te la satira può dire tutto o a un certo punto deve fermarsi?"
    goals: [wordplay]
  - learner: "Penso che possa colpire chiunque abbia potere, e anche forte. Mi fermerei solo davanti a chi non può difendersi: ridere di una vittima non è satira, è prepotenza."
  - tutor: "Quindi colpire in alto e mai in basso. È la regola di Pasquino, la statua dove i romani appendevano versi contro i papi, non contro i poveracci. Messa così, non ho niente da aggiungere, e a me capita di rado."
    goals: [limits]
  - learner: "Pasquino? Non lo conoscevo. Me lo fai vedere, uno di questi giorni?"
  - tutor: "Sta dietro piazza Navona, ci passiamo domani. Tu porti il colmo del sarto e lo appendiamo lì, così roviniamo la reputazione di tutti e due. Daje, finisci la birra."

- scenario: umorismo-satira
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Va bene, lo ammetto. Ho capito «carbonara» e «ministro», ma il finale con la frittata mi è scappato. Perché ridevano tutti?"
  - tutor: "Perché «fare la frittata» da noi vuol dire combinare un guaio senza rimedio. Il ministro voleva fare la carbonara, ha cotto troppo l'uovo e ha fatto la frittata. Come con la riforma, dice il comico. Chiaro adesso?"
    goals: [missed]
    new: [{lemma: frittata, gloss: "omelette (fare la frittata = to make a mess of things)"}]
  - learner: "Chiarissimo! In spagnolo diremmo «la ha liado». Quindi la battuta funziona su due piani, la cucina e la politica. Mica male."
  - tutor: "Mica male no, per uno che sul palco suda come una fontana. E a te quale è piaciuta di più, tra quelle che hai capito senza l'interprete?"
  - learner: "Quella dell'idraulico che ha un figlio che non capisce un tubo. Io faccio l'idraulico davvero, e stasera voglio dire questa barzelletta a mio fratello, che lavora con me."
    errors: [word-choice]
  - tutor: "Un idraulico vero, allora era scritta per te! Fai bene a raccontare questa barzelletta a tuo fratello, basta che non ti chieda lo sconto. E tu, un gioco di parole in italiano me lo sapresti fare?"
    goals: [favourite]
    recast: {text: "dire questa barzelletta", fix: "raccontare questa barzelletta", tags: [word-choice]}
  - learner: "Ci provo con il mio mestiere. Qual è il colmo per un idraulico? Essere pieno di lavoro e avere l'acqua alla gola."
  - tutor: "Però! L'acqua alla gola, per uno che ripara tubi: regge, e l'hai fatta in una lingua non tua. Io in spagnolo non saprei nemmeno ordinare una birra. Cambiando tono: il comico col ministro c'è andato giù pesante. Per te la satira deve avere un limite?"
    goals: [wordplay]
  - learner: "Con i politici no, per me si può dire quasi tutto: hanno scelto loro di stare lì. Il limite lo metterei sulla famiglia, sui figli, che non hanno scelto niente."
  - tutor: "Mi pare una linea pulita: chi sale sul palco del potere si prende i fischi, i figli restano fuori. Detta da un idraulico, poi, non fa una piega. Dai, l'ultimo giro lo pago io, tu pensa al prossimo colmo."
    goals: [limits]

- scenario: umorismo-satira
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Touché. Attualmente non ho capito nemmeno la metà: cosa c'entrano i carbonari con un piatto di pasta?"
    errors: [false-friend]
  - tutor: "In realtà c'entrano eccome. I carbonari erano una società segreta dell'Ottocento, gente che complottava contro i re. Il comico diceva che il ministro la carbonara la fa di nascosto, da buon carbonaro: trama pure in cucina."
    goals: [missed]
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    new: [{lemma: carbonaro, gloss: "member of the Carboneria, a 19th-century secret society"}, {lemma: complottare, gloss: to plot}]
  - learner: "Ah, storia e cucina insieme! Adesso la trovo quasi elegante. Ma confesso che ho riso di più alla battuta sulla statistica dei polli."
  - tutor: "Quella viene da Trilussa, poeta romano: se io mangio due polli e tu nessuno, per la statistica ne abbiamo mangiato uno a testa. Ha cent'anni e non è invecchiata di un giorno. Perché ti ha fatto ridere tanto?"
  - learner: "Perché è vera! Credo che la satira migliore è quella che ti fa ridere e poi ti lascia un po' di amaro."
    errors: [subjunctive-use]
  - tutor: "Ridere e poi restarci male: definizione da incorniciare. La forma però un po' meno: «credo che la satira migliore è»? Dopo «credo che» quel verbo non mi convince."
    goals: [favourite]
    prompt: {text: "Credo che la satira migliore è", tags: [subjunctive-use]}
  - learner: "Credo che la satira migliore sarà quella che lascia l'amaro?"
    errors: [subjunctive-use]
  - tutor: "Ci vuole il congiuntivo: anch'io credo che la satira migliore sia quella che lascia l'amaro in bocca. Pace fatta. Ora però mettiti in gioco: me la fai una freddura tua, in italiano?"
    recast: {text: "Credo che la satira migliore sarà", fix: "credo che la satira migliore sia", tags: [subjunctive-use]}
  - learner: "Ne ho una da pensionato. Qual è il colmo per un pescatore? Andare in pensione e non sapere che pesci pigliare."
  - tutor: "Ammazza! Brutta al punto giusto, e «non sapere che pesci pigliare» è usato da manuale. Ultima cosa, poi ti lascio bere: stasera col ministro ci sono andati pesanti. La satira, per te, dovrebbe fermarsi da qualche parte?"
    goals: [wordplay]
  - learner: "Dovrebbe fermarsi prima della menzogna. Esagerare è il suo mestiere, ma se inventa fatti falsi per far ridere, allora non è più satira: è propaganda con il naso rosso."
  - tutor: "Propaganda con il naso rosso: questa te la rubo, sappilo. Esagerare sì, inventare no; mi sembra un confine che piacerebbe pure a Trilussa. Alla salute, e al prossimo spettacolo vieni preparato."
    goals: [limits]

- scenario: umorismo-satira
  level: C2
  persona: en-f-professional
  history: [passive]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Per niente! L'ho capita benissimo: il ministro la pancetta ce l'ha, ma sopra la cintura. Quella che non ho capito è un'altra."
  - tutor: "Ah, allora ti devo delle scuse, e a Roma non capita spesso che uno le faccia. Sentiamo: quale ti è sfuggita?"
  - learner: "Quella dei tarallucci. Ha detto che in Parlamento ogni scandalo finisce a tarallucci e vino, e tutti ridevano. Per me non fa senso: cosa sono i tarallucci?"
    errors: [word-choice]
  - tutor: "Capisco che per te non ha senso, se non conosci i taralli: biscotti salati del Sud, da mangiare col vino. «Finire a tarallucci e vino» vuol dire che dopo una gran lite tutti fanno pace e nessuno paga. Occhio, però: «fare senso» da noi significa fare schifo."
    goals: [missed]
    recast: {text: "non fa senso", fix: "non ha senso", tags: [word-choice]}
    new: [{lemma: tarallo, gloss: "ring-shaped savoury biscuit from the South"}]
  - learner: "Che bella differenza, me la segno! Allora la battuta è amara: gli scandali finiscono con un brindisi. Però la mia preferita resta quella sulla pancetta, perché il doppio senso arriva in ritardo, mentre stai ancora pensando alla ricetta."
  - tutor: "Il ritardo è tutto, in una battuta: ridi due secondi dopo e ti senti pure intelligente. Hai occhio per il mestiere. Te la senti di provarci tu, con un gioco di parole?"
    goals: [favourite]
  - learner: "Ci provo, ma sii clemente. Sono stata detta che i colmi sono facili: qual è il colmo per un cuoco? Essere alla frutta a metà carriera."
    errors: [passive]
  - tutor: "Il cuoco alla frutta: promossa, fa male come deve. Però «sono stata detta che» è inglese travestito. In italiano qui il soggetto non puoi essere tu: chi riceve le parole va messo in un altro modo. Come?"
    goals: [wordplay]
    prompt: {text: "Sono stata detta che", tags: [passive]}
  - learner: "Mi è stato detto che i colmi sono facili. O anche: mi hanno detto. Giusto?"
  - tutor: "Giustissimo, tutte e due. E chi lo sosteneva mentiva: un colmo decente è roba fina. Senti, una cosa seria prima di andare: per te la satira deve avere dei paletti, o chi fa ridere ha sempre ragione?"
    new: [{lemma: paletto, gloss: "stake; (figurative) limit, boundary"}]
  - learner: "Chi fa ridere non ha sempre ragione, però preferisco una battuta di cattivo gusto a un comico in tribunale. I paletti li metta il pubblico, non ridendo."
  - tutor: "Il pubblico che non ride: la censura più crudele che esista, e l'unica che mi convince. Su questo siamo d'accordo, il che mi preoccupa un po'. Daje, andiamo, che domani si lavora."
    goals: [limits]

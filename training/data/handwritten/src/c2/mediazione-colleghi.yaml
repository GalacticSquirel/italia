- scenario: mediazione-colleghi
  level: C2
  persona: en-m-heritage
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Non mi disturba affatto, anzi: si sieda e chiuda pure la porta. Ho notato che ieri è uscita dalla sala scura in volto. Mi racconti con calma, ho tutto il tempo che serve."
    - tutor: "La ringrazio. Il fatto è questo: il rapporto sui fornitori l'abbiamo scritto in due, io e Ferri, notti comprese. Ieri lui l'ha presentato alla direzione dicendo sempre «io», «la mia analisi». Mi sono sentita un soprammobile. Lei, al mio posto, come l'avrebbe presa?"
      new: [{lemma: soprammobile, gloss: "ornament, knick-knack"}, {lemma: fornitore, gloss: supplier}]
    - learner: "Male, glielo dico sinceramente, e capisco la Sua amarezza. Prima di fare qualsiasi passo, però, vorrei avere il quadro completo. Era stato deciso chi dei due avrebbe presentato, o Ferri ha preso la parola di sua iniziativa?"
    - tutor: "Domanda legittima. Dovevamo presentare insieme: così c'era scritto nella convocazione. Poi lui, cinque minuti prima, mi ha detto «comincio io, tu intervieni dopo», e quel dopo non è mai arrivato. Si è preso la scena e, già che c'era, anche il merito."
      goals: [listen, clarify]
      new: [{lemma: convocazione, gloss: notice of meeting}]
    - learner: "Capisco. Le dico come la vedo, senza voler difendere nessuno. Conosco Ferri da anni: davanti alla direzione va in ansia e parla a ruota libera. Può darsi che non l'ha fatto con malizia, ma per pura agitazione."
      errors: [subjunctive-use]
    - tutor: "Può darsi, dice. Guardi, oggi sono suscettibile su tutto, perfino sui verbi: «può darsi che non l'ha fatto»? Se è solo un'ipotesi, me la presenti come tale anche con la grammatica. Poi Le rispondo nel merito."
      prompt: {text: "Può darsi che non l'ha fatto", tags: [subjunctive-use]}
      new: [{lemma: suscettibile, gloss: touchy}]
    - learner: "Giusto, e fa bene a pretendere precisione: può darsi che non l'abbia fatto con malizia. Resta un'ipotesi, non una scusa."
    - tutor: "Ecco, così l'accetto. E forse ha ragione: Ferri non è cattivo, è uno che quando ha paura occupa tutto lo spazio. Ma il risultato per me non cambia: la direzione crede che il lavoro sia suo. Lei che cosa intende fare, in concreto?"
      goals: [perspective]
    - learner: "Tre cose. Oggi stesso scrivo alla direzione per precisare che il rapporto è a doppia firma. Poi vi propongo un chiarimento a tre, qui da me, senza processi. E d'ora in poi farò sicuro che chi presenta sia deciso per iscritto. Le sembra equo?"
      errors: [word-choice]
    - tutor: "Mi sembra più che equo. E se Lei si assicurerà che d'ora in poi sia tutto per iscritto, a me basta. Al chiarimento vengo, e prometto di non presentarmi sul piede di guerra. La ringrazio di non avermi liquidata con una pacca sulla spalla."
      goals: [solution]
      recast: {text: "farò sicuro che", fix: "si assicurerà che", tags: [word-choice]}
      new: [{lemma: sul piede di guerra, gloss: on the warpath}, {lemma: liquidare, gloss: to brush off}, {lemma: pacca, gloss: pat}]

- scenario: mediazione-colleghi
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Certo, entra e siediti. Ho visto che ieri te ne sei andato senza salutare, e mi è dispiaciuto. Dimmi tutto."
      errors: [register]
    - tutor: "Mi accomodo, grazie. Però mi perdoni: «entra», «siediti»? In tre anni ci siamo sempre dati del Lei, e proprio oggi, che ho il sangue agli occhi, preferirei non cambiare abitudini. Possiamo ricominciare?"
      prompt: {text: "entra e siediti", tags: [register]}
      new: [{lemma: avere il sangue agli occhi, gloss: to see red}]
    - learner: "Ha ragione, mi scusi: l'ho fatto per metterLa a Suo agio, ma capisco. Prego, mi dica tutto, senza fretta."
    - tutor: "Apprezzo. Ecco i fatti: il progetto per il cliente di Brescia l'ho costruito io, pezzo per pezzo, in tre mesi. Ieri Marchetti l'ha illustrato come farina del suo sacco, e nessuno ha battuto ciglio. Io lì, zitto, come un allocco."
      new: [{lemma: farina del proprio sacco, gloss: one's own work}, {lemma: non battere ciglio, gloss: not to bat an eyelid}, {lemma: allocco, gloss: "fool (lit. tawny owl)"}]
    - learner: "Capisco che Le bruci, e al Suo posto brucerebbe anche a me: vedere il proprio lavoro con il nome di un altro è tra le cose peggiori che possano capitare in un'officina come la nostra. Mi aiuti a ricostruire: prima della riunione, avevate concordato chi avrebbe presentato che cosa?"
      errors: [false-friend]
    - tutor: "In un ufficio come il nostro, purtroppo, capita più spesso di quanto Lei creda. Concordato, sì: lui l'introduzione, io i numeri. Solo che l'introduzione è durata quaranta minuti, e ai numeri non siamo mai arrivati. Me l'ha fatta sotto il naso."
      goals: [listen]
      recast: {text: "in un'officina come la nostra", fix: "In un ufficio come il nostro", tags: [false-friend]}
      new: [{lemma: farla sotto il naso, gloss: to do something right under someone's nose}]
    - learner: "Quaranta minuti di introduzione sono tanti, glielo concedo. Un'ultima domanda, e non me ne voglia: la direzione sapeva, da qualche documento o da qualche mail, che i numeri erano Suoi?"
    - tutor: "Non me ne ho a male: è la domanda giusta. No, a essere sinceri: i file li ho sempre mandati a Marchetti, e lui li girava ai capi. Di mio, in giro, non c'è nemmeno una firma. Ingenuo, lo so."
      goals: [clarify]
      new: [{lemma: aversene a male, gloss: to take offence}, {lemma: ingenuo, gloss: naive}]
    - learner: "Ingenuo no, corretto. Ma questo forse spiega una parte della storia. Marchetti è abituato a fare da tramite, e può darsi che ieri abbia parlato come parla sempre, senza rendersi conto di cancellarLa. Non lo giustifico: dico che, tra la malafede e la sbadataggine, propenderei per la seconda."
    - tutor: "Sbadataggine... Sarà. Certo, Marchetti è più pasticcione che furbo, questo glielo riconosco. Va bene, gli concedo il beneficio del dubbio. Ma io ci ho rimesso lo stesso. Come se ne esce?"
      goals: [perspective]
      new: [{lemma: sbadataggine, gloss: carelessness}, {lemma: pasticcione, gloss: bungler}, {lemma: rimetterci, gloss: to lose out}]
    - learner: "Se ne esce in due mosse. La prima: alla prossima riunione il progetto lo presenta Lei, dall'inizio alla fine, e lo annuncio io alla direzione. La seconda: da oggi i Suoi documenti partono con il Suo nome. Con Marchetti parlo io, prima, a quattr'occhi."
    - tutor: "A quattr'occhi, e senza tagliargli la testa: mi basta che capisca. La presentazione la preparo volentieri. Grazie di avermi ascoltato, e scusi lo sfogo: ero entrato con un diavolo per capello, esco quasi di buon umore."
      goals: [solution]
      new: [{lemma: avere un diavolo per capello, gloss: to be furious}, {lemma: sfogo, gloss: outburst}, {lemma: a quattr'occhi, gloss: "in private, face to face"}]

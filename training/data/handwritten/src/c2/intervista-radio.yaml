- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie dell'invito, e complimenti per la diplomazia: tra coraggio e incoscienza, temo che sia stata soprattutto la seconda. Il libro si intitola «Permesso di soggiorno» e l'ho scritto perché, dopo dodici anni a Bologna, volevo capire che cosa mi avesse trattenuta qui."
    - tutor: "Dodici anni: ormai lei è più bolognese dei tortellini. Però mi tolga una curiosità, perché qui non abbiamo peli sulla lingua. Ogni straniero che scrive di noi finisce a parlare di pasta, mamme e gesti con le mani: lei come ha evitato lo stereotipo, ammesso che l'abbia evitato?"
      goals: [present-book]
      new: [{lemma: "non avere peli sulla lingua", gloss: "to speak bluntly"}]
    - learner: "Non l'ho evitato, l'ho attraversato. Sebbene gli stereotipi sono spesso ridicoli, nascondono quasi sempre un granello di verità, e a me interessava quel granello."
      errors: [subjunctive-use]
    - tutor: "Un granello di verità, dice, e glielo concedo volentieri. Ma siamo in diretta e gli ascoltatori hanno l'orecchio fino: «sebbene gli stereotipi sono»? Dopo «sebbene» la nostra grammatica pretende un altro modo verbale."
      prompt: {text: "Sebbene gli stereotipi sono", tags: [subjunctive-use]}
    - learner: "Touché. Sebbene gli stereotipi siano spesso ridicoli, nascondono un granello di verità: gli italiani gesticolano davvero, ma ogni gesto ha una sua grammatica precisa."
    - tutor: "Ecco, adesso ci siamo. Una grammatica dei gesti, addirittura: mi piace. Ma i libri vivono di storie, non di teorie. Ci racconti un aneddoto, uno di quelli che dicono di noi più di cento pagine di sociologia."
      goals: [stereotype]
    - learner: "Volentieri. Il mio primo inverno, il vicino di casa mi vide rientrare con la febbre e, senza dire niente, mi lasciò una pentola di brodo davanti alla porta. Non ci eravamo mai parlati. Quel giorno ho fatto una decisione: sarei rimasta."
      errors: [word-choice]
    - tutor: "Che storia! Dunque è davanti a una pentola di brodo che lei ha preso una decisione così importante: altro che permesso di soggiorno. Da noi si dice che tutto fa brodo, e nel suo caso è vero alla lettera. Passiamo alla lingua, però. Che cosa ha cambiato in lei l'italiano?"
      goals: [anecdote]
      recast: {text: "ho fatto una decisione", fix: "ha preso una decisione", tags: [word-choice]}
      new: [{lemma: "tutto fa brodo", gloss: "it's all grist to the mill"}]
    - learner: "Mi ha resa meno frettolosa. In inglese vado dritta al punto; in italiano ho imparato che il giro largo, la premessa, perfino la chiacchiera al bar fanno parte del messaggio. Credo di essere diventata una persona che ascolta di più."
    - tutor: "Meno frettolosa e più attenta: quasi quasi lo consiglio ai nostri politici. Purtroppo il tempo è tiranno e la puntata sta per finire. Le lascio l'ultima parola: come vuole salutare gli ascoltatori?"
      goals: [language]
    - learner: "Dicendo che in Italia sono arrivata con una valigia e resto con un vocabolario: pesa di più, ma almeno non me lo possono perdere in aeroporto."
    - tutor: "Splendido: una valigia in meno e un vocabolario in più. Grazie di essere stata con noi, e a voi, cari ascoltatori, l'appuntamento è per la prossima puntata. Buona serata!"
      goals: [farewell]

- scenario: intervista-radio
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un autore che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuto!"
    - learner: "Buonasera a tutti. Il libro si chiama «Napoletano d'adozione» e racconta i miei quindici anni a Napoli, dove sono arrivato da Siviglia per lavorare al porto. L'ho scritto quasi per scommessa: il mio primo libro, in spagnolo, non aveva avuto nessun esito, e un amico mi sfidò a riprovarci in italiano."
      errors: [false-friend]
    - tutor: "Una scommessa vinta, direi, visto che è qui con noi. E se il primo libro non ha avuto nessun successo, questo si sta prendendo la rivincita. Ma veniamo al sodo. Napoli è la capitale mondiale dello stereotipo: sole, pizza e l'arte di arrangiarsi. Lei quanti ne ha confermati nel suo libro?"
      goals: [present-book]
      recast: {text: "non aveva avuto nessun esito", fix: "non ha avuto nessun successo", tags: [false-friend]}
      new: [{lemma: "venire al sodo", gloss: "to get to the point"}, {lemma: "rivincita", gloss: "comeback, return match"}, {lemma: "arrangiarsi", gloss: "to get by, to make do"}]
    - learner: "Qualcuno, lo ammetto. Ma lo stereotipo è come una cartolina: l'immagine è vera, solo che manca tutto quello che sta fuori dall'inquadratura. L'arte di arrangiarsi, per esempio, vista da vicino è soprattutto una forma di intelligenza collettiva."
    - tutor: "Intelligenza collettiva: detta così sembra quasi una materia da università. Mi ha quasi convinto, e non è facile. Adesso però voglio la prova. Ci regali un aneddoto dal porto, uno di quelli che una cartolina non potrà mai mostrare."
      goals: [stereotype]
    - learner: "Il primo giorno un collega anziano mi gridò «Jamme, guagliò!» e io, che non capivo, gli chiesi di ripetere più piano. Lui mi guardò serio e disse: «Più piano non esiste, qua». Non sapevo cosa contestare, così mi misi a correre anch'io."
      errors: [false-friend]
    - tutor: "«Più piano non esiste»: è già un titolo. Capisco che lei non sapesse cosa rispondere. «Jamme», per chi ci ascolta dal Nord, è l'invito napoletano a muoversi, parente stretto del «daje» romano. Ma mi dica: imparare l'italiano, e un po' di napoletano, che cosa ha cambiato in lei?"
      goals: [anecdote]
      recast: {text: "cosa contestare", fix: "cosa rispondere", tags: [false-friend]}
    - learner: "Mi ha tolto la fretta di avere ragione. Lo spagnolo e l'italiano si somigliano tanto che all'inizio credevo di capire tutto, e sbagliavo. Ho imparato a dubitare delle parole che sembrano amiche: è stata una lezione di umiltà."
    - tutor: "I falsi amici come maestri di umiltà: bisognerebbe insegnarlo a scuola. Siamo quasi in chiusura, purtroppo. Le chiedo un ultimo sforzo: una frase per i nostri ascoltatori, di quelle che restano in testa fino a domattina."
      goals: [language]
    - learner: "A Siviglia sono nato, a Napoli mi hanno fatto. E come si dice lì, ogni scarrafone è bello a mamma sua: quindi perdonate i difetti del libro."
    - tutor: "Perfetto, chiude con un proverbio napoletano: anche lo scarafaggio è bello per la sua mamma. Grazie di cuore per essere stato con noi in diretta. A voi, cari ascoltatori, buon proseguimento e alla prossima puntata!"
      goals: [farewell]
      new: [{lemma: "scarafaggio", gloss: "cockroach"}]

- scenario: intervista-radio
  level: C2
  persona: en-m-heritage
  history: [hypothetical]
  turns:
    - tutor: "Bentornati in diretta, cari ascoltatori. Oggi in studio c'è un autore che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuto!"
    - learner: "Grazie, è un piacere. Premetto che gioco in casa a metà: i miei nonni partirono dall'Abruzzo per Boston negli anni Cinquanta. Il libro, «La lingua della nonna», racconta il mio ritorno al loro paese, per vedere che cosa restava dell'Italia che mi avevano raccontato."
    - tutor: "Un ritorno alle origini, dunque. Ma sa che cosa dicono i maligni? Che voi nipoti d'America amate un'Italia da cartolina, ferma al 1955, che esiste solo nei pranzi della domenica. Mi dica lei se è uno stereotipo anche questo."
      goals: [present-book]
      new: [{lemma: "maligno", gloss: "malicious person, gossip"}]
    - learner: "C'è del vero, e mi è costato ammetterlo. Sono arrivato cercando il paese della nonna e ho trovato ragazzi con la fibra ottica che volevano parlarmi di Boston. L'Italia immobile ero io a portarmela dietro, in valigia."
    - tutor: "Bella immagine, e onesta: non capita spesso a questo microfono. Lo stereotipo in valigia, insomma. Allora ci racconti un episodio preciso, il momento in cui ha capito che la valigia andava disfatta."
      goals: [stereotype]
    - learner: "Al bar del paese ordinai un caffè in dialetto, fiero come un pavone. Il barista mi rispose in perfetto italiano: «Così parlava mio nonno». Se lo avrei saputo prima, sarei stato zitto."
      errors: [hypothetical]
    - tutor: "Povero pavone, spennato al banco del bar! Però, da buon nipote d'Abruzzo, ci ripensi: «se lo avrei saputo»? Dopo il «se» dell'ipotesi il condizionale da noi non entra, nemmeno in dialetto."
      prompt: {text: "Se lo avrei saputo", tags: [hypothetical]}
      new: [{lemma: "spennare", gloss: "to pluck (a bird); to fleece"}, {lemma: "pavone", gloss: "peacock"}]
    - learner: "Giusto, mi correggo: se lo avrei saputo prima, sarei rimasto zitto. Meglio così, no?"
      errors: [hypothetical]
    - tutor: "Quasi: se l'avesse saputo prima, sarebbe rimasto zitto, e noi avremmo perso una bella storia. Dunque meglio così. Quel barista, senza volerlo, le ha fatto una lezione di lingua. Che cosa è cambiato in lei studiando l'italiano di oggi, e non più quello della nonna?"
      goals: [anecdote]
      recast: {text: "se lo avrei saputo", fix: "se l'avesse saputo", tags: [hypothetical]}
    - learner: "Ho smesso di sentirmi un italiano di serie B. Il dialetto dei nonni era affetto, ma era anche un recinto; l'italiano mi ha dato le parole per discutere, per scherzare, persino per litigare alla pari."
    - tutor: "Litigare alla pari: ecco il vero esame di lingua, altro che certificati. Ci avviamo alla chiusura, e a me dispiace. Le lascio il microfono per l'ultima battuta: che cosa direbbe oggi a quel barista?"
      goals: [language]
    - learner: "Che aveva ragione lui, ma che il conto lo pago io: gli devo un caffè e mezzo libro."
    - tutor: "Un caffè e mezzo libro: affare fatto, se ci ascolta. Grazie per essere venuto a trovarci e per la sincerità. Cari ascoltatori, la puntata finisce qui: a domani, alla stessa ora."
      goals: [farewell]

- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Benvenuta è una parola grossa: aspetti di aver letto il libro. Si intitola «Lezioni di italiano» ed è un titolo bugiardo, perché le lezioni le ho ricevute io. Insegno spagnolo in un liceo di Torino da otto anni e volevo raccontare i miei studenti, che mi hanno spiegato l'Italia meglio di qualunque guida."
    - tutor: "Un titolo bugiardo e un'autrice sincera: cominciamo bene. Ho letto che nel libro lei ci fa le pulci, a noi italiani, capitolo dopo capitolo. Mi dica la verità: siamo davvero il popolo che arriva sempre in ritardo e parla sempre di cibo?"
      goals: [present-book]
      new: [{lemma: "fare le pulci", gloss: "to nitpick, to pick holes in"}, {lemma: "bugiardo", gloss: "lying, deceitful"}]
    - learner: "Fare le pulci, che bella espressione: me la segno. Sul ritardo, dipende della città: a Torino i miei studenti arrivano prima di me. Sul cibo, invece, nessuno stereotipo: è pura cronaca."
      errors: [preposition]
    - tutor: "Pura cronaca, e non provo nemmeno a difendermi. Però adesso le pulci le faccio io a lei, professoressa: «dipende della città»? Qui lo spagnolo le ha fatto uno scherzo con la preposizione."
      prompt: {text: "dipende della città", tags: [preposition]}
    - learner: "Che figura, proprio davanti ai miei studenti! Dipende dalla città, naturalmente. E dipende anche da chi guarda: lo stereotipo dice più dello straniero che lo usa che dell'italiano che lo subisce."
    - tutor: "Ecco fatto, e la figura è già dimenticata. Mi interessa questo sguardo dello straniero. Ci racconti allora un aneddoto di classe, un momento in cui i suoi ragazzi le hanno rovesciato lo sguardo."
      goals: [stereotype]
    - learner: "Un giorno spiegavo la siesta, convinta di fare una lezione seria. Un ragazzo alzò la mano e chiese: «Prof, ma voi spagnoli dormite davvero tutti il pomeriggio, o è come noi con il mandolino?». Scoppiammo a ridere, e da lì nacque il primo capitolo."
    - tutor: "Il mandolino contro la siesta: uno a uno, palla al centro. Quel ragazzo meriterebbe i diritti d'autore. Ma veniamo a lei. Vivere e insegnare in italiano, per una spagnola, è stato come cambiare vestito oppure come cambiare pelle?"
      goals: [anecdote]
    - learner: "Pelle, direi, anche se all'inizio pensavo fosse solo un vestito. In italiano sono più ironica e meno diretta: ho scoperto il piacere del condizionale, di quel «vorrei» che in spagnolo userei molto meno. Non so se sia un progresso, ma mi ci trovo bene."
    - tutor: "Il piacere del condizionale: lo dirò a mia moglie, che mi accusa di usare solo l'imperativo. Siamo arrivati in fondo, purtroppo. Come si congeda dai nostri ascoltatori un'autrice dal titolo bugiardo?"
      goals: [language]
    - learner: "Con un compito per casa: leggete il libro e poi fatemi voi le pulci. Prometto di non mettere voti."
    - tutor: "Compiti per casa in diretta nazionale: non era mai successo. Grazie, professoressa, è stato un vero piacere averla qui. E voi, cari ascoltatori, mettetevi a studiare: alla prossima puntata!"
      goals: [farewell]

- scenario: politica-lavoro
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che esageri, come al solito. Metà dei lavori cambierà pelle, questo sì, ma sparire è un'altra cosa. Benché l'automazione fa paura, ogni rivoluzione tecnologica finora ha creato più mestieri di quanti ne abbia distrutti."
    errors: [subjunctive-use]
  - tutor: "«Come al solito», senti chi parla! Sul merito ti rispondo tra un attimo, prima però: «benché l'automazione fa paura»? Con «benché» quel verbo così non regge. Aggiustalo e poi ti smonto la tesi."
    goals: [opinion]
    prompt: {text: "Benché l'automazione fa paura", tags: [subjunctive-use]}
  - learner: "Benché l'automazione faccia paura, volevo dire. E adesso smontami pure."
  - tutor: "Ecco. Allora: il telaio meccanico ha creato operai, d'accordo, ma stavolta le macchine non sostituiscono le braccia, sostituiscono la testa. Facciamo un esperimento: se domani il tuo lavoro lo facesse un programma, tu che faresti?"
    new: [{lemma: telaio, gloss: loom}]
  - learner: "Se domani un programma facesse il mio lavoro, prima mi prenderei una settimana di ferie, poi mi rimetterei a studiare. Probabilmente finirei a controllare gli errori del programma: qualcuno dovrà pure accorgersi quando la macchina prende lucciole per lanterne."
  - tutor: "Lucciole per lanterne, bella questa: te l'ho insegnata io, ammettilo. Però «mi rimetterei a studiare» lo dici tu che hai le spalle coperte. Dammi un caso concreto, uno vero, di qualcuno che è riuscito a cambiare mestiere."
    goals: [hypothesis]
    new: [{lemma: prendere lucciole per lanterne, gloss: to get the wrong end of the stick}, {lemma: avere le spalle coperte, gloss: to have a safety net}]
  - learner: "Mio cugino faceva il cassiere in banca. Quando hanno chiuso la filiale, ha seguito un corso pagato dalla regione e adesso installa pannelli solari. Guadagna di più, e dice che l'educazione continua dovrebbe essere un diritto, non un favore."
    errors: [false-friend]
  - tutor: "Una rondine non fa primavera, ma te lo concedo: è un bell'esempio. E sulla formazione continua tuo cugino ha ragione da vendere, peccato che i corsi buoni si contino sulle dita di una mano. Dai, tira le somme, che il risotto si fredda."
    goals: [example]
    recast: {text: "educazione continua", fix: "formazione continua", tags: [false-friend]}
    new: [{lemma: una rondine non fa primavera, gloss: one swallow doesn't make a summer}, {lemma: tirare le somme, gloss: to sum up}]
  - learner: "Tiro le somme: l'automazione cancellerà dei compiti più che dei mestieri, e il rischio vero non è la disoccupazione di massa ma lasciare indietro chi non può formarsi. Tutto dipende da quanto investiamo sulle persone. E tu, sotto sotto, ci credi davvero alla tua profezia?"
  - tutor: "Sotto sotto? Metà e metà. Faccio l'avvocato del diavolo perché a questa tavola siete tutti troppo ottimisti. Ma se devo essere sincero, mi fa più paura la pigrizia dei governi che l'intelligenza delle macchine. E adesso passami il vino, prima che lo versi un robot."
    goals: [conclude]
    new: [{lemma: fare l'avvocato del diavolo, gloss: to play devil's advocate}]

- scenario: politica-lavoro
  level: C2
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Che lo dici per provocare, Riccardo, ti conosco. Secondo me tra dieci anni lavoreremo in modo diverso, non di meno. Il problema non è la tecnologia in sé, ma chi ne raccoglie i frutti: se i guadagni vanno tutti a quattro aziende, allora sì che c'è da preoccuparsi."
  - tutor: "Mi conosci, ma stavolta non scherzo. Chi raccoglie i frutti, dici: bella frase, da comizio. Però restiamo coi piedi per terra. Che succederebbe, secondo te, se da un giorno all'altro sparissero tutti i lavori d'ufficio?"
    goals: [opinion]
    new: [{lemma: comizio, gloss: political rally}, {lemma: restare coi piedi per terra, gloss: to keep one's feet on the ground}]
  - learner: "Sinceramente non ne ho mai pensato in questi termini. Se sparissero davvero, immagino che all'inizio ci sarebbe il panico, e poi una corsa verso i mestieri che una macchina non sa fare: curare, insegnare, riparare."
    errors: [ci-ne]
  - tutor: "La corsa ai mestieri di cura mi convince. Ma torna un secondo indietro: «non ne ho mai pensato»? Si pensa a qualcosa, non di qualcosa: quale particella sostituisce «a questo»?"
    prompt: {text: "non ne ho mai pensato", tags: [ci-ne]}
  - learner: "Giusto: non ci ho mai pensato in questi termini. Però adesso che mi ci fai pensare, la corsa non sarebbe uguale per tutti: un impiegato di cinquant'anni non diventa infermiere in sei mesi."
  - tutor: "Brava, e hai messo il dito nella piaga: a cinquant'anni non ci si reinventa con un corso serale. Ma le teorie le so fare anch'io. Hai un esempio concreto, qualcosa che hai visto con i tuoi occhi?"
    goals: [hypothesis]
    new: [{lemma: mettere il dito nella piaga, gloss: to touch a sore point}, {lemma: reinventarsi, gloss: to reinvent oneself}]
  - learner: "Sì, ti metto un esempio di casa mia. A Valencia il porto ha automatizzato le gru, che mio zio guidava da vent'anni. Non l'hanno licenziato: l'hanno messo a controllarle da uno schermo. Ma dei suoi colleghi ne è rimasto uno su tre."
    errors: [word-choice]
  - tutor: "Uno su tre: gli altri due a spasso, e questo mi dà ragione. E ti faccio un esempio anch'io: nella fabbrica di mio padre i robot sono arrivati nel Duemila, e degli operai di allora non è rimasto nessuno. Su, tira le fila del discorso."
    goals: [example]
    recast: {text: "ti metto un esempio", fix: "ti faccio un esempio", tags: [word-choice]}
    new: [{lemma: essere a spasso, gloss: to be out of work}, {lemma: tirare le fila, gloss: to pull the threads together}]
  - learner: "Va bene, tiro le fila. L'automazione non è né una condanna né una festa: sostituisce i compiti ripetitivi e premia chi può formarsi. Il rischio è per chi resta in mezzo, e lì serve la politica, non il mercato. Ma tu, che fai tanto il pessimista, che cosa proporresti?"
  - tutor: "Io? Tassare i robot e pagare la formazione a chi perde il posto, altro che pacche sulle spalle. Ma lo so che è un'utopia: in questo paese si chiude la stalla quando i buoi sono già scappati. Comunque brava, mi hai quasi fatto cambiare idea. Quasi."
    goals: [conclude]
    new: [{lemma: chiudere la stalla quando i buoi sono scappati, gloss: to shut the stable door after the horse has bolted}, {lemma: pacca sulla spalla, gloss: pat on the back}]

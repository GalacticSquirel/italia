- scenario: presentazione-progetto
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Sarò breve, direttore. Proponiamo una piattaforma di assistenza clienti che riunisca in un unico sistema telefono, posta elettronica e chat. Oggi il venti per cento dei reclami si perde per strada; l'obiettivo è dimezzare i tempi di risposta entro dodici mesi."
  - tutor: "Fin qui è chiara, e la brevità la apprezzo. Ma di piattaforme miracolose ne ho viste passare parecchie, e quasi tutte promettevano mari e monti. Mi dia dei numeri: che cosa ci guadagniamo, in concreto?"
    goals: [pitch]
    new: [{lemma: promettere mari e monti, gloss: to promise the earth}]
  - learner: "Niente mari e monti, solo cifre prudenti. Stimiamo un risparmio di trecentomila euro l'anno sui costi di gestione e un aumento del quattro per cento del fatturato, perché un cliente seguito bene rinnova. Assumo che il tasso di rinnovo resti quello attuale, quindi è una stima per difetto."
    errors: [false-friend]
  - tutor: "Se presumo che il tasso di rinnovo resti quello attuale, come fa lei, i conti tornano. Il punto è l'investimento: seicentomila euro, in un anno in cui stiamo tirando la cinghia, non sono noccioline. Che cosa mi risponde se le dico che il rischio è troppo alto?"
    goals: [benefits]
    recast: {text: "Assumo che", fix: "presumo che", tags: [false-friend]}
    new: [{lemma: tirare la cinghia, gloss: to tighten one's belt}, {lemma: non sono noccioline, gloss: "it's not peanuts"}]
  - learner: "Le rispondo che il rischio più alto è restare fermi. E poi lo abbiamo ridotto: se il progetto partirebbe a gennaio con una sola linea di prodotto, a giugno avremmo già dati reali per decidere se estenderlo."
    errors: [hypothetical]
  - tutor: "L'idea di partire in piccolo mi interessa, e ci torno. Prima però mi scusi la pignoleria: «se il progetto partirebbe»? In un'ipotesi del genere, dopo il «se», il condizionale non lo voglio sentire nemmeno in corridoio. Me la ripeta come si deve."
    prompt: {text: "se il progetto partirebbe", tags: [hypothetical]}
    new: [{lemma: pignoleria, gloss: fussiness, pedantry}]
  - learner: "Ha ragione, mi perdoni. Se il progetto partisse a gennaio con una sola linea di prodotto, a giugno avremmo già dati reali, e avremmo speso meno di un quarto del budget."
  - tutor: "Così sì, e così l'argomento sta in piedi: un quarto della spesa per sei mesi di prova è una scommessa che posso difendere davanti al consiglio. Non le dico ancora di sì, sia chiaro. Che cosa le serve da me per andare avanti?"
    goals: [objection]
  - learner: "Mi servono due cose: il via libera per la fase pilota e una persona dell'informatica a tempo pieno. In cambio le porto entro venerdì un piano con scadenze e costi mese per mese, e a giugno ci rivediamo con i risultati in mano."
  - tutor: "Venerdì il piano sulla mia scrivania, prima delle nove. Per l'informatica parlo io con Bianchi, ma non le garantisco niente. E a giugno voglio numeri, non diapositive colorate: carta canta. Buon lavoro."
    goals: [next-steps]
    new: [{lemma: carta canta, gloss: "what's written down is what counts"}, {lemma: diapositiva, gloss: slide}]

- scenario: presentazione-progetto
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo, dottoressa. In due parole: vogliamo aprire un canale di vendita diretta in rete per i ricambi, saltando i distributori sui piccoli ordini. L'obiettivo è recuperare margine e conoscere finalmente i nostri clienti finali, che oggi non vediamo nemmeno in cartolina."
  - tutor: "«Nemmeno in cartolina» rende l'idea. Però i distributori sono trent'anni che ci danno da mangiare, e non vorrei segare il ramo su cui siamo seduti. Prima di parlare di rischi, mi dica che cosa ci porterebbe in cifre."
    goals: [pitch]
    new: [{lemma: segare il ramo su cui si è seduti, gloss: to saw off the branch one is sitting on}, {lemma: distributore, gloss: distributor}]
  - learner: "Certo. Sui piccoli ordini oggi lasciamo ai distributori il trenta per cento. Con la vendita diretta, già il primo anno, risparmiamo un botto di soldi: circa quattrocentomila euro, e altri centocinquantamila li guadagniamo dal maggior fatturato."
    errors: [register]
  - tutor: "Le cifre sono interessanti. La forma, mi consenta, un po' meno: «un botto di soldi»? Va benissimo al bar con gli amici, ma davanti al consiglio di amministrazione mi farebbe fare una magra figura. Come lo direbbe in una riunione come questa?"
    prompt: {text: "un botto di soldi", tags: [register]}
    new: [{lemma: fare una magra figura, gloss: to make a poor impression}]
  - learner: "Mi scusi, è l'italiano di casa mia che ogni tanto scappa fuori. Volevo dire che otterremmo un risparmio considerevole, nell'ordine dei quattrocentomila euro."
  - tutor: "Molto meglio, e non si scusi: l'italiano di casa è una ricchezza, basta sapere quando tenerlo in tasca. Torniamo al ramo. Se i distributori la prendono male e ci voltano le spalle, perdiamo ben più di quattrocentomila euro. Che cosa mi dice?"
    goals: [benefits]
    new: [{lemma: voltare le spalle, gloss: to turn one's back on}]
  - learner: "Le dico che il pericolo c'è, ma non va ingigantito. Il canale diretto riguarderebbe solo gli ordini sotto i cinquecento euro, che ai distributori rendono poco e costano molto: qualcuno, anzi, ci ringrazierebbe. Non credo che valga la pena prendere un rischio più grande di così."
    errors: [word-choice]
  - tutor: "Su questo siamo d'accordo: non intendo correre un rischio più grande di quello che descrive. Il limite dei cinquecento euro è una buona idea, e gliene do atto. Resta il fatto che i distributori vanno avvisati prima, non a cose fatte. Come pensa di procedere?"
    goals: [objection]
    recast: {text: "prendere un rischio", fix: "correre un rischio", tags: [word-choice]}
    new: [{lemma: dare atto, gloss: to give credit, acknowledge}, {lemma: a cose fatte, gloss: after the fact}]
  - learner: "Proporrei tre passi. Primo, un incontro con i cinque distributori principali entro fine mese, per spiegare il progetto prima che lo sappiano da altri. Secondo, un preventivo definitivo per la piattaforma. Terzo, torno da Lei tra un mese con le loro reazioni e una scadenza per il lancio."
  - tutor: "Mi sta bene. Agli incontri con i distributori voglio esserci anch'io, almeno ai primi due: certe notizie è meglio darle guardandosi in faccia. Tra un mese, stessa stanza. E porti il preventivo vero, non quello dei sogni."
    goals: [next-steps]

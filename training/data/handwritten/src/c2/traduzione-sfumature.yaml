- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, eh, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Lo temevo. Il problema è la voce della narratrice: in inglese è secca, quasi sgarbata, con frasi di quattro parole. In italiano, se la lascio così, sembra un telegramma; se la allungo, diventa una signora gentile che non è."
  - tutor: "Ecco, tu ne hai fatto una signora gentile, con tanto di centrino sul tavolo. Prendiamo la frase d'apertura, quella sulla madre. Dimmi le due rese che hai considerato, e non barare: voglio anche quella che hai scartato."
    goals: [problem]
    new: [{lemma: centrino, gloss: doily}, {lemma: barare, gloss: to cheat}, {lemma: scartare, gloss: to discard}]
  - learner: "L'originale dice, più o meno, che la madre non era il tipo da abbracci. Io ho messo «mia madre non amava le effusioni». L'alternativa era «mia madre non era una da abbracci», più fedele al tono ma forse troppo parlata per la pagina."
  - tutor: "«Non amava le effusioni» è corretto, elegante e morto. «Non era una da abbracci» invece respira, ed è italiano vero, non parlato sciatto. La tua paura del registro basso ti frega. Più avanti, poi, c'è un «eventualmente» che mi ha fatto saltare sulla sedia: me lo spieghi?"
    goals: [options]
    new: [{lemma: sciatto, gloss: sloppy}, {lemma: effusione, gloss: display of affection}, {lemma: fregare, gloss: "to trick, to do someone in (colloquial)"}]
  - learner: "Ah, quello. L'inglese dice che «eventually» lei lo perdonò, e io ho scritto «eventualmente lo perdonò». Riletto adesso, è un falso amico da manuale: in italiano vuol dire «nel caso», non «alla fine». Dovevo accorgermene prima di consegnartelo."
  - tutor: "Da manuale, appunto, ma almeno te ne accorgi da solo, il che ti salva dalla gogna. «Alla fine lo perdonò», e amen. Resta il nodo vero: tutta la bozza va riscritta nel registro di «una da abbracci», o salviamo qualcosa della tua versione elegante?"
    goals: [false-friend]
    new: [{lemma: gogna, gloss: pillory}]
  - learner: "Io riscriverei tutto nel registro secco. Se avrei avuto più coraggio dall'inizio, non saremmo qui a discuterne. La narratrice è una che taglia corto, e il lettore italiano deve sentirlo dalla prima riga."
    errors: [hypothetical]
  - tutor: "Sulla sostanza sono d'accordo, e mi fa piacere sentirtelo dire. Sulla forma, però, da un traduttore non lo accetto: «Se avrei avuto più coraggio»? Rileggiti la frase come se fosse di un altro."
    prompt: {text: "Se avrei avuto più coraggio", tags: [hypothetical]}
  - learner: "Se avessi avuto più coraggio, chiedo scusa. Deformazione da nipote di emigrati: a casa il periodo ipotetico era un optional."
  - tutor: "Perdonato, e «un optional» detto da te fa quasi tenerezza. Allora è deciso: registro secco dall'inizio alla fine, perché è la voce a fare il libro, non la bella frase. Rimandami il capitolo entro venerdì, e stavolta lascia il centrino nel cassetto."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, eh, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Ahi. Però lasciami difendere: in quel capitolo c'è un gioco di parole impossibile. Il protagonista dice che la suocera è «a pain in the neck» proprio mentre lei gli sta massaggiando il collo. In italiano il collo sparisce, e con lui la battuta."
  - tutor: "Ah, la suocera che fa i massaggi: l'autore si diverte e noi sudiamo. Hai ragione, è un bel grattacapo, e almeno stavolta il problema è vero. Sentiamo come te la sei cavata: che soluzioni hai sul tavolo?"
    goals: [problem]
    new: [{lemma: grattacapo, gloss: "headache, tricky problem"}, {lemma: cavarsela, gloss: to manage, to get by}, {lemma: suocera, gloss: mother-in-law}]
  - learner: "Ne ho due. La prima è «una spina nel fianco», e allora sposto il massaggio dal collo al fianco, ma mi sembra una forzatura. La seconda è «mi sta col fiato sul collo», che conserva il collo ma cambia un po' il senso, dal fastidio alla pressione."
  - tutor: "«Col fiato sul collo» è una trovata, lo ammetto a denti stretti. Cambia la sfumatura, ma la scena fisica resta intatta e la battuta scatta. La spina nel fianco, invece, obbliga a riscrivere mezzo paragrafo. E nella nota a margine, che cosa volevi dire con «la prima versione non ha avuto esito»?"
    goals: [options]
    new: [{lemma: a denti stretti, gloss: grudgingly}, {lemma: trovata, gloss: "clever idea, brainwave"}, {lemma: stare col fiato sul collo, gloss: to breathe down someone's neck}]
  - learner: "Volevo dire che alla redattrice non è piaciuta. Ah, ho capito: «esito» in italiano è solo il risultato, buono o cattivo, mentre in spagnolo «éxito» è il successo. È un falso amico che conosco da anni e ci casco ancora."
  - tutor: "Ci caschiamo tutti: io una volta ho tradotto «library» con «libreria» e me lo ricordano ancora alle cene aziendali. L'importante è che in bozza non ne resti traccia. Torniamo alla suocera. Se il lettore non coglie il doppio senso, tu che fai?"
    goals: [false-friend]
  - learner: "Niente note a piè di pagina, per carità. Al lettore non voglio spiegare niente: se io se lo spiego, il doppio senso muore."
    errors: [combined-pronouns]
  - tutor: "Sul principio hai ragione da vendere: una battuta spiegata è una battuta sepolta. Ma «se io se lo spiego»? Al lettore, terza persona: quel pronome doppio in italiano prende un'altra forma, e lo spagnolo qui ti tradisce."
    prompt: {text: "se io se lo spiego", tags: [combined-pronouns]}
    new: [{lemma: avere ragione da vendere, gloss: to be absolutely right}]
  - learner: "Giusto, il pronome... Se io le lo spiego? No, suona malissimo. Mi arrendo, con questi pronomi combinati perdo sempre."
    errors: [combined-pronouns]
  - tutor: "Quasi. Se glielo spiego, il doppio senso muore: «glielo» vale per lui, per lei e per loro, comodissimo. Chiuso l'incidente. Allora decidiamo: fiato sul collo o spina nel fianco, e dimmi perché, come se dovessi convincere l'autore."
    recast: {text: "Se io le lo spiego", fix: "Se glielo spiego", tags: [combined-pronouns]}
  - learner: "Fiato sul collo, senza dubbio. Conserva l'immagine fisica della scena, che è ciò che fa ridere, e il lettore italiano la riconosce subito come sua. Perdiamo un po' di fastidio e guadagniamo una battuta viva: mi sembra uno scambio onesto."
  - tutor: "Uno scambio onesto: è la definizione migliore di traduzione che abbia sentito questa settimana, e siamo solo a martedì. Vada per il fiato sul collo. Sistemami il paragrafo e passa pure al quarto capitolo, che lì di suocere non ce ne sono."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-professional
  history: [false-friend, subjunctive-use]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, eh, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Lo so, e ti dico subito dove ho tradito. La domestica parla in dialetto dello Yorkshire, e l'autore lo scrive sulla pagina, con le parole storte. Io l'ho fatta parlare in italiano pulito, perché ogni alternativa mi sembrava peggiore."
  - tutor: "Almeno confessi senza tortura. Il dialetto in traduzione è la bestia nera di tutti: se la fai parlare in romanesco, lo Yorkshire diventa Trastevere e il lettore ride nel punto sbagliato. Ma l'italiano pulito la cancella. Che alternative avevi pesato?"
    goals: [problem]
    new: [{lemma: bestia nera, gloss: "bugbear, pet hate"}, {lemma: romanesco, gloss: Roman dialect}]
  - learner: "Due. Una era un italiano popolare senza regione: «ci ho detto», «a me mi», qualche «mica». L'altra era lasciarla corretta e far dire al narratore che aveva un accento forte. Attualmente, la prima mi piaceva di più fin dall'inizio, ma temevo che sembrasse una caricatura."
    errors: [false-friend]
  - tutor: "Quindi, in realtà, la prima ti piaceva di più fin dall'inizio: e avevi ragione. Nota che «attualmente» vuol dire «in questo periodo», non «a dire il vero». A proposito di trappole, nel dialogo col padrone c'è un «sei molto educata» che non mi torna."
    goals: [options]
    recast: {text: "Attualmente", fix: "in realtà", tags: [false-friend]}
  - learner: "Lì l'originale è «you're very educated», detto con disprezzo a una domestica che legge troppo. «Educata» in italiano fa pensare alle buone maniere, quindi è un calco. Penso che «istruita» è la resa giusta, anche se suona un po' antica."
    errors: [subjunctive-use]
  - tutor: "Diagnosi perfetta: «educata» è un falso amico coi fiocchi, e «istruita» ha proprio quel sapore antico che serve. Peccato per la frase con cui me lo dici: «Penso che... è»? Sistemala, che poi andiamo avanti."
    goals: [false-friend]
    prompt: {text: "Penso che «istruita» è", tags: [subjunctive-use]}
    new: [{lemma: coi fiocchi, gloss: "first-rate, textbook"}]
  - learner: "Penso che «istruita» sia la resa giusta. E che il padrone, dicendolo, debba suonare sprezzante, non gentile."
  - tutor: "Così va meglio, e sì: lui la sta mettendo al suo posto, mica le fa un complimento. Resta da chiudere la questione grossa. Sulla domestica che cosa decidiamo, e come lo giustifichi se l'editore storce il naso?"
    new: [{lemma: storcere il naso, gloss: to turn up one's nose}]
  - learner: "Italiano popolare senza regione, dosato con attenzione. All'editore direi che il lettore deve sentire la distanza sociale tra lei e i padroni, perché tutto il romanzo si regge su quella. Se la facessimo parlare come un notaio, la perderemmo."
  - tutor: "«Come un notaio»: esattamente quello che avevi fatto, e adesso lo dici tu. Bene, allora: popolare ma senza cartolina regionale, e con pochi segnali, perché il troppo stroppia. Riscrivi le sue battute e fammele leggere ad alta voce domani."
    goals: [decide]
    new: [{lemma: il troppo stroppia, gloss: "too much of anything spoils it (proverb)"}]

- scenario: traduzione-sfumature
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, eh, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Può darsi, ma in quel capitolo l'autore è difficile da seguire. C'è la scena del funerale, dove il figlio dice del padre: «He was not an easy man». È un eufemismo enorme, tipicamente inglese, e in italiano rischia di passare per una frase qualunque."
  - tutor: "L'arte inglese di dire poco, croce e delizia di chi traduce. Loro dicono «non era un uomo facile» e intendono un tiranno; noi, per dire lo stesso, alziamo la voce. Tu hai scritto «aveva un carattere difficile», che è acqua fresca. Che altro avevi in mente?"
    goals: [problem]
    new: [{lemma: croce e delizia, gloss: both a torment and a delight}, {lemma: acqua fresca, gloss: "something bland, with no effect"}, {lemma: tiranno, gloss: tyrant}]
  - learner: "Ho pensato molto in questa frase. Una possibilità è restare letterali, «non era un uomo facile», e fidarsi del contesto. L'altra è spingere un po': «con lui non era vita», che in italiano si dice davvero ma è molto più esplicito."
    errors: [preposition]
  - tutor: "Le due strade sono quelle giuste, e ci arrivo subito. Ma prima: «ho pensato molto in questa frase»? Lo spagnolo ti tira per la giacca. In italiano quel verbo vuole un'altra preposizione."
    prompt: {text: "pensato molto in questa frase", tags: [preposition]}
    new: [{lemma: tirare per la giacca, gloss: to tug at someone's sleeve, to pull them one's way}]
  - learner: "A questa frase, vero. Ho pensato molto a questa frase, e più ci penso più mi convince la versione letterale."
  - tutor: "Ecco. E mi incuriosisce che ti convinca la letterale, perché di solito sei tu quello che abbellisce. Occhio però al seguito: due righe dopo hai scritto che il figlio «realizza» di non aver mai pianto. Ti sembra italiano, quello?"
    goals: [options]
    new: [{lemma: abbellire, gloss: to embellish}]
  - learner: "No, è un calco di «realize», e in spagnolo abbiamo lo stesso problema con «realizar». In italiano «realizzare» è portare a termine un progetto; qui ci vuole «si rende conto» o, meglio ancora, «si accorge», che è più breve e più triste."
  - tutor: "«Più breve e più triste»: adesso ragioni da traduttore. I dizionari ormai quel calco lo registrano, ma in un funerale di provincia stona. «Si accorge», dunque. Torniamo al padre e chiudiamo: letterale o esplicita, e convincimi."
    goals: [false-friend]
    new: [{lemma: stonare, gloss: "to be out of tune, to jar"}]
  - learner: "Letterale. Il figlio è inglese fino al midollo: se dicesse «con lui non era vita», piangerebbe già, e invece la scena funziona perché lui non piange. Il lettore capisce il tiranno dal resto del capitolo. Meglio dire poco e lasciare che il silenzio faccia il lavoro."
  - tutor: "Mi hai convinto, e non lo dico volentieri. «Non era un uomo facile», punto: chi ha orecchie per intendere, intenda. Lascia così, correggi quel verbo e non toccare altro, che quando una cosa ti viene bene poi esageri."
    goals: [decide]

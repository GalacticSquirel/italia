- scenario: vita-in-italia
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno, e grazie dell'invito. Attualmente, non l'ho scelta: mi ha scelta lei. Ero venuta a Bologna per un master di sei mesi, undici anni fa. Poi ho trovato un lavoro, poi un compagno, e a un certo punto mi sono accorta che il biglietto di ritorno era scaduto da un pezzo."
    errors: [false-friend]
  - tutor: "In realtà, dunque, è stata l'Italia a scegliere lei: è una storia che sentiamo spesso, e ogni volta è diversa. Undici anni non sono uno scherzo. Lasci stare la cartolina: qual è stata la cosa più dura, quella che non racconta ai parenti?"
    goals: [story]
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
  - learner: "La burocrazia, direbbero tutti, ma non è quella. La cosa più dura è stata non far ridere nessuno. Nella mia lingua ero una persona spiritosa; in italiano, per anni, sono stata soltanto gentile. Finché non capisci le battute degli altri e non sai farne di tue, resti un'ospite."
  - tutor: "È una delle risposte più belle che abbia sentito a questo microfono. L'umorismo è l'ultima frontiera di una lingua, e la più sorvegliata. E oggi che le battute le fa, si sente un'altra persona? In che cosa l'ha cambiata, questo paese?"
    goals: [difficulties]
    new: [{lemma: battuta, gloss: joke, quip}, {lemma: umorismo, gloss: humour}]
  - learner: "Mi ha cambiata più di quanto ammetta volentieri. Penso che l'Italia mi ha insegnato a perdere tempo bene: a fermarmi a parlare, a non mangiare davanti al computer. In compenso ho perso la puntualità, e mia madre non me lo perdona."
    errors: [subjunctive-use]
  - tutor: "«Perdere tempo bene»: la rubo per il titolo della puntata. Solo un appunto, e con lei me lo posso permettere: «penso che l'Italia mi ha insegnato»? Dopo «penso che» quell'ausiliare chiede un altro modo. Come lo corregge?"
    prompt: {text: "Penso che l'Italia mi ha insegnato", tags: [subjunctive-use]}
    new: [{lemma: puntata, gloss: episode}]
  - learner: "Me lo merito, dopo undici anni! Penso che l'Italia mi abbia insegnato a perdere tempo bene."
  - tutor: "Ecco fatto, e sua madre si consoli: ha perso una figlia puntuale ma ne ha trovata una che sa stare a tavola. Chiudiamo con un consiglio. Tra chi ci ascolta c'è sicuramente qualcuno con la valigia pronta: che cosa gli direbbe?"
    goals: [change]
  - learner: "Gli direi di non venire per la cartolina, perché la cartolina dura un mese. Di imparare la lingua sul serio, dialetto compreso, se serve. E di avere pazienza con gli uffici e curiosità con le persone: qui le porte non si aprono con i moduli, si aprono con le chiacchiere."
  - tutor: "«Le porte si aprono con le chiacchiere»: più chiaro di così si muore. Grazie di cuore per essere stata con noi, e per averci fatto guardare il nostro paese con occhi nuovi. A voi che ascoltate, buon proseguimento: torniamo dopo la musica."
    goals: [advice]
    new: [{lemma: più chiaro di così si muore, gloss: "it couldn't be clearer"}, {lemma: chiacchiera, gloss: chat, small talk}]

- scenario: vita-in-italia
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno, grazie. Nel mio caso la scelta l'aveva fatta mio nonno al contrario: partì da un paese della Sila nel 1955 e non tornò più. Io ho cresciuto nel New Jersey sentendo parlare di quel paese come di un posto magico, e a quarant'anni ho voluto vedere se esisteva davvero."
    errors: [auxiliary-choice]
  - tutor: "Una migrazione al contrario, che bella storia. E quel «partì», «tornò»: si sente il Sud, dove il passato remoto è ancora vivo e vegeto. Un piccolo inciampo, però: «ho cresciuto nel New Jersey»? Con quel verbo, quando si parla di sé, l'ausiliare è un altro. Quale?"
    goals: [story]
    prompt: {text: "ho cresciuto", tags: [auxiliary-choice]}
    new: [{lemma: vivo e vegeto, gloss: alive and kicking}, {lemma: inciampo, gloss: stumble}, {lemma: passato remoto, gloss: "simple past (everyday in the South, literary in the North)"}]
  - learner: "Sono cresciuto, è vero: ho cresciuto i miei figli, ma io sono cresciuto nel New Jersey. A casa nostra la grammatica era un misto di calabrese e inglese."
  - tutor: "Distinzione perfetta, da manuale. E il paese magico, alla prova dei fatti, com'era? Mi dica la verità: qual è stata la difficoltà più grande, una volta finito l'incanto?"
    new: [{lemma: incanto, gloss: enchantment, spell}]
  - learner: "Scoprire che parlavo una lingua che non esiste più. Il dialetto di mio nonno era fermo al 1955: usavo parole che in paese facevano sorridere i vecchi e ridere i giovani. Per loro ero «l'americano», per gli americani ero sempre stato «l'italiano». Non ero di casa da nessuna parte."
  - tutor: "Né carne né pesce, come si dice: è una condizione che molti figli di emigrati conoscono. Però è rimasto, e sono passati sei anni. In che cosa è diverso, oggi, dall'uomo che è sceso da quell'aereo?"
    goals: [difficulties]
    new: [{lemma: né carne né pesce, gloss: neither fish nor fowl}, {lemma: emigrato, gloss: emigrant}]
  - learner: "Sono più lento, e lo dico come un complimento. Ho imparato l'italiano vero passando i pomeriggi nella libreria comunale, a leggere i giornali con i pensionati. E ho smesso di voler aggiustare tutto: prima vedevo solo quello che non funzionava, adesso vedo anche perché la gente resta."
    errors: [false-friend]
  - tutor: "I pomeriggi nella biblioteca comunale con i pensionati valgono più di un corso all'università, glielo garantisco. E «vedo perché la gente resta» è una frase che dovrebbero sentire in molti. Per finire: a chi sogna di tornare al paese dei nonni, che consiglio darebbe?"
    goals: [change]
    recast: {text: "libreria comunale", fix: "biblioteca comunale", tags: [false-friend]}
  - learner: "Di venire prima per un inverno, non per un'estate. D'estate il paese è una festa; a febbraio, con il bar chiuso alle otto, capisci se ci puoi vivere. E di non aspettarsi il paese dei racconti: quello è rimasto in America, nella memoria dei nonni. Quello vero è più povero, ma ti risponde."
  - tutor: "«Venite d'inverno»: un consiglio che vale oro, e che nessuna agenzia vi darà mai. Grazie per questa testimonianza: suo nonno, ne sono certo, ne sarebbe fiero. E ai nostri ascoltatori ricordo il proverbio: paese che vai, usanza che trovi, ma solo se ci resti abbastanza."
    goals: [advice]
    new: [{lemma: "paese che vai, usanza che trovi", gloss: "when in Rome, do as the Romans do"}, {lemma: valere oro, gloss: to be worth its weight in gold}]

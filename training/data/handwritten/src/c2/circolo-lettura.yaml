- scenario: circolo-lettura
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Insopportabile no, però ammetto che a tratti mi ha fatto perdere la pazienza. Nel complesso l'ho trovato un romanzo luminoso, e molto più malinconico di quanto mi aspettassi."
  - tutor: "Malinconico, addirittura! E io che lo davo ai ragazzi delle medie come una favola allegra. Dimmi allora dove sta, secondo te, questa malinconia: in quale pagina l'hai sentita mordere?"
    goals: [impression]
  - learner: "Nel finale, quando Cosimo ormai vecchio non scende nemmeno per morire. Per me il tema centrale è la distanza: bisogna allontanarsi dagli altri per vederli bene, ma questa distanza si paga con la solitudine."
  - tutor: "Bella lettura, e il finale con la mongolfiera ti dà ragione: neanche da morto tocca terra. Però non montarti la testa, adesso ti metto alla prova. Con che voce Calvino ci racconta tutto questo, visto che Cosimo non parla mai in prima persona?"
    goals: [theme]
    new: [{lemma: mongolfiera, gloss: hot-air balloon}, {lemma: montarsi la testa, gloss: to get big-headed}]
  - learner: "Con la voce del fratello, Biagio, che è rimasto a terra. Credo che l'ironia nasce proprio da lì: un narratore prudente che racconta un fratello eccessivo."
    errors: [subjunctive-use]
  - tutor: "L'idea è acuta, ma una cosa mi fa alzare il sopracciglio: «credo che l'ironia nasce»? Dopo un verbo di opinione, da te mi aspetto di meglio. Riprova."
    prompt: {text: "Credo che l'ironia nasce", tags: [subjunctive-use]}
  - learner: "Hai ragione, mi è scappato: credo che l'ironia nasca da quel narratore prudente, quasi invidioso."
  - tutor: "Ecco, così va bene. «Quasi invidioso», dici, e qui casca l'asino: per me Biagio non invidia affatto. È il vero saggio del libro, e Cosimo è solo un ragazzo viziato che non ha mai saputo chiedere scusa per un piatto di lumache."
    goals: [style]
    new: [{lemma: qui casca l'asino, gloss: "that's the tricky point"}, {lemma: viziato, gloss: spoilt}]
  - learner: "Su questo non sono d'accordo, e non voglio aprire un argomento, ma un ragazzo viziato non passa la vita a spegnere incendi e a scrivere a Diderot. Biagio è saggio solo perché non rischia niente."
    errors: [false-friend]
  - tutor: "Tranquilla, qui si può aprire una polemica a ogni bicchiere: siamo venuti apposta. E devo ammettere che gli incendi e Diderot pesano. Mi hai quasi convinto, il che non mi capita spesso. Visto che sei in vena, che cosa ci fai leggere il mese prossimo?"
    goals: [disagree]
    recast: {text: "aprire un argomento", fix: "aprire una polemica", tags: [false-friend]}
    new: [{lemma: polemica, gloss: argument, controversy}]
  - learner: "Proporrei «Lessico famigliare» di Natalia Ginzburg. Dopo un ribelle che scappa dalla famiglia, mi piacerebbe un libro in cui la famiglia è tutto, e in cui l'ironia passa dalle parole di casa."
  - tutor: "Ottima scelta, e il contrasto è perfetto: dagli alberi di Ombrosa al tavolo da pranzo dei Levi. Approvato, lo leggiamo. E adesso versami un altro po' di vino, che la polemica mette sete."
    goals: [recommend]

- scenario: circolo-lettura
  level: C2
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Macché insopportabile! A me Cosimo ha fatto una simpatia enorme. È il primo romanzo italiano che leggo ridendo da solo sul tram, e da un classico non me l'aspettavo."
  - tutor: "Ridere sul tram con Calvino: a Roma ti avranno preso per matto, ma per un matto di buon gusto. Però le risate non mi bastano. Sotto la favola c'è un'allegoria, e voglio sapere quale ci hai visto tu."
    goals: [impression]
  - learner: "Io ci vedo la ribellione che diventa disciplina. Cosimo sale sull'albero per non mangiare le lumache, ma poi si dà regole più dure di quelle del padre, e se Cosimo sarebbe sceso dopo una settimana, sarebbe stato solo un bambino offeso."
    errors: [hypothetical]
  - tutor: "La ribellione che si fa disciplina: mi piace, e l'esempio delle lumache è quello giusto. Ma fermati un secondo su «se Cosimo sarebbe sceso». Dopo quel «se», in italiano, il condizionale non ci può stare: come lo diresti?"
    goals: [theme]
    prompt: {text: "se Cosimo sarebbe sceso", tags: [hypothetical]}
  - learner: "Eh, lo so che c'è qualcosa che non va, ma mi viene sempre così: se Cosimo sarebbe sceso subito, il romanzo non esisterebbe."
    errors: [hypothetical]
  - tutor: "Capita ai migliori. Se Cosimo fosse sceso subito, non avremmo né il romanzo né questa serata: congiuntivo dopo il «se», condizionale dall'altra parte. Torniamo al libro. Calvino racconta cose enormi con una leggerezza quasi sfacciata: tu come te la spieghi, questa ironia?"
    recast: {text: "se Cosimo sarebbe sceso", fix: "Se Cosimo fosse sceso", tags: [hypothetical]}
    new: [{lemma: sfacciato, gloss: cheeky, brazen}]
  - learner: "Per me l'ironia è una forma di pudore. Il narratore dice le cose più tristi, come la morte del brigante che leggeva romanzi, con un mezzo sorriso, e così il lettore non si sente mai ricattato."
  - tutor: "«Pudore» è la parola esatta, e Gian dei Brughi impiccato col libro a metà è l'esempio perfetto. Ora però ti provoco. Io dico che tutta questa leggerezza è una fuga: Calvino, come Cosimo, guarda il mondo dall'alto per non sporcarsi le mani."
    goals: [style]
    new: [{lemma: pudore, gloss: modesty, reserve}, {lemma: impiccare, gloss: to hang}]
  - learner: "No, qui non ti seguo. Dall'albero Cosimo organizza i contadini, combatte i pirati, aiuta tutti: si sporca le mani eccome. La distanza gli serve per vedere meglio, non per scappare. Chi sta troppo vicino alle cose non le capisce."
  - tutor: "Colpito e affondato. Hai difeso Cosimo meglio di quanto lui abbia mai difeso sé stesso. Prima che finisca il vino, tocca a te: che cosa leggiamo la prossima volta?"
    goals: [disagree]
  - learner: "Io direi «Il giorno della civetta» di Sciascia. È breve, è un giallo che non consola nessuno, e dopo tanta leggerezza ci farebbe bene un po' di Sicilia amara."
  - tutor: "Dalla Liguria degli alberi alla Sicilia del silenzio: mi piace, e Sciascia non fa sconti a nessuno. Deciso, allora. E complimenti: stasera mi hai tenuto testa senza battere ciglio."
    goals: [recommend]
    new: [{lemma: tenere testa, gloss: to stand up to someone}, {lemma: senza battere ciglio, gloss: without batting an eyelid}]

- scenario: circolo-lettura
  level: C2
  persona: en-m-retired
  history: [word-choice, relative-pronoun]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Eccomi, colpevole. Insopportabile lui e, a dirla tutta, un po' anche il romanzo. L'ho finito per dovere: troppa favola, troppi alberi, e alla lunga mi sono annoiato."
  - tutor: "Finalmente uno che non ha peli sulla lingua! Daje, come dicono qui a Roma: sfogati pure. Però un lettore annoiato mi deve almeno una spiegazione seria. Di che cosa parla davvero il libro, secondo te, sotto tutti quegli alberi?"
    goals: [impression]
    new: [{lemma: non avere peli sulla lingua, gloss: to speak one's mind bluntly}, {lemma: daje, gloss: "come on! (Roman dialect)"}, {lemma: sfogarsi, gloss: to let off steam}]
  - learner: "Parla di un uomo che ha fatto una decisione a dodici anni e non ha più avuto il coraggio di cambiarla. La scena con Viola lo dimostra: lei gli chiede di cedere almeno una volta, e lui preferisce perderla."
    errors: [word-choice]
  - tutor: "Ecco una tesi con i denti. Cosimo ha preso una decisione a dodici anni e ne è rimasto prigioniero: lettura dura, ma la scena di Viola la regge bene. Ti concedo il tema. Sullo stile, però, mica vorrai dirmi che anche l'ironia di Calvino ti ha annoiato?"
    goals: [theme]
    recast: {text: "ha fatto una decisione", fix: "ha preso una decisione", tags: [word-choice]}
    new: [{lemma: mica, gloss: "surely not, not at all (colloquial)"}]
  - learner: "No, lì mi arrendo. Lo stile è l'unica ragione che ho continuato a leggere. C'è una frase, verso la fine, dove il narratore dice che Ombrosa non c'è più, e la butta lì quasi per caso, senza alzare la voce."
    errors: [relative-pronoun]
  - tutor: "Vedi che sotto la scorza c'è un lettore fine. Però ascoltati: «l'unica ragione che ho continuato»? Tra «ragione» e il verbo manca qualcosa: quel «che» da solo non basta."
    prompt: {text: "l'unica ragione che ho continuato", tags: [relative-pronoun]}
    new: [{lemma: scorza, gloss: "rind; tough exterior"}]
  - learner: "L'unica ragione per cui ho continuato a leggere, giusto. E quella frase su Ombrosa me la sono perfino copiata su un quaderno."
  - tutor: "Per cui, appunto. E se ti copi le frasi, tanto annoiato non eri. Adesso ti provoco io: secondo me Viola ha torto marcio. È capricciosa e crudele, e Cosimo fa benissimo a non scendere per lei."
    goals: [style]
    new: [{lemma: avere torto marcio, gloss: to be completely in the wrong}, {lemma: capriccioso, gloss: capricious}]
  - learner: "Qui ti fermo subito. Viola è l'unico personaggio che gli parla da pari a pari. Non è crudele: gli chiede soltanto una prova d'amore, una sola. È lui che confonde la coerenza con l'orgoglio."
  - tutor: "Da pari a pari: questa te la rubo per la prossima lezione, se mai tornassi a insegnare. Va bene, su Viola hai vinto tu. Ora, visto che Calvino ti ha stancato, scegli tu il prossimo libro e dimmi perché."
    goals: [disagree]
  - learner: "Propongo «Il Gattopardo». Niente favole: un uomo vero, un mondo che finisce davvero, e una malinconia che non ha bisogno di salire sugli alberi."
  - tutor: "Dal barone al principe: restiamo tra nobili, ma cambiamo aria. Accolgo la proposta, anche perché a Tomasi di Lampedusa non si dice di no. E grazie della franchezza: un circolo dove tutti sono d'accordo è una noia mortale."
    goals: [recommend]

- scenario: circolo-lettura
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io lo confesso a metà: insopportabile da adulto, irresistibile da ragazzo. Il romanzo mi ha conquistata nelle prime cinquanta pagine e poi mi ha fatto un po' soffrire, ma l'ho chiuso con gli occhi lucidi."
  - tutor: "Gli occhi lucidi per un barone sugli alberi: Calvino sarebbe contento, lui che fingeva sempre di non voler commuovere nessuno. Ma parlami di questa sofferenza. Che cosa succede, dopo quelle cinquanta pagine, che ti ha messa in difficoltà?"
    goals: [impression]
  - learner: "Succede che la libertà di Cosimo diventa solitudine. Penso al cane, Ottimo Massimo, che alla fine se ne va con Viola: perfino il cane sceglie la terra. Per me il tema è il prezzo della libertà, e Calvino ne parla senza farci mai la predica."
  - tutor: "Il cane che sceglie la terra: non ci avevo mai pensato, e sono quarant'anni che rileggo questo libro. Brava. «Senza farci la predica», dici. Spiegami allora come ci riesce, tecnicamente: dove sta il trucco dello stile?"
    goals: [theme]
    new: [{lemma: fare la predica, gloss: to lecture, to preach at someone}]
  - learner: "Il trucco è il passato remoto, credo. «Salì», «disse», «non scese più»: sembra una cronaca antica. A Madrid quel tempo lo usiamo tutti i giorni, qui a Roma quasi nessuno: ne penso spesso, a questa differenza."
    errors: [ci-ne]
  - tutor: "Osservazione da linguista, e giustissima: quel tempo dà al racconto un'aria di leggenda. Però «ne penso spesso»? Si pensa a qualcosa, non di qualcosa: la particella giusta è un'altra."
    prompt: {text: "ne penso spesso", tags: [ci-ne]}
  - learner: "Ci penso spesso, certo! E ci penso anche perché al Sud, mi dicono, il passato remoto si usa ancora quando si parla."
  - tutor: "Proprio così: in Sicilia o in Calabria senti «andai» per ieri, mentre a Milano ti guarderebbero come un personaggio di Manzoni. Ora però litighiamo un po'. Io sostengo che il libro è un'allegoria politica e basta: l'intellettuale che guarda la storia dall'alto e non conta niente."
    goals: [style]
  - learner: "E basta? No, mi dispiace, è una lettura troppo stretta. Se fosse solo politica, non ci sarebbero Viola, il brigante lettore, il fratello che racconta. Io credo che sia prima di tutto un romanzo sul diventare sé stessi, e che la politica venga dopo."
  - tutor: "«Troppo stretta», mi dici, a me! Però l'obiezione del brigante lettore è difficile da smontare, e me la tengo. Hai la stoffa per le discussioni. Chiudiamo in bellezza: quale libro proponi per il mese prossimo?"
    goals: [disagree]
    new: [{lemma: avere la stoffa, gloss: to have what it takes}, {lemma: smontare, gloss: "to take apart, to refute"}]
  - learner: "Vorrei che leggessimo «Le città invisibili». Così restiamo con Calvino, ma cambiamo completamente forma: niente trama, solo immagini, e vediamo se la leggerezza regge anche senza una storia."
  - tutor: "Sfida accettata: vedremo se Marco Polo ci annoia o ci incanta. Mi piace che tu voglia mettere alla prova la leggerezza invece di darla per buona. A fra un mese, allora, e porta i tuoi appunti sul passato remoto."
    goals: [recommend]

- scenario: film-libro
  level: C2
  persona: en-m-retired
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, se permettete. Ho finalmente letto «Il Gattopardo», che rimandavo da anni. Senza svelare troppo: è la storia di un principe siciliano che, all'arrivo di Garibaldi, guarda il suo mondo tramontare e decide di non muovere un dito."
    - tutor: "«Rimandavo da anni»: come tutti, me compreso, e poi ci si mangia le mani. L'hai riassunto meglio della quarta di copertina. Ma dimmi di lui, del principe: che razza di uomo è uno che vede la nave affondare e resta a guardare le stelle?"
      goals: [summary]
      new: [{lemma: mangiarsi le mani, gloss: to kick oneself}, {lemma: quarta di copertina, gloss: back-cover blurb}, {lemma: affondare, gloss: to sink}]
    - learner: "È un uomo troppo intelligente per farsi illusioni e troppo stanco per combattere. Don Fabrizio capisce tutto prima degli altri, ma è come se la lucidità lo paralizzava: preferisce l'astronomia alla politica, perché le stelle almeno sono puntuali."
      errors: [subjunctive-use]
    - tutor: "«Le stelle almeno sono puntuali»: questa è degna del principe in persona. Però «come se la lucidità lo paralizzava» mi fa l'effetto di una stecca all'opera. Dopo «come se» ci vuole un congiuntivo, e tu lo sai. Quale?"
      prompt: {text: "come se la lucidità lo paralizzava", tags: [subjunctive-use]}
      new: [{lemma: stecca, gloss: false note}]
    - learner: "Lo so, lo so: come se la lucidità lo paralizzasse. Alla mia età la lingua va più svelta della grammatica."
    - tutor: "Alla tua età don Fabrizio aveva già smesso di lottare; tu invece ti correggi al volo, quindi sei messo meglio di lui. Ora però fuori il verdetto. È davvero il capolavoro che dicono, o è un monumento che si ammira sbadigliando?"
      goals: [characters]
      new: [{lemma: al volo, gloss: "instantly, on the fly"}, {lemma: sbadigliare, gloss: to yawn}, {lemma: capolavoro, gloss: masterpiece}]
    - learner: "Capolavoro, senza riserve. Mi aspettavo un romanzo storico e ho trovato un libro sulla morte, scritto con un'ironia che non fa sconti a nessuno, nemmeno al protagonista. E la pagina del ballo, da sola, vale il biglietto."
    - tutor: "Un libro sulla morte travestito da romanzo storico: sottoscrivo ogni parola. E pensare che due editori lo rifiutarono, e l'autore morì senza vederlo stampato. A chi lo metteresti in mano, e a chi no?"
      goals: [opinion]
      new: [{lemma: travestito, gloss: disguised}, {lemma: sottoscrivere, gloss: "to endorse, to agree fully"}]
    - learner: "Lo consiglierei a chi ha già una certa età, o almeno una certa pazienza: va letto piano, come si beve un passito. A un ragazzo di vent'anni direi di aspettare, a meno che non sia siciliano: in quel caso, prima lo legge e meglio è."
    - tutor: "Come un passito, a piccoli sorsi: te la rubo per la locandina del mese prossimo. E hai ragione sui siciliani: quel libro ce l'hanno nel sangue anche quando non l'hanno letto. Grazie, hai rotto il ghiaccio alla grande. Chi è il prossimo?"
      goals: [recommend]
      new: [{lemma: passito, gloss: sweet raisin wine}, {lemma: locandina, gloss: "poster, flyer"}, {lemma: rompere il ghiaccio, gloss: to break the ice}]

- scenario: film-libro
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io, io! Ho letto «La coscienza di Zeno». Niente anticipazioni, promesso: è un uomo di Trieste che, su consiglio del suo psicanalista, scrive la propria vita, a cominciare dal vizio del fumo. È un romanzo largo, ma non pesa."
      errors: [false-friend]
    - tutor: "Zeno, che bella scelta! E hai ragione: è un romanzo lungo, ma scivola via che è un piacere, forse perché chi racconta mente a ogni pagina. A proposito di lui: come lo descriveresti a chi non lo conosce?"
      goals: [summary]
      recast: {text: "un romanzo largo", fix: "un romanzo lungo", tags: [false-friend]}
    - learner: "Zeno è un bugiardo simpatico. Dice di essere malato, inetto, incapace di decidere, e intanto ottiene quasi sempre quello che vuole. Perfino con il dottore: questo gli chiede i suoi ricordi per curarlo, e Zeno se li consegna pieni di bugie."
      errors: [combined-pronouns]
    - tutor: "Un bugiardo simpatico: definizione perfetta. Ma senti qua: «se li consegna»? Quel «se» viene dritto dritto dallo spagnolo. In italiano, quando si dà qualcosa a lui, i due pronomi si saldano in una parola sola. Ci arrivi?"
      prompt: {text: "se li consegna", tags: [combined-pronouns]}
      new: [{lemma: saldare, gloss: "to weld, to fuse"}]
    - learner: "Uffa, sempre lì casco. Zeno glieli consegna pieni di bugie, e il povero dottore ci casca pure lui."
    - tutor: "Glieli consegna, brava. E il dottore si vendica pubblicandoli: è la trovata con cui si apre il libro, geniale. Adesso però voglio il tuo giudizio, senza peli sulla lingua: ti è piaciuto davvero o l'hai finito per dovere?"
      goals: [characters]
      new: [{lemma: non avere peli sulla lingua, gloss: to speak bluntly}, {lemma: trovata, gloss: "clever idea, device"}, {lemma: vendicarsi, gloss: to take revenge}]
    - learner: "Mi è piaciuto moltissimo, e non me l'aspettavo. Credevo che fosse un classico polveroso, e invece Zeno è modernissimo: si racconta storie per non cambiare, come facciamo tutti. E mi ha fatta ridere, cosa che dai classici non pretendo."
    - tutor: "«Si racconta storie per non cambiare»: l'hai capito meglio di tanti critici. E pensa che a Trieste, all'epoca, nessuno se lo filava, quel signore che scriveva in un italiano un po' zoppo. Ci volle un amico irlandese per accorgersene. A chi lo consiglieresti?"
      goals: [opinion]
      new: [{lemma: filarsi, gloss: to pay attention to (colloquial)}, {lemma: zoppo, gloss: "lame, limping"}]
    - learner: "A chiunque stia cercando di smettere di fumare, per cominciare! E poi a chi diffida dei classici. Non lo darei, forse, a chi vuole un eroe da ammirare: qui c'è solo un uomo che inciampa e la fa franca."
    - tutor: "Inciampa e la fa franca: metà dell'umanità, in pratica. Grazie, un intervento coi fiocchi. E se qualcuno stasera esce a fumare «l'ultima», sappiamo di chi è la colpa. Avanti il prossimo!"
      goals: [recommend]
      new: [{lemma: farla franca, gloss: to get away with it}, {lemma: coi fiocchi, gloss: "first-rate, excellent"}, {lemma: inciampare, gloss: to stumble}]

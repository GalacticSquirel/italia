- scenario: notizie-attualita
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "L'ho seguita, sì. In sostanza, la nuova legge mette un tetto agli affitti brevi nei centri storici: chi affitta più di due appartamenti deve registrarsi come impresa, e i Comuni possono limitare le notti all'anno. Un'idea me la sono fatta, ma è meno netta di quanto vorrei."
  - tutor: "Riassunto da agenzia di stampa, complimenti. Io invece resto freddo: mi pare la solita legge fatta per dare un colpo al cerchio e uno alla botte. Tu da che parte penderesti, se proprio dovessi sbilanciarti?"
    goals: [summarise]
    new: [{lemma: dare un colpo al cerchio e uno alla botte, gloss: to try to keep both sides happy}, {lemma: sbilanciarsi, gloss: to commit oneself}]
  - learner: "Penderei a favore, con riserva. È giusto che i centri storici non diventino dormitori per turisti, però temo che i piccoli proprietari paghino per i grandi. Eventualmente la legge funzionerà, ma solo dopo molti ricorsi."
    errors: [false-friend]
  - tutor: "Prima o poi la legge funzionerà, dici: sei più ottimista di me. Sui piccoli proprietari, però, ti do ragione. Hai notato come l'hanno raccontata i giornali? A leggere due testate diverse sembravano due leggi diverse."
    goals: [opinion]
    recast: {text: "Eventualmente", fix: "Prima o poi", tags: [false-friend]}
  - learner: "Altroché. Un quotidiano titolava «Stretta sugli affitti, vincono i residenti», un altro parlava di «esproprio mascherato». L'unico approfondimento serio l'ho trovato su un settimanale, che almeno riportava i numeri e citava le fonti invece di gridare."
  - tutor: "Ecco, appunto: i titoli gridati fanno vendere, i numeri fanno sbadigliare. Ognuno tira l'acqua al suo mulino, e il lettore si arrangi. Ma veniamo al sodo: secondo te, tra un anno, che cosa sarà cambiato davvero in città?"
    goals: [sources]
    new: [{lemma: tirare l'acqua al proprio mulino, gloss: to look after one's own interests}, {lemma: venire al sodo, gloss: to get to the point}]
  - learner: "Credo che qualche appartamento tornerà sul mercato degli affitti lunghi, ma meno di quanto sperano i sostenitori. Molti proprietari, piuttosto che affittare a studenti, preferiranno tenere la casa vuota. E non mi stupirei se fiorisse un bel mercato nero."
  - tutor: "Fatta la legge, trovato l'inganno: su questo siamo un popolo di artisti. E gli albergatori, che oggi brindano? Pensi che abbasseranno i prezzi o che ne approfitteranno?"
    goals: [consequences]
    new: [{lemma: "fatta la legge, trovato l'inganno", gloss: every law has its loophole}, {lemma: albergatore, gloss: hotelier}]
  - learner: "Ne approfitteranno, temo, almeno finché la domanda regge. Se fossi il sindaco, userei la tassa di soggiorno per finanziare case a canone agevolato. Ma mi rendo conto che è più facile dirlo davanti a un caffè che farlo."
  - tutor: "Tra il dire e il fare c'è di mezzo il mare, e in questo caso anche un paio di assessori. Comunque hai le idee più chiare di tanti editorialisti. Ora scappo, che la riunione delle dieci non aspetta: ne riparliamo a pranzo."
    new: [{lemma: tra il dire e il fare c'è di mezzo il mare, gloss: easier said than done}, {lemma: assessore, gloss: city councillor}]

- scenario: notizie-attualita
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Me la sono fatta, eccome, anche se un po' confusa. Da quello che ho capito, il governo ha approvato una legge che obbliga chi fa affitti brevi ad avere un codice identificativo e vieta i soggiorni di una sola notte nelle grandi città. Il resto è polemica."
  - tutor: "«Il resto è polemica»: potresti scrivere i titoli in redazione. Io però non mi fido: quando una legge mette d'accordo tutti i telegiornali, di solito c'è sotto qualcosa. A te convince, o ti sembra fumo negli occhi?"
    goals: [summarise]
    new: [{lemma: fumo negli occhi, gloss: smoke and mirrors}, {lemma: redazione, gloss: newsroom}]
  - learner: "Fumo negli occhi no, ma nemmeno una rivoluzione. Mi sembra che la legge è timida: regola la forma degli affitti brevi senza toccare il vero problema, cioè che in centro non ci sono più case per chi ci lavora."
    errors: [subjunctive-use]
  - tutor: "Sul contenuto ci arriviamo subito, ma prima una cosa: «mi sembra che la legge è timida»? Con «mi sembra che» l'indicativo stride, e tu lo sai meglio di me. Come lo diresti?"
    prompt: {text: "Mi sembra che la legge è timida", tags: [subjunctive-use]}
  - learner: "Vero, che svista: mi sembra che la legge sia timida. Ed è timida perché nessuno vuole inimicarsi i proprietari a un anno dalle elezioni."
  - tutor: "Perfetto, e l'analisi politica non fa una piega. A proposito di chi non vuole scontentare nessuno: hai visto come ne hanno parlato le varie testate? Io ne ho lette tre e mi è venuto il mal di testa."
    goals: [opinion]
    new: [{lemma: non fare una piega, gloss: to be flawless (of reasoning)}, {lemma: scontentare, gloss: to displease}]
  - learner: "Io due, e bastavano. Il giornale di destra scriveva che la legge punisce chi ha risparmiato una vita per comprarsi un bilocale. Quello di sinistra sosteneva che fosse solo un regalo agli albergatori. Nessuno dei due spiegava che cosa dice davvero l'articolo sulle sanzioni."
  - tutor: "Tipico: tutti a commentare, nessuno a leggere il testo. Le sanzioni, tra parentesi, sono ridicole, roba da far ridere i polli. Detto questo, guardiamo avanti: che cosa succederà, secondo te, quando la legge entrerà in vigore?"
    goals: [sources]
    new: [{lemma: far ridere i polli, gloss: to be laughable}, {lemma: sanzione, gloss: penalty}]
  - learner: "Se le multe sono davvero così basse, molti continueranno come prima e le pagheranno come si paga un parcheggio. Forse cambierà qualcosa solo se i Comuni faranno dei controlli seri, cosa di cui dubito parecchio."
  - tutor: "La multa come costo d'esercizio, insomma: cinico ma realistico. E i ragazzi che cercano una stanza in affitto, nel frattempo? Restano col cerino in mano?"
    goals: [consequences]
    new: [{lemma: restare col cerino in mano, gloss: to be left holding the baby}]
  - learner: "Col cerino in mano, esatto, e con una stanza a seicento euro in periferia. Per loro questa legge cambia poco o niente. Servirebbe costruire studentati, ma quello non fa notizia."
  - tutor: "Già, i mattoni non fanno titolo. Bene, abbiamo risolto la questione della casa in sette minuti e un caffè, peccato che nessuno ci abbia chiesto niente. Torniamo alle scrivanie, che la notizia di domani sarà già un'altra."

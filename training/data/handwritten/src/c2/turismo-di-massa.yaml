- scenario: turismo-di-massa
  level: C2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno a lei e a chi ascolta. Mi chiamo Peter, sono inglese ma vivo a Venezia da undici anni, a Cannaregio. Sono a favore del ticket, ma senza illusioni: è un cerotto su una ferita profonda, non una cura."
  - tutor: "Un cerotto, dice, e detto da un inglese di Venezia fa un certo effetto. Ma io faccio l'avvocato del diavolo: di gente che si lamenta del turismo ne sentiamo tanta. Mi porti un esempio, un fatto che ha visto con i suoi occhi."
    goals: [introduce]
    new: [{lemma: cerotto, gloss: sticking plaster}, {lemma: fare l'avvocato del diavolo, gloss: to play devil's advocate}]
  - learner: "Gliene porto uno di stamattina. Sul ponte sotto casa mia c'erano trenta persone ferme a prendere una foto della stessa gondola, e la signora del terzo piano, ottantadue anni, ha aspettato dieci minuti con la spesa in mano per poter passare. Nel mio palazzo, su otto appartamenti, sei sono per turisti."
    errors: [word-choice]
  - tutor: "Trenta persone a fare una foto alla stessa gondola, e la signora in coda con la spesa: l'immagine è efficace. Però mi permetta: quei trenta pagano alberghi, ristoranti, vaporetti. Senza di loro Venezia sarebbe un bellissimo museo vuoto, e di che cosa vivrebbe?"
    goals: [example]
    recast: {text: "prendere una foto", fix: "fare una foto", tags: [word-choice]}
    new: [{lemma: vaporetto, gloss: Venetian water bus}, {lemma: gondola, gloss: gondola}]
  - learner: "Vivrebbe peggio, non lo nego. Ma una città che i suoi abitanti se ne vanno al ritmo di mille all'anno non è più una città: è una scenografia. E il turista che viene per un giorno lascia in media pochi euro e molta spazzatura."
    errors: [relative-pronoun]
  - tutor: "«Una scenografia»: questa è forte, e ci torniamo. Prima, però, mi scusi la pedanteria da vecchio cronista: «una città che i suoi abitanti se ne vanno»? Quel «che» tuttofare regge male un possesso. Come si direbbe in buon italiano?"
    prompt: {text: "una città che i suoi abitanti", tags: [relative-pronoun]}
    new: [{lemma: tuttofare, gloss: all-purpose}, {lemma: cronista, gloss: reporter}, {lemma: pedanteria, gloss: pedantry}]
  - learner: "Ha ragione: una città i cui abitanti se ne vanno al ritmo di mille all'anno. Ed è proprio questo il punto: l'economia locale non può reggersi solo su chi passa."
  - tutor: "Adesso fila, nella forma e nella sostanza. Ma criticare è facile, e qui casca l'asino: cinque euro di ticket non fermano nessuno, lo ammette lei stesso. Che cosa proporrebbe di realistico, se fosse lei il sindaco?"
    goals: [rebut]
    new: [{lemma: qui casca l'asino, gloss: "that's where the difficulty lies"}]
  - learner: "Tre cose fattibili. Un numero chiuso con prenotazione nei giorni di punta, come si fa per i musei. Un limite alle case per turisti in ogni sestiere. E gli incassi del ticket destinati per legge agli affitti per i residenti, non al bilancio generale. Così il cerotto diventerebbe almeno una medicina."
  - tutor: "Numero chiuso, limite alle case per turisti e incassi destinati ai residenti: proposte concrete, e in radio non è scontato. Non so se il sindaco ci ascolta, ma se ci ascolta prenda appunti. Grazie Peter, e mi saluti la signora del terzo piano. Passiamo alla prossima telefonata."
    goals: [proposal]
    new: [{lemma: numero chiuso, gloss: capped numbers}, {lemma: incasso, gloss: takings, revenue}]

- scenario: turismo-di-massa
  level: C2
  persona: es-f-teacher
  history: [word-order]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno, grazie di avermi presa in linea. Mi chiamo Marta, sono di Barcellona e insegno a Firenze da sei anni. Sono contraria al ticket: è una misura che solo serve a fare cassa e a mettersi la coscienza a posto."
    errors: [word-order]
  - tutor: "Benvenuta, Marta, e grazie della franchezza. Una nota a margine, visto che insegna: «una misura che solo serve a fare cassa»? In italiano quell'avverbio preferisce un altro posto nella frase. Dove lo metterebbe?"
    goals: [introduce]
    prompt: {text: "che solo serve", tags: [word-order]}
  - learner: "Dopo il verbo, certo: una misura che serve solo a fare cassa. A Barcellona lo dicevamo già dieci anni fa."
  - tutor: "Perfetto. Però fare cassa non è un peccato: con quei soldi si puliscono le strade e si restaurano i monumenti. Lei viene da una città che di turisti se ne intende. Ha un esempio concreto che dimostri che pagare non serve?"
    new: [{lemma: fare cassa, gloss: to raise money}, {lemma: intendersene, gloss: to know all about something}]
  - learner: "Ne ho uno fresco. A Barcellona la tassa di soggiorno aumenta ogni anno, e ogni anno arrivano più turisti di prima. Nel quartiere dove sono cresciuta il panettiere ha chiuso e al suo posto c'è un negozio di souvenir. La tassa non ha salvato né lui né i miei vicini."
  - tutor: "Il forno che diventa un negozio di ricordini è una storia che conosciamo bene anche qui. Ma mi lasci insistere: se il ticket non funziona e non facciamo niente, vince chi ha più soldi. Meglio poco che niente, o no?"
    goals: [example]
    new: [{lemma: ricordino, gloss: souvenir}]
  - learner: "No, perché quel poco fa danni. Il ticket trasforma la città in un parco a tema: se pago l'ingresso, mi sento un cliente, e il cliente ha sempre ragione. E poi dà alla politica un alibi per non toccare le rendite vere, cioè gli affitti brevi e le crociere."
  - tutor: "«Se pago, mi sento un cliente»: argomento sottile, glielo riconosco, e mi ha messo con le spalle al muro. Ma non se la cavi così. Chi dice no deve dire anche che cosa farebbe: qual è la sua proposta?"
    goals: [rebut]
    new: [{lemma: mettere con le spalle al muro, gloss: to back into a corner}, {lemma: cavarsela, gloss: to get away with it}]
  - learner: "Regolare l'offerta, non la domanda. Meno licenze per gli affitti brevi nel centro storico, un tetto alle navi da crociera e incentivi a chi affitta ai residenti. Ad Amsterdam hanno fatto così, e il modello è stato un esito."
    errors: [false-friend]
  - tutor: "Che ad Amsterdam sia stato un successo, qualcuno lo contesta, ma l'idea di regolare l'offerta invece della domanda è seria. C'è però un ostacolo: i proprietari votano, i turisti no. Lei crede davvero che un sindaco avrà il coraggio di farlo?"
    goals: [proposal]
    recast: {text: "un esito", fix: "un successo", tags: [false-friend]}
  - learner: "Lo avrà quando i residenti rimasti voteranno in massa, cioè forse troppo tardi. Ma preferisco una proposta difficile a una facile che non serve. A Firenze dite che chi si contenta gode; io, su questo, non mi contento."
  - tutor: "E fa bene: chi si contenta gode, ma ogni tanto perde anche la casa. Grazie, Marta, una telefonata che lascia il segno. Restate con noi: dopo la pubblicità sentiamo chi il ticket lo difende a spada tratta."
    new: [{lemma: chi si contenta gode, gloss: "contentment is happiness (proverb)"}, {lemma: a spada tratta, gloss: staunchly, with drawn sword}, {lemma: lasciare il segno, gloss: to leave a mark}]

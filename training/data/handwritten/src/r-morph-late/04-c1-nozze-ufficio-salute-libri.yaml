# Set r-morph-late, file 4 (C1): a wedding planner, a team meeting, a supplier, two medical and
# insurance calls, a restaurant, a podcast and a book club. One late morphology slip per error turn
# (combined pronouns, hypotheticals, Lei imperatives, conditional by time, passive agreement,
# congiuntivo endings, article forms, participle and adjective agreement).
- scenario: organizzare-matrimonio
  # facts: matrimonio il 12 settembre, una novantina di invitati, molti dall'Inghilterra; cerimonia all'aperto verso le cinque e cena sotto gli alberi; budget massimo trentacinquemila euro, viaggio di nozze escluso; un matrimonio così parte di solito da trentamila; villa sul Chianti a novemila euro con catering obbligatorio, agriturismo vicino a Siena a cinquemilacinquecento con catering libero e senza sala coperta; tendone in caso di pioggia milleduecento euro; scelto l'agriturismo; condizioni: approvazione di ogni spesa extra, aggiornamento ogni lunedì, preventivi per email con il fidanzato in copia; firma giovedì prossimo dopo il lavoro
  level: C1
  persona: en-f-professional
  history: [combined-pronouns, hypothetical, imperative-form]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo semplice ma curato: una cerimonia all'aperto in campagna, verso le cinque del pomeriggio, e poi una cena lunga sotto gli alberi, con una novantina di invitati, molti dei quali verranno dall'Inghilterra."
    - tutor: "Una cena sotto gli alberi è un'idea splendida. Avete già fissato la data?"
      goals: [vision]
    - learner: "Sì, il 12 settembre. Il mio fidanzato voleva giugno, ma a giugno fa troppo caldo; quando gli ho proposto settembre ha detto di no per una settimana, poi gli l'ho spiegato con i prezzi dei voli in mano e ha cambiato idea."
      errors: [combined-pronouns]
      gold: {text: "gli l'ho spiegato", fix: "gliel'ho spiegato"}
    - tutor: "I prezzi dei voli convincono sempre. Riprenda però «gli l'ho spiegato»: «gli» e «l'», davanti all'ausiliare, si uniscono in una parola sola. Quale?"
      prompt: {text: "gli l'ho spiegato", tags: [combined-pronouns]}
    - learner: "Gliel'ho spiegato, tutto attaccato. E a proposito di prezzi: quanto costa, più o meno, un matrimonio così?"
    - tutor: "Per novanta persone in campagna, tra location, cena, fiori e musica, si parte di solito da trentamila euro. Voi che budget avete in mente?"
    - learner: "Pensavamo a trentacinquemila euro al massimo, viaggio di nozze escluso. Preferiamo spendere di più per la cena e per la musica e risparmiare sugli addobbi, perché alla fine la gente si ricorda soprattutto se ha mangiato e ballato bene."
    - tutor: "Con trentacinquemila si lavora bene. Vi propongo due posti: una villa sul Chianti a novemila euro, con catering obbligatorio, o un agriturismo vicino a Siena a cinquemilacinquecento, con catering libero ma senza sala coperta."
      goals: [budget]
    - learner: "L'agriturismo mi piace di più, perché il catering lo scegliamo noi. Ma se a settembre piovesse, dove mangeremmo? Mia sorella si è sposata in un posto senza portico, e dice che se lo avrebbe saputo prima avrebbe scelto un'altra location."
      errors: [hypothetical]
      gold: {text: "se lo avrebbe saputo prima", fix: "se lo avesse saputo prima"}
    - tutor: "In caso di pioggia l'agriturismo monta un tendone, che costa milleduecento euro in più. Riprenda però «se lo avrebbe saputo prima»: nella frase con «se», per un fatto passato che non si è realizzato, quale modo ci vuole?"
      prompt: {text: "se lo avrebbe saputo prima", tags: [hypothetical]}
    - learner: "Se lo avesse saputo prima, avrebbe scelto un altro posto. Con il tendone, però, l'agriturismo resta più economico della villa, quindi scegliamo quello."
    - tutor: "Ottima scelta, anche per il budget: cinquemilacinquecento più il tendone. Prima di firmare, ci sono condizioni che volete mettere per iscritto?"
      goals: [choices]
    - learner: "Sì, due. Vorremmo approvare ogni spesa extra prima che venga fatta e ricevere un aggiornamento ogni lunedì. E ci mandi tutti i preventivi per email, e non dimentica di mettere in copia anche il mio fidanzato."
      errors: [imperative-form]
      gold: {text: "non dimentica di mettere in copia", fix: "non dimentichi di mettere in copia"}
    - tutor: "Condizioni giustissime, le metto nel contratto. Riprenda però «non dimentica di mettere in copia»: subito prima ha detto bene «ci mandi». Questo secondo invito, sempre con il Lei, come diventa?"
      prompt: {text: "non dimentica di mettere in copia", tags: [imperative-form]}
    - learner: "Non si dimentica di mettere in copia il mio fidanzato, volevo dire."
      errors: [imperative-form]
    - tutor: "«Non si dimentichi di mettere in copia» il suo fidanzato: lo scrivo in cima alle condizioni. Allora ci vediamo la settimana prossima per firmare?"
      recast: {text: "Non si dimentica di mettere in copia", fix: "Non si dimentichi di mettere in copia", tags: [imperative-form]}
    - learner: "Sì, giovedì prossimo va benissimo, veniamo tutti e due dopo il lavoro. E grazie della pazienza: so che con due sposi così pignoli non è facile."
    - tutor: "Meglio pignoli che distratti, mi creda. A giovedì, allora: agriturismo, tendone in caso di pioggia e un aggiornamento ogni lunedì."
      goals: [conditions]

- scenario: riunione-lavoro
  # facts: migrazione del gestionale del magazzino, settanta per cento dei dati trasferiti, il turno di notte lo usa già; il fornitore aveva garantito il modulo delle fatture per metà marzo, arrivato ieri con due settimane di ritardo e senza documentazione in italiano; Federica può chiedere un tecnico del fornitore in sede; proposta: due persone della contabilità per i test dal 15 al 25 aprile; tecnico per i primi tre giorni a spese del fornitore; chiusura il 30 aprile; se ne riparla lunedì
  level: C1
  persona: es-m-worker
  history: [conditional-form, passive, subjunctive-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Va avanti, anche se più lentamente del previsto. Abbiamo trasferito circa il settanta per cento dei dati nel nuovo gestionale del magazzino, e i colleghi del turno di notte hanno già cominciato a usarlo senza grossi problemi."
    - tutor: "Settanta per cento è un buon punto. E che cosa blocca l'altro trenta?"
      goals: [update]
    - learner: "Lo blocca il modulo delle fatture. È arrivato solo ieri, con due settimane di ritardo e senza la documentazione in italiano, anche se il fornitore ci aveva garantito che ce lo consegnerebbe a metà marzo."
      errors: [conditional-form]
      gold: {text: "ce lo consegnerebbe a metà marzo", fix: "ce l'avrebbe consegnato a metà marzo"}
    - tutor: "Due settimane di ritardo e niente documentazione: bella sorpresa. Riprendi però «ce lo consegnerebbe a metà marzo»: la garanzia è passata, e metà marzo era il futuro di allora. Quale condizionale ci vuole?"
      goals: [problem]
      prompt: {text: "ce lo consegnerebbe a metà marzo", tags: [conditional-form]}
    - learner: "Il condizionale passato: ci aveva garantito che ce l'avrebbe consegnato a metà marzo. Hai qualche idea per recuperare il tempo?"
    - tutor: "Potrei chiedere al fornitore un tecnico in sede per qualche giorno. Ma tu, che lo segui ogni giorno, che cosa proporresti?"
    - learner: "Proporrei di farci prestare due persone dalla contabilità per i test delle fatture, dal 15 al 25 aprile. Loro conoscono i casi difficili meglio di noi, e se gli errori vengono trovati subito non ce li ritroviamo a maggio."
    - tutor: "Due persone della contabilità per dieci giorni: ne parlo io con il loro responsabile. Il tecnico del fornitore lo vuoi comunque?"
      goals: [proposal]
    - learner: "Sì, magari per i primi tre giorni. Ma vorrei che fosse chiaro fin dall'inizio che i costi dei giorni in più non vengono pagato da noi, perché il ritardo è colpa loro."
      errors: [passive]
      gold: {text: "non vengono pagato da noi", fix: "non vengono pagati da noi"}
    - tutor: "Sul fatto che i giorni in più li debbano pagare loro sono d'accordo al cento per cento. Guarda però «non vengono pagato da noi»: nel passivo il participio concorda con «i costi». Come diventa?"
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "non vengono pagato da noi", tags: [passive]}
    - learner: "Non vengono pagata da noi, i costi."
      errors: [passive]
    - tutor: "I costi non vengono pagati da noi, certo: lo scrivo nella mail al fornitore. E la scadenza? Per quando chiudiamo tutto?"
      recast: {text: "Non vengono pagata da noi", fix: "Non vengono pagati da noi", tags: [passive]}
    - learner: "Se i test finiscono il 25 aprile, direi il 30 per la chiusura. Però, se non vogliamo bloccare le spedizioni proprio a fine mese, è importante che il fornitore ci stii vicino fino all'ultimo giorno."
      errors: [subjunctive-form]
      gold: {text: "ci stii vicino", fix: "ci stia vicino"}
    - tutor: "Il 30 aprile mi va bene. Riprendi solo «ci stii vicino»: il congiuntivo presente di «stare», per «lui», ha un'altra forma. Quale?"
      prompt: {text: "ci stii vicino", tags: [subjunctive-form]}
    - learner: "Che ci stia vicino, scusa. Allora: test dal 15 al 25 e chiusura il 30 aprile."
    - tutor: "Perfetto, lo scrivo nel verbale: test dal 15 al 25 aprile, chiusura il 30. Ne riparliamo alla riunione di lunedì."
      goals: [deadline]

- scenario: trattativa-fornitore
  # facts: il learner compra scatole di cartone stampate per un'azienda di biscotti; aumento del quindici per cento prima di Natale; la carta riciclata costa al fornitore quasi il doppio di due anni fa; otto anni di rapporto; due consegne in ritardo a ottobre, colpa del fornitore; controfferta del learner: sette per cento e revisione a settembre; il fornitore offre l'undici con consegna garantita entro dieci giorni; penale del due per cento per ogni settimana di ritardo, solo per ritardi del fornitore e non per scioperi dei trasporti; bozza entro venerdì
  level: C1
  persona: en-m-heritage
  history: [adjective-agreement, article-form, imperative-form]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Esatto, la chiamo per quello. Capisco la situazione, ma un aumento del quindici per cento sulle scatole stampate, per un'azienda di biscotti come la nostra, significa alzare i prezzi ai supermercati proprio prima di Natale."
    - tutor: "Lo capisco, e mi creda, non è una decisione presa a cuor leggero. La carta riciclata, però, ci costa quasi il doppio rispetto a due anni fa."
      goals: [problem]
    - learner: "Lo so, ed è per questo che non vi chiedo di rinunciare a tutto l'aumento. Ma lavoriamo insieme da otto anni, e a ottobre le consegne sono arrivate in ritardo due volte: una situazione che, per un cliente fedele, è abbastanza spiacevoli."
      errors: [adjective-agreement]
      gold: {text: "abbastanza spiacevoli", fix: "abbastanza spiacevole"}
    - tutor: "I due ritardi di ottobre sono stati colpa nostra, non lo nego. Riprenda però «abbastanza spiacevoli»: l'aggettivo si riferisce a «una situazione», al singolare. Come deve finire?"
      goals: [argue]
      prompt: {text: "abbastanza spiacevoli", tags: [adjective-agreement]}
    - learner: "Abbastanza spiacevole, al singolare. Quindi, considerando i ritardi, che margine mi può offrire?"
    - tutor: "Potrei scendere all'undici per cento, ma non oltre. Lei che cosa avrebbe in mente?"
    - learner: "Le propongo il sette per cento subito e una revisione dei prezzi a settembre, quando sapremo come si muove il mercato della carta. Se a settembre i costi saranno ancora alti rinegoziamo; se scendono, il sette resta."
    - tutor: "Il sette è troppo poco per noi. Facciamo così: undici per cento, e in cambio le garantisco per iscritto la consegna entro dieci giorni dall'ordine."
      goals: [counteroffer]
    - learner: "L'undici con la consegna garantita è già un'altra cosa. Vorrei però una penale del due per cento per ogni settimana di ritardo, perché senza scatole non riempiamo né gli scaffali né i spazi promozionali che abbiamo già pagato."
      errors: [article-form]
      gold: {text: "i spazi promozionali", fix: "gli spazi promozionali"}
    - tutor: "Una penale si può discutere. Riprenda però «i spazi promozionali»: «spazi» comincia come «studenti». Quale articolo plurale ci vuole?"
      prompt: {text: "i spazi promozionali", tags: [article-form]}
    - learner: "Gli spazi promozionali, certo. Allora siamo d'accordo: undici per cento, consegna entro dieci giorni e penale del due per cento?"
    - tutor: "D'accordo, ma la penale vale solo per i ritardi causati da noi, non per gli scioperi dei trasporti. Le va bene così?"
    - learner: "Mi sembra giusto. Allora mi mandi la bozza del contratto entro venerdì e, se trova qualcosa da cambiare nella clausola sugli scioperi, mi telefona pure prima di mandarla, così ne parliamo a voce."
      errors: [imperative-form]
      gold: {text: "mi telefona pure", fix: "mi telefoni pure"}
    - tutor: "Entro venerdì, senz'altro. Riascolti però «mi telefona pure»: ha appena usato bene «mi mandi», e con il Lei anche questo invito segue la stessa regola. Come diventa?"
      prompt: {text: "mi telefona pure", tags: [imperative-form]}
    - learner: "Mi telefoni pure prima di mandarla. Grazie, e buona giornata."
    - tutor: "Grazie a Lei. Le confermo tutto per email: undici per cento, consegna entro dieci giorni, penale del due per cento per i ritardi nostri."
      goals: [agreement]

- scenario: medico-specialista
  # facts: la paziente da circa un mese resta senza fiato a metà delle scale fino al quarto piano; ecocardiogramma normale; colesterolo a duecentosessanta; da quando ha cambiato lavoro mangia fuori, panini, poca frutta, niente sport; madre con la pressione alta dai cinquant'anni, nonno morto di ictus a settantaquattro, padre di ottant'anni che gioca a bocce; una collega le aveva consigliato a Natale di controllare il colesterolo; terapia: una statina la sera e dieta; raramente dolori muscolari, in quel caso sospendere e chiamare; evitare fritti e formaggi grassi, preferire pesce e verdure; lista scritta; esami del sangue tra due mesi
  level: C1
  persona: es-f-teacher
  history: [participle-agreement, conditional-form, imperative-form]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
    - learner: "Abbastanza bene, ma mi stanco più di prima. Da circa un mese, quando salgo le scale fino al quarto piano, a metà mi manca il fiato e devo fermarmi, cosa che fino all'anno scorso non mi succedeva mai."
    - tutor: "Fa bene a dirmelo. La buona notizia è che l'ecocardiogramma è normale: il cuore lavora bene. Il colesterolo, invece, è a duecentosessanta, decisamente alto."
      goals: [symptoms]
      new: [{lemma: ecocardiogramma, gloss: heart ultrasound}]
    - learner: "Duecentosessanta? Non me l'aspettavo. Da quando ho cambiato lavoro mangio spesso fuori: panini a pranzo, poca frutta e niente sport. Le mie abitudini, lo ammetto, si sono un po' rovinato."
      errors: [participle-agreement]
      gold: {text: "si sono un po' rovinato", fix: "si sono un po' rovinate"}
    - tutor: "Capita a molti, con un lavoro nuovo. Riprenda però «si sono un po' rovinato»: con «essere», il participio concorda con il soggetto, cioè «le mie abitudini». Come diventa?"
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "si sono un po' rovinato", tags: [participle-agreement]}
    - learner: "Si sono un po' rovinate, appunto. È per questo che mi manca il fiato, dottore?"
    - tutor: "In parte sì: la poca attività fisica pesa molto sul fiato. Il colesterolo invece non dà sintomi, ma con gli anni danneggia le arterie. In famiglia ci sono problemi di cuore o di circolazione?"
      goals: [understand]
    - learner: "Mia madre ha la pressione alta da quando aveva cinquant'anni, e mio nonno è morto di ictus a settantaquattro. Mio padre, invece, a ottant'anni gioca ancora a bocce tutti i pomeriggi, quindi spero di aver preso un po' anche da lui."
    - tutor: "Speriamo, ma con questi precedenti non conviene rischiare. Le propongo una statina, una compressa la sera, insieme a una dieta più attenta."
      goals: [history]
      new: [{lemma: statina, gloss: statin}]
    - learner: "Va bene, anche se preferirei non prendere medicine per tutta la vita. Se avessi dato retta a una collega, forse oggi non saremmo qui: me l'aveva detto già a Natale che dovrei controllare il colesterolo."
      errors: [conditional-form]
      gold: {text: "che dovrei controllare il colesterolo", fix: "che avrei dovuto controllare il colesterolo"}
    - tutor: "Non è detto che sia per tutta la vita: se dieta e movimento funzionano, potremo ridurre la dose. Riprenda però «che dovrei controllare il colesterolo»: è un consiglio dato a Natale e riferito ora. Dopo «aveva detto», quale condizionale ci vuole?"
      prompt: {text: "che dovrei controllare il colesterolo", tags: [conditional-form]}
    - learner: "Il condizionale passato: mi aveva detto che avrei dovuto controllare il colesterolo. E questa medicina ha effetti collaterali?"
    - tutor: "Raramente dà dolori muscolari. Se li sente, sospenda la compressa e mi chiami subito."
    - learner: "D'accordo. Vorrei sapere anche che cosa devo evitare a tavola, perché a casa cucina mio marito e gli serve una lista precisa: mi scusa se insisto, ma altrimenti continua a friggere tutto."
      errors: [imperative-form]
      gold: {text: "mi scusa se insisto", fix: "mi scusi se insisto"}
    - tutor: "Eviti i fritti e i formaggi grassi, e scelga pesce e verdure: le preparo una lista scritta. Guardi però «mi scusa se insisto»: a me dà del Lei. Come diventa questa richiesta di scuse?"
      goals: [treatment]
      prompt: {text: "mi scusa se insisto", tags: [imperative-form]}
    - learner: "Mi scusi se insisto, volevo dire. Allora quando ci rivediamo per gli esami?"
    - tutor: "Tra due mesi, con nuovi esami del sangue. Porti anche una nota di quello che ha mangiato nell'ultima settimana, così lo guardiamo insieme."

- scenario: assicurazione-sinistro
  # facts: stamattina verso le otto e dieci, in coda alla rotonda di via Garibaldi, un furgone ha tamponato la learner; dolore al collo, pronto soccorso, niente di grave, certificato medico; il conducente ha ammesso di essersi distratto; nessuna constatazione amichevole, ma nome, telefono, dati dell'assicurazione e foto della targa GH 482 TR; danni: paraurti posteriore, un fanale, lo sportello del bagagliaio, stima del carrozziere circa ottocento euro; il perito chiama entro cinque giorni lavorativi; rimborso di solito circa trenta giorni dopo la perizia; numero di pratica e lista dei documenti per email
  level: C1
  persona: en-f-student
  history: [hypothetical, subjunctive-form, article-form]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Stamattina, verso le otto e dieci, ero in coda alla rotonda di via Garibaldi quando un furgone mi ha tamponata da dietro. Non andava forte, ma il colpo mi ha fatto sbattere la testa contro il poggiatesta."
    - tutor: "Mi dispiace. Sta bene? Ha sentito dolore dopo l'urto?"
    - learner: "Ho un po' di dolore al collo, e infatti dopo sono andata al pronto soccorso: per fortuna niente di grave. Il medico mi ha detto che, se non avessi avuto la cintura allacciata, adesso avrei avuto problemi molto più seri."
      errors: [hypothetical]
      gold: {text: "adesso avrei avuto problemi", fix: "adesso avrei problemi"}
    - tutor: "Meno male che l'aveva allacciata. Riprenda però «adesso avrei avuto problemi»: con «adesso», la conseguenza riguarda il presente. Quale condizionale va bene?"
      goals: [what]
      prompt: {text: "adesso avrei avuto problemi", tags: [hypothetical]}
    - learner: "Il presente: adesso avrei problemi molto più seri. Il pronto soccorso mi ha dato anche un certificato, le serve?"
    - tutor: "Sì, il certificato ci serve per il danno fisico: lo mandi insieme alla denuncia. E chi guidava il furgone ha ammesso la responsabilità?"
    - learner: "Sì, è stato molto gentile e ha ammesso subito di essersi distratto. Non avevamo il modulo della constatazione amichevole, però mi ha dato il suo nome, il numero di telefono e i dati dell'assicurazione, e io ho fotografato la targa del furgone."
    - tutor: "Bene, con quei dati possiamo procedere anche senza constatazione. Quali danni ha la sua auto?"
      goals: [responsibility]
    - learner: "Il paraurti posteriore è rotto e un fanale non si accende più. Il carrozziere vicino a casa mia ha detto che servono circa ottocento euro, anche perché va sistemato il sportello del bagagliaio, che non si chiude più bene."
      errors: [article-form]
      gold: {text: "il sportello del bagagliaio", fix: "lo sportello del bagagliaio"}
    - tutor: "Ottocento euro, me lo segno come stima. Riprenda solo «il sportello»: «sportello» comincia come «studente», e l'articolo cambia. Quale serve?"
      prompt: {text: "il sportello", tags: [article-form]}
    - learner: "Lo sportello del bagagliaio, come lo studente. Devo portare io l'auto da quel carrozziere, o prima la deve vedere qualcuno di voi?"
    - tutor: "Prima la deve vedere il nostro perito, che la contatterà entro cinque giorni lavorativi. Mi conferma il numero di targa del furgone?"
    - learner: "È GH 482 TR, l'ho fotografata subito dopo l'urto. Durante la settimana lavoro fino alle sette di sera, quindi spero solo che il perito mi chiami presto e che possi passare anche di sabato."
      errors: [subjunctive-form]
      gold: {text: "che possi passare", fix: "che possa passare"}
    - tutor: "Targa GH 482 TR, registrata. Riprenda però «che possi passare»: il congiuntivo di «potere», alla terza persona, finisce in un altro modo. Come?"
      goals: [documents]
      prompt: {text: "che possi passare", tags: [subjunctive-form]}
    - learner: "Che possa passare anche di sabato. E dopo il perito, quanto tempo ci vuole per il rimborso?"
    - tutor: "Di solito circa trenta giorni dalla perizia. Le mando per email il numero di pratica e la lista dei documenti da allegare, certificato compreso."
      goals: [next]

- scenario: recensione-ristorante
  # facts: il learner e la moglie festeggiano quarant'anni di matrimonio con il menù degustazione da settantacinque euro a testa; avevano ordinato un rosso piemontese, il cameriere ne ha portato un altro e l'ha messo in conto a sessanta euro; agnello chiesto rosa, arrivato troppo cotto; offerta: vino tolto dal conto, due calici di passito con il dolce, dolce offerto dalla casa
  level: C1
  persona: en-m-retired
  history: [participle-agreement, subjunctive-form, conditional-form]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Io e mia moglie festeggiamo stasera quarant'anni di matrimonio, e abbiamo scelto il vostro menù degustazione proprio per l'occasione. Purtroppo un paio di cose non sono andate come ci aspettavamo, e preferisco dirglielo di persona."
    - tutor: "Quarant'anni, auguri, e mi dispiace che la serata non sia perfetta. Mi dica pure che cosa è successo."
      goals: [complain]
    - learner: "Avevamo ordinato un rosso piemontese che conosciamo bene, ma il cameriere ci ha portato un altro vino e, quando gliel'ho fatto notare, ha insistito che fosse quello giusto. La bottiglia l'abbiamo bevuta, ma sul conto ce l'avete messo a sessanta euro."
      errors: [participle-agreement]
      gold: {text: "ce l'avete messo", fix: "ce l'avete messa"}
    - tutor: "Un vino diverso da quello ordinato non va messo in conto, ha ragione. Riprenda però «ce l'avete messo»: quel «l'» è sempre la bottiglia, come in «l'abbiamo bevuta». Come deve finire il participio?"
      goals: [detail]
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "ce l'avete messo", tags: [participle-agreement]}
    - learner: "Ce l'avete messa a sessanta euro, appunto. E poi c'è l'agnello: l'avevamo chiesto rosa, ed è arrivato cotto come una suola."
    - tutor: "Due errori nella stessa sera, per un anniversario: me ne scuso davvero. Che cosa vi sareste aspettati da noi?"
    - learner: "Ci saremmo aspettati la cura che si vede sul vostro sito. Non pretendo che sia tutto perfetto, ma per un menù da settantacinque euro a testa credo che sia normale che il personale ascolti i clienti e che non sostenghi di avere ragione quando sbaglia."
      errors: [subjunctive-form]
      gold: {text: "non sostenghi", fix: "non sostenga"}
    - tutor: "Ascoltare è il primo dovere di chi serve ai tavoli, ha ragione. Riascolti però «non sostenghi»: il congiuntivo di «sostenere» si forma come quello di «tenere», che alla terza persona non finisce in «-i». Come fa?"
      goals: [expectation]
      prompt: {text: "non sostenghi", tags: [subjunctive-form]}
    - learner: "Che non sostiene di avere ragione quando sbaglia."
      errors: [subjunctive-form]
    - tutor: "Che non sostenga di avere ragione quando sbaglia, appunto: ne parlerò con il cameriere. Intanto vorrei togliere il vino dal conto e offrirvi due calici di passito con il dolce. Le sembra sufficiente?"
      recast: {text: "non sostiene", fix: "non sostenga", tags: [subjunctive-form]}
    - learner: "È un gesto gentile, grazie. Per il vino va benissimo; per l'agnello, sinceramente, avrei preferito che me lo cambiaste subito: se il cameriere me l'avesse chiesto, accetterei volentieri un piatto nuovo."
      errors: [conditional-form]
      gold: {text: "accetterei volentieri un piatto nuovo", fix: "avrei accettato volentieri un piatto nuovo"}
    - tutor: "Il cameriere avrebbe dovuto chiederglielo, certo. Riprenda però «accetterei volentieri un piatto nuovo»: quella domanda andava fatta un'ora fa, durante la cena. Quale condizionale va con quel momento passato?"
      prompt: {text: "accetterei volentieri un piatto nuovo", tags: [conditional-form]}
    - learner: "Se me l'avesse chiesto, avrei accettato volentieri un piatto nuovo. Ma ormai siamo al dolce, quindi accetto il passito."
    - tutor: "Allora vino tolto dal conto e due calici di passito con il dolce. E per il vostro anniversario il dolce lo offre la casa."
      goals: [resolve]
    - learner: "Grazie, è molto gentile. Torneremo volentieri, magari per il prossimo compleanno di mia moglie, purché la prossima volta l'agnello arrivi rosa come lo chiediamo."
    - tutor: "Rosa come lo chiederete, glielo prometto. Buona serata, e ancora auguri a tutti e due."

- scenario: intervista-podcast
  # facts: il learner è arrivato da Toronto nel 2019 per un master in scienze alimentari a Parma; poi un posto nel laboratorio di un'azienda che produce pasta; il primo giorno un cappuccino dopo pranzo, finito sul conto della responsabile, che lo chiama «il canadese del cappuccino»; critica: stipendi bassi per i giovani ricercatori, compagni partiti per la Germania o l'Olanda; resta per la qualità della vita e per la compagna di Parma; due anni fa ha rifiutato un'offerta da Monaco; consiglio: non idealizzare, imparare la lingua, trovare un bar sotto casa
  level: C1
  persona: en-m-traveller
  history: [auxiliary-choice, combined-pronouns, adjective-agreement]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Sono arrivato nel 2019 da Toronto per un master in scienze alimentari a Parma. Dovevo restare un anno e mezzo, ma alla fine del master un'azienda che produce pasta mi ha offerto un posto nel laboratorio, e da allora non me ne sono più andato."
    - tutor: "Un canadese che lavora nella pasta, a Parma: sembra l'inizio di una barzelletta. Qual è la prima cosa che ti ha spiazzato?"
      goals: [story]
    - learner: "Il caffè! Il primo giorno di lavoro, dopo pranzo, ho ordinato un cappuccino, e il barista mi ha guardato come se avessi bestemmiato. La mia responsabile non riusciva a smettere di ridere, e alla fine quel cappuccino ha finito sul suo conto."
      errors: [auxiliary-choice]
      gold: {text: "quel cappuccino ha finito", fix: "quel cappuccino è finito"}
    - tutor: "Il cappuccino dopo pranzo, il peccato originale degli stranieri! Riprendi però «quel cappuccino ha finito»: qui il cappuccino non conclude qualcosa, va a finire da qualche parte. Quale ausiliare vuole allora il verbo?"
      goals: [culture-shock]
      prompt: {text: "quel cappuccino ha finito", tags: [auxiliary-choice]}
    - learner: "È finito sul conto della mia responsabile, che da allora mi chiama «il canadese del cappuccino»."
    - tutor: "Un soprannome per sempre, temo. E adesso la domanda difficile: c'è qualcosa dell'Italia che criticheresti?"
    - learner: "Sì, anche se lo dico con affetto. I giovani ricercatori qui guadagnano troppo poco rispetto a quanto studiano: molti dei miei compagni di master sono partiti per la Germania o l'Olanda, e chi resta lo fa per passione, non certo per lo stipendio."
    - tutor: "È una critica che sentiamo spesso, e purtroppo giusta. Tu perché sei rimasto, allora?"
      goals: [critique]
    - learner: "Per la qualità della vita e per le persone, soprattutto per la mia compagna, che è di Parma. Due anni fa ho ricevuto un'offerta da Monaco, ma l'ho rifiutata, e quando gli l'ho comunicato, ai tedeschi non è piaciuto per niente."
      errors: [combined-pronouns]
      gold: {text: "gli l'ho comunicato", fix: "gliel'ho comunicato"}
    - tutor: "Restare per amore è il motivo più italiano di tutti. Riprendi però «gli l'ho comunicato»: «gli» e «l'», davanti all'ausiliare, formano una parola sola. Quale?"
      prompt: {text: "gli l'ho comunicato", tags: [combined-pronouns]}
    - learner: "Glie l'ho comunicato, ma non erano contenti."
      errors: [combined-pronouns]
    - tutor: "Gliel'ho comunicato, dici, e immagino le facce. Ultima domanda: che consiglio daresti a chi pensa di trasferirsi qui?"
      recast: {text: "Glie l'ho comunicato", fix: "Gliel'ho comunicato", tags: [combined-pronouns]}
    - learner: "Di non idealizzare l'Italia dei film e di imparare bene la lingua, perché senza la lingua resti sempre un turista. E di trovare un bar sotto casa: la gente del quartiere all'inizio sembra diffidente, ma dopo qualche mese diventa incredibilmente generoso."
      errors: [adjective-agreement]
      gold: {text: "incredibilmente generoso", fix: "incredibilmente generosa"}
    - tutor: "Trovare un bar sotto casa: un consiglio d'oro. Guarda solo «incredibilmente generoso»: il soggetto è «la gente», che in italiano è femminile e singolare. Come deve finire?"
      goals: [advice]
      prompt: {text: "incredibilmente generoso", tags: [adjective-agreement]}
    - learner: "Incredibilmente generosa, certo. Grazie a voi, e salutatemi tutti i baristi d'Italia."
    - tutor: "Lo faremo, ma senza cappuccino dopo pranzo! Grazie, e alla prossima puntata."

- scenario: film-libro
  # facts: la learner ha letto in italiano, con il dizionario, in un mese, un romanzo di formazione ambientato in un'isola delle Eolie negli anni Sessanta; protagonista Lucia, quindici anni, figlia di un pescatore, sogna di studiare a Palermo, il padre le ha già scelto un marito; legge di nascosto i libri del maestro, parla con il mare; la learner ha visto anche il film tratto dal libro e lo trova più banale, la madre quasi sparisce; Roberto prende il libro per primo
  level: C1
  persona: es-f-erasmus
  history: [passive, hypothetical, article-form]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto un romanzo di formazione ambientato in un'isola delle Eolie negli anni Sessanta. L'ho letto in italiano con il dizionario accanto, quindi ci ho messo un mese intero, ma ne è valsa la pena."
    - tutor: "Un mese con il dizionario: che pazienza. Di che cosa parla, senza svelarci troppo?"
    - learner: "La protagonista è Lucia, una ragazza di quindici anni, figlia di un pescatore, che sogna di studiare a Palermo. Ma sull'isola, in quegli anni, le ragazze venivano promesso in sposa giovanissime, e suo padre ha già scelto per lei un marito."
      errors: [passive]
      gold: {text: "venivano promesso in sposa", fix: "venivano promesse in sposa"}
    - tutor: "Un tema duro, e purtroppo vero per molte. Riprendi però «venivano promesso in sposa»: nel passivo con «venire», il participio concorda con «le ragazze». Come diventa?"
      goals: [summary]
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "venivano promesso in sposa", tags: [passive]}
    - learner: "Venivano promesse in sposa, certo. Non vi dico come finisce, ma vi assicuro che Lucia non è una ragazza che obbedisce facilmente."
    - tutor: "L'avevo intuito. Come la descriveresti, Lucia?"
    - learner: "Testarda, ironica e molto sola. Legge di nascosto i libri del maestro e parla con il mare come se fosse una persona. Quello che mi è piaciuto di più è che non diventa un'eroina perfetta: sbaglia, è ingiusta con sua madre e a volte si pente."
    - tutor: "Un personaggio con le sue crepe: sono i migliori. E a te, nel complesso, il libro è piaciuto?"
      goals: [characters]
    - learner: "Moltissimo, anche se la seconda parte è più lenta. Ho visto anche il film che ne hanno tratto, ma l'ho trovato più banale: la parte sulla madre, per esempio, quasi sparisce, e non sarebbe successo se il regista avrebbe seguito il libro."
      errors: [hypothetical]
      gold: {text: "se il regista avrebbe seguito il libro", fix: "se il regista avesse seguito il libro"}
    - tutor: "Che i film taglino spesso i personaggi più interessanti è vero. Riprendi però «se il regista avrebbe seguito il libro»: dopo «se», per un'ipotesi passata che non si è realizzata, quale modo ci vuole?"
      goals: [opinion]
      prompt: {text: "se il regista avrebbe seguito il libro", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se il regista avesse seguito il libro, avrebbe tenuto la parte sulla madre."
    - tutor: "Esatto. E a chi lo consiglieresti, tra noi o fuori di qui?"
    - learner: "A chi ama le storie di mare e le famiglie complicate, e anche agli studenti di italiano come me, perché la lingua è semplice ma bellissima. La Sicilia di quegli anni assomiglia ai paesi andalusi dei miei nonni, e quindi è perfetto anche per i spagnoli."
      errors: [article-form]
      gold: {text: "per i spagnoli", fix: "per gli spagnoli"}
    - tutor: "Le storie di mare piacciono a molti di noi. Riprendi solo «per i spagnoli»: anche «spagnoli», come «studenti», comincia con una «s» seguita da un'altra consonante. Quale articolo vuole?"
      prompt: {text: "per i spagnoli", tags: [article-form]}
    - learner: "Per gli spagnoli, come per gli studenti. Allora ve lo lascio: chi lo vuole per primo?"
    - tutor: "Lo prendo io, se nessuno protesta. Grazie, e il mese prossimo ti diciamo che cosa ne pensiamo."
      goals: [recommend]

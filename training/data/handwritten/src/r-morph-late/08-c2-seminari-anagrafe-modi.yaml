# Set r-morph-late, file 8 (C2): an ethics seminar, two translators, a chat about dialects, a
# wedding planner, a deputy-head interview, the registry office, idioms with a flatmate and a
# dinner debate about the minimum wage. Error turns carry one small morphology slip late in a long
# turn; the tutor answers the content first, names the category of the slip and moves on.
- scenario: seminario-etica
  # facts: seminario sul consenso presunto alla donazione degli organi; la learner viene dalla Spagna, dove il consenso presunto esiste da decenni ma i medici chiedono sempre il parere della famiglia; quando è morto suo zio, alla madre è bastato sapere che lui non si era mai opposto; proposte: una lettera dello Stato a ogni cittadino a diciotto anni e un registro nazionale online per cambiare idea; se la famiglia si oppone in ospedale, l'ultima parola resta alla famiglia; compito: due pagine per giovedì
  level: C2
  persona: es-f-erasmus
  history: [auxiliary-choice, article-form, hypothetical]
  turns:
    - tutor: "Oggi discutiamo del consenso presunto alla donazione degli organi: chi non dichiara nulla in vita è considerato donatore. Lei che posizione ha?"
    - learner: "Sono favorevole, ma con una riserva. In Spagna, da dove vengo, il consenso presunto esiste da decenni, eppure i medici chiedono sempre il parere della famiglia: la legge dice una cosa, la pratica un'altra, e forse è proprio questo equilibrio a funzionare."
    - tutor: "Una legge severa applicata con delicatezza, dunque. Ma allora a che cosa serve la legge, se poi decide comunque la famiglia?"
      goals: [thesis]
    - learner: "Serve a cambiare il punto di partenza: la famiglia non deve inventare una decisione, deve solo confermarla. Quando è morto mio zio, i medici ci hanno parlato con molta calma, e a mia madre ha bastato sapere che lui non si era mai opposto."
      errors: [auxiliary-choice]
      gold: {text: "a mia madre ha bastato", fix: "a mia madre è bastato"}
    - tutor: "Mi dispiace per suo zio, e il suo esempio mostra bene che cosa intende. Riprenda però «a mia madre ha bastato»: «bastare» non regge un oggetto, come «piacere» o «sembrare». Quale ausiliare vuole?"
      goals: [distinguish]
      prompt: {text: "a mia madre ha bastato", tags: [auxiliary-choice]}
    - learner: "A mia madre è bastato, scusi. E credo che senza la legge avremmo passato ore in corridoio a chiederci che cosa avrebbe voluto lui."
    - tutor: "Ecco l'argomento più forte a favore. Ora le faccio l'obiezione classica: chi non conosce la legge non ha scelto davvero. Il silenzio non è un consenso."
      goals: [objection]
    - learner: "È un'obiezione seria. Ma allora il problema non è la legge, è l'informazione: lo Stato dovrebbe scrivere a ogni cittadino al compimento dei diciotto anni, spiegando la regola e offrendo un modo semplice di rifiutare, senza creare un'equivoco tra silenzio e indifferenza."
      errors: [article-form]
      gold: {text: "un'equivoco", fix: "un equivoco"}
    - tutor: "Una lettera ai diciottenni è un'idea concreta, e risponde davvero all'obiezione. Riprenda però «un'equivoco»: «equivoco» è maschile, e l'apostrofo si usa solo con il femminile «una». Come si scrive?"
      goals: [concede]
      prompt: {text: "un'equivoco", tags: [article-form]}
    - learner: "Un equivoco, senza apostrofo. E aggiungerei un registro nazionale online, dove chiunque possa cambiare idea in qualsiasi momento, anche dal telefono."
    - tutor: "Lettera, registro, possibilità di ripensarci. E se una famiglia, nonostante tutto, si oppone con forza in ospedale?"
    - learner: "Lì mi fermerei. Un trapianto salva una vita, ma imporre una scelta a una famiglia in lutto rischia di distruggere la fiducia nel sistema: l'anno dopo molte più persone si cancellerebbero dal registro, se i medici procederebbero comunque contro le lacrime dei parenti."
      errors: [hypothetical]
      gold: {text: "se i medici procederebbero", fix: "se i medici procedessero"}
    - tutor: "Il rischio per la fiducia è reale, sono d'accordo con Lei. Riprenda però «se i medici procederebbero»: dopo il «se» di un'ipotesi, quale modo ci vuole, e in che tempo?"
      prompt: {text: "se i medici procederebbero", tags: [hypothetical]}
    - learner: "Se i medici procedessero comunque, il sistema perderebbe la fiducia che lo regge. Quindi consenso presunto, sì, ma con l'ultima parola alla famiglia."
    - tutor: "È la sua tesi, ed è difendibile. Per giovedì me la scriva in due pagine, con la lettera e il registro come proposte concrete."
      goals: [conclude]
    - learner: "Due pagine per giovedì, va bene. Comincerò proprio dal caso di mio zio, perché mi sembra il modo più onesto di mostrare che cosa succede quando la legge e la famiglia vanno nella stessa direzione."
    - tutor: "Mi sembra un ottimo inizio. A giovedì, allora."

- scenario: traduzione-sfumature
  # facts: due traduttrici lavorano a una raccolta di racconti irlandesi per un piccolo editore; problema: rendere «cosy», la learner ha scelto «ci si stava bene»; la nonna del racconto ha un accento fortissimo; un dialetto italiano preciso la sposterebbe a Bari o a Bergamo, l'italiano standard la appiattisce; soluzione: un italiano un po' antiquato senza regione riconoscibile; il marito della learner ha ascoltato cinque o sei battute, funzionano quella sul tè e quella sulla pioggia; Lucia, la redattrice, ha anticipato la consegna alla fine del mese; la learner finisce la nonna, la tutor le descrizioni del porto, le note sui giochi di parole insieme giovedì pomeriggio; la learner presta un vocabolario marinaro comprato a Genova
  level: C2
  persona: en-f-professional
  history: [article-form, adjective-agreement, passive, combined-pronouns]
  turns:
    - tutor: "Allora, sei arrivata al racconto della nonna? Io mi sono bloccata sulla prima pagina: quel «cosy» non so proprio come renderlo."
    - learner: "Ci sono arrivata ieri sera, e anch'io ci ho girato intorno per un'ora. «Accogliente» è troppo da agenzia immobiliare, «intimo» è troppo romantico; alla fine ho provato «ci si stava bene», che è meno elegante ma suona come parlerebbe davvero la nonna."
    - tutor: "«Ci si stava bene» mi piace, perché sposta la parola dalla stanza alle persone. E la nonna, come la fai parlare? Nell'originale ha un accento fortissimo."
      goals: [problem]
    - learner: "Ecco il vero problema. Un dialetto italiano preciso la trasformerebbe in una nonna di Bari o di Bergamo; l'italiano standard, invece, la appiattisce, e il lettore perde tutti i scherzi che i nipoti fanno sul suo modo di parlare."
      errors: [article-form]
      gold: {text: "tutti i scherzi", fix: "tutti gli scherzi"}
    - tutor: "Bari o Bergamo, appunto: con un dialetto vero la storia trasloca. Guarda però «tutti i scherzi»: «scherzi» comincia come «studenti» o «sport», e l'articolo plurale cambia. Quale?"
      prompt: {text: "tutti i scherzi", tags: [article-form]}
    - learner: "Tutti gli scherzi, come gli studenti. Pensavo a una via di mezzo: un italiano un po' antiquato, con qualche parola di campagna e frasi costruite in modo insolito, senza nessuna regione riconoscibile."
    - tutor: "Una lingua inventata ma credibile. È rischioso: se esageri, sembra una parodia. Hai già provato a scrivere qualche battuta?"
      goals: [options]
    - learner: "Sì, ne ho lette cinque o sei ad alta voce a mio marito, che di libri non sa niente ma ha un ottimo orecchio. Secondo lui la battuta sul tè e quella sulla pioggia funzionano, mentre le altre gli sono sembrate un po' troppo artificiale."
      errors: [adjective-agreement]
      gold: {text: "troppo artificiale", fix: "troppo artificiali"}
    - tutor: "Mi fido del suo orecchio: chi non legge per mestiere sente subito quello che stona. Riprendi però «troppo artificiale»: si riferisce a «le altre», qualche parola prima. Come concorda?"
      prompt: {text: "troppo artificiale", tags: [adjective-agreement]}
    - learner: "Troppo artificiali, sì. Le riscrivo stasera, e domani te le mando, così mi dici se la nonna ti sembra viva o una caricatura."
    - tutor: "Volentieri. Intanto devo dirti una cosa: Lucia, la redattrice, ha anticipato la consegna. Vuole il racconto entro la fine del mese, non a dicembre."
    - learner: "Alla fine del mese? Allora dobbiamo dividerci il lavoro in modo diverso. Facciamo così: io finisco la nonna, tu ti occupi delle descrizioni del porto, e le note sui giochi di parole, che l'altra volta sono state chiesto da Lucia stessa, le scriviamo insieme."
      errors: [passive]
      gold: {text: "sono state chiesto", fix: "sono state chieste"}
    - tutor: "Le note insieme mi sembrano giuste, visto che le vuole proprio lei. Riprendi però «sono state chiesto»: è un passivo, e il participio va con il soggetto, «le note». Come diventa?"
      goals: [decide]
      prompt: {text: "sono state chiesto", tags: [passive]}
    - learner: "Sono state chiesti da Lucia, sì."
      errors: [passive]
    - tutor: "«Sono state chieste»: «note» è femminile. E visto che le ha chieste Lucia, meglio non dimenticarne nessuna. Ci vediamo giovedì per scriverle?"
      recast: {text: "Sono state chiesti", fix: "Sono state chieste", tags: [passive]}
    - learner: "Giovedì pomeriggio va benissimo, così abbiamo due settimane per rileggere tutto con calma. Porto anche un vecchio vocabolario marinaro che ho comprato a Genova: se ti serve per le descrizioni del porto, ti lo presto volentieri."
      errors: [combined-pronouns]
      gold: {text: "ti lo presto", fix: "te lo presto"}
    - tutor: "Un vocabolario marinaro è proprio quello che mi manca per il porto. Riprendi però «ti lo presto»: quando «ti» incontra «lo», cambia una vocale. Come diventa?"
      prompt: {text: "ti lo presto", tags: [combined-pronouns]}
    - learner: "Te lo presto, allora, e giovedì lo trovi sulla tua scrivania insieme alle battute nuove della nonna."
    - tutor: "Perfetto, a giovedì. E di' a tuo marito che adesso è ufficialmente il nostro primo lettore."

- scenario: dialetti-regionali
  # facts: la learner è di Valencia e studia a Napoli da tre mesi; con la padrona di casa se la cava, al mercato no; a casa parlava valenciano, a scuola castigliano; da quando vive a Napoli il suo valenciano è tornato a galla e a volte sogna in valenciano; da bambina i maestri correggevano chi parlava valenciano in cortile; il tutor capisce il napoletano e lo parla male, i genitori gli parlavano in italiano; scambio linguistico sabato alle nove al mercato di Porta Nolana, davanti alla pescheria
  level: C2
  persona: es-f-erasmus
  history: [auxiliary-choice, hypothetical, article-form]
  turns:
    - tutor: "Allora, dopo tre mesi a Napoli, il napoletano lo capisci o ti sembra ancora un'altra lingua?"
    - learner: "Dipende da chi parla. Con la mia padrona di casa ormai me la cavo, perché parla piano e mescola molto italiano; ma quando al mercato i venditori si mettono a scherzare tra loro, mi sento come il primo giorno, e sorrido senza capire."
    - tutor: "Al mercato parlano veloce anche per noi! E a Valencia com'è? Tu sei cresciuta con due lingue, no?"
      goals: [notice]
    - learner: "Sì, a casa parlavamo valenciano e a scuola castigliano, e per me era normale. La cosa curiosa è che, quando sento il napoletano, penso subito a come lo direbbe mia nonna, e così, da quando vivo qui, il mio valenciano ha tornato a galla."
      errors: [auxiliary-choice]
      gold: {text: "ha tornato a galla", fix: "è tornato a galla"}
    - tutor: "Che bella cosa, una lingua che ne risveglia un'altra. Riprendi però «ha tornato a galla»: «tornare» indica un movimento e non regge mai un oggetto. Quale ausiliare ci vuole?"
      prompt: {text: "ha tornato a galla", tags: [auxiliary-choice]}
    - learner: "Ha ritornato a galla, volevo dire."
      errors: [auxiliary-choice]
    - tutor: "«È ritornato a galla»: con «tornare» e «ritornare» ci vuole «essere». E con quali parole è riemerso, il tuo valenciano?"
      recast: {text: "Ha ritornato a galla", fix: "È ritornato a galla", tags: [auxiliary-choice]}
    - learner: "È tornato a galla, sì, con parole che non usavo da anni. Mi capita perfino di sognare in valenciano, cosa che a Valencia non mi succedeva più."
    - tutor: "Sogni in valenciano a Napoli: è quasi una poesia. Ma secondo te, a scuola, i dialetti andrebbero insegnati?"
      goals: [standard]
    - learner: "Insegnati come materia no, ma rispettati sì. Io ho avuto maestri che correggevano chi parlava valenciano in cortile, e molti compagni hanno smesso di usarlo. Credo che i bambini lo parlerebbero con più orgoglio, se i maestri lo trattavano come una ricchezza."
      errors: [hypothetical]
      gold: {text: "se i maestri lo trattavano", fix: "se i maestri lo trattassero"}
    - tutor: "Sul rispetto siamo d'accordo, e qui molti nonni raccontano la stessa storia. Riprendi però «se i maestri lo trattavano»: l'ipotesi riguarda il presente, con «parlerebbero» nell'altra metà. Che forma vuole il verbo dopo «se»?"
      prompt: {text: "se i maestri lo trattavano", tags: [hypothetical]}
    - learner: "Se i maestri lo trattassero come una ricchezza, appunto. E tu, il napoletano lo parli, o lo capisci soltanto?"
    - tutor: "Lo capisco benissimo e lo parlo male, come molti della mia generazione: i miei genitori ci parlavano in italiano per farci fare bella figura a scuola."
      goals: [example]
    - learner: "Allora è la stessa storia, in due città diverse. Sai che cosa mi piacerebbe? Fare un piccolo scambio con te: io ti insegno qualche frase di valenciano, tu mi spieghi il napoletano del mercato, con tutti i gesti e anche i insulti più simpatici."
      errors: [article-form]
      gold: {text: "i insulti", fix: "gli insulti"}
    - tutor: "Uno scambio così lo faccio volentieri, e con i gesti si comincia subito. Guarda solo «i insulti»: davanti a una vocale, l'articolo maschile plurale cambia forma. Quale?"
      prompt: {text: "i insulti", tags: [article-form]}
    - learner: "Gli insulti, come gli amici. Sabato mattina al mercato di Porta Nolana, allora?"
    - tutor: "Sabato alle nove, davanti alla pescheria. E porta un quaderno: i venditori non ripetono mai due volte."

- scenario: organizzare-matrimonio
  # facts: matrimonio il 14 settembre in una masseria pugliese, circa novanta invitati; una zia vegana, due cugini celiaci con reazioni forti in passato, un nonno di novantadue anni che mangia solo cose morbide; piatti adattati serviti insieme agli altri, cucina separata per i celiaci, conferma scritta; piano pioggia: tensostruttura bianca nel giardino degli ulivi, decisione tre giorni prima; l'anno scorso al matrimonio di un amico del learner è piovuto durante il taglio della torta; musica: gruppo durante la cena e DJ dopo la torta; due preventivi entro venerdì
  level: C2
  persona: es-m-worker
  history: [imperative-form, conditional-form, article-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Allora, il matrimonio è il 14 settembre, in masseria, con circa novanta invitati: partiamo dal menù o dal piano in caso di pioggia?"
    - learner: "Partirei dal menù, perché è la parte che preoccupa di più la mia fidanzata. Abbiamo una zia vegana, due cugini celiaci e un nonno di novantadue anni che mangia solo cose morbide; vorremmo che nessuno di loro si sentisse un ospite di serie B."
    - tutor: "Nessun problema: per loro possiamo preparare gli stessi piatti in versione adattata, serviti insieme agli altri, senza vassoi a parte."
      goals: [choices]
    - learner: "Mi sembra perfetto, e la ringrazio, perché era proprio la cosa che temevamo. Per i cugini, però, la cucina deve essere davvero separata, non solo attenta: in passato hanno avuto reazioni molto forti. La prego, mi manda una conferma per iscritto."
      errors: [imperative-form]
      gold: {text: "mi manda una conferma", fix: "mi mandi una conferma"}
    - tutor: "Ha ragione a insistere: per la celiachia l'attenzione non basta, serve una cucina separata, e la nostra ce l'ha. Riprenda però «mi manda una conferma»: con «la prego», mi sta chiedendo qualcosa con il Lei. Quale forma serve?"
      prompt: {text: "mi manda una conferma", tags: [imperative-form]}
    - learner: "Mi mandi una conferma per iscritto, volevo dire. E per la pioggia che cosa propone?"
    - tutor: "Una tensostruttura bianca nel giardino degli ulivi, già prenotata: si decide se montarla tre giorni prima, guardando le previsioni."
      goals: [conditions]
    - learner: "Tre giorni prima va benissimo. Glielo chiedo perché l'anno scorso, al matrimonio di un amico, è piovuto proprio durante il taglio della torta, e in quel momento una tenda come la sua servirebbe a novanta persone bagnate fradice."
      errors: [conditional-form]
      gold: {text: "servirebbe a novanta persone", fix: "sarebbe servita a novanta persone"}
    - tutor: "Quella torta sotto la pioggia la immagino benissimo, e capisco la sua prudenza. Riprenda però «servirebbe a novanta persone»: parla di un momento dell'anno scorso, ormai passato. Quale condizionale ci vuole?"
      prompt: {text: "servirebbe a novanta persone", tags: [conditional-form]}
    - learner: "Sarebbe servita a novanta persone, appunto. Ultima cosa: per la musica siamo indecisi tra un gruppo dal vivo e un DJ."
    - tutor: "Molti fanno tutte e due le cose: il gruppo durante la cena, il DJ dopo il taglio della torta. Costa un po' di più, ma accontenta nonni e nipoti."
      goals: [budget]
    - learner: "È un'ottima idea, soprattutto per il nonno, che ama la musica dal vivo e va a letto presto. Mi prepari un preventivo con le due soluzioni e uno con il DJ solo: il budget non è infinito, e un zero in più cambia tutto."
      errors: [article-form]
      gold: {text: "un zero", fix: "uno zero"}
    - tutor: "Avrà tutti e due i preventivi entro venerdì, con i prezzi già divisi per voce. Guardi solo «un zero»: «zero» comincia come «zio» e «zaino». Quale articolo vogliono queste parole?"
      prompt: {text: "un zero", tags: [article-form]}
    - learner: "Una zero, volevo dire."
      errors: [article-form]
    - tutor: "«Uno zero»: «zero» è maschile e comincia con la «z». Ma stia tranquillo, nei nostri preventivi non ci saranno sorprese."
      recast: {text: "Una zero", fix: "Uno zero", tags: [article-form]}
    - learner: "Uno zero, come uno zio. Allora aspetto i preventivi venerdì, e ne parlo con la mia fidanzata nel fine settimana."
    - tutor: "Benissimo. E le dica di stare tranquilla: per la zia, i cugini e il nonno abbiamo già un piano."

- scenario: colloquio-promozione
  # facts: la learner insegna spagnolo al liceo da otto anni e si candida come vicepreside quando il professor Ferri andrà in pensione a settembre; ha fatto parte di quasi tutte le commissioni; due anni fa ha salvato lo scambio con Siviglia trovando venti famiglie in tre settimane, quaranta studenti sono partiti; chiede di ridurre l'orario a due classi il primo anno, da discutere al collegio di giugno; punto debole: non ha mai dovuto dire di no a un collega; candidatura entro il 15 maggio
  level: C2
  persona: es-f-teacher
  history: [auxiliary-choice, subjunctive-form, adjective-agreement, hypothetical]
  turns:
    - tutor: "Si accomodi, professoressa. Mi ha scritto che vorrebbe candidarsi come vicepreside, quando il professor Ferri andrà in pensione a settembre. Mi spieghi perché."
    - learner: "Perché credo di conoscere questa scuola da dentro. Insegno spagnolo qui da otto anni, ho fatto parte di quasi tutte le commissioni, e soprattutto ho imparato a capire che cosa preoccupa davvero i colleghi, che spesso non coincide con quello che si dice nei collegi docenti."
    - tutor: "Lo so, e la stimano in molti. Ma il vicepreside deve risolvere problemi pratici ogni giorno. Mi faccia un esempio concreto."
      goals: [results]
    - learner: "Le faccio l'esempio dello scambio con Siviglia. Due anni fa il progetto stava per saltare, perché le famiglie spagnole si erano ritirate all'ultimo momento; io ho trovato altre venti famiglie in tre settimane, e alla fine quaranta studenti hanno partiti come previsto."
      errors: [auxiliary-choice]
      gold: {text: "hanno partiti", fix: "sono partiti"}
    - tutor: "Lo scambio me lo ricordo bene: senza di lei sarebbe saltato tutto. Riprenda però «hanno partiti»: «partire» indica uno spostamento e non ha oggetto. Quale ausiliare vuole?"
      prompt: {text: "hanno partiti", tags: [auxiliary-choice]}
    - learner: "Hanno partito come previsto, volevo dire."
      errors: [auxiliary-choice]
    - tutor: "«Sono partiti come previsto», e sono tornati entusiasti. Ma la vicepresidenza è un'altra cosa: lei continuerebbe a insegnare in tre classi?"
      recast: {text: "Hanno partito come previsto", fix: "Sono partiti come previsto", tags: [auxiliary-choice]}
    - learner: "È proprio il punto che volevo toccare. Con tre classi, riunioni, orari e supplenze, temo di fare male entrambe le cose; per questo vorrei ridurre l'orario a due classi, almeno il primo anno, purché il collegio ne discute apertamente a giugno."
      errors: [subjunctive-form]
      gold: {text: "purché il collegio ne discute", fix: "purché il collegio ne discuta"}
    - tutor: "Due classi per il primo anno si possono chiedere, e il collegio di giugno è la sede adatta. Riprenda però «purché il collegio ne discute»: «purché» vuole sempre lo stesso modo. Quale, e con che desinenza?"
      goals: [request]
      prompt: {text: "purché il collegio ne discute", tags: [subjunctive-form]}
    - learner: "Purché il collegio ne discuta, certo. Posso chiederle qual è, secondo lei, il mio punto debole?"
    - tutor: "In parte gliel'ho già detto: lei è stimata, ma non ha mai dovuto dire di no a un collega. Il vicepreside lo fa ogni settimana."
      goals: [handle]
    - learner: "È vero, e non le nascondo che è la parte che mi spaventa di più. Però ho visto il professor Ferri farlo per anni: le sue risposte erano a volte dure, ma alla fine sembravano a tutti, anche ai più arrabbiati, profondamente giusti."
      errors: [adjective-agreement]
      gold: {text: "profondamente giusti", fix: "profondamente giuste"}
    - tutor: "Ferri è stato un ottimo modello, su questo non c'è dubbio. Riprenda però «profondamente giusti»: riguarda «le sue risposte», qualche parola prima. Come deve concordare?"
      prompt: {text: "profondamente giusti", tags: [adjective-agreement]}
    - learner: "Profondamente giusto, volevo dire."
      errors: [adjective-agreement]
    - tutor: "«Profondamente giuste»: «risposte» è femminile plurale. Ma mi dica: lei come vorrebbe imparare a dire di no?"
      recast: {text: "Profondamente giusto", fix: "Profondamente giuste", tags: [adjective-agreement]}
    - learner: "Profondamente giuste. Ed è così che vorrei imparare a dire di no: con risposte chiare, motivate e uguali per tutti."
    - tutor: "È la risposta che speravo. Facciamo così: presenti la candidatura entro il 15 maggio, con la proposta delle due classi; ne discuteremo al collegio di giugno."
      goals: [next-steps]
    - learner: "La preparo entro il 15 maggio, con una pagina sullo scambio e una sulle supplenze. E le prometto una cosa: la prima settimana la passerei ad ascoltare i colleghi, prima di cambiare qualsiasi cosa, se il collegio mi sceglierebbe."
      errors: [hypothetical]
      gold: {text: "se il collegio mi sceglierebbe", fix: "se il collegio mi scegliesse"}
    - tutor: "Ascoltare prima di cambiare è la cosa più saggia che potesse promettermi. Riprenda però «se il collegio mi sceglierebbe»: dopo questo «se» il condizionale non va. Che forma serve?"
      prompt: {text: "se il collegio mi sceglierebbe", tags: [hypothetical]}
    - learner: "Se il collegio mi scegliesse, sì. Grazie per il tempo che mi ha dedicato."
    - tutor: "Grazie a lei, professoressa. Aspetto la candidatura entro il 15 maggio."

- scenario: burocrazia-residenza
  # facts: il learner, cittadino britannico, si è trasferito a Lecce a settembre e lavora a distanza per un'azienda di Manchester; chiede la residenza per sé e per la compagna portoghese; per lui servono la ricevuta del permesso di soggiorno, il passaporto e il contratto d'affitto registrato; la Questura gli ha dato la ricevuta a ottobre, l'aveva lasciata nella cartella della banca; la compagna fa la traduttrice per una casa editrice di Lisbona, ha un'assicurazione in portoghese da far tradurre da un traduttore giurato; controllo della Polizia Locale entro quarantacinque giorni; a dicembre tre settimane a Manchester; se trova l'avviso, chiamare l'anagrafe entro dieci giorni; il codice fiscale va portato all'ASL
  level: C2
  persona: en-m-traveller
  history: [participle-agreement, combined-pronouns, imperative-form, article-form]
  turns:
    - tutor: "Buongiorno. Mi dica: è per la residenza?"
    - learner: "Sì, buongiorno. Mi sono trasferito a Lecce a settembre, lavoro a distanza per un'azienda di Manchester e vorrei chiedere la residenza per me e per la mia compagna, che è portoghese. Ho portato tutto quello che ho trovato elencato sul sito del Comune."
    - tutor: "Vediamo. Per Lei, che è cittadino britannico, servono il permesso di soggiorno o la ricevuta della richiesta, il passaporto e il contratto d'affitto registrato."
      goals: [documents]
    - learner: "Il passaporto e il contratto ce li ho qui. La ricevuta del permesso di soggiorno, invece, è il punto delicato: la Questura me l'ha data a ottobre, ma ieri sera, cercandola tra le carte, ho scoperto che l'avevo lasciato nella cartella della banca."
      errors: [participle-agreement]
      gold: {text: "l'avevo lasciato", fix: "l'avevo lasciata"}
    - tutor: "Meno male che l'ha ritrovata, perché quella ricevuta è indispensabile. Riprenda però «l'avevo lasciato»: quell'apostrofo nasconde un pronome che sta per «la ricevuta». Come deve accordarsi il participio?"
      prompt: {text: "l'avevo lasciato", tags: [participle-agreement]}
    - learner: "L'avevo lasciata nella cartella della banca, sì. Eccola. E per la mia compagna, che è cittadina europea, che cosa serve?"
    - tutor: "Per lei basta un documento d'identità valido, più la prova di risorse sufficienti e di un'assicurazione sanitaria, oppure un contratto di lavoro in Italia."
      goals: [request]
    - learner: "Lavora come traduttrice per una casa editrice di Lisbona, quindi niente contratto italiano. L'assicurazione ce l'ha, ma la polizza è in portoghese: se serve tradotta, le la facciamo tradurre da un traduttore giurato entro la settimana prossima."
      errors: [combined-pronouns]
      gold: {text: "le la facciamo tradurre", fix: "gliela facciamo tradurre"}
    - tutor: "Una traduzione giurata ci serve, sì, anche se la sua compagna traduce per mestiere: le regole sono uguali per tutti. Riprenda però «le la facciamo tradurre»: quando «le» incontra «la», i due pronomi si fondono. In che parola?"
      prompt: {text: "le la facciamo tradurre", tags: [combined-pronouns]}
    - learner: "Gliela facciamo tradurre entro la settimana prossima. Poi come funziona: c'è un controllo a casa?"
    - tutor: "Sì: entro quarantacinque giorni passerà la Polizia Locale per verificare che abitiate davvero all'indirizzo dichiarato. Se non vi trova, lascia un avviso."
      goals: [problem]
    - learner: "Lavoriamo tutti e due da casa, quindi ci troveranno quasi sempre; il problema è che a dicembre andiamo per tre settimane a Manchester dai miei. Se l'avviso arriva proprio in quei giorni, per favore, mi scrive su un foglio chi devo chiamare."
      errors: [imperative-form]
      gold: {text: "mi scrive su un foglio", fix: "mi scriva su un foglio"}
    - tutor: "Domanda sensata, perché succede spesso. Riprenda però «mi scrive su un foglio»: con «per favore», mi sta chiedendo di fare qualcosa, e mi dà del Lei. Quale forma ci vuole?"
      prompt: {text: "mi scrive su un foglio", tags: [imperative-form]}
    - learner: "Mi scriva su un foglio chi devo chiamare, volevo dire."
    - tutor: "Ecco qui: ufficio anagrafe, numero diretto e indirizzo email. Se trova l'avviso, chiami entro dieci giorni e fissiamo un nuovo controllo."
      goals: [next]
    - learner: "Grazie, lo attacco al frigorifero appena torno a casa. Un'ultima domanda: una volta ottenuta la residenza, possiamo iscriverci al servizio sanitario e scegliere un medico di base, o serve anche il codice fiscale, che abbiamo chiesto all'Agenzia delle Entrate con un'unico modulo?"
      errors: [article-form]
      gold: {text: "un'unico modulo", fix: "un unico modulo"}
    - tutor: "Il codice fiscale serve, ma se l'avete già chiesto basta portarlo all'ASL insieme alla residenza. Guardi solo «un'unico modulo»: «modulo» è maschile, e l'apostrofo va solo con il femminile. Come si scrive?"
      prompt: {text: "un'unico modulo", tags: [article-form]}
    - learner: "Una unico modulo, volevo dire."
      errors: [article-form]
    - tutor: "«Un unico modulo»: «modulo» è maschile, quindi niente «una» e niente apostrofo."
      recast: {text: "Una unico modulo", fix: "Un unico modulo", tags: [article-form]}
    - learner: "Un unico modulo, senza apostrofo. Allora porto il codice fiscale all'ASL appena arriva la residenza."
    - tutor: "Sì, così. La pratica è avviata: entro quarantacinque giorni, se il controllo va bene, avrete la residenza."

- scenario: modi-di-dire
  # facts: la learner divide l'appartamento con la tutor a Bologna; ieri ha conosciuto la nonna della tutor; aveva l'esame di storia, ha risposto «grazie mille» a «in bocca al lupo»; la nonna le ha raccontato una lunga storia sui cacciatori e il caffè si è raffreddato; «acqua in bocca» per un segreto sulla festa per i quarant'anni della madre della tutor; «avere le mani in pasta» sentito al telegiornale su un appalto per un nuovo ospedale; stasera la learner prova le espressioni con la nonna
  level: C2
  persona: en-f-student
  history: [auxiliary-choice, adjective-agreement, hypothetical]
  turns:
    - tutor: "Dai, raccontami com'è andata ieri con mia nonna. Mi ha detto che a un certo punto vi siete messe a ridere tutte e due."
    - learner: "È andata benissimo, ma ho fatto una figuraccia. Le ho detto che oggi avevo l'esame di storia, lei mi ha risposto «in bocca al lupo», e io, educatissima, le ho detto «grazie mille». Mi ha guardato come se avessi bestemmiato in chiesa."
    - tutor: "Ah, il classico! Non si risponde «grazie»: si dice «crepi», o «crepi il lupo». Ma non te la prendere, ci cascano anche molti italiani."
      goals: [react]
    - learner: "«Crepi il lupo», me lo segno. Ma il bello è venuto dopo: tua nonna mi ha spiegato che una volta lo dicevano ai cacciatori prima di partire, e mi ha raccontato una storia così lunga che il caffè, nel frattempo, ha diventato freddo."
      errors: [auxiliary-choice]
      gold: {text: "ha diventato freddo", fix: "è diventato freddo"}
    - tutor: "Questa è mia nonna, sì: per ogni modo di dire ha un'ora di storia. Riprendi però «ha diventato freddo»: «diventare» indica un cambiamento di stato, senza oggetto. Quale ausiliare vuole?"
      prompt: {text: "ha diventato freddo", tags: [auxiliary-choice]}
    - learner: "È diventato freddo, e lei l'ha bevuto lo stesso. Poi mi ha insegnato un'altra espressione, «acqua in bocca». Vuol dire non dire niente a nessuno, giusto?"
    - tutor: "Sì, è un modo per chiedere di mantenere un segreto. E te l'ha detto per un motivo preciso, scommetto: di che segreto si trattava?"
      goals: [tell]
    - learner: "Non te lo posso dire, è proprio questo il punto! Ti dico solo che riguarda la festa per i quarant'anni di tua madre, e che le cose che mi ha chiesto di preparare, se ne parlo con te, non saranno più per niente segreto."
      errors: [adjective-agreement]
      gold: {text: "per niente segreto", fix: "per niente segrete"}
    - tutor: "La festa di mia madre, va bene: non chiedo altro, giuro. Riprendi però «per niente segreto»: si riferisce a «le cose», qualche parola prima. Come concorda?"
      prompt: {text: "per niente segreto", tags: [adjective-agreement]}
    - learner: "Non saranno più per niente segrete. Allora, per cambiare argomento: che cosa vuol dire «avere le mani in pasta»? L'ho sentito ieri al telegiornale."
    - tutor: "Vuol dire essere coinvolti in un affare, spesso poco pulito, e conoscere le persone giuste. Al telegiornale, immagino, parlavano di politica."
      goals: [moral]
    - learner: "Sì, parlavano di un appalto per un nuovo ospedale di Bologna. All'inizio pensavo che fosse un complimento, e chissà che faccia farebbe il mio professore di storia, se gli dicevo che ha le mani in pasta in tutti i progetti del dipartimento."
      errors: [hypothetical]
      gold: {text: "se gli dicevo", fix: "se gli dicessi"}
    - tutor: "Quella faccia la immagino, ed è meglio non vederla davvero. Riprendi però «se gli dicevo»: qui l'ipotesi riguarda il presente, con «farebbe» nell'altra parte. Che forma ci vuole dopo «se»?"
      prompt: {text: "se gli dicevo", tags: [hypothetical]}
    - learner: "Se gli direi che ha le mani in pasta, chissà che faccia farebbe."
      errors: [hypothetical]
    - tutor: "«Se gli dicessi»: congiuntivo imperfetto. E ti consiglio di non dirglielo né oggi né mai, se vuoi passare l'esame!"
      recast: {text: "Se gli direi", fix: "Se gli dicessi", tags: [hypothetical]}
    - learner: "Non glielo dirò mai, promesso. Stasera, però, provo le espressioni nuove con tua nonna: voglio vedere se mi corregge anche lei."
    - tutor: "Ti correggerà, e poi ti racconterà un'altra storia lunghissima. Preparati un caffè caldo prima di cominciare!"

- scenario: politica-lavoro
  # facts: il tutor, Paolo, ha una piccola panetteria con tre dipendenti, tra cui Marta, assunta due anni fa e pagata bene; il learner è spagnolo e lavora in un magazzino dove metà dei colleghi lavora per una cooperativa con un altro contratto e prende quasi trecento euro in meno; in Spagna il salario minimo esiste da molti anni ed è aumentato; in Italia ci sono i contratti collettivi; proposte del learner: un minimo fissato con buon senso, più ispettori, controlli nelle cooperative, multe e i piccoli imprenditori al tavolo; Paolo è d'accordo sui controlli e sul tavolo, non ancora sul livello
  level: C2
  persona: es-m-worker
  history: [passive, conditional-form, article-form]
  turns:
    - tutor: "Ieri sera al telegiornale parlavano ancora di salario minimo. Io ho una piccola panetteria con tre dipendenti, e ti confesso che la cosa mi spaventa un po'."
    - learner: "Ti capisco, ma ti racconto come la vedo io, che lavoro in un magazzino. In Spagna il salario minimo c'è da tanti anni e negli ultimi è aumentato parecchio; molti dicevano che sarebbe stato un disastro per i piccoli negozi, e invece il disastro non si è visto."
    - tutor: "Può darsi, ma la Spagna non è l'Italia. Qui per molti settori ci sono già i contratti collettivi: perché non bastano?"
      goals: [opinion]
    - learner: "Perché non coprono tutti allo stesso modo. Nel mio magazzino, per esempio, metà di noi lavora per una cooperativa con un altro contratto, e a fine mese, per le stesse ore e le stesse casse da spostare, si prende stipendi diversi di quasi trecento euro."
      errors: [passive]
      gold: {text: "si prende stipendi diversi", fix: "si prendono stipendi diversi"}
    - tutor: "Trecento euro per lo stesso lavoro sono un'ingiustizia, su questo hai ragione. Riprendi però «si prende stipendi diversi»: con questo «si», il verbo concorda con «stipendi». Come diventa?"
      goals: [example]
      prompt: {text: "si prende stipendi diversi", tags: [passive]}
    - learner: "Si prendono stipendi diversi, appunto. E un salario minimo per legge metterebbe un pavimento sotto tutti, cooperative comprese."
    - tutor: "Un pavimento, va bene. Ma se il pavimento è troppo alto, io che faccio? Alzo il prezzo del pane o licenzio qualcuno?"
      goals: [hypothesis]
    - learner: "Nessuna delle due. Il pavimento si può fissare con buon senso, e i tuoi dipendenti li paghi già più del minimo di cui si parla: anche due anni fa, quando hai assunto Marta, ti sembrerebbe ingiusto darle di meno."
      errors: [conditional-form]
      gold: {text: "ti sembrerebbe ingiusto", fix: "ti sarebbe sembrato ingiusto"}
    - tutor: "Marta la pago bene, è vero, e non tornerei indietro. Riprendi però «ti sembrerebbe ingiusto»: parli di due anni fa, un momento già chiuso. Quale condizionale serve?"
      prompt: {text: "ti sembrerebbe ingiusto", tags: [conditional-form]}
    - learner: "Ti sarebbe sembrato ingiusto, volevo dire. Quindi il salario minimo non colpirebbe te, ma chi oggi paga troppo poco."
    - tutor: "Detta così, quasi mi convinci. Ma resta un dubbio: chi controlla? Le leggi ci sono già, il problema è farle rispettare."
    - learner: "Questo è il punto più debole. Servirebbero più ispettori, controlli veri nelle cooperative e multe che facciano paura; e bisognerebbe ascoltare anche i piccoli imprenditori come te, che conoscono meglio di chiunque i sprechi e le furbizie del settore."
      errors: [article-form]
      gold: {text: "i sprechi", fix: "gli sprechi"}
    - tutor: "Ascoltare anche noi piccoli: questa è la prima proposta che mi tranquillizza davvero. Guarda solo «i sprechi»: «sprechi» comincia come «studenti» e «scontrini». Quale articolo plurale ci vuole?"
      prompt: {text: "i sprechi", tags: [article-form]}
    - learner: "Gli sprechi, come gli studenti. Allora ci stai: salario minimo, ma con più controlli e con voi piccoli al tavolo?"
    - tutor: "Ci sto a metà: firmo per i controlli e per il tavolo, sul livello del minimo ne riparliamo. Intanto assaggia questo pane, che è appena uscito dal forno."
      goals: [conclude]

- scenario: assemblea-condominio
  # facts: palazzo a Genova di venti famiglie; preventivo per la facciata: novemila euro a famiglia da versare entro sei mesi; la learner chiede di rinviare di un anno; obiezione del signor Ferrari, terzo piano: «Chi non ha i soldi si venda la casa»; tre famiglie di pensionati abitano lì da decenni; un pezzo di cornicione è già caduto sul marciapiede; messa in sicurezza dei cornicioni: venticinquemila euro, circa milleduecentocinquanta a famiglia, tre settimane; proposta: messa in sicurezza subito, tre preventivi entro marzo, rate in ventiquattro mesi; precedente dell'ascensore; approvata con un astenuto
  level: C2
  persona: en-f-professional
  history: [auxiliary-choice, passive, imperative-form]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Grazie, amministratore. Vorrei dire subito che nessuno qui nega che la facciata abbia bisogno di lavori; chiedo soltanto di rinviare l'intervento completo di un anno, perché novemila euro a famiglia, da versare entro sei mesi, per alcuni di noi sono una cifra proibitiva."
    - tutor: "Prendo nota. Le anticipo però l'obiezione del signor Ferrari, del terzo piano: «Chi non ha i soldi si venda la casa». Cito testualmente, purtroppo."
      goals: [position]
    - learner: "Capisco l'esasperazione del signor Ferrari, che aspetta questi lavori da anni, e non intendo rispondere con lo stesso tono. Ma in questo palazzo vivono tre famiglie di pensionati che ci abitano da prima che lui nascesse: vendere casa, per loro, non è un'opzione, è un esilio."
    - tutor: "Il signor Ferrari borbotta, ma mi pare che abbia incassato. E nel merito, che cosa propone concretamente?"
      goals: [defuse]
    - learner: "Propongo di separare l'urgente dal rinviabile. I cornicioni vanno messi in sicurezza subito, perché un pezzo è già caduto sul marciapiede; per il resto, chiederei altri preventivi, anche perché nell'ultimo anno i prezzi dei ponteggi hanno aumentato in modo vertiginoso."
      errors: [auxiliary-choice]
      gold: {text: "i prezzi dei ponteggi hanno aumentato", fix: "i prezzi dei ponteggi sono aumentati"}
    - tutor: "Separare l'urgente dal resto è un criterio che molti, qui, potrebbero accettare. Riprenda però «i prezzi dei ponteggi hanno aumentato»: senza complemento oggetto, «aumentare» indica un cambiamento di stato. Con quale ausiliare?"
      prompt: {text: "i prezzi dei ponteggi hanno aumentato", tags: [auxiliary-choice]}
    - learner: "Sono aumentati, ha ragione: i prezzi dei ponteggi sono aumentati in modo vertiginoso. Quanto costerebbe, secondo l'impresa, la sola messa in sicurezza dei cornicioni?"
    - tutor: "Venticinquemila euro in tutto, quindi circa milleduecentocinquanta a famiglia, per tre settimane di lavoro. Ma i condomini che vogliono tutto e subito come li convince?"
    - learner: "Con i numeri. In passato, in questo condominio, si sono già fatte scelte simili per l'ascensore, e nessuno se n'è pentito. Se rinviamo di un anno, si possono concordare rate in ventiquattro mesi invece di sei, e si può chiedere altri due preventivi."
      errors: [passive]
      gold: {text: "si può chiedere altri due preventivi", fix: "si possono chiedere altri due preventivi"}
    - tutor: "L'argomento dell'ascensore è abile, lo riconosco. Riascolti però «si può chiedere altri due preventivi»: poco prima ha detto correttamente «si possono concordare rate». Qui il verbo deve concordare con quale nome?"
      prompt: {text: "si può chiedere altri due preventivi", tags: [passive]}
    - learner: "Con «preventivi»: si possono chiedere altri due preventivi. E le rate, a quel punto, peserebbero molto meno su tutti."
    - tutor: "Allora metto ai voti: messa in sicurezza subito, nuovi preventivi e rate in ventiquattro mesi. Vuole formulare Lei la proposta per il verbale?"
      goals: [alternative]
    - learner: "Volentieri. Scriva pure: messa in sicurezza immediata dei cornicioni, tre preventivi entro marzo e rate in ventiquattro mesi per la facciata. E perché nessuno possa dire di non essere stato ascoltato, mettesse a verbale anche le obiezioni del signor Ferrari."
      errors: [imperative-form]
      gold: {text: "mettesse a verbale", fix: "metta a verbale"}
    - tutor: "Un gesto di stile verso il signor Ferrari. Riprenda però «mettesse a verbale»: è un invito rivolto a me adesso, come «scriva pure», non un desiderio ipotetico. Quale forma ci vuole?"
      prompt: {text: "mettesse a verbale", tags: [imperative-form]}
    - learner: "Mettessi a verbale anche le sue obiezioni, volevo dire."
      errors: [imperative-form]
    - tutor: "«Metta a verbale anche le sue obiezioni», dice, e lo faccio volentieri. Votiamo, allora: chi è favorevole alzi la mano."
      recast: {text: "Mettessi a verbale", fix: "Metta a verbale", tags: [imperative-form]}
    - learner: "Vedo quasi tutte le mani alzate, compresa quella del signor Ferrari, il che mi sorprende piacevolmente. Grazie a tutti: la facciata la rifaremo, ma senza costringere nessuno a scegliere tra la casa e la spesa."
    - tutor: "Approvata con un solo astenuto. Lo metto a verbale, e ci rivediamo a marzo con i preventivi. Adesso, signori, possiamo perfino andare a cena prima di mezzanotte."
      goals: [compromise]

- scenario: cena-suoceri
  # facts: casa elegante a Firenze; la madre di Giulia ha preparato l'arista, ricetta della suocera che la faceva solo a Natale; il learner è architetto in uno studio di Londra che recupera edifici industriali e li trasforma in scuole e biblioteche; la madre del learner vive a Londra; trasferimento a Firenze l'anno prossimo, cerca lavoro in uno studio del centro; battuta del padre sui napoletani e la pizza; il padre si chiama Paolo e propone il tu
  level: C2
  persona: en-m-heritage
  history: [combined-pronouns, subjunctive-form, conditional-form]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Sono in carne e ossa, glielo assicuro, anche se dopo tutto quello che Giulia mi ha raccontato di voi temevo anch'io di dovermi presentare a una commissione d'esame. Grazie per l'invito: la casa è splendida, e il profumo che arriva dalla cucina promette benissimo."
    - tutor: "Una commissione d'esame, addirittura. Però ha indovinato: mia moglie ha preparato l'arista, e qui chi non chiede il bis viene bocciato."
    - learner: "Allora mi preparo a non essere bocciato. Signora, l'arista è squisita e la salsa ancora di più: le chiederei volentieri la ricetta per mia madre e, se non è scortese, mi ne dà ancora un cucchiaio?"
      errors: [combined-pronouns]
      gold: {text: "mi ne dà", fix: "me ne dà"}
    - tutor: "Mia moglie arrossisce, e la ricetta gliela scriverà volentieri. Riprenda però «mi ne dà»: davanti a «ne», il pronome «mi» cambia vocale. Come diventa?"
      goals: [compliment]
      prompt: {text: "mi ne dà", tags: [combined-pronouns]}
    - learner: "Me ne dà ancora un cucchiaio, allora, senza vergogna. Ma mi dica, quest'arista è una ricetta di famiglia?"
    - tutor: "Di mia suocera, che la faceva solo a Natale. Ma mi parli di Lei: Giulia dice che fa l'architetto. Restaura, costruisce o, come molti suoi colleghi, si limita a criticare?"
    - learner: "Un po' di tutte e tre, temo. Lavoro in uno studio di Londra che si occupa del recupero di edifici industriali: vecchie fabbriche e magazzini che trasformiamo in scuole e biblioteche. Critico soprattutto i miei progetti, prima che lo facciano gli altri."
    - tutor: "Un architetto autocritico, specie rara. E i suoi progetti futuri prevedono di portarci via la figlia a Londra, o di regalarci un altro architetto a Firenze?"
    - learner: "Prevedono Firenze, se ci vorrete. Ci trasferiremo qui l'anno prossimo, e sto già cercando lavoro in uno studio del centro: è giusto che Giulia torni vicino a voi, e che io impari le vostre battute, a meno che lei non me le traduchi tutte."
      errors: [subjunctive-form]
      gold: {text: "non me le traduchi", fix: "non me le traduca"}
    - tutor: "«Se ci vorrete»: Lei sa come conquistare un padre. Riprenda però «non me le traduchi»: dopo «a meno che» il congiuntivo è giusto, ma quello di «tradurre», alla terza persona, finisce in un altro modo. Come?"
      goals: [background]
      prompt: {text: "non me le traduchi", tags: [subjunctive-form]}
    - learner: "A meno che lei non me le traduca tutte, appunto. Anche se temo che certe battute non abbiano traduzione."
    - tutor: "Ne ha appena sentita una, del resto. Un architetto inglese che viene a restaurare Firenze è come chi va a insegnare ai napoletani a fare la pizza."
    - learner: "Ha ragione, sarebbe una presunzione insopportabile. Infatti non vengo a insegnare niente: vengo a imparare, e se qualche napoletano volesse insegnarmi anche la pizza, accetterei volentieri. Del resto, con un suocero così, imparerò in fretta anche l'arte della battuta."
    - tutor: "Colpito e affondato. A questo punto possiamo anche darci del tu: io mi chiamo Paolo, e chi sopravvive alla prima cena con me se lo merita."
      goals: [irony]
    - learner: "Con molto piacere, Paolo, e grazie. Non osavo chiedertelo, perché Giulia mi aveva avvertito che il tu, in questa casa, va conquistato; ma confesso che già all'antipasto te lo proporrei io."
      errors: [conditional-form]
      gold: {text: "te lo proporrei io", fix: "te l'avrei proposto io"}
    - tutor: "Il tu si conquista, appunto, e tu ci sei riuscito. Riprendi però «te lo proporrei io»: parli dell'antipasto, un momento ormai passato, e di una cosa che non hai fatto. Quale condizionale serve?"
      goals: [tu-lei]
      prompt: {text: "te lo proporrei io", tags: [conditional-form]}
    - learner: "Hai ragione: già all'antipasto te l'avrei proposto io, ma non osavo. E adesso, se permetti, accetto anche il bis di arista."
    - tutor: "Permesso accordato: un genero che chiede il bis è promosso a pieni voti."

- scenario: circolo-lettura
  # facts: Il barone rampante di Calvino; Cosimo sale sugli alberi a dodici anni dopo il rifiuto di un piatto di lumache e non scende più; il fratello Biagio resta a terra ed è il narratore; Viola; gli spagnoli esiliati sugli alberi e i pirati; alla fine Cosimo si aggrappa alla corda di una mongolfiera e sparisce sul mare; prossimo libro proposto dalla learner: Le città invisibili, Marco Polo e Kublai Khan; il vino lo porta il tutor
  level: C2
  persona: es-f-teacher
  history: [adjective-agreement, participle-agreement, hypothetical]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: l'ho trovato commovente. Un ragazzo di dodici anni che, per una ribellione apparentemente capricciosa contro un piatto di lumache, decide di non scendere mai più dagli alberi, e mantiene la parola per tutta la vita: mi sembra più ostinato che insopportabile."
    - tutor: "Ostinato, certo, ma di un'ostinazione che alla lunga sa di egoismo. E il fratello Biagio, che fa da narratore, non ti pare un po' sacrificato?"
      goals: [impression]
    - learner: "Biagio è il contrappeso necessario: lui resta a terra, si sposa, amministra i beni di famiglia. Ma proprio la sua voce, che all'inizio può sembrare grigia e quasi notarile, alla fine del romanzo risulta struggente e sorprendentemente intenso."
      errors: [adjective-agreement]
      gold: {text: "sorprendentemente intenso", fix: "sorprendentemente intensa"}
    - tutor: "Sulla voce di Biagio sono d'accordo: è il vero segreto del libro. Guarda però «sorprendentemente intenso»: il soggetto, lontano, è «la sua voce», come mostra «grigia» qualche parola prima. Come deve finire?"
      prompt: {text: "sorprendentemente intenso", tags: [adjective-agreement]}
    - learner: "Sorprendentemente intensa, come grigia. E secondo te il tema centrale qual è? Io direi la libertà."
    - tutor: "Per me è la distanza: Cosimo sta sopra il mondo per vederlo meglio, ma così non lo tocca mai. Pensa a Viola: la ama, eppure la perde. Tu che esempio porteresti, per la libertà?"
    - learner: "Proprio Viola, ma al contrario: Cosimo la perde perché non accetta di scendere neanche per lei, ed è lì che la sua libertà diventa una gabbia. Calvino, mi pare, non ci dice se abbia avuto ragione; ci lascia con il dubbio, che è la cosa più onesta."
    - tutor: "Una libertà che diventa gabbia: bella formula. E lo stile? A me quell'ironia settecentesca a volte sembra un esercizio di bravura."
      goals: [theme]
    - learner: "Non sono d'accordo: l'ironia è il modo in cui Calvino tiene a distanza il sentimentalismo. Gli episodi dei pirati o degli spagnoli esiliati sugli alberi, per esempio: la prima volta li ho letto come puro divertimento, poi ho capito che parlano anche di politica."
      errors: [participle-agreement]
      gold: {text: "li ho letto", fix: "li ho letti"}
    - tutor: "Che l'ironia faccia da argine al sentimentalismo è un argomento serio. Riprendi però «li ho letto»: quel «li» sta per gli episodi, e il participio deve accordarsi. Come?"
      goals: [style]
      prompt: {text: "li ho letto", tags: [participle-agreement]}
    - learner: "Li ho letti, certo. E insisto: senza quell'ironia il romanzo sarebbe una favola triste, non un capolavoro."
    - tutor: "Va bene, non ti convinco. Allora difendi la tua lettura fino in fondo: il finale, con la mongolfiera, lo trovi davvero riuscito?"
    - learner: "Riuscitissimo. Cosimo non tocca terra nemmeno da morto: si aggrappa alla corda di una mongolfiera e sparisce sul mare. E credo che l'autore lo sapesse benissimo: avrebbe tradito tutto il libro, se Calvino l'avrebbe fatto morire in un letto."
      errors: [hypothetical]
      gold: {text: "se Calvino l'avrebbe fatto morire", fix: "se Calvino l'avesse fatto morire"}
    - tutor: "Sul fatto che un letto avrebbe tradito il libro ti do ragione. Riprendi però «se Calvino l'avrebbe fatto morire»: nella protasi di un'ipotesi passata il condizionale non regge. Che cosa ci vuole?"
      goals: [disagree]
      prompt: {text: "se Calvino l'avrebbe fatto morire", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se Calvino l'avesse fatto morire in un letto, avrebbe tradito il libro. E per il prossimo incontro proporrei «Le città invisibili»."
    - tutor: "Le città invisibili dopo il barone: resti fedele a Calvino. Perché proprio quello?"
    - learner: "Perché è l'opposto del barone: niente trama, solo immagini di città che forse non esistono, raccontate da Marco Polo a Kublai Khan. Dopo un romanzo d'avventura, una raccolta di sogni ci farebbe discutere ancora di più."
    - tutor: "Mi hai convinto: il mese prossimo Le città invisibili, e il vino lo porto io."
      goals: [recommend]

- scenario: condoglianze
  # facts: la madre del collega è morta a ottantotto anni, nel sonno; la learner l'ha conosciuta una volta, alla festa di Natale di due anni fa, quando portò in ufficio taralli fatti in casa; diceva che in ufficio si lavorava troppo e si mangiava troppo poco; la learner segue l'incontro con il cliente di Bari la settimana prossima; i file sono nella cartella condivisa «Bari», manca la parte sui costi; la learner li completa lunedì e li fa vedere lunedì sera; il collega tornerà in ufficio tra qualche giorno
  level: C2
  persona: en-f-professional
  history: [subjunctive-form, combined-pronouns, imperative-form]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe, non avrei potuto non venire. Mi dispiace moltissimo per sua madre; so quanto foste legati, e in ufficio, quando abbiamo saputo la notizia, ci siamo fermati tutti per un momento. Le porto l'abbraccio di tutto il gruppo."
    - tutor: "Grazie, lo apprezzo più di quanto riesca a dire. Aveva ottantotto anni, ed è andata via in pace, nel sonno: questo, almeno, ci consola."
      goals: [condolences]
    - learner: "È una consolazione vera, credo. L'ho conosciuta solo una volta, alla festa di Natale di due anni fa: girava tra le scrivanie con un vassoio di taralli fatti in casa, insisteva perché ognuno ne prendesse tre, e dubito che qualcuno ne abbi presi più di me."
      errors: [subjunctive-form]
      gold: {text: "ne abbi presi", fix: "ne abbia presi"}
    - tutor: "La rivedo ancora, mentre insiste con il vassoio: era fatta così. Riprenda però «ne abbi presi»: l'ausiliare «avere», al congiuntivo e alla terza persona singolare, ha un'altra forma. Quale?"
      goals: [memory]
      prompt: {text: "ne abbi presi", tags: [subjunctive-form]}
    - learner: "Ne abbia presi, scusi: dubito che qualcuno ne abbia presi più di me, e lei ne era felicissima."
    - tutor: "Lo era davvero: diceva sempre che in quell'ufficio lavoravamo troppo e mangiavamo troppo poco."
    - learner: "Aveva ragione, del resto. Senta, non vorrei essere invadente, ma la settimana prossima c'è l'incontro con il cliente di Bari: se per Lei va bene, lo seguo io, così può restare qui con la sua famiglia tutto il tempo che serve, senza pensare all'ufficio."
    - tutor: "Mi toglierebbe un peso enorme, glielo confesso. I documenti sono quasi pronti, manca solo la parte sui costi."
      goals: [offer-help]
    - learner: "Allora me ne occupo io, così non deve pensarci. Se mi dice dove ha salvato i file, li completo lunedì e, prima dell'incontro, gli li faccio vedere per email."
      errors: [combined-pronouns]
      gold: {text: "gli li faccio vedere", fix: "glieli faccio vedere"}
    - tutor: "Sono nella cartella condivisa, sotto «Bari». Riprenda però «gli li faccio vedere»: per dire «li faccio vedere a Lei», i due pronomi si fondono in una sola parola. Quale?"
      prompt: {text: "gli li faccio vedere", tags: [combined-pronouns]}
    - learner: "Glie li faccio vedere lunedì sera, allora."
      errors: [combined-pronouns]
    - tutor: "«Glieli faccio vedere lunedì sera»: mi va benissimo, li guardo con calma. Si ferma almeno per un caffè?"
      recast: {text: "Glie li faccio vedere", fix: "Glieli faccio vedere", tags: [combined-pronouns]}
    - learner: "Grazie, ma non voglio rubarle altro tempo: avrà mille cose da fare e tanta gente da ricevere. Mi prometta solo una cosa: se ha bisogno di qualsiasi cosa, anche solo di parlare, non si fa problemi e mi chiama a qualunque ora."
      errors: [imperative-form]
      gold: {text: "non si fa problemi e mi chiama", fix: "non si faccia problemi e mi chiami"}
    - tutor: "Glielo prometto. Riascolti però «non si fa problemi e mi chiama»: sono due inviti rivolti a me, come «mi prometta» poco prima. Quale forma devono avere?"
      prompt: {text: "non si fa problemi e mi chiama", tags: [imperative-form]}
    - learner: "Non si faccia problemi e mi chiami a qualunque ora. Adesso la lascio con i suoi, e la abbraccio di nuovo."
    - tutor: "Grazie ancora di essere venuta. Ci vediamo in ufficio tra qualche giorno."
      goals: [leave]

- scenario: dialetti-regionali
  # facts: treno da Milano a Napoli; uno dei due signori ha detto «tengo fame»; a Napoli «tenere» si usa spesso per «avere»; Napoli è stata sotto la corona spagnola per circa due secoli; parole napoletane entrate nell'italiano: «scugnizzo», «inciucio» (in origine pettegolezzo, in politica accordo poco limpido); il nonno del learner parlava galiziano in casa e castigliano in ufficio; in Galizia da trent'anni la lingua si insegna a scuola; il tutor è favorevole al napoletano come materia accanto all'italiano; a Napoli porterà il learner a vedere una commedia in napoletano e gli offrirà una sfogliatella
  level: C2
  persona: es-m-worker
  history: [auxiliary-choice, passive, article-form]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Ho capito poco, lo ammetto, ma mi ha colpito una cosa: uno dei due ha detto «tengo fame», e in spagnolo diciamo proprio «tengo hambre». Mi è sembrato di sentire un pezzo della mia lingua nascosto dentro l'italiano."
    - tutor: "Hai un buon orecchio! A Napoli «tenere» si usa spesso al posto di «avere», anche quando si parla italiano. E non è un caso: per circa due secoli Napoli è stata sotto la corona spagnola."
      goals: [notice]
    - learner: "Infatti ci pensavo: immagino che molte parole spagnole siano entrate nel napoletano in quel periodo. E poi, con l'emigrazione, il cinema e la televisione, diverse espressioni napoletane hanno passato nell'italiano di tutti, almeno in quello parlato."
      errors: [auxiliary-choice]
      gold: {text: "hanno passato nell'italiano di tutti", fix: "sono passate nell'italiano di tutti"}
    - tutor: "È vero, parecchie sono entrate nell'italiano comune: pensa a «scugnizzo» o a «inciucio». Riprendi però «hanno passato nell'italiano di tutti»: qui le espressioni si spostano da una lingua all'altra, senza oggetto. Quale ausiliare ci vuole?"
      goals: [example]
      prompt: {text: "hanno passato nell'italiano di tutti", tags: [auxiliary-choice]}
    - learner: "Sono passate nell'italiano di tutti, certo. E «inciucio» che cosa vuol dire esattamente? L'ho sentito in un telegiornale."
    - tutor: "In napoletano era il pettegolezzo, il chiacchiericcio; in politica è diventato un accordo poco limpido tra avversari. Ma dimmi: secondo te il dialetto rovina l'italiano o lo arricchisce?"
    - learner: "Lo arricchisce, purché uno sappia passare dall'uno all'altro. Mio nonno parlava galiziano in casa e castigliano in ufficio, e nessuna delle due lingue ha mai rovinato l'altra: anzi, quando gli mancava una parola in una, la trovava nell'altra."
    - tutor: "Galiziano e castigliano: allora il problema lo conosci bene. Qui però per decenni, a scuola, il dialetto è stato punito, e molti genitori ancora oggi non lo parlano ai figli."
      goals: [standard]
    - learner: "Lo so, ed è un peccato. Da noi in Galizia oggi i ragazzi parlano il galiziano senza vergognarsi, anche se in città lo si sente meno che in campagna: negli ultimi trent'anni, a scuola, si è fatto molti sforzi."
      errors: [passive]
      gold: {text: "si è fatto molti sforzi", fix: "si sono fatti molti sforzi"}
    - tutor: "Il caso della Galizia è interessante, e da noi se ne parla poco. Riascolta però «si è fatto molti sforzi»: con il «si» passivante, verbo e participio concordano con «molti sforzi». Come diventa?"
      prompt: {text: "si è fatto molti sforzi", tags: [passive]}
    - learner: "Si sono fatti molti sforzi, giusto. Quindi tu saresti favorevole a insegnare il napoletano nelle scuole?"
    - tutor: "Favorevole, sì, ma come materia accanto all'italiano, non al posto suo. E tu, alla fine, i dialetti li proteggeresti per legge?"
    - learner: "Li proteggerei, ma senza imbalsamarli: una lingua che vive solo nei musei è già morta. Preferirei che i comuni finanziassero canzoni e podcast, anche per chi, come me, se ne innamora in treno, e magari un spettacolo in dialetto ogni mese."
      errors: [article-form]
      gold: {text: "un spettacolo", fix: "uno spettacolo"}
    - tutor: "Una lingua viva, non imbalsamata: su questo siamo d'accordo. Riprendi solo «un spettacolo»: «spettacolo» comincia come «studente». Quale articolo indeterminativo vuole?"
      goals: [opinion]
      prompt: {text: "un spettacolo", tags: [article-form]}
    - learner: "Uno spettacolo, come uno studente. Allora, quando arriviamo a Napoli, mi porti a teatro?"
    - tutor: "Affare fatto: ti porto a vedere una commedia in napoletano, e se ridi al momento giusto ti offro anche una sfogliatella."

- scenario: email-rettore
  # facts: la learner è una ricercatrice con una borsa di sei mesi presso il Dipartimento di Biologia; esclusa dal bando per il laboratorio di microscopia perché la domanda risulta arrivata un giorno dopo la scadenza; la piattaforma era bloccata, ha le schermate; il giorno della scadenza aveva scritto all'ufficio, che aveva promesso di ricontattarla entro una settimana, senza seguito; obiettivo: la riammissione; formula d'apertura «Magnifico Rettore,»; chiusura scelta «Con osservanza»; versione definitiva stasera, rilettura domattina
  level: C2
  persona: en-f-student
  history: [conditional-form, hypothetical, adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Sono qui con una borsa di ricerca di sei mesi e avevo presentato domanda per usare il laboratorio di microscopia, ma mi hanno esclusa perché la domanda risulta arrivata un giorno dopo la scadenza. In realtà la piattaforma era bloccata, e ho le schermate che lo dimostrano."
    - tutor: "Se ha le schermate, il caso è solido. Che cosa vuole ottenere, precisamente: la riammissione o soltanto una revisione?"
    - learner: "La riammissione, se possibile. Il bando, nel frattempo, si è chiuso, ma io avevo scritto all'ufficio competente già il giorno della scadenza, e mi avevano risposto che qualcuno mi ricontatterebbe entro una settimana. Poi, più niente."
      errors: [conditional-form]
      gold: {text: "qualcuno mi ricontatterebbe", fix: "qualcuno mi avrebbe ricontattata"}
    - tutor: "È un elemento importante da citare nella lettera. Riprenda però «qualcuno mi ricontatterebbe»: la risposta è passata, e quella settimana era il futuro di allora. Quale condizionale richiede la concordanza dei tempi?"
      goals: [situation]
      prompt: {text: "qualcuno mi ricontatterebbe", tags: [conditional-form]}
    - learner: "Il condizionale passato: mi avevano risposto che qualcuno mi avrebbe ricontattata entro una settimana. Come comincio la lettera, allora?"
    - tutor: "Al Rettore ci si rivolge tradizionalmente con «Magnifico Rettore», seguito dalla virgola. Poi una prima frase che dica subito chi è e perché scrive."
      goals: [opening-formula]
    - learner: "«Magnifico Rettore, sono titolare di una borsa di ricerca presso il Dipartimento di Biologia e mi permetto di scriverLe in merito alla mia esclusione dal bando per l'accesso al laboratorio di microscopia.» Le sembra un inizio adeguato?"
    - tutor: "Adeguato e misurato. Ora viene il punto delicato: mi legga la frase in cui contesta la decisione."
    - learner: "Avevo scritto: «La decisione è ingiusta e va annullata». Lo so, è troppo diretta. Forse potrei scrivere che la mia domanda sarebbe arrivata nei termini previsti, se la piattaforma avrebbe funzionato regolarmente."
      errors: [hypothetical]
      gold: {text: "se la piattaforma avrebbe funzionato", fix: "se la piattaforma avesse funzionato"}
    - tutor: "Spostare l'accento sul guasto, invece che sull'ingiustizia, è la strada giusta. Riprenda però «se la piattaforma avrebbe funzionato»: nella protasi di un'ipotesi passata, quale modo si usa?"
      prompt: {text: "se la piattaforma avrebbe funzionato", tags: [hypothetical]}
    - learner: "Se la piattaforma funzionava regolarmente, volevo dire."
      errors: [hypothetical]
    - tutor: "«Se la piattaforma avesse funzionato»: per un'ipotesi passata che non si è realizzata ci vuole il congiuntivo trapassato. Riprovi pure la frase intera."
      recast: {text: "Se la piattaforma funzionava", fix: "Se la piattaforma avesse funzionato", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se la piattaforma avesse funzionato regolarmente, la mia domanda sarebbe arrivata nei termini previsti. Poi aggiungerei la richiesta vera e propria."
    - tutor: "Bene. E la richiesta come la formulerebbe? A un Rettore non si chiede: si confida."
    - learner: "Allora: «Confido pertanto che Lei voglia valutare la mia riammissione, alla luce di circostanze che documento con le schermate allegate e che, come potrà constatare, sono del tutto indipendente dalla mia volontà.»"
      errors: [adjective-agreement]
      gold: {text: "del tutto indipendente", fix: "del tutto indipendenti"}
    - tutor: "Quanto al tono, ci siamo: fermo e cortese. Riprenda solo «del tutto indipendente»: il soggetto, lontano, è «circostanze». Come deve concordare l'aggettivo?"
      goals: [tone]
      prompt: {text: "del tutto indipendente", tags: [adjective-agreement]}
    - learner: "Sono del tutto indipendenti dalla mia volontà, certo. E per chiudere? «Distinti saluti» mi sembra un po' freddo."
    - tutor: "Per un Rettore è più indicato «Con osservanza» oppure, meno solenne, «Con i più cordiali saluti», seguito da nome e qualifica."
    - learner: "Scelgo «Con osservanza»: mi piace che suoni un po' antico, quasi da archivio. Così, almeno nella forma, nessuno potrà rimproverarmi niente."
    - tutor: "Ottima scelta. Me la rimandi stasera in versione definitiva, e gliela rileggo domattina prima che la invii."
      goals: [closing]

- scenario: intervista-radio
  # facts: il libro della learner si intitola «Mezz'ora di ritardo» e racconta dodici anni a Torino attraverso il rapporto degli italiani con il tempo; la learner è spagnola e puntuale; il ritardo come linguaggio: il treno puntuale, la cena tra amici no; al suo matrimonio il prete è arrivato con quaranta minuti di ritardo e le due sorelle venute da Siviglia si sono messe a ridere; l'italiano le ha insegnato a sfumare; battuta finale sul ritardo come affetto
  level: C2
  persona: es-f-teacher
  history: [subjunctive-form, participle-agreement, passive]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere essere qui, incoscienza compresa. Il libro si intitola «Mezz'ora di ritardo» e racconta i miei dodici anni a Torino attraverso un'ossessione: il rapporto degli italiani con il tempo, che per una spagnola puntuale come me è stato un trauma e una scuola."
    - tutor: "Una spagnola puntuale: ci sta già smontando uno stereotipo. Ma allora lo confermi: gli italiani sono tutti ritardatari?"
      goals: [present-book]
    - learner: "Non esattamente: il ritardo italiano è un linguaggio, non un difetto. Il treno deve arrivare puntuale, la cena tra amici no; e guai a chi si presenta in anticipo, perché è come pretendere che la padrona di casa sii già pronta."
      errors: [subjunctive-form]
      gold: {text: "sii già pronta", fix: "sia già pronta"}
    - tutor: "Il ritardo come linguaggio: me lo segno. Riprenda però «sii già pronta»: «sii» è l'imperativo rivolto a un tu; qui, al congiuntivo, quale forma serve?"
      goals: [stereotype]
      prompt: {text: "sii già pronta", tags: [subjunctive-form]}
    - learner: "Che la padrona di casa sia già pronta, certo. Ho fatto confusione con l'imperativo."
    - tutor: "Succede anche ai ministri. Ci racconta un episodio che spieghi bene questa sua teoria?"
    - learner: "Il mio matrimonio. Avevo organizzato tutto al minuto, e alle undici in punto ero in chiesa. Il prete è arrivato con quaranta minuti di ritardo, tranquillissimo, e intanto le mie due sorelle, venute da Siviglia, si sono messo a ridere senza riuscire a smettere."
      errors: [participle-agreement]
      gold: {text: "si sono messo a ridere", fix: "si sono messe a ridere"}
    - tutor: "Un prete che arriva con comodo, con la sposa in chiesa da quaranta minuti: magnifico. Riprenda però «si sono messo a ridere»: con «essere», il participio concorda con «le mie due sorelle». Come diventa?"
      goals: [anecdote]
      prompt: {text: "si sono messo a ridere", tags: [participle-agreement]}
    - learner: "Si sono messa a ridere senza riuscire a smettere."
      errors: [participle-agreement]
    - tutor: "Si sono messe a ridere senza riuscire a smettere, e immagino la faccia dello sposo. E la lingua? Che cosa le ha cambiato, dentro, l'italiano?"
      recast: {text: "Si sono messa a ridere", fix: "Si sono messe a ridere", tags: [participle-agreement]}
    - learner: "Mi ha insegnato il dubbio. In spagnolo il congiuntivo lo uso anch'io, ma l'italiano mi ha insegnato a sfumare, a dire «mi pare», «direi», «non è detto che»: sono diventata meno categorica, e credo anche un po' più gentile, almeno al telefono."
    - tutor: "Meno categorica e più gentile: in una parola, più torinese. Ma lo sa che molti italiani il congiuntivo lo stanno perdendo?"
      goals: [language]
    - learner: "Lo so, e me ne dispiace. Nelle scuole si dovrebbe dedicare più tempo alla lettura, perché il congiuntivo non si impara con le regole: si impara leggendo, e oggi si legge pochi libri, soprattutto fuori dalle grandi città."
      errors: [passive]
      gold: {text: "si legge pochi libri", fix: "si leggono pochi libri"}
    - tutor: "Si impara leggendo: sottoscrivo. Riascolti però «si legge pochi libri»: con il «si» passivante, il verbo concorda con «pochi libri». Come diventa?"
      prompt: {text: "si legge pochi libri", tags: [passive]}
    - learner: "Si leggono pochi libri, certo: proprio io, che sul tema ho appena scritto un libro intero."
    - tutor: "Il tempo stringe, siamo quasi alla pubblicità. Ci lascia con una battuta?"
    - learner: "Volentieri: in Italia ho imparato che arrivare puntuali è una forma di sfiducia, e arrivare in ritardo una forma d'affetto. Quindi, cari ascoltatori, se domani in libreria trovate il mio libro con mezz'ora di ritardo, sappiate che vi voglio bene."
    - tutor: "Più memorabile di così non si poteva. Grazie, e a voi, cari ascoltatori, buon ritardo a tutti!"
      goals: [farewell]

- scenario: poesia-montale
  # facts: «Spesso il male di vivere ho incontrato»: il rivo strozzato che gorgoglia, l'incartocciarsi della foglia riarsa, il cavallo stramazzato; anafora di «era»; rime gorgoglia/foglia e incontrato/stramazzato; seconda strofa: la divina Indifferenza, la statua nella sonnolenza del meriggio, la nuvola, il falco alto levato; la prossima settimana «Meriggiare pallido e assorto», dagli Ossi di seppia
  level: C2
  persona: en-m-retired
  history: [adjective-agreement, auxiliary-choice, hypothetical]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Mi è rimasta addosso una sensazione di aridità, come se la poesia non volesse consolarmi. Il male di vivere non viene spiegato: viene mostrato attraverso tre immagini concrete, il ruscello, la foglia e il cavallo, e questo lo rende quasi fisico."
    - tutor: "«Quasi fisico» è esattamente la parola. Si fermi su una di quelle immagini: quale l'ha colpita di più, e perché?"
      goals: [first-reading]
    - learner: "Il rivo strozzato che gorgoglia. È un'immagine sonora prima che visiva: l'acqua che vorrebbe scorrere e non può. Quell'aggettivo, «strozzato», applicato a un ruscello, mi è sembrato violento, quasi umano, e la parola che lo segue, con le sue «g», ancora più soffocato."
      errors: [adjective-agreement]
      gold: {text: "ancora più soffocato", fix: "ancora più soffocata"}
    - tutor: "Sull'effetto sonoro di «gorgoglia» ha perfettamente ragione: la gola si chiude davvero. Riprenda però «ancora più soffocato»: il soggetto, lontano, è «la parola che lo segue». Come deve concordare?"
      goals: [image]
      prompt: {text: "ancora più soffocato", tags: [adjective-agreement]}
    - learner: "Ancora più soffocata, certo: la parola che lo segue suona ancora più soffocata. E la rima con «foglia», poi, prolunga quel rumore."
    - tutor: "Ecco, ci arriva da solo: «gorgoglia» rima con «foglia», e «incontrato» con «stramazzato». Che cosa nota nel ritmo della prima strofa?"
    - learner: "Noto la ripetizione di «era», tre volte, come una litania. Ogni immagine aggiunge un grado di morte: l'acqua è ancora viva, la foglia è secca, il cavallo è caduto; e alla fine il ritmo, rimasto regolare fino a lì, ha crollato con lui."
      errors: [auxiliary-choice]
      gold: {text: "ha crollato con lui", fix: "è crollato con lui"}
    - tutor: "La progressione verso la morte è una lettura convincente. Riprenda però «ha crollato con lui»: «crollare» non regge mai un oggetto, indica un cambiamento di stato. Quale ausiliare vuole?"
      goals: [sound]
      prompt: {text: "ha crollato con lui", tags: [auxiliary-choice]}
    - learner: "È crollato con lui, giusto: il ritmo è crollato insieme al cavallo stramazzato."
    - tutor: "E la seconda strofa? Lì il tono cambia: che cosa le pare che sia, quel «bene»?"
    - learner: "Il bene non è il contrario del male, ma un'assenza: la divina Indifferenza, cioè la capacità di non sentire. La statua, la nuvola e il falco stanno lontani, immobili o in alto, come se l'unica salvezza fosse distaccarsi dal mondo invece di cambiarlo."
    - tutor: "Una salvezza per distacco, sì: è una delle letture più condivise. Ma non le sembra una conclusione troppo amara per un poeta così giovane?"
    - learner: "Amara, ma lucida. Anzi, mi chiedo se avrebbe avuto senso il contrario. Quell'indifferenza continua a inquietarci, mentre la poesia oggi ci sembrerebbe datata, se Montale proporrebbe una consolazione facile."
      errors: [hypothetical]
      gold: {text: "se Montale proporrebbe", fix: "se Montale proponesse"}
    - tutor: "Che la sua forza stia proprio nel rifiuto della consolazione lo penso anch'io. Riprenda però «se Montale proporrebbe»: nella protasi dell'ipotesi, quale modo ci vuole?"
      goals: [meaning]
      prompt: {text: "se Montale proporrebbe", tags: [hypothetical]}
    - learner: "Allora: se Montale offrirebbe una consolazione facile, la poesia ci sembrerebbe datata."
      errors: [hypothetical]
    - tutor: "Se Montale offrisse una consolazione facile, la poesia ci sembrerebbe datata: ha ragione, e su questo possiamo chiudere. La prossima settimana leggiamo «Meriggiare pallido e assorto», così ritroveremo il meriggio della statua."
      recast: {text: "se Montale offrirebbe", fix: "se Montale offrisse", tags: [hypothetical]}
    - learner: "Un'altra poesia degli «Ossi di seppia», allora. Grazie, è stata una lettura che mi porterò dietro per tutta la settimana."
    - tutor: "Grazie a Lei, e a tutti. Alla prossima settimana, con il meriggio e con i suoi silenzi."

# Set r-morph-late, file 2 (C1): town hall, registry office, debates, radio, renting, insurance,
# a cardiologist and a restaurant. Formal scenes (Lei): one small morphology slip late in a long
# turn, prompted with a precise clue, beside long correct turns with the same structures.
- scenario: reclamo-comune
  # facts: il learner abita in via dei Mille 14; cantiere per la rete del gas aperto il 3 marzo (compleanno della moglie) e abbandonato, con transenne e una buca davanti al portone; il cartello della ditta non c'è più; la moglie usa il bastone; competenza dell'Ufficio Lavori Pubblici, controllo del Comune; segnalazione urgente per pericolo; il Comune risponde per iscritto entro trenta giorni, poi ci si può rivolgere al Difensore civico; protocollo 2417; sopralluogo di un tecnico entro dieci giorni lavorativi; aggiunti due lampioni spenti
  level: C1
  persona: en-m-retired
  history: [auxiliary-choice, imperative-form, passive]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via dei Mille, al numero 14, e davanti al mio portone c'è un cantiere per la rete del gas: l'hanno aperto a marzo, hanno lasciato transenne e una buca enorme, e da allora non si è più visto nessuno."
    - tutor: "Capisco. Si ricorda la data esatta dell'apertura, o il nome della ditta scritto sul cartello del cantiere?"
    - learner: "Il cartello l'ha portato via il vento, ma la data la ricordo: era il 3 marzo, il compleanno di mia moglie. Mia moglie usa il bastone e fa il giro dell'isolato per entrare in casa, e da quel giorno hanno passato più di due mesi."
      errors: [auxiliary-choice]
      gold: {text: "hanno passato più di due mesi", fix: "sono passati più di due mesi"}
    - tutor: "Per sua moglie dev'essere davvero faticoso. Riprenda però «hanno passato più di due mesi»: qui il soggetto sono i mesi, che scorrono da soli, senza un oggetto. Quale ausiliare vuole allora il verbo?"
      goals: [describe]
      prompt: {text: "hanno passato più di due mesi", tags: [auxiliary-choice]}
    - learner: "Sono passati più di due mesi, scusi. Ma chi se ne occupa, esattamente? Ogni volta che chiamo il centralino mi passano un ufficio diverso."
    - tutor: "I cantieri stradali sono di competenza dell'Ufficio Lavori Pubblici: noi raccogliamo il reclamo e lo inoltriamo a loro. In genere, però, questi ritardi dipendono dalla ditta."
    - learner: "Mi scusi, ma «in genere» non mi basta. Vorrei sapere chi deve controllare che la ditta finisca i lavori, perché una buca aperta da due mesi davanti a un portone è un pericolo, non un semplice ritardo."
    - tutor: "Ha ragione, il controllo spetta al Comune. Posso aprire una segnalazione urgente per pericolo, che ha la precedenza sui reclami normali. Vuole che la registri così?"
      goals: [insist]
    - learner: "Sì, la registri come urgente, grazie. E già che ci siamo, mi spiega anche la procedura? Se tra un mese la buca è ancora lì vorrei sapere a chi rivolgermi, e abbi pazienza se insisto, ma con mia moglie non posso aspettare."
      errors: [imperative-form]
      gold: {text: "abbi pazienza", fix: "abbia pazienza"}
    - tutor: "La procedura è questa: il Comune deve risponderle per iscritto entro trenta giorni, e senza risposta può rivolgersi al Difensore civico. Riprenda però «abbi pazienza»: a me dà del Lei, e con il Lei questo imperativo ha un'altra forma. Quale?"
      goals: [rights]
      prompt: {text: "abbi pazienza", tags: [imperative-form]}
    - learner: "Abbia pazienza, volevo dire. Allora mi dà un numero di protocollo, così posso citarlo quando richiamo?"
    - tutor: "Certo: il suo numero di protocollo è 2417. Entro dieci giorni lavorativi un tecnico farà un sopralluogo in via dei Mille."
    - learner: "Dieci giorni lavorativi, quindi entro la fine del mese. Accanto al cantiere ci sono anche due lampioni spenti: spero che dopo il sopralluogo si chiuda davvero la buca e che si rimetta a posto anche i due lampioni."
      errors: [passive]
      gold: {text: "si rimetta a posto anche i due lampioni", fix: "si rimettano a posto anche i due lampioni"}
    - tutor: "Aggiungo anche i lampioni alla segnalazione, così il tecnico li controlla. Rilegga però «si rimetta a posto anche i due lampioni»: con il «si» passivante, il verbo concorda con «i due lampioni». Come diventa?"
      prompt: {text: "si rimetta a posto anche i due lampioni", tags: [passive]}
    - learner: "Che si rimettano a posto anche i due lampioni, certo. Grazie per l'aiuto, allora aspetto il tecnico."
    - tutor: "Prego. Tenga il numero 2417 e, se il tecnico non passa entro dieci giorni lavorativi, ci richiami pure."
      goals: [commitment]

- scenario: burocrazia-residenza
  # facts: numero 47; la learner è spagnola, a Torino da settembre per un dottorato, chiede la residenza per scegliere un medico di base; ha passaporto e codice fiscale; contratto non ancora registrato: il proprietario aveva promesso di farlo a novembre, ora dice entro la settimana prossima; il proprietario vive a Valencia e le manda la ricevuta per email; la ricevuta della registrazione vale come documento; appuntamento online sul sito del Comune, sezione Anagrafe, meglio di mattina; accertamento dei vigili entro quarantacinque giorni, se non la trovano lasciano un avviso e ripassano; nome sul campanello già scritto
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-form, conditional-form, combined-pronouns, article-form]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono spagnola, vivo a Torino da settembre per un dottorato e vorrei chiedere la residenza. Mi hanno detto che senza residenza non posso neanche scegliere un medico di base, ed è proprio quello che mi serve."
    - tutor: "Va bene, facciamo la domanda di residenza. Ha con sé il passaporto, il codice fiscale e il contratto d'affitto registrato?"
      goals: [request]
    - learner: "Il passaporto e il codice fiscale sì. Il contratto ce l'ho, ma il proprietario non l'ha ancora registrato: mi ha detto di aspettare che il suo commercialista finischi le pratiche di fine mese."
      errors: [subjunctive-form]
      gold: {text: "finischi", fix: "finisca"}
    - tutor: "Senza registrazione, purtroppo, il contratto non basta. Riprenda però «finischi»: dopo «aspettare che» ci vuole il congiuntivo di «finire», terza persona singolare. Che desinenza prende?"
      prompt: {text: "finischi", tags: [subjunctive-form]}
    - learner: "Finisca: devo aspettare che il commercialista finisca le pratiche. Quindi oggi non posso fare niente, o c'è un'altra possibilità?"
    - tutor: "Una possibilità c'è: appena il proprietario registra il contratto, mi porta la ricevuta della registrazione, che vale come documento. Sa più o meno quando lo farà?"
      goals: [documents]
    - learner: "Veramente se n'è dimenticato: adesso dice entro la settimana prossima. Intanto, posso prenotare un appuntamento online, per non aspettare un'altra ora qui? Non mi fido più molto, perché mi aveva promesso che lo registrerebbe già a novembre."
      errors: [conditional-form]
      gold: {text: "lo registrerebbe già a novembre", fix: "l'avrebbe registrato già a novembre"}
    - tutor: "Sì, può prenotare sul sito del Comune, nella sezione Anagrafe. Riprenda però «lo registrerebbe già a novembre»: la promessa è passata, e novembre era il futuro di quel momento. Quale condizionale serve?"
      prompt: {text: "lo registrerebbe già a novembre", tags: [conditional-form]}
    - learner: "Il condizionale passato: mi aveva promesso che l'avrebbe registrato già a novembre."
    - tutor: "Adesso è giusto. Quando prenota, scelga un giorno di mattina, perché ci sono più posti liberi."
      goals: [problem]
    - learner: "Perfetto, prenoto online. Il proprietario vive a Valencia, ma mi ha detto che la ricevuta me la manda per email appena registra il contratto. Allora la stampo e, se Lei è d'accordo, se la porto la settimana prossima con il passaporto."
      errors: [combined-pronouns]
      gold: {text: "se la porto", fix: "gliela porto"}
    - tutor: "Sì, stampata va benissimo. Guardi però «se la porto»: in italiano, per dire «la ricevuta a Lei», il primo pronome non è «se». Come si forma?"
      prompt: {text: "se la porto", tags: [combined-pronouns]}
    - learner: "Gliela porto, come glielo, giusto? Allora gliela porto la settimana prossima."
    - tutor: "Proprio così. Dopo la consegna, i vigili passeranno a casa sua per l'accertamento entro quarantacinque giorni."
    - learner: "Devo essere per forza in casa quando passano i vigili? Durante il giorno sono quasi sempre in laboratorio all'università, e non vorrei che la pratica venisse respinta solo perché non mi hanno trovata."
    - tutor: "Non per forza: se non la trovano, lasciano un avviso e ripassano un'altra volta. Le consiglio però di scrivere il suo nome sul campanello e sulla cassetta delle lettere."
    - learner: "Il nome sul campanello c'è già, l'ho scritto il primo giorno. Quindi, ricapitolando: ricevuta, appuntamento online e poi l'accertamento, e dopo potrò finalmente scegliere un medico e iscrivermi ai corsi gratuiti per i stranieri."
      errors: [article-form]
      gold: {text: "per i stranieri", fix: "per gli stranieri"}
    - tutor: "Il riepilogo è completo. Rilegga solo «per i stranieri»: «stranieri» comincia come «studenti» e «spagnoli». Quale articolo plurale vogliono queste parole?"
      prompt: {text: "per i stranieri", tags: [article-form]}
    - learner: "Per gli stranieri, come gli studenti. Grazie mille, allora ci vediamo la settimana prossima."
    - tutor: "Prego, a presto. E se la ricevuta tarda, mi chiami pure prima di prenotare."
      goals: [next]

- scenario: dibattito-ambiente
  # facts: il tutor ha un forno in corso Garibaldi, furgone delle consegne alle sei del mattino; la learner insegna in una scuola del centro; l'anno scorso un tratto della sua via è stato chiuso per i lavori dell'acquedotto e, secondo la centralina vicino alla scuola, le polveri sottili sono calate di quasi un terzo; in quei mesi gli incassi del tutor sono crollati; proposta finale: chiusura dalle dieci alle venti, carico e scarico prima, permessi per i residenti; da portare all'assemblea del mese prossimo
  level: C1
  persona: es-f-teacher
  history: [auxiliary-choice, hypothetical, adjective-agreement]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io la penso diversamente: credo che chiudere il centro alle auto sia una buona idea, a patto che lo si faccia con gradualità e che si ascoltino anche i commercianti come Lei, che hanno paura di perdere clienti."
    - tutor: "Paura, dice? Io ho un forno in corso Garibaldi, e il furgone delle consegne arriva alle sei del mattino. Senza auto, come lavoro?"
      goals: [position]
    - learner: "Per le consegne si potrebbero lasciare delle fasce orarie, per esempio dalle sei alle dieci. Il mio primo argomento, però, riguarda i bambini: insegno in una scuola del centro, e se ci fossero meno macchine i genitori lascerebbero andare i figli a piedi."
    - tutor: "Le fasce orarie sono già qualcosa, lo ammetto. Ma i bambini a piedi non mi bastano per chiudere bottega. Ha un secondo argomento?"
    - learner: "Il secondo è l'aria. L'anno scorso hanno chiuso un tratto della mia via per i lavori dell'acquedotto, e in quei mesi, secondo i dati della centralina vicino alla scuola, le polveri sottili hanno diminuito quasi di un terzo."
      errors: [auxiliary-choice]
      gold: {text: "le polveri sottili hanno diminuito", fix: "le polveri sottili sono diminuite"}
    - tutor: "Che l'aria fosse migliore durante quei lavori lo ricordo anch'io. Però riprenda «le polveri sottili hanno diminuito»: le polveri non riducono qualcosa, calano da sole. Quale ausiliare ci vuole, allora?"
      goals: [argue]
      prompt: {text: "le polveri sottili hanno diminuito", tags: [auxiliary-choice]}
    - learner: "Sono diminuite, certo: in quei mesi le polveri sottili sono diminuite quasi di un terzo. Le sembra poco?"
    - tutor: "Non mi sembra poco, no. Ma in quei mesi i miei incassi sono crollati, e quando la via è stata riaperta l'aria è tornata quella di prima. Questo come lo spiega?"
    - learner: "Lo spiego con il fatto che quella era una chiusura improvvisa, senza parcheggi alternativi né autobus in più. Forse anche i suoi clienti, almeno quelli più fedeli, sarebbero venuti lo stesso, se il Comune avrebbe messo un bus elettrico ogni dieci minuti."
      errors: [hypothetical]
      gold: {text: "se il Comune avrebbe messo", fix: "se il Comune avesse messo"}
    - tutor: "Un bus elettrico ogni dieci minuti, dice. Riascolti però «se il Comune avrebbe messo»: nella frase con «se», per un'ipotesi che non si è realizzata, quale modo ci vuole?"
      prompt: {text: "se il Comune avrebbe messo", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se il Comune avesse messo un bus elettrico, forse i suoi clienti sarebbero venuti lo stesso."
    - tutor: "Così va bene. Forse, dice: ma con un forno non si vive di forse. Che cosa mi offre, in concreto?"
      goals: [counter]
    - learner: "Le concedo che le consegne vanno garantite e che una chiusura di colpo sarebbe un errore. Propongo la chiusura dalle dieci alle venti, carico e scarico libero prima e permessi per i residenti: condizioni che, se scritte bene, mi sembrano abbastanza equilibrato."
      errors: [adjective-agreement]
      gold: {text: "abbastanza equilibrato", fix: "abbastanza equilibrate"}
    - tutor: "Dalle dieci alle venti, con le consegne prima: questa proposta comincio a capirla. Rilegga solo «abbastanza equilibrato»: l'aggettivo si riferisce a «condizioni». Come deve finire?"
      prompt: {text: "abbastanza equilibrato", tags: [adjective-agreement]}
    - learner: "Equilibrate, perché «condizioni» è femminile plurale. Allora possiamo presentarla insieme all'assemblea del mese prossimo?"
    - tutor: "Se resta scritto che le consegne sono libere fino alle dieci, la firmo anch'io. La portiamo insieme all'assemblea, allora."
      goals: [concede]

- scenario: turismo-di-massa
  # facts: il learner si chiama Luca, guida turistica a Verona da dodici anni, contrario al ticket, favorevole a limitare i gruppi; la domenica in piazza delle Erbe a volte dieci gruppi da cinquanta persone insieme; due anni fa in Comune gli avevano promesso la prenotazione per l'estate successiva, poi niente; proposta: prenotazione gratuita online per i gruppi sopra le venti persone, limite di pullman al giorno, multe destinate ai servizi per i residenti, un responsabile per agenzia che comunichi gli orari
  level: C1
  persona: en-m-heritage
  history: [passive, conditional-form, subjunctive-form]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Mi chiamo Luca, faccio la guida turistica a Verona da dodici anni e sono contrario al ticket: far pagare l'ingresso a una città la trasforma in un museo, mentre io preferirei limitare i gruppi organizzati."
    - tutor: "Una guida contraria al ticket, interessante. Ma limitare i gruppi non sarebbe un danno proprio per chi fa il suo mestiere?"
      goals: [introduce]
    - learner: "Forse sì, ma lavorerei meglio. La domenica, in piazza delle Erbe, ci sono a volte dieci gruppi da cinquanta persone nello stesso momento, e con quella folla non si può nemmeno sentire le spiegazioni né vedere i monumenti con calma."
      errors: [passive]
      gold: {text: "non si può nemmeno sentire le spiegazioni", fix: "non si possono nemmeno sentire le spiegazioni"}
    - tutor: "Dieci gruppi insieme in una piazza sono davvero troppi, su questo le do ragione. Però riprenda «non si può nemmeno sentire le spiegazioni»: con il «si» passivante, il verbo «potere» concorda con «le spiegazioni». Come diventa?"
      goals: [example]
      prompt: {text: "non si può nemmeno sentire le spiegazioni", tags: [passive]}
    - learner: "Non si possono nemmeno sentire le spiegazioni, né vedere i monumenti con calma."
    - tutor: "Ecco. Ma Venezia il suo contributo d'accesso l'ha provato, e almeno se n'è parlato in tutto il mondo. Perché un limite ai gruppi dovrebbe funzionare meglio di un ticket?"
    - learner: "Perché il ticket colpisce il turista singolo che arriva in treno, mentre il problema sono i pullman che scaricano migliaia di persone in poche ore. Se si limitassero i gruppi, la città resterebbe aperta a tutti, ma senza quelle ondate improvvise."
    - tutor: "Bella teoria. Le agenzie di viaggio, però, le direbbero che così si penalizzano i turisti meno ricchi, quelli che viaggiano solo in gruppo. Che cosa risponde?"
    - learner: "Rispondo che la prenotazione per i gruppi sarebbe gratuita, quindi nessuno verrebbe escluso per motivi economici. Ne avevamo già parlato due anni fa in Comune, e ci avevano assicurato che il Comune introdurrebbe la prenotazione entro l'estate successiva."
      errors: [conditional-form]
      gold: {text: "il Comune introdurrebbe la prenotazione", fix: "il Comune avrebbe introdotto la prenotazione"}
    - tutor: "Una prenotazione gratuita toglie in effetti l'argomento del prezzo. Riprenda però «il Comune introdurrebbe la prenotazione»: parla di una promessa di due anni fa, cioè di un futuro visto dal passato. Quale condizionale serve?"
      goals: [rebut]
      prompt: {text: "il Comune introdurrebbe la prenotazione", tags: [conditional-form]}
    - learner: "Il condizionale passato: ci avevano assicurato che il Comune avrebbe introdotto la prenotazione entro l'estate successiva. Poi non se n'è fatto niente."
    - tutor: "Così è corretto. E allora, se domani potesse decidere Lei, quale sarebbe la sua proposta concreta?"
    - learner: "Prenotazione gratuita online per i gruppi sopra le venti persone, un limite di pullman al giorno e le multe destinate ai servizi per i residenti. E chiederei che ogni agenzia nomini un responsabile e che ci facci sapere in anticipo gli orari dei gruppi."
      errors: [subjunctive-form]
      gold: {text: "ci facci sapere", fix: "ci faccia sapere"}
    - tutor: "Una proposta concreta, finalmente. Riascolti solo «ci facci sapere»: il congiuntivo presente di «fare», alla terza persona singolare, ha un'altra desinenza. Quale?"
      prompt: {text: "ci facci sapere", tags: [subjunctive-form]}
    - learner: "Che ci faccia sapere in anticipo gli orari dei gruppi. Così anche noi guide potremmo organizzarci meglio."
    - tutor: "La proposta è chiara: prenotazione gratuita, limite ai pullman e multe per i servizi dei residenti. Grazie, Luca, e buon lavoro a Verona."
      goals: [proposal]

- scenario: trattativa-affitto
  # facts: bilocale con soggiorno luminoso e balcone sul cortile; caldaia di dodici anni revisionata a settembre, libretto mandato entro stasera; affitto novecentocinquanta euro più ottanta di spese; la learner propone ottocentottanta, lavora a tempo indeterminato; il proprietario scende a novecento con un contratto quattro più quattro; recesso anticipato con sei mesi di preavviso per gravi motivi; deposito di tre mensilità, duemilasettecento euro; bozza del contratto domani; firma giovedì alle cinque in agenzia
  level: C1
  persona: en-f-professional
  history: [combined-pronouns, participle-agreement, imperative-form]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Mi è piaciuto molto, soprattutto la luce del soggiorno e il balcone sul cortile. Ho però una preoccupazione: la caldaia mi è sembrata piuttosto vecchia, e in un inverno a Milano non vorrei restare senza riscaldamento."
    - tutor: "La caldaia ha dodici anni, ma è stata revisionata a settembre. Se vuole, le mando il libretto con l'ultimo controllo."
      goals: [interest]
    - learner: "Sì, grazie, mi farebbe piacere vederlo. Il libretto, però, preferirei che lo vedesse anche il mio compagno, che di caldaie se ne intende più di me: appena lo ricevo, gli lo inoltro."
      errors: [combined-pronouns]
      gold: {text: "gli lo inoltro", fix: "glielo inoltro"}
    - tutor: "Nessun problema, il libretto le arriva entro stasera. Guardi però «gli lo inoltro»: quando «gli» si combina con «lo», la forma cambia. Come diventa?"
      prompt: {text: "gli lo inoltro", tags: [combined-pronouns]}
    - learner: "Glielo inoltro, tutto attaccato. Adesso però parliamo dell'affitto: novecentocinquanta euro più ottanta di spese mi sembrano tanti per un bilocale."
    - tutor: "Il prezzo è in linea con la zona, ma il proprietario è disposto a trattare un po'. Lei quanto proporrebbe?"
    - learner: "Proporrei ottocentottanta euro, spese escluse. Lavoro a tempo indeterminato e posso presentare le ultime tre buste paga, quindi per il proprietario sarei un'inquilina affidabile, che paga puntuale e non gli crea problemi."
    - tutor: "Ottocentottanta è troppo poco, temo. Il proprietario, però, scenderebbe a novecento se il contratto fosse un quattro più quattro. Per Lei andrebbe bene?"
      goals: [negotiate]
    - learner: "Novecento con un quattro più quattro mi sta bene. Ho solo un dubbio: non ho capito se posso andarmene prima dei quattro anni, eppure le clausole sul preavviso e sul deposito, ieri sera, le ho letto due volte."
      errors: [participle-agreement]
      gold: {text: "le ho letto", fix: "le ho lette"}
    - tutor: "Sì, può andarsene prima per gravi motivi, con sei mesi di preavviso. Riprenda però «le ho letto»: quel «le» sta per le clausole, e con un pronome così davanti il participio concorda. Come diventa?"
      goals: [conditions]
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "le ho letto", tags: [participle-agreement]}
    - learner: "Le ho lette due volte, sì. E il deposito quant'è? Nell'annuncio non c'era scritto."
    - tutor: "Tre mensilità, quindi duemilasettecento euro, che le vengono restituiti alla fine del contratto. Se per Lei va bene, possiamo fissare la firma."
    - learner: "Va bene, anche se tre mensilità sono tante. Fissiamo pure la firma; anzi, se il proprietario non ha fretta, prima mi mandi la bozza del contratto e dammi un paio di giorni per farla leggere a un avvocato."
      errors: [imperative-form]
      gold: {text: "dammi un paio di giorni", fix: "mi dia un paio di giorni"}
    - tutor: "La bozza gliela mando domani. Riascolti però «dammi un paio di giorni»: con «mi mandi», poco prima, mi ha dato del Lei. Come diventa allora questo secondo invito?"
      prompt: {text: "dammi un paio di giorni", tags: [imperative-form]}
    - learner: "Mi dia un paio di giorni, scusi. Allora potremmo firmare giovedì prossimo nel pomeriggio?"
    - tutor: "Giovedì alle cinque in agenzia, allora: novecento euro, quattro più quattro, tre mensilità di deposito. Porti un documento e le buste paga."
      goals: [conclude]

- scenario: assicurazione-sinistro
  # facts: incidente ieri verso le sei e mezza all'incrocio tra via Roma e viale Europa; l'altra auto arrivava da destra, il suo semaforo era rosso e il conducente guardava il telefono; danni a portiera e parafango, nessun ferito; constatazione amichevole compilata e firmata da tutti e due; testimone alla fermata dell'autobus che ha lasciato il numero; foto fatte prima dell'arrivo dei vigili; il vigile ha detto di aspettare il perito; modulo e foto entro tre giorni; numero di sinistro 58112; il perito chiama entro una settimana
  level: C1
  persona: es-m-worker
  history: [auxiliary-choice, participle-agreement, conditional-form]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri verso le sei e mezza ero fermo al semaforo all'incrocio tra via Roma e viale Europa. Quando è scattato il verde sono ripartito, e una macchina che arrivava da destra mi ha colpito sulla fiancata."
    - tutor: "Mi dispiace. C'è stato qualche ferito, o solo danni alle auto?"
    - learner: "Per fortuna nessun ferito, solo la portiera e il parafango distrutti. La colpa è tutta dell'altro conducente: guardava il telefono e, anche se il suo semaforo era rosso già da qualche secondo, ha passato lo stesso a tutta velocità."
      errors: [auxiliary-choice]
      gold: {text: "ha passato lo stesso", fix: "è passato lo stesso"}
    - tutor: "Quindi secondo Lei la responsabilità è dell'altro conducente. Riprenda però «ha passato lo stesso»: qui il verbo non ha un oggetto, indica solo il movimento dell'auto. Quale ausiliare vuole?"
      goals: [what]
      prompt: {text: "ha passato lo stesso", tags: [auxiliary-choice]}
    - learner: "È passato lo stesso, col rosso. E l'ha ammesso anche lui, davanti a un testimone."
    - tutor: "Un testimone è importante. Avete compilato e firmato tutti e due la constatazione amichevole?"
      goals: [responsibility]
    - learner: "Sì, l'abbiamo compilata insieme sul posto e l'abbiamo firmata tutti e due. Il testimone, un signore che aspettava l'autobus alla fermata, mi ha lasciato il suo numero e ha detto che è disposto a confermare tutto."
    - tutor: "Molto bene. Ha anche fotografato i danni e la posizione delle auto prima di spostarle?"
    - learner: "Sì, le foto ce le ho, sia dei danni alla mia macchina sia della posizione delle due auto all'incrocio, prima che arrivassero i vigili: le ho fatto con il telefono, subito dopo l'incidente."
      errors: [participle-agreement]
      gold: {text: "le ho fatto", fix: "le ho fatte"}
    - tutor: "Foto scattate prima dei vigili sono preziose. Rilegga però «le ho fatto»: il «le» davanti si riferisce alle foto. Come deve cambiare, allora, «fatto»?"
      goals: [documents]
      prompt: {text: "le ho fatto", tags: [participle-agreement]}
    - learner: "Le ho fatta con il telefono, subito dopo l'incidente."
      errors: [participle-agreement]
    - tutor: "Le ho fatte con il telefono, capisco: allora le alleghi alla constatazione. Me le manda entro tre giorni, insieme al modulo firmato?"
      recast: {text: "Le ho fatta", fix: "Le ho fatte", tags: [participle-agreement]}
    - learner: "Certo, glieli mando stasera per email. Una cosa però mi preoccupa: la macchina mi serve per lavorare, e il vigile mi ha detto di aspettare il perito, anche se ieri sera, dopo l'incidente, la porterei subito dal meccanico."
      errors: [conditional-form]
      gold: {text: "la porterei subito dal meccanico", fix: "l'avrei portata subito dal meccanico"}
    - tutor: "Il vigile le ha dato un buon consiglio. Guardi però «la porterei subito dal meccanico»: parla di ieri sera, di una cosa che poi non ha fatto. Quale condizionale ci vuole?"
      prompt: {text: "la porterei subito dal meccanico", tags: [conditional-form]}
    - learner: "L'avrei portata subito dal meccanico, ma ho aspettato. Quindi adesso cosa succede, e quanto tempo ci vuole?"
    - tutor: "Il suo numero di sinistro è 58112. Appena riceviamo modulo e foto, un perito la contatta entro una settimana per vedere l'auto, e dopo potrà portarla dal meccanico."
      goals: [next]

- scenario: medico-specialista
  # facts: holter con qualche extrasistole, pressione centocinquanta su novanta; palpitazioni la sera dopo cena da circa un mese, da quando sono aumentate le ore di lavoro; il padre ha avuto un infarto a sessantadue anni e fumava; il paziente ha smesso di fumare a trent'anni e cammina un'ora quasi ogni giorno; terapia: betabloccante leggero, mezza pastiglia la mattina dopo colazione; effetti: stanchezza e mani fredde nelle prime settimane; quattro caffè al giorno da ridurre; la moglie consiglia uno psicologo; controllo tra tre mesi con un nuovo holter
  level: C1
  persona: en-m-retired
  history: [auxiliary-choice, subjunctive-form, article-form]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Buongiorno, dottore. Nel complesso abbastanza bene, ma la sera, soprattutto dopo cena, ogni tanto sento il cuore che batte in modo irregolare, come se saltasse un colpo. Dura pochi secondi, poi passa da solo."
    - tutor: "Quello che descrive corrisponde a ciò che vediamo nell'holter: qualche battito in più, le cosiddette extrasistole. Da quanto tempo le capitano?"
      new: [{lemma: holter, gloss: 24-hour heart monitor}, {lemma: extrasistole, gloss: extra heartbeat}]
    - learner: "Da circa un mese. Prima non avevo mai avuto niente di simile, nemmeno sotto esami all'università, e da qualche settimana dormo anche peggio: i disturbi hanno cominciato quando al lavoro sono aumentate le ore."
      errors: [auxiliary-choice]
      gold: {text: "i disturbi hanno cominciato", fix: "i disturbi sono cominciati"}
    - tutor: "Lo stress c'entra spesso. Riprenda però «i disturbi hanno cominciato»: qui il verbo non ha un oggetto, proprio come «aumentare» subito dopo. Quale ausiliare ci vuole?"
      goals: [symptoms]
      prompt: {text: "i disturbi hanno cominciato", tags: [auxiliary-choice]}
    - learner: "Sono cominciati, come le ore sono aumentate. Ma è una cosa grave, dottore?"
    - tutor: "In sé non è grave: le extrasistole sono frequenti e quasi sempre benigne. La pressione, però, è un po' alta, centocinquanta su novanta. In famiglia qualcuno ha avuto problemi di cuore?"
      goals: [understand]
    - learner: "Mio padre ha avuto un infarto a sessantadue anni, ma fumava due pacchetti al giorno e non faceva nessuno sport. Io ho smesso di fumare a trent'anni e cammino un'ora quasi tutti i giorni, anche se d'inverno faccio un po' più fatica."
    - tutor: "Smettere a trent'anni è stata una scelta saggia. Con il precedente di suo padre, però, preferisco non lasciar correre la pressione e iniziare una terapia leggera."
      goals: [history]
    - learner: "Capisco. Non vorrei prendere troppe medicine, ma se è necessario va bene. L'importante è che mi spieghi bene come devo prenderle e che effetti potrebbero avere, perché ho paura che mi venghino altri problemi."
      errors: [subjunctive-form]
      gold: {text: "mi venghino", fix: "mi vengano"}
    - tutor: "Le prescrivo un betabloccante leggero: mezza pastiglia la mattina, dopo colazione. Riprenda però «mi venghino»: il congiuntivo di «venire» comincia come «vengo», ma alla terza plurale finisce in un altro modo. Come?"
      new: [{lemma: betabloccante, gloss: beta blocker}]
      prompt: {text: "mi venghino", tags: [subjunctive-form]}
    - learner: "Mi vengano, scusi: ho paura che mi vengano altri problemi. Quali effetti collaterali potrei avere con questa medicina?"
    - tutor: "I più comuni sono un po' di stanchezza e le mani fredde, soprattutto nelle prime settimane. Se li sente in modo forte, mi chiami e aggiustiamo la dose."
    - learner: "Va bene. Nel frattempo riduco anche il caffè, perché ne bevo quattro al giorno. Secondo Lei è un'idea esagerata quella di mia moglie? Dice che, per lo stress del lavoro, dovrei andare da un psicologo."
      errors: [article-form]
      gold: {text: "un psicologo", fix: "uno psicologo"}
    - tutor: "Non è esagerata, anzi: lo stress pesa sul cuore più di quanto si pensi. Riprenda solo «un psicologo»: davanti a «psicologo», come davanti a «studente» o «zio», l'articolo cambia forma. Quale serve?"
      prompt: {text: "un psicologo", tags: [article-form]}
    - learner: "Uno psicologo, giusto. Allora prendo la medicina, riduco il caffè e chiedo un appuntamento. Quando ci rivediamo?"
    - tutor: "Tra tre mesi, con un nuovo holter e la misurazione della pressione. Se nel frattempo ha dubbi, mi chiami pure."
      goals: [treatment]

- scenario: recensione-ristorante
  # facts: tavolo prenotato alle otto per il compleanno della madre della learner; i primi sono arrivati quasi un'ora dopo; la zuppa di pesce, piatto preferito della madre, piccolissima e quasi fredda; il cameriere ha alzato le spalle; stasera la sala è sotto organico; offerta: dolci offerti e sconto del venti per cento sul conto; torta della casa con una candelina portata cantando; il responsabile parlerà con tutta la sala
  level: C1
  persona: es-f-teacher
  history: [adjective-agreement, hypothetical, combined-pronouns]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, mi dispiace doverla disturbare, ma stasera festeggiamo il compleanno di mia madre e la serata non sta andando come speravamo. Avevamo prenotato per le otto, e i primi sono arrivati quasi un'ora dopo."
    - tutor: "Mi dispiace davvero, per di più in una sera di festa. Stasera siamo sotto organico, ma non è una scusa. È stato solo il ritardo, o anche altro?"
      goals: [complain]
    - learner: "Non solo. Mia madre aveva ordinato la zuppa di pesce, che è il suo piatto preferito, e quando finalmente è arrivata al tavolo era piccolissima e, dopo tutto quel tempo passato sotto le luci della cucina, quasi freddo."
      errors: [adjective-agreement]
      gold: {text: "quasi freddo", fix: "quasi fredda"}
    - tutor: "Una zuppa di pesce tiepida non dovrebbe mai uscire dalla cucina, ha ragione. Riprenda però «quasi freddo»: l'aggettivo si riferisce ancora alla zuppa, anche se è lontano. Come deve finire?"
      goals: [detail]
      prompt: {text: "quasi freddo", tags: [adjective-agreement]}
    - learner: "Quasi fredda, scusi. E quando l'abbiamo fatto notare al cameriere, ha alzato le spalle e se n'è andato senza dire niente."
    - tutor: "Questo mi dispiace ancora di più, ne parlerò con lui stasera stessa. Che cosa vi sareste aspettati, per una serata come questa?"
    - learner: "Ci saremmo aspettati un servizio normale, niente di speciale. Il ritardo può capitare a tutti, e mia madre non ci avrebbe neanche fatto caso, se il cameriere ce l'avrebbe detto con un sorriso."
      errors: [hypothetical]
      gold: {text: "se il cameriere ce l'avrebbe detto", fix: "se il cameriere ce l'avesse detto"}
    - tutor: "Un sorriso, in effetti, costa poco. Riascolti però «se il cameriere ce l'avrebbe detto»: nella parte con «se», per un'ipotesi che non si è realizzata, quale modo ci vuole?"
      goals: [expectation]
      prompt: {text: "se il cameriere ce l'avrebbe detto", tags: [hypothetical]}
    - learner: "Il congiuntivo: se il cameriere ce l'avesse detto con un sorriso, mia madre non ci avrebbe fatto caso."
    - tutor: "Proprio così. Per scusarci vorrei offrirvi i dolci e uno sconto del venti per cento sul conto. Le sembra una soluzione accettabile?"
    - learner: "È gentile, grazie. I dolci li accettiamo volentieri, e a mia madre piacerebbe molto la torta della casa con una candelina: se il cameriere gli la porta cantando, la serata è salva."
      errors: [combined-pronouns]
      gold: {text: "gli la porta", fix: "gliela porta"}
    - tutor: "La torta con la candelina si può fare, ci mancherebbe. Riprenda però «gli la porta»: per dire «la torta a lei», i due pronomi diventano una parola sola. Quale?"
      prompt: {text: "gli la porta", tags: [combined-pronouns]}
    - learner: "Glie la porta cantando, volevo dire."
      errors: [combined-pronouns]
    - tutor: "Gliela porta cantando, promesso, e la candelina la scelgo io. Allora accetta anche lo sconto del venti per cento?"
      recast: {text: "Glie la porta", fix: "Gliela porta", tags: [combined-pronouns]}
    - learner: "Accettiamo, grazie. Apprezzo che sia venuto a parlare con noi di persona; la prossima volta, però, preferirei che il cameriere ci avvisasse subito del ritardo, invece di lasciarci aspettare senza dire niente."
    - tutor: "Ha ragione, e glielo prometto: ne parlerò con tutta la sala. Buona serata, e tanti auguri a sua madre."
      goals: [resolve]

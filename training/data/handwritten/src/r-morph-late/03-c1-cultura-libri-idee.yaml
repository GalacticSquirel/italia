# Set r-morph-late, file 3 (C1): an exhibition, two book clubs, a podcast, the news, idioms,
# technology and life in Italy. Long content-heavy turns with one late morphology slip
# (passive and participle agreement, adjectives far from their noun, hypotheticals, conditional
# by time, auxiliary with «saltare», congiuntivo endings, article forms, combined pronouns).
- scenario: arte-mostra
  # facts: il quadro è un ritratto di donna dipinto intorno al 1530 da un allievo di bottega di cui non si conosce il nome; luce da sinistra su metà del viso; sfondo con colline, un fiume e una piccola città in colori freddi; la donna tiene in mano una lettera quasi nascosta; la learner lo paragona a un quadro moderno di una donna sola in una camera d'albergo, visto in un museo americano, di cui non ricorda il titolo; poi la sala successiva
  level: C1
  persona: en-f-student
  history: [passive, participle-agreement, adjective-agreement]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce subito lo sguardo della donna: non guarda noi, guarda fuori dalla finestra, come se aspettasse qualcuno. E la luce che entra da sinistra le illumina solo metà del viso, il che rende tutto un po' inquieto."
    - tutor: "Hai visto bene, quella luce divisa a metà è il cuore del quadro. L'ha dipinto intorno al 1530 un allievo di bottega di cui non conosciamo il nome. Che cosa vedi nello sfondo?"
      goals: [react]
    - learner: "Dietro la finestra c'è un paesaggio con colline, un fiume e una piccola città. I colori dello sfondo sono più freddi, quasi azzurri, e le case, anche se sono state dipinto con pochissimi tocchi di pennello, si riconoscono benissimo."
      errors: [passive]
      gold: {text: "sono state dipinto", fix: "sono state dipinte"}
    - tutor: "Pochi tocchi, eppure si riconoscono, è vero. Riprendi però «sono state dipinto»: in questo passivo il participio deve concordare con «le case». Come diventa?"
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "sono state dipinto", tags: [passive]}
    - learner: "Sono state dipinte, certo, come le case. Ma secondo te perché il pittore ha usato colori così freddi per lo sfondo?"
    - tutor: "Per dare profondità: i colori freddi sembrano più lontani, è un trucco della prospettiva. Tu che cosa ci leggi, oltre alla tecnica?"
      goals: [describe]
    - learner: "Ci leggo un contrasto tra dentro e fuori: la stanza è calda, chiusa, piena di oggetti, mentre fuori c'è un mondo aperto che lei non può raggiungere. Forse è il ritratto di una donna che desidera una libertà che non ha."
    - tutor: "È una lettura possibile, e mi piace. Io però noto anche la lettera che tiene in mano, quasi nascosta: per te cambia qualcosa?"
    - learner: "Non l'avevo vista! Allora forse aspetta davvero qualcuno, un uomo lontano. In quel caso la sua espressione, che all'inizio mi era sembrata soltanto triste, diventa per me più speranzoso, quasi tenera."
      errors: [adjective-agreement]
      gold: {text: "più speranzoso", fix: "più speranzosa"}
    - tutor: "Che la lettera cambi tutto lo penso anch'io. Guarda però «più speranzoso»: si riferisce all'espressione, proprio come «tenera» subito dopo. Come deve finire?"
      goals: [interpret]
      prompt: {text: "più speranzoso", tags: [adjective-agreement]}
    - learner: "Più speranzosa, come tenera. Ti ricorda qualche altro quadro di quel periodo?"
    - tutor: "Mi ricorda molti ritratti veneti di quegli anni, con le donne vicino a una finestra. Tu, invece, a quale opera o a quale stile lo paragoneresti?"
    - learner: "A me ricorda un quadro moderno, una donna sola in una camera d'albergo, che ho visto in un museo americano due anni fa. Non ricordo il titolo, ma l'ho cercata ieri su internet per fartelo vedere, senza successo."
      errors: [participle-agreement]
      gold: {text: "l'ho cercata", fix: "l'ho cercato"}
    - tutor: "Una donna sola in una camera d'albergo: il paragone regge. Riprendi però «l'ho cercata»: quel «l'» sta per il quadro. Allora come deve finire il participio?"
      prompt: {text: "l'ho cercata", tags: [participle-agreement]}
    - learner: "L'ho cercato, perché è il quadro. Comunque la solitudine è la stessa, anche se tra i due quadri ci sono quattro secoli."
    - tutor: "Quattro secoli e la stessa attesa alla finestra: bel paragone. Andiamo a vedere la sala successiva?"
      goals: [compare]

- scenario: club-lettura
  # facts: romanzo del mese: saga familiare nell'Italia del dopoguerra; il learner l'ha letto in due settimane, finito alle due di notte; il tutor in tre sere; personaggi: Teresa, la madre, e il figlio Franco, che parte per Torino nel 1958 e lei non lo saluta alla stazione; la storia salta dal 1958 al 1975; stile: capitoli brevi, frasi semplici, dialetto nei dialoghi; il learner lo consiglierebbe alla sorella, non a chi cerca una trama veloce; il prossimo mese sceglie il learner
  level: C1
  persona: en-m-traveller
  history: [hypothetical, auxiliary-choice, subjunctive-form]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma mi ci sono volute due settimane. La prima parte, quella sulla guerra, mi è sembrata lenta; poi, dalla nascita dei gemelli in avanti, non riuscivo più a smettere, e l'ho finito alle due di notte."
    - tutor: "Alle due di notte: allora ti ha preso davvero. Che impressione ti ha lasciato, nel complesso?"
    - learner: "Un'impressione dolce e amara insieme. Mi è piaciuto come racconta una famiglia normale attraverso trent'anni di storia italiana, senza eroi, e il finale mi ha commosso, anche se un po' me l'aspettavo."
    - tutor: "Anche a me il finale ha fatto venire un nodo alla gola. E Teresa? Io la trovo il personaggio più forte del libro."
      goals: [impression]
    - learner: "Forte sì, ma anche dura. Quando Franco decide di partire per Torino, lei non lo saluta nemmeno alla stazione. Se fosse stata mia madre ci sarei rimasto malissimo, e se poi non mi scrivesse per dieci anni non so se l'avrei perdonata."
      errors: [hypothetical]
      gold: {text: "se poi non mi scrivesse per dieci anni", fix: "se poi non mi avesse scritto per dieci anni"}
    - tutor: "Sulla durezza di Teresa hai ragione, quella scena alla stazione fa male. Però riprendi «se poi non mi scrivesse per dieci anni»: quei dieci anni di silenzio sono nel passato, come il perdono. Quale tempo del congiuntivo ci vuole?"
      prompt: {text: "se poi non mi scrivesse per dieci anni", tags: [hypothetical]}
    - learner: "Il trapassato: se poi non mi avesse scritto per dieci anni, non so se l'avrei perdonata. Tu la difendi?"
    - tutor: "La difendo, sì: secondo me non lo saluta perché, se lo vedesse partire, crollerebbe. E dello stile che cosa dici?"
      goals: [character]
    - learner: "Lo stile mi è piaciuto: capitoli brevi, frasi semplici e il dialetto nei dialoghi, che all'inizio non capivo per niente. Mi sono perso un po', però, a metà libro, quando la storia ha saltato di colpo dal 1958 al 1975."
      errors: [auxiliary-choice]
      gold: {text: "la storia ha saltato", fix: "la storia è saltata"}
    - tutor: "Quel salto ha spiazzato anche me, la prima volta. Riprendi però «la storia ha saltato»: qui non c'è un oggetto, è la storia stessa che si sposta in avanti. Quale ausiliare serve?"
      goals: [style]
      prompt: {text: "la storia ha saltato", tags: [auxiliary-choice]}
    - learner: "È saltata di colpo al 1975, sì. Forse l'autore voleva farci sentire tutto il tempo che Franco ha perso lontano da casa."
    - tutor: "Può darsi, ed è un'idea che non avevo considerato. E a chi lo consiglieresti?"
    - learner: "A chi ama le storie di famiglia e non ha fretta, per esempio a mia sorella. A chi cerca una trama veloce no: credo che si annoierebbe nella prima parte, a meno che qualcuno non gli dichi di resistere fino ai gemelli."
      errors: [subjunctive-form]
      gold: {text: "non gli dichi", fix: "non gli dica"}
    - tutor: "A tua sorella lo presterei anch'io. Riprendi però «non gli dichi»: dopo «a meno che» il congiuntivo è giusto, ma quello di «dire» finisce in un altro modo. Come?"
      goals: [recommend]
      prompt: {text: "non gli dichi", tags: [subjunctive-form]}
    - learner: "Non gli dica, scusa. Allora il mese prossimo chi sceglie il libro?"
    - tutor: "Tocca a te, e niente saghe di famiglia, per favore: un mese di pausa dalle lacrime ce lo meritiamo."

- scenario: film-libro
  # facts: il learner ha letto un giallo ambientato a Napoli negli anni Novanta, primo romanzo di un'autrice giovane, prestato da un collega; trama: una commissaria di quarant'anni, divorziata, che vive con la madre, indaga sulla scomparsa di un ragazzo del suo quartiere; indizio: uno zaino trovato al porto con un quaderno, delle chiavi e degli scontrini di un bar di Posillipo; ultime cinquanta pagine troppo veloci; il secondo libro dell'autrice è appena uscito, il learner li porta a Roberto il mese prossimo
  level: C1
  persona: es-m-worker
  history: [article-form, participle-agreement]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, se volete. Ho letto un giallo ambientato a Napoli negli anni Novanta, il primo romanzo di un'autrice giovane: me l'ha prestato un collega dicendomi che non sarei riuscito a staccarmene, e aveva ragione."
    - tutor: "Un esordio, bene. Senza svelarci il finale, di che cosa parla?"
    - learner: "Una commissaria di quarant'anni indaga sulla scomparsa di un ragazzo del suo quartiere. L'unico indizio è uno zaino trovato al porto, e dentro ci sono un quaderno, delle chiavi e dei scontrini di un bar di Posillipo."
      errors: [article-form]
      gold: {text: "dei scontrini", fix: "degli scontrini"}
    - tutor: "Quel quaderno mi interessa già. Riprendi solo «dei scontrini»: come «studenti», anche «scontrini» vuole un articolo diverso da «dei». Quale?"
      goals: [summary]
      prompt: {text: "dei scontrini", tags: [article-form]}
    - learner: "Degli scontrini, come degli studenti. Non dico altro, altrimenti vi rovino la sorpresa."
    - tutor: "Bravo, niente anticipazioni. Parlaci della commissaria, allora: com'è?"
    - learner: "È una donna stanca, divorziata, che vive con la madre e fuma troppo, ma ha un senso della giustizia ostinato. Quello che mi è piaciuto di più è che sbaglia spesso, chiede scusa e ricomincia, come una persona vera e non come un'eroina da film."
    - tutor: "Una commissaria che chiede scusa è una rarità. Il libro ti è piaciuto tutto, o qualcosa non ti ha convinto?"
      goals: [characters]
    - learner: "Quasi tutto. Le ultime cinquanta pagine, però, mi sono sembrate troppo veloci: dopo tanta attesa mi sarei aspettato un finale più lento e più coraggioso, e alcune spiegazioni, sinceramente, le ho trovato forzate."
      errors: [participle-agreement]
      gold: {text: "le ho trovato forzate", fix: "le ho trovate forzate"}
    - tutor: "Che i finali troppo rapidi deludano lo penso anch'io. Guarda però «le ho trovato forzate»: «le» sta per le spiegazioni, e il participio deve seguirlo. Come diventa?"
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "le ho trovato forzate", tags: [participle-agreement]}
    - learner: "Le ho trovata forzate, alcune spiegazioni."
      errors: [participle-agreement]
    - tutor: "«Le ho trovate forzate», dici, e ti capisco: un finale che corre delude sempre un po'. Ma allora a chi lo consiglieresti?"
      goals: [opinion]
      recast: {text: "Le ho trovata forzate", fix: "Le ho trovate forzate", tags: [participle-agreement]}
    - learner: "A chi ama i gialli lenti, pieni di atmosfera, e non solo di colpi di scena. Se vuoi lo presto volentieri anche a te, Roberto: te lo porto il mese prossimo, insieme al secondo libro della stessa autrice, che è appena uscito."
    - tutor: "Accetto volentieri, me lo segno. Grazie, e adesso passiamo la parola a chi ha letto il saggio sulla montagna."
      goals: [recommend]

- scenario: intervista-podcast
  # facts: la learner è arrivata da Siviglia nel 2015 come lettrice di spagnolo all'università di Bari, doveva ripartire a giugno; ha conosciuto il marito a un corso di vela; sorprese: cena alle otto e pranzi domenicali di cinque ore dai suoceri; critica: la burocrazia, quasi due anni per riconoscere la laurea; consiglio: arrivare con un lavoro o sei mesi di risparmi, imparare la lingua, accettare ogni invito a pranzo; i figli sono nati a Bari e parlano barese
  level: C1
  persona: es-f-teacher
  history: [participle-agreement, conditional-form, adjective-agreement]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Grazie a voi dell'invito. Sono arrivata da Siviglia nel 2015 per un anno come lettrice di spagnolo all'università di Bari, e dovevo ripartire a giugno. Poi ho conosciuto mio marito a un corso di vela, e sono ancora qui."
    - tutor: "Un corso di vela che ti cambia la vita, bellissimo. Ti ricordi la prima cosa che ti ha sorpresa, appena arrivata a Bari?"
      goals: [story]
    - learner: "Le cene! In Spagna si cena alle dieci, e qui alle otto mi chiamavano già a tavola. E la domenica dai suoceri, le prime volte, dopo cinque ore di pranzo le mie cognate sono andato a fare la passeggiata e io crollavo sul divano."
      errors: [participle-agreement]
      gold: {text: "le mie cognate sono andato", fix: "le mie cognate sono andate"}
    - tutor: "Cinque ore di pranzo stenderebbero chiunque. Riprendi però «le mie cognate sono andato»: con «essere», il participio concorda con il soggetto. Chi è il soggetto, qui?"
      goals: [culture-shock]
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "le mie cognate sono andato", tags: [participle-agreement]}
    - learner: "Le mie cognate, quindi: sono andate a fare la passeggiata. Io invece, ancora adesso, dopo il caffè ho bisogno di un riposino."
    - tutor: "Ti capisco benissimo. Ora la domanda più scomoda: c'è qualcosa dell'Italia che proprio non sopporti?"
    - learner: "Con tutto l'amore che ho per questo paese, la burocrazia. Per riconoscere la mia laurea ci sono voluti quasi due anni: se l'avessi saputo prima, comincerei la pratica già da Siviglia, prima di partire."
      errors: [conditional-form]
      gold: {text: "comincerei la pratica", fix: "avrei cominciato la pratica"}
    - tutor: "Due anni per una laurea: purtroppo è una storia che sento spesso. Riprendi però «comincerei la pratica»: l'occasione era prima di partire, nel 2015, e ormai è passata. Quale condizionale va bene, allora?"
      prompt: {text: "comincerei la pratica", tags: [conditional-form]}
    - learner: "Allora: se l'avessi saputo prima, avessi cominciato la pratica già da Siviglia."
      errors: [conditional-form]
    - tutor: "Avrei cominciato la pratica già da Siviglia, dici: un consiglio prezioso per chi ci ascolta. A proposito, che cos'altro diresti a chi pensa di trasferirsi qui?"
      goals: [critique]
      recast: {text: "avessi cominciato la pratica", fix: "avrei cominciato la pratica", tags: [conditional-form]}
    - learner: "Direi di arrivare con un lavoro già trovato, o almeno con dei risparmi per sei mesi, e di imparare la lingua prima di partire. E poi di accettare ogni invito a pranzo, anche se dura cinque ore: è lì che si entra davvero in una comunità."
    - tutor: "Accettare ogni invito a pranzo: lo metto come titolo della puntata. Un'ultima cosa: torneresti a vivere a Siviglia?"
      goals: [advice]
    - learner: "Forse da vecchia, per il sole d'inverno. Ma i miei figli sono nati qui, parlano barese meglio di me e considerano Siviglia una città bellissima, ma un po' straniero."
      errors: [adjective-agreement]
      gold: {text: "un po' straniero", fix: "un po' straniera"}
    - tutor: "Figli che parlano barese meglio della mamma: che bella immagine. Guarda solo «un po' straniero»: si riferisce a Siviglia, come «bellissima» poco prima. Come deve finire?"
      prompt: {text: "un po' straniero", tags: [adjective-agreement]}
    - learner: "Un po' straniera, certo, come bellissima. Grazie a voi, è stato un piacere."
    - tutor: "Grazie a te, e alla prossima puntata da Bari. Buon pranzo della domenica!"

- scenario: notizie-attualita
  # facts: la notizia: chi affitta ai turisti dovrà registrare l'appartamento e rispettare regole di sicurezza più severe, i comuni potranno limitare gli affitti brevi; nel palazzo del learner sei appartamenti su dodici sono diventati case vacanza; il collega ha letto tre giornali (uno dalla parte dei proprietari, uno degli inquilini, uno quasi senza fatti); il learner un quotidiano online e un podcast; la sorella del learner affitta ai turisti un piccolo appartamento in centro da tre anni
  level: C1
  persona: en-m-heritage
  history: [subjunctive-form, passive, article-form]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "L'ho letta ieri sera. In sostanza, chi affitta un appartamento ai turisti dovrà registrarlo e rispettare regole di sicurezza più severe, e i comuni potranno limitare gli affitti brevi nei quartieri dove le case per i residenti sono sparite."
    - tutor: "Così l'ho capita anch'io, anche se ogni giornale la racconta a modo suo. E tu cosa ne pensi?"
      goals: [summarise]
    - learner: "Penso che sia un passo nella direzione giusta. Nel mio palazzo, su dodici appartamenti, sei sono diventati case vacanza, e non credo che una registrazione basti a riportare le famiglie, a meno che i comuni non abbino davvero coraggio."
      errors: [subjunctive-form]
      gold: {text: "non abbino", fix: "non abbiano"}
    - tutor: "Sei appartamenti su dodici, che numero. Sul fatto che la registrazione da sola non basti hai ragione; però riprendi «non abbino»: il congiuntivo di «avere» alla terza plurale ha un'altra desinenza. Quale?"
      goals: [opinion]
      prompt: {text: "non abbino", tags: [subjunctive-form]}
    - learner: "A meno che i comuni non abbiano il coraggio di dire di no. Ma tu hai letto anche altri giornali?"
    - tutor: "Ne ho letti tre. Uno parlava solo dei proprietari che perderanno soldi, un altro solo degli inquilini sfrattati, e il terzo riportava a malapena i fatti. Tu dove l'hai letta?"
    - learner: "Su un quotidiano online e poi in un podcast. Il quotidiano dava molto spazio alle associazioni dei proprietari, mentre nel podcast parlavano solo studenti e famiglie che non trovano casa: due racconti così diversi che sembravano due leggi distinte."
    - tutor: "Due leggi distinte: è proprio l'impressione che ho avuto io. Ma secondo te, alla fine, che cosa cambierà davvero?"
      goals: [sources]
    - learner: "Nel breve periodo, poco. Ma se i comuni useranno davvero il potere di limitare gli affitti, tra qualche anno vedremo meno valigie nei centri storici. In alcune città europee, da quando si sono ritirate molte licenze, si è recuperato molti appartamenti per chi ci vive."
      errors: [passive]
      gold: {text: "si è recuperato molti appartamenti", fix: "si sono recuperati molti appartamenti"}
    - tutor: "Meno valigie nei centri, me lo auguro anch'io. Riprendi però «si è recuperato molti appartamenti»: con il «si» passivante, verbo e participio concordano con «molti appartamenti». Come diventa?"
      new: [{lemma: passivante, gloss: passive (with si)}, {lemma: participio, gloss: past participle}]
      prompt: {text: "si è recuperato molti appartamenti", tags: [passive]}
    - learner: "Si sono recuperati molti appartamenti, scusa. E tu, invece, che cosa prevedi?"
    - tutor: "Io prevedo una valanga di ricorsi e qualche anno di confusione. Poi, forse, qualche famiglia tornerà davvero in centro."
      goals: [consequences]
    - learner: "Speriamo. Stasera ne parlo con mia sorella, che affitta ai turisti un piccolo appartamento in centro da tre anni: ogni volta che tocchiamo l'argomento litighiamo, perché lei mi ripete sempre il stesso discorso sui piccoli proprietari."
      errors: [article-form]
      gold: {text: "il stesso discorso", fix: "lo stesso discorso"}
    - tutor: "Una cena di famiglia movimentata, allora. Riprendi solo «il stesso discorso»: «stesso» comincia come «studente». Quale articolo vuole?"
      prompt: {text: "il stesso discorso", tags: [article-form]}
    - learner: "Lo stesso discorso, come lo studente. Domani ti racconto chi ha vinto."
    - tutor: "Aspetto il resoconto alla macchinetta, allora. E porta dati, non solo opinioni!"

- scenario: modi-di-dire
  # facts: il telefono si è scaricato, la sveglia non ha suonato, la learner si è svegliata alle otto e venti con la presentazione al cliente alle nove; treno delle otto e mezza soppresso, corsa delle otto e quaranta saltata per lo sciopero; taxi, arrivata alle nove e un quarto; il capo aveva già cominciato; chiavetta con le slide dimenticata a casa; la collega Paola le ha mandato le slide in due minuti; cena offerta a Paola venerdì al ristorante giapponese, l'amico invitato e paga il sakè
  level: C1
  persona: en-f-professional
  history: [auxiliary-choice, participle-agreement, combined-pronouns]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Stanotte il telefono si è scaricato, quindi la sveglia non ha suonato e mi sono svegliata alle otto e venti, quando alle nove dovevo presentare il progetto al cliente più importante dell'anno."
    - tutor: "Cominciamo bene! E poi, scommetto, ci si è messo anche il treno."
    - learner: "Proprio così. Sono corsa in stazione e lì ho scoperto che il treno delle otto e mezza era stato soppresso; e la corsa delle otto e quaranta, con lo sciopero, anche quella ha saltato."
      errors: [auxiliary-choice]
      gold: {text: "anche quella ha saltato", fix: "anche quella è saltata"}
    - tutor: "Piove sempre sul bagnato. Riprendi però «anche quella ha saltato»: qui la corsa non salta qualcosa, viene cancellata. Quale ausiliare vuole allora il verbo?"
      prompt: {text: "anche quella ha saltato", tags: [auxiliary-choice]}
    - learner: "È saltata anche quella, quindi ho preso un taxi e sono arrivata alle nove e un quarto, con il cuore in gola."
    - tutor: "Con il cuore in gola e il portafoglio più leggero, immagino. E la presentazione? Non dirmi che è andato tutto a monte."
      goals: [tell]
    - learner: "A monte, cioè annullata? No, per fortuna non è andata a monte: il mio capo aveva già cominciato a parlare per guadagnare tempo. Ma quando ho aperto la borsa mi sono accorta di aver dimenticato a casa la chiavetta con le slide."
    - tutor: "Non tutte le ciambelle riescono col buco, eh. E di chi era la colpa, alla fine: del telefono, del treno o un po' anche tua?"
      goals: [react]
    - learner: "Un po' di tutti, ma soprattutto mia: avrei dovuto caricare il telefono e preparare la borsa la sera prima. Per fortuna Paola, una collega, aveva una copia delle slide sul computer, e appena gliel'ho chiesto me le ha mandato in due minuti."
      errors: [participle-agreement]
      gold: {text: "me le ha mandato", fix: "me le ha mandate"}
    - tutor: "Che la colpa sia anche tua lo dici tu, e ti fa onore. Guarda però «me le ha mandato»: quel «le» sono le slide, e il participio deve accordarsi. Come?"
      goals: [blame]
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "me le ha mandato", tags: [participle-agreement]}
    - learner: "Me le ha mandate, certo. A Paola devo almeno una cena."
    - tutor: "Minimo una cena, e pure il dolce. E la morale di questa giornata qual è?"
    - learner: "La morale è che tutto è bene quel che finisce bene, ma il caricabatterie va sempre tenuto nella borsa. E la cena a Paola le la offro venerdì, in quel ristorante giapponese che le piace tanto."
      errors: [combined-pronouns]
      gold: {text: "le la offro", fix: "gliela offro"}
    - tutor: "Tutto è bene quel che finisce bene, e il caricabatterie in borsa: approvato. Riprendi però «le la offro»: «le» e «la», insieme, non restano così. Come si combinano?"
      goals: [moral]
      prompt: {text: "le la offro", tags: [combined-pronouns]}
    - learner: "Gliela offro venerdì, al giapponese. Vuoi venire anche tu?"
    - tutor: "Volentieri, se il sakè lo pago io. Ma stavolta la sveglia mettila su due telefoni!"

- scenario: intelligenza-artificiale
  # facts: lo zio della learner fa il traduttore a Madrid, oggi corregge traduzioni automatiche, guadagna un po' meno e lavora di più; la cugina del tutor fa la grafica e quest'anno ha perso tre clienti (un bar, una palestra, un negozio di bici) che si fanno i loghi con un programma; conclusione comune: servono regole e formazione; patto: tra cinque anni stessa cena, stessi spaghetti, chi perde porta il vino
  level: C1
  persona: es-f-erasmus
  history: [hypothetical, adjective-agreement, article-form]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Ti capisco, ma secondo me la paura è comprensibile ed esagerata insieme. Molti lavori cambieranno, alcuni spariranno, ma ne nasceranno anche di nuovi, come è successo con internet; il problema vero è chi resterà indietro nel frattempo."
    - tutor: "Chi resterà indietro, appunto: cioè quasi tutti noi. Hai un esempio, o è solo ottimismo?"
      goals: [position]
    - learner: "Un esempio ce l'ho. Mio zio fa il traduttore a Madrid: oggi corregge le traduzioni automatiche invece di tradurre da zero, e guadagna un po' meno. Se gli editori lo pagassero il giusto sarebbe contento, ma se le traduzioni automatiche migliorerebbero ancora, chissà."
      errors: [hypothetical]
      gold: {text: "se le traduzioni automatiche migliorerebbero", fix: "se le traduzioni automatiche migliorassero"}
    - tutor: "Guadagnare meno non mi sembra un grande esempio a tuo favore. Però riprendi «se le traduzioni automatiche migliorerebbero»: poco prima hai usato bene «pagassero». Che modo ci vuole qui?"
      goals: [evidence]
      prompt: {text: "se le traduzioni automatiche migliorerebbero", tags: [hypothetical]}
    - learner: "Il congiuntivo: se le traduzioni automatiche migliorassero ancora, mio zio rischierebbe. Hai ragione, non è l'esempio più ottimista."
    - tutor: "Almeno lo ammetti. Mia cugina fa la grafica e quest'anno ha perso tre clienti, che adesso si fanno i loghi da soli con un programma. Questo come lo spieghi?"
    - learner: "Non lo spiego, lo riconosco: per lavori come quello di tua cugina il rischio è reale e immediato. Però i clienti che ha perso erano piccoli, immagino, mentre le aziende grandi continuano a volere una persona che capisca il loro marchio."
    - tutor: "Erano piccoli, sì: un bar, una palestra e un negozio di bici. Ma con i piccoli lei ci pagava l'affitto."
      goals: [concede]
    - learner: "Ed è proprio per questo che servono regole e formazione, non solo buona volontà. Le scuole di grafica dovrebbero insegnare anche questi programmi, perché una designer che li usa insieme alla sua creatività resta, almeno per ora, insostituibile e molto richiesto."
      errors: [adjective-agreement]
      gold: {text: "molto richiesto", fix: "molto richiesta"}
    - tutor: "Insegnare questi programmi nelle scuole è un'idea sensata. Guarda però «molto richiesto»: si riferisce a «una designer», una donna. Come deve finire l'aggettivo?"
      prompt: {text: "molto richiesto", tags: [adjective-agreement]}
    - learner: "Molto richiesta, certo. Allora siamo d'accordo almeno su questo?"
    - tutor: "Su questo sì: la formazione serve, e servono anche le regole. Ma io continuo a vedere il bicchiere mezzo vuoto."
    - learner: "Va bene, tu il bicchiere mezzo vuoto e io mezzo pieno. Facciamo un patto: tra cinque anni ci rivediamo qui, con gli stessi amici e un altro piatto di questi spaghetti, e vediamo chi aveva ragione sui zii traduttori e sulle cugine grafiche."
      errors: [article-form]
      gold: {text: "sui zii", fix: "sugli zii"}
    - tutor: "Il patto mi piace. Guarda solo «sui zii»: davanti a «zii», come davanti a «zucchero» o «studenti», l'articolo cambia, e con lui la preposizione. Come diventa?"
      prompt: {text: "sui zii", tags: [article-form]}
    - learner: "Sugli zii, come sugli studenti. Allora tra cinque anni, qui, stessi spaghetti."
    - tutor: "Affare fatto: stessi spaghetti, e chi perde porta il vino."
      goals: [conclude]

- scenario: vita-in-italia
  # facts: il learner e la moglie sono inglesi; vacanza nelle Marche nel 2010; sei anni fa, con la pensione, hanno comprato una vecchia casa vicino a Urbino; quasi un anno di attesa per i permessi, finestre consegnate con le misure sbagliate e altri due mesi di attesa; all'arrivo sapeva solo ordinare un caffè; due anni di corso a Urbino; ex ingegnere; consiglio: imparare la lingua prima, non chiudersi tra stranieri, andare al bar e alla sagra
  level: C1
  persona: en-m-retired
  history: [passive, subjunctive-form, imperative-form]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie dell'invito. Io e mia moglie siamo inglesi, e nel 2010 abbiamo passato una vacanza nelle Marche: ci siamo innamorati delle colline, e quando sono andato in pensione, sei anni fa, abbiamo comprato una vecchia casa vicino a Urbino."
    - tutor: "Una vecchia casa vicino a Urbino: un sogno che molti hanno e pochi realizzano. Qual è stata la parte più difficile?"
      goals: [story]
    - learner: "La ristrutturazione, senza dubbio. Abbiamo aspettato quasi un anno i permessi del Comune, e quando finalmente i lavori sono cominciati, le finestre che avevamo ordinato sono state consegnato con le misure sbagliate."
      errors: [passive]
      gold: {text: "sono state consegnato", fix: "sono state consegnate"}
    - tutor: "Un anno di attesa e poi le finestre sbagliate: c'è da perdere la pazienza. Riprenda però «sono state consegnato»: in questo passivo il participio concorda con «le finestre». Come deve finire?"
      new: [{lemma: participio, gloss: past participle}]
      prompt: {text: "sono state consegnato", tags: [passive]}
    - learner: "Sono state consegnate con le misure sbagliate, e abbiamo dovuto aspettare altri due mesi."
    - tutor: "Due mesi con le finestre sbagliate, immagino che inverno. E la lingua, invece? Quando è arrivato parlava già italiano?"
      goals: [difficulties]
    - learner: "Pochissimo: sapevo ordinare un caffè e chiedere il conto. Ho fatto un corso a Urbino per due anni, e adesso al bar del paese discuto di politica e di calcio con i vicini, anche se il loro dialetto ogni tanto mi lascia ancora a bocca aperta."
    - tutor: "Politica e calcio al bar: ormai è uno di noi. In che cosa si sente cambiato, rispetto all'ingegnere che era?"
    - learner: "Sono più lento, e lo dico come un complimento. Prima volevo che tutto fosse pronto per ieri; adesso, se il falegname dice «la prossima settimana», aspetto senza arrabbiarmi, purché poi venghi davvero."
      errors: [subjunctive-form]
      gold: {text: "purché poi venghi davvero", fix: "purché poi venga davvero"}
    - tutor: "Imparare ad aspettare è forse la lezione più italiana di tutte. Riprenda però «purché poi venghi davvero»: dopo «purché» il congiuntivo va bene, ma la forma di «venire» per «lui» è un'altra. Quale?"
      goals: [change]
      prompt: {text: "purché poi venghi davvero", tags: [subjunctive-form]}
    - learner: "Purché poi vienga davvero, volevo dire."
      errors: [subjunctive-form]
    - tutor: "Purché poi venga davvero, certo: con i falegnami non si sa mai. Un ultimo consiglio per chi ci ascolta e sogna di trasferirsi?"
      recast: {text: "Purché poi vienga davvero", fix: "Purché poi venga davvero", tags: [subjunctive-form]}
    - learner: "Il mio consiglio è semplice: impari la lingua prima di partire e, quando arriva, vada al bar, alla sagra, in parrocchia, anche se all'inizio capisce soltanto metà delle parole. E soprattutto non si chiude tra stranieri."
      errors: [imperative-form]
      gold: {text: "non si chiude tra stranieri", fix: "non si chiuda tra stranieri"}
    - tutor: "Un consiglio molto concreto. Riascolti però «non si chiude tra stranieri»: prima ha detto bene «impari» e poi «vada». Questo invito, rivolto alla stessa persona, come diventa?"
      goals: [advice]
      prompt: {text: "non si chiude tra stranieri", tags: [imperative-form]}
    - learner: "Non si chiuda tra stranieri. Vada al bar e alla sagra, e la lingua arriverà da sola."
    - tutor: "Lo prendiamo come motto della puntata. Grazie di essere stato con noi, e un saluto a Urbino!"

# Set r-morph-late, file 6 (C2): a Sunday lunch, an ethics seminar, a translation dispute, satire,
# a second building meeting, a second letter to the Rector, the in-laws again and a radio
# interview on gestures. One small morphology slip late in a long turn, prompted with a clue
# that names the category; long correct turns with the same structures are left alone.
- scenario: pranzo-domenicale
  # facts: pranzo domenicale a Bologna; il learner porta un Sangiovese di un piccolo produttore, consigliato dall'enotecaio sotto casa; la zia vuole l'ultima lasagna e la dieta; il learner cede la sua porzione alla zia in cambio di una lezione di tortellini; l'anno scorso tortellini disastrosi con un corso online; a Natale ha portato alla madre tortellini del pastificio; figuraccia del primo mese: «molto eccitato» a cena, un collega ha sputato il vino sugli spaghetti
  level: C2
  persona: en-m-traveller
  history: [combined-pronouns, participle-agreement, article-form]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Meno male, temevo di trovare solo le briciole! Ho portato un Sangiovese di un piccolo produttore delle colline qui vicino: me l'ha consigliato l'enotecaio sotto casa, giurando che con la lasagna è un matrimonio perfetto."
    - tutor: "Un matrimonio perfetto, addirittura! Mia zia, intanto, vorrebbe l'ultima lasagna e anche la dieta: vuole la botte piena e la moglie ubriaca. Sai che cosa vuol dire?"
    - learner: "Credo di sì: volere due cose che si escludono a vicenda, come la lasagna e la dieta. In inglese diciamo che non si può tenere la torta e anche mangiarla. Se tua zia vuole la mia porzione, gli la cedo volentieri."
      errors: [combined-pronouns]
      gold: {text: "gli la cedo", fix: "gliela cedo"}
    - tutor: "Vuol dire proprio questo, e il paragone inglese calza a pennello. Riprendi però «gli la cedo»: per dire «la cedo a lei», i due pronomi diventano una parola sola. Quale?"
      goals: [react, compare]
      prompt: {text: "gli la cedo", tags: [combined-pronouns]}
    - learner: "Gliela cedo volentieri, allora. Ma solo se in cambio mi insegna a fare i tortellini, che è un mio vecchio sogno."
    - tutor: "Attento, che mia zia ti prende in parola: chi va piano va sano e va lontano, ma lei con i tortellini va velocissima. Hai mai provato a farli?"
    - learner: "Una volta, l'anno scorso, con un corso online. Il risultato è stato tragico: la sfoglia era troppo spessa, il ripieno usciva da tutte le parti, e i pochi tortellini che ero riuscito a chiudere li ho buttato nel brodo, dove si sono sfatti."
      errors: [participle-agreement]
      gold: {text: "li ho buttato", fix: "li ho buttati"}
    - tutor: "Un disastro epico, mi piace. Riprendi però «li ho buttato»: «li» sono i tortellini, e il participio deve accordarsi. Come?"
      prompt: {text: "li ho buttato", tags: [participle-agreement]}
    - learner: "Li ho buttati nel brodo tutti insieme, e si sono sfatti in due minuti. Da allora compro quelli del pastificio."
    - tutor: "Tra il dire e il fare c'è di mezzo il mare, come vedi. Ma tu ce l'hai un detto per una storia così?"
    - learner: "Ce l'ho, ed è proprio il vostro: tra il dire e il fare c'è di mezzo il mare. Avevo promesso a mia madre, a Natale, che le avrei preparato i tortellini fatti a mano; alla fine le ho portato una scatola del pastificio, e lei, gentilissima, ha fatto finta di niente."
    - tutor: "Tua madre è una santa, altro che pastificio. Raccontaci un'altra figuraccia, magari con un finale degno di un proverbio."
      goals: [use-idiom]
    - learner: "Ne ho una del mio primo mese in Italia. A cena da colleghi, per fare bella figura, ho detto che ero «molto eccitato» per la serata, pensando a «excited»: silenzio di tomba, e un collega ha sputato il vino sui spaghetti della padrona di casa."
      errors: [article-form]
      gold: {text: "sui spaghetti", fix: "sugli spaghetti"}
    - tutor: "«Molto eccitato» a cena: un classico, e immagino le facce! Riprendi solo «sui spaghetti»: davanti a «spaghetti» l'articolo plurale cambia forma, e con lui la preposizione. Come diventa?"
      prompt: {text: "sui spaghetti", tags: [article-form]}
    - learner: "Sugli spaghetti, scusa. La morale? Chi parla senza pensare, poi deve lavare la tovaglia."
    - tutor: "Questo non è nei libri, ma dovrebbe esserci! E adesso, prima che mia zia ci ripensi, prendi la tua lasagna."
      goals: [anecdote]

- scenario: seminario-etica
  # facts: seminario di dottorato a Padova; tesi della learner: una macchina può causare un danno ma non esserne moralmente responsabile, perché la responsabilità morale richiede di comprendere le ragioni; distinzione tra rispondere alle ragioni e comprenderle; obiezione del professore: le società per azioni; risposta: dispositivo giuridico che rimanda a persone; concessione: in senso giuridico attribuire responsabilità a un sistema può servire per i risarcimenti; conclusione: responsabilità causale e giuridica sì, morale no, da riaprire se una macchina si chiedesse perché agisce
  level: C2
  persona: es-f-teacher
  history: [subjunctive-form, passive, hypothetical]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "La ringrazio, professore: il dubbio è il motivo per cui siamo qui. Preciso la tesi: una macchina può essere causa di un danno, ma non può esserne moralmente responsabile, perché la responsabilità morale presuppone la capacità di comprendere le ragioni che giustificano o condannano un'azione."
    - tutor: "Comprendere le ragioni: ma come fa a escludere che un sistema sufficientemente complesso le comprenda? Lo verifichiamo dall'esterno, come facciamo con gli esseri umani."
      goals: [thesis]
    - learner: "Distinguerei tra rispondere alle ragioni e comprenderle. Un sistema può reagire in modo coerente a certi stimoli senza che vi sia un soggetto che si chieda se ciò che fa sia giusto; finché quel soggetto manca, è prudente che la responsabilità ricadi su chi lo usa."
      errors: [subjunctive-form]
      gold: {text: "ricadi", fix: "ricada"}
    - tutor: "La distinzione tra rispondere e comprendere è elegante, lo ammetto. Riprenda però «ricadi»: «ricadere» appartiene alla seconda coniugazione, e il suo congiuntivo, alla terza persona, finisce in un altro modo. Come?"
      goals: [distinguish]
      prompt: {text: "ricadi", tags: [subjunctive-form]}
    - learner: "Che la responsabilità ricada su chi lo progetta o lo usa. È lì, del resto, che troviamo qualcuno capace di rendere conto."
    - tutor: "Allora le faccio l'obiezione classica: le società per azioni. Non hanno coscienza, eppure le riteniamo responsabili, le multiamo, a volte le sciogliamo. Perché non una macchina?"
    - learner: "Perché la responsabilità delle società è un dispositivo giuridico che rimanda, in ultima istanza, a persone: amministratori, soci, dipendenti. Se domani un tribunale condannasse un algoritmo, chi pagherebbe davvero? E se il danno l'avesse causato un sistema che nessuno controlla più, a chi chiederemmo di ripararlo?"
    - tutor: "Lei sposta il problema dal soggetto alla riparazione, e la seguo. Ma allora qualcosa me lo concede: in senso giuridico, la responsabilità di un sistema non è un'assurdità."
      goals: [objection]
    - learner: "Glielo concedo volentieri: in senso giuridico, attribuire una responsabilità a un sistema può essere utile, soprattutto per organizzare i risarcimenti. Del resto, le norme che oggi se ne occupano sono state concepito proprio con questo spirito pragmatico."
      errors: [passive]
      gold: {text: "sono state concepito", fix: "sono state concepite"}
    - tutor: "Una concessione importante, e onesta. Riprenda però «sono state concepito»: in questo passivo il participio concorda con «le norme». Come diventa?"
      goals: [concede]
      prompt: {text: "sono state concepito", tags: [passive]}
    - learner: "Sono state concepita con uno spirito pragmatico, appunto."
      errors: [passive]
    - tutor: "Sono state concepite con uno spirito pragmatico, appunto, e il pragmatismo non è ancora filosofia morale. Mi dia allora una conclusione rigorosa, in una frase."
      recast: {text: "Sono state concepita", fix: "Sono state concepite", tags: [passive]}
    - learner: "Concluderei così: una macchina può essere responsabile in senso causale e, per convenzione, in senso giuridico, ma non in senso morale; e se un giorno ne costruissimo una capace di chiedersi davvero perché agisce, dovremo riaprire la questione."
      errors: [hypothetical]
      gold: {text: "dovremo riaprire la questione", fix: "dovremmo riaprire la questione"}
    - tutor: "Una conclusione che lascia aperta la porta: mi convince più di quanto vorrei ammettere. Riprenda però «dovremo riaprire la questione»: dopo «se ne costruissimo», nella conseguenza, che modo ci vuole?"
      goals: [conclude]
      prompt: {text: "dovremo riaprire la questione", tags: [hypothetical]}
    - learner: "Il condizionale: se ne costruissimo una, dovremmo riaprire la questione. E a quel punto, forse, dovremmo chiedere anche il suo parere."
    - tutor: "Il parere della macchina al prossimo seminario, allora. Grazie, dottoressa: la sua tesi ha resistito meglio di quanto temessi."

- scenario: traduzione-sfumature
  # facts: terzo capitolo di un romanzo inglese; la frase della zia «she was terribly nice», tradotta nella bozza con «era terribilmente gentile»; ipotesi: «era di una gentilezza insopportabile» o «era gentile, terribilmente gentile»; a pagina dodici «eventually» tradotto con «eventualmente», correzione già segnata sulla bozza stampata; scelta finale: «era gentile, spaventosamente gentile», con una nota per l'editor; domattina la bozza, poi il quarto capitolo
  level: C2
  persona: en-f-student
  history: [conditional-form, combined-pronouns, adjective-agreement]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Me l'aspettavo, e in parte ti do ragione. Il problema più grosso è la frase della zia, «she was terribly nice»: in inglese c'è un'ironia sottile, quasi crudele, che in italiano rischia di sparire se traduco alla lettera."
    - tutor: "Appunto: tu hai scritto «era terribilmente gentile», che in italiano suona come un complimento un po' enfatico. L'ironia dov'è finita?"
      goals: [problem]
    - learner: "Lo so. Rileggendo, mi sono accorta che il lettore italiano non avrebbe colto niente; ci ho pensato a lungo, perché all'inizio, sperando che il contesto bastasse, avevo deciso che lascerei «terribilmente»."
      errors: [conditional-form]
      gold: {text: "avevo deciso che lascerei", fix: "avevo deciso che avrei lasciato"}
    - tutor: "Almeno te ne sei accorta prima della stampa. Riprendi però «avevo deciso che lascerei»: è un futuro visto dal passato, proprio come «non avrebbe colto» poco prima. Quale condizionale serve?"
      prompt: {text: "avevo deciso che lascerei", tags: [conditional-form]}
    - learner: "Avevo deciso che avrei lasciato «terribilmente». Adesso esito tra due soluzioni: «era di una gentilezza insopportabile» oppure «era gentile, terribilmente gentile»."
    - tutor: "La prima spiega troppo, la seconda almeno ha un ritmo. Tu quale difenderesti?"
      goals: [options]
    - learner: "Difenderei la seconda, perché la ripetizione costringe il lettore a fermarsi e a sospettare. La prima, invece, dice al lettore che cosa pensare, e l'autore non lo fa mai: lascia sempre che siamo noi a capire."
    - tutor: "Un buon argomento. Ma già che parliamo di fedeltà: a pagina dodici hai tradotto «eventually» con «eventualmente». Sicura?"
    - learner: "No, è un falso amico, e me ne vergogno: «eventually» vuol dire «alla fine», mentre «eventualmente» significa «nel caso». Ho già segnato la correzione sulla bozza stampata e, se vuoi, domani mattina ti la porto in ufficio insieme alle altre pagine."
      errors: [combined-pronouns]
      gold: {text: "ti la porto", fix: "te la porto"}
    - tutor: "Che fosse un falso amico l'hai visto da sola, ed è quello che conta. Riprendi però «ti la porto»: davanti a «la», il pronome «ti» cambia vocale. Come diventa?"
      goals: [false-friend]
      prompt: {text: "ti la porto", tags: [combined-pronouns]}
    - learner: "Te la porto domani mattina, insieme alle altre pagine. Allora per la zia scegliamo la ripetizione?"
    - tutor: "La ripetizione va bene. Ma «terribilmente» resta un po' inglese: c'è un avverbio più nostro, che punga di più?"
    - learner: "Forse «gentile, spaventosamente gentile»: mantiene l'eccesso e aggiunge un brivido di paura, che è proprio la sfumatura giusta per una zia di cui, nelle pagine successive, scopriamo le manipolazioni, sempre più subdoli."
      errors: [adjective-agreement]
      gold: {text: "sempre più subdoli", fix: "sempre più subdole"}
    - tutor: "«Spaventosamente» mi convince, e prepara bene il seguito. Guarda solo «sempre più subdoli»: si riferisce a «le manipolazioni», un po' lontane. Come deve finire?"
      prompt: {text: "sempre più subdoli", tags: [adjective-agreement]}
    - learner: "Sempre più subdole, certo. Allora: «era gentile, spaventosamente gentile», e la motivazione la scrivo nella nota per l'editor."
    - tutor: "Così torna a parlare l'autore. Domattina portami la bozza con le pagine nuove, e passiamo al quarto capitolo."
      goals: [decide]

- scenario: umorismo-satira
  # facts: battuta del comico: il ministro vuole un decreto per difendere la carbonara e poi si fa fotografare mentre la mangia con la pancetta (a Roma si fa con il guanciale); alla learner era scappata una risata per la battuta precedente sugli autobus («A Roma l'autobus non si aspetta, si spera»); figuraccia: ha detto alla professoressa di essere «embarazada»; battuta sui disabili, che ha lasciato l'amaro a entrambi; brindisi finale
  level: C2
  persona: es-f-erasmus
  history: [auxiliary-choice, participle-agreement, combined-pronouns]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto: ho riso solo per educazione. Ho capito che parlava del ministro e della carbonara, ma non ho capito perché la sala sia esplosa proprio quando ha nominato la pancetta. Me lo spieghi?"
    - tutor: "Perché per un romano la carbonara si fa con il guanciale, e la pancetta è quasi un tradimento. Il comico diceva che il ministro vuole un decreto per difendere la carbonara, e poi si fa fotografare mentre la mangia con la pancetta."
      goals: [missed]
    - learner: "Adesso è chiarissimo: è una battuta sull'ipocrisia, non sulla cucina. Peccato che in quel momento stessi ancora ridendo per la battuta precedente, quella sugli autobus: mi aveva scappato una risata così forte che il signore davanti si è girato."
      errors: [auxiliary-choice]
      gold: {text: "mi aveva scappato una risata", fix: "mi era scappata una risata"}
    - tutor: "Che sia una battuta sull'ipocrisia l'hai colto in pieno. Riprendi però «mi aveva scappato una risata»: «scappare» non ha mai un oggetto, la risata scappa da sé. Quale ausiliare vuole?"
      prompt: {text: "mi aveva scappato una risata", tags: [auxiliary-choice]}
    - learner: "Mi era scappata una risata, certo, con «essere». Quella sugli autobus, del resto, era la mia preferita."
    - tutor: "Anche la mia: «A Roma l'autobus non si aspetta, si spera». Perché secondo te funzionava così bene?"
    - learner: "Perché tutti in sala l'avevano vissuto sulla propria pelle. E poi per la struttura: due verbi che sembrano simili e invece aprono due mondi diversi, la pazienza e la fede. È lo stesso meccanismo delle battute migliori, che ti prendono in contropiede con una sola parola."
    - tutor: "Analisi da professoressa. E tu, che parli spagnolo, ce l'hai un gioco di parole tra le due lingue?"
      goals: [favourite]
    - learner: "Ci provo, anche se è più una figuraccia che una battuta. Il primo mese ho detto alla mia professoressa che ero «embarazada», e lei mi ha fatto gli auguri, convinta che aspettassi un bambino. Quando gliel'ho spiegato, l'ho visto ridere fino alle lacrime."
      errors: [participle-agreement]
      gold: {text: "l'ho visto ridere", fix: "l'ho vista ridere"}
    - tutor: "«Embarazada» e «imbarazzata»: il falso amico perfetto! Riprendi però «l'ho visto ridere»: quel «l'» è la professoressa, e con «la» il participio si accorda. Come diventa?"
      goals: [wordplay]
      prompt: {text: "l'ho visto ridere", tags: [participle-agreement]}
    - learner: "L'ho vista ridere fino alle lacrime, e da quel giorno, quando mi incontra in corridoio, mi chiama «la futura mamma»."
    - tutor: "Un soprannome che ti meriti. Ma torniamo al comico: la battuta sui disabili, alla fine, a me ha lasciato un po' di amaro. Secondo te ha superato il limite?"
    - learner: "Sì, secondo me sì. Non perché ci siano argomenti proibiti, ma perché la risata andava contro chi non può rispondere, e la satira deve colpire chi sta in alto. Se domani lo incontrassi, gli lo direi in faccia, con gentilezza."
      errors: [combined-pronouns]
      gold: {text: "gli lo direi", fix: "glielo direi"}
    - tutor: "Sul fatto che la satira debba colpire chi sta in alto siamo d'accordo. Riprendi però «gli lo direi»: «gli» e «lo», insieme, formano una sola parola. Quale?"
      goals: [limits]
      prompt: {text: "gli lo direi", tags: [combined-pronouns]}
    - learner: "Glielo direi in faccia, con gentilezza. E magari gli consiglierei di fare un'altra battuta sul ministro della carbonara."
    - tutor: "Su quello il materiale non manca, ce n'è per anni. Un altro giro, e brindiamo alla satira che colpisce chi sta in alto?"

- scenario: assemblea-condominio
  # facts: palazzo di trenta appartamenti; preventivo di ottomila euro ad appartamento, uno solo, presentato dall'impresa che ha fatto il sopralluogo; la signora Bianchi, dal fondo: «aspettiamo che la facciata ci cada in testa»; l'ultimo sopralluogo del Comune, due anni fa, parlava solo dei balconi del lato mare; a giugno al learner avevano detto che se ne sarebbe discusso dopo l'estate; ora è ottobre; proposta: perizia di un ingegnere indipendente, millecinquecento euro in tutto (cinquanta a testa), entro due mesi; reti di protezione sotto i balconi del lato mare, circa tremila euro; impegno a votare a favore se la perizia conferma; nuova assemblea a dicembre; approvata a larga maggioranza
  level: C2
  persona: es-m-worker
  history: [conditional-form, article-form]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Grazie. Voglio essere chiaro fin dall'inizio: non sono contrario ai lavori, sono contrario a decidere stasera. Ottomila euro ad appartamento sono tanti, e abbiamo un solo preventivo, presentato dalla stessa impresa che ha fatto il sopralluogo."
    - tutor: "Prendo nota. Ma la signora Bianchi, dal fondo, dice: «Certo, aspettiamo che la facciata ci cada in testa». E non lo dice sottovoce."
      goals: [position]
    - learner: "Capisco la preoccupazione della signora Bianchi, e se la facciata fosse davvero pericolante sarei il primo a firmare. Ma l'ultimo sopralluogo del Comune, due anni fa, parlava solo dei balconi del lato mare, e se ci fosse stato un pericolo grave ce l'avrebbero già scritto."
    - tutor: "La signora Bianchi borbotta, ma si è seduta. Lei, allora, che cosa propone in concreto?"
      goals: [defuse]
    - learner: "Propongo la perizia di un ingegnere indipendente: circa millecinquecento euro in tutto, cioè cinquanta a testa. Ne avevo già parlato all'assemblea di giugno, e invece eccoci a ottobre, con un solo preventivo, anche se allora mi avevano detto che se ne discuterebbe dopo l'estate."
      errors: [conditional-form]
      gold: {text: "se ne discuterebbe dopo l'estate", fix: "se ne sarebbe discusso dopo l'estate"}
    - tutor: "Cinquanta euro a testa per una perizia indipendente: è una proposta difficile da respingere. Riprenda però «se ne discuterebbe dopo l'estate»: la promessa era di giugno, e l'autunno era il futuro di allora. Quale condizionale ci vuole?"
      prompt: {text: "se ne discuterebbe dopo l'estate", tags: [conditional-form]}
    - learner: "Mi avevano detto che se ne avrebbe discusso dopo l'estate."
      errors: [conditional-form]
    - tutor: "Le avevano detto che se ne sarebbe discusso dopo l'estate, e invece siamo a ottobre: fa bene a ricordarlo. Ma nel frattempo, se cade qualcosa dai balconi del lato mare?"
      recast: {text: "se ne avrebbe discusso", fix: "se ne sarebbe discusso", tags: [conditional-form]}
    - learner: "Nel frattempo metterei delle reti di protezione sotto i balconi del lato mare, che costano circa tremila euro, e chiederei all'ingegnere di consegnare la perizia entro due mesi, così anche i scettici avranno dati certi su cui decidere."
      errors: [article-form]
      gold: {text: "i scettici", fix: "gli scettici"}
    - tutor: "Reti subito e perizia entro due mesi: questa è un'alternativa seria. Riprenda solo «i scettici»: «scettici» comincia come «studenti». Quale articolo vuole?"
      goals: [alternative]
      prompt: {text: "i scettici", tags: [article-form]}
    - learner: "Anche gli scettici, certo. E se la perizia confermerà il preventivo, voterò a favore senza discutere."
    - tutor: "Vuole che lo metta a verbale, questo impegno? Perché la signora Bianchi glielo ricorderà, stia certo."
    - learner: "Lo metta pure a verbale, parola per parola: se la perizia darà ragione all'impresa, voterò a favore. Ma se invece dirà che basta sistemare i balconi, mi aspetto che lo stesso impegno lo prenda anche chi stasera voleva firmare subito."
    - tutor: "Mi pare un patto equo. Metto ai voti: reti di protezione subito, perizia entro due mesi e nuova assemblea a dicembre. Chi è favorevole?"
    - learner: "Vedo che la maggioranza è d'accordo, e la ringrazio, amministratore. Se stasera avessimo votato il preventivo senza discutere, domani qualcuno si pentirebbe di aver firmato; così, invece, a dicembre decideremo tutti con più serenità."
    - tutor: "Approvata a larga maggioranza, e metto a verbale anche il suo impegno. Ci rivediamo a dicembre, con la perizia in mano."
      goals: [compromise]

- scenario: email-rettore
  # facts: il learner è ricercatore ospite al Dipartimento di Lettere; a ottobre ha tenuto otto lezioni per il corso di letteratura comparata su richiesta del direttore; l'amministrazione non paga perché il contratto è stato firmato dopo l'inizio delle lezioni; ha conservato la mail del direttore che gli chiedeva di cominciare subito; vuole il pagamento e il riconoscimento della sua buona fede; apertura «Magnifico Rettore,»; frase troppo brusca: «Pretendo di essere pagato entro il mese»; chiusura «Con i più cordiali saluti»; il direttore leggerà il testo e firmeranno in due
  level: C2
  persona: en-m-heritage
  history: [participle-agreement, subjunctive-form, combined-pronouns]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno, grazie di ricevermi. A ottobre ho tenuto un ciclo di otto lezioni per il corso di letteratura comparata, su richiesta del direttore del Dipartimento; ora l'amministrazione mi dice che non può pagarmi, perché il contratto è stato firmato dopo l'inizio delle lezioni."
    - tutor: "Un caso purtroppo frequente. Che cosa vuole ottenere dal Rettore: il pagamento o un riconoscimento formale?"
    - learner: "Il pagamento, naturalmente, ma anche che si riconosca che il ritardo non è dipeso da me. La mail del direttore in cui mi chiedeva di cominciare subito l'ho conservato, e credo che sia la prova più chiara della mia buona fede."
      errors: [participle-agreement]
      gold: {text: "l'ho conservato", fix: "l'ho conservata"}
    - tutor: "Quella mail è il cuore della sua lettera. Riprenda però «l'ho conservato»: quel «l'» riprende «la mail del direttore». Come deve accordarsi il participio?"
      goals: [situation]
      prompt: {text: "l'ho conservato", tags: [participle-agreement]}
    - learner: "L'ho conservata, certo, e la allegherei alla lettera. Come dovrei cominciare?"
    - tutor: "Con «Magnifico Rettore,» e poi, in una riga, chi è e su che cosa scrive. Provi."
    - learner: "«Magnifico Rettore, mi permetto di rivolgermi a Lei in qualità di ricercatore ospite presso il Dipartimento di Lettere, in merito al mancato pagamento di un ciclo di lezioni da me tenute nel mese di ottobre.» Va bene così, o è troppo burocratico?"
    - tutor: "Va bene: burocratico quanto basta, e al Rettore piace. Ora mi legga la frase che la preoccupa di più."
      goals: [opening-formula]
    - learner: "Eccola: «Pretendo di essere pagato entro il mese». So che è troppo brusca. Vorrei dire la stessa cosa, ma in modo che il Rettore non si senti accusato e che capisca che chiedo soltanto ciò che mi spetta."
      errors: [subjunctive-form]
      gold: {text: "non si senti accusato", fix: "non si senta accusato"}
    - tutor: "«Pretendo», rivolto a un Rettore, è quasi una dichiarazione di guerra: ha fatto bene a fermarsi. Riprenda però «non si senti accusato»: il congiuntivo di «sentire» prende la stessa desinenza di «capisca», che ha usato subito dopo. Quindi?"
      prompt: {text: "non si senti accusato", tags: [subjunctive-form]}
    - learner: "Che il Rettore non si senta accusato. Allora potrei scrivere: «Mi permetto di chiederLe che mi venga riconosciuto il compenso pattuito, nella fiducia che la questione possa risolversi in tempi brevi»."
    - tutor: "Ecco, questo è fermo e cortese insieme. E per chiudere?"
      goals: [tone]
    - learner: "Pensavo a «Con i più cordiali saluti», perché «Con osservanza» mi sembra un po' troppo antico per me. E prima di inviare il testo vorrei che lo vedesse il direttore: domani gli lo faccio leggere e, se è d'accordo, firmiamo in due."
      errors: [combined-pronouns]
      gold: {text: "gli lo faccio leggere", fix: "glielo faccio leggere"}
    - tutor: "«Con i più cordiali saluti» va benissimo, e la doppia firma darà peso alla lettera. Riprenda però «gli lo faccio leggere»: «gli» e «lo», davanti al verbo, si fondono. Come?"
      goals: [closing]
      prompt: {text: "gli lo faccio leggere", tags: [combined-pronouns]}
    - learner: "Glielo faccio leggere domani, e poi la spedisco. Grazie davvero, mi ha risparmiato una figuraccia."
    - tutor: "Dovere. E se il Rettore risponde, me lo faccia sapere: sono curiosa anch'io."

- scenario: cena-suoceri
  # facts: la learner insegna spagnolo in un liceo di Prato da cinque anni; il compagno si chiama Marco; ribollita della madre di Giorgio, con il cavolo nero raccolto la mattina; progetto: una scuola di lingue per adulti con una collega, corsi serali; due anni fa Marco aveva promesso di aiutarla con i conti; promessa della paella ogni domenica; il padre si chiama Giorgio e propone il tu; ricetta della ribollita da fare insieme
  level: C2
  persona: es-f-teacher
  history: [imperative-form, conditional-form, adjective-agreement]
  turns:
    - tutor: "Prego, si sieda pure. Mio figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Grazie mille, è un piacere conoscervi finalmente. Le assicuro che sono reale, anche se ammetto di essere un po' nervosa: Marco mi ha descritto questa cena come un esame orale, e io gli esami li preferisco dall'altra parte della cattedra."
    - tutor: "Dall'altra parte della cattedra? Allora Lei è un'insegnante. Spero che non ci dia i voti anche a cena."
    - learner: "Prometto di non dare voti, a meno che la ribollita non sia buona come sembra: in quel caso sarebbe un dieci. E la prego, non si alza per servirmi, faccio da sola: sono abituata a una famiglia numerosa."
      errors: [imperative-form]
      gold: {text: "non si alza per servirmi", fix: "non si alzi per servirmi"}
    - tutor: "Un dieci alla ribollita: mia moglie ne sarà felice. Riprenda però «non si alza per servirmi»: è un invito rivolto a me, a cui dà del Lei. Come diventa?"
      goals: [irony, compliment]
      prompt: {text: "non si alza per servirmi", tags: [imperative-form]}
    - learner: "Non si alzi per servirmi, la prego. La ribollita è davvero squisita: è una ricetta di famiglia?"
    - tutor: "Di mia madre, che ci metteva il cavolo nero raccolto la mattina stessa. Ma ci parli di Lei: dove insegna?"
    - learner: "Insegno spagnolo in un liceo di Prato da cinque anni. Mi piace molto, ma con una collega stiamo pensando di aprire una piccola scuola di lingue per adulti, perché vediamo che molte persone vogliono imparare e la sera non trovano corsi."
    - tutor: "Una scuola tutta vostra: coraggioso, di questi tempi. E mio figlio, in questo progetto, che ruolo avrebbe?"
      goals: [background]
    - learner: "Il commercialista, se accetta! Scherzi a parte, adesso che il progetto è serio spero che mantenga la promessa: ne avevamo parlato già due anni fa, e allora lui mi aveva detto che mi aiuterebbe con i conti."
      errors: [conditional-form]
      gold: {text: "mi aiuterebbe con i conti", fix: "mi avrebbe aiutata con i conti"}
    - tutor: "Conoscendo mio figlio, la promessa la manterrà, ma vorrà essere pagato in paella. Riprenda però «mi aiuterebbe con i conti»: la promessa è di due anni fa, e l'aiuto era il futuro di allora. Quale condizionale serve?"
      prompt: {text: "mi aiuterebbe con i conti", tags: [conditional-form]}
    - learner: "Mi aveva detto che mi avrebbe aiutata con i conti. E la paella gliela preparo volentieri, anche tutte le domeniche."
    - tutor: "Sa che cosa le dico? Con chi promette la paella tutte le domeniche possiamo anche darci del tu: io sono Giorgio."
    - learner: "Con piacere, Giorgio, e grazie. Ti confesso che il passaggio al tu, che temevo sarebbe arrivato solo dopo anni di pranzi domenicali, mi rende questa serata ancora più bello."
      errors: [adjective-agreement]
      gold: {text: "ancora più bello", fix: "ancora più bella"}
    - tutor: "Gli anni di pranzi domenicali li faremo comunque. Riprendi solo «ancora più bello»: l'aggettivo si riferisce a «questa serata». Come deve finire?"
      goals: [tu-lei]
      prompt: {text: "ancora più bello", tags: [adjective-agreement]}
    - learner: "Ancora più bella, certo. E adesso, Giorgio, me la dai la ricetta della ribollita?"
    - tutor: "Te la scrivo stasera stessa, ma la prima volta la facciamo insieme: in questa casa le ricette si imparano ai fornelli, non sulla carta."

- scenario: intervista-radio
  # facts: il libro della learner si intitola «La grammatica dei gesti»; lei è inglese e vive a Napoli da quindici anni; con un gesto si esprime ironia, minaccia o tenerezza, nel traffico si evitano litigi; aneddoto: al mercato ha unito le dita per chiedere il prezzo delle vongole, il pescivendolo l'ha preso per «ma che vuoi?» e il prezzo è salito di due euro, pagato per orgoglio; l'italiano le ha insegnato a interrompere; l'estate scorsa a Londra la sorella le ha fatto notare che interrompeva; ora conta fino a tre; battuta finale sulle mani in tasca
  level: C2
  persona: en-f-professional
  history: [passive, auxiliary-choice, combined-pronouns]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, l'incoscienza è tutta mia. Il libro si intitola «La grammatica dei gesti»: in quindici anni a Napoli ho capito che metà della lingua italiana passa per le mani, e ho provato a scriverne il dizionario, con tutte le figuracce che ho fatto per impararlo."
    - tutor: "Un dizionario dei gesti scritto da un'inglese: già questo è una provocazione. Ma allora ce lo dica: parliamo con le mani perché non sappiamo stare zitti?"
      goals: [present-book]
    - learner: "Al contrario: le mani servono proprio a dire ciò che a parole sarebbe troppo. Con un solo gesto si può esprimere ironia, minaccia o tenerezza, e in certe situazioni, per esempio nel traffico, si evita parecchi litigi senza aprire bocca."
      errors: [passive]
      gold: {text: "si evita parecchi litigi", fix: "si evitano parecchi litigi"}
    - tutor: "Nel traffico, dice: qui a Roma ne vedo ogni giorno. Riprenda però «si evita parecchi litigi»: con il «si» passivante, il verbo concorda con «parecchi litigi». Come diventa?"
      goals: [stereotype]
      prompt: {text: "si evita parecchi litigi", tags: [passive]}
    - learner: "Si evitano parecchi litigi, certo. Anzi, a volte se ne provocano altri, se il gesto è sbagliato."
    - tutor: "Ecco, ci racconti proprio uno di quei gesti sbagliati."
    - learner: "Il primo mese, al mercato, ho chiesto al pescivendolo il prezzo delle vongole e ho unito le dita della mano per dire «quanto?». Lui l'ha preso per «ma che vuoi?», si è offeso, e il prezzo delle vongole ha salito di due euro."
      errors: [auxiliary-choice]
      gold: {text: "ha salito di due euro", fix: "è salito di due euro"}
    - tutor: "Il gesto più famoso d'Italia, usato nel momento peggiore: meraviglioso. Riprenda però «ha salito di due euro»: qui il prezzo cambia da solo, senza oggetto. Quale ausiliare vuole il verbo?"
      goals: [anecdote]
      prompt: {text: "ha salito di due euro", tags: [auxiliary-choice]}
    - learner: "Il prezzo è salito di due euro, e io le vongole le ho pagate lo stesso, per orgoglio."
    - tutor: "Per orgoglio: molto napoletano. E la lingua, dentro di lei, che cosa ha cambiato?"
    - learner: "Mi ha insegnato a interrompere. In Inghilterra si aspetta che l'altro finisca; qui, se aspetti, la conversazione va avanti senza di te. All'inizio mi sembrava maleducazione, adesso la considero una forma di partecipazione, quasi un applauso."
    - tutor: "Interrompere come forma di applauso: questa la rubo per un'altra puntata. Ma i suoi amici inglesi, quando torna a Londra, la riconoscono ancora?"
      goals: [language]
    - learner: "Ogni tanto no. L'estate scorsa, a una cena a Londra, ho interrotto tre volte la padrona di casa, e alla fine mia sorella mi ha presa da parte e, con molto tatto, mi lo ha fatto notare."
      errors: [combined-pronouns]
      gold: {text: "mi lo ha fatto notare", fix: "me lo ha fatto notare"}
    - tutor: "Con la discrezione tipica degli inglesi. Riprenda però «mi lo ha fatto notare»: davanti a «lo», il pronome «mi» cambia vocale. Come?"
      prompt: {text: "mi lo ha fatto notare", tags: [combined-pronouns]}
    - learner: "Me lo ha fatto notare, con molto tatto. Da allora, a Londra, conto fino a tre prima di parlare."
    - tutor: "«Conto fino a tre»: un buon titolo per il prossimo libro. Ci lascia con una battuta, prima della pubblicità?"
    - learner: "Volentieri: in Italia ho imparato che una mano in tasca è una frase lasciata a metà. Quindi, cari ascoltatori, se mi incontrate per strada con le mani in tasca, non offendetevi: sto solo riposando la voce."
    - tutor: "Bellissima. Grazie, e a tutti voi, cari ascoltatori, mani fuori dalle tasche e buon ascolto!"
      goals: [farewell]

# Set r-morph-late, file 1 (C1): work meetings, promotions, pitches, suppliers, interviews.
# One small morphology slip in the last third of a long, content-heavy turn (auxiliary with
# change-of-state verbs, participle and adjective agreement, si passivante, congiuntivo endings,
# conditional by time, Lei imperatives, combined pronouns, article forms), beside long correct turns.
- scenario: riunione-lavoro
  # facts: sito per una catena di palestre; lunedì prime pagine mostrate al cliente; testi del cliente bloccati da due settimane; costi dell'hosting aumentati quasi del venti per cento da gennaio; proposta: pubblicare prima home e orari; prima versione venerdì 8 marzo, consegna finale il 15; se i testi non arrivano se ne riparla lunedì
  level: C1
  persona: en-f-professional
  history: [auxiliary-choice, combined-pronouns]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene, direi. La parte grafica del sito per la catena di palestre è quasi finita, e lunedì ho mostrato le prime pagine al cliente, che le ha trovate chiare e moderne. Restano i testi, però."
    - tutor: "Mi fa piacere che le pagine siano piaciute. E i testi a che punto sono? Li scrive il cliente o ce ne occupiamo noi?"
      goals: [update]
    - learner: "Dovrebbe scriverli il cliente, ma siamo bloccati da due settimane. In più c'è un altro problema: da gennaio i costi dell'hosting che avevamo previsto nel preventivo hanno aumentato quasi del venti per cento."
      errors: [auxiliary-choice]
      gold: {text: "hanno aumentato", fix: "sono aumentati"}
    - tutor: "Venti per cento non è poco, e il cliente va avvisato. Riprendi però «hanno aumentato»: qui «aumentare» non ha un oggetto, sono i costi stessi a crescere. Quale ausiliare ci vuole?"
      goals: [problem]
      prompt: {text: "hanno aumentato", tags: [auxiliary-choice]}
    - learner: "Giusto: i costi dell'hosting sono aumentati quasi del venti per cento. Secondo te conviene dirlo subito al cliente o aspettare la fine del progetto?"
    - tutor: "Così va bene. Io lo direi subito, con i numeri in mano: le sorprese a fine progetto non le perdona nessuno. Tu intanto come pensi di sbloccare i testi?"
    - learner: "Avrei un'idea: invece di aspettare tutti i testi, potremmo pubblicare prima le pagine pronte, cioè la home e gli orari delle palestre, e aggiungere il resto man mano che il cliente ce lo manda. Che ne pensi?"
    - tutor: "Mi piace: il cliente vede qualcosa online e forse si sbriga anche con il resto. Ne parli tu con loro o preferisci che lo faccia io?"
      goals: [proposal]
    - learner: "Preferisco parlarne io, perché conosco bene la loro responsabile marketing. Le scrivo oggi stesso e, se mi risponde entro domani, la proposta gli la presento giovedì in videochiamata."
      errors: [combined-pronouns]
      gold: {text: "gli la presento", fix: "gliela presento"}
    - tutor: "Che sia tu a parlarle, visto che la conosci, mi sembra la scelta giusta. Però guarda «gli la presento»: quando «gli» si unisce a «la», le due parole restano staccate?"
      prompt: {text: "gli la presento", tags: [combined-pronouns]}
    - learner: "Allora... le la presento giovedì, perché lei è una donna."
      errors: [combined-pronouns]
    - tutor: "«Gliela presento giovedì», anche se è una donna: davanti a «la», pure «le» diventa «glie». Fissiamo la scadenza, allora: entro quando ci serve la prima versione online?"
      recast: {text: "le la presento", fix: "gliela presento", tags: [combined-pronouns]}
    - learner: "Direi venerdì 8 marzo, una settimana prima della consegna del 15. Così, se il cliente manda in ritardo anche le foto, abbiamo il tempo di chiedere una mano a un stagista del reparto grafico."
      errors: [article-form]
      gold: {text: "un stagista", fix: "uno stagista"}
    - tutor: "Venerdì 8 marzo mi sembra ragionevole. Guarda solo «un stagista»: davanti a una parola che comincia con «s» più consonante, quale articolo indeterminativo si usa?"
      prompt: {text: "un stagista", tags: [article-form]}
    - learner: "Uno stagista, certo. Allora venerdì 8 marzo la prima versione e il 15 la consegna finale."
    - tutor: "Perfetto, lo scrivo nel verbale: prima versione venerdì 8, consegna il 15. E se i testi non arrivano, ne riparliamo lunedì."
      goals: [deadline]

- scenario: colloquio-promozione
  # facts: il learner lavora nel reparto logistica da quattro anni; quest'anno tempi di consegna ridotti da cinque a tre giorni riorganizzando i turni; chiede il posto di coordinatore del magazzino di Bologna, libero da marzo; il budget per le promozioni si decide a giugno; dubbio del manager: nessuna esperienza formale nella gestione di un gruppo; accordo: corso di gestione del personale in autunno, colloquio a giugno, email di riepilogo entro domani
  level: C1
  persona: es-m-worker
  history: [conditional-form, imperative-form]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie per avermi ricevuto. Lavoro nel reparto logistica da quattro anni e quest'anno, riorganizzando i turni del magazzino, siamo riusciti a ridurre i tempi di consegna da cinque a tre giorni."
    - tutor: "Da cinque a tre giorni è un risultato che in direzione hanno notato tutti. Immagino però che non sia venuto solo per raccontarmelo."
      goals: [results]
    - learner: "Ha ragione, non solo per quello. Il posto di coordinatore del magazzino di Bologna è libero da marzo e, a dire la verità, l'anno scorso glielo chiederei già, ma allora mi sembrava troppo presto."
      errors: [conditional-form]
      gold: {text: "glielo chiederei già", fix: "glielo avrei già chiesto"}
    - tutor: "Il posto di Bologna, dunque. Riprenda però «glielo chiederei già»: Lei parla dell'anno scorso, di una cosa che allora non ha fatto. Il condizionale presente funziona per un momento passato?"
      prompt: {text: "glielo chiederei già", tags: [conditional-form]}
    - learner: "No, ci vuole il condizionale passato: l'anno scorso glielo avrei già chiesto, ma mi sembrava troppo presto. Lei pensa che adesso sia il momento giusto?"
    - tutor: "Ora la frase è giusta. Quanto al momento, il budget per le promozioni si decide a giugno, quindi la sua domanda arriva in tempo. Mi dica perché dovremmo scegliere proprio Lei."
      goals: [request]
    - learner: "Perché conosco ogni fase del lavoro, dal carico dei camion ai rapporti con i fornitori, e i colleghi vengono già da me quando c'è un problema. Anche le scelte sui turni, che all'inizio a molti sembravano strane, si sono rivelate giusti."
      errors: [adjective-agreement]
      gold: {text: "si sono rivelate giusti", fix: "si sono rivelate giuste"}
    - tutor: "I numeri in effetti le danno ragione. Rilegga però «si sono rivelate giusti»: l'aggettivo si riferisce a «le scelte». Come deve finire, allora?"
      prompt: {text: "si sono rivelate giusti", tags: [adjective-agreement]}
    - learner: "Giuste, perché le scelte sono femminili: si sono rivelate giuste. Ma immagino che Lei abbia qualche dubbio."
    - tutor: "Uno, e glielo dico con franchezza: Lei non ha mai gestito un gruppo in modo formale, con valutazioni, ferie e conflitti. Come risponde a questa obiezione?"
    - learner: "Capisco il dubbio, e non lo trovo ingiusto. Per questo vorrei frequentare un corso di gestione del personale in autunno e dimostrarle, prima di parlare di stipendio, di essere all'altezza: non si preoccupa, non la deluderò."
      errors: [imperative-form]
      gold: {text: "non si preoccupa", fix: "non si preoccupi"}
    - tutor: "Il corso in autunno è un'idea seria. Ma riascolti «non si preoccupa»: Lei mi sta rivolgendo un invito, e con il Lei l'imperativo ha una forma sua. Quale?"
      prompt: {text: "non si preoccupa", tags: [imperative-form]}
    - learner: "Allora... non si preoccupe, volevo dire, le dimostrerò di essere all'altezza."
      errors: [imperative-form]
    - tutor: "Non si preoccupi, appunto: mi basta vederlo nei fatti. Facciamo così: Lei frequenta il corso in autunno e a giugno ci rivediamo per decidere su Bologna, con il budget in mano. Le va bene?"
      goals: [handle]
      recast: {text: "non si preoccupe", fix: "non si preoccupi", tags: [imperative-form]}
    - learner: "Mi va benissimo. Le chiedo solo di mettere per iscritto questo accordo, così a giugno partiamo da una base chiara e nessuno dei due deve ricordare a memoria quello che ci siamo detti oggi."
    - tutor: "Richiesta più che giusta: le mando un'email di riepilogo entro domani, con il corso e il colloquio di giugno. Buon lavoro, e ancora complimenti per i tempi di consegna."
      goals: [next-steps]

- scenario: presentazione-progetto
  # facts: progetto: applicazione per prenotare le sale riunioni delle sedi di Milano e Torino; oggi prenotazioni via email e fogli condivisi; costo circa ottantamila euro con la manutenzione del primo anno; calcolo delle risorse umane: quasi trecento ore perse a settimana; l'azienda ha già comprato due programmi che nessuno usa; prova di tre mesi a Torino (una quarantina di persone, sei sale), poi forse Milano a settembre (quindici sale); rapporto ogni due settimane; nuovo incontro il 12 aprile
  level: C1
  persona: en-m-traveller
  history: [passive, subjunctive-form]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Le rubo solo cinque minuti. Il progetto è un'applicazione per prenotare le sale riunioni delle sedi di Milano e Torino: oggi le prenotazioni passano per email e fogli condivisi, e il risultato sono sale doppie o vuote."
    - tutor: "Il problema delle sale lo conosco anch'io, purtroppo. Ma mi dica subito la cifra: quanto ci costerebbe?"
      goals: [pitch]
    - learner: "Circa ottantamila euro, compresa la manutenzione del primo anno. Secondo i nostri calcoli, tra riunioni spostate, sale occupate per errore e colleghi che si cercano per i corridoi, ogni settimana in azienda si perde quasi trecento ore."
      errors: [passive]
      gold: {text: "si perde quasi trecento ore", fix: "si perdono quasi trecento ore"}
    - tutor: "Trecento ore a settimana sarebbero tante, se il calcolo regge. Riprenda però «si perde quasi trecento ore»: con il «si» passivante, il verbo concorda con quale parola della frase?"
      prompt: {text: "si perde quasi trecento ore", tags: [passive]}
    - learner: "Con «ore», quindi: si perdono quasi trecento ore ogni settimana. Il calcolo l'ha fatto l'ufficio risorse umane, non io."
    - tutor: "Va bene così. I benefici li vedo, ma il rischio è un altro: abbiamo già comprato due programmi che nessuno usa. Perché questo dovrebbe andare diversamente?"
      goals: [benefits]
    - learner: "Perché lo abbiamo progettato con i colleghi, non per i colleghi. Capisco comunque il timore, ed è per questo che propongo una prova di tre mesi: è importante che ognuno lo provi e che ci dichi subito cosa non funziona."
      errors: [subjunctive-form]
      gold: {text: "ci dichi", fix: "ci dica"}
    - tutor: "Sull'idea di coinvolgere i colleghi fin dall'inizio ha ragione. Però guardi «ci dichi»: «dire» non è un verbo in «-are», e al congiuntivo presente la terza persona non finisce in «-i». Come fa?"
      prompt: {text: "ci dichi", tags: [subjunctive-form]}
    - learner: "Allora è importante che ognuno lo provi e che ci dice subito cosa non funziona."
      errors: [subjunctive-form]
    - tutor: "È importante che ognuno lo provi e ci dica subito cosa non funziona, d'accordo. Ma dove farebbe questa prova di tre mesi?"
      recast: {text: "ci dice", fix: "ci dica", tags: [subjunctive-form]}
    - learner: "Nella sede di Torino, che è più piccola: una quarantina di persone e sei sale. Se i risultati saranno buoni, a settembre si potrebbe estendere l'applicazione anche a Milano, dove le sale sono quindici."
    - tutor: "Partire da una sede piccola mi sembra prudente. E chi segue la prova, Lei personalmente o il fornitore?"
      goals: [objection]
    - learner: "La seguo io, con un collega dell'informatica. Ogni due settimane le manderò un breve rapporto con i dati principali: le prenotazioni, le sale rimaste vuote e i errori più frequenti segnalati dagli utenti."
      errors: [article-form]
      gold: {text: "i errori", fix: "gli errori"}
    - tutor: "Un rapporto ogni due settimane mi basta. Rilegga solo «i errori»: davanti a un nome maschile plurale che comincia per vocale, quale articolo ci vuole?"
      prompt: {text: "i errori", tags: [article-form]}
    - learner: "Le errori, certo."
      errors: [article-form]
    - tutor: "«Gli errori»: «errore» è maschile, e davanti a una vocale il plurale è questo. Mi dica pure il resto."
      recast: {text: "Le errori", fix: "Gli errori", tags: [article-form]}
    - learner: "Gli errori, certo. Allora possiamo fissare un nuovo incontro per decidere sul budget?"
    - tutor: "Sì: ci rivediamo il 12 aprile, e per allora mi porti il piano della prova di Torino con i costi divisi per fase. Adesso devo proprio scappare."
      goals: [next-steps]

- scenario: trattativa-fornitore
  # facts: aumento del listino del quindici per cento, comunicato con due settimane di preavviso; il fornitore paga la carta il trenta per cento in più dell'anno scorso; il learner è cliente da sei anni, circa quarantamila vassoi al mese; controfferta: otto per cento con contratto di due anni; il fornitore propone il dieci con ordini minimi di quarantacinquemila vassoi al mese; preventivo aggiornato entro un'ora; conferma scritta entro venerdì
  level: C1
  persona: es-f-teacher
  history: [hypothetical, combined-pronouns, imperative-form]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Sì, la chiamo proprio per quello. Capisco che le materie prime siano salite, ma un aumento del quindici per cento, comunicato con due settimane di preavviso, per un'azienda piccola come la nostra è difficile da assorbire."
    - tutor: "Lo capisco, e non le nascondo che molti clienti ci hanno detto la stessa cosa. Noi però la carta la paghiamo il trenta per cento in più rispetto all'anno scorso."
      goals: [problem]
    - learner: "Lo so, e non vi chiedo di lavorare in perdita. Però siamo vostri clienti da sei anni, con circa quarantamila vassoi al mese, e se la concorrenza ci farebbe un'offerta migliore dovremmo almeno valutarla."
      errors: [hypothetical]
      gold: {text: "se la concorrenza ci farebbe", fix: "se la concorrenza ci facesse"}
    - tutor: "Sei anni di rapporto contano, su questo ha perfettamente ragione. Ma riprenda «se la concorrenza ci farebbe»: dopo un «se» che introduce un'ipotesi, il condizionale è il modo giusto?"
      prompt: {text: "se la concorrenza ci farebbe", tags: [hypothetical]}
    - learner: "No, ci vuole il congiuntivo imperfetto: se la concorrenza ci facesse un'offerta migliore, dovremmo valutarla. Non è una minaccia, è solo realismo."
    - tutor: "Così è corretto, e il realismo lo apprezzo. Mi dica allora che cosa ha in mente, concretamente."
      goals: [argue]
    - learner: "Proporrei un aumento dell'otto per cento invece del quindici, in cambio di un contratto di due anni. Voi avreste un cliente sicuro fino al 2028, e noi potremmo pianificare i costi senza sorprese a ogni trimestre."
    - tutor: "L'otto è troppo poco, glielo dico sinceramente: non coprirebbe nemmeno l'aumento della carta. Potrei arrivare al dieci, ma solo con ordini garantiti di almeno quarantacinquemila vassoi al mese. Che ne dice?"
      goals: [counteroffer]
    - learner: "Quarantacinquemila è un po' più di quanto ordiniamo adesso, ma in primavera i volumi crescono sempre. Devo comunque sentire il nostro direttore: se Lei mi prepara un preventivo aggiornato, gli lo mando oggi stesso."
      errors: [combined-pronouns]
      gold: {text: "gli lo mando", fix: "glielo mando"}
    - tutor: "Il preventivo aggiornato posso prepararlo entro un'ora. Guardi però «gli lo mando»: quando «gli» incontra «lo», le due parole restano separate?"
      prompt: {text: "gli lo mando", tags: [combined-pronouns]}
    - learner: "Ah, allora: glie lo mando oggi stesso, appena arriva."
      errors: [combined-pronouns]
    - tutor: "«Glielo mando oggi stesso», tutto attaccato: così il suo direttore ha i numeri prima di sera. Ci risentiamo domani mattina?"
      recast: {text: "glie lo mando", fix: "glielo mando", tags: [combined-pronouns]}
    - learner: "Domani mattina va benissimo. Se il direttore è d'accordo, le confermo il dieci per cento con un minimo di quarantacinquemila vassoi, e vorrei che l'accordo valesse per due anni, come dicevamo."
    - tutor: "Per due anni, d'accordo, al dieci per cento e con quel minimo mensile. Mi manda una conferma scritta entro venerdì, così preparo il contratto?"
    - learner: "Certo, la conferma gliela mando entro venerdì. Il numero del cellulare è nella firma delle mie email: per qualsiasi dubbio sul contratto, anche il sabato, mi chiama pure."
      errors: [imperative-form]
      gold: {text: "mi chiama pure", fix: "mi chiami pure"}
    - tutor: "Venerdì va bene. Riascolti «mi chiama pure»: è un invito rivolto a una persona a cui dà del Lei, e quell'invito ha una forma sua. Quale?"
      prompt: {text: "mi chiama pure", tags: [imperative-form]}
    - learner: "Mi chiami pure sul cellulare, volevo dire. Grazie per la disponibilità."
    - tutor: "Grazie a Lei. Aspetto la conferma entro venerdì e intanto preparo il contratto: dieci per cento, due anni, quarantacinquemila vassoi al mese."
      goals: [agreement]

- scenario: colloquio-lavoro
  # facts: la candidata si chiama Emma, laureata in design industriale a Glasgow; due anni in uno studio di Edimburgo che progettava lampade per alberghi e ristoranti; trasferita a Bologna l'anno scorso perché il marito ha ricevuto un'offerta dall'università; ultimo progetto: duemila lampade da tavolo per una catena di hotel, altre mille ordinate l'anno dopo; l'azienda disegna arredi da ufficio; la sedia in legno chiaro è il prodotto più venduto; gruppo: due senior, tre junior e il direttore creativo; secondo colloquio martedì prossimo alle dieci
  level: C1
  persona: en-f-student
  history: [participle-agreement, conditional-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Mi chiamo Emma, mi sono laureata in design industriale a Glasgow e poi ho lavorato due anni in uno studio di Edimburgo che progettava lampade per alberghi e ristoranti."
    - tutor: "Lampade per alberghi, interessante. E che cosa l'ha portata in Italia, proprio a Bologna?"
      goals: [intro]
    - learner: "Mio marito ha ricevuto un'offerta dall'università, e così l'anno scorso ci siamo trasferiti qui. All'inizio è stata dura con la lingua, ma dopo qualche mese le mie giornate sono diventato molto più semplici."
      errors: [participle-agreement]
      gold: {text: "le mie giornate sono diventato", fix: "le mie giornate sono diventate"}
    - tutor: "Si sente che quei mesi sono serviti. Riprenda però «le mie giornate sono diventato»: con l'ausiliare «essere», il participio concorda con quale parola?"
      new: [{lemma: ausiliare, gloss: auxiliary verb}, {lemma: participio, gloss: participle}]
      prompt: {text: "le mie giornate sono diventato", tags: [participle-agreement]}
    - learner: "Con «giornate»: le mie giornate sono diventate molto più semplici. Adesso al mercato discuto perfino sul prezzo dei pomodori."
    - tutor: "Allora è pronta anche a trattare con i fornitori. Mi parli del lavoro a Edimburgo: di che cosa si occupava, in concreto?"
    - learner: "Seguivo i progetti dall'idea al prototipo. L'ultimo è stato una serie di lampade da tavolo per una catena di hotel: ne abbiamo prodotte duemila, e il cliente ce ne ha ordinate altre mille l'anno dopo."
    - tutor: "Un cliente che torna a ordinare è la migliore pubblicità. Qui disegniamo soprattutto mobili per l'ufficio: mi dica un suo punto di forza e un punto debole."
      goals: [experience]
    - learner: "Il mio punto di forza è la pazienza con i prototipi: li rifaccio dieci volte senza problemi. Il punto debole è che a volte lavoro troppo da sola; nel primo anno chiederei aiuto più spesso, se fossi stata meno timida."
      errors: [conditional-form]
      gold: {text: "chiederei aiuto più spesso", fix: "avrei chiesto aiuto più spesso"}
    - tutor: "Riconoscere che si lavora troppo da soli è già un buon inizio. Ma guardi «chiederei aiuto più spesso»: si parla del primo anno, ormai concluso. Quale condizionale ci vuole?"
      prompt: {text: "chiederei aiuto più spesso", tags: [conditional-form]}
    - learner: "Il condizionale passato: nel primo anno avessi chiesto aiuto più spesso, se fossi stata meno timida."
      errors: [conditional-form]
    - tutor: "Nel primo anno avrei chiesto aiuto più spesso, capisco: all'inizio capita a molti. E perché vorrebbe lavorare proprio da noi, invece che in uno studio più grande?"
      goals: [strengths]
      recast: {text: "avessi chiesto aiuto più spesso", fix: "avrei chiesto aiuto più spesso", tags: [conditional-form]}
    - learner: "Perché in uno studio piccolo si segue tutto il processo e non solo un dettaglio. Ho visto anche la vostra sedia per le sale riunioni, quella in legno chiaro: la trovo elegante e, nonostante il prezzo contenuto, molto robusto."
      errors: [adjective-agreement]
      gold: {text: "molto robusto", fix: "molto robusta"}
    - tutor: "Quella sedia è il nostro prodotto più venduto. Rilegga però «molto robusto»: l'aggettivo si riferisce sempre alla sedia, giusto? Allora come deve finire?"
      goals: [why]
      prompt: {text: "molto robusto", tags: [adjective-agreement]}
    - learner: "Molto robusta, scusi. Posso farle una domanda? Come è organizzato il gruppo di design, e con chi lavorerei ogni giorno?"
    - tutor: "Siamo in sei: due progettisti esperti, tre più giovani e il direttore creativo, con cui farebbe il secondo colloquio. Le andrebbe bene martedì prossimo alle dieci?"
      goals: [questions]
    - learner: "Martedì alle dieci va benissimo. Porterò anche il portfolio stampato, perché alcuni prototipi in fotografia non rendono come dal vero, soprattutto quelli in vetro."
    - tutor: "Ottima idea, il direttore creativo ci tiene molto. Allora a martedì alle dieci, e grazie per essere venuta."

- scenario: mediazione-colleghi
  # facts: la presentazione per il cliente è stata preparata in tre settimane dal tutor e da Marco; ieri Marco l'ha presentata da solo e ha detto «ci ho pensato io»; le analisi dei dati le ha fatte il tutor; il cliente ha ringraziato solo Marco e gli ha chiesto di seguire la seconda fase; nessuno aveva deciso chi presentava, venerdì la riunione di preparazione era finita di corsa; soluzione: email al cliente con i due nomi stamattina, presentazione comune alla seconda fase il 20 maggio; incontro a tre giovedì alle nove nell'ufficio del learner
  level: C1
  persona: en-m-heritage
  history: [subjunctive-form, auxiliary-choice, adjective-agreement]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, per favore, e mi racconti con calma. Ieri ho notato anch'io che qualcosa non andava, ma preferisco sentire la sua versione prima di farmi un'idea."
    - tutor: "Grazie. La presentazione l'abbiamo preparata in tre settimane, io e Marco. Ieri lui l'ha presentata da solo e ha detto al cliente «ci ho pensato io». Le analisi dei dati, però, le ho fatte io."
    - learner: "Capisco perfettamente perché si senta offeso, e credo che abbia fatto bene a parlarne subito. Prima di decidere qualcosa, però, è giusto che anche Marco mi dii la sua versione dei fatti."
      errors: [subjunctive-form]
      gold: {text: "mi dii", fix: "mi dia"}
    - tutor: "Che Lei senta anche Marco mi sembra giusto, non voglio processi a nessuno. Però riprenda «mi dii»: il congiuntivo presente di «dare», alla terza persona, come fa?"
      prompt: {text: "mi dii", tags: [subjunctive-form]}
    - learner: "Mi dia, scusi: è giusto che anche Marco mi dia la sua versione. Mi dice intanto se il cliente ha capito che il lavoro era di tutti e due?"
    - tutor: "No: il cliente ha ringraziato solo lui, e alla fine gli ha chiesto di seguire anche la seconda fase. Per questo mi brucia così tanto."
      goals: [listen]
    - learner: "Questo lo capisco, e mi dispiace. Le faccio una domanda, senza nessuna accusa: avevate deciso prima chi avrebbe presentato? Mi chiedo se venerdì la riunione di preparazione ha finito troppo in fretta, senza chiarirlo."
      errors: [auxiliary-choice]
      gold: {text: "la riunione di preparazione ha finito", fix: "la riunione di preparazione è finita"}
    - tutor: "No, non l'avevamo deciso, ed è vero che venerdì siamo usciti di corsa. Riprenda però «la riunione di preparazione ha finito»: qui la riunione non conclude qualcosa, si conclude lei. Quale ausiliare vuole allora il verbo?"
      goals: [clarify]
      prompt: {text: "la riunione di preparazione ha finito", tags: [auxiliary-choice]}
    - learner: "Sì, la riunione di preparazione è finita troppo in fretta, e quindi una parte della responsabilità è anche mia, che la guidavo."
    - tutor: "Apprezzo che lo dica. Resta il fatto che quella frase al cliente l'ha detta Marco, non Lei."
    - learner: "Questo è vero. Conoscendo Marco, però, non credo che volesse prendersi il merito: quando è nervoso parla in prima persona anche delle cose fatte dagli altri. Non lo giustifico, cerco solo di capire che cosa gli è passato per la testa."
    - tutor: "Può darsi, in effetti davanti ai clienti si agita sempre. Questo però non cambia il fatto che adesso il cliente pensa che le analisi siano sue. Lei che cosa propone?"
      goals: [perspective]
    - learner: "Propongo due cose: oggi scrivo al cliente un riepilogo della presentazione con i nomi di tutti e due, e alla seconda fase, il 20 maggio, presentate insieme. Credo che questa soluzione, se la spieghiamo bene a Marco, sia abbastanza giusto."
      errors: [adjective-agreement]
      gold: {text: "abbastanza giusto", fix: "abbastanza giusta"}
    - tutor: "Un'email al cliente con i nostri due nomi è proprio quello che speravo. Rilegga solo «abbastanza giusto»: a quale nome si riferisce l'aggettivo, e quindi come concorda?"
      prompt: {text: "abbastanza giusto", tags: [adjective-agreement]}
    - learner: "Alla soluzione: credo che sia abbastanza giusti per tutti e due."
      errors: [adjective-agreement]
    - tutor: "Abbastanza giusta per tutti e due, sì, e a me va bene. Ne parliamo insieme, noi tre, giovedì?"
      goals: [solution]
      recast: {text: "abbastanza giusti", fix: "abbastanza giusta", tags: [adjective-agreement]}
    - learner: "Giovedì alle nove nel mio ufficio, allora. Intanto l'email al cliente la mando stamattina e metto in copia lei e Marco, così vedete tutti e due che cosa ho scritto."
    - tutor: "Grazie, davvero. Giovedì alle nove ci sarò."

- scenario: smartworking
  # facts: la learner lavora per un'agenzia di traduzioni, da casa quattro giorni su cinque, in ufficio a Milano il venerdì per la riunione settimanale; abita a Monza, un'ora di treno; l'anno scorso ha montato da sola una sedia ergonomica data dall'azienda; Andrea va in ufficio tutti i giorni, venti minuti in bici, sedia vecchia di otto anni; a marzo una traduzione difficile le ha preso due giorni; ideale: tre giorni a casa, martedì e venerdì in ufficio, uno spazio per lavorare in gruppo; Andrea starebbe a casa il lunedì
  level: C1
  persona: es-f-erasmus
  history: [participle-agreement, conditional-form, article-form]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Quasi sempre da casa, quattro giorni su cinque. Il venerdì vado in ufficio a Milano, perché c'è la riunione settimanale e perché, sinceramente, dopo quattro giorni da sola ho bisogno di vedere qualche faccia."
    - tutor: "Quattro giorni da sola sono tanti, ti capisco. Io invece ci vado tutti i giorni, venti minuti in bici. Ma alla fine il lavoro da casa ti piace?"
      goals: [situation]
    - learner: "Mi piace, soprattutto per il tempo: da Monza al centro è un'ora di treno. L'anno scorso l'azienda ci ha dato anche una sedia ergonomica, e io l'ho montato da sola in una sera, con le istruzioni in tedesco!"
      errors: [participle-agreement]
      gold: {text: "l'ho montato", fix: "l'ho montata"}
    - tutor: "Da sola e con le istruzioni in tedesco: un'impresa. Guarda però «l'ho montato»: quel «l'» sta per la sedia, quindi il participio come deve finire?"
      prompt: {text: "l'ho montato", tags: [participle-agreement]}
    - learner: "L'ho montata, perché è la sedia. Tu invece in ufficio hai almeno una sedia decente?"
    - tutor: "Decente è una parola grossa: è la stessa da otto anni. Ma dimmi, a parte il treno, quali sono gli altri vantaggi?"
    - learner: "Riesco a concentrarmi molto di più, perché nessuno mi interrompe ogni cinque minuti, e a pranzo cucino invece di mangiare un panino davanti al computer. Mi sembra di aver guadagnato almeno due ore al giorno."
    - tutor: "Due ore al giorno sono un argomento difficile da battere. Però non mi dirai che è tutto perfetto: che cosa ti manca dell'ufficio?"
      goals: [pros]
    - learner: "Mi mancano le chiacchiere alla macchinetta e il confronto veloce con i colleghi. A marzo, per esempio, su una traduzione difficilissima ci ho messo due giorni, mentre in ufficio, con un collega accanto, la risolverei in dieci minuti."
      errors: [conditional-form]
      gold: {text: "la risolverei in dieci minuti", fix: "l'avrei risolta in dieci minuti"}
    - tutor: "Le chiacchiere alla macchinetta mancherebbero anche a me, hai ragione. Però riprendi «la risolverei in dieci minuti»: parli di marzo, di una cosa che non è successa. Va bene il condizionale presente?"
      prompt: {text: "la risolverei in dieci minuti", tags: [conditional-form]}
    - learner: "No, il passato: in ufficio l'avrei risolta in dieci minuti, e invece ci ho messo due giorni."
    - tutor: "Ecco. E allora, potendo scegliere, come vorresti organizzarti?"
      goals: [cons]
    - learner: "Il mio ideale sarebbe tre giorni a casa e due in ufficio, magari il martedì e il venerdì. E vorrei che l'azienda mettesse a disposizione un spazio per lavorare in gruppo, non solo scrivanie in fila."
      errors: [article-form]
      gold: {text: "un spazio", fix: "uno spazio"}
    - tutor: "Tre e due mi sembra un buon equilibrio. Guarda solo «un spazio»: davanti a parole come «spazio», «studio» o «scontrino», l'articolo cambia forma. Quale serve qui?"
      prompt: {text: "un spazio", tags: [article-form]}
    - learner: "Uno spazio, come uno studente. E tu, se potessi scegliere, staresti a casa almeno un giorno?"
    - tutor: "Sì, almeno il lunedì, per rientrare piano dal fine settimana. Brindiamo al tuo martedì e venerdì in ufficio, allora, e speriamo che quello spazio te lo diano davvero!"
      goals: [preference]

- scenario: politica-lavoro
  # facts: la sorella del learner fa la radiologa e da un paio d'anni usa un programma che segnala le immagini sospette, ma la diagnosi la fa lei; il padre di Riccardo faceva il tipografo e negli anni Ottanta ha perso il lavoro con i computer; proposta del learner: incentivi alle aziende che formano i dipendenti, regole scritte da esperti, aziende e sindacati; appuntamento scherzoso tra cinque anni
  level: C1
  persona: en-m-traveller
  history: [subjunctive-form, passive]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Dico che spariranno molti compiti, più che interi lavori. Mia sorella fa la radiologa e da un paio d'anni usa un programma che segnala le immagini sospette, ma la diagnosi la fa ancora lei, e di lavoro ne ha più di prima."
    - tutor: "Tua sorella è fortunata. Mio padre faceva il tipografo, e negli anni Ottanta, con i computer, il suo lavoro è sparito davvero. Non ti pare un esempio più onesto?"
      goals: [opinion, example]
    - learner: "È un esempio onesto, ma è passato tanto tempo. Proviamo a immaginare: se domani lo Stato desse incentivi alle aziende che formano i dipendenti, e se i sindacati stassero più attenti alla tecnologia, molti tipografi di oggi troverebbero un altro posto."
      errors: [subjunctive-form]
      gold: {text: "stassero", fix: "stessero"}
    - tutor: "Sugli incentivi alla formazione ti do ragione, è la parte più sensata. Ma riprendi «stassero»: il congiuntivo imperfetto di «stare» si forma come quello di «dare», che hai usato poco prima. Come viene?"
      prompt: {text: "stassero", tags: [subjunctive-form]}
    - learner: "Stessero, come dessero. Se i sindacati stessero più attenti alla tecnologia, il passaggio sarebbe meno doloroso."
    - tutor: "Adesso è giusto. Però dimmi la verità: credi davvero che le aziende pagherebbero la formazione senza esserci costrette?"
      goals: [hypothesis]
    - learner: "Alcune sì, quelle che hanno bisogno di persone qualificate e non le trovano sul mercato. Le altre no, e per quelle servirebbero regole precise, come succede già per la sicurezza sul lavoro, che nessuno considera un lusso."
    - tutor: "Sulla sicurezza hai ragione, ormai è normale. Ma chi le scrive, queste regole, se i politici di tecnologia non capiscono niente?"
    - learner: "Dovrebbero scriverle insieme esperti, aziende e sindacati, non solo i politici. In altri settori si sono già creati tavoli di questo tipo, e alla fine si è trovato soluzioni che nessuno, da solo, avrebbe immaginato."
      errors: [passive]
      gold: {text: "si è trovato soluzioni", fix: "si sono trovate soluzioni"}
    - tutor: "Tavoli comuni, dici: almeno nessuno potrebbe lamentarsi di non essere stato invitato. Riprendi però «si è trovato soluzioni»: con il «si» passivante, verbo e participio concordano con quale parola?"
      prompt: {text: "si è trovato soluzioni", tags: [passive]}
    - learner: "Con «soluzioni»: si è trovate soluzioni che nessuno avrebbe immaginato."
      errors: [passive]
    - tutor: "Si sono trovate soluzioni che nessuno avrebbe immaginato, d'accordo, ma ci sono voluti anni. Allora, per chiudere: tra dieci anni avrò ragione io o tu?"
      recast: {text: "si è trovate soluzioni", fix: "si sono trovate soluzioni", tags: [passive]}
    - learner: "Secondo me avremo ragione tutti e due: molti lavori cambieranno, alcuni spariranno, e chi sarà stato formato in tempo se la caverà. Tu, invece, cambieresti idea se tra cinque anni la disoccupazione non fosse aumentata?"
    - tutor: "Forse sì, ma solo a metà: un pessimista non si arrende mai del tutto. Ci rivediamo tra cinque anni a questo tavolo e facciamo i conti."
      goals: [conclude]

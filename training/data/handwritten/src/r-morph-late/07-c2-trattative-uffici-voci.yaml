# Set r-morph-late, file 7 (C2): a supplier, a mediation, a complaint at the town hall, a dinner
# about technology, a radio phone-in, a book club, a podcast and a radio interview. Error turns
# carry one small morphology slip late in a long, content-heavy turn; the tutor agrees with the
# idea when it can, names the category of the slip and moves the scene on.
- scenario: trattativa-fornitore
  # facts: il learner compra vaschette in plastica riciclata per un'azienda di pasta fresca; aumento del quindici per cento senza preavviso; la plastica riciclata è costata al fornitore quasi il quaranta per cento in più; clienti da dodici anni, pagamenti a trenta giorni, condizioni del rinnovo di gennaio sempre rispettate; un fornitore sloveno offre il nove per cento in meno, qualità non verificata; controproposta: sei per cento subito e quattro da luglio, ordine raddoppiato di vaschette grandi per la linea di lasagne in primavera; accordo: nove per cento, consegne ogni due settimane, clausola di revisione a dicembre; bozza giovedì, firma venerdì mattina
  level: C2
  persona: en-m-retired
  history: [participle-agreement, hypothetical, imperative-form]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo per il listino, e non le nascondo che l'ho letto due volte per essere sicuro di aver capito bene: un aumento del quindici per cento sulle vaschette, senza nessun preavviso, è difficile da giustificare anche con il rincaro delle materie prime."
    - tutor: "Capisco la sorpresa. La plastica riciclata, però, quest'anno ci è costata quasi il quaranta per cento in più, e per mesi abbiamo assorbito noi una parte dell'aumento."
      goals: [problem]
    - learner: "Non lo metto in dubbio. Però siamo vostri clienti da dodici anni, e le condizioni che ci avevate chiesto al rinnovo del contratto, lo scorso gennaio, le abbiamo sempre rispettato: pagamenti a trenta giorni, mai un ritardo."
      errors: [participle-agreement]
      gold: {text: "le abbiamo sempre rispettato", fix: "le abbiamo sempre rispettate"}
    - tutor: "Sulla vostra puntualità nei pagamenti non ho nulla da dire, anzi. Riprenda però «le abbiamo sempre rispettato»: quel «le» riprende «le condizioni», e il participio deve accordarsi. Come?"
      goals: [argue]
      prompt: {text: "le abbiamo sempre rispettato", tags: [participle-agreement]}
    - learner: "Le abbiamo sempre rispettate, appunto. E le dirò di più: un fornitore sloveno ci ha appena offerto vaschette simili a un prezzo più basso del nove per cento."
    - tutor: "Un'offerta concorrente, capisco. Ma ha già verificato la qualità e i tempi di consegna dalla Slovenia?"
    - learner: "Non ancora, ed è proprio per questo che preferirei restare con voi. Ma glielo dico con franchezza: il nostro direttore mi imporrebbe di chiedere almeno un campione agli sloveni, se il vostro aumento resterebbe al quindici per cento."
      errors: [hypothetical]
      gold: {text: "se il vostro aumento resterebbe", fix: "se il vostro aumento restasse"}
    - tutor: "La franchezza la apprezzo. Riprenda però «se il vostro aumento resterebbe»: dopo il «se» di un'ipotesi possibile, il condizionale non va. Quale modo ci vuole?"
      prompt: {text: "se il vostro aumento resterebbe", tags: [hypothetical]}
    - learner: "Il congiuntivo imperfetto: se il vostro aumento restasse al quindici per cento, il nostro direttore mi imporrebbe di valutare gli sloveni. Le faccio quindi una controproposta."
    - tutor: "La ascolto."
    - learner: "Sei per cento subito e altri quattro a partire da luglio, se nel frattempo i prezzi della plastica non saranno scesi. In cambio, ci impegniamo a raddoppiare l'ordine di vaschette grandi per la linea delle lasagne, che lanciamo in primavera."
    - tutor: "La linea delle lasagne mi interessa. Le propongo il nove per cento subito, senza scaglioni, e consegne ogni due settimane invece che mensili, così Lei riduce le scorte in magazzino. Le sembra un compromesso accettabile?"
      goals: [counteroffer]
    - learner: "Il nove con le consegne ogni due settimane mi sembra ragionevole, a una condizione: una clausola di revisione a dicembre. Mi faccia avere la bozza entro giovedì e, per favore, non si scorda di indicare le nuove date di consegna."
      errors: [imperative-form]
      gold: {text: "non si scorda di indicare", fix: "non si scordi di indicare"}
    - tutor: "La clausola di revisione a dicembre si può fare. Riascolti però «non si scorda di indicare»: è una richiesta rivolta a me, come «mi faccia avere» subito prima. Come diventa?"
      prompt: {text: "non si scorda di indicare", tags: [imperative-form]}
    - learner: "Non si scorde di indicare le date, volevo dire."
      errors: [imperative-form]
    - tutor: "«Non si scordi di indicare le date»: le indicherò, stia tranquillo, insieme alla clausola di dicembre. Allora siamo d'accordo sul nove per cento?"
      recast: {text: "Non si scorde di indicare", fix: "Non si scordi di indicare", tags: [imperative-form]}
    - learner: "Siamo d'accordo: nove per cento, consegne ogni due settimane e revisione a dicembre. Aspetto la bozza giovedì e, se è tutto in ordine, la firmo venerdì mattina."
    - tutor: "D'accordo. Giovedì riceverà la bozza, e grazie per la franchezza: con clienti così si lavora meglio."
      goals: [agreement]

- scenario: mediazione-colleghi
  # facts: il tutor aveva proposto a Sara un nuovo percorso di inserimento per i neoassunti in una mail di marzo, che ha conservato; Sara aveva risposto «Bella idea, ne parliamo» e poi niente; ieri Sara l'ha presentato al direttore come un'idea sua; piano del learner: parlare con Sara da solo, scrivere al direttore che il progetto nasce dalla proposta di marzo allegando la mail, proporre che il tutor guidi il progetto con Sara; la mail al direttore stasera, in copia al tutor prima dell'invio; incontro a tre lunedì alle dieci nell'ufficio del learner
  level: C2
  persona: es-m-worker
  history: [subjunctive-form, auxiliary-choice, combined-pronouns]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, per favore. Mi dica tutto con calma, senza preoccuparsi del tono: preferisco che mi racconti ogni cosa adesso, piuttosto che vederla lavorare per settimane con questo peso addosso."
    - tutor: "Grazie. Ieri Sara ha presentato al direttore il nuovo percorso per i neoassunti come se fosse un'idea sua. Ma gliel'avevo proposto io, in una mail di marzo: ce l'ho ancora."
    - learner: "Capisco quanto la cosa la ferisca, e il fatto che abbia conservato la mail è importante. Prima di trarre conclusioni, però, vorrei che Sara mi spiegasse la sua versione, e non voglio che il direttore pensi che io prendi le parti di qualcuno."
      errors: [subjunctive-form]
      gold: {text: "che io prendi", fix: "che io prenda"}
    - tutor: "Purché la ascolti davvero, e non solo per forma. Riprenda però «che io prendi»: è il congiuntivo di «prendere», prima persona singolare. Che desinenza vuole?"
      goals: [listen]
      prompt: {text: "che io prendi", tags: [subjunctive-form]}
    - learner: "Che io prenda, certo. Mi permetta una domanda: nella mail di marzo, Sara le aveva risposto, o la proposta era rimasta senza seguito?"
    - tutor: "Mi aveva risposto con due righe: «Bella idea, ne parliamo». E poi non ne abbiamo più parlato, fino a ieri."
      goals: [clarify]
    - learner: "Quindi la proposta è rimasta in sospeso per mesi. Non voglio giustificare nessuno, ma è possibile che Sara, in buona fede, abbia finito per considerarla un lavoro comune, e che nel frattempo l'idea abbia passato per altre riunioni."
      errors: [auxiliary-choice]
      gold: {text: "l'idea abbia passato per altre riunioni", fix: "l'idea sia passata per altre riunioni"}
    - tutor: "Che sia possibile non lo escludo, anche se mi costa ammetterlo. Riprenda però «l'idea abbia passato per altre riunioni»: qui l'idea si sposta, non passa qualcosa a qualcuno. Quale ausiliare ci vuole?"
      goals: [perspective]
      prompt: {text: "l'idea abbia passato per altre riunioni", tags: [auxiliary-choice]}
    - learner: "Che l'idea sia passata per altre riunioni, appunto. E questo, anche se fosse vero, non toglierebbe nulla al fatto che il primo a proporla è stato Lei."
    - tutor: "Ecco, questo è il punto. Allora che cosa farà?"
    - learner: "Farò tre cose. Prima parlerò con Sara, da solo; poi scriverò al direttore che il progetto nasce da una sua proposta di marzo, allegando la mail; infine le chiederò di guidare il progetto insieme a Sara, se tutti e due siete d'accordo."
    - tutor: "Guidarlo insieme a Sara... Non sarà facile, ma è giusto. Quando ne parliamo tutti e tre?"
      goals: [solution]
    - learner: "Lunedì alle dieci, nel mio ufficio. Prima, però, voglio che il direttore abbia ricevuto la mia mail: la scrivo stasera e, se Lei è d'accordo, prima di inviarla gli la mando in copia, così vede esattamente che cosa ho scritto."
      errors: [combined-pronouns]
      gold: {text: "gli la mando", fix: "gliela mando"}
    - tutor: "Sì, preferisco vedere tutto prima. Riprenda però «gli la mando»: per dire «la mando a Lei», i due pronomi diventano una parola sola. Quale?"
      prompt: {text: "gli la mando", tags: [combined-pronouns]}
    - learner: "Gliela mando in copia stasera stessa. E grazie per avermelo detto subito, invece di tenerselo dentro."
    - tutor: "Grazie a Lei per avermi ascoltato. A lunedì alle dieci, allora."

- scenario: reclamo-comune
  # facts: lavori in via dei Tigli iniziati il 10 settembre per la fibra ottica, marciapiede smontato, cantiere fermo da due mesi, transenne rovesciate e sampietrini davanti ai portoni; due segnalazioni online (fine settembre e metà ottobre), solo una risposta automatica; la vicina di ottantacinque anni in carrozzina non esce da settimane; la ditta è concessionaria; la Polizia Locale può fare un sopralluogo e diffidare la ditta; risposta scritta entro trenta giorni dalla protocollazione, poi sollecito e Difensore civico; protocollo 5583
  level: C2
  persona: en-f-student
  history: [passive, imperative-form, adjective-agreement]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Vengo per i lavori in via dei Tigli: il 10 settembre una ditta ha smontato il marciapiede per posare la fibra ottica, e da due mesi il cantiere è fermo, con le transenne rovesciate e i sampietrini ammucchiati davanti ai portoni."
    - tutor: "Capisco. Ha già fatto una segnalazione, per telefono o online?"
    - learner: "Due, tutte e due online, a fine settembre e a metà ottobre. Mi è arrivata solo una risposta automatica, mentre le foto che avevo allegato, a quanto pare, non sono mai state aperto da nessuno."
      errors: [passive]
      gold: {text: "non sono mai state aperto", fix: "non sono mai state aperte"}
    - tutor: "Le segnalazioni online, purtroppo, finiscono spesso in una coda lunghissima. Riprenda però «non sono mai state aperto»: in questo passivo il participio concorda con «le foto». Come diventa?"
      goals: [describe]
      prompt: {text: "non sono mai state aperto", tags: [passive]}
    - learner: "Non sono mai state aperte, appunto. E nel frattempo la mia vicina, che ha ottantacinque anni ed è in carrozzina, non esce di casa da settimane."
    - tutor: "Questo è grave. Purtroppo i lavori sulla fibra sono gestiti dalla ditta concessionaria: il Comune può solo sollecitare."
    - learner: "Mi scusi, ma «sollecitare» non mi basta: il suolo pubblico lo concede il Comune, e qualcuno deve controllare che venga restituito in condizioni decenti. La prego, non mi dice che dobbiamo aspettare la buona volontà della ditta."
      errors: [imperative-form]
      gold: {text: "non mi dice che dobbiamo aspettare", fix: "non mi dica che dobbiamo aspettare"}
    - tutor: "Ha ragione, il Comune può fare di più: la Polizia Locale può fare un sopralluogo e diffidare la ditta. Riprenda però «non mi dice che dobbiamo aspettare»: con «la prego», mi sta rivolgendo un invito con il Lei. Quale forma ci vuole?"
      goals: [insist]
      prompt: {text: "non mi dice che dobbiamo aspettare", tags: [imperative-form]}
    - learner: "Non mi dici che dobbiamo aspettare, volevo dire."
      errors: [imperative-form]
    - tutor: "«Non mi dica che dobbiamo aspettare»: no, non glielo dico, perché la diffida si può chiedere oggi stesso. Vuole che la inserisca nel reclamo?"
      recast: {text: "Non mi dici che dobbiamo aspettare", fix: "Non mi dica che dobbiamo aspettare", tags: [imperative-form]}
    - learner: "Sì, per favore. E vorrei sapere anche quali sono i miei diritti: entro quanto tempo il Comune è tenuto a rispondermi per iscritto, e che cosa posso fare se la risposta non arriva?"
    - tutor: "Il termine generale è di trenta giorni dalla protocollazione. Se non riceve risposta, può presentare un sollecito formale e, nei casi più gravi, rivolgersi al Difensore civico."
      goals: [rights]
    - learner: "Trenta giorni, me lo segno. Allego anche le foto stampate e la dichiarazione della mia vicina: sono documenti che, considerata la sua età e la carrozzina, mi sembrano particolarmente importante per dimostrare l'urgenza."
      errors: [adjective-agreement]
      gold: {text: "particolarmente importante", fix: "particolarmente importanti"}
    - tutor: "Le foto stampate e la dichiarazione aiuteranno molto. Riprenda solo «particolarmente importante»: si riferisce a «documenti», un po' lontano. Come deve concordare?"
      prompt: {text: "particolarmente importante", tags: [adjective-agreement]}
    - learner: "Particolarmente importanti, certo. Allora mi dà il numero di protocollo?"
    - tutor: "Ecco: protocollo 5583, con richiesta di sopralluogo urgente della Polizia Locale e diffida alla ditta. Entro trenta giorni riceverà una risposta scritta."
      goals: [commitment]

- scenario: intelligenza-artificiale
  # facts: il learner lavora in uno studio legale; da quando usano un programma per la prima stesura dei contratti le ore sulle bozze sono quasi dimezzate; quest'anno lo studio ha preso due praticanti invece di cinque; a gennaio il socio aveva promesso di pensarci dopo l'estate; proposta: investire il tempo risparmiato nella formazione, affiancando ai praticanti un avvocato esperto; il prossimo vino lo sceglie il learner
  level: C2
  persona: en-m-heritage
  history: [auxiliary-choice, conditional-form, article-form]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, e in parte la condivido, ma la metterei in un altro modo: non sarà la tecnologia a lasciarci a casa, saranno le scelte di chi la usa. La stessa macchina può svuotare un ufficio intero o liberarlo dai lavori più noiosi."
    - tutor: "Bella frase, ma chi la usa sceglie quasi sempre di risparmiare. Tu, nel tuo studio legale, che cosa vedi?"
      goals: [position]
    - learner: "Vedo una cosa che mi rassicura e una che mi preoccupa. Da quando usiamo un programma per la prima stesura dei contratti, le ore che passiamo sulle bozze hanno diminuito di quasi la metà, e la qualità, almeno per ora, non ne ha risentito."
      errors: [auxiliary-choice]
      gold: {text: "hanno diminuito", fix: "sono diminuite"}
    - tutor: "La metà delle ore: ecco il tuo esempio, e mi dà ragione. Riprendi però «hanno diminuito»: qui le ore calano da sole, senza un oggetto. Quale ausiliare ci vuole?"
      goals: [evidence]
      prompt: {text: "hanno diminuito", tags: [auxiliary-choice]}
    - learner: "Hanno diminuite di quasi la metà, è vero."
      errors: [auxiliary-choice]
    - tutor: "«Sono diminuite»: le ore calano da sole, quindi ci vuole «essere». Ma dimmi pure l'altra cosa, quella che ti preoccupa."
      recast: {text: "Hanno diminuite", fix: "Sono diminuite", tags: [auxiliary-choice]}
    - learner: "Sono diminuite di quasi la metà, è vero. E la cosa che mi preoccupa è proprio questa: quest'anno lo studio ha preso due praticanti invece di cinque."
    - tutor: "Due invece di cinque. E gli altri tre dove imparano il mestiere, se le bozze le scrive una macchina?"
    - learner: "Hai ragione, ed è il punto debole del mio ottimismo: le bozze erano la nostra palestra. Se spariscono i compiti semplici, spariscono anche i posti in cui un giovane impara a sbagliare senza fare danni, e questo nessun programma lo può sostituire."
    - tutor: "Finalmente lo ammetti. E allora, che cosa proporresti?"
      goals: [concede]
    - learner: "Che gli studi investissero il tempo risparmiato nella formazione, affiancando ai praticanti un avvocato esperto. Ne avevo parlato al mio socio già a gennaio, e lui mi aveva risposto che ci penserebbe dopo l'estate; ma l'estate è passata, e non ne abbiamo più parlato."
      errors: [conditional-form]
      gold: {text: "ci penserebbe dopo l'estate", fix: "ci avrebbe pensato dopo l'estate"}
    - tutor: "Conosco il tipo di socio. Riprendi però «ci penserebbe dopo l'estate»: la risposta è di gennaio, e l'estate era il futuro di allora. Quale condizionale serve?"
      prompt: {text: "ci penserebbe dopo l'estate", tags: [conditional-form]}
    - learner: "Ci avrebbe pensato dopo l'estate, così mi aveva detto. Domani glielo ricordo, e stavolta con i numeri dei praticanti in mano."
    - tutor: "Con i numeri, bravo. Ma insomma, alla fine, su qualcosa siamo d'accordo?"
    - learner: "Direi di sì: senza regole e senza formazione, la tecnologia rischia di chiudere le porte a chi comincia. E su un punto ti do ragione del tutto: i giovani avvocati, i grafici, i traduttori e i psicologi alle prime armi pagheranno per primi."
      errors: [article-form]
      gold: {text: "i psicologi", fix: "gli psicologi"}
    - tutor: "Sui giovani hai ragione, purtroppo. Riprendi solo «i psicologi»: davanti a «ps», come davanti a «st», l'articolo plurale cambia. Quale?"
      prompt: {text: "i psicologi", tags: [article-form]}
    - learner: "Gli psicologi, certo. Brindiamo almeno a questo: alle porte da tenere aperte."
    - tutor: "Brindiamo, e il prossimo vino lo scegli tu, senza chiederlo a nessuna macchina."
      goals: [conclude]

- scenario: turismo-di-massa
  # facts: la learner insegna spagnolo e vive a Manarola, nelle Cinque Terre, da otto anni; favorevole a un ticket per i sentieri nei mesi più affollati, per la sicurezza; d'estate sul sentiero tra Manarola e Corniglia centinaia di persone in infradito, soccorsi ogni settimana; proposta: prenotazione obbligatoria per i sentieri da giugno a settembre, posti riservati ai residenti sui treni locali, contributo per chi arriva in giornata con i traghetti; controlli dei guardiaparco con un codice sul telefono
  level: C2
  persona: es-f-teacher
  history: [passive, hypothetical, imperative-form]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Insegno spagnolo e vivo a Manarola, nelle Cinque Terre, da otto anni. Sono a favore di un ticket, ma non per entrare nei paesi: per i sentieri, nei mesi più affollati, perché lì il problema non è solo il disagio, è la sicurezza."
    - tutor: "La sicurezza, addirittura? Mi sembra un po' esagerato: stiamo parlando di sentieri, non di autostrade."
      goals: [introduce]
    - learner: "Non è esagerato, mi creda. Ogni settimana i soccorritori devono intervenire per qualcuno che è scivolato o si è sentito male per il caldo, perché d'estate, sul sentiero tra Manarola e Corniglia, si incontra centinaia di persone in infradito."
      errors: [passive]
      gold: {text: "si incontra centinaia di persone", fix: "si incontrano centinaia di persone"}
    - tutor: "Le infradito sui sentieri sono un classico, purtroppo. Riprenda però «si incontra centinaia di persone»: con il «si» passivante, il verbo concorda con «centinaia di persone». Come diventa?"
      goals: [example]
      prompt: {text: "si incontra centinaia di persone", tags: [passive]}
    - learner: "Si incontrano centinaia di persone, appunto, e molte non hanno nemmeno una bottiglia d'acqua."
    - tutor: "Ma i residenti vivono di turismo: affittacamere, ristoranti, barche. Un ticket non sarebbe un autogol?"
    - learner: "Al contrario: chi vive di turismo ha bisogno di un turismo che duri. Se continueremo così, tra dieci anni i sentieri saranno rovinati; e se i visitatori sarebbero meno ma restassero più a lungo, guadagneremmo tutti, residenti compresi."
      errors: [hypothetical]
      gold: {text: "se i visitatori sarebbero meno", fix: "se i visitatori fossero meno"}
    - tutor: "Un turismo che duri: su questo è difficile darle torto. Riprenda però «se i visitatori sarebbero meno»: subito dopo usa bene «restassero». Che modo ci vuole anche qui?"
      goals: [rebut]
      prompt: {text: "se i visitatori sarebbero meno", tags: [hypothetical]}
    - learner: "Se i visitatori erano meno, volevo dire."
      errors: [hypothetical]
    - tutor: "«Se i visitatori fossero meno»: dopo il «se» di un'ipotesi ci vuole il congiuntivo imperfetto. Vada avanti, la ascolto."
      recast: {text: "Se i visitatori erano meno", fix: "Se i visitatori fossero meno", tags: [hypothetical]}
    - learner: "Il congiuntivo: se i visitatori fossero meno ma restassero più a lungo, guadagneremmo tutti."
    - tutor: "E allora, in concreto, che cosa propone?"
    - learner: "Tre cose: prenotazione obbligatoria per i sentieri da giugno a settembre, posti riservati ai residenti sui treni locali e un contributo per chi arriva in giornata con i traghetti. Così chi resta a dormire non paga due volte."
    - tutor: "Una proposta concreta. Ma chi controlla le prenotazioni, all'ingresso di un sentiero di montagna?"
    - learner: "I guardiaparco, che ci sono già, con un semplice controllo del codice sul telefono. Una cosa, però: sui sentieri non si va in infradito, e l'acqua bisogna portarsela da casa. La prego, ricorda ai suoi ascoltatori che partono per le vacanze anche questo."
      errors: [imperative-form]
      gold: {text: "ricorda ai suoi ascoltatori", fix: "ricordi ai suoi ascoltatori"}
    - tutor: "Lo farò volentieri. Riascolti però «ricorda ai suoi ascoltatori»: con «la prego» mi rivolge un invito con il Lei. Come diventa il verbo?"
      goals: [proposal]
      prompt: {text: "ricorda ai suoi ascoltatori", tags: [imperative-form]}
    - learner: "La prego, ricordi ai suoi ascoltatori di portarsi l'acqua. Grazie per lo spazio, e buona estate a tutti."
    - tutor: "Grazie a Lei, e un saluto a Manarola. E voi, cari ascoltatori, scarpe da trekking e acqua nello zaino!"

- scenario: club-lettura
  # facts: romanzo del mese: saga familiare con capitoli raccontati ogni volta da un membro diverso della famiglia; la learner ha riletto due volte i primi capitoli; la vigna nelle Langhe divide i fratelli Anna e Pietro, che non si parlano per vent'anni; Pietro vuole vendere per pagare i debiti, Anna la difende e alla fine è costretta a venderla; stile asciutto, colline e vendemmia sullo sfondo; la learner regala il libro al fratello domenica con una dedica
  level: C2
  persona: en-f-professional
  history: [participle-agreement, conditional-form, combined-pronouns]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, anche se ho dovuto rileggere i primi capitoli due volte per non confondere le voci: ogni capitolo è raccontato da un membro diverso della famiglia, e all'inizio non riuscivo a capire chi stesse parlando."
    - tutor: "Le voci alternate sono proprio quello che a me è piaciuto di più. Ma nel complesso che impressione ti ha lasciato?"
    - learner: "Un'impressione di malinconia lucida. È una saga familiare che non idealizza niente: la vigna nelle Langhe, che dovrebbe tenere unita la famiglia, diventa invece il motivo per cui due fratelli smettono di parlarsi per vent'anni."
    - tutor: "Vent'anni di silenzio per una vigna. Chi dei due fratelli ti ha convinto di più?"
      goals: [impression]
    - learner: "Anna, senza dubbio. Pietro vuole vendere la vigna per pagare i debiti, ed è comprensibile; ma Anna la difende per tutto il libro, anche quando non le conviene, e la scena del saluto finale l'ho letto con un nodo in gola."
      errors: [participle-agreement]
      gold: {text: "l'ho letto", fix: "l'ho letta"}
    - tutor: "Quella scena ha commosso anche me. Riprendi però «l'ho letto»: quel «l'» riprende «la scena». Come deve finire il participio?"
      goals: [character]
      prompt: {text: "l'ho letto", tags: [participle-agreement]}
    - learner: "L'ho letta con un nodo in gola, e il giorno dopo l'ho anche riletta."
    - tutor: "Ti capisco. E lo stile? Alcuni nel gruppo lo trovano troppo asciutto."
    - learner: "Asciutto sì, ma è una scelta: l'autore non commenta mai, lascia parlare i fatti. Confesso però che, quando ho cominciato il libro, mi aspettavo che descriverebbe molto di più le colline e la vendemmia."
      errors: [conditional-form]
      gold: {text: "mi aspettavo che descriverebbe", fix: "mi aspettavo che avrebbe descritto"}
    - tutor: "Anch'io, all'inizio, mi aspettavo più paesaggio. Riprendi però «mi aspettavo che descriverebbe»: l'attesa era nel passato, e la descrizione il futuro di allora. Quale condizionale ci vuole?"
      goals: [style]
      prompt: {text: "mi aspettavo che descriverebbe", tags: [conditional-form]}
    - learner: "Mi aspettavo che avrebbe descritto di più le colline. E invece le lascia quasi sullo sfondo, come se la famiglia non le vedesse più."
    - tutor: "Bella osservazione. E a chi lo consiglieresti?"
    - learner: "A chi ha fratelli e ha litigato almeno una volta per un'eredità, cioè quasi a tutti. Mio fratello, per esempio, lo deve assolutamente leggere: ce l'ho in borsa, e domenica, a pranzo dai miei, gli lo regalo con una dedica ironica."
      errors: [combined-pronouns]
      gold: {text: "gli lo regalo", fix: "glielo regalo"}
    - tutor: "Con una dedica ironica, mi raccomando. Riprendi però «gli lo regalo»: «gli» e «lo», davanti al verbo, diventano una parola sola. Quale?"
      goals: [recommend]
      prompt: {text: "gli lo regalo", tags: [combined-pronouns]}
    - learner: "Glielo regalo domenica, con una dedica: «Leggilo prima di litigare per la casa al mare»."
    - tutor: "Dedica perfetta. Poi al prossimo incontro ci racconti come l'ha presa."

- scenario: intervista-podcast
  # facts: il learner è arrivato a Trieste nel 2012 da Valencia, dove faceva il cuoco e il ristorante aveva chiuso per la crisi; un amico gli ha offerto tre mesi in una trattoria vicino al porto, diventati tredici anni; la bora il primo inverno; critica: contratti stagionali e lavoro in nero nella ristorazione; è capocuoco dall'anno scorso; i vicini del terzo piano lo hanno adottato con la jota del giovedì, che ora cucina lui per loro
  level: C2
  persona: es-m-worker
  history: [adjective-agreement, subjunctive-form, hypothetical]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Sono arrivato a Trieste nel 2012, un po' per caso: facevo il cuoco a Valencia, la crisi aveva fatto chiudere il ristorante, e un amico mi ha offerto tre mesi in una trattoria vicino al porto. Quei tre mesi, ormai, sono diventati tredici anni."
    - tutor: "Tre mesi diventati tredici anni: un classico. Che cosa ti ha sorpreso di più, appena arrivato?"
      goals: [story]
    - learner: "La bora! Nessuno mi aveva avvertito. Il primo inverno sono uscito con una giacca leggera, e il vento, che soffiava a più di cento all'ora lungo le Rive, mi è sembrato non solo freddo, ma quasi cattiva, come se ce l'avesse con me."
      errors: [adjective-agreement]
      gold: {text: "quasi cattiva", fix: "quasi cattivo"}
    - tutor: "La bora non perdona i principianti. Riprendi però «quasi cattiva»: il soggetto, un po' lontano, è «il vento». Come deve finire l'aggettivo?"
      goals: [culture-shock]
      prompt: {text: "quasi cattiva", tags: [adjective-agreement]}
    - learner: "Quasi cattivo, certo. Adesso, quando arriva, lo saluto come un vecchio nemico."
    - tutor: "Bellissimo. E adesso la domanda scomoda: che cosa non ti piace dell'Italia?"
    - learner: "Il lavoro nella ristorazione. Quasi tutti i contratti sono stagionali, e molti ragazzi bravissimi lavorano in nero. Non credo che sia colpa solo dei ristoratori, ma bisogna che lo Stato facci controlli seri e che chi rispetta le regole venga premiato."
      errors: [subjunctive-form]
      gold: {text: "che lo Stato facci controlli", fix: "che lo Stato faccia controlli"}
    - tutor: "Che chi rispetta le regole vada premiato lo penso anch'io. Riprendi però «che lo Stato facci controlli»: il congiuntivo di «fare», alla terza persona, ha un'altra desinenza. Quale?"
      goals: [critique]
      prompt: {text: "che lo Stato facci controlli", tags: [subjunctive-form]}
    - learner: "Che lo Stato faccia controlli seri. Scusa, con «fare» sbaglio sempre."
    - tutor: "Succede a tanti. Ultima domanda: che consiglio daresti a chi vuole trasferirsi qui?"
    - learner: "Di imparare la lingua prima di partire, e di non avere fretta. Io, per esempio, se avessi parlato italiano già all'arrivo, adesso sarei capocuoco da anni, invece di esserlo diventato solo l'anno scorso."
    - tutor: "Capocuoco dall'anno scorso: complimenti! E il secondo consiglio?"
      goals: [advice]
    - learner: "Di farsi invitare a cena da una famiglia del posto almeno una volta al mese. Il primo anno mi ha salvato la jota del giovedì: mi sarei sentito solissimo, se non mi avrebbero adottato i vicini del terzo piano."
      errors: [hypothetical]
      gold: {text: "se non mi avrebbero adottato", fix: "se non mi avessero adottato"}
    - tutor: "La jota del giovedì, che meraviglia. Riprendi però «se non mi avrebbero adottato»: dopo «se», per un fatto passato che non è avvenuto, quale modo ci vuole?"
      prompt: {text: "se non mi avrebbero adottato", tags: [hypothetical]}
    - learner: "Se non mi avessero adottato i vicini, mi sarei sentito solissimo. E adesso la jota la cucino io, per loro."
    - tutor: "Il cerchio si chiude. Grazie, e alla prossima puntata da Trieste: occhio alla bora!"

- scenario: vita-in-italia
  # facts: la learner è arrivata a Padova nel 2016 per un Erasmus di sei mesi in ingegneria; il giorno prima di ripartire un professore le ha proposto una tesi con un'azienda della zona; la parte più difficile: trovare casa, dieci rifiuti, tre mesi sul divano delle amiche spagnole che vivevano in sei; i genitori sono a Saragozza; consigli: non avere paura dei rifiuti, cercare subito un gruppo; ha trovato casa grazie a una compagna del coro
  level: C2
  persona: es-f-erasmus
  history: [participle-agreement, combined-pronouns, imperative-form]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie per l'invito. Sono arrivata a Padova nel 2016 per un Erasmus di sei mesi in ingegneria. Il giorno prima di ripartire un professore mi ha proposto una tesi in collaborazione con un'azienda della zona e, un passo dopo l'altro, non sono più ripartita."
    - tutor: "Un Erasmus che dura dieci anni: dovremmo chiamarlo in un altro modo. Qual è stata la parte più difficile?"
      goals: [story]
    - learner: "Trovare casa, senza dubbio. Molti proprietari non volevano affittare a una straniera senza contratto fisso, e dopo il decimo rifiuto le mie amiche spagnole, che vivevano tutte in un appartamento in sei, si sono offerto di ospitarmi sul divano."
      errors: [participle-agreement]
      gold: {text: "si sono offerto", fix: "si sono offerte"}
    - tutor: "Dieci rifiuti, e poi il divano delle amiche: una storia che molti ascoltatori conoscono. Riprenda però «si sono offerto»: con «essere», il participio concorda con «le mie amiche». Come diventa?"
      goals: [difficulties]
      prompt: {text: "si sono offerto", tags: [participle-agreement]}
    - learner: "Si sono offerte di ospitarmi, e ci sono rimasta tre mesi, tra un esame e l'altro."
    - tutor: "Tre mesi sul divano: altro che Erasmus. In che cosa si sente cambiata, da allora?"
    - learner: "Sono diventata più paziente e anche più diretta, il che sembra una contraddizione. Qui ho imparato a chiedere aiuto senza vergogna; e quando i miei genitori, a Saragozza, mi chiedono se tornerò in Spagna, gli lo ripeto ogni volta: casa mia ormai è qui."
      errors: [combined-pronouns]
      gold: {text: "gli lo ripeto", fix: "glielo ripeto"}
    - tutor: "«Casa mia ormai è qui»: una frase forte, per due genitori lontani. Riprenda però «gli lo ripeto»: «gli» e «lo», insieme, diventano una sola parola. Quale?"
      goals: [change]
      prompt: {text: "gli lo ripeto", tags: [combined-pronouns]}
    - learner: "Glie lo ripeto ogni volta, anche se non gli piace."
      errors: [combined-pronouns]
    - tutor: "Glielo ripeto ogni volta, dice, e immagino i sospiri a Saragozza. Un consiglio per chi ci ascolta e sogna di trasferirsi?"
      recast: {text: "Glie lo ripeto", fix: "Glielo ripeto", tags: [combined-pronouns]}
    - learner: "Il primo: non abbia paura dei rifiuti, perché ne arriveranno tanti. Il secondo riguarda gli amici e, spesso, anche la casa, che si trovano in un coro, in una squadra di pallavolo o in un corso di cucina: appena arrivato, cerca subito un gruppo."
      errors: [imperative-form]
      gold: {text: "cerca subito un gruppo", fix: "cerchi subito un gruppo"}
    - tutor: "Consigli molto pratici. Riascolti però «cerca subito un gruppo»: prima ha detto «non abbia paura», con il Lei. Questo secondo consiglio, alla stessa persona, come diventa?"
      goals: [advice]
      prompt: {text: "cerca subito un gruppo", tags: [imperative-form]}
    - learner: "Cerchi subito un gruppo, certo. Io, per esempio, la casa l'ho trovata grazie a una compagna del coro."
    - tutor: "Grazie a una compagna del coro: la prova che il consiglio funziona. Grazie di essere stata con noi, e un saluto a Padova!"

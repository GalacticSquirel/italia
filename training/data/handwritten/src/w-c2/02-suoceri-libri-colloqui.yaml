# Round 5, set w-c2: broad C2 coverage. File 2: dinners with in-laws, book clubs, job interviews.
- scenario: cena-suoceri
  level: C2
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Eccomi, in carne e ossa! Grazie dell'invito. Ho portato una bottiglia, spero che vi piace: è un Barolo che mi ha consigliato mio zio."
      errors: [subjunctive-use]
      gold: {text: "spero che vi piace", fix: "spero che vi piaccia"}
    - tutor: "Un Barolo: o Suo zio se ne intende, o Lei ha studiato il nemico. Ma La avverto, mia moglie ha insegnato lettere: «spero che vi piace» le farebbe venire un mancamento. Vuole riprovare?"
      prompt: {text: "spero che vi piace", tags: [subjunctive-use]}
    - learner: "Allora rimedio subito: spero che vi piaccia. E complimenti per la casa, signora: con quel soffitto affrescato sembra di stare in un museo."
    - tutor: "Mia moglie ringrazia, e il soffitto pure: è del Settecento, più vecchio di me, ma di poco. Mi dica, Lei di dov'è, esattamente? Giulia è stata piuttosto vaga."
      goals: [compliment]
    - learner: "Sono nato a Toronto, ma i miei nonni erano di un paesino vicino ad Avellino. Da bambino parlavo più dialetto che italiano, e adesso faccio l'architetto qui a Firenze."
    - tutor: "Un architetto a Firenze: coraggioso, qui ogni pietra ha già un parere. E ai Suoi genitori l'ha detto che stasera veniva a farsi esaminare?"
      goals: [background]
    - learner: "Certo, gli l'ho detto ieri sera al telefono, e mia madre mi ha fatto mille raccomandazioni."
      errors: [combined-pronouns]
      gold: {text: "gli l'ho detto", fix: "gliel'ho detto"}
    - tutor: "Le madri sono uguali a tutte le latitudini. Però «gli l'ho detto»: quando quel gli incontra un altro pronome, restano davvero separati?"
      prompt: {text: "gli l'ho detto", tags: [combined-pronouns]}
    - learner: "Gliel'ho detto, giusto. E ho confessato anche che il Suo senso dell'umorismo mi spaventava un po'."
    - tutor: "Spaventava? Che parolone. Io sono un agnellino: mordo solo i fidanzati che tifano per la squadra sbagliata. Lei per chi tifa?"
    - learner: "Le confesso che il calcio non mi interessa affatto. Ma devo dire che la serata è molto più confortevole di quanto temessi."
      errors: [word-choice]
    - tutor: "Più serena del previsto? Allora ho fallito come suocero minaccioso. Senta, visto che a quanto pare resterà tra noi a lungo, che ne dice di darci del tu?"
      recast: {text: "confortevole", fix: "serena", tags: [word-choice]}
      goals: [irony]
    - learner: "Con piacere, anche se mi ci vorrà un po' per abituarmi. Allora grazie, Paolo, di avermi accolto così bene."
    - tutor: "Bravo, al primo colpo. E ora assaggiamo questo Barolo, così vediamo se tuo zio è all'altezza della sua fama."
      goals: [tu-lei]

- scenario: cena-suoceri
  level: C2
  persona: es-f-erasmus
  history: [comparative]
  turns:
    - tutor: "Prego, si sieda pure. Mio figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Grazie, che bella accoglienza. Spero almeno di essere all'altezza della descrizione: Marco tende a esagerare."
    - tutor: "Esagerare, mio figlio? Non ce n'eravamo mai accorti. E da quanto vi frequentate, se non sono indiscreto?"
    - learner: "Ci conosciamo dall'università di Siviglia, ma abbiamo cominciato a salire insieme solo un anno e mezzo fa."
      errors: [false-friend]
    - tutor: "Un anno e mezzo a uscire insieme, e solo adesso ci viene presentata? Mio figlio è più riservato di un notaio. Mi dica, la Sua famiglia vive ancora in Spagna?"
      recast: {text: "salire insieme", fix: "uscire insieme", tags: [false-friend]}
    - learner: "Sì, a Siviglia. Mio padre fa il medico e mia madre insegna. Anche noi abitiamo in un palazzo antico, ma il vostro appartamento è molto più elegante che il nostro."
      errors: [comparative]
      gold: {text: "più elegante che il nostro", fix: "più elegante del nostro"}
    - tutor: "Troppo gentile. Ma, da vecchio pignolo: «più elegante che il nostro»? Quando si confrontano due cose con un nome o un possessivo, come si costruisce il secondo termine?"
      prompt: {text: "più elegante che il nostro", tags: [comparative]}
      goals: [background]
    - learner: "Ah, sì: più elegante del nostro. In spagnolo diciamo «que» e ci casco sempre."
    - tutor: "Ci cascano anche gli italiani, glielo assicuro. Comunque, se il complimento era per mia moglie, ha fatto centro: l'arredamento è tutto suo, io mi limito a pagare."
      goals: [compliment]
    - learner: "Allora i miei complimenti alla signora. E anche per la cena: mi piaceria tanto avere la ricetta di questo arrosto."
      errors: [conditional-form]
      gold: {text: "mi piaceria", fix: "mi piacerebbe"}
    - tutor: "Ah, la ricetta! Quella è un segreto di Stato. Ma prima: «mi piaceria»? Il condizionale di piacere, in italiano, ha una sillaba in più."
      prompt: {text: "mi piaceria", tags: [conditional-form]}
    - learner: "Mi piacerebbe, scusate. E se è un segreto di Stato, prometto di non rivelarlo nemmeno a Marco."
    - tutor: "Vedo che ha già capito come funziona questa famiglia. Facciamo così: diamoci del tu, e la ricetta te la scrive mia moglie stasera stessa."
      goals: [irony]
    - learner: "Volentieri, grazie! Allora a te e a tua moglie: grazie di questa bellissima serata."
    - tutor: "Grazie a te, cara. E adesso il dolce: quello sì che è un esame."
      goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi. L'ho letto da giovane in inglese e l'ho riletto adesso in italiano: Cosimo mi sembra meno ribelle e più malinconico."
    - tutor: "Malinconico, interessante. A vent'anni lo si legge come un'avventura, a settanta come un addio. Che cosa ti ha colpito di più, stavolta?"
      goals: [impression]
    - learner: "La sua fedeltà a una scelta. Il motivo per che sale sugli alberi è quasi un capriccio, una zuppa di lumache, ma poi ne fa una ragione di vita."
      errors: [relative-pronoun]
      gold: {text: "Il motivo per che", fix: "Il motivo per cui"}
    - tutor: "Le lumache, certo, che inizio geniale. Però ripeti con me: «il motivo per che sale». Dopo una preposizione, quel relativo ti suona bene?"
      prompt: {text: "Il motivo per che", tags: [relative-pronoun]}
    - learner: "Hai ragione: il motivo per il quale sale, o per cui, meglio. È un capriccio che diventa destino."
    - tutor: "Esatto, e il quale va benissimo, è solo un po' più solenne. Un capriccio che diventa destino: allora per te il tema è la coerenza?"
    - learner: "La coerenza, sì, ma anche la distanza: per capire il mondo bisogna guardarlo un po' dall'alto. Calvino lo scrivette negli anni Cinquanta, quando molti intellettuali ripensavano il proprio impegno."
      errors: [verb-form]
      gold: {text: "scrivette", fix: "scrisse"}
    - tutor: "Lettura finissima, e storicamente esatta. Solo una cosa: «lo scrivette»? Al passato remoto scrivere è irregolare, come leggere o dire."
      prompt: {text: "scrivette", tags: [verb-form]}
      goals: [theme]
    - learner: "Ah, lo scrivé? No... i passati remoti non me li ricordo mai."
      errors: [verb-form]
    - tutor: "Lo scrisse nel cinquantasette, sì, e ti capisco: il passato remoto è una giungla. E lo stile? A me certe pagine sembrano più un'operetta settecentesca che un romanzo."
      recast: {text: "scrivé", fix: "scrisse", tags: [verb-form]}
    - learner: "Proprio lì sta il bello, secondo me: la lingua imita il Settecento, ma con un'ironia tutta moderna. Mi sono divertito come un bambino."
    - tutor: "Va bene, l'ironia te la concedo. Ma ammetterai che verso la fine il libro si trascina, e Cosimo diventa un monumento a sé stesso."
      goals: [style]
    - learner: "Non sono d'accordo: se il finale fosse più rapido, non sentiremmo il peso degli anni. E lo consiglierei a chiunque, soprattutto ai ragazzi convinti che ribellarsi significhi urlare."
    - tutor: "Mi hai quasi convinto, e alla mia età è raro. Lo segno come proposta per il gruppo dei giovani della libreria, con la tua dedica."
      goals: [disagree, recommend]

- scenario: circolo-lettura
  level: C2
  persona: es-f-erasmus
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io! O meglio, all'inizio mi sembrava solo un ragazzino testardo. Poi, pagina dopo pagina, ho cominciato a invidiarlo."
    - tutor: "Invidiarlo? Questa me la devi spiegare, cara. Che cosa gli invidi?"
      goals: [impression]
    - learner: "La libertà di dire di no a tutto senza andarsene davvero. La scena delle lumache, poi, mi ha fatto molta grazia."
      errors: [false-friend]
    - tutor: "Ha fatto molto ridere anche me: è una delle ribellioni più comiche della letteratura. E dietro la comicità, che tema ci vedi?"
      recast: {text: "molta grazia", fix: "molto ridere", tags: [false-friend]}
    - learner: "La distanza come forma di partecipazione. Biagio, che la sua voce racconta tutto, resta a terra, ma è Cosimo che capisce davvero il mondo."
      errors: [relative-pronoun]
      gold: {text: "che la sua voce", fix: "la cui voce"}
    - tutor: "Bellissimo paradosso. Ma fermati su «Biagio, che la sua voce racconta tutto»: per dire di chi è la voce, quale relativo ci serve?"
      prompt: {text: "Biagio, che la sua voce", tags: [relative-pronoun]}
    - learner: "Biagio, il quale voce...? No, non mi viene."
      errors: [relative-pronoun]
    - tutor: "Biagio, la cui voce racconta tutto, è il testimone che resta a terra: hai proprio ragione. E lo stile, come lo descriveresti?"
      recast: {text: "il quale voce", fix: "la cui voce", tags: [relative-pronoun]}
      goals: [theme]
    - learner: "Limpido, quasi giocoso, ma pieno di sottintesi. Ogni frase sembra semplice e poi ti accorgi che nasconde una frecciata."
    - tutor: "Frecciata è la parola giusta. Però dai, ammettilo: se Calvino avesse tagliato cinquanta pagine, il libro ci avrebbe guadagnato."
      goals: [style]
    - learner: "Non sono d'accordo. Se Cosimo scendeva dagli alberi a metà, il libro perdeva tutto il suo senso: la lunghezza fa parte della sfida."
      errors: [hypothetical]
      gold: {text: "Se Cosimo scendeva", fix: "Se Cosimo fosse sceso"}
    - tutor: "Argomento forte, ma detto così suona da bar: «se Cosimo scendeva, il libro perdeva». In una discussione letteraria, che tempi useresti per un'ipotesi irreale nel passato?"
      prompt: {text: "Se Cosimo scendeva", tags: [hypothetical]}
    - learner: "Se Cosimo fosse sceso a metà, il libro avrebbe perso tutto il suo senso. E infatti lo consiglierei proprio a chi pensa che la coerenza sia noiosa."
    - tutor: "Colpita e affondata, mi arrendo. Segno il tuo consiglio per il prossimo incontro, e il primo bicchiere te lo offro io."
      goals: [disagree, recommend]

- scenario: club-lettura
  level: C2
  persona: en-f-student
  history: [piacere]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma ci ho messo tre settimane! È una novella lunghissima, quasi seicento pagine."
      errors: [false-friend]
    - tutor: "Un romanzo lunghissimo, sì: seicento pagine in tre sere le legge solo chi non ha niente da fare, come me. Ma alla fine ti è piaciuto?"
      recast: {text: "una novella lunghissima", fix: "un romanzo lunghissimo", tags: [false-friend]}
    - learner: "Nel complesso sì. La prima parte, con il ritorno del padre dalla prigionia, è bellissima, ma le ultime pagine non mi è piaciuto per niente."
      errors: [piacere]
      gold: {text: "le ultime pagine non mi è piaciuto", fix: "le ultime pagine non mi sono piaciute"}
    - tutor: "Finalmente qualcuno che lo dice! Però ripeti: «le ultime pagine non mi è piaciuto». Chi è il soggetto del verbo, in questa frase?"
      prompt: {text: "le ultime pagine non mi è piaciuto", tags: [piacere]}
    - learner: "Le pagine, quindi: non mi sono piaciute per niente. Il finale è troppo frettoloso, come se l'autrice si fosse stancata."
    - tutor: "Stancata è crudele, ma forse giusto. E i personaggi? Io ho un debole per la madre, Teresa."
      goals: [impression]
    - learner: "Teresa è straordinaria, ma non la capisco fino in fondo. Al suo posto, io vendrei la casa subito dopo la guerra, invece di aspettare dieci anni."
      errors: [conditional-form]
      gold: {text: "io vendrei la casa", fix: "io avrei venduto la casa"}
    - tutor: "Domanda legittima, la casa è il cuore del libro. Ma «io vendrei» suona come se Teresa dovesse decidere domani: per una scelta ormai passata, quale condizionale ti serve?"
      prompt: {text: "io vendrei la casa", tags: [conditional-form]}
    - learner: "Io l'avrei venduta subito, ecco. Anche se forse lei sperava che il marito tornasse quello di prima."
    - tutor: "Esatto, e lì sta tutta la tragedia: la casa è l'ultima cosa che le ricorda chi era lui prima della guerra. Lo stile ti ha convinto?"
      goals: [character]
    - learner: "Abbastanza. Ci sono descrizioni bellissime, ma i dialoghi a volte sembrano scritti per il teatro, troppo perfetti."
    - tutor: "Su questo hai ragione, e lo dico a malincuore. Allora, lo consiglieresti al gruppo o lo bocciamo?"
      goals: [style]
    - learner: "Lo consiglierei, ma con un avvertimento: fermatevi a pagina cinquecento e il finale immaginatevelo voi!"
    - tutor: "Un consiglio di lettura sovversivo, mi piace. Lo propongo così alla prossima riunione, con il tuo avvertimento e la tua firma."
      goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: es-m-worker
  history: [participle-agreement]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, sì, anche se lavoro fino a tardi. L'ho letto in cucina, nelle pause tra un servizio e l'altro."
    - tutor: "Tra un servizio e l'altro? Allora è un libro che regge anche il rumore delle pentole. Che impressione ti ha lasciato?"
    - learner: "Mi ha commosso. Mentre leggevo pensavo in mio padre, che è cresciuto in una casa come quella, con sei fratelli e pochissimo da mangiare."
      errors: [preposition]
      gold: {text: "pensavo in mio padre", fix: "pensavo a mio padre"}
    - tutor: "Capisco perché ti abbia toccato così. Solo una cosa: «pensavo in mio padre» è un calco dallo spagnolo. Il verbo pensare, in italiano, regge un'altra preposizione: quale?"
      prompt: {text: "pensavo in mio padre", tags: [preposition]}
      goals: [impression]
    - learner: "Ah, sì: pensavo a mio padre. In spagnolo diciamo «pensar en» e mi scappa sempre."
    - tutor: "Succede a tutti i bilingui. E dei personaggi, chi ti è rimasto più impresso?"
    - learner: "Il padre, Arturo. Le lettere che scrive dalla prigionia, le ho letto due volte: sono la parte più bella del libro."
      errors: [participle-agreement]
      gold: {text: "le ho letto", fix: "le ho lette"}
    - tutor: "Sono d'accordo, sono pagine che fanno male. Però, con quel «le» davanti al verbo, «le ho letto» ti convince fino in fondo?"
      prompt: {text: "le ho letto", tags: [participle-agreement]}
    - learner: "Le ho lette, certo. E credo che l'autrice abbia voluto mostrare che la guerra continua anche dopo, dentro le case."
    - tutor: "Esattamente, è il cuore del libro. E lo stile, con tutte quelle pagine sulla cucina e sui pranzi, ti è sembrato lento?"
      goals: [character]
    - learner: "Lento no, anche se è un libro molto largo. Le scene di cucina sono scritte come le scriverebbe un cuoco: con pazienza e senza sprechi."
      errors: [false-friend]
    - tutor: "Molto lungo, sì, ma senza un grammo di grasso, come dici tu. Allora, lo consigli?"
      recast: {text: "molto largo", fix: "molto lungo", tags: [false-friend]}
      goals: [style]
    - learner: "Senza dubbio. Anzi, se fossi in voi lo farei leggere a chiunque pensi che il dopoguerra sia solo una pagina dei libri di storia."
    - tutor: "Lo metto in cima alla lista, con la tua recensione da chef. Il mese prossimo però scegli tu il libro, e porti anche qualcosa da assaggiare."
      goals: [recommend]

- scenario: colloquio-lavoro
  level: C2
  persona: en-f-professional
  history: [reflexive]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Sono australiana, ho laureato in comunicazione a Sydney e da sei anni lavoro nel marketing, gli ultimi tre qui a Milano."
      errors: [reflexive]
      gold: {text: "ho laureato", fix: "mi sono laureata"}
    - tutor: "Un bel percorso. Una piccola cosa, visto che il colloquio è anche in italiano: «ho laureato»? Laurearsi è un verbo particolare: che cosa manca nella sua frase?"
      prompt: {text: "ho laureato", tags: [reflexive]}
    - learner: "Ah, certo: mi sono laureata in comunicazione. Poi ho lavorato per un'agenzia che seguiva marchi di moda."
    - tutor: "Perfetto. E di quell'esperienza in agenzia, che cosa si porta dietro?"
      goals: [intro]
    - learner: "Soprattutto il ritmo. Lavoravamo con scadenze strettissime: una volta abbiamo rifatto un'intera campagna in quarantotto ore perché il cliente aveva cambiato idea all'ultimo minuto."
    - tutor: "Quarantotto ore: complimenti per i nervi. Quali direbbe che sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Credo di essere brava a tradurre un'idea complicata in un messaggio semplice. E sono molto organizzata: eventualmente tutto arriva in tempo, anche nei progetti più caotici."
      errors: [false-friend]
    - tutor: "Quindi alla fine tutto arriva in tempo: qui è una qualità preziosa. E perché proprio uno studio piccolo come il nostro?"
      recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
      goals: [strengths]
    - learner: "Perché dopo anni di grandi marchi vorrei vedere da vicino come nasce un prodotto. In agenzia arrivavamo sempre alla fine, quando tutto era già deciso."
    - tutor: "Motivazione chiara. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì, due. Com'è organizzato il team? E se fossi scelta, quando dovrò cominciare?"
      errors: [conditional-form]
      gold: {text: "quando dovrò cominciare", fix: "quando dovrei cominciare"}
    - tutor: "Domande giuste. Ma sulla seconda: «se fossi scelta, quando dovrò cominciare»? Con quel «se fossi», che modo chiede la frase principale?"
      prompt: {text: "quando dovrò cominciare", tags: [conditional-form]}
    - learner: "Giusto: se fossi scelta, quando dovrei cominciare?"
    - tutor: "Esatto. Il team è di sei persone, tutte sotto i quarant'anni, e cerchiamo qualcuno per inizio marzo. Le faremo sapere entro venerdì."
      goals: [questions]

- scenario: colloquio-lavoro
  level: C2
  persona: es-f-teacher
  history: [stare-gerund]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Sono spagnola, di Valencia, e insegno storia dell'arte da dodici anni. Negli ultimi tre sono stata lavorando anche alla progettazione di materiali didattici digitali."
      errors: [stare-gerund]
      gold: {text: "sono stata lavorando", fix: "ho lavorato"}
    - tutor: "Un profilo insolito, ed è per questo che l'abbiamo chiamata. Però «sono stata lavorando» è un calco dallo spagnolo: in italiano, per un periodo che arriva fino a oggi, che tempo usiamo?"
      prompt: {text: "sono stata lavorando", tags: [stare-gerund]}
    - learner: "Ah, già, non esiste: negli ultimi tre anni ho lavorato anche alla progettazione di materiali digitali per la mia scuola."
    - tutor: "Esatto. Mi racconti un progetto di cui va particolarmente fiera."
      goals: [intro]
    - learner: "Durante la pandemia, io e due colleghi eramo gli unici a saper usare le piattaforme online, così abbiamo creato da zero un corso interattivo sul Barocco."
      errors: [imperfetto-form]
      gold: {text: "eramo", fix: "eravamo"}
    - tutor: "Il Barocco in videolezione, che sfida. Ma torni su «eramo»: è lo spagnolo che fa capolino. Come fa l'imperfetto di essere, in italiano, alla prima plurale?"
      prompt: {text: "eramo", tags: [imperfetto-form]}
    - learner: "Eravamo, mi scusi. Il corso poi è stato adottato da altre quindici scuole della regione."
    - tutor: "Quindici scuole, un risultato concreto. E secondo lei, qual è il suo punto di forza principale?"
      goals: [experience]
    - learner: "La pazienza, credo, e la capacità di spiegare. Quando un alunno non capisce, cerco di non contestare mai di fretta: preferisco trovare un altro esempio."
      errors: [false-friend]
    - tutor: "Trovare un altro esempio invece di rispondere di fretta: è esattamente ciò che serve a chi progetta corsi. E perché lasciare la scuola per uno studio di design?"
      recast: {text: "contestare", fix: "rispondere", tags: [false-friend]}
      goals: [strengths]
    - learner: "Perché mi piacerebbe che i miei materiali arrivassero a più persone. A scuola faccio un buon lavoro, ma resta chiuso tra quattro mura."
    - tutor: "Motivazione convincente. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì: avrei la possibilità di continuare a insegnare qualche ora alla settimana, magari in un corso serale?"
    - tutor: "È una richiesta ragionevole, e potremmo trovare un accordo su un part-time. Ne parliamo al secondo colloquio, che fisseremo entro fine mese."
      goals: [questions]

# Round 5, set w-c2: broad C2 coverage (prepositions, auxiliaries, participles, article form,
# negation, spelling, register, ci-ne, conditional of the future-in-the-past) beside many
# error-free turns. File 1.
- scenario: arte-mostra
  level: C2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Guarda quest'opera. Che impressione ti fa?"
    - learner: "Sinceramente mi spiazza. Da lontano pensavo fosse una tenda, e invece sono migliaia di chiavi appese a fili di nylon."
    - tutor: "Vero? E più ti avvicini, più senti il tintinnio: l'artista le ha raccolte porta a porta, in un quartiere che stava per essere demolito. Come la descriveresti a chi non c'è?"
      goals: [react]
    - learner: "Direi che è una specie di nuvola metallica che riempie tutta la sala. La luce colpisce ogni chiave in modo diverso e le ombre sul muro cambiano, dipende di dove ti metti."
      errors: [preposition]
      gold: {text: "dipende di dove", fix: "dipende da dove"}
    - tutor: "Bella immagine, la nuvola metallica. Ma riascolta un attimo: «dipende di dove ti metti». Il verbo dipendere quale preposizione regge?"
      prompt: {text: "dipende di dove", tags: [preposition]}
    - learner: "Ah, giusto: dipende da dove ti metti. Se ti sposti verso la finestra, le ombre quasi spariscono."
    - tutor: "Esatto. E allora, secondo te, che cosa vuole dirci con tutte queste chiavi che non aprono più nessuna porta?"
      goals: [describe]
    - learner: "Credo che parli di case perdute, di vite che sono state cancellate da un giorno all'altro. Ogni chiave è una famiglia che non ha più un posto dove tornare."
    - tutor: "È proprio la lettura che ne dà il catalogo, e la sottoscrivo parola per parola. Ti viene in mente un'altra opera che lavori sulla memoria in questo modo?"
      goals: [interpret]
    - learner: "Mi ricorda quelle installazioni fatte con montagne di vestiti usati: anche lì ogni oggetto sta per una persona assente. Qui però l'effetto è più leggero, quasi musicale."
    - tutor: "Paragone azzeccato: stesso tema dell'assenza, ma qui il vuoto suona invece di pesare. Andiamo avanti, la prossima sala ti piacerà ancora di più."
      goals: [compare]

- scenario: arte-mostra
  level: C2
  persona: es-m-worker
  history: [subjunctive-form]
  turns:
    - tutor: "Guarda questa fotografia. Che impressione ti fa?"
    - learner: "Mi stringe il cuore. Tutta quella gente sul molo con le valigie di cartone... sembra mio nonno da giovane."
    - tutor: "Immaginavo che ti avrebbe toccato da vicino. Descrivimi con calma quello che vedi."
      goals: [react]
    - learner: "In primo piano c'è una donna con un bambino in braccio che guarda verso la nave. Dietro, la folla è tutta sfocata. Questa foto è stata presa nel cinquantadue, dice il cartello."
      errors: [word-choice]
    - tutor: "Sì, è stata scattata nel cinquantadue, al porto di Genova. E nota come la messa a fuoco isoli solo lei: tutto il resto diventa un'onda grigia."
      recast: {text: "presa", fix: "scattata", tags: [word-choice]}
      goals: [describe]
    - learner: "Immagino che quella donna vadi in Argentina, come i miei bisnonni. Ha la faccia di chi sa che non tornerà."
      errors: [subjunctive-form]
      gold: {text: "vadi", fix: "vada"}
    - tutor: "Che lettura intensa. Però fermati su «vadi»: lo senti dire spesso in giro, ma non è la forma corretta del congiuntivo. Come la sistemi?"
      prompt: {text: "vadi", tags: [subjunctive-form]}
    - learner: "Che vadia? No, aspetta... non sono sicuro."
      errors: [subjunctive-form]
    - tutor: "È probabile che vada proprio in Argentina: molte di quelle navi erano dirette a Buenos Aires. E secondo te, perché il fotografo ha scelto lei e non la nave?"
      recast: {text: "vadia", fix: "vada", tags: [subjunctive-form]}
    - learner: "Perché la nave è la storia ufficiale, e lei è la storia vera. Credo che volesse dire che l'emigrazione si capisce solo guardando le persone."
    - tutor: "Hai riassunto il senso di tutta la mostra in una frase. È lo stesso sguardo del neorealismo, non trovi?"
      goals: [interpret]
    - learner: "Sì, mi fa pensare ai film di quegli anni: anche lì la macchina da presa sta all'altezza della gente comune, senza retorica."
    - tutor: "Esattamente, e infatti alcuni di questi fotografi lavoravano proprio sui set. Vieni, nella sala dopo ci sono le immagini dell'arrivo dall'altra parte dell'oceano."
      goals: [compare]

- scenario: assemblea-condominio
  level: C2
  persona: en-m-retired
  history: [conditional-form]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Premetto che l'ascensore servirebbe anche a me, che ho settantasei anni. Ma a giugno ci era stato detto che il preventivo arriverebbe entro settembre, e lo abbiamo ricevuto solo ieri sera."
      errors: [conditional-form]
      gold: {text: "arriverebbe", fix: "sarebbe arrivato"}
    - tutor: "Sul ritardo ha ragione, e me ne assumo la responsabilità. Ma torniamo un istante su «ci era stato detto che il preventivo arriverebbe»: per un futuro visto dal passato, quel condizionale Le torna?"
      prompt: {text: "arriverebbe", tags: [conditional-form]}
    - learner: "Giusto, ci vuole il condizionale passato: ci era stato detto che sarebbe arrivato entro settembre. Comunque il punto è che nessuno ha avuto il tempo di leggerlo."
    - tutor: "Perfetto. La signora del terzo piano, però, ricorda che aspetta l'ascensore da dieci anni e che ogni rinvio, per lei, significa un altro inverno di scale."
      goals: [position]
    - learner: "La capisco benissimo, e mi dispiace sinceramente. Non voglio negarle niente: chiedo solo una settimana per capire bene che cosa stiamo firmando."
    - tutor: "Mi pare che la signora apprezzi il tono. C'è però chi teme che, aspettando, i prezzi salgano ancora. Lei che cosa propone?"
      goals: [defuse]
    - learner: "Proprio per questo: rispetto al primo preventivo informale, il costo ha aumentato del venti per cento. Propongo di chiedere alla ditta di bloccare il prezzo per un mese."
      errors: [auxiliary-choice]
      gold: {text: "il costo ha aumentato", fix: "il costo è aumentato"}
    - tutor: "Proposta concreta. Prima di metterla a verbale, però: «il costo ha aumentato»? Aumentare, quando non ha un complemento oggetto, con quale ausiliare si coniuga?"
      prompt: {text: "il costo ha aumentato", tags: [auxiliary-choice]}
    - learner: "Ah, allora... il costo si è aumentato del venti per cento."
      errors: [auxiliary-choice]
    - tutor: "Già, il costo è aumentato del venti per cento, e lo scrivo così. Il signor Rossi però brontola che un mese di attesa è un regalo alla ditta. Vuole rispondergli?"
      recast: {text: "il costo si è aumentato", fix: "il costo è aumentato", tags: [auxiliary-choice]}
      goals: [alternative]
    - learner: "Signor Rossi, finora la prudenza ci ha fatto risparmiare: se avessimo firmato a giugno, avremmo pagato anche voci che la ditta stessa ha poi tolto."
    - tutor: "Argomento difficile da smontare, e infatti il signor Rossi annuisce. Metto ai voti: prezzo bloccato per trenta giorni e assemblea straordinaria entro fine mese. Unanimità: grazie, signori, e sono appena le dieci."
      goals: [compromise]

- scenario: assemblea-condominio
  level: C2
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Le ringrazio. Allora, io non sono contrario al rifacimento della facciata, ma vorrei che si rimandasse all'autunno."
      errors: [object-pronoun]
      gold: {text: "Le ringrazio", fix: "La ringrazio"}
    - tutor: "Prego. Solo un dettaglio, visto che resta tutto a verbale: «Le ringrazio»? Si ringrazia qualcuno direttamente: che pronome ci vuole, allora?"
      prompt: {text: "Le ringrazio", tags: [object-pronoun]}
    - learner: "Ha ragione: La ringrazio. Il motivo è semplice: se i ponteggi restassero su per tutta l'estate, il bar e la merceria al piano terra perderebbero la stagione migliore."
    - tutor: "Chiaro. Il signore dell'interno sei, però, dice che dei negozi non gli importa nulla e che le infiltrazioni in casa sua non aspettano l'autunno."
      goals: [position]
    - learner: "Ha perfettamente ragione a preoccuparsi, le infiltrazioni sono un problema serio. Ma si possono riparare subito con un intervento mirato, senza montare i ponteggi su tutto il palazzo."
    - tutor: "Il signore sembra più tranquillo, almeno per ora. Ha già un'idea di costi e tempi per questo intervento mirato?"
      goals: [defuse]
    - learner: "Sì, ho chiesto a un artigiano del quartiere. Ho messo due settimane a convincerlo a venire, ma alla fine è salito e dice che bastano tre giorni e circa duemila euro."
      errors: [ci-ne]
      gold: {text: "Ho messo due settimane", fix: "Ci ho messo due settimane"}
    - tutor: "Tre giorni e duemila euro: è un'ottima notizia. Ma «ho messo due settimane a convincerlo»: con mettere usato per il tempo che serve, non manca qualcosa davanti al verbo?"
      prompt: {text: "Ho messo due settimane", tags: [ci-ne]}
    - learner: "Ah, certo: ci ho messo due settimane. Gli artigiani bravi sono sempre pieni di lavoro."
    - tutor: "Altroché. Allora, se ho capito bene, la proposta è: infiltrazioni riparate subito e facciata a settembre?"
      goals: [alternative]
    - learner: "Esatto. E chiederei che il preventivo per la facciata venga approvato entro luglio, così la ditta può organizzarsi per tempo."
    - tutor: "Mi sembra una mediazione che accontenta tutti, anche l'interno sei. Metto ai voti: approvata a larga maggioranza. Grazie, ci rivediamo a luglio."
      goals: [compromise]

- scenario: assicurazione-sinistro
  level: C2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri sera stavo uscendo in retromarcia da un parcheggio quando un furgone delle consegne mi ha preso in pieno la fiancata. Andava decisamente troppo veloce."
    - tutor: "Mi dispiace. Lei sta bene? E il conducente del furgone si è fermato?"
      goals: [what]
    - learner: "Io sto bene, solo un grande spavento. Lui si è fermato e abbiamo compilato insieme la constatazione amichevole, anche se non eravamo d'accordo quasi su niente."
    - tutor: "Già averla compilata ci semplifica molto le cose. Su che cosa non eravate d'accordo, esattamente?"
    - learner: "Lui dice che mi sono mosso all'ultimo momento, ma non è vero: sono stato fermo da almeno cinque secondi quando mi è venuto addosso."
      errors: [tense-aspect]
      gold: {text: "sono stato fermo", fix: "ero fermo"}
    - tutor: "Capisco. Per la ricostruzione, però, il tempo verbale conta: «sono stato fermo da almeno cinque secondi» descrive una situazione in corso o un fatto concluso?"
      prompt: {text: "sono stato fermo", tags: [tense-aspect]}
    - learner: "Una situazione in corso, quindi: ero fermo da almeno cinque secondi. E c'è anche una testimone, una signora che aspettava l'autobus."
    - tutor: "Ottimo, una testimonianza esterna pesa molto. Segno che la dinamica è contestata e che c'è una testimone. Che danni ha riportato l'auto?"
      goals: [responsibility]
    - learner: "Il paraurti è distrutto, il fanale posteriore è rotto e anche il pneumatico sinistro si è squarciato contro il marciapiede."
      errors: [article-form]
      gold: {text: "il pneumatico", fix: "lo pneumatico"}
    - tutor: "Prendo nota. E un dettaglio che sbagliano anche molti italiani: «il pneumatico»? Davanti al gruppo «pn», quale articolo vuole la norma?"
      prompt: {text: "il pneumatico", tags: [article-form]}
    - learner: "Davvero? Allora lo pneumatico, come lo psicologo. Non l'avrei mai detto."
    - tutor: "Proprio così. Adesso mi servono le foto dei danni, la constatazione firmata e i dati della testimone, via mail entro tre giorni."
      goals: [documents]
    - learner: "Perfetto, ho già tutto sul telefono, glielo mando stasera stessa. E poi che cosa succede?"
    - tutor: "Le assegniamo un perito, che la contatterà entro una settimana per vedere l'auto. Se la testimone conferma la sua versione, la responsabilità sarà interamente della controparte."
      goals: [next]

- scenario: assicurazione-sinistro
  level: C2
  persona: es-f-teacher
  history: [past-participle-form]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Le spiego: sabato ho lasciato la macchina nel parcheggio sotterraneo del supermercato e, quando sono tornata, la portiera destra era tutta ammaccata."
    - tutor: "Che brutta sorpresa. Ha idea di chi possa essere stato?"
      goals: [what]
    - learner: "Sul parabrezza c'era un biglietto con un nome e un numero, ma quando ho chiamato nessuno non ha risposto. Ho riprovato quattro volte."
      errors: [negation]
      gold: {text: "nessuno non ha risposto", fix: "nessuno ha risposto"}
    - tutor: "Almeno qualcuno ha avuto la decenza di lasciare un recapito. Ma la frase «nessuno non ha risposto»: quando nessuno sta prima del verbo, come si comporta la negazione in italiano?"
      prompt: {text: "nessuno non ha risposto", tags: [negation]}
    - learner: "Ah, è vero, in spagnolo lo diciamo così. Nessuno ha risposto, e adesso il numero risulta inesistente."
    - tutor: "Capisco. Senza una controparte identificata, il danno rientra nella sua polizza, se ha la garanzia per urti da ignoti. Nel parcheggio ci sono telecamere?"
      goals: [responsibility]
    - learner: "Sì, e il direttore del supermercato mi ha offrito di vedere le registrazioni, ma solo con una richiesta scritta della polizia."
      errors: [past-participle-form]
      gold: {text: "offrito", fix: "offerto"}
    - tutor: "Molto disponibile, il direttore. Però «mi ha offrito»: offrire ha un participio irregolare, come aprire e soffrire. Le viene in mente?"
      prompt: {text: "offrito", tags: [past-participle-form]}
    - learner: "Mi ha offerto, certo, come aperto. Allora devo prima fare denuncia ai carabinieri?"
    - tutor: "Esatto: con la denuncia le forze dell'ordine possono acquisire le immagini e noi possiamo rivalerci sul responsabile. Mi mandi la copia della denuncia, le foto della portiera e il biglietto."
      goals: [documents]
    - learner: "D'accordo. Ma se il responsabile non venisse trovato, la riparazione sarebbe pagata dall'assicurazione o rimarrebbe a mio carico?"
    - tutor: "Con la sua garanzia accessoria la paghiamo noi, meno una franchigia di duecento euro. Appena riceviamo la denuncia, le mandiamo un perito in carrozzeria."
      goals: [next]

- scenario: burocrazia-residenza
  level: C2
  persona: en-f-student
  history: [spelling]
  turns:
    - tutor: "Buongiorno. Numero 112? Prego, mi dica."
    - learner: "Buongiorno. Un mese fa mi sono trasferita in un altro appartamento qui in città e vorrei aggiornare l'indirizzo della residenza."
    - tutor: "Certo. Ha già presentato la dichiarazione di cambio di abitazione online, o la facciamo adesso?"
      goals: [request]
    - learner: "L'ho fatta online il primo del mese, ma nessuno mi ha più contattata. Scusa, mi puoi dire a che punto è la pratica?"
      errors: [register]
      gold: {text: "Scusa, mi puoi dire", fix: "Scusi, mi può dire"}
    - tutor: "Controllo subito. Ma mi perdoni la pedanteria da ufficio pubblico: «scusa, mi puoi dire» è proprio il tono che vuole usare allo sportello?"
      prompt: {text: "Scusa, mi puoi dire", tags: [register]}
    - learner: "Oddio, mi scusi! Mi può dire a che punto è? All'università diamo del tu a tutti e me ne dimentico."
    - tutor: "Nessun problema, capita. Vedo che la pratica è aperta, ma manca l'accertamento della polizia locale: devono verificare che lei abiti davvero lì."
      goals: [problem]
    - learner: "Ah, ecco perché. Ma qual'è il problema, di preciso? Il mio nome sul citofono c'è già."
      errors: [spelling]
      gold: {text: "qual'è", fix: "qual è"}
    - tutor: "Probabilmente sono passati mentre lei era a lezione. E visto che l'ha scritto così anche nel modulo: «qual'è» con l'apostrofo? Ci pensi un attimo: lì c'è davvero un'elisione?"
      prompt: {text: "qual'è", tags: [spelling]}
    - learner: "Giusto, è un troncamento: qual è, senza apostrofo. Me lo correggevano sempre anche al corso."
    - tutor: "Brava, è una regola che inganna metà degli italiani. Per sbloccare la pratica mi lasci un numero di cellulare e metta il suo nome ben visibile anche sulla cassetta delle lettere."
      goals: [documents]
    - learner: "Va bene. E se non mi trovassero neanche la seconda volta, che cosa succede?"
    - tutor: "Le lasciano un avviso e lei fissa un appuntamento al comando. Una volta fatto l'accertamento, la residenza decorre dalla data della dichiarazione, quindi non perde nulla."
      goals: [next]

- scenario: burocrazia-residenza
  level: C2
  persona: es-m-worker
  history: [article-use]
  turns:
    - tutor: "Buongiorno. Numero 63? Prego, mi dica."
    - learner: "Buongiorno. Ho fatto una cola di un'ora fuori, ma finalmente ci sono. Vorrei chiedere la residenza."
      errors: [false-friend]
    - tutor: "Mi dispiace per la coda, il lunedì è sempre così. Allora, prima iscrizione all'anagrafe: arriva dall'estero?"
      recast: {text: "cola", fix: "coda", tags: [false-friend]}
      goals: [request]
    - learner: "Sì, dall'Argentina, ma ho anche il passaporto italiano perché mio bisnonno era di Modena. Lavoro come cuoco in un ristorante del centro."
    - tutor: "Bene, da cittadino italiano la procedura è più semplice. Mi servono il passaporto, il codice fiscale e il contratto d'affitto registrato."
    - learner: "Ecco il passaporto e il codice fiscale. Il contratto, invece, il proprietario dice che lo sta ancora registrando."
    - tutor: "Allora qui c'è un intoppo: senza contratto registrato, o almeno una dichiarazione del proprietario, non posso procedere."
      goals: [documents]
    - learner: "Ma io ho bisogno di residenza entro fine mese, per fare la tessera sanitaria e scegliere il medico."
      errors: [article-use]
      gold: {text: "ho bisogno di residenza", fix: "ho bisogno della residenza"}
    - tutor: "Capisco l'urgenza. Però ascolti la sua frase: «ho bisogno di residenza». Parla di una residenza qualsiasi o di quella precisa che sta chiedendo?"
      prompt: {text: "ho bisogno di residenza", tags: [article-use]}
    - learner: "Di quella precisa, quindi ho bisogno della residenza. Non c'è un modo per fare più in fretta?"
    - tutor: "Esatto. Una soluzione c'è: il proprietario firma una dichiarazione di assenso, con la copia del suo documento. Con quella, la pratica parte oggi stesso."
      goals: [problem]
    - learner: "Ottimo, gli scrivo subito. Può mandarvela per mail o deve venire lui di persona?"
    - tutor: "Può mandarla alla nostra casella di posta certificata, oppure passare allo sportello senza appuntamento. Poi, entro quarantacinque giorni, la polizia locale verrà per l'accertamento."
      goals: [next]

# Round 5, set w-c2: broad C2 coverage. File 8: ethics, smart working, translation, negotiations,
# overtourism, satire, life in Italy.
- scenario: seminario-etica
  level: C2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Bene, dottore, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Prego, professore. Ma prima di rispondere la sua obiezione, vorrei chiarire che cosa intendo per responsabilità."
      errors: [preposition]
      gold: {text: "rispondere la sua obiezione", fix: "rispondere alla sua obiezione"}
    - tutor: "Chiarire i termini è sempre saggio. Ma «rispondere la sua obiezione»: rispondere regge un complemento diretto, o qualcos'altro?"
      prompt: {text: "rispondere la sua obiezione", tags: [preposition]}
    - learner: "Qualcos'altro: rispondere alla sua obiezione. Per responsabilità intendo la capacità di rendere conto delle proprie azioni, cioè di giustificarle."
    - tutor: "Definizione ragionevole. Ma allora un sistema che spiega le proprie decisioni, riga per riga, ne renderebbe conto."
      goals: [thesis]
    - learner: "Ne darebbe una descrizione, non una giustificazione. Spiegare come si è arrivati a un risultato non equivale a sapere perché era giusto arrivarci."
    - tutor: "Distinzione elegante. Ma questo non vale anche per molti esseri umani, che agiscono senza sapere davvero perché?"
      goals: [distinguish]
    - learner: "È vero, ma da un essere umano si può pretendere delle giustificazioni, da una macchina no."
      errors: [subject-verb-agreement]
      gold: {text: "si può pretendere delle giustificazioni", fix: "si possono pretendere delle giustificazioni"}
    - tutor: "Interessante: la differenza starebbe in ciò che possiamo esigere. Però «si può pretendere delle giustificazioni»: con un si passivante e un oggetto plurale, il verbo come si accorda?"
      prompt: {text: "si può pretendere delle giustificazioni", tags: [subject-verb-agreement]}
      goals: [objection]
    - learner: "Al plurale: si possono pretendere delle giustificazioni. Ma riconosco che quello argomento ha un limite."
      errors: [demonstrative]
      gold: {text: "quello argomento", fix: "quell'argomento"}
    - tutor: "Apprezzo la franchezza. Ma «quello argomento»: davanti a una vocale, quello come si comporta?"
      prompt: {text: "quello argomento", tags: [demonstrative]}
    - learner: "Si elide: quell'argomento. Il limite è che, se un giorno le macchine imparerebbero a giustificarsi, la mia tesi crollerebbe."
      errors: [hypothetical]
      gold: {text: "se un giorno le macchine imparerebbero", fix: "se un giorno le macchine imparassero"}
    - tutor: "Concessione onesta, e non scontata. Ma «se le macchine imparerebbero»: in un'ipotesi del genere, che cosa ci vuole dopo se?"
      prompt: {text: "se un giorno le macchine imparerebbero", tags: [hypothetical]}
      goals: [concede]
    - learner: "Se imparassero, certo. E allora concludo che la responsabilità resta umana finché le macchine non sapranno dare ragioni, e non solo spiegazioni."
    - tutor: "Ragioni, e non solo spiegazioni: è una formula che userò anch'io a lezione, citandola. Bel lavoro, dottore."
      goals: [conclude]

- scenario: smartworking
  level: C2
  persona: es-f-erasmus
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Sto lavorando da casa da quasi un anno, ormai. All'inizio era un sogno, adesso non lo so più."
      errors: [stare-gerund]
      gold: {text: "Sto lavorando da casa da quasi un anno", fix: "Lavoro da casa da quasi un anno"}
    - tutor: "Un anno, caspita. Però «sto lavorando da casa da quasi un anno»: per una situazione che dura da tanto tempo, usiamo davvero stare più gerundio?"
      prompt: {text: "Sto lavorando da casa da quasi un anno", tags: [stare-gerund]}
    - learner: "Ah, no: lavoro da casa da quasi un anno. Il bello è che guadagno più di che pensavo, perché non spendo niente in trasporti."
      errors: [comparative]
      gold: {text: "più di che pensavo", fix: "più di quanto pensassi"}
    - tutor: "Niente treno e niente pranzi fuori, eh? Ma «guadagno più di che pensavo»: dopo più di, davanti a un verbo, quale parola ci serve?"
      prompt: {text: "più di che pensavo", tags: [comparative]}
      goals: [situation]
    - learner: "Più di quanto pensavo? O pensassi, forse."
    - tutor: "Vanno bene tutti e due, e pensassi è più elegante. Quindi i vantaggi sono soldi e tempo. E gli svantaggi?"
      goals: [pros]
    - learner: "La solitudine, soprattutto. Certi giorni non parlo con nessuno fino alle sei, e mi sento come una monja."
      errors: [word-choice]
    - tutor: "Come una suora di clausura, ti capisco benissimo. E non puoi andare in ufficio un paio di giorni alla settimana?"
      recast: {text: "una monja", fix: "una suora", tags: [word-choice]}
      goals: [cons]
    - learner: "In teoria sì, ma l'ufficio è a Milano e io vivo a Bergamo. Se l'azienda pagasse il treno, ci andrei volentieri."
    - tutor: "Capisco. E se potessi scegliere liberamente, che cosa faresti?"
    - learner: "Farei metà e metà: tre giorni a casa e due in ufficio. Per me sarebbe l'equilibrio più perfetto."
      errors: [comparative]
      gold: {text: "l'equilibrio più perfetto", fix: "l'equilibrio perfetto"}
    - tutor: "Metà e metà, saggio. Ma «l'equilibrio più perfetto»: perfetto può davvero avere un più davanti?"
      prompt: {text: "l'equilibrio più perfetto", tags: [comparative]}
      goals: [preference]
    - learner: "Hai ragione, perfetto è già il massimo: l'equilibrio perfetto. E tu, sinceramente, torneresti a lavorare da casa?"
    - tutor: "Mai più, ho bisogno della macchinetta del caffè e dei pettegolezzi. Ma per te il tre più due mi sembra proprio la soluzione giusta."

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-student
  history: [conditional-form]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, ci ho pensato anch'io. Nell'originale le frasi sono secche, e nella mia versione tutta la ironia si perde."
      errors: [article-form]
      gold: {text: "la ironia", fix: "l'ironia"}
    - tutor: "Almeno sei lucida. Ma prima di salvare l'autore, salviamo l'articolo: «la ironia»? Davanti a una vocale, che succede?"
      prompt: {text: "la ironia", tags: [article-form]}
      goals: [problem]
    - learner: "Si apostrofa: tutta l'ironia si perde. Dovrei averlo tradotto più alla lettera, forse."
      errors: [conditional-form]
      gold: {text: "Dovrei averlo tradotto", fix: "Avrei dovuto tradurlo"}
    - tutor: "Forse. Ma «dovrei averlo tradotto» è inglese travestito: per un rimpianto sul passato, in italiano il condizionale passato su quale verbo lo mettiamo?"
      prompt: {text: "Dovrei averlo tradotto", tags: [conditional-form]}
    - learner: "Sul verbo dovere: avrei dovuto tradurlo più alla lettera. Ma la lettera, in italiano, a volte suona goffa."
    - tutor: "Goffa o fedele, decidi tu. Quali alternative vedi, per la prima frase del capitolo?"
    - learner: "Due: tenere la frase corta e brusca, come nell'originale, oppure spezzarla con un inciso, che però attenua il colpo."
    - tutor: "Tu hai scelto la seconda, e infatti il colpo non arriva. E a pagina dodici? «Sensible» tradotto con «sensibile»: un capolavoro di distrazione."
      goals: [options]
    - learner: "Oddio, è vero: lì significa sensato, ragionevole. È il primo falso amico che ci insegnano, e io ci sono cascata in pieno."
    - tutor: "Consolati, capita anche ai migliori, ma non in una bozza finale. Allora, che cosa decidiamo per il capitolo?"
      goals: [false-friend]
    - learner: "Lo riscrivo tutto con frasi più brevi. Vorrei però che tu mi dica se il tono va bene, prima che lo mandiamo all'editor."
      errors: [subjunctive-use]
      gold: {text: "che tu mi dica", fix: "che tu mi dicessi"}
    - tutor: "Volentieri. Ma «vorrei che tu mi dica»: dopo un condizionale come vorrei, quale tempo del congiuntivo ti aspetti?"
      prompt: {text: "che tu mi dica", tags: [subjunctive-use]}
    - learner: "Il congiuntivo imperfetto: vorrei che tu mi dicessi se il tono va bene, prima dell'editor."
    - tutor: "Affare fatto: me lo mandi giovedì e lo leggo con la matita rossa in mano. E stavolta l'autore deve sentirsi a casa sua."
      goals: [decide]

- scenario: trattativa-affitto
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto. Il piso è luminoso e la cucina è grande, che per un cuoco come me è fondamentale."
      errors: [word-choice]
    - tutor: "L'appartamento è perfetto per un cuoco, in effetti: la cucina è stata rifatta l'anno scorso. Quindi è interessato?"
      recast: {text: "Il piso", fix: "L'appartamento", tags: [word-choice]}
      goals: [interest]
    - learner: "Sì, ma ottocentocinquanta euro al mese sono troppi per me. Se il proprietario lo abbasserebbe a settecentocinquanta, firmerei domani."
      errors: [hypothetical]
      gold: {text: "Se il proprietario lo abbasserebbe", fix: "Se il proprietario lo abbassasse"}
    - tutor: "Settecentocinquanta è un bel salto. Ma intanto la sua frase: «se il proprietario lo abbasserebbe». Dopo se, il condizionale le sembra giusto?"
      prompt: {text: "Se il proprietario lo abbasserebbe", tags: [hypothetical]}
    - learner: "No: se il proprietario lo abbassasse, firmerei domani. E posso offrire un contratto di quattro anni, sicuro."
    - tutor: "Quattro anni sono un argomento che al proprietario piace. Potrei proporgli ottocento, con un contratto quattro più quattro."
      goals: [negotiate]
    - learner: "Ottocento va bene, purché il proprietario accetta anche di cambiare la caldaia, che è vecchissima."
      errors: [subjunctive-use]
      gold: {text: "purché il proprietario accetta", fix: "purché il proprietario accetti"}
    - tutor: "Ragionevole, la caldaia ha vent'anni. Ma «purché il proprietario accetta»: purché, come benché, quale modo vuole?"
      prompt: {text: "purché il proprietario accetta", tags: [subjunctive-use]}
    - learner: "Purché accetti, certo. E quanto devo lasciare di fianza?"
      errors: [word-choice]
    - tutor: "Di cauzione, tre mensilità, come d'uso. Le preparo una proposta scritta con l'affitto a ottocento, la caldaia nuova e la cauzione."
      recast: {text: "fianza", fix: "cauzione", tags: [word-choice]}
      goals: [conditions]
    - learner: "Perfetto. Se mi manda la proposta stasera, gliela firmo domani mattina, prima di andare al ristorante."
    - tutor: "Gliela mando entro le sei. Se il proprietario è d'accordo, a fine mese le consegno le chiavi."
      goals: [conclude]

- scenario: trattativa-fornitore
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per questo. Un aumento del quindici per cento sui i imballaggi è difficile da giustificare con i nostri clienti."
      errors: [articulated-preposition]
      gold: {text: "sui i imballaggi", fix: "sugli imballaggi"}
    - tutor: "Capisco la sorpresa. Però «sui i imballaggi»: la preposizione articolata non contiene già l'articolo? E davanti a una vocale, come diventa?"
      prompt: {text: "sui i imballaggi", tags: [articulated-preposition]}
      goals: [problem]
    - learner: "Sugli imballaggi, giusto. E non è solo questo: la competizione ci offre gli stessi vassoi a prezzi più bassi del dieci per cento."
      errors: [word-choice]
    - tutor: "La concorrenza fa il suo mestiere, ma non sempre con la nostra qualità. Su che cosa vi basate per dire che i vassoi sono gli stessi?"
      recast: {text: "la competizione", fix: "la concorrenza", tags: [word-choice]}
    - learner: "Sulle schede tecniche: stesso spessore, stesso materiale riciclato. E siamo vostri clienti da dieci anni, abbiamo sempre pagato puntualmente."
    - tutor: "Lo so, e lo apprezziamo. Che cosa mi propone, allora?"
      goals: [argue]
    - learner: "Sarebbe possibile che ci fate un aumento del sette per cento, invece del quindici, in cambio di un contratto biennale?"
      errors: [subjunctive-use]
      gold: {text: "Sarebbe possibile che ci fate", fix: "Sarebbe possibile che ci faceste"}
    - tutor: "Un biennale è interessante. Ma «sarebbe possibile che ci fate»: dopo sarebbe possibile che, quale modo e quale tempo ci vogliono?"
      prompt: {text: "Sarebbe possibile che ci fate", tags: [subjunctive-use]}
    - learner: "Che ci facciate?"
      errors: [subjunctive-use]
    - tutor: "Che ci faceste un aumento del sette, dice? Con un biennale posso scendere al dieci, non oltre. Le andrebbe bene?"
      recast: {text: "Che ci facciate", fix: "Che ci faceste", tags: [subjunctive-use]}
      goals: [counteroffer]
    - learner: "Diciamo l'otto, e firmiamo il biennale entro venerdì. Altrimenti dovrò per forza valutare altre offerte."
    - tutor: "L'otto mi fa piangere il cuore, ma dieci anni di puntualità valgono qualcosa. D'accordo: otto per cento e contratto biennale, le mando la bozza entro domani."
      goals: [agreement]

- scenario: turismo-di-massa
  level: C2
  persona: en-m-retired
  history: [ce-ci-sono]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno. Sono contrario, anche se capisco l'intenzione: Venezia sta diventando un parco di temi, e qualcosa bisogna fare."
      errors: [word-choice]
    - tutor: "Un parco a tema, lo dicono in molti. Ma allora perché è contrario?"
      recast: {text: "un parco di temi", fix: "un parco a tema", tags: [word-choice]}
      goals: [introduce]
    - learner: "Perché non credo che il ticket risolvi niente. Chi viene da lontano lo paga senza pensarci."
      errors: [subjunctive-form]
      gold: {text: "risolvi", fix: "risolva"}
    - tutor: "Argomento che sentiamo spesso. Ma «non credo che il ticket risolvi»: il congiuntivo di risolvere, alla terza persona, come fa?"
      prompt: {text: "risolvi", tags: [subjunctive-form]}
    - learner: "Risolva, scusi, è l'emozione della diretta. Non credo che il ticket risolva niente."
    - tutor: "Ci mancherebbe, succede a tutti. Ha un esempio concreto di quello che dice?"
    - learner: "Certo. Ero a Venezia ad aprile, un martedì qualsiasi: c'era almeno trentamila persone solo tra Rialto e San Marco, con il ticket già in vigore."
      errors: [ce-ci-sono]
      gold: {text: "c'era almeno trentamila persone", fix: "c'erano almeno trentamila persone"}
    - tutor: "Trentamila in un martedì, impressionante. Però «c'era almeno trentamila persone»: con un soggetto plurale, come diventa?"
      prompt: {text: "c'era almeno trentamila persone", tags: [ce-ci-sono]}
      goals: [example]
    - learner: "C'erano, naturalmente: c'erano trentamila persone, e il ticket non aveva scoraggiato nessuno."
    - tutor: "Le faccio l'avvocato del diavolo: senza il ticket forse sarebbero state quarantamila. Come mi risponde?"
    - learner: "Non lo posso escludere. Ma i soldi raccolti dovevano servire per le case dei residenti, e invece finora sono stato speso soprattutto in controlli."
      errors: [passive]
      gold: {text: "sono stato speso", fix: "sono stati spesi"}
    - tutor: "Molti ascoltatori la pensano come lei. Ma «i soldi sono stato speso»: nel passivo, ausiliare e participio con che cosa si accordano?"
      prompt: {text: "sono stato speso", tags: [passive]}
      goals: [rebut]
    - learner: "Con i soldi: sono stati spesi. E la mia proposta è un numero chiuso con prenotazione, come nei musei, così i visitatori si distribuiscono nell'arco della settimana."
    - tutor: "Numero chiuso con prenotazione, come agli Uffizi: proposta chiara. Grazie della telefonata, e passiamo alla prossima linea."
      goals: [proposal]

- scenario: umorismo-satira
  level: C2
  persona: es-f-teacher
  history: [hypothetical]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto! Se l'avessi capita, ridevo come tutti. Ma la parola «guanciale» non la conoscevo."
      errors: [hypothetical]
      gold: {text: "ridevo come tutti", fix: "avrei riso come tutti"}
    - tutor: "Il guanciale, sacro e inviolabile! Ma «se l'avessi capita, ridevo»: si dice al bar, ma tu che sei professoressa come la metteresti in un compito?"
      prompt: {text: "ridevo come tutti", tags: [hypothetical]}
      goals: [missed]
    - learner: "Se l'avessi capita, avrei riso come tutti. Comunque il comico era molto grazioso, soprattutto quando imitava i politici."
      errors: [false-friend]
    - tutor: "Molto spiritoso, sì, e anche un po' perfido. Qual è stata la tua battuta preferita?"
      recast: {text: "molto grazioso", fix: "molto spiritoso", tags: [false-friend]}
    - learner: "Quella sul treno regionale: ha detto che arrivava così in ritardo che i passeggeri scendevano già in pensione."
    - tutor: "Quella è un classico! E il gioco di parole sulla Camera, l'hai colto?"
      goals: [favourite]
    - learner: "Sì, quello l'ho capito: diceva che alla Camera dormono tutti, come in camera da letto. Era la parte migliore di tutto quel spettacolo."
      errors: [demonstrative]
      gold: {text: "quel spettacolo", fix: "quello spettacolo"}
    - tutor: "Brava, era il cuore della satira. Ma «quel spettacolo»: davanti a s più consonante, che forma prende quello?"
      prompt: {text: "quel spettacolo", tags: [demonstrative]}
      goals: [wordplay]
    - learner: "Quello spettacolo, come lo studente. Però la battuta sul Papa mi è sembrata un po' eccessiva: c'era gente che non rideva affatto."
    - tutor: "Eh, qui entriamo nei limiti della satira. Secondo te, su che cosa non si dovrebbe mai scherzare?"
    - learner: "Secondo me si può scherzare su tutto, purché la battuta colpisce i potenti e non i deboli."
      errors: [subjunctive-use]
      gold: {text: "purché la battuta colpisce", fix: "purché la battuta colpisca"}
    - tutor: "Posizione nobile. Ma «purché la battuta colpisce»: purché, che modo si porta dietro?"
      prompt: {text: "purché la battuta colpisce", tags: [subjunctive-use]}
      goals: [limits]
    - learner: "Il congiuntivo: purché colpisca i potenti. La satira che prende in giro i deboli è solo bullismo con il microfono."
    - tutor: "Bullismo con il microfono: la prossima volta sul palco ci sali tu. Un altro giro?"

- scenario: vita-in-italia
  level: C2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie dell'invito. Sono argentino, cuoco, e sono arrivato a Bologna nove anni fa. Prima di venire qui, ho già lavorato in un ristorante italiano a Buenos Aires per cinque anni."
      errors: [tense-aspect]
      gold: {text: "ho già lavorato", fix: "avevo già lavorato"}
    - tutor: "Quindi l'Italia l'aveva in cucina prima ancora di arrivarci. Però «prima di venire qui, ho già lavorato»: per un fatto anteriore a un altro fatto passato, che tempo ci vuole?"
      prompt: {text: "ho già lavorato", tags: [tense-aspect]}
    - learner: "Il trapassato: avevo già lavorato in un ristorante italiano. E poi mi sono sposato con una italiana, quindi la scelta era quasi obbligata!"
      errors: [article-form]
      gold: {text: "una italiana", fix: "un'italiana"}
    - tutor: "Ah, l'amore, il motivo più antico del mondo! Ma «una italiana»: davanti a vocale, quell'articolo non si accorcia?"
      prompt: {text: "una italiana", tags: [article-form]}
      goals: [story]
    - learner: "Sì, un'italiana, con l'apostrofo. La difficoltà più grande è stata il permesso di soggiorno: ho messo otto mesi per averlo."
      errors: [ci-ne]
      gold: {text: "ho messo otto mesi", fix: "ci ho messo otto mesi"}
    - tutor: "Otto mesi, purtroppo un classico. Ma «ho messo otto mesi per averlo»: per dire quanto tempo è servito, non manca un pronome?"
      prompt: {text: "ho messo otto mesi", tags: [ci-ne]}
      goals: [difficulties]
    - learner: "Ci ho messo otto mesi, giusto. Ma ne è valsa la pena."
    - tutor: "Mi fa piacere sentirlo. E in questi nove anni, lei com'è cambiato?"
    - learner: "Sono diventato più paziente, e anche più esigente con il cibo. Penso che gli italiani mi hanno insegnato che il tempo a tavola non è mai tempo perso."
      errors: [subjunctive-use]
      gold: {text: "Penso che gli italiani mi hanno insegnato", fix: "Penso che gli italiani mi abbiano insegnato"}
    - tutor: "Bellissima lezione. Ma la sua frase, «penso che gli italiani mi hanno insegnato»: dopo penso che, come si coniuga l'ausiliare?"
      prompt: {text: "Penso che gli italiani mi hanno insegnato", tags: [subjunctive-use]}
    - learner: "Mi abbiano insegnato, certo. E credo che anche mia moglie abbia imparato qualcosa da me: adesso fa la carne alla griglia meglio di me."
    - tutor: "L'allieva supera il maestro! Un consiglio per chi ci ascolta e sta pensando di trasferirsi qui?"
      goals: [change]
    - learner: "Se fossi in loro, imparerei la lingua prima di partire e non mi arrenderei alla prima pratica respinta. E cercherei subito amici italiani, non solo connazionali."
    - tutor: "Consigli preziosi, grazie davvero. E la prossima volta ci porta un piatto, così lo assaggiamo in diretta!"
      goals: [advice]

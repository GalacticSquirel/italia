# Set t-unclear, file 5: B1 services. Plural «voi» to a landlord couple or a family business,
# people the tutor does not know (asked about, never corrected) and real errors with clues.
- scenario: affittare-appartamento
  level: B1
  persona: en-f-professional
  history: [relative-pronoun]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Che luminoso! Quanto è l'affitto al mese?"
  - tutor: "Settecento euro, spese di condominio comprese. Io e mia moglie non chiediamo altro."
    goals: [rent]
  - learner: "E il riscaldamento? È autonomo?"
  - tutor: "Sì, autonomo, e la caldaia è nuova."
    goals: [condition]
    new: [{lemma: caldaia, gloss: boiler}]
  - learner: "Bene. Per il contratto, quanti mesi di caparra chiedete?"
  - tutor: "Due mesi, e il contratto è di quattro anni più quattro. Noi abitiamo proprio qui sopra."
    goals: [contract]
  - learner: "Ah, quindi voi abitate al piano di sopra? È comodo se c'è un problema."
  - tutor: "Esatto, per qualsiasi cosa basta bussare."
  - learner: "Il quartiere mi piace: è vicino alla zona in che lavoro."
    errors: [relative-pronoun]
  - tutor: "Alla zona in che lavoro? Dopo una preposizione, quale parola prende il posto di «che»?"
    prompt: {text: "in che", tags: [relative-pronoun]}
  - learner: "Sì, è vicino alla zona in che lavoro, in centro."
    errors: [relative-pronoun]
  - tutor: "Allora è perfetto: la zona in cui lavora è a dieci minuti a piedi. E qui sotto c'è anche un parco."
    recast: {text: "in che", fix: "in cui", tags: [relative-pronoun]}
    goals: [neighbourhood]
  - learner: "Mi interessa molto. Posso darle una risposta entro venerdì?"
  - tutor: "Certo, mi chiami pure venerdì."
    goals: [decide]

- scenario: banca-conto
  level: B1
  persona: es-m-worker
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, come posso esserle utile?"
  - learner: "Buongiorno. Vorrebbe aprire un conto corrente."
    errors: [conditional-form]
  - tutor: "Vorrebbe? Sta parlando di sé, quindi: io...?"
    prompt: {text: "Vorrebbe", tags: [conditional-form]}
  - learner: "Vorrei aprire un conto corrente."
  - tutor: "Perfetto. È per il lavoro?"
    goals: [purpose]
  - learner: "Sì. Lavoro da Ruiz, a Bergamo."
  - tutor: "Da Ruiz? È il nome della sua azienda?"
  - learner: "Sì, un'impresa di costruzioni. Che documenti servono?"
  - tutor: "Un documento d'identità e il codice fiscale."
    goals: [documents]
  - learner: "Li ho qui. E quanto costa il conto al mese?"
  - tutor: "Il conto base costa due euro al mese."
    goals: [costs]
  - learner: "Va bene. La carta di debito è inclusa? E c'è l'app?"
  - tutor: "Sì, la carta e l'app sono comprese nel prezzo. Firmiamo?"
    goals: [card]

- scenario: dal-meccanico
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno! Che problema ha la macchina?"
  - learner: "Fa un rumore strano quando freno."
  - tutor: "Che tipo di rumore? Forte?"
    goals: [describe]
  - learner: "Sì, forte, tipo un fischio. Il rumore comincia ieri."
    errors: [tense-aspect]
  - tutor: "Comincia ieri? È una cosa già successa: che tempo usiamo?"
    prompt: {text: "comincia ieri", tags: [tense-aspect]}
  - learner: "È cominciato ieri, in autostrada."
  - tutor: "Capisco. Probabilmente sono i freni."
    goals: [when]
  - learner: "Bruno dice che non è niente di grave."
  - tutor: "Bruno? Scusi, chi è? Lavora con le macchine?"
  - learner: "No, mio cognato. Lui di macchine sa tutto!"
  - tutor: "Speriamo che abbia ragione! Adesso controllo."
  - learner: "Quanto costerà, più o meno?"
  - tutor: "Se sono le pastiglie, circa centoventi euro."
    goals: [cost]
    new: [{lemma: pastiglia, gloss: brake pad}]
  - learner: "E quando sarà pronta?"
  - tutor: "Domani pomeriggio, se arriva il pezzo."
    goals: [time]

- scenario: prenotare-tavolo
  level: B1
  persona: es-f-teacher
  history: [conditional-form]
  turns:
  - tutor: "Pronto, Trattoria da Mario, buonasera!"
  - learner: "Buonasera! Vorrei prenotare un tavolo per sabato sera."
  - tutor: "Certo. Per quante persone e a che ora?"
    goals: [book]
  - learner: "Per nove, alle otto. L'anno scorso abbiamo festeggiato da voi e ci siamo trovati benissimo."
  - tutor: "Che piacere! Mio padre sarà contento di saperlo."
    goals: [details]
  - learner: "Salutatelo da parte mia! Vorremo un tavolo fuori, se possibile."
    errors: [conditional-form]
  - tutor: "Vorremo? Così sembra un futuro: per una richiesta gentile?"
    prompt: {text: "Vorremo", tags: [conditional-form]}
  - learner: "Vorremmo un tavolo fuori, in giardino."
  - tutor: "Va bene, vi preparo il tavolo grande sotto gli alberi."
    goals: [special]
  - learner: "Perfetto. A nome Herrera."
  - tutor: "Herrera, sabato alle otto, nove persone. A sabato!"
    goals: [name]

- scenario: prenotare-visita
  level: B1
  persona: en-f-student
  history: [future-form]
  turns:
  - tutor: "Pronto, Centro Medico San Luca, buongiorno."
  - learner: "Buongiorno, vorrei prenotare una visita dal dermatologo. Mi manda il dottor Bassi."
  - tutor: "Il dottor Bassi? È il suo medico di famiglia?"
    goals: [type]
  - learner: "Sì, esatto. Ho una macchia sulla schiena."
  - tutor: "Capisco. Il dermatologo ha posto giovedì alle dieci o lunedì alle quattro."
  - learner: "Lunedì alle quattro va bene. Anzi, non so se lavoro: lo saperò domani."
    errors: [future-form]
  - tutor: "Saperò? Il futuro di sapere è speciale, come quello di «avere»."
    prompt: {text: "saperò", tags: [future-form]}
  - learner: "Lo saprò domani, scusi."
  - tutor: "Nessun problema: le tengo il posto fino a domani sera."
    goals: [availability]
  - learner: "Grazie! Quanto costa la visita? Serve l'impegnativa?"
  - tutor: "Costa novanta euro. Con l'impegnativa costa molto meno."
    goals: [cost]
  - learner: "Allora lunedì alle quattro, con l'impegnativa. A nome Clarke."
  - tutor: "Perfetto, signora Clarke: lunedì alle sedici. Arrivederci!"
    goals: [confirm]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Buonasera. Mi dica, c'è qualche problema?"
  - learner: "Sì, purtroppo. L'aria condizionata nella mia camera non funziona."
  - tutor: "Mi dispiace molto. Da quando?"
    goals: [problem]
  - learner: "Non funziona per tre ore, e fa un caldo terribile."
    errors: [preposition]
  - tutor: "Per tre ore? Il problema c'è ancora adesso: quale preposizione serve?"
    prompt: {text: "per tre ore", tags: [preposition]}
  - learner: "Sì, non funziona per tre ore."
    errors: [preposition]
  - tutor: "Mi dispiace, da tre ore è davvero tanto."
    recast: {text: "per tre ore", fix: "da tre ore", tags: [preposition]}
    goals: [since]
  - learner: "La camera di Paul invece è fresca."
  - tutor: "Paul? È un suo compagno di viaggio?"
  - learner: "Sì, il mio collega, è nella camera accanto. Potete cambiarmi camera?"
  - tutor: "Purtroppo stasera siamo pieni. Le porto un ventilatore?"
    goals: [request]
    new: [{lemma: ventilatore, gloss: fan}]
  - learner: "Va bene, ma domani vorrei una camera diversa."
  - tutor: "D'accordo, domani mattina le diamo una camera al terzo piano."
    goals: [agree]

- scenario: restituire-prodotto
  level: B1
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno, mi dica pure."
  - learner: "Buongiorno. Ho comprato queste cuffie, ma il lato sinistro non funziona."
  - tutor: "Mi faccia vedere... sì, non si sente niente. Quando le ha comprate?"
    goals: [problem]
  - learner: "Dieci giorni fa, ecco lo scontrino. Le ho comprate per Iván."
  - tutor: "Per Iván? Erano un regalo?"
    goals: [proof]
  - learner: "Sì, per il mio ragazzo. Lui non le ha neanche usate! Mi può devolvere i soldi?"
    errors: [false-friend]
  - tutor: "Possiamo restituire i soldi o darle un paio nuovo, come preferisce."
    recast: {text: "devolvere i soldi", fix: "restituire i soldi", tags: [false-friend]}
    goals: [request]
  - learner: "Preferisco un paio nuovo, ma dello stesso modello."
  - tutor: "Ecco, gliele cambio subito."
    goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: en-f-professional
  history: [conditional-form]
  turns:
  - tutor: "Sì? Buonasera, posso aiutarla?"
  - learner: "Buonasera, sono Kate, la vicina del secondo piano."
  - tutor: "Ah, piacere! Mi dica."
    goals: [greet]
  - learner: "Ecco, la notte sento musica molto forte da casa vostra. Anche Lorenzo la sente."
  - tutor: "Davvero? Mi scusi. Ma chi è Lorenzo? Il signore del primo piano?"
    goals: [problem]
  - learner: "No, il mio compagno. Capisco che avete un figlio giovane, ma lavoriamo presto."
  - tutor: "Ha ragione, Tommaso suona fino a tardi."
  - learner: "Poteste abbassare il volume dopo le undici?"
    errors: [conditional-form]
  - tutor: "Poteste? Per una richiesta gentile, quale modo usiamo?"
    prompt: {text: "Poteste", tags: [conditional-form]}
  - learner: "Potreste abbassare il volume dopo le undici?"
  - tutor: "Certo, parlo con lui stasera. Mi scuso ancora."
    goals: [request]
  - learner: "Grazie, siete molto gentili. Il venerdì può tenere la musica fino a mezzanotte."
  - tutor: "Mi sembra giusto. Grazie a lei per la pazienza!"
    goals: [compromise]

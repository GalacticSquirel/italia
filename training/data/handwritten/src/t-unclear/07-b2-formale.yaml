# Set t-unclear, file 7: B2 formal situations. Names the tutor does not know are asked about
# (no correction), «voi» to a planner couple is fine; real errors get specific clues.
- scenario: assicurazione-sinistro
  level: B2
  persona: en-f-professional
  history: [passive]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Ieri ero ferma al semaforo e la mia macchina è stato colpita da dietro."
    errors: [passive]
  - tutor: "È stato colpita? Guardi l'accordo: di chi stiamo parlando, della macchina?"
    prompt: {text: "è stato colpita", tags: [passive]}
  - learner: "Sì, la macchina è stato colpita da un furgone."
    errors: [passive]
  - tutor: "Capisco: quindi la sua macchina è stata colpita mentre era ferma."
    recast: {text: "è stato colpita", fix: "è stata colpita", tags: [passive]}
    goals: [what]
  - learner: "Esatto. L'altro conducente l'ha ammesso subito: stava guardando il telefono."
  - tutor: "Bene, allora la responsabilità è chiaramente sua. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo firmata tutti e due, e ho già mandato le foto a Giulio."
  - tutor: "A Giulio? Mi scusi, chi è? Il suo agente?"
  - learner: "Sì, l'agente di Monza da cui ho fatto la polizza."
  - tutor: "Perfetto, allora i documenti ci arriveranno da lui."
    goals: [documents]
  - learner: "E adesso cosa succede? Quando passa il perito?"
  - tutor: "Entro una settimana la contatterà un perito per valutare il danno al paraurti."
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Vorrei chiedere la residenza: mi sono trasferito a Padova a marzo."
  - tutor: "Bene. Ha con sé il modulo compilato e il contratto d'affitto?"
    goals: [request]
  - learner: "Il modulo sì. Il contratto è a nome di Bassi."
  - tutor: "Di Bassi? Mi scusi, chi è? Il proprietario?"
  - learner: "No, il mio coinquilino: la casa è sua, io pago solo la renta."
    errors: [word-choice]
  - tutor: "Capisco. Se lei paga l'affitto a lui, ci serve una sua dichiarazione firmata."
    recast: {text: "la renta", fix: "l'affitto", tags: [word-choice]}
    goals: [documents]
  - learner: "Ah, non lo sapevo. Posso portarla domani?"
  - tutor: "Certo, può mandarla anche per email, con la copia del suo documento."
    goals: [problem]
  - learner: "Perfetto. E dopo, quanto tempo ci vuole?"
  - tutor: "Entro quarantacinque giorni passano i vigili per verificare che lei abiti lì."
    goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-heritage
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Daniel Russo, ho trentadue anni e sono grafico. Attualmente lavoro in un'agenzia a Torino."
  - tutor: "Bene. E prima di quell'agenzia?"
    goals: [intro]
  - learner: "Ho lavorato tre anni con Marta Riva."
  - tutor: "Con Marta Riva? Mi scusi, chi è?"
  - learner: "Un'illustratrice abbastanza nota, ha uno studio a Milano. Lì ho seguito progetti per diversi editori."
  - tutor: "Interessante. Quali sono i suoi punti di forza? E un punto debole?"
    goals: [experience]
  - learner: "Sono preciso e lavoro bene in squadra. Il mio difetto è che a volte sono troppo perfezionista."
  - tutor: "Capisco. Perché vorrebbe lavorare da noi?"
    goals: [strengths]
  - learner: "Mi piacciono molto i vostri progetti. Eventualmente vorrei coordinare una piccola squadra."
    errors: [false-friend]
  - tutor: "Col tempo, quindi, vorrebbe guidare un gruppo di lavoro: da noi è possibile."
    recast: {text: "Eventualmente", fix: "Col tempo", tags: [false-friend]}
    goals: [why]
  - learner: "Che cosa vi aspettate, nei primi mesi, dalla persona che sceglierete?"
  - tutor: "Che impari presto i nostri metodi e porti idee nuove."
    goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Quest'anno il progetto con i belgi è andato molto bene."
  - tutor: "Con i belgi? Intende il cliente di Anversa?"
  - learner: "Esatto. Abbiamo superato gli obiettivi del venti per cento."
  - tutor: "Lo so, ottimo lavoro. Quindi?"
    goals: [results]
  - learner: "Quindi vorrei chiederle una promozione. È importante che l'azienda riconosce il mio lavoro."
    errors: [subjunctive-use]
  - tutor: "Che l'azienda riconosce? Dopo «è importante che», quale modo serve?"
    prompt: {text: "riconosce", tags: [subjunctive-use]}
  - learner: "È importante che l'azienda riconosca il mio lavoro."
  - tutor: "Sono d'accordo, ma quest'anno il budget è molto limitato."
    goals: [request]
  - learner: "Capisco. Allora potremmo cominciare con più responsabilità e rivedere lo stipendio a giugno."
  - tutor: "Mi sembra una proposta ragionevole."
    goals: [handle]
  - learner: "Possiamo metterlo per iscritto?"
  - tutor: "Certo, le scrivo entro venerdì e ne parliamo di nuovo a giugno."
    goals: [next-steps]

- scenario: medico-specialista
  level: B2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Abbastanza bene, ma due volte, mentre ho fatto le scale, ho sentito il cuore battere fortissimo."
    errors: [tense-aspect]
  - tutor: "Mentre ho fatto le scale? L'azione era in corso: quale tempo serve?"
    prompt: {text: "mentre ho fatto le scale", tags: [tense-aspect]}
  - learner: "Sì, mentre facevo le scale. Poi mi sono seduto ed è passato tutto."
  - tutor: "Capisco. Quanto è durato, più o meno?"
    goals: [symptoms]
  - learner: "Un paio di minuti. Il dottor Gatti dice che è lo stress."
  - tutor: "Il dottor Gatti? È il suo medico di base?"
  - learner: "Sì. Comunque in famiglia mio padre e mio zio hanno avuto problemi di pressione."
  - tutor: "È importante saperlo. Gli esami infatti mostrano una pressione un po' alta."
    goals: [history]
  - learner: "È grave? Cosa significa esattamente?"
  - tutor: "Non è grave, ma va tenuta sotto controllo."
    goals: [understand]
  - learner: "Dovrò prendere delle medicine? Ci sono effetti collaterali?"
  - tutor: "Sì, una pastiglia al giorno. All'inizio forse si sentirà un po' stanco."
    goals: [treatment]
    new: [{lemma: pastiglia, gloss: tablet}]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-student
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo in campagna, come il matrimonio di Emma."
  - tutor: "Di Emma? È una coppia che abbiamo seguito noi?"
  - learner: "Sì, Emma e Paolo, a maggio. Ci hanno detto che voi due siete bravissimi."
  - tutor: "Che gentili! Io e mio marito ce li ricordiamo bene. Quindi un matrimonio all'aperto?"
    goals: [vision]
  - learner: "Esatto, per circa ottanta invitati. Abbiamo un budget di ventimila euro."
  - tutor: "È un buon budget. Ho due location: una villa sul lago e una casa in campagna."
    goals: [budget]
  - learner: "La casa in campagna ci piace di più, è più semplice. Le foto, ce li potete mandare stasera?"
    errors: [combined-pronouns]
  - tutor: "Ce li? Parliamo delle foto: maschile o femminile?"
    prompt: {text: "ce li", tags: [combined-pronouns]}
  - learner: "Ce le potete mandare stasera?"
  - tutor: "Certo, ve le mandiamo entro le sette."
    goals: [choices]
  - learner: "Un'ultima cosa: il menù vorremmo assaggiarlo prima di firmare."
  - tutor: "Ma certo, organizziamo una prova del menù per voi due."
    goals: [conditions]

- scenario: recensione-ristorante
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Sì, purtroppo. Abbiamo aspettato quasi un'ora per i secondi."
  - tutor: "Mi dispiace moltissimo. Cosa avevate ordinato?"
    goals: [complain]
  - learner: "Il branzino e la tagliata. Ne ho già parlato con Luigi."
  - tutor: "Con Luigi? Intende il cameriere con gli occhiali?"
  - learner: "Sì, lui. La tagliata era fredda e il branzino troppo cotto. Sinceramente, sono molto molesta."
    errors: [false-friend]
  - tutor: "Capisco che sia molto infastidita, e ha ragione."
    recast: {text: "molto molesta", fix: "molto infastidita", tags: [false-friend]}
    goals: [detail]
    new: [{lemma: infastidito, gloss: annoyed}]
  - learner: "Mi aspettavo che in un ristorante così il servizio fosse più attento."
  - tutor: "È giusto, stasera non siamo stati all'altezza. Vorrei offrirvi i secondi e il dolce."
    goals: [expectation]
  - learner: "Va bene, accetto volentieri. Grazie."
  - tutor: "Grazie a lei, e spero di rivedervi presto."
    goals: [resolve]

- scenario: trattativa-affitto
  level: B2
  persona: en-m-traveller
  history: [hypothetical]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, ma il canone mi sembra un po' alto per la zona."
  - tutor: "Capisco. Il proprietario è disposto a trattare, entro certi limiti."
    goals: [interest]
  - learner: "Se abbassereste il canone a novecento, firmerei subito."
    errors: [hypothetical]
  - tutor: "Se abbassereste? Dopo «se», in questo tipo di frase, il condizionale va bene?"
    prompt: {text: "abbassereste", tags: [hypothetical]}
  - learner: "Se abbassaste il canone a novecento, firmerei subito."
  - tutor: "Novecento è difficile; novecentocinquanta forse sì."
    goals: [negotiate]
  - learner: "Va bene, ma prima devo sentire Sophie."
  - tutor: "Sophie? È la persona che vivrà con lei?"
  - learner: "Sì, la mia compagna. E il contratto quanto dura? Con quanto preavviso posso dare disdetta?"
  - tutor: "È un quattro più quattro, con sei mesi di preavviso."
    goals: [conditions]
  - learner: "Perfetto. Ne parlo con lei stasera e le do una risposta domani."
  - tutor: "D'accordo, aspetto la sua chiamata."
    goals: [conclude]

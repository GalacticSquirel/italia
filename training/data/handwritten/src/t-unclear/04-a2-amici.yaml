# Set t-unclear, file 4: A2 friends and family. «Andiamo alle otto?», «Ciao Chiara!», «E voi?»
# to a friend's couple and names the tutor does not know are fine; real errors get clues.
- scenario: compleanno
  level: A2
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo la festa sabato, a casa mia?"
  - tutor: "Sì, perfetto! A che ora?"
    goals: [date]
  - learner: "Sabato, alle otto."
  - tutor: "Va bene. Chi invitiamo?"
  - learner: "I suoi colleghi e Luca, naturalmente."
  - tutor: "Quale Luca? Suo fratello o il ragazzo della palestra?"
  - learner: "Il fratello! E anche la sua ragazza."
  - tutor: "Ottimo, allora siamo in quindici."
    goals: [guests]
  - learner: "Io faccio la torta al cioccolato."
  - tutor: "Brava! Io porto la pizza e da bere."
    goals: [food]
  - learner: "E il regalo? Lo regaliamo una borsa?"
    errors: [object-pronoun]
  - tutor: "Lo regaliamo? La borsa è per Sara: quale pronome usiamo per «a lei»?"
    prompt: {text: "Lo regaliamo", tags: [object-pronoun]}
  - learner: "Sì, lo regaliamo una borsa rossa."
    errors: [object-pronoun]
  - tutor: "Le regaliamo una borsa rossa? Sì, ottima idea, il rosso le sta benissimo!"
    recast: {text: "lo regaliamo", fix: "Le regaliamo", tags: [object-pronoun]}
    goals: [gift]

- scenario: cucina-ricetta
  level: A2
  persona: en-m-heritage
  history: [imperative-form]
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  - learner: "La pasta alla genovese. È la ricetta di nonna Pina."
  - tutor: "Di nonna Pina? È tua nonna?"
  - learner: "No, la nonna del mio amico Rocco. Servono cipolle, carne, olio e sale."
  - tutor: "Ah, ho capito! Ho tutto, anche la carne."
    goals: [ingredients]
  - learner: "Tu taglia le cipolle. Io metto la carne nella pentola con l'olio."
  - tutor: "Va bene, comincio subito. Quanto tempo deve cuocere?"
    goals: [steps]
  - learner: "Tre ore, piano piano. Ma non apre la pentola!"
    errors: [imperative-form]
  - tutor: "Non apre? Lo dici a me: con «non» e il «tu», che forma usi?"
    prompt: {text: "non apre", tags: [imperative-form]}
  - learner: "Non aprire la pentola!"
  - tutor: "Va bene, non la apro! Tre ore, allora."
    goals: [time]
  - learner: "Poi mettiamo il sugo sulla pasta, con tanto formaggio."
  - tutor: "Che fame! Allora io preparo la tavola."
    goals: [serve]

- scenario: ricordi-infanzia
  level: A2
  persona: en-f-student
  history: [imperfetto-form]
  turns:
  - tutor: "Che bello qui! Tu dove abitavi da piccola?"
  - learner: "In una casa gialla, vicino al fiume. Eccola!"
  - tutor: "Che carina! Chi abitava con te?"
    goals: [place]
  - learner: "Io, i miei genitori e Biscotto."
  - tutor: "Biscotto? Chi era, un cane?"
  - learner: "Un gatto! Era grasso e dormiva tutto il giorno."
  - tutor: "Che nome perfetto! E cosa facevi d'estate?"
  - learner: "Con mio fratello erevamo sempre fuori, al fiume."
    errors: [imperfetto-form]
  - tutor: "Erevamo? Pensa a «essere»: io ero, tu eri, noi...?"
    prompt: {text: "erevamo", tags: [imperfetto-form]}
  - learner: "Eravamo sempre fuori!"
  - tutor: "Che bello! E la scuola dov'era?"
    goals: [habits]
  - learner: "Là, dietro la chiesa. La mia maestra era molto severa."
  - tutor: "Anche la mia! Hai un ricordo speciale?"
    goals: [school]
  - learner: "Sì, una volta io e mio fratello siamo caduti nel fiume!"
  - tutor: "Davvero? Che paura! E cosa ha detto la mamma?"
    goals: [event]

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [comparative]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  - learner: "Sì! Andiamo al cinema?"
  - tutor: "Bella idea! Che film ti piacciono?"
    goals: [propose]
  - learner: "Per me le commedie sono più divertenti che i film d'azione."
    errors: [comparative]
  - tutor: "Più divertenti che i film? Con due nomi, quale parola usi dopo «più divertenti»?"
    prompt: {text: "che i film d'azione", tags: [comparative]}
  - learner: "Più divertenti dei film d'azione!"
  - tutor: "Anche per me! C'è una commedia nuova alle otto e alle dieci."
    goals: [genre]
  - learner: "Andiamo alle otto?"
  - tutor: "Sì, alle otto. Viene anche Pietro, va bene?"
    goals: [choose]
  - learner: "Certo! Vi aspetto davanti al cinema alle otto meno un quarto."
  - tutor: "Perfetto, a stasera!"
    goals: [meet]

- scenario: vacanze-passate
  level: A2
  persona: es-m-worker
  history: [participle-agreement]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Io e mia moglie siamo stato in Sardegna, con i Ferrari."
    errors: [participle-agreement]
  - tutor: "Siamo stato? Eravate in tanti: come cambia «stato»?"
    prompt: {text: "siamo stato", tags: [participle-agreement]}
  - learner: "Siamo stati in Sardegna!"
  - tutor: "Che bello! E chi sono i Ferrari?"
    goals: [where]
  - learner: "I nostri vicini. Hanno una casa vicino al mare."
  - tutor: "Che fortuna! Che tempo faceva?"
  - learner: "Sole tutti i giorni, ma tanto vento."
  - tutor: "E cosa avete fatto?"
    goals: [weather]
  - learner: "Abbiamo fatto il bagno e abbiamo mangiato tanto pesce."
  - tutor: "Buonissimo! Cosa ti è piaciuto di più?"
    goals: [activities]
  - learner: "Le spiagge. L'acqua era come una piscina!"
  - tutor: "Che bello! Io quest'anno sono rimasta in città."
    goals: [best]

- scenario: weekend-scorso
  level: A2
  persona: en-f-professional
  history: [past-participle-form]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Ciao Chiara! Bene, dai. Sono andata a Verona."
  - tutor: "A Verona! Cosa hai fatto di bello?"
    goals: [where]
  - learner: "Ho vedito l'Arena e un concerto."
    errors: [past-participle-form]
  - tutor: "Ho vedito? Attenzione, vedere ha una forma speciale."
    prompt: {text: "vedito", tags: [past-participle-form]}
  - learner: "Ho visto l'Arena!"
  - tutor: "Che fortuna! Eri da sola?"
    goals: [what]
  - learner: "No, con Kate e Jim."
  - tutor: "Kate e Jim? Sono amici inglesi?"
  - learner: "Sì, sono in Italia per una settimana."
  - tutor: "Che bello! E ti è piaciuta Verona?"
    goals: [with-who]
  - learner: "Moltissimo! E voi cosa avete fatto?"
  - tutor: "Io e Davide siamo rimasti a casa con i bambini. Tranquilli!"
    goals: [opinion]

- scenario: famiglia
  level: A2
  persona: es-f-teacher
  history: [possessive]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questa è la mia sorella, Carmen, con suo marito."
    errors: [possessive]
  - tutor: "La mia sorella? Con sorella, fratello o madre al singolare, cosa cambia?"
    prompt: {text: "la mia sorella", tags: [possessive]}
  - learner: "Mia sorella Carmen!"
  - tutor: "Che bella! E la bambina?"
    goals: [who]
  - learner: "È la Nena. Ha sei anni."
  - tutor: "La Nena? È tua nipote?"
  - learner: "Sì, la figlia di Carmen. Nena è un soprannome."
  - tutor: "Che carina! Com'è?"
    goals: [ages]
  - learner: "È molto vivace e parla sempre. È come sua madre!"
  - tutor: "Ah ah, allora anche tua sorella parla tanto!"
    goals: [describe]
  - learner: "Sì! E tu, hai nipoti?"
  - tutor: "Sì, due, i figli di mio fratello."
    goals: [ask]

- scenario: palestra
  level: A2
  persona: en-m-retired
  history: [question-form]
  turns:
  - tutor: "Ciao! Vuoi informazioni sull'abbonamento?"
  - learner: "Sì, grazie. Quanto l'abbonamento costa al mese?"
    errors: [question-form]
  - tutor: "Quanto l'abbonamento costa? In una domanda, dove mettiamo il verbo?"
    prompt: {text: "Quanto l'abbonamento costa", tags: [question-form]}
  - learner: "Quanto costa l'abbonamento al mese?"
  - tutor: "Quaranta euro al mese, o cento per tre mesi."
    goals: [ask-membership]
  - learner: "Ugo dice che c'è un corso di yoga."
  - tutor: "Ugo? Chi è, uno dei nostri clienti?"
  - learner: "Sì, Ugo Ferri, il mio vicino. Viene qui la mattina."
  - tutor: "Ah, Ugo! Sì, c'è yoga il martedì e il giovedì."
    goals: [classes]
  - learner: "A che ora?"
  - tutor: "Alle sette di sera."
    goals: [timetable]
  - learner: "Perfetto. Faccio l'abbonamento di tre mesi."
  - tutor: "Ottimo! Mi dai un documento?"
    goals: [sign-up]

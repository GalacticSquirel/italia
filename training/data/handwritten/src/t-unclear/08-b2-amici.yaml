# Set t-unclear, file 8: B2 informal talk. Casual «credo che è», «Che ne so», «voi» to a friend's
# couple, team or club, and unknown names are fine; real errors get specific clues.
- scenario: arte-mostra
  level: B2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi colpisce subito: è inquietante, ma bellissimo."
  - tutor: "Anche a me. Cosa vedi, esattamente?"
    goals: [react]
  - learner: "Una donna sola in una stanza vuota. Sembra che la luce viene da una finestra che non vediamo."
    errors: [subjunctive-use]
  - tutor: "Sembra che la luce viene? Dopo «sembra che», quale modo usiamo?"
    prompt: {text: "viene", tags: [subjunctive-use]}
  - learner: "Sì, sembra che viene da fuori, da sinistra."
    errors: [subjunctive-use]
  - tutor: "Esatto, sembra che venga da sinistra, fuori dal quadro: è una scelta voluta del pittore."
    recast: {text: "viene", fix: "venga", tags: [subjunctive-use]}
    goals: [describe]
  - learner: "Forse la donna aspetta qualcuno che non arriverà mai."
  - tutor: "Bella lettura. Lo pensano in tanti, sai."
    goals: [interpret]
  - learner: "Mi ricorda il quadro che ha comprato Pietro."
  - tutor: "Pietro? Quale Pietro, tuo cugino?"
  - learner: "Sì! Ha una stampa di Hopper in salotto: stessa solitudine, stessa luce."
  - tutor: "Hai ragione, con Hopper c'è proprio un legame."
    goals: [compare]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Secondo me, invece, sarebbe un'ottima idea. Il traffico in centro è insopportabile."
  - tutor: "Ma i clienti? Senza macchina non verranno più."
    goals: [position]
  - learner: "Non sono d'accordo. Nelle città con zone pedonali i negozi vendono di più, e c'è meno inquinamento."
  - tutor: "Sarà, ma chi abita lontano come arriva in centro?"
    goals: [argue]
  - learner: "Come ha detto prima la signora Melis, bisogna di pensare ai parcheggi."
    errors: [modal-infinitive]
  - tutor: "Bisogna di pensare? Dopo «bisogna», l'infinito ha bisogno di una preposizione?"
    prompt: {text: "bisogna di pensare", tags: [modal-infinitive]}
  - learner: "Bisogna pensare ai parcheggi fuori dal centro."
  - tutor: "La signora Melis? Scusi, sono arrivato tardi: che cosa ha proposto?"
  - learner: "Parcheggi gratuiti fuori dal centro e più autobus. Così anche chi abita lontano può arrivare."
  - tutor: "Se funzionassero davvero, forse. Ma ho i miei dubbi."
    goals: [counter]
  - learner: "Però ammetto che i commercianti di cui negozi sono lontani dagli autobus hanno ragione a preoccuparsi."
    errors: [relative-pronoun]
  - tutor: "Di cui negozi? Per dire «i negozi dei commercianti», quale forma serve al posto di «di cui»?"
    prompt: {text: "di cui negozi", tags: [relative-pronoun]}
  - learner: "Sì, i commercianti di cui negozi sono lontani."
    errors: [relative-pronoun]
  - tutor: "Ecco, i commercianti i cui negozi sono lontani sono proprio quelli che mi preoccupano."
    recast: {text: "di cui negozi", fix: "i cui negozi", tags: [relative-pronoun]}
  - learner: "Allora potremmo chiudere il centro solo la domenica, per cominciare."
  - tutor: "Questa è una proposta che potrei accettare."
    goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-m-heritage
  history: [comparative]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Inizio io! Ho letto «Il treno dei bambini». Me l'ha consigliato Ada."
  - tutor: "Ada? È qualcuno del nostro gruppo?"
  - learner: "No, la mia vicina, legge tantissimo. Parla di un bambino di Napoli che dopo la guerra va a vivere al Nord."
  - tutor: "Che bella storia. Com'è il personaggio principale?"
    goals: [summary]
  - learner: "Amerigo è curioso e sensibile. Lui e sua madre hanno sempre un argomento."
    errors: [false-friend]
  - tutor: "Hanno sempre una discussione? Allora il rapporto con la madre dev'essere centrale."
    recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
    goals: [characters]
  - learner: "Sì, è il cuore del libro. Per me è più commovente che il primo romanzo dell'autrice."
    errors: [comparative]
  - tutor: "Più commovente che il primo romanzo? Quando confronti due nomi, quale parola segue «più commovente»?"
    prompt: {text: "che il primo romanzo", tags: [comparative]}
  - learner: "Più commovente del primo romanzo, perché il finale ti fa pensare per giorni."
  - tutor: "Adesso voglio leggerlo anch'io. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "A tutti voi! Ma soprattutto a chi ama le storie di famiglia."
  - tutor: "Allora lo mettiamo nella lista del mese prossimo!"
    goals: [recommend]

- scenario: politica-lavoro
  level: B2
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Mah, io credo che è un'esagerazione. Alcuni lavori cambieranno, non spariranno."
  - tutor: "Dici? Guarda le casse nei supermercati: ormai fai tutto da solo."
    goals: [opinion]
  - learner: "Sì, ma guarda Ilaria."
  - tutor: "Ilaria? Scusa, chi è?"
  - learner: "La mia coinquilina. Faceva la traduttrice, ora controlla i testi tradotti dalle macchine."
  - tutor: "Ecco, appunto: scommetto che guadagna meno."
    goals: [example]
  - learner: "Un po' meno, sì. Ma se lo stato investirebbe nella formazione, tante persone troverebbero un lavoro nuovo."
    errors: [hypothetical]
  - tutor: "Se lo stato investirebbe? Dopo «se», in questa frase, quale modo ci vuole?"
    prompt: {text: "investirebbe", tags: [hypothetical]}
  - learner: "Sì, se lo stato investirebbe di più, cambierebbe tutto."
    errors: [hypothetical]
  - tutor: "Eh, se lo stato investisse davvero nella formazione, forse avresti ragione."
    recast: {text: "investirebbe", fix: "investisse", tags: [hypothetical]}
    goals: [hypothesis]
  - learner: "Insomma, per me il rischio c'è, ma ci sono anche tante opportunità. E tu, sei davvero così pessimista?"
  - tutor: "Diciamo che guardo i fatti! Però mi hai fatto pensare."
    goals: [conclude]

- scenario: smartworking
  level: B2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tre giorni a casa e due in ufficio. Che ne so, dipende dalle settimane."
  - tutor: "Ah, un po' e un po'. E ti trovi bene?"
    goals: [situation]
  - learner: "Sì: lavorare a casa è meno stressante che andare in ufficio, e non perdo un'ora in macchina."
  - tutor: "Ti capisco. E gli svantaggi?"
    goals: [pros]
  - learner: "Mi mancano i colleghi, e a volte lavoro fino alle nove di sera."
  - tutor: "Succede anche a me e a Giulia."
    goals: [cons]
  - learner: "Ma voi due come fate a lavorare nella stessa casa?"
  - tutor: "Lei in cucina, io in camera, con la porta chiusa!"
  - learner: "Ah ah! Comunque io preferirei che l'azienda mi lascia scegliere i giorni."
    errors: [subjunctive-use]
  - tutor: "Preferirei che mi lascia? Dopo un condizionale come «preferirei che», quale congiuntivo usiamo?"
    prompt: {text: "lascia", tags: [subjunctive-use]}
  - learner: "Sì, preferirei che l'azienda mi lasci scegliere i giorni."
    errors: [subjunctive-use]
  - tutor: "Eh, magari l'azienda lasciasse scegliere a tutti! Sarebbe molto più flessibile."
    recast: {text: "lasci", fix: "lasciasse", tags: [subjunctive-use]}
    goals: [preference]

- scenario: vita-in-italia
  level: B2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Per amore, ovviamente! Ho conosciuto Chiara a Londra e l'ho seguita a Bologna."
  - tutor: "Che romantico! E all'inizio com'è stato?"
    goals: [story]
  - learner: "Difficile. Quando sono arrivato, Chiara già trovava un lavoro, io invece no."
    errors: [tense-aspect]
  - tutor: "Già trovava? Prima del suo arrivo l'aveva già trovato: quale tempo usiamo?"
    prompt: {text: "già trovava", tags: [tense-aspect]}
  - learner: "Chiara aveva già trovato un lavoro. Io passavo ore in libreria a studiare italiano."
    errors: [false-friend]
  - tutor: "Studiava in biblioteca, immagino, con i libri di grammatica! Qual è stata la cosa più difficile?"
    recast: {text: "in libreria", fix: "in biblioteca", tags: [false-friend]}
  - learner: "La burocrazia, senza dubbio. Per fortuna c'era Mimmo."
  - tutor: "Mimmo? Racconti ai nostri ascoltatori chi è."
  - learner: "Il padre di Chiara. Conosceva tutti in comune e mi accompagnava agli sportelli."
  - tutor: "Un suocero prezioso! E lei come è cambiato in questi anni?"
    goals: [difficulties]
  - learner: "Sono più paziente, e a pranzo non mangio mai un panino davanti al computer."
  - tutor: "Una vera trasformazione! Che consiglio darebbe a chi vuole trasferirsi?"
    goals: [change]
  - learner: "Di imparare la lingua prima di partire e di non avere fretta."
  - tutor: "Un consiglio prezioso. Grazie per essere stato con noi!"
    goals: [advice]

- scenario: affittare-appartamento
  level: B2
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno! È più grande di come sembrava nelle foto. L'affitto comprende le spese?"
  - tutor: "No, io e mio marito chiediamo ottocento euro, più cento di spese di condominio."
    goals: [rent]
  - learner: "Capisco. Il riscaldamento è centralizzato? E il bagno ha la ducha?"
    errors: [word-choice]
  - tutor: "Sì, centralizzato, e la doccia è nuova: l'abbiamo cambiata l'anno scorso."
    recast: {text: "la ducha", fix: "la doccia", tags: [word-choice]}
    goals: [condition]
  - learner: "Perfetto. Paola dice che la zona di notte è un po' rumorosa."
  - tutor: "Paola? È una sua amica che abita qui vicino?"
  - learner: "Sì, abita nella via accanto. Dice che il sabato c'è molta gente in giro."
  - tutor: "Il sabato un po', ma la camera dà sul cortile ed è molto tranquilla."
    goals: [neighbourhood]
  - learner: "Meno male. E per il contratto, quanto volete di caparra?"
  - tutor: "Due mesi, e il contratto è di quattro anni. Abbiamo anche due posti auto: ne vuole uno?"
    goals: [contract]
  - learner: "Sì, voglio uno, per la mia moto."
    errors: [ci-ne]
  - tutor: "Voglio uno? Uno dei posti auto: quale pronome mettiamo davanti al verbo?"
    prompt: {text: "voglio uno", tags: [ci-ne]}
  - learner: "Ne voglio uno, sì."
  - tutor: "Perfetto, sono cinquanta euro al mese in più."
  - learner: "Mi interessa molto. Vi chiamo entro domani, va bene?"
  - tutor: "Benissimo, aspettiamo la sua telefonata."
    goals: [decide]

- scenario: riunione-lavoro
  level: B2
  persona: es-m-worker
  history: [participle-agreement]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene: l'app è quasi pronta, mancano i test."
  - tutor: "Ottimo. Ci sono problemi?"
    goals: [update]
  - learner: "Sì, uno grosso: Rubén non ci ha ancora mandato i dati dei clienti."
  - tutor: "Rubén? Scusa, chi è?"
  - learner: "Il responsabile informatico del cliente. Gli ho chiesto i dati tre volte, ma non li ha mai mandato."
    errors: [participle-agreement]
  - tutor: "Non li ha mai mandato? Con «li» davanti, «mandato» cambia: come?"
    prompt: {text: "li ha mai mandato", tags: [participle-agreement]}
  - learner: "Non li ha mai mandati. Senza quei dati siamo in ritardo."
  - tutor: "Capisco. Che cosa proponi?"
    goals: [problem]
  - learner: "Propongo di contrattare un'altra persona per due mesi, così recuperiamo il tempo."
    errors: [false-friend]
  - tutor: "Assumere un'altra persona? Possiamo valutarlo, ma intanto scrivo io a Rubén."
    recast: {text: "contrattare un'altra persona", fix: "Assumere un'altra persona", tags: [false-friend]}
    goals: [proposal]
  - learner: "Va bene. Voi siete d'accordo se spostiamo la consegna al venti?"
  - tutor: "Sì, il venti va bene a tutti. Lo comunico io al cliente."
    goals: [deadline]

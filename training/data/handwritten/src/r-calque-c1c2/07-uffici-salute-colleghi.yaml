      goals: [what]
    - learner: "L'altra macchina. Io ero fermo, con il motore spento, e stavo caricando la spesa nel bagagliaio. Il conducente ha ammesso subito di non avermi visto."
    - tutor: "Allora la responsabilità sembra chiara. Avete compilato insieme il modulo di constatazione amichevole?"
      goals: [responsibility]
    - learner: "Sì, l'abbiamo firmato tutti e due. Però il conducente ha scritto male il numero di polizza; per fortuna ho fotografato la targa e anche la sua licenza di guida."

- scenario: mediazione-colleghi
  # facts: ieri la team leader era collegata da Roma; Marco ha presentato al direttore l'analisi dei dati sui clienti come sua; la collega ci ha lavorato tre settimane, la sera, raccogliendo e pulendo i dati e scrivendo le conclusioni; Marco aveva preparato i grafici e ci ha passato anche lui molte serate; soluzione: incontro a tre domani alle nove, email della team leader al direttore, la collega farà la presentazione dei dati alla prossima riunione
  level: C1
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    # decoy: «è successo» means «happened», its correct sense
    - learner: "Si accomodi, ha fatto bene a venire. Mi racconti con calma che cosa è successo, dal suo punto di vista: ieri ero collegata da Roma e ho seguito solo una parte della riunione."
    - tutor: "Marco ha presentato al direttore l'analisi dei dati sui clienti come se l'avesse fatta da solo. Io ci ho lavorato tre settimane, la sera, e non mi ha nemmeno nominata."
    - learner: "Capisco perfettamente come si sente, e le esprimo tutta la mia simpatia: lavorare tre settimane la sera e poi non essere nominata è davvero frustrante."
      errors: [false-friend]
    - tutor: "La ringrazio della comprensione, davvero. Ma non mi basta: voglio che il direttore sappia chi ha fatto il lavoro."
      recast: {text: "simpatia", fix: "comprensione", tags: [false-friend]}
      goals: [listen]
    - learner: "È giusto che lo sappia. Prima, però, vorrei capire una cosa: Marco aveva partecipato in qualche modo all'analisi, o il lavoro era interamente suo?"
    - tutor: "Aveva preparato i grafici, lo ammetto, ma i dati li ho raccolti e puliti io, e le conclusioni le ho scritte io. Lui ha messo il suo nome sulla prima pagina."
      goals: [clarify]
    - learner: "Non voglio sminuire il suo lavoro. Conosco però Marco da anni, e so che anche lui ha messo dentro molte serate su quel progetto, anche se su una parte diversa dalla sua."
      errors: [word-choice]
    # agree: content
    - tutor: "Se anche lui ha passato molte serate sui grafici, non lo sapevo, e glielo riconosco. Ma questo non gli dà il diritto di prendersi tutto il merito."
      recast: {text: "ha messo dentro molte serate", fix: "ha passato molte serate", tags: [word-choice]}
      goals: [perspective]
    - learner: "Su questo ha perfettamente ragione. Le propongo di parlarne tutti e tre insieme domani mattina, e poi di scrivere io al direttore per precisare chi ha fatto che cosa."
    - tutor: "Una sua email al direttore sarebbe già molto. Ma Marco accetterà di sedersi con me?"
    - learner: "Gli parlo io oggi pomeriggio. E alla prossima riunione con il direttore, vorrei che fosse lei a dare la presentazione dei dati, visto che li conosce meglio di chiunque."
      errors: [word-choice]
    - tutor: "Fare la presentazione dei dati davanti al direttore: non me l'aspettavo, e mi fa piacere. Allora domani alle nove, tutti e tre."
      recast: {text: "dare la presentazione dei dati", fix: "fare la presentazione dei dati", tags: [word-choice]}
      goals: [solution]

- scenario: medico-specialista
  # facts: il paziente si stanca salendo le scale da circa un mese, si ferma al terzo piano; bruciore sotto lo sterno dopo cena, niente dolore; il padre ha avuto un infarto a sessant'anni, due parenti da parte di madre con la pressione alta; il paziente ha cinquantadue anni, fa il camionista, dieci ore al giorno alla guida; pressione centoquarantacinque su novanta, colesterolo sopra i limiti; tre mesi di dieta e mezz'ora di camminata veloce, poi eventuale farmaco; controllo in studio fra tre mesi
  level: C1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Buongiorno, dottore. Abbastanza bene, ma mi stanco molto quando salgo le scale: al terzo piano devo fermarmi a riprendere fiato, cosa che prima non mi succedeva."
    - tutor: "È un dato importante. Da quanto tempo le succede, e ha notato anche palpitazioni o dolore al petto?"
    - learner: "Da circa un mese. Dolore vero e proprio no, ma ogni tanto sento un ardore qui, sotto lo sterno, soprattutto dopo cena o quando mi sdraio."
      errors: [false-friend]
    - tutor: "Un bruciore sotto lo sterno dopo cena può venire anche dallo stomaco, ma lo teniamo presente. In famiglia ci sono stati problemi di cuore?"
      recast: {text: "un ardore", fix: "un bruciore", tags: [false-friend]}
      goals: [symptoms]
    # decoy: «parenti» means «relatives», its correct sense
    - learner: "Sì, mio padre ha avuto un infarto a sessant'anni, e anche due parenti da parte di madre hanno la pressione alta. Io ne ho cinquantadue."
    - tutor: "La familiarità conta. Gli esami mostrano una pressione un po' alta, centoquarantacinque su novanta, e il colesterolo sopra i limiti."
      goals: [history]
      new: [{lemma: familiarità, gloss: family history}, {lemma: colesterolo, gloss: cholesterol}]
    - learner: "Che cosa significano questi valori, in pratica? Devo preoccuparmi, o posso aspettare il prossimo controllo e tornare nella sua consulta fra sei mesi?"
      errors: [false-friend]
    - tutor: "Preoccuparsi no, ma prenderli sul serio sì: con la sua familiarità il rischio aumenta. Non aspetterei sei mesi: la rivedo in studio fra tre."
      recast: {text: "consulta", fix: "studio", tags: [false-friend]}
      goals: [understand]
    - learner: "D'accordo. Mi dovrà dare dei farmaci, o possiamo provare prima con la dieta e un po' di movimento?"
    - tutor: "Proviamo per tre mesi con la dieta e mezz'ora di camminata veloce al giorno. Se i valori non scendono, le prescrivo un farmaco per la pressione."
    - learner: "E se dovessi prendere il farmaco, potrebbe affettare il mio lavoro? Faccio il camionista e passo dieci ore al giorno alla guida."
      errors: [false-friend]
    - tutor: "All'inizio alcuni farmaci danno un po' di stanchezza, quindi potrebbero condizionare la guida: in quel caso sceglieremmo il più adatto a chi guida molte ore. Ci vediamo fra tre mesi."
      recast: {text: "affettare", fix: "condizionare", tags: [false-friend]}
      goals: [treatment]

- scenario: burocrazia-residenza
  # facts: la learner è spagnola, a Torino da sei mesi; per i cittadini dell'Unione servono documento d'identità, codice fiscale e prova di risorse sufficienti; porta le ultime tre buste paga, lavora in una scuola di lingue da gennaio; vive in una stanza in subaffitto, contratto non registrato, solo una dichiarazione del proprietario; la polizia municipale verifica entro quarantacinque giorni senza avvisare; residenza valida dalla data della dichiarazione, poi silenzio-assenso; certificato allo sportello o online con l'identità digitale
  level: C1
  persona: es-f-erasmus
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono spagnola, vivo a Torino da sei mesi e vorrei registrarmi come residente. Mi hanno detto che devo fare tutto qui, all'anagrafe, giusto?"
    - tutor: "Sì, è il posto giusto. Per i cittadini dell'Unione servono un documento d'identità, il codice fiscale e una prova che ha risorse sufficienti, per esempio un contratto di lavoro."
      goals: [request]
    - learner: "Ho la carta d'identità e il codice fiscale. Come prova delle risorse ho portato le mie ultime tre nomine, perché lavoro in una scuola di lingue da gennaio."
      errors: [false-friend]
    - tutor: "Le buste paga vanno benissimo, insieme al contratto di lavoro. Ha anche un contratto d'affitto, o un'altra prova di dove abita?"
      recast: {text: "nomine", fix: "buste paga", tags: [false-friend]}
    # decoy: «attualmente» means «al momento», its correct sense
    - learner: "Qui c'è il problema: attualmente vivo in una stanza in subaffitto, e il proprietario non ha registrato il contratto. Ho solo una dichiarazione firmata da lui."
    - tutor: "La residenza dipende da dove vive davvero, non dal contratto: la polizia municipale verrà a verificarlo. La dichiarazione la alleghiamo comunque."

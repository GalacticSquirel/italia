      goals: [describe]
    - learner: "È comunale: c'è il cartello con lo stemma del Comune e la data di fine lavori, che era il 30 settembre. Che cosa succede, adesso, con una segnalazione urgente?"
    - tutor: "Una segnalazione urgente va alla polizia municipale e all'ufficio lavori pubblici in giornata. Per la ripresa del cantiere, però, non sono in grado di darle una data."
    - learner: "Capisco che la data non dipenda da lei. Ma se entro una settimana il cantiere resta in queste condizioni, sono pronta a mettere una denuncia ai carabinieri, a nome di tutti i genitori."

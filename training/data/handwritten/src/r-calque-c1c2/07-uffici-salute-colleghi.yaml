    - learner: "Una sola: eventualmente, posso avere un'auto sostitutiva durante la riparazione? Senza macchina non riesco ad accompagnare mia moglie alle visite in ospedale."
    - tutor: "Ho controllato la sua polizza: l'auto sostitutiva è prevista, fino a sette giorni. Le mando adesso il riepilogo per email."

- scenario: vita-in-italia
  # facts: la learner è inglese, arrivata a Bologna otto anni fa per un semestre di studio; il ragazzo di Modena ora è suo marito, hanno una bambina di due anni; abitano a Modena, lei fa la traduttrice per un'azienda di macchine agricole; i parenti vivono a Leeds, la bambina vede i nonni due volte l'anno; la conduttrice si è innamorata di Bologna da studentessa
  level: C1
  persona: en-f-student
  history: [word-choice, false-friend]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Ci racconta perché si è trasferita?"
    - learner: "Grazie dell'invito. Sono arrivata a Bologna otto anni fa per un semestre di studio, e quasi subito sono caduta innamorata della città, e anche di un ragazzo di Modena."

    - tutor: "Mi sono innamorata anch'io di Bologna, da studentessa: capita a molti. E il ragazzo di Modena che fine ha fatto?"
      recast: {text: "sono caduta innamorata", fix: "mi sono innamorata", tags: [word-choice]}
    # decoy: «i suoi parenti» means «relatives», its correct sense
    - learner: "Adesso è mio marito, e abbiamo una bambina di due anni, che i suoi parenti viziano moltissimo. Abitiamo a Modena, e io lavoro come traduttrice per un'azienda di macchine agricole."
    - tutor: "Una storia a lieto fine, allora. Qual è stata la cosa più difficile, all'inizio?"
      goals: [story]
    - learner: "La lontananza dalla famiglia, senza dubbio: i miei relativi vivono tutti a Leeds, e la bambina vede i nonni soltanto due volte l'anno."
      errors: [false-friend]
    - tutor: "I parenti lontani sono il prezzo più alto, ce lo dicono in tanti. E lei, in questi otto anni, com'è cambiata?"
      recast: {text: "relativi", fix: "parenti", tags: [false-friend]}
      goals: [difficulties]
    - learner: "Sono diventata più paziente e meno puntuale, il che non so se sia un bene. Ho imparato anche a dare importanza ai pranzi lunghi e alle chiacchiere senza scopo."
    - tutor: "Meno puntuale, ce lo confessa in diretta! Ma i pranzi lunghi li approviamo tutti. Che cosa le manca di più dell'Inghilterra?"
      goals: [change]
    - learner: "Mi mancano le librerie dell'usato, l'umorismo un po' asciutto e il tè fatto propriamente: qui i bar lo servono come se fosse una medicina."
      errors: [false-friend]
    # agree: content
    - tutor: "Un tè fatto come si deve, in un bar italiano, è un'impresa, lo ammetto. Ultima domanda: che consiglio darebbe a chi vuole trasferirsi qui?"
      recast: {text: "fatto propriamente", fix: "fatto come si deve", tags: [false-friend]}
    # decoy: «confrontare» means «paragonare», its correct sense
    - learner: "Gli direi di imparare la lingua sul serio, anche il dialetto della zona, e di non confrontare continuamente l'Italia con il proprio paese: si vive meglio quando si smette di fare paragoni."
    - tutor: "Un consiglio saggio, che vale anche per noi italiani all'estero. Grazie, e buona vita a Modena!"
      goals: [advice]

- scenario: reclamo-comune

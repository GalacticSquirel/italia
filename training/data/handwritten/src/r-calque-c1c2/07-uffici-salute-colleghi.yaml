      errors: [word-choice]
    - tutor: "Di solito passano entro quarantacinque giorni, ma non avvisano. Se lavora abbastanza lontano, metta il suo nome sul campanello e lasci il suo numero a un vicino."
      recast: {text: "bastante lontano", fix: "abbastanza lontano", tags: [word-choice]}
      goals: [problem]
    - learner: "Va bene, chiedo alla mia vicina, che è sempre a casa. E dopo il controllo devo tornare qui, o mi arriva qualcosa per posta?"
    - tutor: "Non deve tornare: se il controllo va bene, la residenza vale dalla data di oggi. Se dopo quarantacinque giorni nessuno l'ha contattata, vale il silenzio-assenso."
      goals: [next]
    - learner: "Perfetto. E quando potrò chiedere il certificato di residenza? Me lo potete spedire voi qui, direttamente allo sportello?"
      errors: [false-friend]
    - tutor: "Il certificato glielo possiamo rilasciare allo sportello, oppure lo scarica online con la sua identità digitale. Arrivederci, e benvenuta a Torino."
      recast: {text: "spedire", fix: "rilasciare", tags: [false-friend]}

- scenario: assicurazione-sinistro
  # facts: ieri pomeriggio in un parcheggio di Bergamo l'altra macchina, in retromarcia, ha urtato la portiera posteriore; il learner era fermo a motore spento, caricava la spesa; il conducente ha ammesso di non averlo visto; constatazione amichevole firmata da entrambi, numero di polizza scritto male; foto della targa e della patente dell'altro; il perito chiama entro tre giorni lavorativi; risarcimento di solito entro trenta giorni dalla perizia; auto sostitutiva prevista dalla polizza fino a sette giorni

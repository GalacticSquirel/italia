  level: C2
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Sono qui per presentare un reclamo formale: in via Mazzini, davanti alla scuola dove insegno, c'è un cantiere fermo da due mesi, recintato male, a due passi dall'ingresso dei bambini."
    - tutor: "Capisco la preoccupazione, soprattutto con i bambini. Mi può dire con precisione che cosa non va nella recinzione?"
    - learner: "Due pannelli della recinzione sono flosci e si muovono con il vento, e dietro ci sono un buco profondo e del materiale accatastato. Ieri un bambino ci è quasi entrato."

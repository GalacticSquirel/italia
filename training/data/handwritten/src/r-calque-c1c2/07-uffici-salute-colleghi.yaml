      goals: [insist]
    # decoy: «eventualmente» means «nel caso», its correct sense
    - learner: "D'accordo, lo protocolliamo subito. Mi spiega anche quali sono i tempi di risposta previsti, ed eventualmente a chi posso rivolgermi se il Comune non risponde?"
    - tutor: "Il Comune deve rispondere per iscritto entro trenta giorni. Se la risposta non arriva, può rivolgersi al difensore civico regionale, gratuitamente."
      goals: [rights]
    - learner: "Benissimo. Allora mi può dare una costanza del reclamo, con il numero di protocollo e la data di oggi, da mostrare agli altri genitori?"
      errors: [false-friend]
    - tutor: "Ecco una ricevuta del reclamo: protocollo numero 31185, con la data di oggi. La segnalazione urgente parte adesso."
      recast: {text: "una costanza del reclamo", fix: "una ricevuta del reclamo", tags: [false-friend]}
      goals: [commitment]


      goals: [documents]
    - learner: "Certo, gliele mando oggi stesso. Mi può dire se devo far vedere la macchina a un vostro perito, o se posso portarla direttamente dal mio carrozziere?"
    - tutor: "Prima deve vederla il perito: la chiameremo entro tre giorni lavorativi per fissare l'appuntamento. Dopo la perizia può andare dal carrozziere che preferisce."
      goals: [next]
    - learner: "E la compensazione? Quanto tempo ci vuole, di solito, perché mi rimborsiate la riparazione?"
      errors: [false-friend]
    - tutor: "Il risarcimento arriva di solito entro trenta giorni dalla perizia, se non ci sono contestazioni. Ha altre domande?"

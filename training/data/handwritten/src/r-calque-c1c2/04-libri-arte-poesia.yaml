# Set r-calque-c1c2, file 4: book clubs (a post-war family saga, Calvino's «Il barone rampante»),
# two exhibition visits and a Montale lesson. English and Spanish false friends («carattere» for
# «personaggio», «vaso» for «bicchiere», «effettivo» for «efficace», «grafico» for «crudo»).
- scenario: club-lettura
  # facts: romanzo su una famiglia che ricostruisce la sua fabbrica dopo la guerra; personaggio principale la nonna Adele; Adele vende la villa al mare, senza la vendita la fabbrica sarebbe fallita e duecento operai avrebbero perso il lavoro; il tutor avrebbe venduto i terreni; nei capitoli su Adele le frasi sono più corte; c'è un seguito ambientato negli anni Settanta, più debole
  level: C1
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    # decoy: «l'argomento» means «il tema» and «fabbrica» is the right word for a factory
    - learner: "Sì, l'ho finito domenica. Mi è piaciuto, anche se all'inizio ho fatto fatica: l'argomento, una famiglia che ricostruisce la sua fabbrica dopo la guerra, non mi attirava molto."
    - tutor: "E invece? Che cosa ti ha fatto cambiare idea, strada facendo?"
    - learner: "La scrittura, soprattutto. E poi il carattere principale, la nonna Adele, che tiene in piedi tutta la famiglia mentre gli uomini litigano per l'eredità."
      errors: [false-friend]
    - tutor: "Adele è il personaggio principale anche per me, altro che gli uomini. Secondo te, ha fatto bene a vendere la villa al mare?"
      recast: {text: "il carattere principale", fix: "il personaggio principale", tags: [false-friend]}
      goals: [impression]
    - learner: "Secondo me sì, anche se i figli non gliel'hanno mai perdonato. Se non l'avesse venduta, la fabbrica sarebbe fallita e duecento operai avrebbero perso il lavoro."
    - tutor: "Io invece avrei venduto i terreni, non la villa: era l'unico ricordo del marito. Non credi che abbia sacrificato troppo?"
      goals: [character]
    # decoy: «il suo carattere» means «temperament», its correct sense
    - learner: "Forse sì. Ho notato che nei capitoli su di lei le frasi diventano più corte, quasi secche, proprio come il suo carattere, ma l'autore non prende mai lati."
      errors: [word-choice]
    # agree: content
    - tutor: "Non l'avevo notato, ma è vero: nei suoi capitoli il ritmo cambia, e l'autore non si schiera mai. Ti è piaciuto lo stile, nel complesso?"
      recast: {text: "non prende mai lati", fix: "non si schiera mai", tags: [word-choice]}
    - learner: "Sì, tranne i dialoghi, che a volte sembrano finti. Tu sai se l'autore ha scritto altri romanzi sulla stessa famiglia?"
    - tutor: "Sì, c'è un seguito ambientato negli anni Settanta, ma l'ho trovato più debole. A chi lo consiglieresti, questo?"
      goals: [style]
    - learner: "A chi ama le saghe familiari, di sicuro. Mia madre, per esempio, dice sempre che non legge romanzi storici, ma attualmente li adora."
      errors: [false-friend]
    - tutor: "Se in realtà li adora, regalaglielo per Natale: con Adele vai sul sicuro. Il mese prossimo il libro lo scegli tu?"
      recast: {text: "attualmente li adora", fix: "in realtà li adora", tags: [false-friend]}
      goals: [recommend]

- scenario: club-lettura
  # facts: il learner ci ha messo tre settimane, ha disegnato un albero dei parenti su un foglio; Lucia, la figlia minore, resta incinta a diciassette anni e viene mandata dalle suore, poi torna per affrontare il padre; il tutor pensa che a Milano sarebbe stata più felice; finale sbrigativo; l'editore ha annunciato il secondo volume per la primavera, data non ancora nota; consigliato al padre del learner
  level: C1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho divorato in tre sere, ma qui c'è chi l'ha abbandonato a metà."
    # decoy: «parenti» means «relatives», its correct sense
    - learner: "Sì, ce l'ho fatta, ma mi ci sono volute tre settimane. Il romanzo mi è piaciuto, però mi perdevo spesso tra cugini e zii: ho dovuto disegnare un albero dei parenti su un foglio."
    - tutor: "Un albero genealogico su un foglio: lo dovrebbero stampare nel libro! Qual è il personaggio che ti ha colpito di più?"
      goals: [impression]
    - learner: "Lucia, la figlia minore, che resta imbarazzata a diciassette anni e viene mandata dalle suore, mentre il resto della famiglia fa finta di niente."
      errors: [false-friend]
    - tutor: "Lucia che resta incinta a diciassette anni, con la famiglia che tace: il capitolo più duro del libro. Che cosa pensi della sua scelta di tornare?"
      recast: {text: "resta imbarazzata", fix: "resta incinta", tags: [false-friend]}
    - learner: "Penso che sia stata coraggiosa. Avrebbe potuto rifarsi una vita a Milano, e invece è tornata per affrontare il padre; se non fosse tornata, il segreto sarebbe rimasto sepolto."
    - tutor: "Coraggiosa o testarda? Io continuo a pensare che a Milano sarebbe stata più felice. E lo stile, ti ha convinto?"
      goals: [character]
    - learner: "Lo stile sì: l'autore scrive come se toccasse il piano, con frasi lente e poi accelerazioni improvvise, soprattutto nelle scene di litigio."
      errors: [false-friend]
    # agree: content
    - tutor: "Come se suonasse il piano: bella immagine, e quasi quasi te la rubo. C'è qualcosa che invece non ti è piaciuto?"
      recast: {text: "toccasse", fix: "suonasse", tags: [false-friend]}
      goals: [style]
    # decoy: «l'editore» means «publisher», its correct sense
    - learner: "Il finale, un po' troppo sbrigativo. Sai se l'editore pubblicherà anche il secondo volume, o la storia finisce qui?"
    - tutor: "L'editore l'ha annunciato per la primavera, ma la data non si sa ancora. A chi lo consiglieresti, nel frattempo?"
    - learner: "A chi ama le storie di famiglia, per esempio a mio padre, che mi conta sempre della guerra e dei suoi nonni in Andalusia."
      errors: [false-friend]
    - tutor: "Un padre che ti racconta sempre della guerra è il lettore ideale: regalaglielo, e poi ci dici che ne pensa."
      recast: {text: "conta", fix: "racconta", tags: [false-friend]}
      goals: [recommend]

- scenario: arte-mostra
  # facts: quadro di una donna seduta che cuce, luce da sinistra che illumina le mani; sul tavolo un bicchiere di vino mezzo vuoto e un pezzo di pane; un cane sotto la sedia, quasi nell'ombra; il cane simboleggia la fedeltà; il pittore è italiano ma aveva studiato ad Anversa; l'anno scorso il learner ha visto i pittori olandesi ad Amsterdam
  level: C1
  persona: es-f-erasmus
  history: [false-friend, word-choice]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    # decoy: «suggestivo» means «evocative», its correct sense
    - learner: "Mi fa un'impressione strana, quasi di inquietudine. È molto suggestivo, con quella luce che entra dalla finestra e lascia nel buio metà della stanza."
    - tutor: "È proprio quella luce a renderlo speciale: viene da sinistra e illumina soltanto le mani della donna. Che cos'altro vedi?"
      goals: [react]
    - learner: "Vedo una donna seduta che cuce, e sul tavolo, accanto a lei, ci sono un vaso di vino mezzo vuoto e un pezzo di pane."
      errors: [false-friend]
    - tutor: "Il bicchiere di vino mezzo vuoto non è lì per caso: in questi quadri spesso indica il tempo che passa. Tu come la interpreti, la scena?"
      recast: {text: "vaso", fix: "bicchiere", tags: [false-friend]}
      goals: [describe]
    - learner: "Forse è una donna che aspetta qualcuno che non torna, un marito partito per la guerra. Il pane e il vino sembrano preparati per due persone, ma lei è sola."
    - tutor: "Lettura romantica, mi piace. Io ci vedrei piuttosto una scena di lavoro, senza drammi. Hai notato il cane sotto la sedia?"
      goals: [interpret]
    - learner: "No, lo sento, non l'avevo proprio visto: è quasi nascosto nell'ombra, vicino ai piedi della donna. Che cosa significa, un cane in un quadro così?"
      errors: [word-choice]
    - tutor: "Figurati: semmai mi dispiace che il museo lo illumini così male. Il cane di solito rappresenta la fedeltà, quindi forse la tua idea del marito lontano non è sbagliata. Ti ricorda qualche altro pittore?"
      recast: {text: "lo sento", fix: "mi dispiace", tags: [word-choice]}
    - learner: "Mi ricorda i pittori olandesi che abbiamo visto ad Amsterdam l'anno scorso, quelli con le cucine e le finestre aperte. Questo quadro è olandese anche lui, o italiano?"
    - tutor: "È italiano, ma il pittore aveva studiato ad Anversa, e si vede. Qual è la differenza più forte, secondo te?"
    - learner: "Gli olandesi sono più freddi, più precisi; qui invece i colori sono caldi e tutto sembra più umano. Per supposto, è solo l'impressione di una profana."
      errors: [word-choice]
    - tutor: "Naturalmente è un'impressione, ma è quella giusta: il calore dei colori è proprio la differenza principale. Andiamo a vedere la sala successiva?"
      recast: {text: "Per supposto", fix: "Naturalmente", tags: [word-choice]}
      goals: [compare]

- scenario: arte-mostra
  # facts: primo originale di questo pittore visto dal learner; tre grandi fasce di colore, rosso, nero e un grigio quasi bianco; da lontano il nero sembra avanzare e il rosso allontanarsi; paragone con le icone russe viste a Mosca; foto permesse con la macchina fotografica ma senza flash
  level: C1
  persona: en-m-traveller
  history: [false-friend]
  turns:
    - tutor: "Guarda questo quadro qui. Che impressione ti fa?"
    - learner: "Onestamente? Sono molto eccitato, perché è la prima volta che vedo un quadro di questo pittore dal vivo, dopo anni di riproduzioni sui libri."
      errors: [false-friend]
    - tutor: "Essere molto emozionato davanti a un originale è normale: le riproduzioni non rendono la materia. Che cosa vedi, adesso che ce l'hai davanti?"
      recast: {text: "molto eccitato", fix: "molto emozionato", tags: [false-friend]}
      goals: [react]
    - learner: "Vedo tre grandi fasce di colore, rosso, nero e un grigio quasi bianco. Da vicino si vedono i segni del pennello, e il rosso sembra quasi vibrare."
    - tutor: "Prova a fare due passi indietro: cambia qualcosa?"
      goals: [describe]
    - learner: "Sì, da lontano il nero sembra avanzare verso di me, e il rosso invece si allontana. È strano, mi dà quasi un senso di vertigine."
    - tutor: "È l'effetto che il pittore cercava. Secondo te, che cosa voleva comunicare con queste fasce?"
    - learner: "Forse un'emozione pura, senza nessuna storia. È un'idea molto ingenua, usare solo il colore per far sentire qualcosa di fisico: io non ci sarei mai arrivato."
      errors: [false-friend]
    - tutor: "Un'idea molto ingegnosa, sì, e semplice solo in apparenza: l'hanno copiata in tanti, ma farla funzionare è un'altra cosa. Lo paragoneresti a qualche altro artista?"
      recast: {text: "un'idea molto ingenua", fix: "un'idea molto ingegnosa", tags: [false-friend]}
      new: [{lemma: ingegnoso, gloss: clever}]
      goals: [interpret]
    - learner: "Mi ricorda certe icone russe che ho visto a Mosca, con il fondo d'oro e pochissimi colori. È un paragone assurdo, secondo te?"
    - tutor: "Per niente assurdo: anche le icone vogliono far sentire qualcosa senza raccontare una storia. Che differenza vedi, però?"
    - learner: "La differenza è che l'icona ha un significato religioso preciso, qui invece ognuno ci mette il suo. Posso fare una foto con la mia camera, o è vietato?"
      errors: [false-friend]
    - tutor: "Con la macchina fotografica puoi, ma senza flash: il custode è severo. E a me la foto la mandi, così la mostro ai miei studenti."
      recast: {text: "camera", fix: "macchina fotografica", tags: [false-friend]}
      goals: [compare]

- scenario: circolo-lettura
  # facts: «Il barone rampante» di Calvino; il learner l'aveva letto a quindici anni; Cosimo resta sugli alberi e partecipa alla vita di Ombrosa (incendi, lupi); la storia d'amore con Viola; l'anno scorso il circolo ha letto «Il visconte dimezzato»; prossimo libro: «Il cavaliere inesistente», più breve del Barone, a gennaio
  level: C2
  persona: en-m-heritage
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    # decoy: «la libreria di mio padre» means «bookcase», its correct sense
    - learner: "Insopportabile no, ma testardo sì. L'avevo letto la prima volta a quindici anni, preso dalla libreria di mio padre, e mi era sembrato soltanto una favola; rileggerlo adesso è stato come scoprire un libro diverso."
    - tutor: "Succede con i libri che crescono insieme a noi. Che cosa ci hai trovato, stavolta, che a quindici anni ti era sfuggito?"
      goals: [impression]
    - learner: "La politica, direi. A quindici anni non mi era occorso che Cosimo, restando sugli alberi, non fugge dal mondo: lo osserva da una distanza che gli permette di capirlo meglio."
      errors: [false-friend]
    # agree: content
    - tutor: "Anch'io, a quindici anni: non mi era venuto in mente che quella distanza fosse un modo di partecipare. Hai un esempio dal testo?"
      recast: {text: "non mi era occorso", fix: "non mi era venuto in mente", tags: [false-friend]}
    - learner: "Pensa a quando organizza la difesa contro gli incendi dei boschi: dagli alberi Cosimo si rende utile a Ombrosa più di chiunque altro, compreso suo padre."
    - tutor: "Gli incendi, certo, e anche i lupi. Ma non ti sembra che Calvino ci prenda un po' in giro, con tutta questa coerenza?"
      goals: [theme]
    - learner: "L'ironia c'è sempre, lo ammetto, anche nel romanzo con Viola, che secondo me è la parte più triste del libro, perché i due si amano e non riescono mai a incontrarsi davvero."
      errors: [false-friend]
    - tutor: "Nella storia d'amore con Viola l'ironia diventa quasi crudele: si amano e si fanno la guerra. Ti convince uno stile così leggero anche quando racconta il dolore?"
      recast: {text: "nel romanzo con Viola", fix: "nella storia d'amore con Viola", tags: [false-friend]}
    - learner: "Mi convince proprio per questo: la leggerezza non è superficialità. E qui non sono d'accordo con te: Cosimo non è insopportabile, è soltanto fedele a una scelta, cosa rarissima."
    - tutor: "Fedele a una scelta presa da ragazzino per un piatto di lumache, però! Va bene, ti concedo la coerenza. Che cosa leggiamo il mese prossimo?"
      goals: [style, disagree]
    - learner: "Propongo «Il cavaliere inesistente», così, dopo il Visconte dell'anno scorso, completiamo la trilogia; in cima a quello, è molto più breve del Barone, e a dicembre tutti hanno poco tempo."
      errors: [word-choice]
    - tutor: "Per di più a dicembre il tempo manca davvero, quindi un libro breve fa comodo. Approvato: a gennaio si parla di Agilulfo."
      recast: {text: "in cima a quello", fix: "per di più", tags: [word-choice]}
      goals: [recommend]

- scenario: circolo-lettura
  # facts: la learner è insegnante; Cosimo cerca di vivere secondo regole che si è dato da solo; scena della madre malata con Cosimo sull'albero davanti alla finestra; stile asciutto, quasi da cronaca; la storia è affidata al fratello; prossimo libro: «Lessico famigliare» di Natalia Ginzburg
  level: C2
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io lo trovo più commovente che insopportabile. Lo dico da insegnante: ho avuto tanti alunni come lui, che dicono di no a dodici anni e poi passano la vita a difendere quel no."
    - tutor: "Allora dovresti capire anche i suoi genitori, poveretti! Qual è il tema che ti sembra più importante?"
      goals: [impression]
    - learner: "La libertà, ma non quella facile: Cosimo intenta vivere secondo regole che si è dato da solo, e scopre che sono molto più severe di quelle del padre."
      errors: [false-friend]
    # agree: content
    - tutor: "Cerca di vivere secondo regole sue, e sono più severe di quelle paterne: è una lettura che condivido. Hai un esempio dal testo?"
      recast: {text: "intenta vivere", fix: "cerca di vivere", tags: [false-friend]}
    - learner: "Per esempio quando la madre si ammala e lui resta sull'albero davanti alla sua finestra, invece di entrare nella sua stanza. Lì la sua regola diventa quasi crudele."
    - tutor: "Una scena straziante, e Calvino la racconta senza una lacrima. È questo che intendi quando parli del suo stile?"
      goals: [theme]
    - learner: "Sì: è uno stile asciutto, quasi da cronaca, e proprio per questo commuove. Lo trovo più effettivo di tanti romanzi che ti spiegano ogni sentimento con dieci aggettivi."
      errors: [false-friend]
    - tutor: "Più efficace, forse, ma io ci sento a volte troppa distanza: sembra che Calvino non voglia bene a nessuno dei suoi personaggi. Non sei un po' indulgente?"
      recast: {text: "più effettivo", fix: "più efficace", tags: [false-friend]}
      goals: [style]
    - learner: "Qui non sono d'accordo: la distanza non è freddezza, è pudore. Calvino ama Cosimo, ma non vuole che il lettore lo compatisca, e per questo affida la storia al fratello."
    - tutor: "Il pudore, dici: non ci avevo pensato, e mi costringi a rileggere qualche pagina. Che cosa proponi per il prossimo incontro?"
      goals: [disagree]
    - learner: "Propongo «Lessico famigliare» della Ginzburg: è un'altra famiglia raccontata con pudore e con ironia, e secondo me ha molto che vedere con il Barone."
      errors: [word-choice]
    - tutor: "Ha molto a che vedere con il Barone, sì: famiglia, ironia e pudore. Approvata, ci vediamo il mese prossimo."
      recast: {text: "molto che vedere", fix: "molto a che vedere", tags: [word-choice]}
      goals: [recommend]

- scenario: club-lettura
  # facts: la learner ci ha messo un mese, stava per abbandonarlo a metà; il finale con il ritorno del fratello dall'Argentina; la madre per vent'anni finge che il figlio sia morto; il figlio era fuggito con i soldi della cooperativa; scene nel 1946 e nel 1968; l'autrice ha sempre negato che sia la storia della sua famiglia, ma il paese è il suo; regalo per il padre della learner
  level: C2
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    # decoy: «Finalmente» means «at last», its correct sense
    - learner: "Finalmente sì, dopo un mese di tentativi falliti. Confesso che a metà stavo per abbandonarlo, ma l'ultimo terzo mi ha ripagata di tutto."
    - tutor: "L'ultimo terzo è il cuore del libro, infatti. Che cosa ti ha fatto quasi abbandonarlo?"
    - learner: "La prima parte, con tutte quelle descrizioni del paese; però il finale, con il ritorno del fratello dall'Argentina, è tremendo, uno dei più belli che abbia mai letto."
      errors: [false-friend]
    # agree: content
    - tutor: "Il ritorno del fratello è straordinario, su questo siamo d'accordo, e chi si ferma a metà se lo perde. Che cosa pensi della madre, che per vent'anni finge che sia morto?"
      recast: {text: "è tremendo", fix: "è straordinario", tags: [false-friend]}
      goals: [impression]
    - learner: "Credo che lo abbia fatto per proteggere gli altri figli, non per vergogna. Se avesse ammesso che era fuggito con i soldi della cooperativa, l'intero paese li avrebbe isolati."
    - tutor: "È una lettura generosa. Io la trovo una scelta vigliacca, anche se comprensibile. E lo stile dell'autrice, ti ha convinta?"
      goals: [character]
    - learner: "In parte. Mi piace come alterna i punti di vista, ma i salti temporali confondono: alcune scene prendono luogo nel 1946, altre nel 1968, e spesso lo capisci solo dopo varie pagine."
      errors: [word-choice]
    - tutor: "Le scene che hanno luogo nel 1968 sono le più deboli, secondo me, ma i salti sono voluti: anche il lettore deve ricostruire la verità, come i figli. Ti sembra un espediente riuscito?"
      recast: {text: "prendono luogo", fix: "hanno luogo", tags: [word-choice]}
    # decoy: «il romanzo» means «novel», its correct sense
    - learner: "Riuscito sì, ma faticoso. Tu sai se l'autrice ha scritto il romanzo pensando alla storia della sua famiglia, come dicono in molti?"
    - tutor: "Lei l'ha sempre negato nelle interviste, ma il paese che descrive è chiaramente il suo. A chi lo consiglieresti?"
      goals: [style]
    - learner: "A chi ha pazienza e ama le storie lunghe. Non è un pezzo di torta, ma chi arriva in fondo non se ne pente; a mio padre, per esempio, lo regalerei subito."
      errors: [word-choice]
    - tutor: "Non è una passeggiata, ma ripaga, e come regalo per tuo padre mi sembra perfetto. Il prossimo libro, allora, lo scegli tu."
      recast: {text: "un pezzo di torta", fix: "una passeggiata", tags: [word-choice]}
      goals: [recommend]

- scenario: poesia-montale
  # facts: «Spesso il male di vivere ho incontrato»; immagini: il rivo strozzato, la foglia riarsa che si incartoccia, il cavallo stramazzato; correlativo oggettivo; suono aspro, lontano dalla musica di D'Annunzio; quasi tutti endecasillabi, l'ultimo verso più lungo; rima «incontrato» / «stramazzato» ripresa da «levato»; prossima lezione giovedì su «Meriggiare pallido e assorto»
  level: C2
  persona: en-m-retired
  history: [word-choice, false-friend]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    # decoy: «fisica» means «physical», its correct sense
    - learner: "Mi è rimasta addosso una sensazione di secchezza, quasi fisica. Il dolore qui non viene spiegato, viene mostrato attraverso le cose: un ruscello, una foglia, un cavallo."
    - tutor: "Ha colto il punto: Montale non nomina il dolore, lo affida agli oggetti. Quale di queste immagini la colpisce di più?"
      goals: [first-reading]
    - learner: "Il cavallo stramazzato. Mi sembra l'immagine più grafica, perché è l'unica con un essere vivente che soffre, e il verbo cade alla fine del verso come un corpo a terra."
      errors: [false-friend]
    - tutor: "La più cruda, sì: «stramazzato» chiude il verso come un tonfo. Sa come si chiama questa tecnica di affidare un'emozione a un oggetto?"
      recast: {text: "più grafica", fix: "più cruda", tags: [false-friend]}
      goals: [image]
    - learner: "Il correlativo oggettivo, l'ho letto nell'introduzione. Trovo molto effettivo anche il suono: tutte quelle consonanti doppie, «strozzato», «incartocciarsi», sembrano soffocare il verso."
      errors: [false-friend]

# Set r-calque-c1c2, file 1: job interviews, promotion talks, a podcast and two radio interviews.
# Error turns carry one lexical calque or false friend (recast at once, woven into a reply that
# answers and moves on); decoy turns use the same look-alike words in their correct sense.
- scenario: colloquio-lavoro
  # facts: candidata spagnola, a Bologna da quattro anni, laurea in Architettura a Valencia; tre anni in uno studio di Valencia (negozi e ristoranti), due anni a Bologna in un'agenzia che arreda uffici; lo studio ha nove progettisti e due persone in amministrazione; l'anno prossimo due cantieri per il Comune; i fornitori li segue il progettista responsabile del cantiere; esito entro due settimane per email
  level: C1
  persona: es-f-teacher
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di Lei."
    - learner: "Buongiorno. Sono spagnola e vivo a Bologna da quattro anni. Ho finito la carriera di Architettura a Valencia e da allora mi occupo soprattutto di progettazione di interni."
      errors: [false-friend]
    - tutor: "Con la laurea in Architettura e quattro anni qui a Bologna, ha già un profilo interessante. In quali studi ha lavorato, finora?"
      recast: {text: "la carriera di Architettura", fix: "la laurea in Architettura", tags: [false-friend]}
      goals: [intro]
    - learner: "Tre anni in uno studio di Valencia, dove seguivo i progetti di negozi e ristoranti, e poi due anni qui, in un'agenzia che arreda uffici. Posso chiederle quanti progettisti lavorano da voi?"
    - tutor: "Siamo nove progettisti, più due persone in amministrazione. E nell'agenzia di Bologna, di che cosa si occupava esattamente?"
      goals: [experience]
    - learner: "Coordinavo un gruppo di quattro persone e tenevo i contatti con i clienti. Il mio compromesso con la qualità è sempre stato molto forte, anche quando i tempi erano stretti."
      errors: [false-friend]
    # agree: content
    - tutor: "Un forte impegno per la qualità, anche con i tempi stretti, è proprio quello che cerchiamo. Mi dica però anche un suo punto debole: tutti ne abbiamo uno."
      recast: {text: "compromesso con la qualità", fix: "impegno per la qualità", tags: [false-friend]}
    # decoy: «pretendo molto da me stessa» is «pretendere» in its Italian sense, «esigere»
    - learner: "Il mio punto debole è che pretendo molto da me stessa e a volte faccio fatica a delegare. Sto imparando a fidarmi di più dei colleghi, anche perché da sola non si arriva lontano."
    - tutor: "È un difetto che conosco bene, e saperlo riconoscere è già un buon segno. Perché vuole lavorare proprio con noi, e non in uno studio più grande?"
      goals: [strengths]
    - learner: "Perché i vostri progetti per le biblioteche di quartiere mi hanno colpito molto. Ho molta illusione di lavorare su spazi pubblici, dove il design cambia davvero la vita delle persone."
      errors: [false-friend]
    - tutor: "Se ha molta voglia di lavorare su spazi pubblici, è capitata nel posto giusto: l'anno prossimo apriremo due cantieri per il Comune. Ha qualche domanda sul ruolo?"
      recast: {text: "molta illusione di lavorare", fix: "molta voglia di lavorare", tags: [false-friend]}
      goals: [why]
    - learner: "Sì, due. La posizione prevede anche il contatto diretto con i fornitori, o se ne occupa un altro ufficio? E quando pensate di comunicare l'esito dei colloqui?"
    - tutor: "I fornitori li segue il progettista responsabile di ogni cantiere, quindi anche Lei. L'esito lo comunichiamo entro due settimane, per email. La ringrazio, è stato un piacere."
      goals: [questions]

- scenario: colloquio-lavoro
  # facts: candidato inglese, trentadue anni, grafico da quasi dieci anni, prima a Manchester (loghi e confezioni per marchi alimentari) poi a Torino (comunicazione visiva di un museo per tre anni, contratto a progetto finito); ora libero professionista; lo studio lavora per due terzi con aziende private, il resto con musei e fondazioni; la campagna per il festival del cinema ha richiesto sei mesi; all'inizio un account affianca il designer, poi segue i clienti da solo; risposta entro venerdì
  level: C1
  persona: en-m-traveller
  history: [word-choice, false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi pure. Mi parli un po' di Lei."
    # decoy: «grafico» means «graphic designer», its correct sense
    - learner: "Grazie. Sono inglese, ho trentadue anni e lavoro come grafico da quasi dieci anni, prima a Manchester e poi a Torino, dove mi sono trasferito per amore."
    - tutor: "Per amore, addirittura: Torino ringrazia. Che tipo di lavori ha seguito in questi dieci anni?"
      goals: [intro]
    - learner: "A Manchester disegnavo soprattutto loghi e confezioni per marchi alimentari. A Torino, invece, sono stato in carica della comunicazione visiva di un piccolo museo per tre anni."
      errors: [word-choice]
    - tutor: "Essere responsabile della comunicazione visiva di un museo è un'esperienza preziosa, per noi. Come mai ha lasciato quel posto?"
      recast: {text: "in carica della comunicazione", fix: "responsabile della comunicazione", tags: [word-choice]}
      goals: [experience]
    # decoy: «Attualmente» means «al momento», its correct sense
    - learner: "Il contratto era a progetto e i fondi sono finiti. Attualmente lavoro come libero professionista, ma mi manca un gruppo. Voi lavorate più con clienti privati o con enti pubblici?"
    - tutor: "Per due terzi con aziende private, il resto con musei e fondazioni. Mi parli dei suoi punti di forza, e magari anche di un difetto."
    - learner: "Ho un buon occhio per i dettagli e con i clienti sono paziente: propongo sempre soluzioni sensibili, che stiano nel budget anche quando chiedono l'impossibile."
      errors: [false-friend]
    - tutor: "Soluzioni sensate e budget rispettati: i nostri clienti apprezzerebbero molto. E il difetto?"
      recast: {text: "soluzioni sensibili", fix: "soluzioni sensate", tags: [false-friend]}
    # decoy: «Eventualmente» means «se serve», its correct sense
    - learner: "All'inizio di un progetto sono un po' lento, perché faccio molte ricerche. Eventualmente posso lavorare anche nel fine settimana per recuperare, ma preferisco organizzarmi bene."
    - tutor: "Meglio lento all'inizio che di corsa alla fine. Perché ha scelto proprio il nostro studio?"
      goals: [strengths]
    - learner: "Ho visto la vostra campagna per il festival del cinema: era terrificante, e da quel giorno ho cominciato a seguire tutto quello che pubblicate."
      errors: [false-friend]
    - tutor: "Grazie, quella campagna era fantastica anche per noi, ci abbiamo lavorato sei mesi. Ha qualche domanda sul ruolo?"
      recast: {text: "era terrificante", fix: "era fantastica", tags: [false-friend]}
      goals: [why]
    - learner: "Sì: il designer lavora direttamente con il cliente, o c'è qualcuno che fa da filtro tra voi e le aziende?"
    - tutor: "All'inizio la affianca un account, poi dopo qualche mese i clienti li segue da solo. Le faremo sapere entro venerdì."
      goals: [questions]

- scenario: colloquio-promozione
  # facts: tre progetti europei chiusi nei tempi, uno sotto budget; progetto sull'energia: il cliente voleva cancellarlo, poi ha rinnovato per due anni; da otto mesi la learner svolge il ruolo di responsabile di area senza riconoscimento; budget promozioni di quest'anno quasi tutto assegnato; risparmio di quasi quarantamila euro; da gennaio due persone in più nel gruppo; aumento intermedio di circa il cinque per cento da questo mese; promozione da discutere a gennaio
  level: C1
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    # decoy: «fare il punto» is a correct Italian idiom
    - learner: "Sì, grazie del tempo. Volevo fare il punto sull'ultimo anno: il mio gruppo ha chiuso tutti e tre i progetti europei nei tempi previsti, e uno anche sotto budget."
    - tutor: "Lo so, e i clienti di Bruxelles ce l'hanno fatto notare. Quale dei tre risultati le sembra più importante?"
    - learner: "Direi il progetto sull'energia: all'inizio il cliente voleva cancellarlo, ma ci abbiamo lavorato per mesi ed eventualmente ha rinnovato il contratto per altri due anni."
      errors: [false-friend]
    # agree: content
    - tutor: "Il cliente alla fine ha rinnovato per due anni: un ottimo risultato, glielo riconosco. Immagino però che non sia venuta solo per raccontarmelo."
      recast: {text: "eventualmente ha rinnovato", fix: "alla fine ha rinnovato", tags: [false-friend]}
      goals: [results]
    - learner: "No, infatti. Vorrei chiederle di valutare la mia promozione a responsabile di area: da otto mesi svolgo già quel ruolo, anche se formalmente non mi è stato riconosciuto."
    - tutor: "Capisco la richiesta. Il problema è che il budget per le promozioni di quest'anno è già stato assegnato quasi tutto. Che cosa mi risponde?"
      goals: [request]
    - learner: "Le faccio notare che con la nuova organizzazione del lavoro abbiamo salvato quasi quarantamila euro, molto più di quanto costerebbe la mia promozione."
      errors: [word-choice]
    - tutor: "Avete risparmiato quasi quarantamila euro, è vero, e questo pesa. Ma la direzione mi chiederà perché proprio adesso e non a gennaio."
      recast: {text: "salvato quasi quarantamila euro", fix: "risparmiato quasi quarantamila euro", tags: [word-choice]}
    - learner: "Perché da gennaio avrò anche due persone in più nel gruppo. Se la promozione non è possibile subito, ci sarebbe almeno la possibilità di un aumento intermedio?"
    - tutor: "Un aumento intermedio posso proporlo già questo mese: parliamo di circa il cinque per cento. La promozione vera la discuterei a gennaio, con il nuovo budget. Le va bene?"
      goals: [handle]
    - learner: "Mi va bene, a patto che sia messo per iscritto e che l'aumento valga in base a questo mese, non dal prossimo anno."
      errors: [word-choice]
    - tutor: "L'aumento varrà a partire da questo mese, e lo metto per iscritto oggi stesso. Ci rivediamo a gennaio per la promozione, con i dati alla mano."
      recast: {text: "in base a questo mese", fix: "a partire da questo mese", tags: [word-choice]}
      goals: [next-steps]

- scenario: intervista-podcast
  # facts: ospite spagnolo di Siviglia; nel 2016 un'azienda di Parma gli ha mandato una lettera con un'offerta di lavoro; aveva trent'anni, disoccupato da un anno; partito in macchina con il cugino; sorpresa: orari dei pasti, in Emilia si cena prestissimo; critica: burocrazia, ogni pratica richiede una mattina intera, cinque volte in questura per il permesso; il conduttore ha impiegato tre mesi per rinnovare il passaporto
  level: C1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a voi. È una storia un po' strana: nel 2016 un'azienda di Parma mi ha mandato una carta per offrirmi un posto, e io non sapevo neanche dove fosse Parma."
      errors: [false-friend]
    - tutor: "Una lettera, addirittura, come nell'Ottocento! E tu, senza sapere dove fosse Parma, hai accettato subito?"
      recast: {text: "una carta", fix: "una lettera", tags: [false-friend]}
    - learner: "Quasi subito. Avevo trent'anni, ero disoccupato da un anno e a Siviglia non trovavo niente. Ho fatto le valigie in una settimana e sono partito in macchina con mio cugino."
    - tutor: "In macchina da Siviglia a Parma, che viaggio. Qual è stata la prima cosa che ti ha sorpreso, appena arrivato?"
      goals: [story]
    - learner: "Gli orari dei pasti, senza dubbio. In Spagna ceniamo alle dieci, e qui tutti si mettevano a tavola prontissimo, alle sette e mezza. Io a quell'ora non avevo ancora fame!"
      errors: [false-friend]
    # agree: content
    - tutor: "In Emilia si cena prestissimo ancora oggi, hai ragione: è un'abitudine dura a morire. E c'è qualcosa che invece, dell'Italia, proprio non ti va giù?"
      recast: {text: "prontissimo", fix: "prestissimo", tags: [false-friend]}
      goals: [culture-shock]
    # decoy: «educati» means «cortesi», its correct sense
    - learner: "Sì, la burocrazia. Gli impiegati sono quasi sempre educati e gentili, ma per il permesso di soggiorno sono dovuto tornare in questura cinque volte. Da voi è normale?"
    - tutor: "Normale purtroppo sì, e non solo per gli stranieri: io per rinnovare il passaporto ci ho messo tre mesi. Secondo te da dove nasce tutta questa lentezza?"
    - learner: "Credo che nessuno voglia prendersi la responsabilità di una firma. E poi il sistema è pensato per chi ha tempo: se lavori è un problema, perché ogni pratica tarda una mattina intera."
      errors: [false-friend]
    - tutor: "Se ogni pratica richiede una mattina intera, chi lavora a turni ne sa qualcosa. Ultima domanda: che consiglio daresti a uno spagnolo che sta pensando di trasferirsi qui?"
      recast: {text: "tarda una mattina intera", fix: "richiede una mattina intera", tags: [false-friend]}
      goals: [critique]
    - learner: "Gli direi di imparare l'italiano prima di partire, non dopo, e di non credere che le due lingue siano così simili: le parole che sembrano uguali sono le più traditrici."
    - tutor: "Un consiglio prezioso, soprattutto detto da chi ci è passato. Grazie di cuore per essere stato con noi!"
      goals: [advice]

- scenario: intervista-radio
  # facts: autrice inglese; il libro raccoglie dieci anni di appunti tra Napoli e Torino; il redattore le ha fatto togliere due capitoli troppo pittoreschi; stereotipo confermato: si litiga di politica a cena e poi ci si offre di accompagnarti a casa; aneddoto: il vicino di Napoli, ubriaco, le ha portato su il divano il giorno del trasloco
  level: C2
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    # decoy: «l'argomento» means «il tema», its correct sense
    - learner: "Grazie, è un piacere. Il libro raccoglie dieci anni di appunti presi tra Napoli e Torino; l'argomento, in fondo, è come si diventa un po' italiani senza smettere di essere inglesi."
    - tutor: "Un'impresa ardua, se mi permette. Ma ce lo dica senza giri di parole: non teme di aver scritto l'ennesimo catalogo di luoghi comuni, tra pizza, mamma e mandolino?"
      goals: [present-book]
    - learner: "Lo temevo, ed è proprio per questo che ho evitato i ritratti di maniera. Il mio editore, che ha riletto il manoscritto riga per riga, mi ha fatto togliere due capitoli troppo pittoreschi."
      errors: [false-friend]
    - tutor: "Benedetto il redattore che glieli ha fatti togliere! Eppure qualche stereotipo, almeno uno, immagino che Lei lo confermi."
      recast: {text: "editore", fix: "redattore", tags: [false-friend]}
    - learner: "Ne confermo uno, con affetto: gli italiani litigano di politica a cena e un minuto dopo si offrono di accompagnarti a casa. Non lo considero un difetto, anzi."
    - tutor: "Ci ha descritti meglio di quanto vorremmo. C'è un episodio, nel libro, che secondo Lei racchiude tutto questo?"
      goals: [stereotype]
    - learner: "Sì: il giorno del mio trasloco a Napoli il vicino del piano di sopra, dopo una lite furibonda con la moglie, mi ha portato su il divano da solo. Era completamente intossicato, ma non ha rotto niente."
      errors: [false-friend]
    - tutor: "Completamente ubriaco e con un divano sulle spalle: un eroe partenopeo, non c'è che dire. E la lingua? Che cosa le ha cambiato, imparare l'italiano?"
      recast: {text: "completamente intossicato", fix: "completamente ubriaco", tags: [false-friend]}
      goals: [anecdote]
    - learner: "Mi ha insegnato la pazienza delle subordinate. In inglese vado dritta al punto; in italiano ho imparato che un pensiero può prendersi il suo tempo prima di arrivare al verbo, e che non è per forza un difetto."
    - tutor: "Detto da una scrittrice, è quasi una dichiarazione d'amore alla nostra sintassi. Ci lasci con una frase, per chiudere: che cosa augura ai suoi lettori italiani?"
      goals: [language]
    - learner: "Auguro loro di guardarsi con la stessa ironia con cui li guardo io, e di continuare a sopportare le librerie indipendenti, che sono le vere ambasciate di questo paese."
      errors: [false-friend]
    # agree: content
    - tutor: "Sostenere le librerie indipendenti: un augurio che sottoscrivo parola per parola. Grazie davvero, e buona fortuna con il libro!"
      recast: {text: "sopportare le librerie", fix: "sostenere le librerie", tags: [false-friend]}
      goals: [farewell]

- scenario: intervista-radio
  # facts: autrice spagnola; il libro nasce da un viaggio di quasi un anno in treno regionale dalla Valle d'Aosta alla Sicilia; cercava le conversazioni tra sconosciuti; tra Foggia e Bari un ferroviere in pensione con un plastico della linea adriatica l'ha invitata a cena
  level: C2
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Bentornati, cari ascoltatori. Oggi è con noi un'autrice che ha osato scrivere un libro su noi italiani, e per giunta in italiano. Benvenuta!"
    - learner: "Grazie per l'invito. Il libro nasce da un viaggio molto largo, quasi un anno, in cui ho attraversato l'Italia in treno regionale, dalla Valle d'Aosta alla Sicilia."
      errors: [false-friend]
    - tutor: "Un viaggio molto lungo, e in regionale: ci vuole fegato. Che cosa cercava, esattamente, in quei vagoni?"
      recast: {text: "un viaggio molto largo", fix: "un viaggio molto lungo", tags: [false-friend]}
    - learner: "Cercavo le conversazioni che si fanno tra sconosciuti. Sui treni regionali la gente si racconta la vita come se non dovesse rivedersi mai più, e in effetti è così."
    - tutor: "Il regionale come confessionale degli italiani, mi piace. Ma non mi dica che ha trovato solo gente cordiale: non siamo anche rumorosi e maleducati?"
      goals: [present-book]
    - learner: "Rumorosi sì, lo ammetto; maleducati quasi mai. Anzi, mi ha colpito quante persone poco educate, magari senza nemmeno la licenza media, conoscessero a memoria interi canti di Dante."
      errors: [false-friend]
    - tutor: "Persone poco istruite che recitano Dante a memoria: è un'immagine che sorprende anche noi. Ci racconta un incontro in particolare?"
      recast: {text: "poco educate", fix: "poco istruite", tags: [false-friend]}
      goals: [stereotype]
    # decoy: «aveva realizzato» means «costruito», the correct sense of «realizzare»
    - learner: "Tra Foggia e Bari ho conosciuto un ferroviere in pensione che aveva realizzato, in quarant'anni, un plastico di tutta la linea adriatica. Mi ha invitata a vederlo e sono rimasta da loro a cena."
    - tutor: "Un plastico di tutta la linea adriatica, e la cena per giunta: ospitalità pugliese. E la lingua italiana, in tutto questo, come l'ha cambiata?"
      goals: [anecdote]
    - learner: "Mi ha resa più paziente e anche più curiosa: prima ero bastante timida, e adesso attacco bottone con chiunque, persino in coda alla posta."
      errors: [word-choice]
    - tutor: "Da abbastanza timida ad attaccare bottone alla posta: il nostro paese fa miracoli. Un'ultima frase per salutare chi ci ascolta?"
      recast: {text: "bastante timida", fix: "abbastanza timida", tags: [word-choice]}
      goals: [language]
    - learner: "Direi soltanto questo: prendete un regionale, almeno una volta, e lasciate il telefono in tasca. Sarà il viaggio più lento e più istruttivo della vostra vita."
    - tutor: "Un consiglio controcorrente, e proprio per questo prezioso. Grazie di essere stata con noi!"
      goals: [farewell]

- scenario: colloquio-lavoro
  # facts: candidato nato a Toronto da genitori calabresi; da sei anni nel design dei servizi; in una fabbrica di componenti per biciclette vicino a Treviso tempi di consegna ridotti del trenta per cento; lo studio ha assunto tre giovani designer a marzo; servizi per chi va in bici: deposito coperto in cortile e doccia al piano terra; risposta entro dieci giorni
  level: C2
  persona: en-m-heritage
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di Lei."
    - learner: "Buongiorno. Sono nato a Toronto da genitori calabresi, quindi l'italiano l'ho sentito in casa fin da piccolo, anche se l'ho studiato seriamente solo all'università. Da sei anni mi occupo di design dei servizi."
    - tutor: "Un percorso interessante, tra due continenti. Di quali progetti si è occupato, in questi sei anni?"
      goals: [intro]
    - learner: "Ultimamente ho ridisegnato i processi di una fattoria di componenti per biciclette vicino a Treviso: in un anno abbiamo ridotto del trenta per cento i tempi di consegna."
      errors: [false-friend]
    - tutor: "Il trenta per cento in una fabbrica di componenti è un risultato notevole. Come ci siete riusciti, concretamente?"
      recast: {text: "una fattoria di componenti", fix: "una fabbrica di componenti", tags: [false-friend]}
    # decoy: «i magazzini» means «depositi», the correct sense
    - learner: "Abbiamo osservato per tre settimane il lavoro sulle linee, senza toccare niente, e poi abbiamo spostato i magazzini intermedi accanto alle postazioni. Una soluzione banale, a posteriori, ma nessuno ci aveva pensato."
    - tutor: "Le soluzioni migliori sembrano sempre banali a posteriori. Quali sono, secondo Lei, i suoi punti di forza, e qual è il suo limite più evidente?"
      goals: [experience]
    - learner: "Credo di saper ascoltare e di trasformare i problemi in proposte concrete. Il mio limite, per essere candido con Lei, è che quando una riunione si allunga senza decisioni perdo la pazienza."
      errors: [false-friend]
    # agree: content
    - tutor: "Le dirò, per essere sincero anch'io: le riunioni senza decisioni qui non le sopporta nessuno. Ma perché vuole lasciare il Veneto per uno studio piccolo come il nostro?"
      recast: {text: "per essere candido", fix: "per essere sincero", tags: [false-friend]}
      goals: [strengths]
    # decoy: «avete assunto» means «hired», the correct sense of «assumere»
    - learner: "Perché nelle grandi aziende ho imparato il metodo, ma mi manca vedere l'effetto del mio lavoro. Ho letto che quest'anno avete assunto tre giovani designer: mi piacerebbe aiutare un gruppo così a crescere."
    - tutor: "Sì, li abbiamo assunti a marzo, e cercano proprio qualcuno con la sua esperienza. Ha domande per me?"
      goals: [why]
    - learner: "Una sola, di ordine pratico: lo studio offre facilità per chi viene in bicicletta, come una doccia o un deposito coperto? Da casa mia sono dieci chilometri."
      errors: [false-friend]
    - tutor: "Di servizi per chi viene in bicicletta ne abbiamo due: un deposito coperto in cortile e una doccia al piano terra. Le faremo sapere entro dieci giorni."
      recast: {text: "facilità per chi viene in bicicletta", fix: "servizi per chi viene in bicicletta", tags: [false-friend]}
      goals: [questions]

- scenario: colloquio-promozione
  # facts: semestre con crisi dei trasporti; consegne puntuali al novantasei per cento; il learner coordina già i magazzini di Verona e Bologna; obiezione: non ha mai gestito un budget superiore al milione; proposta: periodo di prova di sei mesi da gennaio con un controller; domani email con obiettivi e data d'inizio; primo bilancio a fine giugno
  level: C2
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:

# Set r-calque-c1c2, file 8: the news at the coffee machine, a disastrous day told with idioms,
# radio and podcast interviews, regional speech on a train, satire and a Sunday lunch. Calques
# such as «prendere vantaggio», «pioveva a brocche», «mettere la zampa», «fare grazia», «subire».
- scenario: notizie-attualita
  # facts: la nuova legge obbliga chi affitta ai turisti a registrarsi e a esporre un codice; il governo attuale vuole alzare le tasse per chi ha più di due appartamenti, ma i giornali non sono d'accordo sulle tasse; il quotidiano di Milano titolava sulla fine del far west, quello di Roma sulla guerra ai piccoli proprietari; la sorella del learner affitta una stanza; il collega non sa se la legge vale per una stanza sola e consiglia di chiedere al Comune
  level: C1
  persona: en-m-traveller
  history: [false-friend, word-choice]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho letta ieri sera. In pratica la nuova legge obbliga chi affitta ai turisti a registrarsi e a esporre un codice, e il governo corrente vuole anche alzare le tasse per chi ha più di due appartamenti."
      errors: [false-friend]
    - tutor: "Il governo attuale dice così, ma sulle tasse i giornali non sono tutti d'accordo. Tu sei a favore?"
      recast: {text: "il governo corrente", fix: "il governo attuale", tags: [false-friend]}
      goals: [summarise]
    # decoy: «un tema sensibile» means «delicato», its correct sense
    - learner: "In parte sì. È un tema sensibile, perché tocca sia chi cerca casa sia chi arrotonda lo stipendio, ma credo che un minimo di regole servisse da tempo."
    - tutor: "Un minimo di regole sì, ma il codice da esporre mi sembra solo burocrazia in più. Hai visto come l'hanno raccontata i vari giornali?"
      goals: [opinion]
    - learner: "Sì, e la differenza è enorme. Il quotidiano di Milano titolava sulla fine del far west, mentre quello di Roma parlava di guerra ai piccoli proprietari: sembrava un argomento tra due vicini."
      errors: [false-friend]
    - tutor: "Un litigio tra due vicini, sì, come sempre quando si parla di case. Tu a quale dei due credi di più?"
      recast: {text: "un argomento tra due vicini", fix: "un litigio tra due vicini", tags: [false-friend]}
      goals: [sources]
    - learner: "A nessuno dei due, sinceramente: ho cercato il testo della legge e l'ho letto io. Tu sai se vale anche per chi affitta una sola stanza, come mia sorella?"
    - tutor: "Non lo so con certezza, e preferisco non dirti una cosa sbagliata: tua sorella farebbe bene a chiedere al Comune. Secondo te, che cosa cambierà davvero?"
    - learner: "Il rischio, secondo me, è che i grandi gruppi prendano vantaggio della legge, perché hanno gli avvocati, mentre i piccoli proprietari rinunceranno."
      errors: [word-choice]
    # agree: content
    - tutor: "Che i grandi gruppi approfittino della legge è probabile, purtroppo, e su questo hai ragione. E per gli affitti lunghi, quelli normali, cambierà qualcosa?"
      recast: {text: "prendano vantaggio della legge", fix: "approfittino della legge", tags: [word-choice]}
    # decoy: «la domanda» means «demand», its correct sense
    - learner: "Forse qualche appartamento tornerà sul mercato degli affitti lunghi, soprattutto in periferia. Ma i prezzi in centro, secondo me, non scenderanno: la domanda è troppo alta."
    - tutor: "Su questo siamo d'accordo: in centro non scenderà niente. Vediamo tra un anno chi aveva ragione."
      goals: [consequences]

- scenario: modi-di-dire
  # facts: la learner è uscita alle sette e mezza senza ombrello, pioveva a catinelle; ha perso l'autobus per un minuto; riunione anticipata alle otto, comunicata con un messaggio la sera prima che lei non aveva visto; due gaffe su un cliente appena uscito; colpa a metà; morale: sveglia mezz'ora prima e telefono controllato la sera
  level: C1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Sono uscita di casa alle sette e mezza senza ombrello, e dopo cinque minuti pioveva a brocche."
      errors: [word-choice]
    - tutor: "Pioveva a catinelle e tu senza ombrello: si comincia bene! E poi?"
      recast: {text: "pioveva a brocche", fix: "pioveva a catinelle", tags: [word-choice]}
      new: [{lemma: catinella, gloss: basin}]
    - learner: "E poi ho perso l'autobus per un minuto, sono arrivata in ufficio bagnata come un pulcino e il capo mi aspettava sulla porta, perché la riunione era stata anticipata alle otto."
    - tutor: "Bagnata come un pulcino davanti al capo: una figuraccia da manuale. Te l'avevano detto, della riunione anticipata?"
      goals: [tell]
    - learner: "Sì, me l'avevano scritto la sera prima, ma non avevo controllato il telefono. E non è finita: durante la riunione ho messo la zampa due volte, parlando male di un cliente che era appena uscito."
      errors: [word-choice]
    - tutor: "Hai fatto una gaffe, anzi due: qui ci vuole un aperitivo doppio. Ma di chi è la colpa, secondo te?"
      recast: {text: "messo la zampa", fix: "fatto una gaffe", tags: [word-choice]}
    - learner: "Altro che pulcino, ero un pulcino annegato! La colpa è un po' mia, che la sera non guardo mai il telefono, e un po' di chi anticipa una riunione alle dieci di sera senza nemmeno chiamare."
    - tutor: "Insomma, la colpa sta nel mezzo, come la virtù. E la morale di tutta questa storia?"
      goals: [react, blame]
    - learner: "La morale è che domani metto la sveglia mezz'ora prima e la sera controllo il telefono; per il resto mi dà uguale, una giornata storta capita a tutti."
      errors: [word-choice]
    # agree: content
    - tutor: "Per il resto non importa, hai ragione: domani è un altro giorno. Ordiniamo?"
      recast: {text: "mi dà uguale", fix: "non importa", tags: [word-choice]}
      goals: [moral]
    - learner: "Sì, uno spritz, grazie! E la prossima volta che piove così, giuro che resto a casa e lavoro dal divano."
    - tutor: "Chi resta sul divano non piglia pesci, ma almeno non si bagna. Alla salute!"

- scenario: vita-in-italia
  # facts: il learner è arrivato in Puglia dodici anni fa, appena andato in pensione, con la moglie, da Londra; in Inghilterra aveva lo stesso medico da trent'anni; la moglie ha fatto un corso serale, lui ha imparato al bar giocando a carte; ha preso cinque chili per la cucina della vicina; gli mancano figli, nipoti e il rispetto delle code; alcuni paesi dell'entroterra offrono agevolazioni a chi si trasferisce
  level: C2
  persona: en-m-retired
  history: [false-friend, word-choice]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da molti anni. Com'è arrivato fin qui?"
    - learner: "Grazie a voi. Sono arrivato in Puglia dodici anni fa, appena andato in pensione: io e mia moglie volevamo un posto con il sole, il mare e un ritmo di vita più umano di quello di Londra."
    - tutor: "Sole e mare non mancano, il ritmo umano a volte fin troppo. Che cosa è stato più difficile, all'inizio?"
      goals: [story]
    - learner: "Il sistema sanitario, all'inizio. In Inghilterra avevo lo stesso fisico da trent'anni; qui ho dovuto scegliere un medico di base, e nessuno mi spiegava come funzionava."
      errors: [false-friend]
    - tutor: "Avere lo stesso medico per trent'anni è un lusso anche qui, ormai. E la lingua, come l'ha imparata?"
      recast: {text: "lo stesso fisico", fix: "lo stesso medico", tags: [false-friend]}
      goals: [difficulties]
    # decoy: «educatissimi» means «molto cortesi», its correct sense
    - learner: "Con molta fatica e con l'aiuto dei vicini, che sono sempre stati educatissimi e pazienti. Mia moglie ha frequentato un corso serale; io ho imparato soprattutto al bar, giocando a carte."
    - tutor: "Al bar, giocando a carte: la migliore università d'Italia. In che cosa l'ha cambiata, la vita qui?"
    - learner: "Sono diventato più lento, nel senso buono, e ho preso cinque chili, nel senso meno buono: la cucina della mia vicina è semplicemente additiva."
      errors: [false-friend]
    - tutor: "Se la cucina della vicina è una droga, cinque chili sono il minimo: un classico pugliese. E che cosa le manca dell'Inghilterra?"
      recast: {text: "additiva", fix: "una droga", tags: [false-friend]}
      goals: [change]
    - learner: "Mi mancano i miei figli e i nipoti, e un certo rispetto per le code. Lei, che fa questa trasmissione da tanti anni, ha notato che sempre più pensionati stranieri scelgono il Sud?"
    - tutor: "Sì, sempre di più, e i paesi dell'entroterra ci contano: alcuni offrono perfino agevolazioni a chi si trasferisce. Che consiglio darebbe a chi ci sta pensando?"
    - learner: "Gli direi di pagare una visita al paese in inverno, non solo in agosto: d'estate tutto sembra un sogno, ma è a febbraio che si capisce se ci si può vivere davvero."
      errors: [word-choice]
    - tutor: "Andare a vedere il paese a febbraio, non ad agosto: un consiglio che danno in pochi, e prezioso. Grazie, e buona vita in Puglia!"
      recast: {text: "pagare una visita al paese", fix: "andare a vedere il paese", tags: [word-choice]}
      goals: [advice]

- scenario: intervista-podcast
  # facts: l'ospite è canadese; i nonni erano partiti da un paesino dell'Abruzzo nel 1956; lui è tornato a trentacinque anni; il sindaco lo ha presentato come «il nipote dell'americano»; critica: pochi servizi per le famiglie nei paesi piccoli, asili nido spesso assenti; la moglie lavora da casa, si arrangiano con i nonni dei vicini
  level: C2
  persona: en-m-heritage
  history: [false-friend, word-choice]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a te. In realtà è un ritorno più che un arrivo: i miei nonni erano partiti da un paesino dell'Abruzzo nel 1956, e io, a trentacinque anni, ho fatto il viaggio al contrario."
    - tutor: "Il viaggio al contrario, che bella immagine. E com'è andato il primo impatto con il paese dei nonni?"
      goals: [story]
    - learner: "Strano e commovente. Il sindaco, appena ha saputo il mio cognome, mi ha introdotto a mezzo paese come «il nipote dell'americano», anche se io sono canadese."
      errors: [false-friend]
    - tutor: "Ti ha presentato a mezzo paese come il nipote dell'americano: per loro il Canada è un dettaglio! C'è stato qualcosa che ti ha davvero spiazzato?"
      recast: {text: "introdotto", fix: "presentato", tags: [false-friend]}
    # decoy: «Attualmente» means «al momento», its correct sense
    - learner: "Il tempo, soprattutto. In Canada un appuntamento alle tre è alle tre; qui alle tre si comincia a pensarci. Attualmente ci rido sopra, ma i primi mesi mi faceva impazzire."
    - tutor: "Alle tre si comincia a pensarci: questa me la segno! E c'è qualcosa dell'Italia che proprio non ti piace, anche con tutto l'affetto?"
      goals: [culture-shock]
    - learner: "Sì, e lo dico con affetto: chi vuole alzare dei figli qui, soprattutto nei paesi piccoli, trova pochissimi servizi, a partire dagli asili nido, che spesso non ci sono proprio."
      errors: [word-choice]
    # agree: content
    - tutor: "Crescere dei figli senza asili nido è una fatica enorme, hai ragione, e i paesi si svuotano anche per questo. Voi come vi siete organizzati?"
      recast: {text: "alzare dei figli", fix: "crescere dei figli", tags: [word-choice]}
      goals: [critique]
    # decoy: «intervisti» is «intervistare» in its correct sense
    - learner: "Mia moglie lavora da casa e ci arrangiamo con i nonni dei vicini, che sono un po' i nonni di tutti. Tu che intervisti tanti stranieri, senti spesso questa critica?"
    - tutor: "Spessissimo, quasi in ogni puntata: servizi per le famiglie e trasporti. Ultima domanda: che consiglio daresti a chi vuole fare il tuo stesso percorso?"
    - learner: "Gli direi di guardare la grande immagine: la burocrazia ti farà arrabbiare ogni settimana, ma la qualità della vita, nel complesso, ripaga di tutto."
      errors: [word-choice]
    - tutor: "Guardare il quadro generale, e non la singola fila alla posta: un consiglio che vale anche per me. Grazie di essere stato con noi!"
      recast: {text: "la grande immagine", fix: "il quadro generale", tags: [word-choice]}
      goals: [advice]

- scenario: notizie-attualita
  # facts: la learner abita a Firenze, palazzo mezzo pieno di turisti; il Comune vuole vietare nuovi affitti brevi nel centro storico, i proprietari minacciano ricorsi; chi ha già un affitto breve potrà continuare; il quotidiano locale ha pubblicato un'inchiesta con i dati quartiere per quartiere, i giornali nazionali solo dichiarazioni; il collega abita in periferia, affitto salito di centocinquanta euro in due anni; scommessa: una cena fra un anno
  level: C2
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    - learner: "L'ho seguita da vicino, perché il mio palazzo, a Firenze, è ormai mezzo pieno di valigie con le rotelle. Riassumendo: il Comune vuole vietare nuovi affitti brevi nel centro storico, e i proprietari minacciano ricorsi."
    - tutor: "Le valigie con le rotelle alle sei del mattino, le conosco bene. E tu sei d'accordo con il divieto?"
      goals: [summarise]
    - learner: "Sono d'accordo, anche se definitivamente non basterà: chi ha già un appartamento in affitto breve potrà continuare, e il problema resterà per anni."
      errors: [false-friend]
    # agree: content
    - tutor: "Sicuramente non basterà da solo, su questo hai ragione, ma è un segnale. Hai visto come ne parlano i giornali?"
      recast: {text: "definitivamente non basterà", fix: "sicuramente non basterà", tags: [false-friend]}
      goals: [opinion]
    # decoy: «un'inchiesta» means «investigation», its correct sense
    - learner: "Sì, e c'è una differenza curiosa: il quotidiano locale ha pubblicato un'inchiesta con i dati quartiere per quartiere, mentre i giornali nazionali si sono limitati alle dichiarazioni dei politici."
    - tutor: "I dati quartiere per quartiere sono l'unica cosa seria che ho letto. Secondo te che cosa succederà, nei prossimi anni?"
      goals: [sources]
    - learner: "Temo che i prezzi degli affitti lunghi, almeno all'inizio, subiranno ancora, perché i proprietari cercheranno di recuperare quello che perdono con i turisti."
      errors: [false-friend]
    - tutor: "I prezzi saliranno ancora, all'inizio, lo temo anch'io. Ma nel lungo periodo?"
      recast: {text: "subiranno ancora", fix: "saliranno ancora", tags: [false-friend]}
    - learner: "Nel lungo periodo forse qualche famiglia tornerà in centro, se il Comune aiuta con affitti calmierati. Tu che abiti in periferia, hai notato un aumento anche da voi?"
    - tutor: "Altro che se l'ho notato: il mio affitto è salito di centocinquanta euro in due anni, e il padrone di casa dà la colpa proprio ai turisti."
      goals: [consequences]
    - learner: "Allora ti aposto una cena: fra un anno gli affitti in centro saranno ancora più cari di oggi, divieto o non divieto."
      errors: [word-choice]
    - tutor: "Ci scommetto una cena anch'io, ma sul contrario: secondo me qualcosa scenderà. Fra un anno vediamo chi paga."
      recast: {text: "aposto", fix: "scommetto", tags: [word-choice]}

- scenario: dialetti-regionali
  # facts: due signori napoletani sul treno Milano-Napoli; il più anziano parlava con tono teatrale; in napoletano «tenere» prende il posto di «avere», anche nell'italiano regionale («tengo fame»), lo dicono anche persone istruite in famiglia, nello scritto formale si evita; la learner scende a Roma per una coincidenza per Perugia, l'ultimo treno della sera
  level: C2
  persona: en-f-student
  history: [false-friend, word-choice]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Solo qualche parola, a dire il vero: ridevo perché il più anziano parlava con un tono così teatrale che sembrava una commedia, anche senza capire quasi niente."
    - tutor: "Il tono teatrale è metà del napoletano. Che cosa ti ha colpito di più, nel loro modo di parlare?"
    - learner: "La musica, direi: le frasi salgono e scendono come in una canzone, ed è un modo di parlare molto ingaggiante, anche quando non capisci le parole."
      errors: [word-choice]
    - tutor: "Molto coinvolgente, sì: il napoletano si parla con tutto il corpo. Hai sentito qualche parola che ti incuriosisce?"
      recast: {text: "molto ingaggiante", fix: "molto coinvolgente", tags: [word-choice]}
      goals: [notice]
    - learner: "Sì: a un certo punto uno ha detto «tengo fame». Vuol dire «ho fame», giusto? E si usa anche quando si parla italiano, o solo in dialetto?"
    - tutor: "Sì, vuol dire «ho fame»: in napoletano «tenere» prende il posto di «avere». E passa anche nell'italiano regionale: molti napoletani dicono «tengo fame» anche parlando italiano."
      goals: [example]
    - learner: "Quindi chi lo dice in italiano non sbaglia? Io pensavo che fosse il segno di una persona poco educata, ma forse è solo un mio pregiudizio."
      errors: [false-friend]
    - tutor: "Di una persona poco istruita? È un pregiudizio, e molto diffuso: lo dicono anche professori universitari, in famiglia. Nello scritto formale, però, si evita."
      recast: {text: "poco educata", fix: "poco istruita", tags: [false-friend]}
      goals: [standard]
    # decoy: «più sensibili» means «more aware», its correct sense
    - learner: "Allora credo che i dialetti vadano protetti, ma senza imporli: se a scuola si insegnasse almeno a riconoscerli, i ragazzi sarebbero più sensibili alla ricchezza linguistica del loro paese."
    - tutor: "Riconoscerli sì, insegnarli come materia io non lo farei: un dialetto vive per strada, non sui libri. Tu dove scendi?"
      goals: [opinion]
    - learner: "Scendo a Roma, purtroppo: ho una coincidenza per Perugia e devo assolutamente catturare l'ultimo treno della sera."
      errors: [word-choice]
    - tutor: "Allora corri a prendere la coincidenza, mi raccomando. E se passi da Napoli, ti porto io a sentire il dialetto vero, al mercato."
      recast: {text: "catturare", fix: "prendere", tags: [word-choice]}

- scenario: umorismo-satira
  # facts: il comico aveva raccontato che il ministro si vanta di cucinare alla romana, poi lo ha immaginato mettere la panna nella carbonara; battuta preferita del learner: il comico fermo alla stazione di Orte più che in vacanza; freddura del learner sul pesce che sta sempre in banco; limite della satira secondo il learner: si ride del potente, mai del debole, come diceva suo nonno
  level: C2
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto, mi hai beccato. Ho capito che c'entrava il guanciale, ma non ho capito perché tutta la sala sia scoppiata a ridere proprio quando ha detto «panna»."
    - tutor: "Perché prima il comico aveva raccontato che il ministro si vanta di cucinare alla romana, e poi l'ha immaginato mentre mette la panna nella carbonara: per un romano è peggio di uno scandalo."
      goals: [missed]
    - learner: "Ah, adesso capisco, e mi fa molta grazia: un ministro che tradisce la carbonara è un traditore della patria. La mia preferita, però, è stata quella sul treno regionale."
      errors: [false-friend]
    - tutor: "Fa molto ridere, ora che l'hai capita, eh? E quella del regionale, perché ti è piaciuta tanto?"
      recast: {text: "molta grazia", fix: "molto ridere", tags: [false-friend]}
    - learner: "Perché era vera: il comico ha raccontato di aver passato più tempo fermo alla stazione di Orte che in vacanza, e chiunque abbia preso un regionale si è riconosciuto."
    - tutor: "Il segreto della satira: far ridere con una cosa che fa anche un po' arrabbiare. Ma tu una battuta in italiano, un gioco di parole, sapresti farla?"
      goals: [favourite]
    - learner: "Posso intentarlo, ma non garantisco niente: perché il pesce è sempre il primo della classe? Perché sta sempre in banco!"
      errors: [false-friend]
    - tutor: "Puoi provarci quando vuoi, ma questa è una freddura da nonno! Il doppio senso di «banco», però, funziona, te lo concedo."
      recast: {text: "intentarlo", fix: "provarci", tags: [false-friend]}
      goals: [wordplay]
    # decoy: «le disgrazie» means «misfortunes», its correct sense
    - learner: "Lo prendo come un complimento. Ma secondo te la satira dovrebbe avere dei limiti? Per esempio, si può scherzare sulle disgrazie, o sulla religione?"
    - tutor: "Secondo me si può scherzare su tutto, ma non con tutti e non in ogni momento: dipende da chi ride e di chi si ride. Tu dove metteresti il confine?"
    - learner: "Io lo metterei qui: si può ridere del potente, mai di chi è più debole. Mio nonno lo ripeteva sempre, quando contava barzellette a cena."
      errors: [false-friend]
    # agree: content
    - tutor: "Tuo nonno, che raccontava barzellette a cena, aveva capito tutto: si ride del potente, non del debole. Brindiamo a lui, e al prossimo spettacolo."
      recast: {text: "contava", fix: "raccontava", tags: [false-friend]}
      goals: [limits]

- scenario: pranzo-domenicale
  # facts: la zia e il cugino si contendono l'ultima lasagna; teglia da dodici porzioni; l'ultima lasagna va al learner, che arriva per ultimo, con il posto accanto al camino; proverbio «chi tardi arriva male alloggia»; in inglese si uccidono due uccelli con una pietra; aneddoto: il learner ha chiamato «amore» il capo davanti a tutti
  level: C2
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Grazie, ma da come si guardano tua zia e tuo cugino direi che qualcuno potrebbe mordere davvero! Per la via, chi si aggiudica l'ultima lasagna?"
      errors: [word-choice]
    - tutor: "A proposito di lasagne: come sempre se l'aggiudica chi arriva per ultimo, cioè tu! Di solito si dice «chi tardi arriva male alloggia», ma con le lasagne vale il contrario. Lo conoscevi?"
      recast: {text: "Per la via", fix: "A proposito", tags: [word-choice]}
    - learner: "Non lo conoscevo, ma credo di capire: chi arriva tardi trova il posto peggiore. A giudicare dalla teglia, comunque, queste lasagne si sono vendute come torte calde."
      errors: [word-choice]
    - tutor: "Sono andate a ruba, sì: la teglia era da dodici. E il proverbio l'hai interpretato bene, anche se oggi per te vale il contrario."
      recast: {text: "si sono vendute come torte calde", fix: "sono andate a ruba", tags: [word-choice]}

# Set r-calque-c1c2, file 3: dinners about artificial intelligence and jobs, a book club, remote
# work over an aperitivo and two ethics seminars. English and Spanish calques («ultimamente» for
# «alla fine», «attuare» for «agire», «per lo tanto», «darsi conto») recast in the reply.
- scenario: intelligenza-artificiale
  # facts: la figlia del learner lavora nella biblioteca comunale di Lecco, usano un programma per catalogare, l'anno scorso non hanno sostituito una collega in pensione; l'amico fa il commercialista e vede il suo lavoro a rischio; accordo finale: regole, formazione, un fondo per chi resta indietro, deciso dal Parlamento
  level: C1
  persona: en-m-retired
  history: [false-friend, word-choice]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    # decoy: «sensibile a uno sguardo» is «sensibile» in its correct sense
    - learner: "Capisco, ma io sarei più cauto. Alcuni lavori spariranno, altri cambieranno soltanto: una macchina non è sensibile a uno sguardo o al tono di una voce, e un buon medico lavora anche con quelli."
    - tutor: "Bella frase, ma i medici di base vedono un paziente ogni dieci minuti: altro che sguardi. Hai qualche esempio concreto?"
      goals: [position]
    - learner: "Sì: mia figlia lavora nella libreria comunale di Lecco, e da quando usano un programma per catalogare i libri hanno più tempo per i laboratori con i bambini."
      errors: [false-friend]
    - tutor: "Nella biblioteca comunale va bene così, ma non è che poi il Comune decide che bastano due bibliotecarie invece di quattro?"
      recast: {text: "nella libreria comunale", fix: "nella biblioteca comunale", tags: [false-friend]}
      goals: [evidence]
    # decoy: «hanno assunto» means «hired», its correct sense
    - learner: "È un rischio, lo ammetto, e infatti l'anno scorso non hanno sostituito una collega andata in pensione: hanno assunto solo un ragazzo a tempo parziale. Tu che lavoro fai, adesso? Lo vedi in pericolo?"
    - tutor: "Faccio il commercialista, e il mio lavoro lo vedo in pericolo eccome: le dichiarazioni semplici un programma le fa già meglio di me. Quindi per qualcuno sarà dura, no?"
      goals: [concede]
    - learner: "Per qualcuno sì, sarà durissima. Ma ultimamente dipende da come usiamo questi strumenti: se servono a licenziare, è un disastro; se servono a lavorare meglio, no."
      errors: [false-friend]
    # agree: content
    - tutor: "Alla fine dipende da come li usiamo, su questo hai ragione, ma di solito a deciderlo non siamo noi. Allora, almeno su che cosa siamo d'accordo?"
      recast: {text: "ultimamente dipende", fix: "alla fine dipende", tags: [false-friend]}
    - learner: "Siamo d'accordo su una cosa: servono regole, e i governi dovrebbero obbligare le aziende a salvare una parte dei profitti per formare chi perde il lavoro."
      errors: [word-choice]
    - tutor: "Accantonare una parte dei profitti per la formazione: su questo ti seguo. Ma chi decide quanto?"
      recast: {text: "salvare una parte dei profitti", fix: "accantonare una parte dei profitti", tags: [word-choice]}
      new: [{lemma: accantonare, gloss: to set aside}]
    - learner: "Lo dovrebbe decidere il Parlamento, ascoltando sindacati e imprese. Su quanti lavori spariranno restiamo di idee diverse, ma su questo almeno siamo d'accordo."
    - tutor: "Allora siamo d'accordo: regole, formazione e un fondo per chi resta indietro. Sul resto ne riparliamo fra dieci anni."
      goals: [conclude]

- scenario: film-libro
  # facts: romanzo «La casa sul lago» di un'autrice cilena, quasi cinquecento pagine; tre sorelle tornano nella casa di famiglia nel sud del Cile dopo la morte del padre; Inés, la più piccola, sembra fredda, da bambina ha vissuto un episodio terribile sul lago; parte centrale lenta, capitoli lunghi sulla storia della casa; Roberto ne aveva letto solo una recensione; consigliato a lettori pazienti, non a chi cerca un giallo
  level: C1
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io! Ho letto una novella di quasi cinquecento pagine, «La casa sul lago», di un'autrice cilena che in Italia è appena uscita."
      errors: [false-friend]
    - tutor: "Un romanzo di quasi cinquecento pagine in un mese: che ritmo! Di che cosa parla, senza svelarci il finale?"
      recast: {text: "una novella di quasi cinquecento pagine", fix: "un romanzo di quasi cinquecento pagine", tags: [false-friend]}
    - learner: "È la storia di tre sorelle che tornano nella casa di famiglia, nel sud del Cile, dopo la morte del padre. Ognuna ha un segreto, e il lago diventa quasi un quarto personaggio."
    - tutor: "Un lago come personaggio, mi piace già. Quale delle tre sorelle ti è piaciuta di più?"
      goals: [summary]
    - learner: "La più piccola, Inés: all'inizio sembra fredda, quasi antipatica, ma poi si scopre che da bambina ha vissuto un successo terribile sul lago e da allora non ne parla con nessuno."
      errors: [false-friend]
    - tutor: "Un episodio terribile tenuto segreto per anni: ecco perché sembra fredda. E a te, nel complesso, il libro è piaciuto?"
      recast: {text: "un successo terribile", fix: "un episodio terribile", tags: [false-friend]}
      goals: [characters]
    - learner: "Sì, molto, anche se la parte centrale è un po' lenta. Tu hai letto qualcosa di quest'autrice, o è la prima volta che ne senti parlare?"
    - tutor: "È la prima volta, lo confesso: ne avevo letto solo una recensione sul giornale. Perché la parte centrale ti è sembrata lenta?"
    - learner: "Perché ci sono capitoli molto larghi sulla storia della casa e del paese, con tante date e tanti nomi, e la tensione tra le sorelle si perde un po'."
      errors: [false-friend]
    # agree: content
    - tutor: "Con capitoli molto lunghi pieni di date, capisco che la tensione cali. A chi lo consiglieresti, allora?"
      recast: {text: "capitoli molto larghi", fix: "capitoli molto lunghi", tags: [false-friend]}
      goals: [opinion]
    - learner: "Lo consiglierei a chi ama le storie di famiglia e non ha fretta, magari da leggere in vacanza. Non lo darei a chi cerca un giallo, perché il mistero è solo una scusa."
    - tutor: "Consiglio chiaro: lettori pazienti sì, amanti del giallo no. Grazie, lo metto nella lista per l'estate."
      goals: [recommend]

- scenario: politica-lavoro
  # facts: Riccardo lavora in banca da vent'anni; nella sua zona hanno chiuso sei sportelli su dieci in cinque anni, i colleghi più anziani in prepensionamento; il cugino del learner ha lasciato un'agenzia di viaggi, disegna percorsi per un'app e ha registrato un brevetto; proposta di Riccardo: soldi nella formazione degli adulti; proposta del learner: incentivi alle aziende che riqualificano i dipendenti
  level: C1
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Dico che è un'esagerazione. Molti lavori cambieranno, ma la storia insegna che ogni grande innovazione ha creato più posti di quanti ne abbia distrutti, anche se non subito."
    - tutor: "Non subito, appunto: e nel frattempo chi ha cinquant'anni che fa? Prova a immaginare: se domani chiudessero tutti gli sportelli delle banche, cosa succederebbe?"
      goals: [opinion]
    - learner: "Molti impiegati perderebbero il posto, almeno all'inizio. Alcuni passerebbero alla consulenza, altri farebbero corsi di formazione e applicherebbero per un lavoro diverso, magari meno pagato."
      errors: [word-choice]
    - tutor: "Si candiderebbero per un lavoro diverso, dici, e magari meno pagato: e ti sembra una consolazione?"
      recast: {text: "applicherebbero per un lavoro diverso", fix: "si candiderebbero per un lavoro diverso", tags: [word-choice]}
      goals: [hypothesis]
    - learner: "Non è una consolazione, è un fatto. Ma tu che lavori in banca da vent'anni, quanti sportelli avete chiuso nella tua zona?"
    - tutor: "Nella mia zona ne abbiamo chiusi sei su dieci in cinque anni, e i colleghi più anziani sono andati in prepensionamento. Tu hai un esempio di lavoro nuovo, nato da tutto questo?"
    - learner: "Sì: mio cugino ha lasciato un'agenzia di viaggi e adesso disegna percorsi turistici per un'app; il mese scorso ha perfino registrato una patente per un sistema di prenotazione."
      errors: [false-friend]
    - tutor: "Un brevetto, addirittura! Tuo cugino però è l'eccezione, non la regola. Allora, tirando le somme, chi ha ragione dei due?"
      recast: {text: "una patente", fix: "un brevetto", tags: [false-friend]}
      goals: [example]
    - learner: "Forse un po' tutti e due: i lavori non spariranno, ma cambieranno così in fretta che molte persone resteranno indietro. Tu che cosa faresti, al posto del governo?"
    - tutor: "Al posto del governo metterei i soldi nella formazione degli adulti, non solo in quella dei ragazzi. Su questo siamo d'accordo?"
    - learner: "Assolutamente sì, e aggiungerei incentivi alle aziende che riqualificano i loro dipendenti, in ordine a evitare licenziamenti di massa."
      errors: [word-choice]
    # agree: content
    - tutor: "Incentivi per evitare licenziamenti di massa: ci sto anch'io. Brindiamo almeno a questo."
      recast: {text: "in ordine a evitare", fix: "per evitare", tags: [word-choice]}
      goals: [conclude]

- scenario: smartworking
  # facts: il learner lavora tre giorni da casa e due in ufficio (martedì e giovedì) da settembre; risparmia un'ora e mezza di treno; la moglie lavora di notte, pranzano insieme; il computer sul tavolo della cucina; il capo scrive tardi e vuole risposte subito; nell'azienda di Andrea dopo le sette niente email, salvo emergenze; il fratello lavora sempre da casa; preferenza: metà e metà, con la regola delle sette
  level: C1
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    # decoy: «Attualmente» means «al momento», its correct sense
    - learner: "Attualmente faccio tre giorni da casa e due in ufficio, il martedì e il giovedì. All'inizio lavoravo sempre da casa, ma a settembre l'azienda ha cambiato le regole."
    - tutor: "Tre e due, una via di mezzo. E ti trovi bene così, o preferivi prima?"
      goals: [situation]
    - learner: "Mi trovo bene, soprattutto perché risparmio un'ora e mezza di treno. E poi mia sposa lavora di notte, quindi quando sono a casa riusciamo almeno a pranzare insieme."
      errors: [false-friend]
    - tutor: "Pranzare con tua moglie, con i turni di notte, vale più di qualsiasi aumento. E gli svantaggi?"
      recast: {text: "sposa", fix: "moglie", tags: [false-friend]}
      goals: [pros]
    - learner: "Il problema è che a casa non stacco mai: il computer è sempre lì, sul tavolo della cucina, e finisco per rispondere alle email anche alle dieci di sera."
    - tutor: "Il tavolo della cucina è il nemico numero uno, lo so bene. Hai provato a darti un orario fisso?"
      goals: [cons]
    - learner: "Ci ho provato, ma il mio capo scrive sempre tardi e vuole che rispondiamo pronto, anche quando la cosa potrebbe aspettare tranquillamente fino al mattino dopo."
      errors: [false-friend]
    - tutor: "Un capo che vuole risposte subito anche la sera è un problema, non un orario. Gliene hai mai parlato?"
      recast: {text: "pronto", fix: "subito", tags: [false-friend]}
    - learner: "Non ancora, ho paura di sembrare poco disponibile. Tu come fai? Anche nella tua azienda c'è questa abitudine di scrivere a tutte le ore?"
    - tutor: "Da noi c'è una regola scritta: dopo le sette niente email, salvo emergenze. All'inizio sembrava strana, ora la rispettano tutti. Ma tu, potendo scegliere, come lavoreresti?"
    - learner: "Farei metà e metà, perché l'ufficio mi serve per vedere i colleghi. Mio fratello, in cambio, lavora sempre da casa e dice che non tornerebbe in ufficio per niente al mondo."
      errors: [word-choice]
    - tutor: "Tuo fratello invece è un caso estremo: lavorare sempre da casa logora anche i più solitari. Metà e metà, con la regola delle sette: la proponi al tuo capo?"
      recast: {text: "in cambio", fix: "invece", tags: [word-choice]}
      goals: [preference]
    - learner: "Sì, gliela propongo lunedì, con calma e con il conto delle ore extra alla mano. Se mi dice di no, almeno ci avrò provato."
    - tutor: "Con i numeri in mano è più difficile dirti di no. Poi fammi sapere com'è andata!"

- scenario: seminario-etica
  # facts: tesi della dottoranda: la responsabilità morale presuppone la capacità di rendere conto delle proprie ragioni, e nessun sistema attuale ne è capace; distinzione tra spiegare e giustificare; esempio del pappagallo; concessione: in futuro potrebbero esistere sistemi capaci di rivedere i propri scopi; conclusione: oggi la responsabilità ricade su chi progetta e chi usa la macchina
  level: C2
  persona: en-f-student
  history: [false-friend, word-choice]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Me lo aspettavo, professore. Più precisamente, sostengo che la responsabilità morale presupponga la capacità di rendere conto delle proprie ragioni, e che nessun sistema attuale ne sia capace."
    - tutor: "«Rendere conto delle proprie ragioni»: lo fanno anche certi sistemi, che spiegano perché hanno scelto una risposta. Dove passa, allora, il confine?"
      goals: [thesis]
    - learner: "Passa tra spiegare e giustificare. Un sistema può produrre una spiegazione plausibile, ma lo fa come un attore che pretende di piangere in scena: imita le ragioni, senza possederle né sentirsene vincolato."
      errors: [false-friend]
    - tutor: "Un attore che finge di piangere, però, sa di fingere. Non sta attribuendo alla macchina proprio l'intenzionalità che le nega?"
      recast: {text: "pretende di piangere", fix: "finge di piangere", tags: [false-friend]}
      goals: [distinguish]
    - learner: "Ha ragione, l'immagine è infelice. Diciamo allora che simula delle ragioni senza esserne l'autrice, così come un pappagallo può pronunciare una promessa senza impegnarsi a nulla."
    - tutor: "Il pappagallo è un esempio comodo, ma forse ingeneroso. Che cosa risponde a chi obietta che anche noi, in fondo, simuliamo ragioni costruite dai nostri neuroni?"
    - learner: "Rispondo che questa obiezione, se presa sul serio, dissolve anche la responsabilità degli esseri umani, e che nessuno di noi adotta davvero un'attitudine così radicale nella vita quotidiana."
      errors: [false-friend]
    # agree: content
    - tutor: "Un atteggiamento così radicale, nella vita quotidiana, non lo adotta nessuno: su questo le do ragione. Ma un argomento pratico non è ancora un argomento filosofico."
      recast: {text: "un'attitudine così radicale", fix: "un atteggiamento così radicale", tags: [false-friend]}
      goals: [objection]
    # decoy: «l'argomento pratico» means «il ragionamento», its correct sense
    - learner: "Le concedo che l'argomento pratico, da solo, non basta. Ammetto anche che in futuro potrebbero esistere sistemi capaci di rivedere i propri scopi; in quel caso dovrei rivedere almeno in parte la mia tesi."
    - tutor: "Una concessione onesta. Ci dia allora la conclusione, in una frase sola, che tenga conto di questo."
      goals: [concede]
    - learner: "Una macchina, oggi, non può essere ritenuta responsabile, perché non è autrice delle proprie ragioni: alla fine del giorno, la responsabilità ricade su chi la progetta e su chi la usa."
      errors: [word-choice]
    - tutor: "Una conclusione prudente: in fin dei conti, la responsabilità resta umana. Non mi ha convinto del tutto, ma ne riparleremo quando le macchine sapranno rivedere i propri scopi."
      recast: {text: "alla fine del giorno", fix: "in fin dei conti", tags: [word-choice]}
      goals: [conclude]

- scenario: seminario-etica
  # facts: tesi: attribuire una colpa a una macchina è un errore di categoria, come rimproverare un fiume per un'alluvione; esempio dell'auto a guida autonoma; distinzione tra seguire una regola e chiedersi se la regola sia giusta; responsabilità distribuita tra programmatore, produttore e proprietario; concessione: le categorie giuridiche pensate per individui mostrano i loro limiti
  level: C2
  persona: es-f-teacher
  history: [word-choice, false-friend]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne subito."
    - learner: "Ne dubiti pure, professore. La mia tesi è che attribuire una colpa a una macchina sia un errore di categoria, come rimproverare un fiume per un'alluvione."
    - tutor: "Il fiume, però, non prende decisioni. Un'auto a guida autonoma sì: sceglie se frenare o sterzare. Non è anche questa una forma di scelta?"
      goals: [thesis]
    - learner: "Non lo è. L'auto esegue un calcolo che qualcun altro ha scritto, e quando frena non attua per conto suo: applica una regola che non ha scelto."
      errors: [false-friend]
    # agree: content
    - tutor: "Concesso: quando frena non agisce per conto suo. Ma allora qual è il criterio che distingue un calcolo da una scelta?"
      recast: {text: "non attua per conto suo", fix: "non agisce per conto suo", tags: [false-friend]}
    - learner: "La distinzione che propongo è tra seguire una regola e potersi chiedere se la regola sia giusta. L'auto segue la regola; un essere umano, almeno in linea di principio, può metterla in discussione."
    - tutor: "Distinzione elegante. Ma quante persone, al volante, si chiedono se una regola sia giusta mentre frenano? Non le sembra di idealizzare l'essere umano?"
      goals: [distinguish]
    # decoy: «Non pretendo» means «non esigo», its correct sense; only «fare un giudizio» is wrong
    - learner: "Non pretendo che lo facciano mentre frenano, ma che possano farlo dopo, rispondendo delle proprie azioni. A una macchina, invece, non si può fare un giudizio per un incidente."
      errors: [false-friend]
    - tutor: "Se a una macchina non si può fare un processo, a chi lo facciamo quando l'incidente avviene? Al programmatore, al produttore, al proprietario?"
      recast: {text: "fare un giudizio", fix: "fare un processo", tags: [false-friend]}
      goals: [objection]
    - learner: "A tutti e tre, in misura diversa: è il problema della responsabilità distribuita. Le concedo però che le nostre categorie giuridiche, pensate per individui, qui mostrano tutti i loro limiti."
    - tutor: "Concessione importante, dottoressa. Proviamo a chiudere: in una frase, che cosa resta della sua tesi?"
      goals: [concede]
    - learner: "Resta l'essenziale: la macchina non è un soggetto morale, e per lo tanto la responsabilità va cercata sempre negli esseri umani che la progettano, la vendono e la usano."
      errors: [word-choice]
    - tutor: "Pertanto la responsabilità resta umana, anche se distribuita: una conclusione rigorosa. Non mi ha convertito, ma mi ha costretto a pensare."
      recast: {text: "per lo tanto", fix: "pertanto", tags: [word-choice]}
      goals: [conclude]

- scenario: politica-lavoro
  # facts: Riccardo ha uno studio di commercialisti; da un anno le pratiche semplici le prepara un programma e loro le controllano; meno straordinari, nessun licenziamento; la sorella del learner faceva la traduttrice tecnica, i clienti mandavano tutto alla traduzione automatica; ora rivede testi tradotti dalle macchine, guadagna meno, lavora dalla campagna in Umbria
  level: C2
  persona: en-m-retired
  history: [word-choice, false-friend]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Dico che le profezie sulla fine del lavoro le sento da quando ero ragazzo, e finora si sono sempre rivelate sbagliate. Semmai cambierà il modo in cui il lavoro viene distribuito e pagato."
    - tutor: "Stavolta però le macchine non sostituiscono le braccia, ma le teste. Immagina: se un programma scrivesse i contratti meglio di un avvocato, gli avvocati che fine farebbero?"
      goals: [opinion]
    - learner: "I più bravi si occuperebbero dei casi complessi o darebbero letture all'università, gli altri farebbero fatica. Ma non darei per scontato che i clienti si fidino di un programma per questioni come un divorzio o un'eredità."
      errors: [false-friend]
    # agree: content
    - tutor: "I più bravi terrebbero lezioni all'università, certo, e neanch'io darei per scontato che i clienti si fidino, per un divorzio. Ma per un affitto o un contratto semplice? Lì il prezzo conta più della fiducia."
      recast: {text: "darebbero letture", fix: "terrebbero lezioni", tags: [false-friend]}
      goals: [hypothesis]
    # decoy: «assumete» means «hire», its correct sense
    - learner: "Lì forse sì. Ma tu, che hai uno studio di commercialisti, come la vivi? Avete già cominciato a usare questi programmi, o assumete ancora praticanti?"
    - tutor: "Sì, da un anno: le pratiche semplici le prepara il programma e noi le controlliamo. Abbiamo ridotto gli straordinari, ma nessuno è stato licenziato. Hai un esempio contrario?"
    - learner: "Un esempio ce l'ho: mia sorella faceva la traduttrice tecnica, e qualche anno fa ha trovato fuori che i suoi clienti storici mandavano tutto a una traduzione automatica."
      errors: [word-choice]
    - tutor: "E quando ha scoperto che i clienti la scavalcavano, che cosa ha fatto? Ha cambiato mestiere?"
      recast: {text: "ha trovato fuori", fix: "ha scoperto", tags: [word-choice]}
      goals: [example]
    # decoy: «ha realizzato il sogno» is the correct sense of «realizzare»
    - learner: "Si è reinventata: adesso rivede i testi tradotti dalle macchine, guadagna meno di prima, ma ha realizzato il sogno di lavorare dalla campagna, in Umbria."
    - tutor: "Meno soldi e più campagna: c'è chi firmerebbe subito. Ma tirando le somme, tu da che parte stai?"
    - learner: "Sto nel mezzo. Da una parte credo che il lavoro non sparirà; sull'altra mano, se nessuno governa la transizione, pagheranno sempre i soliti. E tu, alla fine, che ne pensi?"
      errors: [word-choice]
    - tutor: "Dall'altra, dici, pagheranno i soliti, e su questo ti do ragione. Io resto pessimista, ma un po' meno di prima: brindiamo a una transizione governata, se mai arriverà."
      recast: {text: "sull'altra mano", fix: "dall'altra", tags: [word-choice]}
      goals: [conclude]

- scenario: intelligenza-artificiale
  # facts: il learner lavora in una cooperativa; con il software per i turni serviva più gente in magazzino; nell'ufficio dell'amico, con un software simile, bastavano due persone invece di tre; da loro la domanda cresceva, nell'ufficio dell'amico era ferma; accordo finale: servono regole e una riforma del lavoro portata a termine in fretta
  level: C2
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, ma credo che confondiamo due cose: la tecnologia in sé e l'uso che ne fanno le aziende. La prima non decide niente; il secondo lo decidiamo, o dovremmo deciderlo, noi."
    - tutor: "Belle parole, ma le aziende decidono da sole da sempre. Su che cosa basi questo ottimismo?"
      goals: [position]
    - learner: "Mi baso su quello che succede nella cooperativa dove lavoro: quando abbiamo introdotto il software per i turni, ci siamo dati conto che serviva più gente in magazzino, non meno."
      errors: [word-choice]
    - tutor: "Curioso: anche nel mio ufficio, con un software simile, ci siamo resi conto di una cosa, ma del contrario, cioè che bastavano due persone invece di tre. Chi ha ragione, allora?"
      recast: {text: "ci siamo dati conto", fix: "ci siamo resi conto", tags: [word-choice]}
      goals: [evidence]
    # decoy: «la domanda» means «demand», its correct sense
    - learner: "Forse tutti e due, perché dipende dal settore. Da noi la domanda cresceva, quindi il software ha liberato tempo per servire più clienti; da voi la domanda era ferma, e il risparmio è diventato un taglio."
    - tutor: "Ammetto che la distinzione regge. Ma la domanda, prima o poi, smette di crescere anche da voi. Che cosa succede allora?"
    - learner: "Allora il problema diventa politico, e non ha niente che vedere con la tecnologia: se la produttività aumenta e gli stipendi no, è una scelta di chi governa."
      errors: [word-choice]
    - tutor: "Che non abbia niente a che vedere con la tecnologia mi sembra troppo: senza quelle macchine il taglio non ci sarebbe stato. Concedimi almeno questo."

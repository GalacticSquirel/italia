# Set r-calque-c1c2, file 5: renting a flat, two supplier negotiations, a wedding planner, a
# restaurant complaint, an exhibition and dinner with the future in-laws. Calques such as
# «basamento», «presupposto» for «budget», «metteva» for «c'era scritto», «in effettivo».
- scenario: trattativa-affitto
  # facts: appartamento al terzo piano senza ascensore, soggiorno luminoso; cantina nel seminterrato con macchie di umidità, il proprietario ha promesso di sistemarla entro l'estate; affitto chiesto novecentocinquanta euro, possibile novecento con contratto quattro più quattro; spese condominiali circa sessanta euro al mese a carico dell'inquilino; preavviso sei mesi con raccomandata, recesso per gravi motivi di lavoro; libretto della caldaia in regola, tecnico questa settimana; proposta scritta domani per email con il rapporto del tecnico
  level: C1
  persona: en-f-student
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Molto, soprattutto la luce del soggiorno. L'unico dubbio è la cantina: mi ha detto che è nel basamento, e ho visto delle macchie di umidità sulle pareti."
      errors: [false-friend]
    - tutor: "Sì, la cantina è nel seminterrato e l'umidità c'è, non glielo nascondo: il proprietario ha promesso di sistemarla entro l'estate. Per il resto la convince?"
      recast: {text: "nel basamento", fix: "nel seminterrato", tags: [false-friend]}
      goals: [interest]
    - learner: "Sì, mi convince. Però novecentocinquanta euro al mese mi sembrano tanti per un terzo piano senza ascensore. Il proprietario sarebbe disposto a scendere un po'?"
    - tutor: "Forse fino a novecento, se lei firma per quattro anni più quattro. Più di così non credo."
    - learner: "Mi sembra una proposta sensibile, ma vorrei che nel contratto fosse scritto chiaramente chi paga le spese condominiali, perché nell'altra casa ho avuto delle sorprese."
      errors: [false-friend]
    # agree: content
    - tutor: "È una proposta ragionevole anche per il proprietario, che cerca un inquilino stabile. Le spese condominiali sono a carico dell'inquilino, circa sessanta euro al mese, e lo scriviamo nero su bianco."
      recast: {text: "una proposta sensibile", fix: "una proposta ragionevole", tags: [false-friend]}
      goals: [negotiate]
    # decoy: «Attualmente» means «al momento», its correct sense
    - learner: "Va bene. E il preavviso? Attualmente lavoro con un contratto a tempo determinato, quindi potrei dover lasciare la città prima dei quattro anni."
    - tutor: "Il preavviso è di sei mesi, con lettera raccomandata, e per gravi motivi di lavoro può recedere in qualsiasi momento. Le va bene così?"
      goals: [conditions]
    - learner: "Mi va bene. Prima di firmare, però, vorrei fare sicuro che la caldaia sia stata controllata, perché l'inverno scorso sono rimasta senza riscaldamento per una settimana."
      errors: [word-choice]
    - tutor: "Il libretto della caldaia è in regola, ma per assicurarmi che funzioni chiamo il tecnico questa settimana. Allora, procediamo con la proposta a novecento euro?"
      recast: {text: "fare sicuro", fix: "assicurarmi", tags: [word-choice]}
    - learner: "Sì, procediamo. Mi prepari pure la proposta scritta: la firmo appena ricevo il rapporto del tecnico, così siamo tutti più tranquilli."
    - tutor: "D'accordo: gliela mando domani per email, insieme al rapporto del tecnico."
      goals: [conclude]

- scenario: trattativa-fornitore
  # facts: aumento del quindici per cento comunicato con due settimane di preavviso; il cartone costa al fornitore il venti per cento in più rispetto a gennaio; clienti da dodici anni, pagamenti sempre puntuali; controproposta del sette per cento con ordini fissi ogni mese e revisione a fine anno; il fornitore arriva al dieci per cento con revisione a fine anno; buste per prodotti senza conservanti incluse nel prezzo; proposta scritta domani; consiglio della cliente lunedì; il fornitore risponde lunedì dalle otto e mezza
  level: C1
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per questo. Un aumento del quindici per cento, comunicato con due settimane di preavviso, per un'azienda piccola come la nostra è molto difficile da assorbire."
    - tutor: "Lo capisco, ma il cartone ci costa il venti per cento in più rispetto a gennaio, e non abbiamo scaricato tutto sui clienti."
      goals: [problem]
    - learner: "Lo so. Però siamo sempre stati clienti consistenti: dodici anni di ordini regolari e nemmeno un pagamento in ritardo, cosa che non tutti possono dire."
      errors: [false-friend]
    # agree: content
    - tutor: "Siete clienti costanti, lo so bene, ed è per questo che ne parliamo direttamente. Che cosa propone?"
      recast: {text: "clienti consistenti", fix: "clienti costanti", tags: [false-friend]}
      goals: [argue]
    # decoy: «in cambio» means «in exchange», its correct sense; «Eventualmente» means «se mai»
    - learner: "Propongo un aumento del sette per cento, e in cambio vi garantiamo ordini fissi ogni mese. Eventualmente, se i costi scendessero, potremmo rivedere il prezzo a fine anno. Lo accettereste?"
    - tutor: "Il sette è troppo poco: posso arrivare al dieci, con la revisione a fine anno che propone lei. Sotto non riesco a scendere."
      goals: [counteroffer]
    - learner: "Il dieci per cento è proprio al limite. Vi chiederei almeno di includere le buste speciali per i prodotti senza preservativi, che oggi paghiamo a parte."
      errors: [false-friend]
    - tutor: "Le buste per i prodotti senza conservanti posso includerle nel prezzo, sì. Allora: dieci per cento, buste incluse, revisione a fine anno. Le sembra un accordo equo?"
      recast: {text: "senza preservativi", fix: "senza conservanti", tags: [false-friend]}
    # decoy: «compromesso» means «compromise», its correct sense
    - learner: "Mi sembra un compromesso accettabile, anche se ai miei soci non farà piacere. Ho bisogno di avere tutto per iscritto, perché lunedì ne discutiamo in consiglio."
    - tutor: "Le mando la proposta domani, così ha tutto il fine settimana per leggerla. Vuole che la mandi anche ai suoi soci?"
    - learner: "No, grazie, la giro io. E se qualcosa non fosse chiaro, la potrei chiamare indietro lunedì mattina, prima del consiglio?"
      errors: [word-choice]
    - tutor: "Certo, mi può richiamare lunedì dalle otto e mezza. Allora l'accordo è questo: dieci per cento, buste incluse e revisione a fine anno."
      recast: {text: "chiamare indietro", fix: "richiamare", tags: [word-choice]}
      goals: [agreement]

- scenario: trattativa-fornitore
  # facts: aumento del quindici per cento; il cliente lavora con il fornitore da sette anni, pagamenti a trenta giorni anche durante la pandemia; consegne discontinue: due ritardi a marzo e uno ad aprile, per un camion fermo; il fornitore arriva al nove per cento con uno sconto del due per cento per ogni consegna in ritardo, prezzo fermo per dodici mesi; contratto domani mattina
  level: C1
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo le materie prime sono aumentate per tutti."
    - learner: "Buongiorno. Sì, e glielo dico subito: con un aumento del quindici per cento il nostro presupposto per gli imballaggi non basta più, e rischiamo di dover cambiare fornitore."
      errors: [false-friend]
    - tutor: "Capisco che il vostro budget non basti più, ma anche cambiare fornitore costa: nuovi formati, nuove prove. Mi dica che cosa le serve davvero."
      recast: {text: "presupposto", fix: "budget", tags: [false-friend]}
      goals: [problem]
    - learner: "Mi serve un prezzo che possa garantire ai miei clienti per tutto l'anno. Siamo con voi da sette anni e abbiamo sempre pagato a trenta giorni, anche durante la pandemia."
    - tutor: "Lo so, e glielo riconosco: siete tra i clienti più puntuali che abbiamo. Ma il quindici per cento non lo decido io, lo decide il mercato."
      goals: [argue]
    - learner: "Allora parliamo anche del servizio: negli ultimi mesi le vostre consegne sono state piuttosto regolari, per non dire scadenti: due ritardi a marzo e uno ad aprile."
      errors: [false-friend]
    # agree: content
    - tutor: "Ammetto che le consegne sono state piuttosto mediocri, e me ne scuso: avevamo un camion fermo. Che cosa propone, concretamente?"
      recast: {text: "piuttosto regolari", fix: "piuttosto mediocri", tags: [false-friend]}
    - learner: "Propongo un aumento del sei per cento e uno sconto del due per cento per ogni consegna in ritardo. Lei fin dove può arrivare, senza consultare la direzione?"
    - tutor: "Senza consultare la direzione posso arrivare al nove per cento, con lo sconto sui ritardi che propone. Oltre, devo chiedere."
      goals: [counteroffer]
    - learner: "Il nove per cento con lo sconto lo accetto, ma solo se il prezzo resta fermo per dodici mesi: mi sono dato conto che ogni rinegoziazione ci costa settimane di lavoro."
      errors: [word-choice]
    - tutor: "Me ne sono reso conto anch'io: ogni rinegoziazione costa tempo a tutti e due. Va bene, dodici mesi a prezzo fermo."
      recast: {text: "dato conto", fix: "reso conto", tags: [word-choice]}
    - learner: "Allora siamo d'accordo. Mi mandi il contratto entro giovedì, così lo firmo prima della chiusura del mese."
    - tutor: "Glielo mando domani mattina. Grazie della franchezza, e mi scusi ancora per i ritardi."
      goals: [agreement]

- scenario: organizzare-matrimonio
  # facts: coppia fidanzata da due anni; cerimonia all'aperto, una sessantina di invitati; budget venticinquemila euro compreso il pranzo; a giugno tutto costa il trenta per cento in più che a settembre; data a settembre; un agriturismo vicino a Siena e una vecchia tenuta vicino a Cortona, la tenuta costa circa quattromila euro in più; scelto l'agriturismo, con camere per gli ospiti stranieri; menu almeno per metà vegetariano, modificabile fino a trenta giorni prima senza penali; anticipo in due rate, metà alla firma e metà a giugno; contratto entro venerdì
  level: C1
  persona: en-f-student
  history: [false-friend, word-choice]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    # decoy: «finalmente» means «at last», its correct sense; only «ingaggiati» is wrong
    - learner: "Grazie! Siamo ingaggiati da due anni e finalmente abbiamo deciso: vorremmo una cerimonia piccola, all'aperto, con una sessantina di invitati al massimo."
      errors: [false-friend]
    - tutor: "Fidanzati da due anni e una cerimonia all'aperto per sessanta persone: un'idea bellissima. Avete già pensato a un budget?"
      recast: {text: "ingaggiati", fix: "fidanzati", tags: [false-friend]}
      goals: [vision]
    - learner: "Pensavamo a venticinquemila euro in tutto, compreso il pranzo. È una cifra realistica, secondo lei, per sessanta persone in Toscana?"
    - tutor: "È realistica, se scegliamo bene la stagione: a giugno costa tutto il trenta per cento in più che a settembre. Avete una data in mente?"
      goals: [budget]
    - learner: "Settembre va benissimo. Abbiamo visto online due posti: un agriturismo vicino a Siena e una vecchia estate vicino a Cortona, con un giardino enorme."
      errors: [false-friend]
    - tutor: "Li conosco entrambi. Una vecchia tenuta come quella di Cortona è splendida, ma costa circa quattromila euro in più dell'agriturismo. Quale vi piace di più?"
      recast: {text: "una vecchia estate", fix: "una vecchia tenuta", tags: [false-friend]}
    # decoy: «conveniente» means «vantaggioso», its correct sense
    - learner: "L'agriturismo è più conveniente e ha anche le camere per gli ospiti che vengono dall'estero, che sono quasi la metà. Credo che sceglieremo quello."
    - tutor: "Una scelta comoda per chi viene da lontano. Allora: agriturismo vicino a Siena, settembre, sessanta persone. Ci sono condizioni particolari che volete fissare con me?"
      goals: [choices]
    - learner: "Sì, due. Vorremmo un menu almeno per metà vegetariano, e poi, siccome mio padre cambia la mente ogni settimana, la possibilità di modificarlo fino a un mese prima, senza penali."
      errors: [word-choice]
    - tutor: "Il menu per metà vegetariano non è un problema, e chi cambia idea può farlo fino a trenta giorni prima, senza penali. Metto queste condizioni nel contratto?"
      recast: {text: "cambia la mente", fix: "cambia idea", tags: [word-choice]}
      goals: [conditions]
    - learner: "Sì, per favore. E se possibile vorremmo pagare l'anticipo in due rate: ci aiuterebbe molto, perché stiamo ancora salvando per il viaggio di nozze."
      errors: [word-choice]
    - tutor: "Se state risparmiando per il viaggio di nozze, l'anticipo in due rate si può fare: metà alla firma e metà a giugno. Vi mando il contratto entro venerdì."
      recast: {text: "salvando", fix: "risparmiando", tags: [word-choice]}

- scenario: recensione-ristorante
  # facts: attesa di cinquanta minuti per i secondi, pesce tiepido; ordinati due orate al forno e una tagliata; contorno di patate e carciofi servito senza carciofi, senza avvisare; vino bianco arrivato quasi a temperatura ambiente; offerta: dolci e vino offerti oppure sconto del trenta per cento; scelto lo sconto, il dolce offerto comunque; in cucina due cuochi malati non sostituiti; compleanno del marito a maggio; tavolo vicino alla finestra
  level: C1
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, mi dispiace doverla disturbare, ma abbiamo aspettato cinquanta minuti i secondi, e quando sono arrivati il pesce era tiepido."
    - tutor: "Mi dispiace davvero, cinquanta minuti sono troppi. Mi può dire che cosa avevate ordinato, esattamente?"
      goals: [complain]
    - learner: "Due orate al forno e una tagliata. Nel menù metteva che l'orata era servita con patate e carciofi, ma i carciofi non c'erano, e nessuno ci ha avvisato."
      errors: [false-friend]
    - tutor: "Se nel menù c'era scritto patate e carciofi, i carciofi dovevano esserci, o almeno dovevate essere avvisati: non doveva succedere. Ci sono stati altri problemi?"
      recast: {text: "metteva", fix: "c'era scritto", tags: [false-friend]}
      goals: [detail]
    # decoy: «Non pretendo» means «non esigo», its correct sense
    - learner: "Sì, il vino. Avevamo chiesto un bianco fresco e ci è arrivato quasi a temperatura ambiente. Non pretendo la perfezione, ma da un ristorante di questo livello mi aspettavo di più."
    - tutor: "Ha ragione, e non cerco scuse. Posso offrirvi i dolci e il vino, oppure uno sconto del trenta per cento sul conto: che cosa preferisce?"
      goals: [expectation]
    - learner: "Il dolce lo accettiamo volentieri, ma preferirei lo sconto: tra l'altro avevamo già lasciato una buona propina al cameriere, che non ha nessuna colpa."
      errors: [word-choice]
    - tutor: "Una buona mancia a un cameriere che non ha colpa: molto gentile da parte sua. Allora sconto del trenta per cento, e il dolce lo offriamo comunque."
      recast: {text: "una buona propina", fix: "una buona mancia", tags: [word-choice]}
      goals: [resolve]
    - learner: "Grazie, è un gesto che apprezzo. Posso chiederle se il problema in cucina è stato occasionale, o se devo aspettarmi la stessa cosa la prossima volta?"
    - tutor: "Occasionale: due cuochi erano malati e non siamo riusciti a sostituirli. La prossima volta chieda di me, e il tavolo vicino alla finestra glielo tengo io."
    - learner: "Allora torneremo, magari a maggio per il compleanno di mio marito. E per favore, dica al cuoco che la tagliata, almeno, era esquisita."
      errors: [word-choice]
    - tutor: "Riferirò in cucina che la tagliata era squisita, farà piacere a tutti. Vi aspettiamo a maggio, allora, e buona serata."
      recast: {text: "esquisita", fix: "squisita", tags: [word-choice]}

- scenario: arte-mostra
  # facts: ritratto di un uomo potente che guarda dall'alto in basso; mani magre che tengono una lettera stropicciata; in un angolo una finestra aperta su un paesaggio minuscolo con un fiume e un ponte; luce morbida sul viso; pittore italiano che aveva visto molti fiamminghi, luce veneta; catalogo in vendita anche sul sito del museo a trentacinque euro; Giovanni offre la visita guidata alla moglie del learner
  level: C2
  persona: en-m-retired
  history: [false-friend, word-choice]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    # decoy: «la simpatia» means «liking», its correct sense
    - learner: "A prima vista mi è antipatico, lo confesso: quell'uomo ci guarda dall'alto in basso, come se fossimo noi a dover essere giudicati. Poi però, piano piano, arriva una certa simpatia."
    - tutor: "Succede spesso con i ritratti di quest'epoca: prima respingono, poi incuriosiscono. Che cosa ti ha fatto cambiare idea?"
      goals: [react]
    - learner: "Le mani: sono magre, nervose, e stringono una lettera stropicciata. Mi sembra un uomo potente ma profondamente annoiato, come se quel foglio gli avesse rovinato la giornata."
      errors: [false-friend]
    - tutor: "Potente ma profondamente irritato: la lettera stropicciata lo suggerisce, sì. Hai notato che cosa c'è dietro di lui, nell'angolo?"
      recast: {text: "profondamente annoiato", fix: "profondamente irritato", tags: [false-friend]}
      goals: [describe]
    - learner: "Una finestra aperta su un paesaggio minuscolo, con un fiume e un ponte. È curioso: tutto il quadro è chiuso e scuro, e soltanto lì c'è un po' d'aria."
    - tutor: "Ecco la chiave, secondo me. Che cosa ne ricavi, se metti insieme la lettera e la finestra?"
    - learner: "Direi che possibilmente la lettera porta una cattiva notizia, e la finestra è il desiderio di fuggire da quella stanza, e forse anche dal ruolo che è costretto a recitare."
      errors: [false-friend]
    # agree: content
    - tutor: "Forse, sì: una cattiva notizia e la voglia di scappare. Io aggiungerei che il pittore lo compatisce: guarda con che luce gli illumina il viso. Ti ricorda qualche altro ritratto?"
      recast: {text: "possibilmente", fix: "forse", tags: [false-friend]}
      goals: [interpret]
    - learner: "Mi ricorda certi ritratti fiamminghi, per la precisione dei dettagli, ma la luce è più morbida. Tu che lo studi da anni, lo attribuiresti a un pittore del nord o a un italiano?"
    - tutor: "A un italiano che aveva visto molti fiamminghi: la precisione è nordica, ma quella luce morbida è veneta. È proprio questo incrocio che lo rende raro."
      goals: [compare]
    - learner: "Allora devo tornare con mia moglie, che di pittura veneta sa più di me. Per la via, sai se il catalogo della mostra si può comprare anche online?"
      errors: [word-choice]
    - tutor: "Sì, si compra anche sul sito del museo, a trentacinque euro. A proposito, se tornate insieme, la visita ve la faccio io."
      recast: {text: "Per la via", fix: "A proposito", tags: [word-choice]}

- scenario: trattativa-affitto
  # facts: terrazza, serramenti vecchi, cucina da rifare; il proprietario è disposto a cambiare i serramenti, non la cucina; altre due visite questa settimana; affitto chiesto mille e cento euro; la learner propone novecentocinquanta e di rifare la cucina a sue spese con detrazione dall'affitto nei primi due anni; il proprietario potrebbe accettare mille euro con detrazione fino a seimila; contratto quattro più quattro; preavviso sei mesi con raccomandata o posta certificata per gravi motivi; caparra: contanti fino al limite di legge, consigliato il bonifico
  level: C2
  persona: es-f-erasmus
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Mi è piaciuto molto, soprattutto la terrazza, anche se i serramenti sono vecchi e la cucina andrebbe rifatta. Prima di parlare di cifre, vorrei capire se il proprietario è disposto a fare qualche lavoro."
    - tutor: "Il proprietario è disposto a cambiare i serramenti, non la cucina. Le dico subito, però, che ci sono altre due visite questa settimana."
      goals: [interest]
    - learner: "Capisco, ma mille e cento euro di rendita al mese, con una cucina da rifare, mi sembrano decisamente fuori mercato per questa zona."
      errors: [false-friend]
    - tutor: "Mille e cento euro di affitto sono in linea con la zona, mi creda: due vie più in là chiedono di più per meno metri. Lei quanto avrebbe in mente?"
      recast: {text: "di rendita", fix: "di affitto", tags: [false-friend]}
    - learner: "Novecentocinquanta, e la cucina la rifaccio io a mie spese, a patto che il costo venga detratto dall'affitto nei primi due anni. Così il proprietario si ritrova un appartamento rivalutato senza spendere un euro."
    - tutor: "Proposta intelligente. Credo che il proprietario potrebbe accettare mille euro, con la detrazione delle spese della cucina fino a un massimo di seimila. Che ne dice?"
      goals: [negotiate]
    - learner: "Mille va bene. Però vorrei un contratto di quattro anni più quattro, perché non ho nessuna voglia di traslocare di nuovo fra due anni: mi molesta solo l'idea."
      errors: [false-friend]
    - tutor: "Un trasloco ogni due anni infastidisce chiunque, e il quattro più quattro è proprio quello che il proprietario preferisce. Ha altre richieste?"
      recast: {text: "molesta", fix: "infastidisce", tags: [false-friend]}
    - learner: "Sì, il preavviso. Se dovessi trasferirmi per lavoro prima della scadenza, quanto tempo prima dovrei avvisare, e con quali formalità?"
    - tutor: "Sei mesi prima, con raccomandata o posta certificata, e solo per gravi motivi, come un trasferimento di lavoro. Lo scriviamo chiaramente nel contratto."
      goals: [conditions]
    - learner: "Benissimo. Posso lasciare la caparra oggi stesso? Preferirei pagare in effettivo, se per l'agenzia non è un problema."
      errors: [word-choice]
    - tutor: "In contanti si può, fino al limite di legge, ma le consiglio un bonifico: resta traccia per tutti e due. Preparo la proposta con mille euro, cucina a sue spese con detrazione fino a seimila, e quattro più quattro."
      recast: {text: "in effettivo", fix: "in contanti", tags: [word-choice]}
      goals: [conclude]

- scenario: cena-suoceri
  # facts: la moglie del padrone di casa prepara il ragù da ieri mattina; il learner ha imparato a cucinare all'università di Edimburgo con sei ragazzi italiani; è ingegnere ambientale, progetta impianti di depurazione per i comuni; tornerebbe in Inghilterra solo per le vacanze; il padre della partner si chiama Franco e propone il tu
  level: C2
  persona: en-m-traveller
  history: [false-friend, word-choice]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Le assicuro che sono in carne e ossa, anche se stasera un po' emozionato. Grazie per l'invito: la casa è bellissima, e dalla cucina arriva un profumo che mi ha già conquistato."
    - tutor: "Il merito è tutto di mia moglie: il ragù lo prepara da ieri mattina. Lei cucina, o si limita ad apprezzare?"

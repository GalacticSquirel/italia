# Set r-calque-c1c2, file 6: a complaint at the town hall, debates on closing the centre to cars,
# radio phone-ins on overtourism and two building meetings. Calques such as «pavimento» for
# «marciapiede», «ufficiale» for «funzionario», «competenza» for «concorrenza», «rata» for «tasso».
- scenario: reclamo-comune
  # facts: il learner abita in via Cavour 18; cantiere abbandonato da due mesi, marciapiede distrutto; la madre, ottantadue anni, è caduta martedì, distorsione; già due segnalazioni dei vicini; tre settimane fa l'ufficio tecnico non aveva dato una data; risarcimento: referto del pronto soccorso, foto, modulo, risposta entro novanta giorni; i lavori riprendono lunedì 14 con una ditta nuova; protocollo 20417
  level: C1
  persona: en-m-heritage
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via Cavour, al numero 18. Da due mesi davanti a casa c'è un cantiere abbandonato, e il pavimento è completamente distrutto: mia madre, che ha ottantadue anni, è caduta martedì."
      errors: [false-friend]
    - tutor: "Mi dispiace molto per sua madre. Il marciapiede distrutto davanti al civico 18 è già segnalato, vedo qui due richieste dei vicini. Come sta, adesso?"
      recast: {text: "il pavimento", fix: "il marciapiede", tags: [false-friend]}
    # decoy: «eventualmente» means «se è il caso», its correct sense
    - learner: "Sta meglio, grazie, ha solo una distorsione. Ma vorrei sapere quando riprendono i lavori e chi risponde dei danni, eventualmente anche delle spese mediche."
    - tutor: "La ripresa dei lavori dipende dall'ufficio tecnico, e in questo momento non ho una data. Per i danni può presentare una richiesta di risarcimento al Comune."
      goals: [describe]
    - learner: "Mi scusi, ma «non ho una data» è la stessa risposta che un ufficiale del vostro ufficio tecnico ha dato ai miei vicini tre settimane fa. Non è accettabile."
      errors: [false-friend]
    # agree: content
    - tutor: "Capisco che la risposta di un funzionario, tre settimane fa, non le basti, e ha ragione a pretendere di più. Se aspetta cinque minuti, chiamo adesso l'ufficio tecnico."
      recast: {text: "un ufficiale", fix: "un funzionario", tags: [false-friend]}
      goals: [insist]
    - learner: "Aspetto volentieri. Intanto, mi spiega come funziona la richiesta di risarcimento? Servono documenti particolari?"
    - tutor: "Servono il referto del pronto soccorso, alcune foto del punto in cui è caduta e un modulo che le do adesso. Il Comune risponde entro novanta giorni."
      goals: [rights]
    - learner: "Ho già preso delle foto la sera stessa, con il telefono di mio figlio, e si vede benissimo il buco in cui è finito il piede di mia madre."
      errors: [word-choice]
    - tutor: "Bene, se ha già fatto delle foto la sera stessa, le alleghi al modulo. Ho appena sentito l'ufficio tecnico: i lavori riprendono lunedì 14, con una ditta nuova."
      recast: {text: "preso delle foto", fix: "fatto delle foto", tags: [word-choice]}
    - learner: "Lunedì 14, d'accordo. Mi può dare un numero di protocollo per il reclamo, così se lunedì non si vede nessuno so a chi rivolgermi?"
    - tutor: "Certo: il protocollo è il 20417, e lo trova anche sulla ricevuta. Se lunedì il cantiere è ancora fermo, chiami questo numero e chieda di me."
      goals: [commitment]

- scenario: dibattito-ambiente
  # facts: proposta della learner: zona pedonale, mezzi pubblici e parcheggio di scambio, pubblicità comune dei negozi; in via Garibaldi smog oltre i limiti per quaranta giorni l'anno scorso; autobus elettrici; concorrenza dei centri commerciali in periferia; compromesso: chiusura nei fine settimana, carico e scarico la mattina presto, telecamere agli accessi; proposta da portare insieme all'assessore
  level: C1
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io la penso diversamente. Credo che una zona pedonale renderebbe il centro più vivibile, soprattutto per le famiglie con bambini e per gli anziani, che oggi hanno paura ad attraversare."
    - tutor: "Più vivibile per chi ci abita, forse. Ma chi viene da fuori a fare acquisti, come ci arriva?"
      goals: [position]
    - learner: "Con i mezzi pubblici e con un parcheggio di scambio all'ingresso della città. E poi i negozi potrebbero farsi pubblicità insieme, con un unico marchio del casco antico."
      errors: [false-friend]
    - tutor: "Un marchio del centro storico costa, e i piccoli negozi questi soldi non li hanno. Ha un secondo argomento?"
      recast: {text: "del casco antico", fix: "del centro storico", tags: [false-friend]}
    # decoy: «argomento» means «ragione», its correct sense
    - learner: "Il secondo argomento è la salute: in via Garibaldi le centraline hanno misurato livelli di smog oltre i limiti per quaranta giorni l'anno scorso. Non le sembra un dato preoccupante?"
    - tutor: "Il dato è preoccupante, non lo nego. Ma lo smog lo fanno anche gli autobus vecchi, non solo le auto dei clienti."
      goals: [argue]
    - learner: "Proprio per questo chiederei autobus elettrici. E poi, se non facciamo niente, la competenza dei centri commerciali in periferia finirà per svuotare il centro comunque."
      errors: [false-friend]
    # agree: content
    - tutor: "La concorrenza dei centri commerciali è il vero nemico, su questo le do ragione. Ma allora perché togliere ai negozi del centro l'unico vantaggio, cioè il parcheggio sotto casa?"
      recast: {text: "la competenza dei centri commerciali", fix: "la concorrenza dei centri commerciali", tags: [false-friend]}
      goals: [counter]
    - learner: "Le concedo che il parcheggio è importante, soprattutto per chi fa la spesa grossa. Potremmo chiudere il centro solo nei fine settimana, e lasciare libero il carico e scarico la mattina presto."
    - tutor: "Una proposta su cui si può ragionare. Ma chi controlla che il carico e scarico non diventi una scusa per entrare tutti?"
      goals: [concede]
    - learner: "Le telecamere agli accessi, come in altre città. Al meglio non sarà perfetto all'inizio, ma è un primo passo che si può correggere strada facendo."
      errors: [word-choice]
    - tutor: "Forse non sarà perfetto, ma un primo passo con le telecamere mi sembra onesto. Proponiamolo insieme all'assessore, allora."
      recast: {text: "Al meglio", fix: "Forse", tags: [word-choice]}

- scenario: dibattito-ambiente
  # facts: il residente lavora in centro da trent'anni; proposta: chiudere le tre vie principali e trasformare piazza del Mercato, oggi parcheggio con trenta posti, in uno spazio con alberi e panchine; parcheggio sotterraneo vicino alla stazione, a cinque minuti a piedi, con fondi europei; l'anno scorso due ciclisti investiti in via Roma; sconto sulla tassa dei rifiuti per due anni e navetta gratuita
  level: C1
  persona: en-m-traveller
  history: [false-friend, word-choice]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei che cosa ne pensa?"
    - learner: "Penso il contrario. Il centro, così com'è adesso, è uno scherzo: macchine in doppia fila ovunque, clacson tutto il giorno e marciapiedi così stretti che si cammina in strada."
      errors: [false-friend]
    - tutor: "Una barzelletta, addirittura? Io ci lavoro da trent'anni e mi sembra un centro come tanti. Che cosa propone, esattamente?"
      recast: {text: "uno scherzo", fix: "una barzelletta", tags: [false-friend]}
    - learner: "Propongo di chiudere al traffico le tre vie principali e di trasformare piazza del Mercato, che oggi è un parcheggio, in uno spazio con alberi e panchine."
    - tutor: "E i trenta posti auto di piazza del Mercato dove li mettiamo? I miei clienti anziani non fanno chilometri a piedi."
      goals: [position]
    - learner: "Si potrebbe costruire un parcheggio sotterraneo vicino alla stazione, a cinque minuti a piedi. Definitivamente è una spesa, ma il Comune ha già i fondi europei per la mobilità."
      errors: [false-friend]
    # agree: content
    - tutor: "Sicuramente è una spesa, e i fondi europei hanno tempi lunghi. Ha un secondo argomento, oltre agli alberi?"
      recast: {text: "Definitivamente", fix: "Sicuramente", tags: [false-friend]}
    - learner: "Sì, la sicurezza. L'anno scorso due ciclisti sono stati investiti in via Roma. Lei sa quanti incidenti ci sono stati in centro negli ultimi cinque anni?"
    - tutor: "Non ho i numeri precisi, e non glieli invento: so solo che quello di via Roma è stato il più grave. Ammetto che la sicurezza è un problema."
      goals: [argue]
    - learner: "Allora dobbiamo confrontare il problema subito, prima che succeda qualcosa di peggio, invece di aspettare che si risolva da solo."
      errors: [false-friend]
    - tutor: "Affrontare il problema sì, ma con i commercianti al tavolo, non contro di loro. Che cosa farebbe per chi ha un negozio e teme di perdere clienti?"
      recast: {text: "confrontare il problema", fix: "affrontare il problema", tags: [false-friend]}
      goals: [counter]
    - learner: "Ha ragione, senza di loro non funzionerebbe. Per i primi due anni proporrei uno sconto sulla tassa dei rifiuti per i negozi del centro, e una navetta gratuita dal nuovo parcheggio."
    - tutor: "Sconto e navetta: così il discorso cambia. Lo porti all'assemblea, e io almeno l'ascolto."
      goals: [concede]

- scenario: turismo-di-massa
  # facts: il learner lavora alla reception di un albergo a Venezia da dieci anni, contrario al ticket; problema vero: gli affitti brevi; la reception risponde ogni giorno alle domande di turisti confusi su chi deve pagare; proposta: limite di novanta notti l'anno per gli affitti brevi nel centro storico, ticket solo nei giorni di massima affluenza, incentivi a chi affitta a residenti e studenti
  level: C1
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno! Che emozione parlare in vivo alla radio. Lavoro alla reception di un albergo a Venezia da dieci anni, e sono contrario al ticket."
      errors: [word-choice]
    - tutor: "In diretta, e senza rete! Contrario, ci dice: e perché, se lavora proprio con i turisti?"
      recast: {text: "in vivo", fix: "in diretta", tags: [word-choice]}
      goals: [introduce]
    - learner: "Perché il ticket colpisce chi viene per un giorno solo, ma non risolve il vero problema, che sono gli affitti brevi: i veneziani se ne vanno perché le case diventano tutte appartamenti per turisti."
    - tutor: "Ma il ticket almeno scoraggia chi viene per un giorno solo e riempie i vaporetti. Ha un esempio concreto di quello che dice?"
    - learner: "Sì: alla reception dobbiamo contestare ogni giorno le domande di turisti confusi, che non capiscono chi deve pagare il ticket e chi no, e se la prendono con noi, che non c'entriamo niente."
      errors: [false-friend]
    # agree: content
    - tutor: "Dover rispondere ogni giorno alle domande di turisti confusi è pesante, lo ammetto, e la colpa è di una comunicazione sbagliata. Ma questo si risolve con informazioni migliori, non eliminando il ticket."
      recast: {text: "contestare ogni giorno le domande", fix: "rispondere ogni giorno alle domande", tags: [false-friend]}
      goals: [example]
    # decoy: «le competenze» means «i poteri», its correct sense
    - learner: "Le informazioni non bastano. Il ticket è una misura di immagine: il Comune ha le competenze per limitare gli affitti brevi e non lo fa, perché i proprietari votano."
    - tutor: "Un'accusa forte, in diretta. Ma se toccasse a lei decidere, che cosa farebbe al posto del ticket?"
      goals: [rebut]
    - learner: "Metterei un limite di novanta notti l'anno per gli affitti brevi nel centro storico. Di tutte le forme, il ticket lo terrei solo nei giorni di massima affluenza, come ponti e festività."
      errors: [word-choice]
    - tutor: "Comunque, un ticket solo nei giorni di punta è già un compromesso. E i proprietari che vivono di quegli affitti, come li convince?"
      recast: {text: "Di tutte le forme", fix: "Comunque", tags: [word-choice]}
    - learner: "Con incentivi per chi affitta ai residenti o agli studenti. Lei crede che una proposta così abbia qualche possibilità, o il Comune la ignorerebbe?"
    - tutor: "Sinceramente credo che la ignorerebbe, ma oggi l'ha detta a migliaia di ascoltatori, e non è poco. Grazie della telefonata!"
      goals: [proposal]

- scenario: assemblea-condominio
  # facts: la learner non è contraria al rifacimento della facciata ma vuole rinviarlo di un anno, per le rate del riscaldamento appena approvate; il signor Bianchi, terzo piano, accusa chi vuole rinviare; l'ultimo pezzo di facciata è caduto sul marciapiede a maggio; messa in sicurezza circa dodicimila euro, rifacimento completo centottantamila; proposta: messa in sicurezza subito, rifacimento l'anno prossimo con i bonus; delibera definitiva entro marzo, lavori entro settembre
  level: C2
  persona: en-f-professional
  history: [word-choice, false-friend]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Non sono contraria al rifacimento della facciata in sé, ma vorrei che lo rinviassimo di un anno: con le rate del riscaldamento appena approvate, molte famiglie non ce la farebbero."
    - tutor: "La sua posizione è chiara. Però il signor Bianchi, al terzo piano, dice che chi vuole rinviare è solo chi non vuole pagare. Che cosa gli risponde?"
      goals: [position]
    - learner: "Gli rispondo con calma che non la prendo come personale: capisco la sua impazienza, ma qui nessuno vuole sottrarsi ai propri doveri, tanto meno io."
      errors: [word-choice]
    - tutor: "Se non la prende sul personale, tanto meglio: la sua calma aiuta tutti. Ma la facciata perde pezzi, e l'ultimo è caduto sul marciapiede a maggio."
      recast: {text: "come personale", fix: "sul personale", tags: [word-choice]}
      goals: [defuse]
    - learner: "Lo so, e nessuno vuole aspettare un incidente. Mi può dire quanto costerebbe mettere in sicurezza solo le parti pericolanti, senza rifare tutta la facciata?"
    - tutor: "Il geometra ha stimato circa dodicimila euro per la messa in sicurezza, contro i centottantamila del rifacimento completo."
    - learner: "Allora propongo questo: dodicimila euro subito per la messa in sicurezza, e il rifacimento l'anno prossimo, quando potremo approfittare anche dei bonus fiscali. Così uccidiamo due uccelli con una pietra."
      errors: [word-choice]
    - tutor: "Così, dice lei, prendiamo due piccioni con una fava: sicurezza adesso e bonus dopo. Qualcuno però teme che «l'anno prossimo» diventi «mai»."
      recast: {text: "uccidiamo due uccelli con una pietra", fix: "prendiamo due piccioni con una fava", tags: [word-choice]}
      goals: [alternative]
    # decoy: «delibera definitiva» uses «definitivo» in its correct sense
    - learner: "Capisco il timore di un rinvio infinito. Per questo chiederei di mettere a verbale una data precisa: delibera definitiva entro marzo, lavori entro settembre, anche senza i bonus."
    - tutor: "Una data a verbale tranquillizza anche il signor Bianchi. Vogliamo votare subito questa proposta?"
    - learner: "Sì, chiamiamo un voto adesso, per alzata di mano, prima che la gente cominci ad andarsene e domani qualcuno dica che non era d'accordo."
      errors: [word-choice]
    - tutor: "Mettiamo ai voti, allora: chi è favorevole alzi la mano. La maggioranza c'è, e lo scrivo a verbale con le date di marzo e settembre."
      recast: {text: "chiamiamo un voto", fix: "mettiamo ai voti", tags: [word-choice]}
      goals: [compromise]

- scenario: assemblea-condominio
  # facts: il learner abita al secondo piano con il padre, in pensione da tre anni con la minima; la signora Ferri insinua che chi non ha soldi può vendere; proposta: trentasei rate invece di dodici; la ditta vuole essere pagata in dodici mesi; per il tetto il condominio aveva ottenuto un tasso del quattro per cento; l'amministratore chiederà due preventivi a due banche e li presenterà alla prossima assemblea; a verbale: messa in sicurezza urgente subito, finanziamento in trentasei rate se le condizioni lo permettono
  level: C2
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Abito al secondo piano con mio padre, che è in pensione da tre anni: è una persona maggiore, vive con la minima, e per lui la quota della facciata è semplicemente impossibile."
      errors: [false-friend]
    - tutor: "Capisco: per una persona anziana che vive con la minima, la quota pesa molto. La signora Ferri, però, sussurra che chi non ha i soldi può sempre vendere. Che cosa le risponde?"
      recast: {text: "una persona maggiore", fix: "una persona anziana", tags: [false-friend]}
      goals: [position]
    - learner: "Le rispondo che la capisco, anche se il tono mi è sembrato un po' duro. Nessuno qui vuole rovinare il palazzo: chiediamo tempo, non un regalo."
    - tutor: "Risposta elegante, la ringrazio. Allora, in concreto, che cosa propone?"
      goals: [defuse]
    - learner: "Propongo di pagare la facciata in trentasei rate invece di dodici. Per il condominio è la stessa inversione, ma per le famiglie la spesa mensile diventa un terzo."
      errors: [false-friend]
    - tutor: "Per il condominio è lo stesso investimento, è vero, ma la ditta vuole essere pagata in dodici mesi. Chi anticipa la differenza?"
      recast: {text: "la stessa inversione", fix: "lo stesso investimento", tags: [false-friend]}
      goals: [alternative]
    # decoy: «convenienti» means «vantaggiose», its correct sense
    - learner: "Potremmo chiedere un finanziamento alla banca a nome del condominio. Lei sa se l'ultima volta, per il tetto, le condizioni erano state convenienti?"
    - tutor: "Per il tetto avevamo ottenuto un tasso del quattro per cento, che allora era conveniente. Oggi dovrei chiedere nuovi preventivi."
    - learner: "Se lei chiede i preventivi a due banche, alla prossima assemblea ci insegna le condizioni e decidiamo con i numeri in mano, senza litigare."
      errors: [false-friend]
    - tutor: "D'accordo: chiedo due preventivi, e la prossima assemblea si apre con una tabella che mostra le condizioni di entrambe le banche. Mettiamo a verbale qualcosa già stasera?"
      recast: {text: "insegna", fix: "mostra", tags: [false-friend]}
    - learner: "Sì: messa in sicurezza urgente subito, e per il resto finanziamento in trentasei rate, se le condizioni delle banche lo permettono."
    - tutor: "Lo metto a verbale così. Chi è favorevole alzi la mano: mi sembra la maggioranza. Approvato."
      goals: [compromise]

- scenario: turismo-di-massa
  # facts: la learner è una ricercatrice di turismo urbano, favorevole al ticket come strumento di misura; il ticket collegato alla prenotazione permette di incrociare i flussi con il tasso di occupazione degli alberghi; il suo gruppo ha studiato due città del nord Europa; chi dorme in città non paga; l'anno scorso i commercianti si sono fatti sentire, il sindaco ha fatto marcia indietro; proposta: ticket modulato e fondo per la casa dei residenti, gestito da un comitato misto
  level: C2
  persona: en-f-professional
  history: [false-friend, word-choice]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    # decoy: «attualmente» means «al momento», its correct sense
    - learner: "Buongiorno. Sono una ricercatrice e attualmente mi occupo di turismo urbano. Sono a favore del ticket, ma solo come strumento di misura, non come soluzione: senza dati, ogni discussione resta ideologica."
    - tutor: "Strumento di misura, dice. Ma per misurare bastano i contapersone, non serve far pagare i visitatori."
      goals: [introduce]
    - learner: "I contapersone dicono quanti entrano, non chi sono né quanto restano. Il ticket, collegato alla prenotazione, permette di incrociare i flussi con la rata di occupazione degli alberghi."
      errors: [false-friend]
    # agree: content
    - tutor: "Incrociare i flussi con il tasso di occupazione degli alberghi è un'idea interessante, lo ammetto. Ma ha un esempio di città dove ha funzionato?"
      recast: {text: "la rata di occupazione", fix: "il tasso di occupazione", tags: [false-friend]}
    # decoy: «Attualmente» means «al momento», its correct sense
    - learner: "Attualmente i casi sono pochi, perché la misura è recente. Nel mio gruppo di ricerca abbiamo studiato due città del nord Europa, dove i dati hanno guidato le nuove regole sugli affitti brevi."
    - tutor: "Il nord Europa, però, non ha i nostri vicoli né i nostri numeri. Non teme che il ticket allontani proprio i turisti migliori, quelli che restano?"
      goals: [example]
    - learner: "No, perché chi dorme in città non paga. Semmai il rischio è politico: l'anno scorso i commercianti sono stati molto vocali contro il ticket, e il sindaco ha fatto subito marcia indietro."
      errors: [word-choice]
    - tutor: "I commercianti si sono fatti sentire molto, lo ricordo, e un sindaco ne ha sempre paura. Ma se fosse lei il sindaco, che cosa proporrebbe di concreto?"
      recast: {text: "sono stati molto vocali", fix: "si sono fatti sentire molto", tags: [word-choice]}
      goals: [rebut]
    - learner: "Proporrei un ticket modulato: gratuito nei giorni feriali di bassa stagione, più caro nei fine settimana e nei ponti. E i proventi andrebbero tutti a un fondo per la casa dei residenti."
    - tutor: "Un ticket modulato e un fondo per la casa: ha il merito di essere chiaro. Chi lo gestirebbe, quel fondo?"
    - learner: "Un comitato misto, con residenti, commercianti e Comune: solo se tutti sono sulla stessa pagina, una misura così può durare più di un mandato."
      errors: [word-choice]
    - tutor: "Mettere tutti sulla stessa lunghezza d'onda è l'impresa più difficile, ma la sua proposta almeno ci prova. Grazie, e buona giornata."
      recast: {text: "sulla stessa pagina", fix: "sulla stessa lunghezza d'onda", tags: [word-choice]}
      goals: [proposal]

- scenario: dibattito-ambiente
  # facts: la suocera del residente abita a dieci chilometri; navetta dal parcheggio della stazione; i fondi comunali bastano per due navette elettriche, non per dieci; proposta di una prova di sei mesi misurando il rumore; sconto sulla tassa per i dehors; consegna a domicilio pagata dal Comune per i negozi di oggetti pesanti; la learner redige la prima bozza entro venerdì, il residente aggiunge le firme dei negozi di via Dante
  level: C2
  persona: es-f-erasmus
  history: [word-choice, false-friend]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco il timore, ma credo che si debba guardare la questione da un'altra prospettiva: i negozi non vivono di parcheggi, vivono di persone che hanno voglia di fermarsi."
    - tutor: "Bella frase, ma le persone si fermano se possono arrivare. Mia suocera abita a dieci chilometri e senza macchina non viene."
      goals: [position]
    - learner: "Per sua suocera ci sarebbe la navetta dal parcheggio della stazione. Per certo, sa che il Comune ha già stanziato i fondi per le navette elettriche?"
      errors: [word-choice]
    - tutor: "A proposito di fondi, sì, li conosco: bastano per due navette, non per dieci. Ha un secondo argomento?"
      recast: {text: "Per certo", fix: "A proposito", tags: [word-choice]}
    # decoy: «il rumore» means «noise» and «eventualmente» means «se mai», both correct
    - learner: "Sì, il rumore. Chi abita in centro dorme con le finestre chiuse anche ad agosto; eventualmente si potrebbe fare una prova di sei mesi e misurare il rumore prima e dopo."
    - tutor: "Una prova misurata mi sembra più seria di tante promesse. Ma che cosa risponde ai commercianti che temono di chiudere durante quei sei mesi?"
      goals: [argue]
    - learner: "Risponderei che il Comune dovrebbe aiutarli con uno sconto sulla tassa per i tavolini all'aperto: fa mancanza un segnale concreto, non soltanto parole."
      errors: [word-choice]
    # agree: content
    - tutor: "Serve un segnale concreto, su questo ha ragione, e uno sconto sui dehors lo sarebbe. Ma basterebbe a compensare i clienti persi?"
      recast: {text: "fa mancanza", fix: "serve", tags: [word-choice]}
      goals: [counter]
    - learner: "Forse non del tutto, lo ammetto: alcuni negozi soffrirebbero comunque, soprattutto quelli che vendono oggetti pesanti. Per loro si potrebbe prevedere la consegna a domicilio pagata dal Comune."
    - tutor: "Consegna a domicilio pagata dal Comune: ora sì che parliamo di cose concrete. Sarebbe disposta a scriverlo in una proposta comune?"
      goals: [concede]
    - learner: "Sì, posso redattare io una prima bozza entro venerdì e mandarla a lei e agli altri commercianti, così la discutiamo prima dell'assemblea."
      errors: [word-choice]
    - tutor: "Se vuole redigere lei la prima bozza, io ci aggiungo le firme dei negozi di via Dante. Ci vediamo venerdì."
      recast: {text: "redattare", fix: "redigere", tags: [word-choice]}

# B1, real learner sentences: childhood memories and a surprise birthday party.
- scenario: ricordi-infanzia
  level: B1
  persona: es-f-teacher
  history: [past-participle-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    # merlin-1365_0100219-8
    - learner: "Benché nascito a Valencia, ho fatto tutte le scuole a Madrid dove ho studiato giurisprudenzia all'Università."
      errors: [past-participle-form, spelling]
    - tutor: "«Nascito»? Con il verbo «nascere» quella forma non va: com'è?"
      prompt: {text: "nascito", tags: [past-participle-form]}
    - learner: "Benché nascita a Valencia..."
      errors: [past-participle-form]
    - tutor: "Ah, sei nata a Valencia, ma sei cresciuta a Madrid! E cosa facevi da piccola, il pomeriggio?"
      recast: {text: "nascita", fix: "nata", tags: [past-participle-form]}
      goals: [place]
    - learner: "Giocavo in piazza con i miei cugini fino alle nove di sera."
    - tutor: "Fino alle nove! In Spagna si cena tardi, è vero. E a scuola?"
      goals: [habits]
    # merlin-1325_1001035-2
    - learner: "Alla scuola elementare ho studiato sopratutto inglese e tedesco."
    - tutor: "Due lingue già da piccola! E ti piaceva il tedesco?"
    # merlin-1325_1001055-3
    - learner: "Non mi piaceva affatto perchè trovavo difficile la grammatica e devo dire che a me non sembre tanto bella."
      errors: [verb-form, spelling]
    - tutor: "A te non «sembre» bella? Controlla la fine di quel verbo."
      prompt: {text: "sembre", tags: [verb-form]}
    - learner: "A me non sembre bella, la lingua tedesca."
      errors: [verb-form]
    - tutor: "Capisco, se una lingua non ti sembra bella è difficile studiarla. Hai un ricordo speciale di quegli anni?"
      recast: {text: "sembre", fix: "sembra", tags: [verb-form]}
      goals: [school]
    - learner: "Sì: una volta, in gita, ho perso il pullman e la maestra è tornata a prendermi!"
    - tutor: "Che paura! Ma che brava maestra."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Manchester, in una casa piccola vicino alla fattoria dove lavorava mio padre."
      errors: [false-friend]
    - tutor: "Vicino alla fabbrica di tuo padre! E com'era la tua scuola?"
      recast: {text: "fattoria", fix: "fabbrica", tags: [false-friend]}
      new: [{lemma: fabbrica, gloss: factory}]
      goals: [place]
    # merlin-1325_1001055-1
    - learner: "Da bambino alla scuola elementare ho cominciato a studiare la russa per la situazione politica."
      errors: [noun-gender]
    - tutor: "Studiavi «la russa»? Detto così sembra una ragazza! Come si chiama la lingua?"
      prompt: {text: "la russa", tags: [noun-gender]}
    - learner: "Il russo, scusa! Era strano, in Inghilterra."
    - tutor: "Esatto. Davvero strano! E com'era l'insegnante?"
    # merlin-1325_1001063-10
    - learner: "Ma sai, tante volte quando ho dimenticato una parola lei mi ha aiutato sempre."
      errors: [tense-aspect]
    - tutor: "«Quando ho dimenticato»? Succedeva tante volte, era una cosa di tutti i giorni: quale tempo ci vuole?"
      prompt: {text: "quando ho dimenticato", tags: [tense-aspect]}
    - learner: "Quando ho dimenticato una parola, lei mi ha aiutato."
      errors: [tense-aspect]
    - tutor: "Che brava! Anche io, quando dimenticavo una parola, guardavo la mia maestra e lei capiva tutto."
      recast: {text: "ho dimenticato", fix: "dimenticavo", tags: [tense-aspect]}
      goals: [school]
    - learner: "Il sabato andavo al cinema con mio fratello: costava sei penny!"
    - tutor: "Sei penny, che tempi! E un ricordo speciale?"
      goals: [habits]
    - learner: "Il giorno che abbiamo vinto la partita di calcio della scuola: ho fatto io il gol!"
    - tutor: "Un eroe, allora! Scommetto che te lo ricordi ancora benissimo."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [possessive]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo a Siviglia, in un appartamento sopra la tienda dei miei nonni."
      errors: [word-choice]
    - tutor: "Sopra il negozio dei nonni! Quindi passavi tanto tempo con loro?"
      recast: {text: "la tienda", fix: "il negozio", tags: [word-choice]}
      goals: [place]
    - learner: "Sì, ogni pomeriggio. Mia nonna mi dava sempre un pezzo di cioccolata."
    - tutor: "Che dolce! E a scuola ti trovavi bene?"
      goals: [habits]
    # merlin-1395_0001010-1
    - learner: "Mia insegnante si chiama Carmen."
      errors: [possessive]
    - tutor: "«Mia insegnante»? Qui, davanti a «mia», manca qualcosa."
      prompt: {text: "Mia insegnante", tags: [possessive]}
    - learner: "Mia insegnante, sì, Carmen. È ancora viva!"
      errors: [possessive]
    - tutor: "Che bello! La mia insegnante di quando ero piccolo invece era molto seria. Carmen com'era?"
      recast: {text: "Mia insegnante", fix: "La mia insegnante", tags: [possessive]}
    # merlin-1325_1001122-3
    - learner: "Ogni estate ci da un libro obligatorio."
      errors: [spelling]
    - tutor: "Un libro «obligatorio»? Attenzione alle doppie."
      prompt: {text: "obligatorio", tags: [spelling]}
    - learner: "Obbligatorio, con due b! E anche adesso ci scriviamo."
    - tutor: "Esatto. Una maestra per tutta la vita, che fortuna!"
      goals: [school]
    # merlin-1325_1001110-6
    - learner: "Prima di tutto mi piaceva di essere in contatto con le persone che volevano verramente imparare la lingua."
      errors: [preposition, spelling]
    - tutor: "Ti piaceva «di» essere in contatto? Dopo «piaceva», quella preposizione serve?"
      prompt: {text: "mi piaceva di essere", tags: [preposition]}
    - learner: "Mi piaceva essere in contatto con loro: per questo sono diventata insegnante di spagnolo!"
    - tutor: "Esatto, e si vede che ti piace! Ecco un bel ricordo che ti ha cambiato la vita."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [negation]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "In un paesino vicino a Salamanca, in mezzo alla campagna."
    - tutor: "In campagna! E cosa facevi il pomeriggio?"
      goals: [place]
    - learner: "Andavo a cavallo con mia sorella e d'inverno facevamo i pupazzi di neve."
    - tutor: "Che bei ricordi! E a scuola cosa studiavi?"
      goals: [habits]
    # merlin-1325_1001042-5
    - learner: "Ho studiato la lingua italiana anche al liceo, ma purtroppo l'uso ancora."
      errors: [negation]
    - tutor: "Ma purtroppo «l'uso ancora»? Vuoi dire che la usi, o il contrario?"
      prompt: {text: "l'uso ancora", tags: [negation]}
    - learner: "Il contrario: purtroppo non la uso ancora molto."
    - tutor: "Esatto. Ma adesso la usi con me! E le altre lingue?"
    # merlin-1325_1001142-7
    - learner: "La mia seconda lingua è l'inglese, ma a dire la verità non mi piace studiarla."
    - tutor: "Ti capisco, nemmeno a me piaceva studiare le lingue a scuola. E perché poi hai scelto l'italiano?"
      goals: [school]
    # merlin-1325_1001139-2
    - learner: "Pensavo che è una buona scelta per impararmi una lingua meno faticosa."
      errors: [subjunctive-use, reflexive]
    - tutor: "Pensavi che «è» una buona scelta? Dopo «pensavo che», che modo usiamo?"
      prompt: {text: "Pensavo che è", tags: [subjunctive-use]}
    - learner: "Pensavo che sia una buona scelta..."
      errors: [subjunctive-use]
    - tutor: "Pensavi che fosse una buona scelta, e invece l'italiano è difficile come le altre!"

      recast: {text: "sia", fix: "fosse", tags: [subjunctive-use]}
      goals: [event]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Io torno con lei da Londra venerdì sera, in aereo."
    # merlin-1365_0100073-10
    - learner: "Ti venirò prendere al aeroporto di Pisa."
      errors: [future-form, articulated-preposition, preposition]
    - tutor: "Mi «venirò» a prendere? Il futuro di «venire» è un po' speciale."
      prompt: {text: "venirò", tags: [future-form]}
    - learner: "Sì, ti venirò a prendere io."
      errors: [future-form]
    - tutor: "Grazie! Ma no, verrò con Sara in treno, così lei non capisce niente. La festa quando la facciamo?"
      recast: {text: "venirò", fix: "verrò", tags: [future-form]}
    - learner: "Sabato sera, a casa mia: ho il terrazzo grande."
    - tutor: "Perfetto! Chi invitiamo?"
      goals: [date]
    # merlin-1365_0100200-7
    - learner: "Forse c'è un elenco dei regali desiderati che può essere usato da tutti gli invitati?"
    - tutor: "Un elenco no, ma so che Sara vuole una bicicletta! Possiamo fare un regalo tutti insieme."
      goals: [gift]
    - learner: "Ottima idea! Invitiamo i colleghi dell'ufficio e le sue amiche del college."
      errors: [word-choice]
    - tutor: "Colleghi e amiche dell'università: saremo almeno venti, allora. Per il cibo io direi: tu cucini e io porto da bere!"
      recast: {text: "del college", fix: "dell'università", tags: [word-choice]}
      goals: [guests]
    # merlin-1365_0100451-1
    - learner: "Quanto sei furbo!"
    - tutor: "Va bene, va bene: io ordino le pizze e tu fai la torta?"
    - learner: "Perfetto, faccio la torta al cioccolato."
    - tutor: "Allora pizze e torta al cioccolato: Sara sarà felicissima!"
      goals: [food]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Possiamo fare una fiesta sorpresa sabato prossimo, nel giardino di Luca."
      errors: [word-choice]
    - tutor: "Una festa a sorpresa nel giardino di Luca, ottima idea! Oppure torniamo al ristorante dell'anno scorso?"
      recast: {text: "una fiesta sorpresa", fix: "una festa a sorpresa", tags: [word-choice]}
      goals: [date]
    # merlin-1365_0100281-8
    - learner: "Secondo me era un ottimo scelto questa ristorante."
      errors: [noun-gender, word-choice]
    - tutor: "Sì, era buono. Però «questa» ristorante? Pensa al genere."
      prompt: {text: "questa ristorante", tags: [noun-gender]}
    - learner: "Questo ristorante! Possiamo ordinare il cibo da loro e invitare tutti gli amici del corso."
    - tutor: "Esatto, e portano tutto a casa. Cosa ordiniamo?"
      goals: [guests]
    - learner: "Pasta al forno, verduras e un dolce grande."
      errors: [word-choice]
    - tutor: "Pasta al forno e verdure, perfetto. E il regalo?"
      recast: {text: "verduras", fix: "verdure", tags: [word-choice]}
      goals: [food]
    # merlin-1365_0100285-8
    - learner: "Volentieri voglio regalare quel viaggio."
    - tutor: "Il viaggio a Parigi di cui ti parlava? Costa tanto, però!"
    - learner: "Lo paghiamo in dieci. Io ci posso scrivere a tutti stasera."
      errors: [object-pronoun]
    - tutor: "«Ci» posso scrivere a tutti? Quando scrivi a delle persone, quale pronome usi?"
      prompt: {text: "ci posso scrivere", tags: [object-pronoun]}
    - learner: "Gli posso scrivere stasera!"
    - tutor: "Esatto. Allora scrivigli, e io penso al giardino. Sara sarà felicissima!"
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-m-traveller
  history: [imperative-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1325_1001131-8
    - learner: "Spero che sarà tutto a posto e anche tu sarai tranquillo."
    - tutor: "Tranquillo io? Sono nervosissimo, è la prima festa a sorpresa che organizzo!"
    # merlin-1365_0100163-5
    - learner: "Pensaci anche tu!"
    - tutor: "Ci penso, ci penso! Allora facciamo sabato 14 al bar di Carlo?"
    - learner: "Sì, sabato 14 va benissimo. Non dire niente a Sara!"
    - tutor: "Non dico niente, promesso. Chi invitiamo?"
      goals: [date]
    - learner: "Invitiamo la sua famiglia e i suoi amici. Per favore dirmi, se hai tempo."
      errors: [imperative-form]
    - tutor: "«Per favore dirmi»? Mi chiedi una cosa, con il tu: come diventa quel verbo?"
      prompt: {text: "dirmi", tags: [imperative-form]}
    - learner: "Dimmi, per favore, se hai tempo di chiamare la sua famiglia."
    - tutor: "Esatto. Li chiamo stasera. E da mangiare? Il bar di Carlo fa degli ottimi panini.
"
      goals: [guests]
    - learner: "Panini e una grande torta alla frutta: a Sara non piace il cioccolato."
    - tutor: "Giusto, me n'ero dimenticato! E per il regalo, ho già comprato un corso di cucina da parte di tutti."
      goals: [food]
    # merlin-1365_0100277-2
    - learner: "Sei veramente un campionissimo!"
    - tutor: "Grazie! Allora il regalo c'è, la torta pure: manca solo Sara!"
      goals: [gift]

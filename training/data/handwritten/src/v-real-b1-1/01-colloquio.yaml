# B1, real learner sentences: job interviews for a small design studio.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000088-0
    - learner: "Sono una ragazza inglese e ho 23 anni."
    - tutor: "Piacere di conoscerla. E adesso studia o lavora?"
    # merlin-1325_1001095-2
    - learner: "Frequento l'università di Bologna dove studio l'italiano, la storia e l'inglese."
    - tutor: "Bella scelta di studi. Ha già fatto qualche esperienza di lavoro?"
      goals: [intro]
    # merlin-1325_9000314-2
    - learner: "Nelle mie ultime vacanze lavoravo come la guida nel campeggio in Italia."
      errors: [tense-aspect, article-use]
    - tutor: "«Lavoravo»? Parla di un'esperienza conclusa, l'estate scorsa: quale tempo le serve qui?"
      prompt: {text: "lavoravo", tags: [tense-aspect]}
    - learner: "Ah, giusto: ho lavorato come guida in un campeggio."
    - tutor: "Esatto. Un lavoro a contatto con tanta gente, quindi! Quali sono i suoi punti di forza?"
      goals: [experience]
    # merlin-1325_1001157-6
    - learner: "Sono affidabile e disponibile e mi piace aiutare le persone."
    - tutor: "Sono qualità preziose in un piccolo studio come il nostro. Perché vorrebbe lavorare proprio da noi?"
      goals: [strengths]
    # merlin-1325_9000099-6
    - learner: "Per migliorare le mie conoscenze nella lingua italiana mi interessa molto lavorare per un mese in Italia."
    - tutor: "Allora siamo perfetti: il nostro programma dura proprio un mese. Ha qualche domanda per me?"
      goals: [why]
    # merlin-1325_1001120-10
    - learner: "E devo chiedere quando inizia lo stage, quanto tempo devo lavorare ogni giorno."
    - tutor: "Si comincia il primo giugno, sei ore al giorno, dalle nove alle tre. Le faremo sapere qualcosa entro venerdì!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001160-1
    - learner: "Ho studiato al liceo per gli stilisti e mi sono laureato della storia di moda."
      errors: [article-use, preposition, articulated-preposition]
    - tutor: "Si è laureato «della storia»? Pensi bene alla preposizione che va dopo «laureato»."
      prompt: {text: "laureato della storia", tags: [preposition]}
    - learner: "Mi sono laureato in storia della moda."
    - tutor: "Perfetto, mi sembra una preparazione molto interessante per noi. E dove ha lavorato finora?"
      goals: [intro]
    # merlin-1325_1001087-2
    - learner: "E poi ho lavorato da una azienda, dove ero una assistente."
      errors: [preposition]
    - tutor: "Ha lavorato «da una azienda»? Con la parola «azienda» quale preposizione usiamo?"
      prompt: {text: "da una azienda", tags: [preposition]}
    - learner: "Ho lavorato a una azienda di Madrid, per tre anni."
      errors: [preposition]
    - tutor: "Ah, tre anni in un'azienda di Madrid: un'esperienza importante. Quali sono i suoi punti di forza?"
      recast: {text: "a una azienda", fix: "in un'azienda", tags: [preposition]}
      goals: [experience]
    # merlin-1325_1001087-4
    - learner: "Posso tenere i contatti con i clienti e posso assistere il personale in ufficio."
    - tutor: "Molto utile, qui facciamo un po' di tutto. E perché ha scelto proprio la nostra azienda?"
      goals: [strengths]
    # merlin-1325_1001088-8
    - learner: "Conosco bene al vostro abbigliamento e mi piace molto."
      errors: [preposition]
    - tutor: "Conosce bene «al» vostro abbigliamento? Con il verbo «conoscere» serve davvero quella preposizione?"
      prompt: {text: "al vostro abbigliamento", tags: [preposition]}
    - learner: "No, conosco bene il vostro abbigliamento. Posso chiedere quando comincia il lavoro?"
    - tutor: "Esatto, e ci fa molto piacere! Se tutto va bene, potrebbe cominciare già a marzo, dal lunedì al venerdì."
      goals: [why, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001160-0
    - learner: "Mi chiamo Emma, ho trentadue anni e vivo con il mio marito a Milano."
      errors: [possessive]
    - tutor: "Piacere, Emma. Vive con... «il mio marito»? Pensi a come usiamo «mio» con i nomi di famiglia."
      prompt: {text: "il mio marito", tags: [possessive]}
    - learner: "Ah sì: vivo con mio marito a Milano."
    - tutor: "Esatto. Dal curriculum vedo che ha lavorato a Londra per qualche anno. E poi?"
      goals: [intro]
    # merlin-1325_1001051-2
    - learner: "Dopo circa tre anni, sono andata a Firenze per lavorare."
    - tutor: "Firenze è una città perfetta per chi ama l'arte. E perché adesso ha scelto proprio noi?"
      goals: [experience]
    # merlin-1325_9000144-4
    - learner: "I miei viaggi mi hanno portato spesso in Italia e mi piacerebbe combinare queste esperienze con le mie conoscenze professionale."
      errors: [adjective-agreement]
    - tutor: "Le sue conoscenze... «professionale»? Guardi bene il nome: è singolare o plurale?"
      prompt: {text: "conoscenze professionale", tags: [adjective-agreement]}
    - learner: "Con le mie conoscenze professionali, scusi. E sono una persona molto precisa, forse anche troppo."
    - tutor: "Benissimo, nel nostro lavoro essere precisi conta molto. Ha qualche domanda per me?"
      goals: [why, strengths]
    # merlin-1325_1001093-11
    - learner: "Quanto dura un giorno del lavoro?"
      errors: [articulated-preposition]
    - tutor: "Un giorno «del lavoro»? Qui l'articolo non serve: provi di nuovo."
      prompt: {text: "del lavoro", tags: [articulated-preposition]}
    - learner: "Quanto dura un giorno di lavoro?"
    - tutor: "Brava. Otto ore, dalle nove alle sei, con un'ora di pausa. Il venerdì però finiamo alle quattro!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [word-order]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001169-0
    - learner: "Sono venuto in Italia 2 anni fa e da quel periodo abito a Roma, alla città eterna."
      errors: [articulated-preposition]
    - tutor: "Abita a Roma, «alla» città eterna? Pensi a dove si trova lei: dentro la città."
      prompt: {text: "alla città eterna", tags: [articulated-preposition]}
    - learner: "Nella città eterna, certo!"
    - tutor: "Esatto, e ha scelto bene! Che esperienza ha nel mondo della moda?"
      goals: [intro]
    # merlin-1325_1001063-2
    - learner: "Due anni fa sono partito per Parigi e ho cominciato a studiare la lingua francese."
    - tutor: "Interessante, ma io le chiedevo del lavoro. A Parigi ha lavorato con la moda?"
    # merlin-1325_1001091-10
    - learner: "Mi piacerebbe lavorare di nuovo nel mondo della moda perchè è il mondo unico che io conosca."
      errors: [word-order, spelling]
    - tutor: "«Il mondo unico»? Così sembra un mondo speciale, diverso dagli altri. Cosa vuole dire, esattamente?"
      prompt: {text: "il mondo unico", tags: [word-order]}
    - learner: "Voglio dire che è l'unico mondo che conosco bene."
    - tutor: "Ecco, ora è chiaro. Quindi conosce già bene questo mondo. Qual è il suo punto di forza principale?"
      goals: [experience, why]
    # merlin-1325_1001161-0
    - learner: "Io sono il perfetto uomo per questo posto di lavoro, perché la mia personalita e la mia esperienza è ottimo per fare questo lavoro."
      errors: [adjective-agreement, subject-verb-agreement, spelling]
    - tutor: "Che sicurezza! Però guardi la fine della frase: «è ottimo»? Pensi a quante cose ci sono prima."
      prompt: {text: "è ottimo", tags: [adjective-agreement]}
    - learner: "Sono ottime! E ho una domanda: lavorate anche con clienti stranieri?"
    - tutor: "Esatto. Sì, metà dei nostri clienti sono francesi, quindi il suo francese ci sarà molto utile."
      goals: [strengths, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001016-2
    - learner: "Sono laureata in Sociologia."
    - tutor: "Benissimo. E come mai si interessa al nostro lavoro?"
    # merlin-1325_9000215-6
    - learner: "Su internet mi informo spesso di altri paesi come ad esempio l'Egizio o la Grecia."
      errors: [word-choice]
    - tutor: "Ah, l'Egitto o la Grecia: paesi pieni di arte e di storia! E ha già esperienza di lavoro?"
      recast: {text: "l'Egizio", fix: "l'Egitto", tags: [word-choice]}
      goals: [intro]
    - learner: "Sì, ho lavorato un anno come secretaria in una scuola di lingue."
      errors: [word-choice]
    - tutor: "Quindi lei era la segretaria della scuola: sa organizzare bene il lavoro degli altri. Che cosa le piacerebbe fare nel nostro studio?"
      recast: {text: "secretaria", fix: "segretaria", tags: [word-choice]}
      new: [{lemma: segretaria, gloss: secretary}]
      goals: [experience]
    # merlin-1325_1001095-8
    - learner: "Mi piacerebbe e vorrei assistare il personale in ufficio perché è importante."
      errors: [verb-form]
    - tutor: "Vorrebbe «assistare» il personale? Attenzione all'infinito: finisce davvero così?"
      prompt: {text: "assistare", tags: [verb-form]}
    - learner: "Della seconda: vorrei assistere il personale."
    - tutor: "Perfetto. E qual è il suo punto di forza?"
      goals: [why]
    # merlin-1325_1001080-3
    - learner: "Mi piace tenere i contatti e parlare con altri."
      errors: [article-use]
    - tutor: "Parlare «con altri»? Qui manca una piccola parola prima di «altri»."
      prompt: {text: "con altri", tags: [article-use]}
    - learner: "Parlare con gli altri. Posso chiedere se lo stage è pagato?"
    - tutor: "Giusto. Sì, è pagato: 600 euro al mese per sei mesi. Le scriviamo entro la settimana prossima."
      goals: [strengths, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001154-0 merlin-1325_1001032-4
    - learner: "Ho 24 anni. Adesso cerco di lavoro."
      errors: [preposition]
    - tutor: "Cerca «di» lavoro? Con «cercare» quella preposizione non va: provi di nuovo."
      prompt: {text: "cerco di lavoro", tags: [preposition]}
    - learner: "Adesso cerco lavoro, scusi."
    - tutor: "Benissimo, allora è nel posto giusto. Che cosa fa in questo periodo?"
      goals: [intro]
    # merlin-1325_9000088-1
    - learner: "Passerò la maturità quest'anno e per finanziare il studio ho bisogno di soldi."
      errors: [article-form]
    - tutor: "Per finanziare «il studio»? Attenzione all'articolo davanti a «studio»."
      prompt: {text: "il studio", tags: [article-form]}
    - learner: "Lo studio! Per finanziare lo studio."
    - tutor: "Esatto. Quindi è il suo primo lavoro? Che cosa sa fare?"
    # merlin-1325_1001055-4
    - learner: "Al liceo avevo le lezioni d'inglese e siccome sono un informatico questa lingua è inevitabile."
    - tutor: "Un informatico, che bello! Allora con il computer se la cava benissimo. E perché vuole lavorare con noi?"
      goals: [experience, strengths]
      new: [{lemma: cavarsela, gloss: to manage, get by}]
    # merlin-1365_0100219-10
    - learner: "È importante oggi conoscere molte lingue in un mondo sempre più diverse."
      errors: [adjective-agreement]
    - tutor: "Un mondo sempre più «diverse»? Guardi bene il nome «mondo»."
      prompt: {text: "più diverse", tags: [adjective-agreement]}
    - learner: "Un mondo sempre più diverso. E quando posso sapere la risposta?"
    - tutor: "Giusto, e qui parliamo con clienti di tutto il mondo. Le faremo sapere entro dieci giorni. In bocca al lupo per gli esami!"
      goals: [why, questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [reflexive]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000215-0
    - learner: "Sono nata e cresciuta in Inghilterra perché i miei parenti si sono immigrati per motivi di lavoro."
      errors: [reflexive]
    - tutor: "I suoi parenti «si sono immigrati»? Ci pensi: con questo verbo serve davvero «si»?"
      prompt: {text: "si sono immigrati", tags: [reflexive]}
    - learner: "No, non è riflessivo: i miei parenti sono immigrati in Inghilterra."
    - tutor: "Perfetto. Quindi è cresciuta con due lingue. Che lavoro fa adesso?"
      goals: [intro]
    # merlin-1325_9000215-1
    - learner: "Ho frequentato esclusivamente scuole inglesi e parlo molto bene la lingua."
    - tutor: "Questo l'avevo capito! Ma il lavoro? Ha già lavorato in uno studio come il nostro?"
    # merlin-1325_1001087-5
    - learner: "Ho anche esperienza nei programmi informatici (per esempio con il pacchetto Office)."
    - tutor: "Bene, ma da noi si usano soprattutto programmi per disegnare. Le piacerebbe impararli?"
      goals: [experience]
    - learner: "Sì, certo. Imparo velocemente e sono molto paziente: sono stata professora per dieci anni."
      errors: [word-choice]
    - tutor: "Ottimo, dopo dieci anni da professoressa la pazienza non le manca! Perché vuole cambiare lavoro?"
      recast: {text: "professora", fix: "professoressa", tags: [word-choice]}
      new: [{lemma: professoressa, gloss: teacher (female)}]
      goals: [strengths]
    # merlin-1325_1001123-10
    - learner: "Mi fa studiare una nuova lingua il pensiero che queste sono molto utili."
    - tutor: "Capisco: per lei imparare cose nuove è sempre importante, anche nel lavoro. Ha qualche domanda sul ruolo?"
      goals: [why]
    - learner: "Sì: lavorerò da sola o in un gruppo?"
    - tutor: "In un piccolo gruppo di quattro persone, con una responsabile molto brava. Le faremo sapere presto!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [noun-number]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001057-2
    - learner: "Sono stata a Reggio di Calabria e ho studiato all'Università per stranieri."
    - tutor: "Ah, conosco bene quell'università! E com'è andata con l'italiano?"
      goals: [intro]
    # merlin-1325_1001035-4
    - learner: "Grazie ai miei impegnanti e alla mia grande motivazione ho superato l'esame a livello B2 in italiano nel 2022."
      errors: [word-choice]
    - tutor: "Brava lei e bravi gli insegnanti, allora! Un B2 non è poco. Ha già qualche esperienza di lavoro?"
      recast: {text: "impegnanti", fix: "insegnanti", tags: [word-choice]}
    - learner: "Ho lavorato due estati in un negozio di vestiti. Ero in carica della vetrina."
      errors: [word-choice]
    - tutor: "Quindi era responsabile della vetrina: è già un piccolo lavoro d'arte! Perché vorrebbe lavorare con noi?"
      recast: {text: "in carica della vetrina", fix: "responsabile della vetrina", tags: [word-choice]}
      goals: [experience]
      new: [{lemma: vetrina, gloss: shop window}]
    # merlin-1325_1001035-8
    - learner: "Secondo me, la conoscenza delle lingue straniere ha molti vantaggi."
    - tutor: "È vero, e noi abbiamo clienti in sei paesi. Secondo lei, qual è il suo punto debole?"
      goals: [why]
    - learner: "Forse sono un po' timida all'inizio, ma poi divento molto sociabile."
      errors: [word-choice]
    - tutor: "Timida all'inizio e poi socievole: va benissimo, su questo possiamo lavorare insieme. Ha qualche domanda per me?"
      recast: {text: "sociabile", fix: "socievole", tags: [word-choice]}
      new: [{lemma: socievole, gloss: sociable}]
      goals: [strengths]
    # merlin-1325_1001093-9
    - learner: "Vorrei avere informazioni per i giorno lavorativi."
      errors: [noun-number]
    - tutor: "Certo. Però attenzione: «i giorno»? Controlli bene quel nome.
"
      prompt: {text: "i giorno", tags: [noun-number]}
    - learner: "I giorni lavorativi, scusi!"
    - tutor: "Perfetto. Si lavora dal lunedì al venerdì, e il sabato è sempre libero."
      goals: [questions]

# B1, real learner sentences: complaints at a hotel reception late in the evening.
- scenario: reclamo-hotel
  level: B1
  persona: en-m-retired
  history: [auxiliary-choice, imperative-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001020-4
    - learner: "L'aria condizionata non è funzionata."
      errors: [auxiliary-choice]
    - tutor: "Non «è» funzionata? Ci pensi: con il verbo «funzionare» usiamo «essere» o «avere»?"
      prompt: {text: "non è funzionata", tags: [auxiliary-choice]}
    - learner: "Non ha funzionato. È rotta da due giorni e in camera fa un caldo terribile."
    - tutor: "Perfetto, e mi dispiace davvero: due giorni con questo caldo sono tanti. C'è altro?"
      goals: [problem, since]
    # merlin-1325_1001008-6
    - learner: "Quanto a me la piú grande problema era che il lago sia stata lontanissimo."
      errors: [noun-gender, subjunctive-use, participle-agreement, spelling]
    - tutor: "«La» più grande problema? Attenzione: «problema» è un nome un po' particolare."
      prompt: {text: "la piú grande problema", tags: [noun-gender]}
    - learner: "Sì, la problema più grande è il lago: è lontano."
      errors: [noun-gender]
    - tutor: "Il problema del lago, purtroppo, non posso risolverlo io! Ma per l'aria condizionata posso fare qualcosa."
      recast: {text: "la problema", fix: "il problema", tags: [noun-gender]}
    # merlin-1325_1001008-11
    - learner: "Le preghiamo compensazione e se potessi darLe un consiglio cambia l'annuncio."
      errors: [object-pronoun, article-use, hypothetical, imperative-form]
    - tutor: "Lo dirò al direttore. Però «cambia» l'annuncio? Sta dando un consiglio a me, con il Lei."
      prompt: {text: "cambia l'annuncio", tags: [imperative-form]}
    - learner: "Cambi l'annuncio! E per stanotte vorrei un'altra camera, per favore."
    - tutor: "Esatto. Ho una camera libera al terzo piano, con l'aria condizionata nuova. E domani parlerà con il direttore per lo sconto."
      goals: [request]
      new: [{lemma: sconto, gloss: discount}]
    # merlin-1325_9000674-11
    - learner: "Ringrazio per l'attenzione dedicatami."
    - tutor: "Si figuri, è il mio lavoro. Ecco la chiave della 312: buonanotte!"
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000095-1
    - learner: "Il vostro residence non era \"di recente costruzione\" ma vecchio, l'aria condizionata di che ho avuto bisogno non ha funzionato e l'animazione c'era solo una sera la settimana."
      errors: [relative-pronoun, tense-aspect]
    - tutor: "L'aria condizionata «di che» ha avuto bisogno? Con «avere bisogno di», quale pronome serve?"
      prompt: {text: "di che", tags: [relative-pronoun]}
    - learner: "L'aria condizionata di cui avevo bisogno."
    - tutor: "Esatto. Ha ragione, mi dispiace. Da quanti giorni è qui con noi?"
      goals: [problem]
    # merlin-1325_9000089-0
    - learner: "Una settimana fa ho visitato il vostro residence con la mia famiglia per sette giorni."
    - tutor: "Quindi siete qui da una settimana, e il problema c'è dall'inizio?"
      goals: [since]
    # merlin-1325_1001013-1
    - learner: "Per esempio l'area condizionata non era funzionante e la piscina era sempre sovraffollata."
      errors: [spelling]
    - tutor: "L'«area» condizionata? Attenzione, così è un'altra parola: controlli bene una lettera."
      prompt: {text: "l'area condizionata", tags: [spelling]}
    - learner: "L'aria condizionata, scusi. Non funziona dal primo giorno."
    - tutor: "Perfetto. Che cosa le posso offrire per rimediare?"
      new: [{lemma: rimediare, gloss: to make up for}]
    - learner: "Vorrei che domani qualcuno ripari l'aria condizionata, e parlare con il gerente."
      errors: [word-choice]
    - tutor: "Certo. Il tecnico arriva domani alle nove, e il direttore la riceve alle dieci. Le va bene?"
      recast: {text: "il gerente", fix: "il direttore", tags: [word-choice]}
      goals: [request]
      new: [{lemma: tecnico, gloss: technician}]
    # merlin-1325_1001020-9
    - learner: "Aspetto il Suo risposto positivo il più veloce."
      errors: [noun-gender, word-choice]
    - tutor: "Il mio «risposto»? Controlli bene quel nome: è maschile o femminile?"
      prompt: {text: "il Suo risposto", tags: [noun-gender]}
    - learner: "Femminile, scusi! Aspetto la Sua risposta. Per me va bene così."
    - tutor: "Esatto. Allora a domani mattina. Buonanotte, e scusi ancora."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [ce-ci-sono]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001119-3
    - learner: "Nell suo annuncio c'era scritto che si poteva fare dello sport."
      errors: [articulated-preposition]
    - tutor: "«Nell» suo annuncio? Davanti a «suo», quella forma va bene?"
      prompt: {text: "Nell suo", tags: [articulated-preposition]}
    - learner: "Nel suo annuncio, scusi. C'era scritto che si poteva fare sport."
    - tutor: "Sì, è vero, lo diciamo. Che cosa non ha funzionato?"
    # merlin-1325_9000095-4
    - learner: "Non ho anche avuto la possibilità di fare dello sport a causa della riparazione dei campi da tennis e la sovraffolazione della piscina."
      errors: [negation, spelling]
    - tutor: "Non ha «anche» avuto la possibilità? In una frase negativa, che parola usiamo al posto di «anche»?"
      prompt: {text: "Non ho anche avuto", tags: [negation]}
    - learner: "Non ho neanche avuto la possibilità di giocare a tennis."
    - tutor: "Giusto. I campi sono chiusi da lunedì, ha ragione. E la piscina è sempre piena?"
      goals: [problem, since]
    # merlin-1325_9000209-4
    - learner: "Anchè l'animazione è stata solo una sera la settimana."
      errors: [ce-ci-sono, spelling]
    - tutor: "L'animazione «è stata» solo una sera? Le manca una piccola parola prima del verbo."
      prompt: {text: "l'animazione è stata", tags: [ce-ci-sono]}
    - learner: "L'animazione è stata solo una volta, sì."
      errors: [ce-ci-sono]
    - tutor: "Ha ragione, l'animazione c'è stata solo il venerdì, e non è giusto. Come posso aiutarla?"
      recast: {text: "l'animazione è stata", fix: "l'animazione c'è stata", tags: [ce-ci-sono]}
    - learner: "Potreste restituirmi una parte dei soldi? Il tennis era il motivo principale della vacanza."
    - tutor: "Posso offrirle il dieci per cento di sconto, e la piscina solo per lei ogni mattina alle sette. Cosa ne dice?"
      goals: [request]
      new: [{lemma: sconto, gloss: discount}]
    # merlin-1325_9000678-3
    - learner: "Mi piace nuotare, mettermi in acqua e anche giocarci."
    - tutor: "Allora alle sette la piscina è tutta sua, e domani parliamo del prezzo. Buonanotte, e mi scusi ancora."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000141-1
    - learner: "Per questo, ci ho prenotato una vacanza la quale non mi ha piaciuta."
      errors: [auxiliary-choice, ci-ne]
    - tutor: "Una vacanza che non le «ha» piaciuta? Con «piacere», usiamo «avere» o «essere»?"
      prompt: {text: "non mi ha piaciuta", tags: [auxiliary-choice]}
    - learner: "Non mi è piaciuta! Per niente."
    - tutor: "Mi dispiace molto. Che cosa è successo, esattamente?"
    # merlin-1325_1001020-3
    - learner: "Ma il nostro appartamento è stato molto vecchio e non è stato molto moderno."
      errors: [tense-aspect]
    - tutor: "L'appartamento «è stato» vecchio? Qui sta descrivendo com'era: quale tempo usiamo per descrivere?"
      prompt: {text: "è stato molto vecchio", tags: [tense-aspect]}
    - learner: "Era molto vecchio, e stasera la doccia non funziona."
    - tutor: "Esatto. La doccia non funziona da quando?"
      goals: [problem]
    - learner: "Da stasera alle sette. Ho llamato due volte, ma non è venuto nessuno."
      errors: [word-choice]
    - tutor: "Ha chiamato due volte e non è venuto nessuno? Ha ragione, mi scusi. A quest'ora non c'è nessuno per le riparazioni, ma posso fare qualcosa."
      recast: {text: "llamato", fix: "chiamato", tags: [word-choice]}
      goals: [since]
    # merlin-1325_1001009-3
    - learner: "Ci tengo a dire tutte le cose che ci fatto male."
      errors: [auxiliary-choice]
    - tutor: "Le cose che vi... «fatto» male? Al verbo manca un pezzo."
      prompt: {text: "ci fatto male", tags: [auxiliary-choice]}
    - learner: "Le cose che ci hanno fatto male. Ma stanotte vorrei solo una doccia calda!"
    - tutor: "Esatto. Allora le do subito la camera 205, con il bagno nuovo, e domani ne parla con il direttore."
      goals: [request]
    # merlin-1385_0001730-3
    - learner: "Mi dispiace moltissimo."
    - tutor: "Ma si figuri, aveva ragione lei! Ecco la chiave, buonanotte."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-student
  history: [article-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001015-0
    - learner: "Un mese fa ho letto un'annuncio pubblicitario da Residence del Lago."
      errors: [article-form, preposition]
    - tutor: "Ha letto «un'annuncio»? Ci pensi: «annuncio» è maschile o femminile?"
      prompt: {text: "un'annuncio", tags: [article-form]}
    - learner: "Maschile: un annuncio, senza apostrofo."
    - tutor: "Brava. E cosa diceva l'annuncio?"
    # merlin-1325_9000675-4
    - learner: "Però - questo non avete scritto su annuncio."
      errors: [articulated-preposition, object-pronoun]
    - tutor: "Su «annuncio»? Davanti al nome manca l'articolo, che va unito a «su»."
      prompt: {text: "su annuncio", tags: [articulated-preposition]}
    - learner: "Sull'annuncio! Non avete scritto che il bar chiude alle dieci e la musica dura fino all'una."
    - tutor: "Esatto. Quindi il problema è la musica del bar qui sotto?"
      goals: [problem]
    - learner: "Sì, la musica è troppo forte. Non dormo da tre notti."
    - tutor: "Tre notti, mi dispiace tanto! Il venerdì e il sabato è sempre così, mi dispiace."
      goals: [since]
    - learner: "Potrei avere una camera dall'altra parte del building?"
      errors: [word-choice]
    - tutor: "Certo: dall'altra parte dell'hotel ho una camera al quarto piano, sul giardino. Lì non si sente niente: le va bene?"
      recast: {text: "del building", fix: "dell'hotel", tags: [word-choice]}
      goals: [request]
    # merlin-1325_1001119-6
    - learner: "Sono molto delusa del soggiorno passato presso il Residence, non era così come annuciato."
      errors: [spelling]
    - tutor: "Come «annuciato»? Manca una lettera, controlli bene."
      prompt: {text: "annuciato", tags: [spelling]}
    - learner: "Annunciato, con la n. Ma va bene, prendo la nuova camera."
    - tutor: "Perfetto. Ecco la chiave, e domani la colazione gliela offriamo noi."
      goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [past-participle-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Sì: nella mia camera c'è un odore molto forte di fumo e io non fumo."
    - tutor: "Mi dispiace molto. Da quando c'è questo odore?"
      goals: [problem]
      new: [{lemma: odore, gloss: smell}]
    - learner: "Da quando sono arrivato, alle sei. Ho aperto la finestra, ma niente."
    - tutor: "Capisco. Il cliente di prima forse ha fumato, anche se qui non si può. Che cosa vorrebbe che facessimo?"
      goals: [since]
    - learner: "Vorrei cambiare la camera, o almeno avere un discount."
      errors: [word-choice]
    - tutor: "Le cambio la camera subito e le faccio anche uno sconto. Purtroppo però sono libere solo camere più piccole: va bene lo stesso?"
      recast: {text: "un discount", fix: "uno sconto", tags: [word-choice]}
      goals: [request]
      new: [{lemma: sconto, gloss: discount}]
    # merlin-1325_9000316-24
    - learner: "Vi mando il mio numero di banca dove pottete rimandarmi i miei soldi."
      errors: [spelling]
    - tutor: "«Pottete»? Attenzione alle doppie in quel verbo."
      prompt: {text: "pottete", tags: [spelling]}
    - learner: "Dove potete rimandarmi i soldi, scusi."
    - tutor: "Non serve il numero di banca: le faccio lo sconto direttamente sul conto dell'hotel, il venti per cento."
      goals: [agree]
      new: [{lemma: sconto, gloss: discount}]


- scenario: reclamo-hotel
  level: B1
  persona: es-f-erasmus
  history: [participle-agreement]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001008-1
    - learner: "Sembrava una buona scelta il suo hotel. Ma tutto era al contrario come era scritta nel Suo annuncio."
      errors: [participle-agreement, word-choice]
    - tutor: "Come era «scritta»? Qui non parliamo di una cosa femminile: ci pensi un attimo."
      prompt: {text: "era scritta", tags: [participle-agreement]}
    - learner: "Come era scritto nell'annuncio. La camera doveva avere la vista sul mare."
    - tutor: "Esatto. E invece la sua camera dà sul parcheggio, vero? Mi dispiace."
      goals: [problem]
    - learner: "Sì, sul parcheggio, e da stamattina ci sono anche i lavori sotto la ventana."
      errors: [word-choice]
    - tutor: "Ha ragione, i lavori sotto la finestra sono cominciati oggi. Che cosa possiamo fare per lei?"
      recast: {text: "la ventana", fix: "la finestra", tags: [word-choice]}
      goals: [since]
    - learner: "Mi potrebbe dare una camera con la vista sul mare, come nell'annuncio?"
    - tutor: "Stasera sono tutte occupate, ma domani alle dieci si libera la 401, con vista mare."
      goals: [request]
    # merlin-1365_0100215-5
    - learner: "Aspettiamo la vostra risposta."
    - tutor: "La risposta è sì: domani mattina la 401 è vostra, e stasera vi offro la cena. D'accordo?"
    - learner: "D'accordo, grazie. Così va molto meglio."
    - tutor: "Perfetto, allora a domani. Buonanotte!"
      goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [object-pronoun]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, sono il vicino del piano di sotto, Robert. Scusi l'ora."
    - tutor: "Piacere, Robert. Nessun problema, mi dica."
      goals: [greet]
    # merlin-1325_9000105-8
    - learner: "Non posso parlare con qualcuno dove non vedo il viso!"
    - tutor: "Mi scusi, in che senso? È successo qualcosa?"
    - learner: "Sì, scusi: la sera faccio videochiamate con mia figlia in America, ma la vostra musica è troppo forte."
    - tutor: "Ah, la musica di mio figlio! Mi dispiace, non pensavo che si sentisse giù."
      goals: [problem]
    # merlin-1385_0001724-6
    - learner: "Per favore dirmi, se hai tempo."
      errors: [imperative-form, register]
    - tutor: "Scusi, come? «Dirmi»? Con il Lei, come mi chiede questa cosa?"
      prompt: {text: "dirmi", tags: [imperative-form]}
    - learner: "Mi dica, per favore, se ha tempo di parlare con suo figlio."
    - tutor: "Certo, gli parlo stasera stessa. Che cosa le andrebbe bene?"
      goals: [request]
    - learner: "Potrebbe girare giù la musica dopo le nove? Dalle otto alle nove faccio le chiamate."
      errors: [word-choice]
    - tutor: "Certo, posso abbassare la musica. Facciamo così: dopo le otto e mezza musica bassa, e nel fine settimana fino alle dieci. Le va bene?"
      recast: {text: "girare giù la musica", fix: "abbassare la musica", tags: [word-choice]}
      goals: [compromise]
    - learner: "Va benissimo, grazie. E scusi ancora per il disturbo."

    - tutor: "Ma si figuri, ha fatto bene a dirmelo. Buonanotte!"

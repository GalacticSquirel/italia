# B1, real learner sentences: holidays, Christmas traditions, a personal trainer.
- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [tense-aspect, past-participle-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1325_1001036-8
    - learner: "Ero un'anno fa in Germania (per una settimana) e d'estate in Italia (per un mese) e mi sento, che questi viaggi mi hanno aiutato molto."
      errors: [tense-aspect, spelling]
    - tutor: "«Ero» un anno fa in Germania? È un viaggio finito, con una data precisa: che tempo usiamo?"
      prompt: {text: "Ero un'anno fa in Germania", tags: [tense-aspect]}
    - learner: "Sono stata in Germania una settimana, e quest'estate in Italia per un mese."
    - tutor: "Esatto. Un mese in Italia, che bello! E com'era il tempo?"
      goals: [where]
    # merlin-1365_0100266-1
    - learner: "Questa settimana era fantastico!"
      errors: [adjective-agreement]
    - tutor: "«Fantastico»? Di che cosa parli, della settimana?"
      prompt: {text: "era fantastico", tags: [adjective-agreement]}
    - learner: "Sì, la settimana al mare era fantastico, con il sole tutti i giorni."
      errors: [adjective-agreement]
    - tutor: "Una settimana di sole: era fantastica davvero, che fortuna! E l'Italia ti è piaciuta?"
      recast: {text: "era fantastico", fix: "era fantastica", tags: [adjective-agreement]}
      goals: [weather]
    # merlin-1325_1001089-6
    - learner: "Mi piaceva molto."
    - tutor: "Lo immaginavo! E cosa hai fatto di bello?"
    # merlin-1325_1001048-5
    - learner: "E ho fatto un giro in Italia, perchè durante il questo tempo ho conoscuto la lingua, la cultura, il cibo, la gente."
      errors: [article-use, past-participle-form, spelling]
    - tutor: "Hai «conoscuto»? Con «conoscere» quella forma è un po' diversa."
      prompt: {text: "conoscuto", tags: [past-participle-form]}
    - learner: "Ho conoscuto tante persone, sì."
      errors: [past-participle-form]
    - tutor: "Che bello, hai conosciuto tante persone! E qual è stata la cosa più bella?"
      recast: {text: "conoscuto tante persone", fix: "conosciuto tante persone", tags: [past-participle-form]}
      goals: [activities]
    - learner: "La gente: tutti erano gentilissimi con me, anche quando parlavo male."
    - tutor: "Ma tu parli benissimo! Ecco perché tutti erano gentili."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0001070-5
    - learner: "Mio suocero ha una casa in quale siamo stati per una settimana."
      errors: [relative-pronoun]
    - tutor: "Una casa «in quale»? Con quel pronome manca qualcosa."
      prompt: {text: "in quale", tags: [relative-pronoun]}
    - learner: "Una casa nella quale siamo stati una settimana. È in Sardegna."
    - tutor: "Esatto. In Sardegna, che bello! Che tempo ha fatto?"
      goals: [where]
    - learner: "Ha fatto molto calor, sempre trenta gradi."
      errors: [word-choice]
    - tutor: "Trenta gradi? Che caldo! Almeno il mare era vicino?"
      recast: {text: "calor", fix: "caldo", tags: [word-choice]}
      goals: [weather]
    # merlin-1365_0100266-2
    - learner: "Sono stato a Sardegna a un artigiano, che dipinge armadi in stilo popolare."
      errors: [preposition, spelling]
    - tutor: "«A» Sardegna? Con le isole grandi, quale preposizione usiamo?"
      prompt: {text: "a Sardegna", tags: [preposition]}
    - learner: "A Sardegna, sì, vicino a Nuoro."
      errors: [preposition]
    - tutor: "Ah, in Sardegna, vicino a Nuoro! E cosa ti è piaciuto di più?"
      recast: {text: "A Sardegna", fix: "in Sardegna", tags: [preposition]}
      goals: [activities]
    # merlin-1365_0100203-0
    - learner: "Mi ha fatto un gran piacere."
    - tutor: "Che cosa? Vedere quell'uomo che dipinge gli armadi?"
    - learner: "Sì, vedere il suo lavoro. Ho comprato un piccolo armario dipinto."
      errors: [word-choice]
    - tutor: "Un piccolo armadio dipinto, che bel ricordo! Me lo devi far vedere."
      recast: {text: "armario", fix: "armadio", tags: [word-choice]}
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1325_1001111-1
    - learner: "Nella mia vita, ho avuto la possibilità di avere un soggiorno in Ingliaterra, per quasi un anno."
      errors: [spelling]
    - tutor: "In «Ingliaterra»? Controlla bene come si scrive."
      prompt: {text: "Ingliaterra", tags: [spelling]}
    - learner: "Inghilterra, con l'acca. Ma quest'anno sono andato in Toscana."
    - tutor: "Esatto. La Toscana, bellissima! E il tempo com'era?"
      goals: [where]
    - learner: "Il tempo era perfetto: non troppo caldo e non è mai piovuto."
    - tutor: "Che fortuna! E cosa hai fatto?"
      goals: [weather]
    # merlin-1325_9000533-1
    - learner: "Andavo spesso per trovare i famigliari, e così avevo occasione di approfondire la mia conoscenza della lingua."
      errors: [preposition]
    - tutor: "Andavi «per trovare» i famigliari? Con il verbo «andare», quale preposizione usiamo qui?"
      prompt: {text: "per trovare", tags: [preposition]}
    - learner: "Andavo per trovare i parenti, sì."
      errors: [preposition]
    - tutor: "Ah, andare a trovare i parenti è il modo migliore per parlare italiano! E il momento più bello?"
      recast: {text: "per trovare", fix: "a trovare", tags: [preposition]}
      goals: [activities]
    # merlin-1395_0000365-3
    - learner: "Da noi niente novità."
    - tutor: "Ma come, niente? Nemmeno un pranzo speciale?"
    - learner: "Sì, una cena con tutta la famiglia di mia moglie, a Siena. Eravamo in venti!"
    - tutor: "In venti, che festa! Questo sì che è un bel ricordo."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ho andato in Puglia con mio marito, due settimane."
      errors: [auxiliary-choice]
    - tutor: "«Ho» andato? Con il verbo «andare», usiamo «avere»?"
      prompt: {text: "Ho andato", tags: [auxiliary-choice]}
    - learner: "Sono andata in Puglia!"
    - tutor: "Brava. In Puglia, che bello! Faceva caldo?"
      goals: [where]
    - learner: "Sì, molto, ma c'era sempre un po' di vento."
    - tutor: "Il vento lì è perfetto. E cosa avete fatto?"
      goals: [weather]
    - learner: "Siamo stati a Lecce e a Otranto, e abbiamo preso un corso di cucina."
      errors: [word-choice]
    - tutor: "Avete fatto un corso di cucina! Allora adesso sai fare la pasta fresca?"
      recast: {text: "preso un corso di cucina", fix: "fatto un corso di cucina", tags: [word-choice]}
      goals: [activities]
    # merlin-1395_0001016-8
    - learner: "Tutto ha posto?"
      errors: [spelling]
    - tutor: "Sì, tutto bene, grazie! Ma «ha posto»? Attenzione: qui non c'è il verbo «avere»."
      prompt: {text: "ha posto", tags: [spelling]}
    - learner: "Tutto a posto, senza acca!"
    - tutor: "Esatto. Dai, e la cosa più bella della Puglia?"
    - learner: "Il mare: era trasparente come in piscina."
    - tutor: "Allora devo andarci anche io l'estate prossima!"
      goals: [best]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    # merlin-1365_0100133-2
    - learner: "Sono molto lieta di essere invitata."
    - tutor: "Ma figurati, è un piacere! Allora, da voi in Australia com'è il Natale?"
    - learner: "Da noi a Natale fa caldo e si mangia al mare, con il barbecue."
    - tutor: "Natale al mare, che strano per me! E quando eri piccola?"
      goals: [compare]
    - learner: "Da piccola io e mia sorella aprevamo i regali alle sei di mattina."
      errors: [imperfetto-form]
    - tutor: "«Aprevamo»? Pensa al verbo «aprire»: come fa all'imperfetto?"
      prompt: {text: "aprevamo", tags: [imperfetto-form]}
    - learner: "Aprevamo... non sono sicura."
      errors: [imperfetto-form]
    - tutor: "Anche noi aprivamo i regali prestissimo! Mia madre si arrabbiava sempre."
      recast: {text: "aprevamo", fix: "aprivamo", tags: [imperfetto-form]}
      goals: [past]
    - learner: "È vero che in Italia i regali li porta anche la Befana?"
    - tutor: "Sì, il 6 gennaio, ai bambini! Porta dolci a chi è buono e carbone a chi è cattivo."
      goals: [ask]
      new: [{lemma: carbone, gloss: coal}]
    # merlin-1365_0100017-4
    - learner: "Un'altra cosa vorrei sapere che cosa volete come regalo, non ho nessuna idea."
    - tutor: "Nessun regalo, davvero! Se vuoi, porta un dolce del tuo paese."
    # merlin-1365_0100183-13
    - learner: "Avete bisogno d'aiuto?"
    - tutor: "Magari vieni alle undici e mi aiuti con la pasta! Ti aspetto."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    # merlin-1365_0100177-2
    - learner: "Grazie per l'invito."
    - tutor: "Ma figurati! Allora, in Spagna com'è?"
    - learner: "In Spagna la cena della Vigilia è la più importante, e il 6 gennaio arrivano i Re Magi."
    - tutor: "Ah, i Re Magi! Da noi invece c'è la Befana."
      goals: [compare]
    - learner: "Quando ero piccola, la notte del 5 lasciavamo le scarpe fuori dalla puerta."
      errors: [word-choice]
    - tutor: "Le scarpe fuori dalla porta, che bella tradizione! E la mattina dopo erano piene di regali?"
      recast: {text: "puerta", fix: "porta", tags: [word-choice]}
      goals: [past]
    # merlin-1365_0100183-4
    - learner: "Da quanti anni state insieme adesso?"
    - tutor: "Io e Marco? Da otto anni! E questo è il primo Natale nella casa nuova."
    # merlin-1365_0100285-5
    - learner: "Verso alle 6 siamo da voi."
      errors: [articulated-preposition]
    - tutor: "«Verso alle» 6? Con «verso», l'articolo da solo basta: niente «a»."
      prompt: {text: "Verso alle", tags: [articulated-preposition]}
    - learner: "Verso le 6! Posso portare qualcosa?"
    - tutor: "Esatto. Porta solo il vino, al resto pensiamo noi."
      goals: [plan]
    - learner: "Perfetto. E cosa si mangia, di solito, la sera della Vigilia?"
    - tutor: "Da noi solo pesce: pasta con le vongole e tanto pesce al forno!"
      goals: [ask]
      new: [{lemma: vongola, gloss: clam}]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In America mangiamo il tacchino e apriamo i regali la mattina del 25."
    - tutor: "Il tacchino, come nei film! E quando eri bambino?"
      goals: [compare]
    - learner: "Da bambino andavamo dai nonni italiani: mia nonna faceva i cappelletti per tutti."
    - tutor: "Ah, quindi le tradizioni italiane le conosci già!"
      goals: [past]
    # merlin-1365_0100133-7
    - learner: "Avete qualche proposta per me, forse qualcosa speciale dall'America?"
      errors: [preposition]
    - tutor: "«Qualcosa speciale»? Tra «qualcosa» e l'aggettivo manca una piccola parola."
      prompt: {text: "qualcosa speciale", tags: [preposition]}
    - learner: "Qualcosa speciale... non so quale parola."
      errors: [preposition]
    - tutor: "Qualcosa di speciale dall'America? Porta i dolci di tua nonna, così li proviamo!"
      recast: {text: "qualcosa speciale", fix: "qualcosa di speciale", tags: [preposition]}
      goals: [plan]
    # merlin-1365_0100134-4
    - learner: "Naturalmente verrò alla festa!"
    - tutor: "Lo spero bene! A Natale si gioca anche a tombola, la conosci?"
      new: [{lemma: tombola, gloss: Italian bingo game}]
    - learner: "No. Come si gioca?"
    - tutor: "Si gioca con i numeri da 1 a 90, e chi trova per primo tutti i suoi numeri vince!"
      goals: [ask]

- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1365_0100220-9
    - learner: "Il mio capo era via per tre mesi e perciò avevo molto da fare."
    - tutor: "Capisco, quindi niente tempo per lo sport. E adesso?"
    - learner: "Adesso lavoro meno, ma mangio male e dormo poco."
    - tutor: "Va bene, partiamo da qui. Qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Vorrei essere più in forma che l'anno scorso, e perdere cinque chili."
      errors: [comparative]
    - tutor: "Più in forma «che» l'anno scorso? Con un confronto così, quale parola usiamo?"
      prompt: {text: "che l'anno scorso", tags: [comparative]}
    - learner: "Più in forma dell'anno scorso!"
    - tutor: "Perfetto. Cinque chili si possono perdere. Che cosa ti ferma, di solito?"
      goals: [goal]
    - learner: "Il lavoro, soprattutto. Torno a casa cansato e non ho voglia di fare niente."
      errors: [word-choice]
    - tutor: "Capisco, se torni a casa stanco è difficile. Allora facciamo poco ma spesso: venti minuti, quattro volte alla settimana, a casa. Ce la fai?"
      recast: {text: "cansato", fix: "stanco", tags: [word-choice]}
      goals: [obstacles]
    - learner: "Venti minuti? Sì, ce la faccio!"
    - tutor: "Bravo!
 Cominciamo lunedì, ti mando il programma.
"
      goals: [plan]

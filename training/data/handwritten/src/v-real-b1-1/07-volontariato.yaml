# B1, real learner sentences: an information day at a volunteering association, a book club.
- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001029-5
    - learner: "Adesso ho 34 anni, da 10 anni sono insegnante, ho tante esperienze dall lavoro dei giovani."
      errors: [preposition]
    - tutor: "Tante esperienze «dall» lavoro? Quella preposizione non va bene: prova di nuovo."
      prompt: {text: "esperienze dall lavoro", tags: [preposition]}
    - learner: "Tante esperienze del lavoro con i giovani."
      errors: [preposition]
    - tutor: "Dieci anni di scuola sono tante esperienze di lavoro con i giovani: per noi è perfetto!"
      recast: {text: "esperienze del lavoro", fix: "esperienze di lavoro", tags: [preposition]}
      goals: [skills]
    # merlin-1325_1001029-8
    - learner: "Fino di questo momento ho lavorato soltanto in Europa, e soltanto con i miei alunni, chi vengono dall condizioni ordinati."
      errors: [preposition, relative-pronoun, articulated-preposition, adjective-agreement]
    - tutor: "I tuoi alunni, «chi» vengono...? Qui quel pronome non è quello giusto."
      prompt: {text: "chi vengono", tags: [relative-pronoun]}
    - learner: "I miei alunni che vengono da famiglie normali."
    - tutor: "Esatto. E perché adesso vuoi fare volontariato?"
    # merlin-1325_9000107-5
    - learner: "Vorrei sentirmi utile e penso che se ogni uno di noi fa qualche cosa, il mondo puo migliorare al meno un pò."
      errors: [spelling]
    - tutor: "Bellissimo pensiero. Ma «ogni uno»: si scrive davvero così, in due parole?"
      prompt: {text: "ogni uno", tags: [spelling]}
    - learner: "No, tutto attaccato: ognuno di noi."
    - tutor: "Esatto. E quanto tempo hai per noi?"
      goals: [motivation]
    # merlin-1325_9000322-4
    - learner: "Per quanto riguarda il periodo del lavoro sarei libera dal 1 luglio al 1 agosto."
    - tutor: "Un mese intero, fantastico! Abbiamo un campo per bambini in montagna, e un mercatino per raccogliere soldi."
      goals: [time]
      new: [{lemma: mercatino, gloss: little market, stall}]
    # merlin-1325_9000137-5
    - learner: "Infatti, posso portare alcuni dei miei vestiti vecchi al campo per venderli."
    - tutor: "Ottima idea! Allora ti metto al campo con i bambini, e i vestiti li vendiamo al mercato di agosto."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [conditional-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000684-2
    - learner: "Sarei veramente interessato a collaborare con voi durante il periodo estivo in giugno e agosto."
    - tutor: "Che bello, d'estate abbiamo sempre bisogno di aiuto! Come mai ti interessa?"
      goals: [time]
    # merlin-1325_9000317-6
    - learner: "Vorrei utilizzare questo tempo libero in modo prodottivo anziche andare in vacanza."
      errors: [spelling]
    - tutor: "In modo «prodottivo»? Controlla bene la lettera dopo la «d»."
      prompt: {text: "prodottivo", tags: [spelling]}
    - learner: "In modo prodottivo, sì, è così."
      errors: [spelling]
    - tutor: "Usare il tempo libero in modo produttivo è una bellissima idea, molto meglio di una vacanza!"
      new: [{lemma: produttivo, gloss: productive}]
      recast: {text: "prodottivo", fix: "produttivo", tags: [spelling]}
      goals: [motivation]
    # merlin-1325_9000137-2
    - learner: "Per questo motivo mi piacciono molto le vostre attività!"
    - tutor: "Grazie! E tu che cosa sai fare?"
    # merlin-1325_9000279-8
    - learner: "Sono pronto di fare ogni tipo di lavoro compreso anche i vostri che sono dentro annuncio."
      errors: [preposition, articulated-preposition]
    - tutor: "Sei pronto «di» fare? Con «pronto», quale preposizione usiamo?"
      prompt: {text: "pronto di fare", tags: [preposition]}
    - learner: "Pronto a fare ogni tipo di lavoro! Ero ingegnere, so riparare tante cose."
    - tutor: "Esatto. Un ingegnere! Allora potresti aiutarci a sistemare la casa per gli anziani. Ti interessa?"
      goals: [skills]
    # merlin-1325_1001063-1
    - learner: "Io posso aiutarti."
    - tutor: "Fantastico! Allora ti segno per i lavori nella casa degli anziani, a giugno e ad agosto."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [noun-number]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000685-5
    - learner: "Visto che sono disponibile durante tutto il mese di luglio vorrei aiutarvi in un progetto da Voi organizzato."
    - tutor: "Perfetto, a luglio abbiamo tanti progetti. Perché ti interessa?"
    # merlin-1325_1001133-9
    - learner: "Ho fatto tanti amici stranieri e parlo con loro ogni giorno su Facebook."
    - tutor: "Quindi ti piace conoscere persone di altri paesi: qui ne conoscerai tante!"
      goals: [motivation]
    # merlin-1325_1001027-9
    - learner: "Vorrei lavorare 6 o 8 ore al giorno, se è necesario anche nel fine settimane."
      errors: [noun-number, spelling]
    - tutor: "Nel fine «settimane»? Attenzione: qui la seconda parola non cambia mai."
      prompt: {text: "fine settimane", tags: [noun-number]}
    - learner: "Nei fine settimane, sì."
      errors: [noun-number]
    - tutor: "Perfetto, anche nel fine settimana c'è sempre bisogno di aiuto! E cosa sai fare?"
      recast: {text: "fine settimane", fix: "fine settimana", tags: [noun-number]}
      goals: [time]
    - learner: "So cocinare bene e parlo spagnolo e inglese."
      errors: [word-choice]
    - tutor: "Se sai cucinare bene, le nostre cene del giovedì con i rifugiati sono perfette per te!"
      recast: {text: "cocinare", fix: "cucinare", tags: [word-choice]}
      goals: [skills]
      new: [{lemma: rifugiato, gloss: refugee}]
    # merlin-1325_1001168-8
    - learner: "Devo pagare per i ingredienti, o per le serate soltante?"
      errors: [article-form, spelling]
    - tutor: "Per «i» ingredienti? Davanti a «ingredienti», che articolo usiamo?"
      prompt: {text: "i ingredienti", tags: [article-form]}
    - learner: "Per gli ingredienti! Devo pagare io?"
    - tutor: "Esatto. No, paga tutto l'associazione! Allora ti segno per le cene del giovedì."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [past-participle-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000279-6
    - learner: "Questo anno il mio responsabile di lavoro mi ha datto le vacanze in agosto, prime due settimane."
      errors: [past-participle-form, article-use]
    - tutor: "Ti ha «datto» le vacanze? La forma giusta di «dare» è più semplice."
      prompt: {text: "datto", tags: [past-participle-form]}
    - learner: "Mi ha dato le vacanze, scusa!"
    - tutor: "Esatto. Due settimane ad agosto, perfetto. Hai già fatto volontariato?"
      goals: [time]
    # merlin-1325_9000152-6
    - learner: "Ogni giorno imparando le cose nuove e aiutando la gente era passata la mia estate."
      errors: [tense-aspect, article-use]
    - tutor: "La tua estate «era passata»? Parli di un'estate finita, vista tutta intera: quale tempo serve?"
      prompt: {text: "era passata", tags: [tense-aspect]}
    - learner: "La mia estate era passata così, l'anno scorso."
      errors: [tense-aspect]
    - tutor: "Che bello, un'estate che è passata così, imparando e aiutando! Quindi vuoi rifarlo."
      recast: {text: "era passata", fix: "è passata", tags: [tense-aspect]}
      goals: [motivation]
    # merlin-1325_9000152-4
    - learner: "Magari posso imparare sempre qualcosa nuova li."
      errors: [adjective-agreement, preposition, spelling]
    - tutor: "Qualcosa «nuova»? Attenzione: «qualcosa» non è femminile."
      prompt: {text: "qualcosa nuova", tags: [adjective-agreement]}
    - learner: "Qualcosa di nuovo! E so disegnare e suonare la chitarra: vorrei lavorare con i bambini."
    - tutor: "Esatto. Allora il campo d'estate con i bambini fa per te: musica e disegno tutti i giorni!"
      goals: [skills, choose]

- scenario: volontariato
  level: B1
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001011-6
    - learner: "Sono stata impiegata in GAL (Gruppo Azzione Locale) quindi lo so come importante è il sviluppo, anche presso l'universita sto studiando politico di sviluppo reggionale."
      errors: [article-form, word-order, spelling]
    - tutor: "Interessante! Però «il sviluppo»? Pensa all'articolo davanti a «sviluppo»."
      prompt: {text: "il sviluppo", tags: [article-form]}
    - learner: "Lo sviluppo, scusa. So come è importante lo sviluppo."
    - tutor: "Esatto. Quindi ti interessano i progetti nei paesi poveri?"
      goals: [motivation, skills]
    # merlin-1325_1001021-4
    - learner: "Per questi motivi in agosto vorrei dedicarmi a aiutare e partecipare attivamente nelli Vostri programmi."
      errors: [articulated-preposition]
    - tutor: "«Nelli» vostri programmi? Questa forma non esiste: come si dice?"
      prompt: {text: "nelli", tags: [articulated-preposition]}
    - learner: "Nelle vostri programmi?"
      errors: [articulated-preposition]
    - tutor: "Quasi! Nei nostri programmi di agosto c'è posto, sì: un mese in Kenya, in una scuola."
      recast: {text: "Nelle", fix: "Nei", tags: [articulated-preposition]}
      goals: [time]
    - learner: "Quanto costa il viaggio?"
    - tutor: "Il volo lo paghi tu, circa 600 euro; vitto e casa li paghiamo noi."
      new: [{lemma: vitto, gloss: board, meals}]
    # merlin-1325_9000137-10
    - learner: "Allora, scrivetemi quando avete deciso in quale campo posso partecipare."
      errors: [preposition]
    - tutor: "Decidiamo questa settimana, promesso. Ma attenzione: partecipare «in quale» campo?"
      prompt: {text: "in quale campo", tags: [preposition]}
    - learner: "A quale campo posso partecipare, scusa."
    - tutor: "Esatto! Ti scriviamo venerdì: secondo me il campo in Kenya è perfetto per te."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [tense-aspect, hypothetical]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_1001021-2
    - learner: "Da bambina sono appassionata delle lingue, così conosco l'inglese, lo spagnolo e l'italiano."
      errors: [tense-aspect]
    - tutor: "Da bambina «sono» appassionata? Parli di quando eri piccola: quale tempo usiamo?"
      prompt: {text: "Da bambina sono appassionata", tags: [tense-aspect]}
    - learner: "Da bambina ero appassionata delle lingue."
    - tutor: "Esatto. Tre lingue sono preziose per noi: aiutiamo tante famiglie straniere."
      goals: [skills]
    - learner: "Mi piace aiutare le famiglie che arrivano da altri paesi."
    - tutor: "Che bello! E perché vuoi farlo proprio adesso?"
    # merlin-1325_1001019-3
    - learner: "Mi piacerebbe lavorare nell Vostro campo, se mie competenze sarebbero abbastanze."
      errors: [hypothetical, articulated-preposition, possessive, adjective-agreement]
    - tutor: "Se le competenze «sarebbero» abbastanza? Dopo «se», qui, quale forma del verbo ci vuole?"
      prompt: {text: "se mie competenze sarebbero", tags: [hypothetical]}
    - learner: "Se le mie competenze sarebbero..."
      errors: [hypothetical]
    - tutor: "Se le tue competenze fossero poche, te lo direi! Ma sono perfette. Quanto tempo hai?"
      recast: {text: "sarebbero", fix: "fossero", tags: [hypothetical]}
      goals: [motivation]
    - learner: "Due sere alla settimana, il martedì e il giovedì."
    - tutor: "Benissimo: il martedì aiuti i bambini con i compiti e il giovedì traduci per le famiglie. Ti va?"
      goals: [time]
    - learner: "Sì, mi va benissimo."
    - tutor: "Fantastico, allora ti aspettiamo martedì alle sei!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto. Lavoro nel marketing
, ma vorrei fare qualcosa di utile."
    - tutor: "Che bello! Che cosa ti ha fatto venire questa idea?"
    # merlin-1325_9000152-7
    - learner: "Sono sicura che lavoro che noi possiamo fare davvero serve alla gente e spero tanto che aiuterá a finanzare proggetti di sviluppo in paesi più poveri."
      errors: [article-use, spelling]
    - tutor: "Sei sicura che «lavoro» che possiamo fare...? Lì manca una piccola parola."
      prompt: {text: "che lavoro che", tags: [article-use]}
    - learner: "Che il lavoro che possiamo fare serve davvero."
    - tutor: "Esatto, e serve davvero, te lo assicuro. Quanto tempo potresti darci?"
      goals: [motivation]
    # merlin-1365_0100194-3
    - learner: "Comincerei il 3 luglio se aveste ancora posti liberi per questo periodo."
    - tutor: "Sì, a luglio c'è posto. Con il tuo lavoro potresti aiutarci a organizzare la festa di raccolta fondi."
      goals: [time, skills]
      new: [{lemma: raccolta fondi, gloss: fundraising}]
    # merlin-1325_1001036-10
    - learner: "Spero, che ho potuto aiutare."
      errors: [subjunctive-use]
    - tutor: "Ma certo che puoi aiutare! Però: spero che «ho potuto»? Dopo «spero che» quale modo usiamo?"
      prompt: {text: "che ho potuto", tags: [subjunctive-use]}
    - learner: "Spero che abbia potuto... che io possa aiutare!"
    - tutor: "Perfetto, che tu possa aiutare! Allora ti segno per la festa di luglio."
      goals: [choose]

- scenario: film-libro
  level: B1
  persona: en-f-student
  history: [demonstrative]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io! Ho letto una novella che parla di un ragazzo che passa tutto il giorno in chat."
      errors: [false-friend]
    - tutor: "Un romanzo su un ragazzo in chat: un tema molto vicino a noi. E com'è il ragazzo?"
      recast: {text: "una novella", fix: "un romanzo", tags: [false-friend]}
      goals: [summary]
    # merlin-1325_1001046-3
    - learner: "Quando chiacchiera con un persone sulle chat, non puoi sapere chi è lui / lei in realtà."
      errors: [noun-gender, noun-number, articulated-preposition]
    - tutor: "Con «un persone»? Controlla bene l'articolo e il nome."
      prompt: {text: "un persone", tags: [noun-gender]}
    - learner: "Con una persona. Lui è molto solo e non sa chi c'è dall'altra parte."
    - tutor: "Esatto. Un ragazzo solo, quindi. E tu che cosa ne pensi?"
      goals: [characters]
    # merlin-1325_9000106-1
    - learner: "Penso che le amicizie virtuali non siano quelli che ti servono."
      errors: [demonstrative]
    - tutor: "Non siano «quelli»? A cosa ti riferisci: alle amicizie, giusto?"
      prompt: {text: "quelli che ti servono", tags: [demonstrative]}
    - learner: "Sì, alle amicizie: non sono quelli che ti servono."
      errors: [demonstrative]
    - tutor: "Ah, quindi le amicizie vere sono quelle che ti servono. Sono d'accordo con te!"
      recast: {text: "quelli che ti servono", fix: "quelle che ti servono", tags: [demonstrative]}
      goals: [opinion]
    # merlin-1365_0100225-4
    - learner: "Mi è piacuto molto!"
      errors: [past-participle-form]
    - tutor: "Ti è «piacuto»? Con «piacere» quella forma è un po' diversa.
"
      prompt: {text: "piacuto", tags: [past-participle-form]}
    - learner: "Mi è piaciuto molto! Lo consiglio ai ragazzi che passano troppo tempo al computer."
    - tutor: "Esatto. E forse anche a qualche adulto! Grazie, chi è il prossimo?"
      goals: [recommend]

- scenario: bar-colazione
  level: A1
  persona: es-f-erasmus
  history: [negation]
  turns:
    - tutor: Buongiorno! Cosa prende?
    - learner: Buongiorno! Un cappuccino, ma io voglio zucchero no.
      errors: [negation]
    - tutor: Buongiorno! Voglio zucchero no? Come si dice in italiano?
      goals: [greet, order-drink]
      prompt: {text: io voglio zucchero no, tags: [negation]}
    - learner: Io voglio zucchero non.
      errors: [negation]
    - tutor: Ah, io non voglio lo zucchero! Va bene, un cappuccino senza zucchero.
      recast: {text: Io voglio zucchero non, fix: io non voglio lo zucchero, tags: [negation]}
    - learner: Sì, grazie. E un cornetto vuoto.
    - tutor: Ecco il cappuccino e il cornetto.
      goals: [order-food]
    - learner: Quanto costa?
    - tutor: Sono 2,50 euro.
    - learner: Ecco a Lei. Ciao!
    - tutor: Grazie, arrivederci!

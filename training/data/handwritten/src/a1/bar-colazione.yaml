- scenario: bar-colazione
  level: A1
  persona: en-f-student
  turns:
    - tutor: Buongiorno! Cosa prende?
    - learner: Buongiorno! Un cappuccino, per favore.
    - tutor: Certo, un cappuccino. Vuole anche qualcosa da mangiare?
      goals: [greet, order-drink]
    - learner: Sì, una cornetto, per favore.
      errors: [noun-gender]
    - tutor: Una cornetto? Cornetto è maschile.
      prompt: {text: una cornetto, tags: [noun-gender]}
      new: [{lemma: maschile, gloss: masculine}]
    - learner: Ah, un cornetto!
    - tutor: Esatto! Ecco il cappuccino e il cornetto.
      goals: [order-food]
    - learner: Grazie. Quanto costa?
    - tutor: Sono tre euro. Ecco lo scontrino.
    - learner: Ecco tre euro. Grazie, arrivederci!
    - tutor: Grazie a Lei! Buona giornata!
      goals: [pay]

- scenario: bar-colazione
  level: A1
  persona: en-m-retired
  history: [modal-infinitive]
  turns:
    - tutor: Buongiorno! Cosa prende?
    - learner: Buongiorno. Io voglio di bere un caffè.
      errors: [modal-infinitive]
    - tutor: Buongiorno! Voglio di bere? Dopo voglio, niente di.
      goals: [greet]
      prompt: {text: voglio di bere, tags: [modal-infinitive]}
    - learner: Voglio bere un caffè, per favore.
    - tutor: Perfetto! Un caffè. Con zucchero?
      goals: [order-drink]
    - learner: No, senza zucchero, grazie.
    - tutor: Va bene. Prende anche un cornetto?
    - learner: Sì, un cornetto con la crema.
      errors: []
    - tutor: Ecco il caffè e il cornetto con la crema.
      goals: [order-food]
      new: [{lemma: crema, gloss: custard}]
    - learner: Quanto pago?
    - tutor: Sono 2,50 euro. Può pagare qui al bancone.
    - learner: Ecco. Buona giornata!
    - tutor: Grazie, anche a Lei! Arrivederci!
      goals: [pay]

- scenario: bar-colazione
  level: A1
  persona: es-f-erasmus
  turns:
    - tutor: Buongiorno! Cosa prende?
    - learner: Buongiorno! Vorrei un tè caldo, per favore.
    - tutor: Un tè caldo, va bene. Con latte o con zucchero?
      goals: [greet, order-drink]
    - learner: Con zucchero. E anche un cornetto, per favore.
    - tutor: Certo! Ecco il tè e il cornetto.
      goals: [order-food]
    - learner: Grazie! Quanto es?
      errors: [verb-form]
    - tutor: Quanto es? In italiano non si dice così.
      prompt: {text: Quanto es, tags: [verb-form]}
    - learner: Quanto è?
    - tutor: Esatto! Sono 3 euro, per favore.
    - learner: Ecco a Lei. Arrivederci!
    - tutor: Grazie e buona giornata!
      goals: [pay]

- scenario: bar-colazione
  level: A1
  persona: en-m-traveller
  turns:
    - tutor: Buongiorno! Cosa prende?
    - learner: Ciao! Un caffè, please.
      errors: [word-choice]
    - tutor: Buongiorno! Un caffè, per favore, certo. Lo vuole con zucchero?
      goals: [greet, order-drink]
      recast: {text: please, fix: per favore, tags: [word-choice]}
    - learner: Sì, con zucchero. Avete cornetti?
    - tutor: Sì, abbiamo cornetti con la marmellata.
      new: [{lemma: marmellata, gloss: jam}]
    - learner: Un cornetto con la marmellata, per favore.
    - tutor: Ecco il caffè e il cornetto.
      goals: [order-food]
    - learner: Grazie! Quanto costa tutto?
    - tutor: Sono 2,80 euro. Ecco lo scontrino.
    - learner: Pago con la carta, va bene?
    - tutor: Sì, certo, va bene. Grazie e arrivederci!
      goals: [pay]


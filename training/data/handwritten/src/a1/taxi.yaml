- scenario: taxi
  level: A1
  persona: es-f-teacher
  history: [register]
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: Buongiorno. All'albergo Bellavista, per favore.
    - tutor: Va bene. Ha una valigia?
      goals: [destination]
    - learner: Sì, due valigie. Quanto tempo ci vuole?
    - tutor: Ci vogliono venti minuti.
      goals: [ask-time]
    - learner: E quanto costa? Accetti la carta?
      errors: [register]
    - tutor: Accetti? Lei parla con un tassista...
      goals: [ask-price]
      prompt: {text: Accetti, tags: [register]}
      new: [{lemma: tassista, gloss: taxi driver}]
    - learner: Accetta la carta?
    - tutor: Sì, certo. Sono 22 euro.
    - learner: Ecco la carta. Grazie!
    - tutor: Grazie a Lei! Buona giornata!
      goals: [pay]

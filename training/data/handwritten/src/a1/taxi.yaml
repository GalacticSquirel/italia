- scenario: taxi
  level: A1
  persona: en-f-student
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: Buongiorno! Alla stazione, per favore.
    - tutor: Va bene. Ha una valigia?
      goals: [destination]
    - learner: Sì, una valigia. Quanto tempo ci vuole?
    - tutor: Ci vogliono quindici minuti, più o meno.
      goals: [ask-time]
    - learner: E quanto costa?
    - tutor: Costa più o meno 20 euro.
      goals: [ask-price]
    - learner: Va bene. Posso pagare con la carta?
    - tutor: Sì, certo.
    - learner: Ecco la carta. Grazie e arrivederci!
    - tutor: Grazie a Lei, buon viaggio!
      goals: [pay]

- scenario: taxi
  level: A1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: Buongiorno. Vado in albergo Roma, in via Verdi.
      errors: [articulated-preposition]
    - tutor: In albergo Roma? Qui ci vuole un'altra preposizione.
      prompt: {text: in albergo Roma, tags: [articulated-preposition]}
      new: [{lemma: preposizione, gloss: preposition}]
    - learner: All'albergo Roma, in via Verdi.
    - tutor: Perfetto. Via Verdi, va bene.
      goals: [destination]
    - learner: Quanti minuti ci vogliono?
    - tutor: Venti minuti, più o meno. C'è traffico.
      goals: [ask-time]
      new: [{lemma: traffico, gloss: traffic}]
    - learner: E quanto costa?
    - tutor: Costa più o meno 25 euro.
      goals: [ask-price]
    - learner: Ecco 25 euro. Grazie.
    - tutor: Grazie a Lei! Arrivederci.
      goals: [pay]

- scenario: taxi

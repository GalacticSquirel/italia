- scenario: taxi
  level: A1
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: Al ostello in piazza Venezia.
      errors: [articulated-preposition]
    - tutor: Al ostello? Ostello comincia con o...
      prompt: {text: Al ostello, tags: [articulated-preposition]}
    - learner: All'ostello in piazza Venezia!
    - tutor: Esatto! Va bene, piazza Venezia.
      goals: [destination]
    - learner: Ci vuole molto?
    - tutor: No, dieci minuti.
      goals: [ask-time]
    - learner: Quanto costa più o meno?
    - tutor: Più o meno 12 euro.
      goals: [ask-price]
    - learner: Ok. Ecco 15 euro, va bene così.
    - tutor: Grazie mille! Buona giornata!
      goals: [pay]

- scenario: taxi
  level: A1
  persona: en-f-professional
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: In via Garibaldi, numero 8, per favore.
    - tutor: Va bene, via Garibaldi 8.
      goals: [destination]
    - learner: Ho un appuntamento alle dieci. Quanto tempo ci vuole?
    - tutor: Ci vogliono quindici minuti. Arriviamo prima delle dieci.
      goals: [ask-time]
      new: [{lemma: appuntamento, gloss: appointment}]
    - learner: Ottimo. Quanto costa?
    - tutor: Più o meno 18 euro.
      goals: [ask-price]
    - learner: Ecco la mia carta.
    - tutor: Grazie. Ecco la ricevuta. Buona giornata!
      goals: [pay]
      new: [{lemma: ricevuta, gloss: receipt}]

- scenario: taxi
  level: A1
  persona: es-m-worker
  history: [question-form]
  turns:
    - tutor: Buongiorno! Dove la porto?
    - learner: Al ristorante Da Mario, in centro.
    - tutor: Conosco il ristorante. Va bene!
      goals: [destination]
    - learner: Quanti minuti?
    - tutor: Più o meno dieci minuti.
      goals: [ask-time]
    - learner: Quanto è costa?
      errors: [verb-form]
    - tutor: Quanto è costa? C'è una parola in più.
      prompt: {text: Quanto è costa, tags: [verb-form]}
    - learner: Quanto costa?
    - tutor: Esatto! Costa più o meno 10 euro.
      goals: [ask-price]
    - learner: Ecco 10 euro in contanti.
    - tutor: Grazie! Buon lavoro!
      goals: [pay]

- scenario: taxi

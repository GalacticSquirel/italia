- scenario: abbigliamento
  level: A1
  persona: en-f-student
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno! Cerco una maglietta.
    - tutor: Certo! Di che colore?
      goals: [ask-item]
    - learner: Una maglietta rosso, taglia M.
      errors: [adjective-agreement]
    - tutor: Una maglietta rosso? Maglietta è femminile.
      prompt: {text: Una maglietta rosso, tags: [adjective-agreement]}
      new: [{lemma: femminile, gloss: feminine}]
    - learner: Una maglietta rossa!
    - tutor: Esatto! Ecco una maglietta rossa, taglia M.
      goals: [size-colour]
    - learner: Posso provare la maglietta?
    - tutor: Certo, il camerino è lì, a destra.
      goals: [try]
    - learner: Va bene. La prendo. Quanto costa?
    - tutor: Costa 20 euro. Oggi c'è uno sconto, quindi sono 15 euro.
    - learner: Perfetto! Pago con la carta.
    - tutor: Benissimo. Grazie e buona giornata!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: en-m-retired
  history: [demonstrative]
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Sì, grazie. Cerco una maglietta blu.
    - tutor: Abbiamo molte magliette blu. Che taglia ha?
      goals: [ask-item]
    - learner: Taglia L. Quanto costa questo maglietta?
      errors: [demonstrative]
    - tutor: Questo maglietta? Guardi bene la parola maglietta.
      goals: [size-colour]
      prompt: {text: questo maglietta, tags: [demonstrative]}
    - learner: Questa maglietta! Quanto costa?
    - tutor: Bravo! Costa 18 euro.
    - learner: Posso provare questa maglietta?
    - tutor: Sì, certo. Il camerino è in fondo.
      goals: [try]
      new: [{lemma: fondo, gloss: back (of the shop)}]
    - learner: La taglia va bene. La prendo.
    - tutor: Ottimo! Vuole pagare in contanti o con la carta?
    - learner: Con la carta, per favore.
    - tutor: Ecco a Lei. Grazie e arrivederci!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: es-f-erasmus
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno! Cerco una maglietta para l'estate.
      errors: [preposition]
    - tutor: Para l'estate? Come si dice para in italiano?
      prompt: {text: para, tags: [preposition]}
    - learner: Per l'estate!
    - tutor: Esatto! Che taglia e che colore cerca?
      goals: [ask-item]
    - learner: Taglia S. Il colore blu o bianco.
    - tutor: Ecco una maglietta blu, taglia S. Le piace?
      goals: [size-colour]
    - learner: Sì, molto bella! Dov'è il camerino?
    - tutor: Il camerino è lì, a sinistra.
      goals: [try]
    - learner: Va bene, la prendo. C'è uno sconto?
    - tutor: Sì, oggi c'è uno sconto. Sono 12 euro.
    - learner: Perfetto! Ecco 12 euro.
    - tutor: Grazie mille! Buona giornata!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: en-m-traveller
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Ciao! Cerco una t-shirt.
      errors: [word-choice]
    - tutor: Ah, una maglietta! Sì, abbiamo molte magliette. Di che colore?
      goals: [ask-item]
      recast: {text: t-shirt, fix: una maglietta, tags: [word-choice]}
    - learner: Verde, taglia L.
    - tutor: Mi dispiace, verde non c'è. C'è rossa o blu.
    - learner: Allora blu, per favore.
    - tutor: Ecco una maglietta blu, taglia L.
      goals: [size-colour]
    - learner: Posso provarla?
    - tutor: Certo, il camerino è qui.
      goals: [try]
    - learner: Va bene. Quanto costa?
    - tutor: Costa 15 euro.
    - learner: Ok, la prendo. Ecco i soldi.
    - tutor: Grazie! Ecco a Lei. Arrivederci!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno. Cerco due magliette per il lavoro.
    - tutor: Va bene. Che taglia porta?
      goals: [ask-item]
      new: [{lemma: portare, gloss: to wear}]
    - learner: Porto la taglia M. Vorrei due magliette bianco.
      errors: [adjective-agreement]
    - tutor: Due magliette bianco? Sono due magliette...
      prompt: {text: due magliette bianco, tags: [adjective-agreement]}
    - learner: Due magliette bianche.
    - tutor: Brava! Ecco due magliette bianche, taglia M.
      goals: [size-colour]
    - learner: Posso provare una maglietta?
    - tutor: Certo, il camerino è a destra.
      goals: [try]
    - learner: Grazie. Queste magliette vanno bene. Quanto costano?
    - tutor: Costano 30 euro. Con lo sconto, 25 euro.
    - learner: Bene, le prendo.
    - tutor: Perfetto! Grazie e arrivederci!
      goals: [decide]


- scenario: famiglia
  level: A1
  persona: en-f-student
  history: [possessive]
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Questa è la mia madre e questo è mio padre.
      errors: [possessive]
    - tutor: La mia madre? Con madre, padre, sorella... niente articolo.
      prompt: {text: la mia madre, tags: [possessive]}
      new: [{lemma: articolo, gloss: article}]
    - learner: Questa è mia madre!
    - tutor: Brava! E com'è tua madre?
      goals: [who]
    - learner: Mia madre è molto simpatica e bella.
    - tutor: Che bello! Quanti anni ha?
      goals: [describe]
    - learner: Ha cinquanta anni. Mio padre ha cinquantadue anni.
    - tutor: Sono giovani! Io ho un fratello e una sorella.
      goals: [ages]
    - learner: Quanti anni hanno tuo fratello e tua sorella?
    - tutor: Mio fratello ha 20 anni e mia sorella 16.
      goals: [ask]

- scenario: famiglia
  level: A1
  persona: en-m-retired
  history: [essere-avere]
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono i miei figli, Tom e Sara.
    - tutor: Bello! Quanti anni hanno?
      goals: [who]
    - learner: Tom è quarantacinque anni.
      errors: [essere-avere]
    - tutor: Tom è quarantacinque anni? Qui non va il verbo essere.
      prompt: {text: Tom è quarantacinque anni, tags: [essere-avere]}
      new: [{lemma: verbo, gloss: verb}]
    - learner: Tom ha quarantacinque anni. Sara ha quaranta anni.
    - tutor: Perfetto! E com'è Sara?
      goals: [ages]
    - learner: Sara è alta e molto intelligente. Lei è dottore.
    - tutor: Brava Sara! Io ho solo un fratello, è più piccolo.
      goals: [describe]
      new: [{lemma: intelligente, gloss: intelligent}]
    - learner: Come si chiama tuo fratello?
    - tutor: Si chiama Luca e studia a Bologna.
      goals: [ask]

- scenario: famiglia
  level: A1
  persona: es-f-erasmus
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono mia madre, mio padre e mio hermano.
      errors: [word-choice]
    - tutor: Ah, tuo fratello! Che bella famiglia. Com'è tuo fratello?
      goals: [who]
      recast: {text: mio hermano, fix: tuo fratello, tags: [word-choice]}
    - learner: Mio fratello è alto e simpatico. Lui gioca a calcio.
    - tutor: Che bravo! Quanti anni ha?
      goals: [describe]
    - learner: Ha diciotto anni. Io ho ventuno anni.
    - tutor: Bene! Io ho 23 anni.
      goals: [ages]
    - learner: E tu, Marco, hai fratelli o sorelle?
    - tutor: Sì, ho una sorella. Si chiama Chiara.
      goals: [ask]
    - learner: Che bel nome!
    - tutor: Grazie! Anche lei è molto carina.

- scenario: famiglia
  level: A1
  persona: en-m-traveller
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Questo è mio nonno e questa è mia nonna.
    - tutor: Che belli! Dove abitano?
      goals: [who]
    - learner: Abitano in Irlanda, vicino al mare.
    - tutor: Bello! Com'è tuo nonno?
    - learner: Mio nonno è molto divertente. Racconta tante storie.
    - tutor: Che bello! E quanti anni ha?
      goals: [describe]
    - learner: Ha ottanta anni, e mia nonna ha settantotto anni.
    - tutor: Sono ancora giovani! Io ho solo una nonna.
      goals: [ages]
    - learner: Ah sì? E come si chiama tua nonna?
    - tutor: Si chiama Maria e fa una pasta fantastica!
      goals: [ask]

- scenario: famiglia
  level: A1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono le mie sorelle, Anna e Emma.
    - tutor: Che belle! Come sono?
      goals: [who]
    - learner: Anna è molto simpatico e Emma è timida.
      errors: [adjective-agreement]
    - tutor: Anna è molto simpatico? Anna è una ragazza...
      prompt: {text: Anna è molto simpatico, tags: [adjective-agreement]}
    - learner: Anna è molto simpatica!
    - tutor: Esatto! E quanti anni hanno le tue sorelle?
      goals: [describe]
    - learner: Anna ha trenta anni ed Emma ha ventotto anni.
    - tutor: Bene! Io ho due fratelli, Luca e Paolo.
      goals: [ages]
    - learner: Abitano a Milano anche loro?
    - tutor: No, abitano a Roma con i miei genitori.
      goals: [ask]

- scenario: famiglia
  level: A1
  persona: es-m-worker
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Mia moglie e mio figlio.
    - tutor: Che bella famiglia! Come si chiama tuo figlio?
      goals: [who]
    - learner: Si chiama Matteo. Ha cinque anni.
    - tutor: Che bello! E com'è Matteo?
      goals: [ages]
    - learner: È molto allegro. Gli piace molto il calcio.
    - tutor: Ah, un piccolo calciatore! Bravo Matteo.
      goals: [describe]
      new: [{lemma: calciatore, gloss: footballer}]
    - learner: E tu? Hai figli?
    - tutor: No, non ho figli. Ma ho tre nipoti.
      goals: [ask]
      new: [{lemma: nipote, gloss: nephew or niece}]

- scenario: famiglia
  level: A1
  persona: en-m-heritage
  history: [possessive]
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono i miei nonni italiani. Sono di Napoli.
    - tutor: Che bello! Abitano ancora a Napoli?
      goals: [who]
    - learner: No, abitano a Toronto con la mia famiglia.
    - tutor: Ah, insieme! Com'è tua nonna?
    - learner: La mia nonna è piccola e molto forte.
      errors: [possessive]
    - tutor: La mia nonna? Pensa a come dici mia madre.
      prompt: {text: La mia nonna, tags: [possessive]}
    - learner: La mia nonna, sì.
      errors: [possessive]
    - tutor: Ah, mia nonna è piccola e forte! Che bella nonna.
      goals: [describe]
      recast: {text: La mia nonna, fix: mia nonna, tags: [possessive]}
    - learner: Sì! Ha novanta anni!
    - tutor: Novanta anni! Brava la nonna!
      goals: [ages]
    - learner: E i tuoi nonni, Marco?
    - tutor: I miei nonni abitano in campagna, vicino a Firenze.
      goals: [ask]
      new: [{lemma: campagna, gloss: countryside}]

- scenario: famiglia
  level: A1
  persona: es-f-teacher
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono io con i miei studenti, a scuola.
    - tutor: Ah, i tuoi studenti! Ma io voglio vedere la tua famiglia.
    - learner: Allora, in questa foto c'è mia sorella con suo figlio.
    - tutor: Che bello! Com'è tua sorella?
      goals: [who]
    - learner: Mia sorella è alta e ha i capelli neri.
    - tutor: Bella! E quanti anni ha suo figlio?
      goals: [describe]
      new: [{lemma: capello, gloss: hair}]
    - learner: Ha due anni. È molto piccolo!
    - tutor: Che bello, due anni!
      goals: [ages]
    - learner: E tu, Marco, hai una sorella?
    - tutor: No, ho solo un fratello, Gianni.
      goals: [ask]

- scenario: famiglia
  level: A1
  persona: en-f-student
  history: [noun-number]
  turns:
    - tutor: Che bella foto! Chi sono queste persone?
    - learner: Sono i miei due fratello.
      errors: [noun-number]
    - tutor: Due fratello? Sono due persone...
      prompt: {text: due fratello, tags: [noun-number]}
    - learner: I miei due fratelli! Si chiamano Ben e Sam.
    - tutor: Brava! Quanti anni hanno?
      goals: [who]
    - learner: Ben ha dodici anni e Sam ha quindici anni.
    - tutor: Sono giovani! Come sono?
      goals: [ages]
    - learner: Ben è timido, ma Sam parla molto.
    - tutor: Ah, sono diversi!
      goals: [describe]
    - learner: E la tua famiglia, Marco? È grande?
    - tutor: Sì, è grande! Ho tre sorelle.
      goals: [ask]

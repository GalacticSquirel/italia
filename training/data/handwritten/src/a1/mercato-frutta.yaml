- scenario: mercato-frutta
  level: A1
  persona: en-f-student
  history: [noun-number]
  turns:
    - tutor: Ciao! Cosa ti do oggi? Ho frutta e verdura fresca.
    - learner: Ciao! Quanto costano le mele?
    - tutor: Le mele costano due euro al chilo. Sono molto fresche!
      goals: [ask-price]
    - learner: Va bene. Un chilo di mela, per favore.
      errors: [noun-number]
    - tutor: Un chilo di mela? Un chilo sono tante...
      prompt: {text: Un chilo di mela, tags: [noun-number]}
    - learner: Un chilo di mele!
    - tutor: Brava! Ecco un chilo di mele. Altro?
      goals: [buy-quantity]
    - learner: Sì, anche mezzo chilo di pomodori.
    - tutor: Ecco i pomodori. Sono quattro euro in tutto.
      goals: [ask-other]
    - learner: Ecco cinque euro.
    - tutor: Ecco il resto, un euro. Grazie e ciao!
      goals: [pay]


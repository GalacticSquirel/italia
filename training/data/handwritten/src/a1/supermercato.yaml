- scenario: supermercato
  level: A1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: Buongiorno, cerca qualcosa?
    - learner: Sì, scusi. Dov'è il latte?
    - tutor: Il latte è nel reparto in fondo, a destra.
      goals: [ask-product]
    - learner: Grazie. E la pasta è in il reparto vicino?
      errors: [articulated-preposition]
    - tutor: In il reparto? In e il fanno una parola.
      prompt: {text: in il reparto, tags: [articulated-preposition]}
    - learner: Nel reparto vicino?
    - tutor: Esatto! Sì, la pasta è sullo scaffale vicino al latte.
      goals: [ask-other]
    - learner: Perfetto, grazie mille!
    - tutor: Prego, buona spesa!
      goals: [thank]
      new: [{lemma: spesa, gloss: shopping}]

- scenario: supermercato
  level: A1
  persona: en-m-retired
  turns:
    - tutor: Buongiorno, cerca qualcosa?

- scenario: orari-negozio
  level: A1
  persona: en-f-student
  turns:
    - tutor: Pronto, negozio Bianchi, buongiorno!
    - learner: Buongiorno! Chiamo per chiedere gli orari del negozio.
    - tutor: Certo! Cosa vuole sapere?
      goals: [greet]
    - learner: A che ora aprite la mattina?
    - tutor: Apriamo alle nove e chiudiamo all'una.
    - learner: E il pomeriggio?
    - tutor: Il pomeriggio apriamo alle quattro e chiudiamo alle otto.
      goals: [ask-hours]
    - learner: E la domenica siete aperti?
    - tutor: No, la domenica siamo chiusi.
      goals: [ask-day]
      new: [{lemma: chiuso, gloss: closed}]
    - learner: Va bene, grazie mille. Arrivederci!
    - tutor: Prego, arrivederci!
      goals: [goodbye]

- scenario: orari-negozio
  level: A1
  persona: en-m-retired
  history: [subject-verb-agreement]
  turns:
    - tutor: Pronto, negozio Bianchi, buongiorno!
    - learner: Buongiorno. Scusi, a che ora apre il negozio oggi?
    - tutor: Oggi apriamo alle dieci.
      goals: [greet]
    - learner: E a che ora chiudete?
    - tutor: Chiudiamo alle sette e mezza.
      goals: [ask-hours]
    - learner: E domenica voi apre?
      errors: [subject-verb-agreement]
    - tutor: Voi apre? Pensi a voi...
      prompt: {text: voi apre, tags: [subject-verb-agreement]}
    - learner: Voi aprite domenica?
    - tutor: Esatto! Sì, domenica apriamo solo la mattina.
      goals: [ask-day]
    - learner: Perfetto. Grazie, buona giornata.
    - tutor: Grazie a Lei, arrivederci!
      goals: [goodbye]

- scenario: orari-negozio

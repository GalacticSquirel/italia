- scenario: presentarsi
  level: A1
  persona: en-f-student
  history: [reflexive]
  turns:
    - tutor: Ciao! Io sono Giulia. E tu, come ti chiami?
    - learner: Ciao Giulia! Io chiamo Emma.
      errors: [reflexive]
    - tutor: Io chiamo? Manca una piccola parola.
      prompt: {text: Io chiamo, tags: [reflexive]}
    - learner: Mi chiamo Emma!
    - tutor: Brava! Piacere, Emma. Di dove sei?
      goals: [say-name]
    - learner: Sono inglese, di Leeds.
    - tutor: Bello! E cosa fai lì?
      goals: [say-origin]
    - learner: Sono studentessa all'università.
    - tutor: Che bello! E cosa fai all'università?
      goals: [say-job]
    - learner: Faccio storia. E tu, Giulia, cosa fai?
    - tutor: Anche io sono all'università. Faccio medicina.
      goals: [ask-back]
      new: [{lemma: medicina, gloss: medicine}]

- scenario: presentarsi
  level: A1

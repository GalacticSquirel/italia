      goals: [say-name]
    - learner: Sono canadese, di Toronto. Ma i miei nonni sono italiani.
    - tutor: Che bello! E che lavoro fai?
      goals: [say-origin]
    - learner: Sono infermiere in un ospedale.
    - tutor: Un lavoro importante! Bravo.
      goals: [say-job]
      new: [{lemma: infermiere, gloss: nurse}]
    - learner: E tu, cosa è il tuo lavoro?
      errors: [question-form]
    - tutor: Cosa è il tuo lavoro? Si dice in un altro modo.
      prompt: {text: cosa è il tuo lavoro, tags: [question-form]}
    - learner: Che lavoro fai?
    - tutor: Esatto! Io faccio medicina all'università.
      goals: [ask-back]
      new: [{lemma: medicina, gloss: medicine}]


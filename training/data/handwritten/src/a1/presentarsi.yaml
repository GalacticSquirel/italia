- scenario: presentarsi
  level: A1
  persona: es-f-erasmus
  history: [subject-verb-agreement]
  turns:
    - tutor: Ciao! Io sono Giulia. E tu, come ti chiami?
    - learner: Ciao! Mi chiamo Lucia.
    - tutor: Piacere, Lucia! Di dove sei?
      goals: [say-name]
    - learner: Io è spagnola, di Siviglia.
      errors: [subject-verb-agreement]
    - tutor: Io è? Pensa al verbo con io...
      prompt: {text: Io è, tags: [subject-verb-agreement]}
      new: [{lemma: verbo, gloss: verb}]
    - learner: Io sono spagnola, di Siviglia!
    - tutor: Esatto! Sei qui per l'Erasmus?
      goals: [say-origin]
    - learner: Sì, sono studentessa di architettura.
    - tutor: Brava! L'architettura qui è bellissima.
      goals: [say-job]
    - learner: E tu, Giulia, cosa studi?
    - tutor: Io faccio lingue. Parlo anche un po' la tua lingua!
      goals: [ask-back]


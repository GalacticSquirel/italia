- scenario: tempo-libero
  level: A1
  persona: en-f-student
  history: [piacere]
  turns:
    - tutor: Allora, cosa fai di bello nel fine settimana?
    - learner: Io piaccio leggere e andare al cinema.
      errors: [piacere]
    - tutor: Io piaccio leggere? Il verbo piacere funziona in un altro modo.
      prompt: {text: Io piaccio leggere, tags: [piacere]}
      new: [{lemma: verbo, gloss: verb}]
    - learner: Mi piace leggere e andare al cinema!
    - tutor: Brava! Vai spesso al cinema?
      goals: [hobby]
    - learner: Sì, vado al cinema ogni sabato.
    - tutor: Ogni sabato! E leggi molto?
      goals: [frequency]
    - learner: Sì, sempre la sera. E tu, Sara, cosa fai nel weekend?
    - tutor: Io faccio sport. Il sabato gioco a tennis.
      goals: [ask]
    - learner: Andiamo al cinema insieme sabato prossimo?
    - tutor: Sì, volentieri! Che bella idea.
      goals: [propose]
      new: [{lemma: volentieri, gloss: gladly}]

- scenario: tempo-libero
  level: A1
  persona: en-m-retired
  turns:
    - tutor: Allora, cosa fai di bello nel fine settimana?
    - learner: Mi piace molto la musica. Suono il piano.
    - tutor: Che bello! E lo fai spesso?
      goals: [hobby]
    - learner: Sì, suono ogni giorno, la mattina.
    - tutor: Ogni giorno! Bravo.
      goals: [frequency]
    - learner: E a te cosa piace fare, Sara?
    - tutor: Io amo leggere. Leggo sempre la sera.
      goals: [ask]
    - learner: Vuoi venire a un concerto con me e mia moglie?
    - tutor: Sì, con piacere! Quando?
      goals: [propose]
    - learner: Domenica sera, alle otto.
    - tutor: Perfetto, a domenica!


    - learner: Abito in un appartamento in centro.
    - tutor: Che bello! Com'è l'appartamento?
      goals: [type]
    - learner: È grande. Ci sono tre camere e un balcone.
    - tutor: E qual è la tua stanza preferita?
      goals: [rooms]
    - learner: Il studio. Lavoro lì ogni giorno.
      errors: [article-form]

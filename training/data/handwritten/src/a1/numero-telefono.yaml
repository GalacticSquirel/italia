- scenario: numero-telefono
  level: A1
  persona: en-f-student
  turns:
    - tutor: È stata una bella lezione, vero?
    - learner: Sì, molto bella! Studiamo insieme la prossima settimana?
    - tutor: Sì, volentieri! Mi dai il tuo numero?
      goals: [propose]
      new: [{lemma: volentieri, gloss: gladly}]
    - learner: Certo. Il mio numero è 347 512 8890.
    - tutor: Perfetto, grazie. Ti mando un messaggio.
      goals: [number]
    - learner: Va bene. Sei libero lunedì?
    - tutor: Lunedì no, lavoro. Martedì va bene?
    - learner: Sì, martedì va bene per me. Alle cinque?
    - tutor: Perfetto, martedì alle cinque. A presto!
      goals: [when]

- scenario: numero-telefono
  level: A1
  persona: en-m-retired
  history: [question-form]
  turns:
    - tutor: È stata una bella lezione, vero?
    - learner: Sì, ma è difficile per me. Possiamo parlare italiano insieme?
    - tutor: Certo, è una buona idea!
      goals: [propose]
    - learner: Qual è il tuo numero di telefono?
    - tutor: È 328 446 1290. E il tuo?
    - learner: Il mio è 339 778 2015.
    - tutor: Grazie, ti scrivo un messaggio.
      goals: [number]
    - learner: Quando sei libero?
    - tutor: Sono libero sabato mattina. Va bene per te?
    - learner: Sì, sabato mattina va bene. Al bar vicino alla scuola?
    - tutor: Perfetto! Sabato alle dieci, al bar.
      goals: [when]


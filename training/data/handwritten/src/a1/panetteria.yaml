- scenario: panetteria
  level: A1
  persona: en-f-student
  history: [noun-number]
  turns:
    - tutor: Buongiorno! Mi dica.
    - learner: Buongiorno! Vorrei mezzo chilo di pane, per favore.
    - tutor: Ecco mezzo chilo di pane. Altro?
      goals: [greet, order-bread]
    - learner: Sì, due focaccia.
      errors: [noun-number]
    - tutor: Due focaccia? Sono due...
      prompt: {text: due focaccia, tags: [noun-number]}
    - learner: Due focacce!
    - tutor: Brava! Ecco due focacce nel sacchetto.
      goals: [order-extra]
    - learner: Quanto costa tutto?
    - tutor: Sono 5 euro.
    - learner: Ecco 5 euro. Grazie, arrivederci!
    - tutor: Grazie a Lei, buona giornata!
      goals: [pay]

- scenario: panetteria
  level: A1
  persona: en-m-retired
  turns:
    - tutor: Buongiorno! Mi dica.
    - learner: Buongiorno. Un chilo di pane, per favore.
    - tutor: Ecco un chilo di pane. Desidera altro?
      goals: [greet, order-bread]
      new: [{lemma: desiderare, gloss: to wish}]
    - learner: Sì, due etti di pizza bianca.
    - tutor: Ecco la pizza bianca, due etti.
      goals: [order-extra]
    - learner: Quanto pago?
    - tutor: Sono 6 euro e venti centesimi.
      new: [{lemma: centesimo, gloss: cent}]
    - learner: Ecco 10 euro.
    - tutor: Ecco il resto. Arrivederci!
      goals: [pay]

- scenario: panetteria
  level: A1
  persona: es-f-erasmus

    - learner: Ecco. Buona giornata!
    - tutor: Grazie, altrettanto!
      goals: [pay]
      new: [{lemma: altrettanto, gloss: likewise}]

- scenario: panetteria
  level: A1
  persona: en-m-traveller
  turns:
    - tutor: Buongiorno! Mi dica.
    - learner: Buongiorno! Vorrei un bread, per favore.
      errors: [word-choice]
    - tutor: Un pane, certo! Quanto pane vuole? Mezzo chilo?
      goals: [greet]
      recast: {text: un bread, fix: Un pane, tags: [word-choice]}
    - learner: Sì, mezzo chilo di pane.
    - tutor: Ecco il pane. Altro?
      goals: [order-bread]
    - learner: Sì, un pezzo di focaccia, per favore.
    - tutor: Ecco la focaccia. È ancora calda!
      goals: [order-extra]
    - learner: Quanto costa tutto?
    - tutor: Sono 3,50 euro.
    - learner: Ecco i soldi. Grazie mille!
    - tutor: Grazie a Lei, arrivederci!
      goals: [pay]


- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  history: [reflexive]
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Ciao! Io sveglio alle sette.
      errors: [reflexive]
    - tutor: Io sveglio? Manca una piccola parola prima di sveglio.
      prompt: {text: Io sveglio, tags: [reflexive]}
    - learner: Io mi sveglio alle sette!
    - tutor: Brava! E poi cosa fai la mattina?
      goals: [wake]
    - learner: Faccio colazione e vado all'università.
    - tutor: E la sera cosa fai?
      goals: [work]
    - learner: La sera studio e guardo un film.
    - tutor: Bello! Io la sera leggo un libro.
      goals: [evening]
    - learner: E tu, Anna, a che ora ti svegli?
    - tutor: Io alle sei, perché lavoro presto.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-m-retired
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: È tranquilla. Mi sveglio alle otto.
    - tutor: Alle otto, bene. E la mattina cosa fai?
      goals: [wake]
    - learner: La mattina faccio colazione con mia moglie e leggo il giornale.
    - tutor: Che bello! Non lavori più?
      goals: [work]
      new: [{lemma: giornale, gloss: newspaper}]
    - learner: No, non lavoro più. Ora ho tanto tempo libero.
    - tutor: Fantastico! E la sera?
    - learner: La sera cucino la cena e poi guardo la televisione.
    - tutor: Che bello!
      goals: [evening]
    - learner: E tu? Lavori molto?
    - tutor: Sì, lavoro dalle nove alle sei. Torno a casa stanca.
      goals: [ask]
      new: [{lemma: stanco, gloss: tired}]

- scenario: giorno-tipico
  level: A1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Mi sveglio a le otto.
      errors: [articulated-preposition]
    - tutor: A le otto? In italiano a e le diventano una parola.
      prompt: {text: a le otto, tags: [articulated-preposition]}
    - learner: Alle otto! Mi sveglio alle otto.
    - tutor: Esatto! E poi?
      goals: [wake]
    - learner: Faccio colazione al bar e vado a lezione.
    - tutor: Che bello, la colazione al bar! E la sera?
      goals: [work]
    - learner: La sera esco con le mie amiche.
    - tutor: Divertente! Dove andate?
      goals: [evening]
    - learner: Andiamo in piazza. E tu, Anna, esci la sera?
    - tutor: No, io la sera sono a casa. Torno tardi dal lavoro.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-m-traveller
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Non ho una giornata normale! Mi sveglio tardi.
    - tutor: Tardi? A che ora, più o meno?
      goals: [wake]
    - learner: Alle dieci, più o meno.
    - tutor: E dopo cosa fai?
    - learner: Dopo visito la città e parlo con le persone.
    - tutor: Bello! E la sera?
      goals: [work]
    - learner: La sera mangio una pizza e bevo una birra.
    - tutor: Una sera perfetta!
      goals: [evening]
    - learner: E tu, Anna? Ti svegli presto?
    - tutor: No, alle sei e mezza. Lavoro in un ospedale.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-f-professional
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Mi sveglio alle sei e vado in palestra.
    - tutor: Alle sei! Che brava. E poi?
      goals: [wake]
      new: [{lemma: palestra, gloss: gym}]
    - learner: Poi lavoro in ufficio dalle nove alle sei.
    - tutor: È una giornata lunga!
      goals: [work]
    - learner: Sì. La sera torno a casa e cucino la cena.
    - tutor: Cosa cucini di solito?
      goals: [evening]
    - learner: Cucino la pasta. È facile!
    - tutor: Giusto! Anche io mangio la pasta ogni sera.
    - learner: E tu, Anna, a che ora vai a dormire?
    - tutor: Vado a dormire alle 11, più o meno.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: es-m-worker
  history: [subject-verb-agreement]
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Io lavora molto. Mi sveglio alle nove.
      errors: [subject-verb-agreement]
    - tutor: Io lavora? Pensa alla persona io...
      prompt: {text: Io lavora, tags: [subject-verb-agreement]}
    - learner: Io lavoro molto!
    - tutor: Bravo! E dove lavori?
      goals: [wake]
    - learner: Lavoro in un ristorante. Comincio alle undici.
    - tutor: E la sera torni tardi?
      goals: [work]
    - learner: Sì, torno a casa a mezzanotte e dormo subito.
    - tutor: Una giornata difficile!
      goals: [evening]
      new: [{lemma: mezzanotte, gloss: midnight}]
    - learner: E tu, Anna? A che ora finisci di lavorare?
    - tutor: Io finisco alle cinque. Poi torno a casa.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-m-heritage
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Mi sveglio alle sette e faccio colazione.
    - tutor: Cosa mangi a colazione?
      goals: [wake]
    - learner: Mangio pane e marmellata e bevo un caffè.
    - tutor: Buono! E poi lavori?
    - learner: Sì, lavoro in un negozio dalle nove all'una.
    - tutor: E il pomeriggio?
      goals: [work]
    - learner: Il pomeriggio studio l'italiano. La sera ceno con amici.
    - tutor: Bravo, così impari molto!
      goals: [evening]
    - learner: E la tua giornata, Anna?
    - tutor: Anche io lavoro la mattina e la sera cucino.
      goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: es-f-teacher
  history: [verb-form]
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Mi sveglio presto, alle sei. Poi vado a scuola.
    - tutor: Alle sei! E a scuola cosa fai?
      goals: [wake]
    - learner: Insegno spagnolo ai bambini. Io sono insegnante.
    - tutor: Che bel lavoro! E la sera?
      goals: [work]
    - learner: La sera io escio con mio marito.
      errors: [verb-form]
    - tutor: Attenzione, uscire è un verbo strano. Prova ancora!
      prompt: {text: io escio, tags: [verb-form]}
      new: [{lemma: verbo, gloss: verb}]
    - learner: Io esco con mio marito!
    - tutor: Esatto! Dove andate?
      goals: [evening]
    - learner: Andiamo al cinema o al ristorante. E tu, Anna?
    - tutor: Io la sera sono stanca, quindi resto a casa.
      goals: [ask]
      new: [{lemma: stanco, gloss: tired}]

- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  turns:
    - tutor: Ciao! Com'è la tua giornata di solito?
    - learner: Mi sveglio alle nove, ma il lunedì alle sette.
    - tutor: Perché il lunedì alle sette?
      goals: [wake]
    - learner: Perché il lunedì ho lezione alle otto.
    - tutor: Ah, capisco! E dopo la lezione?
    - learner: Dopo pranzo con i miei amici e lavoro in un bar.
    - tutor: Lavori anche! Brava.
      goals: [work]
    - learner: La sera sono stanca, quindi dormo presto.
    - tutor: Giusto, dormire è importante!
      goals: [evening]
    - learner: E tu, Anna, lavori il lunedì?
    - tutor: Sì, lavoro dal lunedì al venerdì.
      goals: [ask]

- scenario: ristorante-ordinare
  level: A1
  persona: en-m-heritage
  history: [noun-number]
  turns:
    - tutor: Buongiorno, benvenuti! Quanti siete?
    - learner: Siamo cinque. Io, mia moglie e i nostri tre figli.
    - tutor: Che bella famiglia! Ecco un tavolo grande.
      goals: [ask-table]
    - learner: Grazie. Vorrei tre pizza per i bambini.
      errors: [noun-number]
    - tutor: Tre pizza? Sono tre...
      prompt: {text: tre pizza, tags: [noun-number]}
    - learner: Tre pizze per i bambini!
    - tutor: Bravo! E per voi due?
    - learner: Per noi due piatti di pasta.
    - tutor: Perfetto. E da bere?
      goals: [order-food]
    - learner: Acqua per tutti e un vino rosso.
    - tutor: Va bene, acqua e vino rosso.
      goals: [order-drink]
    - learner: Alla fine il conto, per favore.
    - tutor: Certo, nessun problema.
      goals: [ask-bill]


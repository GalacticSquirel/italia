- scenario: ristorante-ordinare
  level: A1
  persona: en-f-student
  turns:
    - tutor: Buongiorno, benvenuti! Quanti siete?
    - learner: Buongiorno! Siamo due. C'è un tavolo?
    - tutor: Sì, ecco un tavolo vicino alla finestra. Ecco il menù.
      goals: [ask-table]
    - learner: Grazie. Per primo, vorrei gli spaghetti al pomodoro.
    - tutor: Ottimo! E da bere?
      goals: [order-food]
    - learner: Una bottiglia di acqua naturale, per favore.
    - tutor: Va bene, acqua naturale.
      goals: [order-drink]
      new: [{lemma: bottiglia, gloss: bottle}]
    - learner: Grazie! Dopo, il conto, per favore.
    - tutor: Certo, ecco il conto. Sono 18 euro.
      goals: [ask-bill]

- scenario: ristorante-ordinare
  level: A1
  persona: en-m-retired
  history: [modal-infinitive]
  turns:
    - tutor: Buongiorno, benvenuti! Quanti siete?
    - learner: Buongiorno. Siamo in quattro.
    - tutor: Perfetto, ecco un tavolo per quattro.
      goals: [ask-table]
    - learner: Grazie. Noi vogliamo di mangiare il pesce.
      errors: [modal-infinitive]
    - tutor: Vogliamo di mangiare? Dopo vogliamo, niente di.
      prompt: {text: vogliamo di mangiare, tags: [modal-infinitive]}
    - learner: Vogliamo mangiare il pesce!
    - tutor: Esatto! Oggi il pesce del giorno è molto buono.
      goals: [order-food]
    - learner: Bene, quattro pesci del giorno. E una bottiglia di vino bianco.
    - tutor: Perfetto, quattro pesci e un vino bianco.
      goals: [order-drink]
    - learner: Alla fine, possiamo avere il conto?
    - tutor: Certo, alla fine Le porto il conto.
      goals: [ask-bill]


# C2: Montale, traduzione letteraria e satira: falsi amici, relativi, concordanze e pronomi.
- scenario: poesia-montale
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasta addosso una sensazione di aridità: tutto è secco, strozzato, bruciato. E poi quel finale così sospeso, che non consola ma nemmeno dispera."
  - tutor: "«Non consola ma nemmeno dispera»: una formula che Montale avrebbe sottoscritto. Scegliamo un'immagine e guardiamola da vicino: quale l'ha colpita di più?"
    goals: [first-reading]
  - learner: "La foglia riarsa, quella di cui bordi si accartocciano. Montale non scrive «la foglia secca», ma «l'incartocciarsi della foglia», un verbo sostantivato: il male non è un oggetto, è un processo."
    errors: [relative-pronoun]
    gold: {text: "di cui bordi si accartocciano", fix: "i cui bordi si accartocciano"}
  - tutor: "Osservazione finissima sul verbo sostantivato. Ma torniamo a «la foglia di cui bordi si accartocciano»: per dire i bordi della foglia, quale relativo serve?"
    prompt: {text: "di cui bordi si accartocciano", tags: [relative-pronoun]}
  - learner: "Ah, il relativo possessivo: la foglia i cui bordi si accartocciano. Quando parlo mi sfugge sempre."
  - tutor: "Esatto. E quel verbo sostantivato è davvero la chiave: il male come processo, colto mentre accade. Passiamo al suono: che cosa sente, rileggendo la prima strofa?"
    goals: [image]
  - learner: "Sento consonanti dure, «strozzato», «stramazzato», con quelle zeta che stridono. Secondo me quelle parole sono state scelto apposta, per graffiare l'orecchio."
    errors: [passive]
    gold: {text: "sono state scelto", fix: "sono state scelte"}
  - tutor: "Le zeta che stridono: perfetto. Però riascolti «sono state scelto»: in un passivo come questo, il participio può restare al maschile singolare?"
    prompt: {text: "sono state scelto", tags: [passive]}
  - learner: "Sì, credo di sì: sono state scelto apposta, e il ritmo della prima strofa è più spezzato che nella seconda."
    errors: [passive]
  - tutor: "Sono state scelte apposta, ne sono convinto anch'io: e il ritmo spezzato della prima strofa rende il respiro della seconda ancora più netto. Che interpretazione darebbe, allora, della poesia nel suo insieme?"
    goals: [sound]
    recast: {text: "sono state scelto", fix: "sono state scelte", tags: [passive]}
  - learner: "Il male è dappertutto, nelle cose naturali, e l'unico bene possibile è il distacco, la divina Indifferenza. Non è una soluzione felice, è un prodigio, cioè qualcosa che accade di rado. Per questo, secondo me, la poesia è ancora molto attuale."
  - tutor: "Lettura limpida, e «attuale» è la parola giusta: parla anche alla nostra stanchezza. Per la prossima volta provi a confrontarla con «Meriggiare pallido e assorto»: vedrà che il meriggio ritorna."
    goals: [meaning]

- scenario: poesia-montale
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Guardi, mi ha fatto venire un groppo in gola: è corta, ma è come un pugno. E poi, scusa, ma quel cavallo stramazzato mi ha ricordato mio nonno, che aveva dei cavalli in Andalusia."
    errors: [register]
    gold: {text: "scusa", fix: "scusi"}
  - tutor: "Un ricordo personale è un ottimo punto di partenza. Ma quel «scusa», detto a me, le è sfuggito o è un invito a darci del tu?"
    prompt: {text: "scusa", tags: [register]}
  - learner: "Mi è sfuggito, mi scusi! Dicevo che il cavallo stramazzato mi ha ricordato i cavalli di mio nonno: quando ne moriva uno, era una tragedia per tutta la famiglia."
  - tutor: "Allora capisce meglio di molti la violenza di quel participio, «stramazzato»: un corpo che crolla di colpo. Che cosa nota nella scelta delle immagini?"
    goals: [first-reading]
  - learner: "Noto che i tre esempi del male vanno dal più piccolo al più grande: il ruscello, la foglia, il cavallo. È un climax, se non sbaglio. Nella seconda strofa, invece, le immagini sono leggere: la statua, la nuvola, il falco. Il poeta le ha scelto perché non sentono niente."
    errors: [participle-agreement]
    gold: {text: "le ha scelto", fix: "le ha scelte"}
  - tutor: "Non sbaglia, è un climax, e l'opposizione è bellissima. Ma «il poeta le ha scelto»… con quel pronome le davanti, il participio resta invariato?"
    goals: [image]
    prompt: {text: "le ha scelto", tags: [participle-agreement]}
  - learner: "No, si accorda: il poeta le ha scelte apposta. E anche il suono cambia: nella prima strofa tante erre e zeta, nella seconda vocali più aperte, come in «nuvola» e «levato»."
  - tutor: "Esatto: dalle consonanti che stridono alle vocali che respirano. E allora, in sintesi, qual è il senso della poesia?"
    goals: [sound]
  - learner: "Per me Montale dice che il male non si può vincere, si può solo guardare con distacco, come fa la statua. Non è disperazione, è più bene una saggezza amara."
    errors: [word-choice]
  - tutor: "Piuttosto una saggezza amara, sì: lo direi anch'io. Ed è questa misura, questo non gridare mai, che rende la poesia così moderna."
    goals: [meaning]
    recast: {text: "più bene", fix: "piuttosto", tags: [word-choice]}
  - learner: "Piuttosto, giusto: il «más bien» spagnolo mi tradisce sempre. Grazie, è stata una lezione bellissima."
  - tutor: "Le lingue sorelle sono le più insidiose. Per la prossima volta legga «Meriggiare pallido e assorto»: ritroverà il meriggio e la stessa luce che acceca."

- scenario: poesia-montale
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasta addosso una frase: «Bene non seppi». È strano: un uomo che dice di non aver conosciuto il bene, e poi lo nomina subito, il prodigio."
  - tutor: "Ha colto il cuore del paradosso: il bene esiste, ma solo come eccezione. Restiamo su un'immagine: quale le sembra la più potente?"
    goals: [first-reading]
  - learner: "Il rivo strozzato che gorgoglia. Il mio argomento è che «strozzato» trasforma l'acqua in una vittima: è un participio che di solito si usa per le persone, quasi per un delitto."
    errors: [false-friend]
  - tutor: "Una tesi convincente: «strozzato» porta nell'acqua la violenza di un gesto umano, e il gorgoglio è il suono di chi non riesce a respirare. A proposito di suono: che cosa le dice il ritmo?"
    goals: [image]
    recast: {text: "argomento", fix: "tesi", tags: [false-friend]}
  - learner: "Mi sembra che i versi sono quasi tutti endecasillabi, ma con accenti spostati, che rendono la lettura irregolare, a scatti."
    errors: [subjunctive-use]
    gold: {text: "Mi sembra che i versi sono", fix: "Mi sembra che i versi siano"}
  - tutor: "Ottimo orecchio. Ma riascolti l'inizio: «mi sembra che i versi sono»… dopo mi sembra che, quale modo ci aspettiamo?"
    prompt: {text: "Mi sembra che i versi sono", tags: [subjunctive-use]}
  - learner: "Voglio dire: mi pare che i versi sono quasi tutti endecasillabi, ma irregolari."
    errors: [subjunctive-use]
  - tutor: "Che i versi siano quasi tutti endecasillabi è vero, e gli accenti spostati creano proprio quegli scatti: un ritmo che inciampa, come chi cammina male. E il senso complessivo?"
    goals: [sound]
    recast: {text: "che i versi sono", fix: "che i versi siano", tags: [subjunctive-use]}
  - learner: "Direi che Montale non offre consolazioni: il bene è solo un'assenza di dolore, un'indifferenza quasi divina. Eppure la poesia non è fredda: è più commossa di quanto voglia ammettere."
  - tutor: "«Più commossa di quanto voglia ammettere»: una formula splendida, che le ruberò per il prossimo corso. Ed è proprio questo il paradosso montaliano: l'indifferenza cantata con passione."
    goals: [meaning]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autrice a parlare."
  - learner: "Lo so, lo so. Il problema è il secondo paragrafo: la protagonista dice «I was mildly annoyed», e ogni soluzione mi sembrava o troppo forte o troppo piatta. Alla fine ho scritto che era leggermente annoiata."
    errors: [false-friend]
  - tutor: "Leggermente infastidita, semmai: annoiata è un'altra cosa, è la noia, non il fastidio. E già qui l'autrice ti guarda storto. Ma il problema vero, sai qual è?"
    goals: [problem]
    recast: {text: "leggermente annoiata", fix: "leggermente infastidita", tags: [false-friend]}
  - learner: "Infastidita, certo: il falso amico più classico, che figura. Il problema vero, immagino, è il tono: l'autrice è ironica, e io l'ho resa seria."
  - tutor: "Esatto. «Mildly annoyed» detto da lei, in mezzo a una catastrofe, è un'arma ironica. Quali alternative vedi?"
    goals: [false-friend]
  - learner: "Vedo due rese: «ero vagamente seccata», che mantiene l'understatement, oppure «la cosa mi infastidiva appena», più scorrevole ma meno secca. La prima è più vicina all'originale che la seconda."
    errors: [comparative]
    gold: {text: "più vicina all'originale che la seconda", fix: "più vicina all'originale della seconda"}
  - tutor: "Due buone opzioni. Ma ferma: «più vicina all'originale che la seconda»… stai confrontando due rese, cioè due nomi: ci vuole davvero che?"
    prompt: {text: "più vicina all'originale che la seconda", tags: [comparative]}
  - learner: "No, ci vuole di: la prima è più vicina all'originale della seconda. Anche se «seccata», a dire il vero, mi sembra un po' datato."
  - tutor: "Datato no, direi letterario, e l'autrice lo è. Allora? Decidi tu, e poi ne rispondi tu all'editor."
    goals: [options]
  - learner: "Scelgo «ero vagamente seccata». Se avessi scelto l'altra, avrei tradito il tono; così almeno la pagina sorride come l'originale. E all'editor dirò che l'ha deciso il senior."
  - tutor: "Ottima scelta, e motivata bene. Ma niente scaricabarile: all'editor dirai che l'hai deciso tu, e che hai ragione."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autrice a parlare."
  - learner: "Lo so, ne ho pensato tutta la notte. Il passaggio più difficile è il dialogo tra le due sorelle."
    errors: [ci-ne]
    gold: {text: "ne ho pensato", fix: "ci ho pensato"}
  - tutor: "Tutta la notte? Che dedizione. Ma «ne ho pensato»: si pensa a qualcosa, quindi quale particella ti serve?"
    prompt: {text: "ne ho pensato", tags: [ci-ne]}
  - learner: "Ci ho pensato, giusto: pensare a. Il problema è che le sorelle dicono «you know» ogni due frasi, e se lo traduco sempre con «sai», il testo diventa ridicolo."
  - tutor: "Ecco, almeno lo vedi. «You know» è un tic, non un significato: tradurlo ogni volta è fedeltà da notaio. Che alternative hai?"
    goals: [problem]
  - learner: "Potrei variare, «sai», «capisci», «insomma», oppure toglierlo dove non serve. Ma non so se ne vale la pena di toccare l'autrice così tanto."
    errors: [ci-ne]
    gold: {text: "se ne vale la pena di toccare", fix: "se vale la pena di toccare"}
  - tutor: "Le alternative sono buone. Ma «non so se ne vale la pena di toccare»… se poi dici di che cosa vale la pena, quella particella ti serve ancora?"
    prompt: {text: "se ne vale la pena di toccare", tags: [ci-ne]}
  - learner: "Sì, credo di sì: non so se ne valga la pena di riscriverla così tanto."
    errors: [ci-ne]
  - tutor: "Se valga la pena di riscriverla? Eccome: tradurre è anche togliere. E poi c'è un'altra trappola, più in basso: «she pretended to be asleep». Tu che cosa hai scritto?"
    goals: [options]
    recast: {text: "se ne valga la pena di riscriverla", fix: "se valga la pena di riscriverla", tags: [ci-ne]}
  - learner: "Ho scritto «faceva finta di dormire», perché «pretendeva di dormire» sarebbe stato un falso amico clamoroso: in italiano pretendere vuol dire esigere."
  - tutor: "Brava, quella trappola l'hai schivata. Allora, decidiamo il dialogo delle sorelle: quale soluzione teniamo?"
    goals: [false-friend]
  - learner: "Terrei «sai» solo dove c'è un'esitazione vera, e il resto lo tolgo. Così suona naturale, e la ripetizione, quando c'è, si nota di più. Se l'autrice lo leggesse in italiano, credo che sarebbe d'accordo."
  - tutor: "Approvato, e motivato bene. Vedi che, quando ci ragioni, ce la fai? Mandami la bozza rivista entro venerdì."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  history: [word-choice]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Ti ringrazio per la franchezza, anche se fa male. Il problema è il narratore: scrive frasi lunghissime, piene di subordinate, e io le ho spezzato per rendere il testo più leggibile."
    errors: [participle-agreement]
    gold: {text: "le ho spezzato", fix: "le ho spezzate"}
  - tutor: "Ed è lì che l'hai tradito. Ma prima una cosa: «io le ho spezzato»… con quel le davanti, il participio non deve fare qualcosa?"
    prompt: {text: "le ho spezzato", tags: [participle-agreement]}
  - learner: "Deve accordarsi: le ho spezzate. Ecco un esempio: «He walked home slowly, thinking of everything he had failed to say». Io ho messo due frasi, ma l'alternativa sarebbe un gerundio: «Tornò a casa lentamente, pensando a tutto ciò che non aveva saputo dire»."
  - tutor: "La seconda tiene il respiro dell'originale. Però attento a «failed to say»: «non era riuscito» o «non aveva saputo»? Non è la stessa sfumatura."
    goals: [problem]
  - learner: "Hai ragione: «non era riuscito» fa pensare a un ostacolo esterno, «non aveva saputo» a un'incapacità sua, e nel romanzo è un uomo che si colpevolizza. Però il mio editor mi ha chiesto di fare il testo più fluido."
    errors: [word-choice]
  - tutor: "Rendere il testo più fluido non vuol dire spezzarlo: anche una frase lunga scorre, se il ritmo regge. E l'editor, fidati, preferisce un autore riconoscibile."
    goals: [options]
    recast: {text: "fare il testo più fluido", fix: "rendere il testo più fluido", tags: [word-choice]}
  - learner: "Va bene, tengo il gerundio. Ma c'è un altro problema: nel capitolo l'autore usa «eventually» tre volte, e io l'ho tradotto sempre con «eventualmente»."
  - tutor: "Tre volte? Allora sono tre svarioni: «eventually» vuol dire «alla fine», «col tempo», mai «eventualmente», che significa «se capita». È un falso amico da manuale."
    goals: [false-friend]
  - learner: "Che vergogna, lo sapevo benissimo. Se sarei stato più attento, me ne sarei accorto da solo."
    errors: [hypothetical]
    gold: {text: "Se sarei stato più attento", fix: "Se fossi stato più attento"}
  - tutor: "Succede a tutti. Ma «se sarei stato più attento»… nella frase con se, quel condizionale ci sta proprio bene?"
    prompt: {text: "Se sarei stato più attento", tags: [hypothetical]}
  - learner: "No: se fossi stato più attento, me ne sarei accorto. Allora decidiamo: gerundio, «non aveva saputo», e «alla fine» al posto di «eventualmente»."
  - tutor: "Deciso. E non vergognarti: i falsi amici fregano tutti, anche i senior. Rimandami il capitolo entro lunedì e ne riparliamo."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Lo so che non ti piace. L'autore scrive in un inglese molto colloquiale, pieno di slang, e io ho cercato di renderlo con un italiano altrettanto vivace. Non pensavo che il risultato sia così lontano."
    errors: [subjunctive-use]
    gold: {text: "Non pensavo che il risultato sia", fix: "Non pensavo che il risultato fosse"}
  - tutor: "Vivace è vivace, nessuno lo nega. Ma «non pensavo che il risultato sia così lontano»… pensavo è al passato: il congiuntivo che segue può restare al presente?"
    prompt: {text: "Non pensavo che il risultato sia", tags: [subjunctive-use]}
  - learner: "No, deve seguire il passato: non pensavo che il risultato fosse così lontano. Per esempio, il protagonista dice «that's sick!» per dire che una cosa è bellissima, e io ho scritto «che figata!»."
  - tutor: "Ecco il punto: «figata» è l'Italia di oggi, il tuo protagonista è un ragazzo di Manchester negli anni Novanta. Che alternative vedi?"
    goals: [problem]
  - learner: "Potrei usare «che forte!», che negli anni Novanta si diceva molto, oppure «da paura», che è più marcato. Il mio dubbio è che «forte» suona troppo innocente per un personaggio così sboccato."
    errors: [subjunctive-use]
    gold: {text: "che «forte» suona troppo innocente", fix: "che «forte» suoni troppo innocente"}
  - tutor: "Due candidati seri. Ma di nuovo: «il mio dubbio è che «forte» suona troppo innocente»… un dubbio introduce un fatto certo o qualcosa di incerto?"
    prompt: {text: "che «forte» suona troppo innocente", tags: [subjunctive-use]}
  - learner: "Qualcosa di certo, direi: il dubbio è che «forte» suona troppo innocente, anche per gli anni Novanta."
    errors: [subjunctive-use]
  - tutor: "Che «forte» suoni troppo innocente è un dubbio legittimo; ma la sboccatezza non si misura in una parola, si distribuisce nel paragrafo. E «he was so embarrassed», come l'hai resa?"
    goals: [options]
    recast: {text: "che «forte» suona troppo innocente", fix: "che «forte» suoni troppo innocente", tags: [subjunctive-use]}
  - learner: "«Era così imbarazzato». Non è un falso amico, vero? So che «embarazada», in spagnolo, vuol dire incinta, ma in italiano «imbarazzato» va bene."
  - tutor: "Va benissimo, tranquilla: il tranello c'è solo tra spagnolo e italiano, non tra inglese e italiano. Allora, che cosa decidiamo per «that's sick»?"
    goals: [false-friend]
  - learner: "Decido «da paura»: è d'epoca, è giovane e ha quel tanto di eccesso che ci vuole. Se l'editor dice che è troppo, li proporrò «che forte», ma senza convinzione."
    errors: [object-pronoun]
    gold: {text: "li proporrò", fix: "gli proporrò"}
  - tutor: "Scelta convincente. Ma «li proporrò»: quanti editor hai? Quel pronome fa pensare che siano parecchi."
    prompt: {text: "li proporrò", tags: [object-pronoun]}
  - learner: "Uno solo, purtroppo: gli proporrò «che forte», ma senza convinzione."
  - tutor: "Così va meglio. E vedrai che non servirà: «da paura» è la scelta giusta, e la difendo anch'io. Mandami il capitolo rivisto."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Lo ammetto, non l'ho capita. Ho riso per educazione, quando ridevano tutti. Ma che c'entrava la panna?"
  - tutor: "La panna nella carbonara, per un romano, è un crimine contro l'umanità. Il comico ha detto che il ministro mette la panna anche nelle riforme: le annacqua e le rende pesanti."
    goals: [missed]
  - learner: "Ah, adesso ci arrivo! È geniale: una metafora culinaria per dire che il governo rovina tutto quello che tocca. Se l'avrei capita subito, avrei riso fino alle lacrime."
    errors: [hypothetical]
    gold: {text: "Se l'avrei capita", fix: "Se l'avessi capita"}
  - tutor: "Meglio tardi che mai! Ma «se l'avrei capita subito»… nella parte con se, il condizionale ci sta proprio bene?"
    prompt: {text: "Se l'avrei capita", tags: [hypothetical]}
  - learner: "No, ci va il congiuntivo: se l'avessi capita subito, avrei riso fino alle lacrime. Comunque la mia preferita è quella sul regionale: ci mi sono ritrovato in pieno."
    errors: [combined-pronouns]
    gold: {text: "ci mi sono ritrovato", fix: "mi ci sono ritrovato"}
  - tutor: "Quella dei treni puntuali, ma non si sa di quale giorno? Un classico. Però «ci mi sono ritrovato»… quei due pronomi, in che ordine vanno?"
    prompt: {text: "ci mi sono ritrovato", tags: [combined-pronouns]}
  - learner: "Prima mi, poi ci: mi ci sono ritrovato in pieno, perché la settimana scorsa ho aspettato un regionale per due ore. E ho provato anch'io a inventare un gioco di parole, se vuoi sentirlo."
  - tutor: "Sentiamolo, ma ti avverto: sono un critico severo."
    goals: [favourite]
  - learner: "Allora: «Il ministro dell'Economia ha tagliato tutto, persino i capelli: almeno lì il taglio si vede». Gioca sul doppio senso di «taglio»."
  - tutor: "Non male! Freddura da manuale: fa ridere e piangere allo stesso tempo. Ma secondo te la satira dovrebbe avere dei limiti?"
    goals: [wordplay]
  - learner: "Secondo me no, purché colpisca il potere e non i deboli. Se un comico prendesse in giro un disabile, non lo troverei divertente; se prende in giro un ministro, eventualmente il ministro si arrabbierà, ma è il suo lavoro."
    errors: [false-friend]
  - tutor: "E prima o poi il ministro si arrabbia, certo: è il segno che la battuta ha colpito. Sottoscrivo: la satira deve mordere verso l'alto, mai verso il basso."
    goals: [limits]
    recast: {text: "eventualmente", fix: "prima o poi", tags: [false-friend]}
  - learner: "Esatto. E a proposito di potere: la prossima birra chi la offre?"
  - tutor: "Chi non aveva capito la battuta sulla carbonara, ovviamente. Vai al bancone, io ti aspetto qui."

# C2: seminario di etica, interviste radiofoniche sulla vita in Italia e satira: rigore e sfumature.
- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Ne dubiti pure, professore, è il suo mestiere. La mia tesi è che la responsabilità morale presupponga due condizioni: l'intenzionalità e la capacità di rispondere delle proprie azioni davanti ad altri. Una macchina non soddisfa né l'una né l'altra."
  - tutor: "Tesi chiara. Ma non sta definendo la responsabilità in modo da escludere le macchine fin da subito? Mi sembra un ragionamento circolare."
    goals: [thesis]
  - learner: "Non credo. Distinguo tra responsabilità causale e responsabilità morale: un'auto a guida autonoma può causare un incidente, come una frana, ma nessuno chiamerebbe colpevole una frana. Da qui si può tirare una prima conclusione: la causa non basta."
    errors: [word-choice]
  - tutor: "Se ne può trarre una prima conclusione, certo. Ma la distinzione regge? Una frana non impara; un sistema che apprende sì, e modifica il proprio comportamento in base alle conseguenze."
    goals: [distinguish]
    recast: {text: "tirare una prima conclusione", fix: "trarre una prima conclusione", tags: [word-choice]}
  - learner: "È un'obiezione seria. Ma imparare non significa capire: il sistema ottimizza una funzione, non si chiede se ciò che fa sia giusto. Non c'è nessuna evidenza che una macchina abbia una prospettiva in prima persona."
    errors: [false-friend]
  - tutor: "Nessuna prova, d'accordo; ma neanche della prospettiva in prima persona degli altri esseri umani abbiamo prove dirette: la deduciamo dal comportamento. Perché alla macchina no?"
    goals: [objection]
    recast: {text: "nessuna evidenza", fix: "nessuna prova", tags: [false-friend]}
  - learner: "Perché negli esseri umani la deduzione si basa su un'analogia con noi stessi: corpo, biologia, evoluzione comuni. Con una macchina questa analogia manca. Ammetto però che, se un giorno un sistema mostrerebbe sofferenza in modo convincente, la mia posizione vacillerebbe."
    errors: [hypothetical]
    gold: {text: "se un giorno un sistema mostrerebbe", fix: "se un giorno un sistema mostrasse"}
  - tutor: "Concessione onesta. Ma «se un giorno un sistema mostrerebbe sofferenza»… la protasi, in un periodo ipotetico come questo, vuole il condizionale?"
    goals: [concede]
    prompt: {text: "se un giorno un sistema mostrerebbe", tags: [hypothetical]}
  - learner: "No, il congiuntivo imperfetto: se un giorno un sistema mostrasse sofferenza in modo convincente, la mia posizione vacillerebbe. Vacillerebbe, badi bene, non crollerebbe."
  - tutor: "Distinzione sottile, e la apprezzo. Ci dia allora una conclusione rigorosa, in una frase."
  - learner: "Finché non avremo ragioni per attribuire a una macchina intenzionalità e vissuto, la responsabilità morale dei suoi atti resterà di chi la progetta, la addestra e la usa."
  - tutor: "Rigorosa e prudente al punto giusto. Non mi ha convinto del tutto, dottoressa, ma mi ha costretto a pensare: è il complimento più alto che so fare."
    goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Bene, dottore, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Ci mancherebbe, professore. La mia tesi, più precisamente, è che la responsabilità sia sempre umana, anche quando l'azione è compiuta da una macchina: la macchina può essere imputabile in senso tecnico, mai in senso morale."
  - tutor: "«Imputabile in senso tecnico»: che cosa intende, esattamente?"
    goals: [thesis]
  - learner: "Intendo che possiamo attribuire alla macchina un errore, come a un termostato guasto, ma la colpa ricade su chi l'ha costruita. Cioè, tipo, la macchina sbaglia, ma non è che è colpa sua, capito?"
    errors: [register]
    gold: {text: "Cioè, tipo, la macchina sbaglia, ma non è che è colpa sua, capito?", fix: "La macchina sbaglia, ma la colpa non è sua."}
  - tutor: "Il concetto c'è. Ma «cioè, tipo, non è che è colpa sua, capito?»… lo scriverebbe così, nella sua tesi di dottorato?"
    prompt: {text: "Cioè, tipo, la macchina sbaglia, ma non è che è colpa sua, capito?", tags: [register]}
  - learner: "Certo che no, mi scusi. Distinguo tra errore e colpa: la macchina può commettere un errore, ma la colpa presuppone la possibilità di agire altrimenti, che la macchina non ha."
  - tutor: "Ma la possibilità di agire altrimenti ce l'abbiamo davvero noi? Molti neuroscienziati ne dubitano. E se non ce l'abbiamo, la sua distinzione crolla."
    goals: [distinguish]
  - learner: "Non crolla, si sposta. Anche se il libero arbitrio fosse un'illusione, continueremmo a ritenerci responsabili gli uni verso gli altri, perché la responsabilità è una pratica sociale. La macchina, invece, non partecipa a questa pratica: non si scusa e non prova rimorso."
  - tutor: "Una risposta elegante. Ma se un sistema imparasse a scusarsi in modo credibile, non entrerebbe anche lui nella pratica?"
    goals: [objection]
  - learner: "Le concedo che il confine è più sfumato di quanto si pensa di solito. Però scusarsi in modo credibile non è la stessa cosa che scusarsi sul serio."
    errors: [comparative]
    gold: {text: "più sfumato di quanto si pensa", fix: "più sfumato di quanto non si pensi"}
  - tutor: "Concessione preziosa. Ma «più sfumato di quanto si pensa di solito»… in un paragone così, in un registro accademico, quale modo verbale preferirebbe?"
    goals: [concede]
    prompt: {text: "più sfumato di quanto si pensa", tags: [comparative]}
  - learner: "L'indicativo mi sembra corretto: il confine è più sfumato di quanto si pensa, lo ammetto."
    errors: [comparative]
  - tutor: "Più sfumato di quanto non si pensi, appunto: il congiuntivo dà alla concessione il peso che merita. Ci dia allora la sua conclusione, in una frase."
    recast: {text: "più sfumato di quanto si pensa", fix: "più sfumato di quanto non si pensi", tags: [comparative]}
  - learner: "Concludo così: finché la scusa di una macchina sarà una simulazione e non l'espressione di un vissuto, la responsabilità morale resterà umana, distribuita tra chi progetta, chi addestra e chi usa."
  - tutor: "Conclusione rigorosa, e prudente al punto giusto. Ne discuteremo ancora, dottore: lei mi ha costretto a cambiare idea almeno su un punto."
    goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Grazie, professore, i dubbi sono benvenuti. Sostengo che la responsabilità morale richieda un agente capace di comprendere le ragioni delle proprie azioni, e che le macchine attuali non lo siano."
  - tutor: "«Le macchine attuali»: quindi lascia aperta la porta alle macchine future?"
    goals: [thesis]
  - learner: "In linea di principio sì. Ma bisogna distinguere tra comprensione e simulazione della comprensione: oggi si può attribuire ai sistemi delle capacità linguistiche straordinarie, non una comprensione."
    errors: [passive]
    gold: {text: "si può attribuire ai sistemi delle capacità", fix: "si possono attribuire ai sistemi delle capacità"}
  - tutor: "Distinzione centrale. Ma «oggi si può attribuire ai sistemi delle capacità»… con il si passivante, il verbo con che cosa concorda?"
    prompt: {text: "si può attribuire ai sistemi delle capacità", tags: [passive]}
  - learner: "Con il soggetto, credo: oggi si può riconoscere ai sistemi capacità linguistiche straordinarie, ma non una comprensione."
    errors: [passive]
  - tutor: "Si possono riconoscere ai sistemi capacità linguistiche straordinarie, certo. Ma chi le dice che la nostra comprensione non sia, a sua volta, una simulazione ben riuscita?"
    goals: [distinguish]
    recast: {text: "si può riconoscere", fix: "si possono riconoscere", tags: [passive]}
  - learner: "Nessuno me lo garantisce, ed è proprio questo il punto: la differenza non sta nel risultato, ma nel fatto che noi abbiamo qualcosa in gioco. Una macchina non rischia niente quando sbaglia."
  - tutor: "Interessante: la responsabilità come esposizione al rischio. Ma allora un'azienda, che rischia il fallimento, sarebbe un agente morale?"
    goals: [objection]
  - learner: "Le concedo che le persone giuridiche complicano il quadro: in un certo senso le riteniamo responsabili. Ma è una finzione utile, che rimanda sempre a persone in carne e ossa. Se l'intelligenza artificiale fosse trattata allo stesso modo, la ammetterei come finzione giuridica, non come agente morale."
  - tutor: "Una concessione elegante, e strategicamente intelligente. Ci dia la sua conclusione."
    goals: [concede]
  - learner: "Concludo che attribuire una responsabilità morale alle macchine non sarebbe progresso etico, ma un modo comodo di deresponsabilizzarci: se la colpa è dell'algoritmo, nessuno ne risponde."
    errors: [article-use]
    gold: {text: "non sarebbe progresso etico", fix: "non sarebbe un progresso etico"}
  - tutor: "Conclusione forte. Ma «non sarebbe progresso etico, ma un modo comodo»… nella prima metà della frase, rispetto alla seconda, non manca qualcosa?"
    prompt: {text: "non sarebbe progresso etico", tags: [article-use]}
  - learner: "Manca l'articolo: non sarebbe un progresso etico, ma un modo comodo di deresponsabilizzarci."
  - tutor: "Esatto, e la simmetria ora è perfetta. Una conclusione che è anche un avvertimento: lei ha difeso la sua tesi con grande rigore, dottoressa."
    goals: [conclude]

- scenario: vita-in-italia
  level: C2
  persona: en-m-traveller
  history: [word-choice]
  turns:
  - tutor: "Benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da otto anni. Ci racconta perché si è trasferito?"
  - learner: "Buongiorno a tutti. Mi sono trasferito per amore, come tanti: ho conosciuto mia moglie durante un viaggio in Sicilia, e dopo due anni di voli tra Londra e Palermo abbiamo deciso che uno dei due doveva cambiare paese. Ho perso io, o forse ho vinto."
  - tutor: "Un inizio da romanzo! E qual è stata la parte più difficile?"
    goals: [story]
  - learner: "Senza dubbio fare amici. I colleghi erano gentilissimi, ma la sera ognuno tornava dalla sua famiglia, dagli amici di scuola, e io restavo fuori."
    errors: [word-choice]
  - tutor: "Farsi degli amici da adulti, in una città dove le amicizie nascono all'asilo, è un'impresa. Come ci è riuscito, alla fine?"
    goals: [difficulties]
    recast: {text: "fare amici", fix: "farsi degli amici", tags: [word-choice]}
  - learner: "Con il calcetto, incredibilmente. Un collega mi ha invitato a giocare il giovedì, e dopo la partita siamo sempre andati a mangiare una pizza, per anni."
    errors: [tense-aspect]
    gold: {text: "siamo sempre andati a mangiare", fix: "andavamo sempre a mangiare"}
  - tutor: "Il calcetto! Ma «dopo la partita siamo sempre andati a mangiare una pizza»… per un'abitudine di quegli anni, è il tempo che userebbe?"
    prompt: {text: "siamo sempre andati a mangiare", tags: [tense-aspect]}
  - learner: "No, l'imperfetto: dopo la partita andavamo sempre a mangiare una pizza. Lì ho capito che in Italia l'amicizia passa dalla tavola."
  - tutor: "Il calcetto come strumento d'integrazione: lo proporremo al ministero. E lei, in questi anni, come è cambiato?"
  - learner: "Sono diventato più paziente, soprattutto con la burocrazia. All'inizio, quando un ufficio mi chiedeva un documento che ho già consegnato, mi arrabbiavo; ora sorrido e lo porto un'altra volta."
    errors: [tense-aspect]
    gold: {text: "che ho già consegnato", fix: "che avevo già consegnato"}
  - tutor: "La pazienza dei veri italiani! Ma «un documento che ho già consegnato», in un racconto al passato: quella consegna non era avvenuta ancora prima?"
    prompt: {text: "che ho già consegnato", tags: [tense-aspect]}
  - learner: "Sì, prima: un documento che avevo già consegnato. Ci vuole il trapassato. E ho anche imparato a gesticolare: mia madre dice che ormai sembro un mimo."
  - tutor: "Pazienza e gesti: è diventato italiano a tutti gli effetti! Che consiglio darebbe a chi sta pensando di trasferirsi?"
    goals: [change]
  - learner: "Di imparare la lingua prima di partire, non dopo. Io sono arrivato che sapevo solo ordinare un caffè, e per i primi mesi ho vissuto in una bolla. Se avessi studiato prima, mi sarei integrato molto più in fretta."
  - tutor: "Un consiglio che vale oro, e detto da chi ce l'ha fatta. Grazie di essere stato con noi, e buona continuazione a tutti i nostri ascoltatori."
    goals: [advice]

- scenario: vita-in-italia
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
  - tutor: "Benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da cinque anni. Ci racconta perché si è trasferita?"
  - learner: "Buongiorno. Sono arrivata a Bologna con l'Erasmus, per un semestre, e alla fine del semestre non riuscivo a immaginare di tornare a Siviglia. Ho trovato lavoro in un'editoriale e sono rimasta."
    errors: [false-friend]
  - tutor: "Un lavoro in una casa editrice e un semestre diventato cinque anni: Bologna fa questo effetto. Qual è stata la difficoltà più grande?"
    goals: [story]
    recast: {text: "in un'editoriale", fix: "in una casa editrice", tags: [false-friend]}
  - learner: "La burocrazia, senza dubbio. Per avere la residenza sono dovuta andare in comune sei volte, e ogni volta mi chiedevano un documento diverso. La impiegata era molto simpatica, però, questo sì."
    errors: [article-form]
    gold: {text: "La impiegata", fix: "L'impiegata"}
  - tutor: "Sei volte: un classico! Ma «la impiegata»… davanti a una vocale, quell'articolo resta intero?"
    goals: [difficulties]
    prompt: {text: "La impiegata", tags: [article-form]}
  - learner: "No, si apostrofa: l'impiegata. Era simpatica, ma alla sesta volta ero davvero disgustata."
    errors: [false-friend]
  - tutor: "Esasperata, immagino, e con ragione. Ma in questi cinque anni lei com'è cambiata?"
    recast: {text: "disgustata", fix: "esasperata", tags: [false-friend]}
  - learner: "Esasperata, ecco la parola: «disgustata» è troppo forte! Sono cambiata molto: sono più diretta di quanto fossi a Siviglia, e ho imparato a difendere le mie idee. Credo che l'Italia mi abbia resa più sicura di me."
  - tutor: "«Più diretta di quanto fossi»: si sente che ha studiato! E che consiglio darebbe a chi vuole trasferirsi qui?"
    goals: [change]
  - learner: "Di non aspettare che l'Italia si adatti a loro: sono loro che si devono adattare all'Italia. E di fare la pazienza con gli uffici: alla fine i documenti arrivano."
    errors: [word-choice]
  - tutor: "Avere pazienza con gli uffici: un consiglio d'oro, e lei è la prova che funziona. Grazie di essere stata con noi."
    goals: [advice]
    recast: {text: "fare la pazienza", fix: "avere pazienza", tags: [word-choice]}
  - learner: "Grazie a voi, è stato un piacere. Un saluto a tutti gli ascoltatori, e anche all'impiegata del comune!"
  - tutor: "Che, ne siamo sicuri, ci sta ascoltando. Grazie ancora, e buona continuazione a tutti."

- scenario: vita-in-italia
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da dieci anni. Ci racconta perché si è trasferita?"
  - learner: "Volentieri. Lavoravo per una banca a Londra e l'azienda mi ha proposto un trasferimento a Milano per due anni. I due anni sono diventati dieci: credo che la città mi abbia conquistata senza che me ne accorgessi."
  - tutor: "Milano conquista in silenzio, è vero. Qual è stata la difficoltà più grande?"
    goals: [story]
  - learner: "All'inizio il lavoro: in Inghilterra le riunioni durano mezz'ora e finiscono con una decisione; qui duravano due ore e finivano con un'altra riunione. Una rottura di scatole, insomma."
    errors: [register]
    gold: {text: "Una rottura di scatole", fix: "Una fonte di frustrazione"}
  - tutor: "Riunioni infinite: qualche ascoltatore si starà riconoscendo. Ma «una rottura di scatole», in diretta alle dieci del mattino... come lo direbbe in modo più adatto alla radio?"
    goals: [difficulties]
    prompt: {text: "Una rottura di scatole", tags: [register]}
  - learner: "Ha ragione, chiedo scusa: diciamo che era una fonte di grande frustrazione. Credo che all'inizio i miei colleghi mi trovavano piuttosto rigida."
    errors: [subjunctive-use]
    gold: {text: "mi trovavano", fix: "mi trovassero"}
  - tutor: "Molto meglio. E quel «credo che i miei colleghi mi trovavano»… dopo credo che, il verbo può restare all'indicativo?"
    prompt: {text: "mi trovavano", tags: [subjunctive-use]}
  - learner: "Sì, è un fatto: credo che mi trovavano rigida, almeno nei primi mesi."
    errors: [subjunctive-use]
  - tutor: "Che i colleghi la trovassero rigida ci sta: un'inglese puntuale, a Milano, è quasi una provocazione! E oggi, come si sente cambiata?"
    recast: {text: "trovavano", fix: "trovassero", tags: [subjunctive-use]}
  - learner: "Sono più flessibile, e meno ossessionata dagli orari. Ho capito che le riunioni servono a creare fiducia, e che le decisioni vere si prendono alla macchinetta del caffè. Se fossi rimasta a Londra, oggi sarei forse più ricca, ma molto meno felice."
  - tutor: "Più flessibile e più felice: un bel bilancio. E a chi pensa di trasferirsi in Italia, che consiglio darebbe?"
    goals: [change]
  - learner: "Di non giudicare troppo in fretta: quello che all'inizio sembra disordine spesso è un altro tipo di ordine. E di imparare due o tre espressioni nel dialetto della propria città: aprono più porte di qualunque laurea."
  - tutor: "Un consiglio prezioso, e molto milanese. Grazie di essere stata con noi, e buona continuazione a tutti i nostri ascoltatori."
    goals: [advice]

- scenario: umorismo-satira
  level: C2
  persona: es-f-teacher
  history: [ci-ne]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Lo ammetto: non ci sono arrivata. Ho riso per non sembrare l'unica straniera della sala, ma non ho capito niente. Che c'entrava la carbonara con il ministro?"
  - tutor: "Finalmente una confessione! Il ministro aveva detto in un'intervista che la carbonara si fa con la pancetta, e Roma è insorta: per noi è guanciale o morte."
    goals: [missed]
  - learner: "Adesso capisco! Allora la battuta era che un ministro può sbagliare tutte le riforme, ma se sbaglia la carbonara deve dimettersi. Geniale. La mia preferita, però, è stata quella sui commercialisti."
  - tutor: "Quella dei commercialisti che vanno in vacanza solo negli anni bisestili? Perché ti è piaciuta tanto?"
  - learner: "Perché mio marito è commercialista, e ogni primavera sparisce. È una battuta più vera di divertente."
    errors: [comparative]
    gold: {text: "più vera di divertente", fix: "più vera che divertente"}
  - tutor: "Povero marito! Ma «più vera di divertente»… due aggettivi riferiti alla stessa battuta: ci va proprio di?"
    goals: [favourite]
    prompt: {text: "più vera di divertente", tags: [comparative]}
  - learner: "No, ci va che: più vera che divertente. Senti, mi spieghi un gioco di parole che ho trovato nel giornale di ieri?"
    errors: [preposition]
    gold: {text: "nel giornale", fix: "sul giornale"}
  - tutor: "Volentieri. Ma l'hai trovato «nel giornale»? Come se fosse nascosto tra i fogli? Per quello che si legge stampato, in italiano, la preposizione è un'altra."
    prompt: {text: "nel giornale", tags: [preposition]}
  - learner: "Dentro, no? L'ho letto nel giornale: «Qual è il colmo per un elettricista? Non essere al corrente». Perché fa ridere?"
    errors: [preposition]
  - tutor: "Sul giornale, sì: è una freddura classica. «Essere al corrente» vuol dire essere informati, ma la corrente è anche quella elettrica: un elettricista che non sa le notizie fa doppiamente ridere."
    recast: {text: "nel giornale", fix: "sul giornale", tags: [preposition]}
  - learner: "Ah, che bello! Allora ci provo io: qual è il colmo per un'insegnante? Perdere la classe."
  - tutor: "Brava, doppio senso perfetto: la classe degli alunni e la classe come eleganza! Ma secondo te la satira dovrebbe avere dei limiti?"
    goals: [wordplay]
  - learner: "Secondo me sì, ma non quelli che vorrebbe il potere: si può ridere di tutto, purché non si rida delle vittime."
  - tutor: "Sottoscrivo ogni parola. E con questa, il prossimo giro lo offro io: te lo sei meritato."
    goals: [limits]

- scenario: umorismo-satira
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Va bene, lo confesso: non l'avevo capita. Ma non ero l'unica: anche la ragazza accanto a me rideva con la faccia di chi non sa perché. Me la spieghi?"
  - tutor: "Il comico ha detto che il ministro vuole tassare il guanciale, e che a Roma è l'unico modo sicuro per far cadere un governo. Toccare la carbonara, qui, è peggio che toccare le pensioni."
    goals: [missed]
  - learner: "Ah, ecco! Senza il contesto non potevo capirla. Io invece ho riso tantissimo alla battuta sui treni: il comico era molto eccitato, saltava da una parte all'altra del palco."
    errors: [false-friend]
  - tutor: "Era molto su di giri, sì: saltava come un grillo. E perché ti è piaciuta tanto quella battuta?"
    recast: {text: "molto eccitato", fix: "molto su di giri", tags: [false-friend]}
  - learner: "Perché era vera: ha detto che i treni italiani sono come le promesse elettorali, partono sempre e arrivano quando vogliono. Ci ho pensato tutta la notte."
  - tutor: "Satira travestita da barzelletta, la migliore. E tu, sapresti inventare un gioco di parole?"
    goals: [favourite]
  - learner: "Ci provo: qual è il colmo per un ministro? Essere senza portafoglio! «Ministro senza portafoglio» è un termine politico, ma il portafoglio è anche quello dei soldi."
  - tutor: "Bravissima, freddura perfetta: il ministro senza portafoglio esiste davvero! E i limiti della satira? Secondo te, ce ne dovrebbero essere?"
    goals: [wordplay]
  - learner: "Sì, penso che la satira deve avere un limite: puoi ridere del potere, ma se ridi di chi soffre diventa bullismo."

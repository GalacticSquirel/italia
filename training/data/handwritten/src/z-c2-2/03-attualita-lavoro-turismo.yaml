# C2: notizie, automazione e turismo di massa: fonti, ipotesi, falsi amici e registro.
- scenario: notizie-attualita
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Sì, l'ho seguita ieri sera. In sostanza, il governo vuole che chi affitta per meno di trenta giorni nei centri storici abbia un codice identificativo e paghi una tassa più alta. Mi pare che i comuni potranno anche fissare un limite di notti all'anno."
  - tutor: "Esatto, il succo è quello. Io però ho la sensazione che sia l'ennesima legge di facciata. Tu che ne pensi?"
    goals: [summarise]
  - learner: "Di facciata no: almeno è un primo passo. Il problema è che i controlli toccheranno ai comuni, che non hanno né personale né soldi, e la legge rischia di restare sulla carta. Però sono contenta che qualcuno si è finalmente mosso."
    errors: [subjunctive-use]
    gold: {text: "sono contenta che qualcuno si è finalmente mosso", fix: "sono contenta che qualcuno si sia finalmente mosso"}
  - tutor: "Sottoscrivo il «resta sulla carta». Ma «sono contenta che qualcuno si è mosso»… dopo un'emozione come contenta, che modo verbale ci vuole?"
    goals: [opinion]
    prompt: {text: "sono contenta che qualcuno si è finalmente mosso", tags: [subjunctive-use]}
  - learner: "Il congiuntivo, giusto: sono contenta che qualcuno si sia finalmente mosso."
  - tutor: "Ecco. E sulle fonti? Io ho letto tre giornali e mi sembrava di leggere tre leggi diverse."
  - learner: "Anche a me. Nell'editoria di ieri, il direttore del Corriere difendeva soprattutto i piccoli proprietari, che con gli affitti brevi arrotondano la pensione. Repubblica, invece, ha messo in prima pagina le famiglie costrette a lasciare il centro."
    errors: [false-friend]
  - tutor: "L'editoriale del Corriere l'ho letto anch'io, e non mi ha convinto: due colonne di pensionati commoventi e nemmeno un numero. E Repubblica che dati dava?"
    goals: [sources]
    recast: {text: "editoria", fix: "editoriale", tags: [false-friend]}
  - learner: "Quelli dell'Istat: in dieci anni il centro di Firenze ha perso un quinto dei residenti. Il guaio è che il ministro aveva detto che la legge entrerebbe in vigore a gennaio, e già si parla di rinvio."
    errors: [conditional-form]
    gold: {text: "aveva detto che la legge entrerebbe", fix: "aveva detto che la legge sarebbe entrata"}
  - tutor: "Un quinto, impressionante. Ma torna su «aveva detto che la legge entrerebbe»: per un futuro visto dal passato, quale condizionale serve?"
    prompt: {text: "aveva detto che la legge entrerebbe", tags: [conditional-form]}
  - learner: "Il condizionale passato: aveva detto che la legge sarebbe entrata in vigore a gennaio. Con i rinvii che ci sono sempre, scommetto che i primi effetti li vedremo tra due anni, e magari solo a Venezia e Firenze."
  - tutor: "Scommessa vinta in partenza, temo. Vedremo chi aveva ragione: tu con il tuo «primo passo» o io con la mia «legge di facciata». Intanto il caffè è finito, e la riunione ci aspetta."
    goals: [consequences]

- scenario: notizie-attualita
  level: C2
  persona: es-m-worker
  history: [word-choice]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, l'ho vista. In pratica la legge obbliga chi affitta ai turisti a registrarsi e a pagare una tassa più alta, e i comuni potranno decidere un massimo di notti. Ha alzato una polemica enorme."
    errors: [word-choice]
  - tutor: "Ha sollevato una polemica enorme, sì: i proprietari gridano all'esproprio, gli inquilini dicono che è troppo poco. Tu da che parte stai?"
    goals: [summarise]
    recast: {text: "alzato una polemica", fix: "sollevato una polemica", tags: [word-choice]}
  - learner: "Io sto con gli inquilini, ma con qualche dubbio. A Bologna mio cugino paga novecento euro per un monolocale: se metà degli appartamenti del centro tornassero agli affitti lunghi, i prezzi scenderebbero. Però non credo che i proprietari rinunciano così facilmente."
    errors: [subjunctive-use]
    gold: {text: "non credo che i proprietari rinunciano", fix: "non credo che i proprietari rinuncino"}
  - tutor: "Novecento euro per un monolocale: da brividi. Ma «non credo che i proprietari rinunciano»… sei sicuro di quel modo verbale, dopo non credo?"
    goals: [opinion]
    prompt: {text: "non credo che i proprietari rinunciano", tags: [subjunctive-use]}
  - learner: "No, scusa: non credo che i proprietari rinuncino così facilmente. Hanno troppo da perdere."
  - tutor: "Infatti. E dove l'hai letta, la notizia? Perché ogni testata la racconta a modo suo."
  - learner: "L'ho letta sul Sole 24 Ore e l'ho sentita al telegiornale. Il Sole parlava solo di numeri: gettito fiscale, perdite per il settore. Il telegiornale invece ha intervistato una signora di Venezia, l'ultima rimasta nel suo palazzo. Mi sembra che abbiano giocato molto sull'emozione."
  - tutor: "Il Sole con le tabelle, il telegiornale con le lacrime: la verità, come sempre, sta nel mezzo. E secondo te, tra due anni, che cosa sarà cambiato?"
    goals: [sources]
  - learner: "Secondo me poco, a meno che i comuni non fanno davvero i controlli. Mio cugino dice che a Bologna i vigili ci sono appena per le multe."
    errors: [subjunctive-use, false-friend]
    gold: {text: "a meno che i comuni non fanno", fix: "a meno che i comuni non facciano"}
  - tutor: "Tuo cugino è un pessimista. Ma prima: «a meno che i comuni non fanno»… dopo a meno che, quale modo verbale serve?"
    prompt: {text: "a meno che i comuni non fanno", tags: [subjunctive-use]}
  - learner: "Sì, sì, scusa: a meno che i comuni non fanno sul serio, non cambierà niente."
    errors: [subjunctive-use]
  - tutor: "A meno che i comuni non facciano sul serio, appunto; e qui, francamente, ho i miei dubbi anch'io. Facciamo così: ci rivediamo tra due anni a questa macchinetta, e chi ha sbagliato offre il caffè."
    goals: [consequences]
    recast: {text: "a meno che i comuni non fanno", fix: "a meno che i comuni non facciano", tags: [subjunctive-use]}
  - learner: "Affare fatto. Ma preparati a pagare tu."
  - tutor: "Vedremo, vedremo. Intanto segnatelo in agenda: tra due anni, stesso posto, stessa macchinetta, e un caffè che qualcuno dovrà offrire."

- scenario: notizie-attualita
  level: C2
  persona: en-m-heritage
  history: [relative-pronoun]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Altroché se l'ho vista. È la legge che tutti parlano da una settimana: registro nazionale, tassa più alta e un tetto di notti deciso dai comuni."
    errors: [relative-pronoun]
    gold: {text: "la legge che tutti parlano", fix: "la legge di cui tutti parlano"}
  - tutor: "Proprio quella! Ma scusa: «la legge che tutti parlano»… si parla qualcosa o si parla di qualcosa?"
    goals: [summarise]
    prompt: {text: "la legge che tutti parlano", tags: [relative-pronoun]}
  - learner: "Di qualcosa, hai ragione: la legge di cui tutti parlano. Comunque a me sembra una buona idea, e Lei che ne pensa?"
    errors: [register]
    gold: {text: "e Lei che ne pensa", fix: "e tu che ne pensi"}
  - tutor: "Lei?! Da quando ci diamo del Lei, io e te? Mi fai sentire vecchio. Riprova, dai."
    prompt: {text: "e Lei che ne pensa", tags: [register]}
  - learner: "Scusa, è l'abitudine con il capo: e tu che ne pensi?"
  - tutor: "Io penso che sia un'operazione d'immagine: i controlli toccheranno a comuni che non hanno nemmeno i vigili per le multe. Ma tu perché la trovi una buona idea?"
  - learner: "Perché, anche se i controlli saranno pochi, il registro rende tutto più trasparente. Ho letto un'analisi molto comprensiva sul Post: a Lisbona, dopo una legge simile, gli affitti lunghi sono aumentati del venti per cento in due anni."
    errors: [false-friend]
  - tutor: "Un'analisi molto esauriente, quella del Post, e Lisbona è un buon esempio. Ma i titoli che ho visto io erano tutt'altro che sobri: uno parlava di «esproprio di Stato». Tu ti fidi più degli approfondimenti o dei titoli?"
    goals: [opinion]
    recast: {text: "molto comprensiva", fix: "molto esauriente", tags: [false-friend]}
  - learner: "Degli approfondimenti, sempre. Quel titolo era più gridato di informativo: il Post, invece, citava le sue fonti una per una."
    errors: [comparative]
    gold: {text: "più gridato di informativo", fix: "più gridato che informativo"}
  - tutor: "Sottoscrivo. Ma «più gridato di informativo»… quando confronti due aggettivi riferiti alla stessa cosa, ci vuole davvero di?"
    goals: [sources]
    prompt: {text: "più gridato di informativo", tags: [comparative]}
  - learner: "Hai ragione, lì ci vuole che: più gridato che informativo. E le conseguenze? Io temo che i proprietari passino agli affitti di trentuno giorni, per aggirare la legge."
  - tutor: "Il trucco dei trentuno giorni: ci scommetto anch'io. Fatta la legge, trovato l'inganno, come si dice. Dai, torniamo alle scrivanie prima che il capo ci dia del Lei a tutti e due."
    goals: [consequences]

- scenario: politica-lavoro
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Attualmente credo che tu stia esagerando. Metà dei lavori è una cifra da titolo di giornale: cambieranno, questo sì, ma sparire è un'altra cosa."
    errors: [false-friend]
  - tutor: "In realtà, dici? Guarda che non sono un catastrofista: nella banca di mio cognato, in tre anni, hanno chiuso undici sportelli su quindici."
    goals: [opinion]
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
  - learner: "In realtà, sì, è la parola giusta. Ma uno sportello chiuso non vuol dire un impiegato licenziato: molti sono stati rilocati alla consulenza. Se nel Novecento avessimo ragionato come te, oggi avremmo paura delle lavatrici."
    errors: [word-choice]
  - tutor: "Spostati alla consulenza, per ora; e le lavatrici sono l'argomento preferito degli ottimisti! Però dimmi: se domani un algoritmo facesse il tuo vecchio lavoro meglio di te, come ti sentiresti?"
    goals: [hypothesis]
    recast: {text: "rilocati", fix: "spostati", tags: [word-choice]}
  - learner: "Ho fatto l'ingegnere civile per quarant'anni. Se un algoritmo avrebbe fatto i miei calcoli strutturali, avrei avuto più tempo per i cantieri, che erano la parte più bella."
    errors: [hypothetical]
    gold: {text: "Se un algoritmo avrebbe fatto", fix: "Se un algoritmo avesse fatto"}
  - tutor: "Sarà, ma fermati su «se un algoritmo avrebbe fatto»: nella parte con se, il condizionale è proprio di casa?"
    prompt: {text: "Se un algoritmo avrebbe fatto", tags: [hypothetical]}
  - learner: "No, ci va il congiuntivo: se un algoritmo avesse fatto i miei calcoli, avrei avuto più tempo. Ti faccio un esempio concreto: mia nipote fa la radiologa, e il software le segnala le lesioni sospette, ma la diagnosi la firma lei."
  - tutor: "Esempio perfetto, lo ammetto: lo strumento aiuta, la responsabilità resta umana. Ma per ogni radiologa che si aggiorna, quanti impiegati restano indietro?"
    goals: [example]
  - learner: "Molti, e qui ti do ragione. Allora, per concludere: i lavori non spariranno, si trasformeranno, ma chi non viene formato andrà di mezzo. Tu, alla fine, che ne pensi davvero?"
    errors: [ci-ne]
    gold: {text: "chi non viene formato andrà di mezzo", fix: "chi non viene formato ne andrà di mezzo"}
  - tutor: "Bella sintesi! Ma «chi non viene formato andrà di mezzo»… in quell'espressione manca una particella, la stessa che trovi in andarsene."
    prompt: {text: "chi non viene formato andrà di mezzo", tags: [ci-ne]}
  - learner: "Ah, ne: chi non viene formato ne andrà di mezzo. Allora, tu che ne pensi?"
  - tutor: "Penso che tu abbia ragione più di quanto mi piaccia ammettere: tra dieci anni non sparirà metà dei lavori, ma metà dei compiti. E adesso versami un altro bicchiere, che ho bisogno di consolarmi."
    goals: [conclude]

- scenario: politica-lavoro
  level: C2
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me non è così semplice. Alcuni lavori spariranno, è vero, ma ne nasceranno altri che oggi neanche immaginiamo: dieci anni fa chi conosceva il mestiere di «social media manager»?"
  - tutor: "Bell'esempio, ma quanti ne servono, di social media manager? Uno ogni mille cassieri licenziati?"
    goals: [opinion]
  - learner: "Non lo so, ma il problema non è il numero, è la formazione. Se i governi investirebbero di più nei corsi per adulti, la transizione sarebbe meno dolorosa."
    errors: [hypothetical]
    gold: {text: "Se i governi investirebbero", fix: "Se i governi investissero"}
  - tutor: "Mmm, «se i governi investirebbero»: suona come una notizia del telegiornale, non come un'ipotesi. Come la sistemi?"
    prompt: {text: "Se i governi investirebbero", tags: [hypothetical]}
  - learner: "Volevo dire: se i governi investirebbero di più, la gente non avrebbe tanta paura."
    errors: [hypothetical]
  - tutor: "Se i governi investissero di più, certo; ma i soldi dove li prendono? Fammi un esempio concreto, magari dal tuo paese."
    goals: [hypothesis]
    recast: {text: "se i governi investirebbero", fix: "se i governi investissero", tags: [hypothetical]}
  - learner: "A Bilbao, quando hanno chiuso le acciaierie, il comune ha riconvertito la zona e ha aperto scuole tecniche. Ci hanno voluto vent'anni, ma oggi è una delle città più ricche della Spagna."
    errors: [auxiliary-choice]
    gold: {text: "Ci hanno voluto vent'anni", fix: "Ci sono voluti vent'anni"}
  - tutor: "Bilbao, ottimo esempio. Ma «ci hanno voluto vent'anni»… volerci, nei tempi composti, con quale ausiliare va?"
    goals: [example]
    prompt: {text: "Ci hanno voluto vent'anni", tags: [auxiliary-choice]}
  - learner: "Con essere: ci sono voluti vent'anni. Comunque, per concludere: la tecnologia non è il nemico, l'immobilismo sì. Tu, sinceramente, ti senti a rischio nel tuo lavoro?"
  - tutor: "Sinceramente? Faccio il traduttore, quindi un po' sì. Ma mi hai convinto almeno su una cosa: meglio aggiornarsi che lamentarsi. Brindiamo a Bilbao!"
    goals: [conclude]

- scenario: politica-lavoro
  level: C2
  persona: en-f-student
  history: [word-choice]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che è una profezia un po' catastrofica. È vero che l'automazione toccherà molti settori, ma si è detto lo stesso dei computer negli anni Ottanta, e i posti di lavoro sono aumentati."
  - tutor: "Negli anni Ottanta i computer non scrivevano articoli né progettavano case. Questa volta è diverso, credimi."
    goals: [opinion]
  - learner: "Forse. Ma pensa a cosa succederebbe se domani tutte le cassiere venissero sostituite da casse automatiche: i supermercati dovrebbero comunque assumere persone per i controlli e l'assistenza, che però dovrebbero prendere dei corsi di formazione."
    errors: [word-choice]
  - tutor: "Seguire dei corsi, sì, ma chi li paga? E una cassiera di cinquantacinque anni, secondo te, ha voglia di rimettersi a studiare?"
    goals: [hypothesis]
    recast: {text: "prendere dei corsi", fix: "seguire dei corsi", tags: [word-choice]}
  - learner: "Non tutte, è chiaro. Mia madre ha fatto l'impiegata alle poste per trent'anni: quando hanno introdotto il nuovo sistema informatico, si è sentita persa per mesi. Ma i colleghi più giovani gli hanno dato una mano e alla fine si è adattata."
    errors: [object-pronoun]
    gold: {text: "gli hanno dato una mano", fix: "le hanno dato una mano"}
  - tutor: "Bella storia. Ma «i colleghi più giovani gli hanno dato una mano»… a chi, esattamente? A tua madre?"
    goals: [example]
    prompt: {text: "gli hanno dato una mano", tags: [object-pronoun]}
  - learner: "Sì, a lei: le hanno dato una mano. Gli e le, li confondo sempre quando parlo veloce."
  - tutor: "Capita anche agli italiani, sai? Comunque l'esempio di tua madre mi ha un po' ammorbidito. Allora, come la chiudiamo questa discussione?"
  - learner: "Direi così: non sappiamo quanti lavori spariranno, ma sappiamo che chi ha accesso alla formazione se la caverà meglio che chi non ce l'ha. E tu, sei ancora così pessimista?"
    errors: [comparative]
    gold: {text: "meglio che chi non ce l'ha", fix: "meglio di chi non ce l'ha"}
  - tutor: "Quasi convinto. Ma «meglio che chi non ce l'ha»: davanti a chi, in un paragone come questo, quale parolina va dopo meglio?"
    prompt: {text: "meglio che chi non ce l'ha", tags: [comparative]}
  - learner: "Ah, di: chi ha accesso alla formazione se la caverà meglio di chi non ce l'ha. Allora, sei ancora pessimista?"
  - tutor: "Un po' meno di prima, lo ammetto: sono passato da catastrofista a preoccupato. Un bel progresso, per una cena sola."
    goals: [conclude]

- scenario: turismo-di-massa
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno, grazie di avermi presa in linea. Abito a Venezia da dodici anni e sono contraria al ticket: secondo me tratta la città come un parco a tema, e non risolve niente."
  - tutor: "Contraria, dunque. Eppure i dati del Comune dicono che nei giorni con il ticket gli arrivi sono calati. Ci porti un esempio concreto di ciò che vede."
    goals: [introduce]
  - learner: "Volentieri. Abito vicino a Rialto: la mattina, per andare al lavoro, devo farmi largo tra gruppi di quaranta persone con la guida e l'ombrellino. E con il ticket? Uguale. È un casino totale, mi creda."
    errors: [register]
    gold: {text: "È un casino totale", fix: "È una situazione caotica"}
  - tutor: "Un quadro molto vivido. Però «è un casino totale», in diretta su una radio regionale, rischia di farci arrivare qualche lettera: come lo direbbe in modo più adatto?"
    prompt: {text: "È un casino totale", tags: [register]}
  - learner: "Ha ragione, chiedo scusa agli ascoltatori: la situazione è caotica, e il ticket non l'ha cambiata di una virgola."
  - tutor: "Ma non le sembra che, senza il ticket, sarebbe ancora peggio? Almeno così chi viene per poche ore contribuisce alle spese della città."
    goals: [example]
  - learner: "Il problema è che cinque euro non scoraggiano nessuno: chi arriva con una crociera da tremila euro non rinuncia a Venezia per il prezzo di un caffè. Non basta che i turisti paghino; bisogna che siano di meno."
  - tutor: "Un'obiezione solida. E allora che cosa propone, concretamente, ai nostri amministratori?"
    goals: [rebut]
  - learner: "Propongo un numero chiuso nei giorni di punta, con prenotazione online, e che gli affitti brevi nel centro storico vengono limitati per legge, così che i residenti possano tornare."
    errors: [subjunctive-use]
    gold: {text: "che gli affitti brevi nel centro storico vengono limitati", fix: "che gli affitti brevi nel centro storico vengano limitati"}
  - tutor: "Due proposte precise. Ma rilegga la seconda: «propongo che gli affitti brevi vengono limitati». Dopo un verbo come proporre, il verbo introdotto da che può restare all'indicativo?"
    prompt: {text: "che gli affitti brevi nel centro storico vengono limitati", tags: [subjunctive-use]}
  - learner: "Sì, scusi, intendevo dire: propongo che gli affitti brevi vengono ridotti drasticamente."
    errors: [subjunctive-use]
  - tutor: "Che gli affitti brevi vengano ridotti drasticamente e che nei giorni di punta ci sia il numero chiuso: proposte chiare. Vuole aggiungere qualcosa per i nostri ascoltatori?"
    goals: [proposal]
    recast: {text: "che gli affitti brevi vengono ridotti", fix: "che gli affitti brevi vengano ridotti", tags: [subjunctive-use]}
  - learner: "Solo una cosa: Venezia non è un museo, è una città. Venite, ma rispettatela come se fosse casa vostra."
  - tutor: "Un appello che sottoscrivo. Grazie della telefonata, e buona giornata a Rialto! Dopo la pubblicità, sentiremo l'assessore al turismo."

- scenario: turismo-di-massa
  level: C2
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno. Sono a favore, con qualche riserva. Insegno spagnolo a Venezia da otto anni e vivo a Cannaregio, uno degli ultimi sestieri dove si sente ancora parlare veneziano."
  - tutor: "A favore con riserva: ci spieghi. Perché molti suoi concittadini lo considerano un balzello inutile."
    goals: [introduce]
  - learner: "Perché il ticket, da solo, è simbolico. Però ha un merito: per la prima volta i flussi sono stati misurati giorno per giorno. L'anno scorso, nel mio sestiere, la scuola elementare è stato chiusa per mancanza di bambini: senza dati, nessuno se ne sarebbe accorto."
    errors: [passive]
    gold: {text: "la scuola elementare è stato chiusa", fix: "la scuola elementare è stata chiusa"}
  - tutor: "Un dato che fa male. Ma «la scuola elementare è stato chiusa»… quel participio, qui, con chi deve accordarsi?"
    prompt: {text: "la scuola elementare è stato chiusa", tags: [passive]}
  - learner: "Con la scuola: è stata chiusa. Ed è questo il punto: ogni famiglia che se ne va è una classe in meno."
  - tutor: "Capisco. Ma il ticket, mi scusi, non riporta indietro le famiglie: le famiglie tornano se le case costano meno. Non sta mescolando due problemi?"
    goals: [example]
  - learner: "Non voglio mescolarli, voglio relazionarli. I soldi del ticket potrebbero essere destinati agli affitti calmierati per i residenti: è quello che mi aspetto dall'amministrazione."
    errors: [word-choice]
  - tutor: "Collegarli, d'accordo: il ticket per finanziare la casa è un'idea che sentiremo spesso, immagino. Concretamente, che proposta farebbe al sindaco?"
    goals: [rebut]
    recast: {text: "relazionarli", fix: "collegarli", tags: [word-choice]}

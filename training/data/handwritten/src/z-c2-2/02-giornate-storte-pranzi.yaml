# C2: idiomi, ci e ne, pronomi combinati tra amici: giornate storte e pranzi della domenica.
- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, una giornata da dimenticare. Stamattina la sveglia non è suonata, ho mancato il treno delle otto e sono arrivata in ufficio con un'ora di ritardo, proprio il giorno della presentazione al cliente."
    errors: [word-choice]
  - tutor: "Treno perso e presentazione al cliente: cominciamo bene! E scommetto che non è finita lì, perché la sfortuna non viene mai da sola. Il cliente come l'ha presa?"
    recast: {text: "mancato", fix: "perso", tags: [word-choice]}
  - learner: "Male, ovviamente. Ma il peggio è venuto dopo: ho collegato il portatile al proiettore e sullo schermo è comparsa la foto delle mie vacanze in costume. Volevo sprofondare, non sapevo proprio come cavarla."
    errors: [ci-ne]
    gold: {text: "come cavarla", fix: "come cavarmela"}
  - tutor: "Che figuraccia, poverina! Ma ripeti un po' la fine: «non sapevo come cavarla»… quel verbo, in questo senso, ti sembra completo così?"
    prompt: {text: "come cavarla", tags: [ci-ne]}
  - learner: "No, gli mancano dei pezzi: non sapevo come cavarmela! E per finire, all'uscita pioveva a secchi e non avevo l'ombrello."
    errors: [word-choice]
  - tutor: "Pioveva a catinelle e tu senza ombrello: piove sempre sul bagnato, come si dice. Ma di chi è la colpa, secondo te? Della sveglia?"
    goals: [tell]
    recast: {text: "a secchi", fix: "a catinelle", tags: [word-choice]}
  - learner: "«Piove sul bagnato»: mi piace, ha un che di rassegnato. La colpa è un po' mia e un po' del mio coinquilino, che ieri sera ha staccato la presa della sveglia per caricare il telefono. Lui dice che non entra niente, ma io qualche dubbio ce l'ho."
    errors: [ci-ne]
    gold: {text: "non entra niente", fix: "non c'entra niente"}
  - tutor: "Il coinquilino, sempre lui! Ma aspetta: «non entra niente»… entra dove, scusa? In camera tua?"
    goals: [react]
    prompt: {text: "non entra niente", tags: [ci-ne]}
  - learner: "Ah ah, no: intendevo che lui non c'entra niente, che non è colpa sua. Secondo me, invece, un po' sì."
  - tutor: "Ecco, ora sì. Diciamo che la colpa è a metà: lui ha staccato la presa, ma tu potevi mettere due sveglie. E la morale della giornata qual è?"
    goals: [blame]
  - learner: "Da domani metto tre sveglie e controllo il desktop prima di ogni riunione. E poi, come dite voi, tutto è bene quel che finisce bene: alla fine il cliente ha firmato!"
  - tutor: "Ha firmato? Allora altro che giornata storta: hai fatto centro! Questo merita un altro spritz, e offro io."
    goals: [moral]

- scenario: modi-di-dire
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Uff, una giornata tremenda. Stamattina dovevo spedire un pacco a mia sorella a Valencia: ho provveduto a recarmi presso l'ufficio postale alle otto e mezza, ma c'era già una coda chilometrica."
    errors: [register]
    gold: {text: "ho provveduto a recarmi presso l'ufficio postale", fix: "sono andato all'ufficio postale"}
  - tutor: "Ahia, le code del mattino! Ma scusa, «ho provveduto a recarmi presso»… mi stai raccontando una giornata o leggendo un verbale dei carabinieri?"
    prompt: {text: "ho provveduto a recarmi presso l'ufficio postale", tags: [register]}
  - learner: "Hai ragione, sembravo un carabiniere! Sono andato alla posta e, dopo un'ora di coda, l'impiegata mi ha detto che il pacco era troppo grande e che dovevo rifarlo."
  - tutor: "Classico! E scommetto che non avevi neanche lo scotch dietro. Quando la sfortuna ci si mette, un guaio tira l'altro."
  - learner: "Esatto, un guaio tira l'altro. Sono uscito a comprare una scatola nuova e, mentre attraversavo, una macchina mi ha schizzato tutto il fango di una pozzanghera. Avevo i pantaloni nuovi, mi erano costati un occhio della faccia."
    errors: [word-choice]
  - tutor: "Pantaloni pagati un occhio della testa, e pure infangati: sei proprio caduto dalla padella nella brace! E alla fine il pacco l'hai spedito?"
    goals: [react]
    recast: {text: "un occhio della faccia", fix: "un occhio della testa", tags: [word-choice]}
  - learner: "Sì, alla fine l'ho spedito. La colpa della scatola, a pensarci bene, è soprattutto mia: mia sorella mi aveva detto di usarne una più grande. Per il fango, invece, ce l'ho a morte con quell'automobilista."
  - tutor: "Giusto: la scatola sulla tua coscienza, il fango sulla sua. E che lezione ne tiri fuori, da questa giornata?"
    goals: [tell, blame]
  - learner: "La lezione è che bisogna ascoltare le sorelle maggiori, perché sanno sempre una più del diavolo. E che i pantaloni nuovi non si mettono il giorno in cui si va alla posta."
    errors: [ci-ne]
    gold: {text: "sanno sempre una più del diavolo", fix: "ne sanno sempre una più del diavolo"}
  - tutor: "Bella morale! Ma in quell'espressione, «sanno sempre una più del diavolo», manca un pezzettino: una particella piccola piccola. Te la ricordi?"
    prompt: {text: "sanno sempre una più del diavolo", tags: [ci-ne]}
  - learner: "Ah, certo: ne sanno sempre una più del diavolo!"
  - tutor: "Perfetto, e l'hai usata nel posto giusto. Brindiamo alle sorelle maggiori e ai pantaloni vecchi!"
    goals: [moral]

- scenario: modi-di-dire
  level: C2
  persona: en-m-traveller
  history: [false-friend]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Non ci crederai. Stamattina avevo il Frecciarossa per Napoli alle sette e dieci: sono arrivato in stazione con venti minuti di anticipo, tutto fiero, e ho scoperto che il treno era stato cancellato per uno sciopero."
  - tutor: "Lo sciopero del venerdì, un grande classico! Altro che chi ben comincia: tu sei partito con il piede sbagliato. E poi?"
  - learner: "Poi ho preso un regionale, pieno zeppo. Il controllore mi ha detto che il biglietto non era valido e ho avuto un argomento con lui di almeno dieci minuti, davanti a tutto il vagone."
    errors: [false-friend]
  - tutor: "Una discussione di dieci minuti davanti a tutti: che scena! E alla fine chi l'ha spuntata?"
    recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
  - learner: "L'ha spuntata lui, ovviamente. Ne ho messo mezz'ora a capire che gli avevo mostrato il biglietto vecchio, quello del treno cancellato."
    errors: [ci-ne]
    gold: {text: "Ne ho messo mezz'ora", fix: "Ci ho messo mezz'ora"}
  - tutor: "Aspetta, aspetta: «ne ho messo mezz'ora»? Quando parli del tempo che impieghi, quale particella vuole il verbo mettere?"
    goals: [react]
    prompt: {text: "Ne ho messo mezz'ora", tags: [ci-ne]}
  - learner: "Ci ho messo mezz'ora, giusto, come «ci vuole». Insomma, alla fine ho pagato cinquanta euro di multa."
  - tutor: "Ahi, cinquanta euro! Ma di chi è la colpa, secondo te? Dello sciopero, del controllore o tua?"
    goals: [tell]
  - learner: "Un po' di tutti, direi. Credo che il controllore poteva essere più gentile, ma la distrazione è stata mia: chi è causa del suo mal pianga se stesso."
    errors: [subjunctive-use]
    gold: {text: "Credo che il controllore poteva", fix: "Credo che il controllore potesse"}
  - tutor: "Ben detto, il proverbio è perfetto. Ma «credo che il controllore poteva»… dopo credo che, quel verbo ti convince?"
    prompt: {text: "Credo che il controllore poteva", tags: [subjunctive-use]}
  - learner: "Hai ragione: credo che il controllore potesse essere più gentile. Anzi, che avrebbe potuto esserlo."
  - tutor: "Tutte e due le versioni, bravo. Allora: colpa tua al settanta per cento, del controllore al trenta. E la morale?"
    goals: [blame]
  - learner: "La morale è: butta sempre i biglietti vecchi. E il venerdì, in Italia, controlla gli scioperi prima di andare a dormire."
  - tutor: "Parole sante! E consolati: la storia è così bella che stasera la racconti anche agli altri, e magari qualcuno ti offre da bere."
    goals: [moral]

- scenario: modi-di-dire
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Che faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Ho perso le chiavi di casa. Cioè, non le ho perse: le ho lasciate dentro, con la porta chiusa, e la mia coinquilina era a Bologna fino a sera."
  - tutor: "Il grande classico! E il fabbro, immagino, ti ha chiesto un occhio della testa."
  - learner: "Prima ho provato senza fabbro. Ho suonato alla vicina del terzo piano, che ha una copia delle chiavi, ma non c'era. Allora ho aspettato tre ore in un bar, e quando è tornata gli l'ho chiesta subito."
    errors: [combined-pronouns]
    gold: {text: "gli l'ho chiesta", fix: "gliel'ho chiesta"}
  - tutor: "Tre ore al bar: almeno il cappuccino era buono? Ma aspetta: «gli l'ho chiesta»… due pronomi così vicini, in italiano, restano separati?"
    prompt: {text: "gli l'ho chiesta", tags: [combined-pronouns]}
  - learner: "No, si attaccano: gliel'ho chiesta subito. E lei, gentilissima, me l'ha data. Ma la chiave non girava: era quella della cantina!"
  - tutor: "No! Sei proprio caduta dalla padella nella brace. E com'è finita?"
  - learner: "Dalla padella nella brace, esatto. Alla fine ho chiamato il fabbro: centoventi euro per cinque minuti di lavoro, e pure in effettivo, perché non accettava la carta."
    errors: [false-friend]
  - tutor: "Centoventi euro in contanti per cinque minuti: altro che fabbro, un chirurgo! Ma di chi è la colpa, secondo te? Della vicina?"
    goals: [tell, react]
    recast: {text: "in effettivo", fix: "in contanti", tags: [false-friend]}
  - learner: "In contanti, sì. La colpa? Non me la posso prendere con la vicina, mi ha fatto un favore. Diciamo che la vera colpevole sono io, che esco sempre di corsa."
  - tutor: "Onesta fino in fondo! E dimmi: che cosa hai imparato, oltre a non fidarti dei fabbri?"
    goals: [blame]
  - learner: "Che bisogna lasciare una copia delle chiavi a qualcuno di cui ci si fida, e controllare che sia quella giusta. Come si dice da voi: fidarsi è bene, non fidarsi è meglio!"
  - tutor: "Brava, proverbio perfetto per l'occasione! E la prossima copia lasciala a me: prometto di non confonderla con quella della cantina."
    goals: [moral]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Scannarsi per una lasagna mi sembra più che legittimo, con questo profumo. Mia nonna, in Ohio, la faceva ogni domenica, ma diceva sempre che quella di Bologna era un'altra cosa."
  - tutor: "Tua nonna era una donna saggia. Lo zio Gino, invece, ieri ha preso una cantonata colossale: ha portato il vino buono ai vicini sbagliati. Ma prima mangia: te ne servo un pezzo?"
    goals: [react]
  - learner: "La ringrazio, gradirei un pezzo di modeste dimensioni, poiché ho intenzione di lasciare spazio anche alle portate successive."
    errors: [register]
    gold: {text: "La ringrazio, gradirei un pezzo di modeste dimensioni", fix: "Grazie, me ne dai un pezzetto"}
  - tutor: "«La ringrazio, gradirei»? Ma dove sei, al ricevimento dell'ambasciata? Qui siamo tra amici: come lo diresti a tavola, con la bocca già piena?"
    prompt: {text: "La ringrazio, gradirei un pezzo di modeste dimensioni", tags: [register]}
  - learner: "Hai ragione, scusa: mi dai un pezzetto piccolo? Voglio arrivare vivo al bollito. E «cantonata» mi piace molto: è un'espressione più colorita che la nostra versione."
    errors: [comparative]
    gold: {text: "più colorita che la nostra versione", fix: "più colorita della nostra versione"}
  - tutor: "Ecco, così va meglio! Ma sulle cantonate ti fermo: «più colorita che la nostra versione»… quando confronti due cose così, dopo più ci va proprio che?"
    prompt: {text: "più colorita che la nostra versione", tags: [comparative]}
  - learner: "No, ci va di: volevo dire che la vostra «cantonata» è più colorita della nostra versione, che è «to drop the ball», far cadere la palla. È molto più sportiva."
  - tutor: "Far cadere la palla, che immagine pulita! La cantonata, invece, è proprio sbattere contro lo spigolo di un palazzo. E tu, una storia con un proverbio finale ce l'hai? Qui chi non racconta non mangia il dolce."
    goals: [compare]
  - learner: "Ce l'ho. L'anno scorso, a Boston, ho invitato a cena una ragazza e ho voluto fare le tagliatelle a mano per fare colpo. Ho impastato per due ore, ma la sfoglia si rompeva sempre: alla fine non ce l'ho fatto e ho ordinato una pizza."
    errors: [participle-agreement]
    gold: {text: "non ce l'ho fatto", fix: "non ce l'ho fatta"}
  - tutor: "Povero! Ma fermati un attimo su «non ce l'ho fatto»: in farcela, quella l' sta per qualcosa di femminile. Che cosa cambia, allora?"
    prompt: {text: "non ce l'ho fatto", tags: [participle-agreement]}
  - learner: "Ah, giusto: non ce l'ho fatta. Comunque la ragazza ha riso tantissimo, e adesso è la mia fidanzata. Come si dice: non tutte le ciambelle riescono col buco, ma a volte va bene lo stesso!"
  - tutor: "Ma che storia! Le tagliatelle ti hanno tradito, la fortuna no. Brindiamo alla ciambella senza buco e alla tua fidanzata: il dolce te lo sei proprio guadagnato."
    goals: [use-idiom, anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: es-f-teacher
  history: [combined-pronouns]
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Scannando? Spero in senso figurato, perché vedo coltelli dappertutto! Immagino che voglia dire che stanno litigando sul serio, ma con affetto."
  - tutor: "Esatto, in senso figurato: litigano come se fosse una questione di vita o di morte. Da noi, a tavola, ci si scanna solo per le cose importanti: lasagne e calcio."
    goals: [react]
  - learner: "Allora sono nel posto giusto. La lasagna l'ha fatta tua madre? Se ne avanza un pezzo, mi lo porto a casa per domani."
    errors: [combined-pronouns]
    gold: {text: "mi lo porto", fix: "me lo porto"}
  - tutor: "L'ha fatta lei, sì, e gli avanzi sono sacri. Ma ripeti piano quel «mi lo porto», e ascolta bene come suona quel primo pronome."
    prompt: {text: "mi lo porto", tags: [combined-pronouns]}
  - learner: "Me lo porto, scusa! La regola la so benissimo, ma quando parlo veloce mi scappa lo spagnolo."
  - tutor: "Perfetto, e te lo incarto io con la stagnola. Senti, ma da voi c'è un modo di dire simile a «scannarsi»?"
  - learner: "Abbiamo «estar a matar», più o meno essere ai ferri corti. Ma la vostra immagine è molto più cruenta che la nostra: voi italiani non vi accontentate di litigare, dovete scannarvi!"
    errors: [comparative]
    gold: {text: "molto più cruenta che la nostra", fix: "molto più cruenta della nostra"}
  - tutor: "Colpa del sangue caldo! Però quel «molto più cruenta che la nostra»… davanti a un possessivo come la nostra, che cosa metti dopo più?"
    goals: [compare]
    prompt: {text: "molto più cruenta che la nostra", tags: [comparative]}
  - learner: "Il di, certo: molto più cruenta della nostra."
  - tutor: "Brava. E adesso tocca a te: raccontaci una storia che finisca con un bel proverbio, che lo zio Franco è già pronto a giudicare."
  - learner: "Va bene. Il primo giorno a Bologna sono andata al mercato e ho chiesto un chilo di mortadella, pensando che fosse poca. Il salumiere mi ha guardata come una pazza e io sono uscita con un pacco enorme: ci ho messo un mese a finirlo. Sbagliando s'impara!"
  - tutor: "Un chilo di mortadella: sei bolognese d'onore! E «sbagliando s'impara» ci sta a pennello. Lo zio Franco approva, guarda come ride."
    goals: [use-idiom, anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Scannando! Che immagine. Dalla faccia di tuo cugino direi che sta perdendo la battaglia."
  - tutor: "La perde sempre, poverino: mia zia lo chiama «il secondo arrivato». Vuoi un pezzo di lasagna prima che sparisca anche quella?"
    goals: [react]
  - learner: "Sì, grazie, ma un pezzo piccolo: mi hanno detto che dopo c'è il bollito, e vorrei arrivare eventualmente anche al dolce."
    errors: [false-friend]
  - tutor: "Al dolce ci arriverai alla fine, promesso, ma solo se sopravvivi al bollito: qui il pranzo è una maratona, non uno sprint. In Inghilterra avete un detto per chi esagera a tavola?"
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
  - learner: "Diciamo «your eyes are bigger than your stomach»: gli occhi sono più grandi della pancia. E voi?"
  - tutor: "Noi diciamo quasi lo stesso: «avere gli occhi più grandi dello stomaco»! Le pance, evidentemente, sono uguali dappertutto."
    goals: [compare]
  - learner: "Allora vi racconto una storia. A Natale ho voluto fare il tiramisù per la famiglia del mio ragazzo, ma ho messo il sale invece dello zucchero. Mi ne sono accorta solo quando sua nonna ha fatto una faccia indimenticabile."
    errors: [combined-pronouns]
    gold: {text: "Mi ne sono accorta", fix: "Me ne sono accorta"}
  - tutor: "Oddio, il sale! Aspetta però, ripeti: «mi ne sono accorta»? Ascolta quel mi accanto al ne."
    prompt: {text: "Mi ne sono accorta", tags: [combined-pronouns]}
  - learner: "Me ne sono accorta, scusa, la vocale cambia. Insomma, la nonna l'ha mangiato tutto lo stesso, per gentilezza, e poi mi ha detto: «L'importante è il pensiero». Io direi: non tutte le ciambelle riescono col buco!"
  - tutor: "Proverbio a pennello! E la nonna è una santa: io avrei sputato tutto nel tovagliolo. Adesso però il tiramisù lo assaggi qui, che è con lo zucchero."
    goals: [use-idiom, anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [combined-pronouns]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Allora mi siedo subito: chi esita è perduto. Ma scannarsi vuol dire proprio uccidersi a vicenda?"
  - tutor: "Letteralmente sì, tagliarsi la gola come si fa con gli agnelli; in senso figurato, litigare ferocemente. Qui è sempre in senso figurato... quasi sempre."
    goals: [react]
  - learner: "Meno male. Questa lasagna è straordinaria: desidererei porgere i miei più sinceri complimenti alla cuoca."
    errors: [register]
    gold: {text: "desidererei porgere i miei più sinceri complimenti alla cuoca", fix: "voglio fare i complimenti alla cuoca"}
  - tutor: "«Desidererei porgere i miei più sinceri complimenti»? Sembri un ambasciatore in visita ufficiale! Come lo diresti qui, tra amici, con il sugo sul mento?"
    prompt: {text: "desidererei porgere i miei più sinceri complimenti alla cuoca", tags: [register]}
  - learner: "Hai ragione: voglio fare i complimenti alla cuoca! Chi è?"
  - tutor: "Mia nonna Ada, e i complimenti li accetta solo sotto forma di bis. In inglese come diresti di una che cucina così?"
  - learner: "Diremmo che «she's a dab hand», cioè che è bravissima con le mani. Mi sembra simile al vostro «avere la mano buona», o sbaglio?"
  - tutor: "Non sbagli affatto: «avere la mano buona» si dice proprio di chi cucina bene, ma anche delle infermiere che non fanno sentire l'ago! Tu, invece, a tavola hai mai fatto una brutta figura?"
    goals: [compare]
  - learner: "Una volta, a Napoli, ho chiesto un cappuccino dopo la pizza, e il cameriere mi ha guardato come se avessi bestemmiato. Non mi l'ha portato per dieci minuti, per punizione credo."
    errors: [combined-pronouns]
    gold: {text: "Non mi l'ha portato", fix: "Non me l'ha portato"}
  - tutor: "Il cappuccino dopo la pizza: sacrilegio! Ma «non mi l'ha portato»… quei due pronomi, uno accanto all'altro, li lasci davvero così?"
    prompt: {text: "Non mi l'ha portato", tags: [combined-pronouns]}
  - learner: "Ah no: non me l'ha portato. Poi è arrivato con un espresso e mi ha detto, serissimo: «Paese che vai, usanza che trovi»."
  - tutor: "Grande cameriere, e proverbio perfetto! Paese che vai, usanza che trovi: e qui l'usanza è il bis di lasagna, quindi non fare complimenti."
    goals: [use-idiom, anecdote]

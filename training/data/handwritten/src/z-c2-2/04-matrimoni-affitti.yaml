# C2: matrimoni e contratti d'affitto: condizioni, concordanza dei tempi, pronomi e registro formale.
- scenario: organizzare-matrimonio
  level: C2
  persona: en-f-professional
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo all'aperto, in campagna, con pochi invitati: una sessantina, non di più. Il mio fidanzato vorrebbe una cosa molto rustica, io qualcosa di più elegante, quindi spero che Lei ci aiuti a trovare un punto d'incontro."
  - tutor: "Rustico ed elegante: è la combinazione che preferisco, e una sessantina di invitati la rende possibile. Avete già un'idea del budget?"
    goals: [vision]
  - learner: "Pensavamo a venticinquemila euro, tutto compreso. Sono tanti, lo so, ma i miei genitori contribuiranno, e il fotografo ce lo regala mia zia, che fa questo mestiere da trent'anni."
  - tutor: "Venticinquemila per sessanta persone è un budget realistico, e un fotografo in famiglia è un bel risparmio. Ho selezionato due location per voi: vuole vederle?"
    goals: [budget]
  - learner: "Sì, volentieri. Anzi, se ha anche le foto degli allestimenti degli anni scorsi, mi le mandi via email, così le guardo con calma con il mio fidanzato."
    errors: [combined-pronouns]
    gold: {text: "mi le mandi", fix: "me le mandi"}
  - tutor: "Le foto le ho, e sono tante. Ma ripeta con me quel «mi le mandi»: davanti a le, il primo pronome resta proprio così?"
    prompt: {text: "mi le mandi", tags: [combined-pronouns]}
  - learner: "No, diventa me: me le mandi via email, grazie. Intanto mi racconti delle due location."
  - tutor: "La prima è un casale in Val d'Orcia, con la cena sotto un pergolato e una tensostruttura trasparente in caso di pioggia; la seconda è una villa sul lago, più formale, con un salone interno. Quale vi attira di più?"
  - learner: "Il casale è più nel nostro stile: scegliamo quello, sempre che la tensostruttura sia compresa nel preventivo. E un'altra condizione: vorrei che ogni fornitore ci viene presentato prima di firmare."
    errors: [subjunctive-use]
    gold: {text: "vorrei che ogni fornitore ci viene presentato", fix: "vorrei che ogni fornitore ci venisse presentato"}
  - tutor: "Il casale, ottima scelta. Quanto alla condizione, nessun problema; ma riascolti: «vorrei che ogni fornitore ci viene presentato». Dopo vorrei, quel verbo le suona davvero bene?"
    goals: [choices]
    prompt: {text: "vorrei che ogni fornitore ci viene presentato", tags: [subjunctive-use]}
  - learner: "Ha ragione, allora: vorrei che ogni fornitore ci sia presentato prima della firma."
    errors: [subjunctive-use]
  - tutor: "Che ogni fornitore vi fosse presentato prima della firma è già la mia regola: nessuno firma niente senza avervi conosciuti. E la tensostruttura, glielo confermo, è inclusa."
    goals: [conditions]
    recast: {text: "sia presentato", fix: "fosse presentato", tags: [subjunctive-use]}
  - learner: "Perfetto, allora aspettiamo il preventivo. Grazie, ci ha già tolto metà dei pensieri."
  - tutor: "È il mio mestiere, e il bello deve ancora venire. Le mando il preventivo entro venerdì, e la settimana prossima andiamo insieme a vedere il casale."

- scenario: organizzare-matrimonio
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille. La mia fidanzata è molto illusa: sogna questo giorno da quando era bambina. Io invece mi accontenterei di una festa in giardino, ma l'importante è che lei sia felice."
    errors: [false-friend]
  - tutor: "Una sposa entusiasta è la migliore delle clienti, mi creda! E una festa in giardino non è da escludere. Ma mi descriva come lo immagina lei, questo giorno."
    recast: {text: "illusa", fix: "entusiasta", tags: [false-friend]}
  - learner: "Entusiasta, ecco: «illusa» in italiano suona quasi come un'offesa! Lei lo immagina in una villa antica, con la cerimonia civile in giardino e la cena sotto le stelle. Gli invitati saranno circa centoventi."
  - tutor: "Villa antica, cerimonia all'aperto, centoventi persone: un quadro molto chiaro. Parliamo di budget: quanto avete pensato di investire?"
    goals: [vision]
  - learner: "Il budget è un po' giusto, glielo dico subito: trentamila euro al massimo, e non possiamo sforare, perché stiamo anche comprando casa."
    errors: [false-friend]
  - tutor: "Un budget un po' stretto per centoventi persone in villa, ma non impossibile: si tratta di fare scelte intelligenti, per esempio sul menù e sui fiori. Avete già visto qualche villa?"
    goals: [budget]
    recast: {text: "un po' giusto", fix: "un po' stretto", tags: [false-friend]}
  - learner: "Due: una a Fiesole, con vista su Firenze, e una nel Chianti, che costa molto più di quanto si dice in giro, ma ha un parco enorme."
    errors: [comparative]
    gold: {text: "più di quanto si dice in giro", fix: "più di quanto non si dica in giro"}
  - tutor: "Le conosco tutte e due. Ma quel «più di quanto si dice in giro»… in un paragone così, in un italiano curato, che modo verbale preferiremmo dopo di quanto?"
    prompt: {text: "più di quanto si dice in giro", tags: [comparative]}
  - learner: "Non saprei, mi sembra giusto così: costa molto più di quanto si dice in giro."
    errors: [comparative]
  - tutor: "Costa molto più di quanto non si dica in giro, è vero: nel Chianti i prezzi sono saliti parecchio. Con il vostro budget, Fiesole mi sembra la scelta più sensata: vista impagabile e costi contenuti."
    recast: {text: "più di quanto si dice in giro", fix: "più di quanto non si dica in giro", tags: [comparative]}
  - learner: "D'accordo, allora Fiesole. Però ho due condizioni: che il menù sia deciso da noi dopo una degustazione, e che il preventivo non cambi dopo la firma."
  - tutor: "Condizioni ragionevolissime: la degustazione è inclusa e il preventivo sarà bloccato per contratto. Le mando tutto per email entro venerdì, e fissiamo la degustazione per la settimana prossima."
    goals: [choices, conditions]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo semplice: per noi è importante semplicità, più del lusso. Una cerimonia breve in comune e poi un pranzo lungo, all'italiana, con le nostre famiglie."
    errors: [article-use]
    gold: {text: "per noi è importante semplicità", fix: "per noi è importante la semplicità"}
  - tutor: "Bellissimo. Mi ripete la frase centrale? «Per noi è importante semplicità»… davanti a un nome astratto come quello, in italiano, non manca qualcosa?"
    goals: [vision]
    prompt: {text: "per noi è importante semplicità", tags: [article-use]}
  - learner: "Sì, l'articolo: per noi è importante la semplicità. In inglese non lo mettiamo, e mi scappa sempre."
  - tutor: "Allora partiamo dalla semplicità. Quanti invitati e che budget avete in mente?"
  - learner: "Ottanta invitati, e il budget è sui diciottomila euro. Senti, ma secondo te ci stiamo dentro, o siamo dei sognatori?"
    errors: [register]
    gold: {text: "Senti, ma secondo te", fix: "Senta, ma secondo Lei"}
  - tutor: "Ci state dentro, con qualche accorgimento. Ma mi permetta: «senti, secondo te»… mi pare che fin qui ci fossimo dati del Lei."
    prompt: {text: "Senti, ma secondo te", tags: [register]}
  - learner: "Ha ragione, scusi. Senti, allora, quali sono questi accorgimenti?"
    errors: [register]
  - tutor: "Senta, gli accorgimenti sono semplici: pranzo invece di cena, menù di stagione e un sabato di maggio anziché di giugno. Così diciottomila bastano, e restano due posti tra cui scegliere: un agriturismo vicino a Lucca o una trattoria sul mare."
    goals: [budget]
    recast: {text: "Senti", fix: "Senta", tags: [register]}
  - learner: "Sceglierei l'agriturismo: i miei nonni erano fattori toscani, emigrati in America negli anni Cinquanta, e mi piacerebbe che la festa li ricordasse."
    errors: [false-friend]
  - tutor: "Nipote di contadini toscani: allora l'agriturismo è una scelta che ha anche un significato, e mi piace molto. Ha qualche condizione da pormi, prima di cominciare?"
    goals: [choices]
    recast: {text: "fattori", fix: "contadini", tags: [false-friend]}
  - learner: "Una sola, ma importante: niente orari rigidi. Se i parenti vogliono restare fino a sera, vorrei che l'agriturismo glielo permettesse senza costi extra."
  - tutor: "Condizione accolta: l'agriturismo concede la sala fino a mezzanotte, senza supplementi. Le preparo il preventivo e la bozza del programma entro la settimana prossima."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: C2
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Ci sposiamo a giugno in Puglia, perché la famiglia di Luca è di Lecce. Lo immaginiamo in una masseria, con rami d'ulivo sui tavoli e luci appese agli alberi. Ma siamo in ritardo: ci restano solo sette mesi."
  - tutor: "Sette mesi bastano, se ci muoviamo bene, anche se in Puglia le masserie di giugno vanno a ruba. Avete già un'idea del budget?"
    goals: [vision]
  - learner: "Sì, quarantamila euro. I genitori di Luca ci vogliono regalare il pranzo, ma non sappiamo se accettare: la cosa ci mette in un compromesso."
    errors: [false-friend]
  - tutor: "Capisco che un regalo così metta un po' in imbarazzo, ma in Puglia è una tradizione: rifiutarlo sarebbe peggio. Intanto ho selezionato due masserie per voi."
    goals: [budget]
    recast: {text: "in un compromesso", fix: "in imbarazzo", tags: [false-friend]}
  - learner: "Allora accettiamo, e troveremo un modo speciale per ringraziarli. Le due masserie come sono?"
  - tutor: "La prima, vicino a Ostuni, ha un uliveto secolare e una sala grande; la seconda, verso Otranto, è più piccola ma è a cinque minuti dal mare. Il prezzo è quasi identico."
  - learner: "Mi piace molto quella vicino al mare: Luca ci andava ogni estate da bambino. Ma la prima ha più spazio, e ce ne servono almeno centoquaranta posti."
    errors: [ci-ne]
    gold: {text: "ce ne servono almeno centoquaranta posti", fix: "ci servono almeno centoquaranta posti"}
  - tutor: "Ostuni ha più spazio, è vero. Ma rilegga la sua frase: «ce ne servono almeno centoquaranta posti». Se il nome posti c'è già, quella particella a che cosa serve?"
    prompt: {text: "ce ne servono almeno centoquaranta posti", tags: [ci-ne]}
  - learner: "A niente, giusto: ci servono almeno centoquaranta posti. Allora direi Ostuni, e il mare lo vediamo il giorno dopo."
  - tutor: "Scelta saggia: Ostuni, e il giorno dopo tutti al mare. Prima di firmare, vuole fissare qualche condizione?"
    goals: [choices]
  - learner: "Sì: che i fiori siano solo locali e di stagione, e che ci sia un piano B per la pioggia. E vorrei che la musica la scegliamo noi."
    errors: [subjunctive-use]
    gold: {text: "vorrei che la musica la scegliamo noi", fix: "vorrei che la musica la scegliessimo noi"}
  - tutor: "Fiori locali e piano B: annotato. Sull'ultima: «vorrei che la musica la scegliamo noi»… quel verbo, dopo vorrei che, la convince?"
    prompt: {text: "vorrei che la musica la scegliamo noi", tags: [subjunctive-use]}
  - learner: "Vorrei che la musica la scegliessimo noi: con il condizionale ci va l'imperfetto."
  - tutor: "Esatto, e la musica la sceglierete voi, ci mancherebbe. Le preparo il contratto con le tre condizioni nero su bianco, e la settimana prossima andiamo insieme a Ostuni."
    goals: [conditions]

- scenario: trattativa-affitto
  level: C2
  persona: en-m-traveller
  history: [word-choice]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, soprattutto la luce del soggiorno e la vista sui tetti. Ho però una preoccupazione: la caldaia mi è sembrata piuttosto antica, e non vorrei passare l'inverno al freddo."
    errors: [word-choice]
  - tutor: "Piuttosto vecchia, ha ragione: ha dodici anni, ma è stata revisionata a settembre, e se dovesse rompersi la sostituzione spetterebbe al proprietario. Il canone, come sa, è di mille e cento euro al mese."
    goals: [interest]
    recast: {text: "piuttosto antica", fix: "piuttosto vecchia", tags: [word-choice]}
  - learner: "Mille e cento mi sembra un po' alto per sessanta metri quadri. Se firmassi per quattro anni, il proprietario sarebbe disposto a scendere a mille?"
  - tutor: "Mille è difficile, glielo dico con franchezza. Posso proporgli mille e cinquanta, con la provvigione dell'agenzia ridotta della metà."
    goals: [negotiate]
  - learner: "Mille e cinquanta può andare. Ma il mio lavoro potrebbe portarmi all'estero: se dovessi partire prima dei quattro anni, posso rompere il contratto senza penali?"
    errors: [word-choice]
  - tutor: "Sì, può recedere dal contratto in qualsiasi momento per gravi motivi, come un trasferimento di lavoro, con sei mesi di preavviso. È tutto scritto nella clausola nove."
    recast: {text: "rompere il contratto", fix: "recedere dal contratto", tags: [word-choice]}
  - learner: "Sei mesi sono tanti. Nel mio settore le rilocazioni vengono comunicate con pochissimo anticipo: sarebbe possibile ridurli a tre?"
    errors: [word-choice]
  - tutor: "Capisco: nel suo settore i trasferimenti arrivano all'improvviso. Posso chiederlo, ma il proprietario guarderà tutto il pacchetto: canone ridotto, provvigione ridotta e preavviso ridotto. Un po' troppi sconti insieme, non trova?"
    recast: {text: "le rilocazioni", fix: "i trasferimenti", tags: [word-choice]}
  - learner: "Capisco. Allora facciamo così: accetto i mille e cento euro iniziali, a patto che il preavviso è ridotto a tre mesi. Per me la flessibilità conta più che cinquanta euro al mese."
    errors: [subjunctive-use, comparative]
    gold: {text: "a patto che il preavviso è ridotto", fix: "a patto che il preavviso sia ridotto"}
  - tutor: "Un ragionamento molto lucido. Solo: «a patto che il preavviso è ridotto»… dopo a patto che, l'indicativo regge?"
    prompt: {text: "a patto che il preavviso è ridotto", tags: [subjunctive-use]}
  - learner: "Sì, scusi: a patto che il preavviso viene ridotto a tre mesi."
    errors: [subjunctive-use]
  - tutor: "A patto che il preavviso venga ridotto a tre mesi, lei accetta il canone pieno: è una proposta che il proprietario apprezzerà. Lo chiamo subito, se vuole aspettare un momento."
    goals: [conditions]
    recast: {text: "a patto che il preavviso viene ridotto", fix: "a patto che il preavviso venga ridotto", tags: [subjunctive-use]}
  - learner: "Aspetto volentieri. Se dice di sì, possiamo firmare già questa settimana?"
  - tutor: "Ha accettato: mille e cento euro, preavviso di tre mesi e firma giovedì mattina in agenzia. Benvenuto nella sua nuova casa!"
    goals: [conclude]

- scenario: trattativa-affitto
  level: C2
  persona: es-f-teacher
  history: [comparative]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Moltissimo: è più luminoso di quanto sembrasse dalle foto, e la cucina è stata rinnovata da poco. Mi preoccupa solo il rumore, perché la camera da letto dà sulla strada."
  - tutor: "La strada è trafficata di giorno, ha ragione, ma gli infissi sono nuovi, con doppi vetri. Il canone richiesto è di novecento euro, più cinquanta di spese condominiali."
    goals: [interest]
  - learner: "Novecento è più che quello che posso permettermi: speravo in qualcosa intorno agli ottocento."
    errors: [comparative]
    gold: {text: "è più che quello che posso permettermi", fix: "è più di quello che posso permettermi"}
  - tutor: "Capisco. Ma «è più che quello che posso permettermi»… davanti a quello che, il paragone vuole proprio che?"
    prompt: {text: "è più che quello che posso permettermi", tags: [comparative]}
  - learner: "No, vuole di: è più di quello che posso permettermi. Il proprietario accetterebbe ottocentotrenta, se pagassi tre mesi anticipati?"
  - tutor: "Tre mesi anticipati sono un buon argomento. Credo che a ottocentocinquanta si possa chiudere, con la cedolare secca, che le garantisce il canone bloccato per tutta la durata."
    goals: [negotiate]
  - learner: "Ottocentocinquanta mi sta bene. Quanto alla durata, preferirei un tre più due a canone concordato: il proprietario paga meno tasse, e io ho più flessibilità che con il quattro più quattro."
  - tutor: "Vedo che si è informata bene: il tre più due conviene a entrambi, e la disdetta richiede tre mesi di preavviso. Resta la garanzia: il proprietario chiede una fideiussione bancaria."
  - learner: "Ecco, quello è un problema: la mia banca è in Spagna e i tramiti sono lunghissimi. Un deposito cauzionale di tre mesi potrebbe bastare?"
    errors: [false-friend]
  - tutor: "Capisco: con le pratiche bancarie dall'estero i tempi si allungano. Un deposito di tre mesi, versato su un conto dedicato, è un'alternativa che di solito i proprietari accettano."
    goals: [conditions]
    recast: {text: "i tramiti", fix: "le pratiche", tags: [false-friend]}
  - learner: "Le pratiche, giusto: «tramiti» è spagnolo puro. Allora, se il proprietario sarà d'accordo, firmerei anche domani."
    errors: [hypothetical]
    gold: {text: "se il proprietario sarà d'accordo, firmerei", fix: "se il proprietario fosse d'accordo, firmerei"}
  - tutor: "Benissimo. Ma attenzione all'ipotesi: «se il proprietario sarà d'accordo, firmerei»… futuro e condizionale stanno bene insieme, nella stessa frase?"
    prompt: {text: "se il proprietario sarà d'accordo, firmerei", tags: [hypothetical]}
  - learner: "No, non stanno bene: se il proprietario fosse d'accordo, firmerei anche domani. Oppure, più semplicemente: se sarà d'accordo, firmerò."
  - tutor: "Due versioni impeccabili. Lo chiamo oggi stesso: ottocentocinquanta euro, tre più due a canone concordato e deposito di tre mesi. Credo proprio che avremo un accordo entro sera."
    goals: [conclude]

- scenario: trattativa-affitto
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Allora, le è piaciuta la stanza?"
  - learner: "Sì, molto. È vicina all'università e la camera è larga. Però l'arredamento è un po' vecchio e il materasso è, come dire, poco accogliente."
    errors: [false-friend]
  - tutor: "La camera è grande, sì, ed è la più luminosa della casa. Il materasso si può cambiare, ne parlo io con la proprietaria. Il canone è di seicentocinquanta euro al mese, spese escluse."
    goals: [interest]
    recast: {text: "la camera è larga", fix: "la camera è grande", tags: [false-friend]}
  - learner: "Seicentocinquanta più le spese è tanto per me: sono una studentessa e i miei genitori mi supportano solo in parte. Potrei arrivare a seicento, spese incluse."
    errors: [false-friend]
  - tutor: "Capisco: se i suoi genitori la sostengono solo in parte, ogni euro conta. Seicento spese incluse è poco, ma posso proporre seicentoventi, con il materasso nuovo."
    recast: {text: "supportano", fix: "sostengono", tags: [false-friend]}
  - learner: "Seicentoventi, con il materasso nuovo e le spese incluse, mi va bene. Ma il contratto quanto dura? Resto a Padova solo per il master, cioè diciotto mesi."
  - tutor: "Per gli studenti c'è il contratto transitorio, da sei a diciotto mesi: perfetto per lei. Serve però un certificato d'iscrizione all'università."
    goals: [negotiate]
  - learner: "Nessun problema, ce l'ho nella mail: lo posso mandarle stasera."
    errors: [combined-pronouns]
    gold: {text: "lo posso mandarle", fix: "posso mandarglielo"}
  - tutor: "Benissimo. Solo: «lo posso mandarle»… quando quei due pronomi si incontrano, in italiano, come si comportano?"
    prompt: {text: "lo posso mandarle", tags: [combined-pronouns]}
  - learner: "Ah, sì, si mettono insieme: le lo posso mandare stasera."
    errors: [combined-pronouns]
  - tutor: "Perfetto: appena arriva, glielo inoltro io alla proprietaria. C'è qualcos'altro che vuole mettere per iscritto nel contratto?"
    recast: {text: "le lo", fix: "glielo", tags: [combined-pronouns]}
  - learner: "Sì: se trovassi lavoro prima della fine del master, vorrei poter lasciare la stanza con un mese di preavviso."
  - tutor: "Un mese è possibile, nel transitorio: lo faccio scrivere. Allora siamo d'accordo: seicentoventi euro, spese e materasso inclusi, diciotto mesi con un mese di preavviso. Ci vediamo giovedì per la firma."
    goals: [conditions, conclude]

- scenario: trattativa-affitto
  level: C2
  persona: es-m-worker
  history: [register]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, mi è piaciuto, ma ti dico la verità: per quello che chiedi, mi aspettavo qualcosa di meglio. Il bagno è vecchio e la cucina non ha la lavastoviglie."
    errors: [register]
    gold: {text: "ti dico la verità", fix: "Le dico la verità"}
  - tutor: "Apprezzo la franchezza. Però mi ha appena dato del tu: «ti dico la verità»… è voluto, o le è scappato?"
    prompt: {text: "ti dico la verità", tags: [register]}
  - learner: "Mi è scappato, mi scusi: Le dico la verità, per quello che chiede mi aspettavo di più. Però la zona mi piace, e sono interessato."
  - tutor: "Nessun problema. Sul bagno ha ragione, ma il canone tiene conto anche del box auto incluso: novecentocinquanta euro, trattabili entro certi limiti."
    goals: [interest]
  - learner: "Se il bagno venisse rifatto prima della consegna, potrei accettare novecentocinquanta. Altrimenti, al massimo novecento, e il bagno lo rifaccio io, scalando la spesa dall'affitto."
  - tutor: "Proposta interessante: lei fa i lavori e li scala dal canone. Dovrei però presentarla al proprietario con un preventivo scritto."
    goals: [negotiate]
  - learner: "Il preventivo ce l'ho già: lavoro in un'impresa edile, e il mio capo me l'ha fatto ieri. Sono quattromila euro, sanitari compresi: se il proprietario accetta, gli li scalo in dieci mesi."
    errors: [combined-pronouns]
    gold: {text: "gli li scalo", fix: "glieli scalo"}
  - tutor: "Dieci mesi, ragionevole. Ma «gli li scalo»… quei due pronomi, uniti, che forma prendono?"
    prompt: {text: "gli li scalo", tags: [combined-pronouns]}

# Round 8, set s-wordchoice: word-choice and false friends beside acceptable plain choices. C1, file 7.
- scenario: club-lettura
  level: C1
  persona: en-f-professional
  history: [false-friend]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, l'ho finito ieri notte. Devo dire che all'inizio ho fatto fatica, ma nelle ultime cento pagine non riuscivo a staccarmene."
    - tutor: "Lo sapevo che ti avrebbe preso! E di Elsa, la protagonista, che ne pensi? Io l'ho trovata coraggiosissima."
      goals: [impression]
    - learner: "Coraggiosa sì, ma anche un po' egoista. Quando lascia la figlia alla sorella per partire, ho pensato che fosse una scelta crudele, anche se la capisco."
    - tutor: "Crudele, forse, ma era l'unico modo per salvarsi. Non trovi?"
      goals: [character]
    - learner: "Può darsi. Però la sua attitudine verso la famiglia mi ha irritata per tutto il libro."
      errors: [false-friend]
    - tutor: "Il suo atteggiamento è freddo, d'accordo, ma secondo me è una corazza: se si lasciasse andare, crollerebbe."
      recast: {text: "la sua attitudine", fix: "il suo atteggiamento", tags: [false-friend]}
    - learner: "Interessante, non ci avevo pensato. Comunque, ultimamente è un libro sulla libertà, e su quanto costa."
      errors: [false-friend]
    - tutor: "In definitiva sì, sulla libertà e sul suo prezzo. E lo stile, come ti è sembrato?"
      recast: {text: "ultimamente", fix: "in definitiva", tags: [false-friend]}
    - learner: "Molto denso, a volte quasi barocco. Le descrizioni del mare, però, sono straordinarie: sembra di sentirne l'odore."
    - tutor: "Quelle pagine sul porto all'alba le ho rilette due volte. E a chi lo consiglieresti?"
      goals: [style]
    - learner: "A chi ama i romanzi lenti e psicologici. A chi cerca una trama avvincente direi di lasciar perdere."
    - tutor: "Giudizio onesto. Allora alla prossima riunione lo difendo io contro i tuoi lettori impazienti!"
      goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la tua paura, ma sei troppo tremendista. Alcune professioni cambieranno, questo sì, ma non spariranno dall'oggi al domani."
      errors: [word-choice]
    - tutor: "Catastrofista, io? Mi limito a guardare quello che succede. Hai qualche prova del contrario?"
      recast: {text: "tremendista", fix: "catastrofista", tags: [word-choice]}
      goals: [position]
    - learner: "Prove definitive no, ma non c'è nessuna evidenza che l'intelligenza artificiale distruggerà più lavori di quanti ne creerà."
      errors: [false-friend]
    - tutor: "Nessuna prova, forse, ma nemmeno del contrario! Hai almeno un esempio storico?"
      recast: {text: "nessuna evidenza", fix: "nessuna prova", tags: [false-friend]}
    - learner: "Pensa ai bancomat: negli anni Ottanta tutti dicevano che avrebbero eliminato i cassieri, e invece per anni gli sportelli bancari sono addirittura aumentati."
    - tutor: "Bell'esempio, lo ammetto. Ma un bancomat non impara da solo, mentre queste macchine migliorano ogni mese."
      goals: [evidence]
    - learner: "Su questo hai ragione, la velocità è diversa. E ammetto che i governi stanno reagendo con un ritardo preoccupante."
    - tutor: "Ecco, almeno su questo siamo d'accordo. Quindi cosa si dovrebbe fare, secondo te?"
      goals: [concede]
    - learner: "Investire subito nella formazione, soprattutto per chi ha più di cinquant'anni. Come si dice, meglio prevenire che curare."
    - tutor: "Su questo ti do ragione al cento per cento. Magari la mia paura serve almeno a mettere fretta a qualcuno!"
      goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-m-heritage
  history: [false-friend]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a te! Mio nonno era calabrese ed emigrò a Boston negli anni Cinquanta. Sono cresciuto con i suoi racconti, e a trent'anni ho deciso di vedere con i miei occhi il paese da cui era partito."
    - tutor: "Che bella storia. E com'è stato l'arrivo?"
      goals: [story]
    - learner: "Emozionante. Una cugina di mio padre mi ha introdotto a tutto il paese: in una settimana conoscevo più gente lì che a Boston in dieci anni."
      errors: [false-friend]
    - tutor: "Ti ha presentato a tutto il paese, tipico del Sud! E cosa ti ha sorpreso di più?"
      recast: {text: "introdotto", fix: "presentato", tags: [false-friend]}
    - learner: "Il rapporto con il tempo. Se un amico ti dice «arrivo tra cinque minuti», può voler dire mezz'ora. All'inizio lo trovavo fastidioso, poi ho capito che le persone vengono prima dell'orologio."
    - tutor: "Una lezione che molti di noi dovrebbero ricordare. E c'è qualcosa che proprio non sopporti?"
      goals: [culture-shock]
    - learner: "Onestamente, la burocrazia. Per il cambio di residenza ho aspettato tre mesi, e nessuno sapeva darmi un'informazione consistente."
      errors: [false-friend]
    - tutor: "Un'informazione coerente in un ufficio pubblico? Chiedi troppo! E a chi pensa di trasferirsi qui, cosa consiglieresti?"
      recast: {text: "un'informazione consistente", fix: "un'informazione coerente", tags: [false-friend]}
      goals: [critique]
    - learner: "Di non idealizzare l'Italia delle cartoline. È un paese meraviglioso ma complicato: bisogna essere pazienti e non pretendere che tutto funzioni come a casa."
    - tutor: "Parole giuste, e piene d'affetto. Grazie mille per essere stato con noi!"
      goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, per favore. Mi racconti con calma che cosa l'ha fatta sentire così."
    - tutor: "Luca ha presentato il progetto come se fosse solo suo, e io ci ho lavorato per tre mesi! E nessuno ha detto una parola."
    - learner: "Capisco che si sia sentita ignorata. Avrei dovuto intervenire io, e mi sento un po' culpabile."
      errors: [word-choice]
    - tutor: "Non si senta in colpa, ma la ringrazio: almeno lei lo riconosce."
      recast: {text: "culpabile", fix: "in colpa", tags: [word-choice]}
      goals: [listen]
    - learner: "Posso chiederle una cosa? Prima della riunione, avevate deciso insieme chi avrebbe presentato?"
    - tutor: "No, non ne avevamo parlato. Lui ha semplicemente preso la parola."
      goals: [clarify]
    - learner: "Stamattina ho parlato con Luca. Dice che voleva solo far guadagnare tempo al gruppo, perché eravamo in ritardo. Non credo che l'abbia fatto con mala fede."
      errors: [word-choice]
    - tutor: "In malafede o no, il risultato è che il mio lavoro è sparito."
      recast: {text: "con mala fede", fix: "in malafede", tags: [word-choice]}
      new: [{lemma: malafede, gloss: bad faith}]
      goals: [perspective]
    - learner: "Ha ragione, ed è il risultato che conta. Le propongo questo: alla prossima riunione con la direzione la seconda parte la presenta lei, e io scrivo a tutti per chiarire chi ha fatto che cosa."
    - tutor: "Questo mi sembra giusto. E con Luca come facciamo?"
    - learner: "Vi propongo un incontro a tre giovedì, per decidere come dividere i compiti d'ora in poi."
    - tutor: "D'accordo, giovedì ci sarò. Grazie per avermi ascoltata."
      goals: [solution]

- scenario: modi-di-dire
  level: C1
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Lascia stare, una giornata da dimenticare. Stamattina ho perso il treno per due minuti, così sono arrivata in ritardo all'esame."
    - tutor: "Cominciamo bene! Piove sempre sul bagnato, eh? E poi?"
    - learner: "Appena entrata, il professore mi ha guardata male e mi ha chiesto proprio il capitolo che non avevo studiato. Mi sono sentita così imbarazzata!"
    - tutor: "Quando si dice nascere sotto una cattiva stella. Ma non è finita, vero? Ti leggo in faccia che c'è dell'altro."
      goals: [tell]
    - learner: "Hai indovinato. Tornando a casa, in autobus, ho avuto un argomento con l'autista, e scendendo ho perso il portafoglio. Insomma, piove sul bagnato!"
      errors: [false-friend]
    - tutor: "Anche una discussione con l'autista? Allora piove sul bagnato davvero!"
      recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
      goals: [react]
    - learner: "La colpa è un po' mia, sono troppo distratta. Però anche il professore poteva essere più simpatico, vista la situazione."
      errors: [false-friend]
    - tutor: "Più comprensivo, magari sì, ma i professori non leggono nel pensiero. Diciamo che la colpa è a metà."
      recast: {text: "più simpatico", fix: "più comprensivo", tags: [false-friend]}
      goals: [blame]
    - learner: "D'accordo, a metà. La lezione di oggi? Tre sveglie e portafoglio nella tasca interna. E poi, domani è un altro giorno."
    - tutor: "Ecco, così mi piaci! Dai, ti offro un tè: tutto è bene quel che finisce bene."
      goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho letta sul giornale. In sintesi, il governo vuole limitare gli affitti brevi nei centri storici, perché i residenti non trovano più case a prezzi ragionevoli."
    - tutor: "Esatto. E secondo te è una buona idea?"
      goals: [summarise]
    - learner: "In linea di principio mi sembra una proposta sensibile. Però temo che, se le regole non saranno chiare, i proprietari troveranno il modo di aggirarle."
      errors: [false-friend]
    - tutor: "Sensata sulla carta, magari, ma hai ragione: fatta la legge, trovato l'inganno. I giornali come l'hanno raccontata?"
      recast: {text: "sensibile", fix: "sensata", tags: [false-friend]}
      goals: [opinion]
    - learner: "In modi molto diversi. Il Corriere ha dato molto spazio ai proprietari più affluenti, mentre Repubblica ha intervistato soprattutto famiglie sfrattate."
      errors: [false-friend]
    - tutor: "I proprietari più benestanti, certo: sono loro che hanno più voce. E gli altri giornali?"
      recast: {text: "più affluenti", fix: "più benestanti", tags: [false-friend]}
    - learner: "Il Sole 24 Ore, come al solito, si è concentrato sui numeri, che a dire il vero erano piuttosto eloquenti."
    - tutor: "Tre fonti, tre storie diverse. E secondo te che cosa succederà adesso?"
      goals: [sources]
    - learner: "Se la legge passa, forse i prezzi scenderanno un po', ma ci vorranno anni. E nel frattempo temo che gli affitti lunghi aumentino ancora."
    - tutor: "Io sono più pessimista di te, ma su questo hai ragione: chi cerca casa adesso non può aspettare anni."
      goals: [consequences]

- scenario: presentazione-progetto
  level: C1
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Certo, sarò breve. Proponiamo di digitalizzare la gestione del magazzino, che oggi si fa ancora con planillas e telefonate."
      errors: [word-choice]
    - tutor: "Ancora fogli di calcolo e telefonate, capisco. E quali benefici concreti prevede, in numeri?"
      recast: {text: "planillas", fix: "fogli di calcolo", tags: [word-choice]}
      goals: [pitch]
    - learner: "Secondo le nostre stime ridurremmo gli errori negli ordini del quaranta per cento e risparmieremmo circa duecento ore di lavoro al mese. L'investimento si recupererebbe in diciotto mesi."
    - tutor: "Diciotto mesi sono tanti. E se il sistema non funzionasse? Il rischio mi sembra alto."
      goals: [benefits]
    - learner: "È una preoccupazione legittima. Per questo proponiamo di cominciare con un piano piloto in un solo magazzino, per tre mesi."
      errors: [word-choice]
    - tutor: "Un piano pilota di tre mesi riduce il rischio, devo ammetterlo. E se i risultati fossero deludenti?"
      recast: {text: "piloto", fix: "pilota", tags: [word-choice]}
    - learner: "In quel caso ci fermeremmo, avendo speso meno del dieci per cento del budget previsto."
    - tutor: "Così è più ragionevole. Che cosa le serve da me, adesso?"
      goals: [objection]
    - learner: "Se mi dà il via libera, la settimana prossima le porto il contratto con il proveedor e un calendario dettagliato."
      errors: [word-choice]
    - tutor: "D'accordo: mi porti il contratto con il fornitore e il calendario entro venerdì, e lo discutiamo con l'amministrazione."
      recast: {text: "il proveedor", fix: "il fornitore", tags: [word-choice]}
      goals: [next-steps]
    - learner: "Perfetto, venerdì mattina sarà tutto sulla sua scrivania."
    - tutor: "Bene. Ora mi scusi, ma devo proprio scappare."

- scenario: reclamo-comune
  level: C1
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Sono qui per segnalare un problema che si trascina da mesi: il lampione davanti al civico 14 di via Garibaldi è spento da febbraio, e di sera la strada è completamente al buio."
    - tutor: "Capisco. Ha già fatto una segnalazione online, attraverso il portale del Comune?"
      goals: [describe]
    - learner: "Ne ho fatte tre, e non ho mai ricevuto risposta. Per questo sono venuto di persona."
    - tutor: "Sa, l'ufficio tecnico in questo periodo è molto oberato. Vedrò che cosa si può fare."
    - learner: "Capisco che siate oberati, ma «vedrò» non mi basta. La settimana scorsa una signora anziana è caduta proprio lì. Vorrei sapere quando il problema verrà indirizzato."
      errors: [word-choice]
    - tutor: "Ha ragione: dopo una caduta, il problema va affrontato con urgenza. Non lo sapevo, mi dispiace."
      recast: {text: "indirizzato", fix: "affrontato", tags: [word-choice]}
      goals: [insist]
    - learner: "Qual è la procedura formale? Posso presentare un reclamo scritto?"
    - tutor: "Sì, può presentare un'istanza scritta all'ufficio protocollo, qui al piano terra. Il Comune è tenuto a risponderle entro trenta giorni."
      goals: [rights]
    - learner: "Bene. Allora la presento subito, e le chiedo il numero di referenza, così posso seguire la pratica."
      errors: [word-choice]
    - tutor: "Ecco il numero di protocollo, glielo scrivo qui. E oggi stesso segnalo la caduta al responsabile della manutenzione, glielo prometto."
      recast: {text: "numero di referenza", fix: "numero di protocollo", tags: [word-choice]}
      goals: [commitment]

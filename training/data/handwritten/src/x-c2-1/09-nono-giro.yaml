- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, è un piacere. Incoscienza, direi. Il libro si intitola «Un caffè al volo» ed è una collezione di storie sulla mia vita d'ufficio a Milano, dove lavoro da nove anni per una società di consulenza."
    errors: [false-friend]
  - tutor: "Una raccolta di storie d'ufficio, quindi: terreno minato. Perché ha sentito il bisogno di scriverla?"
    recast: {text: "collezione di storie", fix: "raccolta di storie", tags: [false-friend]}
  - learner: "Perché i miei amici inglesi non mi credevano. Quando racconto che a Milano il caffè si beve in piedi in trenta secondi, e che una riunione può cominciare con venti minuti di discussione sul pranzo, pensano che esagero."
    errors: [subjunctive-use]
  - tutor: "Trenta secondi sono già tanti, per certi milanesi. Ma «pensano che esagero»: dopo «pensano che», quale modo ci aspettiamo?"
    prompt: {text: "pensano che esagero", tags: [subjunctive-use]}
  - learner: "Pensano che esageri, certo. Ecco, il libro è la prova che non esagero affatto."
  - tutor: "E qui arriva la domanda cattiva: non teme di aver rafforzato i soliti stereotipi sugli italiani?"
    goals: [present-book]
  - learner: "Un po' sì, lo ammetto. Ma gli stereotipi li ho rovesciati: nel libro i pigri sono gli inglesi, e gli italiani sono quelli che restano in ufficio fino alle otto di sera. Finora i milanesi mi hanno scritto solo per dirmi che sono stata troppo buona."
  - tutor: "Stereotipi rovesciati: una difesa elegante. Ci racconta un aneddoto che, secondo Lei, dice tutto?"
    goals: [stereotype]
  - learner: "Il primo giorno di lavoro sono arrivata con un'insalata in una scatola di plastica, da mangiare alla scrivania, come facevo a Londra. Il mio capo l'ha guardata come se avessi portato un'arma, e alle una mi ha presa sottobraccio e mi ha portata in trattoria."
    errors: [articulated-preposition]
  - tutor: "Il capo che La salva dall'insalata: bellissimo. Ma «alle una»? Quante ore sono, l'una?"
    prompt: {text: "alle una", tags: [articulated-preposition]}
  - learner: "Una sola: all'una. Comunque, da quel giorno non ho mai più mangiato alla scrivania."
  - tutor: "Ecco un aneddoto che vale un capitolo. E l'italiano, in tutto questo, che cosa ha cambiato in Lei?"
    goals: [anecdote]
  - learner: "Mi ha resa più diretta e più teatrale insieme. In inglese dico «forse potremmo considerare»; in italiano dico «ma scherziamo?» e muovo le mani. Mia madre dice che ha perso una figlia e ha trovato un'attrice. E io le rispondo che almeno l'attrice, adesso, pranza seduta."
  - tutor: "Una figlia in meno, un'attrice in più e un pranzo seduto: mi pare un ottimo affare. Grazie di essere stata con noi, e ai nostri ascoltatori consiglio il libro, da leggere rigorosamente in piedi al bancone."
    goals: [language, farewell]

- scenario: modi-di-dire
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare. Oggi avevo il colloquio per quel posto in agenzia di viaggi, ricordi? Sono uscito con un'ora di anticipo, giacca e cravatta. Appena fuori dalla metro, pioveva gatti e cani, e io non avevo l'ombrello."
    errors: [word-choice]
  - tutor: "Pioveva a catinelle e tu senza ombrello, in giacca e cravatta: si comincia bene. E poi?"
    recast: {text: "pioveva gatti e cani", fix: "Pioveva a catinelle", tags: [word-choice]}
  - learner: "Poi il peggio. Sono arrivato all'indirizzo, fradicio, e ho scoperto che l'agenzia si era trasferita dall'altra parte della città. Quando finalmente sono arrivato nella sede giusta, il colloquio è già cominciato con un altro candidato."
    errors: [tense-aspect]
  - tutor: "Ahia, piove sul bagnato. Però aspetta: quando sei arrivato, il colloquio «è già cominciato»? Quale dei due fatti viene prima?"
    prompt: {text: "il colloquio è già cominciato", tags: [tense-aspect]}
  - learner: "Il colloquio, prima: quando sono arrivato, era già cominciato. E «piove sul bagnato» vuol dire che alla sfortuna se ne aggiunge altra?"
  - tutor: "Esatto, una disgrazia sopra l'altra. Ma di chi è la colpa, alla fine? Tua o dell'agenzia?"
    goals: [tell, react]
  - learner: "Un po' di tutti e due, direi. L'indirizzo nuovo era scritto in fondo alla loro email, in piccolo, e io non l'avevo letta fino alla fine. Però avrebbero potuto metterlo all'inizio, no? Diciamo che la colpa è metà mia e metà loro."
  - tutor: "Metà tua e metà loro: una sentenza da giudice saggio. E alla fine com'è andata?"
    goals: [blame]
  - learner: "Bene, incredibilmente. La responsabile mi ha visto così bagnato che si è messa a ridere, mi ha dato un asciugamano e mi ha fatto il colloquio lo stesso. Dice che chi arriva dopo tutto quel giro sotto la pioggia ha la tenacia giusta per lavorare con i turisti."
  - tutor: "Altro che sfortuna! Allora, che lezione ne tiri fuori?"
  - learner: "Che non tutto il male viene per nuocere. E che le email vanno lette fino in fondo, anche quando sembrano noiose."
  - tutor: "Due lezioni in una, e la seconda vale oro. Questo aperitivo lo offro io: brindiamo al futuro impiegato più bagnato d'Italia."
    goals: [moral]

- scenario: politica-lavoro
  level: C2
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Che metà è una cifra a effetto, Riccardo. Spariranno dei compiti, non dei mestieri interi. Mia madre lavora da trent'anni in una fattoria tessile vicino a Leeds: le macchine sono cambiate tre volte, ma lei è ancora lì."
    errors: [false-friend]
  - tutor: "In una fabbrica tessile, e ancora al suo posto dopo tre rivoluzioni: va bene, è un esempio concreto. Ma quante colleghe ha visto andare via?"
    recast: {text: "fattoria tessile", fix: "fabbrica tessile", tags: [false-friend]}
    goals: [opinion, example]
  - learner: "Parecchie, è vero. Ma è proprio questo il problema: se l'azienda avesse investito nella formazione dieci anni fa, oggi quelle donne avrebbero avuto ancora un lavoro."
    errors: [hypothetical]
  - tutor: "Su questo ti do ragione. Ma guarda la frase: con quell'«oggi», la conseguenza sta nel passato o nel presente?"
    prompt: {text: "oggi quelle donne avrebbero avuto ancora un lavoro", tags: [hypothetical]}
  - learner: "Nel presente, quindi: oggi quelle donne avrebbero ancora un lavoro. Il periodo ipotetico misto: lo studio da anni e mi frega ancora."
  - tutor: "Frega anche metà dei giornalisti, tranquilla. Ma immagina: se domani un'intelligenza artificiale facesse il tuo lavoro meglio di te, che cosa faresti?"
  - learner: "Proverei a fare quello che lei non sa fare. Io studio traduzione: se una macchina traducesse i manuali tecnici meglio di me, mi specializzerei in letteratura, o rivedrei i testi tradotti dalle macchine. Qualcuno dovrà pur controllarle."
  - tutor: "Controllare le macchine: è il mestiere del futuro, o il nuovo precariato? Non riesco a decidermi."
    goals: [hypothesis]
  - learner: "Forse tutte e due le cose. Alla fine della giornata, dipende da come lo Stato gestirà la transizione."
    errors: [word-choice]
  - tutor: "In fin dei conti, dipende dalla politica: su questo siamo d'accordo. E allora tira tu le somme."
    recast: {text: "Alla fine della giornata", fix: "In fin dei conti", tags: [word-choice]}
  - learner: "Riassumendo: meno profezie catastrofiche e più formazione. E tu, Riccardo, sinceramente: pensi ancora che metà di noi resterà a casa?"
  - tutor: "Diciamo un terzo, va'. Mi hai convinto a metà, il che per me è già una tua vittoria. Brindiamo."
    goals: [conclude]

- scenario: pranzo-domenicale
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Grazie! Mordere no, ma vedo che vi state mangiando con gli occhi quella teglia. Io ho già pranzato da mia suocera, però per un pezzo di lasagna trovo sempre posto."
  - tutor: "Bravo, a tavola non si invecchia, come diceva mio nonno. Secondo te che cosa vuol dire?"
  - learner: "Che il tempo passato a mangiare con gli amici non conta, non ti fa diventare più vecchio? Allora io devo avere vent'anni: mia suocera mi tiene a tavola quattro ore ogni domenica."
  - tutor: "Proprio così, hai capito al volo. Con quella suocera sei praticamente immortale. Quanti pezzi di lasagna ti ha fatto mangiare oggi?"
    goals: [react]
  - learner: "Solo due, oggi sono stato bravo. L'anno scorso, a Natale, ho mangiato quattro e sono stato male tutto il pomeriggio."
    errors: [ci-ne]
  - tutor: "Quattro, eroico. Ma «ho mangiato quattro»: quattro di che cosa? Manca una parolina che riprenda i pezzi di lasagna."
    prompt: {text: "ho mangiato quattro", tags: [ci-ne]}
  - learner: "Ne ho mangiati quattro, giusto. In spagnolo quella parolina non c'è. Però per le suocere come la mia abbiamo un detto: «donde comen dos, comen tres», dove mangiano in due, mangiano anche in tre."
  - tutor: "Bello, e da noi si dice quasi uguale: dove si mangia in due, si mangia anche in tre. Adesso raccontaci tu una storia, con un bel proverbio alla fine."
    goals: [compare]
  - learner: "Va bene. Quando sono arrivato in Italia lavoravo in un cantiere con un muratore che si lamentava sempre degli attrezzi. Un giorno il capo gli ha comprato un trapano nuovissimo, e lui l'ha rotto in una settimana. Il capo gli l'ha fatto ripagare: chi rompe paga, e i cocci sono suoi."
    errors: [combined-pronouns]
  - tutor: "Il proverbio è perfetto. Ma «gli l'ha fatto ripagare»: quando quei due pronomi si incontrano, che cosa succede?"
    prompt: {text: "gli l'ha fatto ripagare", tags: [combined-pronouns]}
    goals: [use-idiom]
  - learner: "Si uniscono: gliel'ha fatto ripagare. E i cocci, letteralmente, se li è portati a casa."
  - tutor: "Storia perfetta, con il proverbio giusto al posto giusto. Adesso però mangia, che la lasagna si raffredda e qui nessuno aspetta."
    goals: [anecdote]

- scenario: riunione-lavoro
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, a parte un intoppo. La nuova versione dell'app è pronta in inglese e in italiano; mancano il tedesco e il francese, che abbiamo affidato all'agenzia esterna."
  - tutor: "E l'intoppo, immagino, è proprio l'agenzia. Quanto sono indietro?"
    goals: [update]
  - learner: "Due settimane, e non è la prima volta: sono molto consistenti nei ritardi. L'ultima consegna è arrivata con dieci giorni di ritardo, quella prima con una settimana."
    errors: [false-friend]
  - tutor: "Quindi sono costanti, ma nel senso sbagliato: ritardi su ritardi. Il cliente lo sa già?"
    recast: {text: "consistenti", fix: "costanti", tags: [false-friend]}
    goals: [problem]
  - learner: "Non ancora, volevo prima parlarne con te. Io direi che potremo fare così: il tedesco lo passiamo a Jonas, che è madrelingua, e all'agenzia lasciamo solo il francese."
    errors: [conditional-form]
  - tutor: "Mi piace l'idea. Però, «io direi che potremo»: è una previsione o una proposta? Ascolta bene quel verbo."
    prompt: {text: "potremo fare così", tags: [conditional-form]}
  - learner: "Una proposta, quindi condizionale: potremmo fare così. La doppia emme me la mangio quando parlo veloce."
  - tutor: "Esatto. E Jonas ce la farebbe, con tutto il resto che ha?"
    goals: [proposal]
  - learner: "Gli ho già chiesto: se gli togliamo i test di dicembre, dice che in dieci giorni finisce. I test potrei farli io, in questo periodo ho meno da fare."
  - tutor: "Allora va bene. Che scadenza diamo al cliente?"
  - learner: "Proporrei di settare la scadenza al 15 dicembre: ci lascia qualche giorno di margine, se l'agenzia ritarda ancora con il francese."
    errors: [word-choice]
  - tutor: "Va bene, fissare la scadenza al 15 dicembre ci dà un margine di sicurezza. Lo comunico io al cliente oggi pomeriggio."
    recast: {text: "settare la scadenza", fix: "fissare la scadenza", tags: [word-choice]}
    goals: [deadline]

- scenario: smartworking
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tutte e due. Lavoro per una startup di Milano che fa app per le palestre: tre giorni da casa e due in ufficio. In ufficio però è un caos: siamo in trenta in un open space, con la musica e il biliardino."
  - tutor: "Il biliardino in ufficio: non manca proprio niente. E da casa come ti trovi?"
    goals: [situation]
  - learner: "Meglio, per certe cose. A casa mi concentro di più e risparmio un'ora e mezza di metro al giorno. Quando salgo dall'ufficio alle sette, ho la sensazione di aver perso metà della giornata sui mezzi."
    errors: [false-friend]
  - tutor: "Eh, «esco dall'ufficio alle sette e la giornata è finita»: lo dicono tutti i milanesi. Quindi a casa solo vantaggi?"
    recast: {text: "salgo dall'ufficio", fix: "esco dall'ufficio", tags: [false-friend]}
    goals: [pros]
  - learner: "No, anzi. Il problema è che a casa lavoro di più che in ufficio: non stacco mai. E poi il mio capo, che è più giovane che me, scrive messaggi anche alle undici di sera."
    errors: [comparative]
  - tutor: "Alle undici di sera? Che maleducato. Ma «più giovane che me»: davanti a un pronome come «me», è la parola giusta per il confronto?"
    prompt: {text: "più giovane che me", tags: [comparative]}
    goals: [cons]
  - learner: "No, ci vuole «di»: più giovane di me. Ventisei anni, e già capo."
  - tutor: "Ventisei anni e messaggi notturni: un classico. Se potessi scegliere, come organizzeresti la settimana?"
  - learner: "Mi piacerebbe che l'azienda mi lascerebbe scegliere i giorni: due in ufficio, quando ci sono le riunioni importanti, e il resto a casa. E vorrei una regola chiara: niente messaggi dopo le sette."
    errors: [subjunctive-use]
  - tutor: "Una regola sacrosanta. Solo, «mi piacerebbe che l'azienda mi lascerebbe»: dopo «mi piacerebbe che», quel condizionale può restare?"
    prompt: {text: "Mi piacerebbe che l'azienda mi lascerebbe", tags: [subjunctive-use]}
  - learner: "No: mi piacerebbe che l'azienda mi lasciasse scegliere. Brindiamo al diritto alla disconnessione?"
  - tutor: "Brindiamo, e una copia della tua regola la mando anche al mio capo. Salute!"
    goals: [preference]

- scenario: assemblea-condominio
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Non sono contraria ai lavori: la facciata va rifatta, lo sappiamo tutti. Chiedo solo di rimandarli di un anno. Il preventivo è arrivato una settimana fa: sarebbe stato meglio se ce l'avrebbero mandato a settembre, così avremmo avuto il tempo di confrontarlo con altri."
    errors: [hypothetical]
  - tutor: "Il punto è chiaro, signora. Però, «se ce l'avrebbero mandato»: dopo quel «se», il condizionale ci sta?"
    prompt: {text: "se ce l'avrebbero mandato", tags: [hypothetical]}
  - learner: "No, scusi: se ce l'avessero mandato a settembre. Con più tempo, avremmo potuto chiedere almeno altri due preventivi."
  - tutor: "Ha ragione, e lo riconosco io per primo. Ma il signor Bertolini, qui accanto, chiede se per caso Lei non voglia semplicemente evitare di pagare, visto che dall'ultimo piano la facciata non la vede neanche."
    goals: [position]
  - learner: "Capisco la battuta, signor Bertolini, e non me la prendo. Pagherò fino all'ultimo euro, come tutti, in base ai miei millesimi. Chiedo solo di pagare il giusto, e un anno di tempo può farci risparmiare parecchio."
  - tutor: "Risposta elegante, e mi pare che il signor Bertolini abbia apprezzato. Ha una proposta concreta?"
    goals: [defuse]
  - learner: "Sì. Propongo di raccogliere altri due preventivi entro febbraio e, nel frattempo, di mettere in sicurezza solo i cornicioni, che sono la parte pericolosa. I lavori grossi li voteremmo a marzo, con tutti i dati sul tavolo."
  - tutor: "Una proposta ragionevole. I cornicioni costerebbero circa ottomila euro, divisi per millesimi: la metto ai voti?"
    goals: [alternative]
  - learner: "Sì, e chiedo che sia messo nel verbale che l'amministrazione si impegna a portare i nuovi preventivi entro il 28 febbraio."
    errors: [preposition]
  - tutor: "D'accordo. Solo un dettaglio di forma: «messo nel verbale»? In assemblea l'espressione fissa vuole un'altra preposizione."
    prompt: {text: "messo nel verbale", tags: [preposition]}
  - learner: "Messo a verbale, giusto. Allora chiedo che sia messo a verbale, con la data."
  - tutor: "Messo a verbale, con la data del 28 febbraio. La proposta passa con diciotto voti su ventidue: i cornicioni subito, il resto si decide a marzo."
    goals: [compromise]

- scenario: colloquio-promozione
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Vorrei fare con Lei il punto su quest'anno. Da quando coordino il magazzino, i tempi di spedizione sono scesi da tre giorni a uno e mezzo, e gli errori negli ordini si sono dimezzati."
  - tutor: "Lo so, i numeri li ho visti, e sono notevoli. Immagino che dietro ci sia una richiesta."
    goals: [results]
  - learner: "Esatto. Da un anno faccio il lavoro di un responsabile, ma con il contratto e lo stipendio di un operaio. Credo che è giusto che il mio inquadramento lo riconosca."
    errors: [subjunctive-use]
  - tutor: "La richiesta è chiara. Ma «credo che è giusto»: dopo «credo che», come si comporta il verbo?"
    prompt: {text: "Credo che è giusto", tags: [subjunctive-use]}
  - learner: "Credo che sia giusto. Insomma, chiedo la promozione a responsabile di magazzino, con l'aumento che ne consegue."
  - tutor: "Glielo dico con franchezza: la merita. Il problema è il budget: per quest'anno è chiuso, e un aumento adesso non è previsto."
    goals: [request]
  - learner: "Lo capisco. Però, se avessi saputo a gennaio che il budget si sarebbe chiuso in primavera, l'avrei chiesto allora. Non mi sembra giusto pagare il fatto di non aver forzato i tempi."
  - tutor: "È un'obiezione legittima. Che cosa propone?"
  - learner: "Una soluzione in due tempi: la nomina a responsabile da subito, anche senza aumento, e l'adeguamento dello stipendio da gennaio, scritto nero su bianco. Però mi aspetto che mi date una data precisa, non un «vedremo»."
    errors: [subjunctive-use]
  - tutor: "Una proposta seria. Solo, «mi aspetto che mi date»: è lo stesso tipo di frase di prima, non trova?"
    prompt: {text: "mi aspetto che mi date", tags: [subjunctive-use]}
    goals: [handle]
  - learner: "Ha ragione: mi aspetto che mi diate una data. Con i verbi di attesa ci vuole il congiuntivo; dovrei tatuarmelo."
  - tutor: "Nessun tatuaggio necessario. La nomina parte dal primo dicembre e l'aumento dal primo gennaio: Le farò avere la lettera entro venerdì."
    goals: [next-steps]

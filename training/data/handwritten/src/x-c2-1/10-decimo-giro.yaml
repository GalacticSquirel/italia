- scenario: mediazione-colleghi
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Nessun disturbo, si sieda pure. Ho notato che ieri, quando Marco ha presentato l'analisi dei costi, lei è rimasta in silenzio, ma aveva un'espressione molto eloquente. Mi racconti."
  - tutor: "L'analisi l'abbiamo fatta insieme, io e lui, in tre settimane. Anzi, i calcoli più difficili li ho fatti io. E ieri lui ha detto «la mia analisi», davanti al direttore, senza nominarmi una volta."
  - learner: "Capisco, e mi dispiace che si è sentita messa da parte proprio davanti al direttore. Tre settimane di lavoro non sono poche."
    errors: [subjunctive-use]
  - tutor: "Grazie. Però, se permette: «mi dispiace che si è sentita»... dopo «mi dispiace che», il verbo non cambia?"
    prompt: {text: "mi dispiace che si è sentita", tags: [subjunctive-use]}
    goals: [listen]
  - learner: "Ha ragione: mi dispiace che si sia sentita messa da parte. Per capire bene: prima della riunione avevate concordato chi avrebbe presentato?"
  - tutor: "Sì, lui mi aveva detto che l'avrebbe fatto lui, perché io in pubblico mi agito. Mi stava bene. Ma presentare non vuol dire prendersi tutto il merito."
    goals: [clarify]
  - learner: "Su questo non ci piove. Le propongo però anche il punto di vista di Marco, senza giustificarlo: stamattina mi ha detto che nella fretta si era dimenticato di nominarla, e che non voleva prendere il credito per il lavoro di tutti e due."
    errors: [word-choice]
  - tutor: "Prendersi il merito senza volerlo... ci credo poco, ma ammetto che Marco, quando è agitato, dimentica anche il proprio nome."
    recast: {text: "prendere il credito", fix: "Prendersi il merito", tags: [word-choice]}
    goals: [perspective]
  - learner: "Proprio per questo propongo una cosa concreta: domani mando al direttore un'email con l'analisi firmata da tutti e due, e alla prossima riunione presentate insieme. Se vuole, prima ne parliamo noi tre."
  - tutor: "Mi sembra giusto. Un'email firmata da entrambi e la prossima volta presentiamo in coppia: così sì. Grazie di avermi ascoltata."
    goals: [solution]

- scenario: presentazione-progetto
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Glieli faccio bastare. Proponiamo di installare pannelli solari sul tetto del magazzino di Lodi: millecinquecento metri quadri che oggi non servono a niente. Coprirebbero circa il sessanta per cento del nostro consumo di elettricità."
  - tutor: "Il sessanta per cento è una bella cifra. Quanto costa, e in quanto tempo rientriamo dell'investimento?"
    goals: [pitch]
  - learner: "Costa trecentoventimila euro. Attualmente, però, è meno di quanto sembri: con gli incentivi regionali scende a duecentoquarantamila, e risparmiamo circa sessantamila euro l'anno di bollette."
    errors: [false-friend]
  - tutor: "In realtà, quindi, duecentoquarantamila con gli incentivi: così i conti cambiano. Quattro anni per rientrare, se ho capito bene."
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    goals: [benefits]
  - learner: "Esatto, quattro anni, e i pannelli durano venticinque. Se partiamo a marzo, il primo risparmio lo vedremmo già nel bilancio estivo."
    errors: [hypothetical]
  - tutor: "Interessante. Però «se partiamo a marzo, lo vedremmo»: le due metà della frase vanno d'accordo tra loro?"
    prompt: {text: "Se partiamo a marzo, il primo risparmio lo vedremmo", tags: [hypothetical]}
  - learner: "No, ha ragione: se partiamo a marzo, lo vedremo già in estate. Oppure, se partissimo a marzo, lo vedremmo: dipende da quanto sono ottimista."
  - tutor: "Restiamo sul realistico, allora. Il mio timore è un altro: se l'installazione blocca il magazzino per settimane, perdiamo più di quanto risparmiamo."
  - learner: "È un timore giusto, e ci abbiamo pensato. Il fornitore lavora solo sul tetto, dall'esterno, e garantisce per contratto che le attività del magazzino non saranno interrotte. Se ci fossero ritardi, pagherebbe una penale di mille euro al giorno."
  - tutor: "Una penale scritta mi rassicura più di qualsiasi promessa. Che cosa Le serve da me, adesso?"
    goals: [objection]
  - learner: "Bisogna che la direzione approva il progetto entro fine mese, per non perdere gli incentivi regionali. Le mando il piano completo stasera."
    errors: [subjunctive-use]
  - tutor: "Lo leggerò volentieri. Ma «bisogna che la direzione approva»: dopo «bisogna che», quel verbo regge così?"
    prompt: {text: "Bisogna che la direzione approva", tags: [subjunctive-use]}
  - learner: "Bisogna che la direzione approvi, certo. Allora Le mando tutto stasera e fissiamo un incontro per la settimana prossima?"
  - tutor: "Va bene: il piano stasera e l'incontro giovedì alle dieci, con l'amministratore delegato. Porti anche il contratto del fornitore con la penale."
    goals: [next-steps]

- scenario: trattativa-affitto
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, mi è piaciuto molto: tre stanze, luminoso, e per andare al lavoro metto dieci minuti a piedi. Ho solo un dubbio sul bagno: è così piccolo che la lavatrice quasi non entra."
    errors: [ci-ne]
  - tutor: "Dieci minuti a piedi sono un lusso. Ma «metto dieci minuti»: per parlare del tempo che serve, a quel verbo manca una particella. Quale?"
    prompt: {text: "metto dieci minuti", tags: [ci-ne]}
  - learner: "Ci metto dieci minuti, giusto. Senza la particella sembra che i minuti li metta da qualche parte."
  - tutor: "Esatto. Il bagno è piccolo, è vero, ma la lavatrice si può mettere sul balcone coperto, come fanno in molti in questa zona. Il canone è di novecento euro."
    goals: [interest]
  - learner: "Novecento con le spese o senza? Nell'annuncio c'era scritto ottocentocinquanta, e il prezzo mi sembra trattabile, visto che il palazzo non ha l'ascensore e gli infissi sono vecchi."
  - tutor: "Senza spese, che sono altri sessanta euro. Il proprietario però è disposto a trattare, se il contratto è lungo."
  - learner: "Allora facciamo così: firmo un quattro più quattro, sempre che il canone scenda a ottocentocinquanta, spese incluse. Sono un inquilino tranquillo, e pretendo di restare almeno otto anni."
    errors: [false-friend]
  - tutor: "Se conta di restare almeno otto anni, è l'argomento migliore che potesse portare, perché un inquilino stabile vale oro. Proverò a convincerlo a scendere a ottocentosettanta, spese incluse."
    recast: {text: "pretendo di restare", fix: "conta di restare", tags: [false-friend]}
    goals: [negotiate]
  - learner: "Ottocentosettanta va bene. E quanto devo lasciare di fianza? E se tra qualche anno dovessi trasferirmi per lavoro, posso andarmene prima?"
    errors: [word-choice]
  - tutor: "Di cauzione si lasciano due mesi, restituiti alla fine. E sì, per gravi motivi, come un trasferimento di lavoro, può dare disdetta con sei mesi di preavviso."
    recast: {text: "fianza", fix: "cauzione", tags: [word-choice]}
    goals: [conditions]
  - learner: "Perfetto. Allora, se il proprietario accetta ottocentosettanta, per me è fatta: preparate pure il contratto."
  - tutor: "Lo chiamo oggi stesso e le confermo tutto entro domani. Se dice di sì, firmiamo in agenzia la settimana prossima."
    goals: [conclude]

- scenario: condoglianze
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
  - learner: "Ma si figuri. Lo sento molto, davvero. Ho saputo di Sua madre ieri, dal responsabile, e sono venuto appena ho potuto."
    errors: [word-choice]
  - tutor: "Grazie, so che Le dispiace davvero. Era stanca da tempo, ma è dura lo stesso. È gentile da parte Sua essere qui."
    recast: {text: "Lo sento molto", fix: "Le dispiace", tags: [word-choice]}
    goals: [condolences]
  - learner: "Ricordo quando venne a prenderLa in ufficio, l'estate scorsa, con quel cesto di fichi per tutto il reparto. Ne parlammo per settimane."
    errors: [tense-aspect]
  - tutor: "I fichi del suo giardino, sì. Ma «venne», per l'estate scorsa? Qui in Puglia lo diciamo anche noi, però nell'italiano comune si usa un altro tempo."
    prompt: {text: "venne a prenderLa", tags: [tense-aspect]}
  - learner: "Ah, è vero: è venuta a prenderLa... e ne parlammo per settimane."
    errors: [tense-aspect]
  - tutor: "Ne abbiamo parlato per settimane, è vero: quei fichi li ricordano ancora tutti. Mamma ne sarebbe contenta."
    recast: {text: "ne parlammo", fix: "Ne abbiamo parlato", tags: [tense-aspect]}
    goals: [memory]
  - learner: "Senta, per il lavoro: non si preoccupa di niente. Le Sue pratiche le seguo io finché non torna, e se c'è qualcosa da fare qui in paese, me lo dica."
    errors: [imperative-form]
  - tutor: "Grazie, è un'offerta preziosa. Ma «non si preoccupa», detto a me con il Lei: è un consiglio o una constatazione?"
    prompt: {text: "non si preoccupa", tags: [imperative-form]}
  - learner: "Un consiglio: non si preoccupi di niente. Le pratiche sono in buone mani."
  - tutor: "Ne sono sicura. Accetto volentieri, e mi toglie un peso: potrò stare con mio padre senza pensare all'ufficio."
    goals: [offer-help]
  - learner: "Allora La lascio alla Sua famiglia. Se Le servisse qualcosa, a qualsiasi ora, mi chiami. Le sono vicino."
  - tutor: "Grazie davvero, di cuore. La accompagno alla porta."
    goals: [leave]

- scenario: cena-suoceri
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Spero di non deluderLa, allora: dal vivo sono molto meno avventuroso. Grazie dell'invito. Ho portato un Brunello: Giulia mi ha detto che è il Suo preferito, e volevo portarglielo di persona."
  - tutor: "Il Brunello è il mio preferito, sì: Giulia sa come conquistarmi. Assaggi l'arrosto di mia moglie, intanto, e poi mi dica."
  - learner: "Questo arrosto spacca, signora, è pazzesco! Davvero, uno dei migliori che abbia mai mangiato."
    errors: [register]
  - tutor: "Mia moglie La ringrazia. Però «spacca», a questa tavola e alla prima cena? Forse ci vuole un aggettivo un po' meno da stadio."
    prompt: {text: "Questo arrosto spacca", tags: [register]}
  - learner: "Ha ragione, mi scusi: è squisito, davvero. Mi è scappato l'entusiasmo."
  - tutor: "L'entusiasmo è perdonato: a tavola, anzi, è un complimento. Mi dica, di che cosa si occupa esattamente?"
    goals: [compliment]
  - learner: "Sono ingegnere ambientale: lavoro per una società che progetta impianti di depurazione. Viaggio molto, è vero, ma da gennaio dovrei stabilirmi a Firenze in modo definitivo, anche per stare vicino a Giulia."
  - tutor: "Ingegnere ambientale: almeno l'acqua del rubinetto sarà in buone mani. E che intenzioni ha con mia figlia, oltre alla depurazione?"
    goals: [background]
  - learner: "Le più serie, ma senza correre: sono una persona sensibile, e le decisioni importanti le prendo con la testa, non di pancia. Anche se, con un suocero così ironico, temo di dover accelerare per paura di essere bocciato."
    errors: [false-friend]
  - tutor: "Una persona sensata, che decide con la testa: ottima risposta, e la paura di essere bocciato è sana. Visto che mi ha convinto, che ne dice se ci diamo del tu?"
    recast: {text: "sensibile", fix: "sensata", tags: [false-friend]}
    goals: [irony]
  - learner: "Con piacere, ma ci vorrà un po' di allenamento: per me resti il padre di Giulia, e il Lei mi scapperà ancora per un po'."
  - tutor: "Allenati pure, abbiamo tutta la cena davanti. E adesso un brindisi, con il tuo Brunello."
    goals: [tu-lei]

- scenario: email-rettore
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Buongiorno. Sono un ricercatore di Salamanca, qui con una borsa di due anni. L'ateneo mi ha addebitato due volte la tassa di iscrizione al dottorato, milleseicento euro in tutto, e la segreteria dice che il rimborso deve autorizzarlo il Rettore."
  - tutor: "Un doppio addebito, quindi, e la segreteria che rimanda al Rettore. Come pensava di aprire la lettera?"
    goals: [situation]
  - learner: "In spagnolo scriverei «Estimado Rector». Quindi pensavo: «Stimato Rettore, Le scrivo perché...»."
    errors: [register]
  - tutor: "Ci siamo quasi, ma con un rettore la tradizione italiana è più solenne. Le viene in mente l'aggettivo che spetta ai rettori?"
    prompt: {text: "Stimato Rettore", tags: [register]}
  - learner: "Ah, certo: «Magnifico Rettore». L'avevo visto sulle lettere ufficiali e mi sembrava uno scherzo."
  - tutor: "Nessuno scherzo, è il titolo ufficiale. E poi come prosegue?"
    goals: [opening-formula]
  - learner: "«Ho presentato regolarmente la domanda di iscrizione, ma mi è stata addebitata due volte la stessa tassa. Esigo il rimborso immediato di quanto pagato in più.»"
    errors: [register]
  - tutor: "Il contenuto è chiarissimo. Il verbo «esigo», però, rivolto a un Magnifico Rettore: come suonerà alle sue orecchie?"
    prompt: {text: "Esigo il rimborso immediato", tags: [register]}
  - learner: "Troppo brusco, lo so. Allora: «Chiedo cortesemente che la somma mi venga rimborsata, avendo presentato la domanda in tempo e forma»."
    errors: [word-choice]
  - tutor: "Ecco, ora il tono è giusto: avendo presentato la domanda nei tempi e nei modi previsti, la richiesta è difficile da respingere."
    recast: {text: "in tempo e forma", fix: "nei tempi e nei modi previsti", tags: [word-choice]}
    goals: [tone]
  - learner: "E per chiudere? In spagnolo metterei «Atentamente», ma «attentamente» in italiano mi sembra strano."
  - tutor: "Strano davvero: sembrerebbe che il Rettore debba leggere con attenzione. Scriva «Con osservanza» oppure «Distinti saluti», preceduti da «In attesa di un cortese riscontro»."
    goals: [closing]

- scenario: intervista-radio
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un autore che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuto!"
  - learner: "Grazie, buonasera a tutti. Incoscienza, senza dubbio: il libro si chiama «Il tetto può aspettare» e racconta come io e mia moglie, due pensionati di Boston, abbiamo ristrutturato un casale in Umbria senza sapere una parola d'italiano."
  - tutor: "Senza sapere una parola: allora l'incoscienza è doppia. Com'era il casale, quando l'avete comprato?"
    goals: [present-book]
  - learner: "Un rudere romantico. Quando l'abbiamo comprato, non ha avuto il tetto, e in cucina dormivano le pecore del vicino."
    errors: [tense-aspect]
  - tutor: "Le pecore in cucina: un'immagine da film. Ma «non ha avuto il tetto»: sta descrivendo com'era la casa o raccontando un fatto? Il tempo verbale dovrebbe dircelo."
    prompt: {text: "non ha avuto il tetto", tags: [tense-aspect]}
  - learner: "Sto descrivendo, quindi imperfetto: non aveva il tetto. Le pecore, invece, le abbiamo sfrattate con molta diplomazia."
  - tutor: "E adesso la domanda scomoda: nel libro gli umbri sono tutti contadini saggi e nonne ai fornelli. Non è il solito stereotipo dell'americano innamorato?"
  - learner: "Un po' sì, lo confesso. Ma nel libro c'è anche il geometra che spariva per tre mesi e l'impiegato del Comune che ci ha fatto rifare la stessa domanda quattro volte. Gli stereotipi ci sono, ma da tutte e due le parti: anche noi americani ne usciamo piuttosto ridicoli."
  - tutor: "Un equilibrio onesto, allora. Ci regala un aneddoto?"
    goals: [stereotype]
  - learner: "Volentieri. Il primo giorno di lavori il muratore mi ha chiesto: «Ce l'ha una mazzetta?». Io ho pensato a una tangente e, molto imbarazzato, gli ho offerto cinquanta euro. Lui voleva solo un martello."
  - tutor: "Una mazzetta per l'altra: in Italia l'equivoco è sempre dietro l'angolo. E l'italiano, che cosa ha cambiato in Lei?"
    goals: [anecdote]
  - learner: "Mi ha insegnato la pazienza, e anche l'umiltà: a settant'anni ero di nuovo uno studente che sbaglia gli articoli. Sono contento che il libro è piaciuto anche ai miei vicini, perché ci sono dentro tutti, con i loro veri nomi."
    errors: [subjunctive-use]
  - tutor: "Con i veri nomi: coraggioso. Però, «sono contento che il libro è piaciuto»: dopo «sono contento che», quale modo prende il verbo?"
    prompt: {text: "Sono contento che il libro è piaciuto", tags: [subjunctive-use]}
    goals: [language]
  - learner: "Sono contento che sia piaciuto. E per chiudere: in Umbria ho imparato che il tetto può aspettare, ma il pranzo no."
  - tutor: "Il tetto può aspettare, il pranzo no: lo mettiamo sulla copertina della ristampa. Grazie di essere stato con noi, e buon appetito in Umbria."
    goals: [farewell]

- scenario: modi-di-dire
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Ho fatto un ridicolo tremendo. Stamattina avevo l'esame orale di storia dell'arte. Ero arrivata con mezz'ora di anticipo e l'aula era chiusa, quindi ho chiesto a un signore anziano in corridoio se poteva aprirla. Pensavo che fosse il bidello."
    errors: [word-choice]
  - tutor: "Una figuraccia tremenda, quindi, e già vedo dove va a finire: il bidello non era il bidello."
    recast: {text: "un ridicolo tremendo", fix: "una figuraccia tremenda", tags: [word-choice]}
  - learner: "Esatto! Lui mi ha guardata, ha sorriso e ha aperto la porta senza dire niente. Mezz'ora dopo si è seduto dietro la cattedra: era il professore."
  - tutor: "Avrai voluto sprofondare, immagino. Ma lui come l'ha presa?"
    goals: [tell]
  - learner: "Volevo sprofondare, sì, proprio sotto il pavimento. Lui invece rideva. Mi ha detto: «Signorina, almeno ha capito che sono una persona di servizio». Poi però mi ha fatto una domanda su un pittore che non avevo mai sentito nominare."
  - tutor: "Che classe, però, il professore. E di chi è la colpa, alla fine? Tua o dei professori che girano senza cartellino?"
    goals: [react]
  - learner: "Un po' mia, perché avrei potuto chiedere chi fosse, e un po' sua, perché poteva dirmelo subito. Diciamo che la colpa è di tutti e due: io per la fretta, lui per l'ironia."
  - tutor: "Colpa condivisa, verdetto equilibrato. E l'esame com'è andato?"
    goals: [blame]
  - learner: "Incredibilmente bene: alla fine ho tolto ventiquattro. Lui ha detto che una studentessa che scambia un professore per il bidello almeno non è una leccapiedi."
    errors: [word-choice]
  - tutor: "Hai preso ventiquattro, e pure un complimento: non male, per una mattina cominciata così. Che lezione ne tiri fuori?"
    recast: {text: "ho tolto ventiquattro", fix: "Hai preso ventiquattro", tags: [word-choice]}
  - learner: "Che non bisogna giudicare un libro dalla copertina, né un professore dal maglione. E che una figuraccia, a volte, porta fortuna."
  - tutor: "Una figuraccia che porta fortuna: questa me la segno. E adesso alziamo i bicchieri al tuo ventiquattro e al professore con il maglione!"
    goals: [moral]

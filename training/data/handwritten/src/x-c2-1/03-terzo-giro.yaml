- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, buonasera a tutti. Più incoscienza che coraggio, temo. Il libro si intitola 'Con permesso' e racconta i miei dodici anni a Bari. L'ho scritto perché mi ero stancata di sentir parlare dell'Italia solo come di una cartolina o di un problema."
  - tutor: "Né cartolina né problema: ambiziosa. Però mi dica la verità: un capitolo sugli italiani che gesticolano e arrivano in ritardo l'avrà pur scritto. Vende sempre."
    goals: [present-book]
  - learner: "Mi dispiace deluderLa. Gli stereotipi mi interessano solo quando si rompono. Il mio idraulico arriva sempre cinque minuti prima, e sono io, la spagnola, quella che gesticola. Sebbene qualche luogo comune ha un fondo di verità, non ci si può costruire sopra un libro onesto."
    errors: [subjunctive-use]
  - tutor: "Un idraulico puntuale: questa sì che è una notizia. Ma torniamo un secondo indietro: «sebbene qualche luogo comune ha»? Quella congiunzione è esigente con il verbo che la segue."
    prompt: {text: "Sebbene qualche luogo comune ha", tags: [subjunctive-use]}
  - learner: "È vero, mi perdoni: sebbene qualche luogo comune abbia un fondo di verità."
  - tutor: "Ecco, ora la frase è degna del libro. Ci regali allora un episodio vero, uno di quelli che Le hanno fatto capire dove era finita."
    goals: [stereotype]
  - learner: "Il primo inverno mi ammalai, niente di grave. Tornando a casa dalla farmacia, trovai davanti alla porta una pentola di brodo. Era della signora del piano di sopra, a cui non avevo mai rivolto la parola. Quando andai a ringraziarla mi contestò: 'E che, ti lasciavo morire?'"
    errors: [false-friend]
  - tutor: "«E che, ti lasciavo morire?», Le rispose: in quella frase c'è un intero trattato di sociologia. Una pentola al posto di una presentazione. E l'italiano, la lingua intendo, che cosa ha cambiato in Lei?"
    recast: {text: "mi contestò", fix: "Le rispose", tags: [false-friend]}
    goals: [anecdote]
  - learner: "Mi ha resa più paziente con le sfumature. In spagnolo dico le cose in faccia; in italiano ho imparato il condizionale, il 'magari', il 'vediamo'. Credo di essere diventata più diplomatica, o forse soltanto più ambigua."
  - tutor: "Più diplomatica o più ambigua: è il dubbio di ogni italiano. Siamo quasi in chiusura: lasci ai nostri ascoltatori una frase da portarsi a casa."
    goals: [language]
  - learner: "Allora direi così: l'Italia non si capisce, si frequenta. E dopo dodici anni, io sto ancora chiedendo permesso."
  - tutor: "«Non si capisce, si frequenta»: gliela ruberò, citando la fonte. Grazie di essere stata con noi, e a voi che ascoltate buona lettura e buona serata."
    goals: [farewell]

- scenario: mediazione-colleghi
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Non mi disturba affatto, si sieda. Ho notato che ieri era molto silenziosa, e immagino che c'entri la presentazione. Mi racconti con calma, La ascolto."
  - tutor: "Grazie. Il fatto è che l'analisi dei dati l'ho fatta io, tre settimane di lavoro, e ieri il collega l'ha presentata come se fosse tutta sua. Non ha fatto nemmeno il mio nome."
    goals: [listen]
  - learner: "Capisco che Le abbia fatto male, e ha fatto bene a venire. Per avere il quadro completo: prima della riunione avevate deciso insieme chi avrebbe presentato? E lui Le ha detto qualcosa dopo?"
  - tutor: "Avevamo deciso che parlasse lui, questo sì, perché io ero in ferie fino a lunedì. Ma dopo non mi ha detto niente, come se fosse normale."
    goals: [clarify]
  - learner: "Grazie, questo mi aiuta. Non voglio giustificarlo, ma è possibile che non l'ha fatto apposta: mi aveva detto che aveva preparato le diapositive in una notte. Questo non toglie che il Suo nome doveva esserci."
    errors: [subjunctive-use]
  - tutor: "Scusi, «è possibile che non l'ha fatto apposta»? Lo dice come una certezza o come un'ipotesi? Perché per me cambia molto, e dal verbo non si capisce."
    prompt: {text: "è possibile che non l'ha fatto apposta", tags: [subjunctive-use]}
  - learner: "Come un'ipotesi, e ha ragione a chiedermelo: è possibile che non l'abbia fatto apposta. Non lo so, e glielo domanderò direttamente."
  - tutor: "Va bene, così mi è più chiaro. Può darsi che sia stata fretta e non cattiveria, glielo concedo. Ma la direzione adesso pensa che il lavoro sia suo."
    goals: [perspective]
  - learner: "Ed è questo che va corretto. Le propongo due cose: oggi stesso mando alla direzione una nota in cui faccio chiaro che l'analisi è Sua, e alla prossima riunione i risultati li presenta Lei. Poi, se vuole, ci sediamo tutti e tre per parlarne."
    errors: [word-choice]
  - tutor: "Se chiarisce alla direzione che l'analisi è mia, per me è già molto. E presentare io i risultati mi sembra giusto. L'incontro a tre lo accetto, purché ci sia anche lei. Grazie di avermi ascoltata."
    recast: {text: "faccio chiaro", fix: "chiarisce", tags: [word-choice]}
    goals: [solution]

- scenario: medico-specialista
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Non benissimo. Nelle ultime tre settimane ho sentito male due volte salendo le scale: una specie di peso al petto, che durava qualche minuto e passava da fermo."
    errors: [reflexive]
  - tutor: "Un peso al petto sotto sforzo, capisco. Mi faccia capire bene, però: «ho sentito male»? Se è stato Lei a stare male, a quel verbo manca qualcosa."
    prompt: {text: "ho sentito male", tags: [reflexive]}
  - learner: "Sì, esatto: mi sono sentito male due volte. Nessun dolore al braccio, ma un po' di fiato corto."
  - tutor: "Chiarissimo, grazie. Fiato corto e peso che passa a riposo: sono informazioni preziose. In famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Purtroppo sì. Mio padre ebbe un infarto a sessantadue anni e mio fratello maggiore porta un pacemaker da tre anni. Mia madre, invece, soffriva soltanto di pressione alta."
  - tutor: "Dunque in famiglia il cuore è un punto debole, e ne terremo conto. Veniamo agli esami: quello a riposo è normale, ma la prova da sforzo mostra che il cuore soffre quando i battiti aumentano."
    goals: [history]
  - learner: "Capisco. Ma in termini pratici che cosa significa? È una condizione severa, o qualcosa che si può tenere sotto controllo?"
    errors: [false-friend]
  - tutor: "Non è una condizione grave, se la affrontiamo adesso. Significa che una delle arterie del cuore probabilmente si è ristretta e fa arrivare meno sangue quando Lei si affatica. Per esserne certi serve un altro esame, un po' più approfondito."
    recast: {text: "severa", fix: "grave", tags: [false-friend]}
    goals: [understand]
  - learner: "Va bene, lo faremo. E nel frattempo? Mi prescriverà dei farmaci? Vorrei sapere se hanno effetti collaterali, perché mia moglie insiste perché io legga sempre il foglietto."
  - tutor: "Sua moglie ha ragione. Le prescrivo un'aspirina a basso dosaggio e un farmaco che rallenta il battito: nei primi giorni potrebbe sentirsi un po' stanco e avere le mani fredde. Se nota capogiri, mi chiami subito; intanto niente scale di corsa."
    goals: [treatment]

- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Un disastro dall'inizio alla fine. Stamattina non ha suonato la sveglia, perché ieri sera avevo dimenticato di mettere il telefono in carica. Sono uscita di corsa, e quando sono arrivata alla fermata l'autobus è già partito."
    errors: [tense-aspect]
  - tutor: "Cominciamo bene! Aspetta, però: quando sei arrivata «l'autobus è già partito»? Se era successo prima del tuo arrivo, il tempo giusto è un altro."
    prompt: {text: "l'autobus è già partito", tags: [tense-aspect]}
  - learner: "Era già partito, certo. Quindi ho preso un taxi, ho speso venti euro, e sono arrivata all'esame con mezz'ora di ritardo e senza la calcolatrice."
  - tutor: "Piove sempre sul bagnato, eh? E il professore come l'ha presa?"
    goals: [tell]
  - learner: "Malissimo. E hai ragione, piove sul bagnato: mentre ero dentro mi hanno pure messo una multa sul motorino, che avevo lasciato lì da ieri. Insomma, quella multa è stata la goccia che ha rotto la schiena del cammello."
    errors: [word-choice]
  - tutor: "Povero cammello! Da noi è la goccia che ha fatto traboccare il vaso, e il tuo oggi era bello pieno. Ma di chi è la colpa, scusa: della sveglia, dell'autobus o di qualcun altro?"
    recast: {text: "la goccia che ha rotto la schiena del cammello", fix: "la goccia che ha fatto traboccare il vaso", tags: [word-choice]}
    goals: [react]
  - learner: "Onestamente? Un po' della sfortuna, ma soprattutto è la mia colpa. Il telefono potevo caricarlo, la calcolatrice potevo prepararla la sera prima. Il professore è stato duro, però non ha tutti i torti."
    errors: [possessive]
  - tutor: "Brava, ci vuole coraggio per dirlo. Solo che «è la mia colpa» suona tradotto: noi lo diciamo più corto, e con le parole in un altro ordine."
    prompt: {text: "è la mia colpa", tags: [possessive]}
  - learner: "È colpa mia! Ecco, l'ho detto due volte, così vale doppio."
  - tutor: "Adesso sì che sembri una di noi. E da tutta questa giornataccia che cosa ti porti a casa?"
    goals: [blame]
  - learner: "Che chi ben comincia è a metà dell'opera, e io ho cominciato malissimo. Da stasera telefono in carica, zaino pronto e due sveglie. E il motorino lo parcheggio dove si può."
  - tutor: "Chi ben comincia è a metà dell'opera: proverbio perfetto, e usato a proposito. Dai, da bere offro io, che dopo una giornata così te lo sei guadagnato."
    goals: [moral]

- scenario: notizie-attualita
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "L'ho vista, sì. In pratica: massimo novanta notti l'anno per gli affitti ai turisti, e ogni casa deve avere un codice. Chi non ce l'ha, paga la multa."
  - tutor: "Preciso come una ricetta. E tu come la vedi? Perché qui in ufficio c'è chi festeggia e chi parla di rapina."
    goals: [summarise]
  - learner: "Io la vedo bene, con qualche dubbio. A Bologna un cuoco giovane non trova casa, e senza cuochi i ristoranti chiudono. Però non mi fido in una legge che nessuno controlla."
    errors: [preposition]
  - tutor: "Senza cuochi siamo rovinati, hai ragione. Ma «non mi fido in una legge»? Con quel verbo la preposizione è un'altra."
    prompt: {text: "non mi fido in una legge", tags: [preposition]}
  - learner: "Non mi fido di una legge che nessuno controlla."
  - tutor: "Così va bene, e nemmeno io, guarda. Hai letto come l'hanno raccontata i giornali? Io ne ho visti tre e sembravano tre leggi diverse."
    goals: [opinion]
  - learner: "Ho letto due. Uno diceva che è una vittoria per le famiglie. L'altro diceva che lo Stato ruba ai proprietari. Nessuno dei due spiegava i numeri."
    errors: [ci-ne]
  - tutor: "Tipico: tante parole grosse e pochi numeri. Però «ho letto due»? Due di che cosa? In italiano c'è una parolina che lì non si può lasciare fuori."
    prompt: {text: "Ho letto due", tags: [ci-ne]}
  - learner: "Ho letto due di loro."
    errors: [ci-ne]
  - tutor: "Si capisce, ma noi diremmo: ne ho letti due. E se erano così diversi, capisci perché non mi fido dei titoli. Secondo te, alla fine, che cosa cambierà davvero?"
    recast: {text: "Ho letto due di loro", fix: "ne ho letti due", tags: [ci-ne]}
    goals: [sources]
  - learner: "Poco, all'inizio. Qualche proprietario venderà, altri affitteranno in nero. Se il Comune fa i controlli, tra due anni ci saranno più case per chi lavora. Se no, resta tutto uguale."
  - tutor: "Analisi asciutta, e temo giusta: tutto dipende dai controlli. Tra due anni ne riparliamo, e se hai avuto ragione il caffè lo pago io."
    goals: [consequences]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Vorremmo una cosa semplice ma fatta bene: una cerimonia all'aperto in Abruzzo, nel paese dei miei nonni, con un'ottantina di invitati. Metà arrivano dal Canada, quindi ci teniamo che si sentano a casa."
  - tutor: "Un matrimonio nel paese dei nonni: è un'idea bellissima, e gli ospiti canadesi se ne ricorderanno a lungo. Avete già pensato a una cifra complessiva?"
    goals: [vision]
  - learner: "Sì, non vorremmo superare i trentamila euro, tutto compreso. Se ci fossero spese extra, preferirei che Lei ce le dice prima, non a cose fatte."
    errors: [subjunctive-use]
  - tutor: "Trentamila per ottanta persone è una base realistica. E sulla chiarezza ha ragione; solo, «preferirei che Lei ce le dice»? Dopo quel condizionale il verbo vuole un'altra forma."
    prompt: {text: "preferirei che Lei ce le dice", tags: [subjunctive-use]}
  - learner: "Preferirei che Lei ce le dica... no, aspetti: che ce le dicesse prima."
  - tutor: "Benissimo, la seconda è quella giusta, e così farò: ogni preventivo ve lo mando per iscritto. Ora, per il ricevimento ho due proposte: un agriturismo con vista sulle montagne oppure un palazzo storico in paese."
    goals: [budget]
  - learner: "Mi piacciono tutti e due. L'agriturismo è più vicino all'idea che avevamo, però ho paura della pioggia; il palazzo è elegante, ma forse un po' freddo. Direi l'agriturismo, se ha una sala al coperto. Stasera ne parlo con la mia fidanzata e domani Le lo confermo."
    errors: [combined-pronouns]
  - tutor: "La sala al coperto c'è, e tiene cento persone. Aspetto volentieri fino a domani; ma «Le lo confermo»? Quei due pronomi, messi vicini, diventano una parola sola."
    prompt: {text: "Le lo confermo", tags: [combined-pronouns]}
  - learner: "Glielo confermo domani. Promesso."
  - tutor: "Perfetto, allora blocco la data all'agriturismo fino a domani sera. C'è qualche condizione a cui tenete in modo particolare?"
    goals: [choices]
  - learner: "Due. Primo: vorrei che il menù fosse abruzzese, con i prodotti del posto, non il solito menù da matrimonio. Secondo: pagheremmo un acconto del venti per cento adesso e il resto solo dopo la festa."
  - tutor: "Accolte tutte e due: menù del territorio, e saldo a festa conclusa, come è giusto. Vi preparo il contratto entro venerdì; intanto dica a sua nonna che la pasta fatta in casa non mancherà."
    goals: [conditions]

- scenario: poesia-montale
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una sensazione di secchezza, direi, quasi fisica. Non c'è niente di consolante: il male non viene spiegato, viene soltanto incontrato, come si incontra qualcuno per strada. Mi ha colpita che una poesia così breve pesi tanto."
  - tutor: "«Incontrato come qualcuno per strada»: ha colto il verbo decisivo. Scelga adesso un'immagine sola, e proviamo a guardarla da vicino."
    goals: [first-reading]
  - learner: "Sceglierei il rivo strozzato che gorgoglia. È un'immagine in che l'acqua, che di solito è vita, viene soffocata: non scorre, si lamenta. E 'strozzato' è una parola violenta, da cronaca, non da poesia."
    errors: [relative-pronoun]
  - tutor: "Ottima scelta, e quello che dice su «strozzato» è molto giusto. Rilegga solo l'inizio: un'immagine «in che» l'acqua viene soffocata? Dopo la preposizione serve un altro relativo."
    prompt: {text: "in che", tags: [relative-pronoun]}
  - learner: "Un'immagine in cui l'acqua viene soffocata. Grazie, lo sbaglio sempre quando sono concentrata sul contenuto."
  - tutor: "Succede proprio allora. E il suono? Provi a dire che cosa sente, leggendo ad alta voce quei tre esempi del male."
    goals: [image]
  - learner: "Sento molte consonanti dure, che si urtano: 'strozzato', 'gorgoglia', 'incartocciarsi', 'stramazzato'. Sono parole ruvide, piene di erre e di zeta. Leggendoli, i versi fanno fatica a uscire dalla bocca, e credo che Montale lo faccia in proposito."
    errors: [preposition]
  - tutor: "Le erre e le zeta, esattamente: la lingua inciampa perché il male è un inciampo. Solo un particolare: lo fa «in proposito»? L'espressione esiste, ma comincia con un'altra preposizione."
    prompt: {text: "in proposito", tags: [preposition]}
  - learner: "Di proposito, certo. Lo fa di proposito, e nella seconda strofa invece il ritmo si distende, quando compare la divina Indifferenza."
  - tutor: "Esatto, e ha già notato da sola il cambio di passo della seconda strofa. Tiriamo allora le fila: che cosa ci dice, nell'insieme, questa poesia?"
    goals: [sound]
  - learner: "Che il male di vivere è dappertutto, nelle cose più piccole, e che non esiste un rimedio vero. L'unico bene possibile è il distacco: la statua, la nuvola, il falco, che stanno in alto e non partecipano. Non è una consolazione, è una tregua."
  - tutor: "«Non è una consolazione, è una tregua»: non avrei saputo dirlo meglio, e lo userò a lezione. La settimana prossima vedremo se questa tregua regge anche nelle poesie più tarde."
    goals: [meaning]

- scenario: politica-lavoro
  level: C2
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che esageri, Riccardo, come sempre. Spariranno dei compiti, non dei lavori interi. Un contabile non scomparirà: farà meno conti e più consulenza. Il problema vero è chi paga la formazione."
  - tutor: "Come sempre, addirittura! Va bene, ammettiamo. Ma se domani le macchine facessero davvero tutto, tu che mondo ti immagini?"
    goals: [opinion]
  - learner: "Se le macchine farebbero tutto, il lavoro non sarebbe più il centro della vita. Forse lavoreremmo tre giorni alla settimana, e gli altri quattro li dedicheremmo a quello che ci piace."
    errors: [hypothetical]
  - tutor: "Tre giorni di lavoro: firmo subito. Ma «se le macchine farebbero»? Te l'avevo servita su un piatto d'argento, quell'ipotesi."
    prompt: {text: "Se le macchine farebbero", tags: [hypothetical]}
  - learner: "È vero, l'avevi appena detta tu! Se le macchine facessero tutto, lavoreremmo tre giorni alla settimana."
  - tutor: "Ecco. Bello, sulla carta. Ma hai un esempio concreto, qualcosa che esiste già e non un sogno?"
    goals: [hypothesis]
  - learner: "Sì: il supermercato sotto casa mia a Siviglia. Hanno messo le casse automatiche, e tutti pensavano ai licenziamenti. Invece le cassiere adesso attendono i clienti che comprano online e preparano gli ordini, e ne hanno assunte due in più. Il lavoro si è spostato, non è sparito."
    errors: [false-friend]
  - tutor: "Quindi adesso seguono i clienti online invece di stare alla cassa: questo è un esempio che regge, lo ammetto. Però un supermercato non fa primavera."
    recast: {text: "attendono i clienti", fix: "seguono i clienti", tags: [false-friend]}
    goals: [example]
  - learner: "Lo so, uno non basta. Allora riassumo: io credo che il lavoro cambi forma e che il rischio vero sia per chi non può formarsi. Tu sei più pessimista. Ma dimmi la verità: tu che cosa faresti, se fossi al governo?"
  - tutor: "Io? Tasserei i robot e pagherei i corsi a tutti, cuochi compresi. Vedi che alla fine siamo meno lontani di quanto sembra: tu ci metti la speranza, io il conto."
    goals: [conclude]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Scannando? Spero che sia un modo di dire, perché vedo solo forchette. Immagino voglia dire che litigano di brutto, giusto? Comunque per una lasagna così litigherei anch'io."
  - tutor: "Giusto, nessun ferito: è solo che in questa casa per la lasagna si venderebbe la nonna. Dai, raccontaci com'è andato il viaggio, che tu ne hai sempre una."
    goals: [react]
  - learner: "Stavolta è andato liscio come l'olio, incredibile. L'ultima volta invece avevo perso il treno, la coincidenza e pure il portafoglio: non c'è due senza tre. Ho portato una bottiglia dall'Irlanda per tuo padre. Anzi, gli la do io direttamente."
    errors: [combined-pronouns]
  - tutor: "Liscio come l'olio e non c'è due senza tre: due su due, complimenti. La bottiglia però «gli la» dai? Quei due pronomi insieme fanno una parola sola."
    prompt: {text: "gli la", tags: [combined-pronouns]}
  - learner: "Gliela do io! Scusa, è la fame che mi mangia le sillabe."
  - tutor: "Gliela darai dopo il caffè, che adesso ha la bocca piena. E dimmi, in Irlanda ce l'avete un modo di dire come piove sul bagnato?"
    goals: [use-idiom]
  - learner: "Più o meno. Noi diciamo 'when it rains, it pours': quando piove, diluvia. Però il vostro è più cattivo, perché parla di chi è già bagnato. E poi voi dite 'in bocca al lupo', noi 'break a leg', rompiti una gamba. Nessuno dei due fa senso, se ne pensi."
    errors: [word-choice, ci-ne]
  - tutor: "Tra lupi e gambe rotte, che auguri da paura! Ma «se ne pensi»? Quando si pensa a qualcosa, la parolina giusta è un'altra."
    prompt: {text: "se ne pensi", tags: [ci-ne]}
  - learner: "Se ci pensi. Se ci pensi, nessuno dei due ha molto senso."
  - tutor: "Ecco, così. E hai ragione: gli auguri più belli sono quelli più assurdi. Ma tu una storia con la morale ce l'hai sempre: sentiamo quella di oggi."
    goals: [compare]
  - learner: "Va bene. A Dublino, anni fa, ho comprato una bici usata da uno che aveva molta fretta di venderla. Bellissima, quasi regalata. Dopo due giorni mi ferma la polizia: era rubata. Ho perso la bici e i soldi. Mio nonno aveva ragione: chi troppo vuole nulla stringe."
  - tutor: "Chi troppo vuole nulla stringe: ci sta a pennello, e tuo nonno la sapeva lunga. Vieni, che per premio l'ultima lasagna è tua, prima che ricomincino a litigare."
    goals: [anecdote]

- scenario: presentazione-progetto
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo. In breve: proponiamo un servizio di assistenza clienti via chat, attivo ventiquattr'ore su ventiquattro. Oggi rispondiamo in media in due giorni; l'obiettivo è scendere sotto le due ore."
  - tutor: "Due ore invece di due giorni: ambizioso. Ma a me interessano i numeri. Che cosa ci guadagna l'azienda?"
    goals: [pitch]
  - learner: "Tre cose. Secondo le nostre stime, i reclami calerebbero del trenta per cento e i clienti che rinnovano il contratto salirebbero dal sessanta al settanta per cento. Inoltre risparmieremmo circa ottantamila euro l'anno sul centro chiamate. Sono numeri basati su un test che abbiamo corso per tre mesi."
    errors: [word-choice]
  - tutor: "Un test condotto per tre mesi è già qualcosa, e il trenta per cento in meno di reclami mi interessa. Ma duecentomila euro di investimento sono tanti. Se il sistema non funziona, chi ne risponde?"
    recast: {text: "corso", fix: "condotto", tags: [word-choice]}
    goals: [benefits]
  - learner: "È una preoccupazione legittima. Per questo proponiamo di partire con una fase pilota su un solo mercato, con un costo di quarantamila euro. Se i risultati non sarebbero in linea con le stime, ci fermeremmo lì senza altre spese."
    errors: [hypothetical]
  - tutor: "Una fase pilota mi tranquillizza. Però, mi scusi: «se i risultati non sarebbero in linea»? In un documento per la direzione quella frase non passerebbe."
    prompt: {text: "Se i risultati non sarebbero in linea", tags: [hypothetical]}
  - learner: "Ha ragione. Se i risultati non fossero in linea con le stime, ci fermeremmo lì senza altre spese."
  - tutor: "Così sì. Quarantamila euro e un'uscita chiara: questo lo posso difendere. Che cosa Le serve da me, e per quando?"
    goals: [objection]
  - learner: "Mi servirebbe la Sua approvazione per la fase pilota entro fine mese, e una persona dell'informatica a metà tempo. Io Le presento i primi dati tra novanta giorni, perché possa decidere sul resto."
  - tutor: "D'accordo: mi mandi entro venerdì una pagina con costi e tempi, e la porto al comitato di lunedì. Ci rivediamo tra novanta giorni con i dati; e complimenti, sono stati dieci minuti spesi bene."
    goals: [next-steps]

- scenario: recensione-ristorante
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera, grazie di essere venuto. Sì, purtroppo. Non amo lamentarmi, ma stasera il servizio è stato molto al di sotto di quello che ci si aspetta da un locale come il vostro."
  - tutor: "Mi dispiace sentirlo, e La ringrazio di dirmelo di persona. Mi racconti che cosa è successo, esattamente."
    goals: [complain]
  - learner: "Abbiamo aspettato quasi un'ora tra l'antipasto e il primo, senza che nessuno ci desse una spiegazione. Poi il risotto è arrivato tiepido, e il cameriere, quando gliel'ho fatto notare, mi ha risposto che in cucina c'era 'un casino'. Tutto questo per il compleanno di mio marito."
  - tutor: "Un'ora di attesa e una risposta del genere non sono accettabili, e me ne scuso. Posso chiederLe che cosa si aspettava, prenotando da noi per un'occasione così?"
    goals: [detail]
  - learner: "Mi aspettavo un po' di attenzione, niente di straordinario. Quando ho prenotato ho avvisato che era una serata speciale. Mi sarebbe piaciuto che qualcuno ci avvisava del ritardo, o almeno che si scusava."
    errors: [subjunctive-use]
  - tutor: "Ha perfettamente ragione, era il minimo. Mi permetta solo di capire bene: «mi sarebbe piaciuto che qualcuno ci avvisava»? Dopo quel condizionale mi aspetterei un altro modo."
    prompt: {text: "Mi sarebbe piaciuto che qualcuno ci avvisava", tags: [subjunctive-use]}
  - learner: "Sì, mi scusi: mi sarebbe piaciuto che qualcuno ci avvisasse del ritardo, o almeno che si scusasse."
  - tutor: "Ed è proprio quello che avremmo dovuto fare. Per rimediare, vorrei offrirvi il dolce e una bottiglia di spumante, e togliere i primi dal conto."
    goals: [expectation]
  - learner: "La ringrazio, è un gesto corretto e lo accetto. Non pretendo di far licenziare nessuno, sia chiaro. Però mi importa che parli con il cameriere: la cucina può avere una serata difficile, ma al cliente si risponde in un altro modo."
    errors: [false-friend]
  - tutor: "Ho capito bene che non intende far licenziare nessuno, e La ringrazio anche di questo. Con il cameriere parlerò stasera stessa. Vi faccio portare subito il dolce, e auguri a Suo marito da parte di tutti noi."
    recast: {text: "Non pretendo di", fix: "non intende", tags: [false-friend]}
    goals: [resolve]

- scenario: reclamo-comune
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Abito in via dei Mille, al numero 14. Due mesi fa la strada è stata scavata per sostituire una tubatura, e da allora il cantiere è stato abbandonato: c'è una buca di tre metri, chiusa male, e di notte manca qualsiasi illuminazione."
  - tutor: "Capisco. Purtroppo i lavori dipendono dall'azienda dell'acqua, non direttamente dal Comune. Si sta valutando la situazione e si interverrà appena possibile."
    goals: [describe]
  - learner: "Con rispetto, 'appena possibile' me l'hanno già detto un mese fa, per telefono. Nel frattempo la situazione ha peggiorato: una signora anziana è caduta e con la pioggia la buca si riempie d'acqua. Devo insistere: mi serve una data, o almeno il nome di un responsabile."
    errors: [auxiliary-choice]
  - tutor: "Mi dispiace per la signora, e ne prendo nota. Per la precisione, però: la situazione «ha peggiorato»? Quando una cosa cambia da sola, quel verbo vuole l'altro ausiliare."
    prompt: {text: "ha peggiorato", tags: [auxiliary-choice]}
  - learner: "Giusto: la situazione è peggiorata. E resto in attesa della data."
  - tutor: "Esatto. Una data oggi non sono in grado di dargliela, ma capisco che una risposta vaga non Le basti. Può presentare un reclamo formale."
    goals: [insist]
  - learner: "È quello che intendo fare. Come funziona la procedura? Entro quanto tempo il Comune è tenuto a rispondere, e che cosa posso fare se la risposta non arriva? Vorrei anche sapere se sono intitolato a vedere gli atti del cantiere."
    errors: [false-friend]
  - tutor: "Il reclamo si presenta qui, per iscritto, e viene registrato subito. L'amministrazione deve rispondere entro trenta giorni; se non lo fa, ci si può rivolgere al difensore civico. E sì, come residente ha diritto di vedere gli atti."
    recast: {text: "sono intitolato a", fix: "ha diritto di", tags: [false-friend]}
    goals: [rights]
  - learner: "Bene, allora lo presento adesso. Le chiedo però due cose: il numero della pratica, e che la segnalazione sulla sicurezza sia girata oggi stesso alla polizia locale, perché quella buca è un pericolo per tutti."
  - tutor: "Ecco il modulo. Il numero della pratica glielo do appena firmato, e la segnalazione parte oggi alla polizia locale: entro quarantotto ore la buca verrà chiusa meglio e sarà messa una luce. Questo glielo posso garantire."
    goals: [commitment]

- scenario: riunione-lavoro
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Il sito nuovo è quasi pronto: le pagine principali sono finite e ieri abbiamo cominciato le prove con i clienti. Se tutto va liscio, la parte dei pagamenti rimanerà l'unica cosa da finire."
    errors: [future-form]
  - tutor: "Ottimo, sei più avanti di quanto pensassi. Solo una cosa: «rimanerà»? Quel futuro è irregolare, perde un pezzo per strada."
    prompt: {text: "rimanerà", tags: [future-form]}
  - learner: "Rimarrà! Rimarrà solo la parte dei pagamenti."
  - tutor: "Proprio così. E su quella parte come siamo messi? Hai l'aria di chi sta per darmi una brutta notizia."
    goals: [update]
  - learner: "Eh, un po' sì. Il fornitore del sistema di pagamento ci aveva promesso la documentazione per lunedì e non è arrivato niente. Gli ho scritto due volte. Senza quella non possiamo fare i test, e ho paura che ci stiano tirando la gamba."
    errors: [word-choice]
  - tutor: "Se ci stanno prendendo in giro lo scopriamo presto: oggi li chiamo io. Ma non possiamo restare appesi a loro. Tu che cosa proporresti?"
    recast: {text: "tirando la gamba", fix: "prendendo in giro", tags: [word-choice]}
    goals: [problem]
  - learner: "Avrei due idee. La prima: gli diamo tempo fino a mercoledì, poi passiamo all'altro fornitore, che costa un po' di più ma ha tutto online. La seconda: intanto lanciamo il sito senza i pagamenti, solo con il catalogo, e li aggiungiamo dopo."
  - tutor: "La seconda mi piace: usciamo con il catalogo e non perdiamo la faccia. Sul fornitore, mercoledì mi sembra giusto. Quando pensi di poter lanciare, allora?"
    goals: [proposal]
  - learner: "Con solo il catalogo, direi il quindici. Mi servono ancora quattro giorni per correggere quello che esce dalle prove. Se poi mercoledì cambiamo fornitore, i pagamenti saranno pronti per fine mese."
  - tutor: "Allora segno: catalogo online il quindici, pagamenti entro il trenta. Mercoledì ci aggiorniamo cinque minuti sul fornitore. Bel lavoro, davvero."
    goals: [deadline]

- scenario: seminario-etica
  level: C2
  persona: es-f-teacher
  history: [hypothetical]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Grazie, professore, dubiti pure. Preciso la tesi: sostengo che una macchina non può essere moralmente responsabile perché la responsabilità presuppone la capacità di comprendere le ragioni dei propri atti, e non soltanto di produrli."
  - tutor: "Comprendere le ragioni: sono parole che pesano molto. Su quale differenza le fonda? Perché anche un termostato, a suo modo, risponde a qualcosa che succede intorno a lui."
    goals: [thesis]
  - learner: "Distinguerei tra causare e rispondere. Un termostato causa un effetto; una persona risponde di ciò che fa, cioè può essere chiamata a giustificarsi davanti ad altri. La responsabilità morale appartiene al secondo piano. Una macchina può essere causa di un danno, ma non ha senso chiederle conto, come non lo si chiede a un terremoto."
  - tutor: "Causare e rispondere: distinzione pulita. Ma le obietto questo: se una macchina fosse in grado di spiegare le proprie scelte, di correggersi e perfino di scusarsi, in che cosa sarebbe diversa da noi?"
    goals: [distinguish]
  - learner: "Sarebbe diversa perché spiegare non equivale a comprendere. Se una macchina produrrebbe una giustificazione perfetta, avremmo un testo, non una coscienza. Si scambierebbe la descrizione di una ragione per il possesso di essa."
    errors: [hypothetical]
  - tutor: "L'argomento è interessante, ma la forma lo tradisce: «se una macchina produrrebbe»? In un periodo ipotetico, dottoressa, quella parte della frase chiede un altro modo."
    prompt: {text: "Se una macchina produrrebbe", tags: [hypothetical]}
  - learner: "Ha ragione, mi correggo: se una macchina producesse una giustificazione perfetta, avremmo un testo, non una coscienza."
  - tutor: "Ora regge anche la grammatica. Tuttavia noi stessi attribuiamo la comprensione agli altri solo dal loro comportamento: non vediamo mai la coscienza di nessuno. Non sta usando due pesi e due misure?"
    goals: [objection]
  - learner: "Questo punto glielo concedo: non abbiamo un accesso diretto alla coscienza altrui, e dopo un così largo dibattito filosofico nessuno ha trovato un criterio sicuro. Però la tesi resta in piedi in forma più modesta: finché non abbiamo ragioni per attribuire comprensione a una macchina, la responsabilità rimane a chi la progetta e la usa."
    errors: [false-friend]
  - tutor: "Dopo un dibattito così lungo, in effetti, il criterio sicuro manca ancora, e apprezzo che lo riconosca. La versione modesta è più solida di quella iniziale. Provi allora a chiudere: una sola frase, rigorosa."
    recast: {text: "così largo dibattito", fix: "dibattito così lungo", tags: [false-friend]}
    goals: [concede]
  - learner: "Concluderei così: allo stato attuale delle nostre conoscenze, la responsabilità morale va attribuita agli esseri umani che progettano e impiegano le macchine; resta aperta, ma non dimostrata, la possibilità che un giorno la si debba estendere."
  - tutor: "Aperta ma non dimostrata: è una conclusione onesta, e più forte proprio perché più cauta. La metta per iscritto così; giovedì toccherà a lei fare l'avvocato del diavolo con i suoi colleghi."
    goals: [conclude]

- scenario: smartworking
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Un po' e un po'. Lavoro per una rivista online, quindi in teoria potrei stare dovunque. In pratica vado in redazione due giorni alla settimana e gli altri tre lavoro da casa, o da un bar se a casa non combino niente."
  - tutor: "Il bar come ufficio: ti invidio. E a conti fatti ti trovi bene così?"
    goals: [situation]
  - learner: "Molto. Il vantaggio più grande è il tempo: non perdo un'ora e mezza sui mezzi, e quando scrivo ho bisogno di silenzio. Onestamente sono più produttivo a casa di in ufficio, dove c'è sempre qualcuno che ti chiede 'hai un minuto?'."
    errors: [comparative]
  - tutor: "Il famoso minuto che dura mezz'ora, lo conosco. Però «più produttivo a casa di in ufficio»? Quando metti a confronto due luoghi così, la parola in mezzo cambia."
    prompt: {text: "a casa di in ufficio", tags: [comparative]}
  - learner: "Più produttivo a casa che in ufficio. Giusto, 'di' davanti a un'altra preposizione suona malissimo."
  - tutor: "Esatto, l'hai sentito da solo. Ma ci sarà pure un rovescio della medaglia, no?"
    goals: [pros]
  - learner: "Eccome. Certi giorni non parlo con nessuno fino a sera, e alle sei mi accorgo che sono ancora in pigiama. E poi manco le chiacchiere alla macchinetta: le idee migliori per gli articoli mi sono sempre venute lì."
    errors: [piacere]
  - tutor: "Il pigiama alle sei, che quadretto. Ma «manco le chiacchiere»? Così sembra che tu le salti: quel verbo funziona al contrario dell'inglese, un po' come piacere."
    prompt: {text: "manco le chiacchiere", tags: [piacere]}
  - learner: "Mi manca le chiacchiere... no?"
    errors: [piacere]
  - tutor: "Quasi: le chiacchiere sono tante, quindi mi mancano le chiacchiere. E ti capisco: a me mancano perfino le lamentele dei colleghi. Se potessi scegliere tu, senza regole, che cosa faresti?"
    recast: {text: "Mi manca le chiacchiere", fix: "mi mancano le chiacchiere", tags: [piacere]}
    goals: [cons]
  - learner: "Terrei la formula mista, ma al contrario: tre giorni in redazione e due a casa. Scriverei a casa e userei l'ufficio per le riunioni e per rubare idee ai colleghi. Tutto da casa no: diventerei un orso."
  - tutor: "Tre e due, con l'ufficio per le idee e la casa per scrivere: mi sembra la ricetta giusta. Intanto oggi niente pigiama, quindi brindiamo a questo."
    goals: [preference]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Ahia. Temo che ti riferisci alla scena del funerale. È il passaggio che mi ha fatto più penare: lui scrive frasi cortissime, quasi sgarbate, e in italiano mi sembravano telegrammi. Così le ho legate un po'."
    errors: [subjunctive-use]
  - tutor: "Indovinato al primo colpo. Ma senti: «temo che ti riferisci»? Una traduttrice che ha paura di qualcosa lo dice con un altro modo del verbo."
    prompt: {text: "Temo che ti riferisci", tags: [subjunctive-use]}
  - learner: "Temo che tu ti riferisca alla scena del funerale. Ecco, peggio di così la giornata non poteva cominciare."
  - tutor: "Su, è cominciata benissimo: ti sei corretta da sola. Torniamo ai telegrammi: l'autore è sgarbato apposta, e tu me l'hai fatto diventare un signore. Che alternative hai considerato?"
    goals: [problem]
  - learner: "Due. La prima è tenere le frasi spezzate come sono: 'Pioveva. Nessuno parlava. La bara era piccola.' È fedele, ma rischia di sembrare una lista. La seconda è quella che ho scelto: unire con qualche virgola e un 'mentre', che dà più respiro ma, lo ammetto, toglie i pugni."
  - tutor: "«Toglie i pugni»: l'hai detto tu, non io. In italiano il punto fermo sa picchiare quanto in inglese, basta fidarsi. E a pagina quarantadue, quel «patetico» riferito al padre?"
    goals: [options]
  - learner: "L'originale dice 'pathetic'. Ho messo 'patetico' perché... okay, mentre lo dico lo capisco. In inglese è uno che fa pena e un po' schifo; 'patetico' in italiano è più commovente, quasi teatrale. Avrei dovuto mettere 'penoso', o 'che faceva pena'."
  - tutor: "Ci sei arrivata da sola, ed è la cosa che conta: i falsi amici si riconoscono dicendoli ad alta voce. «Penoso» mi piace. Allora, come chiudiamo la scena del funerale?"
    goals: [false-friend]
  - learner: "Torno alle frasi corte. Se le avrei lasciate così dall'inizio, mi sarei risparmiata una notte di lavoro. Tengo solo un 'mentre', nell'ultima riga, dove l'autore stesso rallenta."
    errors: [hypothetical]
  - tutor: "Decisione giusta, e quel «mentre» finale te lo concedo. Però «se le avrei lasciate»? Non farmelo trovare in una bozza, ti prego."
    prompt: {text: "Se le avrei lasciate", tags: [hypothetical]}
  - learner: "Se le avessi lasciate così dall'inizio, mi sarei risparmiata una notte di lavoro. Meno male che l'ho detto a voce e non per iscritto."
  - tutor: "Ecco, così possiamo andare in stampa. Frasi corte, «penoso» al posto di «patetico» e un solo «mentre» in fondo: rimandami il capitolo entro giovedì, che stavolta sarà l'autore a parlare."
    goals: [decide]

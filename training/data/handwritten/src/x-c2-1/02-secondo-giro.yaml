- scenario: colloquio-promozione
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Vorrei fare il punto sul mio ultimo anno. La campagna d'autunno ha portato il venti per cento di contatti in più, e il lancio della nuova linea è stato chiuso con due settimane di anticipo e spendendo meno del previsto."
  - tutor: "Sono numeri che conosco e che apprezzo, il lancio in particolare. Immagino però che non sia venuta solo per ricordarmeli."
    goals: [results]
  - learner: "No, infatti. Da un anno faccio di fatto il lavoro di una responsabile senza averne il titolo. Credo che è arrivato il momento di parlare di una promozione, con un adeguamento dello stipendio."
    errors: [subjunctive-use]
  - tutor: "Apprezzo la franchezza. Prima di risponderle, una nota: «credo che è arrivato»? In una richiesta così importante quel verbo merita un altro modo."
    prompt: {text: "Credo che è arrivato", tags: [subjunctive-use]}
  - learner: "Giusto, la forma conta: credo che sia arrivato il momento di parlare di una promozione."
  - tutor: "Così è impeccabile. Nel merito: il suo lavoro è eccellente, ma il budget del personale per quest'anno è già stato assegnato. E qualcuno potrebbe obiettare che guida il gruppo da troppo poco tempo."
    goals: [request]
  - learner: "Capisco il vincolo del budget, ma sulla seconda obiezione non sono d'accordo. In dodici mesi ho gestito cinque persone e due fornitori, e nessun progetto ha mancato la scadenza. Ho preferito far parlare i fatti, invece di chiedere un riconoscimento a ogni risultato."
    errors: [word-choice]
  - tutor: "È vero, tutti i progetti hanno rispettato le scadenze, e i fatti parlano in suo favore. Sul merito mi ha convinto. Resta il nodo dei tempi: come pensa che potremmo procedere?"
    recast: {text: "nessun progetto ha mancato la scadenza", fix: "tutti i progetti hanno rispettato le scadenze", tags: [word-choice]}
    goals: [handle]
  - learner: "Le proporrei questo: il titolo da subito, perché non costa nulla e mi dà autorevolezza con i fornitori; l'aumento dal prossimo semestre, quando si riapre il budget. Vorrei però che fosse messo per iscritto."
  - tutor: "Mi sembra ragionevole e lo porto in direzione giovedì. Entro fine mese le faccio avere una proposta scritta con il titolo e la data dell'aumento. E complimenti: ha negoziato come gestisce i progetti."
    goals: [next-steps]

- scenario: condoglianze
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non si doveva disturbare, con tutto il lavoro che ha."
  - learner: "Nessun disturbo. Ci tenevo a venire di persona. Le faccio le mie più sentite condoglianze, a Lei e a tutta la famiglia."
  - tutor: "La ringrazio. Mamma se n'è andata nel sonno, senza soffrire, ed è l'unica consolazione. Lei l'aveva conosciuta, se non sbaglio."
    goals: [condolences]
  - learner: "Sì, alla festa del ristorante, due anni fa. Ha assaggiato il mio ragù e mi ha detto, molto seria, che mancava il sale. Aveva ragione. Era una signora con molto carattere, e mi sono rimasto con un bel ricordo."
    errors: [reflexive]
  - tutor: "Il sale, sì, lo rimproverava a tutti. Ma mi scusi, come ha detto alla fine: «mi sono rimasto con un bel ricordo»? Me lo ripeta, per favore, che ci tengo a sentirlo bene."
    prompt: {text: "mi sono rimasto con un bel ricordo", tags: [reflexive]}
  - learner: "Mi scusi Lei. Volevo dire che di Sua madre mi è rimasto un bel ricordo."
  - tutor: "Ecco, grazie: mi fa bene sentirlo. In questi giorni la casa è piena di gente e di cose da sbrigare, e io non so da che parte cominciare."
    goals: [memory]
  - learner: "Se posso essere utile, me lo dica. Per il pranzo dopo il funerale posso cucinare io, senza problemi. E non si preoccupa per il lavoro: i turni li copriamo noi."
    errors: [imperative-form]
  - tutor: "È molto gentile, e il pranzo lo accetto volentieri. Solo, mi perdoni: «non si preoccupa»? Detto a me, come invito, quel verbo dovrebbe suonare diverso."
    prompt: {text: "non si preoccupa", tags: [imperative-form]}
  - learner: "Ha ragione: non si preoccupi per il lavoro. Pensi solo alla Sua famiglia."
  - tutor: "Grazie, così farò. Sapere che in cucina ci siete voi mi toglie un peso."
    goals: [offer-help]
  - learner: "Adesso La lascio riposare. Ci vediamo domani in chiesa. Se ha bisogno, a qualsiasi ora, mi chiami."
  - tutor: "Lo farò. Grazie ancora della visita e delle parole: a mamma avrebbe fatto piacere. A domani, e saluti i colleghi da parte mia."
    goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Macché, ho capito sì e no una parola su tre! Ridevo per la musica, più che altro. Ho notato che tagliano la fine delle parole e che tutto sembra una domanda, anche quando non lo è."
  - tutor: "Orecchio fino: le vocali finali da noi si spengono, e la melodia fa il resto. Dove l'hai allenato, quest'orecchio?"
    goals: [notice]
  - learner: "In giro: sei mesi a Torino, poi Bologna, e adesso scendo a Napoli. A proposito, quei due continuavano a dire 'mo'. Di dove viene questa parola da?"
    errors: [question-form]
  - tutor: "Bella domanda, anche se l'hai chiusa all'inglese: «di dove viene questa parola da»? In italiano la preposizione sta in un posto solo: prova a rifarla."
    prompt: {text: "Di dove viene questa parola da", tags: [question-form]}
  - learner: "Ah, certo: da dove viene questa parola?"
  - tutor: "Così. Viene dal latino 'modo', cioè adesso: 'mo vengo' vuol dire 'arrivo subito'. Si usa in mezzo Sud, non solo a Napoli."
    goals: [example]
  - learner: "Fantastico. Ma allora il dialetto è un italiano parlato male, come dicono certi, o è proprio un'altra lingua? Perché a Torino un collega mi ha detto che il dialetto è roba per gente poco educata."
    errors: [false-friend]
  - tutor: "Roba per gente poco istruita, dicono, ma è un pregiudizio duro a morire. Il napoletano discende dal latino per conto suo, come il toscano da cui è nato l'italiano: sono fratelli. Oggi poi quasi tutti passano dall'uno all'altro secondo la situazione."
    recast: {text: "poco educata", fix: "poco istruita", tags: [false-friend]}
    goals: [standard]
  - learner: "Quindi secondo te andrebbero protetti? Io penso di sì, però non per forza a scuola: una lingua che si impone diventa un compito. Meglio che si canti, che si reciti, che la gente la usi perché le piace."
  - tutor: "Sottoscrivo: un dialetto si salva se lo si parla in cucina e lo si canta, non se lo si chiude in un museo. A Napoli te ne accorgerai appena scendi dal treno, e vedrai che a ridere sarai di nuovo tu."
    goals: [opinion]

- scenario: dibattito-ambiente
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io sono a favore della chiusura, anche se capisco la Sua preoccupazione. Penso che un centro senza traffico sia più vivibile e, a lungo termine, anche più vantaggioso per chi ci lavora."
  - tutor: "Più vivibile forse, ma più vantaggioso? I miei clienti arrivano in macchina. Mi dia almeno due buone ragioni."
    goals: [position]
  - learner: "Volentieri. Primo, la salute: nella scuola in cui insegno, che dà sulla via principale, non possiamo aprire le finestre per lo smog. Secondo, il commercio: nelle città che hanno chiuso il centro la gente passeggia di più e compra di più. Bisogna avere in conto anche questo."
    errors: [word-choice]
  - tutor: "Bisogna tenere conto anche di questo, lo ammetto, e di quelle finestre chiuse non sapevo nulla. Ma chi passeggia non compra un frigorifero, e i miei clienti anziani a piedi non vengono. A loro che cosa diciamo?"
    recast: {text: "avere in conto", fix: "tenere conto", tags: [word-choice]}
    goals: [argue]
  - learner: "È un'obiezione giusta. Però nessuno propone di lasciarli soli: si possono prevedere permessi per i residenti anziani, navette gratuite e consegne a domicilio per gli acquisti pesanti. Sono soluzioni di che molte città si servono già."
    errors: [relative-pronoun]
  - tutor: "Le navette mi interessano. Ma mi scusi, non ho afferrato l'ultima frase: soluzioni «di che» molte città si servono? Dopo una preposizione quel relativo cambia forma."
    prompt: {text: "di che", tags: [relative-pronoun]}
  - learner: "Ha ragione, mi è sfuggito: sono soluzioni di cui molte città si servono già."
  - tutor: "Ora è chiaro, e devo ammettere che è un argomento. Resta il fatto che i lavori durerebbero mesi e che qualche negozio, nel frattempo, potrebbe chiudere."
    goals: [counter]
  - learner: "Su questo Le do ragione: la transizione è il momento più delicato, e sarebbe ingiusto che la pagassero solo i negozianti. Propongo un compromesso: chiusura solo nei fine settimana per il primo anno, e alla fine valutiamo insieme i dati di vendita."
  - tutor: "Una prova di un anno, con i numeri in mano: così posso starci anch'io. Lo proponga pure all'assemblea e avrà il mio voto, purché le navette ci siano davvero."
    goals: [concede]

- scenario: email-rettore
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Buongiorno, e grazie di avermi ricevuto. In breve: il mio contratto di ricerca prevedeva l'accesso al laboratorio fino a giugno, ma il dipartimento me l'ha revocato a marzo senza alcuna spiegazione scritta. Vorrei ottenere che la decisione venga riesaminata."
  - tutor: "Capisco, ed è una richiesta legittima. Al Rettore però si scrive con una certa liturgia. Come pensava di cominciare la lettera?"
    goals: [situation]
  - learner: "Pensavo a 'Egregio Rettore' e poi subito al punto: 'Le scrivo perché voglio che Lei annulli la decisione del dipartimento.'"
    errors: [register]
  - tutor: "Andiamo per gradi. La formula d'uso è «Magnifico Rettore», e quella ce la teniamo. Ma la frase dopo, «voglio che Lei annulli»: a un Rettore si può dire voglio? Provi a riformularla con più distanza."
    prompt: {text: "voglio che Lei annulli", tags: [register]}
  - learner: "Ha ragione, suona come un ordine. 'Mi permetto di chiederLe che la decisione sia riesaminata alla luce di quanto esposto.'"
  - tutor: "Ora ci siamo: fermo, ma con il cappello in mano. Dunque «Magnifico Rettore» in apertura, poi una riga per presentarsi. E l'accaduto, come lo descriverebbe senza accusare nessuno?"
    goals: [opening-formula]
  - learner: "Scriverei: 'In data 3 marzo sono stato comunicato che l'accesso al laboratorio era stato sospeso, senza che fosse fornita alcuna motivazione.'"
    errors: [passive]
  - tutor: "Il tono è quello giusto, e «senza che fosse fornita» è perfetto. Rilegga però l'inizio: «sono stato comunicato»? Chi è stato comunicato, Lei o la notizia?"
    prompt: {text: "sono stato comunicato", tags: [passive]}
  - learner: "La notizia, naturalmente. 'In data 3 marzo mi è stato comunicato che l'accesso al laboratorio era stato sospeso.'"
  - tutor: "Benissimo, così è una frase da protocollo: i fatti parlano e Lei non alza la voce. Ci resta la chiusa: che cosa metterebbe prima della firma?"
    goals: [tone]
  - learner: "Di solito scrivo 'Cordiali saluti', ma temo sia troppo poco. Forse 'Confidando in un Suo cortese riscontro, porgo distinti saluti'?"
  - tutor: "Perfetta: «confidando in un Suo cortese riscontro» fa capire che una risposta se l'aspetta, e «distinti saluti» è la misura giusta. Aggiunga data, firma e qualifica, e la spedisca per posta certificata."
    goals: [closing]

- scenario: film-libro
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io! Ho letto 'L'amica geniale'. Racconta l'amicizia tra due bambine che crescono in un quartiere povero di Napoli negli anni cinquanta: una continua a studiare, l'altra no, e questa differenza segna tutta la loro vita. Non dico di più per non rovinare niente."
  - tutor: "Detto benissimo, e senza rovinare la sorpresa a nessuno: brava. E la protagonista, com'è? Che tipo di persona è?"
    goals: [summary]
  - learner: "Elena, la narratrice, è una ragazza diligente e insicura, che si misura sempre con Lila. Lila invece è brillante e feroce. La cosa bella è che non sai mai chi delle due sia 'l'amica geniale'. Io pensavo in Lila tutto il tempo, anche quando non era in scena."
    errors: [preposition]
  - tutor: "È il segreto del libro, quell'ambiguità. Un attimo, però: «pensavo in Lila»? Quando hai qualcuno in testa, con quel verbo ci vuole un'altra preposizione."
    prompt: {text: "pensavo in Lila", tags: [preposition]}
  - learner: "Uffa, lo spagnolo! Pensavo a Lila tutto il tempo."
  - tutor: "Proprio così. Anch'io, del resto: Lila ruba la scena a tutti. E nel complesso ti è piaciuto?"
    goals: [characters]
  - learner: "Moltissimo. Mi è piaciuto soprattutto come descrive la violenza del quartiere senza giudicarla, come una cosa normale, che c'era sempre stata. Però il finale mi ha lasciata un po' fredda: finisce di colpo, come se all'autrice si è finita la carta."
    errors: [subjunctive-use]
  - tutor: "Finisce di colpo perché è il primo di quattro volumi, ti capisco. Ma riprendi l'ultima immagine: «come se all'autrice si è finita la carta»? Dopo come se, quel verbo non può restare così."
    prompt: {text: "come se all'autrice si è finita la carta", tags: [subjunctive-use]}
  - learner: "Come se all'autrice si è... si era finita la carta?"
    errors: [subjunctive-use]
  - tutor: "Quasi: come se all'autrice fosse finita la carta. L'immagine comunque è azzeccata, e spiega bene quella sensazione di porta sbattuta. A chi lo consiglieresti?"
    recast: {text: "si era finita la carta", fix: "fosse finita la carta", tags: [subjunctive-use]}
    goals: [opinion]
  - learner: "A chi ha avuto un'amicizia complicata, di quelle in cui si ammira e si invidia la stessa persona. E a chi vuole capire Napoli oltre le cartoline. A chi cerca una storia con un finale chiuso, no."
  - tutor: "Ammirare e invidiare la stessa persona: metà della sala si è già riconosciuta. Grazie, hai aperto la serata benissimo; ora sentiamo chi ha letto qualcosa di completamente diverso."
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Metà mi sembra un'esagerazione. Qualche mestiere sparirà, non lo nego, ma ne nasceranno altri che oggi non sappiamo nemmeno immaginare. Io direi che cambierà il come lavoriamo più che il se."
  - tutor: "Il come più che il se: è un modo comodo di dirlo. E da dove ti viene tutta questa calma? Dammi almeno un esempio."
    goals: [position]
  - learner: "Sulla mia università, per esempio. L'anno scorso tutti dicevano che i traduttori erano finiti. Invece il mio professore dice che c'è più lavoro di prima: qualcuno deve pur controllare quello che scrive la macchina, e pagare attenzione ai dettagli che lei non vede."
    errors: [word-choice]
  - tutor: "Prestare attenzione ai dettagli, sì, ma pagati la metà: controllare costa meno che tradurre. Il tuo professore ha la cattedra, lui può stare tranquillo. E chi comincia adesso?"
    recast: {text: "pagare attenzione", fix: "Prestare attenzione", tags: [word-choice]}
    goals: [evidence]
  - learner: "Okay, questo te lo concedo: per chi inizia è più dura, perché i lavoretti con cui si faceva esperienza sono i primi a sparire. Se io finirei gli studi oggi, sarei preoccupata anch'io."
    errors: [hypothetical]
  - tutor: "Oh, finalmente un po' di sana paura! Però «se io finirei»? Proprio tu, che studi lingue: come si costruisce un'ipotesi così?"
    prompt: {text: "Se io finirei", tags: [hypothetical]}
  - learner: "Che figura. Se finissi gli studi oggi, sarei preoccupata anch'io."
  - tutor: "Ecco, adesso suona come deve. E allora vedi che in fondo la pensiamo allo stesso modo?"
    goals: [concede]
  - learner: "In parte. Diciamo che tu hai ragione sul breve periodo e io sul lungo. Su una cosa però siamo d'accordo: non decide la tecnologia, decide chi la usa e con quali regole. Se la politica dormisse meno, avremmo tutti meno paura."
  - tutor: "Su questo brindo volentieri: la macchina non mi spaventa quanto chi la comanda. Dai, versa il vino, che almeno quello l'intelligenza artificiale non ce lo beve."
    goals: [conclude]

- scenario: intervista-podcast
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Ciao, grazie a voi! Diciamo che l'Italia ce l'avevo in casa: i miei nonni sono emigrati dall'Abruzzo a Toronto negli anni cinquanta. Da piccolo ho passato tutte le domeniche da loro, a mangiare e a sentire storie del paese. A trent'anni ho deciso di venire a vederlo."
    errors: [tense-aspect]
  - tutor: "Che bella partenza, un'Italia ereditata. Solo una cosa: «da piccolo ho passato tutte le domeniche»? Era un'abitudine che si ripeteva: come la racconteresti?"
    prompt: {text: "Da piccolo ho passato tutte le domeniche", tags: [tense-aspect]}
  - learner: "Giusto: da piccolo passavo tutte le domeniche da loro. E quando sono arrivato al paese, mi sono accorto che l'Italia dei nonni non esisteva più."
  - tutor: "Ecco, questa è una frase da titolo di puntata. E che cosa ti ha sorpreso di più, in quest'Italia vera?"
    goals: [story]
  - learner: "La lingua, prima di tutto. Io pensavo di parlare italiano, invece parlavo il dialetto di mia nonna, fermo al 1955: la gente mi guardava come se fossi uscito da un vecchio film. E poi gli orari. Non avevo mai visto dei negozi chiusi alle due del pomeriggio."
  - tutor: "Un fossile vivente, insomma, con accento canadese. Fantastico. E c'è qualcosa che invece proprio non ti va giù, di noi?"
    goals: [culture-shock]
  - learner: "Con tutto l'affetto: la burocrazia. Per il permesso ho fatto sei file in sei uffici diversi, e ognuno mi chiedeva un documento che l'ufficio prima non mi aveva dato. Capisco le regole, ma a volte sembra che nessuno è responsabile per niente."
    errors: [subjunctive-use, preposition]
  - tutor: "Sei file: sei stato fin troppo gentile. Però senti come suona: «sembra che nessuno è responsabile»? Dopo sembra che, il verbo cambia modo."
    prompt: {text: "sembra che nessuno è responsabile", tags: [subjunctive-use]}
  - learner: "Sembra che nessuno sia responsabile di niente. Ecco, così è anche più elegante la lamentela."
  - tutor: "Elegantissima, e purtroppo fondata. Ultima domanda: a chi sta pensando di trasferirsi qui, che cosa diresti?"
    goals: [critique]
  - learner: "Di venire prima per sei mesi, senza vendere casa. E di imparare l'italiano di oggi, non quello dei nonni! Se l'avessi saputo, mi sarei risparmiato parecchie figuracce."
  - tutor: "Sei mesi di prova e una lingua aggiornata: consiglio d'oro. Grazie di cuore, è stata una chiacchierata bellissima; e salutaci i nonni, se ci ascoltano da Toronto."
    goals: [advice]

# Set r-miss-c2, file 2: book clubs, a Montale lesson, a translators' quarrel. The error sits
# late in a long literary turn: «malgrado» with the indicative, consecutio after «serviva» or
# «pensavo», participle agreement with «l'ha», «aiutare» with «gli», «di cui» for «in cui»,
# «in base di», false friends (culto, largo, salire, sensibile, remarcabile, equivocato).
- scenario: circolo-lettura
  # facts: «Il barone rampante» di Calvino; Cosimo sale sull'albero a dodici anni per non mangiare le lumache e non scende più; narratore il fratello Biagio; il brigante Gian dei Brughi cambia vita grazie ai romanzi che Cosimo gli presta; Viola; proposta per il mese prossimo: «Il giorno della civetta» di Sciascia, con il capitano Bellodi
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use, hypothetical]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: mi è sembrato il personaggio più coerente del libro. Un ragazzino di dodici anni che sale su un albero per non mangiare le lumache e poi non scende più per tutta la vita: è assurdo, ma Calvino lo rende credibile."
    - tutor: "Credibile, dice lui! Coerente sì, ma anche testardo fino alla crudeltà verso la sua famiglia. Qual è, secondo te, il tema vero: la ribellione o la solitudine?"
      goals: [impression]
    - learner: "Per me è la distanza: Cosimo sceglie di guardare il mondo da qualche metro più in alto, ma senza abbandonarlo. Pensa al brigante Gian dei Brughi, a cui Cosimo presta i romanzi e la cui vita cambia proprio grazie alla lettura."
    - tutor: "Gian dei Brughi, che a forza di leggere smette di fare il brigante: ottimo esempio. E lo stile? A me certe pagine sembrano più un saggio che un romanzo."
      goals: [theme]
    - learner: "Un po' saggio lo è, ma con una leggerezza che pochi hanno. Malgrado il narratore è il fratello, uomo prudente e un po' grigio, l'ironia passa in ogni pagina, e per me è questo il vero miracolo dello stile."
      errors: [subjunctive-use]
      gold: {text: "Malgrado il narratore è il fratello", fix: "Malgrado il narratore sia il fratello"}
    - tutor: "Biagio, prudente e grigio: mi piace. Ma riascolta «malgrado il narratore è il fratello»: «malgrado», come «benché», quale modo vuole?"
      prompt: {text: "Malgrado il narratore è il fratello", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: malgrado il narratore sia il fratello, l'ironia si sente in ogni pagina. Ma tu davvero lo trovi insopportabile, Cosimo?"
    - tutor: "Davvero: uno che per ostinazione lascia la madre a guardarlo dalla finestra per anni non mi è simpatico. Avanti, convincimi del contrario."
      goals: [style]
    - learner: "Non credo che si tratti di ostinazione. Cosimo resta fedele a una scelta presa da ragazzo, e proprio per questo tutto quello che fa dopo, anche organizzare la difesa dei boschi dagli incendi, fa senso solo dall'alto."
      errors: [word-choice]
    - tutor: "Ha senso solo dall'alto, dici: è una lettura generosa, ma non mi convince del tutto. La fedeltà a una scelta fatta da bambino è virtù o capriccio?"
      goals: [disagree]
      recast: {text: "fa senso", fix: "ha senso", tags: [word-choice]}
    - learner: "Virtù, se la scelta cresce con te. Cosimo sugli alberi legge, studia, si innamora di Viola, discute di politica: non è rimasto bambino, ha soltanto cambiato punto di vista."
    - tutor: "Su Viola ti concedo che sono le pagine più belle. Allora, per il mese prossimo, che cosa proponi di leggere, dopo tanta leggerezza?"
    - learner: "Proporrei «Il giorno della civetta» di Sciascia: se dopo Calvino leggeremmo qualcosa di più cupo, avremmo un bel contrasto tra la leggerezza e l'impegno."
      errors: [hypothetical]
      gold: {text: "se dopo Calvino leggeremmo", fix: "se dopo Calvino leggessimo"}
    - tutor: "Sciascia, ottima idea. Però ripeti «se dopo Calvino leggeremmo»: nella parte con «se», che esprime la condizione, quale modo ci vuole?"
      prompt: {text: "se dopo Calvino leggeremmo", tags: [hypothetical]}
    - learner: "Se dopo Calvino leggessimo Sciascia, passeremmo dagli alberi di Ombrosa alla Sicilia della mafia: due modi opposti di guardare l'Italia."
    - tutor: "Detto così, lo voto anch'io. Il mese prossimo Sciascia, allora, e vediamo se qualcuno troverà insopportabile anche il capitano Bellodi."
      goals: [recommend]

- scenario: club-lettura
  # facts: saga della famiglia nel dopoguerra; il membro storico l'ha letto in tre sere; il learner ha letto in diagonale le ultime cinquanta pagine (quelle del ritorno di Teresa); la nonna Adele vende la vigna e apre il negozio da sola quando il marito torna dalla prigionia, il figlio non glielo perdonerà; la sorella del learner ha cominciato tre volte «Guerra e pace»; il club si vede il secondo martedì del mese
  level: C2
  persona: en-f-professional
  history: [participle-agreement, subjunctive-use]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma ammetto che le ultime cinquanta pagine le ho lette in diagonale. La prima parte, quella dell'immediato dopoguerra, mi ha preso moltissimo; poi la saga si allunga, e i personaggi si somigliano un po' tutti."
    - tutor: "In diagonale! Ma sono le pagine del ritorno di Teresa, le mie preferite. Chi ti è rimasto in mente, fra tanti personaggi?"
      goals: [impression]
    - learner: "Adele, la nonna. Quando il marito torna dalla prigionia senza più voglia di lavorare, la decisione di vendere la vigna e aprire il negozio l'ha preso lei, da sola, mentre gli uomini discutevano all'osteria."
      errors: [participle-agreement]
      gold: {text: "l'ha preso lei", fix: "l'ha presa lei"}
    - tutor: "Adele piace molto anche a me. Ma guarda «la decisione... l'ha preso lei»: a che cosa si riferisce quel pronome, e il participio si accorda?"
      prompt: {text: "l'ha preso lei", tags: [participle-agreement]}
    - learner: "Si riferisce alla decisione, quindi l'ha presa lei. Ed è una scelta che pagherà per tutta la vita, perché il figlio non gliela perdonerà mai."
    - tutor: "Proprio così. E secondo te ha fatto bene, o al suo posto avresti aspettato?"
      goals: [character]
    - learner: "Al suo posto avrei fatto lo stesso, credo, ma l'avrei spiegato al figlio invece di imporglielo. Il suo silenzio mi è sembrato più crudele della vendita stessa."
    - tutor: "Il silenzio come colpa: è vero, e infatti l'autrice ci torna in ogni capitolo. E lo stile, che ne dici? Per me è asciutto al punto giusto."
    # decoy: «pretende che il lettore indovini» uses «pretendere» correctly, "to expect, to demand"
    - learner: "Asciutto sì, a volte perfino troppo: l'autrice pretende che il lettore indovini da solo quello che i personaggi provano. È una scelta sensibile, per una saga così lunga, ma alla lunga stanca."
      errors: [false-friend]
    - tutor: "Una scelta sensata, ma che alla lunga stanca: capisco. Io invece in quei silenzi ci sento tutta la Torino degli anni Cinquanta. Allora, a chi lo consiglieresti?"
      goals: [style]
      recast: {text: "sensibile", fix: "sensata", tags: [false-friend]}
    - learner: "A chi ama le storie lente e a chi ha avuto nonni che hanno vissuto la guerra. A mia sorella invece no: ha cominciato tre volte «Guerra e pace» senza finirlo, e dubito che arrivava in fondo a questo."
      errors: [subjunctive-use]
      gold: {text: "dubito che arrivava", fix: "dubito che arrivi"}
    - tutor: "Tre volte! Allora la capisco. Ma riprendi «dubito che arrivava»: dopo «dubitare», l'indicativo va bene?"
      prompt: {text: "dubito che arrivava", tags: [subjunctive-use]}
    - learner: "Il congiuntivo, certo: dubito che arrivi in fondo. A meno che non lo ascolti in macchina come audiolibro: in quel caso magari ce la fa."
    - tutor: "Come audiolibro, seicento pagine sono un mese di traffico. Al prossimo incontro ci vediamo come sempre il secondo martedì?"
      goals: [recommend]
    - learner: "Il secondo martedì va benissimo. Tu intanto pensa a un titolo più corto, per pietà di mia sorella."
    - tutor: "Promesso: qualcosa sotto le duecento pagine, così lo legge anche lei."

- scenario: poesia-montale
  # facts: «Spesso il male di vivere ho incontrato»; immagini: il rivo strozzato che gorgoglia, l'incartocciarsi della foglia riarsa, il cavallo stramazzato, la statua nella sonnolenza del meriggio, la nuvola, il falco alto levato; rima «gorgoglia» / «foglia»; per giovedì: rileggere «Meriggiare pallido e assorto»
  level: C2
  persona: en-f-student
  history: [relative-pronoun, hypothetical]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Mi è rimasta addosso una sensazione di asfissia. Le immagini sono semplicissime, un ruscello, una foglia, un cavallo, eppure sembrano tutte colte nel momento in cui qualcosa si blocca o muore."
    - tutor: "Asfissia è la parola giusta: il «rivo strozzato» non respira. Quale di queste immagini la colpisce di più, e perché?"
      goals: [first-reading]
    - learner: "L'incartocciarsi della foglia riarsa. È remarcabile che Montale usi un infinito sostantivato: non vediamo la foglia, vediamo il processo, come se il male fosse un movimento e non una cosa."
      errors: [word-choice]
    - tutor: "È notevole, sì, e lei l'ha visto bene: il male come movimento, non come oggetto. Passiamo al suono: che cosa sente in «rivo strozzato che gorgoglia»?"
      goals: [image]
      recast: {text: "remarcabile", fix: "notevole", tags: [word-choice]}
    - learner: "Sento le consonanti doppie e le erre, che rendono il verso aspro, quasi soffocato. E «gorgoglia» fa rima con «foglia»: un suono liquido che però non scorre."
    - tutor: "Un suono d'acqua che non scorre è il contrario di un ruscello, ha ragione. Ora la seconda strofa: che cos'è questo «prodigio che schiude la divina Indifferenza»?"
      goals: [sound]
    # decoy: «l'unica forma di bene che il poeta abbia conosciuto» is a correct subjunctive
    - learner: "Credo che sia l'unica forma di bene che il poeta abbia conosciuto: non una gioia, ma un distacco. La statua, la nuvola e il falco sono immagini di cui l'indifferenza è resa visibile attraverso l'immobilità o l'altezza."
      errors: [relative-pronoun]
      gold: {text: "immagini di cui l'indifferenza", fix: "immagini in cui l'indifferenza"}
    - tutor: "Il distacco come unico bene: è una lettura forte. Ma rilegga «immagini di cui l'indifferenza è resa visibile»: l'indifferenza appartiene a quelle immagini, o si trova dentro di loro?"
      prompt: {text: "immagini di cui l'indifferenza", tags: [relative-pronoun]}
    - learner: "Si trova dentro: sono immagini in cui l'indifferenza è resa visibile, attraverso l'immobilità della statua o l'altezza del falco."
    - tutor: "Così è preciso. Allora, mettendo insieme le due strofe, quale interpretazione complessiva propone?"
    - learner: "Direi che la poesia è costruita come una bilancia: da una parte il male, che è ovunque, dall'altra un bene che è soltanto assenza di dolore. Se Montale avrebbe scritto «felicità» invece di «prodigio», il senso sarebbe stato tutt'altro."
      errors: [hypothetical]
      gold: {text: "Se Montale avrebbe scritto", fix: "Se Montale avesse scritto"}
    - tutor: "La bilancia mi piace molto. Ma ripeta «se Montale avrebbe scritto»: nella parte introdotta da «se», per un'ipotesi nel passato, quale modo si usa?"
      prompt: {text: "Se Montale avrebbe scritto", tags: [hypothetical]}
    - learner: "Scusi: se Montale scriveva «felicità», il senso sarebbe stato tutt'altro."
      errors: [hypothetical]
    - tutor: "Se Montale avesse scritto «felicità», il senso sarebbe stato tutt'altro, appunto: «prodigio» dice che il bene è un'eccezione, non una condizione. Le va di chiudere con una frase sola?"
      recast: {text: "se Montale scriveva", fix: "Se Montale avesse scritto", tags: [hypothetical]}
    - learner: "In una frase: per Montale vivere significa incontrare il male, e l'unico bene possibile è guardarlo da lontano, come la statua o il falco."
    - tutor: "Una sintesi limpida. Per giovedì rilegga «Meriggiare pallido e assorto»: vedrà che quella muraglia ha molto in comune con il nostro rivo strozzato."
      goals: [meaning]

- scenario: film-libro
  # facts: «Il nome della rosa» di Umberto Eco; 1327, abbazia del nord Italia; Guglielmo da Baskerville e il novizio Adso, narratore da vecchio; Roberto l'ha letto al liceo e l'ha odiato, poi da adulto l'ha amato; Eco diceva che le prime cento pagine servono a selezionare il lettore; film con Sean Connery
  level: C2
  persona: es-m-worker
  history: [auxiliary-choice, false-friend]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, se volete. Ho letto, anzi riletto, «Il nome della rosa» di Umberto Eco: la prima volta avevo vent'anni e confesso che le pagine in latino le avevo saltate quasi tutte."
    - tutor: "Un classico, e ci vuole coraggio a rileggerlo! Ce lo racconti senza svelare il finale?"
    - learner: "Siamo nel 1327, in un'abbazia del nord Italia. Un frate francescano, Guglielmo da Baskerville, arriva con il giovane novizio Adso per un incontro importante, ma i monaci cominciano a morire uno dopo l'altro, e l'abate gli chiede di indagare."
    - tutor: "Perfetto, e nessun finale svelato. Che tipo è questo Guglielmo, per chi non l'ha letto?"
      goals: [summary]
    - learner: "È un uomo molto culto e ironico, un po' Sherlock Holmes e un po' filosofo: osserva le orme sulla neve, ragiona sui libri proibiti e non crede mai alla prima spiegazione che gli danno."
      errors: [false-friend]
    - tutor: "Colto e ironico, uno Sherlock Holmes col saio: non a caso si chiama Baskerville. E Adso, invece, che ruolo ha?"
      recast: {text: "culto", fix: "colto", tags: [false-friend]}
    - learner: "Adso è il narratore, ormai vecchio, che ricorda quei giorni. A vent'anni mi identificavo con lui; stavolta invece ho capito meglio Guglielmo, e i suoi dubbi mi hanno sembrato quasi moderni."
      errors: [auxiliary-choice]
      gold: {text: "mi hanno sembrato", fix: "mi sono sembrati"}
    - tutor: "Il vecchio Adso che ricorda: è lui il filtro di tutto. Ma riprendi «i suoi dubbi mi hanno sembrato»: con «sembrare», quale ausiliare si usa?"
      prompt: {text: "mi hanno sembrato", tags: [auxiliary-choice]}
    - learner: "Con «essere»: i suoi dubbi mi sono sembrati quasi moderni. E tu, Roberto, l'hai letto? Ti è piaciuto?"
    - tutor: "L'ho letto al liceo e l'ho odiato, lo confesso; da adulto l'ho ripreso e l'ho amato. Ma la domanda è per te: alla fine, la tua opinione qual è?"
      goals: [characters]
    - learner: "Per me è un capolavoro, anche se le digressioni teologiche sono troppo larghe e qualche volta interrompono la tensione proprio nel momento migliore."
      errors: [false-friend]
    - tutor: "Troppo lunghe, sì, ma Eco lo faceva apposta: diceva che le prime cento pagine servono a selezionare il lettore. A chi lo consiglieresti, allora?"
      goals: [opinion]
      recast: {text: "troppo larghe", fix: "troppo lunghe", tags: [false-friend]}
    # decoy: «se gli è piaciuto», with «gli» for «a loro», is correct in speech
    - learner: "A chi ama i gialli ma non ha paura di faticare un po', e a chi si interessa di Medioevo. Ai miei figli adolescenti, invece, farei vedere prima il film con Sean Connery, e poi, se gli è piaciuto, il libro."
    - tutor: "Prima il film, poi il libro: una strategia furba. Grazie, hai aperto benissimo la serata. Chi è il prossimo?"
      goals: [recommend]

- scenario: traduzione-sfumature
  # facts: terzo capitolo; dialogo tra padre e figlia a pagina quaranta, lei risponde quattro volte «Fair enough» in due pagine; bozza: «Va bene»; proposta del traduttore senior: «Come vuoi»; a pagina quarantadue «eventualmente» per «eventually»; scelta finale: «D'accordo» ripetuto quattro volte; correzione da sistemare entro venerdì
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use, conditional-form]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Me l'aspettavo. Il punto più difficile è il dialogo tra padre e figlia a pagina quaranta: lei risponde sempre «Fair enough», e in inglese quella formula suona cortese e gelida insieme."
    - tutor: "Appunto, e tu l'hai tradotta con «Va bene», che è cortese e basta. Il gelo dove l'hai messo?"
      goals: [problem]
    # decoy: «l'unica che non suonasse inventata» is a correct subjunctive
    - learner: "Il gelo l'ho cercato a lungo, ma mi serviva un'espressione che sia breve, quotidiana e un po' distante, e «Va bene» era l'unica che non suonasse inventata."
      errors: [subjunctive-use]
      gold: {text: "un'espressione che sia breve", fix: "un'espressione che fosse breve"}
    - tutor: "Nella seconda parte il tempo l'hai azzeccato. Ma nella prima, «mi serviva un'espressione che sia breve»: con «serviva» al passato, quel congiuntivo va bene?"
      prompt: {text: "un'espressione che sia breve", tags: [subjunctive-use]}
    - learner: "No: mi serviva un'espressione che fosse breve, quotidiana e un po' distante. Allora tu cosa proporresti, «D'accordo» o «Come vuoi»?"
    - tutor: "«Come vuoi», senza esitare: dentro c'è una resa che è anche un rimprovero, ed è esattamente quello che fa lei. «D'accordo» lo dice un notaio. Tu che obiezioni hai?"
    - learner: "«Come vuoi» mi piace, ma rischia di essere più aggressivo dell'originale, perché in italiano quella formula si usa spesso nei litigi. «D'accordo» è più neutro, e il gelo potrebbe venire dalla ripetizione: lei lo dice quattro volte in due pagine."
    - tutor: "La ripetizione come arma: non è una cattiva idea, lo ammetto a denti stretti. E già che ci siamo: a pagina quarantadue il padre è «eventualmente» d'accordo. Che cosa voleva dire l'autore?"
      goals: [options]
    - learner: "Hai ragione, è un calco bello e buono: «eventually» vuol dire «alla fine», non «eventualmente». Me ne sono accorto rileggendo, ma l'ho lasciato perché pensavo che tu non lo noterai."
      errors: [conditional-form]
      gold: {text: "pensavo che tu non lo noterai", fix: "pensavo che tu non l'avresti notato"}
    - tutor: "Io noto tutto, mettitelo in testa. Ma ripeti «pensavo che tu non lo noterai»: un futuro visto dal passato, in italiano, con quale forma si esprime?"
      goals: [false-friend]
      prompt: {text: "pensavo che tu non lo noterai", tags: [conditional-form]}
    - learner: "Allora: pensavo che tu non lo noteresti."
      errors: [conditional-form]
    - tutor: "«Pensavo che tu non l'avresti notato», dici: e invece eccomi qui. Allora, per la figlia, «D'accordo» ripetuto o «Come vuoi»? Decidi tu, ma motiva."
      recast: {text: "pensavo che tu non lo noteresti", fix: "pensavo che tu non l'avresti notato", tags: [conditional-form]}
    - learner: "Scelgo «D'accordo», ripetuto tutte e quattro le volte senza variazioni: in italiano la ripetizione stona, e proprio quello stonare restituisce il gelo dell'originale."
    - tutor: "Va bene, «D'accordo» per quattro volte, e se la redattrice protesta la mandi da me. Sistemami anche quell'«eventualmente» entro venerdì."
      goals: [decide]

- scenario: traduzione-sfumature
  # facts: quinto capitolo di un romanzo inglese di un'autrice; descrizione del pub, «cosy» tre volte in una pagina, la bozza ha «accogliente» tutte e tre le volte; a riga dieci «actually» reso con «attualmente», voluto dalla redattrice; scelta: niente aggettivo nelle prime due occorrenze, «raccolto» alla fine; la learner manda la nota per la redattrice stasera
  level: C2
  persona: es-f-teacher
  history: [preposition, combined-pronouns]
  turns:
    - tutor: "Ho letto la tua bozza del quinto capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autrice a parlare."
    - learner: "So già a cosa ti riferisci: la descrizione del pub all'inizio. L'autrice usa «cosy» tre volte in una pagina, e in italiano non c'è una parola sola che tenga insieme il caldo, la luce bassa e il sentirsi protetti."
    - tutor: "Infatti tu hai messo «accogliente» tutte e tre le volte, e sembra la pubblicità di un albergo. Alternative?"
      goals: [problem]
    - learner: "Ne ho due. La prima è variare: «accogliente», «raccolto», «caldo», a seconda del contesto. La seconda è rinunciare all'aggettivo e rendere l'atmosfera con i dettagli, in base dell'originale: il fuoco, il legno scuro, le voci basse."
      errors: [preposition]
      gold: {text: "in base dell'originale", fix: "in base all'originale"}
    - tutor: "La seconda strada è più coraggiosa. Però riprendi «in base dell'originale»: dopo «in base», quale preposizione si usa?"
      prompt: {text: "in base dell'originale", tags: [preposition]}
    - learner: "In base all'originale, sì: il fuoco, il legno scuro, le voci basse. Così il lettore si sente al caldo senza che glielo diciamo."
    - tutor: "«Senza che glielo diciamo»: questo è tradurre. E «actually», a riga dieci? L'hai reso con «attualmente», e il barista sembra parlare dell'attualità."
      goals: [options]
    - learner: "Hai ragione, è un falso amico da manuale: «actually» vuol dire «in realtà». Me ne ero accorta, ma la redattrice voleva tenerlo e io non ho avuto il coraggio di dirle lo."
      errors: [combined-pronouns]
      gold: {text: "dirle lo", fix: "dirglielo"}
    - tutor: "Le redattrici fanno paura a tutti. Ma riprendi «dirle lo»: quando «le» e «lo» si incontrano dopo un infinito, che forma prendono?"
      prompt: {text: "dirle lo", tags: [combined-pronouns]}
    - learner: "Scusa: non ho avuto il coraggio di dirlelo."
      errors: [combined-pronouns]
    - tutor: "Non hai avuto il coraggio di dirglielo, capisco: glielo dirò io, con tutto il garbo che non ho. Allora, per «cosy»: variare o rinunciare all'aggettivo?"
      goals: [false-friend]
      recast: {text: "dirlelo", fix: "dirglielo", tags: [combined-pronouns]}
    # decoy: «l'unico posto in cui si senta a casa» is a correct subjunctive
    - learner: "Rinuncerei all'aggettivo nelle prime due occorrenze e lo terrei solo alla fine, quando la protagonista dice che quel pub è l'unico posto in cui si senta a casa. Ti sembra un tradimento?"
    - tutor: "Un tradimento a fin di bene, l'unico che ammetto. Ma alla fine quale aggettivo metti in bocca alla protagonista?"
    - learner: "Pensavo a «raccolto», perché fa pensare a uno spazio piccolo e protetto. «Accogliente» lo lascerei alle pubblicità degli alberghi, come dici tu, mentre «intimo» qui avrebbe un senso un po' equivocato."
      errors: [word-choice]
    - tutor: "Un senso un po' equivoco, sì: «intimo», in un pub, farebbe pensare ad altro. Vada per «raccolto», allora, e scrivi due righe per la redattrice."
      recast: {text: "un po' equivocato", fix: "un po' equivoco", tags: [word-choice]}
    - learner: "Le scrivo stasera e te le mando prima di consegnarle, così mi dici se il tono è abbastanza diplomatico."
    - tutor: "Mandamele pure: se sono troppo diplomatiche, ci aggiungo io un po' di veleno."
      goals: [decide]

- scenario: film-libro
  # facts: «Il Gattopardo» di Tomasi di Lampedusa; la learner a Siviglia aveva visto solo il film di Visconti; Sicilia, 1860, sbarco dei garibaldini; Don Fabrizio, principe di Salina; il nipote Tancredi; frase: «Se vogliamo che tutto rimanga com'è, bisogna che tutto cambi»; Roberto preferisce il romanzo ma ricorda il ballo del film; il mese prossimo sceglie la learner
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, comparative]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Inizio io. Ho letto «Il Gattopardo» di Tomasi di Lampedusa, che a Siviglia avevo visto solo al cinema, nella versione di Visconti. Leggerlo in italiano è stata tutta un'altra esperienza."
    - tutor: "Il Gattopardo, che bella scelta. Ce lo racconti in due parole, senza rovinare niente a chi non l'ha letto?"
    - learner: "Siamo in Sicilia nel 1860, quando sbarcano i garibaldini. Il principe di Salina, Don Fabrizio, capisce che il suo mondo sta finendo, e il nipote Tancredi gli spiega che bisogna adattarsi se vogliono che tutto rimane com'è."
      errors: [subjunctive-use]
      gold: {text: "che tutto rimane com'è", fix: "che tutto rimanga com'è"}
    - tutor: "La frase più citata del libro! Ma riascolta «se vogliono che tutto rimane com'è»: dopo «volere che», quale modo ci vuole?"
      prompt: {text: "che tutto rimane com'è", tags: [subjunctive-use]}
    - learner: "Il congiuntivo, che vergogna proprio su questa frase: se vogliamo che tutto rimanga com'è, bisogna che tutto cambi."
    - tutor: "Proprio così, citata alla perfezione. E Don Fabrizio, come lo descriveresti a chi non lo conosce?"
      goals: [summary]
    - learner: "È un uomo enorme, colto e malinconico, molto più lucido che tutti quelli che lo circondano: vede la fine della sua classe e, invece di combatterla, la osserva con ironia."
      errors: [comparative]
      gold: {text: "più lucido che tutti quelli", fix: "più lucido di tutti quelli"}
    - tutor: "Malinconico e ironico, sì. Ma ripeti «più lucido che tutti quelli»: davanti a un pronome come «tutti quelli», con quale parola si introduce il paragone?"
      prompt: {text: "più lucido che tutti quelli", tags: [comparative]}
    - learner: "Molto più lucido di tutti quelli che lo circondano, insomma: il solo che capisca davvero che cosa sta succedendo."
    - tutor: "Il solo che capisca, esatto. E tu, alla fine, preferisci il romanzo o il film?"
      goals: [characters]
    - learner: "Il romanzo, senza dubbio: il film è splendido, ma quando sono salita dal cinema, a vent'anni, ricordavo solo il ballo e i vestiti. Il libro invece ti lascia addosso la morte, la Sicilia, il tempo. Tu quale preferisci?"
      errors: [false-friend]
    - tutor: "Anch'io il romanzo, anche se il ballo di Visconti non l'ho mai dimenticato. E se a vent'anni, uscita dal cinema, ricordavi solo i vestiti, oggi a chi lo consiglieresti?"
      goals: [opinion]
      recast: {text: "salita dal cinema", fix: "uscita dal cinema", tags: [false-friend]}
    - learner: "A chi pensa che la storia sia fatta solo di battaglie e di date. E anche a chi ha paura di invecchiare, perché le ultime pagine parlano della morte con una dolcezza che non ho mai trovato altrove."
    - tutor: "Un consiglio bellissimo. Grazie: il mese prossimo tocca a te scegliere il libro per tutti."
      goals: [recommend]

- scenario: club-lettura
  # facts: saga di una famiglia di Genova nel dopoguerra; il learner l'ha finita ieri alle due di notte, in quasi un mese; Pietro, il figlio maggiore, rinuncia all'università per lavorare al porto, aiuta il padre malato con la contabilità, sogna l'Argentina; capitoli brevissimi; la sorella del membro storico divora le saghe; il mese prossimo un giallo, da scegliere giovedì in libreria
  level: C2
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Finito ieri sera, alle due di notte, quindi direi che mi è piaciuto. Tre sere come te no, però: ci ho messo quasi un mese, perché è un libro che chiede di essere letto piano."
    - tutor: "Alle due di notte, buon segno! Chi della famiglia ti ha tenuto sveglio?"
      goals: [impression]
    - learner: "Il figlio maggiore, Pietro, quello che rinuncia all'università per lavorare al porto. Il padre è malato e Pietro gli aiuta ogni giorno con la contabilità, anche se sogna di andarsene in Argentina."
      errors: [object-pronoun]
      gold: {text: "Pietro gli aiuta", fix: "Pietro lo aiuta"}
    - tutor: "Pietro è il cuore del libro, hai ragione. Ma «Pietro gli aiuta» suona spagnolo: in italiano si aiuta qualcuno, o si aiuta a qualcuno?"
      prompt: {text: "Pietro gli aiuta", tags: [object-pronoun]}
    - learner: "Si aiuta qualcuno, quindi Pietro lo aiuta ogni giorno. Ed è proprio questo il suo dramma: è buono, ma la sua bontà lo tiene prigioniero."
    - tutor: "La bontà come prigione: bella formula. Secondo te fa bene a restare, o avrebbe dovuto partire?"
    - learner: "Avrebbe dovuto partire, almeno per qualche anno. Se fosse partito, forse sarebbe tornato più libero, e il padre avrebbe capito che il figlio non gli apparteneva."
    - tutor: "Qui non sono d'accordo, ma ne parliamo davanti a un bicchiere. E lo stile? A me quei capitoli brevissimi sembrano perfetti."
      goals: [character]
    - learner: "Anche a me piacciono: lo stile è asciutto, senza adornos inutili, e ogni capitolo finisce con una frase che ti costringe a leggere il successivo."
      errors: [word-choice]
    - tutor: "Senza fronzoli inutili, esatto: l'autrice non spreca una parola, e quelle frasi finali sono una trappola perfetta. A chi lo consiglieresti?"
      goals: [style]
      recast: {text: "adornos", fix: "fronzoli", tags: [word-choice]}
    - learner: "A chiunque abbia una famiglia complicata, cioè a tutti. Anzi, fammi un favore: consiglialo a tua sorella, e dilla che il finale non è triste come sembra."
      errors: [object-pronoun]
      gold: {text: "dilla", fix: "dille"}
    - tutor: "Volentieri, mia sorella divora queste saghe. Ma ripeti «dilla che il finale»: a chi lo devo dire, e quindi quale pronome ci vuole?"
      prompt: {text: "dilla", tags: [object-pronoun]}
    - learner: "A lei, quindi «dille»: dille che il finale non è triste come sembra. E il mese prossimo cosa leggiamo?"
    - tutor: "Glielo dirò stasera stessa. Il mese prossimo tocca a un giallo, per riprenderci dalle lacrime: lo scegliamo giovedì in libreria."
      goals: [recommend]

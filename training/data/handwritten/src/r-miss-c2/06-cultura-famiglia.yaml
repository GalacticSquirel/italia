# Set r-miss-c2, file 6: an exhibition, idioms over aperitivo, Sunday lunch in Bologna, meeting a
# partner's parents, a condolence visit. Errors slip in late: passive agreement, «a mio punto di
# vista», consecutio after «pensavo» and «vorrei», «non stammi», «non mi ha bastato», «la
# besciamella ne mettete», «gli la aveva data», «se Le va» after switching to tu, «non si preoccupa».
- scenario: arte-mostra
  # facts: «Cena in Emmaus», ignoto caravaggesco, intorno al 1620; luce da sinistra; pane, caraffa di vino, briciole, una mosca sulla tovaglia; confronto con la «Cena in Emmaus» di Caravaggio alla National Gallery di Londra, Cristo senza barba; la mostra è chiusa domani, si torna sabato; Giovanni porta il catalogo
  level: C2
  persona: en-f-student
  history: [passive, preposition]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi mette quasi a disagio, nel senso buono: quella luce che arriva da sinistra e taglia il buio sembra un colpo di teatro. E i personaggi sono così vicini al bordo che ho l'impressione di essere seduta a tavola con loro."
    - tutor: "Seduta a tavola con loro: è proprio l'effetto che il pittore cercava. Il cartellino dice «Cena in Emmaus», ignoto caravaggesco, intorno al 1620. Che cosa vedi, nel dettaglio?"
      goals: [react]
    - learner: "Al centro c'è Cristo, con la mano alzata, e intorno due discepoli che reagiscono in modo opposto. Sul tavolo, il pane e una caraffa di vino sono stati dipinto con una precisione quasi fotografica."
      errors: [passive]
      gold: {text: "sono stati dipinto", fix: "sono stati dipinti"}
    - tutor: "Quella caraffa è un pezzo di bravura, hai ragione. Ma riprendi «il pane e una caraffa... sono stati dipinto»: il participio si accorda con il soggetto?"
      prompt: {text: "sono stati dipinto", tags: [passive]}
    - learner: "Hai ragione: sono stati dipinti con una precisione quasi fotografica. Si vedono perfino le briciole."
    - tutor: "Le briciole, sì, e una mosca sulla tovaglia, se guardi bene. Secondo te, che cosa vuole dire il pittore con tutta questa realtà quotidiana?"
      goals: [describe]
    # decoy: «attuale» here correctly means "topical"
    - learner: "Credo che voglia portare il sacro dentro la vita di tutti i giorni. Non è una scena lontana e dorata: è un'osteria qualunque, con gente qualunque, e il miracolo accade lì, tra il pane e il vino. Mi sembra un messaggio molto attuale."
    - tutor: "Il sacro nell'osteria: è il cuore del caravaggismo. Ti ricorda qualche altra opera?"
      goals: [interpret]
    - learner: "Mi ricorda la «Cena in Emmaus» di Caravaggio che ho visto alla National Gallery di Londra, quella con Cristo senza barba. Questo pittore, secondo me, ha voluto fare omaggio a Caravaggio, ma con un tocco più caldo, più umano."
      errors: [word-choice]
    - tutor: "Rendere omaggio a Caravaggio, sì, ma con calore: il Cristo di Londra, giovane e senza barba, sembra quasi più lontano. Quale dei due preferisci?"
      goals: [compare]
      recast: {text: "fare omaggio", fix: "rendere omaggio", tags: [word-choice]}
    - learner: "Forse questo, anche se è meno famoso: quello di Londra mi lascia ammirata, questo mi commuove. Ma tu che sei esperto: pensi che il pittore abbia visto l'originale, o che conoscesse solo delle copie?"
    - tutor: "Non lo sappiamo: di copie ne circolavano, e i caravaggeschi le studiavano con attenzione, ma per un ignoto è impossibile dirlo. Ed è il bello di questi quadri senza nome. Andiamo nella sala dopo?"
    - learner: "Andiamo. Anche se sono stanca, questa sala mi ha rimessa al mondo: a mio punto di vista è la più riuscita di tutta la mostra, e ci tornerei domani."
      errors: [preposition]
      gold: {text: "a mio punto di vista", fix: "dal mio punto di vista"}
    - tutor: "Anche per me è la più riuscita. Ma riprendi «a mio punto di vista»: con «punto di vista», quale preposizione si usa?"
      prompt: {text: "a mio punto di vista", tags: [preposition]}
    - learner: "Hai ragione: per il mio punto di vista, è la più riuscita."
      errors: [preposition]
    - tutor: "Dal mio punto di vista è la più riuscita, dici, e sono d'accordo. Domani però la mostra è chiusa: torniamo sabato?"
      recast: {text: "per il mio punto di vista", fix: "dal mio punto di vista", tags: [preposition]}
    - learner: "Sabato va benissimo, ma stavolta il pranzo lo offro io, così mi racconti tutto quello che non c'è scritto sui cartellini."
    - tutor: "Affare fatto: sabato, mostra e pranzo. E ti porto anche il catalogo, che ho a casa."

- scenario: arte-mostra
  # facts: una tela rossa di Lucio Fontana con un solo taglio verticale, i bordi spinti verso l'interno; Fontana era nato a Rosario, in Argentina; confronto con Tàpies, più materico; la madre del learner è di Rosario; cartolina da comprare alla fine, nella libreria del museo; il learner offre un caffè
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, comparative]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Sinceramente? La prima reazione è stata: questo lo potevo fare anch'io, con un coltello. Poi però sono rimasto a guardarlo per un minuto buono, e quel taglio ha cominciato a sembrarmi una porta."
    - tutor: "Il «potevo farlo anch'io» è la reazione più comune davanti a Fontana, e la più ingiusta. Una porta su che cosa?"
      goals: [react]
    # decoy: «come se qualcuno l'avesse ferita» is correct
    - learner: "Su qualcosa che sta dietro la tela, nel buio. La superficie è di un rosso uniforme, senza pennellate, il taglio è uno solo, verticale, leggermente curvo; ai bordi la tela rientra, come se qualcuno l'avesse ferita."
    - tutor: "Descrizione perfetta: il rosso, il taglio, i bordi che rientrano. Lo sai che Fontana era nato in Argentina, a Rosario?"
      goals: [describe]
    - learner: "Non lo sapevo! Mia madre è di Rosario: forse non è un caso che mi sembri così familiare. Ma dimmi, perché tagliare la tela, invece di dipingerci sopra? Che cosa voleva dimostrare?"
    - tutor: "Voleva uscire dal quadro: non più rappresentare lo spazio, ma aprirlo davvero, mostrare che oltre la superficie c'è altro. Tu come lo interpreti?"
    - learner: "Per me è un gesto di liberazione, ma anche di violenza. Pensavo che l'arte astratta sia fredda, tutta geometria; questo invece è un gesto fisico, quasi un grido."
      errors: [subjunctive-use]
      gold: {text: "Pensavo che l'arte astratta sia fredda", fix: "Pensavo che l'arte astratta fosse fredda"}
    - tutor: "Un grido, sì. Ma riascolta «pensavo che l'arte astratta sia fredda»: con «pensavo» al passato, quale tempo del congiuntivo ci vuole?"
      prompt: {text: "Pensavo che l'arte astratta sia fredda", tags: [subjunctive-use]}
    - learner: "Pensavo che l'arte astratta sarebbe fredda, allora."
      errors: [subjunctive-use]
    - tutor: "Pensavo che l'arte astratta fosse fredda, dici, e invece qui c'è un corpo che agisce. Ti viene in mente un altro artista che faccia qualcosa di simile?"
      goals: [interpret]
      recast: {text: "Pensavo che l'arte astratta sarebbe fredda", fix: "Pensavo che l'arte astratta fosse fredda", tags: [subjunctive-use]}
    - learner: "Mi fa pensare a Tàpies, a Barcellona: anche lui graffiava e bucava le superfici. Però Tàpies è più materico che Fontana, con la sabbia e la terra mescolate al colore, mentre qui c'è solo il taglio."
      errors: [comparative]
      gold: {text: "più materico che Fontana", fix: "più materico di Fontana"}
    - tutor: "Tàpies, ottimo confronto. Ma riprendi «più materico che Fontana»: davanti a un nome proprio, come si introduce il secondo termine del paragone?"
      prompt: {text: "più materico che Fontana", tags: [comparative]}
    - learner: "Con «di»: Tàpies è più materico di Fontana. Fontana toglie, Tàpies aggiunge."
    - tutor: "«Fontana toglie, Tàpies aggiunge»: me la rubo per le mie lezioni. Andiamo a vedere le altre tele?"
      goals: [compare]
    - learner: "Andiamo, ma prima voglio comprare una cartolina di questo quadro per mia madre. Una tela di un artista nato a Rosario come lei: le farà molta ilusión."
      errors: [word-choice]
    - tutor: "Le farà molto piacere, ne sono sicuro: una cartolina da Rosario a Rosario, passando per Milano. La libreria del museo è all'uscita, ci passiamo alla fine."
      recast: {text: "molta ilusión", fix: "molto piacere", tags: [word-choice]}
    - learner: "Perfetto, allora la compro alla fine. E dopo ti offro un caffè, per ringraziarti della lezione."
    - tutor: "Lezione gratuita, caffè accettato. Andiamo, che la sala dopo ti piacerà ancora di più."

- scenario: modi-di-dire
  # facts: la sera prima il learner aveva staccato il telefono dal caricatore e non l'aveva riattaccato; sveglia alle nove meno dieci con la riunione alle nove; chiavi e portafoglio rimasti sul tavolo della cucina; quaranta minuti di ritardo; un collega ha finto un guasto alla metro, il capo non ci ha creduto; la sorella consiglia due sveglie
  level: C2
  persona: en-m-traveller
  history: [tense-aspect, imperative-form]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Stamattina la sveglia non ha suonato, perché la sera prima avevo staccato il telefono dal caricatore e non l'avevo riattaccato. Mi sono svegliato alle nove meno dieci, con la riunione alle nove."
    - tutor: "Partenza col piede sbagliato, insomma! E poi?"
    - learner: "Poi sono uscito di corsa e, mentre correvo verso la metro, ho capito che le chiavi di casa sono rimaste sul tavolo della cucina, insieme al portafoglio."
      errors: [tense-aspect]
      gold: {text: "le chiavi di casa sono rimaste", fix: "le chiavi di casa erano rimaste"}
    - tutor: "Chiavi e portafoglio, il colpo doppio. Ma riprendi «ho capito che le chiavi sono rimaste sul tavolo»: le chiavi stavano lì da prima che tu te ne accorgessi; che tempo ci vuole?"
      prompt: {text: "le chiavi di casa sono rimaste", tags: [tense-aspect]}
    - learner: "Il trapassato: ho capito che le chiavi di casa erano rimaste sul tavolo. Quindi senza biglietto, senza caffè e chiuso fuori casa."
    - tutor: "Chiuso fuori e a digiuno: quando si dice piove sul bagnato! E alla riunione com'è andata?"
      goals: [tell]
    - learner: "«Piove sul bagnato», esatto! Alla riunione sono arrivato con quaranta minuti di ritardo, e un collega, per coprirmi, ha preteso che c'era stato un guasto alla metro."
      errors: [false-friend]
    - tutor: "Ha finto che ci fosse stato un guasto alla metro? Che amico! E il capo ci ha creduto?"
      goals: [react]
      recast: {text: "ha preteso", fix: "ha finto", tags: [false-friend]}
    # decoy: «pretendendo che siamo» uses «pretendere» correctly, with a correct subjunctive
    - learner: "Per niente, ha alzato un sopracciglio e basta. La colpa è in parte mia, lo ammetto: avrei dovuto mettere due sveglie, come dice sempre mia sorella. Ma in parte è del capo, che fissa le riunioni alle nove pretendendo che siamo tutti freschi come rose."
    - tutor: "Freschi come rose alle nove: il tuo capo vive su un altro pianeta. Ma tu, prima di andare a letto, il telefono lo controlli mai?"
      goals: [blame]
    - learner: "Di solito sì, ieri no. Comunque da oggi cambio vita: se mi vedi uscire senza chiavi, fammi un favore, dimmelo subito e non stammi a guardare ridendo, come fai sempre."
      errors: [imperative-form]
      gold: {text: "non stammi a guardare", fix: "non starmi a guardare"}
    - tutor: "Io rido solo un pochino! Ma riprendi «non stammi a guardare»: all'imperativo negativo con il tu, che forma prende il verbo?"
      prompt: {text: "non stammi a guardare", tags: [imperative-form]}
    - learner: "Non stai a guardarmi ridendo, volevo dire."
      errors: [imperative-form]
    - tutor: "«Non stare a guardarmi ridendo»: promesso, da domani rido di nascosto. E allora, la morale di questa giornata qual è?"
      recast: {text: "Non stai a guardarmi", fix: "Non stare a guardarmi", tags: [imperative-form]}
    - learner: "La morale è che il mattino ha l'oro in bocca, ma solo se ti svegli. E che una giornata storta, raccontata davanti a uno spritz, diventa quasi una barzelletta."
    - tutor: "Detto da maestro! Il mattino ha l'oro in bocca, e la sera lo spritz: alla salute."
      goals: [moral]

- scenario: modi-di-dire
  # facts: esame di diritto privato rimandato due volte; la learner ha studiato tutta la notte, si è addormentata sul treno ed è scesa a Parma invece che a Modena; quaranta minuti di ritardo, tempo insufficiente per lo scritto; voti la settimana prossima; andrà comunque all'orale; proverbio della nonna dell'amico: la gatta frettolosa fa i gattini ciechi
  level: C2
  persona: es-f-erasmus
  history: [auxiliary-choice]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Lascia stare: oggi avevo l'esame di diritto privato, quello che avevo già rimandato due volte. Ho studiato tutta la notte, e stamattina mi sono addormentata sul treno e sono scesa a Parma invece che a Modena."
    - tutor: "Addormentata sul treno: hai perso il treno anche se c'eri sopra! E poi?"
    - learner: "Poi ho preso il primo treno indietro, ma era un regionale che si fermava in ogni paese. Sono arrivata con quaranta minuti di ritardo, e per finire lo scritto non mi ha bastato il tempo."
      errors: [auxiliary-choice]
      gold: {text: "non mi ha bastato", fix: "non mi è bastato"}
    - tutor: "Quaranta minuti di ritardo all'esame, roba da incubo. Ma riprendi «non mi ha bastato il tempo»: «bastare», nei tempi composti, con quale ausiliare va?"
      prompt: {text: "non mi ha bastato", tags: [auxiliary-choice]}
    - learner: "Scusa: il tempo non mi ha mai bastato, in nessun esame."
      errors: [auxiliary-choice]
    - tutor: "«Il tempo non mi è mai bastato»: lo capisco, ma stavolta avevi anche quaranta minuti in meno. Come direbbe mia nonna, la gatta frettolosa fa i gattini ciechi. La conosci?"
      goals: [tell]
      recast: {text: "il tempo non mi ha mai bastato", fix: "il tempo non mi è mai bastato", tags: [auxiliary-choice]}
    - learner: "No, mai sentita! Vuol dire che se fai le cose di fretta vengono male? In spagnolo abbiamo «vísteme despacio, que tengo prisa», che è più o meno la stessa cosa."
    - tutor: "Esatto, il senso è quello: la fretta rovina il lavoro. Il vostro è perfino più elegante. Ma di chi è la colpa, alla fine: del treno o tua?"
      goals: [react]
    # decoy: «se mi fossi organizzata prima, avrei dormito» is a correct hypothetical
    - learner: "Del treno no, poverino, faceva il suo lavoro. La colpa è mia: se mi fossi organizzata prima, avrei dormito, e adesso non mi sentirei così burra davanti a te."
      errors: [word-choice]
    - tutor: "Così stupida? Ma figurati: sei una che studia di notte, come mezzo mondo. E il voto, quando lo sai?"
      goals: [blame]
      recast: {text: "così burra", fix: "così stupida", tags: [word-choice]}
    # decoy: «piuttosto che rimandarlo» is «piuttosto che» in its correct sense
    - learner: "I voti escono la settimana prossima. All'orale, comunque, ci vado lo stesso, anche se lo scritto non è andato bene: piuttosto che rimandarlo un'altra volta, preferisco prendere un diciotto."
    - tutor: "Piuttosto che rimandarlo, meglio un diciotto: saggia. Allora, che cosa hai imparato da questa giornata?"
    - learner: "Ho imparato che chi dorme non piglia pesci, ma chi non dorme sbaglia treno. E che la prossima volta comincerò a studiare un mese prima, anche se non me lo creo neanche io."
      errors: [word-choice]
    - tutor: "«Chi non dorme sbaglia treno»: questa la rubo! E «anche se non ci credo neanche io», dici? Io ci credo ancora meno."
      goals: [moral]
      recast: {text: "non me lo creo neanche io", fix: "non ci credo neanche io", tags: [word-choice]}
    - learner: "Lo so, lo so. Brindiamo al diciotto, allora, e al treno che domani prenderò bella sveglia."
    - tutor: "Al diciotto e al treno! E stasera metti due sveglie, mi raccomando."

- scenario: pranzo-domenicale
  # facts: pranzo domenicale a Bologna; la lasagna l'ha fatta la zia dell'amico; la suocera della learner è di Modena e dice che a Bologna si mette troppa besciamella; il marito della learner ha rifatto il ragù della madre, che non gli aveva dato tutta la ricetta: mancava il latte
  level: C2
  persona: en-f-professional
  history: [ci-ne, combined-pronouns]
  turns:
    - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Grazie, ma con quest'odore di ragù non prometto di non mordere io! «Scannarsi», immagino, vuol dire litigare ferocemente, ma senza farsi male davvero, giusto?"
    - tutor: "Giusto: alla lettera è tagliarsi la gola, ma a tavola vuol dire solo litigare con passione. Qui ci si scanna per la lasagna e poi si fa pace col dolce. Ne vuoi un pezzo?"
      goals: [react]
    - learner: "Ne prendo volentieri un pezzo piccolo, grazie. Ma prima dimmi: chi l'ha fatta? Perché mia suocera, che è di Modena, sostiene che a Bologna la besciamella ne mettete troppa."
      errors: [ci-ne]
      gold: {text: "la besciamella ne mettete troppa", fix: "di besciamella ne mettete troppa"}
    - tutor: "L'ha fatta mia zia, e guai a chi la critica! Ma riprendi «la besciamella ne mettete troppa»: se la riprendi con «ne», come deve cominciare la frase?"
      prompt: {text: "la besciamella ne mettete troppa", tags: [ci-ne]}
    - learner: "Con «di»: di besciamella ne mettete troppa. Almeno, così dice mia suocera."
    - tutor: "Tua suocera ha torto, ma non diciamolo a mia zia. Ce l'hai un modo di dire italiano per una situazione così?"
    # decoy: «due galli in un pollaio» and «andare a farsi benedire» are correct idioms
    - learner: "Ci provo: mia suocera e tua zia, insieme in cucina, sarebbero come due galli in un pollaio, e alla fine il pranzo andrebbe a farsi benedire."
    - tutor: "Due galli in un pollaio, e il pranzo a farsi benedire: sembri nata a Bologna. In inglese c'è qualcosa di simile?"
      goals: [use-idiom]
    - learner: "C'è «too many cooks spoil the broth», cioè troppi cuochi rovinano il brodo. Mi piace che in italiano la stessa idea sia molto più rumorosa, con i galli che si beccano, mentre noi restiamo educati anche nei proverbi."
    - tutor: "Troppi cuochi o due galli: stesso disastro, animali diversi. E ce l'hai un aneddoto che finisca con un proverbio?"
      goals: [compare]
    - learner: "Ce l'ho. L'anno scorso mio marito ha voluto rifare il ragù di sua madre, ma lei la ricetta non gli la aveva data tutta: mancava il latte, e il ragù sapeva di cartone."
      errors: [combined-pronouns]
      gold: {text: "non gli la aveva data", fix: "non gliel'aveva data"}
    - tutor: "Il latte nel ragù, il segreto delle nonne! Ma ripeti «non gli la aveva data»: quando «gli» incontra «la», i due pronomi restano separati?"
      prompt: {text: "non gli la aveva data", tags: [combined-pronouns]}
    - learner: "Non glie la aveva data tutta, ecco."
      errors: [combined-pronouns]
    - tutor: "Non gliel'aveva data tutta, la furbona! E il proverbio con cui chiudi?"
      recast: {text: "glie la aveva data", fix: "gliel'aveva data", tags: [combined-pronouns]}
    - learner: "Fidarsi è bene, non fidarsi è meglio, soprattutto delle suocere! Da allora mio marito, prima di cucinare, interroga sua madre come un detective, e lei ogni volta finge di dimenticarsi un ingrediente."
    - tutor: "Fidarsi è bene, non fidarsi è meglio: chiusura da manuale. Adesso però mangia, prima che la lasagna finisca davvero!"
      goals: [anecdote]

- scenario: cena-suoceri
  # facts: casa elegante a Firenze; la compagna si chiama Giulia; la madre ha preparato la ribollita; il learner fa l'ingegnere ambientale, impianti di depurazione per i comuni, lavora a un progetto a Prato, vorrebbe aprire uno studio in Toscana; il padre si chiama Paolo, ha conosciuto la moglie a un concerto nel 1989, lei ha detto di no tre volte; la nonna inglese del learner faceva una torta di mele
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use, register]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Le assicuro che sono in carne e ossa, anche se dopo tre ore di treno un po' meno ossa. Grazie dell'invito: è un piacere conoscervi finalmente, e la casa è ancora più bella di come Giulia me l'aveva descritta."
    - tutor: "Giulia esagera sempre, tranne che con Lei, a quanto pare. Mia moglie ha preparato la ribollita: spero che Le piaccia la cucina povera."
    - learner: "La adoro, la cucina povera, soprattutto quando è fatta così, signora. Non credo che Giulia mi ha mai portato in una trattoria con una ribollita così buona, e me ne ha fatte provare parecchie."
      errors: [subjunctive-use]
      gold: {text: "Non credo che Giulia mi ha mai portato", fix: "Non credo che Giulia mi abbia mai portato"}
    - tutor: "Mia moglie arrossisce, e non succede spesso. Ma riascolti «non credo che Giulia mi ha mai portato»: dopo «non credo che», quale modo vuole il verbo?"
      prompt: {text: "Non credo che Giulia mi ha mai portato", tags: [subjunctive-use]}
    - learner: "Il congiuntivo, mi scusi: non credo che Giulia mi abbia mai portato in una trattoria così. E lo dico sinceramente, non per piaggeria."
    - tutor: "Lo prendo per buono. E di che cosa si occupa, esattamente? Giulia è stata piuttosto vaga."
      goals: [compliment]
    - learner: "Faccio l'ingegnere ambientale: progetto impianti di depurazione delle acque per i comuni. Adesso lavoro a un progetto a Prato, e se tutto va bene l'anno prossimo vorrei aprire uno studio mio, magari proprio qui in Toscana."
    - tutor: "Depurazione delle acque: un mestiere serio, almeno non è un artista. Sa che nella nostra famiglia gli ingegneri sono sempre stati considerati dei poeti mancati?"
      goals: [background]
    # decoy: «gliela dedicherei» and «me la critichi» are correct
    - learner: "Allora spero di essere almeno un poeta mancato con un buon impiego. E se un giorno dovessi scrivere una poesia, gliela dedicherei, a patto che non me la critichi come critica le trattorie fiorentine."
    - tutor: "Colpito. Mia moglie ride, e per Lei è un ottimo segno. A questo punto, non Le sembra ora di darci del tu? Io sono Paolo."
      goals: [irony]
    - learner: "Con molto piacere, anche se mi ci vorrà un po' per abituarmi. Allora grazie, Paolo: e se Le va, dopo cena vorrei che mi raccontassi come vi siete conosciuti tu e tua moglie."
      errors: [register]
      gold: {text: "se Le va", fix: "se ti va"}
    - tutor: "Ti abituerai prestissimo. Però già in questa frase dici «se Le va» e poi «mi raccontassi»: a me, adesso, che cosa dai?"
      prompt: {text: "se Le va", tags: [register]}
    - learner: "Il tu, hai ragione: se ti va, dopo cena vorrei che mi raccontassi come vi siete conosciuti."
    - tutor: "A un concerto, nel 1989, e lei mi ha detto di no tre volte. Ma questa è una storia da dolce e da vin santo."
      goals: [tu-lei]
    - learner: "Aspetto il vin santo con impazienza. E la prossima volta il dolce lo porto io: una torta di mele di mia nonna, con molto cannella e un po' di zenzero."
      errors: [noun-gender]
      gold: {text: "molto cannella", fix: "molta cannella"}
    - tutor: "Una torta della nonna inglese: accettata a scatola chiusa. Ma senti «molto cannella»: «cannella» è maschile o femminile?"
      prompt: {text: "molto cannella", tags: [noun-gender]}
    - learner: "Femminile: con molta cannella. Mia nonna sarebbe fiera di sapere che la sua torta arriva fino a Firenze."
    - tutor: "Allora aspettiamo te e la torta. E adesso, vin santo e la storia del concerto."

- scenario: cena-suoceri
  # facts: il compagno si chiama Andrea; la madre ha fatto il peposo; la learner insegna spagnolo in un liceo linguistico di Firenze, il pomeriggio dà lezioni di flamenco, l'anno prossimo vuole fare il concorso per entrare di ruolo; il padre si chiama Franco; da giovane suonava la chitarra nel gruppo «I Lupi dell'Arno»; la storia dopo il dolce
  level: C2
  persona: es-f-teacher
  history: [hypothetical, subjunctive-use]
  turns:
    - tutor: "Prego, si sieda pure. Mio figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Eccomi qui, invece, in carne e ossa e anche un po' emozionata. Grazie per l'invito: Andrea mi aveva detto che sua madre cucina benissimo, ma non mi aveva detto che la tavola sarebbe stata così elegante."
    - tutor: "Andrea parla poco: è un difetto di famiglia. Mia moglie ha fatto il peposo, un piatto che a molti stranieri sembra troppo forte."
    - learner: "A me piace proprio per questo: è deciso, senza compromessi, come la cucina della mia terra. E le confesso che, anche se non avrei fame, lo finirei fino all'ultimo boccone."
      errors: [hypothetical]
      gold: {text: "anche se non avrei fame", fix: "anche se non avessi fame"}
    - tutor: "Mia moglie già sorride. Ma riascolti «anche se non avrei fame»: in un'ipotesi introdotta da «se», il condizionale ci può stare?"
      prompt: {text: "anche se non avrei fame", tags: [hypothetical]}
    - learner: "No: anche se non avessi fame, lo finirei fino all'ultimo boccone. Ed è proprio buonissimo, signora."
    - tutor: "Allora le diamo il bis. E di che cosa si occupa? Andrea dice soltanto che «insegna», come se fosse un segreto di Stato."
      goals: [compliment]
    - learner: "Insegno spagnolo in un liceo linguistico di Firenze, e il pomeriggio do lezioni di flamenco, ma questo Andrea preferisce non raccontarlo. L'anno prossimo vorrei presentarmi alle oposizioni per entrare di ruolo, così da avere un contratto stabile."
      errors: [word-choice]
    - tutor: "Il flamenco! Questo Andrea ce l'aveva nascosto. E fa bene a presentarsi al concorso: un posto di ruolo dà tranquillità. Spero solo che non lo balli in casa, sul parquet di sua nonna."
      recast: {text: "alle oposizioni", fix: "al concorso", tags: [word-choice]}
      goals: [background]
    # decoy: «glielo farò vedere» is a correct combined pronoun
    - learner: "Stia tranquillo: il parquet di sua nonna è al sicuro, il flamenco lo ballo solo in palestra. E se un giorno vorrà vederlo, glielo farò vedere volentieri, ma non glielo insegnerò: Andrea dice che lei ha due piedi sinistri."
    - tutor: "Due piedi sinistri, e tutti e due toscani, lo ammetto. Senta, a questo punto direi di darci del tu: io sono Franco."
      goals: [irony]
    - learner: "Molto volentieri, Franco, anche se all'inizio mi verrà da ridere. Ti confesso che ero molto nerviosa prima di suonare il campanello: Andrea mi aveva detto che sei un uomo molto ironico e un po' severo."
      errors: [word-choice]
    - tutor: "Nervosa, tu? Non si direbbe proprio. E severo, poi: Andrea esagera, come sempre. Ti posso offrire ancora un po' di vino?"
      goals: [tu-lei]
      recast: {text: "nerviosa", fix: "nervosa", tags: [word-choice]}
    - learner: "Un dito, grazie. E adesso che ci diamo del tu, posso chiederti una cosa? Andrea mi ha raccontato che da giovane suonavi la chitarra in un gruppo: vorrei che me lo racconti tu, perché lui non ricorda neanche il nome."
      errors: [subjunctive-use]
      gold: {text: "vorrei che me lo racconti", fix: "vorrei che me lo raccontassi"}
    - tutor: "Il gruppo! Si chiamava «I Lupi dell'Arno», e non eravamo granché. Ma riprendi «vorrei che me lo racconti tu»: dopo «vorrei che», quale tempo del congiuntivo si usa?"
      prompt: {text: "vorrei che me lo racconti", tags: [subjunctive-use]}
    - learner: "Vorrei che me lo abbia raccontato tu, cioè..."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che me lo raccontassi tu»: va bene, te lo racconto, ma solo dopo il dolce. E tu prometti di non ridere."
      recast: {text: "Vorrei che me lo abbia raccontato", fix: "Vorrei che me lo raccontassi", tags: [subjunctive-use]}
    - learner: "Prometto, almeno finché non arriviamo al nome del gruppo: «I Lupi dell'Arno» è già un capolavoro."
    - tutor: "Vedi? Hai già riso. Ecco il dolce: mettiti comoda, la storia è lunga."

- scenario: condoglianze
  # facts: casa di famiglia in un paese della Puglia; la madre del collega aveva ottantotto anni, aveva aperto una sartoria in paese da giovane; il learner l'aveva conosciuta alla festa di Natale di due anni fa; giovedì incontro con il cliente di Bari, il dossier è nella cartella blu sulla scrivania del collega; funerale domani alle dieci nella chiesa madre
  level: C2
  persona: en-m-heritage
  history: [imperative-form, subjunctive-use]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Non è un disturbo, anzi: ci tenevo a venire di persona. Le porgo le mie più sentite condoglianze, anche a nome di tutto l'ufficio. Sua madre era una donna speciale, e so quanto eravate legati."
    - tutor: "Grazie. Era una donna forte: ottantotto anni, e fino all'ultimo ha voluto fare tutto da sola. L'aveva conosciuta, vero, alla festa di Natale?"
      goals: [condolences]
    - learner: "Sì, due anni fa. Ricordo che mi raccontò di quando, da giovane, aveva aperto una sartoria in paese senza chiedere il permesso a nessuno, e rideva dicendo che i permessi li chiedono solo quelli che hanno paura."
    - tutor: "È proprio lei, quella. Mi fa bene sentirla raccontare da qualcun altro."
      goals: [memory]
    - learner: "Se posso permettermi, vorrei aiutarla almeno con il lavoro. Giovedì c'è l'incontro con il cliente di Bari: potrei andarci io, e Lei non si preoccupa di niente, ci penso io a tutto."
      errors: [imperative-form]
      gold: {text: "Lei non si preoccupa", fix: "Lei non si preoccupi"}
    - tutor: "Sarebbe un grande aiuto, davvero. Solo una cosa: «Lei non si preoccupa» lo dice come un invito, quindi quale forma dell'imperativo di cortesia ci vuole?"
      prompt: {text: "Lei non si preoccupa", tags: [imperative-form]}
    - learner: "Mi scusi: non si preoccupa di niente, volevo dire, ci penso io."
      errors: [imperative-form]
    - tutor: "«Non si preoccupi di niente»: grazie, lo farò. Il dossier del cliente di Bari è sulla mia scrivania, nella cartella blu."
      goals: [offer-help]
      recast: {text: "non si preoccupa di niente", fix: "non si preoccupi di niente", tags: [imperative-form]}
    # decoy: «assistere al funerale» uses «assistere» correctly
    - learner: "Lo prendo domani mattina. E per il funerale, posso chiederle a che ora sarà? Mi farebbe piacere attendere la cerimonia, se per la famiglia non è un problema."
      errors: [false-friend]
    - tutor: "Domani alle dieci, nella chiesa madre del paese. Se vuole assistere alla cerimonia, per noi sarà un onore averla lì."
      recast: {text: "attendere la cerimonia", fix: "assistere alla cerimonia", tags: [false-friend]}
    # decoy: «che i suoi fratelli le stiano vicino» is a correct subjunctive
    - learner: "Ci sarò, allora. Spero che domani riesce a riposare almeno un po', e che i suoi fratelli le stiano vicino in questi giorni."
      errors: [subjunctive-use]
      gold: {text: "Spero che domani riesce", fix: "Spero che domani riesca"}
    - tutor: "Ci proverò, anche se in queste case non si dorme mai. Ma riascolti «spero che domani riesce a riposare»: dopo «spero che», quale modo? Subito dopo lei lo usa."
      prompt: {text: "Spero che domani riesce", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: spero che domani riesca a riposare. Adesso la lascio con la sua famiglia, non voglio rubarle altro tempo."
    - tutor: "Non ha rubato niente, anzi. Grazie ancora di essere venuto fin qui, e a domani."
      goals: [leave]

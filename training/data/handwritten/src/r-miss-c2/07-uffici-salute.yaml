# Set r-miss-c2, file 7: the registry office, complaints at the town hall, insurance claims, a
# cardiologist, a team meeting. Formal turns hide one slip near the end: «aspetta che io gli
# pago», «a parte di», «in vista al», «cosa ci pensa», «me ne ha chiesto scusa», «mentre ho
# salito», «rimanerà», «non abbi paura», plus Spanish and English words (embarazzata, accidente).
- scenario: burocrazia-residenza
  # facts: la learner è spagnola, dottoranda; documenti: documento d'identità, contratto d'affitto registrato, iscrizione al dottorato, tessera sanitaria europea; contratto firmato a settembre, non ancora registrato perché il proprietario aspetta la metà dell'imposta; si accetta la ricevuta della richiesta di registrazione; sull'iscrizione il cognome è «Serano» invece di «Serrano»; invio per e-mail; registrazione entro due giorni lavorativi, controllo di un vigile entro quarantacinque giorni, avviso con numero da chiamare se non la trova
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono spagnola, faccio un dottorato qui all'università e vorrei trasferire la residenza in questo Comune. Può dirmi quali documenti servono a una cittadina europea?"
    - tutor: "Le servono il documento d'identità, il contratto d'affitto registrato, l'iscrizione al dottorato e la tessera sanitaria europea. Li ha con sé?"
      goals: [request]
    - learner: "Quasi tutti. Il documento, l'iscrizione e la tessera li ho qui; il contratto, invece, l'abbiamo firmato a settembre, ma il proprietario non l'ha ancora registrato, perché aspetta che io gli pago la mia metà dell'imposta."
      errors: [subjunctive-use]
      gold: {text: "aspetta che io gli pago", fix: "aspetta che io gli paghi"}
    - tutor: "Allora per ora il contratto non è utilizzabile. Ma riprenda «aspetta che io gli pago»: dopo «aspettare che», quale modo si usa?"
      prompt: {text: "aspetta che io gli pago", tags: [subjunctive-use]}
    - learner: "Aspetta che io gli pagassi la mia metà, scusi."
      errors: [subjunctive-use]
    - tutor: "«Aspetta che io gli paghi la mia metà», quindi tocca a lei. Senza contratto registrato, però, posso accettare la ricevuta della richiesta di registrazione. Riesce a procurarsela?"
      goals: [documents]
      recast: {text: "Aspetta che io gli pagassi", fix: "aspetta che io gli paghi", tags: [subjunctive-use]}
    - learner: "Sì: se pago oggi pomeriggio, il proprietario dovrebbe registrarlo entro domani. Posso mandargliela per e-mail, o devo tornare qui di persona con la ricevuta?"
    - tutor: "Per e-mail va benissimo, all'indirizzo dell'anagrafe che le scrivo qui. C'è però un altro problema: sull'iscrizione al dottorato il suo cognome risulta con una sola erre."
    - learner: "Ha ragione, che disastro: hanno scritto «Serano» invece di «Serrano», e io non me ne sono accorta. È solo un errore di battitura: posso chiedere in segreteria una constancia corretta già domani mattina."
      errors: [word-choice]
    - tutor: "Un attestato corretto va benissimo, e lo può mandare insieme alla ricevuta del contratto. Così la pratica è completa."
      goals: [problem]
      recast: {text: "una constancia corretta", fix: "un attestato corretto", tags: [word-choice]}
    # decoy: «una volta che la pratica sia completa» and «perché la residenza venga registrata» are correct
    - learner: "Perfetto. E una volta che la pratica sia completa, quanto tempo ci vuole perché la residenza venga registrata? Mi serve per aprire un conto in banca."
    - tutor: "La registrazione è fatta entro due giorni lavorativi; poi, entro quarantacinque giorni, passa un vigile a controllare che lei abiti davvero lì. Per la banca le basta il certificato provvisorio."
      goals: [next]
    - learner: "Benissimo. E se il vigile passa mentre sono in università? Sto in laboratorio dalla mattina alla sera, e torno a casa solo per dormire, a parte di qualche fine settimana."
      errors: [preposition]
      gold: {text: "a parte di qualche fine settimana", fix: "a parte qualche fine settimana"}
    - tutor: "Se non la trova, le lascia un avviso con un numero da chiamare per fissare un orario. Ma riprenda «a parte di qualche fine settimana»: dopo «a parte», quel «di» ci vuole?"
      prompt: {text: "a parte di qualche fine settimana", tags: [preposition]}
    - learner: "No: a parte qualche fine settimana. Allora, se trovo l'avviso, chiamo e fisso un appuntamento."
    - tutor: "Esatto. Aspetto per e-mail la ricevuta del contratto e l'attestato corretto, e la pratica parte."
    - learner: "Li mando domani entro mezzogiorno. Grazie mille per la pazienza: pensavo che sarebbe stato molto più complicato."
    - tutor: "Grazie a lei. Buona giornata, e buon lavoro in laboratorio."

- scenario: reclamo-comune
  # facts: via Mameli 18, cantiere abbandonato da due mesi, buca davanti al portone coperta da una tavola di legno; lavori per la fibra ottica, competenza della ditta concessionaria; tre telefonate alla ditta; un ciclista ha quasi avuto un incidente; segnalazione di pericolo alla Polizia locale, intervento entro quarantotto ore; reclamo formale con il modulo dell'URP, risposta scritta entro trenta giorni; protocollo numero 5631; l'impiegato richiama venerdì
  level: C2
  persona: en-m-retired
  history: [subjunctive-use, ci-ne]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via Mameli 18, dove da due mesi c'è un cantiere abbandonato: hanno aperto una buca davanti al portone, l'hanno coperta con una tavola di legno e da allora non si è più visto nessuno."
    - tutor: "Capisco. Probabilmente sono i lavori per la fibra ottica, che sono di competenza della ditta concessionaria. Ha già provato a contattarla?"
      goals: [describe]
    - learner: "Sì, tre volte, ma ogni volta mi rispondono con le stesse parole, come se leggessero un copione. Intanto la tavola si è già spostata due volte, e ieri un ciclista ha quasi avuto un accidente."
      errors: [false-friend]
    - tutor: "Un ciclista che ha quasi avuto un incidente: questo cambia le cose, è un pericolo concreto. Purtroppo il Comune può solo sollecitare la ditta; i tempi non dipendono da noi."
      recast: {text: "un accidente", fix: "un incidente", tags: [false-friend]}
    # decoy: «non che si mandi» is a correct subjunctive
    - learner: "Mi perdoni, ma questa risposta non mi basta. Il suolo è pubblico, e il Comune risponde della sicurezza della strada: mi aspetto che qualcuno viene a vedere la buca entro questa settimana, non che si mandi un'altra e-mail alla ditta."
      errors: [subjunctive-use]
      gold: {text: "mi aspetto che qualcuno viene", fix: "mi aspetto che qualcuno venga"}
    - tutor: "Ha ragione a insistere, e lo annoto. Ma riascolti «mi aspetto che qualcuno viene a vedere»: dopo «aspettarsi che», quale modo? Nella frase dopo lo usa bene."
      prompt: {text: "mi aspetto che qualcuno viene", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: mi aspetto che qualcuno venga a vedere la buca entro questa settimana."
    - tutor: "Ricevuto. Posso fare una segnalazione di pericolo alla Polizia locale, che deve intervenire entro quarantotto ore."
      goals: [insist]
    - learner: "Questo mi sembra già più concreto. E se dopo quarantotto ore non si fosse visto nessuno, che cosa potrei fare? Esiste una procedura formale di reclamo, con una risposta scritta?"
    - tutor: "Sì: può presentare un reclamo formale con il modulo dell'URP, e il Comune deve risponderle per iscritto entro trenta giorni. Se vuole, la aiuto a compilarlo adesso."
      goals: [rights]
    - learner: "Volentieri. Ho una decina di foto della buca e della tavola spostata: le allego tutte? E sinceramente, lei cosa ci pensa di una ditta che lascia una buca aperta per due mesi?"
      errors: [ci-ne]
      gold: {text: "cosa ci pensa", fix: "cosa ne pensa"}
    - tutor: "Le alleghi tutte, con la data. Quanto alla ditta, a titolo personale la trovo inaccettabile. Ma riprenda «cosa ci pensa»: per chiedere un'opinione su qualcosa, la particella giusta è «ci»?"
      prompt: {text: "cosa ci pensa", tags: [ci-ne]}
    - learner: "Giusto, scusi: lei cosa ne pensa, di una ditta che lascia una buca aperta per due mesi?"
    - tutor: "Ne penso tutto il male possibile, ma resti tra noi. Allora: segnalazione di pericolo oggi stesso e reclamo formale con le foto. Il numero di protocollo glielo do appena lo registro."
    - learner: "Perfetto. Le lascio anche il mio numero di telefono, nel caso in cui i vigili avessero bisogno di entrare nel cortile: sono quasi sempre a casa, perché sono retirato da tre anni."
      errors: [word-choice]
    - tutor: "Se è in pensione, tanto meglio: i vigili la troveranno di sicuro. Ecco il protocollo, numero 5631. Venerdì la richiamo io per dirle se il sopralluogo è stato fatto."
      goals: [commitment]
      recast: {text: "retirato", fix: "in pensione", tags: [word-choice]}
    - learner: "La ringrazio, è la prima risposta concreta che ricevo in due mesi. Aspetto la sua telefonata venerdì."
    - tutor: "A venerdì, allora. E speriamo che quella tavola resti al suo posto fino al sopralluogo."

- scenario: assicurazione-sinistro
  # facts: ieri verso le sei di sera, rotatoria di viale Europa; una Panda grigia è entrata senza dare la precedenza e ha colpito la fiancata sinistra; trenta all'ora, pioggia da un'ora; nessun ferito; l'altro conducente ha chiesto scusa e l'ha ammesso davanti al farmacista dell'angolo; constatazione amichevole firmata da entrambi, manca il numero di polizza dell'altro ma c'è la targa; carrozzeria convenzionata pagata direttamente con auto sostitutiva, perito entro tre giorni lavorativi
  level: C2
  persona: en-f-student
  history: [tense-aspect, ci-ne]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri verso le sei di sera ero già dentro la rotatoria di viale Europa quando una Panda grigia è entrata senza dare la precedenza e mi ha colpito la fiancata sinistra."
    - tutor: "Lei e l'altro conducente state bene? E più o meno a che velocità andava, al momento dell'urto?"
    - learner: "Stiamo bene tutti e due, per fortuna. Andavo piano, sui trenta all'ora, perché pioveva da un'ora e l'asfalto è stato scivolosissimo."
      errors: [tense-aspect]
      gold: {text: "l'asfalto è stato scivolosissimo", fix: "l'asfalto era scivolosissimo"}
    - tutor: "Meno male che state bene. Ma riprenda «l'asfalto è stato scivolosissimo»: per descrivere le condizioni della strada in quel momento, quale tempo si usa?"
      prompt: {text: "l'asfalto è stato scivolosissimo", tags: [tense-aspect]}
    - learner: "L'imperfetto: l'asfalto era scivolosissimo. E la Panda, secondo me, andava molto più veloce di me."
    - tutor: "Chiaro. E l'altro conducente ha riconosciuto di non aver dato la precedenza?"
      goals: [what]
    - learner: "Sì, subito, e me ne ha chiesto scusa più volte. L'ha ammesso anche davanti a un testimone, il farmacista dell'angolo, che ha visto tutta la scena dalla vetrina e mi ha lasciato il suo numero."
    - tutor: "Un testimone in farmacia è prezioso: si tenga stretto quel numero."
    - learner: "Certo. Quindi la colpa è sua, no?"
    - tutor: "Con la sua ammissione e un testimone, la responsabilità sembra chiara, sì. Avete compilato la constatazione amichevole?"
      goals: [responsibility]
    # decoy: «prima che li spostassimo» is a correct subjunctive
    - learner: "Sì, l'abbiamo firmata tutti e due sul posto, e ho fatto le foto ai due veicoli prima che li spostassimo. Il problema è che nella fretta non ho scritto il numero di politica dell'altro, anche se la targa ce l'ho."
      errors: [false-friend]
    - tutor: "Non si preoccupi: con la targa il numero di polizza lo recuperiamo noi dalla banca dati. Mi manda la constatazione e le foto per e-mail?"
      recast: {text: "numero di politica", fix: "numero di polizza", tags: [false-friend]}
      goals: [documents]
    - learner: "Gliele mando subito dopo la telefonata. E per la riparazione, posso portare la macchina dal mio meccanico, o devo andare in una carrozzeria della vostra lista? La uso ogni giorno per l'università, e senza mi sento un po' perduta."
      errors: [word-choice]
    - tutor: "Senza macchina si sente persa, la capisco: se va in una carrozzeria convenzionata, la riparazione la paghiamo direttamente noi e le danno un'auto sostitutiva. Le mando l'elenco per e-mail?"
      recast: {text: "perduta", fix: "persa", tags: [word-choice]}
    # decoy: «quanto tempo pensa che ci vorrà» and «spero che la perizia non duri» are correct
    - learner: "Sì, grazie. E quanto tempo pensa che ci vorrà, prima che la carrozzeria possa cominciare? Spero che la perizia non duri settimane, perché a fine mese devo andare a Torino."
    - tutor: "Con la carrozzeria convenzionata il perito passa direttamente lì, di solito entro tre giorni lavorativi: a fine mese dovrebbe avere la macchina."
      goals: [next]
    - learner: "Perfetto, allora porto la macchina in carrozzeria domani. Grazie, è stato molto chiaro."
    - tutor: "Grazie a lei. Il numero del sinistro glielo mando con l'elenco: lo citi sempre, quando ci contatta."

- scenario: medico-specialista
  # facts: mal di testa leggero e cuore che batte forte la mattina, dura mezz'ora; capogiro salendo l'ultima rampa con la spesa, quattro piani; padre con pressione alta, fratello in cura, madre con un piccolo ictus verso i settant'anni; cuore sano, pressione centocinquanta su novantacinque; ramipril due virgola cinque milligrammi ogni mattina; misurare la pressione due volte al giorno per due settimane; effetto collaterale possibile: tosse secca; controllo tra un mese
  level: C2
  persona: en-m-retired
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Buongiorno, dottore. Abbastanza bene, ma ogni tanto, soprattutto la mattina appena alzato, sento un leggero mal di testa e il cuore che batte più forte, come se avessi fatto le scale di corsa."
    - tutor: "Mi descriva meglio: quanto dura, e le capita anche durante la giornata?"
    - learner: "Dura una mezz'ora, poi passa da solo. Durante la giornata no, tranne una volta, la settimana scorsa: portavo la spesa su per quattro piani e, mentre ho salito l'ultima rampa, mi è girata la testa."
      errors: [tense-aspect]
      gold: {text: "mentre ho salito", fix: "mentre salivo"}
    - tutor: "Questo è importante. Ma riprenda «mentre ho salito l'ultima rampa»: con «mentre», per un'azione in corso interrotta da un'altra, quale tempo si usa?"
      prompt: {text: "mentre ho salito", tags: [tense-aspect]}
    - learner: "L'imperfetto: mentre salivo l'ultima rampa, mi è girata la testa, e ho dovuto sedermi sui gradini."
    - tutor: "Grazie, è un dettaglio prezioso. In famiglia qualcuno soffre di pressione alta o di problemi di cuore?"
      goals: [symptoms]
    - learner: "Mio padre ha avuto la pressione alta per tutta la vita, e mio fratello maggiore prende delle pillole da anni. Mia madre, verso i settant'anni, ha avuto un piccolo ictus, ma si è ripresa completamente."
    - tutor: "Allora la familiarità c'è. Gli esami dicono che il cuore è sano, ma la pressione è alta: centocinquanta su novantacinque."
      goals: [history]
    # decoy: «vorrei capire se dipenda», a subjunctive in an indirect question, is correct
    - learner: "Centocinquanta su novantacinque: è grave? E mi scusi, ma vorrei capire se il mal di testa della mattina dipenda dalla pressione o da qualcos'altro."
    - tutor: "Non è grave, ma va curata: il mal di testa al risveglio è tipico della pressione alta, e il capogiro sulle scale anche. Le prescrivo una cura, d'accordo?"
      goals: [understand]
    - learner: "D'accordo. Ma preferirei che lei mi spieghi bene cosa devo prendere e quando, perché mia moglie dice che sono capace di dimenticare anche il mio nome."
      errors: [subjunctive-use]
      gold: {text: "preferirei che lei mi spieghi", fix: "preferirei che lei mi spiegasse"}
    - tutor: "Le scrivo tutto su un foglio, non si preoccupi. Ma riascolti «preferirei che lei mi spieghi»: dopo un condizionale come «preferirei», quale tempo del congiuntivo ci vuole?"
      prompt: {text: "preferirei che lei mi spieghi", tags: [subjunctive-use]}
    - learner: "Preferirei che lei mi abbia spiegato, intendevo."
      errors: [subjunctive-use]
    - tutor: "«Preferirei che lei mi spiegasse»: eccomi. Una compressa di ramipril da due virgola cinque milligrammi ogni mattina, a colazione, e misuri la pressione due volte al giorno per due settimane."
      recast: {text: "preferirei che lei mi abbia spiegato", fix: "preferirei che lei mi spiegasse", tags: [subjunctive-use]}
    - learner: "Una compressa ogni mattina, va bene. Ci sono effetti collaterali che devo tenere d'occhio? Un mio amico prende una medicina simile e dice che gli dà una tosse molto fastidiosa, soprattutto di notte."
    - tutor: "Sì, la tosse secca è l'effetto collaterale più frequente: se compare, me lo dica e cambiamo farmaco. Ci rivediamo tra un mese con i valori."
      goals: [treatment]
    - learner: "Perfetto. Allora misurerò la pressione mattina e sera e noterò i valori su un quaderno, così tra un mese li guardiamo insieme."
      errors: [false-friend]
    - tutor: "«Annoterò i valori su un quaderno»: ottimo, e accanto a ogni valore scriva anche l'ora."
      recast: {text: "noterò", fix: "annoterò", tags: [false-friend]}
    - learner: "Lo farò. Grazie, dottore, mi sento già più tranquillo."
    - tutor: "Ne sono contento. Arrivederci, e a fra un mese."

- scenario: riunione-lavoro
  # facts: sito del museo pronto al settanta per cento, testi tradotti in tre lingue, biglietteria online testata ieri; il museo doveva mandare le foto delle sale entro la fine del mese scorso, due solleciti; lancio il quindici; più di duecento foto con licenza libera nell'archivio online del museo; rinvio massimo al ventidue; Paolo è libero da giovedì; schede caricate entro il venti; riassunto per e-mail entro mezzogiorno
  level: C2
  persona: en-m-heritage
  history: [future-form, ci-ne]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Il sito del museo è pronto al settanta per cento: la struttura c'è, i testi sono stati tradotti in tre lingue, e la biglietteria online l'abbiamo testata ieri senza problemi."
    - tutor: "Settanta per cento è un buon punto. Ma dalla tua faccia direi che c'è un «però»."
      goals: [update]
    # decoy: «ce le avrebbe mandate» is a correct future in the past
    - learner: "C'è un «però» grosso: le foto delle sale. Il museo ci aveva promesso che ce le avrebbe mandate entro la fine del mese scorso, e invece non è arrivato niente, nonostante due solleciti."
    - tutor: "Due solleciti e niente: tipico. E senza foto, che cosa ti blocca, di preciso?"
      goals: [problem]
    - learner: "Mi blocca la homepage e le schede delle opere. Se le foto non arrivano entro venerdì, il sito rimanerà vuoto proprio nelle pagine più importanti, e il lancio del quindici salta."
      errors: [future-form]
      gold: {text: "il sito rimanerà vuoto", fix: "il sito rimarrà vuoto"}
    - tutor: "Il lancio del quindici non può saltare, il direttore ci tiene. Ma ripeti «il sito rimanerà vuoto»: il futuro di «rimanere» si forma davvero così?"
      prompt: {text: "il sito rimanerà vuoto", tags: [future-form]}
    - learner: "Il sito rimanirà vuoto, voglio dire."
      errors: [future-form]
    - tutor: "«Il sito rimarrà vuoto», sì, ed è proprio quello che non possiamo permetterci. Hai una proposta?"
      recast: {text: "Il sito rimanirà vuoto", fix: "il sito rimarrà vuoto", tags: [future-form]}
    - learner: "Sì. Nel loro archivio online ci sono più di duecento foto con licenza libera: potremmo usare quelle per il lancio e sostituirle con quelle nuove appena arrivano. Che ne dici, il cliente lo accetterebbe?"
    - tutor: "Secondo me sì, se glielo presentiamo come una soluzione temporanea. Scrivi tu al responsabile del museo, oggi stesso?"
      goals: [proposal]
    # decoy: «posporre» in the sense of "postpone" is listed by dictionaries
    - learner: "Gli scrivo stamattina. Gli spiegherei che è una soluzione provvisoria e che, se preferiscono, possiamo posporre il lancio di una settimana, al ventidue."
    - tutor: "Il ventidue sarebbe il limite massimo. Allora: foto d'archivio per il lancio, e se il museo preferisce aspettare, si va al ventidue."
    # decoy: «qualcuno che mi aiutasse» is a correct subjunctive
    - learner: "Esatto. E se il museo scegliesse il ventidue, avrei bisogno di qualcuno che mi aiutasse con le schede delle opere: da solo non riuscirei a caricarne duecento in una settimana. Paolo potrebbe darmi una mano?"
    - tutor: "Paolo è libero da giovedì, glielo chiedo io. Allora fissiamo la scadenza: schede caricate entro il venti, d'accordo?"
    - learner: "D'accordo per il venti, così abbiamo due giorni di margine per i controlli. Ti mando un riassunto della riunione per e-mail, così non ce ne dimentichiamo niente."
      errors: [ci-ne]
      gold: {text: "non ce ne dimentichiamo niente", fix: "non dimentichiamo niente"}
    - tutor: "Ottimo, il riassunto. Ma riprendi «così non ce ne dimentichiamo niente»: con «niente» come oggetto, quel «ne» ci vuole?"
      prompt: {text: "non ce ne dimentichiamo niente", tags: [ci-ne]}
    - learner: "No, è di troppo: così non dimentichiamo niente. Te lo mando entro mezzogiorno."
    - tutor: "Perfetto: foto d'archivio, schede entro il venti, lancio il quindici o al massimo il ventidue. Grazie, passiamo al prossimo."
      goals: [deadline]

- scenario: reclamo-comune
  # facts: via Rismondo, lavori alle fogne iniziati due mesi fa e fermi, cantiere davanti al civico 24, accesso ai garage bloccato, auto a cinquecento metri; la moglie del learner è incinta di otto mesi, il bambino nascerà a metà del mese prossimo; tre segnalazioni già fatte; cantiere dell'azienda dell'acqua, strada comunale; protocollo 8812, data scritta dall'azienda entro cinque giorni lavorativi; permesso temporaneo gratuito per via Carducci fino alla fine dei lavori; la signora Bassi, interno 307, dal lunedì al giovedì
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via Rismondo, dove due mesi fa hanno cominciato a rifare le fogne: hanno scavato metà della strada, poi gli operai sono spariti, e da allora ci sono solo transenne e un cartello sbiadito."
    - tutor: "Mi dà il numero civico preciso? E mi dica se il cantiere blocca l'accesso alle case."
    - learner: "Davanti al civico 24, e blocca del tutto l'accesso ai garage: la macchina la devo lasciare a cinquecento metri, e mia moglie, che è embarazzata di otto mesi, ci arriva a piedi con fatica."
      errors: [false-friend]
    - tutor: "Con sua moglie incinta di otto mesi, la situazione è ancora più seria. Il cantiere è dell'azienda dell'acqua, ma la strada è comunale: faccio subito una segnalazione."
      goals: [describe]
      recast: {text: "embarazzata", fix: "incinta", tags: [false-friend]}
    # decoy: «di segnalazioni ne ho già fatte tre» is a correct partitive «ne»
    - learner: "La ringrazio, ma di segnalazioni ne ho già fatte tre, per telefono e per e-mail. Non vorrei che anche questa finisce in un cassetto: chiedo che qualcuno mi dia una data precisa per la ripresa dei lavori."
      errors: [subjunctive-use]
      gold: {text: "Non vorrei che anche questa finisce", fix: "Non vorrei che anche questa finisse"}
    - tutor: "Ha ragione, tre segnalazioni senza risposta sono troppe. Ma riascolti «non vorrei che anche questa finisce in un cassetto»: dopo «non vorrei che», quale modo e quale tempo?"
      prompt: {text: "Non vorrei che anche questa finisce", tags: [subjunctive-use]}
    - learner: "Non vorrei che anche questa finisca in un cassetto, ecco."
      errors: [subjunctive-use]
    - tutor: "«Non vorrei che anche questa finisse in un cassetto»: non finirà, gliel'assicuro. Le do un numero di protocollo e chiedo all'azienda una data scritta entro cinque giorni lavorativi."
      goals: [insist]
      recast: {text: "Non vorrei che anche questa finisca", fix: "Non vorrei che anche questa finisse", tags: [subjunctive-use]}
    - learner: "Cinque giorni mi vanno bene. Ma se l'azienda non risponde, che diritti ho? Posso chiedere un rimborso per il disagio, o almeno un permesso per parcheggiare più vicino?"
    - tutor: "Per il parcheggio sì: le rilascio un permesso temporaneo per via Carducci, gratuito fino alla fine dei lavori. Per un rimborso, invece, deve rivolgersi all'azienda con una richiesta scritta."
      goals: [rights]
    - learner: "Il permesso mi farebbe comodo, grazie. Il rimborso lo chiederò dopo: in vista al parto, la priorità adesso è che mia moglie possa arrivare a casa senza fare lo slalom tra le transenne."
      errors: [preposition]
      gold: {text: "in vista al parto", fix: "in vista del parto"}
    - tutor: "Giustissimo, prima di tutto sua moglie. Ma riprenda «in vista al parto»: dopo «in vista», quale preposizione si usa?"
      prompt: {text: "in vista al parto", tags: [preposition]}
    - learner: "Di: in vista del parto. Il bambino dovrebbe nascere a metà del mese prossimo."
    - tutor: "Allora c'è tempo, ma non troppo. Ecco il permesso per via Carducci e il numero di protocollo, 8812: entro cinque giorni lavorativi la chiamo io con la risposta dell'azienda."
      goals: [commitment]
    - learner: "Perfetto, grazie. Mi può scrivere anche il suo nome e un numero diretto? Così, se l'azienda non si fa viva, so con chi parlare senza dover rispiegare tutto da capo."
    - tutor: "Certo: sono la signora Bassi, interno 307, e sono qui dal lunedì al giovedì. Mi chiami pure quando vuole."
    - learner: "La ringrazio molto, signora Bassi. È la prima volta, in due mesi, che esco da un ufficio con qualcosa di concreto in mano, e le confesso che non me lo esperavo."
      errors: [word-choice]
    - tutor: "«Non me lo aspettavo»: lo prendo come un complimento. Mi saluti sua moglie, e tanti auguri per il bambino."
      recast: {text: "esperavo", fix: "aspettavo", tags: [word-choice]}
    - learner: "Grazie, glieli porterò. Arrivederci, e grazie ancora."
    - tutor: "Arrivederci, e a presto."

- scenario: assicurazione-sinistro
  # facts: stamattina la macchina della learner, parcheggiata in via Bellini, aveva il paraurti posteriore sfondato; biglietto di un corriere che ieri sera, in retromarcia con il furgone, non l'ha vista perché il lampione era spento; la constatazione si firma stasera alle sette; paga l'assicurazione del furgone; una ventina di foto; perito di solito entro una settimana, poi tre o quattro giorni di carrozzeria; auto sostitutiva prevista dalla polizza fino a dieci giorni; la scuola della learner è in collina, un autobus ogni ora fino alle sette
  level: C2
  persona: es-f-teacher
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Stamattina ho trovato la mia macchina con il paraurti posteriore sfondato. Era parcheggiata regolarmente sotto casa, in via Bellini, e sul parabrezza c'era un biglietto con un nome e un numero di telefono."
    - tutor: "Un biglietto: che persona corretta. Ha già chiamato quel numero?"
    - learner: "Sì, subito. Ha risposto un corriere: mi ha spiegato che ieri sera faceva retromarcia con il furgone e non ha visto la mia macchina, e che quando è sceso a guardare, il paraurti si è già staccato."
      errors: [tense-aspect]
      gold: {text: "il paraurti si è già staccato", fix: "il paraurti si era già staccato"}
    - tutor: "Un corriere onesto, meno male. Ma riprenda «quando è sceso, il paraurti si è già staccato»: il distacco avviene prima che lui scenda; che tempo serve?"
      prompt: {text: "il paraurti si è già staccato", tags: [tense-aspect]}
    - learner: "Quando è sceso, il paraurti si staccava già."
      errors: [tense-aspect]
    - tutor: "Quando è sceso, il paraurti si era già staccato: chiaro. Il signore le ha detto se è disposto a firmare la constatazione amichevole?"
      goals: [what]
      recast: {text: "il paraurti si staccava già", fix: "il paraurti si era già staccato", tags: [tense-aspect]}
    - learner: "Sì, viene stasera alle sette a firmarla. Ma io non c'ero, al momento dell'urto: posso firmarla lo stesso, anche se non ho visto niente?"
    - tutor: "Sì, può firmarla: basta che lui dichiari come sono andate le cose e che lei non era a bordo. Secondo lei, di chi è la responsabilità?"
    # decoy: the mixed hypothetical and «che una parte della colpa sia» are correct
    - learner: "Sua, direi, visto che l'ha ammesso. Però, se il lampione avesse funzionato, forse l'avrebbe vista: il Comune non lo ripara da settimane. È possibile che una parte della colpa sia del Comune?"
    - tutor: "In teoria sì, ma è molto difficile dimostrarlo, e per lei non cambia niente: paga l'assicurazione del furgone. Le conviene concentrarsi sulla constatazione."
      goals: [responsibility]
    # decoy: «sarà stata firmata» is a correct future perfect passive
    - learner: "Va bene. E dopo che la constatazione sarà stata firmata, a chi la devo mandare? A voi, o all'assicurazione del corriere?"
    - tutor: "A noi, con le foto del danno: la compagnia del corriere la contattiamo noi. Le foto le ha già fatte?"
    - learner: "Sì, una ventina, da tutti i lati, e anche al biglietto, per sicurezza. Gliele mando insieme alla constatazione stasera, appena il signore se ne va. Per la carrozzeria, quanto tiempo ci vorrà?"
      errors: [word-choice]
    - tutor: "Quanto tempo ci vorrà dipende dal perito, che di solito passa entro una settimana; poi la carrozzeria ha bisogno di tre o quattro giorni. Le serve un'auto sostitutiva?"
      goals: [documents]
      recast: {text: "tiempo", fix: "tempo", tags: [word-choice]}
    - learner: "Sì, se possibile, perché la uso ogni giorno per andare a scuola. La scuola è in collina, e temo che gli autobus non bastano: ne passa uno ogni ora, e solo fino alle sette."
      errors: [subjunctive-use]
      gold: {text: "temo che gli autobus non bastano", fix: "temo che gli autobus non bastino"}
    - tutor: "L'auto sostitutiva è prevista dalla sua polizza, fino a dieci giorni. Ma riprenda «temo che gli autobus non bastano»: dopo «temere che», quale modo si usa?"
      prompt: {text: "temo che gli autobus non bastano", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: temo che non bastino. Allora l'auto sostitutiva mi salva la vita, grazie."
    - tutor: "Le mando il numero del sinistro per e-mail: lo citi sempre, quando ci scrive. Buona giornata."
      goals: [next]

- scenario: medico-specialista
  # facts: le palpitazioni sono quasi sparite con la medicina; stanchezza da circa tre settimane, da quando il medico di famiglia ha aumentato la dose; nonna materna con pacemaker, madre con problemi di tiroide, padre sano ma fumatore; esami del cuore buoni, cinquantadue battiti a riposo; si torna alla dose di prima, mezza compressa al mattino; se le palpitazioni tornano e durano più di mezz'ora, chiamare o andare al pronto soccorso; esami della tiroide ed elettrocardiogramma tra un mese
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, imperative-form]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
    - learner: "Buongiorno, dottoressa. Le palpitazioni sono quasi sparite da quando prendo la medicina, e questo mi tranquillizza. Però mi sento sempre molto cansata, soprattutto il pomeriggio, e la sera faccio fatica a fare le scale."
      errors: [word-choice]
    - tutor: "Sempre molto stanca, e fatica a fare le scale: può dipendere dal farmaco. Da quanto tempo la sente?"
      recast: {text: "cansata", fix: "stanca", tags: [word-choice]}
    - learner: "Da circa tre settimane, da quando il mio medico di famiglia mi ha aumentato la dose. Non sono sicura che sia stata una buona idea, perché da allora mi sento come se ho corso una maratona."
      errors: [subjunctive-use]
      gold: {text: "come se ho corso", fix: "come se avessi corso"}
    - tutor: "Allora la stanchezza ha una spiegazione probabile. Ma riprenda «come se ho corso una maratona»: dopo «come se», quale modo e quale tempo?"
      prompt: {text: "come se ho corso", tags: [subjunctive-use]}
    - learner: "Il congiuntivo trapassato: come se avessi corso una maratona. E mi chiedo se non sia il caso di tornare alla dose di prima."
    - tutor: "Ne parliamo tra un attimo. Prima mi dica: in famiglia qualcuno ha avuto aritmie?"
      goals: [symptoms]
    - learner: "Mia nonna materna aveva un pacemaker, e mia madre ha problemi di tiroide che a volte le accelerano il cuore. Mio padre invece è sanissimo, anche se fuma come un turco."
    - tutor: "La tiroide è un dettaglio utile: la controlliamo anche a lei. Gli esami del cuore sono buoni; la frequenza, però, è un po' bassa: cinquantadue battiti a riposo."
      goals: [history]
    - learner: "Cinquantadue battiti: è pericoloso? Mi scusi se le faccio tante domande, ma vorrei capire bene che cosa significano questi numeri prima di prendere qualsiasi decisione."
    - tutor: "Non è pericoloso, ma spiega la stanchezza: il farmaco rallenta il cuore un po' più del necessario. Torniamo alla dose di prima, mezza compressa al mattino."
      goals: [understand]
    - learner: "Va bene. E se le palpitazioni tornano, che cosa devo fare? Me lo dica pure con sincerità, dottoressa, non abbi paura di spaventarmi."
      errors: [imperative-form]
      gold: {text: "non abbi paura", fix: "non abbia paura"}
    - tutor: "Se tornano e durano più di mezz'ora, mi chiami o vada al pronto soccorso. Ma riprenda «non abbi paura»: con il Lei, l'imperativo di «avere» è quello?"
      prompt: {text: "non abbi paura", tags: [imperative-form]}
    - learner: "Non ha paura, volevo dire."
      errors: [imperative-form]
    - tutor: "«Non abbia paura»: non ne ho, e nemmeno lei dovrebbe averne. Con la dose di prima le palpitazioni erano già sotto controllo."
      recast: {text: "Non ha paura", fix: "Non abbia paura", tags: [imperative-form]}
    # decoy: «se fosse possibile» is a correct polite subjunctive
    - learner: "Quindi mezza compressa la mattina e basta. E l'esame della tiroide lo devo fare prescrivere dal mio medico, o me lo prescrive lei adesso? Vorrei evitare di fare la fila due volte, se fosse possibile."
    - tutor: "Glielo prescrivo io adesso, insieme a un elettrocardiogramma di controllo tra un mese."
      goals: [treatment]
    - learner: "Perfetto. Le confesso che quando sono entrata avevo paura che lei mi dica che c'era qualcosa di grave, e adesso mi sento molto più leggera."
      errors: [subjunctive-use]
      gold: {text: "avevo paura che lei mi dica", fix: "avevo paura che lei mi dicesse"}
    - tutor: "Sono contenta di averla rassicurata. Ma riprenda «avevo paura che lei mi dica»: con «avevo paura» al passato, il congiuntivo presente va bene?"
      prompt: {text: "avevo paura che lei mi dica", tags: [subjunctive-use]}
    - learner: "No: avevo paura che lei mi dicesse che c'era qualcosa di grave. Grazie davvero, dottoressa."
    - tutor: "Si figuri. Ci vediamo tra un mese con l'elettrocardiogramma e gli esami della tiroide."

# Set r-miss-c2, file 3: radio and podcast interviews, job and promotion interviews, a life
# abroad. Errors hide late in long answers: «benché» and «non credo che» with the indicative,
# habits in the passato prossimo, a misplaced trapassato, «in grado a», «gli accoglieva»,
# «la desse», «abbi pazienza» to a Lei, «te lo dico» in a formal interview, false friends.
- scenario: intervista-radio
  # facts: libro «Il caffè si beve in piedi», nato dalle e-mail dell'autrice alla madre a Manchester, un'editrice l'ha convinta; l'ingegnere di quarantadue anni a cui la madre portava il pranzo in ufficio in una borsa termica; il primo anno a Bologna andava in ufficio in bicicletta, un vigile invece della multa le ha regalato le sue luci; il libro è in libreria da questa settimana
  level: C2
  persona: en-f-professional
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere. Il libro si intitola «Il caffè si beve in piedi» ed è nato quasi per caso: per anni ho mandato a mia madre, a Manchester, lunghe e-mail sulle mie giornate italiane, e un'editrice che le ha lette mi ha convinta a farne un libro."
    - tutor: "Un libro nato dalla posta di famiglia, che bello. Ma ammetta: non teme di aver raccolto solo i soliti cliché sugli italiani?"
      goals: [present-book]
    - learner: "Lo temevo, sì. Ma benché all'inizio sono partita proprio dai cliché, il caffè, la mamma, i gesti, ho cercato di raccontare quello che c'è dietro, cioè le ragioni per cui un cliché nasce."
      errors: [subjunctive-use]
      gold: {text: "benché all'inizio sono partita", fix: "benché all'inizio sia partita"}
    - tutor: "Le ragioni dietro il cliché: interessante. Però riascolti «benché all'inizio sono partita»: dopo «benché», quale modo ci vuole?"
      prompt: {text: "benché all'inizio sono partita", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: benché all'inizio sia partita proprio dai cliché, ho cercato di raccontare cosa c'è dietro."
    - tutor: "Così è corretto. E allora gliela faccio io la domanda scomoda: gli italiani sono davvero tutti mammoni?"
    # decoy: «la cui madre gli portava» and «sosteneva che fosse» are correct
    - learner: "Tutti no, ma ho conosciuto un ingegnere di quarantadue anni la cui madre gli portava ancora il pranzo in ufficio, in una borsa termica. Lui sosteneva che fosse per risparmiare; io credo che fosse amore, da tutte e due le parti."
    - tutor: "La borsa termica come atto d'amore: me la segno. C'è un episodio, nella sua vita qui, che secondo Lei dice tutto di noi?"
      goals: [stereotype]
    - learner: "Il primo anno a Bologna, ogni mattina sono andata in ufficio in bicicletta, e un giorno un vigile mi ha fermata perché non avevo le luci: invece della multa, mi ha regalato le sue."
      errors: [tense-aspect]
      gold: {text: "ogni mattina sono andata", fix: "ogni mattina andavo"}
    - tutor: "Un vigile che regala le luci, questa è bellissima! Ma riprenda «ogni mattina sono andata»: per un'abitudine, quale tempo si usa?"
      prompt: {text: "ogni mattina sono andata", tags: [tense-aspect]}
    - learner: "Ha ragione, scusi: ogni mattina ero andata in ufficio in bicicletta, per tutto il primo anno."
      errors: [tense-aspect]
    - tutor: "«Ogni mattina andavo in ufficio in bicicletta», ecco: e un vigile che regala le luci, nel libro, spero proprio che ci sia."
      recast: {text: "ogni mattina ero andata", fix: "ogni mattina andavo", tags: [tense-aspect]}
    - learner: "C'è, sì: è il capitolo che i lettori citano più spesso, insieme a quello della borsa termica."
    - tutor: "Non mi stupisce. E la lingua? Che cosa le ha cambiato, imparare l'italiano?"
      goals: [anecdote]
    - learner: "Mi ha resa più paziente e anche più diretta, il che sembra una contraddizione. In inglese giro intorno alle cose per educazione; in italiano ho imparato a dire «non sono d'accordo» senza sentirmi rude."
      errors: [false-friend]
    - tutor: "Dire «non sono d'accordo» senza sentirsi scortese: questa sì che è una conquista. Siamo quasi alla fine: ci lascia con una frase per i nostri ascoltatori?"
      goals: [language]
      recast: {text: "rude", fix: "scortese", tags: [false-friend]}
    - learner: "Con piacere: in Italia ho imparato che il caffè si beve in piedi, ma le cose importanti si dicono seduti, a tavola, e senza guardare l'orologio."
    - tutor: "Più memorabile di così non si poteva. Grazie di essere stata con noi. Cari ascoltatori, il libro è in libreria da questa settimana."
      goals: [farewell]

- scenario: intervista-podcast
  # facts: il learner, di Valencia, ha seguito a Trento la moglie conosciuta durante il suo Erasmus, nove anni fa; la prima domenica alle due del pomeriggio strade vuote; per aprire la falegnameria undici pratiche, aiutato da una commercialista; i figli sono nati in Italia
  level: C2
  persona: es-m-worker
  history: [tense-aspect, ci-ne]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Per amore, come nei film. Ho conosciuto mia moglie a Valencia, dove lei faceva l'Erasmus, e quando ha finito gli studi l'ho seguita a Trento. Pensavo che sarebbe stata un'avventura di un anno: ne sono passati nove."
    - tutor: "Nove anni a Trento, da Valencia: un bel salto di temperatura! Che cosa ti ha sorpreso di più, all'inizio?"
      goals: [story]
    - learner: "Il silenzio. La prima domenica sono uscito a fare una passeggiata alle due del pomeriggio e non c'era nessuno in giro: avevo pensato che fosse successo qualcosa, e invece erano tutti a casa a pranzo."
      errors: [tense-aspect]
      gold: {text: "avevo pensato che fosse successo", fix: "ho pensato che fosse successo"}
    - tutor: "Il silenzio della domenica trentina, me lo immagino. Ma riprendi «avevo pensato che fosse successo qualcosa»: l'hai pensato prima o dopo aver visto le strade vuote?"
      prompt: {text: "avevo pensato che fosse successo", tags: [tense-aspect]}
    - learner: "Dopo, quindi: ho pensato che fosse successo qualcosa. A Valencia, a quell'ora, la gente è ancora al bar a discutere di calcio."
    - tutor: "Ecco, e qui invece si dorme. C'è qualcosa che ancora oggi ti fa arrabbiare, di questo paese?"
      goals: [culture-shock]
    # decoy: «ne finivo una», «me ne chiedevano» and «di cui» are correct
    - learner: "Arrabbiare forse no, ma la burocrazia mi mette alla prova. Per aprire la mia falegnameria ho dovuto fare undici tramiti diversi, e ogni volta che ne finivo uno, me ne chiedevano un altro di cui nessuno mi aveva parlato."
      errors: [word-choice]
    - tutor: "Undici pratiche diverse per una falegnameria! E come ne sei uscito vivo?"
      recast: {text: "undici tramiti diversi", fix: "undici pratiche diverse", tags: [word-choice]}
      goals: [critique]
    - learner: "Con molta pazienza e una commercialista bravissima, che mi ha accompagnato in ogni ufficio della provincia. Te lo dico sinceramente: senza di lei, non ne sarei mai riuscito, e oggi farei un altro lavoro."
      errors: [ci-ne]
      gold: {text: "non ne sarei mai riuscito", fix: "non ci sarei mai riuscito"}
    - tutor: "Viva le commercialiste! Ma ripeti «non ne sarei mai riuscito»: con «riuscire a fare qualcosa», quale particella riprende quel «a fare qualcosa»?"
      prompt: {text: "non ne sarei mai riuscito", tags: [ci-ne]}
    - learner: "Ah, scusa: senza di lei non sarei mai riuscito."
      errors: [ci-ne]
    - tutor: "«Non ci sarei mai riuscito»: e allora un grazie in diretta alla tua commercialista. Che consiglio daresti a chi sta pensando di trasferirsi qui?"
      recast: {text: "non sarei mai riuscito", fix: "non ci sarei mai riuscito", tags: [ci-ne]}
    # decoy: «come se fossi ancora a Valencia» is a correct subjunctive
    - learner: "Gli direi di imparare la lingua prima di partire, non dopo. Io all'inizio parlavo come se fossi ancora a Valencia, a voce altissima, e nei negozi la gente mi guardava raro."
      errors: [word-choice]
    - tutor: "Ti guardava strano, immagino, con quella voce da mercato valenciano! Prima la lingua, poi la valigia: consiglio d'oro. Torneresti mai a vivere in Spagna?"
      goals: [advice]
      recast: {text: "raro", fix: "strano", tags: [word-choice]}
    - learner: "Forse da pensionato, per il sole. Ma i miei figli sono nati qui, parlano il dialetto meglio di me, e ormai casa mia è questa, con il suo silenzio della domenica compreso."
    - tutor: "Con il silenzio della domenica compreso: chiudiamo così. Grazie mille, è stato un piacere averti qui."

- scenario: colloquio-lavoro
  # facts: candidata Lucía, ventinove anni, laureata a Madrid, da tre anni a Milano come libera professionista per studi grafici; progetto: identità visiva di una cooperativa di agricoltori in Valtellina, logo disegnato a mano dal fondatore negli anni Ottanta; ruolo: squadra cultura di quattro persone, referente la direttrice artistica Paola Greco; risposta entro venerdì
  level: C2
  persona: es-f-erasmus
  history: [tense-aspect, register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Mi chiamo Lucía, ho ventinove anni e sono una designer della comunicazione: mi sono laureata a Madrid e da tre anni vivo a Milano, dove lavoro come libera professionista per alcuni studi grafici."
    - tutor: "Bene. Mi racconti il progetto di cui è più orgogliosa, in questi tre anni."
      goals: [intro]
    - learner: "Senz'altro la nuova identità visiva di una piccola cooperativa di agricoltori in Valtellina. Quando mi hanno contattata, il loro logo è stato disegnato a mano dal fondatore negli anni Ottanta, e nessuno voleva perderlo."
      errors: [tense-aspect]
      gold: {text: "il loro logo è stato disegnato", fix: "il loro logo era stato disegnato"}
    - tutor: "Un logo affettivo, il più difficile da toccare. Riprenda però «quando mi hanno contattata, il loro logo è stato disegnato»: il disegno viene prima della telefonata; che tempo si usa, allora?"
      prompt: {text: "il loro logo è stato disegnato", tags: [tense-aspect]}
    - learner: "Il trapassato: il loro logo era stato disegnato a mano dal fondatore negli anni Ottanta. Io l'ho ridisegnato conservando il tratto originale, e oggi è su tutte le loro confezioni."
    - tutor: "Un bel modo di rispettare la storia. Quali sono i suoi punti di forza, secondo lei? E un punto debole, se me lo concede."
      goals: [experience]
    - learner: "Il mio punto di forza è l'ascolto: prima di disegnare passo molto tempo a capire il cliente. Il punto debole, se devo essere sincera, è che faccio fatica a delegare, e te lo dico perché so che qui si lavora molto in squadra."
      errors: [register]
      gold: {text: "te lo dico", fix: "glielo dico"}
    - tutor: "Saper ascoltare è prezioso, qui. Ma ripeta «te lo dico perché so»: fino a un momento fa mi dava del Lei o del tu?"
      prompt: {text: "te lo dico", tags: [register]}
    - learner: "Del Lei, mi scusi: glielo dico perché so che qui si lavora molto in squadra, e voglio migliorare proprio su questo."
    - tutor: "Apprezzo la franchezza. Perché vuole lavorare proprio da noi, dopo tre anni da libera professionista?"
      goals: [strengths]
    # decoy: «mi hanno sempre affascinata» has a correct optional agreement with «mi»
    - learner: "Perché mi manca una squadra con cui crescere, e perché i vostri progetti per i musei mi hanno sempre affascinata. Da sola ho imparato molto, ma vorrei approfondire il design per la cultura insieme ad altri."
    - tutor: "I progetti per i musei sono quelli di cui andiamo più fieri, in effetti. Ha qualche domanda da farmi, sul ruolo?"
      goals: [why]
    - learner: "Sì, una: se mi contrattaste, con quale squadra lavorerei all'inizio, e chi sarebbe il mio referente per i progetti dei musei?"
      errors: [false-friend]
    - tutor: "«Se mi assumeste», chiede: lavorerebbe nella squadra cultura, quattro persone, e la sua referente sarebbe la nostra direttrice artistica, Paola Greco. Le va bene se le diamo una risposta entro venerdì?"
      goals: [questions]
      recast: {text: "se mi contrattaste", fix: "se mi assumeste", tags: [false-friend]}
    - learner: "Venerdì va benissimo. La ringrazio per il tempo che mi ha dedicato, e spero di conoscere presto anche la dottoressa Greco."
    - tutor: "Grazie a lei. Le scriviamo entro venerdì: buona giornata."

- scenario: colloquio-promozione
  # facts: da quando al learner è stato affidato il cliente tedesco, fatturato del gruppo +18%, nessun contratto perso; richiesta: responsabile dell'area estero; nell'area ci sono colleghi che lavorano lì da vent'anni; progetto di Monaco andato bene; proposta: sei mesi di prova, verifica a giugno, stipendio invariato più indennità di funzione di trecento euro al mese; documento scritto entro lunedì
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Volevo fare il punto sull'ultimo anno: da quando mi è stato affidato il cliente tedesco, il fatturato del mio gruppo è cresciuto del diciotto per cento, e non abbiamo perso nessun contratto."
    - tutor: "Diciotto per cento, lo so, ho visto i numeri. E dove vuole arrivare?"
      goals: [results]
    # decoy: «che questo venisse riconosciuto» is a correct subjunctive after «mi piacerebbe»
    - learner: "Vorrei propormi come responsabile dell'area estero. Credo di aver dimostrato di essere in grado a gestire una squadra, e mi piacerebbe che questo venisse riconosciuto anche formalmente."
      errors: [preposition]
      gold: {text: "in grado a gestire", fix: "in grado di gestire"}
    - tutor: "Una richiesta chiara. Prima di risponderle, però: «essere in grado a gestire», dopo «in grado» quale preposizione si usa?"
      prompt: {text: "in grado a gestire", tags: [preposition]}
    - learner: "In grado di gestire, mi scusi. Penso di aver dimostrato di essere in grado di gestire una squadra."
    - tutor: "L'ha dimostrato, sì. Il problema è un altro: nell'area estero ci sono colleghi che lavorano qui da vent'anni. Come pensa che la prenderebbero?"
      goals: [request]
    - learner: "Capisco la preoccupazione. Ma non credo che l'anzianità basta a guidare un gruppo: conta la capacità di ascoltare, e con quei colleghi ho già lavorato bene sul progetto di Monaco, senza che nessuno si sentisse scavalcato."
      errors: [subjunctive-use]
      gold: {text: "non credo che l'anzianità basta", fix: "non credo che l'anzianità basti"}
    - tutor: "Il progetto di Monaco è andato bene, è vero. Ma riascolti «non credo che l'anzianità basta»: dopo «non credo che», quale modo ci vuole? Poco dopo lei lo usa."
      prompt: {text: "non credo che l'anzianità basta", tags: [subjunctive-use]}
    - learner: "Ha ragione: non credo che l'anzianità bastasse a guidare un gruppo."
      errors: [subjunctive-use]
    - tutor: "Non credo che l'anzianità basti, dice lei, e su Monaco i fatti le danno ragione. Le propongo questo: sei mesi di prova come responsabile, con una verifica a giugno. Che ne pensa?"
      goals: [handle]
      recast: {text: "non credo che l'anzianità bastasse", fix: "non credo che l'anzianità basti", tags: [subjunctive-use]}
    # decoy: «attuale» means "current" here, correctly
    - learner: "Mi sembra una proposta ragionevole. Durante i sei mesi di prova, però, lo stipendio resterebbe quello attuale, o è previsto un adeguamento?"
    - tutor: "Resterebbe quello attuale, con un'indennità di funzione di trecento euro al mese; l'adeguamento vero scatterebbe dopo la verifica di giugno. Le va bene?"
    - learner: "Mi va bene. Le chiederei soltanto di mettere tutto per scritto, così da avere un documento di referenza nel caso in cui sorgessero dei dubbi."
      errors: [word-choice]
    - tutor: "Un documento di riferimento lo avrà entro lunedì, con le condizioni e la data della verifica. C'è altro?"
      goals: [next-steps]
      recast: {text: "di referenza", fix: "di riferimento", tags: [word-choice]}
    - learner: "No, nient'altro. La ringrazio per la fiducia: farò in modo che a giugno la verifica sia solo una formalità."
    - tutor: "Me lo auguro anch'io. Buon lavoro, allora, e ci vediamo a giugno."

- scenario: vita-in-italia
  # facts: il learner, inglese, pensionato, in Umbria dopo trent'anni di vacanze, con la moglie; il primo inverno si è rotto un polso sul ghiaccio e al pronto soccorso ha scoperto di non essere iscritto al servizio sanitario, sistemato la settimana dopo; consiglio: venire prima per un inverno e frequentare un corso dal primo mese
  level: C2
  persona: en-m-retired
  history: [tense-aspect, hypothetical]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno. L'ho scelta da pensionato, dopo trent'anni di vacanze in Umbria. Quando mia moglie e io abbiamo smesso di lavorare, ci siamo chiesti perché continuare a venirci due settimane l'anno, se potevamo restarci tutto l'anno."
    - tutor: "Una domanda logica, a pensarci. E che cosa è stato più difficile, una volta trasferiti?"
      goals: [story]
    - learner: "La sanità, all'inizio. Il primo inverno mi sono rotto un polso scivolando sul ghiaccio, e solo al pronto soccorso ho scoperto che non mi sono ancora iscritto al servizio sanitario nazionale."
      errors: [tense-aspect]
      gold: {text: "non mi sono ancora iscritto", fix: "non mi ero ancora iscritto"}
    - tutor: "Un polso rotto e nessuna iscrizione: che inizio! Ma riprenda «ho scoperto che non mi sono ancora iscritto»: la mancata iscrizione viene prima della scoperta; quale tempo ci vuole?"
      prompt: {text: "non mi sono ancora iscritto", tags: [tense-aspect]}
    - learner: "Il trapassato: ho scoperto che non mi ero ancora iscritto. Per fortuna mi hanno curato lo stesso, e la settimana dopo ho sistemato tutto."
    - tutor: "Meno male. E Lei, in questi anni, com'è cambiato?"
      goals: [difficulties]
    # decoy: «pensano che stia male» is a correct subjunctive
    - learner: "Sono diventato più lento, nel senso buono. In Inghilterra pranzavo davanti al computer in dieci minuti; qui, se un pranzo dura meno di un'ora, i miei vicini pensano che stia male."
    - tutor: "Il pranzo come termometro della salute: è vero, purtroppo o per fortuna. C'è qualcosa che, invece, proprio non riesce ad accettare?"
      goals: [change]
    - learner: "Gli orari degli uffici, che cambiano da un giorno all'altro. Se l'avessi saputo prima, mi sarei organizzato diversamente, ma ormai ci rido sopra: se oggi trovassi un ufficio aperto il pomeriggio, mi sarei preoccupato."
      errors: [hypothetical]
      gold: {text: "mi sarei preoccupato", fix: "mi preoccuperei"}
    - tutor: "Un ufficio aperto il pomeriggio, che scandalo! La prima ipotesi fila; ma nella seconda, «se oggi trovassi... mi sarei preoccupato», con «oggi» la conseguenza sta nel presente o nel passato?"
      prompt: {text: "mi sarei preoccupato", tags: [hypothetical]}
    - learner: "Nel presente, quindi: se oggi trovassi un ufficio aperto il pomeriggio, mi preoccuperei."
    - tutor: "Esatto. E a chi sta pensando di fare come Lei, che consiglio darebbe?"
    - learner: "Gli direi di venire prima per un inverno intero, non solo d'estate, e di attendere un corso di italiano già dal primo mese, perché senza la lingua si resta per sempre turisti."
      errors: [false-friend]
    - tutor: "Frequentare un corso dal primo mese, e provare l'inverno prima di decidere: due consigli molto concreti. Per finire, rifarebbe tutto?"
      goals: [advice]
      recast: {text: "attendere", fix: "frequentare", tags: [false-friend]}
    - learner: "Tutto, compreso il polso rotto: è stato il mio battesimo italiano. Se dovessi rifarlo, cambierei solo una cosa: partirei dieci anni prima."
    - tutor: "Partire dieci anni prima: chiudiamo con questo bellissimo rimpianto. Grazie di essere stato con noi."

- scenario: intervista-radio
  # facts: libro «Le mani parlano», dizionario di più di cento gesti italiani; il primo anno a Napoli l'autrice ha fatto il gesto delle corna al pescivendolo credendo che significasse «fantastico», ora lui le fa lo sconto; presentazione domani alle sei nella libreria della stazione
  level: C2
  persona: es-f-teacher
  history: [imperative-form, subjunctive-use]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, l'incoscienza c'è stata, lo ammetto. Il libro si chiama «Le mani parlano» ed è un piccolo dizionario dei gesti italiani: ne ho raccolti più di cento, spiegando da dove vengono e quando non bisogna assolutamente usarli."
    - tutor: "Più di cento gesti! Ma non è un po' un cliché, l'italiano che parla con le mani?"
      goals: [present-book]
    - learner: "Mi scusi, ma qui non sono d'accordo, e abbi pazienza se insisto: è un cliché solo se lo si guarda da fuori. Per me i gesti sono una grammatica vera, con regole precise."
      errors: [imperative-form]
      gold: {text: "abbi pazienza", fix: "abbia pazienza"}
    - tutor: "Insista pure, è qui per questo. Però Lei comincia con «mi scusi» e poi dice «abbi pazienza»: quell'imperativo è da Lei o da tu?"
      prompt: {text: "abbi pazienza", tags: [imperative-form]}
    - learner: "Da tu, ha ragione: abbia pazienza se insisto. Le regole ci sono, e qualcuna l'ho imparata a mie spese."
    - tutor: "A sue spese? Questo i nostri ascoltatori vogliono sentirlo."
      goals: [stereotype]
    - learner: "Il primo anno a Napoli, al mercato, ho fatto il gesto delle corna al pescivendolo pensando che significava «fantastico», come ai concerti rock. Lui è diventato rosso, e mezzo mercato si è girato a guardarmi."
      errors: [subjunctive-use]
      gold: {text: "pensando che significava", fix: "pensando che significasse"}
    - tutor: "Le corna a un pescivendolo, a Napoli: un capolavoro! Ma riascolti «pensando che significava»: dopo «pensare che», per di più con un'idea sbagliata, quale modo si usa?"
      prompt: {text: "pensando che significava", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: pensando che significasse «fantastico». Da quel giorno quel pescivendolo mi fa lo sconto, per pietà."
    - tutor: "Per pietà o per simpatia, chissà. E la lingua, invece, che cosa le ha cambiato dentro?"
      goals: [anecdote]
    # decoy: «ho realizzato il mio sogno» uses «realizzare» correctly
    - learner: "Mi ha insegnato a essere meno brusca. In spagnolo vado dritta al punto; in italiano ho imparato le formule di cortesia, i condizionali, il «se non le dispiace». E ho realizzato il mio sogno di scrivere in un'altra lingua."
    - tutor: "Il condizionale come scuola di gentilezza: bellissimo. Siamo agli ultimi minuti: ci lascia con una frase da ricordare?"
      goals: [language]
    - learner: "Certo: in Italia le mani parlano, ma le cose importanti le ho capite stando zitta ad ascoltare. E domani alle sei presento il libro nella libreria della stazione: venite tutti, sin compromesso."
      errors: [word-choice]
    - tutor: "Venite tutti, senza impegno: l'invito è fatto, domani alle sei. E per chiudere, quale gesto ci insegna?"
      recast: {text: "sin compromesso", fix: "senza impegno", tags: [word-choice]}
    - learner: "Questo: la mano aperta che si chiude piano, che vuol dire «ciao» ma anche «a presto». Ciao a tutti, allora, e a presto."
    - tutor: "Ciao e a presto anche da noi. Grazie, e in bocca al lupo per la presentazione di domani."
      goals: [farewell]

- scenario: colloquio-lavoro
  # facts: candidato Daniel, inglese, sei anni di design di arredi per l'ospitalità, prima a Londra in uno studio di architettura, da due anni a Bologna; progetto: ostello per giovani a Lisbona, cucina comune al posto della reception; ha una bambina di tre anni, la moglie lavora da casa; trasferte: in media due al mese, quasi sempre in Italia, di due o tre giorni, con due settimane di preavviso; risposta entro dieci giorni
  level: C2
  persona: en-m-traveller
  history: [object-pronoun, subjunctive-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Daniel, sono inglese e da sei anni mi occupo di design di arredi per l'ospitalità: alberghi, ristoranti, qualche spazio pubblico. Ho lavorato a Londra per uno studio di architettura e da due anni vivo a Bologna."
    - tutor: "Arredi per l'ospitalità: proprio il settore in cui vogliamo crescere. Mi parli di un progetto concreto."
      goals: [intro]
    - learner: "L'ultimo è stato un ostello per giovani a Lisbona. Il committente voleva che gli spazi comuni fossero il cuore della struttura, perché lì i ragazzi passavano le serate e il personale gli accoglieva come in una casa."
      errors: [object-pronoun]
      gold: {text: "il personale gli accoglieva", fix: "il personale li accoglieva"}
    - tutor: "Gli spazi comuni come cuore della struttura, mi piace. Ma riprenda «il personale gli accoglieva»: i ragazzi sono il complemento oggetto di «accogliere», e «gli» è un pronome da complemento oggetto?"
      prompt: {text: "il personale gli accoglieva", tags: [object-pronoun]}
    - learner: "No, è un pronome indiretto: il personale li accoglieva come in una casa. Per questo ho disegnato una grande cucina comune al posto della reception."
    - tutor: "Una cucina al posto della reception: coraggioso. Quali sono i suoi punti di forza, e un punto debole?"
      goals: [experience]
    - learner: "Direi la capacità di tradurre un'idea vaga del cliente in uno spazio concreto, senza tradirla. Il punto debole è la puntualità con le e-mail: quando sono immerso in un progetto, rischio di lasciare qualcuno senza risposta per giorni, e ci sto lavorando."
    - tutor: "Almeno è onesto. Perché proprio noi, e non uno studio più grande?"
      goals: [strengths]
    - learner: "Perché in uno studio grande sarei uno fra cinquanta. Qui potrei occuparmi un giorno dei disegni, un giorno dei materiali piuttosto che dei rapporti con i fornitori, a seconda di quello che serve al progetto."
      errors: [word-choice]
    - tutor: "Disegni, materiali oppure fornitori, a seconda del momento: da noi succede proprio così, ogni progettista segue tutto. Ha qualche domanda sul ruolo?"
      goals: [why]
      recast: {text: "piuttosto che", fix: "oppure", tags: [word-choice]}
    - learner: "Sì: il ruolo prevede trasferte? E nel caso, con che frequenza? Ho una bambina di tre anni, e vorrei organizzarmi per tempo."
    - tutor: "Sì, qualche trasferta c'è: in media due al mese, quasi sempre in Italia e di due o tre giorni, con almeno due settimane di preavviso. Le sembra gestibile?"
      goals: [questions]
    - learner: "Gestibile, sì. Mia moglie lavora da casa, e prima di venire qui le avevo detto che speravo che le trasferte siano poche: due al mese mi sembrano più che ragionevoli."
      errors: [subjunctive-use]
      gold: {text: "speravo che le trasferte siano poche", fix: "speravo che le trasferte fossero poche"}
    - tutor: "Bene saperlo. Ma riprenda «speravo che le trasferte siano poche»: con «speravo» al passato, quale tempo del congiuntivo ci vuole?"
      prompt: {text: "speravo che le trasferte siano poche", tags: [subjunctive-use]}
    - learner: "Speravo che le trasferte fossero poche, appunto, e due al mese vanno benissimo."
    - tutor: "Perfetto. Le faremo sapere entro dieci giorni; nel frattempo, se vuole, ci mandi le tavole del progetto di Lisbona."

- scenario: intervista-podcast
  # facts: la learner, inglese, è arrivata cinque anni fa per studiare violino al conservatorio di Parma, per amore di Paganini; in conservatorio tutti si salutano con due baci; la signora alla posta con la «domanda veloce»; il mese prossimo suonerà il quinto capriccio a un concorso a Genova; il conduttore chiede una registrazione per la prossima puntata
  level: C2
  persona: en-f-student
  history: [word-order, object-pronoun]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Grazie a voi! Sono arrivata cinque anni fa per studiare violino al conservatorio di Parma. Da ragazzina ascoltavo Paganini e mi ero messa in testa che, per suonarlo davvero, dovevo vivere nel paese in cui era nato."
    - tutor: "Paganini come motivo per trasferirsi: questa non l'avevo mai sentita! E che cosa ti ha colpito, appena arrivata?"
      goals: [story]
    - learner: "Mi ha colpito che in conservatorio si salutassero tutti con due baci, i professori anche. In Inghilterra un professore non bacerebbe mai uno studente, e io all'inizio restavo ferma come un palo."
      errors: [word-order]
      gold: {text: "i professori anche", fix: "anche i professori"}
    - tutor: "Il dramma dei due baci, ti capisco. Ma ripeti «i professori anche»: in italiano, «anche» va prima o dopo la parola a cui si riferisce?"
      prompt: {text: "i professori anche", tags: [word-order]}
    - learner: "Va prima: si salutavano tutti con due baci, anche i professori. E io non sapevo mai da che parte cominciare."
    - tutor: "Nessuno lo sa, credimi: si va a intuito. E c'è qualcosa che, sinceramente, non ti piace?"
      goals: [culture-shock]
    # decoy: «come se questo... desse» is a correct subjunctive
    - learner: "Il modo in cui si fanno le code, o meglio, in cui non si fanno: alla posta una signora è passata davanti a tutti, e quando gliel'ho fatto notare mi ha detto che aveva solo una domanda veloce, come se questo la desse il diritto di saltare la fila."
      errors: [object-pronoun]
      gold: {text: "la desse il diritto", fix: "le desse il diritto"}
    - tutor: "La famosa «domanda veloce», la conosco bene. Ma ripeti «come se questo la desse il diritto»: il diritto si dà a qualcuno, e allora quale pronome serve?"
      prompt: {text: "la desse il diritto", tags: [object-pronoun]}
    - learner: "Come se questo gli desse il diritto di saltare la fila, ecco."
      errors: [object-pronoun]
    - tutor: "«Come se questo le desse il diritto di saltare la fila»: hai fatto bene a protestare. E a chi pensa di trasferirsi qui, che consiglio daresti?"
      goals: [critique]
      recast: {text: "gli desse il diritto", fix: "le desse il diritto", tags: [object-pronoun]}
    - learner: "Di non aspettarsi che tutto funzioni come a casa, e di non lamentarsene ogni giorno. Io ho smesso di fare confronti quando ho capito che mi rendevano solo nostalgica."
    - tutor: "Smettere di fare confronti: difficilissimo, ma giusto. E Paganini, poi? Lo suoni davvero, adesso?"
      goals: [advice]
    # decoy: «non so se sono pronta», with the indicative in an indirect question, is correct
    - learner: "Ci provo ogni giorno, con risultati alterni. Il mese prossimo suonerò il quinto capriccio a un concorso a Genova, e sinceramente non so se sono pronta: lo studio da sei mesi, e ancora mi tremano le mani."
    - tutor: "A Genova, nella città di Paganini: più simbolico di così! Ci mandi una registrazione, così la facciamo ascoltare nella prossima puntata?"
    - learner: "Volentieri, ma solo se va bene. Se suono male, preferirei che quella registrazione sparisse per sempre, insieme alle mie ambizioni da virtuosa."
    - tutor: "Andrà benissimo, ne sono sicuro. Grazie mille, è stato un piacere averti qui, e in bocca al lupo per Genova!"

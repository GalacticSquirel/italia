# Set r-miss-c2, file 4: negotiations with suppliers and agents, a building meeting, a wedding
# planner, a restaurant complaint, a project pitch and a mediation. The slip comes late in a
# formal turn: consecutio after «mi aspettavo» or «temevo», «se» with the conditional, «tenere in
# conto», «a meno che» for «purché», «gli abbiamo aspettati», «l'ho chiesto», a stray «tu».
- scenario: trattativa-fornitore
  # facts: aumento del quindici per cento comunicato con tre settimane di preavviso; cliente da otto anni, mai un pagamento in ritardo; circa quarantamila scatole l'anno; il cartone è aumentato del venti per cento da gennaio; la fornitrice può arrivare al dodici, poi con due consegne l'anno invece di sei (risparmio di circa il tre per cento) scende al nove; prezzo bloccato per due anni; bozza del contratto entro venerdì
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, register]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per quello. Capisco che i costi siano saliti, ma un aumento del quindici per cento, comunicato con tre settimane di preavviso, per un'azienda delle nostre dimensioni è difficilmente sostenibile."
    - tutor: "Tre settimane sono poche, lo riconosco. Ma il cartone è aumentato del venti per cento da gennaio, e una parte del costo l'abbiamo assorbita noi. Su che cosa vorrebbe trattare?"
      goals: [problem]
    - learner: "Sulla nostra storia comune, prima di tutto. Siamo vostri clienti da otto anni, non abbiamo mai pagato in ritardo, e mi aspettavo che un rapporto così venga tenuto in considerazione prima di inviare un listino uguale per tutti."
      errors: [subjunctive-use]
      gold: {text: "mi aspettavo che un rapporto così venga", fix: "mi aspettavo che un rapporto così venisse"}
    - tutor: "Otto anni senza un ritardo, è vero, e lo so bene. Ma riascolti «mi aspettavo che un rapporto così venga tenuto»: con «mi aspettavo» al passato, quel congiuntivo è al tempo giusto?"
      prompt: {text: "mi aspettavo che un rapporto così venga", tags: [subjunctive-use]}
    - learner: "No, ci vuole l'imperfetto: mi aspettavo che un rapporto così venisse tenuto in considerazione."
    - tutor: "E lo è, mi creda: per questo sono disposta ad ascoltare una sua proposta. Che cosa ha in mente?"
      goals: [argue]
    - learner: "Le propongo un compromesso: noi ordiniamo circa quarantamila scatole l'anno. Se l'aumento si fermasse al sette per cento, saremmo pronti a comprometterci per due anni con un contratto firmato."
      errors: [false-friend]
    - tutor: "«Impegnarci per due anni», dice: è un argomento serio, glielo riconosco. Ma il sette per cento non copre nemmeno l'aumento del cartone; io posso arrivare al dodici. Che cosa mi offre in più?"
      goals: [counteroffer]
      recast: {text: "comprometterci", fix: "impegnarci", tags: [false-friend]}
    - learner: "Il dodici è ancora troppo. E se ordinassimo in due consegne all'anno anziché in sei, quanto risparmiereste voi sulla logistica? Immagino che i trasporti pesino parecchio sul vostro prezzo."
    - tutor: "Parecchio, sì: con due consegne invece di sei risparmieremmo circa il tre per cento, e questo mi permetterebbe di scendere al nove. Le basta?"
    - learner: "Il nove potrebbe andare, ma solo se il prezzo resta bloccato per tutti e due gli anni: capisci bene che non possiamo rifare i conti ogni sei mesi."
      errors: [register]
      gold: {text: "capisci bene", fix: "capisce bene"}
    - tutor: "Un prezzo bloccato per due anni si può discutere. Ma riprenda «capisci bene»: finora ci siamo date del Lei, o sbaglio?"
      prompt: {text: "capisci bene", tags: [register]}
    - learner: "Ha ragione, mi scusi: capisce bene che non possiamo rifare i conti ogni sei mesi."
    - tutor: "Lo capisco. Allora: nove per cento, prezzo bloccato per due anni, due consegne all'anno. Le mando la bozza del contratto entro venerdì?"
    - learner: "Entro venerdì va bene. La faccio leggere al nostro ufficio legale e, se non ci sono sorprese, la firmiamo la settimana prossima."
    - tutor: "Perfetto, allora a venerdì con la bozza. E grazie per la trattativa: dura, ma corretta."
      goals: [agreement]

- scenario: trattativa-affitto
  # facts: appartamento a due passi dalla stazione, Bologna; caldaia di quindici anni, il proprietario non intende cambiarla; canone novecentocinquanta euro; accordo: novecento euro con contratto quattro più quattro e controllo annuale della caldaia a spese del proprietario; preavviso di sei mesi con raccomandata, come da contratto; deposito di due mensilità con bonifico; firma giovedì alle dieci in agenzia
  level: C2
  persona: es-m-worker
  history: [hypothetical, ci-ne]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Mi è piaciuto molto, soprattutto la luce e la posizione, a due passi dalla stazione. Però ho notato che la caldera sembra piuttosto vecchia, e prima di parlare di cifre vorrei sapere se il proprietario ha intenzione di sostituirla."
      errors: [word-choice]
    - tutor: "La caldaia ha quindici anni, è vero, ma funziona, e per ora il proprietario non pensa di cambiarla. Il canone è di novecentocinquanta euro al mese: per lei va bene?"
      recast: {text: "la caldera", fix: "la caldaia", tags: [word-choice]}
      goals: [interest]
    - learner: "Novecentocinquanta mi sembrano tanti, con una caldaia di quindici anni. Se il proprietario la sostituirebbe, io sarei disposto a pagare il prezzo pieno; altrimenti chiederei uno sconto."
      errors: [hypothetical]
      gold: {text: "Se il proprietario la sostituirebbe", fix: "Se il proprietario la sostituisse"}
    - tutor: "Una proposta ragionevole, la riferirò. Ma ripeta «se il proprietario la sostituirebbe»: nella frase con «se», quale modo si usa per l'ipotesi?"
      prompt: {text: "Se il proprietario la sostituirebbe", tags: [hypothetical]}
    - learner: "Se il proprietario la sostituiva, intendo, io pagherei il prezzo pieno."
      errors: [hypothetical]
    - tutor: "Se il proprietario la sostituisse, lei pagherebbe il prezzo pieno: chiaro. Ma la caldaia non la cambia, me l'ha già detto. Che sconto avrebbe in mente?"
      recast: {text: "Se il proprietario la sostituiva", fix: "Se il proprietario la sostituisse", tags: [hypothetical]}
    - learner: "Direi novecento euro, con l'impegno da parte del proprietario di far controllare la caldaia ogni anno a sue spese. Mi sembra un compromesso equo per entrambi."
    - tutor: "Novecento potrebbe accettarli, ma solo con un contratto quattro più quattro: vuole inquilini stabili. Per lei andrebbe bene?"
      goals: [negotiate]
    # decoy: «di traslochi ne ho già fatti» is a correct partitive «ne»
    - learner: "Quattro più quattro va benissimo, anzi, era quello che speravo. Ho un lavoro fisso qui a Bologna e di traslochi ne ho già fatti abbastanza: l'ultimo me lo ricordo ancora, e non ci voglio più pensarci."
      errors: [ci-ne]
      gold: {text: "non ci voglio più pensarci", fix: "non voglio più pensarci"}
    - tutor: "La capisco benissimo. Ma riascolti «non ci voglio più pensarci»: quante volte compare quel «ci»?"
      prompt: {text: "non ci voglio più pensarci", tags: [ci-ne]}
    - learner: "Due volte, una di troppo: non voglio più pensarci. E per il preavviso, quanti mesi sono previsti, se un giorno dovessi andarmene?"
    - tutor: "Sei mesi, con lettera raccomandata: così è scritto nel contratto. Il deposito, invece, è di due mensilità. Le va bene?"
      goals: [conditions]
    - learner: "Due mensilità mi vanno bene. Posso pagarle con un bonifico, o il proprietario le preferisce in efectivo? Così preparo tutto prima della firma e non perdiamo tempo."
      errors: [word-choice]
    - tutor: "In contanti no: il proprietario vuole un bonifico, per avere la ricevuta. Allora fisso la firma per giovedì alle dieci, qui in agenzia?"
      recast: {text: "in efectivo", fix: "in contanti", tags: [word-choice]}
    - learner: "Giovedì alle dieci va benissimo. Porterò un documento d'identità, il codice fiscale e l'ultima nomina, se le serve."
      errors: [false-friend]
    - tutor: "L'ultima busta paga mi serve, sì, grazie. Allora a giovedì alle dieci: novecento euro, quattro più quattro, sei mesi di preavviso."
      recast: {text: "l'ultima nomina", fix: "l'ultima busta paga", tags: [false-friend]}
      goals: [conclude]

- scenario: assemblea-condominio
  # facts: Genova; rifacimento della facciata, preventivo di centottantamila euro per dodici famiglie; il signor Bruzzone, terzo piano, sarcastico; proposta: quest'anno il lato nord, rovinato dal salmastro, il resto in primavera, reti di protezione subito sul lato sud; l'impresa: due cantieri costano circa diecimila euro in più per il doppio ponteggio; votazione: dieci mani su dodici
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, hypothetical]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Premetto che non sono contraria al rifacimento della facciata. Chiedo soltanto di rimandarlo di un anno, perché centottantamila euro, divisi tra dodici famiglie, sono una cifra che molti di noi non hanno da parte."
    - tutor: "La cifra è quella del preventivo, sì. Il signor Bruzzone, al terzo piano, fa notare con un certo sarcasmo che chi non ha i soldi per la facciata può sempre vendere e trasferirsi in campagna."
      goals: [position]
    - learner: "Non mi offendo, signor Bruzzone, anzi la ringrazio: mi ha strappato un sorriso. Ma vendere casa per una facciata mi sembra un rimedio un po' esagerato, e preferirei che restassimo tutti qui a litigare, come facciamo da vent'anni."
    - tutor: "Vedo che anche il signor Bruzzone sorride, il che è un piccolo miracolo. Ha una proposta concreta da mettere ai voti?"
      goals: [defuse]
    # decoy: «che quest'anno si rifaccia» is a correct subjunctive
    - learner: "Sì. Propongo che quest'anno si rifaccia solo il lato nord, quello rovinato dal salmastro, e che il resto dei lavori viene rimandato alla primavera prossima, quando avremo messo da parte il necessario."
      errors: [subjunctive-use]
      gold: {text: "che il resto dei lavori viene rimandato", fix: "che il resto dei lavori venga rimandato"}
    - tutor: "Due fasi: è un'idea. Però riascolti la seconda parte, «e che il resto dei lavori viene rimandato»: dipende anche questa da «propongo», e allora quale modo ci vuole?"
      prompt: {text: "che il resto dei lavori viene rimandato", tags: [subjunctive-use]}
    - learner: "Il congiuntivo anche qui: propongo che il resto dei lavori venga rimandato alla primavera prossima."
    - tutor: "Esatto. L'impresa, però, ci ha fatto sapere che due cantieri separati costerebbero circa diecimila euro in più, per il doppio ponteggio. Come la mettiamo?"
      goals: [alternative]
    - learner: "Diecimila euro in più sono tanti, lo ammetto. Ma divisi in due anni pesano meno di centottantamila subito. E poi potremmo chiedere all'impresa una rebaja, visto che le garantiamo due cantieri invece di uno."
      errors: [word-choice]
    - tutor: "Uno sconto, visto che garantiamo due cantieri: posso chiederlo, ma non prometto nulla. Il signor Bruzzone domanda: e se nel frattempo cade un altro pezzo di cornicione?"
      recast: {text: "una rebaja", fix: "uno sconto", tags: [word-choice]}
    - learner: "È una domanda legittima. Se l'anno scorso avessimo messo almeno le reti di protezione, oggi non avremmo avuto questo problema: propongo di metterle subito su tutto il lato sud, visto che costano poco."
      errors: [hypothetical]
      gold: {text: "oggi non avremmo avuto questo problema", fix: "oggi non avremmo questo problema"}
    - tutor: "Le reti, giusto. Ma nella prima parte, «oggi non avremmo avuto questo problema»: con «oggi», la conseguenza è passata o presente?"
      prompt: {text: "oggi non avremmo avuto questo problema", tags: [hypothetical]}
    - learner: "Presente: se l'anno scorso avessimo messo le reti, oggi non avremmo questo problema. Quindi: reti subito sul lato sud, lato nord quest'anno, il resto in primavera."
    - tutor: "Riassunto perfetto. Metto la proposta ai voti: alzino la mano i favorevoli... Dieci su dodici, compreso il signor Bruzzone. Approvata, e va a verbale."
      goals: [compromise]
    - learner: "Grazie a tutti, e grazie anche al signor Bruzzone: alla prossima assemblea il caffè lo offro io."
    - tutor: "Metto a verbale anche il caffè. Passiamo al punto successivo: le luci delle scale."

- scenario: organizzare-matrimonio
  # facts: matrimonio all'aperto in campagna, un centinaio di ospiti, metà dall'Inghilterra; budget trentacinquemila euro; villa sulle colline di Lucca fino a centoventi ospiti, novemila euro, senza camere; agriturismo in Val d'Orcia fino a centocinquanta, seimilacinquecento euro, trenta camere per circa sessanta persone, orto proprio e produttori della zona; data: dodici settembre; prossimo incontro martedì pomeriggio con la lista degli invitati
  level: C2
  persona: en-m-traveller
  history: [combined-pronouns, subjunctive-use]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo semplice ma curato: un matrimonio all'aperto, in campagna, con un centinaio di ospiti, metà dei quali arriveranno dall'Inghilterra. La mia compagna sogna una lunga tavolata sotto gli alberi."
    - tutor: "Una tavolata sotto gli alberi è un classico che non delude mai. Avete già un'idea del budget?"
      goals: [vision]
    - learner: "Intorno ai trentacinquemila euro, tutto compreso. I miei genitori volevano pagarci il ricevimento, ma non gli lo abbiamo permesso: preferiamo che il loro aiuto rimanga un regalo, non un obbligo."
      errors: [combined-pronouns]
      gold: {text: "non gli lo abbiamo permesso", fix: "non glielo abbiamo permesso"}
    - tutor: "Una scelta delicata, la capisco. Ma ripeta «non gli lo abbiamo permesso»: quando «gli» incontra «lo», i due pronomi restano separati?"
      prompt: {text: "non gli lo abbiamo permesso", tags: [combined-pronouns]}
    - learner: "No, si uniscono: non glielo abbiamo permesso. Quindi trentacinquemila euro è il nostro limite vero."
    - tutor: "Chiaro. Con quel budget ho due posti da proporvi: una villa sulle colline di Lucca, fino a centoventi ospiti, a novemila euro, oppure un agriturismo in Val d'Orcia, fino a centocinquanta, a seimilacinquecento. Che cosa vi attira di più?"
      goals: [budget]
    - learner: "La villa ci tenta, ma novemila euro sono più di un quarto del budget. L'agriturismo, invece, ha alloggi per gli ospiti? Per chi arriva dall'Inghilterra sarebbe molto più comodo dormire sul posto."
    - tutor: "Sì, ha trenta camere, che bastano per circa sessanta persone; gli altri dormirebbero nei paesi vicini, a dieci minuti. La villa, invece, camere non ne ha."
    - learner: "Allora l'agriturismo, decisamente. Per noi è più importante che gli ospiti si sentano confortevoli, che dormano sul posto e non debbano guidare dopo la festa, che avere la villa più bella della Toscana."
      errors: [false-friend]
    - tutor: "Che gli ospiti si sentano a proprio agio e non guidino dopo la festa: un'ottima priorità. Blocco allora l'agriturismo per il dodici settembre? Quella data è ancora libera."
      goals: [choices]
      recast: {text: "confortevoli", fix: "a proprio agio", tags: [false-friend]}
    # decoy: «che ci mandiate» is a correct subjunctive
    - learner: "Il dodici settembre va benissimo. Però abbiamo due condizioni: vogliamo che il menù è tutto a chilometro zero, e che ci mandiate ogni preventivo per iscritto prima di confermare qualsiasi fornitore."
      errors: [subjunctive-use]
      gold: {text: "che il menù è tutto", fix: "che il menù sia tutto"}
    - tutor: "Due condizioni sensate. Ma riascolti «vogliamo che il menù è tutto a chilometro zero»: la seconda condizione la dice bene, e la prima, dopo «volere che»?"
      prompt: {text: "che il menù è tutto", tags: [subjunctive-use]}
    - learner: "Vogliamo che il menù fosse tutto a chilometro zero, intendevo."
      errors: [subjunctive-use]
    - tutor: "Che il menù sia tutto a chilometro zero, d'accordo: l'agriturismo ha un orto suo e lavora con produttori della zona. E ogni preventivo ve lo mando per iscritto, promesso. Ci vediamo la settimana prossima per il menù?"
      goals: [conditions]
      recast: {text: "che il menù fosse tutto", fix: "che il menù sia tutto", tags: [subjunctive-use]}
    - learner: "Volentieri, martedì pomeriggio, se per lei va bene. Porteremo anche la lista degli invitati, così iniziamo a pensare alla disposizione dei tavoli."
    - tutor: "Martedì pomeriggio è perfetto. A presto, e ancora congratulazioni a tutti e due!"

- scenario: recensione-ristorante
  # facts: compleanno della madre della learner; prenotazione alle otto e mezza a nome Ruiz, allergia alla frutta secca segnalata online e al telefono, nota presente; granella di nocciole nel dolce, la madre l'ha sputata al primo cucchiaino e sta bene; da domani le allergie stampate in rosso sulla comanda e firmate dal cuoco; cena offerta, nuova cena di sabato, il fratello viene da Madrid
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, e mi dispiace doverlo dire proprio stasera, che è il compleanno di mia madre. Al momento della prenotazione avevo segnalato che lei è allergica alla frutta secca, e nel dolce c'era la granella di nocciole."
    - tutor: "È gravissimo, e mi scuso subito. Sua madre sta bene? Se serve, chiamo immediatamente un medico."
      goals: [complain]
    - learner: "Per fortuna se n'è accorta al primo cucchiaino e l'ha sputata: sta bene, è solo un po' asustata. Ma poteva finire molto peggio, e il cameriere, quando gliel'abbiamo detto, si è limitato a portarci via il piatto."
      errors: [word-choice]
    - tutor: "Mi fa piacere che sia solo un po' spaventata. Il cameriere non si è nemmeno scusato, immagino. Mi dice a che ora avevate prenotato e a nome di chi, così controllo la nota?"
      recast: {text: "un po' asustata", fix: "un po' spaventata", tags: [word-choice]}
    # decoy: «ne avrebbero» is a correct «ne» for «dell'allergia»
    - learner: "Alle otto e mezza, a nome Ruiz. L'allergia l'avevo scritta anche nel modulo online, e al telefono la ragazza mi aveva detto di stare tranquilla, che ne avrebbero tenuto in conto."
      errors: [preposition]
      gold: {text: "ne avrebbero tenuto in conto", fix: "ne avrebbero tenuto conto"}
    - tutor: "La nota c'è, ce l'ho qui davanti: «allergia alla frutta secca». Ma riprenda «ne avrebbero tenuto in conto»: nell'espressione «tenere conto di», quella preposizione «in» ci va?"
      goals: [detail]
      prompt: {text: "ne avrebbero tenuto in conto", tags: [preposition]}
    - learner: "No: mi aveva detto che ne avrebbero tenuto conto. E invece, evidentemente, in cucina nessuno l'ha letta."
    - tutor: "Evidentemente no, ed è un mio errore di organizzazione. Che cosa si sarebbe aspettata da noi, stasera?"
    - learner: "Mi sarei aspettata che il cuoco controlli ogni piatto prima di mandarlo in sala, e che almeno qualcuno venisse a scusarsi subito, senza che dovessi chiedere io di parlare con lei."
      errors: [subjunctive-use]
      gold: {text: "che il cuoco controlli", fix: "che il cuoco controllasse"}
    - tutor: "Ha perfettamente ragione. Ma nella prima parte, «mi sarei aspettata che il cuoco controlli»: dopo un condizionale passato, il congiuntivo presente va bene? Subito dopo lei usa il tempo giusto."
      prompt: {text: "che il cuoco controlli", tags: [subjunctive-use]}
    - learner: "Mi sarei aspettata che il cuoco controllasse ogni piatto, appunto. Non chiedo un risarcimento, ma vorrei sapere che cosa farete perché non succeda più."
    - tutor: "Da domani ogni allergia segnalata sarà stampata in rosso sulla comanda, e il cuoco dovrà firmarla. Stasera la cena è offerta, e vorrei invitare sua madre a festeggiare di nuovo, quando preferisce."
      goals: [expectation]
    - learner: "La ringrazio, accetto volentieri, e mia madre ne sarà contenta. Ma non chiedo altro: non vorrei molestare il cuoco, che stasera ha già abbastanza problemi in cucina."
      errors: [false-friend]
    - tutor: "Disturbare il cuoco? Al contrario: verrà lui stesso al vostro tavolo, adesso, a scusarsi con sua madre. Per la nuova cena preferite un giorno feriale o il fine settimana?"
      recast: {text: "molestare", fix: "disturbare", tags: [false-friend]}
    - learner: "Un sabato, se possibile, così può venire anche mio fratello da Madrid. Le scrivo io la data appena lui mi conferma."
    - tutor: "Va benissimo, mi scriva quando vuole. E ancora scuse, e tanti auguri a sua madre da parte di tutti noi."
      goals: [resolve]

- scenario: trattativa-fornitore
  # facts: caseificio cliente da dodici anni, mai chiesta una dilazione di pagamento, ha aspettato tre settimane i camion del fornitore; la plastica riciclata costa il ventidue per cento in più da settembre; il fornitore scende al dieci per cento; con sessantamila vaschette l'anno invece di trenta, otto per cento, consegne mensili, almeno due anni; revisione annuale del prezzo al rialzo o al ribasso; bozza entro giovedì
  level: C2
  persona: en-m-heritage
  history: [object-pronoun, subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, e non le nascondo che il nuovo listino ci ha presi alla sprovvista. Lavoriamo insieme da dodici anni, e un aumento del quindici per cento da un mese all'altro rischia di mangiarsi tutto il nostro margine."
    - tutor: "Lo capisco, e non le nascondo che non è piaciuto nemmeno a noi. Ma la plastica riciclata ci costa il ventidue per cento in più da settembre. Che cosa propone?"
      goals: [problem]
    - learner: "Dodici anni dovrebbero valere un trattamento diverso da quello di un cliente nuovo. Non vi abbiamo mai chiesto una dilazione di pagamento, e quando avete avuto il problema dei camion, gli abbiamo aspettati tre settimane senza fiatare."
      errors: [object-pronoun]
      gold: {text: "gli abbiamo aspettati", fix: "li abbiamo aspettati"}
    - tutor: "Ricordo bene il problema dei camion, e la vostra pazienza. Ma riprenda «gli abbiamo aspettati»: i camion sono il complemento diretto di «aspettare»; «gli» è il pronome giusto?"
      prompt: {text: "gli abbiamo aspettati", tags: [object-pronoun]}
    - learner: "No, ci vuole «li»: li abbiamo aspettati tre settimane senza fiatare. E credo che questo valga qualcosa."
    - tutor: "Vale, e infatti posso scendere al dieci per cento. Più di così non mi autorizzano. Le basta?"
      goals: [argue]
    - learner: "Il dieci è un passo avanti. E se raddoppiassimo l'ordine annuale, passando da trenta a sessantamila vaschette? Non pensa che volumi così abbassano anche i vostri costi di produzione?"
      errors: [subjunctive-use]
      gold: {text: "volumi così abbassano", fix: "volumi così abbassino"}
    - tutor: "Con sessantamila vaschette arriverei all'otto per cento, con consegne mensili e un contratto di almeno due anni. Ma riprenda «non pensa che volumi così abbassano»: dopo «pensare che», quale modo si usa?"
      prompt: {text: "volumi così abbassano", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: non pensa che volumi così abbassino i costi? Comunque l'otto per cento mi interessa molto."
    - tutor: "Allora siamo vicini. Ha altre condizioni, da parte sua?"
      goals: [counteroffer]
    - learner: "Due anni mi stanno bene, a meno che l'otto per cento resti fisso per tutta la durata del contratto. E se il prezzo della plastica scendesse, vorrei che scendesse anche il vostro."
      errors: [word-choice]
    - tutor: "Purché l'otto per cento resti fisso, d'accordo: così ha senso. Sulla plastica le propongo una revisione annuale del prezzo, al rialzo o al ribasso. Le sembra equa?"
      recast: {text: "a meno che", fix: "purché", tags: [word-choice]}
    # decoy: «abbiamo capito» after «essere sicuro che» is a correct congiuntivo passato
    - learner: "Equa, sì. Allora ricapitolo, per essere sicuro che abbiamo capito la stessa cosa: otto per cento, sessantamila vaschette, consegne mensili, due anni e revisione annuale del prezzo."
    - tutor: "Ha ricapitolato esattamente. Le mando la bozza del contratto entro giovedì, e grazie per la pazienza: anche quella dei camion."
      goals: [agreement]

- scenario: presentazione-progetto
  # facts: tre filiali con tre sistemi di magazzino diversi, piattaforma unica in abbonamento; investimento centoventimila euro, risparmio stimato quarantamila euro l'anno, rientro in tre anni; recesso dopo dodici mesi senza penali; capo magazzino di Brescia scettico, guiderà la fase pilota; fase pilota di sei mesi a Brescia con trentamila euro; piano con indicatori entro venerdì
  level: C2
  persona: es-f-teacher
  history: [object-pronoun, subjunctive-use]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Glielo spiego subito. Oggi le nostre tre filiali gestiscono il magazzino ognuna con un sistema diverso, e spesso una filiale ordina un pezzo che un'altra ha già in eccesso. Il progetto unifica i tre magazzini in un'unica piattaforma."
    - tutor: "Fin qui l'idea è chiara. Ma quanto costa, e quanto ci fa risparmiare?"
      goals: [pitch]
    # decoy: «a prescindere dal fatto che il mercato cresca» is a correct subjunctive
    - learner: "L'investimento è di centoventimila euro. Secondo le nostre stime, eliminando le scorte doppie risparmieremmo circa quarantamila euro all'anno: il progetto si ripagherebbe in tre anni, a prescindere dal fatto che il mercato cresca o no."
    - tutor: "Tre anni sono tanti, per un sistema informatico. E se fra due anni la piattaforma fosse già vecchia?"
      goals: [benefits]
    - learner: "È un rischio che abbiamo considerato. Se la piattaforma fosse nostra, avrebbe ragione; ma è un software in abbonamento, aggiornato di continuo, e se il fornitore non ci soddisfacesse potremmo cambiarlo dopo dodici mesi senza penali."
    - tutor: "Va bene, il rischio tecnologico è contenuto. Il vero problema è un altro: le filiali non vogliono perdere la loro autonomia. Come pensa di convincerle?"
      goals: [objection]
    - learner: "Coinvolgendo i responsabili fin dall'inizio. Ho già parlato con i tre capi magazzino: due si sono detti entusiasti, mentre il terzo, quello di Brescia, è più scettico, e proprio per questo l'ho chiesto di guidare la fase pilota."
      errors: [object-pronoun]
      gold: {text: "l'ho chiesto di guidare", fix: "gli ho chiesto di guidare"}
    - tutor: "Mettere lo scettico al comando: furbo. Ma riprenda «l'ho chiesto di guidare»: si chiede qualcosa a qualcuno; allora quel pronome è giusto?"
      prompt: {text: "l'ho chiesto di guidare", tags: [object-pronoun]}
    - learner: "Ci vuole l'indiretto: gli ho chiesto di guidare la fase pilota. Se funziona a Brescia, funzionerà ovunque."
    - tutor: "Su questo non ho dubbi. Allora, che cosa mi chiede concretamente oggi?"
    - learner: "Le chiedo di approvare una fase pilota di sei mesi solo a Brescia, con un budget di trentamila euro. Se i risultati saranno quelli previsti, vorrei che il consiglio approvi il resto dell'investimento entro la fine dell'anno."
      errors: [subjunctive-use]
      gold: {text: "vorrei che il consiglio approvi", fix: "vorrei che il consiglio approvasse"}
    - tutor: "Sei mesi e trentamila euro: si può fare. Però l'ultima frase, «vorrei che il consiglio approvi»: dopo «vorrei che», quale tempo del congiuntivo si usa?"
      prompt: {text: "vorrei che il consiglio approvi", tags: [subjunctive-use]}
    - learner: "Scusi: vorrei che il consiglio abbia approvato il resto entro la fine dell'anno."
      errors: [subjunctive-use]
    - tutor: "Vorrei che il consiglio approvasse il resto entro dicembre, dice lei: d'accordo, ci proviamo. Mi mandi entro venerdì un piano della fase pilota, con indicatori chiari."
      recast: {text: "vorrei che il consiglio abbia approvato", fix: "vorrei che il consiglio approvasse", tags: [subjunctive-use]}
    - learner: "Glielo mando entro venerdì, con tre indicatori: riduzione delle scorte, tempi di consegna e soddisfazione del personale. Grazie per avermi dedicato questi dieci minuti."
    - tutor: "Grazie a lei. Venerdì aspetto il piano, e fra tre mesi, a metà della fase pilota, guardiamo insieme i primi numeri."
      goals: [next-steps]

- scenario: mediazione-colleghi
  # facts: ieri alla riunione Marco ha presentato l'analisi di mercato dicendo due volte «la mia analisi», senza nominare nessuno; la collega ci ha lavorato tre settimane e ha raccolto i dati; il direttore ha ringraziato solo Marco; Marco è nel gruppo da due mesi e ha scritto ieri sera alla responsabile; soluzione: mail di Marco al direttore con la collega in copia entro domani, nomi di tutti su ogni presentazione, bilancio dei contributi a fine trimestre; punto domani mattina
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Non mi disturba affatto, anzi, sono contenta che sia venuta. Si sieda, prego. Mi racconti con calma che cosa è successo dal suo punto di vista: la ascolto senza interromperla."
    - tutor: "Marco ha presentato l'analisi di mercato come se l'avesse fatta tutta lui. Io ci ho lavorato tre settimane, i dati li ho raccolti io, e il direttore ha ringraziato solo lui."
    - learner: "Capisco perfettamente che si senta ferita: tre settimane di lavoro non sono poche. Per capire meglio: Marco ha detto esplicitamente di averla fatta da solo, oppure semplicemente non ha nominato nessuno?"
    - tutor: "Non ha nominato nessuno. Ha detto «la mia analisi» due volte, e quando il direttore gli ha fatto i complimenti è rimasto zitto."
      goals: [listen, clarify]
    # decoy: «che lo stia difendendo» is a correct subjunctive
    - learner: "Ha ragione ad arrabbiarsi. Le chiedo solo di considerare che Marco è nel gruppo da due mesi e forse non conosce ancora le nostre abitudini. Non voglio che lei pensa che lo stia difendendo: sto solo cercando di capire."
      errors: [subjunctive-use]
      gold: {text: "Non voglio che lei pensa", fix: "Non voglio che lei pensi"}
    - tutor: "Due mesi, va bene, ma la correttezza non si impara in un gruppo. E comunque riascolti «non voglio che lei pensa»: dopo «volere che», quale modo ci vuole?"
      prompt: {text: "Non voglio che lei pensa", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: non voglio che lei pensi che lo stia difendendo. Ieri sera Marco mi ha scritto che non si era reso conto di averla esclusa, e che vorrebbe scusarsi con lei di persona."
    - tutor: "Scusarsi in privato è facile. Il direttore, però, pensa ancora che sia tutto merito suo."
      goals: [perspective]
    - learner: "Proprio per questo propongo due cose. Marco manda una mail al direttore in cui riconosce il suo contributo, con lei in copia; e d'ora in poi ogni presentazione riporterà i nomi di tutti, e a fine trimestre farò un balance dei contributi di ciascuno."
      errors: [word-choice]
    - tutor: "Una mail con me in copia e i nomi su ogni presentazione: questo mi basterebbe. Il bilancio dei contributi a fine trimestre, invece, lo farebbe lei personalmente?"
      recast: {text: "balance", fix: "bilancio", tags: [word-choice]}
    - learner: "Sì, personalmente, e ne parlerei con ciascuno di voi. Le confesso che stamattina, quando l'ho vista arrivare, temevo che lei sia venuta a chiedermi di cambiare gruppo."
      errors: [subjunctive-use]
      gold: {text: "temevo che lei sia venuta", fix: "temevo che lei fosse venuta"}
    - tutor: "Cambiare gruppo? No, ci tengo troppo. Ma riprenda «temevo che lei sia venuta»: con «temevo» al passato, il congiuntivo passato va bene?"
      prompt: {text: "temevo che lei sia venuta", tags: [subjunctive-use]}
    - learner: "No, ci vuole il trapassato: temevo che lei fosse venuta a chiedermi di cambiare gruppo. Mi fa piacere sapere che non è così."
    - tutor: "No, non è così. Allora parli pure con Marco oggi: se la mail arriva entro domani, per me la questione è chiusa."
      goals: [solution]
    - learner: "Gli parlo subito dopo pranzo, e domani mattina facciamo il punto insieme. Grazie per essere venuta a dirmelo apertamente."
    - tutor: "Grazie a lei per avermi ascoltata. A domani mattina, allora."

# Set r-miss-c2, file 8: working from home, a radio interview about living in Italy, a conflict in
# the team, a project pitch, a weekly meeting, the news at the coffee machine, Montale, and a
# phone-in on overtourism. Denser in slips: «più telefonate che me», «vederei», «Le metto in
# copia», «gli ha sembrato», «approvati da il titolare», «la quale opinione», «averne passato tante»,
# «si ha dovuto aspettare», «prima di salutarti», plus calques (inversione, temporale, fa senso).
- scenario: smartworking
  # facts: il learner lavora sempre da casa per un'azienda olandese; da quando si è trasferito a Lecce va ad Amsterdam due volte l'anno; bilocale con Giulia, che lavora da casa e fa molte telefonate; lui lavora in cucina con le cuffie; vantaggi: niente viaggio, con lo stipendio olandese a Lecce vive bene, si concentra meglio; svantaggi: gli mancano i colleghi, la sera è stanco; preferenza: due giorni a casa e il resto in un coworking vicino a casa pagato dall'azienda, costa meno di un volo per Amsterdam; prima lavorava in ufficio a Milano; Andrea lavora in libreria; pizzeria in fondo alla strada, offre il learner
  level: C2
  persona: en-m-heritage
  history: [comparative, conditional-form]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Da casa, sempre. Lavoro per un'azienda olandese, e da quando mi sono trasferito a Lecce ad Amsterdam ci vado solo due volte l'anno, per le riunioni importanti."
    - tutor: "Due volte l'anno, che invidia. E a casa come ti organizzi? Hai una stanza tutta per te?"
      goals: [situation]
    - learner: "Magari! Abbiamo un bilocale, e anche Giulia lavora da casa, quindi ci dividiamo il soggiorno. Lei però fa molte più telefonate che me, perciò mi metto le cuffie e lavoro in cucina."
      errors: [comparative]
      gold: {text: "molte più telefonate che me", fix: "molte più telefonate di me"}
    - tutor: "Le cuffie in cucina sono un classico. Ma riprendi «molte più telefonate che me»: quando il secondo termine del paragone è un pronome come «me», «che» è la parola giusta?"
      prompt: {text: "molte più telefonate che me", tags: [comparative]}
    - learner: "Allora: lei fa molte più telefonate come me, e io le sento tutte, anche con le cuffie."
      errors: [comparative]
    - tutor: "«Lei fa molte più telefonate di me», e tu le senti lo stesso: povero te. A parte la convivenza in cucina, che vantaggi ci trovi?"
      recast: {text: "molte più telefonate come me", fix: "molte più telefonate di me", tags: [comparative]}
    - learner: "Soprattutto la libertà: con lo stipendio olandese a Lecce vivo benissimo, e alle sei sono già al mare. E mi concentro meglio, perché nessuno passa alla scrivania a chiedermi cose. Tu in libreria non potresti mai lavorare da casa, giusto?"
    - tutor: "No, i libri da remoto non si vendono, purtroppo. Ma il mare alle sei vale oro. E gli svantaggi? Che cosa ti manca dell'ufficio?"
      goals: [pros]
    # decoy: «più stanco che quando lavoravo» is correct (che before a clause)
    - learner: "Mi mancano i colleghi: le chiacchiere alla macchinetta, il pranzo insieme. La sera sono più stanco che quando lavoravo in ufficio a Milano, e Giulia dice che sono diventato meno sociabile."
      errors: [word-choice]
    - tutor: "Meno socievole, tu? Non ci credo, ma la stanchezza di chi non vede nessuno la capisco. Se potessi scegliere, come vorresti lavorare?"
      goals: [cons]
      recast: {text: "meno sociabile", fix: "meno socievole", tags: [word-choice]}
    - learner: "Due giorni a casa e il resto in un coworking vicino. Ne hanno aperto uno a due passi da casa: l'azienda potrebbe pagarlo, costa meno di un volo per Amsterdam, e io vederei finalmente un po' di gente."
      errors: [conditional-form]
      gold: {text: "io vederei", fix: "io vedrei"}
    - tutor: "Il coworking mi sembra un'ottima via di mezzo. Ma riprendi «io vederei un po' di gente»: il condizionale di «vedere» si forma come quello di «andare» e «potere»?"
      prompt: {text: "io vederei", tags: [conditional-form]}
    - learner: "Hai ragione: io vedrei un po' di gente. Ma secondo te il mio capo accetterebbe? Tu come lo convinceresti?"
    - tutor: "Gli porterei i numeri: quanto costa un posto in coworking per un anno e quanto due voli per Amsterdam. Se il conto torna, è difficile dire di no."
      goals: [preference]
    - learner: "Buona idea, domani ci provo. Adesso però basta lavoro: ordiniamo un altro spritz, o andiamo a mangiare qualcosa nella pizzeria in fondo della strada?"
      errors: [preposition]
      gold: {text: "in fondo della strada", fix: "in fondo alla strada"}
    - tutor: "Pizzeria, decisamente: con lo spritz a stomaco vuoto non arrivo a domani. Riprendi però «in fondo della strada»: dopo «in fondo», quel «della» ti convince?"
      prompt: {text: "in fondo della strada", tags: [preposition]}
    - learner: "No: in fondo alla strada. Andiamo, offro io, è il minimo dopo la consulenza sul capo."
    - tutor: "Accetto volentieri. E domani fammi sapere come è andata con il tuo capo."

- scenario: vita-in-italia
  # facts: il learner è di Granada, elettricista, vive a Torino da sette anni; è venuto perché un'azienda di impianti cercava elettricisti e in Spagna il lavoro non c'era; riconoscimento del diploma: due anni, nel frattempo l'azienda lo pagava come apprendista; i colleghi e una famiglia del suo palazzo, che lo invitava a pranzo ogni domenica, l'hanno aiutato; è diventato più paziente e cena alle otto; tornato a Granada, aveva perso l'abitudine di cenare alle dieci; consiglio: imparare la lingua prima e portare i documenti tradotti e legalizzati
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, tense-aspect]
  turns:
    - tutor: "Benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a tutti. Sono di Granada e vivo a Torino da sette anni. In realtà è stata l'Italia a scegliere me: un'azienda di impianti cercava elettricisti, e in Spagna, in quegli anni, il lavoro non c'era."
    - tutor: "Una scelta di lavoro, più che di cuore. E all'inizio, che cosa è stato più difficile?"
      goals: [story]
    - learner: "Il lavoro, senza dubbio. In Spagna facevo l'elettricista da quindici anni, ma qui per riconoscere il diploma ci sono voluti due anni: mi sembrava assurdo che uno con la mia esperienza non può firmare un impianto."
      errors: [subjunctive-use]
      gold: {text: "non può firmare", fix: "non potesse firmare"}
    - tutor: "Due anni sono tantissimi, immagino la frustrazione. Ma riprenda «mi sembrava assurdo che uno ... non può firmare un impianto»: dopo «sembrava assurdo che», con il verbo principale al passato, quale modo e quale tempo?"
      prompt: {text: "non può firmare", tags: [subjunctive-use]}
    - learner: "Mi sembrava assurdo che uno con la mia esperienza non possa firmare un impianto, ecco."
      errors: [subjunctive-use]
    - tutor: "Con «sembrava» ci vuole l'imperfetto: «che uno con la mia esperienza non potesse firmare un impianto». E in quei due anni, che cosa le ha dato la forza di non tornare a Granada?"
      goals: [difficulties]
      recast: {text: "non possa firmare", fix: "non potesse firmare", tags: [subjunctive-use]}
    - learner: "I colleghi, soprattutto, che mi hanno insegnato il mestiere all'italiana. E poi una famiglia del mio palazzo, che mi ha invitato a pranzo ogni domenica per due anni, senza chiedere niente in cambio."
    - tutor: "Che bella storia. E oggi, dopo sette anni, si sente cambiato? In che cosa?"
    - learner: "Molto. Sono più paziente, per esempio con la burocrazia, e ceno alle otto, cosa impensabile a Granada. Quando sono tornato là la prima volta, mi sono accorto che ho perso l'abitudine di cenare alle dieci."
      errors: [tense-aspect]
      gold: {text: "mi sono accorto che ho perso", fix: "mi sono accorto che avevo perso"}
    - tutor: "Cenare alle otto, per uno spagnolo, è una vera conversione. Ma riprenda «mi sono accorto che ho perso l'abitudine»: la perdita viene prima dell'accorgersi; per un'azione anteriore a un'altra già passata, quale tempo serve?"
      prompt: {text: "mi sono accorto che ho perso", tags: [tense-aspect]}
    - learner: "Il trapassato: mi sono accorto che avevo perso l'abitudine. I miei amici mi prendevano in giro tutta la sera!"
    - tutor: "Lo immagino. E a un ascoltatore che sta pensando di trasferirsi in Italia, che consiglio darebbe?"
      goals: [change]
    - learner: "Di imparare la lingua prima di partire, non dopo. Se io avrei parlato italiano già allora, avrei trovato lavoro molto prima, e sarei stato meno solo nei primi mesi."
      errors: [hypothetical]
      gold: {text: "Se io avrei parlato", fix: "Se io avessi parlato"}
    - tutor: "Un consiglio sensato. Riprenda però «se io avrei parlato italiano»: nella frase introdotta da «se», il condizionale ci può stare?"
      prompt: {text: "Se io avrei parlato", tags: [hypothetical]}
    - learner: "No, scusi: se avessi parlato italiano già allora, avrei trovato lavoro molto prima. Lei pensa che sia ancora così difficile, per chi arriva oggi?"
    - tutor: "Dalle telefonate che riceviamo, direi di sì: per i titoli di studio i tempi restano lunghi. E dei documenti, quali sono quelli che le sono mancati di più?"
      goals: [advice]
    - learner: "Il certificato del diploma, tradotto e legalizzato, che in Spagna ho dovuto chiedere due volte. Il mio consiglio è di preparare tutto prima di partire: qui, se manca un timbro, si può perdere mesi."
      errors: [passive]
      gold: {text: "si può perdere mesi", fix: "si possono perdere mesi"}
    - tutor: "Un timbro che manca, e la pratica si ferma. Ma riprenda «si può perdere mesi»: con il «si» e un oggetto plurale come «mesi», il verbo resta al singolare?"
      prompt: {text: "si può perdere mesi", tags: [passive]}
    - learner: "No, va al plurale: si possono perdere mesi. Quindi meglio arrivare con tutto pronto."
    - tutor: "Un consiglio prezioso per molti ascoltatori. Grazie per la sua storia, e buona cena alle otto!"

- scenario: mediazione-colleghi
  # facts: il tutor è Paolo, membro del team; ieri, alla riunione con l'amministratore delegato, Marta ha ricevuto i complimenti per l'offerta della gara del Comune e non ha nominato nessuno; Paolo ci ha lavorato un intero fine settimana, piano tecnico e calcolo dei costi; Marta ha scritto la lettera di presentazione e la parte sulle referenze, due pagine su quaranta; Marta dice che l'amministratore non le ha lasciato il tempo di parlare; il learner propone: e-mail all'amministratore su chi ha fatto cosa, Paolo e Marta insieme all'incontro con il Comune, d'ora in poi i nomi di tutti gli autori nella prima pagina delle offerte; Paolo in copia; Paolo parla con Marta domani
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, relative-pronoun]
  turns:
    - tutor: "Scusi se La disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    # decoy: «che Lei fosse molto teso» is a correct subjunctive
    - learner: "Si accomodi, chiudo la porta. Mi racconti pure con calma: ieri ho avuto l'impressione che Lei fosse molto teso mentre l'amministratore faceva i complimenti a Marta."
    - tutor: "Teso è poco. L'offerta per la gara del Comune l'ho scritta io, un intero fine settimana: piano tecnico, calcolo dei costi, tutto. E Marta si è presa i complimenti senza nominarmi."
    # decoy: «di cui nessuno riconosce il merito» is correct
    - learner: "Capisco, e mi dispiace: passare un fine settimana su un'offerta di cui nessuno riconosce il merito è frustrante. Mi aiuti però a capire una cosa: quali sono le parti che Marta ci ha lavorato?"
      errors: [relative-pronoun]
      gold: {text: "le parti che Marta ci ha lavorato", fix: "le parti su cui Marta ha lavorato"}
    - tutor: "La lettera di presentazione, quella l'ha scritta lei, lo ammetto. Ma riprenda «le parti che Marta ci ha lavorato»: dopo una preposizione, «che» più «ci» funziona come relativo?"
      goals: [listen]
      prompt: {text: "le parti che Marta ci ha lavorato", tags: [relative-pronoun]}
    - learner: "Ha ragione: le parti su cui Marta ha lavorato, quindi, sono solo la lettera?"
    - tutor: "La lettera e la parte sulle referenze: due pagine su quaranta. Eppure i complimenti se li è presi tutti lei."
      goals: [clarify]
    - learner: "Ho parlato con Marta stamattina. Dice che l'amministratore non le ha lasciato il tempo di parlare, e mi è sembrata sincera: non credo che l'ha fatto apposta."
      errors: [subjunctive-use]
      gold: {text: "non credo che l'ha fatto", fix: "non credo che l'abbia fatto"}
    - tutor: "Il tempo di parlare: comoda, come scusa. Ma riprenda «non credo che l'ha fatto apposta»: dopo «non credo che», quale modo ci vuole?"
      prompt: {text: "non credo che l'ha fatto", tags: [subjunctive-use]}
    - learner: "Il congiuntivo, certo: non credo che l'avesse fatto apposta."
      errors: [subjunctive-use]
    - tutor: "Che non l'abbia fatto apposta, può darsi. Ma intanto l'amministratore pensa che il lavoro sia suo, e questo per me è il problema."
      goals: [perspective]
      recast: {text: "l'avesse fatto", fix: "l'abbia fatto", tags: [subjunctive-use]}
    - learner: "Va corretto, ha ragione. Propongo tre cose: scrivo io all'amministratore chi ha fatto cosa, all'incontro con il Comune andate insieme, e d'ora in poi nella prima pagina di ogni offerta vanno tutti gli autori. Le sembra equo?"
    - tutor: "Sì, mi sembra giusto. Ma che cosa scriverà, esattamente, all'amministratore? Non vorrei che sembrasse una lamentela."
      goals: [solution]
    - learner: "Scriverò che il piano tecnico e i costi li ha curati Lei e la lettera Marta, con un tono neutro: è una precisazione, e non voglio che diventi un argomento tra voi due."
      errors: [false-friend]
    - tutor: "Che non diventi «una discussione tra voi due» lo voglio anch'io: con Marta devo lavorare ancora per anni. Un tono neutro va benissimo."
      recast: {text: "un argomento tra voi due", fix: "una discussione tra voi due", tags: [false-friend]}
    # decoy: «Le chiederei di parlare» is correct (chiedere a qualcuno)
    - learner: "Prima dell'incontro con il Comune, Le chiederei di parlare con Marta a quattr'occhi. Intanto mando l'e-mail oggi stesso e Le metto in copia, così vede esattamente che cosa scrivo."
      errors: [object-pronoun]
      gold: {text: "Le metto in copia", fix: "La metto in copia"}
    - tutor: "D'accordo, con Marta ci parlo domani. Ma riprenda «Le metto in copia»: «mettere qualcuno in copia» vuole un complemento diretto o indiretto?"
      prompt: {text: "Le metto in copia", tags: [object-pronoun]}
    - learner: "Diretto: La metto in copia. E grazie per essere venuto a parlarmene subito, invece di tenerselo dentro."
    - tutor: "Grazie a Lei per avermi ascoltato. Domani parlo con Marta, e all'incontro con il Comune ci andiamo insieme."

- scenario: presentazione-progetto
  # facts: azienda milanese di macchinari industriali; circa centoquaranta trasferte l'anno dei tecnici per formare i clienti, milleottocento euro l'una in media; piattaforma di formazione online da centottantamila euro; eliminando due terzi delle trasferte si recupera l'investimento in poco più di un anno; pilota: cinque clienti, tre mesi, venticinquemila euro; indicatori: trasferte evitate, tempo sulla piattaforma, chiamate all'assistenza, più la soddisfazione dei clienti (proposta del direttore); tre clienti già d'accordo, due da scegliere con l'ufficio commerciale; questionario e piano entro venerdì; tra due settimane presentazione al direttore commerciale, scettico per un progetto simile dell'anno scorso
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, combined-pronouns]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    # decoy: «che ci permetta di evitarne» is a correct subjunctive
    - learner: "Glielo spiego in due minuti. Ogni anno i nostri tecnici fanno circa centoquaranta trasferte dai clienti solo per formarli sulle macchine. Propongo una piattaforma di formazione online che ci permetta di evitarne la maggior parte."
    - tutor: "Centoquaranta trasferte sono tante, lo so bene. Ma quanto costerebbe la piattaforma, e quanto ci farebbe risparmiare?"
      goals: [pitch]
    - learner: "Lo sviluppo costerebbe centottantamila euro. Una trasferta ci costa in media milleottocento euro: se ne eliminassimo due terzi, recupereremmo tutta l'inversione in poco più di un anno."
      errors: [word-choice]
    - tutor: "Recuperare tutto l'investimento in un anno, sulla carta, è convincente. Ma chi mi garantisce che i clienti useranno davvero la piattaforma? Molti vogliono il tecnico in carne e ossa."
      goals: [benefits]
      recast: {text: "tutta l'inversione", fix: "tutto l'investimento", tags: [word-choice]}
    - learner: "È un rischio reale. Per questo propongo un pilota: cinque clienti, tre mesi, venticinquemila euro. Se non funziona, perdiamo poco; se funziona, lo estendiamo a tutti, sempre che i dati ci danno ragione."
      errors: [subjunctive-use]
      gold: {text: "sempre che i dati ci danno ragione", fix: "sempre che i dati ci diano ragione"}
    - tutor: "Un pilota limita il rischio, e questo mi piace. Ma riprenda «sempre che i dati ci danno ragione»: dopo «sempre che», quale modo si usa?"
      prompt: {text: "sempre che i dati ci danno ragione", tags: [subjunctive-use]}
    - learner: "Sempre che i dati ci darebbero ragione, volevo dire."
      errors: [subjunctive-use]
    - tutor: "«Sempre che i dati ci diano ragione»: è proprio quello che voglio vedere. Quali dati misurerebbe, nel pilota?"
      goals: [objection]
      recast: {text: "ci darebbero ragione", fix: "ci diano ragione", tags: [subjunctive-use]}
    - learner: "Tre indicatori: quante trasferte si evitano, quanto tempo i clienti passano sulla piattaforma e quante chiamate arrivano all'assistenza dopo la formazione. Lei ne aggiungerebbe altri?"
    - tutor: "Aggiungerei la soddisfazione dei clienti, con un questionario breve: per il commerciale conta più di tutto. E i cinque clienti, li ha già individuati?"
    - learner: "Tre li conosco bene e hanno già detto di sì; gli altri due li sceglierei con l'ufficio commerciale. Il questionario lo preparo io, e se vuole gliele mando entro venerdì, insieme al piano dettagliato."
      errors: [combined-pronouns]
      gold: {text: "gliele mando", fix: "glielo mando"}
    - tutor: "Venerdì va benissimo. Ma riprenda «gliele mando»: quel «le» rimanda a qualcosa di femminile plurale? Che cosa mi manda, esattamente?"
      prompt: {text: "gliele mando", tags: [combined-pronouns]}
    - learner: "Il questionario, maschile singolare: quindi glielo mando entro venerdì, con il piano."
    - tutor: "Bene. Allora facciamo così: approvo il pilota, e tra due settimane lo presentiamo insieme al direttore commerciale. Le va bene?"
      goals: [next-steps]
    - learner: "Benissimo, grazie della fiducia. Preparo dieci slide al massimo: so che il direttore commerciale è scettico, perché l'anno scorso un progetto simile gli ha sembrato una perdita di tempo."
      errors: [auxiliary-choice]
      gold: {text: "gli ha sembrato", fix: "gli è sembrato"}
    - tutor: "Scettico è dire poco, ma con il pilota avrà dei numeri davanti. Riprenda però «gli ha sembrato una perdita di tempo»: «sembrare» vuole davvero l'ausiliare «avere»?"
      prompt: {text: "gli ha sembrato", tags: [auxiliary-choice]}
    - learner: "No, «essere»: gli è sembrato una perdita di tempo. Stavolta, con i numeri del pilota, spero di fargli cambiare idea."
    - tutor: "Ci conto. Mi mandi tutto venerdì, e ne riparliamo con lui tra due settimane."

- scenario: riunione-lavoro
  # facts: la learner è stagista; campagna social per una cantina della Valpolicella; calendario dei post e grafiche pronti e approvati; mancano i testi per prenotare le degustazioni, mandati due settimane fa, tre e-mail alla responsabile del marketing; i testi li approva il titolare, in vendemmia fino a fine mese; proposta: partire con il video della vendemmia dell'anno scorso, già approvato, e aggiungere i testi dopo; Federica chiama il titolare stasera; partenza entro mercoledì, giovedì al massimo con i testi tradotti in tedesco; festa della vendemmia il ventotto, conto alla rovescia nelle storie
  level: C2
  persona: es-f-erasmus
  history: [future-form, articulated-preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Per la campagna della cantina, il calendario dei post e le grafiche sono pronti, e il cliente li ha già approvati. Mi mancano solo i testi per le prenotazioni delle degustazioni."
    - tutor: "Ottimo, le grafiche erano la parte più lunga. E i testi, a che punto sono?"
      goals: [update]
    - learner: "Sono fermi, purtroppo. Li ho mandati due settimane fa, ho scritto tre volte alla responsabile del marketing, e mi ha risposto che non sono ancora stati approvati da il titolare."
      errors: [articulated-preposition]
      gold: {text: "approvati da il titolare", fix: "approvati dal titolare"}
    - tutor: "Tre e-mail senza risposta: che pazienza. Ma riprendi «approvati da il titolare»: qui preposizione e articolo restano separati?"
      prompt: {text: "approvati da il titolare", tags: [articulated-preposition]}
    # decoy: «dubito che li legga» is a correct subjunctive
    - learner: "No, si uniscono: approvati dal titolare. E lui è in vendemmia fino a fine mese, quindi dubito che li legga prima di ottobre."
    - tutor: "Questo è un problema, perché la campagna deve partire prima della festa della vendemmia. Hai qualche idea?"
      goals: [problem]
    - learner: "Una proposta: partiamo subito con il video della vendemmia dell'anno scorso, che il titolare ha già approvato, e aggiungiamo i testi delle degustazioni appena arrivano. Sarebbe una soluzione temporale, ma funzionerebbe."
      errors: [false-friend]
    - tutor: "Una soluzione temporanea mi va bene, purché il cliente sia d'accordo a usare il video vecchio. Glielo chiedi tu?"
      goals: [proposal]
      recast: {text: "una soluzione temporale", fix: "una soluzione temporanea", tags: [false-friend]}
    - learner: "Scrivo oggi alla responsabile del marketing. Al titolare, invece, potresti telefonare tu? Ho l'impressione che con me non si fida molto: sono solo una stagista."
      errors: [subjunctive-use]
      gold: {text: "Ho l'impressione che con me non si fida", fix: "Ho l'impressione che con me non si fidi"}
    - tutor: "Certo, lo chiamo io stasera: con me di solito si sbottona. Ma riprendi «ho l'impressione che con me non si fida»: dopo «ho l'impressione che», quale modo?"
      prompt: {text: "Ho l'impressione che con me non si fida", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: ho l'impressione che non si fidi. Grazie, mi togli un peso."
    - tutor: "Figurati. Allora, per quando può partire la campagna, con il video vecchio?"
    - learner: "Se mi dedico solo a quella, parte entro mercoledì. Se invece nel frattempo arrivano i testi approvati, ci metterò un giorno in più, perché li doverò tradurre tutti in tedesco."
      errors: [future-form]
      gold: {text: "li doverò tradurre", fix: "li dovrò tradurre"}
    - tutor: "Mercoledì va benissimo. Ma riprendi «li doverò tradurre»: il futuro di «dovere» si forma come quello di «potere» e di «sapere»?"
      prompt: {text: "li doverò tradurre", tags: [future-form]}
    - learner: "No, perde la vocale: li dovrò tradurre tutti. Allora mercoledì con il video, e giovedì al massimo con i testi?"
    - tutor: "Perfetto: mercoledì, o giovedì al massimo. Lo scrivo nel verbale."
      goals: [deadline]
    - learner: "Un'ultima cosa: la festa della vendemmia è il ventotto, vero? Vorrei mettere anche un conto alla rovescia nelle storie della cantina."
    - tutor: "Il ventotto, sì. Il conto alla rovescia è un'ottima idea: il cliente ne sarà entusiasta."

- scenario: notizie-attualita
  # facts: nuova legge: i Comuni potranno limitare i nuovi affitti brevi nei centri storici; multe fino a cinquemila euro per chi affitta senza codice identificativo; la sorella della learner vive a Firenze, dove nel centro non è rimasto quasi nessun residente; il giornale di Milano titolava «Salvati i centri storici»; quello di Roma intervistava un'economista: i prezzi degli affitti normali non sarebbero scesi perché mancano case; il collega è pessimista; la learner gli manda l'articolo dell'economista
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, relative-pronoun]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    - learner: "L'ho letta ieri sera. Se ho capito bene, i Comuni potranno limitare i nuovi affitti brevi nei centri storici, e chi affitta senza codice identificativo rischia multe fino a cinquemila euro."
    - tutor: "Più o meno è così. E secondo te è una buona legge, o la solita norma fatta per i titoli dei giornali?"
      goals: [summarise]
    # decoy: «temo che i controlli non bastino» is a correct subjunctive
    - learner: "Nel principio mi sembra giusta: a Firenze, dove vive mia sorella, in centro non è rimasto quasi nessun residente. Però temo che i controlli non bastino, e che alla fine paghino solo i piccoli proprietari."
      errors: [word-choice]
    - tutor: "In linea di principio la penso come te; sui controlli, invece, sono ancora più pessimista. Hai visto come l'hanno raccontata i giornali? Sembravano due notizie diverse."
      goals: [opinion]
      recast: {text: "Nel principio", fix: "In linea di principio", tags: [word-choice]}
    - learner: "Sì, sembrava un'altra storia. Il giornale di Milano titolava «Salvati i centri storici», mentre quello di Roma intervistava un'economista, la quale opinione mi è sembrata molto più seria."
      errors: [relative-pronoun]
      gold: {text: "la quale opinione", fix: "la cui opinione"}
    - tutor: "Quel titolo era davvero esagerato. Ma riprendi «la quale opinione»: per dire «l'opinione di questa economista», quale relativo si mette davanti al nome?"
      prompt: {text: "la quale opinione", tags: [relative-pronoun]}
    # decoy: «non sarebbero scesi» is the correct future in the past
    - learner: "La cui opinione, giusto. Diceva che i prezzi degli affitti normali non sarebbero scesi, perché mancano case, non regole."
    - tutor: "Su questo ha ragione, secondo me. E che cosa succederà, secondo te, a chi vive di affitti brevi?"
      goals: [sources]
    - learner: "Chi ha un solo appartamento si metterà in regola, credo. Le agenzie con cinquanta case, invece, troveranno il modo di aggirare la legge e continueranno come se nulla è successo."
      errors: [subjunctive-use]
      gold: {text: "come se nulla è successo", fix: "come se nulla fosse successo"}
    - tutor: "Le agenzie hanno buoni avvocati, è vero. Ma riprendi «come se nulla è successo»: dopo «come se», l'indicativo va bene?"
      prompt: {text: "come se nulla è successo", tags: [subjunctive-use]}
    - learner: "No, ci vuole il congiuntivo: come se nulla sia successo."
      errors: [subjunctive-use]
    - tutor: "Come se nulla fosse successo, appunto: è quello che temo anch'io. Allora, secondo te, questa legge serve a qualcosa o no?"
      goals: [consequences]
      recast: {text: "come se nulla sia successo", fix: "come se nulla fosse successo", tags: [subjunctive-use]}
    # decoy: «se avessero fatto ... oggi il centro sarebbe» is a correct mixed hypothetical
    - learner: "Serve, se i Comuni la applicano davvero. Mia sorella dice che, se avessero fatto una legge così dieci anni fa, oggi il centro di Firenze sarebbe ancora abitato. Tu invece la vedi nera, no?"
    - tutor: "Nerissima: ci crederò quando vedrò i primi controlli. Però hai ragione, almeno è un inizio."
    - learner: "Se vuoi approfondire, ti mando l'articolo dell'economista: è lungo, ma ben documentato, con dati e grafici, e alla fine c'è una lista delle fonti molto comprensiva."
      errors: [false-friend]
    - tutor: "Una lista delle fonti molto completa? Allora mandamelo, lo leggo in pausa pranzo."
      recast: {text: "molto comprensiva", fix: "molto completa", tags: [false-friend]}
    - learner: "Te lo mando subito. E domani ne riparliamo, se nel frattempo non hai cambiato idea."
    - tutor: "Difficile, ma non impossibile. A domani, e grazie per l'articolo."

- scenario: poesia-montale
  # facts: «Spesso il male di vivere ho incontrato»; prima strofa: rivo strozzato, foglia riarsa, cavallo stramazzato; seconda: statua, nuvola, falco alto levato; quasi tutti endecasillabi, l'ultimo verso più lungo; «levato» rima con «incontrato»; il learner, pensionato, l'ha letta al liceo e ricorda solo il muro con i cocci di bottiglia di «Meriggiare pallido e assorto», da leggere per giovedì
  level: C2
  persona: en-m-retired
  history: [relative-pronoun, participle-agreement]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Soprattutto il cavallo stramazzato. È un'immagine brutale, quasi fisica, e arriva alla fine della prima strofa come un colpo: dopo il rivo e la foglia, che sono piccoli, all'improvviso crolla un animale."
    - tutor: "È vero, la serie cresce: dall'acqua alla pianta all'animale. E che cosa hanno in comune queste tre immagini?"
      goals: [first-reading]
    - learner: "Sono tutte cose che soffrono senza poterlo dire. Montale non spiega il male: lo mostra attraverso oggetti che sono stati scelto con la precisione di un naturalista."
      errors: [participle-agreement]
      gold: {text: "sono stati scelto", fix: "sono stati scelti"}
    - tutor: "La precisione del naturalista c'è tutta, è un'ottima osservazione. Ma riprenda «oggetti che sono stati scelto»: nel passivo, il participio non deve accordarsi con il soggetto?"
      prompt: {text: "sono stati scelto", tags: [participle-agreement]}
    - learner: "Sì, con «oggetti»: sono stati scelti. È questo il correlativo oggettivo, vero?"
    - tutor: "Proprio quello: l'emozione non viene nominata, ma affidata a un oggetto. E nella seconda strofa, che cosa cambia?"
      goals: [image]
    - learner: "Cambia il segno: al male si oppone l'Indifferenza, che è l'unico bene che il poeta ha conosciuto. La statua, la nuvola e il falco sono cose a cui niente le tocca."
      errors: [relative-pronoun]
      gold: {text: "cose a cui niente le tocca", fix: "cose che niente tocca"}
    - tutor: "L'opposizione è proprio quella. Ma riprenda «cose a cui niente le tocca»: «toccare», in questo senso, vuole una preposizione? E serve ripetere «le»?"
      prompt: {text: "cose a cui niente le tocca", tags: [relative-pronoun]}
    - learner: "Allora: sono cose a cui niente tocca."
      errors: [relative-pronoun]
    - tutor: "«Cose che niente tocca», appunto: per questo sono divine. Ha notato anche la forma? Che metro usa Montale, e che cosa fanno le rime?"
      recast: {text: "a cui niente tocca", fix: "che niente tocca", tags: [relative-pronoun]}
    # decoy: «come se il falco salisse» is a correct subjunctive
    - learner: "Sono quasi tutti endecasillabi, ma l'ultimo verso è più lungo, come se il falco salisse oltre la misura. E «levato» rima con «incontrato», il primo verso."
    - tutor: "Splendida osservazione: la poesia si chiude sulla rima con cui si è aperta. Allora, come la leggerebbe nel suo insieme?"
      goals: [sound]
    - learner: "Secondo me dice che il dolore è ovunque e che l'unico bene possibile è un distacco divino. Ma, sinceramente, una salvezza così fredda mi fa più paura che il male stesso."
      errors: [comparative]
      gold: {text: "più paura che il male stesso", fix: "più paura del male stesso"}
    - tutor: "È una lettura personale, e non sbagliata: molti lettori provano lo stesso brivido. Riprenda però «più paura che il male stesso»: qui si paragonano due soggetti, la salvezza e il male; «che» è la scelta giusta?"
      prompt: {text: "più paura che il male stesso", tags: [comparative]}
    - learner: "Mi fa più paura del male stesso. Lei pensa che Montale la desiderasse davvero, questa Indifferenza?"
    - tutor: "Credo che la desiderasse e la temesse insieme: «bene non seppi», dice, cioè non ne ha conosciuto altro. Per giovedì le propongo di leggere «Meriggiare pallido e assorto»."
      goals: [meaning]
    # decoy: «L'ho letta» correctly agrees with the poem
    - learner: "Volentieri. L'ho letta al liceo, ma ricordo solo il muro con i cocci di bottiglia: sarà interessante rileggerla adesso, alla mia età, dopo averne passato tante."
      errors: [participle-agreement]
      gold: {text: "dopo averne passato tante", fix: "dopo averne passate tante"}
    - tutor: "Il muro con i cocci è l'immagine che resta a tutti. Ma riprenda «dopo averne passato tante»: con «ne», il participio resta invariato?"
      prompt: {text: "dopo averne passato tante", tags: [participle-agreement]}
    - learner: "No, si accorda: dopo averne passate tante. Come «l'ho letta», in fondo."
    - tutor: "Proprio così. A giovedì, allora, con il muro e i cocci."

- scenario: turismo-di-massa
  # facts: il learner è Tom, inglese, guida turistica a Venezia da dodici anni; contrario al ticket così com'è: cinque euro non scoraggiano nessuno; esempio: lo scorso aprile, in un giorno con il ticket, venti minuti per attraversare il ponte di Rialto; il ticket lo paga solo chi viene in giornata; chi dorme in albergo paga la tassa di soggiorno; proposta: prenotazione gratuita con numero massimo nei giorni di punta, controlli con un codice sul telefono alla stazione e a piazzale Roma; il conduttore dà del lei
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use, auxiliary-choice]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno. Mi chiamo Tom, sono inglese e faccio la guida turistica a Venezia da dodici anni. Sono contrario al ticket, almeno così com'è: cinque euro non scoraggiano nessuno."
    - tutor: "Una guida contro il ticket: curioso. Ma se cinque euro non bastano, il problema è il prezzo, non il principio?"
      goals: [introduce]
    - learner: "No, è il principio. Le faccio un esempio: lo scorso aprile, in un giorno con il ticket, sul ponte di Rialto c'era così tanta gente che per attraversarlo si ha dovuto aspettare venti minuti."
      errors: [auxiliary-choice]
      gold: {text: "si ha dovuto aspettare", fix: "si è dovuto aspettare"}
    - tutor: "Venti minuti per un ponte: un'immagine che parla da sola. Ma riprenda «si ha dovuto aspettare»: con il «si» impersonale, quale ausiliare prende il passato prossimo?"
      prompt: {text: "si ha dovuto aspettare", tags: [auxiliary-choice]}
    - learner: "Si è dovuto aspettare venti minuti, scusi. E il ticket non ha cambiato niente: si paga e si entra lo stesso."
    - tutor: "Però i soldi del ticket vanno alla città: pulizia, servizi, manutenzione. Non le sembra un vantaggio per i residenti?"
      goals: [example]
    - learner: "In teoria sì, ma i residenti chiedono spazio, non soldi. E poi il ticket lo paga solo chi viene in giornata: che senso ha che chi dorme tre notti in albergo non paga niente?"
      errors: [subjunctive-use]
      gold: {text: "non paga niente", fix: "non paghi niente"}
    - tutor: "Domanda legittima, e ce la fanno in molti. Ma riprenda «che senso ha che chi dorme in albergo non paga niente»: dopo «che senso ha che», quale modo ci vuole?"
      prompt: {text: "non paga niente", tags: [subjunctive-use]}
    - learner: "Che senso ha che chi dorme in albergo non pagherebbe niente?"
      errors: [subjunctive-use]
    - tutor: "Che chi dorme in albergo non paghi niente, però, non è esatto: paga la tassa di soggiorno. Ma lei, allora, che cosa propone al posto del ticket?"
      goals: [rebut]
      recast: {text: "non pagherebbe niente", fix: "non paghi niente", tags: [subjunctive-use]}
    - learner: "Una prenotazione gratuita, con un numero massimo di visitatori nei giorni di punta: così i turisti vengono lo stesso, ma distribuiti meglio. Secondo me fa molto più senso di un biglietto."
      errors: [word-choice]
    - tutor: "Una prenotazione gratuita ha molto più senso, dice lei. Ma chi controlla migliaia di prenotazioni al giorno, senza tornelli?"
      recast: {text: "fa molto più senso", fix: "ha molto più senso", tags: [word-choice]}
    # decoy: «come oggi si controlla il ticket» is a correct impersonal si
    - learner: "Si controlla come oggi si controlla il ticket: con un codice sul telefono e qualche controllo a campione alle entrate principali, cioè alla stazione e a piazzale Roma. Manca solo la volontà politica."
    - tutor: "La volontà politica, forse la chiave di tutto. Grazie, Tom: finalmente una proposta concreta."
      goals: [proposal]
    - learner: "Se posso aggiungere una cosa, prima di salutarti: in dodici anni ho visto andarsene tantissimi veneziani, e se non si interviene adesso, fra dieci anni resteranno solo i turisti."
      errors: [register]
      gold: {text: "prima di salutarti", fix: "prima di salutarla"}
    - tutor: "Prego, aggiunga pure. Ma riprenda «prima di salutarti»: finora ci siamo dati del lei, giusto?"
      prompt: {text: "prima di salutarti", tags: [register]}
    - learner: "Ha ragione, mi scusi: prima di salutarla, volevo solo dire che senza i veneziani Venezia non è più Venezia."
    - tutor: "Ed è il messaggio con cui chiudiamo la telefonata. Grazie ancora, e buon lavoro tra le calli."

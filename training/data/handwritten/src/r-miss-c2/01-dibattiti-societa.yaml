# Set r-miss-c2, file 1: debates on cities, work, technology, tourism, satire and a seminar.
# One subtle error buried in a long fluent turn (fixed-expression prepositions, concessives,
# consecutio, mixed hypotheticals, clitics with «convincere», «venire» in compound passives,
# false friends, collocations, «piuttosto che» for «oppure»), beside long correct turns.
- scenario: dibattito-ambiente
  # facts: il residente ha un negozio di scarpe in via Roma da vent'anni, clienti quasi tutti in macchina; proposta finale: chiusura sperimentale nei fine settimana, con navetta gratuita dal parcheggio della stazione; da mettere a verbale
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco la sua preoccupazione, ma non sono d'accordo. Credo che una zona pedonale ben progettata, con parcheggi di scambio ai margini, possa addirittura portare più clienti nei negozi del centro."
    - tutor: "Più clienti? Io ho un negozio di scarpe in via Roma da vent'anni, e i miei clienti arrivano quasi tutti in macchina. Su che cosa basa questa convinzione?"
      goals: [position]
    - learner: "Mi baso sull'esperienza di altre città europee che hanno chiuso il centro anni fa: lì, in confronto di prima, i negozi di vicinato fatturano di più, perché la gente passeggia e si ferma."
      errors: [preposition]
      gold: {text: "in confronto di prima", fix: "in confronto a prima"}
    - tutor: "Le altre città hanno parcheggi e mezzi che noi non abbiamo, ma lasciamo stare. Riprenda «in confronto di prima»: dopo «in confronto», quale preposizione ci vuole?"
      prompt: {text: "in confronto di prima", tags: [preposition]}
    - learner: "In confronto a prima, volevo dire: i negozi di vicinato fatturano di più, perché chi passeggia si ferma anche a guardare le vetrine."
    - tutor: "Così va bene. Sarà, ma chi compra un divano o un frigorifero non se lo porta a casa a piedi. Ha un secondo argomento?"
    # decoy: «nessuno gli chiede», with «gli» for «a loro», and «conti» are correct
    - learner: "Sì: l'aria. I residenti del centro respirano ogni giorno lo smog dei pendolari, e nessuno gli chiede mai il permesso. Non le pare che anche la loro salute conti qualcosa?"
    - tutor: "Certo che conta, non sono mica un mostro. Ma la salute si tutela anche con autobus elettrici, senza svuotare le vie dei negozi. E a chi dice che la sera il centro diventerà un deserto, che cosa risponde?"
      goals: [argue]
    - learner: "Rispondo che succede il contrario. Dove le strade sono diventate pedonali, molti commercianti, dopo qualche mese, hanno realizzato che chi va a piedi entra più spesso nei negozi."
      errors: [false-friend]
    - tutor: "Se si sono resi conto che chi va a piedi entra più spesso, buon per loro. Ma io l'affitto lo pago adesso, non fra qualche mese: come arrivo alla fine dell'anno?"
      goals: [counter]
      recast: {text: "hanno realizzato", fix: "si sono resi conto", tags: [false-friend]}
    - learner: "Ha ragione, una fase difficile ci sarebbe comunque. Per questo propongo una chiusura graduale, benché all'inizio comporterà qualche disagio: prima il sabato e la domenica, poi tutta la settimana."
      errors: [subjunctive-use]
      gold: {text: "benché all'inizio comporterà", fix: "benché all'inizio comporti"}
    - tutor: "Una chiusura graduale si può discutere. Però si fermi su «benché all'inizio comporterà»: dopo «benché», quale modo si usa?"
      prompt: {text: "benché all'inizio comporterà", tags: [subjunctive-use]}
    - learner: "Giusto, scusi: benché all'inizio comporterebbe qualche disagio. E aggiungerei una navetta gratuita dal parcheggio della stazione fino ai negozi."
      errors: [subjunctive-use]
    - tutor: "Benché all'inizio comporti qualche disagio, una navetta gratuita mi convince più delle passeggiate. Se il Comune la garantisce nei fine settimana di prova, io ci sto. Lo mettiamo a verbale?"
      goals: [concede]
      recast: {text: "benché all'inizio comporterebbe", fix: "benché all'inizio comporti", tags: [subjunctive-use]}
    - learner: "Mettiamolo a verbale, così la prossima assemblea partirà da una proposta concreta invece che da uno scontro tra commercianti e residenti."
    - tutor: "D'accordo: chiusura sperimentale nei fine settimana, con navetta dalla stazione. Alla prossima assemblea vedremo chi dei due aveva ragione."

- scenario: politica-lavoro
  # facts: la cugina di Riccardo lavorava in banca a Verona, la filiale ha chiuso l'anno scorso, lei è stata spostata e il suo posto non è stato coperto; nel magazzino del learner robot di smistamento da due anni, nessun licenziamento, tre manutentori assunti; reparto passato da dodici a nove persone più i tre manutentori
  level: C2
  persona: es-m-worker
  history: [hypothetical, subjunctive-use]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    # decoy: «non credo che spariranno», future indicative for posteriority, and «ne ha distrutti» are correct
    - learner: "Secondo me esageri un po'. Molti lavori cambieranno, questo sì, ma non credo che spariranno in massa: ogni rivoluzione tecnologica ne ha distrutti alcuni e ne ha creati altri."
    - tutor: "Ne ha creati altri, d'accordo, ma ci è voluta una generazione intera. Prova a immaginare: se domani i camion si guidassero da soli, che fine farebbero i camionisti?"
      goals: [opinion]
    - learner: "Molti perderebbero il lavoro, è chiaro. Il problema è che nessuno ci ha pensato in tempo: se le aziende avessero cominciato a formarli dieci anni fa, adesso sarebbero stati pronti a fare altro."
      errors: [hypothetical]
      gold: {text: "adesso sarebbero stati pronti", fix: "adesso sarebbero pronti"}
    - tutor: "Qui sono d'accordo con te, nessuno ci ha pensato. Però guarda la seconda parte: con «adesso», la conseguenza riguarda il passato o il presente?"
      prompt: {text: "adesso sarebbero stati pronti", tags: [hypothetical]}
    - learner: "Il presente, quindi: se avessero cominciato a formarli dieci anni fa, adesso sarebbero pronti a fare altro."
    - tutor: "Proprio così. Ma un esempio vero ce l'hai, invece di un camion immaginario? Io intorno a me vedo solo sportelli che chiudono."
      goals: [hypothesis]
    - learner: "Un esempio ce l'ho: nel magazzino dove lavoro hanno introdotto i robot per lo smistamento due anni fa, e nessuno è stato licenziato; anzi, hanno contrattato tre manutentori. Tu conosci qualcuno che il lavoro l'ha perso davvero?"
      errors: [false-friend]
    - tutor: "Sì, mia cugina: lavorava in banca a Verona, e l'anno scorso la sua filiale ha chiuso. L'hanno spostata in un'altra sede, ma il suo posto non l'ha preso nessuno. Da voi, invece, oltre ad aver assunto tre manutentori, quanti siete rimasti nel reparto?"
      recast: {text: "contrattato tre manutentori", fix: "assunto tre manutentori", tags: [false-friend]}
      goals: [example]
    - learner: "Prima eravamo in dodici, adesso siamo nove più i tre manutentori, quindi i conti tornano. Però il rumore che gira è che l'anno prossimo arriveranno altri robot."
      errors: [false-friend]
    - tutor: "Se la voce che gira è vera, nel reparto resterete ancora meno, e il tuo esempio si sgonfia un po'. Insomma, alla fine da che parte stai?"
      recast: {text: "il rumore che gira", fix: "la voce che gira", tags: [false-friend]}
    - learner: "Sto nel mezzo. Pensavo che la tecnologia ci liberi dalla fatica, e in parte l'ha fatto; ma senza regole rischiamo che i benefici vadano solo a chi possiede le macchine. Tu cosa ne pensi?"
      errors: [subjunctive-use]
      gold: {text: "Pensavo che la tecnologia ci liberi", fix: "Pensavo che la tecnologia ci liberasse"}
    - tutor: "Penso che sulle regole tu abbia ragione, e con delle regole serie dormirei meglio anch'io. Ma torna su «pensavo che la tecnologia ci liberi»: con «pensavo» al passato, il congiuntivo resta al presente?"
      prompt: {text: "Pensavo che la tecnologia ci liberi", tags: [subjunctive-use]}
    - learner: "No, ci vuole l'imperfetto: pensavo che la tecnologia ci liberasse dalla fatica. Allora siamo d'accordo almeno sulle regole?"
    - tutor: "Sulle regole sì, e anche sulla formazione. Facciamo così: tra dieci anni ci rivediamo a cena e vediamo chi dei due aveva ragione."
      goals: [conclude]

- scenario: intelligenza-artificiale
  # facts: il learner è dottoranda e nel suo laboratorio usa l'intelligenza artificiale per riassumere articoli e controllare il codice; il professore, scettico, è stato convinto dai dottorandi più giovani e ora la usa per le domande dei progetti; l'amico, se fosse al governo, tasserebbe le aziende che sostituiscono persone con macchine e userebbe i soldi per la formazione
  level: C2
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, ma mi sembra che si parli tanto dei posti persi e poco di quelli nuovi. Prima di internet nessuno avrebbe immaginato che esistessero lavori come il moderatore di contenuti."
    - tutor: "Bel lavoro, il moderatore: otto ore a guardare orrori per pochi soldi. Ma dimmi tu, in concreto: a te questa tecnologia che cosa ha cambiato?"
      goals: [position]
    - learner: "Nel mio laboratorio la usiamo per riassumere gli articoli e per controllare il codice. Il professore era scettico, ma alla fine i dottorandi più giovani gli hanno convinto a provarla."
      errors: [object-pronoun]
      gold: {text: "gli hanno convinto", fix: "l'hanno convinto"}
    - tutor: "Un professore convertito, addirittura! Riprendi però «gli hanno convinto»: «convincere» regge un complemento diretto o indiretto?"
      prompt: {text: "gli hanno convinto", tags: [object-pronoun]}
    - learner: "Diretto, quindi l'hanno convinto. E adesso è il primo a usarla per scrivere le domande dei progetti."
    - tutor: "Ecco, comincia sempre così: oggi la usa per le domande dei progetti, domani i progetti li scrive lei da sola. Hai qualche dato, oltre al tuo professore?"
    # decoy: «piuttosto che licenziarli» is «piuttosto che» in its correct sense, "instead of"
    - learner: "Qualche dato sì: ho letto uno studio secondo cui nei call center l'assistente automatico ha aiutato soprattutto i dipendenti meno esperti. Piuttosto che licenziarli, molte aziende li hanno formati di nuovo."
    - tutor: "Uno studio, d'accordo. Ma chi l'ha pagato? Spesso queste ricerche le finanziano le stesse aziende che vendono il prodotto. Almeno su questo mi dai ragione?"
      goals: [evidence]
    - learner: "Su questo ti do ragione: bisogna sempre controllare chi finanzia una ricerca. Ma anche se fosse vero, non basterebbe a fare una conclusione così netta come la tua."
      errors: [word-choice]
    - tutor: "Va bene, trarre una conclusione così netta forse è troppo anche per me. Però ammetterai che qualcuno, nel frattempo, il lavoro lo perderà."
      goals: [concede]
      recast: {text: "fare una conclusione", fix: "trarre una conclusione", tags: [word-choice]}
    - learner: "Certo, e proprio per questo servirebbero regole serie. Tu cosa proporresti, se fossi al governo per un giorno?"
    - tutor: "Se fossi al governo, tasserei le aziende che sostituiscono le persone con le macchine e userei quei soldi per la formazione. Ti sembra troppo radicale?"
    - learner: "Non troppo, anzi. Quei soldi si potrebbero usare per corsi serali piuttosto che per stage pagati nelle aziende: va bene tutto, l'importante è cominciare presto."
      errors: [word-choice]
    - tutor: "Per corsi serali oppure per stage pagati, d'accordo: l'importante è cominciare presto. Allora, almeno su questo siamo dalla stessa parte?"
      recast: {text: "piuttosto che per stage pagati", fix: "oppure per stage pagati", tags: [word-choice]}
    - learner: "Direi di sì: tu un po' meno pessimista, io un po' meno ingenua. Brindiamo a questo?"
    - tutor: "Brindiamo. Ma se tra dieci anni avrò avuto ragione io, la cena la offri tu."
      goals: [conclude]

- scenario: turismo-di-massa
  # facts: la learner insegna spagnolo e vive a Firenze, in Oltrarno, da quasi vent'anni; in dieci anni hanno chiuso latteria, calzolaio e merceria, ora tre negozi di souvenir e un locale con panini a dodici euro; proposta: ticket, tetto agli affitti brevi in centro, aiuti ai giovani artigiani, sgravi fiscali a chi affitta per almeno quattro anni ai residenti
  level: C2
  persona: es-f-teacher
  history: [passive, subjunctive-use]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno a tutti. Sono un'insegnante di spagnolo e vivo a Firenze da quasi vent'anni. Sono a favore del ticket, a patto che i soldi raccolti vengano spesi davvero per chi in città ci abita."
    - tutor: "Una posizione chiara, almeno. Ma un ticket non rischia di trasformare la città in un parco a tema, con tanto di tornelli?"
      goals: [introduce]
    - learner: "Non lo credo. Prenda Venezia: lì il contributo d'accesso è venuto introdotto in via sperimentale, e almeno per una volta tutti hanno parlato del sovraffollamento, non solo delle foto in piazza."
      errors: [passive]
      gold: {text: "è venuto introdotto", fix: "è stato introdotto"}
    - tutor: "Venezia, certo, il caso più discusso. Ma si fermi su «è venuto introdotto»: in un tempo composto come questo, il passivo si può costruire con «venire»?"
      prompt: {text: "è venuto introdotto", tags: [passive]}
    - learner: "No, con i tempi composti ci vuole «essere»: il contributo è stato introdotto in via sperimentale. E un esempio fiorentino ce l'ho anch'io."
    - tutor: "Così è corretto. Sentiamo allora l'esempio fiorentino: che cosa vede, ogni giorno, sotto casa?"
    # decoy: «se ne sono andati» is correct
    - learner: "Abito in Oltrarno. In dieci anni hanno chiuso la latteria, il calzolaio e la merceria, e al loro posto ci sono tre negozi di souvenir e un locale che vende panini a dodici euro. I miei vicini se ne sono andati quasi tutti."
    - tutor: "Un quadro triste, e purtroppo familiare. Ma, mi perdoni, il ticket non riporterebbe il calzolaio: i turisti pagherebbero e continuerebbero a comprare panini. Che cosa risponde?"
      goals: [example]
    - learner: "Da solo, no. Ma il ticket obbliga il Comune a contare chi entra, e senza numeri non si governa niente. Se avessero avuto quei dati dieci anni fa, forse oggi in Oltrarno ci sarebbe ancora la latteria."
    - tutor: "Ammetto che l'argomento dei numeri è solido. E dunque, se toccasse a Lei, che cosa farebbe con quei soldi e con quei dati?"
      goals: [rebut]
    - learner: "Metterei un tetto agli affitti brevi in centro e userei i soldi del ticket per aiutare i giovani artigiani ad aprire una bottega. Così, a medio plazo, il quartiere tornerebbe a vivere tutto l'anno."
      errors: [word-choice]
    - tutor: "A medio termine, dice, e non subito: almeno è onesta sui tempi. Un tetto agli affitti brevi, però, i proprietari lo porterebbero in tribunale il giorno dopo. Come li convincerebbe?"
      recast: {text: "a medio plazo", fix: "a medio termine", tags: [word-choice]}
    # decoy: «ci guadagnano» has a correct «ci», and «vedano» is a correct subjunctive
    - learner: "Con le buone: offrirei sgravi fiscali a chi affitta per almeno quattro anni ai residenti, affinché anche i proprietari ci guadagnano qualcosa e non vedano la misura come una punizione."
      errors: [subjunctive-use]
      gold: {text: "affinché anche i proprietari ci guadagnano", fix: "affinché anche i proprietari ci guadagnino"}
    - tutor: "Gli sgravi sono una carota più convincente del bastone. Ma riascolti «affinché anche i proprietari ci guadagnano»: dopo «affinché», che modo ci vuole? Subito dopo Lei usa quello giusto."
      prompt: {text: "affinché anche i proprietari ci guadagnano", tags: [subjunctive-use]}
    - learner: "Ah, scusi, volevo dire: affinché anche i proprietari ci guadagnerebbero qualcosa. Il punto è non metterli contro i residenti."
      errors: [subjunctive-use]
    - tutor: "Affinché anche i proprietari ci guadagnino qualcosa, appunto, senza metterli contro i residenti. Ricapitoli Lei per i nostri ascoltatori, in una frase?"
      recast: {text: "affinché anche i proprietari ci guadagnerebbero", fix: "affinché anche i proprietari ci guadagnino", tags: [subjunctive-use]}
    - learner: "In una frase: il ticket per contare e finanziare, un tetto agli affitti brevi per proteggere le case, e sgravi per chi affitta ai residenti."
    - tutor: "Più chiaro di così non si può. Grazie, signora, e buona giornata a Firenze: passiamo alla prossima telefonata."
      goals: [proposal]

- scenario: umorismo-satira
  # facts: battuta del comico: il ministro difende la tradizione italiana e poi fa la carbonara con la panna; battuta preferita del learner: la nonna dei messaggi vocali, un ragazzo in prima fila ha detto venti al giorno; battuta sui migranti, che ha messo a disagio l'amico; il nonno del learner era di Ostia; il mese prossimo c'è una serata di satira politica
  level: C2
  persona: en-m-heritage
  history: [imperative-form, hypothetical]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto, mi hai beccato: ho riso solo perché ridevano tutti. Che c'entrava la panna, esattamente? Mi spieghi perché il pubblico è impazzito?"
    - tutor: "Perché la carbonara con la panna, per un romano, è quasi un reato. Il comico diceva che il ministro difende la tradizione italiana e poi la carbonara la fa con la panna: un patriota da supermercato, insomma. E a te quale battuta è piaciuta davvero?"
      goals: [missed]
    - learner: "Quella della nonna e dei messaggi vocali. Il bello era quando si è rivolto a un ragazzo in prima fila e gli ha detto: «Sie sincero, quanti vocali ti manda la tua al giorno?»"
      errors: [imperative-form]
      gold: {text: "Sie sincero", fix: "Sii sincero"}
    - tutor: "Quella era fortissima. Ma ripeti «sie sincero»: l'imperativo di «essere» rivolto a una persona sola, a cui si dà del tu, è proprio quello?"
      prompt: {text: "Sie sincero", tags: [imperative-form]}
    - learner: "Hai ragione, «sii sincero». E il ragazzo ha risposto «venti», e il teatro è venuto giù dalle risate."
    - tutor: "Venti vocali al giorno, roba da sindacato! Funzionava perché ognuno ci rivedeva la propria nonna. E tu, che sei bilingue, ce l'hai un gioco di parole da proporre?"
      goals: [favourite]
    - learner: "Ci provo con uno di mio nonno, che era di Ostia: qual è il colmo per un orologiaio? Non avere mai tempo. Lo so, è da quarta elementare, ma lui ogni volta rideva da solo per cinque minuti."
    - tutor: "Da quarta elementare, ma funziona: gioca sui due sensi di «tempo», quello dell'orologio e quello che non abbiamo mai. La battuta sui migranti, invece, a me ha messo a disagio. Secondo te ha superato il limite?"
      goals: [wordplay]
    - learner: "Un po' sì. Secondo me il problema non era l'argomento ma chi parlava: se l'avrebbe detta un comico che i migranti li conosce davvero, forse avrebbe fatto ridere anche me."
      errors: [hypothetical]
      gold: {text: "se l'avrebbe detta", fix: "se l'avesse detta"}
    - tutor: "Interessante: il problema è chi parla. Però ripeti «se l'avrebbe detta»: nella parte introdotta da «se», il condizionale ci può stare?"
      prompt: {text: "se l'avrebbe detta", tags: [hypothetical]}
    - learner: "No, ci vuole il congiuntivo: se l'avesse detta un comico che i migranti li conosce davvero. Allora tu dici che la satira deve avere dei limiti?"
    - tutor: "Io dico che la satira deve colpire chi sta in alto, non chi sta già in fondo: il ministro sì, i migranti no. Ti ci ritrovi?"
    - learner: "Mi ci ritrovo, anche se non è sempre chiaro chi stia in alto. Diciamo che la satira ha bisogno di un bersaglio preciso, e che eventualmente è il pubblico a decidere se il colpo è andato a segno."
      errors: [false-friend]
    - tutor: "Alla fine è il pubblico a decidere, d'accordo, e stasera ha deciso con le risate. Che ne dici di tornarci il mese prossimo, per la serata di satira politica?"
      goals: [limits]
      recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    - learner: "Volentieri, ma stavolta mi siedo in ultima fila: non voglio che il comico mi chieda quanti vocali mi manda mia nonna!"
    - tutor: "Affare fatto: ultima fila, e i vocali di tua nonna restano un segreto tra noi."

- scenario: smartworking
  # facts: la learner lavora tre giorni a casa e due in ufficio (martedì e giovedì), compromesso raggiunto dopo una trattativa con i sindacati; un'ora e mezza tra treno e metro per arrivare; in ufficio sono in sei in una stanza; Andrea va in ufficio tutti i giorni, quaranta minuti all'andata e quaranta al ritorno; preferenza finale: casa, ma con due giorni pieni in ufficio
  level: C2
  persona: en-f-professional
  history: [comparative, subjunctive-use]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Faccio un po' e un po': tre giorni a casa e due in ufficio, il martedì e il giovedì. All'inizio l'azienda voleva tutti in sede, ma dopo una lunga trattativa con i sindacati si è arrivati a questo compromesso."
    - tutor: "Tre e due, non male. Io invece in ufficio ci vado tutti i giorni, perché il mio capo vuole vederci in faccia. Tu che cosa ci guadagni, a stare a casa?"
      goals: [situation]
    - learner: "Prima di tutto il tempo: per arrivare in ufficio ci metto un'ora e mezza tra treno e metro. E poi, banalmente, la mia scrivania di casa è molto più comoda che quella dell'ufficio, dove siamo in sei in una stanza."
      errors: [comparative]
      gold: {text: "più comoda che quella", fix: "più comoda di quella"}
    - tutor: "In sei in una stanza? Allora ti capisco. Ma senti «più comoda che quella»: quando il secondo termine del paragone è un pronome come «quella», quale parola lo introduce?"
      prompt: {text: "più comoda che quella", tags: [comparative]}
    - learner: "Ci vuole «di»: molto più comoda di quella dell'ufficio. E poi a casa nessuno mi interrompe ogni cinque minuti per chiedermi qualcosa."
    - tutor: "Ecco, così fila. Però non mi dirai che è tutto perfetto: chiusa in casa, non ti manca mai niente?"
      goals: [pros]
    - learner: "Eccome se mi manca qualcosa: la pausa caffè con i colleghi, le battute, perfino i pettegolezzi. Passare tre giorni da sola davanti al computer non è esattamente eccitante, e il venerdì ho una gran voglia di vedere gente."
    - tutor: "Tre giorni da sola davanti al computer, lo credo bene. E i colleghi li vedi abbastanza, nei due giorni in ufficio?"
      goals: [cons]
    - learner: "Li vedo, ma sempre in riunione, perché tutti concentrano le riunioni nei giorni in sede. Tu invece come fai, con il capo che vi vuole vedere in faccia ogni giorno? Non ti pesa?"
    - tutor: "Un po' mi pesa, soprattutto il traffico: quaranta minuti all'andata e quaranta al ritorno. Però in ufficio stacco davvero, e a casa il lavoro non lo porto. Se potessi scegliere da zero, tu che cosa vorresti?"
    - learner: "Due giorni a casa e tre in ufficio, ma con orari flessibili. E chiederei al mio capo che le riunioni si facciano tutte il martedì mattina, così il resto della settimana resterebbe libero per lavorare davvero."
      errors: [subjunctive-use]
      gold: {text: "che le riunioni si facciano", fix: "che le riunioni si facessero"}
    - tutor: "Il martedì delle riunioni mi piace. Ma riprendi «chiederei che le riunioni si facciano»: dopo un condizionale come «chiederei», il congiuntivo va al presente?"
      prompt: {text: "che le riunioni si facciano", tags: [subjunctive-use]}
    - learner: "Hai ragione, allora: chiederei che le riunioni si siano fatte tutte il martedì mattina."
      errors: [subjunctive-use]
    - tutor: "Chiederei che le riunioni si facessero tutte il martedì: se il tuo capo ci sta, è un'ottima idea. Quindi, alla fine, ti tieni la casa o l'ufficio?"
      recast: {text: "che le riunioni si siano fatte", fix: "che le riunioni si facessero", tags: [subjunctive-use]}
    - learner: "Mi tengo la casa, ma con due giorni pieni in ufficio, perché senza i colleghi divento un orso. Per me il segreto è l'equilibrio, non la scelta assoluta."
    - tutor: "Un orso con il portatile, ti ci vedo! Brindiamo all'equilibrio, allora: il prossimo aperitivo lo facciamo un martedì, dopo le tue riunioni."
      goals: [preference]

- scenario: seminario-etica
  # facts: seminario a Padova; tesi della dottoranda: una macchina non può essere ritenuta moralmente responsabile perché la responsabilità presuppone un agente capace di rendere conto delle proprie ragioni; esempio del bambino di cinque anni e del vaso; concessione: la responsabilità si sposta su chi progetta e impiega il sistema; prossimo incontro giovedì con le obiezioni scritte
  level: C2
  persona: es-f-erasmus
  history: [relative-pronoun, subjunctive-use, article-use]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Ne dubiti pure, professore, è il suo mestiere. La mia tesi, più precisamente, è che una macchina non possa essere ritenuta moralmente responsabile, perché la responsabilità presuppone un agente capace di rendere conto delle proprie ragioni."
    - tutor: "Rendere conto delle proprie ragioni: anche un sistema che spiega le sue scelte, allora, lo fa. Dove passa, secondo lei, la differenza?"
      goals: [thesis]
    - learner: "Passa tra spiegare e giustificare. Un sistema può ricostruire i passaggi che l'hanno portato a un risultato, ma non è un agente cui intenzioni possano essere valutate: non ha scopi propri, solo funzioni assegnate."
      errors: [relative-pronoun]
      gold: {text: "un agente cui intenzioni", fix: "un agente le cui intenzioni"}
    - tutor: "Spiegare e giustificare, d'accordo. Ma riprenda «un agente cui intenzioni»: per dire che le intenzioni appartengono a quell'agente, il relativo da solo basta, o gli manca l'articolo?"
      prompt: {text: "un agente cui intenzioni", tags: [relative-pronoun]}
    - learner: "Gli manca l'articolo: un agente le cui intenzioni possano essere valutate. Ciò che manca alla macchina è proprio questo."
    - tutor: "Esatto. Ma le intenzioni non sappiamo misurarle nemmeno negli esseri umani. Se non possiamo verificarle, come fa a usarle come criterio?"
      goals: [distinguish]
    - learner: "Non le verifichiamo, le attribuiamo, ed è diverso. Se un bambino di cinque anni rompesse un vaso, nessuno lo considererebbe responsabile come un adulto, anche se le sue intenzioni fossero chiarissime."
    - tutor: "L'esempio del bambino è elegante, ma gioca a mio favore: la responsabilità diventa una questione di grado. Perché la macchina dovrebbe stare a zero, e non, poniamo, al livello del bambino?"
    - learner: "Perché il bambino, crescendo, diventerà un agente pieno, mentre la macchina resterà ciò che è. Anche se domani si costruisse un sistema che sembrava capire le proprie ragioni, resterebbe un'imitazione senza un punto di vista."
      errors: [subjunctive-use]
      gold: {text: "un sistema che sembrava capire", fix: "un sistema che sembrasse capire"}
    - tutor: "La distinzione tra crescita e imitazione la annoto. Però riprenda «un sistema che sembrava capire»: in una relativa dentro un'ipotesi, l'imperfetto indicativo è il modo giusto?"
      prompt: {text: "un sistema che sembrava capire", tags: [subjunctive-use]}
    - learner: "Allora: anche se si costruisse un sistema che sembrerebbe capire le proprie ragioni, resterebbe un'imitazione."
      errors: [subjunctive-use]
    - tutor: "Un sistema che sembrasse capire le proprie ragioni resterebbe un'imitazione, dice lei. Mi conceda però almeno questo: chi lo progetta e chi lo usa una parte di responsabilità ce l'ha. O no?"
      goals: [objection]
      recast: {text: "un sistema che sembrerebbe capire", fix: "un sistema che sembrasse capire", tags: [subjunctive-use]}
    - learner: "Su questo le do la ragione senza difficoltà: la responsabilità si sposta su chi progetta e impiega il sistema. Ma proprio questo conferma la mia tesi, se ci pensa bene."
      errors: [article-use]
      gold: {text: "le do la ragione", fix: "le do ragione"}
    - tutor: "Un argomento abile, ci torniamo subito. Prima però «le do la ragione»: in questa espressione fissa, l'articolo ci va?"
      prompt: {text: "le do la ragione", tags: [article-use]}
    - learner: "No, scusi: le do ragione. E se si cerca sempre un responsabile umano, è perché la macchina non può esserlo."
    - tutor: "Così è perfetto, e la concessione diventa un argomento. Ci dia allora la sua conclusione in una sola frase, e la mettiamo a verbale."
      goals: [concede]
    - learner: "In una frase: la responsabilità morale richiede un agente capace di rispondere delle proprie ragioni, e poiché una macchina non lo è, la responsabilità di ciò che fa ricade interamente su chi la progetta e la impiega."
    - tutor: "Rigorosa, e abbastanza prudente da resistere almeno fino al prossimo seminario. Grazie, dottoressa: ci rivediamo giovedì con le obiezioni scritte."
      goals: [conclude]

- scenario: dibattito-ambiente
  # facts: il learner è in pensione e abita in piazza Garibaldi da quarant'anni; una ventina di negozi di alimentari in zona; il nipote ha l'asma; il residente ha anche clienti di trent'anni che arrivano da fuori e apre la domenica; proposta: grande parcheggio all'ingresso del centro, navetta ogni dieci minuti, chiusura sperimentale di un anno con verifica a metà, navetta anche la domenica
  level: C2
  persona: en-m-retired
  history: [ci-ne, relative-pronoun]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Penso esattamente il contrario. Sono in pensione, abito in piazza Garibaldi da quarant'anni, e da quando il traffico è raddoppiato non esco quasi più a piedi: attraversare la strada è diventato un'impresa."
    - tutor: "La capisco, ma un pensionato che passeggia non basta a tenere aperto un negozio. Lei, per esempio, dove fa la spesa?"
      goals: [position]
    - learner: "Proprio qui in centro. Di negozi di alimentari, nella zona di piazza Garibaldi, ci sono ancora una ventina, e io li conosco tutti: vivono dei residenti, non di chi arriva in macchina da fuori."
      errors: [ci-ne]
      gold: {text: "ci sono ancora una ventina", fix: "ce ne sono ancora una ventina"}
    - tutor: "Una ventina, addirittura? Ma rifletta su «ci sono ancora una ventina»: quando si dà la quantità di qualcosa già nominato, come «di negozi», quale pronome serve in più?"
      prompt: {text: "ci sono ancora una ventina", tags: [ci-ne]}
    - learner: "Ce ne sono ancora una ventina, sì. E molti titolari, in privato, mi dicono che i clienti che arrivano in auto sono pochissimi."
    - tutor: "In privato, forse; in assemblea, però, dicono il contrario. Ha anche un secondo argomento, oltre ai negozi?"
    # decoy: «da cui lo porto» and «quelli in cui» are correct relatives
    - learner: "L'inquinamento. Mio nipote ha l'asma, e il pediatra da cui lo porto ci ha detto che i giorni che il traffico è più intenso sono proprio quelli in cui sta peggio."
      errors: [relative-pronoun]
      gold: {text: "i giorni che il traffico", fix: "i giorni in cui il traffico"}
    - tutor: "Mi dispiace per Suo nipote. Ma riascolti «i giorni che il traffico è più intenso»: per un'indicazione di tempo, quel «che» va bene? Poco dopo Lei usa la forma giusta."
      prompt: {text: "i giorni che il traffico", tags: [relative-pronoun]}
    - learner: "I giorni in cui il traffico è più intenso, certo. Due argomenti, quindi: i negozi di vicinato e la salute dei bambini."
    - tutor: "Due argomenti seri, lo ammetto. Ma i commercianti Le direbbero: senza parcheggi, chi viene da fuori va al centro commerciale. Lei che cosa risponde?"
      goals: [argue]
    - learner: "Rispondo che quella battaglia il centro commerciale l'ha già vinta, e coi parcheggi non la recuperiamo. Il centro deve offrire ciò che lì non c'è: vie tranquille, panchine, e per chi ha la mia età un modo di fare la spesa molto più conveniente."
      errors: [false-friend]
    - tutor: "Un modo molto più comodo per chi ha la sua età, d'accordo; ma io ho anche clienti di trent'anni che arrivano da fuori. Che cosa sarebbe disposto a concedere a loro?"
      goals: [counter]
      recast: {text: "molto più conveniente", fix: "molto più comodo", tags: [false-friend]}
    - learner: "A loro concederei un grande parcheggio all'ingresso del centro, con una navetta ogni dieci minuti. E capisco che per i commercianti i primi mesi saranno difficili: proporrei una chiusura sperimentale di un anno, con una verifica a metà."
    - tutor: "Un anno di prova con una verifica a metà: su questo potrei anche votare con Lei. A una condizione, però: che la navetta funzioni anche la domenica, quando io tengo aperto."
      goals: [concede]
    - learner: "Condizione accettata, e anzi la metterei per iscritto nella proposta. Così la prossima volta non litighiamo: ci limitiamo a controllare i numeri."
    - tutor: "Allora la scriviamo insieme, prima della votazione. Tra sei mesi vedremo chi dei due aveva ragione."

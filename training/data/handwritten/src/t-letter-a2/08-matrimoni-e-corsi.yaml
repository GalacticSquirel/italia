# Set t-letter-a2, file 8: A1-A2, answering wedding invitations, course news and busy weeks (one real MERLIN text per dialogue, pool 7).

- scenario: compleanno
  level: A2
  persona: es-f-teacher
  history: [possessive, adjective-agreement]
  turns:
  - tutor: "Allora, cosa facciamo per il matrimonio? Hai ricevuto il nostro invito?"
  # merlin-1365_0100030-2
  - learner: "Sono contente di venire a Napoli con mio marito per suo matrimonio."
    errors: [possessive, adjective-agreement]
    gold: {text: "per suo matrimonio", fix: "per il vostro matrimonio"}
  - tutor: "Che bello! Ma «per suo matrimonio»: prima di «suo», qui cosa ci vuole?"
    prompt: {text: "per suo matrimonio", tags: [possessive]}
  - learner: "Sono contenta di venire a Napoli con mio marito per il vostro matrimonio."
  - tutor: "Bravissima! Allora vi aspettiamo il 12 giugno, in chiesa e poi al ristorante."
    goals: [date]
  # merlin-1365_0100030-3
  - learner: "Avete bisogna di qualche cosa?"
    errors: [word-choice]
  - tutor: "No, non abbiamo bisogno di niente, davvero!"
    recast: {text: "bisogna", fix: "bisogno", tags: [word-choice]}
  # merlin-1365_0100030-4
  - learner: "Perché non ho una idea per un regalo."
  - tutor: "Allora un libro di cucina! A Beatrice piace tanto cucinare."
    goals: [gift]
  - learner: "Va bene! E quante persone avete invitato?"
  - tutor: "Cento persone! Ci sono anche i tuoi cugini."
    goals: [guests]
  # merlin-1365_0100030-5
  - learner: "Bacio a tutte due!"
    errors: [adjective-agreement]
    gold: {text: "tutte due", fix: "tutti e due"}
  - tutor: "Grazie! Ma «tutte due»: siamo un uomo e una donna, quindi...?"
    prompt: {text: "tutte due", tags: [adjective-agreement]}
  - learner: "Un bacio a tutti e due!"
  - tutor: "Perfetto! Un bacio anche a te e a tuo marito."


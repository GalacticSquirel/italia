    recast: {text: "japonese", fix: "giapponese", tags: [spelling]}
  # merlin-1395_0000413-1
  - learner: "È molto divertente sentire l'italiano con gli accenti completamente diversi."
  - tutor: "Ci credo! Che bella classe."
  # merlin-1395_0000413-6
  - learner: "Tanti saluti!"
  - tutor: "Ciao, buon corso!"


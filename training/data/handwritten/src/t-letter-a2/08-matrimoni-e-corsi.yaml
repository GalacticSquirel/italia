  # merlin-1395_0000413-3
  - learner: "Il pomeriggio è libero."
  - tutor: "Che bello! Cosa fai?"
  - learner: "Vado al mare o visito la città. La sera ceno con gli altri studenti."
  - tutor: "Che bella vita! Siete in tanti?"
    goals: [evening]
  # merlin-1395_0000413-0
  - learner: "Nel corso siamo solo cinque studenti: due tedeschi, una svedese, un brasiliano ed un japonese."

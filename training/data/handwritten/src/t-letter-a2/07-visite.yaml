  # merlin-1395_0001065-5
  - learner: "In febbraio siamo stati in vacanza."
  - tutor: "In febbraio? Tu e chi?"
  - learner: "Io e Maria, la mia compagna."
  - tutor: "Ah, Maria! Come sta?"
  # merlin-1395_0001065-3
  - learner: "Maria ha trovato un nuovo lavoro."
  - tutor: "Che bello! Che lavoro?"
  # merlin-1395_0001065-4
  - learner: "Pensa, lei è adesso un'insegnante!"
  - tutor: "Che bello per lei! E dove siete stati?"
  # merlin-1395_0001065-6
  - learner: "Eravamo in Napoli."
    errors: [preposition]
    gold: {text: "in Napoli", fix: "a Napoli"}
  - tutor: "Che bello! Ma «in Napoli»: con le città, quale preposizione usiamo?"
    prompt: {text: "in Napoli", tags: [preposition]}
  - learner: "Sì, eravamo in Napoli per una settimana."

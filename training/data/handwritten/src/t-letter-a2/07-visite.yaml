  - tutor: "Esatto! Sì, è grande, ma il centro è piccolo."
  - learner: "Andiamo al cinema venerdì sera? Mi piacciono i film italiani."
  - tutor: "Sì! C'è una commedia nuova alle nove."
    goals: [propose, genre]

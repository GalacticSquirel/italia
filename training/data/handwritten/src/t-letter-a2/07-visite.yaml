# Set t-letter-a2, file 7: A2, visiting a friend in another city, and news after a long time (one real MERLIN text per dialogue, pool 7).

- scenario: casa-mia
  level: A2
  persona: en-m-traveller
  history: [future-form, article-form]
  turns:
  - tutor: "Ciao! Allora, com'è la tua casa nuova? E come stai?"
  # merlin-1395_0000553-0
  - learner: "Tutto bene anche la moglie e lo figlio?"
    errors: [article-form]
    gold: {text: "lo figlio", fix: "il figlio"}
  - tutor: "Sì, stanno bene! Ma «lo figlio»: con «figlio», l'articolo «lo» va bene?"
    prompt: {text: "lo figlio", tags: [article-form]}
  - learner: "Sì, e lo figlio va a scuola?"
    errors: [article-form]
  - tutor: "Sì, il figlio va a scuola da settembre! È molto contento."
    recast: {text: "lo figlio", fix: "il figlio", tags: [article-form]}
  # merlin-1395_0000553-1
  - learner: "In maggio farro un viaggio in tua città."
    errors: [future-form, articulated-preposition]
    gold: {text: "farro", fix: "farò"}
  - tutor: "Che bella notizia! Ma «farro»: è il futuro di «fare» con «io». Come si dice?"
    prompt: {text: "farro", tags: [future-form]}
  - learner: "In maggio farò un viaggio nella tua città."
  - tutor: "Esatto! Puoi dormire da noi."
  # merlin-1395_0000553-3
  - learner: "Come può trovare la casa tua?"
  - tutor: "Chi, scusa? Tu o un'altra persona?"
  - learner: "Io! Come posso trovare casa tua? È lontano dalla stazione?"
  - tutor: "No, è vicino. È un appartamento al terzo piano, con due camere."
    goals: [ask]
  - learner: "Anche io abito in un appartamento, ma ho solo una camera e una cucina piccola."
  - tutor: "Va bene così, per una persona!"
    goals: [type, rooms]
  # merlin-1395_0000553-6
  - learner: "Si tu sei d'accordo, io telefonarro la settimana prossima, una volta la sera."
    errors: [future-form, spelling]
    gold: {text: "telefonarro", fix: "telefonerò"}
  - tutor: "D'accordo! Ma «telefonarro»: com'è il futuro con «io»? Pensa a «parlerò»."
    prompt: {text: "telefonarro", tags: [future-form]}
  - learner: "Sì, io telefonarò la settimana prossima."
    errors: [future-form]
  - tutor: "No, telefonerò io a te, è più facile!"
    new: [{lemma: telefonare, gloss: to phone}]
    recast: {text: "telefonarò", fix: "telefonerò", tags: [future-form]}
  # merlin-1395_0000553-7
  - learner: "Tanti saluti e a presto!"
  - tutor: "Ciao, a maggio!"

- scenario: casa-mia
  level: A2
  persona: es-m-worker
  history: [verb-form]
  turns:
  - tutor: "Ciao! Allora, com'è la tua casa? E quando vieni a vedere la mia?"
  # merlin-1395_0000534-0
  - learner: "Caro Luca, come stai amico mio?"
  - tutor: "Bene, grazie! Allora vieni sabato?"
  # merlin-1395_0000534-2
  - learner: "Ma come faccio per andare a casa tua?"
  - tutor: "È facile! Abito in via Roma, al numero 12."
  # merlin-1395_0000534-3
  - learner: "È meglio con la metropolitana o con il pullman?"
  - tutor: "Con la metropolitana: sono solo tre fermate."
    goals: [ask]
  - learner: "Perfetto! Io abito in una casa piccola, con due camere e un giardino."
  - tutor: "Che bello! La prossima volta vengo io da te!"
    goals: [type, rooms]
  # merlin-1395_0000534-7
  - learner: "Aspetta la tua telefonata."
    errors: [verb-form]
    gold: {text: "Aspetta", fix: "Aspetto"}
  - tutor: "Va bene! Ma «aspetta»: chi aspetta, tu o io?"
    prompt: {text: "Aspetta", tags: [verb-form]}
  - learner: "Io! Aspetto la tua telefonata."
  - tutor: "Bravo! Ti chiamo venerdì sera."
  # merlin-1395_0000534-8
  - learner: "In attesa di vederti ti faccio tanti baci."
  - tutor: "Anch'io! Ci vediamo sabato."
  # merlin-1395_0000534-9
  - learner: "Ciao e a presto!"
  - tutor: "Ciao, buon viaggio!"

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [spelling, articulated-preposition]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1395_0000531-0
  - learner: "Ciao Sara, come stai?"
  - tutor: "Bene! Allora, quando vieni a trovarmi?"
  # merlin-1395_0000531-1
  - learner: "Vorei venire a trovarti, ma non so come trovarti. Mi potresti mandare il tuo indirizzo?"
    errors: [spelling]
    gold: {text: "Vorei", fix: "Vorrei"}
  - tutor: "Certo! Ma «vorei»: c'è una lettera in meno. Quale?"
    prompt: {text: "Vorei", tags: [spelling]}
  - learner: "La r! Vorrei venire a trovarti."
  - tutor: "Esatto! Ti mando l'indirizzo stasera. Cosa vuoi vedere in città?"
  # merlin-1395_0000531-4
  - learner: "Penso ai musei o il centro città veccia."
    errors: [articulated-preposition, spelling]
    gold: {text: "o il centro", fix: "o al centro"}
  - tutor: "Bella idea! Ma «o il centro»: con «pensare», anche il centro vuole la preposizione. Quale?"
    prompt: {text: "o il centro", tags: [articulated-preposition]}
  - learner: "Penso ai musei o a il centro."
    errors: [articulated-preposition]
  - tutor: "Ai musei o al centro, va bene! Il centro è bellissimo."
    recast: {text: "a il centro", fix: "al centro", tags: [articulated-preposition]}
  # merlin-1395_0000531-10
  - learner: "Andate al cinema o a ballare?"
  - tutor: "Tutti e due! Io e mio marito balliamo ogni sabato."
    goals: [ask]
  # merlin-1395_0000531-12
  - learner: "Fra un mese potrei venire a trovarti."
  - tutor: "Benissimo! Fra un mese sono libera."
  # merlin-1395_0000531-15
  - learner: "La sera andiamo a ballare e prima fare una bella cena."
    errors: [verb-form]
    gold: {text: "prima fare", fix: "prima facciamo"}
  - tutor: "Che programma! Ma «prima fare»: chi fa la cena? Noi due! Allora il verbo?"
    prompt: {text: "prima fare", tags: [verb-form]}
  - learner: "E prima fare una bella cena insieme."
    errors: [verb-form]
  - tutor: "Sì, prima facciamo una bella cena insieme, poi tutti a ballare!"
    recast: {text: "prima fare", fix: "prima facciamo", tags: [verb-form]}
    goals: [propose]
  - learner: "Perfetto! Anche io amo ballare, lo faccio spesso."
  - tutor: "Allora ci divertiamo! Ti aspetto."
    goals: [hobby, frequency]

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [preposition, possessive]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1395_0001024-0
  - learner: "Cara Sara, come stai?"
  - tutor: "Benissimo! Allora vieni a trovarmi a Bologna?"
  # merlin-1395_0001024-1
  - learner: "E che fanno i tiei?"
    errors: [possessive]
    gold: {text: "i tiei", fix: "i tuoi"}
  - tutor: "Stanno bene! Ma «i tiei»: è la forma giusta di «tuo» al plurale?"
    prompt: {text: "i tiei", tags: [possessive]}
  - learner: "No, scusa! E che fanno i tuoi?"
  - tutor: "Esatto! Mia madre lavora ancora, mio padre no."
  # merlin-1395_0001024-2
  - learner: "Grazie che posso venire a visitarti!"
  - tutor: "Ma di niente, è un piacere!"
  # merlin-1395_0001024-3
  - learner: "Quando posso venire?"
  - tutor: "Quando vuoi! Io sono libera quasi sempre."
  # merlin-1395_0001024-4
  - learner: "A te conviene il marzo, quando ho già preso le vacanze?"
    errors: [preposition]
    gold: {text: "il marzo", fix: "in marzo"}
  - tutor: "Marzo va benissimo! Ma «il marzo»: con i mesi, usiamo l'articolo?"
    prompt: {text: "il marzo", tags: [preposition]}
  - learner: "Sì, il marzo, dopo il 10."
    errors: [preposition]
  - tutor: "In marzo, dopo il 10: perfetto! E la sera cosa facciamo?"
    recast: {text: "il marzo", fix: "in marzo", tags: [preposition]}
  # merlin-1395_0001024-6
  - learner: "Sai bene quanto mi piace ballare!"
  - tutor: "Lo so! Allora andiamo a ballare ogni sera."
    goals: [hobby, propose]
  - learner: "Sì! Io ballo tutte le settimane. E tu, balli ancora tanto?"
  - tutor: "Meno di prima, ma con te ballo sempre!"
    goals: [frequency, ask]

- scenario: casa-mia

# Set t-letter-a2, file 4: A2, more friends looking for work, and work after the final school exam (one real MERLIN text per dialogue, pool 7).

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [spelling]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito? Io cerco un lavoro nuovo."
  # merlin-1385_0000033-0
  - learner: "Puoi dirmi dove lavori adesso?"
  - tutor: "In un ristorante, ma solo la sera."
    goals: [ask]
  # merlin-1385_0000033-1
  - learner: "Che lavoro fai adesso e che lavoro vuoi fare?"
  - tutor: "Porto le pizze ai tavoli. Vorrei lavorare in un ufficio."
  # merlin-1385_0000033-2
  - learner: "Vorrei sapere quale lavoro ti piace?"
  - tutor: "Mi piace lavorare con i numeri e con il computer."
  # merlin-1385_0000033-7
  - learner: "Quando puoi guardare un nuovo posto di lavoro?"
  - tutor: "Anche domani! Mio zio ha un ufficio in centro. Vieni con me?"
  # merlin-1385_0000033-4
  - learner: "Vorrei andare in machina o a piedi?"
    errors: [spelling]
    gold: {text: "machina", fix: "macchina"}
  - tutor: "A piedi, è vicino! Ma «machina»: c'è una sola c?"
    prompt: {text: "machina", tags: [spelling]}
  - learner: "No, due! Allora non prendiamo la macchina, andiamo a piedi."
  - tutor: "Esatto! Ci vediamo domani alle nove sotto casa."

- scenario: tempo-libero

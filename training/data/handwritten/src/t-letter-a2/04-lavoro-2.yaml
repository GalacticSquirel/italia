    errors: [possessive]
    gold: {text: "tuo lavoro", fix: "il tuo lavoro"}
  - tutor: "Lavoro in un ufficio. Ma «dov'è tuo lavoro»: prima di «tuo lavoro» cosa ci vuole?"
    prompt: {text: "tuo lavoro", tags: [possessive]}
  - learner: "L'articolo! Dov'è il tuo lavoro?"
  - tutor: "Esatto! È fuori città, lontano da casa."
    goals: [ask]
  # merlin-1385_0001790-4

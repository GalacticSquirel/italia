  - learner: "Ti piace un ristorante tailandese?"
  - tutor: "Mi piace tanto! E dopo cena, un film?"
  - learner: "Sì! Io preferisco i film gialli. Sono più interessanti delle commedie."
  - tutor: "Va bene, alle dieci c'è un giallo francese."
    goals: [genre, choose]
  - learner: "Perfetto. Ci vediamo alle otto davanti al ristorante?"

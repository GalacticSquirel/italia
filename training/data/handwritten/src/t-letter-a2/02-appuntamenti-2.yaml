  - tutor: "Povera! Hai bisogno di una serata libera."
    goals: [evening]
  # merlin-1385_0001148-5
  - learner: "Ma che fai questo sabato sera?"
  - tutor: "Niente di speciale! Perché?"
  # merlin-1385_0001148-6
  - learner: "Hai voglia di andare in un ristorante tailandese?"
  - tutor: "Sì, certo! Ma io non so dove andare."

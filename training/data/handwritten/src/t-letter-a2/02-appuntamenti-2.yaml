# Set t-letter-a2, file 2: A1-A2, a busy week and a new date (one real MERLIN text per dialogue, pool 7).

- scenario: tempo-libero
  level: A2
  persona: en-f-student
  history: [pronoun-position]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana? Giovedì ci vediamo, no?"
  # merlin-1385_0001771-0
  - learner: "Cara Sara, è una settimana orribile."
  - tutor: "Ahi! Cosa succede?"
  # merlin-1385_0001771-1
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso m'incontrare con te."
    errors: [pronoun-position]
    gold: {text: "posso m'incontrare", fix: "mi posso incontrare"}
  - tutor: "Che peccato! «Posso m'incontrare»? Prova a mettere «mi» in un altro posto."
    prompt: {text: "posso m'incontrare", tags: [pronoun-position]}
  - learner: "Giovedì non mi posso incontrare con te."
  - tutor: "Brava, così va bene! Allora troviamo un'altra sera."
  # merlin-1385_0001771-4
  - learner: "Vuoi andare a cena da me?"
  - tutor: "Certo che voglio! Cosa prepari?"
    goals: [propose]
  - learner: "Una pasta con le verdure. Mi piace molto cucinare, cucino ogni domenica."
  - tutor: "Ogni domenica? Che bello! Io invece non so cucinare."
    goals: [hobby, frequency]
  # merlin-1385_0001771-6
  - learner: "Tanti saluti!"
  - tutor: "Ciao, a presto!"

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [reflexive]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  # merlin-1385_0001767-0
  - learner: "Ciao Laura, come stai?"
  - tutor: "Bene, grazie! E tu? Giovedì ci vediamo, vero?"
  # merlin-1385_0001767-1
  - learner: "È una settimana orribile."
  - tutor: "Oh no! Cosa è successo?"
  # merlin-1385_0001767-2
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrare con te."
    errors: [reflexive]
    gold: {text: "incontrare con te", fix: "incontrarmi con te"}
  - tutor: "Mi dispiace! Ma «incontrare con te»: con «con te», il verbo vuole un pronome. Quale?"
    prompt: {text: "incontrare con te", tags: [reflexive]}
  - learner: "Giovedì non posso incontrarmi con te."
  - tutor: "Bravo! Allora quando sei libero?"
  # merlin-1385_0001767-5
  - learner: "Forse sabato sera?"
  - tutor: "Sabato sera va benissimo! Cena e poi cinema?"
    goals: [propose]
  - learner: "Sì! Mi piacciono i film d'azione, sono meno noiosi dei film d'amore."
  - tutor: "Va bene! Alle dieci c'è un film d'azione americano."
    goals: [genre]
  - learner: "Perfetto, il film delle dieci."
  - tutor: "Benissimo! E per la cena, dove ci vediamo?"
    goals: [choose]
  # merlin-1385_0001767-7
  - learner: "Possiamo incontrare alle otto in fronte del ristorante."
    errors: [reflexive, word-choice]
    gold: {text: "Possiamo incontrare", fix: "Possiamo incontrarci"}
  - tutor: "Alle otto, sì! Ma «possiamo incontrare»: incontrare chi? Come prima, serve un pronome."
    prompt: {text: "Possiamo incontrare", tags: [reflexive]}
  - learner: "Sì, possiamo incontrare alle otto davanti al ristorante."
    errors: [reflexive]
  - tutor: "Sì, possiamo incontrarci alle otto davanti al ristorante. Prenoto io il tavolo!"
    recast: {text: "Possiamo incontrare", fix: "Possiamo incontrarci", tags: [reflexive]}
    goals: [meet]
  - learner: "Grazie, sei gentile! A sabato!"
  - tutor: "Ciao, buona settimana!"

- scenario: giorno-tipico
  level: A2
  persona: en-m-retired
  history: [subject-verb-agreement]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Di solito mi alzo alle sette e alle otto e mezza comincio a lavorare."
  - tutor: "Presto! E questa settimana? Mi sembri stanco."
    goals: [wake, work]
  - learner: "Sì, in ufficio c'è tanto lavoro. Torno a casa alle nove di sera."
  - tutor: "Alle nove! Ma giovedì vieni con me a mangiare una pizza, vero?"
    goals: [evening]
  # merlin-1385_0001122-2
  - learner: "Il mio capo ha organizzato una riunione giovedì pomeriggio."
  - tutor: "Ah, che peccato! Allora giovedì niente pizza."
  # merlin-1385_0001122-4
  - learner: "Andiamo a cena in un ristorante tailandese?"
  - tutor: "Sì, buona idea! Quando sei libero?"
  - learner: "Sabato sera. Il ristorante apre alle sette e chiudono a mezzanotte."
    errors: [subject-verb-agreement]
    gold: {text: "Il ristorante apre alle sette e chiudono", fix: "Il ristorante apre alle sette e chiude"}
  - tutor: "Sabato va bene! Ma «il ristorante... chiudono»: il ristorante è uno o sono tanti?"
    prompt: {text: "Il ristorante apre alle sette e chiudono", tags: [subject-verb-agreement]}
  - learner: "Uno! Il ristorante apre alle sette e chiude a mezzanotte."
  - tutor: "Perfetto! Allora andiamo alle otto."
  # merlin-1385_0001122-5
  - learner: "Tanti saluti!"
  - tutor: "A dopo, allora! Torno a casa presto."


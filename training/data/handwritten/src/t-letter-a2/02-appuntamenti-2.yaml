    errors: [piacere]
  - tutor: "Lo so, non ti piace rifiutare, sei gentile! Non fa niente, facciamo un altro giorno."
    recast: {text: "piace di rifiutare", fix: "piace rifiutare", tags: [piacere]}
  # merlin-1385_0001135-4
  - learner: "Hai tempi il prossimo sabato sera?"
    errors: [noun-number]
    gold: {text: "tempi", fix: "tempo"}
  - tutor: "Forse sì! Ma «hai tempi»: singolare o plurale, qui?"
    prompt: {text: "tempi", tags: [noun-number]}
  - learner: "Singolare! Hai tempo il prossimo sabato sera?"
  - tutor: "Esatto! Sì, sabato sera sono libera."
  # merlin-1385_0001135-5
  - learner: "Voglio andare a cena in un ristorante tailandese."
  - tutor: "Va bene! E dopo cena andiamo al cinema?"
    goals: [propose]
  - learner: "Sì, mi piacciono i film comici. Sono più divertenti dei gialli."
  - tutor: "Allora alle dieci c'è una commedia italiana."
    goals: [genre, choose]
  - learner: "Benissimo. Ci vediamo alle otto davanti al ristorante?"
  - tutor: "Sì, alle otto davanti al ristorante!"
    goals: [meet]
  # merlin-1385_0001135-7
  - learner: "Arrividerci e fino alla prossima volta!"
    errors: [spelling]
    gold: {text: "Arrividerci", fix: "Arrivederci"}
  - tutor: "Ciao! Ma «arrividerci»: la seconda «i» è giusta?"
    prompt: {text: "Arrividerci", tags: [spelling]}
  - learner: "Arrivederci e alla prossima volta!"
  - tutor: "Perfetto! A sabato, allora."

- scenario: giorno-tipico
  level: A2
  persona: en-f-professional
  history: [word-order]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  # merlin-1385_0001148-0
  - learner: "Ciao Anna, come stai?"
  - tutor: "Bene! E tu? Hai una faccia stanca."
  # merlin-1385_0001148-1
  - learner: "La mia settimana è orribile."
  - tutor: "Perché? Troppo lavoro?"
  # merlin-1385_0001148-4
  - learner: "Il capo ha organizzato una riunione molto importante."
  - tutor: "Ah, per questo! Fino a che ora lavori?"
    goals: [work]
  - learner: "Lavoro dalle otto alle sette. E mi sveglio alle sei!"
  - tutor: "Che giornata lunga! E la sera cosa fai?"
    goals: [wake]

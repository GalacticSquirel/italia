    goals: [meet]
  # merlin-1385_0000130-5
  - learner: "Molti cari saluti!"
  - tutor: "Grazie! Ciao, a sabato!"

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [object-pronoun, adjective-agreement]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1385_0000101-0
  - learner: "Cara Sara, come stai?"
  - tutor: "Bene, grazie! E tu? Pronta per giovedì?"
  # merlin-1385_0000101-1
  - learner: "È una settimana orribile."
  - tutor: "Oh no! Perché?"
  # merlin-1385_0000101-2
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrare con tu."
    errors: [object-pronoun, reflexive]
    gold: {text: "con tu", fix: "con te"}
  - tutor: "Mi dispiace! Ma «con tu»: dopo «con», «tu» cambia forma. Come diventa?"
    prompt: {text: "con tu", tags: [object-pronoun]}
  - learner: "Giovedì non posso incontrarmi con te."
  - tutor: "Brava! Ma come mai tanto lavoro?"
  # merlin-1385_0000101-3
  - learner: "Io ho organizzato una riunione."
  - tutor: "Tu? Allora adesso sei tu il capo?"
  - learner: "Sì, da gennaio sono io la responsabile dell'ufficio."
  - tutor: "Che bella notizia! Allora quando ci vediamo?"
  # merlin-1385_0000101-4
  - learner: "Andiamo a cena sabato sera?"
  - tutor: "Sì, sabato sera va bene! Dove?"
    goals: [propose]
  # merlin-1385_0000101-5
  - learner: "Io conosco bella ristorante taliandese in città."
    errors: [adjective-agreement, article-use, spelling]
    gold: {text: "bella ristorante", fix: "un bel ristorante"}
  - tutor: "Ah sì? Ma «bella ristorante»: «ristorante» è maschile, e allora?"
    prompt: {text: "bella ristorante", tags: [adjective-agreement]}
  - learner: "Io conosco un bel ristorante tailandese in città."
  - tutor: "Esatto! Ci vai spesso?"
  - learner: "Sì, ci vado ogni venerdì con i colleghi. E tu, cosa fai il sabato?"
  - tutor: "Io il sabato faccio sport e la sera vedo gli amici."
    goals: [hobby, frequency, ask]
  # merlin-1385_0000101-6
  - learner: "Ti braccio molto!"
    errors: [spelling]
    gold: {text: "braccio", fix: "abbraccio"}
  - tutor: "Anch'io! Ma «ti braccio»: il braccio è una parte del corpo! Qual è il verbo?"
    prompt: {text: "braccio", tags: [spelling]}
  - learner: "Ti abbraccio molto!"
  - tutor: "Esatto! Un abbraccio anche a te, a sabato!"

- scenario: serata-cinema
  level: A2
  persona: en-m-heritage
  history: [spelling]
  turns:
  - tutor: "Buonasera! Stasera sono libera. Facciamo qualcosa?"
  # merlin-1385_0001135-0

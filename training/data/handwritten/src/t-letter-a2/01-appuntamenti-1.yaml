  - learner: "È una settimana orribile."
  - tutor: "Oh no, perché? Cosa succede?"
  # merlin-1385_0001123-2
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarti."
  - tutor: "Mi dispiace! Allora quando sei libero?"
  # merlin-1385_0001123-3
  - learner: "Proporrò un altro giorno per il nostro appuntamento."
  - tutor: "Va bene, scegli tu. Io sono quasi sempre libera."
  # merlin-1385_0001123-4
  - learner: "Forse sabato sera?"
  - tutor: "Sabato sera devo chiedere a mia madre. Ti dico domani, va bene?"
  # merlin-1385_0001123-5
  - learner: "Fammi sapere subito."
  - tutor: "Sì, sì, ti scrivo subito! E cosa facciamo sabato?"
  # merlin-1385_0001123-6
  - learner: "Che ne dici di andare a cena in un ristorante tailandese?"
  - tutor: "Ottima idea! E dopo cena andiamo al cinema?"
    goals: [propose]
  - learner: "Sì! Mi piacciono più le commedie che i film d'azione."
  - tutor: "Anche a me! Alle dieci c'è una commedia francese."
    goals: [genre]
  - learner: "Va bene, la commedia delle dieci. Ci vediamo davanti il ristorante alle otto?"
    errors: [preposition]
    gold: {text: "davanti il ristorante", fix: "davanti al ristorante"}
  - tutor: "Alle otto va bene. Ma «davanti il ristorante»: dopo «davanti» che preposizione usiamo?"
    goals: [choose]
    prompt: {text: "davanti il ristorante", tags: [preposition]}
  - learner: "Davanti al ristorante, alle otto."
  - tutor: "Perfetto, così! Allora a sabato, davanti al ristorante."
    goals: [meet]
  # merlin-1385_0001123-7
  - learner: "Saluti! A presto!"
  - tutor: "A presto, e buon lavoro per giovedì!"


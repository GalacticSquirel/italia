# Set t-letter-a2, file 1: A2, rescheduling a date with a friend (one real MERLIN text per dialogue, pool 7).

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [article-use]
  turns:
  - tutor: "Ciao! Come stai? Cosa fai di bello nel fine settimana?"
  # merlin-1385_0001121-1
  - learner: "Io sto bene."
  - tutor: "Meno male! Io sono un po' stanca. E giovedì andiamo ancora al ristorante?"
  # merlin-1385_0001121-2
  - learner: "Nel mio ufficio c'è molto lavoro e giovedì pomeriggio non posso andare al ristorante insieme con te."
  - tutor: "Che peccato! Lavori sempre troppo. Allora facciamo un altro giorno."
  # merlin-1385_0001121-3
  - learner: "Forse andiamo a cena sabato sera?"
  - tutor: "Sabato sera sono libera! Ma il sabato tu non lavori?"
    goals: [propose]
  # merlin-1385_0001121-4
  - learner: "Sabato il mio ufficio non lavora e ho il tempo libero."
    errors: [article-use]
    gold: {text: "ho il tempo libero", fix: "ho del tempo libero"}
  - tutor: "Meno male! Ma «ho il tempo libero»: qui l'articolo «il» va bene?"
    prompt: {text: "ho il tempo libero", tags: [article-use]}
  - learner: "Ah, no: sabato ho del tempo libero."
  - tutor: "Brava! Allora, dove andiamo a cena?"
  # merlin-1385_0001121-5
  - learner: "Hai voglia di andare a cena al ristorante tailandese?"
  - tutor: "Sì, certo! Io non ho mai mangiato tailandese."
  # merlin-1385_0001121-6
  - learner: "Mi piace la cucina tailandese."
  - tutor: "Allora scegli tu cosa mangiare!"
    goals: [hobby]
  # merlin-1385_0001121-7
  - learner: "Scrivimi presto, che cosa faremo."
  - tutor: "Va bene, ti scrivo domani per l'ora. A sabato!"

- scenario: serata-cinema
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:

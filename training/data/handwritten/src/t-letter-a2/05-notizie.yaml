    errors: [preposition]
    gold: {text: "Tra due anni", fix: "Da due anni"}
  - tutor: "Tra due anni? Quindi adesso non lavori lì?"
    prompt: {text: "Tra due anni", tags: [preposition]}
  - learner: "No, no, ci lavoro già: da due anni lavoro con le Ferrovie."
  - tutor: "Ah, ecco! Da due anni, allora."
  # merlin-1395_0000628-4

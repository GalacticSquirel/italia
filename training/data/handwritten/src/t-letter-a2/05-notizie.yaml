    errors: [piacere]
    gold: {text: "mi piccio", fix: "mi piace"}
  - tutor: "Che bello! Ma «mi piccio»: pensa a «mi piacciono i film». E con «il lavoro»?"
    prompt: {text: "mi piccio", tags: [piacere]}
  - learner: "Il lavoro mi piaccio tanto."
    errors: [piacere]
  - tutor: "Il lavoro ti piace tanto, si sente! Sei fortunato."
    recast: {text: "piaccio", fix: "piace", tags: [piacere]}
  # merlin-1395_0000628-6
  - learner: "Quando hai tempo per venire una volta a Zurigo?"
  - tutor: "Mmm, forse in primavera!"
  # merlin-1395_0000628-7
  - learner: "Ma non solo per due, tre giorni."
  - tutor: "No? E per quanto, allora?"
  # merlin-1395_0000628-8
  - learner: "Penso per una settimana o così."
  - tutor: "Una settimana va benissimo! Quando sei libero?"
  # merlin-1395_0000628-9
  - learner: "In April ho le ferie dalle 16 alle 27."
    errors: [word-choice, articulated-preposition]
    gold: {text: "dalle 16 alle 27", fix: "dal 16 al 27"}
  - tutor: "Perfetto! Ma «dalle 16»: sono ore o giorni? Con i giorni, quale articolo usiamo?"
    prompt: {text: "dalle 16 alle 27", tags: [articulated-preposition]}
  - learner: "In aprile ho le ferie dal 16 al 27."
  - tutor: "Esatto! Allora vengo il 16 aprile. Non vedo l'ora!"
  # merlin-1395_0000628-11
  - learner: "Cari saluti!"
  - tutor: "Ciao, a presto!"


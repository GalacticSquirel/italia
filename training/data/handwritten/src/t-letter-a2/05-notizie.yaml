# Set t-letter-a2, file 5: A2, news for a friend after a long time (one real MERLIN text per dialogue, pool 7).

- scenario: famiglia
  level: A2
  persona: en-f-professional
  history: [possessive, tense-aspect]
  turns:
  - tutor: "Ciao! Da quanto tempo! Che bella foto: chi sono queste persone?"
  # merlin-1395_0000548-0
  - learner: "Caro Marco, come stai?"
  - tutor: "Bene, grazie! E tu?"
  # merlin-1395_0000548-1
  - learner: "Fa già un poco che non ci abbiamo visto."
    errors: [tense-aspect]
    gold: {text: "non ci abbiamo visto", fix: "non ci vediamo"}
  - tutor: "Eh sì! Ma «non ci abbiamo visto»: è una cosa finita o continua ancora oggi?"
    prompt: {text: "non ci abbiamo visto", tags: [tense-aspect]}
  - learner: "Continua! Fa già un poco che non ci vediamo."
  - tutor: "Esatto! Allora, chi c'è nella foto?"
  # merlin-1395_0000548-5
  - learner: "La mia sorella, ti ricordi di Maria, lei ha trovato un nuovo financiato ed adesso vuole sposarsi in estate dell'anno prossimo."
    errors: [possessive, spelling, articulated-preposition]
    gold: {text: "La mia sorella", fix: "Mia sorella"}
  - tutor: "Che bella notizia! Ma «la mia sorella»: con «sorella», usiamo l'articolo?"
    prompt: {text: "La mia sorella", tags: [possessive]}
  - learner: "No! Mia sorella Maria, qui con il suo fidanzato."
  - tutor: "Brava! Certo che mi ricordo di Maria. Quanti anni ha adesso?"
    goals: [who]
  - learner: "Ha trent'anni, e lui trentadue. È molto simpatico."
  - tutor: "Che bello, sono contento per lei!"
    goals: [ages, describe]
  # merlin-1395_0000548-6
  - learner: "Cosa fai sabbato sera?"
    errors: [spelling]
    gold: {text: "sabbato", fix: "sabato"}
  - tutor: "Niente di speciale! Ma «sabbato»: c'è una lettera in più?"
    prompt: {text: "sabbato", tags: [spelling]}
  - learner: "Sabbato sera sei libero?"
    errors: [spelling]
  - tutor: "Sì, sabato sera sono libero!"
    recast: {text: "Sabbato", fix: "sabato", tags: [spelling]}
  # merlin-1395_0000548-7
  - learner: "Possiamo andare a cenare insieme."
  - tutor: "Che bella idea! Dove andiamo?"
  # merlin-1395_0000548-8
  - learner: "Mi chiami quando lo sai, così poso prenotare un tavolo."
    errors: [spelling]
    gold: {text: "poso", fix: "posso"}
  - tutor: "Va bene, ti chiamo domani! Ma «poso»: una s o due?"
    prompt: {text: "poso", tags: [spelling]}
  - learner: "Due! Così posso prenotare un tavolo."
  - tutor: "Perfetto! Allora a sabato."
  # merlin-1395_0000548-9
  - learner: "Tanti cari saluti!"
  - tutor: "Ciao, a sabato!"

- scenario: vacanze-passate

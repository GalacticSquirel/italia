# u-cine, file 06 (C1): intendersene, volerci, rimetterci, parlarne, rendersene conto, tenerci, metterci, ce ne sono, se ne sono andati, starci, pensarci.
- scenario: club-lettura
  level: C1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, l'ho finito ieri notte. Ci ho messo tre settimane, altro che tre sere!"
    - tutor: "Tre settimane, però l'hai finito: è già una dichiarazione d'amore. Che impressione ti ha fatto?"
      goals: [impression]
    - learner: "All'inizio mi annoiava, poi mi ha presa. Però i personaggi secondari sono troppi: ne ho contato almeno venti."
      errors: [participle-agreement]
    - tutor: "Venti, sì, è un romanzo pieno di gente. Ma «ne ho contato»: quando c'è «ne», con chi si accorda la forma «contato»?"
      prompt: {text: "ne ho contato", tags: [participle-agreement]}
    - learner: "Con i personaggi: ne ho contati almeno venti."
    - tutor: "Esatto. E la protagonista? Io l'ho trovata straordinaria, con tutte le sue contraddizioni."
    - learner: "Io no: è troppo fredda. Di psicologia non me intendo molto, ma una madre che abbandona i figli così non la capisco."
      errors: [ci-ne]
      gold: {text: "non me intendo", fix: "non me ne intendo"}
    - tutor: "Ah, qui ci scontriamo! Ma «non me intendo»: con «intendersi di qualcosa», cosa manca tra «me» e il verbo?"
      prompt: {text: "non me intendo", tags: [ci-ne]}
      goals: [character]
    - learner: "Hai ragione: di psicologia non me ne intendo molto, ma lei non mi convince."
    - tutor: "Giusto, i gusti non si discutono. E lo stile? A me quelle frasi lunghissime hanno incantato."
    - learner: "A me un po' meno. Il finale poi mi ha lasciata confusa: avrei preferito che l'autore lo chiudesse."
    - tutor: "Lo immaginavo! A me i finali aperti piacciono, ti lasciano il libro addosso per giorni. Lo consiglieresti comunque?"
      goals: [style]
    - learner: "Sì, ma solo a chi ha pazienza: per arrivare alla fine vuole tanta costanza."
      errors: [ci-ne]
      gold: {text: "vuole tanta costanza", fix: "ci vuole tanta costanza"}
    - tutor: "Ben detto! Ma «vuole tanta costanza»: chi la vuole? Con questo senso di «volere» serve una particella."
      prompt: {text: "vuole tanta costanza", tags: [ci-ne]}
    - learner: "Sì, voglio dire che vuole tanta costanza per finirlo."
      errors: [ci-ne]
    - tutor: "Verissimo, ci vuole tanta costanza: lo scriviamo nella scheda del club, «solo per lettori tenaci»."
      recast: {text: "vuole tanta costanza", fix: "ci vuole tanta costanza", tags: [ci-ne]}
      goals: [recommend]
      new: [{lemma: tenace, gloss: tenacious}]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Io sono meno pessimista di te. Se ne parla tanto, ma secondo me i lavori cambieranno, non spariranno."
    - tutor: "Dici? E su cosa basi tutta questa fiducia?"
      goals: [position]
    - learner: "Pensa ai traduttori: se le macchine avrebbero davvero sostituito tutti, oggi non ne esisterebbe più nessuno."
      errors: [hypothetical]
    - tutor: "Esempio interessante. Ma «se le macchine avrebbero»: dopo «se», nell'ipotesi, quale modo ci vuole?"
      prompt: {text: "avrebbero davvero sostituito", tags: [hypothetical]}
    - learner: "Il congiuntivo: se le macchine avessero davvero sostituito tutti, oggi non ne esisterebbe più nessuno."
    - tutor: "Perfetto. Però molti traduttori oggi fanno solo revisione, e sono pagati la metà."
      goals: [evidence]
    - learner: "È vero, non lo nego. Ammetto che qualcuno ne rimetterà, soprattutto chi fa lavori ripetitivi."
      errors: [ci-ne]
      gold: {text: "ne rimetterà", fix: "ci rimetterà"}
    - tutor: "Ecco, almeno questo lo concedi! Ma «ne rimetterà»: «rimetterci» vuole proprio quella particella?"
      prompt: {text: "ne rimetterà", tags: [ci-ne]}
    - learner: "Sì: qualcuno ne rimetterà, purtroppo."
      errors: [ci-ne]
    - tutor: "Eh sì, qualcuno ci rimetterà, e non poco: chi ha cinquant'anni e fa lo stesso lavoro da trenta."
      recast: {text: "ne rimetterà", fix: "ci rimetterà", tags: [ci-ne]}
      goals: [concede]
    - learner: "Per questo la formazione è fondamentale. L'IA deve essere un tool, non un sostituto."
      errors: [word-choice]
    - tutor: "Uno strumento, d'accordo, ma chi paga la formazione? Le aziende o lo Stato?"
      recast: {text: "un tool", fix: "Uno strumento", tags: [word-choice]}
    - learner: "Tutti e due. Insomma, io ci credo: se ci prepariamo adesso, ce la possiamo fare."
    - tutor: "Mi hai quasi convinto. Quasi: ne riparliamo tra dieci anni, davanti a un caffè fatto da un robot."
      goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Per caso! Ero in giro con lo zaino, sono arrivato a Bologna per due giorni e... ci sono rimasto sette anni."
    - tutor: "Il classico «due giorni» all'italiana! E il primo shock culturale?"
      goals: [story]
    - learner: "La cena alle nove! In Irlanda alle sei avevamo già mangiato. Nei primi mesi morivo di fame, ma ho dovuto adattare."
      errors: [reflexive]
    - tutor: "Ti credo! Ma «ho dovuto adattare»: adattare chi? Manca qualcosa al verbo."
      prompt: {text: "ho dovuto adattare", tags: [reflexive]}
      goals: [culture-shock]
    - learner: "Ah, ho dovuto adattarmi! Adesso ceno alle dieci anch'io."
    - tutor: "Ormai sei dei nostri. E c'è qualcosa che ancora non sopporti?"
    - learner: "La burocrazia. Ogni volta che ne parlo mi arrabbio, quindi preferisco non parlare."
      errors: [ci-ne]
      gold: {text: "non parlare", fix: "non parlarne"}
    - tutor: "Ti capisco! Ma «preferisco non parlare»: non parlare di cosa? All'infinito manca un pezzo."
      prompt: {text: "non parlare", tags: [ci-ne]}
    - learner: "Preferisco non parlare, davvero, mi rovina la giornata."
      errors: [ci-ne]
    - tutor: "Allora meglio non parlarne, se no ti arrabbi in diretta! Dimmi solo una cosa: il momento peggiore?"
      recast: {text: "non parlare", fix: "non parlarne", tags: [ci-ne]}
    - learner: "Quando mi hanno mandato in tre uffici diversi per un timbro. Alla fine me ne sono andato senza, e sono tornato la settimana dopo."
    - tutor: "Un classico intramontabile. E che consiglio daresti a chi sta pensando di trasferirsi qui?"
      goals: [critique]
    - learner: "Siate open-minded e abbiate pazienza. E imparate l'italiano: gli italiani adorano spiegarvi le cose."
      errors: [word-choice]
    - tutor: "Aperti di mente e pazienti, quindi: mi sembra il riassunto perfetto della tua storia. Grazie di essere stato con noi!"
      recast: {text: "open-minded", fix: "Aperti di mente", tags: [word-choice]}
      goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, Paola. Mi racconti con calma: che cosa è successo esattamente?"
    - tutor: "Marco ha presentato il mio progetto davanti al direttore come se fosse suo. Nemmeno una parola su di me."
      goals: [listen]
    - learner: "Capisco che ci sia rimasta male. Io, onestamente, non mi ero reso conto: ero concentrato sulle domande del direttore."
      errors: [ci-ne]
      gold: {text: "non mi ero reso conto", fix: "non me ne ero reso conto"}
    - tutor: "Be', io sì, e molto. Ma «non mi ero reso conto»: di che cosa? Manca il pronome che riprende il fatto."
      prompt: {text: "non mi ero reso conto", tags: [ci-ne]}
    - learner: "Ha ragione: non me ne ero reso conto. Mi dispiace."
    - tutor: "Grazie. Ma la domanda resta: lei pensa che l'abbia fatto apposta?"
      goals: [clarify]
    - learner: "Ieri sera ho parlato con lui. Mi ha detto che non voleva rubarle niente e che pensava che il progetto fosse di tutta la squadra. Dice anche che ne tiene molto alla vostra collaborazione."
      errors: [ci-ne]
      gold: {text: "ne tiene molto", fix: "ci tiene molto"}
    - tutor: "Di tutta la squadra? Questa è bella. E «ne tiene molto»: con «tenere a qualcosa», quale particella usiamo?"
      prompt: {text: "ne tiene molto", tags: [ci-ne]}
    - learner: "Sì, dice che ne tiene molto, davvero."
      errors: [ci-ne]
    - tutor: "Se ci tiene molto, allora perché non è venuto lui a dirmelo? Mi scusi, ma faccio fatica a crederci."
      recast: {text: "ne tiene molto", fix: "ci tiene molto", tags: [ci-ne]}
      goals: [perspective]
    - learner: "Lo capisco. Per questo propongo un meeting a tre domani mattina, e da ora in poi i nomi degli autori sulla prima slide di ogni presentazione."
      errors: [word-choice]
    - tutor: "Una riunione a tre mi sta bene, purché Marco riconosca davanti a lei che l'idea era mia."
      recast: {text: "un meeting", fix: "Una riunione", tags: [word-choice]}
    - learner: "Glielo chiederò stasera stessa. Le va bene alle nove nel mio ufficio?"
    - tutor: "Va bene. Grazie per avermi ascoltata, sinceramente non me l'aspettavo."
      goals: [solution]

- scenario: modi-di-dire
  level: C1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Che giornata! Stamattina avevo un colloquio a Milano e il treno ha messo un'ora in più del previsto."
      errors: [ci-ne]
      gold: {text: "ha messo un'ora in più", fix: "ci ha messo un'ora in più"}
    - tutor: "Classico! Ma «il treno ha messo un'ora»: quando parliamo di tempo impiegato, il verbo vuole una particella."
      prompt: {text: "ha messo un'ora in più", tags: [ci-ne]}
    - learner: "Sì, il treno ha messo un'ora in più, e io sono arrivato tutto sudato."
      errors: [ci-ne]
    - tutor: "Se il treno ci ha messo un'ora in più, sei arrivato con l'acqua alla gola, immagino! E poi?"
      recast: {text: "ha messo un'ora in più", fix: "ci ha messo un'ora in più", tags: [ci-ne]}
      goals: [tell]
    - learner: "E poi ho scoperto che il colloquio era stato spostato al giorno dopo: nessuno me l'aveva detto!"
    - tutor: "No! Piove sul bagnato. E la colpa di chi è stata?"
      goals: [react]
    - learner: "Della segretaria: aveva mandato la mail a un altro indirizzo. Ma sono io che non ho controllato."
    - tutor: "Dai, non fare il santo: la colpa non è tua, ma un po' te la sei cercata, a non controllare."
      goals: [blame]
    - learner: "Hai ragione. La prossima volta penso due volte prima di partire senza una conferma."
      errors: [ci-ne]
      gold: {text: "penso due volte", fix: "ci penso due volte"}
    - tutor: "Saggio! Ma l'espressione è «pensare due volte» così com'è? Manca un pezzetto davanti."
      prompt: {text: "penso due volte", tags: [ci-ne]}
    - learner: "Ci penso due volte! E parto sempre col treno prima, per sicuro."
      errors: [word-choice]
    - tutor: "Ecco, per sicurezza col treno prima: sbagliando s'impara, come diceva mia nonna."
      recast: {text: "per sicuro", fix: "per sicurezza", tags: [word-choice]}
      goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    - learner: "Sì, ne ho letto su due giornali, e sembrava che raccontassero due storie diverse."
    - tutor: "Tipico. Riassumimi la questione, che io ho letto solo i titoli."
    - learner: "Il comune vuole limitare gli affitti brevi nel casco antico, perché i residenti se ne vanno e i prezzi salgono."
      errors: [word-choice]
    - tutor: "Nel centro storico, quindi, dove ormai è più facile trovare una valigia che un residente. E tu da che parte stai?"
      recast: {text: "casco antico", fix: "centro storico", tags: [word-choice]}
      goals: [summarise]
    - learner: "Con il comune. Nel mio palazzo c'erano otto famiglie; adesso ci sono solo due, il resto sono appartamenti per turisti."
      errors: [ci-ne]
      gold: {text: "ci sono solo due", fix: "ce ne sono solo due"}
    - tutor: "Impressionante. Ma «ci sono solo due»: due di cosa? Manca il pronome che riprende «famiglie»."
      prompt: {text: "ci sono solo due", tags: [ci-ne]}
    - learner: "Sì, ci sono solo due, una è la mia."
      errors: [ci-ne]
    - tutor: "Quindi ce ne sono solo due, e una è la tua: capisco perché sei così convinta. Ma i giornali che fonti citavano?"
      recast: {text: "ci sono solo due", fix: "ce ne sono solo due", tags: [ci-ne]}
      goals: [opinion]
    - learner: "Il primo citava uno studio dell'università. Il secondo era un articolo molto largo, ma senza neanche un dato."
      errors: [false-friend]
    - tutor: "Un articolo lungo e vuoto, insomma: il genere che si legge in metro e si dimentica alla fermata dopo. E le conseguenze, secondo te?"
      recast: {text: "molto largo", fix: "lungo", tags: [false-friend]}
      goals: [sources]
    - learner: "Se non si fa niente, i prezzi continueranno a salire e i giovani dovranno andare via. Molti ne si sono già andati."
      errors: [ci-ne]
      gold: {text: "ne si sono già andati", fix: "se ne sono già andati"}
    - tutor: "Purtroppo è vero. Ma «ne si sono andati»: con «andarsene», l'ordine e la forma dei pronomi ti convincono?"
      prompt: {text: "ne si sono già andati", tags: [ci-ne]}
    - learner: "Mmm... molti ne si sono già andati, no?"
      errors: [ci-ne]
    - tutor: "Molti se ne sono già andati, sì: due miei amici si sono trasferiti in periferia l'anno scorso. Forse hai ragione tu."
      recast: {text: "ne si sono già andati", fix: "se ne sono già andati", tags: [ci-ne]}
      goals: [consequences]

- scenario: presentazione-progetto
  level: C1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "In breve: un'app per gli ordini dei clienti, che oggi passano tutti dal telefono. Ne riceviamo circa trecento telefonate al giorno."
      errors: [ci-ne]
      gold: {text: "Ne riceviamo circa trecento telefonate", fix: "Riceviamo circa trecento telefonate"}
    - tutor: "Trecento al giorno, è tanto. Ma «ne riceviamo trecento telefonate»: se nomina già le telefonate, quel «ne» serve?"
      prompt: {text: "Ne riceviamo circa trecento telefonate", tags: [ci-ne]}
    - learner: "No, è di troppo: riceviamo circa trecento telefonate al giorno."
    - tutor: "Esatto. E il vantaggio concreto?"
      goals: [pitch]
    - learner: "Se il trenta per cento dei clienti usasse l'app, potremmo spostare due persone dal centralino alle vendite."
    - tutor: "Bene. E se invece i clienti non la usano? I nostri clienti hanno sessant'anni di media."
      goals: [benefits]
    - learner: "Ci abbiamo pensato. Abbiamo fatto un survey: il sessanta per cento userebbe l'app con uno sconto del due per cento."
      errors: [word-choice]
    - tutor: "Un sondaggio su quanti clienti? Se sono venti, non mi basta."
      recast: {text: "un survey", fix: "Un sondaggio", tags: [word-choice]}
    - learner: "Su quattrocento, tutti clienti regolari. Abbiamo i dati, se vuole glieli mando."
      errors: [word-choice]
    - tutor: "Quattrocento clienti abituali sono un campione serio: me li mandi, sì. E i tempi? Quanto tempo serve per svilupparla?"
      recast: {text: "clienti regolari", fix: "clienti abituali", tags: [word-choice]}
      goals: [objection]
    - learner: "Con un fornitore esterno, per svilupparla vogliono sei mesi, più uno di prova."
      errors: [ci-ne]
      gold: {text: "vogliono sei mesi", fix: "ci vogliono sei mesi"}
    - tutor: "Sei mesi... ma «vogliono sei mesi»: chi li vuole, il fornitore? Manca una particella."
      prompt: {text: "vogliono sei mesi", tags: [ci-ne]}
    - learner: "No, intendevo che vogliono sei mesi in tutto per finire."
      errors: [ci-ne]
    - tutor: "Se ci vogliono sei mesi, partiamo a gennaio e siamo pronti per l'estate. Mi prepari una stima completa dei costi per venerdì."
      recast: {text: "vogliono sei mesi", fix: "ci vogliono sei mesi", tags: [ci-ne]}
      goals: [next-steps]

- scenario: reclamo-comune
  level: C1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Vorrei fare un reclamo per il cantiere in via Garibaldi: i lavori dovevano finire a marzo e siamo a novembre."
    - tutor: "Capisco. Ha già presentato una segnalazione all'ufficio tecnico?"
      goals: [describe]
    - learner: "Sì, ne ho presentate due, a maggio e a settembre, ma nessuno mi ha mai risposto. Davanti al mio negozio non si passa più."
    - tutor: "Purtroppo i lavori sono stati sospesi per un problema con la ditta. Le chiedo ancora un po' di pazienza."
    - learner: "Pazienza? Ho perso metà dei clienti. No, mi dispiace, a questo gioco non sto più."
      errors: [ci-ne]
      gold: {text: "non sto più", fix: "non ci sto più"}
    - tutor: "Ha tutte le ragioni di essere arrabbiato. Ma «a questo gioco non sto più»: per dire che non si accetta, manca una particella."
      prompt: {text: "non sto più", tags: [ci-ne]}
    - learner: "Non ci sto più, appunto."
    - tutor: "Chiarissimo. Che cosa chiede, concretamente?"
      goals: [insist]
    - learner: "Ho letto che i commercianti hanno diritto a un indennizzo. Voglio che il mio reclamo sia registrato, con un numero di referenza."
      errors: [word-choice]
    - tutor: "Certo: le do subito un numero di protocollo, e con quello può chiedere l'indennizzo. Il modulo è questo."
      recast: {text: "un numero di referenza", fix: "un numero di protocollo", tags: [word-choice]}
      goals: [rights]
    - learner: "Grazie. Spero che stavolta qualcuno ne pensi davvero."
      errors: [ci-ne]
      gold: {text: "qualcuno ne pensi", fix: "qualcuno ci pensi"}
    - tutor: "Lo spero anch'io. Ma «qualcuno ne pensi»: si pensa «a» qualcosa, quindi quale particella?"
      prompt: {text: "qualcuno ne pensi", tags: [ci-ne]}
    - learner: "Sì... spero che qualcuno ne pensi, finalmente."
      errors: [ci-ne]
    - tutor: "Mi assicuro io che qualcuno ci pensi: il suo reclamo va sul tavolo del dirigente entro venerdì, e avrà una risposta scritta entro trenta giorni."
      recast: {text: "qualcuno ne pensi", fix: "qualcuno ci pensi", tags: [ci-ne]}
      goals: [commitment]

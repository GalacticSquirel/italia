# u-cine, file 07 (C1 and C2): ce ne sono pochi, pensarci, ne vivono, occuparsene, crederci, riuscirci, se ne occupa, ce ne fosse, se ne rende conto, ne andava fiero.
- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Esatto. Un aumento del dodici per cento, però, per noi è insostenibile. Ne abbiamo discusso ieri in direzione."
    - tutor: "Capisco, ma non dipende da noi: l'alluminio è aumentato del venti per cento in sei mesi."
      goals: [problem]
    - learner: "Lo so. Ma lavoriamo con voi da otto anni e paghiamo sempre a trenta giorni. Di clienti così ci sono pochi."
      errors: [ci-ne]
      gold: {text: "ci sono pochi", fix: "ce ne sono pochi"}
    - tutor: "Questo è vero. Ma «di clienti così ci sono pochi»: dopo aver anticipato «di clienti», quale pronome lo riprende?"
      prompt: {text: "ci sono pochi", tags: [ci-ne]}
    - learner: "Intendo dire che ci sono pochi clienti come noi."
    - tutor: "Esatto, e glielo riconosco. Ma un aumento ci deve essere, non posso vendere in perdita."
      goals: [argue]
    - learner: "Allora facciamo così: accettiamo il cinque per cento se ci garantite le consegne entro dieci giorni e un discount sui grandi volumi."
      errors: [word-choice]
    - tutor: "Uno sconto sui volumi si può ragionare. Ma con il cinque per cento non copro i costi: potrei arrivare all'otto."
      recast: {text: "un discount", fix: "Uno sconto", tags: [word-choice]}
      goals: [counteroffer]
    - learner: "Con l'otto per cento noi ordinerebbimo meno, non di più. Al sei, invece, potremmo raddoppiare l'ordine di gennaio."
      errors: [conditional-form]
    - tutor: "Raddoppiare? Interessante. Ma «ordinerebbimo»: mi ripete il condizionale di «noi»?"
      prompt: {text: "ordinerebbimo", tags: [conditional-form]}
    - learner: "Ordineremmo, scusi: al sei per cento ordineremmo il doppio."
    - tutor: "Il doppio a gennaio cambia le cose. Sei per cento, consegne in dieci giorni e ordine doppio: le va bene?"
    - learner: "Mi sembra ragionevole, ma devo pensare con il mio direttore. Le rispondo entro domani."
      errors: [ci-ne]
      gold: {text: "devo pensare", fix: "devo pensarci"}
    - tutor: "Certo. Ma «devo pensare con il mio direttore»: a cosa? All'infinito manca una particella."
      prompt: {text: "devo pensare", tags: [ci-ne]}
    - learner: "Devo pensarci con il mio direttore, ma credo che si possa fare."
    - tutor: "Perfetto. Allora le mando la proposta scritta entro stasera, così domani chiudiamo."
      goals: [agreement]

- scenario: turismo-di-massa
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. A favore. Lavoro come cuoco a Venezia da dieci anni e ho visto la città svuotarsi."
    - tutor: "Svuotarsi? Ma è piena di gente da mattina a sera!"
      goals: [introduce]
    - learner: "Di turisti, sì. Ma nel mio quartiere una volta vivevano tremila persone; oggi vivono meno di mille."
      errors: [ci-ne]
      gold: {text: "oggi vivono meno di mille", fix: "oggi ne vivono meno di mille"}
    - tutor: "Dato impressionante. Ma «oggi vivono meno di mille»: mille di cosa? Manca il pronome che riprende «persone»."
      prompt: {text: "oggi vivono meno di mille", tags: [ci-ne]}
    - learner: "Sì, oggi vivono meno di mille, e quasi tutti anziani."
      errors: [ci-ne]
    - tutor: "Se oggi ne vivono meno di mille, e quasi tutti anziani, il problema è serio. Ma cinque euro di ticket non fermano nessuno, no?"
      recast: {text: "oggi vivono meno di mille", fix: "oggi ne vivono meno di mille", tags: [ci-ne]}
      goals: [example]
    - learner: "Non è questione di soldi: il ticket serve a contare i turisti. Se sai quanti ne arrivano, puoi organizzare i servizi. È solo un primo step."
      errors: [word-choice]
    - tutor: "Un primo passo, dice lei. Ma i residenti chiedono case, non statistiche: chi deve risolvere questo?"
      recast: {text: "un primo step", fix: "Un primo passo", tags: [word-choice]}
      goals: [rebut]
    - learner: "Il comune da solo non basta: anche il governo deve occuparsi, con una legge sugli affitti brevi."
      errors: [ci-ne]
      gold: {text: "deve occuparsi", fix: "deve occuparsene"}
    - tutor: "Il governo, addirittura! Ma «deve occuparsi»: di cosa? Al verbo manca un pezzo."
      prompt: {text: "deve occuparsi", tags: [ci-ne]}
    - learner: "Sì, anche il governo deve occuparsi, perché Venezia non è solo dei veneziani."
      errors: [ci-ne]
    - tutor: "Quindi secondo lei anche il governo deve occuparsene, perché Venezia è un patrimonio di tutti. Proposta chiara: grazie per la telefonata!"
      recast: {text: "deve occuparsi", fix: "deve occuparsene", tags: [ci-ne]}
      goals: [proposal]

- scenario: smartworking
  level: C1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Faccio metà e metà. Vado in ufficio il lunedì e il giovedì, il resto lo faccio dal mio studio, che è anche la stanza degli ospiti."
    - tutor: "Una soluzione pratica! E come ti trovi?"
      goals: [situation]
    - learner: "Benissimo. A casa sono più produttivo che i miei colleghi in ufficio, e non perdo due ore in tangenziale."
      errors: [comparative]
    - tutor: "Addirittura! Ma «più produttivo che i miei colleghi»: davanti a un nome, quale parola usiamo dopo «più»?"
      prompt: {text: "più produttivo che i miei colleghi", tags: [comparative]}
      goals: [pros]
    - learner: "Più produttivo dei miei colleghi, almeno credo."
    - tutor: "E il tuo capo che ne pensa?"
    - learner: "Il mio capo non crede: è convinto che a casa guardiamo le serie tv tutto il giorno."
      errors: [ci-ne]
      gold: {text: "non crede", fix: "non ci crede"}
    - tutor: "Tipico! Ma «il mio capo non crede»: a che cosa? Manca la particella che riprende l'idea."
      prompt: {text: "non crede", tags: [ci-ne]}
    - learner: "Sì, il mio capo non crede, e controlla le mail ogni ora."
      errors: [ci-ne]
    - tutor: "Se il tuo capo non ci crede e ti controlla ogni ora, lo svantaggio è chiaro. C'è altro che ti pesa?"
      recast: {text: "non crede", fix: "non ci crede", tags: [ci-ne]}
    - learner: "Il fatto che non stacco mai. Per fortuna la sera vado a fare running al parco, se no impazzisco."
      errors: [word-choice]
    - tutor: "Meno male che vai a correre! E se potessi scegliere, cosa preferiresti?"
      recast: {text: "a fare running", fix: "a correre", tags: [word-choice]}
      goals: [cons]
    - learner: "Tre giorni a casa e due in ufficio. Ma con questo capo, mi accontento di quello che ho."
    - tutor: "Saggio. Magari tra un anno anche lui ci prende gusto, e lavorate tutti da casa."
      goals: [preference]

- scenario: politica-lavoro
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Certi lavori spariranno, è vero, ma ne nasceranno altri che oggi non immaginiamo."
    - tutor: "Sei sicuro? E se non ne nascessero abbastanza?"
      goals: [opinion]
    - learner: "Se il governo investirebbe nella formazione, la gente potrebbe cambiare lavoro senza drammi."
      errors: [hypothetical]
    - tutor: "Bella ipotesi. Ma «se il governo investirebbe»: in un'ipotesi con «se», quale modo usiamo?"
      prompt: {text: "investirebbe", tags: [hypothetical]}
    - learner: "Il congiuntivo: se il governo investisse nella formazione, la gente potrebbe cambiare lavoro."
    - tutor: "Esatto. Ma a cinquant'anni chi si rimette a studiare?"
      goals: [hypothesis]
    - learner: "Mio padre! Faceva il tipografo, e quando sono arrivati i computer pensava di non riuscire. Invece ha imparato in sei mesi."
      errors: [ci-ne]
      gold: {text: "pensava di non riuscire", fix: "pensava di non riuscirci"}
    - tutor: "Grande! Ma «pensava di non riuscire»: a fare cosa? All'infinito manca una particella."
      prompt: {text: "pensava di non riuscire", tags: [ci-ne]}
    - learner: "Sì, pensava di non riuscire, ma poi è diventato il più bravo dell'azienda."
      errors: [ci-ne]
    - tutor: "Pensava di non riuscirci, e poi è diventato il più bravo: un bel colpo alle mie teorie."
      recast: {text: "pensava di non riuscire", fix: "pensava di non riuscirci", tags: [ci-ne]}
      goals: [example]
    - learner: "Esatto. Insomma, non sono contento con come stanno le cose, ma non sono pessimista come te."
      errors: [preposition]
    - tutor: "Ti concedo il punto. Ma «contento con come stanno le cose»: con «contento», quale preposizione ci vuole?"
      prompt: {text: "contento con", tags: [preposition]}
    - learner: "Contento di come stanno le cose. Non lo sono, ma resto ottimista."
    - tutor: "Va bene, ottimista: ci aggiorniamo tra dieci anni e vediamo chi aveva ragione."
      goals: [conclude]

- scenario: assemblea-condominio
  level: C2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Sui preventivi per la facciata: ce ne sono arrivati tre, e il più economico è anche il meno affidabile."
    - tutor: "La signora Ferri del terzo piano sostiene che lei voglia solo spendere di più, visto che il suo appartamento è all'ultimo piano."
      goals: [position]
    - learner: "Capisco la preoccupazione, ma la ditta più economica non prevede neanche il ponteggio. E del ponteggio, scusate, chi ne si occupa?"
      errors: [ci-ne]
      gold: {text: "chi ne si occupa", fix: "chi se ne occupa"}
    - tutor: "Domanda legittima. Ma «chi ne si occupa»: quando «si» e «ne» si incontrano, che forma prende il riflessivo e in che ordine vanno?"
      prompt: {text: "chi ne si occupa", tags: [ci-ne]}
    - learner: "Sì, appunto: del ponteggio chi ne si occupa?"
      errors: [ci-ne]
    - tutor: "Chi se ne occupa, giusto: nel preventivo più basso non è indicato, e potrebbe costare altri ottomila euro. Questo la signora Ferri non lo sapeva."
      recast: {text: "chi ne si occupa", fix: "chi se ne occupa", tags: [ci-ne]}
      goals: [defuse]
    - learner: "Senta, amministratore, la facciamo finita con questa pagliacciata e votiamo? Sono le undici."
      errors: [register]
    - tutor: "Capisco la stanchezza, ma «la facciamo finita con questa pagliacciata», in assemblea, rischia di accendere gli animi. Come lo formulerebbe in modo più istituzionale?"
      prompt: {text: "la facciamo finita con questa pagliacciata", tags: [register]}
    - learner: "Ha ragione. Propongo di chiudere la discussione e di passare al voto."
    - tutor: "Molto meglio. Prima del voto, però, c'è chi chiede un'alternativa al pagamento in un'unica soluzione."
    - learner: "Si potrebbe dividere la spesa in quattro rate semestrali: così chi ha una pensione non sarebbe costretto a pagare tutto subito."
    - tutor: "Quattro rate mi sembrano un buon compromesso. Se nessuno si oppone, lo metto a verbale e votiamo il preventivo intermedio."
      goals: [alternative, compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-f-teacher
  history: [ci-ne]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Spero che ne abbia parlato bene! Complimenti per la casa, e per il profumo che arriva dalla cucina."
    - tutor: "Il profumo è merito di mia moglie; io mi limito a stappare il vino. Lei è di Valencia, se non sbaglio?"
      goals: [compliment]
    - learner: "Sì, ci sono nata e ci ho vissuto fino a venticinque anni. A proposito di vino, ne ho portato due bottiglie dalla mia regione."
      errors: [ci-ne]
      gold: {text: "ne ho portato due bottiglie", fix: "ne ho portate due"}
    - tutor: "Che pensiero gentile. Ma «ne ho portato due bottiglie»: se c'è già «ne», serve ancora nominare le bottiglie? E il participio?"
      prompt: {text: "ne ho portato due bottiglie", tags: [ci-ne]}
    - learner: "Ah, certo: ne ho portate due, dalla mia regione."
    - tutor: "Perfetto. E da Valencia a Bologna, come mai? La paella non le bastava più?"
      goals: [background]
    - learner: "Ah, la paella è sacra! Mi sono trasferita per insegnare. E questa lasagna è squisita: complimenti alla sua sposa."
      errors: [word-choice]
    - tutor: "Lo riferirò a mia moglie, ne sarà lusingata. Anche se, a dirla tutta, la besciamella l'ho fatta io."
      recast: {text: "sposa", fix: "moglie", tags: [word-choice]}
    - learner: "Allora i complimenti vanno a lei! Se ci ne fosse ancora un po', ne prenderei volentieri un'altra fetta."
      errors: [ci-ne]
      gold: {text: "ci ne fosse", fix: "ce ne fosse"}
    - tutor: "Ruffiana, ma efficace. Però «ci ne fosse»: davanti a «ne», quel «ci» non cambia forma?"
      prompt: {text: "ci ne fosse", tags: [ci-ne]}
      goals: [irony]
    - learner: "Se ci ne fosse ancora un po'... no?"
      errors: [ci-ne]
    - tutor: "Se ce ne fosse? Ce n'è, ce n'è: in questa casa la lasagna non finisce mai. E, mi permetta, che ne direbbe di darci del tu?"
      recast: {text: "ci ne fosse", fix: "ce ne fosse", tags: [ci-ne]}
    - learner: "Con grande piacere, anche se mi ci vorrà qualche giorno per abituarmi."
    - tutor: "Ci abitueremo insieme. Benvenuta in famiglia, allora!"
      goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io, all'inizio. Un ragazzino che fa una decisione a dodici anni e la mantiene per tutta la vita mi sembrava solo testardo."
      errors: [word-choice]
    - tutor: "Uno che prende una decisione a dodici anni e non torna più indietro: testardo, certo, ma anche coerente fino all'eroismo, no?"
      recast: {text: "fa una decisione", fix: "prende una decisione", tags: [word-choice]}
      goals: [impression]
    - learner: "Poi ho capito che la sua è una ribellione, ma anche un modo di guardare il mondo da una certa distanza, per capirlo meglio."
    - tutor: "Esatto, la distanza come condizione della conoscenza. E Viola, che cosa ne pensi?"
      goals: [theme]
    - learner: "Cosimo la ama per tutta la vita, ma non se ne rende mai conto di quanto lei sia libera, più libera di lui."
      errors: [ci-ne]
      gold: {text: "non se ne rende mai conto di quanto", fix: "non si rende mai conto di quanto"}
    - tutor: "Interessante. Ma «non se ne rende conto di quanto lei sia libera»: se il complemento c'è già, che ci fa quel «ne»?"
      prompt: {text: "non se ne rende mai conto di quanto", tags: [ci-ne]}
    - learner: "Sì, non se ne rende mai conto di quanto lei sia libera."
      errors: [ci-ne]
    - tutor: "Quindi lui non si rende mai conto di quanto lei sia libera: bella lettura, anche se io la trovo soprattutto capricciosa. E lo stile?"
      recast: {text: "non se ne rende mai conto di quanto", fix: "non si rende mai conto di quanto", tags: [ci-ne]}
      goals: [disagree]
    - learner: "Leggero nel senso di Calvino: preciso, ironico, mai pesante. Se fossi stata sua madre, però, l'avrei tirato giù a forza."
    - tutor: "Ah ah, mi sa che la baronessa ci aveva provato! A chi lo consiglieresti?"
      goals: [style]
    - learner: "A chiunque ha voglia di sentirsi un po' fuori posto, e magari di salire su un albero."
      errors: [subjunctive-use]
    - tutor: "Bellissimo. Ma «chiunque ha voglia»: dopo «chiunque», quale modo ti aspetteresti?"
      prompt: {text: "chiunque ha voglia", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: a chiunque abbia voglia di sentirsi un po' fuori posto."
    - tutor: "Perfetto. Lo segniamo come motto del circolo: «per chiunque abbia voglia di un albero»."
      goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ma si figuri. Condoglianze, davvero: dev'essere stata una bella mazzata."
      errors: [register]
    - tutor: "Grazie. È stato un colpo, sì... anche se «una bella mazzata», detto qui, suona un po' brusco. Come lo direbbe con più garbo?"
      prompt: {text: "una bella mazzata", tags: [register]}
    - learner: "Ha ragione, mi scusi: dev'essere stato un dolore immenso. Le porgo le mie più sentite condoglianze."
    - tutor: "La ringrazio, di cuore. Lei conosceva mio padre, vero?"
      goals: [condolences]
    - learner: "Sì, alla cena aziendale ci raccontava della tipografia che aveva aperto da giovane. Ci andava molto fiero."
      errors: [ci-ne]
      gold: {text: "Ci andava molto fiero", fix: "Ne andava molto fiero"}
    - tutor: "Sì, era la sua vita. Ma «ci andava fiero»: si va fieri «di» qualcosa. Quale particella riprende «di»?"
      prompt: {text: "Ci andava molto fiero", tags: [ci-ne]}
    - learner: "Sì, ci andava molto fiero, si vedeva dagli occhi."
      errors: [ci-ne]
    - tutor: "Ne andava molto fiero, è vero: quando ne parlava gli si illuminava lo sguardo. Mi fa bene sentirlo ricordare così."
      recast: {text: "Ci andava molto fiero", fix: "Ne andava molto fiero", tags: [ci-ne]}
      goals: [memory]
    - learner: "Se le serve qualcosa, per le pratiche in ufficio ci penso io: si prenda tutto il tempo che le serve. E vorrei attendere il funerale, se la famiglia è d'accordo."
      errors: [false-friend]
    - tutor: "È molto gentile. Se vuole partecipare al funerale, è domani alle undici, in San Lorenzo: a mia madre farà piacere."
      recast: {text: "attendere il funerale", fix: "partecipare al funerale", tags: [false-friend]}
      goals: [offer-help]
    - learner: "Ci sarò. Ora non la trattengo oltre: le sono vicino."
    - tutor: "Grazie ancora. Arrivederci, e grazie per le sue parole."
      goals: [leave]

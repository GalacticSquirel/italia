  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto il primo maggio, ma solo per un fine settimana lungo. Vado con due colleghe dell'ufficio di Milano, e nessuna di noi conosce la città."
    - tutor: "Un fine settimana basta per innamorarsi di Napoli. Cosa vi interessa di più?"
      goals: [plans]
    - learner: "Ci interessa soprattutto il cibo, ma una mia collega vuole vedere anche qualche museo. Tu, al nostro posto, cosa vederesti per primo?"
      errors: [conditional-form]
    - tutor: "Io comincerei da Spaccanapoli e poi andrei al Museo Archeologico. Ma «vederesti»? Il condizionale di «vedere» è più corto, proprio come il suo futuro."
      prompt: {text: "vederesti", tags: [conditional-form]}
      goals: [advice]
    - learner: "Cosa vedresti per primo, giusto. E per arrivare dall'aeroporto al centro, c'è un autobus o è meglio prendere il taxi?"
    - tutor: "Esatto. C'è un autobus diretto ed economico, ma in tre il taxi non costa molto di più. Dove avete l'albergo?"
      goals: [transport]
    - learner: "Allora prendiamo il taxi e dividiamo il prezzo. Il nostro albergo è vicino a la stazione centrale: è una zona tranquilla la sera?"
      errors: [articulated-preposition]
    - tutor: "La sera non è la zona più tranquilla, quindi per tornare prendete un taxi. Ma «vicino a la stazione»? Qui «a» e «la» diventano una parola sola."
      prompt: {text: "a la stazione", tags: [articulated-preposition]}
      goals: [warnings]
    - learner: "Vicino alla stazione, sì. Va bene, niente passeggiate la sera. E c'è una trattoria nel centro storico che un collega mi ha parlato tanto: secondo te è buona?"
      errors: [relative-pronoun]
    - tutor: "Esatto, alla stazione. Ma «una trattoria che un collega mi ha parlato»? Si dice «parlare di qualcosa», e quel «di» deve restare anche qui."
      prompt: {text: "che un collega mi ha parlato", tags: [relative-pronoun]}
    - learner: "Una trattoria di cui un collega mi ha parlato, ecco. Non ricordo il nome, ma so che è vicino al Duomo. E per la pizza bisogna prenotare?"
    - tutor: "Sì, così va bene. Per la pizza di solito non si prenota: si fa la fila, ma va veloce. Andate verso le sette e mezza, prima che arrivi tanta gente."
    - learner: "Ottimo consiglio! Però evitiamo i ristoranti con il menù in sei lingue, vero? Le mie colleghe dicono che sono sempre trappole per turisti."
    - tutor: "Hanno ragione: lì si mangia male e si paga tanto. Mandami una foto della prima pizza!"

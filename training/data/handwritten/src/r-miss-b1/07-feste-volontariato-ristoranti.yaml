# Set r-miss-b1, file 7 (B1): planning surprise parties with a friend, choosing a volunteering
# activity and booking restaurant tables by phone. Plans in the future and pronouns for people.
- scenario: compleanno
  # facts: compleanno di Sara sabato 14; festa a sorpresa a casa di Giorgio alle otto; Sara finisce di lavorare alle sette e mezza; la learner le dice che vanno a cena fuori e di passare da Giorgio; invitati: compagni del corso di inglese e colleghi del bar, quindici, più tre amici di Giorgio, diciotto; pizza; torta al cioccolato fatta dalla learner, portata venerdì sera; regalo: corso di fotografia da ottanta euro, dieci euro a testa in otto
  level: B1
  persona: es-f-erasmus
  history: [object-pronoun, ci-ne, future-form, preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Il compleanno di Sara è sabato quattordici, giusto? Io pensavo a una festa a sorpresa a casa tua, perché da me non c'è spazio per tutti."
    - tutor: "Sì, sabato quattordici. A casa mia va benissimo: a che ora?"
    # «le dico» is correct; only the second pronoun for Sara is wrong
    - learner: "Sara finisce di lavorare alle sette e mezza, quindi alle otto è perfetto. Io la chiamo e le dico che andiamo a cena fuori, poi gli dico di passare da te."
      errors: [object-pronoun]
    - tutor: "Ottimo piano. Ma «poi gli dico»? Prima hai detto bene «le dico»: per Sara vale lo stesso."
      prompt: {text: "gli dico di passare", tags: [object-pronoun]}
    - learner: "Poi le dico di passare da te, sì, a prendere una cosa. Lei non immaginerà mai la festa!"
    - tutor: "Esatto. Allora sabato alle otto da me. Chi invitiamo?"
      goals: [date]
    - learner: "I compagni del corso di inglese e i colleghi del bar dove lavora: ieri sera li ho contati, e sono quindici. Tu chi vuoi invitare? Io dei tuoi amici conosco solo pochi."
      errors: [ci-ne]
    - tutor: "Io aggiungo tre amici dell'università, quindi diciotto. Ma «dei tuoi amici conosco solo pochi»: con «amici» messo prima, serve una parola che lo riprende prima del verbo."
      prompt: {text: "conosco solo pochi", tags: [ci-ne]}
      goals: [guests]
    - learner: "Dei tuoi amici ne conosco solo pochi, sì, perché siamo amici solo da un anno. E da mangiare cosa facciamo?"
    - tutor: "Proprio così. Che ne dici della pizza? E la torta?"
    - learner: "La pizza va bene, è più facile. La torta la faccio io, al cioccolato, e la porterò venerdì sera, così sarà pronta e Sara non la vederà."
      errors: [future-form]
    - tutor: "Che brava! Ma «non la vederà»? Il futuro di «vedere» è più corto: perde una lettera."
      prompt: {text: "non la vederà", tags: [future-form]}
    - learner: "Sì, non la vederà, perché venerdì sera Sara lavora fino a tardi al bar e torna dopo mezzanotte."
      errors: [future-form]
    - tutor: "Bene, così non la vedrà di sicuro. Allora pizza e torta al cioccolato. E il regalo?"
      recast: {text: "non la vederà", fix: "non la vedrà", tags: [future-form]}
      goals: [food]
    - learner: "Ho pensato a un corso di fotografia, perché Sara ha sempre sognato a fare foto professionali. Costa ottanta euro, ma possiamo dividere."
      errors: [preposition]
    - tutor: "Le piacerà tantissimo. Ma «ha sempre sognato a fare»? Dopo «sognare», davanti a un altro verbo, la parola giusta è un'altra."
      prompt: {text: "sognato a fare", tags: [preposition]}
    - learner: "Ha sempre sognato di fare foto professionali, sì. Se siamo in otto a pagare, sono dieci euro a testa."
    - tutor: "Esatto. Dieci euro a testa, perfetto! Allora scrivi tu agli altri per i soldi?"
      goals: [gift]
    - learner: "Sì, scrivo io a tutti stasera, e domani compro il corso. Sara sarà felicissima!"
    - tutor: "Benissimo, allora ci sentiamo domani. Che bella festa sarà!"

- scenario: compleanno
  # facts: picnic al lago domenica 22 a pranzo, verso mezzogiorno; il compleanno è sabato ma Sara lavora; il fratello Luca, che ha la macchina, la porta con la scusa di una passeggiata; invitati: famiglia e una decina di amici, una quindicina con i bambini della sorella; panini e focacce; torta alla frutta della pasticceria sotto casa di Giorgio; il mese scorso a Sara hanno rubato la bicicletta; bici nuova da centocinquanta euro, dieci euro a testa in quindici
  level: B1
  persona: en-m-heritage
  history: [preposition, conditional-form, relative-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Ho un'idea: Sara ama la natura, quindi potremmo fare un picnic al lago domenica ventidue. Il suo compleanno è sabato, ma sabato lavora."
    - tutor: "Un picnic al lago, bellissimo! A che ora? E come la portiamo lì senza farle capire niente?"
    # decoy: «di cui Sara si fida» is a correct relative
    - learner: "A pranzo, verso mezzogiorno. Suo fratello Luca, che ha la macchina, può dirle che vanno a fare una passeggiata: è la persona di cui Sara si fida di più."
    - tutor: "Perfetto, Luca è l'uomo giusto. E chi invitiamo?"
      goals: [date]
      new: [{lemma: mezzogiorno, gloss: noon}]
    - learner: "La famiglia e una decina di amici. Non troppi, perché Sara è timida e preferisce le feste piccole che quelle grandi, con tanta gente."
      errors: [preposition]
    - tutor: "È vero, la conosco. Ma «preferisce le feste piccole che quelle grandi»? Con «preferire», prima della seconda cosa serve un'altra parola."
      prompt: {text: "che quelle grandi", tags: [preposition]}
    - learner: "Preferisce le feste piccole a quelle grandi, sì. Quindi siamo una quindicina, con i bambini di sua sorella."
    - tutor: "Sì, così va bene. Quindici va benissimo. E da mangiare?"
      goals: [guests]
    - learner: "Io farei panini e focacce, perché al lago non c'è una cucina. E la torta la prenderebbi nella pasticceria sotto casa tua, che fa una torta alla frutta buonissima."
      errors: [conditional-form]
    - tutor: "Buona idea. Ma «la prenderebbi»? Hai appena detto «io farei»: con «io», anche «prendere» finisce così."
      prompt: {text: "prenderebbi", tags: [conditional-form]}
    - learner: "Sì, la prenderebbi lì, perché è vicina a casa tua e tu conosci bene i proprietari."
      errors: [conditional-form]
    - tutor: "«La prenderei lì», d'accordo: è perfetta. E il regalo?"
      recast: {text: "prenderebbi", fix: "prenderei", tags: [conditional-form]}
      goals: [food]
    - learner: "Il mese scorso le hanno rubato la bicicletta che andava al lavoro. Potremmo regalarle una bici nuova, se tutti mettono qualcosa."
      errors: [relative-pronoun]
    - tutor: "Che bella idea! Ma «la bicicletta che andava al lavoro»? Così sembra che la bici vada al lavoro da sola: Sara andava al lavoro insieme alla bici."
      prompt: {text: "che andava al lavoro", tags: [relative-pronoun]}
    # decoy: «ne ho vista una» is a correct partitive ne with agreement
    - learner: "La bicicletta con cui andava al lavoro, sì! Ne ho vista una bella in un negozio, a centocinquanta euro."
    - tutor: "Esatto. In quindici sono dieci euro a testa: perfetto! Chiedi tu al negozio di tenerla da parte?"
      goals: [gift]
    - learner: "Sì, ci passo domani mattina e la prenoto. Poi scrivo a tutti per i soldi."
    - tutor: "Grande! Sara sarà felicissima."

- scenario: compleanno
  # facts: Sara compie trent'anni venerdì 6; aperitivo su una terrazza al sesto piano in piazza del Duomo; la learner telefona domani per prenotare; lista di venti amici mandata a Marco, che ha aggiunto due colleghi: ventidue; torta al limone ordinata dalla learner in una pasticceria, il bar la tiene in frigo; regalo: album di foto con un messaggio di ogni amico; Giorgio raccoglie i messaggi; si sentono domani sera
  level: B1
  persona: en-f-professional
  history: [future-form, participle-agreement, object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Sara compie trent'anni venerdì sei, quindi dobbiamo fare qualcosa di speciale. Pensavo a un aperitivo in un bar con una terrazza, in centro, con tanti amici."
    - tutor: "Trent'anni, certo, serve una festa vera! Quale bar avevi in mente?"
    - learner: "Quello in piazza del Duomo, al sesto piano. Domani telefonerò per prenotare la terrazza: ci staremo bene anche in venti, e si vederà tutta la città."
      errors: [future-form]
    - tutor: "Che posto! Ma «si vederà»? Il futuro di «vedere» non tiene la «e» dell'infinito."
      prompt: {text: "si vederà", tags: [future-form]}
      goals: [date]
    - learner: "Si vedrà tutta la città, sì. Ho già fatto una lista di venti amici, e ieri l'ho mandato anche a Marco, per sapere se ho dimenticato qualcuno."
      errors: [participle-agreement]
    - tutor: "Esatto, «si vedrà». Ma «la lista... l'ho mandato»? Quel «l'» sta per «la lista»: la fine del verbo deve andare d'accordo."
      prompt: {text: "l'ho mandato", tags: [participle-agreement]}
    - learner: "L'ho mandata a Marco, sì, e lui ha aggiunto due colleghi di Sara. Quindi siamo ventidue."
    - tutor: "Giusto. In ventidue ci state bene. E da mangiare, cosa pensavi?"
      goals: [guests]
    # decoy: «tenerla» is a correct object pronoun on an infinitive
    - learner: "Un aperitivo con tante cose da mangiare basta, ma la torta è importante. A Sara piacciono i dolci al limone: la ordino in una pasticceria, e domani chiedo al barista se possono tenerla in frigo."
    - tutor: "Ottima idea, la torta al limone. E il regalo?"
      goals: [food]
    - learner: "Pensavo a un album con le foto di questi anni e un messaggio di ogni amico. Ho già scritto a tutti, ma alcuni non mi hanno risposto: domani li telefono."
      errors: [object-pronoun]
    - tutor: "Che regalo bellissimo! Ma «li telefono»? Si telefona «a» qualcuno: quel «li» non va."
      prompt: {text: "li telefono", tags: [object-pronoun]}
      goals: [gift]
    - learner: "Sì, domani li telefono uno per uno, perché il tempo è poco e l'album deve essere pronto venerdì."
      errors: [object-pronoun]
    - tutor: "«Domani gli telefono uno per uno»: bene. Se vuoi, i messaggi li raccolgo io."
      recast: {text: "li telefono", fix: "gli telefono", tags: [object-pronoun]}
    - learner: "Grazie, sei un tesoro! Allora io prenoto il bar e ordino la torta, e tu raccogli i messaggi per l'album. Ci sentiamo domani sera?"
    - tutor: "D'accordo, a domani sera. Sara sarà felicissima!"

- scenario: volontariato
  # facts: ingegnere in pensione; l'anno scorso un mese in ospedale, molti lo hanno aiutato; sa riparare quasi tutto; l'amico Giorgio fa il volontario e gli ha parlato dell'officina di biciclette per i ragazzi; officina aperta il sabato dalle nove a mezzogiorno e il mercoledì pomeriggio; il martedì gioca a carte; sceglie l'officina, comincia sabato alle nove
  level: B1
  persona: en-m-retired
  history: [auxiliary-choice, relative-pronoun, conditional-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto. Sono un ingegnere in pensione, e da quando non lavoro ho troppo tempo libero. Mia moglie dice che devo fare qualcosa di utile."
    - tutor: "Tua moglie ha ragione! E perché proprio il volontariato?"
    - learner: "Perché l'anno scorso ho stato in ospedale per un mese, e tante persone mi hanno aiutato. Adesso voglio restituire un po' di quello che ho ricevuto."
      errors: [auxiliary-choice]
    - tutor: "Mi dispiace per l'ospedale. Ma «ho stato»? «Stato» va con un altro verbo, non con «avere»."
      prompt: {text: "ho stato", tags: [auxiliary-choice]}
    - learner: "Sono stato in ospedale, sì, ma adesso sto benissimo. E ho tanta energia!"
    - tutor: "Esatto, si vede! E cosa sai fare?"
      goals: [motivation]
    - learner: "Ho lavorato con le macchine per tutta la vita, quindi so riparare quasi tutto. Vorrei vedere la vostra officina di biciclette, di che mi ha parlato un amico."
      errors: [relative-pronoun]
    - tutor: "Ottimo! Ma «l'officina, di che mi ha parlato»? Dopo «di», quel «che» non va: serve un'altra parola."
      prompt: {text: "di che", tags: [relative-pronoun]}
    - learner: "Sì, l'officina di che mi ha parlato il mio amico Giorgio, che fa il volontario qui da due anni."
      errors: [relative-pronoun]
    - tutor: "Giorgio, certo! L'officina di cui parla è proprio la nostra, quella delle biciclette per i ragazzi."
      recast: {text: "di che", fix: "di cui", tags: [relative-pronoun]}
      goals: [skills]
    # decoy: «io sarei libero» is a correct conditional
    - learner: "Perfetto. Io sarei libero quasi tutti i giorni, ma il martedì vado a giocare a carte con gli amici. Quando è aperta l'officina?"
    - tutor: "Il sabato mattina, dalle nove a mezzogiorno, e il mercoledì pomeriggio."
      goals: [time]
      new: [{lemma: mezzogiorno, gloss: noon}]
    - learner: "Il sabato mattina va benissimo. Il mercoledì potrebbi venire anch'io, se c'è bisogno, ma prima devo chiedere a mia moglie."
      errors: [conditional-form]
    - tutor: "C'è sempre bisogno! Ma «potrebbi»? Prima hai detto bene «io sarei»: con «io», anche «potere» finisce allo stesso modo."
      prompt: {text: "potrebbi", tags: [conditional-form]}
    - learner: "Potrei venire anche il mercoledì, sì. Allora scelgo l'officina di biciclette: quando comincio?"
    - tutor: "Esatto. Benissimo! Puoi cominciare sabato alle nove: ti presento i ragazzi."
      goals: [choose]

- scenario: volontariato
  # facts: studentessa Erasmus fino a luglio; in Spagna aiutava la madre in una mensa per persone senza casa la domenica; a Siviglia erano venti volontari; la mensa serve cento cene ogni sera, qui quindici volontari; lezione fino alle cinque; il venerdì sera libera; mensa dalle sette alle nove; corso di due ore lunedì alle sei; sceglie la mensa del venerdì
  level: B1
  persona: es-f-erasmus
  history: [ci-ne, preposition, subjunctive-use]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Sono una studentessa Erasmus e resto qui fino a luglio. Voglio conoscere la città in un altro modo, non solo l'università e le feste."
    - tutor: "Bellissimo motivo. Cosa ti piacerebbe fare?"
      goals: [motivation]
    # decoy: «ci andavo» is a correct locative ci
    - learner: "Mi piace molto cucinare, e in Spagna aiutavo mia madre in una mensa per persone senza casa. Ci andavo ogni domenica, e mi piaceva tantissimo."
    - tutor: "Allora la nostra mensa fa per te! Si servono cento cene ogni sera."
      goals: [skills]
      new: [{lemma: mensa, gloss: soup kitchen}]
    - learner: "Cento cene ogni sera? E quanti volontari ci sono? Nella mensa di Siviglia eravamo in venti, ma secondo mia madre servivano almeno trenta."
      errors: [ci-ne]
    - tutor: "Qui siamo in quindici ogni sera, quindi una persona in più fa comodo. Ma «servivano almeno trenta»: trenta di che cosa? Per non ripetere «volontari», serve una parola prima del verbo."
      prompt: {text: "servivano almeno trenta", tags: [ci-ne]}
    - learner: "Sì, servivano almeno trenta, perché le persone erano tantissime, soprattutto d'inverno, quando fa freddo e piove."
      errors: [ci-ne]
    - tutor: "Ne servivano almeno trenta, ci credo: d'inverno arriva sempre più gente. Quanto tempo hai, tu?"
      recast: {text: "servivano almeno trenta", fix: "ne servivano almeno trenta", tags: [ci-ne]}
    - learner: "Ho lezione tutti i giorni fino alle cinque, ma la sera sono libera. Il venerdì, per esempio, ho smesso a uscire con i miei amici, perché il sabato studio."
      errors: [preposition]
    - tutor: "Brava! Ma «ho smesso a uscire»? Dopo «smettere», davanti a un altro verbo, la parola giusta è un'altra."
      prompt: {text: "smesso a uscire", tags: [preposition]}
    - learner: "Ho smesso di uscire il venerdì, sì, quindi il venerdì sera sono libera. A che ora comincia la mensa?"
    - tutor: "Proprio così. Si comincia alle sette e si finisce alle nove. Il venerdì ti va bene?"
      goals: [time]
    - learner: "Sì, il venerdì dalle sette alle nove va benissimo. Ma prima è necessario che faccio un corso? In Spagna ho dovuto farne uno sull'igiene."
      errors: [subjunctive-use]
    - tutor: "Sì, c'è un corso di due ore lunedì alle sei. Ma «è necessario che faccio»? Dopo «è necessario che», il verbo prende un'altra forma."
      prompt: {text: "che faccio", tags: [subjunctive-use]}
    - learner: "È necessario che faccia il corso, va bene. Allora scelgo la mensa del venerdì, e lunedì vengo al corso."
    - tutor: "Esatto. Perfetto, ti segno per il venerdì. Ci vediamo lunedì alle sei!"
      goals: [choose]

- scenario: volontariato
  # facts: studia psicologia; un'amica fa volontariato con loro da un anno; da piccola andava dalla nonna ogni sabato, un sabato la nonna non ha aperto, era caduta; le leggeva il giornale, giocavano a carte; lezione la mattina, libera il pomeriggio; visite agli anziani il martedì e il giovedì dalle quattro alle sei; sceglie le visite, comincia martedì alle quattro
  level: B1
  persona: en-f-student
  history: [tense-aspect, object-pronoun, comparative]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto! Studio psicologia e vorrei fare un'esperienza con le persone, non solo sui libri. Una mia amica fa volontariato con voi da un anno."
    - tutor: "Che bello! E perché proprio il volontariato?"
    - learner: "Quando ero piccola, mia nonna abitava da sola, e io andavo da lei ogni sabato. Un sabato, però, lei non apriva la porta, e abbiamo scoperto che era caduta."
      errors: [tense-aspect]
    - tutor: "Che spavento. Ma «un sabato lei non apriva»? Quel sabato è un fatto preciso, diverso dagli altri: che tempo serve?"
      prompt: {text: "non apriva la porta", tags: [tense-aspect]}
    - learner: "Un sabato non ha aperto la porta, sì. Per fortuna stava bene, ma da quel giorno penso sempre agli anziani che vivono da soli."
    - tutor: "Sì, così va bene. Allora le nostre visite agli anziani sono perfette per te. Cosa sai fare?"
      goals: [motivation]
    - learner: "So ascoltare, e mi piace molto parlare con le persone anziane. Con mia nonna giocavo sempre a carte, e la leggevo il giornale ogni mattina."
      errors: [object-pronoun]
    - tutor: "Che bello. Ma «la leggevo il giornale»? Il giornale si legge «a» qualcuno, a tua nonna: quel «la» non va."
      prompt: {text: "la leggevo il giornale", tags: [object-pronoun]}
    - learner: "Sì, la leggevo il giornale, perché lei non vedeva bene e le piaceva sapere tutto."
      errors: [object-pronoun]
    - tutor: "«Le leggevo il giornale»: che bel ricordo! Qui molti anziani amano proprio questo."
      recast: {text: "la leggevo il giornale", fix: "le leggevo il giornale", tags: [object-pronoun]}
      goals: [skills]
    # decoy: «più libera il pomeriggio che la mattina» is a correct use of che
    - learner: "Ho lezione la mattina, quindi sono più libera il pomeriggio che la mattina. Posso venire due pomeriggi a settimana, forse tre durante le vacanze."
    - tutor: "Perfetto. Le visite sono il martedì e il giovedì, dalle quattro alle sei."
      goals: [time]
    - learner: "Il martedì e il giovedì vanno benissimo. Ma devo leggere libri o il giornale? Secondo me, per loro il giornale è più interessante che un romanzo."
      errors: [comparative]
    - tutor: "Tutti e due: dipende dalla persona. Ma «più interessante che un romanzo»? Qui confronti due nomi: davanti a «un romanzo», «che» non va."
      prompt: {text: "più interessante che un romanzo", tags: [comparative]}
    - learner: "Più interessante di un romanzo, sì. Allora scelgo le visite agli anziani, il martedì e il giovedì."
    - tutor: "Esatto. Benissimo! Ti aspetto martedì alle quattro."
      goals: [choose]

- scenario: prenotare-tavolo
  # facts: sabato sera alle nove, sei persone, quattro adulti e due bambini; il cliente è cuoco e finisce alle otto e mezza; altri due ristoranti non avevano posto per la partita; tavolo in giardino se fa bello; seggiolone per la nipote Lola di un anno; un'amica celiaca, pasta senza glutine cucinata a parte; nome Gómez, 340 112 334; telefonata sabato pomeriggio se piove
  level: B1
  persona: es-m-worker
  history: [ci-ne, preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per sabato sera. Sono cuoco anch'io, e un collega mi ha detto che la vostra pasta fatta in casa è la migliore della città."
    - tutor: "Grazie, è un piacere sentirlo! Per quante persone e a che ora?"
      goals: [book]
    - learner: "Siamo in sei, quattro adulti e due bambini, alle nove, perché finisco di lavorare alle otto e mezza. Avete ancora posto? Ho chiamato altri due ristoranti, ma non avevano."
      errors: [ci-ne]
    - tutor: "Sì, alle nove ho ancora un tavolo da sei. Ma «non avevano»: non avevano che cosa? Per riprendere «posto», serve una parola prima del verbo."
      prompt: {text: "non avevano", tags: [ci-ne]}
      goals: [details]
    - learner: "Non ne avevano, sì, perché sabato c'è una partita importante e tutti escono."
    - tutor: "Giusto. Allora sabato alle nove, in sei. Ha qualche richiesta particolare?"
    # decoys: «vorremmo» and «ci servirebbe» are correct conditionals
    - learner: "Sì, due cose. Se fa bello, vorremmo mangiare fuori, in giardino. E ci servirebbe un seggiolone, perché la figlia de mio fratello ha solo un anno."
      errors: [preposition]
    - tutor: "Il giardino va bene, e il seggiolone ce l'abbiamo. Ma «la figlia de mio fratello»? Quel «de» non è italiano."
      prompt: {text: "de mio fratello", tags: [preposition]}
    - learner: "La figlia di mio fratello, scusi. Si chiama Lola ed è bravissima, quasi non piange mai."
    - tutor: "Esatto. Allora preparo il seggiolone per Lola. C'è altro?"
      goals: [special]
      new: [{lemma: seggiolone, gloss: high chair}]
    - learner: "Un'ultima cosa: una nostra amica è celiaca. Potreste preparare qualcosa senza glutine? Lei ha paura a mangiare fuori, perché spesso poi sta male."
      errors: [preposition]
    - tutor: "Sì, abbiamo la pasta senza glutine, e la cuciniamo a parte. Ma «ha paura a mangiare»? Con «avere paura», davanti a un verbo, quella «a» non va."
      prompt: {text: "paura a mangiare", tags: [preposition]}
      new: [{lemma: glutine, gloss: gluten}]
    - learner: "Sì, ha sempre paura a mangiare fuori, ma se lo dico io al cuoco, con voi sarà tranquilla."
      errors: [preposition]
    - tutor: "Ha sempre paura di mangiare fuori? Non si preoccupi, al cuoco lo dico io. A che nome prenoto?"
      recast: {text: "paura a mangiare", fix: "paura di mangiare", tags: [preposition]}
    - learner: "A nome Gómez, G-O-M-E-Z. Il numero è tre quattro zero, uno uno due, tre tre quattro. Mi potrebbe chiamare, se piove e dobbiamo stare dentro?"
    - tutor: "Certo, se piove la chiamo sabato pomeriggio. Allora sabato alle nove, sei persone, in giardino, con tutto quello che serve per Lola e la vostra amica."
      goals: [name]
    - learner: "Perfetto, grazie mille. Proveremo a essere puntuali, anche se con due bambini non è mai facile! A sabato."
    - tutor: "A sabato, signor Gómez. Buona serata!"

- scenario: prenotare-tavolo
  # facts: venerdì prossimo cena di laurea della learner, laurea venerdì mattina, cerimonia fino alle sei; i genitori arrivano dall'Inghilterra; dodici persone alle otto; menù fisso a trentacinque euro: primo, secondo e dolce; tre amici vegetariani mangiano il formaggio, pasta al forno con le verdure; il padre non mangia pesce; torta della coinquilina, due euro a persona per il servizio; niente musica; nome Moore, 328 990 147; venerdì mattina saprà se viene la professoressa
  level: B1
  persona: en-f-student
  history: [articulated-preposition, object-pronoun, future-form]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per venerdì prossimo, per una cena speciale: mi laureo venerdì mattina, e i miei genitori arrivano dall'Inghilterra."
    - tutor: "Auguri, allora! Per quante persone?"
      goals: [book]
    # decoys: «finirà» and «vorranno» are correct futures
    - learner: "Grazie! Saremo in dodici: io, i miei genitori, mio fratello e otto amici dell'università. Verso le otto, perché la cerimonia finirà alle sei e tutti vorranno riposarsi un po'."
    - tutor: "Dodici persone alle otto, va benissimo. Per un gruppo così abbiamo un menù fisso a trentacinque euro."
      goals: [details]
    - learner: "Trentacinque euro è perfetto. Cosa c'è nel menù? Tre di i miei amici sono vegetariani, e mio padre non mangia il pesce."
      errors: [articulated-preposition]
    - tutor: "Ci sono un primo, un secondo e il dolce, e per suo padre niente pesce. Ma «tre di i miei amici»? «Di» e «i» qui diventano una parola sola."
      prompt: {text: "di i miei amici", tags: [articulated-preposition]}
    - learner: "Sì, tre di i miei amici sono vegetariani, ma mangiano anche il formaggio e le uova, per fortuna."
      errors: [articulated-preposition]
    - tutor: "«Tre dei miei amici» mangiano il formaggio? Allora per loro facciamo la pasta al forno con le verdure."
      recast: {text: "di i miei amici", fix: "dei miei amici", tags: [articulated-preposition]}
    - learner: "Perfetto. Posso portare una torta da fuori? La fa la mia coinquilina, che è bravissima, e le ho già detto di prepararlo per venerdì."
      errors: [object-pronoun]
    - tutor: "Sì, la torta si può portare: chiediamo solo due euro a persona per il servizio. Ma «prepararlo»? Quel «lo» sta per «la torta»."
      prompt: {text: "prepararlo", tags: [object-pronoun]}
      goals: [special]
    - learner: "Di prepararla per venerdì, sì. Due euro a persona va bene. Possiamo anche mettere un po' di musica?"
    - tutor: "Proprio così. Per la musica no, mi dispiace, perché ci sono anche altri clienti. A che nome prenoto?"
    - learner: "Va bene, niente musica. A nome Moore, M-O-O-R-E, numero tre due otto, nove nove zero, uno quattro sette. Venerdì mattina saperò se viene anche la mia professoressa: posso dirvelo allora?"
      errors: [future-form]
    - tutor: "Certo, ci chiami pure venerdì mattina. Ma «saperò»? Il futuro di «sapere» è più corto: perde una lettera."
      prompt: {text: "saperò", tags: [future-form]}
      goals: [name]
    - learner: "Saprò venerdì mattina, allora vi chiamo. Grazie mille per tutto!"
    - tutor: "Esatto. Allora venerdì alle otto, dodici persone, a nome Moore. E auguri ancora per venerdì!"

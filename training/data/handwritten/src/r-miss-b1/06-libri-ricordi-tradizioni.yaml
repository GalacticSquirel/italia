# Set r-miss-b1, file 6 (B1): a book club, childhood memories on a walk and Christmas
# traditions. Stories in the past are where tense, relative and agreement errors hide.
- scenario: film-libro
  # facts: giallo ambientato a Venezia, di un'autrice spagnola; comprato all'aeroporto di Siviglia, finito in tre giorni; la protagonista lavora in un museo, una notte ha visto un uomo nella sala dei quadri, la polizia sospetta di lei perché ha le chiavi; un fratello con cui non parla da anni la aiuta alla fine; la learner è stata a Venezia l'anno scorso; il finale troppo veloce; Roberto lo segna nella lista del club
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect, relative-pronoun, comparative]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto un giallo ambientato a Venezia, di un'autrice spagnola che non conoscevo. L'ho comprato all'aeroporto di Siviglia e l'ho finito in tre giorni."
    - tutor: "In tre giorni, allora ti ha preso! Di cosa parla, senza dire troppo?"
    - learner: "Parla di una donna che lavora in un museo di Venezia. Una notte, mentre chiudeva le porte, vedeva un uomo nella sala dei quadri, e la mattina dopo un quadro era sparito."
      errors: [tense-aspect]
    - tutor: "Che inizio! Ma «mentre chiudeva le porte, vedeva un uomo»? Il «mentre» va bene, ma vedere l'uomo è un fatto improvviso: che tempo serve?"
      prompt: {text: "vedeva un uomo", tags: [tense-aspect]}
    - learner: "Mentre chiudeva le porte, ha visto un uomo, sì. E la polizia pensa subito a lei, perché aveva le chiavi."
    - tutor: "Esatto. Povera donna! E com'è lei, questa donna?"
      goals: [summary]
    - learner: "Si chiama Elena ed è una donna molto forte, ma anche sola. Ha un fratello con che non parla da dieci anni, e alla fine lui la aiuta a trovare il vero ladro."
      errors: [relative-pronoun]
    - tutor: "Un fratello che torna, bello! Ma «un fratello con che»? Quando prima di «che» c'è una parola come «con», bisogna cambiarlo."
      prompt: {text: "con che", tags: [relative-pronoun]}
    - learner: "Sì, un fratello con che non parla da anni, per una vecchia storia di soldi."
      errors: [relative-pronoun]
    - tutor: "Un fratello con cui non parla da anni, per soldi: già questo è un piccolo giallo! Ti è piaciuto?"
      recast: {text: "con che", fix: "con cui", tags: [relative-pronoun]}
      goals: [characters]
    # decoy: «ci sono stata» is a correct locative ci
    - learner: "Mi è piaciuto molto, soprattutto Venezia: l'autrice la descrive benissimo. Io ci sono stata l'anno scorso e ho riconosciuto tanti posti, ma il finale non mi ha convinto."
    - tutor: "Peccato. Perché il finale non ti ha convinto?"
    - learner: "Perché è troppo veloce: in dieci pagine si spiega tutto, e mi sembra meno interessante che il resto del libro."
      errors: [comparative]
    - tutor: "Capita spesso con i gialli. Ma «meno interessante che il resto»? Qui ci sono due parti del libro: davanti a «il resto», «che» non va."
      prompt: {text: "meno interessante che il resto", tags: [comparative]}
      goals: [opinion]
    - learner: "Meno interessante del resto, sì. Però lo consiglio a chi ama i gialli e vuole visitare Venezia, perché è come una guida della città."
    - tutor: "Sì, così va bene. Ottimo consiglio, lo segno nella lista del club. Chi vuole continuare?"
      goals: [recommend]

- scenario: film-libro
  # facts: un film italiano in bianco e nero degli anni Cinquanta, trovato in biblioteca con i sottotitoli; un padre povero a Roma dopo la guerra; il primo giorno di lavoro gli rubano la bicicletta; alla fine prova anche lui a rubarne una e il figlio rimane senza parole; il padre gli dà la mano; i nipoti del learner dicono che il bianco e nero è noioso; vuole guardarlo con loro questo fine settimana
  level: B1
  persona: en-m-retired
  history: [auxiliary-choice, object-pronoun, preposition]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Questo mese non ho letto un libro, ma ho visto un film italiano in bianco e nero, degli anni Cinquanta. L'ho trovato in biblioteca, con i sottotitoli."
    - tutor: "Va benissimo anche un film! Di cosa parla?"
    # decoy: «di cui ha assolutamente bisogno» is a correct relative
    - learner: "Parla di un padre povero a Roma, dopo la guerra. Il primo giorno di lavoro gli rubano la bicicletta, di cui ha assolutamente bisogno, e lui e il figlio la cercano dappertutto."
    - tutor: "Una storia semplice, ma forte. E com'è il padre?"
      goals: [summary]
    - learner: "È un uomo buono ma disperato. Alla fine ha provato anche lui a rubare una bicicletta, e il figlio, che ha visto tutto, ha rimasto senza parole."
      errors: [auxiliary-choice]
    - tutor: "Che momento difficile. Ma «il figlio ha rimasto»? Con «rimanere», il passato non si fa con «avere»."
      prompt: {text: "ha rimasto", tags: [auxiliary-choice]}
    - learner: "Il figlio è rimasto senza parole, sì. Per me è la scena più triste del film, e anche la più bella."
    - tutor: "Esatto. Perché ti è piaciuta così tanto?"
      goals: [characters]
    - learner: "Perché non c'è bisogno di parole: il bambino cerca la mano del padre, e il padre lo dà la mano, e noi capiamo tutto."
      errors: [object-pronoun]
    - tutor: "Hai ragione, basta un gesto. Ma «il padre lo dà la mano»? La mano si dà «a» qualcuno, al bambino: quel «lo» non va."
      prompt: {text: "lo dà la mano", tags: [object-pronoun]}
    - learner: "Sì, il padre lo dà la mano, e poi camminano insieme in mezzo alla gente."
      errors: [object-pronoun]
    - tutor: "Il padre gli dà la mano e camminano tra la gente: è un finale che non si dimentica. A chi lo consiglieresti?"
      recast: {text: "lo dà la mano", fix: "gli dà la mano", tags: [object-pronoun]}
      goals: [opinion]
    - learner: "Lo consiglierei a tutti, anche ai giovani che guardano solo film nuovi. I miei nipoti dovrebbero vederlo, ma è difficile convincerli di guardare un film vecchio."
      errors: [preposition]
    - tutor: "Forse, se lo guardate insieme, cambiano idea. Ma «convincerli di guardare»? Dopo «convincere qualcuno», davanti a un altro verbo, la parola giusta è un'altra."
      prompt: {text: "convincerli di guardare", tags: [preposition]}
      goals: [recommend]
    - learner: "Convincerli a guardare un film vecchio, sì, è difficile! Ma ci provo questo fine settimana, con una pizza."
    - tutor: "Giusto. Con una pizza ce la fai di sicuro! Poi ci racconti com'è andata."

- scenario: film-libro
  # facts: primo romanzo letto in italiano, quasi due mesi; famiglia di Napoli raccontata da una delle figlie; comincia negli anni Sessanta in un quartiere povero; lei si occupava del nonno; va a studiare a Milano, la famiglia vuole che resti e si sposi; la madre sembra dura ma ha sempre aiutato la figlia; ultime pagine lette in treno; consigliato a chi studia italiano da almeno due anni
  level: B1
  persona: en-f-professional
  history: [relative-pronoun, subjunctive-use, participle-agreement]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto il mio primo romanzo in italiano! È la storia di una famiglia di Napoli, raccontata da una delle figlie, e ci ho messo quasi due mesi."
    - tutor: "Il primo in italiano, brava! Di cosa parla, senza dire il finale?"
    - learner: "La storia comincia negli anni Sessanta, in un quartiere povero dove la protagonista abitava con i suoi genitori e con il nonno, di che si occupava lei."
      errors: [relative-pronoun]
    - tutor: "Una ragazza con tante responsabilità. Ma «il nonno, di che si occupava»? Dopo «di», per riprendere una persona non si usa «che»."
      prompt: {text: "di che", tags: [relative-pronoun]}
    - learner: "Il nonno, di cui si occupava lei, sì. Poi lei va a studiare a Milano, ma la famiglia non è contenta."
    - tutor: "Esatto. E come mai la famiglia non è contenta?"
      goals: [summary]
    - learner: "Perché sono molto tradizionali: vogliono che resta a casa e si sposa con un ragazzo del quartiere. Ma lei parte lo stesso."
      errors: [subjunctive-use]
    - tutor: "Che coraggio! Ma «vogliono che resta»? Dopo «vogliono che», il verbo prende un'altra forma."
      prompt: {text: "resta a casa", tags: [subjunctive-use]}
    - learner: "Vogliono che resti a casa e si sposi, sì. Ma lei è più coraggiosa di tutti, e va per la sua strada."
    - tutor: "Proprio così. Che personaggio! E il libro ti è piaciuto?"
      goals: [characters]
    - learner: "Moltissimo, soprattutto la madre: all'inizio sembra dura, ma alla fine capiamo che ha sempre aiutato la figlia. Le ultime pagine le ho letto in treno, e ho pianto."
      errors: [participle-agreement]
    - tutor: "Succede con i libri belli. Ma «le ultime pagine le ho letto»? Con «le» prima del verbo, la fine di «letto» va d'accordo con «pagine»."
      prompt: {text: "le ho letto", tags: [participle-agreement]}
    - learner: "Sì, le ho letto in treno, davanti a tutti i passeggeri, e piangevo come una bambina: che vergogna!"
      errors: [participle-agreement]
    - tutor: "«Le ho lette in treno» davanti a tutti: è il segno che è un bel libro! A chi lo consiglieresti?"
      recast: {text: "le ho letto", fix: "le ho lette", tags: [participle-agreement]}
      goals: [opinion]
    - learner: "Lo consiglierei a chi studia italiano da almeno due anni, perché non è facile. E anche a chi ama le storie di famiglia, come me."
    - tutor: "Ottimo consiglio, grazie! Chi vuole continuare?"
      goals: [recommend]

- scenario: ricordi-infanzia
  # facts: da piccolo a Buenos Aires, in un quartiere vicino al porto; casa piccola con un cortile per il calcio; dopo la scuola dal nonno che aveva una panetteria; i dolci della nonna, oggi usa le sue ricette al ristorante; scuola lontana, ogni mattina l'autobus con il fratello, quasi un'ora; nel 1986 la vittoria ai Mondiali, aveva sette anni, sulle spalle del padre; tre anni fa è tornato con i figli, la panetteria non c'è più, il cortile sì
  level: B1
  persona: es-m-worker
  history: [imperfetto-form, tense-aspect, articulated-preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Da piccolo abitavo a Buenos Aires, in un quartiere vicino al porto. La nostra casa era piccola, ma c'era un cortile dove giocavamo sempre a calcio."
    - tutor: "Un cortile per il calcio, il sogno di ogni bambino! E cosa facevi dopo la scuola?"
      goals: [place]
    - learner: "Dopo la scuola andavo da mio nonno, che aveva una panetteria. Lo aiutavo a fare il pane e, quando nessuno guardava, mangiavo i dolci che faciva mia nonna."
      errors: [imperfetto-form]
    - tutor: "Che bambino furbo! Ma «i dolci che faciva»? L'imperfetto di «fare» non nasce da «fa», ma dalla forma più lunga del verbo: pensa a «facendo»."
      prompt: {text: "faciva", tags: [imperfetto-form]}
    - learner: "I dolci che faceva mia nonna, sì! Ancora oggi, quando preparo i dolci al ristorante, uso le sue ricette."
    - tutor: "Esatto. Allora la cucina ce l'hai nel sangue! E la scuola, com'era?"
      goals: [habits]
    - learner: "La scuola era lontana, quindi ogni mattina ho preso l'autobus con mio fratello alle sette. Lui dormiva sempre, e io dovevo svegliarlo alla fermata."
      errors: [tense-aspect]
    - tutor: "Povero te! Ma «ogni mattina ho preso l'autobus»? Con «ogni mattina» racconti una cosa che si ripeteva: il tempo giusto è un altro."
      prompt: {text: "ho preso l'autobus", tags: [tense-aspect]}
    - learner: "Sì, ogni mattina ho preso l'autobus, e il viaggio durava quasi un'ora, con tutto il traffico della città."
      errors: [tense-aspect]
    - tutor: "«Ogni mattina prendevo l'autobus» per un'ora: io invece andavo a scuola a piedi! Hai un ricordo speciale di quegli anni?"
      recast: {text: "ho preso l'autobus", fix: "prendevo l'autobus", tags: [tense-aspect]}
      goals: [school]
    - learner: "Sì, il giorno che l'Argentina ha vinto i Mondiali, nel millenovecentottantasei. Avevo sette anni, e tutto il quartiere è uscito in strada a festeggiare fino a la mattina."
      errors: [articulated-preposition]
    - tutor: "Che festa, immagino! Ma «fino a la mattina»? Qui «a» e «la» diventano una parola sola."
      prompt: {text: "fino a la mattina", tags: [articulated-preposition]}
    - learner: "Fino alla mattina, sì! Mio padre mi ha messo sulle sue spalle, e io gridavo con tutti gli altri."
    - tutor: "Sì, così va bene. Sulle spalle di tuo padre, che ricordo! Sei mai tornato in quel quartiere?"
      goals: [event]
    # decoys: «ci sono tornato» and «ci giocano» are correct uses of ci
    - learner: "Sì, ci sono tornato tre anni fa con i miei figli. La panetteria del nonno non c'è più, ma il cortile è ancora lì, e i bambini ci giocano ancora."
    - tutor: "Che bello che i tuoi figli l'abbiano visto. Un giorno ci andiamo insieme, va bene?"

- scenario: ricordi-infanzia
  # facts: da piccola in un paesino sul mare vicino a Scarborough; d'inverno triste, d'estate pieno di turisti; ogni giorno in spiaggia con la sorella, due gelati ciascuna; scuola con sessanta bambini; la maestra preferita è partita per l'Australia; compleanno dei dieci anni in spiaggia, pioggia durante la torta, tutti sotto un ombrellone; i genitori abitano ancora lì, la gelateria ha chiuso due anni fa; Matteo la porta nella sua gelateria preferita
  level: B1
  persona: en-f-student
  history: [ci-ne, auxiliary-choice, tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Da piccola abitavo in un paesino sul mare, vicino a Scarborough, nel nord dell'Inghilterra. D'inverno era molto triste, ma d'estate era pieno di turisti."
    - tutor: "Un paesino sul mare, che bello! Cosa facevi d'estate?"
      goals: [place]
    - learner: "D'estate andavo in spiaggia con mia sorella ogni giorno, anche con il freddo. Mia madre ci dava dei soldi per il gelato, e noi compravamo sempre due ciascuna."
      errors: [ci-ne]
    - tutor: "Che fortuna! Ma «compravamo sempre due»: due che cosa? Per non ripetere «gelato», serve una parola prima del verbo."
      prompt: {text: "compravamo sempre due", tags: [ci-ne]}
    - learner: "Ne compravamo sempre due ciascuna, sì, e poi avevamo mal di pancia!"
    - tutor: "Esatto. Due a testa, ci credo! E la scuola com'era?"
      goals: [habits]
    - learner: "La scuola era piccola, c'erano solo sessanta bambini. Un giorno la mia maestra preferita ha partito per l'Australia, e io ho pianto per una settimana."
      errors: [auxiliary-choice]
    - tutor: "Che dispiacere. Ma «la maestra ha partito»? Con «partire», il passato si fa con un altro verbo."
      prompt: {text: "ha partito", tags: [auxiliary-choice]}
    - learner: "Sì, ha partito senza dire niente a noi bambini, e la nuova maestra era molto severa."
      errors: [auxiliary-choice]
    - tutor: "È partita senza dire niente a voi bambini? Che brutto! Hai un ricordo speciale di quegli anni?"
      recast: {text: "ha partito", fix: "è partita", tags: [auxiliary-choice]}
      goals: [school]
    - learner: "Sì, il mio compleanno di dieci anni. Mio padre ha preparato una festa in spiaggia, ma mentre abbiamo mangiato la torta, è cominciato a piovere fortissimo."
      errors: [tense-aspect]
    - tutor: "Proprio durante la torta! Ma «mentre abbiamo mangiato la torta»? Con «mentre» racconti una cosa in corso: pensa al tempo del verbo."
      prompt: {text: "mentre abbiamo mangiato", tags: [tense-aspect]}
    - learner: "Mentre mangiavamo la torta, sì. Siamo tutti scappati sotto un ombrellone, ed è stata la festa più divertente della mia vita."
    - tutor: "Giusto. Una festa sotto la pioggia, che ricordo! Ci torni ancora, al tuo paese?"
      goals: [event]
    # decoys: «ci torno» and «dove andavamo» are correct
    - learner: "Ci torno ogni Natale, perché i miei genitori abitano ancora lì. Il paese è cambiato poco, ma la gelateria dove andavamo da bambine ha chiuso due anni fa."
    - tutor: "Peccato per la gelateria! Allora domani ti porto nella mia preferita, qui vicino."

- scenario: ricordi-infanzia
  # facts: da piccola a Valencia, ogni estate al paese dei nonni in montagna, una piazza e una chiesa; giocava con i cugini, bagno nel fiume freddissimo; a scuola più brava in disegno che in matematica, la maestra lodava i suoi disegni; poi è diventata insegnante di disegno; la notte di San Juan a giugno, un grande fuoco in piazza, un anno il cugino è saltato sopra il fuoco e si è bruciato i pantaloni; gruppo di famiglia sul telefono, ogni agosto tornano al paese
  level: B1
  persona: es-f-teacher
  history: [relative-pronoun, comparative, tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Da piccola abitavo a Valencia, ma tutte le estati andavo al paese dei miei nonni, in montagna. Era un paese piccolissimo, con una piazza e una chiesa."
    - tutor: "E cosa facevi lì tutta l'estate?"
      goals: [place]
    - learner: "Giocavo con i miei cugini dalla mattina alla sera. C'era un fiume vicino al paese, in che facevamo il bagno quando faceva caldo."
      errors: [relative-pronoun]
    - tutor: "Che libertà! Ma «un fiume, in che facevamo il bagno»? Dopo «in», per riprendere «il fiume» serve un'altra parola."
      prompt: {text: "in che", tags: [relative-pronoun]}
    - learner: "Un fiume in cui facevamo il bagno, sì. L'acqua era freddissima, ma noi bambini non sentivamo niente."
    - tutor: "Esatto. I bambini non sentono mai il freddo! E la scuola, a Valencia, ti piaceva?"
      goals: [habits]
    # «più brava in disegno che in matematica» is correct; only «più belli che quelli» is wrong
    - learner: "Sì, tanto. Ero più brava in disegno che in matematica, e la mia maestra diceva sempre che i miei disegni erano più belli che quelli degli altri."
      errors: [comparative]
    - tutor: "Brava! Ma «più belli che quelli»? «In disegno che in matematica» va bene, ma davanti a «quelli» serve un'altra parola."
      prompt: {text: "più belli che quelli", tags: [comparative]}
    - learner: "Più belli di quelli degli altri, sì. Per questo da grande sono diventata insegnante di disegno!"
    - tutor: "Proprio così. Allora la tua maestra aveva ragione! Hai un ricordo speciale di quel paese?"
      goals: [school]
    - learner: "Sì, la notte di San Juan, a giugno. Ogni anno facevamo un grande fuoco in piazza, e un anno mio cugino saltava sopra il fuoco e si è bruciato i pantaloni!"
      errors: [tense-aspect]
    - tutor: "Oddio, i pantaloni! Ma «un anno mio cugino saltava»? È successo una volta sola, quell'anno: che tempo serve?"
      prompt: {text: "saltava sopra il fuoco", tags: [tense-aspect]}
      goals: [event]
    - learner: "Sì, un anno saltava sopra il fuoco, e mia nonna gridava come una pazza dalla finestra."
      errors: [tense-aspect]
    - tutor: "È saltato sopra il fuoco, e la nonna gridava dalla finestra: me la immagino! Siete ancora così uniti, tu e i tuoi cugini?"
      recast: {text: "saltava sopra il fuoco", fix: "è saltato sopra il fuoco", tags: [tense-aspect]}
    - learner: "Sì, abbiamo un gruppo sul telefono e ci sentiamo tutti i giorni. Ogni agosto torniamo al paese, anche con i nostri figli."
    - tutor: "Che bella tradizione. Allora quest'estate mi porti con te!"

- scenario: tradizioni-feste
  # facts: in Ohio a Natale si aprono i regali la mattina presto, pranzo con il tacchino; la sera i vicini cantano davanti alle case; da bambino ha trovato il padre alle tre di notte che metteva i regali; in molte famiglie italiane la sera della vigilia solo pesce; domani pranzo di Natale con carne, pasta e dolci; porta una torta di zucca americana; pranzo a mezzogiorno, diciotto persone; viene con la moglie e una bottiglia di vino
  level: B1
  persona: en-m-retired
  history: [subject-verb-agreement, tense-aspect, articulated-preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Anche da noi si mangia tantissimo! In Ohio, il giorno di Natale, si apre i regali la mattina presto, e poi a pranzo si mangia il tacchino con tutta la famiglia."
      errors: [subject-verb-agreement]
    - tutor: "Il tacchino, che bello! Ma «si apre i regali»? Con «si», il verbo va d'accordo con «i regali», che sono tanti."
      prompt: {text: "si apre i regali", tags: [subject-verb-agreement]}
    - learner: "Si aprono i regali, sì. E la sera i vicini vengono a cantare davanti alle case, anche se fa molto freddo."
    - tutor: "Esatto. Che bella tradizione, cantare per le case! E da bambino, com'era il tuo Natale?"
      goals: [compare]
    - learner: "Più o meno così. La notte di Natale non riuscivo mai a dormire, e un anno sono sceso alle tre di notte e trovavo mio padre che metteva i regali sotto l'albero!"
      errors: [tense-aspect]
    - tutor: "Che sorpresa! Ma «sono sceso... e trovavo mio padre»? Trovarlo è stato un fatto preciso, come scendere: che tempo serve?"
      prompt: {text: "trovavo mio padre", tags: [tense-aspect]}
    - learner: "Ho trovato mio padre che metteva i regali, sì! Così ho scoperto la verità su Babbo Natale."
    - tutor: "Sì, così va bene. Povero papà! E delle nostre tradizioni, cosa vorresti sapere?"
      goals: [past]
    - learner: "Ho sentito che in Italia, la sera di la vigilia, non si mangia la carne ma solo il pesce. È vero? E perché?"
      errors: [articulated-preposition]
    - tutor: "Sì, in tante famiglie quella sera si mangia solo pesce: è una tradizione legata alla Chiesa. Ma «la sera di la vigilia»? «Di» e «la» si uniscono in una parola sola."
      prompt: {text: "di la vigilia", tags: [articulated-preposition]}
      goals: [ask]
    - learner: "Sì, la sera di la vigilia niente carne. Allora domani, al pranzo di Natale, possiamo mangiare la carne?"
      errors: [articulated-preposition]
    - tutor: "Sì: la sera della vigilia pesce, e domani invece carne, pasta e dolci!"
      recast: {text: "di la vigilia", fix: "della vigilia", tags: [articulated-preposition]}
    # decoy: «se ne avete bisogno» is a correct ne
    - learner: "Perfetto, io mangio di tutto! Cosa posso portare? Ho pensato a una torta di zucca americana, ma non so se ne avete bisogno, con tutti i vostri dolci."
    - tutor: "Portala, è un'idea bellissima: i miei zii adorano provare cose nuove. Vieni a mezzogiorno?"
      goals: [plan]
      new: [{lemma: mezzogiorno, gloss: noon}]
    - learner: "Sì, a mezzogiorno. Verrò con mia moglie e porteremo anche una bottiglia di vino. Quante persone ci saranno?"
    - tutor: "Saremo in diciotto, quindi fai una torta grande! A domani."

- scenario: tradizioni-feste
  # facts: in Canada la famiglia della madre è calabrese; la vigilia sette tipi di pesce cucinati dalla nonna; le zie arrivavano da Montreal con i dolci, una volta sono arrivate alle undici per la neve; per Silvia è più importante il pranzo del venticinque; il panettone a fine pasto e a colazione nei giorni dopo; porta i biscotti della nonna al miele e alle mandorle; pranzo alle dodici e mezza; dodici persone, cinquanta biscotti
  level: B1
  persona: en-m-heritage
  history: [participle-agreement, conditional-form, ci-ne]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    # decoy: «si mangiano sette tipi di pesce» is a correct agreement with si
    - learner: "Da noi in Canada si festeggia quasi come qui, perché la famiglia di mia madre è calabrese: la vigilia si mangiano sette tipi di pesce, e la nonna li cucina tutti."
    - tutor: "Sette tipi di pesce, che cena! E quando eri piccolo, com'era?"
      goals: [compare]
    - learner: "Era bellissimo. Le mie zie arrivavano da Montreal con la macchina piena di dolci, e una volta sono arrivati in ritardo per la neve, alle undici di sera."
      errors: [participle-agreement]
    - tutor: "Alle undici, con la neve! Ma «le mie zie sono arrivati»? Con «essere», la fine del verbo va d'accordo con «zie»."
      prompt: {text: "sono arrivati", tags: [participle-agreement]}
    - learner: "Sì, sono arrivati alle undici, e la nonna aveva già mangiato tutto il pesce per rabbia!"
      errors: [participle-agreement]
    - tutor: "Sono arrivate alle undici e il pesce era già finito? Che nonna!"
      recast: {text: "sono arrivati", fix: "sono arrivate", tags: [participle-agreement]}
      goals: [past]
    # decoy: «più importante la vigilia che il giorno di Natale» is a correct use of che
    - learner: "Sì, aveva un bel carattere. Ma dimmi una cosa: qui da voi è più importante la vigilia che il giorno di Natale? E il panettone si mangia a colazione o dopo pranzo?"
    - tutor: "Dipende dalle famiglie: da noi conta di più il pranzo del venticinque. Il panettone si mangia alla fine del pranzo, ma anche a colazione nei giorni dopo."
      goals: [ask]
    - learner: "Che bello, io lo mangerei a tutte le ore! Per il pranzo, cosa poterei portare? Mi piacerebbe portare qualcosa della cucina di mia nonna."
      errors: [conditional-form]
    - tutor: "Qualcosa di dolce va benissimo. Ma «poterei»? Il condizionale di «potere» perde una lettera, come il suo futuro."
      prompt: {text: "poterei", tags: [conditional-form]}
    - learner: "Potrei portare i biscotti di mia nonna, allora. Sono al miele e alle mandorle, e li so fare anch'io."
    - tutor: "Esatto. I biscotti della nonna sono un'idea bellissima. Vieni alle dodici e mezza?"
      goals: [plan]
    - learner: "Sì, alle dodici e mezza. Ma quanti biscotti devo fare? Di solito mia nonna faceva cento, ma forse per voi sono troppi."
      errors: [ci-ne]
    - tutor: "Saremo in dodici, quindi bastano molti meno. Ma «faceva cento»: cento che cosa? Per non ripetere «biscotti», serve una parola prima del verbo."
      prompt: {text: "faceva cento", tags: [ci-ne]}
    - learner: "Ne faceva cento, sì, ma la nostra famiglia era enorme! Allora ne porto cinquanta."
    - tutor: "Giusto. Cinquanta vanno benissimo. A domani alle dodici e mezza!"

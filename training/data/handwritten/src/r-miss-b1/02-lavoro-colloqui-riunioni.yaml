# Set r-miss-b1, file 2 (B1): job interviews at a design studio, team meetings and two chats
# about working from home. The errors hide in long, confident turns about work.
- scenario: colloquio-lavoro
  # facts: candidata australiana, a Milano da due anni, marketing da quasi dieci anni; sei anni in un'agenzia a Sydney; il marito ha ricevuto un'offerta a Milano; a Milano comunicazione e social per un'azienda di mobili; campagna per una linea di sedie; difetto: impaziente; squadra di otto persone; da casa due giorni a settimana; risposta entro venerdì
  level: B1
  persona: en-f-professional
  history: [tense-aspect, participle-agreement, comparative, conditional-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, mi chiamo Emma. Sono australiana, ma vivo a Milano da due anni, e mi occupo di marketing da quasi dieci anni."
    - tutor: "Piacere. Dove ha lavorato prima di venire a Milano?"
      goals: [intro]
    - learner: "Per sei anni ho lavorato in un'agenzia a Sydney. Era un lavoro bellissimo, ma un giorno mio marito riceveva un'offerta qui e abbiamo deciso di partire."
      errors: [tense-aspect]
    - tutor: "Una scelta coraggiosa. Ma «un giorno mio marito riceveva»? È un fatto preciso, che ha cambiato tutto: quale tempo serve qui?"
      prompt: {text: "riceveva un'offerta", tags: [tense-aspect]}
    - learner: "Un giorno ha ricevuto un'offerta, sì. Qui a Milano ho lavorato per un'azienda di mobili, dove seguivo la comunicazione e i social."
    - tutor: "Esatto. Quindi conosce già questo tipo di lavoro. Quali sono i suoi punti forti?"
      goals: [experience]
    - learner: "Sono molto organizzata e lavoro bene in squadra. L'anno scorso ho preparato una campagna per una nuova linea di sedie, e i clienti l'hanno apprezzato moltissimo."
      errors: [participle-agreement]
    - tutor: "Ottimo risultato. Ma «l'hanno apprezzato»? Quel «l'» sta per «la campagna»: la fine del verbo deve andare d'accordo."
      prompt: {text: "l'hanno apprezzato", tags: [participle-agreement]}
    - learner: "L'hanno apprezzata moltissimo, sì. Un mio difetto, invece, è che sono un po' impaziente quando un progetto va troppo lento."
    - tutor: "Giusto. Lo sa, ed è già qualcosa. Perché vuole lavorare proprio da noi?"
      goals: [strengths]
    - learner: "Perché seguo i vostri progetti da tempo, e il vostro stile mi piace più che quello delle grandi agenzie, che spesso fanno tutte le stesse cose."
      errors: [comparative]
    - tutor: "Grazie, ci fa piacere. Ma «più che quello»? Confronti due cose, il nostro stile e quello delle agenzie: qui «che» non va."
      prompt: {text: "più che quello", tags: [comparative]}
    - learner: "Mi piace più di quello delle agenzie, sì. E poi in un'azienda piccola si può partecipare a tutto, dall'idea al prodotto finale."
    - tutor: "Esatto, qui tutti fanno un po' di tutto. Ha qualche domanda per noi?"
      goals: [why]
    - learner: "Sì, due domande. Quante persone ci sono nella squadra? E mi piacerebbe sapere se potrebbi lavorare da casa qualche giorno."
      errors: [conditional-form]
    - tutor: "Siamo otto persone, e si può lavorare da casa due giorni a settimana. Ma «potrebbi»? Pensi a «vorrei»: con «io», il condizionale finisce sempre allo stesso modo."
      prompt: {text: "potrebbi", tags: [conditional-form]}
      goals: [questions]
    - learner: "Potrei lavorare da casa due giorni, perfetto. E quando mi farete sapere qualcosa?"
    - tutor: "Esatto. Le scriviamo entro venerdì. Grazie per essere venuta!"

- scenario: colloquio-lavoro
  # facts: Daniel, grafico, nato a Toronto, nonni italiani, a Bologna da sei mesi; tre anni in uno studio di Toronto; logo per un festival di musica; creativo, ascolta i clienti; difetto: parla troppo nelle riunioni; ha mandato il portfolio alla direttrice il mese scorso e lei l'ha visto; lavorerebbe al sito di un cliente, un'azienda di biciclette; telefonata entro la fine della settimana
  level: B1
  persona: en-m-heritage
  history: [auxiliary-choice, relative-pronoun, object-pronoun]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Daniel e sono grafico. Sono nato a Toronto, ma i miei nonni sono italiani, e sei mesi fa mi sono trasferito qui a Bologna."
    - tutor: "Benvenuto, allora. Mi racconti la sua esperienza di lavoro."
      goals: [intro]
    - learner: "Dopo la laurea ho lavorato tre anni in uno studio di Toronto. Lì ho cresciuto molto, perché il mio capo mi dava sempre i progetti più difficili."
      errors: [auxiliary-choice]
    - tutor: "Un buon capo, allora. Ma «lì ho cresciuto»? Qui «crescere» vuol dire diventare più bravo, e con questo senso il passato non va con «avere»."
      prompt: {text: "ho cresciuto", tags: [auxiliary-choice]}
    - learner: "Lì sono cresciuto molto, sì. Il progetto più importante è stato il logo di un festival di musica, che è piaciuto a tutta la città."
    - tutor: "Proprio così. Un logo per tutta una città, bravo! Quali sono i suoi punti forti?"
      goals: [experience]
    - learner: "Sono creativo e ascolto molto i clienti. Il mio vecchio capo diceva che ero la persona a che tutti chiedevano un'idea quando c'era un problema."
      errors: [relative-pronoun]
    - tutor: "Bella cosa da sentirsi dire. Ma «la persona a che»? Dopo «a», quel «che» non funziona: serve un'altra parola."
      prompt: {text: "a che", tags: [relative-pronoun]}
    - learner: "Sì, la persona a che tutti chiedevano aiuto. Però a volte parlo troppo nelle riunioni: questo è il mio difetto."
      errors: [relative-pronoun]
    - tutor: "La persona a cui tutti chiedevano aiuto: è una bella qualità. E parlare troppo non è grave, se le idee sono buone. Perché vuole lavorare con noi?"
      recast: {text: "a che", fix: "a cui", tags: [relative-pronoun]}
      goals: [strengths]
    - learner: "Ho visto i vostri lavori su Internet e mi sono piaciuti tanto. Ho anche scritto alla vostra direttrice il mese scorso, e gli ho mandato il mio portfolio."
      errors: [object-pronoun]
    - tutor: "Ci fa piacere. Ma «gli ho mandato»? Parla della nostra direttrice: per una donna, quel «gli» non va."
      prompt: {text: "gli ho mandato", tags: [object-pronoun]}
      goals: [why]
    - learner: "Le ho mandato il portfolio, sì, ma forse non l'ha visto. Posso fare una domanda? Su quali progetti lavorerei, se mi prendete?"
    - tutor: "Esatto. L'ha visto, ed è per questo che lei è qui! Lavorerebbe soprattutto al sito di un nostro cliente, un'azienda di biciclette."
      goals: [questions]
    - learner: "Mi piace moltissimo, io vado in bicicletta tutti i giorni, anche d'inverno! Quando posso sapere se il colloquio è andato bene?"
    - tutor: "Le telefoniamo entro la fine della settimana. Grazie, e a presto!"

- scenario: colloquio-lavoro
  # facts: spagnola di Valencia, a Firenze da un anno con la famiglia; dodici anni insegnante di disegno in una scuola media; primo libro per bambini tre anni fa, adesso tre libri con la stessa casa editrice; dieci illustrazioni nuove per il colloquio; paziente e precisa, difetto: non sa dire di no; ha quarantadue anni; cliente nuovo: una casa editrice; contratto di sei mesi all'inizio; risposta entro dieci giorni
  level: B1
  persona: es-f-teacher
  history: [ci-ne, subjunctive-use, preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, e grazie per avermi invitata. Sono spagnola, di Valencia, e da un anno vivo a Firenze con mio marito e i miei figli."
    - tutor: "Grazie a lei. Che lavoro faceva in Spagna?"
      goals: [intro]
    # decoy: «ho insegnato per dodici anni» is correct for a finished, bounded period
    - learner: "Ho insegnato disegno in una scuola media per dodici anni. Mi piaceva molto, ma nel tempo libero facevo sempre illustrazioni, e tre anni fa ho pubblicato il mio primo libro per bambini."
    - tutor: "Un libro per bambini, che bello. E dopo il primo, ha continuato?"
      goals: [experience]
    - learner: "Sì, adesso i libri sono tre, sempre con la stessa casa editrice. Ho portato anche delle illustrazioni nuove: ho preparato dieci solo per questo colloquio."
      errors: [ci-ne]
    - tutor: "Che lavoro! Ma «ho preparato dieci»: dieci di che cosa? Con un numero, «illustrazioni» va ripresa da una parola prima del verbo."
      prompt: {text: "ho preparato dieci", tags: [ci-ne]}
    - learner: "Ne ho preparate dieci, sì. Le ho fatte con lo stile delle vostre pubblicità, perché volevo vedere se funzionava."
    - tutor: "Sì, così va bene. E funziona: lo stile è proprio il nostro. Quali sono i suoi punti forti, secondo lei?"
    - learner: "Sono paziente e precisa, dopo dodici anni con i ragazzi! Il mio difetto è che non so dire di no, anche quando temo che un lavoro è troppo per me."
      errors: [subjunctive-use]
    - tutor: "Succede a tanti. Ma «temo che un lavoro è troppo»? Dopo «temo che», il verbo prende un'altra forma."
      prompt: {text: "è troppo per me", tags: [subjunctive-use]}
      goals: [strengths]
    - learner: "Temo che sia troppo, ecco. Ma perché avete bisogno di un'illustratrice? Su quali progetti lavorerei?"
    - tutor: "Esatto. Lavorerebbe per un nostro nuovo cliente, una casa editrice, con un contratto di sei mesi all'inizio. Ma perché vuole lasciare la scuola?"
      goals: [questions]
      new: [{lemma: editrice, gloss: publishing (house)}]
    - learner: "Perché disegnare è la mia passione da sempre, e voglio provare a farlo tutti i giorni. Non ho paura a cominciare da zero, anche a quarantadue anni."
      errors: [preposition]
    - tutor: "Si sente che ci crede. Ma «paura a cominciare»? Dopo «avere paura», davanti a un altro verbo, la parola giusta è un'altra."
      prompt: {text: "paura a cominciare", tags: [preposition]}
      goals: [why]
    - learner: "Non ho paura di cominciare da zero, davvero. Quando potrò sapere la vostra decisione?"
    - tutor: "Giusto. Le diamo una risposta entro dieci giorni. Grazie, e buona giornata!"

- scenario: riunione-lavoro
  # facts: app per una palestra; pagine principali finite e mostrate a Marco, gli sono piaciute; il cliente ha promesso venti foto, ne ha mandate solo due; proposta: foto gratis da Internet per adesso, poi le cambia; mercoledì mattina riunione con il gruppo di Milano fino alle dodici; prima versione al cliente mercoledì pomeriggio, tutto pronto venerdì
  level: B1
  persona: es-f-erasmus
  history: [ci-ne, future-form, articulated-preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    # decoy: «le ho mostrate» is a correct participle agreement with «le»
    - learner: "Abbastanza bene. Questa settimana ho finito il design delle pagine principali dell'app per la palestra, e ieri le ho mostrate a Marco."
    - tutor: "Ottimo. E Marco cosa ne pensa?"
      goals: [update]
    - learner: "Gli sono piaciute, ma il problema è il cliente: ci ha promesso venti foto della palestra, ma finora ha mandato solo due."
      errors: [ci-ne]
    - tutor: "Solo due, che disastro. Ma «ha mandato solo due»: due di che cosa? Per non ripetere «foto», serve una parola prima del verbo."
      prompt: {text: "ha mandato solo due", tags: [ci-ne]}
    - learner: "Ne ha mandate solo due, sì, e sono anche brutte. Senza foto non possiamo finire le pagine, e la data si avvicina."
    - tutor: "Esatto. È un bel problema, hai ragione. Tu cosa proponi?"
      goals: [problem]
    - learner: "Io proporrei di usare delle foto gratis da Internet per adesso. Poi, quando il cliente manderà le sue, le cambieremo: ci voleranno solo dieci minuti."
      errors: [future-form]
    - tutor: "L'idea mi piace. Ma «ci voleranno»? Così sembra che le foto volino! Il futuro di «volere» non si forma così: è più corto."
      prompt: {text: "ci voleranno", tags: [future-form]}
    - learner: "Sì, ci voleranno dieci minuti al massimo, te lo prometto. Le foto gratis sono anche abbastanza belle."
      errors: [future-form]
    - tutor: "Se ci vorranno solo dieci minuti, allora va bene, facciamo così. Per quando pensi di finire tutto?"
      recast: {text: "ci voleranno", fix: "ci vorranno", tags: [future-form]}
      goals: [proposal]
    - learner: "Credo di finire entro venerdì. Però il cliente vuole vedere una prima versione già mercoledì, e mercoledì mattina io sono a la riunione con il gruppo di Milano."
      errors: [articulated-preposition]
    - tutor: "Capisco. Ma «sono a la riunione»? In italiano quel «a» e quel «la» non restano separati."
      prompt: {text: "a la riunione", tags: [articulated-preposition]}
    - learner: "Sono alla riunione fino alle dodici, scusa. Posso mandare la versione al cliente mercoledì pomeriggio? Va bene lo stesso?"
    - tutor: "Proprio così. Sì, mercoledì pomeriggio va benissimo. Allora prima versione mercoledì e tutto pronto venerdì?"
    - learner: "Sì, perfetto: mercoledì pomeriggio la prima versione e venerdì tutto il resto. Lo scrivo anche nella chat del gruppo, così lo sanno tutti."
    - tutor: "D'accordo, grazie. Passiamo al prossimo punto!"
      goals: [deadline]

- scenario: riunione-lavoro
  # facts: sondaggio tra i clienti di un negozio online di libri; trecento risposte; quasi tutti contenti, quasi la metà parla di ritardi nelle spedizioni; i dati dell'anno scorso sono nel computer di Paolo, in ferie fino a lunedì; proposta: scrivere a Paolo oggi; chiedere un parere alla signora Bianchi; presentazione giovedì alle dieci in sala
  level: B1
  persona: en-f-student
  history: [tense-aspect, relative-pronoun, object-pronoun]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    # decoy: «più di quante ne aspettavamo» is a correct partitive ne
    - learner: "Va bene, grazie. Ho finito il sondaggio con i clienti del negozio: abbiamo ricevuto trecento risposte, più di quante ne aspettavamo."
    - tutor: "Trecento, benissimo! E cosa dicono i clienti?"
      goals: [update]
    - learner: "Quasi tutti sono contenti, ma molti si lamentano delle spedizioni. Ieri ho letto tutti i commenti mentre ho aspettato il treno, e quasi la metà parlava di ritardi."
      errors: [tense-aspect]
    - tutor: "La metà è tanto. Ma «mentre ho aspettato il treno»? È una cosa che durava mentre succedeva altro: pensa al tempo del verbo."
      prompt: {text: "mentre ho aspettato", tags: [tense-aspect]}
    - learner: "Mentre aspettavo il treno, sì. Il problema è che non posso confrontare questi dati con quelli dell'anno scorso."
    - tutor: "Esatto. E perché non puoi?"
    - learner: "Perché sono nel computer di Paolo, che è in ferie fino a lunedì. Ed è lui la persona da chi ho imparato a fare queste analisi."
      errors: [relative-pronoun]
    - tutor: "Ah, Paolo, certo. Ma «la persona da chi»? Dopo una persona già nominata, «chi» non va: serve un'altra parola."
      prompt: {text: "da chi", tags: [relative-pronoun]}
      goals: [problem]
    - learner: "La persona da cui ho imparato, giusto. Comunque potrei scrivergli un messaggio oggi, perché so che legge le email anche in vacanza."
    - tutor: "Così va bene. Sì, scrivigli pure, Paolo non si arrabbia. E quando puoi presentare i risultati?"
      goals: [proposal]
    - learner: "Se mi risponde domani, posso preparare la presentazione per giovedì. Poi vorrei mandarla alla signora Bianchi e chiederlo un parere, perché conosce bene i clienti."
      errors: [object-pronoun]
    - tutor: "Buona idea. Ma «chiederlo un parere»? Il parere si chiede a qualcuno, e qui a una donna: quel «lo» non va."
      prompt: {text: "chiederlo un parere", tags: [object-pronoun]}
    - learner: "Chiederle un parere, scusa. Allora la presentazione è pronta giovedì: a che ora c'è la riunione?"
    - tutor: "Esatto. Giovedì alle dieci, qui in sala. Ti va bene?"
    - learner: "Sì, alle dieci va benissimo. Preparo anche qualche grafico con i commenti più importanti, così è più chiaro per tutti."
    - tutor: "Ottimo, allora giovedì alle dieci. Grazie, a giovedì!"
      goals: [deadline]

- scenario: riunione-lavoro
  # facts: sala trovata per l'evento di ottobre, centocinquanta persone, duemila euro per la giornata; il cuoco del catering è partito per la Spagna fino a novembre; mancano sei settimane; un amico ha un ristorante vicino e fa catering; menù vegetariano per almeno venti persone; finora hanno risposto novanta invitati, le altre risposte entro la fine del mese; preventivo entro venerdì
  level: B1
  persona: en-m-traveller
  history: [auxiliary-choice, conditional-form, preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Bene, abbiamo finalmente trovato la sala per l'evento di ottobre. Può contenere centocinquanta persone e costa duemila euro per tutta la giornata."
    - tutor: "Ottimo prezzo. E per mangiare è già tutto confermato?"
      goals: [update]
    - learner: "Purtroppo no, ed è questo il problema. La ditta del catering ha telefonato venerdì e ha detto che il loro cuoco ha partito per la Spagna e non torna fino a novembre."
      errors: [auxiliary-choice]
    - tutor: "Proprio adesso! Ma «il cuoco ha partito»? Con «partire», il passato non si fa con «avere»."
      prompt: {text: "ha partito", tags: [auxiliary-choice]}
    - learner: "Il cuoco è partito, sì, quindi non possono più lavorare per noi. E mancano solo sei settimane all'evento."
    - tutor: "Giusto. Sei settimane non sono tante: hai già un'idea?"
      goals: [problem]
    - learner: "Sì. Un mio amico ha un ristorante qui vicino e fa anche catering per le feste. Potremmo chiedergli un preventivo: io lo chiamarei oggi stesso, se sei d'accordo."
      errors: [conditional-form]
    - tutor: "Mi sembra una buona idea. Ma «lo chiamarei»? Pensi a «parlerei»: anche «chiamare» fa allo stesso modo."
      prompt: {text: "chiamarei", tags: [conditional-form]}
    - learner: "Lo chiamerei oggi stesso, sì. Ma devo chiedere anche un menù vegetariano? L'anno scorso alcuni clienti si sono lamentati."
    - tutor: "Esatto. Sì, chiedi anche un menù vegetariano, per almeno venti persone. Entro quando puoi avere il preventivo?"
      goals: [proposal]
      new: [{lemma: preventivo, gloss: quote}]
    - learner: "Il mio amico è sempre veloce, quindi penso entro venerdì. Però il prezzo dipende di quante persone vengono: abbiamo già le risposte degli invitati?"
      errors: [preposition]
    - tutor: "Finora hanno risposto in novanta, e le altre risposte arrivano entro la fine del mese. Ma «dipende di»? Dopo «dipendere» si usa un'altra parola."
      prompt: {text: "dipende di", tags: [preposition]}
    - learner: "Sì, il prezzo dipende di quante persone confermano, perché per il mio amico cambia molto."
      errors: [preposition]
    - tutor: "Dipende da quante persone confermano, certo. Per ora digli novanta, e mandami il preventivo entro venerdì, va bene?"
      recast: {text: "dipende di", fix: "dipende da", tags: [preposition]}
      new: [{lemma: preventivo, gloss: quote}]
    - learner: "Perfetto, entro venerdì ti mando il preventivo con i due menù. Se ci sono problemi, ti scrivo subito."
    - tutor: "D'accordo, allora a venerdì. Grazie, ottimo lavoro!"
      goals: [deadline]

- scenario: smartworking
  # facts: insegna spagnolo in una scuola di lingue; tre giorni in classe, due giorni lezioni online da casa; si sveglia più tardi, risparmia un'ora di autobus al giorno; si sente sola, studenti meno attenti; una studentessa è uscita dalla lezione senza salutare; preferirebbe sempre la classe; Andrea lavora in banca, da casa il venerdì; parlerà con il direttore il mese prossimo
  level: B1
  persona: es-f-teacher
  history: [comparative, subjunctive-use, participle-agreement]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Un po' tutti e due. Insegno spagnolo in una scuola di lingue: tre giorni vado in classe e due giorni faccio lezione online da casa."
    - tutor: "Metà e metà, allora. E come ti trovi con le lezioni online?"
      goals: [situation]
    - learner: "Mi trovo abbastanza bene. Il vantaggio più grande è il tempo: da casa mi sveglio più tardi che i miei colleghi, perché non devo prendere l'autobus."
      errors: [comparative]
    - tutor: "Che fortuna! Ma «più tardi che i miei colleghi»? Confronti te e i tuoi colleghi, cioè delle persone: con i nomi, qui «che» non va."
      prompt: {text: "più tardi che i miei colleghi", tags: [comparative]}
    - learner: "Più tardi dei miei colleghi, sì. E risparmio un'ora di autobus ogni giorno, che non è poco."
    - tutor: "Proprio così. Un'ora al giorno è tantissimo! E gli svantaggi?"
      goals: [pros]
    - learner: "Lo svantaggio è che mi sento un po' sola, e gli studenti sono meno attenti. Ieri una studentessa è uscito dalla lezione online senza dire niente!"
      errors: [participle-agreement]
    - tutor: "Senza dire niente, che brutto! Ma «una studentessa è uscito»? Con «essere», la fine del verbo va d'accordo con chi fa l'azione."
      prompt: {text: "è uscito", tags: [participle-agreement]}
    # decoy: «come se niente fosse» is a correct congiuntivo
    - learner: "È uscita senza salutare, sì! E io ho continuato a parlare come se niente fosse, davanti a uno schermo nero."
    - tutor: "Esatto. Che situazione! Allora, potendo scegliere, cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei lavorare sempre in classe. Lo so che è strano, ma per me è importante che un insegnante vede le facce degli studenti, per capire se seguono."
      errors: [subjunctive-use]
    - tutor: "Non è strano per niente. Ma «è importante che un insegnante vede»? Dopo «è importante che», il verbo prende un'altra forma."
      prompt: {text: "vede le facce", tags: [subjunctive-use]}
      goals: [preference]
    - learner: "È importante che veda le facce, sì. E tu? In banca lavori ancora da casa il venerdì?"
    - tutor: "Così va bene. Sì, il venerdì sono a casa, e per me è perfetto: mi concentro molto di più. Hai già detto al direttore cosa preferisci?"
    - learner: "Non ancora. Voglio parlare con lui il mese prossimo, ma prima devo prepararmi bene, perché la scuola risparmia molto con le lezioni online."
    - tutor: "Fai bene a prepararti. Se gli spieghi il problema degli studenti, secondo me ti ascolterà."

- scenario: smartworking
  # facts: cuoco in un ristorante di Bologna, dalle undici alle tre e dalle sei a mezzanotte; in cucina come una famiglia, alla fine del servizio mangiano insieme; ieri sera a casa all'una, i bambini dormivano; vorrebbe un ristorante piccolo solo a pranzo, i bambini dopo la scuola; Andrea lavora da casa tutta la settimana e preferirebbe un po' di ufficio; la moglie lavora da casa da due anni e si è iscritta a yoga
  level: B1
  persona: es-m-worker
  history: [articulated-preposition, conditional-form, participle-agreement]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Io? Da casa è impossibile, sono cuoco! Lavoro nel ristorante dalle undici alle tre, e poi di nuovo dalle sei fino a mezzanotte."
    - tutor: "Hai ragione, da casa non puoi cucinare per cinquanta persone! E ti piace lavorare così?"
      goals: [situation]
    - learner: "Mi piace tanto lavorare con i colleghi, in cucina siamo come una famiglia. Il vantaggio più grande è che a la fine del servizio mangiamo tutti insieme."
      errors: [articulated-preposition]
    - tutor: "Che bella cosa. Ma «a la fine»? Qui «a» e «la» diventano una parola sola."
      prompt: {text: "a la fine", tags: [articulated-preposition]}
    - learner: "Alla fine del servizio, sì. Mangiamo la pasta e parliamo di tutto, anche dei clienti più strani della serata."
    - tutor: "Esatto. Immagino le storie! E gli svantaggi?"
      goals: [pros]
    # decoy: «dormivano già da tre ore» is a correct imperfetto with «da»
    - learner: "Gli orari sono terribili. Ieri sera, per esempio, sono tornato a casa all'una, e i bambini dormivano già da tre ore."
    - tutor: "All'una, povero te. Se potessi scegliere, cosa preferiresti?"
      goals: [cons]
    - learner: "Mi piacerebbe aprire un ristorante piccolo, solo per il pranzo. Così la sera starei con la mia famiglia, e i bambini venirebbero da me dopo la scuola."
      errors: [conditional-form]
    - tutor: "Che bel sogno. Ma «venirebbero»? Il condizionale di «venire» è più corto, come il suo futuro."
      prompt: {text: "venirebbero", tags: [conditional-form]}
      goals: [preference]
    - learner: "Verrebbero da me dopo la scuola, sì, e farebbero i compiti in cucina. E tu, preferisci stare a casa o in ufficio?"
    - tutor: "Giusto. Io lavoro da casa tutta la settimana e, sinceramente, preferirei un po' di ufficio. Mi manca la gente."
    - learner: "Ti capisco. Mia moglie lavora da casa da due anni e all'inizio era contenta, ma poi si sentiva sola, e la settimana scorsa si è iscritto a un corso di yoga."
      errors: [participle-agreement]
    - tutor: "Ottima idea. Ma «mia moglie si è iscritto»? Con «essere», la fine del verbo va d'accordo con chi fa l'azione."
      prompt: {text: "si è iscritto", tags: [participle-agreement]}
    - learner: "Si è iscritta a yoga, sì, e adesso è molto più contenta. Dice che le serve per vedere un po' di gente."
    - tutor: "Esatto. E quando apri il tuo ristorante, il primo tavolo lo prenoto io!"

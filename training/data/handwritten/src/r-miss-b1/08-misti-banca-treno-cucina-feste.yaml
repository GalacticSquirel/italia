- scenario: prenotare-tavolo
  # facts: domenica a pranzo, mezzogiorno e mezzo, otto persone; la madre del cliente compie novant'anni e usa la sedia a rotelle; entrata senza scalini, tavolo vicino all'ingresso; torta di mele fatta in casa, trenta euro per otto persone; la madre gli ha insegnato a cucinare; nome Wilson, 333 445 667
  level: B1
  persona: en-m-retired
  history: [articulated-preposition, relative-pronoun, conditional-form]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per domenica a pranzo. Mia madre compie novant'anni, e vorremmo festeggiare con tutta la famiglia."
    - tutor: "Novant'anni, che bella festa! Per quante persone e a che ora?"
      goals: [book]
    # decoy: «ci servirebbero» is a correct conditional
    - learner: "Saremo in otto, verso mezzogiorno e mezzo. Mia madre usa la sedia a rotelle, quindi ci servirebbero un'entrata senza scalini e un tavolo non troppo lontano da la porta."
      errors: [articulated-preposition]
    - tutor: "L'entrata non ha scalini, e vi preparo un tavolo vicino all'ingresso. Ma «lontano da la porta»? Qui «da» e «la» diventano una parola sola."
      prompt: {text: "lontano da la porta", tags: [articulated-preposition]}
      goals: [details, special]
      new: [{lemma: mezzogiorno, gloss: noon}]
    - learner: "Sì, non lontano da la porta, perché per lei è difficile passare tra i tavoli."
      errors: [articulated-preposition]
    - tutor: "Non lontano dalla porta, certo: così passa senza problemi."
      recast: {text: "lontano da la porta", fix: "lontano dalla porta", tags: [articulated-preposition]}
    # decoys: «preparereste» and «non saprei» are correct conditionals
    - learner: "Grazie, è molto gentile. Vorrei chiederle anche un'altra cosa: preparereste una torta per lei? Le piace molto la torta di mele, e io non saprei dove comprarla."
    - tutor: "Certo, la nostra torta di mele è fatta in casa: per otto persone sono trenta euro."
    - learner: "Perfetto. Mia madre è la persona da che ho imparato a cucinare, quindi è molto difficile con il cibo: se le piace, per voi sarà un bel complimento!"
      errors: [relative-pronoun]
    - tutor: "Allora la torta deve essere perfetta! Ma «la persona da che»? Dopo «da», per una persona già nominata, «che» non va."
      prompt: {text: "da che", tags: [relative-pronoun]}
    - learner: "La persona da cui ho imparato a cucinare, sì. Le dico sempre che è più brava di tutti i ristoranti!"
    - tutor: "Esatto. Allora faremo del nostro meglio! A che nome prenoto?"
    # decoy: «se ci fosse» is a correct congiuntivo
    - learner: "A nome Wilson, W-I-L-S-O-N. Il numero è tre tre tre, quattro quattro cinque, sei sei sette. Se ci fosse un problema, mi potrebbi chiamare?"
      errors: [conditional-form]
    - tutor: "Certo, se c'è qualche problema la chiamo io. Ma «mi potrebbi»? Parla con me, con «Lei»: il condizionale di «potere» qui finisce in un altro modo."
      prompt: {text: "potrebbi", tags: [conditional-form]}
      goals: [name]
    - learner: "Mi potrebbe chiamare, scusi. Allora domenica a mezzogiorno e mezzo, otto persone e la torta di mele."
    - tutor: "Esatto: domenica a mezzogiorno e mezzo, otto persone, a nome Wilson. E tanti auguri alla signora!"

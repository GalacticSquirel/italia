    - learner: "Anche da noi si mangia tantissimo! Ma per i bambini il giorno più importante è il sei gennaio."
    - tutor: "Proprio così. E da bambina, come lo festeggiavi?"
      goals: [compare]
    - learner: "Ogni anno scrivevo una lettera ai Re, e la sera del cinque lasciavo dell'acqua per i cammelli. Un anno, però, mi svegliavo alle due e vedevo mio padre vestito da Re!"
      errors: [tense-aspect]
    - tutor: "Che sorpresa! Ma «un anno mi svegliavo alle due»? Quella notte è successa una volta sola: che tempo serve?"
      prompt: {text: "mi svegliavo alle due", tags: [tense-aspect]}
    - learner: "Sì, mi svegliavo alle due e lui era lì, con la corona in testa e i regali in mano."
      errors: [tense-aspect]
    - tutor: "«Mi sono svegliata alle due» e c'era lui con la corona? Che ricordo! E a Capodanno, cosa fate?"
      recast: {text: "mi svegliavo alle due", fix: "mi sono svegliata alle due", tags: [tense-aspect]}

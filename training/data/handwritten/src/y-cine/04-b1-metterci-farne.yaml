# y-cine, file 04 (B1): metterci, ce l'ho, non ne posso più, ne with infinitives.
- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Anche da noi si mangia tanto! Ma la festa più divertente è Capodanno: a mezzanotte si mangiano dodici chicchi d'uva."
    - tutor: "Dodici chicchi d'uva? E perché proprio dodici?"
      goals: [compare]
    - learner: "Uno per ogni rintocco delle campane. Io mangio dodici in un minuto, è difficilissimo!"
      errors: [ci-ne]
      gold: {text: "Io mangio dodici", fix: "Io ne mangio dodici"}
    - tutor: "Che difficile! Ma ascolta: «io mangio dodici»... dodici cosa? Manca una parola piccola piccola prima del verbo."
      prompt: {text: "Io mangio dodici", tags: [ci-ne]}
    - learner: "Ah: io ne mangio dodici in un minuto!"
    - tutor: "Brava! E da piccola come passavi il Natale?"
    - learner: "Andavamo sempre a casa di mia nonna, a Cordova. Ci andavamo in treno e il viaggio era lunghissimo."
    - tutor: "Che bel ricordo! Vuoi sapere una tradizione nostra?"
      goals: [past]
    - learner: "Sì! Cosa si mangia a Natale qui da voi?"
    - tutor: "Qui si mangiano tanti dolci, soprattutto il panettone."
      new: [{lemma: panettone, gloss: Christmas cake}]
      goals: [ask]
    - learner: "Che buono! Per il pranzo, cosa porto? Porto del vino?"
    - tutor: "Il vino? Ne abbiamo già tantissimo, mio zio fa il vino! Porta un dolce del tuo paese."
    - learner: "Va bene, ci penso io: preparo i turrones di mia madre!"
    - tutor: "Perfetto, non vedo l'ora di provarli!"
      goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Siamo stati in Puglia, a Lecce, io e il mio compagno. Ci siamo andati in macchina da Milano."
    - tutor: "In macchina da Milano? Che viaggio lungo!"
      goals: [where]
    - learner: "Sì, abbiamo messo dieci ore, con il traffico!"
      errors: [ci-ne]
      gold: {text: "abbiamo messo dieci ore", fix: "ci abbiamo messo dieci ore"}
    - tutor: "Dieci ore! Ma «abbiamo messo dieci ore»: messo dove? Con il tempo di un viaggio, al verbo serve un aiuto."
      prompt: {text: "abbiamo messo dieci ore", tags: [ci-ne]}
    - learner: "Mmm... sì, abbiamo messo dieci ore per arrivare."
      errors: [ci-ne]
    - tutor: "Anche noi ci abbiamo messo dieci ore l'estate scorsa, ti capisco! E il tempo com'era?"
      recast: {text: "abbiamo messo dieci ore", fix: "ci abbiamo messo dieci ore", tags: [ci-ne]}
    - learner: "Faceva molto caldo, ma c'era sempre una breeze dal mare."
      errors: [word-choice]
    - tutor: "Un po' di vento dal mare, ideale allora. E cosa avete fatto?"
      recast: {text: "una breeze", fix: "Un po' di vento", tags: [word-choice]}
      goals: [weather]
    - learner: "Abbiamo visitato Lecce, Otranto e Gallipoli, e abbiamo fatto il bagno quasi ogni giorno."
    - tutor: "Che bello! E cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il cibo, senza dubbio! Ogni mattina mangiavo un pasticciotto. Ne ho mangiati almeno quindici!"
    - tutor: "Quindici dolci in due settimane? Hai fatto benissimo!"
      goals: [best]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto. Ci penso da quando sono andato in pensione: ho tempo e voglio essere utile."
    - tutor: "Che bello! E cosa sai fare?"
      goals: [motivation]
    - learner: "Ero ingegnere, quindi so fissare un po' tutto. E mi piace stare con i ragazzi."
      errors: [word-choice]
    - tutor: "Se sai riparare un po' tutto, sei prezioso! E aiutiamo molti ragazzi a fare i compiti. Quante ore hai libere ogni settimana?"
      recast: {text: "fissare", fix: "riparare", tags: [word-choice]}
      goals: [skills]
    - learner: "Ho sei, forse sette. Il martedì e il giovedì sono libero."
      errors: [ci-ne]
      gold: {text: "Ho sei", fix: "Ne ho sei"}
    - tutor: "Ottimo! Ma «ho sei»: sei cosa? Sei ore, sei gatti? Prova a renderla completa senza dire «ore»."
      prompt: {text: "Ho sei", tags: [ci-ne]}
    - learner: "Ne ho sei, forse sette."
    - tutor: "Esatto! Allora hai due possibilità: i compiti con i ragazzi o il laboratorio di biciclette."
      goals: [time]
    - learner: "Il laboratorio è quello che mi ha parlato la signora all'ingresso?"
      errors: [relative-pronoun]
    - tutor: "Sì, proprio quello. Ma «quello che mi ha parlato»: lei ti ha parlato del laboratorio, quindi che pronome serve?"
      prompt: {text: "quello che mi ha parlato", tags: [relative-pronoun]}
    - learner: "Quello di cui mi ha parlato la signora! Allora scelgo il laboratorio, ci vengo il martedì."
    - tutor: "Perfetto! Ti aspettiamo martedì alle tre, porta le mani e la pazienza."
      goals: [choose]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Faccio tutte e due: in ufficio vado il lunedì e il giovedì, gli altri giorni lavoro da casa."
    - tutor: "E per arrivare in ufficio quanto tempo ci metti?"
      goals: [situation]
    - learner: "Metto un'ora e mezza con il treno, è lunghissimo."
      errors: [ci-ne]
      gold: {text: "Metto un'ora e mezza", fix: "Ci metto un'ora e mezza"}
    - tutor: "Un'ora e mezza, che viaggio! Ma «metto un'ora e mezza»... Guarda la mia domanda: cosa manca nella tua risposta?"
      prompt: {text: "Metto un'ora e mezza", tags: [ci-ne]}
    - learner: "Ah, ci metto un'ora e mezza."
    - tutor: "Esatto. Allora lavorare da casa ti piace di più?"
    - learner: "Sì, perché salvo tempo e soldi. E a casa sono più concentrata che in ufficio."
      errors: [word-choice]
    - tutor: "Ha senso: anch'io risparmio tempo quando lavoro da casa. E gli svantaggi?"
      recast: {text: "salvo tempo", fix: "risparmio tempo", tags: [word-choice]}
      goals: [pros]
    - learner: "A casa mi sento un po' sola. Mi mancano i colleghi e le pause caffè: ne ho bisogno!"
    - tutor: "Ti capisco benissimo. E se potessi scegliere?"
      goals: [cons]
    - learner: "Preferirei lavorare tre giorni a casa e due in ufficio. Tu cosa ne pensi?"
    - tutor: "Ne penso tutto il bene possibile: è anche la mia soluzione ideale!"
      goals: [preference]

- scenario: restituire-prodotto
  level: B1
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato due lampade da tavolo la settimana scorsa, ma una non si accende."
    - tutor: "Mi dispiace. Ha lo scontrino?"
      goals: [problem]
    - learner: "Sì, ce l'ho qui. Le ho comprate martedì scorso."
    - tutor: "Perfetto, grazie. Cosa preferisce fare?"
      goals: [proof]
    - learner: "Vorrei restituire una e avere i soldi indietro."
      errors: [ci-ne]
      gold: {text: "restituire una", fix: "restituirne una"}
    - tutor: "Va bene. Ma «restituire una»: una cosa? Con l'infinito, la piccola parola si attacca alla fine del verbo."
      prompt: {text: "restituire una", tags: [ci-ne]}
    - learner: "Vorrei restituire una lampada, quella rotta."
    - tutor: "Anche così va benissimo! Le faccio subito il rimborso, oppure preferisce cambiarla?"
      goals: [request]
    - learner: "Mmm... se è uguale, la cambio. Ci sono altre lampade come questa?"
    - tutor: "Sì, ce ne sono ancora due in magazzino. Gliene porto una?"
    - learner: "Sì, grazie. Allora la cambio, così ho ancora due lampade uguali."
    - tutor: "Perfetto, gliela porto subito. Torno tra due minuti!"
      goals: [agree]

- scenario: prenotare-visita
  level: B1
  persona: es-f-teacher
  history: [ci-ne]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno. Vorrei prenotare una visita da un dermatologo, per favore."
    - tutor: "Certo. Ha già la richiesta del medico di famiglia?"
      goals: [type]
    - learner: "La richiesta? Sì, ho. Me l'ha data ieri."
      errors: [ci-ne]
      gold: {text: "Sì, ho", fix: "Sì, ce l'ho"}
    - tutor: "Bene. Ma «sì, ho»? Quando rispondiamo così, «avere» non sta mai da solo."
      prompt: {text: "Sì, ho", tags: [ci-ne]}
    - learner: "Ah, sì: ce l'ho."
    - tutor: "Perfetto. Il primo posto libero è giovedì 14 alle 9:30. Le va bene?"
    - learner: "Giovedì non posso, lavoro tutta la mattina. Ci sono posti la settimana dopo?"
    - tutor: "Sì, ce ne sono due: martedì 19 alle 17 o mercoledì 20 alle 18."
    - learner: "Martedì alle cinque è perfetto. Quanto costa la consulta?"
      errors: [word-choice]
    - tutor: "Con la richiesta, la visita costa solo 36 euro. Porti anche la tessera sanitaria."
      recast: {text: "la consulta", fix: "la visita", tags: [word-choice]}
      new: [{lemma: tessera, gloss: card}, {lemma: sanitario, gloss: health}]
      goals: [availability, cost]
    - learner: "Va bene. Allora martedì 19 alle cinque, con la richiesta e la tessera."
    - tutor: "Esatto, tutto confermato. Arrivederci e buona giornata!"
      goals: [confirm]

- scenario: biglietto-treno
  level: B1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno. Devo andare a Firenze domani mattina. Quanto ci mette il treno veloce?"
    - tutor: "Da Roma ci mette un'ora e mezza. C'è un treno alle 8:10 e uno alle 9:40."
      goals: [destination]
    - learner: "Prendo quello delle 8:10. One way, perché torno in autobus con amici."
      errors: [word-choice]
    - tutor: "Solo andata, va bene. Prima o seconda classe?"
      recast: {text: "One way", fix: "Solo andata", tags: [word-choice]}
      goals: [type]
    - learner: "Seconda. Ci sono ancora posti vicino al finestrino?"
    - tutor: "Sì, ne restano tre."
    - learner: "Perfetto, allora prendo uno, grazie."
      errors: [ci-ne]
      gold: {text: "prendo uno", fix: "ne prendo uno"}
    - tutor: "Uno... uno cosa? Un treno intero? Mi manca una parola nella frase."
      prompt: {text: "prendo uno", tags: [ci-ne]}
    - learner: "Ah, ah, no! Ne prendo uno."
    - tutor: "Ecco fatto: carrozza 5, posto 12, vicino al finestrino."
      new: [{lemma: carrozza, gloss: coach}]
      goals: [class]
    - learner: "Grazie. E da quale platform parte il treno?"
      errors: [word-choice]
    - tutor: "Di solito dal binario 9, ma controlli sempre il tabellone. Buon viaggio!"
      recast: {text: "platform", fix: "binario", tags: [word-choice]}
      goals: [platform]
      new: [{lemma: tabellone, gloss: departure board}]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Mi chiamo Daniel, abito al piano di sotto. Mi scusi se la disturbo a quest'ora."
    - tutor: "Piacere, Daniel. Nessun disturbo, mi dica."
      goals: [greet]
    - learner: "Ecco, da due settimane sento musica fino all'una di notte. Il lavoro comincia alle sette e non posso più."
      errors: [ci-ne]
      gold: {text: "non posso più", fix: "non ne posso più"}
    - tutor: "Oh, mi dispiace! Ma «non posso più»: non può più fare cosa? Per dire che è stanco di una situazione, alla frase manca un pezzo."
      prompt: {text: "non posso più", tags: [ci-ne]}
    - learner: "Ah, sì: non ne posso più! Scusi, ma è vero."
    - tutor: "Ha ragione, è mio figlio: suona la chitarra elettrica. Non me ne ero accorto."
      new: [{lemma: chitarra, gloss: guitar}, {lemma: accorgersi, gloss: to notice}]
      goals: [problem]
    - learner: "Potrebbe chiedergli di suonare solo fino alle dieci di sera?"
    - tutor: "Sì, certo. Gli parlo io stasera stessa."
      goals: [request]
    - learner: "Grazie mille. E nel fine settimana suona anche fino a mezzanotte, se vuole: non mi da fastidio."
      errors: [spelling]
    - tutor: "Che gentile! Ma attenzione a «da»: in quella frase il verbo vuole un segno in più."
      prompt: {text: "non mi da fastidio", tags: [spelling]}
    - learner: "Ah, «dà» con l'accento: non mi dà fastidio."
    - tutor: "Perfetto! Allora d'accordo: fino alle dieci in settimana, fino a tardi il sabato. Grazie a lei, Daniel."
      goals: [compromise]

# Broad-coverage B2 dialogues: at an exhibition and at the book club.
- scenario: arte-mostra
  level: B2
  persona: es-m-worker
  history: [noun-gender, subjunctive-use]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi piace tanto! È una natura morta con pane, formaggio e la miele in un vaso."
    errors: [noun-gender]
  - tutor: "Da cuoco, eh? Ma «la miele»: in italiano questa parola ha un altro genere. Lo sai?"
    prompt: {text: "la miele", tags: [noun-gender]}
  - learner: "Sì, la miele, nel vaso di vetro."
    errors: [noun-gender]
  - tutor: "Il miele, sì, dentro quel vaso di vetro: guarda quanta luce prende."
    recast: {text: "la miele", fix: "il miele", tags: [noun-gender]}
    goals: [react]
  - learner: "È vero. Lo sfondo è tutto scuro e la luce viene da sinistra, quindi il pane sembra vero. Chi l'ha dipinto?"
  - tutor: "Un pittore spagnolo del Seicento, ma il suo nome non si conosce. Secondo te, che cosa voleva dire?"
    goals: [describe]
  - learner: "Penso che voleva dire che il cibo semplice è il più bello."
    errors: [subjunctive-use]
  - tutor: "Mi piace. Ma «penso che voleva»: dopo «penso che», il verbo non resta così. Come diventa?"
    prompt: {text: "che voleva dire", tags: [subjunctive-use]}
  - learner: "Penso che voleva dire... che il cibo semplice è bello?"
    errors: [subjunctive-use]
  - tutor: "Può darsi che volesse dire proprio questo: la bellezza delle cose di tutti i giorni."
    recast: {text: "che voleva dire", fix: "che volesse dire", tags: [subjunctive-use]}
    goals: [interpret]
  - learner: "Mi ricorda i quadri che ho visto al Prado, a Madrid. Anche lì la frutta sembra vera, però sono più grandi che questo."
    errors: [comparative]
  - tutor: "Ottimo esempio. Ma «più grandi che questo»: quando metti a confronto due quadri, che parola usi dopo «più grandi»?"
    prompt: {text: "più grandi che questo", tags: [comparative]}
  - learner: "Sì, sono più grandi che questo, molto più grandi."
    errors: [comparative]
  - tutor: "Certo, al Prado le nature morte sono più grandi di questo quadro, a volte enormi. E la luce dei pittori spagnoli è ancora più forte, quasi teatrale."
    recast: {text: "più grandi che questo", fix: "più grandi di questo", tags: [comparative]}
    goals: [compare]

- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [article-use, adjective-agreement]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Onestamente? Non capisco niente. Sono solo tre linee rosse su tela bianca."
    errors: [article-use]
  - tutor: "Ah ah, sei sincera! Ma «su tela bianca», così da solo, non suona naturale. Cosa manca davanti a «tela»?"
    prompt: {text: "su tela bianca", tags: [article-use]}
  - learner: "Su una tela bianca. Tre linee e basta!"
  - tutor: "Esatto. Ma guardalo meglio: cosa vedi, oltre alle linee?"
    goals: [react]
  - learner: "Le linee non sono dritte, sono un po' storte. E il bianco non è tutto uguale: in alcuni punti è più grigio."
  - tutor: "Brava, hai l'occhio. Quelle differenze sono state create con tanti strati di colore, uno sopra l'altro."
    goals: [describe]
  - learner: "Davvero? Allora forse l'artista vuole mostrare che anche le cose semplici sono complicati."
    errors: [adjective-agreement]
  - tutor: "Interessante! Ma «le cose semplici sono complicati»: «cose» è femminile. Come si accorda l'ultima parola?"
    prompt: {text: "sono complicati", tags: [adjective-agreement]}
  - learner: "Le cose semplici sono complicati, sì."
    errors: [adjective-agreement]
  - tutor: "Proprio così: anche le cose semplici sono complicate, se le guardi da vicino. È un'idea molto moderna."
    recast: {text: "sono complicati", fix: "sono complicate", tags: [adjective-agreement]}
    goals: [interpret]
  - learner: "Mi ricorda Rothko, che ho visto a Londra. Ma Rothko usa colori più caldi, e io preferisco."
    errors: [object-pronoun]
  - tutor: "Bel confronto! Ma «e io preferisco»: preferisci chi? Manca un pronome."
    prompt: {text: "io preferisco", tags: [object-pronoun]}
  - learner: "Io lo preferisco. Rothko è più caldo."
  - tutor: "Ecco. E hai ragione: i suoi colori ti abbracciano, questi invece ti tengono un po' a distanza."
    goals: [compare]

- scenario: arte-mostra
  level: B2
  persona: en-m-retired
  history: [subjunctive-use, demonstrative]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "È impressionante. Quel affresco è enorme, e i colori sono ancora vivissimi dopo cinquecento anni."
    errors: [demonstrative]
  - tutor: "Vero? Ma «quel affresco»: davanti a una parola che comincia per «a», «quel» cambia forma. Come?"
    prompt: {text: "Quel affresco", tags: [demonstrative]}
  - learner: "Sì, quel affresco è enorme!"
    errors: [demonstrative]
  - tutor: "Quell'affresco è enorme, sì. E pensa che è stato restaurato solo dieci anni fa: prima era quasi nero."
    recast: {text: "quel affresco", fix: "Quell'affresco", tags: [demonstrative]}
    goals: [react]
  - learner: "Davvero? Allora è stato pulito molto bene. Al centro vedo una donna con un bambino, e intorno molti angeli."
  - tutor: "Sì, è una Madonna con il Bambino. Guarda come la prospettiva porta l'occhio verso di lei."
    goals: [describe]
  - learner: "È vero. Credo che il pittore vuole dire che lei è il centro del mondo."
    errors: [subjunctive-use]
  - tutor: "Bella idea. Ma «credo che il pittore vuole»: dopo «credo che», quale modo usiamo?"
    prompt: {text: "che il pittore vuole dire", tags: [subjunctive-use]}
  - learner: "Credo che il pittore vuole dire questo, sì."
    errors: [subjunctive-use]
  - tutor: "Sì, è possibile che il pittore voglia dire proprio questo: tutto il quadro gira intorno a lei."
    recast: {text: "che il pittore vuole dire", fix: "che il pittore voglia dire", tags: [subjunctive-use]}
    goals: [interpret]
  - learner: "Mi ricorda un quadro che ho visto a Washington, ma era più piccolo e meno luminoso che questo."
    errors: [comparative]
  - tutor: "Interessante. Ma «meno luminoso che questo»: quando metti a confronto due quadri, che parola serve dopo «luminoso»?"
    prompt: {text: "meno luminoso che questo", tags: [comparative]}
  - learner: "Meno luminoso di questo, giusto."
  - tutor: "Esatto. Forse era di un allievo dello stesso maestro: a quell'epoca si lavorava così, tutti insieme nella bottega."
    goals: [compare]
    new: [{lemma: bottega, gloss: (artist's) workshop}]

- scenario: arte-mostra
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use, comparative]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "È una foto, no? Mi mette tristezza: c'è un uomo solo con una maleta in una stazione vuota, e tanta nebbia."
    errors: [word-choice]
  - tutor: "Sì, un uomo solo con una valigia, in mezzo alla nebbia. È stata scattata nel 1953, a Milano. Secondo te chi è?"
    recast: {text: "una maleta", fix: "una valigia", tags: [word-choice]}
    goals: [react, describe]
  - learner: "Forse è un uomo del Sud che va a lavorare in Germania. Spero che trovi lavoro e che possa tornare presto dalla sua famiglia."
  - tutor: "Che bella lettura, e molto probabile in quegli anni: partivano in tantissimi."
    goals: [interpret]
  - learner: "Mi ricorda mio nonno, che è partito per l'Argentina. Peccato che non ci sono più foto di quel periodo."
    errors: [subjunctive-use]
  - tutor: "Che storia. Ma «peccato che non ci sono»: dopo «peccato che», che modo usiamo?"
    prompt: {text: "che non ci sono più foto", tags: [subjunctive-use]}
  - learner: "Peccato che non ci sono più foto... di mio nonno, sì."
    errors: [subjunctive-use]
  - tutor: "È un peccato davvero che non ci siano più foto di quel periodo: sono pezzi di storia di famiglia."
    recast: {text: "che non ci sono più foto", fix: "che non ci siano più foto", tags: [subjunctive-use]}
  - learner: "Le poche foto di mio nonno erano più semplici. Questa ha una composizione più studiata che le altre."
    errors: [comparative]
  - tutor: "Hai ragione. Ma «più studiata che le altre»: quando confronti questa foto con le altre, che parola usi?"
    prompt: {text: "più studiata che le altre", tags: [comparative]}
  - learner: "Più studiata delle altre."
  - tutor: "Esatto: qui ogni elemento è stato messo al suo posto, come in un quadro del Rinascimento."
    goals: [compare]

- scenario: film-libro
  level: B2
  persona: en-m-heritage
  history: [relative-pronoun, imperfetto-form]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io! Ho letto «Il nome della rosa» di Umberto Eco. È un giallo che si svolge in un monastero, nel Medioevo."
  - tutor: "Un classico! Raccontaci la trama, ma senza dirci il finale."
  - learner: "Un frate e il suo giovane allievo arrivano in un monastero dove muoiono dei monaci, uno dopo l'altro. Il frate, che è molto intelligente, cerca il colpevole."
  - tutor: "Perfetto, e senza dire troppo. E com'è questo frate?"
    goals: [summary]
  - learner: "Si chiama Guglielmo. È un uomo di che tutti hanno un po' paura, perché sa troppe cose."
    errors: [relative-pronoun]
  - tutor: "Bel personaggio. Ma «un uomo di che tutti hanno paura»: dopo «di», quel «che» non funziona. Cosa ci vuole?"
    prompt: {text: "di che tutti hanno", tags: [relative-pronoun]}
  - learner: "Sì, un uomo di che tutti hanno paura."
    errors: [relative-pronoun]
  - tutor: "Un uomo di cui tutti hanno paura, perché pensa con la sua testa: nel Medioevo era pericoloso. E a te è piaciuto?"
    recast: {text: "di che tutti hanno", fix: "di cui tutti hanno", tags: [relative-pronoun]}
    goals: [characters]
  - learner: "Molto, ma alcune parti erano troppo lunghe: Eco descrivava ogni dettaglio, e a volte mi annoiavo."
    errors: [imperfetto-form]
  - tutor: "Capita a tanti! Ma «descrivava»: «descrivere» finisce in -ere, quindi all'imperfetto cambia una lettera. Quale?"
    prompt: {text: "descrivava", tags: [imperfetto-form]}
    goals: [opinion]
  - learner: "Descriveva ogni dettaglio, sì. Però lo consiglierei a chi ama la storia e ha pazienza."
  - tutor: "Esatto. Ottimo consiglio: è un libro da leggere con calma, magari d'estate. Grazie, chi è il prossimo?"
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-f-erasmus
  history: [tense-aspect, false-friend]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho letto «L'amica geniale» di Elena Ferrante. Racconta l'amicizia tra due bambine in un quartiere povero di Napoli."
  - tutor: "Bellissimo. E come va avanti la storia, senza dirci troppo?"
  - learner: "Le bambine crescono insieme. Lila è la più brava della scuola, ma i suoi genitori non la lasciano continuare a studiare."
  - tutor: "Perfetto, hai detto le cose importanti senza svelare niente. E chi è il personaggio che ti ha colpito di più?"
    goals: [summary]
  - learner: "Lila, senza dubbio. È molto lista: capisce tutto prima degli altri, ma è anche un po' cattiva."
    errors: [false-friend]
  - tutor: "Sì, Lila è molto sveglia, quasi un genio, ma anche difficile da amare. E il libro ti è piaciuto?"
    recast: {text: "molto lista", fix: "molto sveglia", tags: [false-friend]}
    goals: [characters]
    new: [{lemma: sveglio, gloss: "sharp, clever"}]
  - learner: "Tantissimo, perché mi ricorda la mia infanzia. Anche la mia migliore amica, alle elementari, ha sempre vinto tutte le gare."
    errors: [tense-aspect]
  - tutor: "Che coincidenza! Ma «alle elementari ha sempre vinto»: parli di un'abitudine di quegli anni. Che tempo ci vuole?"
    prompt: {text: "ha sempre vinto tutte le gare", tags: [tense-aspect]}
  - learner: "Sì, alle elementari ha sempre vinto tutte le gare."
    errors: [tense-aspect]
  - tutor: "Quindi anche la tua amica vinceva sempre tutte le gare! Allora capisco perché questo libro ti ha toccato così."
    recast: {text: "ha sempre vinto tutte le gare", fix: "vinceva sempre tutte le gare", tags: [tense-aspect]}
    goals: [opinion]
  - learner: "Lo consiglierei soprattutto alle persone che hanno una amica da tanti anni."
    errors: [article-form]
  - tutor: "Che bel consiglio. Ma «una amica»: davanti ad «amica», l'articolo perde una lettera. Come diventa?"
    prompt: {text: "una amica", tags: [article-form]}
  - learner: "Alle persone che hanno un'amica da tanti anni."
  - tutor: "Perfetto. E io aggiungo: anche a chi un'amica così l'ha persa. Grazie, chi vuole continuare?"
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  history: [relative-pronoun, word-choice]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho letto «La ragazza nella nebbia» di Donato Carrisi. È un thriller ambientato in un piccolo paese di montagna."
  - tutor: "Ah, che atmosfera! Di cosa parla?"
  - learner: "Una ragazza scompare la sera prima di Natale. Arriva un poliziotto famoso, il quale usa la televisione per mettere paura a tutto il paese."
  - tutor: "Interessante: un poliziotto che lavora davanti alle telecamere. E che tipo è?"
    goals: [summary]
  - learner: "È un uomo ambizioso, che non gli importa la verità: vuole solo un colpevole."
    errors: [relative-pronoun]
  - tutor: "Che personaggio! Ma «che non gli importa»: qui «che» e «gli» non stanno bene insieme. Come lo diresti con un solo pronome?"
    prompt: {text: "che non gli importa", tags: [relative-pronoun]}
  - learner: "Sì, è un uomo che non gli importa niente della verità."
    errors: [relative-pronoun]
  - tutor: "Un uomo a cui non importa la verità: fa quasi paura. E il libro ti è piaciuto?"
    recast: {text: "che non gli importa", fix: "a cui non importa", tags: [relative-pronoun]}
    goals: [characters]
  - learner: "Abbastanza. La storia è tesa, ma il finale non fa senso, secondo me."
    errors: [word-choice]
  - tutor: "Capisco: se il finale non ha senso, rovina un po' tutto il libro. A chi lo consiglieresti, allora?"
    recast: {text: "non fa senso", fix: "non ha senso", tags: [word-choice]}
    goals: [opinion]
  - learner: "Alle persone a cui piacciono le storie scure, come a mio marito. Lui l'ha letto in due giorni!"
  - tutor: "Allora è un buon segno! Lo metto nella lista del prossimo mese: adesso lo voglio leggere anch'io."
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: en-m-traveller
  history: [tense-aspect, hypothetical]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io! Ho letto «Un indovino mi disse» di Tiziano Terzani. È la storia di un anno in cui lui ha viaggiato in Asia senza prendere aerei."
  - tutor: "Che bella scelta. E perché senza aerei?"
  - learner: "Perché un indovino gli aveva detto che, se avrebbe volato quell'anno, sarebbe morto."
    errors: [hypothetical]
  - tutor: "Che inizio! Ma «se avrebbe volato»: dopo questo «se», il condizionale non va. Che forma ci vuole?"
    prompt: {text: "se avrebbe volato", tags: [hypothetical]}
  - learner: "Se avrebbe volato... sarebbe morto, sì."
    errors: [hypothetical]
  - tutor: "Esatto: se avesse volato quell'anno, sarebbe morto. E così ha viaggiato in treno, in nave e a piedi."
    recast: {text: "se avrebbe volato", fix: "se avesse volato", tags: [hypothetical]}
    goals: [summary]
  - learner: "Terzani è un personaggio incredibile, curioso e coraggioso. Viaggiando piano, ha realizzato che la lentezza è importante."
    errors: [false-friend]
  - tutor: "Sì, ha capito che la lentezza è un valore: un'idea molto moderna, per un giornalista sempre di corsa. Ti è piaciuto?"
    recast: {text: "ha realizzato", fix: "ha capito", tags: [false-friend]}
    goals: [characters]
  - learner: "Moltissimo. Quando ero in Vietnam, ogni sera ho letto un capitolo e il giorno dopo andavo a vedere i posti del libro."
    errors: [tense-aspect]
  - tutor: "Che modo fantastico di leggere! Ma «ogni sera ho letto»: è un'abitudine, come «andavo». Che tempo serve?"
    prompt: {text: "ogni sera ho letto", tags: [tense-aspect]}
    goals: [opinion]
  - learner: "Ogni sera leggevo un capitolo. Lo consiglio a tutti quelli che amano viaggiare, e anche a chi non può farlo."
  - tutor: "Perfetto. E hai ragione: è un libro che ti fa viaggiare anche dal divano di casa. Grazie, chi è il prossimo?"
    goals: [recommend]

# Broad-coverage B2 dialogues: planning a wedding and a radio interview about living in Italy.
- scenario: organizzare-matrimonio
  level: B2
  persona: es-f-teacher
  history: [comparative, false-friend]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Immaginiamo una festa semplice in campagna, con molti fiori e musica dal vivo. Il mio fidanzato è italiano e ha venti primi."
    errors: [false-friend]
  - tutor: "Venti cugini? Allora sarà una festa bella grande! Quanti invitati pensate di avere, in tutto?"
    recast: {text: "venti primi", fix: "venti cugini", tags: [false-friend]}
    goals: [vision]
  - learner: "Circa centoventi. Il budget massimo è venticinquemila euro, ma preferiremmo spendere meno."
  - tutor: "È un budget giusto per centoventi persone, se scegliamo bene la location."
    goals: [budget]
  - learner: "Abbiamo visto due posti: un agriturismo vicino a Siena e una villa sul lago. L'agriturismo è più economico che la villa, ma la villa è più elegante."
    errors: [comparative]
  - tutor: "Due belle scelte. Ma «più economico che la villa»: quando confronta due posti, che parola usa dopo «economico»?"
    prompt: {text: "più economico che la villa", tags: [comparative]}
  - learner: "Sì, è più economico che la villa. Io sceglierei l'agriturismo, perché lì possono dormire anche gli invitati spagnoli."
    errors: [comparative]
  - tutor: "L'agriturismo è più economico della villa e lì possono dormire anche gli invitati spagnoli: mi sembra un'ottima scelta."
    recast: {text: "più economico che la villa", fix: "più economico della villa", tags: [comparative]}
    goals: [choices]
  - learner: "Un'ultima cosa: voglio che il fotografo consegna tutte le foto entro un mese."
    errors: [subjunctive-use]
  - tutor: "Richiesta giusta. Ma «voglio che il fotografo consegna»: dopo «voglio che», il verbo cambia modo. Come?"
    prompt: {text: "che il fotografo consegna", tags: [subjunctive-use]}
  - learner: "Voglio che il fotografo consegna le foto... entro un mese."
    errors: [subjunctive-use]
  - tutor: "Perfetto, nel contratto chiediamo che il fotografo consegni le foto entro un mese, altrimenti paga una penale."
    recast: {text: "che il fotografo consegna", fix: "che il fotografo consegni", tags: [subjunctive-use]}
    goals: [conditions]
  - learner: "Benissimo. E il preventivo con tutti i dettagli, me lo manda per email?"
  - tutor: "Certo, glielo mando domani mattina. Poi ci rivediamo per la firma."

- scenario: organizzare-matrimonio
  level: B2
  persona: en-m-heritage
  history: [combined-pronouns, piacere]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Vorremmo un matrimonio in Calabria, nel paese dei miei nonni. La mia fidanzata piace molto le tradizioni del Sud."
    errors: [piacere]
  - tutor: "Che bella idea. Ma «la mia fidanzata piace»: è lei che piace a qualcuno, o sono le tradizioni a piacere a lei?"
    prompt: {text: "La mia fidanzata piace", tags: [piacere]}
  - learner: "Alla mia fidanzata piacciono molto le tradizioni del Sud."
  - tutor: "Esatto. Che bello tornare al paese dei nonni per un giorno così!"
    goals: [vision]
  - learner: "Il problema è il budget: abbiamo solo quindicimila euro e due cento invitati."
    errors: [spelling]
  - tutor: "Vediamo. Ma così, «due cento», non va: in italiano questo numero si scrive in un altro modo. Come?"
    prompt: {text: "due cento", tags: [spelling]}
  - learner: "Duecento, tutto attaccato. Duecento invitati."
  - tutor: "Esatto. Con duecento invitati il budget è stretto, ma al Sud molti ristoranti fanno prezzi buoni."
    goals: [budget]
  - learner: "Abbiamo due possibilità: un ristorante sul mare o una vecchia masseria in collina. Quale ci consiglierebbe?"
  - tutor: "Io vi consiglierei la masseria: costa meno e c'è più spazio per ballare."
  - learner: "Va bene, prendiamo la masseria. Però vogliamo assaggiare il menù prima. Ci lo può organizzare?"
    errors: [combined-pronouns]
  - tutor: "Ottima scelta. Ma «ci lo»: quando «ci» sta davanti a «lo», cambia forma. Come?"
    prompt: {text: "Ci lo può organizzare", tags: [combined-pronouns]}
    goals: [choices]
  - learner: "Ce lo può organizzare, per favore?"
  - tutor: "Certo, ve lo organizzo il mese prossimo: assaggiate tutto e poi decidete insieme."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-professional
  history: [noun-gender, subjunctive-use]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Lo immaginiamo moderno e minimalista: pochi colori, tanto bianco e una cena elegante, niente balli di gruppo."
  - tutor: "Uno stile molto preciso, mi piace. E quanti sarete?"
    goals: [vision]
  - learner: "Ottanta invitati. Per il budget pensavamo a trentamila euro, ma dipende dal location."
    errors: [noun-gender]
  - tutor: "Un budget comodo. Ma «dal location»: in italiano «location» è femminile. Come diventa?"
    prompt: {text: "dal location", tags: [noun-gender]}
  - learner: "Dipende dal location, sì."
    errors: [noun-gender]
  - tutor: "Certo, molto dipende dalla location. Ne ho due per voi: un vecchio convento in città e una villa a venti chilometri."
    recast: {text: "dal location", fix: "dalla location", tags: [noun-gender]}
    goals: [budget]
    new: [{lemma: convento, gloss: convent}]
  - learner: "Io preferirei il convento: gli invitati non dovranno guidare dopo la cena."
  - tutor: "Giusto, così è anche più sicuro per tutti."
    goals: [choices]
  - learner: "Ho tre condizioni. Primo, voglio che lei mi aggiorna ogni settimana."
    errors: [subjunctive-use]
  - tutor: "Mi sembra giusto. Ma «voglio che lei mi aggiorna»: dopo «voglio che», quale modo usiamo?"
    prompt: {text: "che lei mi aggiorna", tags: [subjunctive-use]}
  - learner: "Voglio che lei mi aggiorni ogni settimana. Secondo, il fotografo non deve usare il flash durante la cerimonia."
  - tutor: "Esatto, e il flash lo vietiamo. E la terza condizione?"
  - learner: "Il menù sarà vegetariano. Lo diremo agli invitati con l'invito, così nessuno sarà sorpreso."
  - tutor: "Perfetto, lo scrivo subito tra le condizioni del contratto."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-m-worker
  history: [verb-form, possessive]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Io sono cuoco, quindi la cosa più importante per me è il cibo. Voglio un pranzo lungo, all'italiana, con tanti piatti."
  - tutor: "Un cuoco che si sposa: il menù sarà la parte più difficile! E quanto pensate di spendere?"
    goals: [vision]
  - learner: "Non tanto. Mia fidanzata e io guadagniamo poco, quindi diciamo diecimila euro al massimo."
    errors: [possessive]
  - tutor: "Capisco. Ma «mia fidanzata»: con «fidanzata», l'articolo davanti ci vuole o no?"
    prompt: {text: "Mia fidanzata", tags: [possessive]}
  - learner: "La mia fidanzata e io guadagniamo poco. Abbiamo visto una trattoria in collina, molto bella, e una sala in città."
  - tutor: "Esatto. Con diecimila euro si può fare una bella festa. La trattoria ha l'ascensore? Per i nonni conta molto."
    goals: [budget]
  - learner: "Sì, c'è. Allora sciegliamo la trattoria."
    errors: [verb-form]
  - tutor: "Bene! Ma «sciegliamo»: il verbo è giusto, la forma no. Ci ripensa?"
    prompt: {text: "sciegliamo la trattoria", tags: [verb-form]}
  - learner: "Sciegliamo la trattoria, sì."
    errors: [verb-form]
  - tutor: "Perfetto, allora scegliamo la trattoria: chiamo il proprietario domani mattina."
    recast: {text: "sciegliamo la trattoria", fix: "scegliamo la trattoria", tags: [verb-form]}
    goals: [choices]
  - learner: "Ma c'è una condizione: è necessario che io parlo con il cuoco della trattoria prima."
    errors: [subjunctive-use]
  - tutor: "Da collega a collega, certo! Ma «è necessario che io parlo»: dopo «è necessario che», che modo serve?"
    prompt: {text: "che io parlo", tags: [subjunctive-use]}
  - learner: "È necessario che io parli con il cuoco prima di decidere il menù."
  - tutor: "Esatto. Le organizzo un incontro con lui la settimana prossima, così decidete il menù insieme."
    goals: [conditions]

- scenario: vita-in-italia
  level: B2
  persona: en-f-student
  history: [adjective-agreement, auxiliary-choice]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito! Ho studiato storia dell'arte, e volevo vedere dal vivo le opere che studiavo sui libri."
  - tutor: "Che bel motivo. E dove vive adesso?"
    goals: [story]
  - learner: "A Firenze, da tre anni. La cosa più difficile è stata la burocrazia: per aprire un conto sono andata in banca cinque volte, e ogni volta mi chiedevano un documento diverso."
  - tutor: "Una storia che molti ascoltatori conoscono bene, purtroppo!"
    goals: [difficulties]
  - learner: "Sì! Ma ora mi sono abituata. Ho cambiato molto: adesso mangio con calma e mi arrabbio meno."
    errors: [auxiliary-choice]
  - tutor: "Interessante. Ma «ho cambiato molto»: qui è lei a diventare diversa. Con questo significato, che verbo va davanti?"
    prompt: {text: "Ho cambiato molto", tags: [auxiliary-choice]}
  - learner: "Sono cambiata molto, sì."
  - tutor: "Esatto. Mangiare con calma, poi, è un'abitudine molto italiana!"
    goals: [change]
  - learner: "Infatti! E le mie amiche inglese dicono che adesso parlo con le mani."
    errors: [adjective-agreement]
  - tutor: "Ah ah! Ma «le mie amiche inglese»: sono tante amiche, quindi anche «inglese» deve cambiare. Come?"
    prompt: {text: "amiche inglese", tags: [adjective-agreement]}
  - learner: "Le mie amiche inglese, sì, lo dicono sempre."
    errors: [adjective-agreement]
  - tutor: "Le sue amiche inglesi hanno ragione: l'ho notato anch'io durante l'intervista! E che consiglio darebbe a chi vuole trasferirsi?"
    recast: {text: "amiche inglese", fix: "amiche inglesi", tags: [adjective-agreement]}
  - learner: "Se fossi in loro, imparerei la lingua prima di partire. E avrei molta pazienza."
  - tutor: "Lingua e pazienza: un consiglio prezioso. Grazie, è stato un piacere averla con noi."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [subjunctive-use, hypothetical]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Sono venuto per amore. Mia moglie è di Bologna: l'ho conosciuta a Buenos Aires, quando faceva l'Erasmus."
  - tutor: "Una storia romantica! E com'è stato l'arrivo?"
    goals: [story]
  - learner: "Difficile. In Argentina avevo già lavorato come cuoco per dieci anni, ma qui nessuno mi conosceva e ho dovuto ricominciare a lavare i piatti."
  - tutor: "Ricominciare da zero: che strada! Non dev'essere stato facile."
    goals: [difficulties]
  - learner: "No. Però credo che quell'esperienza è stata utile."
    errors: [subjunctive-use]
  - tutor: "Lo immagino. Ma «credo che quell'esperienza è stata»: dopo «credo che», che forma ci vuole?"
    prompt: {text: "che quell'esperienza è stata utile", tags: [subjunctive-use]}
  - learner: "Credo che quell'esperienza è stata utile, sì."
    errors: [subjunctive-use]
  - tutor: "Immagino che quell'esperienza sia stata utile, anche se dura. E lei, in questi anni, come è cambiato?"
    recast: {text: "che quell'esperienza è stata utile", fix: "che quell'esperienza sia stata utile", tags: [subjunctive-use]}
  - learner: "Adesso sono più paziente e cucino senza fretta. Gli italiani mi hanno cambiato, soprattutto i miei suoceri."
  - tutor: "I suoceri italiani: una grande scuola di vita!"
    goals: [change]
  - learner: "Il mio consiglio? Se io sarei un ragazzo che vuole venire qui, cercherei subito un lavoro qualsiasi, per imparare la lingua."
    errors: [hypothetical]
  - tutor: "Consiglio utile. Ma «se io sarei»: dopo «se», il condizionale non funziona. Che forma usiamo?"
    prompt: {text: "Se io sarei", tags: [hypothetical]}
  - learner: "Se io fossi un ragazzo che vuole venire qui, cercherei subito un lavoro qualsiasi."
  - tutor: "Esatto. Lavorare per imparare la lingua: un consiglio da vero cuoco. Grazie di essere stato con noi."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: en-m-traveller
  history: [passive, future-form]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti! Sono venuto in Sardegna per una vacanza di due settimane, e ho restato sei anni!"
    errors: [auxiliary-choice]
  - tutor: "Una storia classica! Ma «ho restato»: con «restare», come con «venire», che verbo va davanti?"
    prompt: {text: "ho restato", tags: [auxiliary-choice]}
  - learner: "Sono restato sei anni, anzi, sono rimasto!"
  - tutor: "Esatto, vanno bene tutti e due. E che cosa l'ha convinto a restare?"
  - learner: "Il mare, la gente e un lavoro in un ostello. Adesso sto gestendo un ostello mio, vicino ad Alghero."
  - tutor: "Bravo! Ma è stato tutto facile?"
    goals: [story]
  - learner: "No, la burocrazia è stata terribile. Ho aspettato otto mesi, e la licenza è stato dato solo dopo tre visite del Comune."
    errors: [passive]
  - tutor: "Otto mesi! Ma «la licenza è stato dato»: «licenza» è femminile. Come devono finire le ultime parole?"
    prompt: {text: "è stato dato", tags: [passive]}
  - learner: "La licenza è stato dato dopo otto mesi, sì."
    errors: [passive]
  - tutor: "Quindi la licenza è stata data solo dopo otto mesi e tre visite: molti ascoltatori la capiranno."
    recast: {text: "è stato dato", fix: "è stata data", tags: [passive]}
    goals: [difficulties]
  - learner: "Però ho imparato tanto. Adesso sono più calmo, e non mi arrabbio se l'autobus arriva in ritardo."
  - tutor: "Questo sì che è un cambiamento! E un consiglio per chi vuole fare come lei?"
    goals: [change]
  - learner: "Venite, ma prima imparate l'italiano. E non abbiate fretta: le cose arrivaranno."
    errors: [future-form]
  - tutor: "Bello. Ma «arrivaranno»: al futuro, quella «a» in mezzo cambia. In che cosa?"
    prompt: {text: "arrivaranno", tags: [future-form]}
  - learner: "Le cose arriveranno, con il tempo."
  - tutor: "Esatto: con il tempo, e con un po' di mare. Grazie, è stato un piacere averla con noi."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: es-f-erasmus
  history: [hypothetical, ci-ne]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Sono arrivata a Bologna con l'Erasmus, quattro anni fa. Mi sono innamorata della città e non sono più tornata a Siviglia."
  - tutor: "Succede a molti studenti! E perché ha deciso di restare?"
  - learner: "Perché qui ho trovato lavoro in una scuola di lingue. Se non avrei trovato quel lavoro, sarei tornata in Spagna."
    errors: [hypothetical]
  - tutor: "Che fortuna! Ma «se non avrei trovato»: dopo «se», il condizionale non va. Che forma serve?"
    prompt: {text: "Se non avrei trovato", tags: [hypothetical]}
  - learner: "Se non avessi trovato quel lavoro, sarei tornata in Spagna."
  - tutor: "Esatto. E qual è stata la cosa più difficile?"
    goals: [story]
  - learner: "La nostalgia della famiglia, e anche il clima: a Siviglia c'è sempre il sole, mentre qui in inverno c'è molta niebla."
    errors: [word-choice]
  - tutor: "Eh sì, a Bologna in inverno c'è molta nebbia: proprio il contrario di Siviglia!"
    recast: {text: "molta niebla", fix: "molta nebbia", tags: [word-choice]}
    goals: [difficulties]
  - learner: "Però adesso ho tanti amici italiani. All'inizio non conoscevo nessuno, e adesso ho almeno dieci!"
    errors: [ci-ne]
  - tutor: "Che bello! Ma «adesso ho almeno dieci»: dieci amici, giusto? Manca una piccola parola prima del verbo."
    prompt: {text: "ho almeno dieci", tags: [ci-ne]}
  - learner: "Adesso ne ho almeno dieci! E sono cambiata: sono più aperta e parlo con tutti."
  - tutor: "Perfetto. E si sente: è una persona molto solare. Che consiglio darebbe a chi vuole trasferirsi?"
    goals: [change]
  - learner: "Direi di non avere paura di sbagliare. Gli italiani sono pazienti, se uno ci prova davvero."
  - tutor: "Un consiglio prezioso: sbagliare fa parte del viaggio. Grazie di essere stata con noi."
    goals: [advice]

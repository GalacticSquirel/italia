# Broad-coverage B2 dialogues: job interviews and asking for a promotion.
- scenario: colloquio-lavoro
  level: B2
  persona: en-m-traveller
  history: [essere-avere, tense-aspect]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno! Mi chiamo Liam, sono irlandese e sono 29 anni. Vivo in Italia da due anni."
    errors: [essere-avere]
  - tutor: "Piacere, Liam. Una cosa sull'età: «sono 29 anni»? Per dire l'età, in italiano usiamo un altro verbo. Quale?"
    prompt: {text: "sono 29 anni", tags: [essere-avere]}
  - learner: "Ah, sì: ho 29 anni. Adesso lavoro come grafico per piccole aziende, da solo."
  - tutor: "Perfetto. E prima di venire in Italia, che esperienza aveva fatto?"
    goals: [intro]
  - learner: "In Irlanda lavoravo per un'agenzia di Dublino. Disegnavo siti web per ristoranti e alberghi, e ogni tanto ho fatto anche le fotografie."
    errors: [tense-aspect]
  - tutor: "Interessante. Ma «ogni tanto ho fatto»: è un'abitudine di quel periodo, come «disegnavo». Che tempo ci vuole, allora?"
    prompt: {text: "ogni tanto ho fatto", tags: [tense-aspect]}
  - learner: "Ogni tanto facevo anche le fotografie, sì."
  - tutor: "Esatto. E quali sono i suoi punti di forza? E un punto debole, se vuole essere sincero."
    goals: [experience]
  - learner: "Sono creativo e parlo facilmente con i clienti. Il mio punto debole? Per me è difficile pagare attenzione ai dettagli."
    errors: [word-choice]
  - tutor: "Risposta onesta. Fare attenzione ai dettagli si impara, con il tempo. E perché vorrebbe lavorare proprio da noi?"
    recast: {text: "pagare attenzione ai dettagli", fix: "fare attenzione ai dettagli", tags: [word-choice]}
    goals: [strengths]
  - learner: "Perché i vostri progetti per i musei mi piacciono molto. E mi piacerebbe a lavorare in un'azienda piccola, dove ci si conosce tutti."
    errors: [modal-infinitive]
  - tutor: "Grazie, è un bel complimento. Ma «mi piacerebbe a lavorare»: tra il verbo e l'infinito, quella «a» ci vuole davvero?"
    prompt: {text: "mi piacerebbe a lavorare", tags: [modal-infinitive]}
  - learner: "Sì... mi piacerebbe a lavorare in un gruppo piccolo."
    errors: [modal-infinitive]
  - tutor: "Allora le piacerebbe lavorare in un gruppo piccolo: da noi siamo in otto, e ci si conosce davvero tutti. Ha qualche domanda per me?"
    recast: {text: "piacerebbe a lavorare", fix: "piacerebbe lavorare", tags: [modal-infinitive]}
    goals: [why]
  - learner: "Sì: è possibile lavorare da casa qualche giorno alla settimana?"
  - tutor: "Sì, due giorni alla settimana, dopo i primi tre mesi. Grazie, Liam: le faremo sapere entro venerdì."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: en-f-professional
  history: [reflexive]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono Emma e vengo da Sydney. Ho laureato in marketing nel 2015 e da tre anni vivo a Milano."
    errors: [reflexive]
  - tutor: "Benvenuta, Emma. Però «ho laureato»: in italiano questo verbo funziona come «sposarsi» o «trasferirsi». Come diventa?"
    prompt: {text: "Ho laureato", tags: [reflexive]}
  - learner: "Mi sono laureata in marketing nel 2015."
  - tutor: "Perfetto. E che cosa ha fatto in questi anni?"
    goals: [intro]
  - learner: "A Sydney lavoravo per una grande azienda di moda: gestivo le campagne sui social e coordinavo un gruppo di cinque persone. Poi nel 2021 mi sono trasferita qui."
  - tutor: "Un'esperienza importante, e in un settore difficile. Quali sono, secondo lei, i suoi punti di forza? E un punto debole?"
    goals: [experience]
  - learner: "Sono organizzata e so lavorare con scadenze strette. Il mio punto debole è che non so dire di no, e accetto troppi progetti alla stessa volta."
    errors: [word-choice]
  - tutor: "Succede spesso alle persone generose: accettare troppi progetti allo stesso tempo è un rischio che conosco bene. E perché vorrebbe lavorare con noi?"
    recast: {text: "alla stessa volta", fix: "allo stesso tempo", tags: [word-choice]}
    goals: [strengths]
  - learner: "Perché lavorate con clienti internazionali, e io potrei portare la mia esperienza con il mercato australiano."
  - tutor: "Un ottimo argomento. Ha qualche domanda sul ruolo?"
    goals: [why]
  - learner: "Sì: come è grande la squadra in cui lavorerei?"
    errors: [question-form]
  - tutor: "Buona domanda. Ma «come è grande»? Per chiedere le dimensioni di qualcosa, l'inizio della domanda cambia. Riprovi."
    prompt: {text: "come è grande", tags: [question-form]}
  - learner: "Quanto è grande la squadra?"
  - tutor: "Brava. Siamo in dodici, in tre gruppi di progetto. Grazie, Emma: le faremo sapere la prossima settimana."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: es-m-worker
  history: [imperfetto-form, subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono Martín, sono argentino e faccio il cuoco da quindici anni. Adesso lavoro in una trattoria a Bologna."
  - tutor: "Benvenuto. Un cuoco in uno studio che progetta ristoranti: interessante! Mi racconti la sua esperienza."
    goals: [intro]
  - learner: "A Buenos Aires lavoraba in un ristorante grande. Organizzavo la cucina e sceglievo con l'architetto come usare gli spazi."
    errors: [imperfetto-form]
  - tutor: "Bella esperienza. Ma «lavoraba» suona spagnolo: all'imperfetto italiano, in mezzo alla parola c'è un'altra lettera. Quale?"
    prompt: {text: "lavoraba", tags: [imperfetto-form]}
  - learner: "Lavoravo, scusi. Lavoravo in un ristorante grande."
  - tutor: "Esatto. Quindi lei sa bene di che cosa ha bisogno una cucina professionale. Quali sono i suoi punti forti? E qualcosa che vorrebbe migliorare?"
    goals: [experience]
  - learner: "Sono pratico e veloce. Però il computer non mi piace molto: i programmi per disegnare non li so usare bene."
  - tutor: "Su questo possiamo aiutarla, facciamo corsi interni. Ma perché vorrebbe cambiare lavoro, dopo quindici anni in cucina?"
    goals: [strengths]
  - learner: "Perché sono stanco di lavorare di notte. E poi mi piacerebbe che i ristoranti saranno più comodi per chi ci lavora."
    errors: [subjunctive-use]
  - tutor: "È un bel motivo. Però «mi piacerebbe che i ristoranti saranno»: dopo «mi piacerebbe che», il futuro non va. Quale forma serve?"
    prompt: {text: "che i ristoranti saranno", tags: [subjunctive-use]}
  - learner: "Mi piacerebbe che i ristoranti saranno più comodi... no?"
    errors: [subjunctive-use]
  - tutor: "La capisco: anche a noi piacerebbe che i ristoranti fossero più comodi per chi ci lavora. Ha qualche domanda per me?"
    recast: {text: "che i ristoranti saranno", fix: "che i ristoranti fossero", tags: [subjunctive-use]}
    goals: [why]
  - learner: "Sì: se venissi a lavorare con voi, dovrei andare anche nei cantieri?"
  - tutor: "Sì, una o due volte alla settimana, per controllare i lavori. Grazie, Martín: è stato un colloquio davvero interessante."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-heritage
  history: [conditional-form, past-participle-form]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Daniel Ferraro, i miei nonni erano calabresi. Sono cresciuto a Toronto e ho studiato design delle app."
  - tutor: "Piacere. Quindi la sua famiglia viene dal Sud! Che esperienza ha fatto finora?"
    goals: [intro]
  - learner: "Ho lavorato due anni in una piccola azienda. Ho disegnato un'app per prenotare le visite mediche e ho risolvuto molti problemi per gli utenti anziani."
    errors: [past-participle-form]
  - tutor: "Un progetto utile. Ma «ho risolvuto»? Al passato questo verbo ha una forma speciale. Se la ricorda?"
    prompt: {text: "ho risolvuto", tags: [past-participle-form]}
  - learner: "Ho risolto, giusto. Ho risolto molti problemi."
  - tutor: "Esatto. E quali sono i suoi punti di forza?"
    goals: [experience]
  - learner: "Ascolto bene gli utenti e i colleghi. Il mio punto debole è la grammatica italiana, come vede!"
  - tutor: "Bella risposta, e il suo italiano è più che sufficiente per lavorare qui. Perché le interessa la nostra azienda?"
    goals: [strengths]
  - learner: "Perché fate progetti per gli ospedali pubblici, e per me questo è importante. Voleria fare qualcosa di utile per gli altri."
    errors: [conditional-form]
  - tutor: "È un motivo nobile. Ma «voleria»... è il condizionale di «volere», prima persona: come fa in italiano?"
    prompt: {text: "Voleria", tags: [conditional-form]}
  - learner: "Vorrei fare qualcosa di utile per gli altri."
  - tutor: "Ecco. Ed è proprio lo spirito che cerchiamo. Ha qualche domanda per me?"
    goals: [why]
  - learner: "Sì. Il contratto sarebbe a tempo determinato o indeterminato?"
  - tutor: "All'inizio a tempo determinato, per un anno; poi l'idea è di trasformarlo. Grazie, Daniel: ci sentiamo presto."
    goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [negation, subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Volevo parlare del mio lavoro di quest'anno. Ho preparato i nuovi corsi per adulti, e gli iscritti sono aumentati del trenta per cento."
  - tutor: "Lo so, è un ottimo risultato. Anche le opinioni degli studenti sono molto positive."
    goals: [results]
  - learner: "Grazie. Per questo vorrei diventare coordinatrice dei corsi. Penso che sono pronta per più responsabilità."
    errors: [subjunctive-use]
  - tutor: "Ne prendo nota. Ma «penso che sono pronta»: dopo «penso che», che modo serve?"
    prompt: {text: "Penso che sono pronta", tags: [subjunctive-use]}
  - learner: "Ah... penso di essere pronta per più responsabilità."
  - tutor: "Perfetto, così è anche più naturale. Il problema è il budget: quest'anno non abbiamo soldi per un nuovo ruolo."
    goals: [request]
  - learner: "Capisco. Però io non chiedo niente aumento subito. Potrei fare la coordinatrice per sei mesi, e poi parliamo dello stipendio."
    errors: [negation]
  - tutor: "Interessante. Ma «niente aumento»: davanti a un nome come «aumento», quale parola negativa usiamo?"
    prompt: {text: "niente aumento", tags: [negation]}
  - learner: "Non chiedo niente aumento subito, solo la possibilità di provare."
    errors: [negation]
  - tutor: "Quindi nessun aumento subito, solo la possibilità di provare: è una proposta intelligente, che risolve il problema del budget, almeno per ora."
    recast: {text: "niente aumento", fix: "nessun aumento", tags: [negation]}
    goals: [handle]
  - learner: "Allora sarebbe bello che la direzione decida prima di Natale, così posso organizzare i corsi di gennaio."
    errors: [subjunctive-use]
  - tutor: "Lo capisco. Però, con «sarebbe bello» all'inizio, il congiuntivo dopo «che» cambia tempo. Quale?"
    prompt: {text: "che la direzione decida", tags: [subjunctive-use]}
  - learner: "Sarebbe bello che la direzione decida prima di Natale... no?"
    errors: [subjunctive-use]
  - tutor: "Sì, sarebbe bello che la direzione decidesse prima di Natale, e farò di tutto. Ne parlo con loro giovedì e poi la aggiorno."
    recast: {text: "che la direzione decida", fix: "che la direzione decidesse", tags: [subjunctive-use]}
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-student
  history: [pronoun-position]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Lavoro in libreria da un anno e mezzo e volevo parlare del mio contratto."
  - tutor: "Certo, dica pure. Com'è andato quest'anno, secondo lei?"
  - learner: "Molto bene, credo. Ho organizzato gli incontri con gli autori il sabato, e ogni volta sono venute più di cento persone."
  - tutor: "È vero, quegli incontri sono stati un successo. E di che cosa voleva parlarmi, esattamente?"
    goals: [results]
  - learner: "Vorrei un aumento. Lavoro venti ore, ma faccio anche cose che non sono nel contratto. Per esempio i social della libreria: gestisco li io."
    errors: [pronoun-position]
  - tutor: "Capisco. Ma «gestisco li io»: quando il verbo non è all'infinito, dove va il pronome?"
    prompt: {text: "gestisco li io", tags: [pronoun-position]}
  - learner: "Li gestisco io, sì. Quindi penso di meritare un aumento."
  - tutor: "Esatto. La richiesta è giusta, ma quest'anno il budget per il personale è molto limitato."
    goals: [request]
  - learner: "Lo so. Ma se avessi un aumento, potrei lasciare il mio secondo lavoro e lavorare qui più ore."
  - tutor: "Questo è un argomento interessante: più ore per noi e meno stress per lei. Ne terrò conto."
    goals: [handle]
  - learner: "Grazie. Quando pensa che sapremo qualcosa? Voglio di organizzare il prossimo semestre all'università."
    errors: [modal-infinitive]
  - tutor: "Presto, spero. Ma «voglio di organizzare»: dopo «volere», l'infinito ha bisogno di quel «di»?"
    prompt: {text: "Voglio di organizzare", tags: [modal-infinitive]}
  - learner: "Ah, giusto: voglio organizzare il semestre."
  - tutor: "Perfetto. Parlo con l'amministrazione e le do una risposta entro il quindici del mese. Intanto continui così."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-traveller
  history: [stare-gerund, word-order]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie per il tempo. Volevo parlarle del mio lavoro alla reception dell'ostello."
  - tutor: "Certo. So che quest'estate abbiamo avuto moltissimo lavoro. Com'è andata dal suo punto di vista?"
  - learner: "Benissimo! I voti online sono saliti da 8,1 a 9 e molti clienti hanno scritto il mio nome. Adesso sono preparando un sistema nuovo per le prenotazioni dei gruppi."
    errors: [stare-gerund]
  - tutor: "Bravo! Ma «sono preparando»: per un'azione in corso, che verbo usiamo prima di «preparando»?"
    prompt: {text: "sono preparando", tags: [stare-gerund]}
  - learner: "Sto preparando un sistema nuovo, sì."
  - tutor: "Esatto. Questi risultati li ho visti, e la ringrazio."
    goals: [results]
  - learner: "Per questo vorrei diventare responsabile del turno di notte. Lavoro qui da un anno, e il personale di notte mi conoscono già bene."
    errors: [subject-verb-agreement]
  - tutor: "Questo è un punto a suo favore. Ma «il personale mi conoscono»: «personale» è singolare o plurale?"
    prompt: {text: "il personale di notte mi conoscono", tags: [subject-verb-agreement]}
  - learner: "Singolare: il personale di notte mi conosce già bene."
  - tutor: "Giusto. Però per quel ruolo chiediamo almeno due anni di esperienza, e lei è qui da uno."
    goals: [request]
  - learner: "È vero, ma prima ho lavorato tre anni in un ostello a Dublino. Anche ho gestito i turni di notte da solo."
    errors: [word-order]
  - tutor: "Questo cambia le cose. Ma «anche ho gestito»: in una frase come «ho gestito», dove mettiamo «anche»?"
    prompt: {text: "Anche ho gestito", tags: [word-order]}
  - learner: "Ho anche gestito i turni di notte da solo. Le porto la lettera dell'ostello domani, se vuole."
  - tutor: "Perfetto. L'esperienza all'estero conta, e se me la documenta posso tenerne conto."
    goals: [handle]
  - learner: "Grazie. Quando potremmo parlarne di nuovo?"
  - tutor: "Facciamo venerdì alle dieci. Se è tutto in ordine, dal mese prossimo comincia a fare i turni da responsabile."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: es-m-worker
  history: [false-friend, combined-pronouns]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Sono quattro anni che lavoro qui come secondo cuoco, e volevo parlare del mio futuro nel ristorante."
  - tutor: "Volentieri. In effetti lei è con noi da molto tempo. Come valuta quest'ultimo anno?"
  - learner: "Ho creato il nuovo menù di primavera e abbiamo buttato il venti per cento di cibo in meno. Anche il critico della guida è rimasto molto contento."
  - tutor: "Lo so bene, l'articolo l'ho letto anch'io. Quindi che cosa mi chiede?"
    goals: [results]
  - learner: "Il capo cuoco va in pensione a giugno e io vorrei il suo posto. Il mio menù ha avuto molto esito con i clienti."
    errors: [false-friend]
  - tutor: "È vero, il suo menù ha avuto molto successo con i clienti. Però per quel ruolo la proprietà vorrebbe uno chef famoso, magari da fuori."
    recast: {text: "avuto molto esito", fix: "avuto molto successo", tags: [false-friend]}
    goals: [request]
  - learner: "Capisco, ma se prendeste uno chef da fuori, dovrebbe imparare tutto da zero. Io conosco già i fornitori e la squadra."
  - tutor: "Questo è un buon argomento, glielo riconosco. Che cosa propone, quindi?"
    goals: [handle]
  - learner: "Propongo un periodo di prova di tre mesi. Se i risultati non saranno buoni, torno al mio ruolo."
  - tutor: "Mi sembra corretto. Presento la sua proposta alla proprietà la settimana prossima."
  - learner: "Va bene. Quando ha la risposta, mi la può dire subito?"
    errors: [combined-pronouns]
  - tutor: "Senz'altro. Ma «mi la può dire»: quando due pronomi stanno insieme, il primo cambia forma. Come diventa?"
    prompt: {text: "mi la può dire", tags: [combined-pronouns]}
  - learner: "Me la può dire subito, per favore?"
  - tutor: "Certo, gliela comunico appena la ricevo. E grazie: è stata una proposta molto professionale."
    goals: [next-steps]

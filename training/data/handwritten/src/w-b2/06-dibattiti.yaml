# Broad-coverage B2 dialogues: a public debate on traffic and a dinner talk on work and automation.
- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [ce-ci-sono, subjunctive-use]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io non sono d'accordo. Lavoro in un ristorante del centro, e la sera in strada sono troppe macchine: i clienti non possono stare fuori tranquilli."
    errors: [ce-ci-sono]
  - tutor: "Capisco il suo punto di vista. Ma «in strada sono troppe macchine»: per dire che qualcosa si trova in un posto, quale espressione usiamo?"
    prompt: {text: "in strada sono troppe macchine", tags: [ce-ci-sono]}
  - learner: "In strada ci sono troppe macchine, scusi."
  - tutor: "Esatto. Ma i clienti come arrivano, se non possono parcheggiare?"
    goals: [position]
  - learner: "Con i mezzi pubblici o a piedi. Il primo problema è il rumore; il secondo è l'inquinamento, che fa male soprattutto ai bambini e ai anziani."
    errors: [article-form]
  - tutor: "Capisco. Però «ai anziani»: davanti ad «anziani», che forma prende l'articolo?"
    prompt: {text: "ai anziani", tags: [article-form]}
  - learner: "Agli anziani, giusto."
  - tutor: "Esatto. Lo ammetto, sono argomenti seri. Ma i commercianti dicono che perderanno il trenta per cento dei clienti."
    goals: [argue]
  - learner: "Non credo che è vero. In altre città, dopo la zona pedonale, i negozi hanno guadagnato di più."
    errors: [subjunctive-use]
  - tutor: "Interessante. Ma «non credo che è vero»: dopo «non credo che», quale modo serve?"
    prompt: {text: "che è vero", tags: [subjunctive-use]}
  - learner: "Non credo che è vero, no. I dati dicono il contrario."
    errors: [subjunctive-use]
  - tutor: "Lei non crede che sia vero, d'accordo. Però qui da noi qualche negozio piccolo ha già chiuso, e la gente ha paura."
    recast: {text: "che è vero", fix: "che sia vero", tags: [subjunctive-use]}
    goals: [counter]
  - learner: "È vero, alcuni negozi hanno chiuso. Allora possiamo fare la zona pedonale solo la sera e la domenica, per provare."
  - tutor: "Questa è una proposta ragionevole: almeno vediamo i risultati prima di decidere per sempre."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-f-student
  history: [register, subject-verb-agreement]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Ma no! Non pensi anche tu che il traffico sia un problema per tutti?"
    errors: [register]
  - tutor: "Certo che lo penso, ma siamo a una riunione pubblica e non ci conosciamo: quel «tu» suona un po' troppo familiare. Come lo chiederebbe?"
    prompt: {text: "Non pensi anche tu", tags: [register]}
  - learner: "Mi scusi. Non pensa anche lei che il traffico sia un problema per tutti?"
  - tutor: "Così va meglio. Sì, il traffico è un problema, ma la soluzione non è chiudere tutto."
  - learner: "Io sono a favore della zona pedonale. Prima di tutto, l'aria sarebbe più pulita. E poi i ciclisti, il cui numero cresce ogni anno, sarebbero più sicuri."
  - tutor: "Belle parole. Ma pensi agli anziani: come arrivano in centro senza macchina?"
    goals: [position, argue]
  - learner: "Si potrebbero usare navette elettriche, in le quali gli anziani viaggiano gratis."
    errors: [articulated-preposition]
  - tutor: "Idea interessante. Ma «in le quali»: «in» più «le», quando stanno vicini, cambiano forma. Come?"
    prompt: {text: "in le quali", tags: [articulated-preposition]}
  - learner: "Sì, navette in le quali gli anziani non pagano."
    errors: [articulated-preposition]
  - tutor: "Navette nelle quali gli anziani viaggiano gratis? Va bene, ma chi le paga?"
    recast: {text: "in le quali", fix: "nelle quali", tags: [articulated-preposition]}
    goals: [counter]
  - learner: "Con i soldi dei parcheggi a pagamento. Però ammetto che per i residenti che lavora fuori città è un problema."
    errors: [subject-verb-agreement]
  - tutor: "Apprezzo che lo ammetta. Ma «i residenti che lavora»: il soggetto è plurale, quindi il verbo...?"
    prompt: {text: "i residenti che lavora", tags: [subject-verb-agreement]}
  - learner: "Per i residenti che lavorano fuori città. Per loro propongo un permesso speciale."
  - tutor: "Esatto. Un permesso per chi ci abita: su questo potremmo trovarci d'accordo tutti."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-teacher
  history: [subjunctive-form, verb-form]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io invece credo che la zona pedonale sia una buona idea, soprattutto per le famiglie e per le scuole del centro."
  - tutor: "Le famiglie, certo. Ma mi dia almeno due buoni motivi."
    goals: [position]
  - learner: "Primo: i bambini possono andare a scuola a piedi senza pericolo. Secondo: le strade si riempiono di persone, e la gente compre di più nei negozi."
    errors: [verb-form]
  - tutor: "Interessante. Ma «la gente compre»: è il presente di «comprare», terza persona. Come finisce?"
    prompt: {text: "la gente compre", tags: [verb-form]}
  - learner: "Sì: la gente compre di più, e i negozi guadagnano."
    errors: [verb-form]
  - tutor: "Se la gente compra di più, i negozi guadagnano, d'accordo. Però molti commercianti hanno paura di perdere i clienti che vengono da fuori."
    recast: {text: "la gente compre", fix: "la gente compra", tags: [verb-form]}
    goals: [argue]
  - learner: "Capisco, ma bisogna che il Comune costruisca parcheggi fuori dal centro e che metta più autobus."
  - tutor: "E se il Comune non avesse i soldi per farlo?"
  - learner: "Allora è necessario che i commercianti proponghino altre soluzioni, come le consegne a casa."
    errors: [subjunctive-form]
  - tutor: "Buona idea. Ma «proponghino»: il congiuntivo di «proporre» si forma partendo da «io propongo». Come viene?"
    prompt: {text: "che i commercianti proponghino", tags: [subjunctive-form]}
  - learner: "Che i commercianti proponghino... sì, le consegne."
    errors: [subjunctive-form]
  - tutor: "Sì, è giusto che i commercianti propongano qualcosa anche loro. Ma non tutti possono permettersi le consegne."
    recast: {text: "che i commercianti proponghino", fix: "che i commercianti propongano", tags: [subjunctive-form]}
    goals: [counter]
  - learner: "D'accordo, ammetto che chiudere tutto subito è rischioso. Possiamo cominciare con il sabato e la domenica."
  - tutor: "Ecco, un fine settimana senza macchine mi sembra un buon inizio. Così vediamo come reagiscono i negozi."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-m-retired
  history: [relative-pronoun, stare-gerund]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la preoccupazione, ma la zona pedonale è necessaria. Abito in centro da quarant'anni e l'aria sta diventando irrespirabile."
  - tutor: "Irrespirabile mi sembra un po' esagerato. Ha dei dati, o è solo una sensazione?"
    goals: [position]
  - learner: "Ho i dati del Comune: lo smog è sopra il limite cento giorni all'anno. E il rumore, il quale non misuriamo mai, è un altro problema."
    errors: [relative-pronoun]
  - tutor: "Dati interessanti. Ma «il rumore, il quale non misuriamo»: qui il rumore è l'oggetto, e «il quale» non funziona. Che pronome serve?"
    prompt: {text: "il quale non misuriamo", tags: [relative-pronoun]}
  - learner: "Il rumore, che non misuriamo mai, è un altro problema."
  - tutor: "Giusto. Ma i commercianti dicono che senza macchine il centro morirà."
    goals: [argue]
  - learner: "Al contrario. In una città spagnola i commercianti all'inizio protestavano, ma eventualmente hanno cambiato idea, perché vendevano di più."
    errors: [false-friend]
  - tutor: "Quindi alla fine hanno cambiato idea. Va bene, ma quella città non è la nostra: qui il centro è piccolo e pieno di salite."
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    goals: [counter]
  - learner: "È vero, ogni città è diversa. Infatti sono pensando a una prova di sei mesi."
    errors: [stare-gerund]
  - tutor: "Una prova? Mi interessa. Ma «sono pensando»... ci ripensi: quale verbo va davanti a «pensando»?"
    prompt: {text: "sono pensando", tags: [stare-gerund]}
  - learner: "Sto pensando a una prova di sei mesi, e poi decidiamo insieme."
  - tutor: "Esatto. Sei mesi di prova, con i dati alla mano: così anche i commercianti possono giudicare."
    goals: [concede]

- scenario: politica-lavoro
  level: B2
  persona: en-m-traveller
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri. Molti lavori cambieranno, ma ne nasceranno anche di nuovi."
  - tutor: "Sei proprio positivo! Ma immagina che domani le macchine guidino da sole. Che fine fanno i tassisti?"
    goals: [opinion]
  - learner: "Se le macchine guiderebbero da sole, i tassisti dovrebbero cambiare lavoro."
    errors: [hypothetical]
  - tutor: "Può darsi. Ma «se le macchine guiderebbero»: con «se», il condizionale va solo nell'altra parte della frase."
    prompt: {text: "Se le macchine guiderebbero", tags: [hypothetical]}
  - learner: "Se le macchine guiderebbero da sole... i tassisti perdono il lavoro."
    errors: [hypothetical]
  - tutor: "Se le macchine guidassero da sole, i tassisti dovrebbero cambiare lavoro, d'accordo. Ma chi gli insegna un lavoro nuovo?"
    recast: {text: "Se le macchine guiderebbero", fix: "Se le macchine guidassero", tags: [hypothetical]}
    goals: [hypothesis]
  - learner: "Lo Stato, con i corsi. In Irlanda mio zio era operaio in una fabbrica, e quando l'hanno chiusa ha fatto un corso: ora fa il programmatore."
  - tutor: "Bella storia, ma non tutti ce la fanno come tuo zio."
    goals: [example]
  - learner: "Forse, ma penso che il governo deve investire di più nella formazione."
    errors: [subjunctive-use]
  - tutor: "Su questo hai ragione. Ma «penso che il governo deve»: dopo «penso che», che modo usiamo?"
    prompt: {text: "che il governo deve", tags: [subjunctive-use]}
  - learner: "Penso che il governo debba investire di più. E tu, alla fine, cosa ne pensi davvero?"
  - tutor: "Ecco. Io resto preoccupato, ma ammetto che con più formazione il futuro sarebbe meno nero. Beviamo alla formazione, allora!"
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [hypothetical, ce-ci-sono]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Nella mia cucina no: un robot non può fare un buon ragù. Ma in altri settori hai ragione, sono preoccupato."
  - tutor: "Ah, il ragù è salvo! Ma pensa: un robot che cucina come te, a metà prezzo. Tu che faresti?"
    goals: [opinion]
  - learner: "Se un robot cucinava come me, io aprirei una scuola di cucina."
    errors: [hypothetical]
  - tutor: "Che spirito! Ma «se un robot cucinava»: è una situazione che non è reale, e con questo «se» serve un'altra forma. Quale?"
    prompt: {text: "Se un robot cucinava", tags: [hypothetical]}
  - learner: "Se un robot cucinasse come me, aprirei una scuola."
  - tutor: "Perfetto. Sempre una soluzione, tu! Ma non tutti possono fare come te."
    goals: [hypothesis]
  - learner: "Vero. Mio cugino lavora in un grande magazzino vicino a Bologna, e già adesso sono robot dappertutto."
    errors: [ce-ci-sono]
  - tutor: "Davvero? Ma «sono robot dappertutto»: per dire che qualcosa si trova in un luogo, che espressione usiamo?"
    prompt: {text: "sono robot dappertutto", tags: [ce-ci-sono]}
  - learner: "Sì, sono robot dappertutto, anche per i pacchi."
    errors: [ce-ci-sono]
  - tutor: "Se ci sono robot dappertutto già adesso, tra dieci anni tuo cugino che farà?"
    recast: {text: "sono robot dappertutto", fix: "ci sono robot dappertutto", tags: [ce-ci-sono]}
    goals: [example]
  - learner: "Lui dice che vuole imparare a riparare i robot, così non perde il lavoro. Tu cosa faresti al suo posto?"
  - tutor: "Farei esattamente come lui: meglio essere quello che ripara le macchine che quello che viene sostituito."
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: en-f-professional
  history: [subjunctive-use, participle-agreement]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Non sono così pessimista. Nel mio lavoro usiamo già l'intelligenza artificiale, ma serve sempre una persona che controlli i risultati."
  - tutor: "Per ora. Ma tra dieci anni?"
    goals: [opinion]
  - learner: "Se l'intelligenza artificiale diventasse davvero brava, forse cambierebbe il mio lavoro, ma non lo eliminerebbe."
  - tutor: "Mi sembri un po' troppo tranquilla. Hai un esempio preciso?"
    goals: [hypothesis]
  - learner: "Sì. L'anno scorso la mia azienda ha comprato un programma che scrive testi. Le prime campagne le ha scritto il programma, ma i clienti le hanno trovate fredde."
    errors: [participle-agreement]
  - tutor: "Interessante. Ma «le prime campagne le ha scritto»: con quel «le» davanti, l'ultima parola cambia. Come?"
    prompt: {text: "le ha scritto", tags: [participle-agreement]}
  - learner: "Sì, le ha scritto il programma, tutte."
    errors: [participle-agreement]
  - tutor: "Quindi le ha scritte il programma, ma senza anima e senza fantasia. E poi che cosa è successo con i clienti?"
    recast: {text: "le ha scritto", fix: "le ha scritte", tags: [participle-agreement]}
    goals: [example]
  - learner: "Le abbiamo riscritte noi. Comunque temo che molte persone perdono il lavoro, almeno all'inizio."
    errors: [subjunctive-use]
  - tutor: "Lo temo anch'io. Ma «temo che molte persone perdono»: dopo «temo che», che modo ci vuole?"
    prompt: {text: "che molte persone perdono", tags: [subjunctive-use]}
  - learner: "Temo che molte persone perdono... il lavoro, sì."
    errors: [subjunctive-use]
  - tutor: "Sì, è probabile che molte persone perdano il lavoro, almeno all'inizio. E quindi, come la chiudiamo questa discussione?"
    recast: {text: "che molte persone perdono", fix: "che molte persone perdano", tags: [subjunctive-use]}
  - learner: "Secondo me la formazione sarà fondamentale. E tu, Riccardo, sei ancora così pessimista?"
  - tutor: "Un po' meno di prima, lo ammetto. Ma tra dieci anni ci ritroviamo qui e vediamo chi aveva ragione!"
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-f-erasmus
  history: [hypothetical, reflexive]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Un po' sono d'accordo con te. Studio traduzione e ho paura che tra dieci anni i traduttori non servano più."
  - tutor: "Ecco, vedi? Anche tu sei preoccupata."
    goals: [opinion]
  - learner: "Sì. Se non esistessero i programmi di traduzione, il lavoro per noi fosse più facile."
    errors: [hypothetical]
  - tutor: "La prima parte è perfetta. Ma «il lavoro fosse più facile»: nella seconda parte della frase ci vuole un altro modo. Quale?"
    prompt: {text: "fosse più facile", tags: [hypothetical]}
  - learner: "Il lavoro per noi fosse più facile... no?"
    errors: [hypothetical]
  - tutor: "Certo, se non esistessero quei programmi, il lavoro sarebbe più facile. Ma esistono, e sono sempre più bravi!"
    recast: {text: "fosse più facile", fix: "sarebbe più facile", tags: [hypothetical]}
    goals: [hypothesis]
  - learner: "Per esempio, la mia professoressa si è laureata trent'anni fa e prima traduceva libri interi. Adesso corregge soltanto le traduzioni delle macchine."
  - tutor: "Che peccato... ma almeno ha ancora un lavoro."
    goals: [example]
  - learner: "Sì. Per questo io voglio specializzare in interpretazione, perché è più difficile da sostituire."
    errors: [reflexive]
  - tutor: "Scelta furba. Ma «voglio specializzare»: specializzare chi? Manca un pronome."
    prompt: {text: "voglio specializzare", tags: [reflexive]}
  - learner: "Voglio specializzarmi in interpretazione. E tu, che faresti al mio posto?"
  - tutor: "Farei come te: punterei su quello che le macchine sanno fare peggio, cioè capire le persone."
    goals: [conclude]

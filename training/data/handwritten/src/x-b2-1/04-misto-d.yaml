- scenario: medico-specialista
  level: B2
  persona: es-f-teacher
  history: [subjunctive-form]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio, ma non del tutto. Ho ancora la pressione alta la sera, e a volte sento un affaticamento strano dopo le lezioni."
  - tutor: "Capisco. Il battito com'è, regolare? E quando si sente stanca, le gira la testa?"
  - learner: "Il battito è regolare, credo. La testa mi gira solo quando mi alzo in fretta. Mi succede da quando prendo la medicina nuova."
  - tutor: "Bene, è un'informazione utile. Nella sua famiglia ci sono stati casi di malattie del cuore?"
    goals: [symptoms]
  - learner: "Sì. Mia nonna è morta di infarto, e mia madre ha problemi di cuore da quando aveva cinquant'anni. I medici vogliono che lei facci un controllo ogni sei mesi."
    errors: [subjunctive-form]
  - tutor: "Fanno bene a seguirla. Ma «vogliono che lei facci»? Questa forma del verbo non è quella giusta: riprovi."
    prompt: {text: "che lei facci", tags: [subjunctive-form]}
    goals: [history]
  - learner: "Vogliono che lei faccia un controllo ogni sei mesi."
  - tutor: "Esatto. Ora i suoi esami: sono migliori di tre mesi fa, ma la pressione non è ancora dove vorrei."
  - learner: "Che cosa significa esattamente? Devo preoccuparmi? Non voglio che la mia famiglia si spaventi per niente."
  - tutor: "No, non c'è motivo di spaventarsi. Significa solo che la terapia funziona, ma va un po' aumentata."
    goals: [understand]
  - learner: "E se aumento la dose, ci sono più effetti collaterali? Ho paura di che la medicina mi faccia dormire in classe!"
    errors: [preposition]
  - tutor: "Capisco bene. Però «ho paura di che»? In italiano qui c'è una parola di troppo."
    prompt: {text: "Ho paura di che", tags: [preposition]}
  - learner: "Ho paura che la medicina mi faccia dormire in classe."
  - tutor: "Perfetto. Non si preoccupi: con questa dose gli effetti collaterali sono rari. Se si sente troppo stanca, mi chiami e cambiamo terapia. Ci vediamo tra due mesi."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie. Noi immaginiamo una festa semplice, con buona cucina, perché io sono cuoco. Circa sessanta invitati, in autunno."
  - tutor: "Un matrimonio in autunno, che bella idea. E la cerimonia: in chiesa o in Comune?"
  - learner: "In Comune, e poi tutti al ristorante. Alla mia fidanzata piacciono i fiori bianchi, quindi vogliamo molti."
    errors: [ci-ne]
  - tutor: "Fiori bianchi, benissimo. Ma «vogliamo molti»... molti di che cosa? Manca una piccola parola."
    prompt: {text: "vogliamo molti", tags: [ci-ne]}
    goals: [vision]
  - learner: "Ne vogliamo molti."
  - tutor: "Giusto. Parliamo del budget: quanto pensate di spendere in tutto?"
  - learner: "Non più di quindicimila euro. Il menù lo preparo io con i miei colleghi, così risparmiamo."
  - tutor: "Così il budget basta di sicuro. Per la festa ho due proposte: un ristorante in collina con un grande giardino, oppure una sala in città vicino al Comune."
    goals: [budget]
  - learner: "Preferisco la collina, anche se è più lontana: gli invitati la ricorderanno. Però prima devo vedere la cucina. Può mostrarmila?"
    errors: [combined-pronouns]
  - tutor: "Giusto, per un cuoco la cucina viene prima di tutto. Ma «mostrarmila»? Quando si uniscono i due pronomi, il primo cambia."
    prompt: {text: "mostrarmila", tags: [combined-pronouns]}
  - learner: "Può mostrarmela?"
  - tutor: "Esatto. Certo, ci andiamo insieme sabato. Ha altre richieste per me?"
  - learner: "Sì. Voglio che lei mi manda il preventivo completo prima di firmare, e niente spese extra senza il mio permesso."
    errors: [subjunctive-use]
  - tutor: "Mi sembra giusto. Però «voglio che lei mi manda»: dopo «voglio che» la forma cambia."
    prompt: {text: "Voglio che lei mi manda", tags: [subjunctive-use]}
  - learner: "Voglio che lei mi mandi il preventivo completo."
  - tutor: "Perfetto. Lo riceverà lunedì, e ogni spesa in più passerà prima da lei. Allora confermiamo la collina e ci vediamo sabato."
    goals: [choices, conditions]

- scenario: politica-lavoro
  level: B2
  persona: en-f-student
  history: [subjunctive-form]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che hai ragione a metà. Alcuni lavori spariranno, ma non la metà! All'università ci dicono che nasceranno lavori che oggi non esistono."
  - tutor: "All'università dicono tante cose... Ma immagina: e se anche i tuoi professori fossero sostituiti da un computer?"
    goals: [opinion]
  - learner: "Se i professori fossero sostituiti, gli studenti imparerebbero peggio. Un computer spiega, ma non capisce quando sei confuso."
  - tutor: "Va bene, su questo hai ragione. Hai un esempio di un lavoro che la tecnologia ha migliorato?"
    goals: [hypothesis]
  - learner: "Sì, mia madre. Lei è una infermiera, e adesso un programma scrive i rapporti per lei. Così ha più tempo per i pazienti."
    errors: [article-use]
  - tutor: "Bell'esempio. Però «lei è una infermiera»... con i mestieri, dopo «essere», quella piccola parola di solito non serve."
    prompt: {text: "Lei è una infermiera", tags: [article-use]}
  - learner: "Lei è infermiera, oppure fa l'infermiera."
  - tutor: "Perfetto, vanno bene tutte e due. Quindi per lei la tecnologia è stata un'opportunità, non un rischio."
    goals: [example]
  - learner: "Esatto. Per riassumere: penso che l'automazione cambierà il lavoro, però bisogna che lo Stato investi nella formazione. E tu cosa ne pensi, alla fine?"
    errors: [subjunctive-form]
  - tutor: "Ti rispondo subito. Prima però: «bisogna che lo Stato investi»? Controlla la forma del verbo."
    prompt: {text: "bisogna che lo Stato investi", tags: [subjunctive-form]}
  - learner: "Bisogna che lo Stato investi... non vedo l'errore, scusa."
    errors: [subjunctive-form]
  - tutor: "È una forma difficile. Sì, bisogna che lo Stato investa nella formazione, su questo siamo d'accordo. Per il resto rimango un po' pessimista, ma meno di prima!"
    recast: {text: "Bisogna che lo Stato investi", fix: "bisogna che lo Stato investa", tags: [subjunctive-form]}
    goals: [conclude]
  - learner: "Meno di prima è già qualcosa! Allora brindiamo alla formazione."
  - tutor: "Volentieri. E la prossima volta l'esempio lo porto io, vedrai."

- scenario: recensione-ristorante
  level: B2
  persona: es-f-erasmus
  history: [auxiliary-choice]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, mi dispiace dirlo, ma la cena è stata deludente. Avevamo prenotato per le otto e ci hanno fatto sedere alle nove meno un quarto."
  - tutor: "Ha ragione, tre quarti d'ora di attesa con una prenotazione non vanno bene. Me ne scuso. C'è stato altro?"
    goals: [complain]
  - learner: "Sì. Il pesce non era fresco, e le porzioni erano piccolissime. Quando l'ho detto alla cameriera, lei si ha messo a ridere."
    errors: [auxiliary-choice]
  - tutor: "«Si ha messo» a ridere? Mi dispiace davvero. Ma con «si» quale verbo usiamo: «avere» o un altro?"
    prompt: {text: "si ha messo", tags: [auxiliary-choice]}
  - learner: "Si è messa a ridere, scusi."
  - tutor: "Esatto, e non doveva succedere. Parlerò con lei. Mi dica: che cosa si aspettava da questa serata?"
    goals: [detail]
  - learner: "Era la laurea di mia sorella. Speravo che tutto sarebbe perfetto, o almeno normale."
    errors: [subjunctive-use]
  - tutor: "Una serata importante, capisco. Però «speravo che tutto sarebbe»... dopo «speravo che» ci vuole un'altra forma."
    prompt: {text: "Speravo che tutto sarebbe perfetto", tags: [subjunctive-use]}
  - learner: "Speravo che tutto fosse perfetto."
  - tutor: "Giusto. Per scusarci, vorrei offrirle uno sconto del trenta per cento e il dolce per tutti."
    goals: [expectation]
  - learner: "Preferirei non pagare il pesce, sinceramente. Se voi avreste controllato il piatto prima di servirlo, avreste visto che non era buono."
    errors: [hypothetical]
  - tutor: "È una richiesta giusta. Riprovi solo l'inizio: «Se voi... controllato il piatto»: che cosa ci va, dopo «se»?"
    prompt: {text: "Se voi avreste controllato", tags: [hypothetical]}
  - learner: "Se voi aveste controllato il piatto, avreste visto che non era buono."
  - tutor: "Esatto, e ha ragione lei. Il pesce non lo paga, e lo sconto resta sul resto della cena. Le va bene?"
  - learner: "Sì, così va bene. Accetto, e grazie per la sua gentilezza."
  - tutor: "Grazie a lei, e ancora auguri a sua sorella. Spero che ci darà un'altra possibilità."
    goals: [resolve]

- scenario: riunione-lavoro
  level: B2
  persona: en-m-heritage
  history: [conditional-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Va avanti, ma più lentamente di quanto pensassi. Ho finito l'analisi dei dati e sto scrivendo il rapporto per il cliente."
  - tutor: "Bene. Come mai più lentamente? C'è qualcosa che ti blocca?"
    goals: [update]
  - learner: "Sì. Il cliente ha cambiato idea due volte sul formato. E i dati di marzo non mi sono stati mandato ancora."
    errors: [passive]
  - tutor: "Ah, ecco il ritardo. Ma «non mi sono stati mandato»? Guarda l'ultima parola: va d'accordo con «dati»?"
    prompt: {text: "non mi sono stati mandato", tags: [passive]}
    goals: [problem]
  - learner: "Non mi sono stati mandati ancora."
  - tutor: "Esatto. E come pensi di risolvere?"
  - learner: "Io chiamerei il cliente oggi per fissare il formato una volta per tutte. Se non mandano i dati entro domani, consegniamo il rapporto senza marzo."
  - tutor: "Mi piace, è una proposta chiara. Vuoi che alla telefonata ci sia anch'io?"
    goals: [proposal]
  - learner: "Sì, sarebbe meglio: con te sono più precisi. Ti faccio sapere l'ora appena mi rispondono."
  - tutor: "Perfetto. E per la scadenza? Venerdì ce la fai?"
  - learner: "Venerdì è troppo presto. Avrò bisogno di tre giorni dopo la telefonata, quindi direi lunedì. Dovrebbi lavorare anche nel fine settimana per finire venerdì."
    errors: [conditional-form]
  - tutor: "No, il fine settimana lascialo libero. Solo una cosa: «dovrebbi»? Per «io» la forma è un'altra."
    prompt: {text: "Dovrebbi lavorare", tags: [conditional-form]}
  - learner: "Dovrebbe... dovrebbi... non mi viene, scusa."
    errors: [conditional-form]
  - tutor: "Capita a tutti. «Dovrei lavorare nel fine settimana» è una frase che non voglio sentire: facciamo lunedì, e lo scrivo io al cliente."
    recast: {text: "dovrebbi", fix: "Dovrei lavorare", tags: [conditional-form]}
    goals: [deadline]
  - learner: "Lunedì, perfetto. Grazie, Federica."
  - tutor: "Grazie a te. Ci sentiamo dopo la telefonata."

- scenario: smartworking
  level: B2
  persona: en-m-traveller
  history: [stare-gerund]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, o meglio da dove voglio. Faccio il traduttore, quindi mi basta un computer. Questo mese sono lavorando da un paesino in Sicilia."
    errors: [stare-gerund]
  - tutor: "Che fortuna! Ma scusa, «sono lavorando»? In italiano, con questa forma, non usiamo «essere»."
    prompt: {text: "sono lavorando", tags: [stare-gerund]}
    goals: [situation]
  - learner: "Sto lavorando da un paesino in Sicilia."
  - tutor: "Ecco. E quali sono i vantaggi, a parte il mare?"
  - learner: "La libertà, prima di tutto. Non ho un capo che mi guarda, e posso organizzare l'orario come voglio. Lavoro meglio di mattina presto."
  - tutor: "Sembra un sogno. Ma ci sarà pure qualche svantaggio, no?"
    goals: [pros]
  - learner: "Certo. Mi mancano i colleghi. E a volte è difficile di concentrarsi, perché c'è sempre qualcosa di più interessante da fare."
    errors: [preposition]
  - tutor: "Immagino, con il mare davanti! Però «è difficile di concentrarsi»? Qui c'è una parola di troppo."
    prompt: {text: "è difficile di concentrarsi", tags: [preposition]}
    goals: [cons]
  - learner: "È difficile concentrarsi."
  - tutor: "Giusto. E se un'azienda ti offrisse un posto fisso in ufficio, con un buono stipendio?"
  - learner: "Non lo accetterei. Preferirei guadagnare meno ed essere libero. Però forse tra dieci anni cambierò idea: la libertà è bella, ma la sicurezza anche."
  - tutor: "Ti capisco. Io invece senza l'ufficio non saprei vivere, pensa un po'. Alla tua libertà, allora!"
    goals: [preference]

- scenario: trattativa-affitto
  level: B2
  persona: en-f-professional
  history: [register]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, mi è piaciuto molto, e sono interessata. Ho solo una preoccupazione: le finestre sono vecchie e d'inverno la casa sarà fredda."
  - tutor: "Ha ragione, sono vecchie. Il proprietario lo sa, ma per ora non ha intenzione di cambiarle."
    goals: [interest]
  - learner: "Allora dimmi: se le finestre restano così, puoi abbassare il canone?"
    errors: [register]
  - tutor: "Vediamo che cosa si può fare. Prima però: tra noi ci diamo del lei, mentre «dimmi» e «puoi abbassare» sono per gli amici. Come me lo chiede?"
    prompt: {text: "puoi abbassare", tags: [register]}
  - learner: "Mi scusi. Mi dica: se le finestre restano così, potrebbe abbassare il canone?"
  - tutor: "Così è perfetto. Il canone è di 1.400 euro; credo che il proprietario possa scendere a 1.300."
  - learner: "Io pensavo a 1.250, oppure 1.300 se lui cambia le finestre entro un anno. Se accettasse, firmerei subito."
  - tutor: "È una proposta seria, gliela porto volentieri. Per il contratto, pensava a un quattro più quattro?"
    goals: [negotiate]
  - learner: "Sì, ma lavoro per un'azienda straniera e potrei dover partire. Vorrei una clausola che mi permette di dare la disdetta con tre mesi."
    errors: [subjunctive-use]
  - tutor: "Si può chiedere. Però «una clausola che mi permette»: lei parla di una clausola che ancora non esiste, che desidera. Che forma ci vuole?"
    prompt: {text: "una clausola che mi permette", tags: [subjunctive-use]}
  - learner: "Una clausola che mi permetta di dare la disdetta con tre mesi."
  - tutor: "Benissimo. Tre mesi invece di sei: il proprietario chiederà in cambio una garanzia in più, per esempio un mese di affitto pagato prima."
    goals: [conditions]
  - learner: "Un mese pagato prima va bene. A queste condizioni, sono pronta a firmare."
  - tutor: "Allora siamo d'accordo. Preparo la proposta scritta e gliela mando domani mattina."
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: en-m-retired
  history: [participle-agreement]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno. Io e mia moglie siamo venuti in Umbria cinque anni fa, quando sono andato in pensione. Avevamo sempre sognato di vivere in campagna."
  - tutor: "Un sogno che hanno in tanti. E la realtà com'è stata? Qual è stata la difficoltà più grande?"
    goals: [story]
  - learner: "La lingua, per me. E la burocrazia. Per esempio, le bollette: non le ho mai capito. All'inizio le pagavo due volte per sbaglio."
    errors: [participle-agreement]
  - tutor: "Le bollette italiane sono una sfida anche per noi! Ma «non le ho mai capito»? Con «le» davanti, l'ultima parola cambia."
    prompt: {text: "non le ho mai capito", tags: [participle-agreement]}
    goals: [difficulties]
  - learner: "Non le ho mai capite."
  - tutor: "Esatto. E in questi cinque anni, lei si sente cambiato?"
  - learner: "Sì. In America correvo sempre. Qui ho imparato a fermarmi e a parlare con la gente. Prima che arrivavo qui, non conoscevo nemmeno il nome dei miei vicini."
    errors: [subjunctive-use]
  - tutor: "Che bel cambiamento. Però «prima che arrivavo»: dopo «prima che» serve un'altra forma, oppure si può dire in modo più semplice."
    prompt: {text: "Prima che arrivavo qui", tags: [subjunctive-use]}
    goals: [change]
  - learner: "Prima di arrivare qui, non conoscevo il nome dei miei vicini."
  - tutor: "Perfetto, così è ancora più naturale. Per finire: che cosa consiglia a chi sogna di trasferirsi in Italia?"
  - learner: "Di non comprare subito una casa. Meglio affittare per un anno e capire se la vita qui piace davvero. E di imparare la lingua, perché senza l'italiano non ci si integra."
  - tutor: "Un ottimo consiglio. Grazie per essere stato con noi, e tanti saluti a sua moglie."
    goals: [advice]

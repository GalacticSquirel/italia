  level: B2
  persona: en-f-student
  history: [combined-pronouns, register, preposition]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono una studentessa inglese, sto facendo un anno all'università qui a Padova e vorrei chiedere la residenza."
    - tutor: "Va bene. Dove abita, in un appartamento o in una residenza per studenti?"
      goals: [request]
    - learner: "In una residenza universitaria, vicino all'ospedale. Ho una stanza singola fino a luglio dell'anno prossimo."
    - tutor: "Allora mi servono il passaporto, il permesso di soggiorno e una dichiarazione della residenza. Li ha portati?"

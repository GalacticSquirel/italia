      gold: {text: "gli la chiedo", fix: "gliela chiedo"}
    - tutor: "Domani va benissimo, intanto apriamo la pratica. Però ripeta «gli la chiedo»: quando «gli» incontra «la», restano due parole separate?"
      prompt: {text: "gli la chiedo", tags: [combined-pronouns]}
    - learner: "No, diventano una: gliela chiedo stasera e ve la porto domani."
    - tutor: "Esatto. Vedo però che il suo passaporto scade tra due mesi."
      goals: [documents]

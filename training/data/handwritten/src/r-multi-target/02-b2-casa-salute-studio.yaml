    - tutor: "Quando arriva, basta mandarci una copia per email. Però ripeta «puoi aggiornarlo tu»: allo sportello, finora, ci siamo dati del Lei, giusto?"
      prompt: {text: "puoi aggiornarlo tu", tags: [register]}
    - learner: "Ha ragione, scusi: può aggiornarlo lei, quando le mando la copia?"
    - tutor: "Sì, ci penso io, nessun problema. Ha altre domande?"
      goals: [problem]

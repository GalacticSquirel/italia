- scenario: email-rettore
  # facts: assegno di ricerca non rinnovato perché la domanda risulta arrivata con un giorno di ritardo; il portale dell'ateneo è rimasto bloccato tutta l'ultima sera; la domanda è partita alle otto del mattino dopo; schermate con l'orario salvate quella sera; obiettivo: riesame nel merito; formula: «Magnifico Rettore», con la virgola, e «mi permetto di sottoporre alla Sua cortese attenzione»; frase da attenuare sul secondo paragrafo; chiusura: «distinti saluti», firma con nome, qualifica e dipartimento
  level: C2
  persona: en-f-student
  history: [false-friend, subjunctive-use, register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Il mio assegno di ricerca non è stato rinnovato perché la domanda risulta arrivata con un giorno di ritardo. Il portale dell'ateneo è rimasto bloccatto per tutta l'ultima sera, ed eventualmente sono riuscita a inviarla solo alle otto del mattino dopo."
      errors: [spelling, false-friend]
      gold: {text: "eventualmente", fix: "alla fine"}
    - tutor: "Quindi alla fine è riuscita a inviarla, ma solo perché il portale si era sbloccato. Ha qualche prova del malfunzionamento?"
      recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    - learner: "Sì, ho le schermate con l'orario, salvate quella sera stessa. Credo che bastino a dimostrare che il ritardo non dipendeva da me."
    - tutor: "Allora ha un argomento solido. Che cosa vuole ottenere, concretamente?"
    - learner: "Vorrei, in sostanzza, che la mia domanda venga riesaminata nel merito, come se fosse arrivata in tempo, senza dover ripartire da zero con il bando dell'anno prossimo."
      errors: [spelling, subjunctive-use]
      gold: {text: "che la mia domanda venga riesaminata", fix: "che la mia domanda venisse riesaminata"}
    - tutor: "È una richiesta ragionevole. Ma riascolti «vorrei che la mia domanda venga riesaminata»: dopo «vorrei», il congiuntivo presente è il tempo giusto?"
      prompt: {text: "che la mia domanda venga riesaminata", tags: [subjunctive-use]}
      goals: [situation]
    - learner: "No, l'imperfetto: vorrei che la mia domanda venisse riesaminata nel merito."
    - tutor: "Esatto. Passiamo all'intestazione: come pensa di rivolgersi al Rettore?"
    # decoy: «ho il sospetto che sia» and «mi pare che siano» are correct subjunctives
    - learner: "Avevo pensato a «Gentile Rettore», ma ho il sospetto che sia troppo semplice. In inglese scriverei «Dear Rector» e basta; in italiano, invece, mi pare che le formule di apertura siano molto più elaborate."
    - tutor: "Sospetto fondato. Si usa «Magnifico Rettore», seguito dalla virgola, e la prima frase può cominciare con «mi permetto di sottoporre alla Sua cortese attenzione»."
      goals: [opening-formula]
    - learner: "Benissimo. Il problema è il secondo paragrafo, dove ho scritto: «La vostra decisione è ingiusta e dovete cambiarla subito, perché il portale non funzionava». Non suona un po' troppo aggressivo?"
    - tutor: "Più che aggressivo, è perentorio. Provi a riformularlo: niente «dovete», e al Rettore ci si rivolge con il Lei di cortesia."
    # agree: the tutor approves the softer wording and corrects the person
    - learner: "Ci provo: «Mi permetto di farLe presente che il mancato rinnovo appare frutto di un disguido tecnicco». E poi, per non sembrare insistente, potrei aggiungere: «Le sarei grata se potessi riconsiderare la decisione»."
      errors: [spelling, register]
      gold: {text: "se potessi", fix: "se potesse"}
    - tutor: "La prima frase è già ottima, e l'idea di attenuare ancora è giusta. Ma riascolti «Le sarei grata se potessi»: chi dovrebbe riconsiderare, lei o il Rettore?"
      prompt: {text: "se potessi", tags: [register]}
    - learner: "Il Rettore, quindi Lei: Le sarei grata se potesse riconsiderare la decisione."
    - tutor: "Esatto: così il tono è fermo ma cortese. Resta la chiusura: che cosa le viene in mente?"

# Set r-multi-target, file 6 (three C1, five C2): a tasting menu that changed, a radio interview
# about Turin, remote work from Lecce, dark streets at the town hall, a client handed to a new
# colleague, glass jars and connectives, a façade vote and a letter to the Rector. At C2 the
# target is a concessive, a tricky clitic («accogliere»), a Lei imperative, a register slip, a
# connective or a false friend; the trivial slip before it is ignored.
- scenario: recensione-ristorante
  # facts: cena di lavoro per otto persone, menù degustazione prenotato; due piatti su sei diversi dal sito: risotto al tartufo senza tartufo, secondo di maiale invece che di vitello; due ospiti non mangiano maiale; il tartufo è finito alle nove; vino servito troppo caldo, bottiglia da quaranta euro lasciata quasi piena; offerta: vino tolto dal conto e sconto del venti per cento; il responsabile avviserà il personale stasera; la prossima volta il vino lo offre lui
  level: C1
  persona: en-m-heritage
  history: [false-friend, relative-pronoun, imperative-form]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, e preferisco dirglielo di persona piuttosto che scrivere domani una recensione arrabbiata. Abbiamo prenotato il menù degustazione per otto persone, e due piatti su sei non corrispondevano a quello che c'era sul vostro sito."
    - tutor: "La ringrazio di avermelo detto di persona. Quali piatti sono cambiati?"
      goals: [complain]
    # agree: the tutor condemns the waiter's behaviour and recasts the false friend
    - learner: "Il risotto al tartufo è arrivato senza tartufo, e il secondo era di maiale invece che di vitello. Due dei miei ospiti non mangiano maiale, e quando l'abbiamo fatto notare, il camerierre pretendeva di non saperne niente."
      errors: [spelling, false-friend]
      gold: {text: "pretendeva di non saperne niente", fix: "fingeva di non saperne niente"}
    - tutor: "Se il cameriere fingeva di non saperne niente, è inaccettabile, e ne parlerò con lui. Il tartufo stasera è finito alle nove: avremmo dovuto dirvelo prima di servire."
      recast: {text: "pretendeva di non saperne niente", fix: "fingeva di non saperne niente", tags: [false-friend]}
      goals: [detail]
    # decoy: «Se ce l'aveste detto ... avremmo scelto» is a correct past hypothetical
    - learner: "Esattamente. Se ce l'aveste detto subito, avremmo scelto un altro menù, e i miei ospiti non avrebbero dovuto accontentarsi del contorno. Mi aspettavo il livello della volta scorsa."
    - tutor: "Ha tutte le ragioni. Per scusarmi vorrei togliere il vino dal conto e farvi uno sconto del venti per cento."
      goals: [expectation]
    - learner: "Lo apprezzo. Il vino, a proposito, era servito troppo caldo, e la botiglia, il quale prezzo era di quaranta euro, l'abbiamo lasciata quasi piena."
      errors: [spelling, relative-pronoun]
      gold: {text: "il quale prezzo", fix: "il cui prezzo"}
    - tutor: "Allora è giusto toglierla dal conto. Ma riascolti «il quale prezzo era di quaranta euro»: il prezzo appartiene alla bottiglia. Quale relativo esprime questo possesso?"
      prompt: {text: "il quale prezzo", tags: [relative-pronoun]}
    - learner: "Il cui: la bottiglia il cui prezzo era di quaranta euro."
    - tutor: "Esatto. Allora: vino tolto e venti per cento di sconto. Le va bene?"
    - learner: "Accetto, grazie. Le chiedo solo una cosa: la prossima volta che un piatto del menù manca, avvisa i clienti prima di servirlo, così ognuno può scegliere."
      errors: [imperative-form]
      gold: {text: "avvisa i clienti", fix: "avvisi i clienti"}
    - tutor: "Ha ragione, è il minimo. Ma riascolti «avvisa i clienti»: è un invito rivolto a me, a cui dà del Lei. Quale forma dell'imperativo serve?"
      prompt: {text: "avvisa i clienti", tags: [imperative-form]}
    - learner: "Mi scusi: avvisi i clienti prima di servire il piatto."
    - tutor: "Glielo prometto, lo dirò al personale già stasera. E la prossima volta il vino lo offro io."
      goals: [resolve]

- scenario: vita-in-italia
  # facts: insegnante di Valencia, a Torino da sette anni per amore, marito torinese, tre anni a distanza; difficoltà: riservatezza dei vicini, per due anni la salutavano appena; la signora del terzo piano ha portato una torta per il compleanno della figlia, ora sono amiche; è diventata più paziente e più riservata, gesticola ancora; consiglio: non aspettare che gli altri facciano il primo passo, lei si è iscritta a un coro di quartiere
  level: C1
  persona: es-f-teacher
  history: [ci-ne, subjunctive-use, word-choice]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie per l'invito. Sono arrivata a Torino sette anni fa per amore: mio marito è torinese, e dopo tre anni a distanza abbiamo deciso che uno dei due doveva trasferirsi. Ha vinto il mio coraggio, o forse la sua cucina."
    - tutor: "Il coraggio o la cucina: bella alternativa! Qual è stata la cosa più difficile, all'inizio?"
      goals: [story]
    # decoy: «ci parli del tempo» (con lui) is a correct «ci»
    - learner: "La riservatezza delle persone. A Valencia, se incontri un vicino in ascensore, ci parli del tempo, della famiglia, di tuto; qui, per due anni, i miei vicini mi salutavano a malapena, e io non capivo cosa ci avevo fatto di male."
      errors: [spelling, ci-ne]
      gold: {text: "cosa ci avevo fatto di male", fix: "cosa avevo fatto di male"}
    - tutor: "Un'esperienza che molti ascoltatori riconosceranno. Ma riascolti «cosa ci avevo fatto di male»: a che cosa si riferisce quel «ci»? Serve davvero?"
      prompt: {text: "cosa ci avevo fatto di male", tags: [ci-ne]}
    - learner: "No, non serve: non capivo cosa avevo fatto di male."
    - tutor: "Esatto. E poi le cose sono cambiate?"
      goals: [difficulties]
    - learner: "Sì, piano piano. Un giorno la signora del terzo piano mi ha portato una torta per il compleanno di mia figlia, e da allora siamo amiche. Ho capito che qui la fiducia si conquista lentamente, ma quando arriva, è solida."
    - tutor: "Una bella immagine della città. E lei, in questi sette anni, come è cambiata?"
    - learner: "Sono diventata più paziente, e anche più riservata, lo ametto. Benché sono ancora molto spagnola nel modo di gesticolare, ormai a cena rispetto i tempi degli altri e non interrompo più nessuno."
      errors: [spelling, subjunctive-use]
      gold: {text: "Benché sono ancora molto spagnola", fix: "Benché sia ancora molto spagnola"}
    - tutor: "Il gesticolare non si perde mai, per fortuna. Ma riascolti «benché sono ancora molto spagnola»: dopo «benché», quale modo serve?"
      prompt: {text: "Benché sono ancora molto spagnola", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: benché sia ancora molto spagnola nel modo di gesticolare."
    - tutor: "Esatto. Che consiglio darebbe a chi vuole trasferirsi qui?"
      goals: [change]
    # agree: the tutor praises the advice and recasts the calque
    - learner: "Di non aspettare che siano gli altri a fare il primo passo. Io, per esempio, mi sono iscrita a un coro di quartiere, ed è lì che ho fatto i miei primi amici veri."
      errors: [spelling, word-choice]
      gold: {text: "ho fatto i miei primi amici veri", fix: "mi sono fatta i miei primi amici veri"}
    - tutor: "«Mi sono fatta i miei primi amici veri» in un coro: un consiglio prezioso e molto concreto. Grazie di essere stata con noi!"
      recast: {text: "ho fatto i miei primi amici veri", fix: "mi sono fatta i miei primi amici veri", tags: [word-choice]}
      goals: [advice]

- scenario: smartworking
  # facts: la learner lavora completamente da remoto da due anni per un'azienda di Amsterdam e vive a Lecce; prima lavorava in ufficio a Madrid; comincia alle nove dopo una passeggiata sul lungomare, finisce alle sei; casa piccola, lavora in soggiorno, non stacca; si sente sola, ha conosciuto di persona tre colleghi; vorrebbe tre giorni a casa e due in un coworking vicino al centro; prima calcola i costi, poi lo chiede all'azienda; se dicono di no, se lo paga da sola per due giorni a settimana, circa cento euro al mese
  level: C1
  persona: es-f-erasmus
  history: [comparative, conditional-form, subjunctive-use]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro completamente da remoto, ormai da due anni. La mia azienda è ad Amsterdam, ma io vivo a Lecce: con lo stipendio olandese e gli affitti pugliesi, i conti tornano molto meglio."
    - tutor: "Ti invidio un po', lo confesso. Ma com'è una giornata tipo?"
      goals: [situation]
    - learner: "Comincio alle nove, dopo una passeggiata sul lungomare, e finisco alle sei. Prima lavoravo in uficio a Madrid; adesso mi sento molto più produttiva che i colleghi che lavorano in sede, perché nessuno mi interrompe."
      errors: [spelling, comparative]
      gold: {text: "più produttiva che i colleghi", fix: "più produttiva dei colleghi"}
    - tutor: "Il lungomare prima del lavoro, che lusso. Ma riascolta «più produttiva che i colleghi»: il secondo termine è un nome, «i colleghi». Quale preposizione lo introduce?"
      prompt: {text: "più produttiva che i colleghi", tags: [comparative]}
    - learner: "«Di», con l'articolo: mi sento più produttiva dei colleghi che lavorano in sede."
    - tutor: "Ecco. Quindi solo vantaggi?"
      goals: [pros]
    # decoy: «ne ho conosciuti tre» is a correct partitive with agreement
    - learner: "Magari. Il problema più grande è che la casa è piccola e lavoro in soggiorno, quindi non stacco mai davvero. E a volte mi sento sola: i colleghi li vedo solo sullo schermo, e di persona ne ho conosciuti tre in due anni."
    - tutor: "Lavorare in soggiorno è il modo migliore per non staccare mai, è vero. Che cosa cambieresti, se potessi?"
      goals: [cons]
    # agree: the tutor likes the hybrid idea and corrects the conditional ending
    - learner: "Mi piacerebbe un sistema misto: tre giorni a casa e due in un coworking. Ne ho visto uno vicino al centro storico, e se l'azienda mi pagasse l'abonamento, ci andrebbi volentieri."
      errors: [spelling, conditional-form]
      gold: {text: "ci andrebbi volentieri", fix: "ci andrei volentieri"}
    - tutor: "Un sistema misto mi sembra la soluzione ideale. Ma riascolta «ci andrebbi»: per «io», il condizionale finisce davvero in «-ebbi»?"
      prompt: {text: "ci andrebbi volentieri", tags: [conditional-form]}
    - learner: "No, in «-ei»: ci andrei volentieri."
    - tutor: "Esatto. Hai già chiesto all'azienda?"
    - learner: "Non ancora: prima voglio calcolare quanto costa, così vado da loro con una proposta precisa e non sembra che sto facendo un capriccio."
      errors: [subjunctive-use]
      gold: {text: "non sembra che sto facendo", fix: "non sembra che stia facendo"}
    - tutor: "Mossa intelligente. Ma riascolta «non sembra che sto facendo»: dopo «sembra che», quale modo ci vuole?"
      prompt: {text: "non sembra che sto facendo", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: così non sembra che stia facendo un capriccio."
    - tutor: "Esatto. E se ti dicono di no, l'abbonamento te lo pagheresti da sola?"
    # decoy: «preferirei spendere ... che continuare» correctly takes «che» (two infinitives)
    - learner: "Probabilmente sì, almeno per due giorni a settimana. Per la mia salute mentale, preferirei spendere cento euro al mese che continuare a parlare solo con la mia pianta."
    - tutor: "Mi sembra una spesa ben fatta, e la pianta ti ringrazierà. Fammi sapere che cosa ti rispondono!"
      goals: [preference]

- scenario: reclamo-comune
  # facts: lampioni di via Garibaldi spenti da sei settimane, con una scuola e una palestra che chiudono tardi; tre segnalazioni con l'applicazione del Comune, l'ultima dieci giorni fa, solo risposte automatiche; l'illuminazione pubblica è gestita da un'azienda esterna scelta e pagata dal Comune; risposta al reclamo entro trenta giorni, diritto di accesso agli atti compresa la corrispondenza con l'azienda; protocollo 2291; sollecito formale all'azienda con richiesta di intervento entro quindici giorni
  level: C2
  persona: en-f-professional
  history: [register, subjunctive-use, preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Vengo a presentare un reclamo formale: da sei settimane i lampionni di via Garibaldi sono spenti, e la sera, con la scuola e la palestra che chiudono tardi, tornare a casa è diventato un casino."
      errors: [spelling, register]
      gold: {text: "è diventato un casino", fix: "è diventato pericoloso"}
    - tutor: "Sei settimane al buio sono troppe, e lo metto subito a verbale. Ma riascolti «è diventato un casino»: per un reclamo che finirà agli atti, le sembra il registro adatto?"
      prompt: {text: "è diventato un casino", tags: [register]}
    - learner: "Ha ragione, mi è scappato: tornare a casa è diventato pericoloso, soprattutto per i bambini."
    - tutor: "Così va benissimo per il verbale. Ha già fatto delle segnalazioni?"
      goals: [describe]
    - learner: "Tre, tutte attraverso l'applicazione del Comune, l'ultima dieci giorni fa. Ogni volta ricevo un messaggio automatico che mi ringrazia per la collaborazione, e poi più niente."
    - tutor: "Le vedo tutte e tre. Il punto è che l'illuminazione pubblica è gestita da un'azienda esterna: il Comune può soltanto sollecitarla."
    # agree: the tutor accepts the principle and corrects the concessive
    - learner: "Capisco la divisione delle competenzze, ma per un cittadino il problema resta identico. Per quanto il servizio è affidato a un'azienda esterna, la responsabilità verso di noi rimane del Comune, che quell'azienda l'ha scelta e la paga."
      errors: [spelling, subjunctive-use]
      gold: {text: "Per quanto il servizio è affidato", fix: "Per quanto il servizio sia affidato"}
    - tutor: "Sul principio ha ragione: l'azienda l'ha scelta il Comune. Ma riascolti «per quanto il servizio è affidato»: dopo un concessivo come «per quanto», quale modo si richiede?"
      prompt: {text: "Per quanto il servizio è affidato", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: per quanto il servizio sia affidato a un'azienda esterna, la responsabilità resta del Comune."
    - tutor: "Esatto. Ed è proprio per questo che il reclamo formale ha senso: obbliga il Comune a risponderle."
      goals: [insist]
    - learner: "Allora vorei sapere, in merito di questo reclamo, entro quanto tempo devo aspettarmi una risposta, e se ho diritto a vedere la corrispondenza tra il Comune e l'azienda."
      errors: [spelling, preposition]
      gold: {text: "in merito di questo reclamo", fix: "in merito a questo reclamo"}
    - tutor: "La risposta deve arrivare entro trenta giorni, e lei ha diritto di accesso agli atti, compresa la corrispondenza con l'azienda. Però riascolti «in merito di questo reclamo»: con «in merito», quale preposizione si usa?"
      prompt: {text: "in merito di questo reclamo", tags: [preposition]}
      goals: [rights]
    - learner: "In merito per questo reclamo, quindi."
      errors: [preposition]
    - tutor: "In merito a questo reclamo, allora, le do subito il numero di protocollo: 2291. E allego un sollecito formale all'azienda, con la richiesta di intervenire entro quindici giorni."
      recast: {text: "In merito per questo reclamo", fix: "In merito a questo reclamo", tags: [preposition]}
      goals: [commitment]
    - learner: "La ringrazio. Se fra quindici giorni la via sarà ancora al buio, tornerò con questo numero e chiederò di vedere gli atti."
    - tutor: "Sarà nel suo pieno diritto. E speriamo che stavolta il sollecito basti."

- scenario: mediazione-colleghi
  # facts: ieri il vice della team leader ha annunciato davanti a tutti che il cliente Rossi passa a Martina, la nuova arrivata; la collega lo segue da quattro anni e non sapeva niente; il vice doveva parlargliene prima, come concordato; il gruppo Rossi ha aperto tre alberghi in Austria e chiede un referente che parli tedesco; Martina ha già accolto due volte i loro direttori a Vienna; decisione del direttore per ragioni linguistiche; proposta: la collega resta referente per gli alberghi italiani, per tre mesi seguono insieme quelli austriaci, poi incontro con il direttore; il team leader parla oggi con il vice; la collega prepara una nota sul cliente per venerdì
  level: C2
  persona: es-m-worker
  history: [object-pronoun, subjunctive-use, false-friend]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    # decoy: «preferisco saperlo da lei che sentirlo» correctly takes «che» (two infinitives)
    - learner: "Si accomodi, e mi dica tutto senza giri di parole: se qualcosa non le è andato giù, preferisco saperlo da lei che sentirlo raccontare in corridoio."
    - tutor: "Ieri il suo vice ha annunciato davanti a tutti che il cliente Rossi passa a Martina, la nuova arrivata. Lo seguo da quattro anni, e nessuno mi aveva detto niente."
    - learner: "Capisco che l'abbia vissuta come uno schiaffo, e mi dispiace che l'abbia saputo in quel modo. Le confesso che davo per scontato che il mio vice gliene avrebbe parlato prima della riunione, come avevamo concordato."
    - tutor: "Quindi lei lo sapeva. Questo, se possibile, mi ferisce ancora di più."
      goals: [listen]
    - learner: "Lo sapevo, sì, e me ne assumo la responsabilita. Ma vorrei chiarire una cosa: il gruppo Rossi ha aperto tre alberghi in Austria, i loro direttori ci hanno chiesto un referente che parli tedesco, e Martina gli ha già accolti due volte a Vienna."
      errors: [spelling, object-pronoun]
      gold: {text: "gli ha già accolti", fix: "li ha già accolti"}
    - tutor: "Questo non lo sapevo. Ma ripeta «Martina gli ha già accolti»: si accoglie qualcuno o si accoglie a qualcuno?"
      prompt: {text: "gli ha già accolti", tags: [object-pronoun]}
      goals: [clarify]
    - learner: "Diretto: Martina li ha già accolti due volte a Vienna."
    - tutor: "Ammetto che il tedesco io non lo parlo. Ma quattro anni di lavoro non contano niente?"
    - learner: "Contano moltissimo, ed è per questo che nessuno vuole toglierle il cliente. La decisione l'ha presa il direttore per una ragione linguistica, non per sfiducia, benché capisco che da fuori potesse sembrare così."
      errors: [subjunctive-use]
      gold: {text: "benché capisco", fix: "benché capisca"}
    - tutor: "Detta così, la cosa suona diversa. Ma riascolti «benché capisco»: dopo «benché», l'indicativo è ammesso?"
      prompt: {text: "benché capisco", tags: [subjunctive-use]}
    - learner: "No, ci vuole il congiuntivo: benché capisca che da fuori potesse sembrare così."
    - tutor: "Esatto. Resta però il fatto che me l'ha comunicato la persona sbagliata, nel modo sbagliato."
      goals: [perspective]
    # agree: the tutor accepts the arrangement and recasts the false friend
    - learner: "Su questo ha perfetamente ragione, e non cerco scuse. Le propongo questo: lei resta la referente per gli alberghi italiani, e per tre mesi seguite insieme quelli austriaci. Non la vedo come una semplice compromissione, ma come un passaggio graduale."
      errors: [spelling, false-friend]
      gold: {text: "una semplice compromissione", fix: "un semplice compromesso"}
    - tutor: "Un semplice compromesso non mi basterebbe, lo confesso; ma tre mesi di lavoro insieme sugli alberghi austriaci mi sembrano onesti. Chi ne parla al suo vice?"
      recast: {text: "una semplice compromissione", fix: "un semplice compromesso", tags: [false-friend]}
    - learner: "Ne parlo io, oggi stesso, e gli chiederò di scusarsi con lei. Lei, invece, mi faccia un favore: prepari per venerdì una breve nota sul cliente, così la presentiamo insieme al direttore."
    - tutor: "Venerdì l'avrà. E grazie: sono entrata qui furiosa, ed esco un po' meno."
      goals: [solution]

- scenario: trattativa-fornitore
  # facts: fornitore di vasetti di vetro per confetture; aumento del dodici per cento deciso senza consultare il cliente; cliente da sei anni, non vuole cambiare fornitore; costi energetici: il vetro si fonde a 1.500 gradi; il cliente ha presentato al fornitore due aziende, la Rossi e la Bianchi, oggi sue clienti; due strade: sei per cento o formati ridotti da tre a due; con due formati il fornitore arriva al nove; con pagamento a trenta giorni invece che a sessanta scende all'otto; prezzo valido fino alla fine dell'anno prossimo, variazioni comunicate con tre mesi di anticipo; conferma via PEC lunedì
  level: C2
  persona: en-m-heritage
  history: [word-choice, hypothetical, subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    # decoy: «piuttosto che firmare» means «instead of», which is correct
    - learner: "Buongiorno. La chiamo, sì, e le dico subito che non intendo cambiare fornitore: in sei anni ci siamo trovati benissimo. Però un aumento del dodici per cento, deciso senza consultarci, mi costringe a valutare altre offerte piuttosto che firmare a scatola chiusa."
    - tutor: "Apprezzo la franchezza. I nostri costi energetici, però, sono cresciuti più del previsto: il vetro si fonde a 1.500 gradi, e il gas lo paghiamo tutti."
      goals: [problem]
    # agree: the tutor acknowledges the referrals and recasts the connective
    - learner: "Non metto in dubio i vostri conti. Ma vorrei ricordarle che negli ultimi due anni vi abbiamo presentato due aziende del nostro settore, la Rossi piuttosto che la Bianchi, che oggi sono vostre clienti."
      errors: [spelling, word-choice]
      gold: {text: "la Rossi piuttosto che la Bianchi", fix: "la Rossi e la Bianchi"}
    - tutor: "La Rossi e la Bianchi, certo: due clienti che ci avete portato voi, e non lo dimentico. Che cosa mi propone, allora?"
      recast: {text: "la Rossi piuttosto che la Bianchi", fix: "la Rossi e la Bianchi", tags: [word-choice]}
      goals: [argue]
    - learner: "Le propongo due strade: o un aumento del sei per cento, o una riduzione dei formati da tre a due. Se avessimo unificato i formati già l'anno scorso, oggi le vostre linee lavorassero con molti meno cambi."
      errors: [hypothetical]
      gold: {text: "oggi le vostre linee lavorassero", fix: "oggi le vostre linee lavorerebbero"}
    - tutor: "Due strade chiare. Ma riascolti «oggi le vostre linee lavorassero»: è la conseguenza dell'ipotesi, non la condizione. Quale modo ci vuole?"
      prompt: {text: "oggi le vostre linee lavorassero", tags: [hypothetical]}
    - learner: "Il condizionale: oggi le vostre linee lavorerebbero con molti meno cambi."
    - tutor: "Esatto. La seconda strada mi interessa: con due formati posso arrivare al nove per cento."
      goals: [counteroffer]
    - learner: "Il nove è ancora alto. E se vi pagassimo a trenta giorni invece che a sessanta? Il mio dirrettore finanziario ritiene che, con un incasso così rapido, potreste arrivare all'otto senza che i vostri margini ne risentono."
      errors: [spelling, subjunctive-use]
      gold: {text: "senza che i vostri margini ne risentono", fix: "senza che i vostri margini ne risentano"}

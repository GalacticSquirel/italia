- scenario: recensione-ristorante
  # facts: pranzo di lavoro per sei persone, prenotato da due settimane; tavolo vicino alla porta della cucina, molto rumoroso; il cliente aveva chiesto un tavolo tranquillo; pesce del giorno finito alle dodici e mezza; il secondo arrivato freddo; l'offerta del responsabile: il caffè e un amaro offerti e il quindici per cento di sconto; il cliente accetta lo sconto ma chiede un tavolo nella sala interna per la prossima volta, il ventotto
  level: B2
  persona: en-m-traveller
  history: [hypothetical, ci-ne, register]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, più di uno, purtroppo. Avevo prenotato un pranzo di lavoro per sei persone due settimane fa, e avevo chiesto un tavolo tranquillo."
    - tutor: "E invece vi abbiamo messi vicino alla porta della cucina, lo vedo. Che cos'altro non è andato?"
      goals: [complain]
    - learner: "Il pesce del giorno era già finito a mezzogiorno e mezzo, e il mio secondo è arrivato freddo. Con dei clienti a tavola, per me è stato davvero imbarazzante."
    - tutor: "Capisco benissimo, in un pranzo di lavoro è la cosa peggiore. Che cosa si aspettava da noi?"
      goals: [detail]
    # agree: the tutor accepts the point about the warning
    - learner: "Mi aspettavo almeno un avviso. Se il cameriere ci avvertiva subito del pesce, avremmo scelto un altro piatto senza perdere tempo e senza fare brutta figura."
      errors: [hypothetical]
      gold: {text: "Se il cameriere ci avvertiva", fix: "Se il cameriere ci avesse avvertiti"}
    - tutor: "Sull'avviso ha perfettamente ragione: andava dato all'inizio. Però in «se il cameriere ci avvertiva» parla di un'ipotesi nel passato, non realizzata: quale tempo serve dopo «se»?"
      prompt: {text: "Se il cameriere ci avvertiva", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se il cameriere ci avesse avvertiti, avremmo scelto un altro piatto."
    - tutor: "Proprio così. Per scusarmi le offro il caffè e un amaro per tutti, e il quindici per cento di sconto sul conto. Le va bene?"
      goals: [expectation]
    - learner: "Lo sconto lo accetto volentieri, grazie. Il caffè no, perché i miei clienti devono già andare, ma ne prendo uno io con piacere."
    - tutor: "Glielo porto subito. Le preparo il conto con lo sconto?"
    - learner: "Sì, grazie. Un'ultima cosa: il ventotto tornerò con lo stesso gruppo. Ci puoi tenere un tavolo nella sala interna, lontano dalla cucina?"
      errors: [register]
      gold: {text: "Ci puoi tenere", fix: "Ci può tenere"}
    - tutor: "Per il ventotto la sala interna è libera. Ma ripeta «ci puoi tenere»: finora ci siamo dati del Lei, giusto?"
      prompt: {text: "Ci puoi tenere", tags: [register]}
    - learner: "Ha ragione, scusi: ci può tenere un tavolo nella sala interna?"
    - tutor: "Certo, glielo tengo io: il ventotto, sala interna, sei persone. E questa volta il pesce lo mettiamo da parte per voi."
      goals: [resolve]

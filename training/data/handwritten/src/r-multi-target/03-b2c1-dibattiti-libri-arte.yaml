# Set r-multi-target, file 3 (six B2, two C1): closing the centre to cars, two book-club novels,
# a portrait at an exhibition, automation at dinner, a lakeside wedding, a family flat with a
# relocation clause and a chain collision on the ring road. The trivial slip comes first and is
# ignored; the tutor often agrees with the idea before correcting the target.
- scenario: dibattito-ambiente
  # facts: la learner abita e lavora in centro e va in bicicletta; argomenti: inquinamento e sicurezza dei bambini; esempio: nella città inglese dove abitava, la strada principale è diventata pedonale e dopo un anno i negozi lavoravano di più; obiezione: qui molti clienti arrivano in macchina dai paesi vicini; compromesso: centro chiuso solo nel fine settimana per sei mesi, parcheggio gratis e navetta; paga la città all'inizio; proposta alla riunione di giovedì
  level: B2
  persona: en-f-professional
  history: [subjunctive-use, relative-pronoun, hypothetical]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io invece sono a favore. Abito e lavoro in centro, vado dappertutto in bicicletta, e ogni mattina respiro il fumo delle macchine ferme al semaforo."
    - tutor: "Lei va in bicicletta, ma molti residenti sono anziani e senza macchina non si muovono. Qual è il suo argomento principale?"
      goals: [position]
    # agree: the tutor accepts the safety argument and corrects the mood
    - learner: "Ne ho due. Prima di tutto lo inquinamento: l'aria in centro è pessima, e il sistema dei mezzi pubblici funziona bene. Poi penso che le strade senza auto sono più sicure per i bambini."
      errors: [article-form, subjunctive-use]
      gold: {text: "penso che le strade senza auto sono più sicure", fix: "penso che le strade senza auto siano più sicure"}
    - tutor: "Sulla sicurezza dei bambini le do ragione, nessuno dice il contrario. Però ripeta «penso che le strade senza auto sono»: dopo «penso che», quale modo usiamo?"
      prompt: {text: "penso che le strade senza auto sono più sicure", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: penso che le strade senza auto siano più sicure."
    - tutor: "D'accordo. Ma i commercianti dicono che senza parcheggi perderanno metà dei clienti. Come risponde?"
      goals: [argue]
    - learner: "Capisco la paura. Ma nella città dove abitavo prima, in Inghilterra, la strada principale, in quale c'erano tanti negozi, è diventata pedonale, e dopo un anno i negozi lavoravano di più."
      errors: [relative-pronoun]
      gold: {text: "in quale c'erano", fix: "in cui c'erano"}
    - tutor: "Un esempio vero, interessante. Ma ripeta «la strada principale, in quale c'erano tanti negozi»: dopo «in», «quale» può stare senza articolo?"
      prompt: {text: "in quale c'erano", tags: [relative-pronoun]}
    - learner: "No: la strada in cui c'erano tanti negozi."
    - tutor: "Giusto. Ammetto che l'esempio fa pensare, ma qui da noi molti clienti arrivano in macchina dai paesi vicini."
      goals: [counter]
    # decoy: «che porti» is a correct subjunctive in a relative clause
    - learner: "È vero, e su questo ha ragione lei. Allora propongo una soluzione di mezzo: chiudiamo il centro solo nel fine settimana, per sei mesi, con un parcheggio gratis e una navetta che porti i clienti in centro."
    - tutor: "Sei mesi di prova, con parcheggio e navetta: questo potrei accettarlo anch'io. Chi dovrebbe pagare la navetta, secondo lei?"
    # agree: the tutor accepts who pays and corrects the hypothetical
    - learner: "Secondo me la comune, almeno all'inizio. Se dopo sei mesi i commercianti vedrebbero più clienti, potrebbero pagarne una parte loro."
      errors: [noun-gender, hypothetical]
      gold: {text: "Se dopo sei mesi i commercianti vedrebbero", fix: "Se dopo sei mesi i commercianti vedessero"}
    - tutor: "Che all'inizio paghi la città mi sembra giusto. Ma ripeta «se i commercianti vedrebbero»: dopo «se», il condizionale va bene?"
      prompt: {text: "Se dopo sei mesi i commercianti vedrebbero", tags: [hypothetical]}
    - learner: "No: se i commercianti vedessero più clienti, potrebbero pagarne una parte."
    - tutor: "Esatto. Mi sembra una soluzione onesta: la proponiamo insieme alla riunione di giovedì?"
      goals: [concede]
    - learner: "Volentieri. Prepariamo una proposta scritta con i numeri, così si vede che residenti e commercianti sono d'accordo."
    - tutor: "D'accordo, allora ci vediamo giovedì con la proposta."

- scenario: film-libro
  # facts: romanzo «Il mare d'inverno» di un'autrice siciliana; Roberto non lo conosce; famiglia di pescatori negli anni Sessanta; protagonista Rosa, la figlia più grande, aiuta il padre e sogna di studiare medicina a Palermo; un giorno arriva una lettera; Rosa è coraggiosa ma chiusa, vuole molto bene alla nonna; prima parte bellissima, seconda più lenta; consigliato a chi ama le storie di famiglia e non ha fretta
  level: B2
  persona: es-m-worker
  history: [tense-aspect, false-friend, comparative]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io. Ho letto «Il mare d'inverno», un romanzo di un'autrice siciliana che non conoscevo. È la storia di una famiglia di pescatori negli anni Sessanta."
    - tutor: "Non lo conosco, quindi racconta pure, ma senza dirci il finale!"
    - learner: "Va bene! La protagonista è Rosa, la figlia più grande. Tuti i giorni aiutava il padre, ma sognava di studiare medicina a Palermo. Un giorno, mentre puliva il pesce, è arrivata una lettera, e la sua vita cambiava."
      errors: [spelling, tense-aspect]
      gold: {text: "la sua vita cambiava", fix: "la sua vita è cambiata"}
    - tutor: "Sembra una bella storia. Ma ripeti «e la sua vita cambiava»: è un cambiamento che succede in quel momento, una volta sola. Quale passato ci vuole?"
      prompt: {text: "la sua vita cambiava", tags: [tense-aspect]}
    - learner: "Il passato prossimo: e la sua vita è cambiata."
    - tutor: "Esatto. E Rosa, com'è come personaggio?"
      goals: [summary]
    - learner: "È una ragazza coraggiosa, ma chiusa: parla poco e non piange mai. Però con la nonna è diversa, si vede che la vuole molto."
      errors: [false-friend]
      gold: {text: "la vuole molto", fix: "le vuole molto bene"}
    - tutor: "Si capisce dalle piccole cose che le vuole molto bene, immagino. Ti è piaciuto il libro, alla fine?"
      recast: {text: "la vuole molto", fix: "le vuole molto bene", tags: [false-friend]}
      goals: [characters]
    - learner: "Sì, mi è piaciuto, ma non tutto. La prima parte è bellissima; la seconda, invece, mi è sembrata un pò lenta, molto più lenta che la prima."
      errors: [spelling, comparative]
      gold: {text: "più lenta che la prima", fix: "più lenta della prima"}
    - tutor: "Capita spesso, con i romanzi lunghi. Ma ripeti «più lenta che la prima»: il secondo termine è «la prima», cioè la prima parte. Quale parola lo introduce?"
      prompt: {text: "più lenta che la prima", tags: [comparative]}
    - learner: "Della: molto più lenta della prima."
    - tutor: "Giusto. A chi lo consiglieresti, allora?"
      goals: [opinion]
    - learner: "A chi ama le storie di famiglia e non ha fretta. A chi cerca un libro pieno di azione, no: si annoierebbe dopo cinquanta pagine."
    - tutor: "Allora lo metto nella lista del mese prossimo, per i più pazienti. Grazie, chi è il prossimo?"
      goals: [recommend]

- scenario: arte-mostra
  # facts: ritratto di una donna con un libro aperto in mano; sguardo serio, luce da sinistra sul viso e sulle mani; sfondo quasi nero; vestito rosso con piccoli fiori sulla stoffa; il quadro è stato restaurato l'anno scorso, prima il viso si vedeva appena; il learner ricorda un ritratto visto a Londra anni fa, con colori più chiari; dopo, l'altra sala
  level: B2
  persona: en-m-traveller
  history: [passive, object-pronoun, comparative]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce molto. La donna ha uno sguardo serio, quasi triste, e la luce che arriva da sinistra le illumina solo il viso e le mani."
    - tutor: "Hai l'occhio giusto: in questo quadro la luce è tutto. Cos'altro vedi?"
      goals: [react]
    - learner: "Ha un libro aperto in mano, e il sfondo è quasi nero. Il vestito rosso è stato dipinta con molta cura: si vedono anche i piccoli fiori della stoffa."
      errors: [article-form, passive]
      gold: {text: "è stato dipinta", fix: "è stato dipinto"}
    - tutor: "I fiori della stoffa li ho notati anch'io, sono bellissimi. Ma ripeti «il vestito rosso è stato dipinta»: il soggetto è «il vestito», quindi come finisce «dipinta»?"
      prompt: {text: "è stato dipinta", tags: [passive]}
    - learner: "Al maschile: il vestito è stato dipinto con molta cura."
    - tutor: "Esatto. E secondo te, perché il pittore le ha messo in mano un libro?"
      goals: [describe]
    - learner: "Forse voleva mostrare che era una donna colta. Credo che il pittore volesse dire che la sua vita interiore era più importante della bellezza."
    - tutor: "Mi piace l'idea della vita interiore. Sai che il quadro è stato restaurato l'anno scorso? Prima il viso si vedeva appena."
      goals: [interpret]
    - learner: "Davvero? Allora sono contento di vederlo adesso. Mi fa pensare a un ritratto che ho visto a Londra anni fa: una ragazza con lo stesso luce, e anche lì l'artista le aveva dipinto con le mani sul tavolo."
      errors: [noun-gender, object-pronoun]
      gold: {text: "le aveva dipinto", fix: "l'aveva dipinta"}
    - tutor: "Il confronto è interessante. Ma ripeti «le aveva dipinto»: l'artista ha dipinto «a lei» o ha dipinto «lei»? Allora quale pronome ci vuole?"
      prompt: {text: "le aveva dipinto", tags: [object-pronoun]}
    - learner: "Lei, quindi diretto: l'aveva dipinta con le mani sul tavolo."
    - tutor: "Giusto. E rispetto a quel quadro, questo ti sembra più moderno o più antico?"
    # agree: the tutor shares the judgement and corrects the comparative
    - learner: "Più antico, direi. Quello di Londra aveva colori chiari; questo è più scuro e misterioso, ma secondo me molto più bello che quello."
      errors: [comparative]
      gold: {text: "più bello che quello", fix: "più bello di quello"}
    - tutor: "Sul mistero sono d'accordo con te, è quello che lo rende speciale. Ma ripeti «più bello che quello»: il secondo termine è «quello», quindi quale parola lo introduce?"
      prompt: {text: "più bello che quello", tags: [comparative]}
    - learner: "Di: molto più bello di quello."
    - tutor: "Esatto. Andiamo a vedere l'altra sala?"
      goals: [compare]

- scenario: politica-lavoro
  # facts: Riccardo è pessimista; la learner pensa che i lavori cambieranno; esempio: la sorella lavorava come cassiera, l'azienda le ha pagato un corso quando sono arrivate le casse automatiche, ora le controlla lei ed è più contenta; ipotesi: corsi gratis pagati dallo Stato; chi paga: le aziende che risparmiano con l'automazione; Riccardo alla fine è un po' meno pessimista
  level: B2
  persona: es-f-teacher
  history: [ci-ne, hypothetical]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri un po'. Alcuni lavori spariranno, è vero, ma ne nasceranno altri che oggi non possiamo neanche immaginare."
    - tutor: "Facile dirlo, ma chi perde il lavoro a cinquant'anni non cambia mestiere in un mese. Hai un esempio?"
      goals: [opinion]
    - learner: "Sì, uno vero. Mia sorella lavorava come cassiera, e quando hanno messo le casse automatiche, la azienda le ha pagato un corso. Adesso le controlla lei, e quando le ho chiesto cosa ci pensa, mi ha detto che è più contenta di prima."
      errors: [article-form, ci-ne]
      gold: {text: "cosa ci pensa", fix: "cosa ne pensa"}
    - tutor: "È un bell'esempio, e reale. Ma ripeti «cosa ci pensa»: quando chiedi un'opinione su qualcosa, con «pensare» si usa «ci»?"
      prompt: {text: "cosa ci pensa", tags: [ci-ne]}
      goals: [example]
    - learner: "Ne: le ho chiesto cosa ne pensa."
    - tutor: "Giusto. Ma tua sorella ha avuto fortuna. E se l'azienda non avesse pagato niente?"
    # agree: the tutor accepts free training and corrects the hypothetical
    - learner: "Allora sarebbe stato molto più dificile. Per questo penso che, se lo Stato pagherebbe corsi gratis a tutti, molte persone potrebbero cambiare lavoro senza paura."
      errors: [spelling, hypothetical]
      gold: {text: "se lo Stato pagherebbe", fix: "se lo Stato pagasse"}
    - tutor: "Sui corsi gratis per tutti sono d'accordo anch'io. Ma ripeti «se lo Stato pagherebbe»: dopo «se», il condizionale va bene?"
      prompt: {text: "se lo Stato pagherebbe", tags: [hypothetical]}
    - learner: "Se lo Stato paga corsi gratis, volevo dire."
      errors: [hypothetical]
    - tutor: "Se lo Stato pagasse corsi gratis, sì, molti cambierebbero lavoro. Ma chi li paga, questi corsi, con le tasse che abbiamo già?"
      recast: {text: "Se lo Stato paga", fix: "Se lo Stato pagasse", tags: [hypothetical]}
      goals: [hypothesis]
    - learner: "Le aziende che usano l'automazione, per esempio. Se risparmiano tanto con le macchine, una parte di quei soldi la possono dare per la formazione."
    - tutor: "Non è una cattiva idea, devo ammetterlo. Allora, per concludere, tu cosa pensi?"
    - learner: "Penso che il lavoro non sparirà, ma cambierà molto, e che nessuno debba restare indietro. E tu, dopo questa discussione, sei ancora così pessimista?"
    - tutor: "Un po' meno, lo ammetto. Ma ne parliamo di nuovo tra dieci anni, e vediamo chi aveva ragione!"
      goals: [conclude]

- scenario: organizzare-matrimonio
  # facts: matrimonio a giugno vicino al lago, circa ottanta invitati, tanta musica; budget massimo 25.000 euro, i genitori aiutano, dopo vogliono comprare casa; villa sul lago a 7.000 euro fino a cento persone, ristorante con giardino a 4.500 fino a novanta, con sala interna se piove; scelgono il ristorante; dieci invitati vegetariani, menù senza costi in più; il fotografo, un amico, lo scelgono loro; prova del menù sabato prossimo alle dodici al ristorante
  level: B2
  persona: en-f-professional
  history: [subjunctive-use, relative-pronoun]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo semplice e allegro: a giugno, vicino al lago, con circa ottanta invitati e tanta musica."
    - tutor: "Il lago a giugno è perfetto. Che budget avete in mente?"
      goals: [vision]
    - learner: "Al massimo 25.000 euro, tutto compreso. I nostri genitori ci aiutano, ma non vogliamo spendere di più, perché dopo il matrimonio pensiamo di comprare casa."
    - tutor: "Con 25.000 euro si può fare molto. Ho due posti: una villa sul lago a 7.000 euro, fino a cento persone, o un ristorante con giardino a 4.500, fino a novanta."
      goals: [budget]
    - learner: "La villa è un sogno, ma 7.000 euro sono tropi. Il ristorante mi piace, però ho paura che piove: se il giardino è all'aperto, cosa succede?"
      errors: [spelling, subjunctive-use]
      gold: {text: "ho paura che piove", fix: "ho paura che piova"}
    - tutor: "Se piove, il ristorante ha una sala interna per novanta persone. Però ripeta «ho paura che piove»: dopo «ho paura che», quale modo ci vuole?"
      prompt: {text: "ho paura che piove", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: ho paura che piova. Allora scegliamo il ristorante."
    - tutor: "Ottima scelta, anche per il budget. Avete qualche richiesta particolare?"
      goals: [choices]
    - learner: "Sì, due condizioni. Dieci invitati sono vegetariani: vorremmo per loro un menù diverso, senza costi in più. E il fotografo, di chi le ho parlato al telefono, lo scegliamo noi."
      errors: [relative-pronoun]
      gold: {text: "di chi le ho parlato", fix: "di cui le ho parlato"}
    - tutor: "Il menù per loro il ristorante lo prepara senza costi in più. Però ripeta «il fotografo, di chi le ho parlato»: «chi» si riferisce al fotografo, già nominato. Con «di», quale forma serve?"
      prompt: {text: "di chi le ho parlato", tags: [relative-pronoun]}
    - learner: "Il fotografo, del quale... no, di che le ho parlato."
      errors: [relative-pronoun]
    - tutor: "«Il fotografo di cui le ho parlato»: sì, ricordo la telefonata. Lo scegliete voi, nessun problema."
      recast: {text: "di che le ho parlato", fix: "di cui le ho parlato", tags: [relative-pronoun]}
    - learner: "Perfetto. Allora quando ci vediamo per provare il menù?"
    - tutor: "Sabato prossimo alle dodici, al ristorante. Portate anche il vostro amico fotografo, se può."
      goals: [conditions]

- scenario: film-libro
  # facts: giallo «L'ultima corsa», ambientato a Trieste d'inverno con la bora; un commissario in pensione trova una donna morta sul tram; la polizia dice incidente; lui l'aveva vista e salutata al bar il giorno prima; il commissario è solo, testardo e sensibile; il learner ha capito chi era l'assassino a pagina cento su trecento; consigliato ai lettori di gialli che preferiscono le atmosfere all'azione, come la moglie del learner
  level: B2
  persona: en-m-retired
  history: [participle-agreement, false-friend, relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io ho letto un giallo, «L'ultima corsa». È ambientato a Trieste, d'inverno, con la bora che soffia per tutto il libro."
    - tutor: "Un giallo con la bora, mi piace già. Di cosa parla, senza dirci chi è l'assassino?"
    - learner: "Un commissario in pensione trova una dona morta sul tram. La polizia dice che è un incidente, ma lui non ci crede: il giorno prima l'aveva vista al bar e l'aveva salutato."
      errors: [spelling, participle-agreement]
      gold: {text: "l'aveva salutato", fix: "l'aveva salutata"}
    - tutor: "Comincia bene, c'è subito un mistero. Ma ripeti «l'aveva salutato»: quel «l'» è la donna morta, quindi come finisce «salutato»?"
      prompt: {text: "l'aveva salutato", tags: [participle-agreement]}
    - learner: "Al femminile: l'aveva vista e l'aveva salutata."
    - tutor: "Esatto. E il commissario, com'è come personaggio?"
      goals: [summary]
    # decoy: «sensibile» in its real meaning, sensitive
    - learner: "È un uomo solo e un po' testardo, ma molto sensibile: capisce le persone guardandole negli occhi, e per questo nessuno riesce a mentirgli."
    - tutor: "Un commissario sensibile e testardo: sembra un personaggio vero. Ti è piaciuto il libro?"
      goals: [characters]
    - learner: "Abbastanza, ma il finale mi ha deluso. Ho realizzato chi era l'assassino già a pagina cento, e il libro ne ha trecento."
      errors: [false-friend]
      gold: {text: "realizzato", fix: "capito"}
    - tutor: "Capito a pagina cento su trecento? Allora il finale non è una grande sorpresa, peccato. A chi lo consiglieresti?"
      recast: {text: "realizzato", fix: "capito", tags: [false-friend]}
      goals: [opinion]
    # agree: the tutor approves the reader he has in mind and corrects the relative
    - learner: "Ai lettori di gialli che preferiscono le atmosfere all'azione. A mia moglie, per esempio, che legge tutti i libri della colezione, e con chi parlo sempre dei personaggi."
      errors: [spelling, relative-pronoun]
      gold: {text: "con chi parlo sempre", fix: "con cui parlo sempre"}
    - tutor: "Mi sembra la lettrice ideale. Ma ripeti «con chi parlo sempre»: qui parli di tua moglie, già nominata. Dopo «con», quale forma usiamo al posto di «chi»?"
      prompt: {text: "con chi parlo sempre", tags: [relative-pronoun]}
    - learner: "Con cui: mia moglie, con cui parlo sempre dei personaggi."
    - tutor: "Proprio così. Allora lo propongo anche al gruppo dei gialli. Grazie, chi è il prossimo?"
      goals: [recommend]

- scenario: trattativa-affitto
  # facts: appartamento a Milano per una famiglia, scuola dei bambini a dieci minuti a piedi; nessun posto auto; box nel cortile a 150 euro oltre al canone di 1.400; proposta della learner: 1.450 euro box compreso; il proprietario di solito chiede un contratto lungo, per lei va bene; clausola di recesso con tre mesi di preavviso in caso di trasferimento documentato; con la cedolare secca il canone non viene aggiornato ogni anno; l'agente la richiama entro le sette; firma martedì in agenzia se il proprietario accetta
  level: C1
  persona: en-f-professional
  history: [subjunctive-use, false-friend, conditional-form]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Moltissimo, devo dire. La disposizione delle stanze è perfetta per noi, e la scuola dei bambini è a dieci minuti a piedi. L'unica cosa che mi preoccupa è che non ci sia un posto auto."
    - tutor: "La capisco, in questa zona parcheggiare è un'impresa. Il proprietario, però, affitta anche un box nel cortile, a 150 euro al mese oltre al canone di 1.400."
      goals: [interest]
    # agree: the tutor takes up the proposal and recasts the false friend
    - learner: "Così arriviamo a 1.550 euro, che supera il nostro budget. Come inquilina sono molto afidabile, e credo che la proposta più sensibile sia un prezzo unico, box compreso, di 1.450 euro."
      errors: [spelling, false-friend]
      gold: {text: "la proposta più sensibile", fix: "la proposta più sensata"}
    - tutor: "Una cifra unica, box compreso: in effetti è la proposta più sensata, e il proprietario potrebbe accettarla. Di solito, però, in cambio chiede un contratto lungo. Per lei sarebbe un problema?"
      recast: {text: "la proposta più sensibile", fix: "la proposta più sensata", tags: [false-friend]}
      goals: [negotiate]
    # agree: the tutor finds the clause legitimate and corrects the sequence of tenses
    - learner: "Nessun problema per la durata, anzi, cerchiamo stabilità. Però lavoro per una multinazionale, ed è possibile che mi transferiscano all'estero: sarebbe necessario che nel contratto ci sia una clausola per questo caso."
      errors: [spelling, subjunctive-use]
      gold: {text: "sarebbe necessario che nel contratto ci sia", fix: "sarebbe necessario che nel contratto ci fosse"}
    - tutor: "Una clausola per il trasferimento è una richiesta legittima. Ma riascolti «sarebbe necessario che nel contratto ci sia»: con la principale al condizionale, quale tempo del congiuntivo segue?"
      prompt: {text: "sarebbe necessario che nel contratto ci sia", tags: [subjunctive-use]}
    - learner: "L'imperfetto: sarebbe necessario che nel contratto ci fosse una clausola di recesso anticipato."
    - tutor: "Esatto. Si può scrivere così: recesso con tre mesi di preavviso, in caso di trasferimento documentato. Le andrebbe bene?"
      goals: [conditions]
    - learner: "Tre mesi mi sembrano più che ragionevoli. Se il proprietario accettasse anche il prezzo di 1.450 euro, box compreso, potremo considerare chiusa la trattativa."
      errors: [conditional-form]
      gold: {text: "potremo considerare", fix: "potremmo considerare"}

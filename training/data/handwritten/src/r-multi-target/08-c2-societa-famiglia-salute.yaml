# Set r-multi-target, file 8 (C2): a Florentine guide against the entry ticket, a sceptical
# colleague on short-term rentals, meeting the partner's parents, a condolence visit, atrial
# fibrillation at seventy, a flat with a cat, a packaging pitch and Sunday lunch in Bologna.
# Correct «piuttosto che» (instead of), «il cui», «attualmente» (at the moment), «pretendo» and
# «gliel'hanno» are left alone; the trivial slip before each target is ignored.
- scenario: turismo-di-massa
  # facts: guida turistica di Firenze, contrario al ticket; gruppi di cinquanta persone in pullman da Livorno, scendono dalla nave alle nove e risalgono alle cinque; il conduttore: il ticket servirebbe a contarli; code ai musei anche con il biglietto a venticinque euro; il conduttore è stato agli Uffizi in agosto; proposta: numero chiuso per i pullman con prenotazione, tassa sulle crociere con i proventi ai trasporti per i residenti, a patto che i soldi non spariscano nel bilancio
  level: C2
  persona: es-m-worker
  history: [word-choice, register, subjunctive-use]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Sono una guida turistica di Firenze, e le dico subito che sono contrario: un biglietto d'ingresso trasforma la città in un parco a tema, e i residenti in comparse."
    - tutor: "Contrario, e per giunta guida turistica: interessante. Perché dovremmo crederle?"
      goals: [introduce]
    # agree: the tutor accepts the picture and recasts the calque
    - learner: "Perché vedo ogni giorno chi è il vero problema: non la famiglia che resta tre notti, ma i gruppi di cinquanta persone che arrivano in pulman da Livorno e, tra la nave e il ritorno, fanno una corsa contro l'orologio dagli Uffizi a Ponte Vecchio."
      errors: [spelling, word-choice]
      gold: {text: "una corsa contro l'orologio", fix: "una corsa contro il tempo"}
    - tutor: "Una corsa contro il tempo, in effetti, che lascia ben poco alla città. Ma il ticket, almeno, permetterebbe di contarli: non le sembra un primo passo?"
      recast: {text: "una corsa contro l'orologio", fix: "una corsa contro il tempo", tags: [word-choice]}
      goals: [example]
    # decoy: «Se dieci anni fa avessimo limitato..., oggi sarebbe» is a correct mixed hypothetical
    - learner: "Contarli sì, fermarli no. Se dieci anni fa avessimo limitato i pullman, oggi il centro sarebbe ancora abitato; invece abbiamo preferito incassare, e adesso i fiorentini vivono in periferia."
    - tutor: "Lei però parla del passato. Con il ticket, chi viene per poche ore pagherebbe almeno il costo che lascia alla città."
    - learner: "Pagherebbe, certo, ma continuerebbe a venire, come dimostrano le code ai musei, che ci sono anche con un biglieto a venticinque euro. Lei è mai stato agli Uffizi in agosto? Ci vada, e poi mi sai dire."
      errors: [spelling, register]
      gold: {text: "poi mi sai dire", fix: "poi mi sa dire"}
    - tutor: "Ci sono stato, e le code me le ricordo bene. Ma riascolti «ci vada, e poi mi sai dire»: nella stessa frase è passato dal Lei al tu. Quale persona mi spetta?"
      prompt: {text: "poi mi sai dire", tags: [register]}
    - learner: "Ha ragione, mi scusi: ci vada, e poi mi sa dire."
    - tutor: "Ricevuto. Allora qual è la sua proposta concreta, al posto del ticket?"
      goals: [rebut]
    - learner: "Un numero chiuso per i pullman turistici, con prenotazione obbligatoria, e una tassa sulle crociere i cui proventi vadano ai trasporti per i residenti, a patto che i soldi non spariscono nel bilancio generale."
      errors: [subjunctive-use]
      gold: {text: "a patto che i soldi non spariscono", fix: "a patto che i soldi non spariscano"}
    - tutor: "Il rischio che si perdano nel bilancio esiste, è vero. Ma riascolti «a patto che i soldi non spariscono»: dopo «a patto che», quale modo serve?"
      prompt: {text: "a patto che i soldi non spariscono", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: a patto che i soldi non spariscano nel bilancio generale."
    - tutor: "Numero chiuso per i pullman e tassa sulle crociere: lo giro ai nostri ospiti in studio. Grazie della telefonata, e buon lavoro!"
      goals: [proposal]

- scenario: notizie-attualita
  # facts: legge sugli affitti brevi: secondo la learner i comuni possono limitarli nelle zone più turistiche e c'è un codice identificativo obbligatorio; lei teme che i comuni la applichino con il contagocce; un grande quotidiano ha intervistato solo albergatori, una testata online gli studenti fuori sede; la testata online non citava la fonte dei dati sui canoni; conseguenze: poco nel breve periodo, nel lungo alcuni proprietari tornano agli affitti lunghi; con più coraggio sarebbe stata una vera riforma
  level: C2
  persona: en-f-student
  history: [word-choice, subjunctive-use, hypothetical]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Me ne sono fatta un'idea abbastanza precisa, credo. In sostanza, la legge dà ai comuni la possibilità di limitare gli affitti brevi nelle zone più turistiche, e introduce un codice identificativo obbligatorio per ogni appartamento."
    - tutor: "Così dicono i titoli. Ma tu ci credi che cambierà qualcosa?"
      goals: [summarise]
    # agree: the tutor shares the fear and recasts the calque
    - learner: "Ci credo a metà, perché la legge lascia tutto in mano ai comuni, e conoscendo la nostra burrocrazia, temo che molti comuni la applichino a gocce."
      errors: [spelling, word-choice]
      gold: {text: "a gocce", fix: "con il contagocce"}
    - tutor: "Con il contagocce, temo anch'io: i comuni hanno tempi biblici. Ma hai visto come l'hanno raccontata i giornali?"
      recast: {text: "a gocce", fix: "con il contagocce", tags: [word-choice]}
      goals: [opinion]
    - learner: "Sì, e la differenza mi ha colpita. Un grande quotidiano ha intervistato solo albergatori, mentre una testata online ha dato la parola agli studenti fuori sede, che degli affitti brevi pagano le conseguenze ogni settembre."
    - tutor: "Due fonti, due mondi. E secondo te quale delle due si è avvicinata di più alla verità?"
      goals: [sources]
    - learner: "Nessuna delle due, da sola. Tuttavia la testata online mi è sembrata più onnesta, malgrado non citava la fonte dei dati sui canoni degli studenti."
      errors: [spelling, subjunctive-use]
      gold: {text: "malgrado non citava", fix: "malgrado non citasse"}
    - tutor: "Più onesta, forse; ma la fonte è tutto. E riascolta «malgrado non citava»: dopo «malgrado», quale modo serve?"
      prompt: {text: "malgrado non citava", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: malgrado non citasse la fonte dei dati."
    - tutor: "Esatto. E le conseguenze? Che cosa succederà, secondo te?"
    # agree: the tutor agrees on the missing courage and corrects the mixed hypothetical
    - learner: "Nel breve periodo, poco. Nel lungo, se i comuni applicheranno i limiti, alcuni proprietari torneranno agli affitti lunghi e gli studenti respirerano un po'. Ma se la legge fosse stata scritta con più coraggio, oggi avremmo parlato di una vera riforma."
      errors: [spelling, hypothetical]
      gold: {text: "oggi avremmo parlato di una vera riforma", fix: "oggi parleremmo di una vera riforma"}
    - tutor: "Sul coraggio mancato sono d'accordo con te. Ma riascolta «oggi avremmo parlato di una vera riforma»: con «oggi», la conseguenza riguarda il passato o il presente?"
      prompt: {text: "oggi avremmo parlato di una vera riforma", tags: [hypothetical]}
    - learner: "Il presente: oggi parleremmo di una vera riforma."
    - tutor: "Ecco. Tra un anno vediamo chi aveva ragione. Torniamo alle nostre scrivanie?"
      goals: [consequences]

- scenario: cena-suoceri
  # facts: appartamento elegante a Firenze; il padre della compagna è ironico, la madre ha cucinato pappa al pomodoro e arista; il learner prova a fare la pappa a Londra con risultati deludenti; la ricetta dopo il secondo; architetto, restauro di edifici storici; la coppia pensa di trasferirsi a Firenze tra un paio d'anni; battuta del padre: «portare vasi a Samo»; il padre propone il tu; la ricetta dell'arista come benvenuto
  level: C2
  persona: en-m-traveller
  history: [false-friend, subjunctive-use, register]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Le assicuro che sono in carne e ossa, anche se dopo questo antipasto rischio di diventare solo carne. Grazie dell'accoglienza: è una casa bellissima, e si vede che è vissuta."
    - tutor: "Il merito è di mia moglie: io mi limito a lamentarmi della polvere. Le piace la pappa al pomodoro?"
    - learner: "La adoro, e questa è la migliore che abbia mai mangiatto, senza esagerare. Signora, mi deve dare la ricetta: a Londra provo a farla da anni, ma il risultato è sempre molto miserabile."
      errors: [spelling, false-friend]
      gold: {text: "molto miserabile", fix: "molto deludente"}
    - tutor: "Molto deludente, dice? Allora mia moglie gliela darà, ma solo dopo il secondo, per vedere se se la merita. E di che cosa si occupa, a Londra?"
      recast: {text: "molto miserabile", fix: "molto deludente", tags: [false-friend]}
      goals: [compliment]
    - learner: "Sono architetto, mi occupo sopratutto di restauro di edifici storici. Sua figlia e io pensiamo di trasferirci a Firenze tra un paio d'anni, e ci tenevo che Lei lo sapesse da me, prima che glielo dica qualcun altro."
      errors: [spelling, subjunctive-use]
      gold: {text: "prima che glielo dica qualcun altro", fix: "prima che glielo dicesse qualcun altro"}
    - tutor: "Apprezzo la delicatezza, davvero. Ma riascolti «ci tenevo... prima che glielo dica»: con la principale al passato, quale tempo del congiuntivo segue?"
      prompt: {text: "prima che glielo dica qualcun altro", tags: [subjunctive-use]}
    - learner: "L'imperfetto: ci tenevo che lo sapesse da me, prima che glielo dicesse qualcun altro."
    - tutor: "Esatto. Un architetto inglese che viene a restaurare Firenze: un po' come portare vasi a Samo, non trova?"
      goals: [background]
    - learner: "Forse sì, ma anche a Samo, col tempo, i vasi si rompono, e qualcuno deve pur incollarli. Io mi accontenterei di fare da colla, con tutto il rispetto per i vasai fiorentini."
    - tutor: "Ben detto. Senta, a questo punto mi sembra ridicolo continuare con il Lei: ci diamo del tu?"
      goals: [irony]
    - learner: "Con piacere, anche se mi ci vorrà qualche bicchiere per abituarmi. Allora, la ricetta dell'arista me la darebbe Lei, o devo chiederla alla signora?"
      errors: [register]
      gold: {text: "me la darebbe Lei", fix: "me la daresti tu"}
    - tutor: "Vedo che il bicchiere non è ancora bastato: «me la darebbe Lei»? Ci siamo appena dati del tu."
      prompt: {text: "me la darebbe Lei", tags: [register]}
    - learner: "Hai ragione, scusa: me la daresti tu, la ricetta dell'arista?"
    - tutor: "Te la do io, ma è un segreto di famiglia: considerala un benvenuto ufficiale."
      goals: [tu-lei]

- scenario: condoglianze
  # facts: la madre del collega è morta a ottantotto anni, casa di famiglia in un paese della Puglia; la learner l'ha conosciuta alla festa di Natale di due anni fa, quando aveva portato i taralli fatti da lei e li distribuiva a tutti; offerta: la learner finisce la relazione per il cliente di Bari, i dati li ha già; il collega le manderà i file quando se la sente; in ufficio lo aspettano senza fretta; la learner rifiuta il caffè e si congeda
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, word-choice, imperative-form]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Non dica così, è il minimo. Le porgo le mie più sentite condoglianze, anche a nome di tutto l'ufficio: quando abbiamo saputo della scomparsa di sua madre, siamo rimasti molto colpiti."
    - tutor: "Grazie. Era molto anziana, ottantotto anni, ma uno non è mai pronto."
      goals: [condolences]
    - learner: "È vero, non si è mai pronti. Io l'ho conosciuta solo una volta, alla festa di Natale di due anni fa, quando ci ha portato i suoi taralli: li distribuiva a tutti con un'alegria contagiosa, come se eravamo i suoi nipoti."
      errors: [spelling, subjunctive-use]
      gold: {text: "come se eravamo i suoi nipoti", fix: "come se fossimo i suoi nipoti"}
    - tutor: "I taralli, sì: li faceva ogni Natale, per tutti. Ma riascolti «come se eravamo i suoi nipoti»: dopo «come se», quale modo vuole?"
      prompt: {text: "come se eravamo i suoi nipoti", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: come se fossimo i suoi nipoti."
    - tutor: "E un po' lo eravate, per lei. Mi fa piacere che se ne ricordi."
      goals: [memory]
    - learner: "La relazione per il cliente di Bari, se vuole, la finisco io: i dati li ho già, e lei così può stare con la sua familia. E per qualsiasi altra cosa, me la chieda senza vergogna."
      errors: [spelling, word-choice]
      gold: {text: "senza vergogna", fix: "senza problemi"}
    - tutor: "La ringrazio: se mi finisce la relazione per Bari, accetto senza problemi, anzi con sollievo. Non ho la testa per i numeri, in questi giorni."
      recast: {text: "senza vergogna", fix: "senza problemi", tags: [word-choice]}
      goals: [offer-help]
    - learner: "Alora è deciso. Mi mandi i file che ha già preparato, ma solo quando se la sente, e non stia a pensare al lavoro. Sappi che in ufficio la aspettiamo, ma senza nessuna fretta."
      errors: [spelling, imperative-form]
      gold: {text: "Sappi che in ufficio la aspettiamo", fix: "Sappia che in ufficio la aspettiamo"}
    - tutor: "Grazie, lo farò. Mi conceda però una pignoleria da vecchio collega: «sappi» è la forma del tu, e noi ci diamo del Lei. Quale le serve?"
      prompt: {text: "Sappi che in ufficio la aspettiamo", tags: [imperative-form]}
    - learner: "Ha ragione: sappia che in ufficio la aspettiamo, senza fretta."
    - tutor: "Lo so, e mi fa bene sentirlo. Vuole un caffè prima di andare?"
    - learner: "Grazie, ma non voglio approfittare della sua stanchezza. La lascio con la sua famiglia, e mi chiami per qualunque cosa, anche solo per parlare."
    - tutor: "Lo farò. Grazie ancora di essere venuta fin qui."
      goals: [leave]

- scenario: medico-specialista
  # facts: paziente di settant'anni, in pensione; due notti fa si è svegliato con il cuore all'impazzata, mezz'ora seduto sul letto; l'anno scorso episodi brevissimi, attribuiti al caffè, la moglie insisteva per un controllo; la sorella maggiore ha un pacemaker da cinque anni, impiantato dopo uno svenimento in chiesa; holter: tre episodi di fibrillazione atriale, tutti di notte; rischio principale un trombo: anticoagulante (lividi, piccoli tagli che sanguinano di più) e betabloccante (un po' di stanchezza); un bicchiere di vino a cena sì, non di più; controllo tra tre mesi con un nuovo holter
  level: C2
  persona: en-m-retired
  history: [tense-aspect, combined-pronouns]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Meglio di prima, ma non del tuto. Due notti fa mi sono svegliato con il cuore che ha battuto all'impazzata, e per una mezz'ora sono rimasto seduto sul letto, senza riuscire a calmarlo."
      errors: [spelling, tense-aspect]
      gold: {text: "il cuore che ha battuto all'impazzata", fix: "il cuore che batteva all'impazzata"}
    - tutor: "Capisco lo spavento. Ma riascolti «il cuore che ha battuto all'impazzata»: è la scena in cui si sveglia, un'azione in corso. Quale tempo la descrive?"
      prompt: {text: "il cuore che ha battuto all'impazzata", tags: [tense-aspect]}
    - learner: "L'imperfetto: mi sono svegliato con il cuore che batteva all'impazzata."
    - tutor: "Esatto. Le era già successo, prima di quella notte?"
    - learner: "Sì, un paio di volte l'anno scorso, ma erano episodi brevissimi, e pensavo che fossero dovuti al caffè. Mia moglie, invece, insisteva perché facessi un controllo, e alla fine ha avuto ragione lei."
    - tutor: "Sua moglie ha avuto buon fiuto. In famiglia ci sono problemi di ritmo cardiaco?"
      goals: [symptoms]
    - learner: "Mia sorella maggiore porta un pacemaker da cinque ani. Le l'hanno impiantato dopo uno svenimento in chiesa, e da allora, dice, si sente rinata."
      errors: [spelling, combined-pronouns]
      gold: {text: "Le l'hanno impiantato", fix: "Gliel'hanno impiantato"}
    - tutor: "È un'informazione utile, grazie. Ma riascolti «le l'hanno impiantato»: «le» seguito da «lo», che forma prende?"
      prompt: {text: "Le l'hanno impiantato", tags: [combined-pronouns]}
    - learner: "Gliel'hanno impiantato dopo uno svenimento in chiesa."
    - tutor: "Esatto. L'holter, intanto, ha registrato tre episodi di fibrillazione atriale, tutti di notte."
      goals: [history]
    # decoy: «attualmente» meaning «at the moment» is correct
    - learner: "Fibrillazione atriale... è grave? Me lo dica con franchezza: alla mia età preferisco sapere le cose come stanno. Attualmente non ho dolori, ma non vorrei che mia moglie si preoccupasse più del necessario."
    - tutor: "Non è grave, se la curiamo: il rischio principale è un trombo, e per questo le prescrivo un anticoagulante."
      goals: [understand]
    - learner: "Capisco. E ci sono effetti collaterali? Un mio amico prende un anticoagulante e ha sempre le braccia piene di lividi: ogni volta che si taglia facendosi la barba, è una tragedia."
    - tutor: "I lividi sono frequenti, sì, e un piccolo taglio sanguina più a lungo. Le prescrivo anche un betabloccante, che può dare un po' di stanchezza."
    - learner: "Un po' di stanchezza la posso soportare. Ma il mio bicchiere di vino a cena? Da quando sono in pensione, è uno dei pochi piaceri che mi sono concesso ogni sera."
      errors: [spelling, tense-aspect]
      gold: {text: "che mi sono concesso ogni sera", fix: "che mi concedo ogni sera"}
    - tutor: "Un bicchiere a cena sì, non di più. Ma riascolti «uno dei pochi piaceri che mi sono concesso ogni sera»: è un'abitudine che dura ancora oggi. Quale tempo la esprime?"
      prompt: {text: "che mi sono concesso ogni sera", tags: [tense-aspect]}
    - learner: "Il presente: è uno dei pochi piaceri che mi concedo ogni sera."
    - tutor: "Esatto, e può continuare a concederselo. Ci rivediamo tra tre mesi, con un nuovo holter."
      goals: [treatment]

- scenario: trattativa-affitto
  # facts: appartamento a Roma con terrazza; clausola che vieta gli animali, la learner vive con un gatto anziano; il proprietario ha avuto brutte esperienze con un cane; proposta: deposito di tre mensilità invece di due e lettera di referenze della vecchia padrona di casa (sei anni senza un graffio); canone 1.300 euro; il proprietario scende a 1.250 con un contratto tre più due; preavviso di sei mesi con raccomandata; provvigione dell'agenzia: una mensilità; il gatto scritto nel contratto; firma giovedì
  level: C2
  persona: es-f-erasmus
  history: [false-friend, subjunctive-use]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Mi è piaciuto moltissimo, soprattutto la terrazza. C'è però una clausola nel contratto che mi preoccupa: quella che vieta gli animali. Io vivo con un gatto anziano, tranquillissimo, e senza di lui non mi trasferisco."
    - tutor: "Il proprietario ha avuto brutte esperienze con un cane, temo. Che cosa propone?"
      goals: [interest]
    # decoy: «tre mensilità piuttosto che due» means «instead of two», which is correct
    # agree: the tutor takes the offer seriously and recasts the false friend
    - learner: "Propongo un deposito di tre mensilità piuttosto che due, così un eventuale danno sarebbe coperto. Il gatto è stato con me sei anni nel vecchio appartamento senza un solo grafio, e la padrona di casa è disposta a scrivermi una carta di referenze."
      errors: [spelling, false-friend]
      gold: {text: "una carta di referenze", fix: "una lettera di referenze"}
    - tutor: "Una lettera di referenze, più tre mensilità di deposito: è un argomento serio, e lo riferirò. Il canone, però, resta di 1.300 euro."
      recast: {text: "una carta di referenze", fix: "una lettera di referenze", tags: [false-friend]}
      goals: [negotiate]
    # decoy: «Non pretendo» means «I do not demand», which is correct
    - learner: "Il canone è un pò alto per la zona, a dir la verità. Non pretendo uno sconto enorme, ma mi sembrerebbe giusto che venga incontro anche lui, visto che io accetto un deposito più alto."
      errors: [spelling, subjunctive-use]
      gold: {text: "mi sembrerebbe giusto che venga incontro", fix: "mi sembrerebbe giusto che venisse incontro"}
    - tutor: "È una richiesta che posso girargli. Ma riascolti «mi sembrerebbe giusto che venga incontro»: con la principale al condizionale, quale tempo del congiuntivo segue?"
      prompt: {text: "mi sembrerebbe giusto che venga incontro", tags: [subjunctive-use]}
    - learner: "Mi sembrerebbe giusto che sia venuto incontro, allora."
      errors: [subjunctive-use]
    - tutor: "Che venisse incontro anche lui, sì: gli ho appena scritto, e scende a 1.250 euro se lei accetta un contratto di tre anni più due."
      recast: {text: "che sia venuto incontro", fix: "che venisse incontro", tags: [subjunctive-use]}
    - learner: "Tre più due mi va benissimo. E per il preavviso, se dovessi andarmene prima, quanti mesi sono previsti?"
    - tutor: "Sei mesi, con raccomandata. E la provvigione dell'agenzia è di una mensilità."
      goals: [conditions]
    - learner: "D'accordo. Allora, riassumendo: 1.250 euro, tre più due, deposito di tre mensilità, e il gatto messo nero su bianco nel contratto."
    - tutor: "Nero su bianco, glielo prometto. Prepariamo il contratto per giovedì?"
      goals: [conclude]
    - learner: "Giovedì va benissimo. Porto anche la lettera della mia vecchia padrona di casa, così il proprietario si tranquillizza del tutto."
    - tutor: "Perfetto, a giovedì allora. E saluti il gatto da parte mia."

- scenario: presentazione-progetto
  # facts: azienda alimentare a Milano; le catene di supermercati chiedono meno plastica, chi non si adegua entro due anni rischia gli scaffali; il progetto riduce la plastica delle confezioni del trentacinque per cento; costo circa quattrocentomila euro tra macchinari e formazione; risparmio di novantamila euro l'anno di materiali; due nuovi clienti interessati; rientro in quattro anni e mezzo solo con i materiali; l'anno scorso persa la gara con una catena tedesca; installazione in agosto durante la chiusura estiva; bando regionale per l'economia circolare fino al trenta per cento; piano dettagliato entro due settimane con tre preventivi; incontro con il direttore finanziario a fine mese
  level: C2
  persona: es-f-teacher
  history: [conditional-form, word-choice, register]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Perché i nostri principali clienti, le catene di supermercati, chiedono imballaggi con meno plastica, e chi non si adegua entro due anni rischia di perdere gli scaffali. Il progetto riduce del trentacinque per cento la plastica delle nostre confezioni."
    - tutor: "Il trentacinque per cento è un bel numero. Quanto costa?"
      goals: [pitch]
    # decoy: «di clienti nuovi ... ce ne sono già due» is a correct «ce ne»
    - learner: "Circa quattrocentomila euro tra macchinari e formazione. In cambio, risparmieremmo novantamila euro l'anno di materiali, e di clienti nuovi interessati ce ne sono già due, che ci hanno scritto il mese scorso."
    - tutor: "Quindi l'investimento rientra in più di quattro anni. È tanto."
      goals: [benefits]
    # agree: the tutor remembers the lost tender and corrects the conditional
    - learner: "Quattro anni e mezzo, per l'esatezza, se contiamo solo i materiali; con i due nuovi clienti, molto meno. E se l'anno scorso avessimo avuto questi impianti, non avremo perso la gara con la catena tedesca."
      errors: [spelling, conditional-form]
      gold: {text: "non avremo perso la gara", fix: "non avremmo perso la gara"}
    - tutor: "Sulla gara persa ha ragione, ce la ricordiamo tutti. Ma riascolti «non avremo perso la gara»: è un futuro, o la conseguenza di un'ipotesi nel passato?"
      prompt: {text: "non avremo perso la gara", tags: [conditional-form]}
    - learner: "La conseguenza: se avessimo avuto questi impianti, non avremmo perso la gara."
    - tutor: "Esatto. Resta il rischio: e se i macchinari arrivano in ritardo e ci fermano la produzione?"
    - learner: "Per questo propongo di instalarli in agosto, durante la chiusura estiva, quando le linee sono comunque ferme. E per il costo, potremmo applicare al bando regionale per l'economia circolare, che copre fino al trenta per cento."
      errors: [spelling, word-choice]
      gold: {text: "applicare al bando regionale", fix: "partecipare al bando regionale"}
    - tutor: "Partecipare al bando regionale è un'ottima idea, se copre davvero il trenta per cento, e agosto mi convince. Quali sono i prossimi passi?"
      recast: {text: "applicare al bando regionale", fix: "partecipare al bando regionale", tags: [word-choice]}
      goals: [objection]
    - learner: "Le propongo di preparare entro due settimane un piano dettagliato, con i preventivi di tre fornitori e il calendario dell'installazione, e di presentarlo al direttore finanziario. Se le va bene, ci sentiamo dopo e mi dici."
      errors: [register]
      gold: {text: "ci sentiamo dopo e mi dici", fix: "ci sentiamo dopo e mi dice"}
    - tutor: "Due settimane vanno bene. Ma riascolti «ci sentiamo dopo e mi dici»: con me, finora, ha usato il Lei."
      prompt: {text: "ci sentiamo dopo e mi dici", tags: [register]}
    - learner: "Mi scusi: se le va bene, ci sentiamo dopo e mi dice."
    - tutor: "Le dico già adesso di sì. Fissi l'incontro con il direttore finanziario per la fine del mese."
      goals: [next-steps]

- scenario: pranzo-domenicale
  # facts: pranzo domenicale a Bologna; «scannarsi» vuol dire litigare con passione; la lasagna; la zia; la scarpetta: in Inghilterra considerata maleducata, la learner la fa di nascosto; la settimana scorsa ha promesso al capo il progetto per venerdì, giovedì sera era a metà, consegnato lunedì con un vassoio di paste; confronto: «volere la botte piena e la moglie ubriaca» e l'inglese sulla torta; aneddoto: imparare l'italiano in tre mesi senza grammatica, ricominciata da capo
  level: C2
  persona: en-f-student
  history: [ci-ne, conditional-form, combined-pronouns]
  turns:
    - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Meno male, allora: avevo paura di dover combattere anch'io per un pezzo di lasagna! Ma «scannarsi» vuol dire davvero tagliarsi la gola? Sembra molto violento."
    - tutor: "Letteralmente sì, ma qui vuol dire solo litigare con passione. A tavola, da noi, ci si scanna per amore."
      goals: [react]
    - learner: "Allora mi piace! In Inghilterra a tavola si litiga molto meno, ma si beve di più. A proposito, questa lasagna è buonissima: posso prenderne ancora un pezzo, o rischio di scannarmi con tua zia?"
    - tutor: "Prendine pure, ma tieni d'occhio la zia. E a casa tua, a fine pasto, nessuno fa la scarpetta?"
    - learner: "La scarpetta? Credo di sapere cos'è: pulire il piatto con la pane! In Inghilterra è considerata una cosa da maleducati, ma io ce la faccio lo stesso, di nascosto, perché il sugo è la parte migliore."
      errors: [noun-gender, ci-ne]
      gold: {text: "io ce la faccio lo stesso", fix: "io la faccio lo stesso"}
    - tutor: "Ecco una bolognese mancata. Ma riascolta «io ce la faccio lo stesso»: con quel «ce», sembra che tu ci riesca a fatica. Che cosa volevi dire?"
      prompt: {text: "io ce la faccio lo stesso", tags: [ci-ne]}
    - learner: "Volevo dire che la faccio lo stesso, di nascosto."
    - tutor: "Così. E adesso tocca a te: usa un modo di dire per raccontarmi qualcosa che ti è successo."
    - learner: "Va bene. La settimana scorsa ho promesso al mio cappo che il progetto sarà pronto venerdì, e giovedì sera ero ancora a metà."
      errors: [spelling, conditional-form]
      gold: {text: "il progetto sarà pronto venerdì", fix: "il progetto sarebbe stato pronto venerdì"}
    - tutor: "Sento già odore di guaio. Ma riascolta «ho promesso che il progetto sarà pronto»: un futuro visto dal passato, quale forma prende?"
      prompt: {text: "il progetto sarà pronto venerdì", tags: [conditional-form]}
    - learner: "Il condizionale passato: ho promesso che il progetto sarebbe stato pronto venerdì, e giovedì sera ero ancora a metà. Tra il dire e il fare c'è di mezzo il mare!"
    - tutor: "Usato a regola d'arte. E alla fine il progetto l'hai consegnato?"
      goals: [use-idiom]
    - learner: "Sì, con tante scuse e un vasoio di paste, gli l'ho consegnato lunedì mattina."
      errors: [spelling, combined-pronouns]
      gold: {text: "gli l'ho consegnato", fix: "gliel'ho consegnato"}
    - tutor: "Un vassoio di paste salva qualunque scadenza. Ma riascolta «gli l'ho consegnato»: quando «gli» incontra «l'», che forma prendono insieme?"
      prompt: {text: "gli l'ho consegnato", tags: [combined-pronouns]}
    - learner: "Gliel'ho consegnato lunedì. In inglese, a proposito, diciamo che non si può avere la torta e anche mangiarla."
    - tutor: "Noi diciamo «volere la botte piena e la moglie ubriaca»: stesso concetto, ma con il vino. Ti torna?"
      goals: [compare]
    - learner: "Mi torna benissimo! Allora chiudo con una storia: l'anno scorso volevo imparare l'italiano in tre mesi, senza studiare la grammatica e uscendo ogni sera. Risultato: ho dovuto ricominciare da capo. Chi va piano va sano e va lontano!"
    - tutor: "E guarda dove sei arrivata: a scannarti per la lasagna come una di noi. Un'altra fetta?"
      goals: [anecdote]

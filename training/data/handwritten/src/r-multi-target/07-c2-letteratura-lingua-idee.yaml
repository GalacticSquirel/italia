# Set r-multi-target, file 7 (C2): «Il barone rampante» at a book club, Montale's «Spesso il
# male di vivere», a translator's false friend, a radio interview with a foreign author, a
# seminar on machine responsibility, satire after a comedy night, dialects on a train and a
# still life at an exhibition. Correct «assiste», «il cui», «piuttosto che» and comparatives with
# «che» are left alone; the trivial slip before each target is ignored.
- scenario: circolo-lettura
  # facts: il learner ha riletto «Il barone rampante» a sessant'anni; la tutor trova Cosimo insopportabile; Cosimo resta fedele al primo rifiuto, quello delle lumache; Biagio è il narratore, ironia affettuosa, «ammira senza capire»; Cosimo resta su un albero vicino alla finestra della madre malata; Viola, amata per tutta la vita, Cosimo non scende nemmeno per lei; prossimo libro proposto: «Il visconte dimezzato», con Medardo, per completare la trilogia
  level: C2
  persona: en-m-retired
  history: [subjunctive-use, false-friend, relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    # decoy: «meno insopportabile che a vent'anni» correctly takes «che» (two time phrases)
    - learner: "Io no, anzi. L'ho riletto quest'anno, a sessant'anni, e Cosimo mi è sembrato molto meno insopportabile che a vent'anni: allora lo trovavo capriccioso, adesso lo trovo coerente fino all'eroismo."
    - tutor: "Coerente fino all'eroismo, addirittura! Coerente con che cosa, secondo te?"
      goals: [impression]
    # agree: the tutor shares the reading and corrects the concessive
    - learner: "Con quel primo rifiuto, quello delle lummache. Sembra un capriccio da ragazzino, eppure per tutta la vita Cosimo resta fedele a quella scelta, benché nessuno, nemmeno suo fratello, capisce fino in fondo perché non scende."
      errors: [spelling, subjunctive-use]
      gold: {text: "benché nessuno, nemmeno suo fratello, capisce", fix: "benché nessuno, nemmeno suo fratello, capisca"}
    - tutor: "Sulla fedeltà a quel primo rifiuto ti do ragione: è il cuore del libro. Ma riascolta «benché nessuno, nemmeno suo fratello, capisce»: dopo «benché», quale modo ci vuole?"
      prompt: {text: "benché nessuno, nemmeno suo fratello, capisce", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: benché nessuno capisca fino in fondo perché non scende."
    - tutor: "Ecco. E lo stile? C'è chi parla di leggerezza, ma a me quella leggerezza a volte sembra freddezza."
      goals: [theme]
    - learner: "Io la chiamerei piuttosto ironia affettuosa. Biagio racconta il fratello con un sorriso continuo, ma non lo prende mai in giro davvero: è un narratore che ammira senza capire, e questo crea una distanza che non è freddezza."
    - tutor: "Bella formula, «ammira senza capire». Ma resto della mia idea: Cosimo è un egoista che abbandona la famiglia per un principio."
      goals: [style]
    - learner: "Qui non sono d'accordo. Cosimo non abbandona nessuno: resta sugli alberi intorno alla casa, e quando la madre è malata rimane su un albero vicino alla sua finestra. Accusarlo di egoismo mi sembra una conclusione poco sensibile."
      errors: [false-friend]
      gold: {text: "poco sensibile", fix: "poco sensata"}
    - tutor: "Poco sensata, dici? Forse hai ragione: restare accanto alla madre, a modo suo, non è da egoista. Ma ammetterai che il suo è un amore a distanza."
      recast: {text: "poco sensibile", fix: "poco sensata", tags: [false-friend]}
      goals: [disagree]
    - learner: "Lo ammetto, ma è l'unico amore che si può permetere. Anche con Viola, la donna di chi è innamorato per tutta la vita, non scende mai, nemmeno per lei."
      errors: [spelling, relative-pronoun]
      gold: {text: "la donna di chi è innamorato", fix: "la donna di cui è innamorato"}
    - tutor: "Viola, la grande ferita del libro. Ma riascolta «la donna di chi è innamorato»: dopo «di», con un antecedente espresso, «chi» può funzionare?"
      prompt: {text: "la donna di chi è innamorato", tags: [relative-pronoun]}
    - learner: "No, ci vuole «cui»: la donna di cui è innamorato per tutta la vita."
    - tutor: "Esatto. E per il prossimo incontro, hai qualcosa da proporre?"
    - learner: "Proporrei «Il visconte dimezzato», così completiamo la trilogia degli antenati e vediamo se il suo protagonista ti sembra più simpatico di Cosimo."
    - tutor: "Medardo più simpatico di Cosimo? Ne dubito, ma accetto la sfida."
      goals: [recommend]

- scenario: poesia-montale
  # facts: «Spesso il male di vivere ho incontrato»; prima impressione della learner: aridità quasi fisica; immagine: la foglia riarsa che si incartoccia, correlativo oggettivo; rime in fine di verso «gorgoglia» / «foglia» e «Indifferenza» / «sonnolenza»; l'ultimo verso più lungo, come il volo del falco; interpretazione: il bene come distacco, non felicità; «divina» ironica e seria insieme; per la prossima lezione, confronto con «Meriggiare pallido e assorto»
  level: C2
  persona: es-f-teacher
  history: [passive, subjunctive-use]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Mi è rimasta addosso una sensazione di aridità, quasi fisica. Le immagini del male sono concrete, si sentono sulla pelle, mentre il bene è lontanissimo, sospeso in alto."
    - tutor: "Aridità è la parola giusta. Su quale immagine vorrebbe soffermarsi?"
      goals: [first-reading]
    # agree: the tutor shares the analysis and corrects the passive agreement
    - learner: "Sulla foglia «riarsa» che si incartoccia. Montale non dice che la foglia è secca: ci mostra il gesto con cui si chiude su se stessa. È un'imagine perfetta del correlativo oggettivo: il male non viene mai nominato in astratto, viene affidata agli oggetti."
      errors: [spelling, passive]
      gold: {text: "viene affidata agli oggetti", fix: "viene affidato agli oggetti"}
    - tutor: "Un'analisi precisa, e la condivido. Ma riascolti «il male... viene affidata agli oggetti»: il soggetto è «il male», maschile. Come si accorda il participio?"
      prompt: {text: "viene affidata agli oggetti", tags: [passive]}
    - learner: "Al maschile: il male viene affidato agli oggetti."
    - tutor: "Esatto. E il suono? Le rime, il ritmo dei versi: che cosa ha notato?"
      goals: [image]
    - learner: "Sì, le rime interne mi hanno colpita: «gorgoglia» e «foglia», e poi «Indifferenza» e «sonnolenza». E l'ultimo verso è molto più lungo degli altri, come se si allargasse verso il cielo insieme al falco."
    - tutor: "Osservazione bellissima: il verso si allunga come il volo. Le rime che cita, però, cadono in fine di verso, quindi non sono interne."
      goals: [sound]
    # agree: the tutor accepts the interpretation and corrects the mood
    - learner: "Ha ragione, è una svista: sono rime in fine di verso. Quanto al senso complesivo, mi sembra che per Montale il bene non è la felicità, ma una forma di distacco: la statua, la nuvola e il falco non soffrono perché non partecipano."
      errors: [spelling, subjunctive-use]
      gold: {text: "mi sembra che per Montale il bene non è la felicità", fix: "mi sembra che per Montale il bene non sia la felicità"}
    - tutor: "Una lettura che condivido: il bene come distacco, non come gioia. Ma riascolti «mi sembra che il bene non è»: dopo «mi sembra che», quale modo ci vuole?"
      prompt: {text: "mi sembra che per Montale il bene non è la felicità", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: mi sembra che il bene non fosse la felicità."
      errors: [subjunctive-use]
    - tutor: "Che per Montale il bene non sia la felicità, ma indifferenza, è una tesi solida. Mi permetta un'ultima domanda: secondo lei, «divina» è un elogio?"
      recast: {text: "il bene non fosse la felicità", fix: "il bene non sia la felicità", tags: [subjunctive-use]}
      goals: [meaning]
    - learner: "Non del tutto. Direi che è ironica e seria insieme: l'Indifferenza è «divina» perché è l'unica cosa che ci salva, ma è anche il contrario di ciò che di solito chiamiamo divino, cioè l'amore."
    - tutor: "Ecco una risposta da tenere a mente. Per la prossima lezione, provi a confrontare questa poesia con «Meriggiare pallido e assorto»."

- scenario: traduzione-sfumature
  # facts: romanzo inglese, terzo capitolo; la nonna, malata, dice «I'm fine, dear, really», con ironia; bozza della junior: «Sto bene, cara, davvero»; proposta «Sto benone, tesoro, figurati»; due pagine dopo, «she eventually agreed» tradotto con «eventualmente acconsentì», la junior se n'è accorta stamattina: va «finì per acconsentire»; «benone» troppo colloquiale per un registro neutro; scelta finale: «Sto benissimo, tesoro, figurati»
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, false-friend]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, ed è proprio il punto su cui vorrei discutere. Nel terzo capitolo la nonna dice «I'm fine, dear, really», e tutto il senso sta nell'ironia: è malata e lo sa benissimo. Io ho tradotto «Sto bene, cara, davvero», ma rileggendolo mi sembra piatto."
    - tutor: "Piatto è un complimento: è morto. «Cara» in bocca a una nonna italiana suona come una lettera del notaio. Che alternative hai?"
      goals: [problem]
    # agree: the tutor likes «figurati» and corrects the sequence of tenses
    - learner: "Pensavo a «Sto benone, tesoro, figurati». «Benone» ha quella leggera esagerazzione che tradisce la bugia, e «figurati» chiude la conversazione, come se la nonna non volesse che nessuno insiste."
      errors: [spelling, subjunctive-use]
      gold: {text: "non volesse che nessuno insiste", fix: "non volesse che nessuno insistesse"}
    - tutor: "«Figurati» è un'ottima idea, ti do ragione. Ma riascolta «come se non volesse che nessuno insiste»: dopo «volesse», quale tempo del congiuntivo segue?"
      prompt: {text: "non volesse che nessuno insiste", tags: [subjunctive-use]}
      goals: [options]
    - learner: "L'imperfetto: come se non volesse che nessuno insistesse."
    - tutor: "Esatto. Ma c'è dell'altro nella tua bozza, due pagine dopo: «she eventually agreed» è diventato «eventualmente acconsentì»."
    # decoy: «imbarazzante» and «falso amico» used correctly while discussing the false friend
    - learner: "Lo so, me ne sono accorta stamattina, ed è imbarazzante: è il falso amico per eccellenza. «Eventualmente» in italiano vuol dire «nel caso», quindi la frase diventa un'ipotesi. Ci vuole «alla fine acconsentì», o «finì per acconsentire»."
    - tutor: "Almeno l'hai trovato da sola. «Finì per acconsentire» mi piace di più: ha il peso della resa."
      goals: [false-friend]
    - learner: "Sono d'accordo. Tornando alla nonna, però, temo che «benone» sia tropo colloquiale per un'autrice dal registro così neutro: per essere consistente con il resto del libro, forse servirebbe «Sto benissimo, tesoro, figurati»."
      errors: [spelling, false-friend]
      gold: {text: "per essere consistente", fix: "per essere coerente"}
    - tutor: "Per essere coerente con il resto del libro, d'accordo: «benissimo» è più sobrio, e l'ironia la porta comunque «figurati». Allora, quale scegliamo?"
      recast: {text: "per essere consistente", fix: "per essere coerente", tags: [false-friend]}
    - learner: "Scegliamo «Sto benissimo, tesoro, figurati». È fedele al tono, rispetta il registro dell'autrice e lascia al lettore il piacere di capire da solo che la nonna sta mentendo."
    - tutor: "Approvata. E la prossima volta il falso amico trovalo prima che lo legga io."
      goals: [decide]

- scenario: intervista-radio
  # facts: autrice spagnola, libro «Il caffè in piedi», dieci anni di vita a Napoli; scritto per ridere di sé prima che degli italiani; il capitolo più lungo smonta il mito del ritardo: gli amici napoletani puntualissimi, lei in anticipo di mezz'ora; aneddoto: il primo giorno, in un bar del centro storico, un signore uscendo le aveva lasciato un caffè sospeso; l'italiano l'ha resa più ironica, le ha insegnato a dire le cose sottovoce e a non rispondere troppo in fretta; frase finale sul caffè come abbraccio
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, tense-aspect, false-friend]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un onore. Il libro si intitola «Il caffè in piedi» e racconta dieci anni di vita a Napoli, visti da una spagnola che credeva di conoscere già il Sud. L'ho scritto per ridere di me stessa, prima che degli italiani."
    - tutor: "Incoscienza confermata, allora! Ma ci dica la verità: nel libro gli italiani sono tutti in ritardo, rumorosi e mammoni?"
      goals: [present-book]
    - learner: "Nemmeno per sogno! Anzi, il capitolo più lungo serve proprio a smontare il mito del ritardo: a Napoli i miei amici arrivavano puntualisimi, benché io continuavo a presentarmi con mezz'ora di anticipo per paura di sbagliare."
      errors: [spelling, subjunctive-use]
      gold: {text: "benché io continuavo", fix: "benché io continuassi"}
    - tutor: "Un mito smontato in diretta, molto bene. Ma riascolti «benché io continuavo»: dopo «benché», quale modo ci vuole?"
      prompt: {text: "benché io continuavo", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: benché io continuassi a presentarmi in anticipo."
    - tutor: "Ecco. Ci racconta un episodio che i nostri ascoltatori non dimenticheranno?"
      goals: [stereotype]
    - learner: "Il primo giorno a Napoli sono entrata in un bar del centro storico, e quando ho chiesto il conto, il barista mi ha deto che era già pagato: un signore, uscendo, mi lasciava un caffè sospeso. Non sapevo nemmeno che cosa fosse."
      errors: [spelling, tense-aspect]
      gold: {text: "mi lasciava un caffè sospeso", fix: "mi aveva lasciato un caffè sospeso"}
    - tutor: "Il caffè sospeso, una tradizione che commuove sempre. Ma riascolti «un signore, uscendo, mi lasciava un caffè sospeso»: il gesto è avvenuto prima della sua richiesta. Quale tempo lo colloca prima?"
      prompt: {text: "mi lasciava un caffè sospeso", tags: [tense-aspect]}
    - learner: "Il trapassato: un signore, uscendo, mi aveva lasciato un caffè sospeso."
    - tutor: "Esatto. E la lingua italiana, che cosa ha cambiato in lei?"
      goals: [anecdote]
    # agree: the tutor values the lesson and recasts the false friend
    - learner: "Mi ha resa più ironica, credo. L'italiano mi ha insegnato a dire le cose sottovoce, con un sorriso, e sopratutto a non rispondere troppo pronto: a Napoli, chi risponde subito ha già perso."
      errors: [spelling, false-friend]
      gold: {text: "troppo pronto", fix: "troppo in fretta"}
    - tutor: "Non rispondere troppo in fretta: in diretta, glielo assicuro, è un'arte rara. Ci lascia con una frase per i nostri ascoltatori?"
      recast: {text: "troppo pronto", fix: "troppo in fretta", tags: [false-friend]}
      goals: [language]
    - learner: "Direi così: in Spagna si vive per strada, in Italia si vive al bar, ma in tutti e due i paesi, se ti offrono un caffè, devi accettarlo come se fosse un abbraccio."
    - tutor: "Un abbraccio in tazzina: lo terremo a mente. Grazie, e buona fortuna con il libro!"
      goals: [farewell]

- scenario: seminario-etica
  # facts: tesi della dottoranda: una macchina può causare un danno ma non essere moralmente responsabile, perché le manca l'intenzionalità; distinzione tra responsabilità causale e morale, esempio del fulmine; obiezione del professore: le aziende sono ritenute responsabili senza coscienza; risposta: responsabilità per delega; concessione: responsabilità giuridica sì, colpa morale no; conclusione: finché una macchina non sa dare ragione delle sue scelte, non è un agente morale; replica scritta la settimana prossima
  level: C2
  persona: en-f-student
  history: [word-choice, hypothetical]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    # decoy: «possa» and «le manca» are correct
    - learner: "Prego, dubiti pure. La mia tesi è che una macchina possa essere causa di un danno, ma non responsabile in senso morale, poiché le manca l'intenzionalità: non sceglie, esegue."
    - tutor: "Esegue, dice. Ma anche noi, in fondo, eseguiamo un programma scritto dai geni e dall'educazione. Dove passa il confine?"
      goals: [thesis]
    - learner: "Il confine passa tra responsabilità causale e responsabilità morale. Un fulmine causa un incendio, ma nessuno lo biasimma; un essere umano, invece, risponde delle proprie azioni, nonostante abbia la capacità di riflettere su di esse."
      errors: [spelling, word-choice]
      gold: {text: "nonostante abbia la capacità", fix: "in quanto ha la capacità"}
    - tutor: "In quanto ha la capacità di riflettere, dunque: è quella capacità a fondare la responsabilità, d'accordo. Ma allora le grandi aziende? Non hanno coscienza, eppure le riteniamo responsabili."
      recast: {text: "nonostante abbia la capacità", fix: "in quanto ha la capacità", tags: [word-choice]}
      goals: [distinguish]
    - learner: "È l'obiezione che temevo, lo confesso. Ma un'azienda è responsabile solo per dellega: dietro ogni decisione ci sono persone che l'hanno presa, e se nessuno l'avrebbe presa, non ci sarebbe alcuna colpa da attribuire."
      errors: [spelling, hypothetical]
      gold: {text: "se nessuno l'avrebbe presa", fix: "se nessuno l'avesse presa"}
    - tutor: "Elegante, la delega. Ma riascolti «se nessuno l'avrebbe presa»: nella protasi, il condizionale è ammesso?"
      prompt: {text: "se nessuno l'avrebbe presa", tags: [hypothetical]}
    - learner: "No, ci vuole il congiuntivo trapassato: se nessuno l'avesse presa, non ci sarebbe colpa."
    - tutor: "Esatto. Eppure il diritto attribuisce responsabilità anche dove nessuno ha deciso nulla. Non mi concede niente?"
      goals: [objection]
    - learner: "Concedo che, per ragioni pratiche, si possa attribuire a una macchina una responsabilità giuridica, così come la si attribuisce a una società. Ma attribuire non significa riconoscere: la colpa morale presuppone un soggetto che avrebbe potuto agire altrimenti."
    - tutor: "Una concessione che non le costa la tesi: abile. Concluda, dottoressa."
      goals: [concede]
    - learner: "Concludo così: finché una macchina non sarà in grado di dare ragione delle proprie scelte, potremo considerarla causa, strumento, perfino soggetto giuridico, ma non agente morale. Il giorno in cui lo sarebbe, dovremmo riaprire la discussione."
      errors: [hypothetical]
      gold: {text: "il giorno in cui lo sarebbe", fix: "il giorno in cui lo fosse"}
    - tutor: "Quasi impeccabile. Ma riascolti «il giorno in cui lo sarebbe»: è un'ipotesi, che regge una conseguenza al condizionale. Quale modo serve nella relativa?"
      prompt: {text: "il giorno in cui lo sarebbe", tags: [hypothetical]}
    - learner: "Il congiuntivo: il giorno in cui lo fosse, dovremmo riaprire la discussione."
    - tutor: "Conclusione rigorosa. Ci rivediamo la settimana prossima, con la sua replica scritta."
      goals: [conclude]

- scenario: umorismo-satira
  # facts: serata di cabaret a Roma; il learner non ha capito la battuta sul ministro e la carbonara; nel monologo il comico immagina un ministro che difende la panna nella carbonara, «governa come cucina»; battuta preferita: «i treni arrivano sempre in orario... con il ritardo previsto»; gioco di parole del learner: un amico ha lasciato la banca perché «aveva perso interesse»; il comico ha preso in giro un politico malato e parte del pubblico era a disagio; limite: si ride di tutto ma non di chiunque
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use, false-friend]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Ammetto tutto: non l'ho capita. Ho riso alla parte sul guanciale, ma il riferimento al ministro mi è sfuggito completamente. Me la spieghi?"
    - tutor: "Nel monologo il comico immagina un ministro che difende la panna nella carbonara. Da qui la battuta: «governa come cucina»."
      goals: [missed]
    # decoy: «Se me l'avessi spiegato prima, avrei riso» is a correct past hypothetical
    - learner: "Adesso è chiaro! La panna nella carbonara, per un romano, è peggio di uno scandalo. Se me l'avessi spiegato prima, avrei riso con gli altri invece di guardarti come un pesce lesso."
    - tutor: "Ti ho visto, infatti. E qual è la battuta che ti è piaciuta di più?"
    # agree: the tutor agrees on the sting and corrects the mood
    - learner: "Quella sui trenni: «In Italia i treni arrivano sempre in orario... in orario con il ritardo previsto». Mi è piaciuta perché sembra che fa un complimento, e invece ti pugnala alla fine."
      errors: [spelling, subjunctive-use]
      gold: {text: "sembra che fa un complimento", fix: "sembra che faccia un complimento"}
    - tutor: "Il colpo finale è il bello, su questo siamo d'accordo. Ma riascolta «sembra che fa un complimento»: dopo «sembra che», quale modo serve?"
      prompt: {text: "sembra che fa un complimento", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: sembra che faccia un complimento."
    - tutor: "Esatto. E adesso tocca a te: inventami un gioco di parole."
      goals: [favourite]
    - learner: "Ci provo, ma non ridere: un mio amico ha lasciato il lavoro in banca perché, diceva, aveva perso interesse."
    - tutor: "«Aveva perso interesse»: funziona anche in italiano, ed è già un risultato. Ma è vecchia come il cucco!"
      goals: [wordplay]
    - learner: "Lo so, è una fredura. Parlando seriamente, però: secondo te la satira dovrebbe avere dei limiti? Stasera il comico ha preso in giro anche un politico malato, e alcuni nel pubblico erano chiaramente molto scomodi."
      errors: [spelling, false-friend]
      gold: {text: "molto scomodi", fix: "molto a disagio"}
    - tutor: "Che fossero molto a disagio l'ho notato anch'io. Per me la satira deve colpire il potere, non la malattia, e lì il comico ha sbagliato. Tu dove metteresti il limite?"
      recast: {text: "molto scomodi", fix: "molto a disagio", tags: [false-friend]}
    # agree: the tutor shares the limit and corrects the concessive
    - learner: "Sui deboli, direi. Si può ridere di tutto, ma non di chiunque: se la battuta colpisce chi non può difendersi, diventa solo cattiveria, nonostante il comico pensa di essere coraggioso."
      errors: [subjunctive-use]
      gold: {text: "nonostante il comico pensa", fix: "nonostante il comico pensi"}
    - tutor: "Sono d'accordo con te, parola per parola. Ma riascolta «nonostante il comico pensa»: dopo «nonostante», l'indicativo regge?"
      prompt: {text: "nonostante il comico pensa", tags: [subjunctive-use]}
    - learner: "No: nonostante il comico pensi di essere coraggioso."
    - tutor: "«Di tutto, ma non di chiunque»: questa la rubo per il prossimo litigio con mio cognato. Un altro giro?"
      goals: [limits]

- scenario: dialetti-regionali
  # facts: treno Milano-Napoli; due napoletani; il learner, andaluso, ha notato le vocali allungate e «mo'» ripetuto; «mo'» vuol dire «adesso», diffuso da Roma in giù; «guaglione» è il ragazzo, «guagliò» la forma per chiamarlo; in Andalusia si mangiano le consonanti finali, «pescao»; a scuola si correggeva l'andaluso; opinione: italiano standard a scuola, dialetto da non vietare, raccogliere e registrare gli anziani, un'ora al mese a scuola, niente legge; quasi a Napoli, invito al mercato
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, ci-ne]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Ho capito poco, a dire il vero, ma ho riso per la musica. Ho notato che allungano le vocali alla fine delle frasi, e che uno dei due ha detto «mo'» almeno dieci volte."
    - tutor: "«Mo'» vuol dire «adesso», e da Roma in giù lo senti dappertutto. Che altro hai notato?"
      goals: [notice]
    # decoy: «una così non ce l'abbiamo» is correct
    - learner: "Una parola che mi ha incuriosito: chiamavano «guagliò» il figlio, credo. In Spagna abbiamo tante parole per dire «ragazzo», ma una così non ce l'abbiamo. Che cosa significa esattamente?"
    - tutor: "«Guaglione» è il ragazzo, il giovane; «guagliò» è la forma per chiamarlo. Da voi ci sono parlate così diverse dalla lingua standard?"
      goals: [example]
    - learner: "Certo, io sono andaluso, e da noi si mangiano le consonanti finali: «pescao» invece di «pescado». A scuola, però, ci insegnavano il castigliano standard, e chi parlava andaluso veniva coretto continuamente, come se era un errore."
      errors: [spelling, subjunctive-use]
      gold: {text: "come se era un errore", fix: "come se fosse un errore"}
    - tutor: "Succedeva lo stesso nelle scuole italiane, fino a non molto tempo fa. Ma riascolta «come se era un errore»: dopo «come se», quale modo serve?"
      prompt: {text: "come se era un errore", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: come se fosse un errore."
    - tutor: "Esatto. E secondo te è giusto così? Il dialetto va corretto a scuola, o protetto?"
    # agree: the tutor shares the position and corrects «ce ne»
    - learner: "La scuola deve insegnare l'italiano standard, perché è la lingua che ti apre le porte. Ma vietare il dialetto è un erore: chi lo parla in casa ci si identifica. Di parole che esistono solo in dialetto ci sono migliaia."
      errors: [spelling, ci-ne]
      gold: {text: "ci sono migliaia", fix: "ce ne sono migliaia"}
    - tutor: "Mi trovi d'accordo: lo standard a scuola, il dialetto a casa e nel cuore. Ma riascolta «di parole che esistono solo in dialetto ci sono migliaia»: con «migliaia», quel «di parole» va ripreso. Come diventa?"
      prompt: {text: "ci sono migliaia", tags: [ci-ne]}
      goals: [standard]
    - learner: "Ci ne sono migliaia."
      errors: [ci-ne]
    - tutor: "Ce ne sono migliaia, sì, e molte stanno scomparendo. Quindi, alla fine, tu le proteggeresti per legge?"
      recast: {text: "Ci ne sono migliaia", fix: "Ce ne sono migliaia", tags: [ci-ne]}
    - learner: "Per legge no, mi sembrerebbe artificiale. Preferirei che si registrassero gli anziani che le parlano, e che a scuola ci fosse almeno un'ora al mese per conoscerle, senza obbligare nessuno."
    - tutor: "Una posizione equilibrata, da sociolinguista mancato. Siamo quasi a Napoli: vieni a sentire come parlano davvero al mercato?"
      goals: [opinion]

- scenario: arte-mostra
  # facts: natura morta: tavola apparecchiata, limone sbucciato a metà con la buccia che pende, bicchiere rovesciato, una mosca sul pane; lettura: memento mori, genere della vanitas; confronto con le nature morte olandesi del Seicento, con limoni e bicchieri di cristallo, che hanno anche la gioia della ricchezza; questa è più cupa; dopo, la sala successiva
  level: C2
  persona: en-m-heritage
  history: [passive, relative-pronoun, comparative]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi inquieta, e non so bene perché. A prima vista è solo una tavola apparecchiata, eppure c'è qualcosa di sospeso, come se qualcuno se ne fosse appena andato."
    - tutor: "Hai colto il punto senza saperlo. Guarda meglio: che cosa c'è sulla tavola?"
      goals: [react]
    - learner: "Un limone sbucciato a metà, con la buccia che pende dal bordo, un bicchiere rovesciatto e, se non sbaglio, una mosca sul pane. Tutto sembra essere stato abbandonata all'improvviso."
      errors: [spelling, passive]
      gold: {text: "essere stato abbandonata", fix: "essere stato abbandonato"}
    - tutor: "La mosca c'è, hai l'occhio fino. Ma riascolta «tutto sembra essere stato abbandonata»: il soggetto è «tutto». Come si accorda il participio?"
      prompt: {text: "essere stato abbandonata", tags: [passive]}
    - learner: "Al maschile: tutto sembra essere stato abbandonato all'improvviso."
    - tutor: "Esatto. E quella mosca, secondo te, che ci fa lì?"
      goals: [describe]
    # decoy: «il cui soggetto» is a correct relative
    # agree: the tutor confirms the reading and corrects the relative
    - learner: "Credo che sia un memento mori. È un quadro il cui soggetto vero non è il cibo, ma il tempo che pasa: un quadro in quale tutto, la frutta, la mosca, il bicchiere, ci ricorda che siamo mortali."
      errors: [spelling, relative-pronoun]
      gold: {text: "in quale tutto", fix: "in cui tutto"}
    - tutor: "Memento mori: è la lettura che danno anche gli storici, si parla di vanitas. Ma riascolta «un quadro in quale tutto ci ricorda»: dopo «in», senza articolo, «quale» regge?"
      prompt: {text: "in quale tutto", tags: [relative-pronoun]}
      goals: [interpret]
    - learner: "No: un quadro in cui tutto ci ricorda che siamo mortali."
    - tutor: "Così. Ti viene in mente qualcosa di simile, magari fuori d'Italia?"
    - learner: "Le nature morte olandesi del Seicento, quelle con i limoni sbucciati e i bicchieri di cristalo. Però questa mi sembra più cupa che quelle olandesi: lì c'è anche una certa gioia della ricchezza, qui solo silenzio."
      errors: [spelling, comparative]
      gold: {text: "più cupa che quelle olandesi", fix: "più cupa di quelle olandesi"}
    - tutor: "Il confronto regge benissimo. Ma riascolta «più cupa che quelle olandesi»: il secondo termine è un pronome, «quelle». Quale parola lo introduce?"
      prompt: {text: "più cupa che quelle olandesi", tags: [comparative]}
    - learner: "Di: questa mi sembra più cupa di quelle olandesi."
    - tutor: "Proprio così, e sono d'accordo con te: qui della ricchezza non resta niente. Andiamo a vedere se nella sala dopo il pittore si è rasserenato?"
      goals: [compare]

# Set w-c1, file 3: C1, art, books, films and idioms (informal register).
# Relative «la cui», gender clash (il fine / la fine), irregular participles, pronoun position,
# subjunctive after opinion verbs, «pensare in», «ha valso», a failed relative repair recast.
- scenario: arte-mostra
  level: C1
  persona: en-m-traveller
  history: [noun-gender]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi fa venire i brividi. È tutto scuro, eccetto per una mano che esce dall'ombra. Sembra un thriller, ma dipinto."
    errors: [word-choice]
  - tutor: "Tutto scuro tranne una mano, sì: è questo il colpo di genio. Un thriller dipinto, bella definizione! Che cosa vedi, esattamente?"
    recast: {text: "eccetto per una mano", fix: "tranne una mano", tags: [word-choice]}
    goals: [react]
  - learner: "Vedo un vecchio seduto a un tavolo, con delle monete davanti, e un ragazzo che lo indica. Il luce viene da una finestra che non si vede."
    errors: [noun-gender]
  - tutor: "L'hai letto benissimo. Solo una cosa: «il luce»... ti torna? Pensa al genere di quella parola."
    prompt: {text: "Il luce", tags: [noun-gender]}
  - learner: "La luce, scusa, è femminile. Quindi la luce arriva da fuori, come se qualcuno aprisse una porta all'improvviso."
  - tutor: "Esatto. E quella luce che arriva da fuori è il momento in cui il vecchio viene scelto. Secondo te, perché il pittore lascia quasi tutto al buio?"
    goals: [describe]
  - learner: "Forse vuole che guardiamo solo quello che conta: la mano, la faccia del vecchio. Mi sembra che il buio è una specie di silenzio."
    errors: [subjunctive-use]
  - tutor: "Il buio come silenzio: bellissimo. Ma «mi sembra che il buio è»... dopo «mi sembra che», quale modo ti aspetti?"
    prompt: {text: "Mi sembra che il buio è", tags: [subjunctive-use]}
  - learner: "Mi sembra che il buio sia una specie di silenzio, ecco."
  - tutor: "Perfetto, e da storico dell'arte ti dico che è una lettura raffinata. Ti ricorda qualcosa che abbiamo visto stamattina?"
    goals: [interpret]
  - learner: "Sì, la sala dei fiamminghi. Ma là la luce era più morbida che qui, più tranquilla: qui sembra il faro di una macchina della polizia!"
  - tutor: "Il faro della polizia, ah ah! Ma hai colto il punto: i fiamminghi accarezzano, qui la luce colpisce. Andiamo a prenderci un caffè e ne parliamo."
    goals: [compare]

- scenario: arte-mostra
  level: C1
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi sorprende. Sono solo bottiglie e una scatola, eppure non riesco a smettere di guardarle. Hanno qualcosa di misterioso."
  - tutor: "Vero? Con quattro oggetti, questo pittore ci ha riempito una vita intera. Descrivimeli: che cosa noti?"
    goals: [react]
  - learner: "I colori sono quasi tutti uguali: grigi, beige, un rosa spento. E poi c'è quella bottiglia bianca di cui la forma è stranissima, troppo alta per essere vera."
    errors: [relative-pronoun]
  - tutor: "È proprio lei che attira lo sguardo. Ma «la bottiglia di cui la forma»: quando il pronome indica possesso, come si costruisce in italiano?"
    prompt: {text: "di cui la forma", tags: [relative-pronoun]}
  - learner: "Ah, come lo spagnolo «cuya»: quella bottiglia la cui forma è stranissima."
  - tutor: "Esatto. E hai l'occhio giusto: spesso le sue bottiglie venivano dipinte apposta, per togliere i riflessi. Secondo te che cosa voleva dire con tutta questa calma?"
    goals: [describe]
  - learner: "Credo che voleva parlare del tempo, del silenzio delle case di provincia. Sono oggetti che si sono fermati."
    errors: [subjunctive-use]
  - tutor: "Lettura molto fine. Fermati però su «credo che voleva»: dopo «credo che» c'è un piccolo intoppo. Lo senti?"
    prompt: {text: "Credo che voleva", tags: [subjunctive-use]}
    new: [{lemma: intoppo, gloss: hitch}]
  - learner: "Credo che vorrebbe parlare del tempo, allora?"
    errors: [subjunctive-use]
  - tutor: "Che volesse parlare del tempo, sì, è quello che pensano anche i critici più attenti. Hai una sensibilità da storica dell'arte. Ti viene in mente un pittore lontanissimo da questo?"
    recast: {text: "che vorrebbe parlare", fix: "che volesse parlare", tags: [subjunctive-use]}
    goals: [interpret]
  - learner: "Sorolla, senza dubbio. Dipinge il mare di Valencia con una luce che quasi acceca, mentre qui tutto è sussurrato."
  - tutor: "Quel pittore è l'opposto esatto: luce che esplode contro luce che si spegne piano. Eppure tutti e due, a modo loro, dipingono il silenzio di un luogo."
    goals: [compare]

- scenario: club-lettura
  level: C1
  persona: en-m-retired
  history: [past-participle-form]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, l'ho finito domenica. All'inizio ho fatto fatica, le prime cento pagine sono lentissime. Ma dopo non riuscivo a metterlo giù."
    errors: [word-choice]
  - tutor: "Succede anche a me: a un certo punto non si riesce più a smettere di leggerlo. E la protagonista, Ada, ti ha convinto?"
    recast: {text: "metterlo giù", fix: "smettere di leggerlo", tags: [word-choice]}
    goals: [impression]
  - learner: "Non del tutto. Ho trovato strano che non ha mai risposto alle lettere della sorella, nemmeno dopo la morte della madre."
    errors: [subjunctive-use]
  - tutor: "Ah, le lettere: lì si gioca tutto! Però riascolta «ho trovato strano che non ha mai risposto». Dopo «trovare strano che», che modo vuole l'italiano?"
    prompt: {text: "Ho trovato strano che non ha mai risposto", tags: [subjunctive-use]}
  - learner: "Ho trovato strano che non abbia mai risposto. Secondo me l'autrice l'ha fatto apposta, per lasciarci il dubbio."
  - tutor: "Esatto. E sul dubbio voluto sono d'accordo: Ada tace perché ha paura di perdonare. E dello stile che ne dici?"
    goals: [character]
  - learner: "Mi è piaciuto: frasi brevi, asciutte. Però l'autrice ha spesso interrompito il ritmo con quei salti nel passato."
    errors: [past-participle-form]
  - tutor: "Sui salti nel passato non sei il solo a pensarla così. Ma «ha interrompito»... sicuro? È un participio irregolare, come quello di «rompere»."
    prompt: {text: "ha spesso interrompito", tags: [past-participle-form]}
    new: [{lemma: participio, gloss: participle}, {lemma: irregolare, gloss: irregular}]
  - learner: "Interrotto, certo. Comunque non lo consiglierei a tutti."
  - tutor: "Esatto. E a chi non lo consiglieresti, allora?"
    goals: [style]
  - learner: "A chi cerca azione. Lo darei piuttosto a chi ha vissuto una rottura in famiglia: ci si ritroverebbe parecchio."
  - tutor: "Giusto, è un libro per chi ha qualche ferita aperta. Ma il mese prossimo scegli tu, e voglio un giallo!"
    goals: [recommend]

- scenario: club-lettura
  level: C1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, l'ho finito ieri sera. Mi è piaciuto abbastanza, ma il fine mi ha lasciata un po' fredda: troppo aperto."
    errors: [noun-gender]
  - tutor: "«Il fine»? Attenta: al maschile quella parola vuol dire «lo scopo». Tu parlavi di come si chiude il romanzo, giusto?"
    prompt: {text: "il fine", tags: [noun-gender]}
  - learner: "Sì, la fine. In spagnolo è maschile, mi confondo sempre."
  - tutor: "Capita a tutti gli spagnoli! A me invece proprio quella fine aperta ha conquistato. E i personaggi? Chi ti è rimasto più impresso?"
    goals: [impression]
  - learner: "Il padre. Mi ha fatto molta pena: tutta la famiglia lo ha lasciato solo, e lui non si è reso conto fino all'ultimo capitolo."
    errors: [ci-ne]
  - tutor: "Il padre, sì, un personaggio tragico. Ma «non si è reso conto»... di che cosa? In quella frase manca un pezzetto."
    prompt: {text: "non si è reso conto", tags: [ci-ne]}
  - learner: "Non se n'è reso conto, ecco. E anche la madre: se parlasse prima con lui, la famiglia non si sarebbe divisa."
    errors: [hypothetical]
  - tutor: "Ecco, così. Però ora senti la seconda frase: «se parlasse prima, non si sarebbe divisa». Le due metà parlano dello stesso tempo?"
    prompt: {text: "se parlasse prima con lui", tags: [hypothetical]}
  - learner: "No, è tutto nel passato: se avesse parlato prima con lui, la famiglia non si sarebbe divisa."
  - tutor: "Perfetto, adesso i tempi combaciano. E sulla madre hai ragione, il suo silenzio pesa quanto l'orgoglio del padre. E la scrittura, ti ha convinta?"
    goals: [character]
  - learner: "Mi sembrava un po' fredda, quasi da giornalista. Lo consiglierei a chi ama le saghe familiari, ma non a chi cerca emozioni forti."
  - tutor: "Fredda, addirittura! Va bene, non ti convincerò stasera. Ma il mese prossimo il libro lo scelgo di nuovo io."
    goals: [style, recommend]

- scenario: film-libro
  level: C1
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Inizio io. Ho letto «Il giardino dei Finzi-Contini». Me l'aveva regalato mio nonno, che è nato a Ferrara: quando ero piccolo, mi ha raccontato spesso della sua città."
    errors: [tense-aspect]
  - tutor: "Che bel legame con il libro. Però, «quando ero piccolo, mi ha raccontato spesso»: per un'abitudine del passato, quale tempo funziona meglio?"
    prompt: {text: "mi ha raccontato spesso", tags: [tense-aspect]}
  - learner: "Ah sì: quando ero piccolo, mi raccontava spesso della sua città. E il libro è ambientato proprio lì, negli anni Trenta."
  - tutor: "Esatto. Ferrara negli anni Trenta, quindi un periodo buio. Raccontaci la storia, ma senza svelare il finale!"
  - learner: "Il narratore è un ragazzo ebreo che si innamora di Micòl, una ragazza di cui la famiglia vive chiusa in una villa con un giardino enorme."
    errors: [relative-pronoun]
  - tutor: "Bravo, niente spoiler. Ma «una ragazza di cui la famiglia vive»: quando il pronome dice a chi appartiene la famiglia, come si costruisce?"
    prompt: {text: "di cui la famiglia", tags: [relative-pronoun]}
  - learner: "Una ragazza che la famiglia vive chiusa in una villa."
    errors: [relative-pronoun]
  - tutor: "Sì, una ragazza la cui famiglia vive come su un'isola, separata dal mondo. E lei, come personaggio, com'è?"
    recast: {text: "che la famiglia", fix: "la cui famiglia", tags: [relative-pronoun]}
    goals: [summary]
  - learner: "Affascinante ma sfuggente: un giorno è dolcissima, il giorno dopo non ti guarda neanche. Il narratore non capisce mai cosa pensa davvero."
  - tutor: "Sfuggente è la parola giusta. E a te, alla fine, è piaciuto?"
    goals: [characters]
  - learner: "Moltissimo. È un libro che fa male, perché il lettore sa cosa succederà agli ebrei italiani pochi anni dopo. Lo consiglierei a chiunque, soprattutto ai ragazzi a scuola."
  - tutor: "È vero, quella malinconia nasce proprio da ciò che il lettore sa e i personaggi no. Grazie, bellissima presentazione: chi è il prossimo?"
    goals: [opinion, recommend]

- scenario: film-libro
  level: C1
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Lo confesso: il libro non l'ho finito, ma ho visto il film. Spero che vale lo stesso!"
    errors: [subjunctive-use]
  - tutor: "Per stavolta te lo concedo! Però, «spero che vale»: dopo «spero che»... ?"
    prompt: {text: "Spero che vale", tags: [subjunctive-use]}
  - learner: "Spero che valga lo stesso. È «La grande bellezza»: un giornalista anziano che gira per Roma tra feste e terrazze e si chiede che cosa ha fatto della sua vita."
  - tutor: "Esatto. E quel regista divide sempre: c'è chi lo adora e chi non lo sopporta. Com'è il protagonista, secondo te?"
    goals: [summary]
  - learner: "Cinico ma anche tenero: uno che ride di tutti, però in fondo soffre. Pensa sempre in una ragazza che ha conosciuto da giovane."
    errors: [preposition]
  - tutor: "Bella descrizione. Ma «pensa sempre in una ragazza»: in italiano, dopo «pensare», quale preposizione mettiamo?"
    prompt: {text: "Pensa sempre in una ragazza", tags: [preposition]}
  - learner: "Pensa sempre a una ragazza, il suo primo amore. Per me è il cuore del film."
  - tutor: "Proprio così. Quel primo amore è forse la grande bellezza del titolo. E il tuo giudizio, alla fine?"
    goals: [characters]
  - learner: "Le immagini sono stupende, però a metà mi sono annoiato un po'. Ma il finale ha valso tutto il film."
    errors: [auxiliary-choice]
  - tutor: "Il finale è potente, sì. Ma «ha valso»... sei sicuro dell'ausiliare? Questo verbo si comporta come «costare»."
    prompt: {text: "ha valso", tags: [auxiliary-choice]}
  - learner: "È valso, allora: il finale è valso tutto il film. Lo consiglierei a chi ama Roma e ha pazienza, non a chi cerca azione."
  - tutor: "Perfetto, e il consiglio è onesto. Però il mese prossimo niente scorciatoie: voglio un libro letto fino all'ultima pagina!"
    goals: [opinion, recommend]

- scenario: modi-di-dire
  level: C1
  persona: en-f-student
  history: [pronoun-position]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, giornata da dimenticare. Stamattina la sveglia non ha suonato, perché la sera prima mi ero dimenticata di caricare il telefono."
  - tutor: "Classico: piove sempre sul bagnato. E poi?"
  - learner: "Sono corsa alla stazione, ma il treno era già partito. Ho chiamato un taxi, e quando dovevo pagare mi sono accorta che non avevo il portafoglio: avevo lasciato lo sul tavolo."
    errors: [pronoun-position]
  - tutor: "Nooo! Aspetta però: «avevo lasciato lo sul tavolo». Quel «lo», con un tempo composto, dove va a finire?"
    prompt: {text: "avevo lasciato lo", tags: [pronoun-position]}
  - learner: "L'avevo lasciato sul tavolo, sì. Ho dovuto chiedere al tassista di aspettare, mentre una vicina mi prendeva in prestito i soldi."
    errors: [word-choice]
  - tutor: "Meno male che c'era una vicina che prestava soldi al volo! Dalla padella nella brace, proprio. E dopo è andata meglio?"
    recast: {text: "prendeva in prestito", fix: "prestava", tags: [word-choice]}
  - learner: "Peggio! In ufficio la riunione era stata spostata alle nove e nessuno me l'aveva detto. Altro che padella e brace, era un falò! Un po' colpa mia, ma anche del capo, che l'ha spostata alle undici di sera."
  - tutor: "Un falò, mi piace! Insomma, colpa divisa a metà: a te il telefono scarico, a lui gli orari notturni. E che cosa ti insegna questa giornata?"
    goals: [tell, react, blame]
  - learner: "Che d'ora in poi la sveglia la metto su due telefoni. E che le giornate storte finiscono sempre con un'aperitivo con te!"
    errors: [spelling]
  - tutor: "Questo sì che è un buon proposito! Ma guarda come l'hai scritto, «un'aperitivo»: quell'apostrofo ci vuole davvero?"
    prompt: {text: "un'aperitivo", tags: [spelling]}
  - learner: "No, aperitivo è maschile: un aperitivo, senza apostrofo. Allora, cin cin?"
  - tutor: "Cin cin! Alle giornate storte che finiscono bene, e ai portafogli che restano in borsa."
    goals: [moral]

- scenario: modi-di-dire
  level: C1
  persona: es-f-teacher
  history: [auxiliary-choice]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Uff, che giornata. Stamattina mi ho svegliata alle sei per correggere i compiti, e la caffettiera è esplosa."
    errors: [auxiliary-choice]
  - tutor: "Esplosa?! Aspetta, prima un dettaglio: «mi ho svegliata». Con un verbo riflessivo, al passato, quale ausiliare ci vuole?"
    prompt: {text: "mi ho svegliata", tags: [auxiliary-choice]}
    new: [{lemma: riflessivo, gloss: reflexive}, {lemma: ausiliare, gloss: auxiliary verb}]
  - learner: "Mi sono svegliata alle sei, sì. Avevo messo troppo caffè e la guarnizione era vecchia: il caffè è finito sul soffitto."
  - tutor: "Il caffè sul soffitto! Non te ne va bene una, eh? E poi?"
  - learner: "Poi, a scuola, il preside aveva cambiato l'orario, e io ho fatto il ridicolo davanti a tutta la classe entrando nell'aula sbagliata."
    errors: [word-choice]
  - tutor: "Quindi hai fatto una figuraccia davanti ai ragazzi: tra un mese ci riderai sopra, vedrai. Ma come mai non lo sapevi?"
    recast: {text: "fatto il ridicolo", fix: "fatto una figuraccia", tags: [word-choice]}
  - learner: "Me l'avevano scritto in una mail, ma io non l'avevo letta. Insomma, la colpa è un po' mia; però anche il preside, cambiare l'orario la domenica sera..."
  - tutor: "Eh, chi dorme non piglia pesci, ma chi manda mail la domenica sera neanche! Diciamo colpa divisa a metà."
    goals: [tell, blame]
  - learner: "«Chi dorme non piglia pesci», questa me la segno! In spagnolo c'è un detto simile, con un gamberetto. Comunque, se avrei letto la mail, non sarebbe successo niente."
    errors: [hypothetical]
  - tutor: "Il gamberetto spagnolo, che bello! Però «se avrei letto»: dopo quel «se», il condizionale proprio non ci sta. Come la giri?"
    prompt: {text: "se avrei letto", tags: [hypothetical]}
    goals: [react]
  - learner: "Se avessi letto la mail, non sarebbe successo niente. Morale: la domenica sera si leggono le mail, e la caffettiera si cambia ogni tanto!"
  - tutor: "Esatto, morale perfetta! Brindiamo alla caffettiera nuova, allora, e alle domeniche senza sorprese."
    goals: [moral]

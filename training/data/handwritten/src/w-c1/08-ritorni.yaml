# Set w-c1, file 8: C1, a third pass on culture, news, AI, tourism and interviews.
# Passive agreement, «nessuno spazio», «ho lo letto», «molta sangue», accent on «è», «c'erano meno
# gente», English false friends (letture, libreria, ritirato), colloquial «se rimaneva» left alone.
- scenario: arte-mostra
  level: C1
  persona: en-m-retired
  history: [passive]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi lascia un po' freddo, devo dire. È tecnicamente perfetto, ma i personaggi sembrano statue: nessuno si muove, nessuno sorride."
  - tutor: "Freddo! Eppure è uno dei quadri più amati del Rinascimento. Descrivimelo: che cosa vedi?"
    goals: [react]
  - learner: "Una Madonna in trono, con quattro santi intorno, e dietro un'architettura con colonne. È stato dipinto per una chiesa, credo, e la prospettiva è stato studiato con precisione matematica."
    errors: [passive]
  - tutor: "Sì, per una chiesa di Venezia. Ma «la prospettiva è stato studiato»: il soggetto è femminile, e allora?"
    prompt: {text: "la prospettiva è stato studiato", tags: [passive]}
  - learner: "La prospettiva è stato studiata con precisione, volevo dire."
    errors: [passive]
  - tutor: "Sì, la prospettiva è stata studiata al millimetro: le colonne dipinte continuano quelle vere della chiesa. Ma perché, secondo te, i santi sono così immobili?"
    recast: {text: "è stato studiata", fix: "è stata studiata", tags: [passive]}
    goals: [describe]
  - learner: "Forse il pittore voleva che sembrassero fuori dal tempo, in una specie di eternità. Non è una scena, è una visione."
  - tutor: "Non una scena, una visione: è proprio questa la chiave. Ti ricorda qualcosa?"
    goals: [interpret]
  - learner: "Le icone che ho visto in Grecia anni fa. Ma là le figure erano piatte, senza nessun spazio intorno; qui invece c'è aria, c'è profondità."
    errors: [article-form]
  - tutor: "Ottimo confronto. Solo un dettaglio: «nessun spazio». Davanti a «s» più consonante, quella parola si comporta come l'articolo davanti a «studente». Quindi?"
    prompt: {text: "nessun spazio", tags: [article-form]}
  - learner: "Nessuno spazio, come «uno studente». Comunque è il quadro che mi è piaciuto di meno, ma quello che ricorderò di più."
  - tutor: "Il paradosso perfetto per chiudere la visita! Andiamo, che il bar del museo chiude alle sei."
    goals: [compare]

- scenario: club-lettura
  level: C1
  persona: en-f-student
  history: [pronoun-position]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, finito ieri sera! E non sono d'accordo con chi dice che è noioso: io ho lo letto in due giorni."
    errors: [pronoun-position]
  - tutor: "Brava, un'altra fan! Ma «ho lo letto»: con il passato prossimo, dove va a finire quel «lo»?"
    prompt: {text: "ho lo letto", tags: [pronoun-position]}
  - learner: "L'ho letto in due giorni, sì. Mi è piaciuto soprattutto il modo in cui l'autrice racconta il dopoguerra con gli occhi di una bambina."
  - tutor: "Esatto, Nina è l'anima del romanzo. Ma la madre? Io non le ho mai perdonato di averla lasciata."
    goals: [impression]
  - learner: "Nemmeno io! Penso che ha sbagliato a lasciare Nina dalla nonna, anche solo per un anno."
    errors: [subjunctive-use]
  - tutor: "Ecco, la vedi come me. Ma «penso che ha sbagliato»: dopo «penso che», quale modo e quale tempo?"
    prompt: {text: "Penso che ha sbagliato", tags: [subjunctive-use]}
  - learner: "Penso che abbia sbagliato. Però forse non aveva scelta: se rimaneva in paese, perdeva il lavoro."
  - tutor: "Esatto, e il dubbio è proprio quello che l'autrice vuole lasciarci. E la scrittura? A me sembra asciuttissima, quasi senza aggettivi."
    goals: [character]
  - learner: "Sì, è asciutta, a volte perfino fredda. Ma secondo me è voluto: l'autrice non vuole che il lettore piange, vuole che capisce."
    errors: [subjunctive-use]
  - tutor: "Osservazione finissima. Però «non vuole che il lettore piange, vuole che capisce»: dopo «vuole che», tutti e due i verbi devono cambiare. Come?"
    prompt: {text: "non vuole che il lettore piange", tags: [subjunctive-use]}
  - learner: "Non vuole che il lettore pianga, vuole che capisca. Per questo lo consiglierei a chi ama le storie lente, non a chi legge sotto l'ombrellone."
  - tutor: "Perfetto, e sono d'accordo su tutto. Il mese prossimo, però, il dolce lo porti tu!"
    goals: [style, recommend]

- scenario: film-libro
  level: C1
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io! Ho letto «Gomorra», di Saviano. Non è un romanzo vero e proprio: è un'inchiesta sulla camorra a Napoli, scritta però come una storia."
  - tutor: "Un libro che ha fatto molto rumore, e che ancora oggi costringe l'autore a vivere sotto scorta. Senza svelare troppo, di che cosa parla?"
  - learner: "Racconta come la camorra controlla il porto, i rifiuti, perfino la moda. C'è molta sangue, ma la cosa più terribile è la normalità con cui tutto succede."
    errors: [noun-gender]
  - tutor: "La normalità fa più paura delle pistole, hai ragione. Ma «molta sangue»: in italiano quel nome di che genere è?"
    prompt: {text: "molta sangue", tags: [noun-gender]}
  - learner: "Molto sangue, sì: in spagnolo è femminile. E il narratore è lo stesso Saviano, che racconta in prima persona."
  - tutor: "Esatto. E com'è, come narratore?"
    goals: [summary]
  - learner: "Coraggioso, ma anche un po' ossessionato. Va in posti pericolosissimi per vedere tutto con i suoi occhi, e a volte avevo paura per lui come se era il personaggio di un film."
    errors: [subjunctive-use]
  - tutor: "Ossessionato è la parola giusta. Ma «come se era il personaggio»: dopo «come se», quale forma ci vuole?"
    prompt: {text: "come se era", tags: [subjunctive-use]}
  - learner: "Come se sarebbe il personaggio di un film."
    errors: [subjunctive-use]
  - tutor: "Sì, come se fosse un personaggio inventato, e invece è tutto vero: è questo che toglie il fiato. Ti è piaciuto, alla fine?"
    recast: {text: "Come se sarebbe", fix: "come se fosse", tags: [subjunctive-use]}
    goals: [characters]
  - learner: "Mi è piaciuto e mi ha fatto male. Lo consiglierei a chi vuole capire l'Italia oltre le cartoline, ma non a chi è troppo sensibile."
  - tutor: "Oltre le cartoline: lo userò come slogan per il club! Grazie, presentazione fortissima."
    goals: [opinion, recommend]

- scenario: modi-di-dire
  level: C1
  persona: en-m-heritage
  history: [spelling]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia perdere. Stamattina avevo il colloquio per il lavoro nuovo, e il gatto mi ha vomitato sulla camicia proprio mentre uscivo."
  - tutor: "Il gatto! Quando si dice nascere sotto una cattiva stella. E poi?"
  - learner: "Ho messo un'altra camicia, tutta stropicciata, ma intanto avevo perso l'autobus. Allora ho preso la bici, e a metà strada mi si e bucata la gomma."
    errors: [spelling]
  - tutor: "Non ci credo! Ma rileggi: «mi si e bucata». A quella «e» manca qualcosa, se è un verbo."
    prompt: {text: "mi si e bucata", tags: [spelling]}
  - learner: "Mi si è bucata, con l'accento. Così sono arrivato in ritardo e tutto sudato. Il direttore mi ha guardato da testa a piedi senza dire niente."
    errors: [articulated-preposition]
  - tutor: "Che scena! Ma «da testa a piedi»: in questa espressione le due preposizioni vogliono l'articolo. Come si dice?"
    prompt: {text: "da testa a piedi", tags: [articulated-preposition]}
  - learner: "Dalla testa ai piedi! Poi però ha sorriso e ha detto: «Vedo che lei non si arrende facilmente». E mi hanno preso!"
  - tutor: "Ma dai! Allora è proprio vero che non tutto il male vien per nuocere. E di chi è la colpa del disastro, solo del gatto?"
    goals: [tell]
  - learner: "«Non tutto il male vien per nuocere», questa la dico a mia nonna stasera! La colpa è un po' anche mia: avrei dovuto mettere l'allarme mezz'ora prima."
    errors: [word-choice]
  - tutor: "Mettere la sveglia mezz'ora prima, certo, ma col senno di poi siamo tutti bravi! E che morale ne tiri fuori?"
    recast: {text: "mettere l'allarme", fix: "mettere la sveglia", tags: [word-choice]}
    goals: [react, blame]
  - learner: "Che anche quando tutto va storto non bisogna arrendersi. E che da domani il gatto dorme fuori dalla camera!"
  - tutor: "Morale approvata, e povero gatto! Brindiamo al lavoro nuovo."
    goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: es-f-teacher
  history: [ce-ci-sono]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Sì, l'ho sentito stamattina alla radio, mentre andavo a scuola."
    errors: [participle-agreement]
  - tutor: "Allora sei aggiornatissima. Ma «l'ho sentito»: quell'«l'» sta per «la storia»... e allora come deve finire «sentito»?"
    prompt: {text: "l'ho sentito", tags: [participle-agreement]}
  - learner: "L'ho sentita, scusa. Se ho capito bene, chi affitta per meno di trenta giorni dovrà avere un codice e pagare più tasse."
  - tutor: "Esatto, in breve è così. E tu che ne pensi?"
    goals: [summarise]
  - learner: "Mi sembra un'idea giusta, ma non so se funzionerà. In Spagna è una legge simile da due anni, e a Valencia gli affitti non sono scesi."
    errors: [ce-ci-sono]
  - tutor: "Interessante, non lo sapevo. Ma «in Spagna è una legge simile»: per dire che una cosa esiste in un luogo, in italiano che cosa ci vuole?"
    prompt: {text: "In Spagna è una legge simile", tags: [ce-ci-sono]}
  - learner: "In Spagna c'è una legge simile, sì. Il problema è che nessuno controlla."
  - tutor: "Esatto, i controlli sono sempre il punto debole. E i giornali come l'hanno raccontata?"
    goals: [opinion]
  - learner: "Ho letto un'intervista al ministro: diceva che la legge avrebbe protetto i residenti, ma non ha contestato alle domande sui controlli. Un quotidiano economico invece parlava di rovina per le famiglie."
    errors: [false-friend]
  - tutor: "Già, non ha risposto alle domande sui controlli, che erano proprio il punto. E l'altro giornale gridava alla rovina, immagino senza un dato. Secondo te come andrà a finire?"
    recast: {text: "non ha contestato alle domande", fix: "non ha risposto alle domande", tags: [false-friend]}
    goals: [sources]
  - learner: "Credo che tra un anno nessuno se ne ricorderà più, a meno che i controlli non saranno seri."
    errors: [subjunctive-use]
  - tutor: "Un po' nera, ma forse hai ragione. Però «a meno che non saranno»: dopo «a meno che», quale modo ci vuole?"
    prompt: {text: "a meno che i controlli non saranno", tags: [subjunctive-use]}
  - learner: "A meno che i controlli non siano seri."
  - tutor: "Esatto. Speriamo che al ministero qualcuno ti ascolti! Dai, torniamo alle nostre scrivanie."
    goals: [consequences]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-student
  history: [word-order]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Ma dai, non essere così drammatico! Io sempre uso l'intelligenza artificiale per studiare, e mi aiuta tantissimo."
    errors: [word-order]
  - tutor: "Drammatico io? Vedremo. Ma «io sempre uso»: in italiano, dove mettiamo «sempre» rispetto al verbo?"
    prompt: {text: "Io sempre uso", tags: [word-order]}
  - learner: "Io uso sempre l'intelligenza artificiale: mi rispiega le cose che non capisco durante le letture all'università."
    errors: [false-friend]
  - tutor: "Ah, quindi ti rispiega quello che non capisci durante le lezioni. E se un giorno spiegasse meglio dei professori, a che servirebbero i professori?"
    recast: {text: "durante le letture", fix: "durante le lezioni", tags: [false-friend]}
    goals: [position]
  - learner: "A farci pensare. Un programma ti dà la risposta, un buon professore ti fa fare la domanda giusta. Se i professori non ci sarebbero, nessuno ci insegnerebbe a dubitare."
    errors: [hypothetical]
  - tutor: "Bella risposta. Ma «se i professori non ci sarebbero»: dopo «se», il condizionale non regge. Che cosa ci metti?"
    prompt: {text: "Se i professori non ci sarebbero", tags: [hypothetical]}
  - learner: "Se i professori non ci fossero, nessuno ci insegnerebbe a dubitare."
  - tutor: "Perfetto. Ma i posti di lavoro? Mio cugino traduceva manuali tecnici, e da un anno non gli arriva più niente."
  - learner: "Nel suo settore è già successo, è vero. Ho letto una ricerca secondo cui il trenta per cento di traduttori ha perso clienti, ma molti lavorano adesso come revisori."
    errors: [articulated-preposition]
  - tutor: "Un dato interessante. Ma «il trenta per cento di traduttori»: qui parli di tutti i traduttori in generale... quindi?"
    prompt: {text: "il trenta per cento di traduttori", tags: [articulated-preposition]}
    goals: [evidence]
  - learner: "Dei traduttori, giusto. E sì, tuo cugino ha ragione ad avere paura: a cinquant'anni ricominciare è dura, te lo concedo."
  - tutor: "Esatto, almeno questo me lo concedi! Allora, una conclusione che vada bene a tutti e due?"
    goals: [concede]
  - learner: "Che la tecnologia non è né buona né cattiva: dipende da quanto investiamo nelle persone che deve sostituire."
  - tutor: "Ci sto, firmo anche questa. Ma il dolce lo tagliamo a mano, senza algoritmi!"
    goals: [conclude]

- scenario: turismo-di-massa
  level: C1
  persona: en-f-professional
  history: [essere-avere]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno! Sono australiana e vivo a Venezia da otto anni. Quando sono arrivata ero ventisei anni e la città mi sembrava magica; adesso sono a favore del ticket, senza esitazioni."
    errors: [essere-avere]
  - tutor: "Benvenuta in diretta! Ma «ero ventisei anni»: per dire l'età, in italiano, che verbo si usa?"
    prompt: {text: "ero ventisei anni", tags: [essere-avere]}
  - learner: "Avevo ventisei anni, scusi. E da allora ho visto chiudere il fornaio, il calzolaio e perfino la libreria pubblica del quartiere."
    errors: [false-friend]
  - tutor: "Perfino la biblioteca pubblica: un quartiere che si svuota. Però faccio l'avvocato del diavolo: un ticket di cinque euro non ha mai fatto riaprire un fornaio."
    recast: {text: "la libreria pubblica", fix: "la biblioteca pubblica", tags: [false-friend]}
    goals: [introduce]
  - learner: "È vero, da solo non basta. Però l'anno scorso, nei giorni con il ticket, a Rialto c'erano visibilmente meno gente."
    errors: [ce-ci-sono]
  - tutor: "Interessante. Ma «c'erano meno gente»: «gente», in italiano, è singolare o plurale?"
    prompt: {text: "c'erano visibilmente meno gente", tags: [ce-ci-sono]}
  - learner: "Singolare: c'era meno gente, si camminava meglio. Quindi qualcosa cambia."
  - tutor: "D'accordo, ma è un esempio, non una prova. Lei che cosa farebbe al posto del sindaco?"
    goals: [example, rebut]
  - learner: "Userei i soldi del ticket per aiutare i giovani ad aprire botteghe in centro. E ai turisti direi: venite in bassa stagione, fermatevi almeno una notte, non correte da una foto all'altra."
  - tutor: "Botteghe ai giovani e turisti più lenti: un messaggio chiaro, che giriamo volentieri al sindaco. Grazie per la telefonata!"
    goals: [proposal]

- scenario: colloquio-lavoro
  level: C1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono un ingegnere meccanico ritirato, americano, e da tre anni vivo a Como con mia moglie. Ho lavorato trentacinque anni nell'industria dell'automobile, a Detroit."
    errors: [false-friend]
  - tutor: "Un ingegnere in pensione che non riesce a stare fermo, mi piace! E che cosa porta un ingegnere dell'automobile in uno studio di design come il nostro?"
    recast: {text: "ritirato", fix: "in pensione", tags: [false-friend]}
    goals: [intro]
  - learner: "Negli anni Novanta progettavo i sedili delle auto. Ogni giorno ho fatto decine di prove con persone vere, per capire come la gente si siede."
    errors: [tense-aspect]
  - tutor: "Esperienza preziosa per le nostre sedie. Ma «ogni giorno ho fatto decine di prove»: per un'abitudine di quegli anni, quale tempo è più naturale?"
    prompt: {text: "Ogni giorno ho fatto decine di prove", tags: [tense-aspect]}
  - learner: "Facevo decine di prove al giorno, sì. Per questo credo di poter aiutare la vostra linea di sedute per ufficio."
  - tutor: "Esatto. Ed è proprio la linea che ci preoccupa di più. Quali sono i suoi punti forti, e un punto debole?"
    goals: [experience]
  - learner: "Sono paziente e metodico. Il mio difetto è che con il computer sono più lento che i giovani: i programmi nuovi li devo imparare da zero."
    errors: [comparative]
  - tutor: "Onesto, lo apprezzo. Ma «più lento che i giovani»: davanti a un nome, nel confronto, quale preposizione si usa?"
    prompt: {text: "più lento che i giovani", tags: [comparative]}
  - learner: "Più lento dei giovani, sì. Ma imparo, con calma."
  - tutor: "Esatto. E perché vorrebbe lavorare con noi, invece di godersi il lago?"
    goals: [strengths]
  - learner: "Perché il lago, dopo tre anni, mi annoia! E mi piacerebbe che il mio lavoro servisse ancora a qualcosa. Quante ore per settimana sarebbero richieste?"
    errors: [preposition]
  - tutor: "Il lago che annoia, me lo segno! Ma «quante ore per settimana»: in italiano, per la frequenza, che preposizione usiamo con «settimana»?"
    prompt: {text: "ore per settimana", tags: [preposition]}
    goals: [why]
  - learner: "Alla settimana! Quante ore alla settimana, allora?"
  - tutor: "Esatto. Pensavamo a venti ore alla settimana, con orari flessibili. Le faremo sapere entro venerdì."
    goals: [questions]

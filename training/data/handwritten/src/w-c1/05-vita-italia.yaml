# Set w-c1, file 5: C1, life in Italy, podcasts, radio phone-ins, cardiology visits.
# Piacere, irregular imperfetto and present (decevo, sapo), Spanish false friends (crema, valutati,
# mareggi, tensione), English ones (parenti, realizzare), «obbligati a», «tenerò», «dovrebbe di».
- scenario: intervista-podcast
  level: C1
  persona: en-m-traveller
  history: [piacere]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Per caso, giuro! Sei anni fa giravo l'Europa con lo zaino, e a Napoli ho mancato il treno per Roma."
    errors: [word-choice]
  - tutor: "Hai perso il treno e hai trovato una vita, che inizio! E poi com'è andata?"
    recast: {text: "mancato il treno", fix: "perso il treno", tags: [word-choice]}
  - learner: "Un signore del bar mi ha offerto un caffè e un lavoro nello stesso pomeriggio, e da allora non me ne sono più andato."
  - tutor: "Un caffè e un lavoro nello stesso giorno: solo a Napoli! E che cosa ti ha sorpreso di più, all'inizio?"
    goals: [story]
  - learner: "La gente che parla con le mani, e il cibo: io piaccio da morire la pizza fritta. Ma la vera sorpresa è che qui nessuno fa la fila!"
    errors: [piacere]
  - tutor: "La pizza fritta, ottima scelta! Ma «io piaccio la pizza fritta»: detta così, sembri tu quello che piace a lei. Come si gira la frase con questo verbo?"
    prompt: {text: "io piaccio da morire la pizza fritta", tags: [piacere]}
  - learner: "Mi piace da morire la pizza fritta, scusa! E la fila... all'inizio pensavo che fosse maleducazione, adesso ho capito che è un sistema invisibile."
  - tutor: "Un sistema invisibile, bellissima definizione. Ma dimmi la verità: c'è qualcosa dell'Italia che proprio non sopporti?"
    goals: [culture-shock]
  - learner: "La burocrazia, lo dico con affetto. Per il permesso di lavoro ci sono voluto otto mesi, e ogni ufficio voleva un documento diverso."
    errors: [participle-agreement]
  - tutor: "Con affetto, certo! Ma «ci sono voluto otto mesi»: qual è il soggetto di quella frase? E allora come deve finire quel participio?"
    prompt: {text: "ci sono voluto otto mesi", tags: [participle-agreement]}
  - learner: "Sì, ci è voluto otto mesi, una cosa incredibile."
    errors: [participle-agreement]
  - tutor: "Ci sono voluti otto mesi?! Allora la pazienza ce l'hai, eccome. Che consiglio daresti a chi sta pensando di trasferirsi qui?"
    recast: {text: "ci è voluto otto mesi", fix: "ci sono voluti otto mesi", tags: [participle-agreement]}
    goals: [critique]
  - learner: "Di imparare bene la lingua prima di partire, e di non arrabbiarsi con gli uffici: tanto, prima o poi, tutto si risolve."
  - tutor: "Prima o poi tutto si risolve: potrebbe essere il motto del nostro podcast! Grazie, è stato un piacere."
    goals: [advice]

- scenario: intervista-podcast
  level: C1
  persona: es-f-teacher
  history: [imperfetto-form]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Grazie a voi. Sono arrivata nel 2017 con una borsa di studio per un anno a Bologna. Doveva essere un anno solo, e invece sono ancora qui."
  - tutor: "E invece! Che cosa è successo?"
  - learner: "Mi sono innamorata, della città e di un bolognese. Gli amici mi chiedevano quando tornavo in Spagna, e io decevo sempre: «L'anno prossimo!»"
    errors: [imperfetto-form]
  - tutor: "Classico! Ma «io decevo»: l'imperfetto di questo verbo non segue l'infinito, prende la forma più antica del verbo. Ti viene?"
    prompt: {text: "io decevo", tags: [imperfetto-form]}
  - learner: "Allora... dicivo sempre «l'anno prossimo»?"
    errors: [imperfetto-form]
  - tutor: "Dicevo anch'io la stessa cosa, quando vivevo a Londra: l'anno prossimo, l'anno prossimo... e sono passati dieci anni! Qual è la differenza culturale che ti ha spiazzata di più?"
    recast: {text: "dicivo", fix: "dicevo", tags: [imperfetto-form]}
    goals: [story]
  - learner: "Gli orari: a Valencia si cena alle dieci, qui alle otto la cucina chiude! E poi mi stupiva che tutti mi chiedevano se avevo mangiato, come se fosse un saluto."
    errors: [subjunctive-use]
  - tutor: "Ah, il famoso «hai mangiato?», verissimo! Ma «mi stupiva che tutti mi chiedevano»: dopo un verbo di sorpresa, che modo ci aspettiamo?"
    prompt: {text: "mi stupiva che tutti mi chiedevano", tags: [subjunctive-use]}
  - learner: "Mi stupiva che tutti mi chiedessero se avevo mangiato. Adesso lo chiedo anch'io!"
  - tutor: "Perfetto, ormai sei una di noi. E c'è qualcosa che criticheresti, con gentilezza, del paese che ti ha accolta?"
    goals: [culture-shock]
  - learner: "Con gentilezza, sì: la scuola. Gli insegnanti italiani sono preparatissimi, ma sono pagati pochissimo e si sentono poco valutati."
    errors: [false-friend]
  - tutor: "Pagati poco e poco apprezzati: molti colleghi italiani ti darebbero ragione. E un consiglio per chi ci ascolta e sogna di trasferirsi?"
    recast: {text: "poco valutati", fix: "poco apprezzati", tags: [false-friend]}
    goals: [critique]
  - learner: "Di non cercare di vivere qui come a casa propria: bisogna cambiare abitudini, e accettare che certe cose non le capirai mai."
  - tutor: "Bellissimo consiglio, e con questo chiudiamo. Grazie davvero, e buon ritorno in aula domani!"
    goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-f-professional
  history: [word-order]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. Per lavoro, all'inizio: la mia compagnia di Sydney aveva aperto una sede a Milano e cercava qualcuno disposto a trasferirsi."
    errors: [word-choice]
  - tutor: "Quindi è stata l'azienda a portarla qui. Una decisione coraggiosa! E qual è stata la parte più difficile?"
    recast: {text: "compagnia", fix: "azienda", tags: [word-choice]}
    goals: [story]
  - learner: "Senza dubbio la lingua. Avevo studiato italiano solo sei mesi, e nelle riunioni avevo sempre paura di dire una stupida cosa davanti ai colleghi."
    errors: [word-order]
  - tutor: "La capisco benissimo. Ma «una stupida cosa»: in italiano, dove mettiamo di solito un aggettivo come questo?"
    prompt: {text: "una stupida cosa", tags: [word-order]}
  - learner: "Dopo il nome: una cosa stupida. E poi la solitudine: i primi mesi non conoscevo nessuno fuori dall'ufficio."
  - tutor: "Esatto. La solitudine dei primi mesi la raccontano in tanti. E lei, come è cambiata in questi anni?"
    goals: [difficulties]
  - learner: "Sono diventata più paziente, e anche più rumorosa! Se rimanevo in Australia, non avrei mai imparato a discutere a tavola per due ore su un piatto di pasta."
    errors: [hypothetical]
  - tutor: "Più rumorosa, questa è bella! Però l'ipotesi: «se rimanevo», seguito da «non avrei mai imparato». In un italiano curato, come si costruisce la prima metà?"
    prompt: {text: "Se rimanevo in Australia", tags: [hypothetical]}
  - learner: "Se fossi rimasta in Australia, non avrei mai imparato a discutere così."
  - tutor: "Perfetto. E se un ascoltatore volesse seguire la sua strada, che cosa gli consiglierebbe?"
    goals: [change]
  - learner: "Di partire anche prima che la lingua è perfetta. E di cercare un gruppo di conversazione: io il mio l'ho trovato in una biblioteca di quartiere."
    errors: [subjunctive-use]
  - tutor: "Consiglio prezioso. Ma «prima che la lingua è perfetta»: dopo «prima che», quale modo ci vuole?"
    prompt: {text: "prima che la lingua è perfetta", tags: [subjunctive-use]}
  - learner: "Prima che la lingua sia perfetta, sì. Tanto, perfetta non lo diventa mai!"
  - tutor: "Proprio così, e lo dice una che ce l'ha fatta. Grazie per essere stata con noi."
    goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: es-m-worker
  history: [verb-form]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie. Per la cucina, naturalmente. Mio nonno era di Parma, e a Buenos Aires mi parlava dei tortellini come di una cosa sacra."
  - tutor: "Un richiamo di famiglia, allora. E com'è stato l'impatto?"
    goals: [story]
  - learner: "Duro. Nella prima cucina dove ho lavorato, lo chef mi ha detto: «Qui non si improvvisa». Io sapo cucinare, ma qui ogni ricetta ha le sue regole."
    errors: [verb-form]
  - tutor: "Immagino la scena! Ma «io sapo cucinare»: il presente di «sapere» è irregolare. Alla prima persona come fa?"
    prompt: {text: "Io sapo cucinare", tags: [verb-form]}
  - learner: "So cucinare, so! Però in Argentina mettiamo la crema dappertutto, e qui se la metti nella carbonara ti cacciano."
    errors: [false-friend]
  - tutor: "Ah ah, la panna nella carbonara è un crimine! Quindi la difficoltà più grande è stata adattarsi alle regole."
    recast: {text: "la crema", fix: "la panna", tags: [false-friend]}
    goals: [difficulties]
  - learner: "Sì. Ma sono cambiato molto: prima cucinavo per stupire, adesso cucino per rispettare l'ingrediente. Se non sarei venuto qui, non l'avrei mai capito."
    errors: [hypothetical]
  - tutor: "Bellissima frase. Però l'ipotesi: «se non sarei venuto». Dopo «se», il condizionale non può stare. Che cosa ci va?"
    prompt: {text: "Se non sarei venuto", tags: [hypothetical]}
  - learner: "Se non fossi venuto qui, non l'avrei mai capito."
  - tutor: "Esatto. E per chi ci ascolta e sogna di trasferirsi, che consiglio ha?"
    goals: [change]
  - learner: "Di venire con umiltà. E di non spiegare mai a un italiano come si cucinano la pasta!"
    errors: [subject-verb-agreement]
  - tutor: "Ah, consiglio d'oro! Ma «come si cucinano la pasta»: la pasta è una sola, e allora il verbo?"
    prompt: {text: "come si cucinano la pasta", tags: [subject-verb-agreement]}
  - learner: "Come si cucina la pasta, certo! Sennò ti guardano malissimo."
  - tutor: "Malissimo, confermo! Grazie per essere stato con noi, e buon lavoro in cucina."
    goals: [advice]

- scenario: turismo-di-massa
  level: C1
  persona: es-f-erasmus
  history: [passive]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno! Sono una studentessa spagnola e vivo a Venezia da un anno. Sono a favore, anche se non credo che basta da solo."
    errors: [subjunctive-use]
  - tutor: "Benvenuta in diretta! Ma «non credo che basta»: dopo «non credo che», quale modo ci vuole?"
    prompt: {text: "non credo che basta", tags: [subjunctive-use]}
  - learner: "Non credo che basti, giusto. Però è un primo passo."
  - tutor: "Un primo passo, dice. Ci porti un esempio concreto: che cosa vede, vivendo lì?"
    goals: [introduce]
  - learner: "Il mio affitto è stato aumentato del quaranta per cento in due anni, e molti vicini sono stati obbligati di andarsene."
    errors: [preposition]
  - tutor: "Un dato che fa riflettere. Ma «obbligati di andarsene»: con «obbligare», quale preposizione introduce l'infinito?"
    prompt: {text: "obbligati di andarsene", tags: [preposition]}
  - learner: "Sono stati obbligati per andarsene, cioè, non avevano scelta."
    errors: [preposition]
  - tutor: "Obbligati ad andarsene, sì: è questo lo spopolamento di cui si parla. Però, faccio l'avvocato del diavolo: i turisti portano soldi, e molti veneziani vivono di quello."
    recast: {text: "obbligati per andarsene", fix: "obbligati ad andarsene", tags: [preposition]}
    goals: [example]
  - learner: "È vero, ma i soldi delle crociere restano quasi tutti alle compagnie. Chi scende dalla nave per sei ore spende pochissimo: un panino e una calamita."
  - tutor: "Argomento forte, e i dati le danno ragione. Quale sarebbe, allora, la sua proposta?"
    goals: [rebut]
  - learner: "Proporrei un numero massimo di visitatori al giorno, con prenotazione online, e che i soldi del ticket sono usati per abbassare gli affitti dei residenti."
    errors: [subjunctive-use]
  - tutor: "Proposta concreta. Ma «proporrei... che i soldi sono usati»: dopo «proporre che», quale modo ci vuole?"
    prompt: {text: "che i soldi del ticket sono usati", tags: [subjunctive-use]}
  - learner: "Che i soldi siano usati per gli affitti dei residenti, ecco."
  - tutor: "Esatto. Un tetto ai visitatori e il ticket per le case dei veneziani: lo giro volentieri all'assessore. Grazie per la telefonata!"
    goals: [proposal]

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno. Sono un pensionato americano, vivo a Firenze da cinque anni, e sono contrario: mettere un biglietto per entrare in una città significa trasformarla in un parco a tema."
  - tutor: "Una posizione netta. Ma lei vive a Firenze: non vede il problema del sovraffollamento?"
    goals: [introduce]
  - learner: "Lo vedo eccome: ieri per attraversare Ponte Vecchio ci ho messo venti minuti. Ma il problema sono i gruppi organizzati, che arrivano in pullman e si riversano tutti in il centro storico alla stessa ora."
    errors: [articulated-preposition]
  - tutor: "Venti minuti, addirittura. Ma «in il centro storico»: in italiano quelle due parole si fondono in una sola. Quale?"
    prompt: {text: "in il centro storico", tags: [articulated-preposition]}
  - learner: "Nel centro storico, sì. Tutti insieme, alle dieci di mattina."
  - tutor: "Esatto. Ma allora il ticket non servirebbe proprio a scoraggiare quei gruppi?"
    goals: [example]
  - learner: "No, perché per un gruppo cinque euro non sono niente: li paga l'agenzia, e il turista neanche lo realizza. Il ticket colpisce solo chi viene da solo per un giorno."
    errors: [false-friend]
  - tutor: "Il turista neanche se ne accorge, è vero: è un'obiezione che sentiamo spesso. Che cosa propone in alternativa?"
    recast: {text: "neanche lo realizza", fix: "neanche se ne accorge", tags: [false-friend]}
    goals: [rebut]
  - learner: "Limiterei il numero di pullman che entrano ogni giorno, con una tassa molto più alta. E il Comune dovrebbe di vietare gli affitti turistici nei palazzi dove vivono ancora i residenti."
    errors: [modal-infinitive]
  - tutor: "Proposte precise. Solo un dettaglio: «dovrebbe di vietare»... dopo questo verbo, ci va davvero qualcosa prima dell'infinito?"
    prompt: {text: "dovrebbe di vietare", tags: [modal-infinitive]}
  - learner: "No, niente: il Comune dovrebbe vietare gli affitti turistici in quei palazzi."
  - tutor: "Esatto. Meno pullman e case ai residenti: proposte concrete, che giro volentieri all'assessore. Grazie per la telefonata!"
    goals: [proposal]

- scenario: medico-specialista
  level: C1
  persona: en-m-heritage
  history: [reflexive]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Non benissimo, a dire la verità. Mi stanco subito: anche due rampe di scale mi lasciano senza fiato."
  - tutor: "Capisco. E l'affaticamento lo sente anche a riposo, o solo sotto sforzo?"
  - learner: "Solo sotto sforzo. Però l'altra notte mi sono svegliato con il cuore che batteva fortissimo, e ho dovuto alzare dal letto per bere un bicchiere d'acqua."
    errors: [reflexive]
  - tutor: "Questo è importante. Ma «ho dovuto alzare dal letto»: alzare chi? A quel verbo manca un pezzo."
    prompt: {text: "ho dovuto alzare dal letto", tags: [reflexive]}
  - learner: "Ho dovuto alzarmi, sì, e dopo dieci minuti è passato. Mi preoccupa perché tutti e due i miei parenti avevano la pressione alta."
    errors: [false-friend]
  - tutor: "Esatto, alzarsi. E se tutti e due i genitori avevano la pressione alta, è un dato importante. Infatti gli esami mostrano una pressione un po' alta e il cuore un po' affaticato."
    recast: {text: "parenti", fix: "genitori", tags: [false-friend]}
    goals: [symptoms, history]
  - learner: "Che cosa significa, in concreto? È grave? Vorrei che mi spiega con parole semplici."
    errors: [subjunctive-use]
  - tutor: "Ha tutto il diritto di capire. Ma «vorrei che mi spiega»: dopo «vorrei che», che forma serve?"
    prompt: {text: "Vorrei che mi spiega", tags: [subjunctive-use]}
  - learner: "Vorrei che mi spiegasse con parole semplici, ecco."
  - tutor: "Glielo spiego subito: non è grave, ma il cuore lavora sotto sforzo da troppo tempo. Inizieremo una terapia con un farmaco per la pressione."
    goals: [understand]
  - learner: "E ci sono effetti collaterali? Faccio il tassista, non vorrei sentirmi stordito al volante."
  - tutor: "All'inizio può avere un po' di stanchezza o qualche capogiro, ma di solito passa in due settimane. Nei primi giorni guidi con prudenza, e ci rivediamo tra un mese."
    goals: [treatment]

- scenario: medico-specialista
  level: C1
  persona: es-f-teacher
  history: [future-form]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio, grazie: la stanchezza è quasi sparita. Però la sera ho le caviglie gonfie, e ho anche dei mareggi quando mi alzo di colpo."
    errors: [false-friend]
  - tutor: "Dei capogiri quando si alza di colpo: anche questo è un dato utile. Le caviglie gonfie da quanti giorni, esattamente?"
    recast: {text: "dei mareggi", fix: "dei capogiri", tags: [false-friend]}
  - learner: "Da una settimana, più o meno, e solo la sera: al mattino spariscono."
  - tutor: "Bene, l'ho annotato. Mi ricordi un attimo la sua storia familiare: in famiglia ci sono problemi di cuore?"
    goals: [symptoms]
  - learner: "Sì. Mio padre è morto giovane, a cinquantadue anni, per un infarto. E mia madre ha la tensione alta da quando aveva quarant'anni."
    errors: [false-friend]
  - tutor: "Mi dispiace per suo padre. E la pressione alta di sua madre spiega perché la teniamo così sotto controllo."
    recast: {text: "la tensione alta", fix: "la pressione alta", tags: [false-friend]}
    goals: [history]
  - learner: "Lo immaginavo. Lunedì tenerò la riunione con i genitori dei miei alunni, e non vorrei sentirmi male davanti a tutti. Cosa dicono gli esami?"
    errors: [future-form]
  - tutor: "Capisco la preoccupazione. Ma «tenerò»: il futuro di «tenere» non è regolare, perde una vocale e cambia un po'. Come diventa?"
    prompt: {text: "tenerò", tags: [future-form]}
  - learner: "Terrò la riunione, scusi. Ma allora, gli esami?"
  - tutor: "Esatto. Gli esami dicono che la pressione è ancora alta, nonostante la terapia, e le caviglie gonfie possono dipendere proprio dal farmaco."
    goals: [understand]
  - learner: "Quindi devo cambiare farmaco? Spero che il nuovo non mi dà gli stessi problemi."
    errors: [subjunctive-use]
  - tutor: "Probabilmente sì. Ma «spero che il nuovo non mi dà»: dopo «spero che», quale modo usiamo?"
    prompt: {text: "Spero che il nuovo non mi dà", tags: [subjunctive-use]}
  - learner: "Spero che non mi dia gli stessi problemi."
  - tutor: "Esatto. Le prescrivo un farmaco diverso, che di solito non gonfia le caviglie; raramente può dare un po' di tosse secca. Ci rivediamo tra tre settimane."
    goals: [treatment]

# Set w-c1, file 7: C1, everyday negotiations and services, second pass on each scenario.
# Negative tu imperative, «più ... che in», «doveremo/poterò», «proponerei», «mentre ho parlato»,
# «viduto», participle after «l'», «un email», «fa dieci giorni», «con chi», «ero freddo».
- scenario: smartworking
  level: C1
  persona: en-f-professional
  history: [imperative-form]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Dipende dalla settimana. Il mio capo ci lascia scegliere: di solito vado in ufficio il lunedì e il giovedì, e gli altri giorni lavoro da casa."
  - tutor: "Che lusso, poter scegliere! E dove ti trovi meglio?"
    goals: [situation]
  - learner: "A casa, senza dubbio: sono molto più produttiva di in ufficio, perché nessuno mi interrompe."
    errors: [comparative]
  - tutor: "Ti credo. Ma «più produttiva di in ufficio»: quando il secondo termine comincia con una preposizione, quale parola regge il confronto?"
    prompt: {text: "più produttiva di in ufficio", tags: [comparative]}
  - learner: "Più produttiva che in ufficio, giusto. E poi risparmio quaranta minuti di metro ogni volta."
  - tutor: "Esatto. Io invece a casa non combino niente: mi metto al computer in pigiama e alle undici sto ancora leggendo le notizie."
    goals: [pros]
  - learner: "Ah, il pigiama è il primo errore! Non lavori in pigiama: vestiti come se andassi in ufficio, cambia tutto."
    errors: [imperative-form]
  - tutor: "Consiglio accettato! Ma «non lavori in pigiama»: a un amico, l'imperativo negativo come si costruisce?"
    prompt: {text: "Non lavori in pigiama", tags: [imperative-form]}
  - learner: "Non lavorare in pigiama! A parte gli scherzi, uno svantaggio c'è: le decisioni importanti si prendono alla macchinetta del caffè, quando io non sono."
    errors: [ci-ne]
  - tutor: "Perfetto. E la macchinetta, purtroppo, è il vero consiglio di amministrazione! Ma «quando io non sono»: per dire che non sei presente in un posto, manca una parolina."
    prompt: {text: "quando io non sono", tags: [ci-ne]}
    goals: [cons]
  - learner: "Quando io non ci sono, appunto. Quindi l'ideale sarebbe tre giorni a casa e due in ufficio, ma scelti da me, a secondo delle riunioni."
    errors: [word-choice]
  - tutor: "A seconda delle riunioni, certo: così alla macchinetta ci sei quando conta. Mi sembra il compromesso perfetto. E sai che cosa farei io, al posto tuo?"
    recast: {text: "a secondo delle riunioni", fix: "a seconda delle riunioni", tags: [word-choice]}
    goals: [preference]
  - learner: "Che cosa faresti? Torneresti in ufficio tutti i giorni?"
  - tutor: "Probabilmente sì, ma solo per il caffè gratis e per non cadere nella tentazione del pigiama!"

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [future-form]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo proprio per quello. Il quindici per cento è troppo: con questo aumento i nostri margini spariscono."
  - tutor: "La capisco, ma la carta ci costa il trenta per cento in più rispetto a gennaio."
    goals: [problem]
  - learner: "Lo so. Però siamo vostri clienti da sei anni e non abbiamo mai ritardato un pagamento. Se cambiamo fornitore, voi perdete un cliente sicuro, e noi doveremo rifare tutte le etichette."
    errors: [future-form]
  - tutor: "È un argomento serio, lo riconosco. Ma «noi doveremo»: il futuro di «dovere» si accorcia. Come diventa?"
    prompt: {text: "doveremo", tags: [future-form]}
  - learner: "Dovremo, scusi. Quindi sarebbe una perdita anche per voi. Pensatelo bene, prima di lasciar andare un cliente come noi."
    errors: [ci-ne]
  - tutor: "Esatto. Ma «pensatelo bene»: si pensa A qualcosa. Quale pronome riprende quell'«a questo»?"
    prompt: {text: "Pensatelo bene", tags: [ci-ne]}
  - learner: "Pensateci bene, volevo dire. Comunque le proponerei di fermare l'aumento al cinque per cento, con ordini garantiti per un anno."
    errors: [conditional-form]
  - tutor: "Ci penseremo, promesso. Ma «le proponerei»: il condizionale di «proporre» non segue la regola, perde qualche lettera. Ci riprova?"
    prompt: {text: "le proponerei", tags: [conditional-form]}
    goals: [argue]
  - learner: "Le proporrei il cinque per cento, con ordini garantiti per tutto l'anno prossimo."
  - tutor: "Il cinque è poco, glielo dico con franchezza. Se lei si impegnasse per due anni, però, potrei arrivare all'otto."
    goals: [counteroffer]
  - learner: "L'otto con due anni va bene, ma solo se il prezzo resta bloccato, anche se la carta aumenterebbe ancora."
    errors: [subjunctive-use]
  - tutor: "Mi sembra corretto. Ma «anche se la carta aumenterebbe»: dopo «anche se», in un'ipotesi, il condizionale non va. Che cosa ci mette?"
    prompt: {text: "anche se la carta aumenterebbe", tags: [subjunctive-use]}
  - learner: "Anche se la carta aumentasse ancora, il prezzo resta quello."
  - tutor: "Allora siamo d'accordo: otto per cento, contratto di due anni e prezzo bloccato. Le mando il contratto entro domani."
    goals: [agreement]

- scenario: riunione-lavoro
  level: C1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "La settimana scorsa ho finito la prima versione del sito per l'ostello di Galway. Mentre preparavo la pagina delle prenotazioni, il cliente ha chiamato tre volte per cambiare i colori."
  - tutor: "Tre volte! Classico. Quindi a che punto siamo?"
    goals: [update]
  - learner: "Il problema è proprio quello: ieri, mentre ho parlato con lui al telefono, ho capito che non sa ancora cosa vuole."
    errors: [tense-aspect]
  - tutor: "Ahi. Ma «mentre ho parlato con lui»: è un'azione in corso, interrotta da un'altra... quale tempo ci vuole?"
    prompt: {text: "mentre ho parlato con lui", tags: [tense-aspect]}
  - learner: "Mentre parlavo con lui, sì. Insomma, se continua così, finiremo a gennaio invece che a dicembre."
  - tutor: "Esatto. E gennaio è un problema, perché a gennaio partono i lavori per l'hotel irlandese. Che cosa proponi?"
    goals: [problem]
  - learner: "Una sola riunione con lui lunedì, e un documento firmato con tutte le scelte finali. Dopo, ogni modifica sarà caricata a parte."
    errors: [word-choice]
  - tutor: "Sì, ogni modifica successiva sarà addebitata a parte: mi piace, così impara a decidere. Per quando riesci a chiudere tutto?"
    recast: {text: "sarà caricata a parte", fix: "sarà addebitata a parte", tags: [word-choice]}
    goals: [proposal]
  - learner: "Se firma lunedì, poterò finire tutto entro il venti dicembre."
    errors: [future-form]
  - tutor: "Ottimo. Ma «poterò»: il futuro di «potere» perde qualcosa per strada. Che cosa?"
    prompt: {text: "poterò", tags: [future-form]}
  - learner: "Potrò, senza la e. Quindi venti dicembre, se il cliente firma lunedì."
  - tutor: "Perfetto, venti dicembre. E se lunedì non firma, dimmelo subito, che lo chiamo io."
    goals: [deadline]

- scenario: assicurazione-sinistro
  level: C1
  persona: en-m-heritage
  history: [past-participle-form]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri sera ho trovato la mia macchina con lo specchietto rotto e una lunga riga sulla portiera. Era parcheggiata sotto casa, e qualcuno ha lasciato un biglietto sul parabrezza."
  - tutor: "Almeno qualcuno onesto, per fortuna! Che cosa c'era scritto sul biglietto?"
    goals: [what]
  - learner: "Un nome e un numero di telefono. Ho chiamato subito: era un ragazzo, e mi ha detto che facendo manovra non aveva viduto la mia macchina."
    errors: [past-participle-form]
  - tutor: "Un ragazzo per bene, comunque. Ma «non aveva viduto»? Attenzione: «vedere» al passato ha una forma tutta sua. Come fa?"
    prompt: {text: "non aveva viduto", tags: [past-participle-form]}
  - learner: "Non aveva visto la mia macchina, scusi. Insomma, ha ammesso che la colpa era sua."
  - tutor: "Esatto. Quindi la responsabilità è chiara. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo compilato stamattina, insieme. Però l'ora non la sappiamo: lui dice verso le dieci, ma io non ho sentito niente."
    errors: [participle-agreement]
  - tutor: "Bene. Ma «l'abbiamo compilato»: quell'«l'» sta per la constatazione... e allora come deve finire «compilato»?"
    prompt: {text: "l'abbiamo compilato", tags: [participle-agreement]}
  - learner: "Sì, sì, l'abbiamo compilato e firmato tutti e due."
    errors: [participle-agreement]
  - tutor: "Bene: se è compilata e firmata da entrambi, l'ora approssimativa va benissimo. Me la manda insieme alle foto dei danni?"
    recast: {text: "compilato", fix: "compilata", tags: [participle-agreement]}
    goals: [documents]
  - learner: "Certo, gliela mando oggi. E poi? Posso già portare la macchina dal carrozziere, o devo aspettare il perito?"
  - tutor: "Per un danno così piccolo, il perito può valutare dalle foto. Se entro tre giorni non la chiama nessuno, la porti pure da un carrozziere convenzionato."
    goals: [next]

- scenario: burocrazia-residenza
  level: C1
  persona: en-f-student
  history: [article-form]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Sono una studentessa inglese e ho mosso casa: adesso abito con tre amiche vicino allo stadio. Devo cambiare la residenza, giusto?"
    errors: [word-choice]
  - tutor: "Esatto: se ha cambiato casa, si tratta di un cambio di abitazione. Le servono il modulo compilato, un documento e il contratto, o il consenso del proprietario."
    recast: {text: "mosso casa", fix: "cambiato casa", tags: [word-choice]}
    goals: [request]
  - learner: "Il contratto è intestato a una delle mie coinquiline, non a me. Il proprietario però mi ha scritto un email dove dice che è d'accordo."
    errors: [article-form]
  - tutor: "Dipende da com'è scritta. Prima però: «un email». «Email» è femminile e comincia per vocale, quindi l'articolo?"
    prompt: {text: "un email", tags: [article-form]}
  - learner: "Un'email, con l'apostrofo. Gliela faccio vedere sul telefono."
  - tutor: "Esatto. Purtroppo un'email non basta: serve una dichiarazione firmata dal proprietario, con la copia del suo documento."
    goals: [documents]
  - learner: "Ah. Il problema è che lui vive in Sardegna e non risponde quasi mai. È possibile che la firma la fa la mia coinquilina, visto che il contratto è suo?"
    errors: [subjunctive-use]
  - tutor: "Domanda giusta. Ma «è possibile che la fa»: dopo «è possibile che», che modo ci vuole?"
    prompt: {text: "È possibile che la firma la fa", tags: [subjunctive-use]}
  - learner: "È possibile che la firmi lei, allora?"
  - tutor: "Sì: essendo intestataria del contratto, può dichiarare lei che lei abita lì. Porti il modulo firmato da tutte e due."
    goals: [problem]
  - learner: "Perfetto. E quanto ci vuole? A dicembre torno a Leeds per Natale, e non vorrei che i vigili vengono mentre non ci sono."
    errors: [subjunctive-use]
  - tutor: "Circa quarantacinque giorni. Ma «non vorrei che i vigili vengono»: con «vorrei che», che forma serve?"
    prompt: {text: "non vorrei che i vigili vengono", tags: [subjunctive-use]}
  - learner: "Non vorrei che venissero mentre sono via."
  - tutor: "Esatto. Allora lasci un numero di telefono nel modulo: se non la trovano, la richiamano per un secondo controllo. E buon Natale in anticipo!"
    goals: [next]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Vengo per un problema di sicurezza: in via dei Tigli i lampioni sono spenti da tre settimane, e la sera la strada è completamente al buio."
  - tutor: "Tre settimane, capisco. Ha già fatto una segnalazione?"
  - learner: "Sì, ho chiamato il numero verde fa dieci giorni, e mi hanno detto che il guasto era stato segnalato alla ditta dell'illuminazione."
    errors: [word-order]
  - tutor: "Bene che l'abbia fatto. Ma «fa dieci giorni»: in italiano, quel «fa» dove si mette rispetto ai giorni?"
    prompt: {text: "fa dieci giorni", tags: [word-order]}
  - learner: "Dieci giorni fa, scusi. Ma da allora non è cambiato niente, e ieri sera una signora anziana è caduta sul marciapiede."
  - tutor: "Esatto. Mi dispiace molto per la signora. Purtroppo l'illuminazione è gestita da una ditta esterna, e i tempi non dipendono da noi."
    goals: [describe]
  - learner: "Con tutto il rispetto, il contratto con la ditta l'ha firmato il Comune. Non accetto che mi si risponde che non dipende da voi."
    errors: [subjunctive-use]
  - tutor: "Il ragionamento non fa una piega. Ma «non accetto che mi si risponde»: dopo «non accetto che», quale modo?"
    prompt: {text: "Non accetto che mi si risponde", tags: [subjunctive-use]}
  - learner: "Non accetto che si dice così, voglio dire."
    errors: [subjunctive-use]
  - tutor: "Ha ragione, non è giusto che le si dica così. Facciamo le cose per bene: può presentare un reclamo formale, e il Comune deve sollecitare la ditta e risponderle entro trenta giorni."
    recast: {text: "si dice così", fix: "si dica così", tags: [subjunctive-use]}
    goals: [insist, rights]
  - learner: "Lo presento subito. Ma mi serve un numero di protocollo, e vorrei sapere a chi rivolgermi se fra trenta giorni i lampioni sono ancora spenti."
  - tutor: "Ecco: protocollo 7742. Se tra trenta giorni non è cambiato nulla, può rivolgersi al difensore civico citando questo numero. Intanto segnalo la caduta della signora, perché all'intervento venga data priorità."
    goals: [commitment]

- scenario: recensione-ristorante
  level: C1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Mi dispiace, ma devo lamentarmi. Avevo prenotato un tavolo vicino alla finestra per il compleanno di mia moglie, e invece ci avete seduti accanto alla porta della cucina."
    errors: [word-choice]
  - tutor: "Ha ragione, vi abbiamo fatti sedere nel posto peggiore della sala, e me ne scuso. Mi spiega meglio com'era andata la prenotazione?"
    recast: {text: "seduti", fix: "fatti sedere", tags: [word-choice]}
    goals: [complain]
  - learner: "Al telefono la ragazza con chi ho parlato mi aveva assicurato che il tavolo sarebbe stato pronto. Stasera, invece, nessuno ne sapeva niente."
    errors: [relative-pronoun]
  - tutor: "Le credo. Ma «la ragazza con chi ho parlato»: dopo una preposizione, quale pronome relativo usiamo?"
    prompt: {text: "con chi ho parlato", tags: [relative-pronoun]}
  - learner: "La ragazza con cui ho parlato, sì. E poi il vino è arrivato caldo: l'abbiamo dovuto mandare indietro due volte."
  - tutor: "Esatto. E il vino caldo è imperdonabile, soprattutto in una serata così."
    goals: [detail]
  - learner: "Sinceramente mi aspettavo che qualcuno ci chiedeva scusa subito, senza bisogno di chiamare il responsabile."
    errors: [subjunctive-use]
  - tutor: "Ha perfettamente ragione. Ma «mi aspettavo che qualcuno ci chiedeva»: dopo «mi aspettavo che», quale forma ci vuole?"
    prompt: {text: "mi aspettavo che qualcuno ci chiedeva", tags: [subjunctive-use]}
  - learner: "Mi aspettavo che qualcuno ci chiedesse scusa, ecco."
  - tutor: "Esatto. E le scuse gliele faccio io adesso, sinceramente. Posso offrirvi la torta e il vino di stasera?"
    goals: [expectation]
  - learner: "Lo apprezzo. Accettiamo la torta, ma il vino lo pago io: non è la colpa del vino se è arrivato caldo!"
    errors: [article-use]
  - tutor: "Ah ah, giusto, il vino è innocente! Però «non è la colpa del vino»: in questa espressione l'articolo ci sta?"
    prompt: {text: "non è la colpa del vino", tags: [article-use]}
  - learner: "No, senza: non è colpa del vino."
  - tutor: "Esatto. Allora la torta è nostra, con le candeline. Tanti auguri alla signora!"
    goals: [resolve]

- scenario: medico-specialista
  level: C1
  persona: en-m-traveller
  history: [essere-avere]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Un po' meglio, ma di notte spesso ero freddo e sudato, e il cuore batteva velocissimo."
    errors: [essere-avere]
  - tutor: "Questo è un dettaglio importante. Ma «ero freddo»: per una sensazione come questa, in italiano che verbo usiamo?"
    prompt: {text: "ero freddo", tags: [essere-avere]}
  - learner: "Avevo freddo, sì, anche sotto due coperte. È cominciato quando sono tornato dal Marocco, dopo tre settimane in giro con lo zaino."
  - tutor: "Esatto. E il viaggio è un dato prezioso. In famiglia qualcuno ha avuto problemi di cuore?"
    goals: [symptoms]
  - learner: "Mio zio è stato diagnosticato con un'aritmia a quarant'anni, ma i miei genitori stanno benissimo."
    errors: [passive]
  - tutor: "Capisco. Ma «mio zio è stato diagnosticato»: in italiano non si diagnostica una persona, ma una malattia. Come si gira la frase?"
    prompt: {text: "Mio zio è stato diagnosticato con un'aritmia", tags: [passive]}
  - learner: "Mio zio ha stato diagnosticato un'aritmia, allora."
    errors: [passive]
  - tutor: "Quindi a suo zio è stata diagnosticata un'aritmia a quarant'anni: lo segno nella cartella."
    recast: {text: "ha stato diagnosticato un'aritmia", fix: "è stata diagnosticata un'aritmia", tags: [passive]}
    goals: [history]
  - learner: "E i miei esami cosa dicono? Ho paura che è qualcosa di grave."
    errors: [subjunctive-use]
  - tutor: "Glielo spiego subito. Ma «ho paura che è»: dopo «ho paura che», quale modo?"
    prompt: {text: "Ho paura che è", tags: [subjunctive-use]}
  - learner: "Ho paura che sia qualcosa di grave. E se serve una terapia, ha effetti collaterali?"
  - tutor: "Stia tranquillo: il cuore è sano. Gli esami mostrano un'infezione presa in viaggio, e il battito veloce viene da lì e dal caffè. Le do un antibiotico per una settimana: può dare un po' di nausea."
    goals: [understand, treatment]

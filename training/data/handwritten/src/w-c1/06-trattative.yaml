# Set w-c1, file 6: C1, weddings, rent negotiations, interviews, promotions, pitches, mediation.
# Combined pronouns (gli le -> gliele), concordance after «vorrei», «vorremo/vorremmo», «ne ho visti»,
# missing «non», «sto avendo un corso», false friends (forno, confidente, compromesso, bruto).
- scenario: organizzare-matrimonio
  level: C1
  persona: en-f-professional
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Una cosa piccola e informale, in campagna, con al massimo sessanta invitati. Il mio fidanzato vorrebbe che fosse tutto all'aperto, io ho un po' paura della pioggia."
  - tutor: "Sessanta invitati in campagna, un sogno. Per la pioggia un piano B si trova sempre. Avete già un'idea del budget?"
    goals: [vision]
  - learner: "Venticinquemila euro, tutto compreso. Per noi la priorità è il cibo; il fotografo può anche essere un amico bravo."
  - tutor: "È fattibile, se rinunciamo a qualche lusso. Ho due location da proporvi: un agriturismo sulle colline o una villa sul lago."
    goals: [budget]
  - learner: "Io preferirei l'agriturismo, ma ho paura che non ha abbastanza spazio al coperto, se piove."
    errors: [subjunctive-use]
  - tutor: "Ottimo dubbio. Ma «ho paura che non ha abbastanza spazio»: dopo «ho paura che», il verbo come cambia?"
    prompt: {text: "ho paura che non ha abbastanza spazio", tags: [subjunctive-use]}
  - learner: "Ho paura che non avrebbe abbastanza spazio al coperto."
    errors: [subjunctive-use]
  - tutor: "Capisco: teme che non abbia abbastanza spazio al coperto. In realtà c'è un fienile restaurato per ottanta persone, quindi il piano B è già pronto."
    recast: {text: "che non avrebbe abbastanza spazio", fix: "che non abbia abbastanza spazio", tags: [subjunctive-use]}
  - learner: "Allora scegliamo l'agriturismo, senza dubbio. Le foto del fienile, gli le può mandare anche al mio fidanzato? Lui decide tutto con le immagini."
    errors: [combined-pronouns]
  - tutor: "Ottima scelta. Ma «gli le può mandare»: quando questi due pronomi si incontrano, si fondono in una parola sola. Quale?"
    prompt: {text: "gli le può mandare", tags: [combined-pronouns]}
    goals: [choices]
  - learner: "Gliele può mandare, allora? E un'altra cosa: vorrei che il fotografo non sia invadente durante la cerimonia."
    errors: [subjunctive-use]
  - tutor: "Certo, stasera stessa. Ma «vorrei che il fotografo non sia»: dopo un condizionale come «vorrei», il congiuntivo si sposta indietro nel tempo. Come diventa?"
    prompt: {text: "vorrei che il fotografo non sia", tags: [subjunctive-use]}
  - learner: "Vorrei che non fosse invadente, che stesse un po' in disparte."
  - tutor: "Perfetto, lo metto per iscritto nel contratto: fotografo discreto, cibo al centro e fienile pronto in caso di pioggia."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: C1
  persona: es-m-worker
  history: [conditional-form]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Noi lo immaginiamo grande, all'argentina: centocinquanta invitati, una grigliata enorme, e si balla fino alle cinque di mattina."
  - tutor: "Centocinquanta invitati e una grigliata: sarà una festa memorabile! Avete un budget di riferimento?"
    goals: [vision]
  - learner: "Quarantamila euro. Però vorremo spendere meno, se possibile: il menù, per esempio, potrei pensarlo io, che faccio il cuoco."
    errors: [conditional-form]
  - tutor: "Un cuoco che decide i piatti delle sue nozze, ammirevole! Ma «vorremo spendere meno»: così suona come un futuro. Per un desiderio detto con garbo, che forma usiamo?"
    prompt: {text: "vorremo spendere meno", tags: [conditional-form]}
  - learner: "Vorremmo, con due emme. Ma cucinare quel giorno no: scrivo solo il menù con lo chef."
  - tutor: "Esatto, e saggia decisione: quel giorno deve godersela. Per centocinquanta persone ho due location: una masseria con un grande prato, o un castello con una sala enorme ma poco spazio fuori."
    goals: [budget]
  - learner: "La masseria, senza dubbio: per la grigliata ci serve spazio all'aperto. E poi il castello è più caro che la masseria, immagino."
    errors: [comparative]
  - tutor: "Immagina bene. Ma «più caro che la masseria»: davanti a un nome, nel confronto, quale preposizione usiamo?"
    prompt: {text: "più caro che la masseria", tags: [comparative]}
  - learner: "È più caro che quella, no?"
    errors: [comparative]
  - tutor: "Sì, il castello è più caro di quella di almeno ottomila euro. Scelta fatta, allora! Ci sono condizioni che vuole mettere per iscritto?"
    recast: {text: "più caro che quella", fix: "più caro di quella", tags: [comparative]}
    goals: [choices]
  - learner: "Sì, due. Ogni costo extra me lo dovete dire prima, niente sorprese. E se piove, voglio che c'è un tendone pronto."
    errors: [subjunctive-use]
  - tutor: "Giustissimo. Solo un dettaglio: «voglio che c'è un tendone»... dopo «voglio che», quale modo?"
    prompt: {text: "voglio che c'è un tendone", tags: [subjunctive-use]}
  - learner: "Voglio che ci sia un tendone pronto, ecco."
  - tutor: "Ci sarà, glielo garantisco per contratto. Le preparo il preventivo dettagliato entro lunedì, voce per voce."
    goals: [conditions]

- scenario: trattativa-affitto
  level: C1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto: è luminoso e la zona è tranquilla. Però mi preoccupa il riscaldamento: il proprietario ha detto che il forno ha vent'anni."
    errors: [word-choice]
  - tutor: "La caldaia ha vent'anni, è vero, ma è stata revisionata a settembre. Il canone è di novecento euro al mese, spese escluse."
    recast: {text: "il forno", fix: "la caldaia", tags: [word-choice]}
    goals: [interest]
  - learner: "Novecento è un po' troppo per me. Ho visitato molti appartamenti in questa zona, e ho visto almeno tre più economici, della stessa grandezza."
    errors: [ci-ne]
  - tutor: "Capisco. Ma «ho visto almeno tre più economici»: tre appartamenti, giusto? Che parolina li richiama, prima del verbo?"
    prompt: {text: "ho visto almeno tre", tags: [ci-ne]}
  - learner: "Ne ho visti almeno tre, sì. Se il proprietario scende a ottocento, firmo anche domani."
  - tutor: "Esatto. Ottocento è difficile, ma posso proporgli ottocentocinquanta, se lei accetta un contratto di quattro anni."
    goals: [negotiate]
  - learner: "Quattro anni mi vanno bene, ma lavoro con contratti a progetto, e se l'azienda mi manderebbe all'estero, dovrei andarmene prima."
    errors: [hypothetical]
  - tutor: "Lo capisco. Ma «se l'azienda mi manderebbe»: dopo «se», che forma ci va?"
    prompt: {text: "se l'azienda mi manderebbe", tags: [hypothetical]}
  - learner: "Se l'azienda mi mandasse all'estero, dovrei andarmene prima. Che preavviso serve per la disdetta?"
  - tutor: "Perfetto. Bastano sei mesi per gravi motivi, e un trasferimento di lavoro lo è. Possiamo anche scriverlo esplicitamente in una clausola."
    goals: [conditions]
  - learner: "Allora accetto a ottocentocinquanta, con quattro anni e la clausola sul trasferimento. Mandami la bozza quando è pronta."
    errors: [register]
  - tutor: "Affare fatto, o quasi. Però, «mandami la bozza»: fino a un attimo fa mi dava del lei. Come lo diciamo?"
    prompt: {text: "Mandami la bozza", tags: [register]}
  - learner: "Mi scusi! Mi mandi la bozza quando è pronta, per favore."
  - tutor: "Nessun problema. Parlo con il proprietario oggi stesso, e la bozza le arriva entro venerdì."
    goals: [conclude]

- scenario: trattativa-affitto
  level: C1
  persona: es-f-erasmus
  history: [negation]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, tanto, soprattutto la terrazza. Ma ho un dubbio: nel annuncio c'era scritto «arredato», e in cucina non c'è neanche il frigorifero."
    errors: [articulated-preposition]
  - tutor: "Ha ragione, lo verifico. Però «nel annuncio»: davanti a una vocale, quella preposizione come si accorcia?"
    prompt: {text: "nel annuncio", tags: [articulated-preposition]}
  - learner: "Nell'annuncio, sì. Quindi il frigorifero chi lo compra?"
  - tutor: "Esatto. Il proprietario si è impegnato a comprarlo prima del suo ingresso, glielo confermo per iscritto. Il canone è di settecento euro."
    goals: [interest]
  - learner: "Per me settecento è troppo, sono una studentessa. Posso arrivare a seicento, e poi ho nessun garante italiano."
    errors: [negation]
  - tutor: "Capisco. Ma «ho nessun garante»: quando «nessuno» viene dopo il verbo, davanti manca qualcosa. Che cosa?"
    prompt: {text: "ho nessun garante", tags: [negation]}
  - learner: "Non ho nessun garante, scusi. Però potrei pagare tre mesi di deposito invece di due."
  - tutor: "Esatto. Tre mesi di deposito potrebbero convincere il proprietario. Se accettasse seicentocinquanta, lei firmerebbe?"
    goals: [negotiate]
  - learner: "Sì, a seicentocinquanta firmerei, a condizione che il contratto è di un anno solo: a luglio torno in Spagna."
    errors: [subjunctive-use]
  - tutor: "Si può fare. Ma «a condizione che il contratto è»: questa congiunzione che cosa vuole dopo?"
    prompt: {text: "a condizione che il contratto è", tags: [subjunctive-use]}
  - learner: "A condizione che il contratto sarebbe di un anno solo."
    errors: [subjunctive-use]
  - tutor: "D'accordo: a condizione che il contratto sia transitorio, di dodici mesi, il proprietario non avrà problemi. Gli porto la proposta oggi stesso."
    recast: {text: "che il contratto sarebbe", fix: "che il contratto sia", tags: [subjunctive-use]}
    goals: [conditions]
  - learner: "Perfetto, allora aspetto la sua chiamata. E il frigorifero, mi raccomando!"
  - tutor: "Il frigorifero arriverà, promesso! Se il proprietario dice di sì, firmiamo venerdì mattina."
    goals: [conclude]

- scenario: colloquio-lavoro
  level: C1
  persona: en-f-student
  history: [article-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno! Sono inglese, di Leeds, e mi sono appena laureata in grafica. Sono in Italia da settembre per un corso di lingua."
  - tutor: "Benvenuta. E ha già qualche esperienza di lavoro, o è la sua prima volta?"
    goals: [intro]
  - learner: "Durante l'università ho lavorato part-time per una piccola agenzia: facevo i loghi per i negozi del quartiere. Ho anche disegnato copertina per il disco di una band locale."
    errors: [article-use]
  - tutor: "I loghi sono un'ottima palestra. Ma «ho disegnato copertina per il disco»: in italiano, a quel nome manca qualcosa davanti."
    prompt: {text: "disegnato copertina", tags: [article-use]}
  - learner: "La copertina, sì, scusi. Era il mio primo lavoro pagato, e ne vado molto fiera."
  - tutor: "E ne ha tutte le ragioni. Quali sono i suoi punti di forza, e un aspetto su cui deve ancora lavorare?"
    goals: [experience]
  - learner: "Sono creativa e imparo in fretta. Il mio punto debole è la timidezza nelle riunioni, ma sto avendo un corso di comunicazione per migliorare."
    errors: [stare-gerund]
  - tutor: "Bene che ci lavori. Ma «sto avendo un corso»: con «avere», in italiano, la forma con «stare» non funziona. Che verbo useremmo per un corso?"
    prompt: {text: "sto avendo un corso", tags: [stare-gerund]}
  - learner: "Sto seguendo un corso, ogni martedì sera. Finora è stato utile: mi sento già più confidente."
    errors: [false-friend]
  - tutor: "Si sente più sicura, e si vede anche oggi. E perché vorrebbe lavorare proprio con noi?"
    recast: {text: "più confidente", fix: "più sicura", tags: [false-friend]}
    goals: [strengths]
  - learner: "Perché mi è piaciuto moltissimo i vostri manifesti per il festival del cinema: usate i colori in modo coraggioso."
    errors: [piacere]
  - tutor: "Grazie, ne andiamo fieri anche noi. Ma «mi è piaciuto i vostri manifesti»: il verbo deve andare d'accordo con ciò che piace. Come diventa?"
    prompt: {text: "mi è piaciuto moltissimo i vostri manifesti", tags: [piacere]}
  - learner: "Mi sono piaciuti moltissimo! E posso farle una domanda? Quante persone ci sono nel reparto grafico?"
  - tutor: "Esatto. Siamo in cinque, e la persona che cerchiamo lavorerebbe accanto alla nostra direttrice artistica. Le faremo sapere entro la fine del mese."
    goals: [why, questions]

- scenario: colloquio-promozione
  level: C1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Lavoro in questa cucina da quattro anni. Da quando il sous-chef è andato via, a marzo, le sue funzioni le faccio io: ordini, turni, controllo delle temperature."
  - tutor: "Lo so, e lo fa bene. I fornitori mi dicono che non abbiamo mai sprecato così poco."
    goals: [results]
  - learner: "Appunto. Per questo vorrei chiederle che il mio ruolo diventa ufficiale, con lo stipendio che corrisponde."
    errors: [subjunctive-use]
  - tutor: "Me l'aspettavo. Ma «vorrei chiederle che il mio ruolo diventa»: dopo un verbo di richiesta, quale modo ci vuole?"
    prompt: {text: "che il mio ruolo diventa", tags: [subjunctive-use]}
  - learner: "Che diventi ufficiale, sì. Lo chiedo perché sono molto compromesso con questa cucina, non per i soldi."
    errors: [false-friend]
  - tutor: "Lo so che è molto legato a questa cucina, si vede ogni giorno. Il problema è che il proprietario ha appena rifatto la cucina, e per quest'anno dice che non ci sono soldi."
    recast: {text: "molto compromesso", fix: "molto legato", tags: [false-friend]}
    goals: [request]
  - learner: "Lo capisco. Però, se l'anno scorso mi avreste dato almeno il titolo, adesso non sarei qui a chiedere tutto insieme."
    errors: [hypothetical]
  - tutor: "Ha ragione, avremmo dovuto pensarci. Però «se mi avreste dato»: in un'ipotesi sul passato, dopo «se», quale tempo?"
    prompt: {text: "se l'anno scorso mi avreste dato", tags: [hypothetical]}
  - learner: "Se mi aveste dato almeno il titolo, sarebbe tutto più semplice. Quindi le propongo questo: il titolo subito, e l'aumento a gennaio."
  - tutor: "Esatto. Il titolo subito si può fare, e l'aumento a gennaio lo propongo io al proprietario."
    goals: [handle]
  - learner: "D'accordo. Allora la brigata la avvisa lei, e il proprietario gli informo io della proposta?"
    errors: [object-pronoun]
  - tutor: "Diciamo di sì. Ma «il proprietario gli informo»: si informa qualcuno direttamente, o a qualcuno?"
    prompt: {text: "il proprietario gli informo", tags: [object-pronoun]}
  - learner: "Direttamente: il proprietario lo informo io."
  - tutor: "Perfetto. Domani lo annuncio io a tutta la cucina, e a gennaio ci sediamo di nuovo tutti e tre con i numeri dell'anno."
    goals: [next-steps]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  history: [noun-number]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie. Le propongo di digitalizzare l'archivio dei contratti: oggi sono quarantamila documenti di carta, divisi in tre magazzini."
  - tutor: "Quarantamila. E perché dovremmo spendere soldi per una cosa che, in fondo, funziona?"
    goals: [pitch]
  - learner: "Perché non funziona: per trovare un contratto ci vogliono in media due giorni, e l'anno scorso abbiamo perso due cliente importanti perché non abbiamo risposto in tempo."
    errors: [noun-number]
  - tutor: "Questo è un dato che pesa. Ma «due cliente»: con «due», il nome resta così?"
    prompt: {text: "due cliente", tags: [noun-number]}
  - learner: "Due clienti, scusi. Con l'archivio digitale un contratto si trova in dieci secondi, e risparmieremmo circa novantamila euro l'anno tra affitto dei magazzini e ore di lavoro."
  - tutor: "Esatto. Novantamila è una cifra interessante. Ma il rischio? Se il sistema si blocca, o ci attaccano gli hacker, perdiamo tutto."
    goals: [benefits]
  - learner: "Il rischio esiste, ma è basso: i dati verrebbero copiati in due centri diversi. E se il sistema andrebbe in tilt, avremmo comunque gli originali per cinque anni."
    errors: [hypothetical]
  - tutor: "Ha pensato a tutto. Però «se il sistema andrebbe in tilt»: dopo «se», il condizionale può stare?"
    prompt: {text: "se il sistema andrebbe in tilt", tags: [hypothetical]}
  - learner: "Se il sistema va in tilt, avremmo comunque gli originali, dico."
    errors: [hypothetical]
  - tutor: "Quindi, se il sistema andasse in tilt, ci resterebbero gli originali: mi sembra prudente. Quanto costa, in tutto?"
    recast: {text: "Se il sistema va in tilt", fix: "se il sistema andasse in tilt", tags: [hypothetical]}
    goals: [objection]
  - learner: "Centoventimila euro, che recuperiamo in meno di due anni. Se lei è d'accordo, le presento un piano dettagliato entro due settimane, con tre preventivi diversi."
  - tutor: "D'accordo, due settimane. Se i preventivi sono credibili, lo porto io al consiglio di dicembre."
    goals: [next-steps]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  history: [demonstrative]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ma si figuri, ha fatto bene a venire. Si sieda e mi racconti con calma: che cosa è successo esattamente?"
  - tutor: "È successo che Marta ha detto davanti a tutti che i ritardi del progetto sono colpa mia. Ma i dati che doveva mandarmi lei sono arrivati con dieci giorni di ritardo!"
  - learner: "Capisco che si sia sentito umiliato. Quel commento, davanti a tutta la squadra, è stato molto bruto."
    errors: [false-friend]
  - tutor: "Molto brusco, sì, e soprattutto ingiusto. Grazie, almeno lei mi capisce."
    recast: {text: "molto bruto", fix: "molto brusco", tags: [false-friend]}
    goals: [listen]
  - learner: "Per chiarire i fatti: lei aveva scritto a Marta che i dati erano urgenti? Se ha quegli email, mi piacerebbe vederle."
    errors: [demonstrative]
  - tutor: "Sì, le ho conservate tutte. Ma «quegli email»: in italiano «email» è femminile, quindi quel dimostrativo?"
    prompt: {text: "quegli email", tags: [demonstrative]}
  - learner: "Quelle email, certo. Ecco: lei ha scritto a Marta il tre, e Marta ha risposto che avrebbe mandato tutto entro il cinque."
  - tutor: "Esatto. E invece li ha mandati il quindici, senza una parola."
    goals: [clarify]
  - learner: "Però, per essere giusti, so che quella settimana Marta aveva il suo figlio in ospedale. Forse non ha avvisato perché era sconvolta."
    errors: [possessive]
  - tutor: "Non lo sapevo. Ma «il suo figlio»: con un nome di famiglia al singolare, che cosa fa l'articolo?"
    prompt: {text: "il suo figlio", tags: [possessive]}
  - learner: "Aveva suo figlio in ospedale, sì. Propongo di vederci domani tutti e tre, e voglio che d'ora in poi i ritardi sono segnalati subito, da chiunque."
    errors: [subjunctive-use]
  - tutor: "Questo cambia un po' le cose, è vero. Ma «voglio che i ritardi sono segnalati»: dopo «voglio che», quale modo?"
    prompt: {text: "voglio che d'ora in poi i ritardi sono segnalati", tags: [subjunctive-use]}
    goals: [perspective]
  - learner: "Voglio che siano segnalati subito, da chiunque, senza aspettare la riunione."
  - tutor: "Mi sembra giusto. Allora domani alle nove, tutti e tre: io porto le email, e spero che Marta porti delle scuse."
    goals: [solution]

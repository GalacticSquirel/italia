# Set w-c1, file 1: C1, work scenarios. Broad coverage: calques, concordance, periodo ipotetico,
# register slips, combined pronouns, future, false friends, plus correct near-misses left alone.
- scenario: colloquio-lavoro
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, grazie. Sono di Valencia e da due anni vivo a Torino. In Spagna ho insegnato disegno tecnico in un istituto superiore per quasi dieci anni."
  - tutor: "Disegno tecnico: allora il nostro mondo non le è del tutto nuovo. Com'è passata dall'insegnamento alla progettazione?"
    goals: [intro]
  - learner: "Appena arrivata a Torino ho fatto un master in design del prodotto, e alla fine ho realizzato uno stage in uno studio di arredamento, dove seguivo i prototipi."
    errors: [word-choice]
  - tutor: "Quindi ha fatto uno stage in uno studio di arredamento: un'ottima palestra. E quali sono, secondo lei, i suoi punti di forza? Mi dica anche un punto debole, se se la sente."
    recast: {text: "realizzato uno stage", fix: "fatto uno stage", tags: [word-choice]}
    goals: [experience]
  - learner: "Credo di essere paziente e precisa: con trenta ragazzi in classe ho dovuto esserlo per forza. Il mio difetto è che a volte mi perdo in dettagli che nessuno nota."
  - tutor: "Pazienza e precisione, qui servono tutte e due. Ai dettagli ci penseranno le scadenze a darle una misura! Perché ha scelto proprio la nostra azienda?"
    goals: [strengths]
  - learner: "Ho visto la vostra lampada da tavolo alla fiera di Milano, e mi ha colpito che è stata progettata interamente con materiali riciclati."
    errors: [subjunctive-use]
  - tutor: "Ci fa piacere, è il nostro progetto più amato. Però riascolti la frase: «mi ha colpito che è stata progettata». Dopo un'espressione di sorpresa come questa, che modo ci vuole?"
    prompt: {text: "mi ha colpito che è stata progettata", tags: [subjunctive-use]}
  - learner: "Giusto: mi ha colpito che sia stata progettata con materiali riciclati. Vorrei lavorare in un posto che prenda sul serio l'ambiente."
  - tutor: "Esatto, ora è impeccabile. E sull'ambiente siamo testardi quanto lei. Ha qualche domanda da farmi?"
    goals: [why]
  - learner: "Sì, una curiosità: come è organizzato il lavoro tra designer e ingegneri? Se mi permetti, vorrei capire anche quanto dura il periodo di prova."
    errors: [register]
  - tutor: "Domande giustissime. Solo una cosa: siamo a un colloquio e fin qui mi ha dato del lei, ma nell'ultima frase qualcosa è scivolato. Se ne accorge?"
    prompt: {text: "Se mi permetti", tags: [register]}
  - learner: "Ah, mi scusi! Se mi permette, vorrei sapere quanto dura il periodo di prova."
  - tutor: "Nessun problema, capita. Lavoriamo per progetti, con un designer e un ingegnere in ogni squadra, e il periodo di prova è di tre mesi. Le faremo sapere entro dieci giorni."
    goals: [questions]

- scenario: colloquio-promozione
  level: C1
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Sono quasi tre anni che seguo da solo i clienti canadesi, e credo che i numeri parlino chiaro."
  - tutor: "Li conosco, i numeri: con il Canada il fatturato è raddoppiato. Dove vuole arrivare?"
    goals: [results]
  - learner: "Vorrei un ruolo di responsabile per il Nord America. In pratica è un lavoro che faccio già, solo che sulla carta non risulta da nessuna parte."
  - tutor: "La richiesta è legittima, glielo riconosco. Però le dico subito come stanno le cose: il budget di quest'anno è già stato approvato, e nuovi ruoli non ne prevede."
    goals: [request]
  - learner: "Lo immaginavo. Però se la direzione avrebbe comunicato le scadenze a gennaio, io avrei preparato la richiesta in tempo per il budget."
    errors: [hypothetical]
  - tutor: "Il rimprovero ci sta, lo ammetto. Ma riascolti la prima metà: «se la direzione avrebbe comunicato». Dopo quel «se», il condizionale funziona?"
    prompt: {text: "se la direzione avrebbe comunicato", tags: [hypothetical]}
  - learner: "Mi correggo: se la direzione... avrebbe comunicato prima? No, aspetti, non mi viene."
    errors: [hypothetical]
  - tutor: "Ha ragione lei: se la direzione avesse comunicato le scadenze per tempo, ne avremmo parlato a gennaio. Allora, visto che il budget è chiuso, che cosa propone?"
    recast: {text: "se la direzione... avrebbe comunicato", fix: "se la direzione avesse comunicato", tags: [hypothetical]}
  - learner: "Proporrei di partire subito con il titolo e le responsabilità, e di rivedere lo stipendio a luglio, quando si rifà il budget."
  - tutor: "Mi sembra una soluzione sensata: il titolo non pesa sui conti, e a luglio avremo i dati del semestre. Come vogliamo metterla per iscritto?"
    goals: [handle]
  - learner: "Se per lei va bene, mi manda una mail con il nuovo titolo entro fine mese, e fissiamo già adesso l'incontro di luglio. Preferirei che fosse tutto nero su bianco."
  - tutor: "D'accordo, nero su bianco: la mail le arriva entro il trenta, e segno in agenda l'otto luglio. Grazie per la franchezza."
    goals: [next-steps]

- scenario: riunione-lavoro
  level: C1
  persona: en-f-student
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Non male. L'app per le prenotazioni è quasi finita: manca il pagamento online, che testeremo la settimana prossima."
  - tutor: "Ottimo. E i test con gli utenti? Mi avevi detto che ci sarebbero stati dei problemi con gli anziani."
    goals: [update]
  - learner: "Sì, purtroppo. Molti non riescono a leggere i pulsanti, sono troppo piccoli. E il cliente vuole vedere la versione finale venerdì, quindi siamo un po' in ritardo."
  - tutor: "Capisco, venerdì è vicino. Hai già pensato a come uscirne?"
    goals: [problem]
  - learner: "Pensavo di ingrandire i pulsanti e aggiungere un'opzione con il testo grande. Il grafico dice che lo farà in due giorni, poi io ricontrollerò tutto e lo manderò al cliente. Eventualmente il cliente accetterà, perché è una richiesta ragionevole."
    errors: [false-friend]
  - tutor: "Alla fine il cliente accetterà, ne sono quasi certa: è una modifica che va tutta a suo vantaggio. Due giorni per la grafica mi sembrano pochi, però. Ce la fate davvero?"
    recast: {text: "Eventualmente", fix: "Alla fine", tags: [false-friend]}
    goals: [proposal]
  - learner: "Se tutto va bene, sì. Ma per sicurezza potremmo chiedere al cliente di spostare la presentazione a martedì. Glielo può chiedere tu? Con lui hai più confidenza."
    errors: [combined-pronouns]
  - tutor: "Martedì potrebbe andare. Ma rileggi la domanda: «glielo può chiedere tu». Quel verbo va con «tu»?"
    prompt: {text: "Glielo può chiedere tu", tags: [combined-pronouns]}
  - learner: "Ah no, che sbaglio: glielo puoi chiedere tu?"
  - tutor: "Ecco, così torna. E va bene, glielo chiedo io stasera. Allora fissiamo così: grafica pronta giovedì e presentazione martedì alle dieci."
    goals: [deadline]

- scenario: presentazione-progetto
  level: C1
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie. Proponiamo di aprire una cucina centrale per le nostre quattro mense aziendali. Oggi ogni mensa compra e cucina per conto suo, e gli sprechi sono enormi."
  - tutor: "Una cucina centrale. Ma che cosa ci guadagniamo, in concreto?"
    goals: [pitch]
  - learner: "Secondo le nostre stime, gli acquisti verrebbero ridotti del venti per cento, e gli sprechi saranno dimezzati nel primo anno."
  - tutor: "Il venti per cento è una cifra importante. Su che base l'avete calcolata?"
  - learner: "Sulle fatture degli ultimi due anni. Abbiamo confrontato i prezzi dei fornitori locali con quelli dei grossisti: i prodotti sono stato comprati quasi sempre in piccole quantità, e quindi a prezzo pieno."
    errors: [passive]
  - tutor: "Il metodo mi convince. Mi fermo però su una forma: «i prodotti sono stato comprati». Il soggetto è plurale: l'ausiliare va d'accordo?"
    prompt: {text: "i prodotti sono stato comprati", tags: [passive]}
  - learner: "No, ha ragione: i prodotti sono stati comprati quasi sempre in piccole quantità."
  - tutor: "Esatto. Allora i benefici sono chiari. Ma il rischio? Se la cucina centrale si ferma, restano senza pranzo quattrocento persone."
    goals: [benefits]
  - learner: "È un rischio vero. Per questo prevediamo un accordo con un servizio di catering esterno: se ci fosse un guasto, lo chiameremmo con un giorno di preavviso."
  - tutor: "Un piano di riserva, bene. E l'investimento iniziale?"
    goals: [objection]
  - learner: "Sono centottantamila euro, che recupereremo in meno di tre anni. Potrei mandarle il piano dettagliato entro lunedì, così lo valuta con calma."
  - tutor: "Va bene: me lo mandi lunedì, e se i conti tornano lo porto in consiglio di amministrazione a fine mese."
    goals: [next-steps]

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-professional
  history: [relative-pronoun]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Si figuri, si sieda pure. Ho visto che eri a disagio. Mi racconti con calma cos'è successo, dal suo punto di vista."
    errors: [register]
  - tutor: "Grazie. Però, scusi, mi ha appena dato del tu e subito dopo del lei: mi confonde un po'."
    prompt: {text: "Ho visto che eri a disagio", tags: [register]}
  - learner: "Ha ragione, mi scusi. Ho visto che era a disagio. Mi racconti tutto."
  - tutor: "Ecco. Il fatto è che la presentazione per il cliente l'abbiamo preparata io e Stefano insieme, per due settimane. Ieri lui l'ha presentata come se fosse tutta farina del suo sacco."
  - learner: "Capisco, e capisco che sia frustrante. Quindi lei ha sentito che il suo lavoro non è stato riconosciuto davanti a tutti."
  - tutor: "Esatto, proprio così. E non è la prima volta."
    goals: [listen]
  - learner: "Per capire bene: la parte su cui avete lavorato insieme era l'analisi dei dati? E Stefano ha detto esplicitamente che l'aveva fatta lui, o semplicemente non l'ha citata?"
  - tutor: "Non ha detto di averla fatta lui, questo no. Però ha parlato sempre al singolare, «ho analizzato, ho scoperto». Il risultato è lo stesso."
    goals: [clarify]
  - learner: "Capisco. Provo a vederla anche dal suo lato: Stefano è nuovo nel ruolo, e la riunione di ieri era la prima di cui è stato responsabile. Forse era nervoso, e ha usato l'io senza pensarci."
  - tutor: "Può darsi, non ci avevo pensato. Ma questo non cambia il fatto che il cliente adesso pensa che il lavoro sia suo."
    goals: [perspective]
  - learner: "È giusto. Propongo una cosa: la prossima riunione con il cliente la presentate voi due insieme, e io scrivo una mail al cliente nella quale cito il contributo di tutti e due."
  - tutor: "Questo mi sembra corretto, grazie. Se la mail parte oggi, per me la questione è chiusa."
    goals: [solution]

- scenario: trattativa-fornitore
  level: C1
  persona: en-m-retired
  history: [comparative]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo proprio per quello. Un aumento del quindici per cento, da un mese all'altro, per noi è difficile da sostenere."
  - tutor: "La capisco, ma il cartone ci costa un terzo in più rispetto a un anno fa."
    goals: [problem]
  - learner: "Lo so bene. Però lavoriamo con voi da otto anni, abbiamo sempre pagato puntualmente e i nostri ordini sono più grandi che quelli della maggior parte dei vostri clienti."
    errors: [comparative]
  - tutor: "Su questo non discuto. Mi fermo però sul confronto, «più grandi che quelli»: con un termine di paragone così, quale parolina usiamo?"
    prompt: {text: "più grandi che quelli", tags: [comparative]}
  - learner: "Più grandi di quelli della maggior parte dei vostri clienti. Credo che otto anni di fiducia meritino un trattamento diverso."
  - tutor: "Perfetto. E l'argomento è solido, lo porterò al mio direttore. Cosa mi propone, concretamente?"
    goals: [argue]
  - learner: "Le propongo questo: accettiamo un aumento del sette per cento, e in cambio ci impegniamo a raddoppiare l'ordine annuale con un contratto di due anni."
  - tutor: "Il sette è poco, ma il contratto biennale cambia le cose. Potrei arrivare al nove, se le consegne si possono raggruppare una volta al mese."
    goals: [counteroffer]
  - learner: "Una consegna al mese ci va bene, abbiamo spazio in magazzino. Allora siamo d'accordo sul nove per cento con il contratto di due anni?"
  - tutor: "Siamo d'accordo. Le mando la proposta scritta entro domani, così la può far firmare al suo amministratore."
    goals: [agreement]

- scenario: smartworking
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Un po' e un po'. Da quando ci siamo trasferiti a Dublino mi lasciano lavorare da casa tre giorni su cinque, e gli altri due vado in ufficio."
  - tutor: "Tre su cinque, niente male. E come ti trovi?"
    goals: [situation]
  - learner: "Benissimo, sinceramente. Risparmio un'ora e mezza di treno al giorno e la mattina posso andare a correre. E poi a casa riesco a concentrarmi molto meglio che in ufficio."
  - tutor: "Ecco, a me succede il contrario: a casa mi distrae tutto, dal frigo al divano. Ma ci sarà pure qualche svantaggio, no?"
    goals: [pros]
  - learner: "Certo. Mi manca i colleghi, soprattutto le pause caffè e le chiacchiere in corridoio. E a volte non riesco a staccare: lavoro fino alle nove di sera senza accorgermene."
    errors: [subject-verb-agreement]
  - tutor: "Ti capisco benissimo. Aspetta però: «mi manca i colleghi». Chi è che manca, esattamente? Il verbo deve seguire quello."
    prompt: {text: "Mi manca i colleghi", tags: [subject-verb-agreement]}
  - learner: "Ah, certo, sono loro che mancano: mi mancano i colleghi."
  - tutor: "Esatto. E sullo staccare hai ragione, è il problema di tutti. Quindi, se potessi scegliere, che cosa faresti?"
    goals: [cons]
  - learner: "Se potessi scegliere, farei due giorni a casa e tre in ufficio: così vedrei di più i colleghi senza rinunciare alla corsa la mattina."
  - tutor: "Saggia scelta, il giusto mezzo. Io invece tornerei in ufficio a tempo pieno, ma solo per la macchinetta del caffè!"
    goals: [preference]

- scenario: riunione-lavoro
  level: C1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, direi. Ho finito l'analisi dei questionari: ne abbiamo ricevuti trecentoquaranta, molti di più di quelli che ci aspettavamo."
  - tutor: "Trecentoquaranta? Fantastico. E che cosa ne viene fuori?"
    goals: [update]
  - learner: "Che i clienti sono contenti del prodotto, ma non del servizio clienti. Il problema è che il rapporto finale dovevamo consegnarlo ieri, e non l'ho ancora finito."
  - tutor: "Ah. Il cliente lo sa già?"
    goals: [problem]
  - learner: "Ancora no. Ieri sera Laura ha provato a finire i grafici, ma non è riuscita, e io aspettavo i suoi. Potrei mandare oggi al cliente un riassunto di due pagine e il rapporto completo lunedì."
    errors: [ci-ne]
  - tutor: "Il riassunto è una buona idea. Ma torniamo un attimo su Laura: «ha provato, ma non è riuscita». Così la frase resta un po' monca: manca una parolina, quale?"
    prompt: {text: "non è riuscita", tags: [ci-ne]}
  - learner: "Sì, scusa: ha provato, ma purtroppo non è riuscita. Era troppo stanca."
    errors: [ci-ne]
  - tutor: "Be', se Laura non ci è riuscita dopo una giornata così, non è il caso di insistere. Allora il cliente chiamalo tu stamattina, prima che sia lui a cercarti."
    recast: {text: "non è riuscita", fix: "non ci è riuscita", tags: [ci-ne]}
    goals: [proposal]
  - learner: "Lo chiamo subito dopo la riunione. Il rapporto completo lo avrò pronto per lunedì a mezzogiorno, promesso."
  - tutor: "Lunedì a mezzogiorno, allora. E se hai bisogno di una mano con i grafici, chiedi pure a Marco."
    goals: [deadline]

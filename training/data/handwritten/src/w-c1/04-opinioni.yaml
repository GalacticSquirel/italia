# Set w-c1, file 4: C1, debates and opinions (environment, AI, automation, news).
# Relative «chi/che», «ci sono», English false friends (sensibile, attualmente, pretendere),
# conditional for the future in the past, «se» + conditional, «andarsene», «ce n'erano».
- scenario: dibattito-ambiente
  level: C1
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io la penso diversamente. Lavoro in un ristorante in centro, e credo che una zona pedonale porterebbe più clienti, non meno."
  - tutor: "Lei lavora in centro, quindi conosce la realtà da vicino. Ma su che cosa basa questa convinzione?"
    goals: [position]
  - learner: "Primo, chi passeggia si ferma di più a mangiare e a comprare. Secondo, a Pontevedra, in Spagna, hanno chiuso il centro vent'anni fa, e i negozi chi stavano per chiudere sono rinati."
    errors: [relative-pronoun]
  - tutor: "L'esempio spagnolo è interessante. Ma «i negozi chi stavano per chiudere»: qui il pronome è quello giusto? «Chi» ha un altro mestiere."
    prompt: {text: "i negozi chi stavano", tags: [relative-pronoun]}
  - learner: "I negozi che stavano per chiudere, sì. Oggi quel centro è pieno di vita."
  - tutor: "Esatto. Però i commercianti qui dicono che senza parcheggi i clienti delle frazioni non verranno più. Come risponde?"
    goals: [argue]
  - learner: "Possono lasciare la macchina al parcheggio della stazione, se il Comune mette una navetta gratuita ogni dieci minuti. Non è necessario che arrivano in macchina fino alla porta del negozio."
    errors: [subjunctive-use]
  - tutor: "La navetta è un'idea concreta. Mi permetta però: «non è necessario che arrivano». Dopo un'espressione di necessità, l'indicativo regge?"
    prompt: {text: "Non è necessario che arrivano", tags: [subjunctive-use]}
  - learner: "Allora: non è necessario che arriverebbero fino alla porta."
    errors: [subjunctive-use]
  - tutor: "D'accordo, non è necessario che arrivino fino alla porta, se la navetta funziona davvero. Ma ammetterà che per i negozianti i primi mesi sarebbero durissimi."
    recast: {text: "che arriverebbero", fix: "che arrivino", tags: [subjunctive-use]}
    goals: [counter]
  - learner: "Su questo ha ragione, all'inizio sarà difficile. Propongo un compromesso: chiudiamo il centro solo nei fine settimana per un anno, e poi decidiamo in base ai dati."
  - tutor: "Un anno di prova con i dati alla mano: così potrei votare a favore anch'io. Lo proponga al consiglio di quartiere, la sosterrò."
    goals: [concede]

- scenario: dibattito-ambiente
  level: C1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la preoccupazione, ma io sono favorevole alla chiusura, anche se graduale. Le città più vivibile d'Europa hanno quasi tutte un centro pedonale."
    errors: [adjective-agreement]
  - tutor: "Lo dicono in molti. Ma «le città più vivibile»: quell'aggettivo va d'accordo con «città»?"
    prompt: {text: "Le città più vivibile", tags: [adjective-agreement]}
  - learner: "No, è plurale: le città più vivibili. Penso a Lubiana o a Gand: lì i negozi non hanno chiuso, anzi."
  - tutor: "Esempi validi, ma sono città diverse dalla nostra. Che altri argomenti ha?"
    goals: [position]
  - learner: "L'inquinamento, prima di tutto: davanti alla scuola elementare sono livelli di polveri sottili altissimi. E poi il rumore."
    errors: [ce-ci-sono]
  - tutor: "Un dato pesante. Ma «davanti alla scuola sono livelli altissimi»: per dire che qualcosa si trova in un luogo, che cosa manca all'inizio?"
    prompt: {text: "sono livelli di polveri sottili altissimi", tags: [ce-ci-sono]}
  - learner: "Ci sono livelli altissimi, certo. E il rumore: abito su una strada dove passano trecento macchine all'ora."
  - tutor: "Esatto. Però mi dica: chi abita fuori e lavora in centro? Un infermiere che finisce il turno a mezzanotte non può aspettare l'autobus."
    goals: [argue]
  - learner: "Giusto, a questo non avevo pensato. Per i lavoratori notturni si potrebbero dare permessi speciali, come ai residenti: mi sembra una soluzione sensibile."
    errors: [false-friend]
  - tutor: "Sì, una soluzione sensata, già usata in altre città. Quindi lei non chiuderebbe tutto da un giorno all'altro?"
    recast: {text: "una soluzione sensibile", fix: "una soluzione sensata", tags: [false-friend]}
    goals: [counter]
  - learner: "No, le concedo che una chiusura immediata sarebbe troppo brusca. Partirei dalle due strade intorno alla scuola, e allargherei la zona ogni anno, se i dati sono buone."
    errors: [adjective-agreement]
  - tutor: "Partire dalla scuola mi piace. Ultima cosa: «se i dati sono buone»... d'accordo con chi?"
    prompt: {text: "i dati sono buone", tags: [adjective-agreement]}
  - learner: "Con i dati, quindi buoni: se i dati sono buoni, si allarga."
  - tutor: "Esatto. E su un compromesso così, glielo confesso, potrei firmare anch'io."
    goals: [concede]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Mah, io sarei meno pessimista. Attualmente la storia dice il contrario: qualche lavoro sparisce, ma altri nascono."
    errors: [false-friend]
  - tutor: "In realtà, dici tu... è la frase preferita di tutti gli ottimisti. Hai un esempio concreto?"
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    goals: [position]
  - learner: "Mio padre faceva il tipografo a Toronto. Quando sono arrivati i computer, tutti pensavano che la sua professione morirebbe, invece lui ha imparato la grafica."
    errors: [conditional-form]
  - tutor: "Bella storia. Ma «pensavano che la sua professione morirebbe»: per un futuro visto dal passato, che forma del condizionale ci vuole?"
    prompt: {text: "morirebbe", tags: [conditional-form]}
  - learner: "Pensavano che sarebbe morta, ecco. Invece si è reinventato e ha lavorato altri vent'anni."
  - tutor: "Esatto. Ma tuo padre aveva quarant'anni e voglia di imparare. Un camionista di cinquantacinque anni, quando arriveranno i camion senza autista, che fa?"
    goals: [evidence]
  - learner: "Lì hai ragione, non tutti riescono a ricominciare. Se lo stato non investerebbe nella formazione, molte persone resteranno indietro."
    errors: [hypothetical]
  - tutor: "Su questo ti do ragione. Ma l'ipotesi zoppica: «se lo stato non investerebbe». Dopo «se», che cosa ci metti? E di conseguenza, nell'altra metà?"
    prompt: {text: "Se lo stato non investerebbe", tags: [hypothetical]}
  - learner: "Se lo stato non investisse nella formazione, molte persone resterebbero indietro."
  - tutor: "Perfetto, così torna tutto. E qui siamo d'accordo: il problema non è la tecnologia, è chi resta senza paracadute."
    goals: [concede]
  - learner: "Allora diciamo che non è né un mostro né una bacchetta magica: dipende da come la usiamo e da chi ne paga il prezzo."
  - tutor: "Ci sto, brindo a questo. Ma intanto stasera i piatti li lavi tu, prima che lo faccia un robot!"
    goals: [conclude]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-form]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Non sono tanto d'accordo. È vero che alcuni lavori spariranno, ma ne nasceranno molti altri che oggi non possiamo neanche immaginare."
  - tutor: "Ne nasceranno, ne nasceranno... ma per chi? Per gli ingegneri, forse, non certo per mia zia, che lavora alla cassa di un supermercato."
    goals: [position]
  - learner: "Ti capisco. Però guarda il mio caso: studio traduzione, e tutti mi dicevano di cambiare strada. Invece ora le agenzie cercano persone che sapano correggere i testi tradotti dalle macchine."
    errors: [subjunctive-form]
  - tutor: "Questa non la sapevo. Ma «persone che sapano»: il congiuntivo di quel verbo è un po' irregolare. Ci riprovi?"
    prompt: {text: "persone che sapano", tags: [subjunctive-form]}
  - learner: "Che sappiano, giusto. Il lavoro è cambiato, ma non è sparito."
  - tutor: "Esatto. Va bene, un esempio te lo concedo. Ma tu sei giovane e studi: mia zia, a cinquantotto anni, chi la riqualifica?"
    goals: [evidence]
  - learner: "Hai ragione, questo è il punto debole del mio ragionamento. Se le aziende pagherebbero i corsi di formazione, forse anche tua zia avrebbe una possibilità."
    errors: [hypothetical]
  - tutor: "Brava a riconoscerlo. Però «se le aziende pagherebbero»... dopo quel «se», quale tempo ci va?"
    prompt: {text: "Se le aziende pagherebbero", tags: [hypothetical]}
  - learner: "Ehm... se le aziende pagavano i corsi, avrebbe una possibilità?"
    errors: [hypothetical]
  - tutor: "Magari! Se le aziende pagassero i corsi, mia zia ci andrebbe di corsa! Il problema è convincerle a farlo."
    recast: {text: "se le aziende pagavano", fix: "se le aziende pagassero", tags: [hypothetical]}
    goals: [concede]
  - learner: "Allora siamo d'accordo almeno su una cosa: la tecnologia da sola non basta, ci vogliono regole e soldi per la formazione."
  - tutor: "Su questo sì, ci stringiamo la mano. Ma tra dieci anni ne riparliamo, e vediamo chi aveva ragione!"
    goals: [conclude]

- scenario: politica-lavoro
  level: C1
  persona: en-m-retired
  history: [comparative]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che l'ho già sentito negli anni Ottanta, quando lavoravo in fabbrica a Cleveland. Dicevano lo stesso dei robot, e invece la fabbrica ha assunto più ingegneri che prima."
    errors: [comparative]
  - tutor: "Eh, ma i robot di allora erano giocattoli. Comunque, «più ingegneri che prima»: davanti a «prima», quale parolina regge il confronto?"
    prompt: {text: "più ingegneri che prima", tags: [comparative]}
  - learner: "Più ingegneri di prima, giusto. Gli operai però erano meno, questo lo ammetto."
  - tutor: "Ecco, appunto: meno operai. E se domani i camion si guidassero da soli, che cosa succederebbe ai camionisti?"
    goals: [opinion]
  - learner: "Se succedesse domani, sarebbe un dramma. Ma non succederà domani: ci vorranno vent'anni, e nel frattempo molti andranno in pensione."
  - tutor: "D'accordo, il tempo aiuta. Ma mi fai un esempio concreto di qualcuno che si è riconvertito davvero?"
    goals: [hypothesis]
  - learner: "Mio nipote. Faceva il cassiere, e quando hanno messo le casse automatiche ha preso un corso di logistica pagato dall'azienda. Adesso gestisce il magazzino ed è più contento di prima."
    errors: [word-choice]
  - tutor: "Quindi ha seguito un corso pagato dall'azienda: fortunato lui, non tutte sono così illuminate. E tu, tirando le somme?"
    recast: {text: "ha preso un corso", fix: "ha seguito un corso", tags: [word-choice]}
    goals: [example]
  - learner: "La tecnologia non è il nemico; il nemico è la mancanza di formazione. E tu, Riccardo, sinceramente, cosa è la tua previsione?"
    errors: [question-form]
  - tutor: "Ah, mi giri la domanda! Ma «cosa è la tua previsione» suona un po' inglese. Come chiederesti, in italiano, di scegliere tra le previsioni possibili?"
    prompt: {text: "cosa è la tua previsione", tags: [question-form]}
  - learner: "Hai ragione: qual è la tua previsione, Riccardo?"
  - tutor: "La mia? Tanti disoccupati, se non ci svegliamo. Ma diciamo che sono pessimista per carattere, e tu mi hai convinto almeno a metà."
    goals: [conclude]

- scenario: politica-lavoro
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Io dico di no. Non credo che le macchine possono sostituire un insegnante, un'infermiera o un cuoco: sono lavori dove la relazione umana conta troppo."
    errors: [subjunctive-use]
  - tutor: "Sei proprio un'ottimista. Ma «non credo che le macchine possono»... ascolta bene la frase: dopo «non credo che», che cosa ci vuole?"
    prompt: {text: "Non credo che le macchine possono", tags: [subjunctive-use]}
  - learner: "Non credo che possano sostituirlo. Un bambino ha bisogno di qualcuno che lo guardi negli occhi."
  - tutor: "Bello, ma un po' romantico. E se domani un'app spiegasse la matematica meglio di te, i genitori non la sceglierebbero?"
    goals: [opinion]
  - learner: "Se un'app spiegasse meglio di me, la userei anch'io in classe! Ma non capirebbe mai che un bambino è distratto perché i genitori la sera salgono sempre e lo lasciano solo."
    errors: [false-friend]
  - tutor: "Giusto: un'app non sa che i genitori la sera escono sempre e che il bambino resta solo. Colpito e affondato. Ma hai un esempio reale, o è solo teoria?"
    recast: {text: "la sera salgono sempre", fix: "la sera escono sempre", tags: [false-friend]}
    goals: [hypothesis]
  - learner: "Un esempio reale. Nella mia scuola, in Valencia, abbiamo provato un programma che corregge i compiti da solo, e gli alunni più deboli hanno peggiorato."
    errors: [preposition, auxiliary-choice]
  - tutor: "Esempio prezioso. Una cosa piccola, però: «in Valencia». Con il nome di una città, che preposizione usiamo?"
    prompt: {text: "in Valencia", tags: [preposition]}
  - learner: "A Valencia, giusto. E gli alunni più deboli sono peggiorati, perché nessuno parlava con loro dei loro errori."
  - tutor: "Esatto. E il dato è eloquente: senza il rapporto umano, chi è in difficoltà resta indietro. Allora, la tua conclusione?"
    goals: [example]
  - learner: "La tecnologia aiuta, ma non sostituisce. E tu, Riccardo, sei ancora convinto che metà dei lavori sparirà?"
  - tutor: "Un po' meno di prima, lo ammetto. Ma non dirlo al mio capo, che sta già comprando i robot!"
    goals: [conclude]

- scenario: notizie-attualita
  level: C1
  persona: en-f-student
  history: [object-pronoun]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, l'ho letta sul treno. In pratica il governo vuole limitare gli affitti brevi nei centri storici: chi ha più che due appartamenti dovrà diventare un'impresa."
    errors: [comparative]
  - tutor: "In breve è proprio quello. Però «più che due appartamenti»: davanti a un numero, nel confronto, quale piccola parola ci vuole?"
    prompt: {text: "più che due appartamenti", tags: [comparative]}
  - learner: "Più di due, scusa. Quindi dovrà aprire una partita IVA, come un albergo."
  - tutor: "Esatto, proprio così. E tu, sei favorevole?"
    goals: [summarise]
  - learner: "Più o meno. Ieri ne ho parlato con un'amica che affitta una stanza ai turisti, e la ho chiesto cosa ne pensasse: è furiosa."
    errors: [object-pronoun]
  - tutor: "Immagino, ci paga l'affitto con quei soldi. Però «la ho chiesto»: si chiede qualcosa A qualcuno... quale pronome serve allora?"
    prompt: {text: "la ho chiesto", tags: [object-pronoun]}
  - learner: "Le ho chiesto cosa ne pensasse, scusa. Dice che la legge colpisce i piccoli proprietari e lascia in pace le grandi società."
  - tutor: "Perfetto. È un'obiezione che ho letto anch'io, e non è sbagliata. E i giornali, come l'hanno raccontata?"
    goals: [opinion]
  - learner: "Dipende dalla testata. Uno titolava «Guerra alla proprietà privata», l'altro «Le città tornano ai residenti». E tutti e due pretendevano di essere neutrali!"
    errors: [false-friend]
  - tutor: "Già, fingevano di essere neutrali, ma bastava il titolo per capire da che parte stavano. Secondo te, alla fine, che cosa succederà?"
    recast: {text: "pretendevano di essere neutrali", fix: "fingevano di essere neutrali", tags: [false-friend]}
    goals: [sources]
  - learner: "Secondo me molti proprietari cercheranno di aggirare la legge, intestando gli appartamenti ai figli. Se il governo volesse davvero risolvere il problema, costruirebbe case popolari."
  - tutor: "Il trucco dei figli, ci scommetto che succederà. E sulle case popolari hai ragione da vendere. Dai, che il caffè si raffredda."
    goals: [consequences]

- scenario: notizie-attualita
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, ne parlavano tutti in cucina. Se ho capito bene, nei centri storici non si potranno aprire nuovi affitti brevi, e chi ne ha già uno deve registrarsi in Comune."
  - tutor: "Hai capito benissimo. E tu che ne pensi, da cuoco che vive a Bologna?"
    goals: [summarise]
  - learner: "Penso che sia giusta, ma arriva tardi. Quando cercavo casa ho visto trenta annunci, e a prezzi normali c'erano solo due."
    errors: [ci-ne]
  - tutor: "Trenta annunci, che incubo. Ma «c'erano solo due»... due che cosa? Qui serve una parolina che riprenda gli appartamenti."
    prompt: {text: "c'erano solo due", tags: [ci-ne]}
  - learner: "Ce n'erano solo due, e uno era senza finestre! Per questo dico che la legge va bene, ma servono anche case per chi lavora."
  - tutor: "Esatto. Senza finestre, roba da matti. Quindi favorevole, ma con riserva. I giornali però non erano tutti d'accordo, hai visto?"
    goals: [opinion]
  - learner: "Ho letto due articoli. Uno diceva che senza affitti brevi i ristoranti perderebbero clienti. L'altro diceva che i residenti si stanno andando dal centro."
    errors: [ci-ne]
  - tutor: "Due versioni opposte, tipico. Ma «i residenti si stanno andando»: in spagnolo funziona, in italiano no. Che verbo usiamo per «lasciare un posto per sempre»?"
    prompt: {text: "si stanno andando", tags: [ci-ne]}
  - learner: "Cioè... i residenti si vanno via dal centro."
    errors: [ci-ne]
  - tutor: "Sì, se ne vanno, e i negozi di quartiere chiudono uno dopo l'altro. E tu, che conseguenze ti aspetti?"
    recast: {text: "si vanno via", fix: "se ne vanno", tags: [ci-ne]}
    goals: [sources]
  - learner: "Secondo me fra cinque anni il centro sarà un museo: bello, ma senza vita. A meno che il Comune non costruisca case per chi ci lavora."
  - tutor: "Un museo senza vita: purtroppo hai ragione. Speriamo che in Comune ci pensino prima. Su, che tra cinque minuti si riparte!"
    goals: [consequences]

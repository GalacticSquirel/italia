- scenario: reclamo-comune
  # facts: la learner ha una piccola libreria al piano terra in una via del centro; da due mesi davanti alla vetrina c'è un cantiere fermo per la nuova rete fognaria che blocca mezzo marciapiede; ha perso il quaranta per cento dei clienti; dal sistema risulta che la ditta ha avuto problemi; richiesta di risarcimento al Comune con il modulo apposito, entro sessanta giorni dalla segnalazione; protocollo 5582; risposta scritta dell'ufficio tecnico entro quindici giorni; richiesta di liberare metà marciapiede
  level: C2
  persona: es-f-erasmus
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    # decoy: «libreria» is used correctly, as a bookshop
    - learner: "Buongiorno. Ho una piccola libreria al piano terra, in una via del centro, e da due mesi davanti alla vetrina c'è un cantiere fermo che blocca mezzo marciapiede."
    - tutor: "Mi dispiace. Sa per caso di che lavori si tratta?"
    - learner: "Della nuova rete fognaria, secondo il cartello. È un cantiere di chi nessuno sembra occuparsi: nessun operaio, nessuna data, solo transenne."
      errors: [relative-pronoun]
      gold: {text: "un cantiere di chi", fix: "un cantiere di cui"}
    - tutor: "Verifico subito. Ma «un cantiere di chi nessuno sembra occuparsi»: ci si occupa di una cosa, e il cantiere è una cosa. Quale relativo si usa dopo «di»?"
      goals: [describe]
      prompt: {text: "un cantiere di chi", tags: [relative-pronoun]}
    - learner: "Un cantiere di che nessuno sembra occuparsi, mi scusi."
      errors: [relative-pronoun]
    - tutor: "Un cantiere di cui nessuno sembra occuparsi, e ora lo vedo anche qui. Dal sistema risulta che la ditta ha avuto dei problemi, e che i lavori ripartiranno appena possibile."
      recast: {text: "di che", fix: "di cui", tags: [relative-pronoun]}
    # decoy: «a cui spetta decidere» is correct
    - learner: "«Appena possibile» non è una risposta: intanto ho perso il quaranta per cento dei clienti. Vorrei sapere il nome dell'ufficio a cui spetta decidere, e la data entro il quale il cantiere sarà riaperto."
      errors: [relative-pronoun]
      gold: {text: "entro il quale", fix: "entro la quale"}
    # agree: content
    - tutor: "Ha ragione a pretendere una data precisa. Ma «la data entro il quale»: il relativo si riferisce a «data». Come deve concordare?"
      goals: [insist]
      prompt: {text: "entro il quale", tags: [relative-pronoun]}
    - learner: "Entro la quale, certo. E poi vorrei sapere se, per i danni alla mia attività, ho diritto a un risarcimento."
    - tutor: "Può presentare una richiesta di risarcimento al Comune, con il modulo apposito, entro sessanta giorni dalla segnalazione."
      goals: [rights]
    - learner: "Il cantiere è lì da più che due mesi, ma la mia prima segnalazione è di tre settimane fa. Sono ancora in tempo?"
      errors: [comparative]
      gold: {text: "più che due mesi", fix: "più di due mesi"}
    - tutor: "Sì, il termine parte dalla segnalazione, quindi è ancora in tempo. Ma «da più che due mesi»: davanti a un numero, quale preposizione ci vuole?"
      prompt: {text: "più che due mesi", tags: [comparative]}
    - learner: "Da più di due mesi, sì. Allora presento subito il reclamo e la richiesta di risarcimento. Mi dà un numero di protocollo?"
    - tutor: "Ecco: protocollo 5582. L'ufficio tecnico le risponderà per iscritto entro quindici giorni, e intanto chiedo che liberino almeno metà marciapiede."
      goals: [commitment]

- scenario: turismo-di-massa
  # facts: il learner è irlandese, guida turistica a Firenze da otto anni; a favore del ticket solo per i gruppi organizzati; l'estate scorsa in piazza della Signoria ha contato sei gruppi da quaranta persone fermi nello stesso punto; i clienti con cui lavora meglio sono famiglie e coppie; proposta: ticket per i gruppi organizzati, prenotazione obbligatoria delle visite guidate, limite di venticinque persone per gruppo
  level: C2
  persona: en-m-traveller
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    # decoy: headless «chi viaggia» is correct
    - learner: "Buongiorno. Sono irlandese e faccio la guida turistica a Firenze da otto anni. Sono a favore del ticket, ma solo per i gruppi organizzati, non per chi viaggia da solo."
    - tutor: "Una guida a favore del ticket: questa non me l'aspettavo! Perché solo i gruppi?"
      goals: [introduce]
    - learner: "Perché sono i gruppi a intasare la città. Un gruppo di crocieristi occupa una piazza più che dieci famiglie in vacanza, e spende molto meno."
      errors: [comparative]
      gold: {text: "più che dieci famiglie", fix: "più di dieci famiglie"}
    - tutor: "Un'immagine efficace. Ma «più che dieci famiglie in vacanza»: lei confronta un gruppo con dieci famiglie. Quale preposizione introduce il secondo termine?"
      prompt: {text: "più che dieci famiglie", tags: [comparative]}
    # decoy: «la cui storia» is correct
    - learner: "Più di dieci famiglie, appunto. L'estate scorsa, in piazza della Signoria, ho contato sei gruppi da quaranta persone, tutti fermi davanti alla stessa statua, la cui storia non ascoltava nessuno."
    - tutor: "Così è corretto. Ma mi lasci fare l'avvocato del diavolo: lei vive proprio di quei gruppi. Non sta tagliando il ramo su cui è seduto?"
      goals: [example]
    # decoy: «di cui nessuna guida va fiera» is correct
    - learner: "Al contrario. I clienti con chi lavoro meglio sono le famiglie e le coppie, che fanno domande e tornano; i gruppi da quaranta sono un lavoro di cui nessuna guida va fiera."
      errors: [relative-pronoun]
      gold: {text: "I clienti con chi", fix: "I clienti con cui"}
    - tutor: "Un argomento che non mi aspettavo. Ma «i clienti con chi lavoro meglio»: dopo un nome come «clienti», con «con», quale relativo ci vuole?"
      goals: [rebut]
      prompt: {text: "I clienti con chi", tags: [relative-pronoun]}
    - learner: "I clienti con quali lavoro meglio, volevo dire."
      errors: [relative-pronoun]
    - tutor: "I clienti con i quali lavora meglio sono le famiglie: ne prendo nota. E dunque, la sua proposta?"
      recast: {text: "con quali", fix: "con i quali", tags: [relative-pronoun]}
    - learner: "Un ticket per i gruppi organizzati, la prenotazione obbligatoria delle visite guidate e un limite di venticinque persone per gruppo: misure a chi le agenzie si adatterebbero in pochi mesi."
      errors: [relative-pronoun]
      gold: {text: "misure a chi", fix: "misure a cui"}
    # agree: content
    - tutor: "Tre misure concrete, e l'ultima mi sembra la più sensata. Ma «misure a chi le agenzie si adatterebbero»: ci si adatta a delle cose. Quale relativo si usa dopo «a»?"
      goals: [proposal]
      prompt: {text: "misure a chi", tags: [relative-pronoun]}
    # decoy: «più facile da gestire di uno grande» is correct
    - learner: "Misure a cui le agenzie si adatterebbero in pochi mesi, perché conviene anche a loro: un gruppo piccolo è più facile da gestire di uno grande."
    - tutor: "Ci ha dato molto da pensare. Grazie della telefonata, e buon lavoro in piazza!"

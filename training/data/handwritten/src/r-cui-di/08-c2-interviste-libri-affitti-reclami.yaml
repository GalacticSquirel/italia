# Set r-cui-di, file 8 (C2): a podcast with a retired American in Umbria, a book club, a sous-chef
# asking for a promotion, a penthouse negotiation, a researcher on the radio, a business dinner gone
# wrong, a complaint at the town hall and a guide on overtourism. Relatives: «di chi» for «di cui»,
# «a cui non conoscevamo il nome» for «di cui», «per i quali» with «carte», «con chi» after a
# noun, «a chi» after «moglie», «la terrazza, che si vedono», «il quale costo», «di cui i libri»,
# «una sala d'attesa, che», «entro il quale» with «data», «misure a chi». Comparatives with «che»
# before numbers, pronouns and persons. Correct «uno dei quali», «la cui storia», «dalla quale»,
# «a cui spetta», «più di quanto», «più un vuoto che un segreto» and «più ironia che rabbia» stay.
- scenario: intervista-podcast
  # facts: il learner è un ingegnere americano in pensione; quindici anni fa, in vacanza con la moglie, ha scoperto un paese umbro mai sentito; cinque anni fa, dopo la pensione, hanno comprato un vecchio casale lì; il primo inverno un contadino sconosciuto ha lasciato cinque litri d'olio davanti alla porta; critica: i trasporti, l'autobus per Perugia passa meno di tre volte al giorno e la domenica no; consiglio: imparare l'italiano prima di firmare; una vicina, moglie del contadino dell'olio, gli traduceva le carte del casale
  level: C2
  persona: en-m-retired
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    # decoy: «ce ne siamo innamorati» is correct
    - learner: "Per colpa di un viaggio. Quindici anni fa, in vacanza con mia moglie, siamo capitati in un paese umbro di chi non avevamo mai sentito parlare, e ce ne siamo innamorati subito."
      errors: [relative-pronoun]
      gold: {text: "un paese umbro di chi", fix: "un paese umbro di cui"}
    - tutor: "Il classico colpo di fulmine per un borgo. Ma «un paese umbro di chi non avevamo mai sentito parlare»: si sente parlare di qualcosa, e qui è un paese. Quale relativo si usa dopo «di»?"
      prompt: {text: "un paese umbro di chi", tags: [relative-pronoun]}
    - learner: "Un paese di cui non avevamo mai sentito parlare. Quando sono andato in pensione, cinque anni fa, abbiamo comprato un vecchio casale proprio lì."
    - tutor: "Ecco, così. Un casale in Umbria: il sogno di mezza America. E che cosa ti ha sorpreso di più, una volta arrivati?"
      goals: [story]
    - learner: "I vicini. Il primo inverno un contadino a cui non conoscevamo nemmeno il nome ci ha lasciato davanti alla porta cinque litri d'olio, senza neanche un biglietto."
      errors: [relative-pronoun]
      gold: {text: "a cui non conoscevamo", fix: "di cui non conoscevamo"}
    # agree: content
    - tutor: "L'olio davanti alla porta è l'accoglienza più umbra che ci sia. Ma «un contadino a cui non conoscevamo nemmeno il nome»: il nome è del contadino. Quale preposizione serve davanti a «cui»?"
      goals: [culture-shock]
      prompt: {text: "a cui non conoscevamo", tags: [relative-pronoun]}
    - learner: "Un contadino al quale non conoscevamo il nome, volevo dire."
      errors: [relative-pronoun]
    - tutor: "Un contadino del quale non conoscevate nemmeno il nome, e che vi ha regalato cinque litri d'olio: in America sarebbe mai successo?"
      recast: {text: "al quale", fix: "del quale", tags: [relative-pronoun]}
    # decoy: «più una questione di servizi che di persone», two phrases, rightly takes «che»
    - learner: "Mai, da noi un regalo così ti mette quasi in sospetto. Però non è tutto un idillio: c'è una cosa che critico, ed è più una questione di servizi che di persone."
    - tutor: "Critica pure, qui si dice tutto. Di che servizi parli?"
    - learner: "Dei trasporti. Senza macchina, in campagna, sei perduto: l'autobus per Perugia passa meno che tre volte al giorno, e la domenica non passa proprio."
      errors: [comparative]
      gold: {text: "meno che tre volte", fix: "meno di tre volte"}
    # agree: content
    - tutor: "Hai ragione, in campagna senza macchina è dura. Però «meno che tre volte al giorno»: davanti a un numero, quale preposizione ci vuole?"
      goals: [critique]
      prompt: {text: "meno che tre volte", tags: [comparative]}
    - learner: "Meno di tre volte al giorno. E quando, fra qualche anno, non potrò più guidare, sarà un problema serio."
    - tutor: "Così va bene. Un problema vero, sì. Che consiglio daresti a chi sogna un casale come il tuo?"
    - learner: "Di imparare l'italiano prima di firmare qualsiasi cosa: le carte per i quali ho perso più tempo erano quelle del casale, e senza una vicina che mi traduceva tutto non ce l'avrei mai fatta."
      errors: [relative-pronoun]
      gold: {text: "le carte per i quali", fix: "le carte per le quali"}
    - tutor: "Consiglio prezioso, e la vicina merita una medaglia. Ma «le carte per i quali ho perso più tempo»: il relativo si riferisce a «carte». Come deve concordare?"
      goals: [advice]
      prompt: {text: "le carte per i quali", tags: [relative-pronoun]}
    - learner: "Per le quali, ovviamente. E ora che ci penso, quella vicina è proprio la moglie del contadino dell'olio!"
    - tutor: "Allora la storia si chiude alla perfezione. Grazie di essere stato qui, e salutami i tuoi vicini!"

- scenario: club-lettura
  # facts: il tutor ha letto il romanzo in tre sere; la narratrice è la nipote, all'inizio sembra fredda; il nonno Ettore torna dalla guerra senza più parlare, nessuno sa perché; torna a lavorare la terra; la moglie soffre il suo silenzio; stile asciutto, frasi brevi, tutto al presente; consigliato a chi ha avuto nonni in guerra; il fratello della learner legge solo thriller; il prossimo libro lo sceglie la learner
  level: C2
  persona: en-f-student
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    # decoy: «più di quanto mi aspettassi» is correct
    - learner: "Ce l'ho fatta, e mi è piaciuto molto più di quanto mi aspettassi. All'inizio la narratrice, la nipote, mi sembrava fredda; poi ho capito che era una scelta."
    - tutor: "Sono contento! Fredda in che senso?"
      goals: [impression]
    # decoy: «di cui conosce tutto» and the subjunctive «sia tornato» are correct
    - learner: "Racconta una famiglia di cui conosce tutto tranne la cosa più importante: perché il nonno, Ettore, sia tornato dalla guerra senza più parlare. Il personaggio con chi ho fatto più fatica è proprio lui."
      errors: [relative-pronoun]
      gold: {text: "Il personaggio con chi", fix: "Il personaggio con cui"}
    - tutor: "Ettore è il personaggio più difficile, hai ragione. Ma «il personaggio con chi ho fatto più fatica»: «chi» non va dopo un nome come «personaggio». Con «con», quale relativo serve?"
      prompt: {text: "Il personaggio con chi", tags: [relative-pronoun]}
    - learner: "Il personaggio con la quale ho fatto più fatica, volevo dire."
      errors: [relative-pronoun]
    - tutor: "Ettore, il personaggio con il quale hai fatto più fatica, è anche quello che il libro non giudica mai. Perché tace, secondo te?"
      recast: {text: "con la quale", fix: "con il quale", tags: [relative-pronoun]}
    # decoy: «più un vuoto che un segreto», two nouns, rightly takes «che»
    - learner: "Secondo me tace perché ha fatto qualcosa che non sa perdonarsi, e il romanzo non ce lo dice mai: è più un vuoto che un segreto."
    - tutor: "Un vuoto più che un segreto: bellissimo. E la sua scelta di tornare a lavorare la terra come se niente fosse?"
      goals: [character]
    # decoy: «per il quale» and «in cui» are correct
    - learner: "È la scelta di un uomo per il quale le parole sono diventate inutili: il lavoro è l'unico linguaggio in cui sa ancora dire qualcosa alla moglie, a chi però non basta."
      errors: [relative-pronoun]
      gold: {text: "alla moglie, a chi", fix: "alla moglie, a cui"}
    # agree: content
    - tutor: "Sulla moglie hai colto il punto, è lei la vera vittima di quel silenzio. Ma «alla moglie, a chi però non basta»: dopo un nome come «moglie», quale relativo ci vuole dopo «a»?"
      prompt: {text: "alla moglie, a chi", tags: [relative-pronoun]}
    # decoy: «più asciutto di quello» is correct
    - learner: "Alla moglie, a cui però non basta. E lo stile? Io l'ho trovato più asciutto di quello di tanti romanzi contemporanei, ma mai freddo."
    - tutor: "Asciutto ma mai freddo, sì: frasi brevi, tutto al presente. A chi lo consiglieresti, e a chi no?"
      goals: [style]
    - learner: "Lo consiglierei a chi ha avuto dei nonni in guerra, e lo sconsiglierei a mio fratello, che legge solo thriller ed è molto più impaziente che me."
      errors: [comparative]
      gold: {text: "più impaziente che me", fix: "più impaziente di me"}
    - tutor: "Allora a tuo fratello regaliamo un thriller. Ma «molto più impaziente che me»: «me» è un pronome. Quale preposizione gli va davanti?"
      goals: [recommend]
      prompt: {text: "più impaziente che me", tags: [comparative]}
    - learner: "Più impaziente di me, appunto. Comunque grazie per averlo proposto: è il libro più bello che abbiamo letto quest'anno."
    - tutor: "Detto da te, che all'inizio trovavi fredda la narratrice, è un gran complimento. Il prossimo lo scegli tu."

- scenario: colloquio-promozione
  # facts: il learner è sous-chef da quattro anni; menù di pranzo nuovo: coperti +25%, costo delle materie prime dal 34% al 29%; chiede di guidare la cucina del nuovo locale del gruppo che apre in primavera; obiezione: non ha mai gestito una brigata intera; ha formato tre giovani cuochi, uno dei quali ora capo partita; affiancamento di tre mesi con lo chef esecutivo da gennaio, decisione a fine febbraio, prima dell'apertura
  level: C2
  persona: es-m-worker
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Vorrei parlarle dei risultati della cucina quest'anno, e di una proposta che mi sta molto a cuore."
    - tutor: "Mi dica. I numeri li conosco, ma voglio sentirli da lei."
    # decoy: «per il quale» is correct
    - learner: "Con il nuovo menù di pranzo i coperti sono cresciuti del venticinque per cento, e il costo delle materie prime è sceso dal trentaquattro al ventinove: un risultato per il quale abbiamo lavorato tutti, ma di chi mi sento in parte responsabile."
      errors: [relative-pronoun]
      gold: {text: "di chi mi sento", fix: "di cui mi sento"}
    # agree: content
    - tutor: "Il ventinove per cento è un ottimo risultato, e il merito è anche suo, lo so. Ma «un risultato... di chi mi sento in parte responsabile»: ci si sente responsabili di una cosa, e qui è il risultato. Quale relativo serve?"
      goals: [results]
      prompt: {text: "di chi mi sento", tags: [relative-pronoun]}
    - learner: "Di cui mi sento in parte responsabile. La proposta è questa: vorrei guidare la cucina del nuovo locale che aprite in primavera."
    - tutor: "Sì, così. Una proposta ambiziosa. Il problema è che lei non ha mai gestito una brigata intera."
      goals: [request]
    # decoy: «uno dei quali» and «come se fossi» are correct
    - learner: "È vero, ma ho formato tre giovani cuochi, uno dei quali oggi è capo partita, e la brigata con chi lavoro mi segue già come se fossi io il responsabile."
      errors: [relative-pronoun]
      gold: {text: "la brigata con chi", fix: "la brigata con cui"}
    - tutor: "Che i ragazzi la seguano l'ho notato anch'io. Ma «la brigata con chi lavoro»: la brigata è un gruppo, non una persona, e ha un nome davanti. Dopo «con», quale relativo ci vuole?"
      prompt: {text: "la brigata con chi", tags: [relative-pronoun]}
    - learner: "La brigata con la cui lavoro, volevo dire."
      errors: [relative-pronoun]
    - tutor: "La brigata con cui lavora la rispetta, questo è un fatto. Le propongo allora tre mesi di affiancamento con lo chef esecutivo, prima di decidere."
      goals: [handle]
      recast: {text: "con la cui", fix: "con cui", tags: [relative-pronoun]}
    - learner: "Tre mesi mi sembrano giusti, anche se lo chef esecutivo è molto più esigente che lei, e non so se ne uscirò vivo!"
      errors: [comparative]
      gold: {text: "molto più esigente che lei", fix: "molto più esigente di lei"}
    - tutor: "Esigente lo è, ma giusto. E comunque «molto più esigente che lei»: lei confronta lo chef con me, cioè con un pronome. Quale preposizione introduce il secondo termine?"
      prompt: {text: "molto più esigente che lei", tags: [comparative]}
    - learner: "Più esigente di lei, certo. Allora cominciamo a gennaio? E la decisione quando arriverebbe?"
    - tutor: "Affiancamento da gennaio, e decisione a fine febbraio, prima dell'apertura. Le va bene?"
    # decoy: the subjunctive «debba» and «pentirsene» are correct
    - learner: "Mi va benissimo. Grazie per la fiducia: farò in modo che non debba pentirsene."
    - tutor: "Ne sono sicuro. Ci rivediamo a fine febbraio, con i suoi piatti e i commenti dello chef."
      goals: [next-steps]

- scenario: trattativa-affitto
  # facts: attico in centro con terrazza da cui si vedono i tetti; canone 1600 euro, spese 250 al mese, totale oltre 1800; offerta del learner 1450 spese comprese, poi 1500; il proprietario arriva a 1550 spese comprese; garanzia: fideiussione bancaria a carico del learner al posto del deposito; contratto tre più due a canone concordato, disdetta tre mesi; il learner viaggia per lavoro; bozza del contratto entro venerdì
  level: C2
  persona: en-m-heritage
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Mi è piaciuto moltissimo, soprattutto la terrazza, che si vedono i tetti di tutto il centro. Però le spese condominiali, duecentocinquanta euro al mese, mi hanno un po' spaventato."
      errors: [relative-pronoun]
      gold: {text: "la terrazza, che si vedono", fix: "la terrazza, da cui si vedono"}
    - tutor: "La terrazza è il pezzo forte, lo so. Ma «la terrazza, che si vedono i tetti»: i tetti si vedono a partire dalla terrazza. Quale preposizione serve davanti al relativo?"
      goals: [interest]
      prompt: {text: "la terrazza, che si vedono", tags: [relative-pronoun]}
    - learner: "La terrazza, da cui si vedono i tetti di tutto il centro. Ma con le spese il totale supera i milleottocento euro, e per me è troppo."
    - tutor: "Così è corretto. Lei che cifra avrebbe in mente?"
    # decoy: «più di quanto pagano» is correct
    - learner: "Millequattrocentocinquanta, spese comprese. So che è meno che quello che chiedete, ma è più di quanto pagano molti miei amici per case simili."
      errors: [comparative]
      gold: {text: "meno che quello", fix: "meno di quello"}
    - tutor: "Millequattrocentocinquanta è molto lontano. Però «meno che quello che chiedete»: «quello» è un pronome. Quale preposizione gli va davanti?"
      prompt: {text: "meno che quello", tags: [comparative]}
    - learner: "Meno di quello che chiedete, lo so. Facciamo millecinquecento, spese comprese?"
    - tutor: "Il proprietario è arrivato a millecinquecentocinquanta, spese comprese. Più giù non va."
      goals: [negotiate]
    # decoy: «sulla quale» is correct
    - learner: "Millecinquecentocinquanta può andare, a una condizione sulla quale non posso cedere: niente deposito, ma una fideiussione bancaria, il quale costo è a mio carico."
      errors: [relative-pronoun]
      gold: {text: "il quale costo", fix: "il cui costo"}
    # agree: content
    - tutor: "La fideiussione è un'ottima garanzia, al proprietario andrà bene. Ma «una fideiussione bancaria, il quale costo è a mio carico»: il costo è della fideiussione. Quale relativo esprime il possesso?"
      prompt: {text: "il quale costo", tags: [relative-pronoun]}
    - learner: "Una fideiussione, la cui costo è a mio carico."
      errors: [relative-pronoun]
    - tutor: "Una fideiussione il cui costo è a suo carico, quindi. E per la durata, pensava a un contratto concordato?"
      recast: {text: "la cui costo", fix: "il cui costo", tags: [relative-pronoun]}
    # decoy: «meglio flessibile che lungo», two adjectives, rightly takes «che»
    - learner: "Sì: un tre più due a canone concordato, con tre mesi di disdetta. Viaggio molto per lavoro, e per me un contratto è meglio flessibile che lungo."
    - tutor: "Tre più due concordato, con tre mesi di disdetta: si può fare."
      goals: [conditions]
    - learner: "Allora siamo d'accordo. Mi mandi la bozza entro venerdì, così la faccio leggere al mio avvocato."
    - tutor: "Entro venerdì avrà la bozza. Benvenuto nel suo nuovo attico, o quasi."
      goals: [conclude]

- scenario: vita-in-italia
  # facts: la learner è inglese, a Bologna da dodici anni; venuta per un dottorato in storia medievale, per un professore di cui aveva letto i libri a Leeds, andato in pensione tre mesi dopo; la sua assistente l'ha aiutata molto; difficoltà: anni di attesa per i concorsi universitari; cambiamento: discutere a voce alta senza offendersi; consigli: pazienza e ironia, un bar di fiducia; il barista conosce la sua vita meglio di sua madre
  level: C2
  persona: en-f-student
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da dodici anni. Che cosa l'ha portata qui?"
    - learner: "Un dottorato in storia medievale. Avevo scelto Bologna per un professore di cui i libri avevo letto a Leeds, e che è andato in pensione tre mesi dopo il mio arrivo."
      errors: [relative-pronoun]
      gold: {text: "di cui i libri", fix: "i cui libri"}
    - tutor: "Un inizio quasi comico. Ma riprenda «un professore di cui i libri avevo letto»: i libri sono del professore. Quale relativo, senza preposizione, esprime il possesso?"
      prompt: {text: "di cui i libri", tags: [relative-pronoun]}
    # decoy: «dalla quale» is correct
    - learner: "Un professore i cui libri avevo letto a Leeds. Per fortuna la sua assistente, dalla quale ho imparato moltissimo, mi ha praticamente adottata."
    - tutor: "Così è corretto. Le assistenti salvano le carriere, è risaputo. E la difficoltà più grande?"
      goals: [story]
    - learner: "I concorsi universitari. Ho passato anni in una specie di sala d'attesa, che nessuno sapeva dirmi quando sarebbe uscito il bando successivo."
      errors: [relative-pronoun]
      gold: {text: "sala d'attesa, che", fix: "sala d'attesa, in cui"}
    # agree: content
    - tutor: "La sala d'attesa dei concorsi la conoscono in tanti, purtroppo. Ma «una sala d'attesa, che nessuno sapeva dirmi»: qui «che» non è né soggetto né oggetto, perché lei stava dentro quella sala. Che cosa serve?"
      goals: [difficulties]
      prompt: {text: "sala d'attesa, che", tags: [relative-pronoun]}
    - learner: "Una sala d'attesa nel quale nessuno sapeva dirmi niente."
      errors: [relative-pronoun]
    - tutor: "Una sala d'attesa nella quale nessuno sapeva dirle niente: un'immagine che molti ascoltatori riconosceranno. E lei, in questi anni, come è cambiata?"
      recast: {text: "nel quale", fix: "nella quale", tags: [relative-pronoun]}
    # decoy: «più spesso un segno d'affetto che d'aggressività» rightly takes «che»
    - learner: "Ho imparato a discutere a voce alta senza offendermi. In Inghilterra un tono così sarebbe una lite; qui è più spesso un segno d'affetto che d'aggressività."
    - tutor: "Questa è una lezione preziosa. Che consiglio darebbe a chi vuole trasferirsi?"
      goals: [change]
    # decoy: «più pazienza che in qualsiasi altro posto» and «più ironia che rabbia» rightly take «che»
    - learner: "Di non aspettarsi che l'Italia la capisca subito: ci vuole più pazienza che in qualsiasi altro posto, e più ironia che rabbia."
    - tutor: "Più ironia che rabbia: me lo segno. E un ultimo consiglio, più pratico?"
      goals: [advice]
    - learner: "Trovarsi un bar di fiducia. Il mio barista, dopo dodici anni di cappuccini, conosce la mia vita meglio che mia madre."
      errors: [comparative]
      gold: {text: "meglio che mia madre", fix: "meglio di mia madre"}
    - tutor: "Il barista di fiducia è un'istituzione, ha ragione. Ma «meglio che mia madre»: confronta il barista con sua madre, due persone. Quale preposizione introduce il secondo termine?"
      prompt: {text: "meglio che mia madre", tags: [comparative]}
    - learner: "Meglio di mia madre, appunto, e forse anche meglio di me."
    - tutor: "Allora salutiamo anche il suo barista. Grazie per essere stata con noi!"

- scenario: recensione-ristorante
  # facts: cena di lavoro con colleghi stranieri che ripartono domani per Lione; menù degustazione a ottantacinque euro a persona; il sommelier ha abbinato un rosso tannico al branzino; secondo arrivato tiepido dopo un'attesa più lunga del previsto; stasera la cucina era sotto organico; offerta: vini offerti e invito a tornare; vini accettati, invito rifiutato; conto senza i vini
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    # decoy: «a cui volevo far conoscere» is correct
    - learner: "Buonasera. Le dico subito che non è una tragedia, ma stasera avevo ospiti stranieri a cui volevo far conoscere la cucina italiana, e qualcosa non è andato."
    - tutor: "Mi dispiace, mi dica pure con franchezza."
      goals: [complain]
    - learner: "Il problema principale sono stati i vini. Il sommelier ci ha proposto un abbinamento di chi, francamente, non ho capito la logica: un rosso molto tannico con il branzino."
      errors: [relative-pronoun]
      gold: {text: "un abbinamento di chi", fix: "un abbinamento di cui"}
    # agree: content
    - tutor: "Un rosso tannico con il branzino è una scelta discutibile, ha ragione. Ma «un abbinamento di chi non ho capito la logica»: la logica è dell'abbinamento, non di una persona. Quale relativo si usa dopo «di»?"
      prompt: {text: "un abbinamento di chi", tags: [relative-pronoun]}
    # decoy: «più lunga di quanto ci avessero annunciato» is correct
    - learner: "Un abbinamento di cui non ho capito la logica. E il secondo è arrivato tiepido, quasi freddo, dopo un'attesa più lunga di quanto ci avessero annunciato."
    - tutor: "Così va bene. Me ne scuso: stasera in cucina eravamo sotto organico. Che cosa si aspettava, da un menù degustazione?"
      goals: [detail]
    - learner: "Mi aspettavo un servizio all'altezza del prezzo. Per ottantacinque euro a persona, mi aspetto più cura che quella che si trova in una trattoria, non meno."
      errors: [comparative]
      gold: {text: "più cura che quella", fix: "più cura di quella"}

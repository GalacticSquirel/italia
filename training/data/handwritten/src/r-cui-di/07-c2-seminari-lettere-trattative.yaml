      gold: {text: "la fascia oraria nel quale", fix: "la fascia oraria nella quale"}
    # agree: content
    - tutor: "Il venerdì pomeriggio è un argomento che il direttore capirà. Ma «la fascia oraria nel quale»: il relativo si riferisce a «fascia». Come deve essere?"

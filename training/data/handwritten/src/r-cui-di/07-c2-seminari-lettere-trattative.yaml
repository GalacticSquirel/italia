- scenario: notizie-attualita
  # facts: secondo la learner la legge è timida; due novità: codice identificativo obbligatorio per ogni annuncio e tassa più alta per chi ha più di due appartamenti in affitto breve; per chi ne ha uno solo cambia poco; un quotidiano nazionale la presenta come una svolta, il sito dei proprietari come una persecuzione; la learner vorrebbe un tetto alle notti, come in altre città europee con risultati migliori; conseguenza temuta: appartamenti intestati ai parenti per restare sotto la soglia
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    # decoy: headless «chi affitta» is correct
    - learner: "Mi sono fatta l'idea che sia una legge timida. Chi affitta più di due appartamenti pagherà qualche tassa in più e dovrà esporre un codice, ma nessuno ferma davvero il fenomeno."
    - tutor: "Timida? I proprietari dicono che è un esproprio. Riassumimela meglio."
    - learner: "In sostanza, ci sono due novità: un codice identificativo obbligatorio per ogni annuncio, e una tassa più alta per i proprietari i quali appartamenti in affitto breve sono più di due."
      errors: [relative-pronoun]
      gold: {text: "i proprietari i quali appartamenti", fix: "i proprietari i cui appartamenti"}
    - tutor: "Così l'ho capita anch'io. Ma «i proprietari i quali appartamenti»: gli appartamenti sono dei proprietari. Quale relativo esprime il possesso?"
      goals: [summarise]
      prompt: {text: "i proprietari i quali appartamenti", tags: [relative-pronoun]}
    # decoy: «chi ne ha uno solo» is correct
    - learner: "I proprietari i cui appartamenti in affitto breve sono più di due. Per chi ne ha uno solo, invece, non cambia quasi niente."
    - tutor: "Ecco. E allora perché, secondo te, i giornali ne parlano come di una rivoluzione?"
    - learner: "Dipende dai giornali. Il quotidiano nazionale da chi ho letto la notizia la presentava come una svolta storica, mentre il sito dei proprietari parlava di persecuzione."
      errors: [relative-pronoun]
      gold: {text: "da chi ho letto", fix: "su cui ho letto"}
    - tutor: "Due mondi diversi, come sempre. Ma «il quotidiano nazionale da chi ho letto la notizia»: la notizia l'hai letta su un giornale, che è una cosa. Quale preposizione e quale relativo servono?"
      goals: [sources]
      prompt: {text: "da chi ho letto", tags: [relative-pronoun]}
    - learner: "Il quotidiano su che ho letto la notizia, volevo dire."
      errors: [relative-pronoun]
    - tutor: "Il quotidiano su cui l'hai letta vende più copie se c'è una svolta da raccontare. Ma tu, al netto dei titoli, che cosa ne pensi?"
      recast: {text: "su che", fix: "su cui", tags: [relative-pronoun]}
    - learner: "Penso che sia meglio di niente, ma servirebbe un tetto alle notti, come in altre città europee, dove i risultati, per quanto ne so, sono migliori che quelli italiani."
      errors: [comparative]
      gold: {text: "migliori che quelli", fix: "migliori di quelli"}
    # agree: content
    - tutor: "Sul tetto alle notti ti do ragione, anche se i proprietari urlerebbero. Ma «migliori che quelli italiani»: «quelli» è un pronome. Quale preposizione gli va davanti?"
      goals: [opinion]
      prompt: {text: "migliori che quelli", tags: [comparative]}
    - learner: "Migliori di quelli italiani, appunto. La conseguenza, temo, sarà che i grandi proprietari intesteranno gli appartamenti ai parenti, per restare sotto la soglia."
    - tutor: "Il trucco dei parenti, certo: da noi una legge non fa in tempo a nascere che è già aggirata. Ne riparliamo quando escono i primi dati."
      goals: [consequences]

- scenario: mediazione-colleghi
  # facts: ieri Serena ha presentato al cliente la proposta scritta dal collega (tutor), senza nominarlo; il collega ci ha lavorato dieci giorni, anche nel fine settimana; Serena gli aveva chiesto di non venire perché «c'era poco spazio»; il collega ha più esperienza di Serena con quel cliente, difficile; soluzione: email del responsabile al cliente per presentarlo come responsabile tecnico, riunione a tre giovedì
  level: C2
  persona: es-m-worker
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    # decoy: «preferisco saperlo oggi che scoprirlo», two infinitives, rightly takes «che»
    - learner: "Ha fatto benissimo a venire subito: preferisco saperlo oggi che scoprirlo fra un mese. Mi racconti tutto, con calma."
    - tutor: "Ieri Serena ha presentato al cliente la proposta che ho scritto io, parola per parola, e non mi ha nominato nemmeno una volta. Ci ho lavorato dieci giorni, anche nel fine settimana."
    # decoy: «più che legittima» is correct
    - learner: "Capisco l'amarezza, ed è più che legittima. Un lavoro che ha dedicato perfino i fine settimana merita di essere riconosciuto, e non solo da me."
      errors: [relative-pronoun]
      gold: {text: "Un lavoro che ha dedicato", fix: "Un lavoro a cui ha dedicato"}
    - tutor: "Grazie, almeno lei lo riconosce. Ma «un lavoro che ha dedicato perfino i fine settimana»: il tempo si dedica a qualcosa. Che cosa serve davanti al relativo?"
      goals: [listen]
      prompt: {text: "Un lavoro che ha dedicato", tags: [relative-pronoun]}
    - learner: "Un lavoro a cui ha dedicato perfino i fine settimana, appunto. Mi aiuti a capire: lei era presente alla riunione con il cliente?"
    - tutor: "Così è giusto. No, ed è questo il punto: Serena mi aveva chiesto di non venire, perché nella sala «c'era poco spazio»."
      goals: [clarify]
    - learner: "Capisco. E prima della riunione Serena le aveva detto come pensava di presentare la proposta? Glielo chiedo perché con questo cliente lei ha molta più esperienza che Serena."
      errors: [comparative]
      gold: {text: "molta più esperienza che Serena", fix: "molta più esperienza di Serena"}
    - tutor: "Non mi aveva detto niente. Ma «molta più esperienza che Serena»: qui lei confronta me con Serena, due persone. Quale preposizione introduce il secondo termine?"
      prompt: {text: "molta più esperienza che Serena", tags: [comparative]}
    - learner: "Più esperienza che la stessa Serena, intendevo."
      errors: [comparative]
    - tutor: "Più esperienza della stessa Serena: è per questo che l'esclusione brucia. Lei come la spiega?"
      recast: {text: "più esperienza che la stessa Serena", fix: "più esperienza della stessa Serena", tags: [comparative]}
    # decoy: the subjunctives «dessero» and «andasse nominato» and «il che» are correct
    - learner: "Provo a vedere il suo lato, senza giustificarla: questo cliente è difficile, e forse Serena temeva che troppe persone in sala dessero un'idea di confusione. Il che non toglie che lei andasse nominato."
    - tutor: "Può darsi che non l'abbia fatto con cattiveria. Ma intanto il cliente pensa che la proposta sia sua. Che cosa possiamo fare?"
      goals: [perspective]
    # decoy: «ruolo per cui» and «nella quale» are correct
    - learner: "Scriverò io al cliente per presentarla come responsabile tecnico del progetto, ruolo per cui lei è la persona più indicata. E giovedì faremo una riunione a tre, nella quale Serena avrà modo di spiegarsi."
    - tutor: "Un'email al cliente e una riunione giovedì: mi sembra giusto. Grazie per avermi ascoltato."
      goals: [solution]

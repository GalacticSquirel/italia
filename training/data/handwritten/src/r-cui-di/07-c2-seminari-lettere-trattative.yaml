# Set r-cui-di, file 7 (C2): a doctoral ethics seminar, a letter to a rector, comedy at the bar, a
# translation dispute, a supplier, a training pitch, rental news and a mediation between
# colleagues. Relatives in sophisticated speech: «secondo che», «di cui la responsabilità», «che
# non possiamo disporne», «a chi» with «ente», «di chi» with «decisione», «cose di chi», «una
# costruzione a chi», «il modo che», «con chi» with «supermercati», «del quale i risultati», «nel
# quale» with «fascia», «i quali appartamenti», «da chi ho letto», «un lavoro che ha dedicato».
# Comparatives with «che» before nouns and pronouns. Correct «tra cui», «il cui», «alla quale»,
# «più che legittima», «più del triplo» and «che» between two infinitives or phrases are left alone.
- scenario: seminario-etica
  # facts: tesi della dottoranda: la responsabilità morale presuppone un'intenzione, quindi le macchine ne restano escluse; distinzione tra responsabilità causale e morale (la frana); le aziende sono finzioni giuridiche la cui responsabilità ricade su persone; dietro una macchina ci sono chi la progetta, chi la addestra e chi la usa; concessione: sul piano giuridico un sistema autonomo potrebbe essere un soggetto; conclusione: la responsabilità morale resta di chi decide se e come usarla
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    # decoy: the subjunctive «presupponga» is correct
    - learner: "La ringrazio del dubbio, professore, perché mi permette di precisare. La mia tesi è che la responsabilità morale presupponga un'intenzione, ed è proprio questo il presupposto secondo che le macchine ne restano escluse."
      errors: [relative-pronoun]
      gold: {text: "il presupposto secondo che", fix: "il presupposto secondo cui"}
    - tutor: "Una tesi netta, almeno. Ma riprenda «il presupposto secondo che le macchine ne restano escluse»: dopo «secondo», usato come preposizione, il relativo non può essere «che». Quale si usa?"
      goals: [thesis]
      prompt: {text: "il presupposto secondo che", tags: [relative-pronoun]}
    - learner: "Il presupposto secondo cui le macchine ne restano escluse. Per sostenerlo distinguo tra responsabilità causale e responsabilità morale: una frana causa un danno, ma nessuno si sogna di biasimarla."
    - tutor: "Così è corretto. Distinzione classica. Ma allora le aziende? Le condanniamo, senza che abbiano una mente."
      goals: [distinguish]
    - learner: "Le aziende sono un caso diverso: sono finzioni giuridiche di cui la responsabilità ricade, in ultima analisi, su persone in carne e ossa che prendono decisioni."
      errors: [relative-pronoun]
      gold: {text: "di cui la responsabilità", fix: "la cui responsabilità"}
    - tutor: "Elegante, ma non mi ha ancora convinto. E prima di andare avanti: «finzioni giuridiche di cui la responsabilità ricade»: la responsabilità appartiene alle finzioni. Quale relativo esprime il possesso, senza preposizione?"
      prompt: {text: "di cui la responsabilità", tags: [relative-pronoun]}
    - learner: "Finzioni giuridiche delle quali la responsabilità ricade su persone, volevo dire."
      errors: [relative-pronoun]
    - tutor: "Finzioni la cui responsabilità ricade su persone, dunque. Ma una macchina che apprende da sola, chi ha dietro?"
      goals: [objection]
      recast: {text: "delle quali la responsabilità", fix: "la cui responsabilità", tags: [relative-pronoun]}
    # decoy: headless «chi» three times and the subjunctive «sappia» are correct
    - learner: "Ha dietro chi l'ha progettata, chi l'ha addestrata e chi decide di usarla. Che nessuno di loro sappia prevedere ogni esito non sposta la responsabilità sulla macchina."
    - tutor: "Ammetterà almeno che, in tribunale, un sistema autonomo potrebbe diventare un soggetto con una sua responsabilità giuridica."
    # decoy: «a cui molti giuristi guardano» is correct
    - learner: "Lo ammetto: sul piano giuridico è una soluzione pratica, a cui molti giuristi guardano con interesse. Ma la responsabilità giuridica la disegniamo come vogliamo, mentre quella morale è un concetto che non possiamo disporne a piacere."
      errors: [relative-pronoun]
      gold: {text: "che non possiamo disporne", fix: "di cui non possiamo disporre"}
    # agree: content
    - tutor: "Concessione accettata, e la distinzione regge. Però «un concetto che non possiamo disporne»: quel verbo regge «di», e lei ha usato «che» più «ne» invece di un solo relativo con la preposizione. Come riformula?"
      goals: [concede]
      prompt: {text: "che non possiamo disporne", tags: [relative-pronoun]}
    - learner: "Un concetto di cui non possiamo disporre a piacere, appunto."
    - tutor: "Esatto. Allora mi dia una conclusione rigorosa, in una frase."
    - learner: "In conclusione: una macchina può causare un danno e perfino essere trattata come soggetto giuridico, ma la responsabilità morale resta di chi ha il potere di decidere se e come usarla."
    - tutor: "Rigorosa, e difficile da smontare. Ne riparleremo al prossimo seminario, dottoressa."
      goals: [conclude]

- scenario: email-rettore
  # facts: ricercatore ospite; il dipartimento gli toglie l'accesso al laboratorio dalla fine di marzo; il progetto per cui è stato invitato è finanziato fino a giugno da un ente a cui deve consegnare i risultati; vuole una proroga di tre mesi; saluto «Magnifico Rettore» e apertura «mi permetto di rivolgermi a Lei in merito a...»; frase troppo diretta riformulata; chiusura scelta: «Con i più distinti saluti»; bozza stasera, rilettura domattina
  level: C2
  persona: en-m-retired
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    # decoy: «per il quale» is correct
    - learner: "Il dipartimento mi ha tolto l'accesso al laboratorio dalla fine di marzo, ma il progetto, per il quale sono stato invitato, è finanziato fino a giugno da un ente a chi devo consegnare i risultati."
      errors: [relative-pronoun]
      gold: {text: "un ente a chi", fix: "un ente a cui"}
    - tutor: "Capisco, e la sua richiesta mi sembra fondata. Ma «un ente a chi devo consegnare»: con un nome come «ente», dopo «a», quale relativo si usa?"
      goals: [situation]
      prompt: {text: "un ente a chi", tags: [relative-pronoun]}
    - learner: "Un ente a cui devo consegnare i risultati, certo. Vorrei ottenere una proroga di tre mesi. Come devo cominciare la lettera?"
    - tutor: "Ecco. Si scrive «Magnifico Rettore», e poi una formula d'apertura sobria, per esempio «mi permetto di rivolgermi a Lei in merito a...». Le sembra adatta?"
    - learner: "Mi sembra perfetta, e molto più elegante che il «Gentile Rettore» che avevo scritto io, forse per abitudine americana."
      errors: [comparative]
      gold: {text: "più elegante che il", fix: "più elegante del"}
    - tutor: "«Gentile» non è sbagliato, ma con un rettore suona un po' confidenziale. Però riprenda «più elegante che il»: davanti a un nome, quale preposizione, con l'articolo, introduce il secondo termine?"
      goals: [opening-formula]
      prompt: {text: "più elegante che il", tags: [comparative]}
    - learner: "Più elegante del «Gentile Rettore», sì. Poi ho scritto questa frase: «La decisione del dipartimento è assurda e mi impedisce di lavorare.» È troppo diretta?"
    - tutor: "Così va bene. Sì, è troppo diretta: il Rettore leggerebbe solo «assurda». Come potrebbe dirlo con più garbo?"
    - learner: "Potrei scrivere: «Mi permetto di segnalare una decisione di chi temo non siano state valutate tutte le conseguenze, e che rischia di compromettere un progetto finanziato.»"
      errors: [relative-pronoun]
      gold: {text: "una decisione di chi", fix: "una decisione di cui"}
    # agree: content
    - tutor: "Il tono adesso è quello giusto, fermo ma cortese. Resta però «una decisione di chi temo»: le conseguenze sono della decisione, non di una persona. Quale relativo si usa dopo «di»?"
      prompt: {text: "una decisione di chi", tags: [relative-pronoun]}
    - learner: "Una decisione delle cui temo non siano state valutate le conseguenze."
      errors: [relative-pronoun]
    - tutor: "«Una decisione di cui temo non siano state valutate tutte le conseguenze»: così la frase è impeccabile. Resta la chiusura: che formula pensava di usare?"
      goals: [tone]
      recast: {text: "delle cui", fix: "di cui", tags: [relative-pronoun]}
    # decoy: «più adatto a un collega che a un rettore», two phrases, rightly takes «che»
    - learner: "Pensavo a «Cordiali saluti», ma forse è più adatto a un collega che a un rettore."
    - tutor: "Infatti, meglio qualcosa di più formale: «Con i più distinti saluti», oppure «Voglia gradire i miei più cordiali saluti». Quale preferisce?"
    # decoy: «più sobria dell'altra» is correct
    - learner: "«Con i più distinti saluti»: è più sobria dell'altra, e mi assomiglia di più."
    - tutor: "Ottima scelta. Me la mandi in bozza stasera, e domattina gliela rileggo prima che la spedisca."
      goals: [closing]

- scenario: umorismo-satira
  # facts: nel monologo il ministro dichiarava che la panna nella carbonara è un attentato all'identità nazionale; battuta del comico: «Finalmente un governo che ha le idee chiare... almeno in cucina»; la learner aveva riso solo perché ridevano tutti; battuta preferita: i monopattini parcheggiati davanti al Colosseo; gioco di parole: «il ministro della minestra»; tentativo della learner: «questo governo non ha un programma, ha un menù»; limite della satira: colpire chi ha più potere del comico; il prossimo giro lo offre la learner
  level: C2
  persona: en-f-professional
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    # decoy: «il che» is correct
    - learner: "Lo ammetto, non l'avevo capita! Ho riso solo perché ridevano tutti, il che è un po' triste. Me la spieghi?"
    - tutor: "Te la spiego, ma poi offri tu. Nel monologo il ministro dichiarava che la panna nella carbonara è un attentato all'identità nazionale, e il comico aggiungeva: «Finalmente un governo che ha le idee chiare... almeno in cucina»."
      goals: [missed]
    # decoy: «il cui bersaglio» is correct
    - learner: "Ah, adesso capisco: è una battuta il cui bersaglio non è la carbonara, ma un governo che passa il tempo su cose di chi non importa niente a nessuno."
      errors: [relative-pronoun]
      gold: {text: "cose di chi", fix: "cose di cui"}
    # agree: content
    - tutor: "Sull'interpretazione hai centrato il bersaglio. Ma «cose di chi non importa niente a nessuno»: si dice «importare di qualcosa», e qui il qualcosa sono le «cose». Quale relativo si usa dopo «di»?"
      prompt: {text: "cose di chi", tags: [relative-pronoun]}
    # decoy: «più cattiva che divertente», two adjectives, rightly takes «che»
    - learner: "Cose di cui non importa niente a nessuno. Io invece ho adorato quella sui monopattini, che mi è sembrata più cattiva che divertente, ma proprio per questo funzionava."
    - tutor: "Ecco, così. Quella dei monopattini parcheggiati davanti al Colosseo? Feroce. E dei giochi di parole, ne hai capito qualcuno?"
      goals: [favourite]
    - learner: "Uno sì: quando ha chiamato il ministro «il ministro della minestra». È un gioco di parole a chi ripenso ancora adesso, perché è stupido e geniale insieme."
      errors: [relative-pronoun]
      gold: {text: "un gioco di parole a chi", fix: "un gioco di parole a cui"}
    - tutor: "Il ministro della minestra, sì: facile ma efficace. Però «un gioco di parole a chi ripenso»: «chi» si usa per le persone, e senza un nome davanti. Dopo «a», qui, quale relativo ci vuole?"
      prompt: {text: "un gioco di parole a chi", tags: [relative-pronoun]}
    - learner: "Un gioco di parole a che ripenso ancora adesso."
      errors: [relative-pronoun]
    - tutor: "Un gioco di parole a cui ripensi ancora: il comico sarebbe fiero di te. Te la senti di provarne uno tu?"
      recast: {text: "a che", fix: "a cui", tags: [relative-pronoun]}
    - learner: "Ci provo, ma non ridere troppo: questo governo non ha un programma, ha un menù."
    - tutor: "Più che un gioco di parole è una battuta, ma il comico te la ruberebbe. Ultima questione: secondo te la satira deve avere dei limiti?"
      goals: [wordplay]
    - learner: "Secondo me sì, ma uno solo: deve colpire chi ha più potere che il comico stesso, mai chi ne ha meno."
      errors: [comparative]
      gold: {text: "più potere che il comico stesso", fix: "più potere del comico stesso"}
    # agree: content
    - tutor: "Sul principio sono d'accordo con te, la satira deve guardare in alto. Ma «più potere che il comico stesso»: il secondo termine è un nome. Quale preposizione, con l'articolo, gli va davanti?"
      goals: [limits]
      prompt: {text: "più potere che il comico stesso", tags: [comparative]}
    - learner: "Più potere del comico stesso. Altrimenti non è satira: è bullismo con il microfono."
    - tutor: "Bullismo con il microfono: questa stasera la uso io. E adesso il prossimo giro lo offri tu, come d'accordo."

- scenario: traduzione-sfumature
  # facts: terzo capitolo di un romanzo inglese; la madre nell'originale è più asciutta della bozza; davanti al quadro del figlio dice «not bad at all», tradotto «è bellissimo, tesoro»; opzioni: «niente male» o «non è affatto male»; falso amico: «eventually» reso con «eventualmente» invece di «alla fine»; scelta: «niente male»; capitolo rivisto entro lunedì
  level: C2
  persona: en-m-heritage
  history: [comparative, relative-pronoun]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, me l'hai già fatto capire con le tue note rosse. Il problema è il registro della madre: in inglese è molto più asciutta che la mia versione, e io l'ho resa troppo affettuosa."
      errors: [comparative]
      gold: {text: "molto più asciutta che la mia versione", fix: "molto più asciutta della mia versione"}
    - tutor: "Almeno lo vedi da solo. Ma «molto più asciutta che la mia versione»: confronti la madre dell'originale con la tua versione, cioè con un nome. Che cosa introduce il secondo termine?"
      goals: [problem]
      prompt: {text: "molto più asciutta che la mia versione", tags: [comparative]}
    - learner: "Molto più asciutta della mia versione. Per esempio, quando il figlio le mostra il quadro, lei dice solo «not bad at all», e io ho tradotto «è bellissimo, tesoro»."
    - tutor: "«Bellissimo, tesoro»: l'hai trasformata in una nonna di paese. Che alternative hai?"
    # decoy: «tra cui faccio fatica a scegliere» is correct
    - learner: "Due, tra cui faccio fatica a scegliere. «Niente male» è una formula che un italiano userebbe davvero, mentre «non è affatto male» è una costruzione a chi nessuno penserebbe parlando."
      errors: [relative-pronoun]
      gold: {text: "una costruzione a chi", fix: "una costruzione a cui"}
    # agree: content
    - tutor: "Hai ragione, «non è affatto male» a cena non lo direbbe nessuno. Ma «una costruzione a chi nessuno penserebbe»: si pensa a una cosa, e qui la cosa è «costruzione». Quale relativo serve?"
      goals: [options]
      prompt: {text: "una costruzione a chi", tags: [relative-pronoun]}
    - learner: "Una costruzione a quale nessuno penserebbe parlando."
      errors: [relative-pronoun]
    - tutor: "Una costruzione alla quale nessuno penserebbe: quindi la scartiamo. E più avanti, quell'«eventually» che hai reso con «eventualmente»?"
      recast: {text: "a quale", fix: "alla quale", tags: [relative-pronoun]}
    # decoy: «il che» is correct
    - learner: "Lì ho sbagliato io: «eventually» vuol dire «alla fine», mentre «eventualmente» significa «se mai», il che cambia completamente il senso della frase."
    - tutor: "Il figlio non se ne va «se mai», se ne va «alla fine»: un falso amico da manuale. Allora, decidiamo?"
      goals: [false-friend]
    - learner: "Decidiamo: «niente male», senza aggettivi né vezzeggiativi. È meno fedele alla lettera che l'altra, ma molto più fedele al personaggio."
      errors: [comparative]
      gold: {text: "meno fedele alla lettera che l'altra", fix: "meno fedele alla lettera dell'altra"}
    - tutor: "Sulla scelta sono d'accordo. Ma «meno fedele alla lettera che l'altra»: qui confronti una traduzione con l'altra. Quale preposizione, con l'articolo, introduce «l'altra»?"
      goals: [decide]
      prompt: {text: "meno fedele alla lettera che l'altra", tags: [comparative]}
    - learner: "Meno fedele alla lettera dell'altra, ma più fedele al personaggio. Ti mando il capitolo rivisto entro lunedì."
    - tutor: "Lunedì, non martedì. E stavolta voglio sentire l'autore, non te."

- scenario: trattativa-fornitore
  # facts: aumento del quindici per cento comunicato con un'email di tre righe e dieci giorni di preavviso; il contratto ne prevede sessanta; l'azienda della learner produce sughi pronti; i supermercati hanno chiuso i listini fino a marzo; controfferta otto per cento dal primo marzo; fornitore: dieci per cento dal primo febbraio; accordo: nove per cento dal quindici febbraio, listino bloccato per dodici mesi; conferma scritta e firmata entro domani mattina
  level: C2
  persona: es-f-erasmus
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo per il listino, ma prima ancora per il modo che ci è stato comunicato: un'email di tre righe, con dieci giorni di preavviso."
      errors: [relative-pronoun]
      gold: {text: "il modo che", fix: "il modo in cui"}
    - tutor: "Ha ragione, la comunicazione non è stata delle migliori, e me ne scuso. Ma riprenda «il modo che ci è stato comunicato»: il listino vi è stato comunicato in quel modo. Quale preposizione serve davanti al relativo?"
      goals: [problem]
      prompt: {text: "il modo che", tags: [relative-pronoun]}
    - learner: "Il modo in cui ci è stato comunicato, sì. E c'è di più: il nostro contratto prevede sessanta giorni di preavviso, non dieci."
    - tutor: "Così è corretto. Sul preavviso non posso darle torto, la clausola c'è. Che cosa propone?"
    # decoy: «alla quale» is correct
    - learner: "Propongo di rispettare la clausola, alla quale, mi permetta, voi stessi avete tenuto molto al momento della firma. E poi i supermercati con chi lavoriamo hanno già chiuso i listini fino a marzo."
      errors: [relative-pronoun]
      gold: {text: "i supermercati con chi", fix: "i supermercati con cui"}
    - tutor: "Il vincolo dei supermercati lo capisco. Ma «i supermercati con chi lavoriamo»: «chi» si riferisce solo a persone, e senza un nome davanti. Dopo «con», quale relativo serve?"
      goals: [argue]
      prompt: {text: "i supermercati con chi", tags: [relative-pronoun]}
    - learner: "I supermercati con cui lavoriamo, certo. Allora la mia proposta è questa: un aumento dell'otto per cento, dal primo marzo."
    - tutor: "L'otto è poco. Posso arrivare al dieci, ma dal primo febbraio."
      goals: [counteroffer]
    - learner: "Il dieci dal primo febbraio ci costerebbe più che l'intero margine del trimestre: non posso firmarlo. Facciamo il nove dal quindici febbraio, con il listino bloccato per dodici mesi."
      errors: [comparative]
      gold: {text: "più che l'intero margine", fix: "più dell'intero margine"}
    # agree: content
    - tutor: "Il listino bloccato è una richiesta seria, ma ragionevole. Prima però riprenda «più che l'intero margine»: il secondo termine è un nome. Quale preposizione, con l'articolo, gli va davanti?"
      prompt: {text: "più che l'intero margine", tags: [comparative]}
    - learner: "Ci costerebbe più che tutto il margine del trimestre, intendevo."
      errors: [comparative]
    - tutor: "Se vi costa più di tutto il margine del trimestre, capisco il no. Accetto: nove per cento dal quindici febbraio, con il listino bloccato per dodici mesi."
      recast: {text: "più che tutto il margine", fix: "più di tutto il margine", tags: [comparative]}
    # decoy: «il che» and «ai quali» are correct
    - learner: "Perfetto. Mi mandi la conferma scritta entro domani, il che mi permetterà di avvisare i supermercati, ai quali dovrò comunque spiegare qualcosa."
    - tutor: "Entro domani mattina avrà la conferma firmata. Grazie per la franchezza, come sempre."
      goals: [agreement]

- scenario: presentazione-progetto
  # facts: proposta: corso di inglese tecnico per venticinque tecnici che non riescono a spiegare il loro lavoro ai clienti esteri; corso pilota di tre mesi con otto tecnici, reclami dei loro clienti dimezzati; stima: almeno trenta per cento di reclami in meno in un anno; costo sessantamila euro; il cliente tedesco perso l'anno scorso valeva più del triplo; corsi il venerdì pomeriggio, quando la produzione è più bassa; budget approvato per sei mesi; calendario dei corsi entro venerdì, numeri a giugno
  level: C2
  persona: en-m-traveller
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Perché oggi perdiamo clienti esteri per un motivo banale: i nostri tecnici sanno riparare tutto, ma al telefono non riescono a spiegare quello che fanno. Propongo un corso di inglese tecnico per venticinque persone."
    - tutor: "Banale non direi. Che cosa le fa pensare che un corso risolva il problema?"
      goals: [pitch]
    - learner: "Lo abbiamo già provato: otto tecnici hanno seguito un corso pilota di tre mesi, del quale i risultati sono stati sorprendenti, perché i reclami dei loro clienti si sono dimezzati."
      errors: [relative-pronoun]
      gold: {text: "del quale i risultati", fix: "i cui risultati"}
    - tutor: "Dimezzati è una parola forte, la verificherò. Ma «un corso pilota di tre mesi, del quale i risultati»: i risultati appartengono al corso. In questa posizione, davanti al nome, quale relativo esprime il possesso?"
      prompt: {text: "del quale i risultati", tags: [relative-pronoun]}
    - learner: "Un corso pilota i cui risultati sono stati sorprendenti. Con venticinque tecnici, stimiamo un calo dei reclami di almeno il trenta per cento in un anno."
    - tutor: "Così è corretto. E quanto costa?"
      goals: [benefits]
    # decoy: «più del triplo» is correct
    - learner: "Sessantamila euro, cioè molto meno che un solo cliente perso: il cliente tedesco che abbiamo perso l'anno scorso valeva più del triplo."
      errors: [comparative]
      gold: {text: "molto meno che un solo cliente", fix: "molto meno di un solo cliente"}
    # agree: content
    - tutor: "Il cliente tedesco è una ferita ancora aperta, ha ragione. Ma «molto meno che un solo cliente perso»: il secondo termine è un nome. Quale preposizione lo introduce?"
      prompt: {text: "molto meno che un solo cliente", tags: [comparative]}
    - learner: "Molto meno di un solo cliente perso. So però che la sua preoccupazione è un'altra."
    - tutor: "Esatto. Due ore di corso alla settimana sono due ore tolte alla produzione. Come lo giustifico con il direttore di stabilimento?"
    - learner: "Organizzando i corsi il venerdì pomeriggio, cioè la fascia oraria nel quale la produzione è più bassa e i tecnici, di solito, fanno solo manutenzione ordinaria."

# Set r-cui-di, file 1 (B2): flat viewings, rent negotiations and the registry office.
# Relatives after a preposition («per che», «con chi», «di chi», «in che», «da chi», «che» for
# «in cui») and comparatives with «che» before a noun, a pronoun or a number, beside correct
# «dove», «il cui», «il che», headless «chi» and comparatives that rightly take «che».
- scenario: affittare-appartamento
  # facts: bilocale arredato; affitto 650 euro al mese con le spese di condominio; riscaldamento autonomo, a parte; contratto quattro più quattro, caparra due mesi (due mesi di affitto); lavatrice di due anni; caldaia cambiata l'inverno scorso; la signora al telefono era la moglie del proprietario; supermercato in fondo alla strada, aperto fino alle nove; autobus 12 davanti al portone, va all'università; appartamento libero dal primo del mese; appuntamento domani alle cinque con documento d'identità e caparra
  level: B2
  persona: es-f-erasmus
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    # decoy: «dove studio» and the subject «che non costi troppo» are correct
    - learner: "Buongiorno, grazie. È molto luminoso! Sto cercando un appartamento vicino alla facoltà dove studio, che non costi troppo. Quanto chiede al mese?"
    - tutor: "Seicentocinquanta euro al mese, con le spese di condominio. Il riscaldamento invece si paga a parte. Che cosa studia?"
      goals: [rent]
    - learner: "Faccio un master in architettura. Adesso vivo in una stanza in centro, ma la ragione per che cerco un'altra casa è il rumore: sotto c'è un bar aperto fino alle due."
      errors: [relative-pronoun]
      gold: {text: "la ragione per che", fix: "la ragione per cui"}
    # agree: content
    - tutor: "Con un bar sotto casa la capisco benissimo, e qui la sera è tutto tranquillo. Ma riprenda «la ragione per che»: dopo la preposizione «per», quale pronome relativo si usa?"
      prompt: {text: "la ragione per che", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Ah, sì: la ragione per cui cerco un'altra casa è il rumore. E per il contratto, quanti mesi di caparra chiede?"
    - tutor: "Così va bene. Il contratto è un quattro più quattro, con due mesi di caparra. Vuole vedere la cucina e il bagno?"
      goals: [contract]
    - learner: "Sì, volentieri. Al telefono ho parlato con una signora, e la signora con chi ho parlato mi ha detto che la lavatrice è quasi nuova. È vero?"
      errors: [relative-pronoun]
      gold: {text: "la signora con chi", fix: "la signora con cui"}
    - tutor: "Era mia moglie, e la lavatrice ha due anni. Però guardi «la signora con chi ho parlato»: «chi» non si usa dopo un nome come «signora». Con «con», quale relativo ci vuole?"
      prompt: {text: "la signora con chi", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    # decoy: «più pratica che bella», two adjectives, rightly takes «che»
    - learner: "Giusto, la signora con cui ho parlato. La cucina è piccola, più pratica che bella, ma per me va bene. E la caldaia è vecchia?"
    - tutor: "No, la caldaia l'ho cambiata l'inverno scorso, quindi niente sorprese. Conosce già il quartiere?"
      goals: [condition]
    - learner: "Un po'. Una mia amica abita qui vicino e dice che questa zona è più tranquilla che il centro, però i negozi chiudono presto. C'è un supermercato?"
      errors: [comparative]
      gold: {text: "più tranquilla che il centro", fix: "più tranquilla del centro"}
    # agree: content
    - tutor: "C'è un supermercato in fondo alla strada, aperto fino alle nove. Su questo la sua amica ha ragione, ma guardi «più tranquilla che il centro»: confronta due nomi, la zona e il centro. Quale preposizione va davanti al secondo?"
      goals: [neighbourhood]
      prompt: {text: "più tranquilla che il centro", tags: [comparative]}
    - learner: "Questa zona è più tranquilla del centro, e anche più verde. Mi interessa molto: le persone con cui vivo adesso lasciano la casa a fine mese."
    - tutor: "Ecco, adesso è giusto. Davanti al portone passa anche l'autobus 12, che va all'università, e l'appartamento è libero dal primo del mese. Vogliamo vederci domani per i documenti?"
    - learner: "Sì, domani pomeriggio va benissimo. Vorrei entrare proprio il primo del mese, se per lei non è un problema."
    - tutor: "Nessun problema. Ci vediamo qui domani alle cinque: porti un documento d'identità e la caparra."
      goals: [decide]

- scenario: affittare-appartamento
  # facts: affitto 800 euro al mese più 60 euro di spese di condominio, riscaldamento compreso nelle spese; il learner lavora da casa per un'azienda inglese; presa per internet nella stanza piccola; contratto quattro più quattro, caparra tre mesi; frigorifero nuovo, forno da cambiare entro fine mese; il collega del learner abita vicino; di sera passa poca gente, mercato il martedì, parco a cinque minuti dietro la chiesa; il learner manda domani per email contratto di lavoro e passaporto; il proprietario richiama entro venerdì
  level: B2
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    # decoy: «più grande di quanto sembrasse», correct comparative with a clause
    - learner: "Buongiorno. Che bella luce! Il soggiorno è più grande di quanto sembrasse nelle foto. Quant'è l'affitto, e che cosa comprende?"
    - tutor: "Ottocento euro al mese, più sessanta euro di spese di condominio. Nelle spese c'è anche il riscaldamento. Per lei va bene?"
      goals: [rent]
    - learner: "Sì, rientra nel mio budget. Lavoro da casa per un'azienda inglese, quindi la camera piccola che abbiamo visto prima sarebbe la stanza che vorrei lavorare."
      errors: [relative-pronoun]
      gold: {text: "che vorrei lavorare", fix: "in cui vorrei lavorare"}
    - tutor: "Quella stanza è anche la più tranquilla della casa. Ma riprenda «la stanza che vorrei lavorare»: lei lavora dentro la stanza, non lavora la stanza. Che cosa serve prima del relativo?"
      prompt: {text: "che vorrei lavorare", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Una preposizione: la stanza in cui vorrei lavorare. Lì c'è una presa per internet? E il contratto quanto dura?"
    - tutor: "Perfetto. Sì, la presa per internet è proprio in quella stanza. Il contratto è un quattro più quattro, e chiedo tre mesi di caparra."
      goals: [contract]
    # decoy: headless «chi affitta» is correct
    - learner: "Tre mesi sono tanti, ma va bene: chi affitta a uno straniero vuole stare tranquillo, lo capisco. In cucina gli elettrodomestici funzionano tutti?"
    - tutor: "Il frigorifero è nuovo; il forno invece lo cambio entro la fine del mese, perché non scalda bene. Ha altre domande sulla casa o sulla zona?"
      goals: [condition]
    - learner: "Sì, sulla zona. Il collega di chi le ho parlato al telefono abita qui vicino e dice che di sera è un quartiere molto tranquillo. Lei che ne pensa?"
      errors: [relative-pronoun]
      gold: {text: "Il collega di chi", fix: "Il collega di cui"}
    # agree: content
    - tutor: "Il suo collega ha ragione: di sera qui passa poca gente, e il martedì c'è il mercato. Ma «il collega di chi le ho parlato»: dopo «di», riferito a un nome come «collega», quale relativo si usa?"
      goals: [neighbourhood]
      prompt: {text: "Il collega di chi", tags: [relative-pronoun]}
    - learner: "Il collega di che le ho parlato, sì. E c'è anche un parco qui vicino?"
      errors: [relative-pronoun]
    - tutor: "Il collega di cui mi ha parlato conosce di sicuro anche il parco: è a cinque minuti a piedi, dietro la chiesa. Allora, l'appartamento le interessa?"
      recast: {text: "Il collega di che", fix: "Il collega di cui", tags: [relative-pronoun]}
    - learner: "Sì, mi interessa molto. Domani le mando per email il contratto di lavoro e una copia del passaporto, così può decidere con calma."
    - tutor: "Va bene, aspetto la sua email. Se è tutto in ordine, la chiamo entro venerdì per fissare la firma."
      goals: [decide]

- scenario: affittare-appartamento
  # facts: bilocale al piano terra con giardino; 720 euro al mese, spese circa 40 euro a parte; riscaldamento autonomo a gas; cani ammessi se non troppo grandi; il cane della learner pesa otto chili; contratto quattro più quattro, caparra due mesi; caldaia di cinque anni, ultimo controllo a ottobre; di fronte una scuola elementare, un po' di rumore verso le otto e all'una; la learner lavora da casa con riunioni online; seconda visita sabato alle undici con il compagno
  level: B2
  persona: en-f-professional
  history: [comparative, relative-pronoun]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Ho visto il giardino dalla finestra, è stupendo! Quanto costa l'affitto? Nell'annuncio non c'era scritto se le spese sono comprese."
    - tutor: "Settecentoventi euro al mese, e le spese, circa quaranta euro, sono a parte. Il riscaldamento è autonomo, a gas. Ha visto anche la camera da letto?"
      goals: [rent]
    - learner: "Sì, l'ho vista: è luminosa, ma mi sembra meno grande che la camera dell'appartamento che ho visto ieri. Per me conta soprattutto il giardino, perché ho un cane."
      errors: [comparative]
      gold: {text: "meno grande che la camera", fix: "meno grande della camera"}
    - tutor: "I cani sono ammessi, se non sono troppo grandi. Riprenda però «meno grande che la camera»: il secondo termine è un nome, «la camera». Quale preposizione gli va davanti?"
      prompt: {text: "meno grande che la camera", tags: [comparative]}
    - learner: "Meno grande della camera di ieri, volevo dire. Il mio cane è piccolo, pesa otto chili. E per il contratto, che cosa chiede?"
    - tutor: "Sì, così. Otto chili non sono un problema. Il contratto è un quattro più quattro, con due mesi di caparra."
      goals: [contract]
    # decoy: «in cui ho vissuto» and «il cui rumore» are correct
    - learner: "Va bene. L'ultimo appartamento in cui ho vissuto aveva una caldaia il cui rumore mi svegliava ogni notte. Questa quanti anni ha?"
    - tutor: "Questa ha cinque anni, e l'ultimo controllo l'abbiamo fatto a ottobre. Del quartiere, che cosa vorrebbe sapere?"
      goals: [condition]
    - learner: "Vorrei sapere com'è la mattina. Di fronte c'è una scuola, e il motivo che glielo chiedo è che lavoro da casa e ho spesso riunioni online."
      errors: [relative-pronoun]
      gold: {text: "il motivo che glielo chiedo", fix: "il motivo per cui glielo chiedo"}
    - tutor: "È una scuola per bambini: verso le otto e all'una c'è un po' di rumore, il resto della giornata no. Ma torni su «il motivo che glielo chiedo»: lei chiede a causa di un motivo. Quale preposizione va prima del relativo?"
      goals: [neighbourhood]
      prompt: {text: "il motivo che glielo chiedo", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Il motivo per che glielo chiedo è il lavoro, sì."
      errors: [relative-pronoun]
    - tutor: "Il motivo per cui me lo chiede è più che giusto: con le riunioni basta evitare quelle due ore. L'appartamento le interessa?"
      recast: {text: "Il motivo per che", fix: "Il motivo per cui", tags: [relative-pronoun]}
    # decoy: «conta più la cucina che il giardino», two subjects, rightly takes «che»
    - learner: "Sì, molto. Però vorrei tornare con il mio compagno: per lui conta più la cucina che il giardino! Sabato mattina è possibile?"
    - tutor: "Certo, sabato alle undici le va bene? Così vedete tutti e due la cucina con calma."
      goals: [decide]

- scenario: trattativa-affitto
  # facts: canone richiesto 900 euro; il learner fa l'elettricista e si alza alle cinque; la camera dà sulla strada principale, traffico soprattutto di giorno; offerta del learner 850, il proprietario arriva a 860 con un quattro più quattro; garanzia: lettera del datore di lavoro e ultime tre buste paga; il learner lavora con il capo da sei anni; disdetta sei mesi con raccomandata; cedolare secca, canone fisso; piccole riparazioni a carico dell'inquilino, sostituzione della caldaia a carico del proprietario; firma lunedì alle dieci in agenzia
  level: B2
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, mi è piaciuto molto, soprattutto la cucina. Però la camera in che dormirei dà sulla strada principale, e io mi alzo alle cinque per lavorare."
      errors: [relative-pronoun]
      gold: {text: "la camera in che", fix: "la camera in cui"}
    - tutor: "Il traffico lì passa soprattutto di giorno, la notte è abbastanza calmo. Però guardi «la camera in che dormirei»: dopo la preposizione «in», quale pronome relativo si usa?"
      goals: [interest]
      prompt: {text: "la camera in che", tags: [relative-pronoun]}
    - learner: "La camera in cui dormirei, giusto. Comunque mi interessa. Il canone di novecento euro è trattabile?"
    - tutor: "Esatto. Il proprietario è disposto a parlarne: che cifra avrebbe in mente?"
    # decoy: «il che» referring to the whole clause is correct
    - learner: "Io potrei offrire ottocentocinquanta euro, il che per me è già molto, visto che devo pagare anche la provvigione dell'agenzia."
    - tutor: "Ottocentocinquanta è un po' basso, ma con un contratto lungo il proprietario arriva a ottocentosessanta. Le andrebbe bene un quattro più quattro?"
      goals: [negotiate]
    - learner: "Ottocentosessanta va bene. Ho parlato anche con il mio capo, con chi lavoro da sei anni, e può scrivermi una lettera per la garanzia, se serve."
      errors: [relative-pronoun]
      gold: {text: "il mio capo, con chi", fix: "il mio capo, con cui"}
    # agree: content
    - tutor: "Una lettera del suo capo è un'ottima idea, insieme alle ultime tre buste paga. Ma riprenda «il mio capo, con chi lavoro»: «chi» non va dopo un nome come «capo». Quale relativo ci vuole dopo «con»?"
      prompt: {text: "il mio capo, con chi", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Il mio capo, con cui lavoro da sei anni. Allora porto la lettera e le buste paga. E se un giorno devo lasciare l'appartamento, quanto preavviso devo dare?"
    - tutor: "Ecco, così. Sono sei mesi di preavviso, con una raccomandata. Il contratto lo facciamo con la cedolare secca, quindi il canone resta fisso."
      goals: [conditions]
    - learner: "Sei mesi mi sembrano giusti. C'è però una clausola di chi non ho capito bene il senso: quella sulle riparazioni della caldaia."
      errors: [relative-pronoun]
      gold: {text: "una clausola di chi", fix: "una clausola di cui"}
    - tutor: "Gliela spiego volentieri. Prima però riprenda «una clausola di chi»: la clausola è una cosa, non una persona. Quale relativo si usa dopo «di»?"
      prompt: {text: "una clausola di chi", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "Una clausola di cui non ho capito il senso. Chi paga, se la caldaia si rompe?"
    - tutor: "Le piccole riparazioni sono a carico suo, mentre se la caldaia va sostituita paga il proprietario. Allora, firmiamo lunedì?"
    - learner: "Sì, lunedì mattina va bene. Grazie, è stato molto chiaro e paziente."
    - tutor: "Grazie a lei. Lunedì alle dieci in agenzia, con la lettera e le buste paga."
      goals: [conclude]

- scenario: trattativa-affitto
  # facts: monolocale vicino all'università, canone 550 euro; per ora senza lavatrice; ieri la learner ha visto un monolocale lontano a 500 euro; offerta della learner 530 con lavatrice; il proprietario accetta 540 e compra lui la lavatrice; master di un anno e mezzo, contratto transitorio di diciotto mesi, disdetta tre mesi; garanti i genitori, servono le loro buste paga entro venerdì; la learner le manda giovedì per email; firma martedì alle quattro in agenzia; provvigione un mese di canone alla firma
  level: B2
  persona: en-f-student
  history: [comparative]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    # decoy: «più luminoso che spazioso», two adjectives, rightly takes «che»
    - learner: "Sì, mi è piaciuto: è piccolo, ma più luminoso che spazioso, e a me la luce serve per studiare. Però non c'è la lavatrice, giusto?"
    - tutor: "Giusto, per ora la lavatrice non c'è, ma se ne può parlare con il proprietario. Per il resto, le interessa?"
      goals: [interest]
    - learner: "Mi interessa, ma ieri ho visto un monolocale che costava meno che questo, cinquecento euro, anche se era lontano dall'università. Il canone è trattabile?"
      errors: [comparative]
      gold: {text: "costava meno che questo", fix: "costava meno di questo"}
    - tutor: "Un po' sì, il proprietario è disposto a scendere. Però riprenda «costava meno che questo»: il secondo termine è un pronome, «questo». Quale preposizione lo introduce?"
      prompt: {text: "costava meno che questo", tags: [comparative]}
    - learner: "Costava meno di questo, sì. Allora io offro cinquecentotrenta euro, e se è possibile con la lavatrice."
    - tutor: "Benissimo. Il proprietario mi ha detto che accetta cinquecentoquaranta, e la lavatrice la compra lui. Per lei può andare?"
      goals: [negotiate]
    - learner: "Cinquecentoquaranta con la lavatrice va bene. Quanto dura il contratto? Io resto in Italia solo per il master, cioè un anno e mezzo."
    - tutor: "Per gli studenti c'è il contratto transitorio, quindi possiamo farlo di diciotto mesi. Per la disdetta bastano tre mesi di preavviso."
      goals: [conditions]
      new: [{lemma: transitorio, gloss: temporary}]
    - learner: "Perfetto. Per la garanzia firmano i miei genitori: mio padre guadagna più che tremila euro al mese, quindi non dovrebbero esserci problemi."
      errors: [comparative]
      gold: {text: "più che tremila euro", fix: "più di tremila euro"}
    # agree: content
    - tutor: "Con i genitori come garanti va benissimo, ci servono solo le loro buste paga. Però guardi «più che tremila euro»: davanti a un numero, come si introduce il confronto?"
      prompt: {text: "più che tremila euro", tags: [comparative]}
    - learner: "Ah, quindi: mio padre guadagna più che tremila euro al mese, e anche mia madre lavora."
      errors: [comparative]
    - tutor: "Se suo padre guadagna più di tremila euro al mese e lavora anche sua madre, la garanzia basta e avanza. Mi manda le buste paga entro venerdì?"
      recast: {text: "più che tremila euro", fix: "più di tremila euro", tags: [comparative]}
    - learner: "Sì, gliele mando giovedì per email. Allora possiamo firmare la settimana prossima?"
    - tutor: "Sì, martedì alle quattro in agenzia, se le va bene. La provvigione è di un mese di canone e si paga alla firma."
      goals: [conclude]

- scenario: trattativa-affitto
  # facts: appartamento di tre stanze con terrazzo; canone 1000 euro; la nonna del learner è nata in questa via prima di emigrare in America; in un'altra agenzia un appartamento simile più economico, con garage e senza terrazzo; offerta del learner 900; il proprietario non scende sotto 950 anche con un quattro più quattro; spese di condominio 80 euro al mese; disdetta sei mesi con raccomandata; deposito tre mesi; il cugino aiuta il learner con il trasloco; il learner per ora rinuncia; l'agente lo richiama se il proprietario cambia idea
  level: B2
  persona: en-m-heritage
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, mi è piaciuto tanto. È strano: questa è proprio la via che è nata mia nonna, prima di emigrare in America con i suoi genitori."
      errors: [relative-pronoun]
      gold: {text: "la via che è nata", fix: "la via in cui è nata"}
    - tutor: "Che bella coincidenza, è un po' come tornare a casa. Però riprenda «la via che è nata mia nonna»: sua nonna è nata dentro questa via. Quale preposizione serve prima del relativo?"
      prompt: {text: "la via che è nata", tags: [relative-pronoun]}
    - learner: "La via in cui è nata mia nonna, sì. L'appartamento mi interessa, ma il canone mi sembra alto: mille euro sono tanti per tre stanze."
    - tutor: "Sì, così. Il terrazzo però vale molto, in questa zona. Lei quanto pensava di spendere?"
      goals: [interest]
    - learner: "Novecento euro al massimo. Un appartamento simile, in un'altra agenzia, era più economico che questo, e aveva anche il garage."
      errors: [comparative]
      gold: {text: "più economico che questo", fix: "più economico di questo"}
    - tutor: "Forse aveva il garage, ma il terrazzo no. Riprenda però «più economico che questo»: «questo» è un pronome. Quale preposizione gli va davanti?"

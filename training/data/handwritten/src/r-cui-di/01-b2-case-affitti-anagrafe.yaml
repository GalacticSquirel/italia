    - learner: "Più economico di questo, ma senza terrazzo, ha ragione. Allora offro novecento, con un contratto lungo."
    - tutor: "Il proprietario non scende sotto i novecentocinquanta, anche con un quattro più quattro. In più ci sono ottanta euro al mese di spese."

    - learner: "Buongiorno. Mi sono trasferita qui da Napoli per lavoro e vorrei cambiare la residenza. Che documenti servono?"
    - tutor: "Servono il documento d'identità, il contratto d'affitto e un documento che dimostri il lavoro. Li ha portati?"
      goals: [request]
    - learner: "Ho tutto tranne il contratto di lavoro: la scuola per che lavoro me lo dà solo a fine mese, perché la direttrice è in ferie."
      errors: [relative-pronoun]
      gold: {text: "la scuola per che", fix: "la scuola per cui"}
    - tutor: "Una soluzione la troviamo. Prima, però, riprenda «la scuola per che lavoro»: dopo la preposizione «per», il relativo «che» non va. Quale si usa?"
      goals: [documents]
      prompt: {text: "la scuola per che", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "La scuola per cui lavoro, giusto. Va bene anche una lettera della segreteria, con il timbro della scuola?"
    - tutor: "Esatto. Sì, una dichiarazione firmata dalla segreteria, con il timbro, è sufficiente. Me la può portare lunedì?"
      goals: [problem]
    # decoy: «il cui ufficio» is correct
    - learner: "Sì, lunedì va bene. La segretaria è una signora molto gentile, il cui ufficio è aperto tutte le mattine, quindi non ci sono problemi."
    - tutor: "Benissimo. Intanto compiliamo insieme il modulo, così lunedì porta solo la lettera."
    - learner: "D'accordo. Nel modulo devo scrivere anche il nome della signora da chi affitto la casa, oppure basta il contratto?"
      errors: [relative-pronoun]
      gold: {text: "la signora da chi", fix: "la signora da cui"}
    - tutor: "Sì, il nome va qui, in basso. Ma guardi «la signora da chi affitto»: con un nome davanti come «signora», dopo «da», quale relativo serve?"
      prompt: {text: "la signora da chi", tags: [relative-pronoun]}
      new: [{lemma: relativo, gloss: relative pronoun}]
    - learner: "La signora da che affitto la casa, scusi."
      errors: [relative-pronoun]
    - tutor: "Il nome della signora da cui prende in affitto la casa va proprio lì, con il suo numero di telefono. Le serve una penna?"
      recast: {text: "da che", fix: "da cui", tags: [relative-pronoun]}
    - learner: "No, grazie, ce l'ho. E dopo la domanda, quanto tempo ci vuole per la residenza?"
    - tutor: "Entro quarantacinque giorni passano i vigili per il controllo; dopo può chiedere il certificato qui allo sportello."
      goals: [next]
    - learner: "Grazie, è stata gentilissima. Allora torno lunedì con la lettera della scuola."
    - tutor: "A lunedì, allora. Venga allo sportello due, non serve prendere il numero."

- scenario: burocrazia-residenza
  # facts: numero 47; learner americano in pensione, ha comprato casa in paese; servono passaporto, permesso di soggiorno e atto di acquisto; permesso in rinnovo, in questura più di due mesi; va bene la ricevuta della domanda, l'impiegata ne fa una copia; la moglie deve fare la domanda anche lei, senza appuntamento, domani; i vigili passano entro 45 giorni, poi il certificato
  level: B2
  persona: en-m-retired
  history: [comparative, relative-pronoun]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono americano, sono in pensione e ho comprato una casa qui in paese. Vorrei prendere la residenza."
    - tutor: "Benvenuto. Allora mi servono il passaporto, il permesso di soggiorno e l'atto di acquisto della casa. Ha tutto con sé?"
      goals: [request]
      new: [{lemma: acquisto, gloss: purchase}]
    - learner: "Ho il passaporto e l'atto. Il permesso invece è in rinnovo: in questura mi hanno detto che per averlo ci vogliono più che due mesi."
      errors: [comparative]
      gold: {text: "più che due mesi", fix: "più di due mesi"}
    - tutor: "Purtroppo in questura i tempi sono quelli. Ma riprenda «più che due mesi»: davanti a un numero, quale preposizione ci vuole nel confronto?"
      goals: [documents]
      prompt: {text: "più che due mesi", tags: [comparative]}
    - learner: "Più di due mesi, sì. Ho però la ricevuta della domanda di rinnovo: va bene lo stesso?"
    - tutor: "Esatto. E sì, la ricevuta va bene: ne faccio una copia e la metto nella pratica. Ha anche un numero di telefono italiano?"
      goals: [problem]
    # decoy: «più tempo qui che in America» and «meglio qui che in Ohio» rightly take «che»
    - learner: "Sì, ecco il mio numero. Ormai passo più tempo qui che in America, e a dire la verità sto meglio qui che in Ohio."
    - tutor: "Allora siamo contenti di averla in paese. Firmi qui, per favore, e anche qui sotto."
    - learner: "Fatto. Mia moglie, con chi vivo qui da marzo, deve fare la domanda anche lei, o basta la mia?"
      errors: [relative-pronoun]
      gold: {text: "Mia moglie, con chi", fix: "Mia moglie, con cui"}
    - tutor: "Deve farla anche lei, con i suoi documenti, ma può venire senza appuntamento. Però «mia moglie, con chi vivo»: «chi» non va dopo un nome come «moglie». Dopo «con», quale relativo serve?"
      prompt: {text: "Mia moglie, con chi", tags: [relative-pronoun]}
    - learner: "Mia moglie, con cui vivo, viene domani, allora. E dopo, che cosa succede?"
    - tutor: "Entro quarantacinque giorni passano i vigili a controllare che abitiate lì; poi potete chiedere il certificato di residenza."
      goals: [next]
    - learner: "Speriamo che i vigili siano più veloci che la questura! Comunque grazie mille, è stata molto gentile."
      errors: [comparative]
      gold: {text: "più veloci che la questura", fix: "più veloci della questura"}
    # agree: content
    - tutor: "Lo spero anch'io, sinceramente! Ma «più veloci che la questura»: il secondo termine è un nome, «la questura». Quale preposizione gli va davanti?"
      prompt: {text: "più veloci che la questura", tags: [comparative]}
    - learner: "Più veloci della questura, ecco. Arrivederci, e buona giornata!"
    - tutor: "Così va bene. Arrivederci, buona giornata a lei e a sua moglie."

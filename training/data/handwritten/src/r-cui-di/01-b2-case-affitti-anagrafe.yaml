    # decoy: «più di quello che posso spendere», a correct «di» before a relative clause
    - learner: "Novecentocinquanta più ottanta di spese è più di quello che posso spendere. E per la disdetta, quanto preavviso chiede?"
    - tutor: "Sei mesi, con una raccomandata. Come garanzia, poi, il proprietario chiede tre mesi di deposito."
      goals: [conditions]
    - learner: "Tre mesi di deposito più la provvigione sono troppi per me. Devo parlarne con mio cugino, a chi ho chiesto aiuto per il trasloco, ma credo che rinuncerò."
      errors: [relative-pronoun]
      gold: {text: "mio cugino, a chi", fix: "mio cugino, a cui"}
    # agree: content
    - tutor: "La capisco, con il deposito e la provvigione la spesa iniziale è alta. Ma torni su «mio cugino, a chi ho chiesto aiuto»: dopo «a», riferito a «cugino», quale relativo si usa?"
      prompt: {text: "mio cugino, a chi", tags: [relative-pronoun]}
    - learner: "Mio cugino, a cui ho chiesto aiuto. Comunque grazie, per ora rinuncio. Se il proprietario cambia idea, mi può chiamare?"
    - tutor: "Sì, così. Certo, la chiamo io se ci sono novità. Intanto in bocca al lupo per la ricerca."
      goals: [conclude]

- scenario: burocrazia-residenza

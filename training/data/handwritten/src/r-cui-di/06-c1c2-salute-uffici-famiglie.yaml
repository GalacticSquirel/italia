- scenario: intervista-radio
  # facts: l'autrice vive a Torino da dodici anni; il libro è una raccolta di ritratti dei vicini di casa, nato da appunti sul telefono; l'idea del coraggio va attribuita all'editore; il vicino del quarto piano ha quarantadue anni, telefona alla madre più spesso delle studentesse dell'autrice, porta la spesa a tre vedove ogni domenica; la portinaia le ha corretto il congiuntivo davanti al condominio
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun, comparative]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, e grazie del coraggio che mi attribuisce: in realtà l'incoscienza è stata tutta del mio editore. Il libro è una raccolta di ritratti dei miei vicini di casa a Torino, dove vivo da dodici anni."
    - tutor: "Ritratti dei vicini: spero che nessuno l'abbia ancora denunciata! Perché ha deciso di scriverlo?"
    # decoy: «a cui dobbiamo di più» and «di cui sappiamo di meno» are correct
    - learner: "Perché i vicini sono le persone a cui dobbiamo di più e di cui sappiamo di meno, e questo paradosso è la ragione che ho cominciato a prendere appunti."
      errors: [relative-pronoun]
      gold: {text: "la ragione che", fix: "la ragione per cui"}
    - tutor: "Un paradosso elegante. Però «la ragione che ho cominciato a prendere appunti»: lei ha cominciato a causa di quella ragione. Quale preposizione serve davanti al relativo?"
      goals: [present-book]
      prompt: {text: "la ragione che", tags: [relative-pronoun]}
    - learner: "La ragione per cui ho cominciato a prendere appunti, sì. All'inizio erano solo note sul telefono, scritte in ascensore."
    - tutor: "Così è corretto. Ora la provoco: nel libro conferma che gli italiani sono tutti mammoni?"
    # decoy: «l'uomo più indipendente che conosca» is correct
    - learner: "Lo confermo solo in parte. Il mio vicino del quarto piano, che ha quarantadue anni, telefona alla madre più spesso che le mie studentesse di vent'anni, ma è anche l'uomo più indipendente che conosca."
      errors: [comparative]
      gold: {text: "più spesso che le mie studentesse", fix: "più spesso delle mie studentesse"}
    # agree: content
    - tutor: "Quindi lo stereotipo regge, ma con le dovute sfumature: mi pare un'osservazione onesta. Però «più spesso che le mie studentesse»: confronta il vicino con le studentesse. Quale preposizione, con l'articolo, introduce il secondo termine?"
      goals: [stereotype]
      prompt: {text: "più spesso che le mie studentesse", tags: [comparative]}
    - learner: "Più spesso delle mie studentesse, ecco. Ma il mammone, nel libro, è anche quello che ogni domenica porta la spesa a tre vedove del palazzo."
    - tutor: "Un mammone altruista, dunque. Ci racconti un aneddoto che dica qualcosa di lei, oltre che dei suoi vicini."
    - learner: "La portinaia, una signora i quali consigli non ho mai chiesto ma ho sempre ricevuto, un giorno mi ha corretto il congiuntivo davanti a tutto il condominio."
      errors: [relative-pronoun]
      gold: {text: "una signora i quali consigli", fix: "una signora i cui consigli"}
    - tutor: "Una scena impagabile. Ma, visto che parliamo di grammatica, «una signora i quali consigli»: i consigli sono della signora. Quale relativo esprime il possesso?"
      goals: [anecdote]
      prompt: {text: "una signora i quali consigli", tags: [relative-pronoun]}
    - learner: "Una signora le cui consigli non ho mai chiesto."
      errors: [relative-pronoun]
    - tutor: "Una portinaia i cui consigli arrivano senza essere chiesti: ogni condominio ne ha una. E l'italiano, che cosa ha cambiato in lei?"
      recast: {text: "le cui consigli", fix: "i cui consigli", tags: [relative-pronoun]}
    # decoy: «vale più di un ordine» and «più diretta che diplomatica» are correct
    - learner: "Mi ha insegnato a chiedere con il condizionale anche quando pretendo, e che una frase gentile vale più di un ordine. In spagnolo sono più diretta che diplomatica; in italiano, il contrario."
    - tutor: "Una lezione che molti italiani dovrebbero imparare dalla sua portinaia. Ci lascia con una frase da ricordare?"
      goals: [language]
    # decoy: «più vicina di quanto sembri» is correct
    - learner: "Dirò questo: in Italia ho imparato che la porta di un vicino è sempre più vicina di quanto sembri, soprattutto quando hai finito lo zucchero."
    - tutor: "Bellissima. Grazie di essere stata con noi, e in bocca al lupo per il libro!"
      goals: [farewell]

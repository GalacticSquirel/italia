# B1, more correction-dense dialogues.
- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra si mangia il tacchino con le patate, e dopo pranzo tutti guardano il discorso del re in TV."
    - tutor: "Il discorso del re, che tradizione curiosa! E quando eri piccola, cosa facevi la mattina di Natale?"
      goals: [compare]
      new: [{lemma: discorso, gloss: speech}]
    - learner: "Mi svegliavo prestissimo e correvo a vedere i regali. Mio fratello e io aprevamo tutto in cinque minuti."
      errors: [imperfetto-form]
    - tutor: "Tu e tuo fratello cosa facevate con i regali? Prova di nuovo con aprire."
      prompt: {text: "aprevamo", tags: [imperfetto-form]}
    - learner: "Aprivamo tutto in cinque minuti!"
      goals: [past]
    - tutor: "Esatto! Anche noi eravamo velocissimi. Tu vuoi sapere qualcosa delle nostre feste?"
      goals: [past]
    - learner: "Sì! È vero che il primo dell'anno mangiate lenticchie?"
    - tutor: "Sì, è vero! Si dice che portano soldi per tutto l'anno."
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Che bello! E per il pranzo, cosa posso portare? Posso fare dei biscotti inglesi."
    - tutor: "Perfetto, i biscotti vanno benissimo! Mia nonna sarà curiosa di provarli."
      goals: [plan]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [conditional-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Bene, abbiamo finito la campagna per il cliente di Milano e l'abbiamo presentata ieri."
    - tutor: "Ottimo lavoro! E il cliente cosa ha detto?"
      goals: [update]
    - learner: "Gli è piaciuta, però vuole cambiare i colori, e il grafico è malato questa settimana."
      goals: [problem]
    - tutor: "Ah, che peccato. Quindi rischiamo un ritardo. Hai qualche proposta?"
      goals: [problem]
    - learner: "Potrei chiedere aiuto a Luca, e lui farebbe i colori nuovi. Sarebbe una buona idea?"
      goals: [proposal]
    - tutor: "Sì, mi sembra una buona idea. Luca ha tempo questa settimana. Quando pensi di finire?"
      goals: [proposal]
    - learner: "Se Luca comincia oggi, potremo mandare tutto al cliente giovedì. Ma preferirebbi venerdì, per sicurezza."
      errors: [conditional-form]
    - tutor: "Come, scusa? Prova di nuovo: stai parlando di te, non di lui."
      prompt: {text: "preferirebbi", tags: [conditional-form]}
    - learner: "Preferirei venerdì, per sicurezza."
    - tutor: "Va bene, allora la scadenza è venerdì. Scrivo io al cliente."
      goals: [deadline]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Carmen, sono spagnola e abito in Italia da tre anni. Sono insegnante di lingue."
    - tutor: "Piacere, Carmen. E qual è la sua esperienza di lavoro?"
      goals: [intro]
    - learner: "Ho insegnato spagnolo per dieci anni in una scuola di Valencia. Poi ho lavorato per una azienda di traduzioni."
      goals: [experience]
    - tutor: "Molto interessante. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Sono precisa e organizzata. Sono brava a spiegare le cose difficili in modo semplice."
    - tutor: "Ottimo, per noi è importante. E un suo punto debole?"
    - learner: "A volte ho difficoltà di dire di no, quindi lavoro troppo."
      errors: [preposition]
    - tutor: "Ho difficoltà di dire? Pensi alla preposizione..."
      prompt: {text: "ho difficoltà di dire", tags: [preposition]}
      new: [{lemma: preposizione, gloss: preposition}]
    - learner: "Ho difficoltà a dire di no!"
      goals: [strengths]
    - tutor: "Esatto! E perché vuole lavorare con noi?"
      goals: [strengths]
    - learner: "Perché la vostra scuola usa metodi moderni e io vorrei imparare cose nuove."
      goals: [why]
    - tutor: "Ha qualche domanda sul lavoro?"
      goals: [why]
    - learner: "Sì: quante ore di lezione dovrei fare alla settimana?"
    - tutor: "Circa venti ore, dal lunedì al venerdì. Le daremo una risposta entro la fine della settimana. Grazie!"
      goals: [questions]

- scenario: film-libro
  level: B1
  persona: es-m-worker
  history: [word-order]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io non ho letto un libro, ho visto un film: «La grande bellezza». Parla di uno scrittore a Roma."
    - tutor: "Va bene anche un film! Racconta la trama senza svelare il finale."
      goals: [summary]
      new: [{lemma: svelare, gloss: to reveal}]
    - learner: "Lo scrittore compie sessantacinque anni e pensa alla sua vita. Va a molte feste, ma non è felice."
      goals: [summary]
    - tutor: "E com'è il personaggio principale?"
      goals: [summary]
    - learner: "È un uomo elegante e ironico. È un personaggio molto triste, ma anche divertente."
      goals: [characters]
    - tutor: "È vero. E a te il film è piaciuto?"
      goals: [characters]
    - learner: "Sì, mi è piaciuto molto. Le immagini di Roma sono bellissime, ma la storia è un po' lenta. È un film per chi ama l'arte."
      goals: [opinion, recommend]
    - tutor: "Sono d'accordo, è un film da vedere più volte. Grazie, Diego! Chi vuole continuare?"
      goals: [opinion, recommend]

- scenario: affittare-appartamento
  level: B1
  persona: en-m-traveller
  history: [ce-ci-sono]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno! Wow, è grande. Quanto costa l'affitto?"
    - tutor: "L'affitto è di 650 euro al mese. Le spese di condominio sono a parte, circa 60 euro."
      goals: [rent]
    - learner: "Va bene. E il contratto? Io resto in Italia solo un anno."
    - tutor: "Per un anno possiamo fare un contratto transitorio. La caparra è di due mesi."
      goals: [contract]
      new: [{lemma: transitorio, gloss: temporary}]
    - learner: "Perfetto. Nella cucina è una lavastoviglie?"
      errors: [ce-ci-sono]
    - tutor: "È una lavastoviglie? Vuole sapere se esiste..."
      prompt: {text: "è una lavastoviglie", tags: [ce-ci-sono]}
      new: [{lemma: lavastoviglie, gloss: dishwasher}]
    - learner: "Ah, sì: c'è una lavastoviglie?"
    - tutor: "Esatto. Sì, c'è, ed è nuova. Anche il riscaldamento funziona benissimo."
      goals: [condition]
    - learner: "Ottimo. Com'è il quartiere? Ci sono bar e locali vicino?"
    - tutor: "Sì, è un quartiere giovane, con tanti bar e una piazza molto viva la sera."
      goals: [neighbourhood]
    - learner: "Perfetto per me! Mi piace molto, vorrei prenderlo."
    - tutor: "Benissimo! Allora le preparo il contratto per lunedì."
      goals: [decide]

- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Buenos Aires, in un quartiere che si chiama La Boca. È molto colorato."
    - tutor: "Lo conosco dalle foto, è bellissimo! Cosa facevi di solito da bambino?"
      goals: [place]
    - learner: "Giocavo a calcio in strada con i miei amici tutti i pomeriggi. Mia madre mi chiamava sempre dalla finestra."
      goals: [habits]
    - tutor: "Che bel ricordo! E la scuola ti piaceva?"
      goals: [habits]
    - learner: "Non molto. Ero sempre stanco perché giocavo troppo! Ma la maestra di matematica era simpatica."
      goals: [school]
    - tutor: "Ah, che ridere! C'è un ricordo speciale della tua infanzia?"
      goals: [school]
      new: [{lemma: infanzia, gloss: childhood}]
    - learner: "Sì, quando avevo dieci anni, mio padre mi portava allo stadio per la prima volta."
      errors: [tense-aspect]
    - tutor: "Mi portava allo stadio? Parli di una volta sola..."
      prompt: {text: "mi portava allo stadio", tags: [tense-aspect]}
    - learner: "Sì, mi portava allo stadio... per vedere il Boca."
      errors: [tense-aspect]
    - tutor: "Ah, tuo padre ti ha portato allo stadio per la prima volta! Che emozione deve essere stata."
      goals: [event]
      recast: {text: "mi portava allo stadio", fix: "ti ha portato allo stadio", tags: [tense-aspect]}

- scenario: medico-base
  level: B1
  persona: es-f-erasmus
  history: [essere-avere]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Sono la febbre da ieri e mi fa male la testa."
      errors: [essere-avere]
    - tutor: "Sono la febbre? Ci pensi un attimo..."
      prompt: {text: "Sono la febbre", tags: [essere-avere]}
    - learner: "Ho la febbre da ieri, scusi."
      goals: [symptoms, since-when]
    - tutor: "Esatto. Quanto è alta la febbre?"
      goals: [symptoms, since-when]
    - learner: "Ieri sera era trentotto e mezzo. Ho anche un po' di tosse."
    - tutor: "Capisco. È allergica a qualche medicina?"
    - learner: "Sì, sono allergica alla penicillina."
      goals: [history]
    - tutor: "Va bene, grazie. Allora le do una medicina senza penicillina. La prenda due volte al giorno per cinque giorni."
      goals: [history]
      new: [{lemma: penicillina, gloss: penicillin}]
    - learner: "Due volte al giorno per cinque giorni. Devo restare a casa?"
    - tutor: "Sì, resti a casa e si riposi fino a quando non ha più la febbre."
      goals: [instructions]

- scenario: prenotare-visita
  level: B1
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno. Vorrei prenotare una visita dal dermatologo per mio padre. Lui non parla bene al telefono."
    - tutor: "Certo, nessun problema. È una prima visita?"
      goals: [type]
    - learner: "Sì, è la prima volta. Avete un appuntamento la prossima settimana?"
    - tutor: "Ho mercoledì alle 11 oppure venerdì alle 15:30. Quale preferisce?"
    - learner: "Venerdì alle 15:30, perché così posso accompagnarlo io."
      goals: [availability]
    - tutor: "Perfetto. La visita costa 80 euro. Le serve la fattura?"
      goals: [availability, cost]
      new: [{lemma: fattura, gloss: invoice}]
    - learner: "Sì, grazie. Me la potete mandare per email?"
    - tutor: "Sì, gliela mandiamo dopo la visita. Mi ripete i dati, per favore?"
    - learner: "Venerdì alle 15:30, dermatologo, prima visita, 80 euro, per Giuseppe Russo."
    - tutor: "Esatto, tutto confermato. Buona giornata!"
      goals: [confirm]

# B1, mixed scenes with corrections, second set.
- scenario: banca-conto
  level: B1
  persona: en-f-student
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Sono una studentessa inglese e voglio di aprire un conto qui in Italia."
      errors: [modal-infinitive]
    - tutor: "Voglio di aprire? Dopo volere..."
      prompt: {text: "voglio di aprire", tags: [modal-infinitive]}
    - learner: "Voglio aprire un conto, scusi!"
      goals: [purpose]
    - tutor: "Esatto. Certo, per gli studenti abbiamo un conto speciale. Ha già il codice fiscale?"
      goals: [purpose]
    - learner: "Sì, ce l'ho. Quali altri documenti mi servono?"
      goals: [documents]
    - tutor: "Basta un documento d'identità e una lettera dell'università. Li ha con sé?"
      goals: [documents]
    - learner: "Sì, eccoli. Quanto costa il conto al mese?"
    - tutor: "Per gli studenti non costa niente fino a 26 anni."
      goals: [costs]
    - learner: "Fantastico. Posso avere anche una carta per pagare nei negozi e un'app?"
    - tutor: "Sì, la carta è compresa e l'app la può scaricare già oggi. Firmi qui, per favore."
      goals: [card]
      new: [{lemma: scaricare, gloss: to download}]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Partirò fra due settimane. Starò dieci giorni, perché voglio vedere anche la città dei miei nonni."
      goals: [plans]
    - tutor: "Che bello! Dove abitavano i tuoi nonni?"
      goals: [plans]
    - learner: "A Pozzuoli, vicino a Napoli. Cosa mi consigli di vedere lì?"
    - tutor: "A Pozzuoli devi assolutamente vedere l'anfiteatro e mangiare il pesce al porto."
      goals: [advice]
      new: [{lemma: anfiteatro, gloss: amphitheatre}]
    - learner: "Perfetto! E come ci arrivo da Napoli? Con la metro?"
    - tutor: "Sì, con la metro o con il treno locale. Ci vuole mezz'ora."
      goals: [transport]
    - learner: "Ottimo. Penso che anderò il primo giorno."
      errors: [future-form]
    - tutor: "Quando ci vai, scusa? Prova di nuovo con il futuro di andare."
      prompt: {text: "anderò", tags: [future-form]}
    - learner: "Andrò il primo giorno! E c'è qualcosa da evitare?"
    - tutor: "Esatto! Evita il traffico dell'ora di punta e non cambiare soldi per strada. Per il resto, goditi la città!"
      goals: [warnings]
      new: [{lemma: godersi, gloss: to enjoy}]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Argentina a Natale fa caldo! Si mangia carne alla griglia e si fa festa fino a tardi."
    - tutor: "Natale con il caldo, che strano per noi! E da bambino, come lo festeggiavi?"
      goals: [compare]
    - learner: "Andavamo dalla nonna. A mezzanotte uscivamo in strada per guardare i fuochi d'artificio."
      goals: [past]
    - tutor: "Che bello! Tu vuoi sapere qualcosa sulle nostre tradizioni?"
      goals: [past]
    - learner: "Sì. Cosa si mangia a Capodanno in Italia?"
      goals: [ask]
    - tutor: "Si mangiano le lenticchie, che secondo la tradizione portano fortuna."
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Interessante! E per il pranzo di Natale, che cosa porto io?"
    - tutor: "Puoi portare un dolce del tuo paese, se vuoi. Sarebbe una bella sorpresa!"
      goals: [plan]
    - learner: "Allora porto gli alfajores, sono dei biscotti con il dulce de leche."
    - tutor: "Perfetto, li proveremo tutti con piacere!"

- scenario: riunione-lavoro
  level: B1
  persona: es-f-teacher
  history: [stare-gerund]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Va bene. In questo momento sono scrivendo il manuale per i nuovi clienti."
      errors: [stare-gerund]
    - tutor: "Sono scrivendo? In italiano si dice in un altro modo..."
      prompt: {text: "sono scrivendo", tags: [stare-gerund]}
    - learner: "Sto scrivendo il manuale per i nuovi clienti."
      goals: [update]
    - tutor: "Esatto! A che punto sei?"
      goals: [update]
    - learner: "Ho finito tre capitoli su cinque. Però c'è un problema: mi mancano le informazioni tecniche."
      goals: [problem]
    - tutor: "Capisco. Chi ti dovrebbe dare queste informazioni?"
      goals: [problem]
    - learner: "Il reparto tecnico. Potremmo organizzare una riunione con loro giovedì?"
      goals: [proposal]
    - tutor: "Ottima idea, la organizzo io. Quando pensi di finire, allora?"
      goals: [proposal]
    - learner: "Se ho le informazioni giovedì, finirò entro la fine del mese."
    - tutor: "Perfetto, allora la scadenza è la fine del mese. Grazie!"
      goals: [deadline]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Ho fatto un viaggio in Grecia per tre settimane, da un'isola all'altra."
      goals: [where]
    - tutor: "Che bello! E com'era il tempo?"
      goals: [where]
    - learner: "C'era sempre il sole e faceva molto caldo, ma il vento era forte."
      goals: [weather]
    - tutor: "Il famoso vento delle isole! E cosa hai fatto di bello?"
      goals: [weather]
    - learner: "Nuotavo tutti i giorni e una volta facevo un'escursione in barca a vela."
      errors: [tense-aspect]
    - tutor: "Una volta facevo? È successo una volta sola..."
      prompt: {text: "una volta facevo", tags: [tense-aspect]}
    - learner: "Una volta ho fatto un'escursione in barca a vela!"
      goals: [activities]
    - tutor: "Esatto! E cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Le persone. Ho conosciuto tanti viaggiatori di tutto il mondo."
    - tutor: "È la cosa più bella dei viaggi! Mi devi raccontare di più davanti a un caffè."
      goals: [best]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Michael, sono canadese, ma la mia famiglia è italiana. Ho studiato architettura a Toronto."
    - tutor: "Molto bene. E qual è la sua esperienza di lavoro?"
      goals: [intro]
    - learner: "Ho lavorato quattro anni in uno studio di architettura. Attualmente lavoro come libero professionista."
      goals: [experience]
    - tutor: "Interessante. Quali sono le sue competenze principali?"
      goals: [experience]
      new: [{lemma: competenza, gloss: skill}]
    - learner: "Sono bravo con i programmi di disegno e lavoro bene in squadra. Però a volte sono troppo eccitato per i progetti nuovi."
      errors: [false-friend]
    - tutor: "Ah, quindi è molto entusiasta dei progetti nuovi. Non è un grande problema!"
      goals: [strengths]
      recast: {text: "troppo eccitato per i progetti nuovi", fix: "entusiasta dei progetti nuovi", tags: [false-friend]}
      new: [{lemma: entusiasta, gloss: enthusiastic}]
    - learner: "Sì, entusiasta! Vorrei lavorare qui perché amo i vostri progetti di case ecologiche."
      goals: [why]
    - tutor: "Grazie. Ha qualche domanda sul ruolo?"
      goals: [why]
    - learner: "Sì: dovrei lavorare anche con i clienti, o solo con la squadra?"
    - tutor: "Anche con i clienti, soprattutto all'inizio dei progetti. Le faremo sapere presto. Grazie, Michael!"
      goals: [questions]

- scenario: restituire-prodotto
  level: B1
  persona: es-m-worker
  history: [noun-number]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato queste cuffie ieri, ma una parte non funziona. Si sente solo a sinistra."
    - tutor: "Mi dispiace. Le ha provate con più telefoni?"
      goals: [problem]
    - learner: "Sì, con due telefoni diversi. Ecco lo scontrino di ieri."
      goals: [proof]
    - tutor: "Grazie. Allora sono difettose, nessun problema. Vuole un rimborso o un altro paio?"
      goals: [proof]
    - learner: "Preferisco un altro paio uguale, perché il suono è molto buono."
      goals: [request]
    - tutor: "Va bene. Vado a prenderle in magazzino e le proviamo qui insieme."
      goals: [request]
      new: [{lemma: magazzino, gloss: stockroom}]
    - learner: "Perfetto. Così sono sicuro che funzionano."
    - tutor: "Ecco, funzionano benissimo da tutte e due le parti. Buona giornata!"
      goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: en-f-student
  history: [conditional-form]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Mi scusi, sono Emily, abito al secondo piano, proprio sotto di lei."
      goals: [greet]
    - tutor: "Ah, buonasera Emily. Mi dica pure."
      goals: [greet]
    - learner: "Il suo cane abbaia molto quando lei esce, a volte per ore. Io studio a casa e non riesco a concentrarmi."
      goals: [problem]
    - tutor: "Oh, non lo sapevo! Mi dispiace davvero. Quando succede, di solito?"
      goals: [problem]
      new: [{lemma: abbaiare, gloss: to bark}]
    - learner: "Soprattutto la mattina, dalle nove all'una. Potrebbe trovare una soluzione?"
      goals: [request]
    - tutor: "Certo. Potrei portarlo da mia sorella la mattina, almeno tre giorni a settimana. Le andrebbe bene?"
      goals: [request]
    - learner: "Sì, sarebbe fantastico. E gli altri giorni io potrei andare in biblioteca."
    - tutor: "Perfetto, allora facciamo così. Grazie per la pazienza, Emily!"
      goals: [compromise]

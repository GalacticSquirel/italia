# B1, informal conversations with friends and coaches.
- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì prossimo e resto cinque giorni. Vado con la mia amica Kate."
    - tutor: "Che bello, cinque giorni sono perfetti! Avete già un'idea di cosa fare?"
      goals: [plans]
    - learner: "Non ancora. Cosa mi consigli di vedere? E dove posso mangiare la pizza migliore?"
    - tutor: "Visita assolutamente il centro e il museo di Capodimonte. Per la pizza, vai nel quartiere dei Tribunali: lì ce ne sono tante buonissime."
      goals: [advice]
    - learner: "Perfetto! E per muoversi in città? È meglio prendere la metro o il bus?"
    - tutor: "Prendi la metro, è più veloce. Se vuoi andare a Capri o a Procida, ci vai in traghetto dal porto."
      goals: [transport]
    - learner: "Ottimo. C'è qualcosa che devo evitare?"
    - tutor: "Evita di guidare in centro, c'è troppo traffico! E tieni sempre il telefono in tasca sull'autobus pieno."
      goals: [warnings]
    - learner: "Grazie mille, Valentina! Ti mando una foto della pizza."
    - tutor: "Sì, mandamela! Buon viaggio e divertitevi!"

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [imperative-form]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto domenica. Vado per lavoro, ma ho due giorni liberi."
    - tutor: "Due giorni liberi vanno benissimo. Cosa ti piacerebbe fare?"
      goals: [plans]
    - learner: "Mi piace molto la cucina. Dimmi cosa devo mangiare, e cosa visitare."
    - tutor: "Allora prova la pizza e la sfogliatella! E visita i mercati del centro, ti piaceranno."
      goals: [advice]
      new: [{lemma: sfogliatella, gloss: Neapolitan filled pastry}]
    - learner: "Come arrivo dall'aeroporto al centro?"
    - tutor: "C'è un autobus diretto. In venti minuti sei alla stazione centrale."
      goals: [transport]
    - learner: "E c'è qualcosa da evitare? Dimmi la verità."
    - tutor: "Allora, non prendere i taxi senza chiedere prima il prezzo. E non lasciare niente in macchina."
      goals: [warnings]
    - learner: "Va bene. Non prende il taxi senza chiedere il prezzo."
      errors: [imperative-form]
    - tutor: "Non prende? Stai dando un consiglio a te, quindi..."
      prompt: {text: "Non prende", tags: [imperative-form]}
    - learner: "Ah, non prendere il taxi. Ho capito, grazie Valentina!"
    - tutor: "Esatto! Buon viaggio, e mangia una pizza anche per noi!"

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao. Lavoro in ufficio tutto il giorno, quindi sto seduto molto. Mangio spesso al bar e dormo poco."
    - tutor: "Capisco, è una situazione molto comune. Quante ore dormi, più o meno?"
      goals: [habits]
    - learner: "Sei ore. Il mio obiettivo è perdere cinque chili e essere più in forma che l'anno scorso."
      errors: [comparative]
    - tutor: "Più in forma che l'anno scorso? Davanti a un tempo come l'anno scorso, cosa ci vuole dopo più?"
      goals: [goal]
      prompt: {text: "più in forma che l'anno scorso", tags: [comparative]}
    - learner: "Più in forma dell'anno scorso! Lo sapevo, ma è difficile."
    - tutor: "Bravo, perfetto. E cosa ti impedisce di allenarti adesso?"
      new: [{lemma: impedire, gloss: to prevent}]
    - learner: "Soprattutto lo stress e il tempo. La sera sono sempre stanco."
    - tutor: "Allora facciamo un piano semplice: tre allenamenti a settimana, la mattina presto, di 40 minuti. Ti va?"
      goals: [obstacles]
    - learner: "Sì, mi va. Lunedì, mercoledì e venerdì alle sette?"
    - tutor: "Perfetto! E proviamo a dormire almeno sette ore. Ci vediamo lunedì alle sette."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: es-f-erasmus
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Cammino molto, perché vado all'università a piedi. Però mangio troppi dolci."
    - tutor: "Camminare è già un'ottima abitudine! E i dolci, quando li mangi di solito?"
      goals: [habits]
    - learner: "Soprattutto la sera, quando studio. Vorrei mangiare più sano e fare sport due volte a settimana."
    - tutor: "Ottimo obiettivo. Che cosa ti ha fermato finora?"
      goals: [goal]
    - learner: "Sono un po' pigra. E la palestra costa troppo per una studentessa."
    - tutor: "Capisco. Allora possiamo allenarci al parco, che è gratis. Ti piace correre?"
      goals: [obstacles]
      new: [{lemma: gratis, gloss: free of charge}]
    - learner: "Sì, mi piace, ma non sono molto veloce."
    - tutor: "Non importa, si comincia piano. Che ne dici di martedì e giovedì, mezz'ora di corsa al parco?"
    - learner: "Va bene! E la sera mangio frutta invece dei dolci."
    - tutor: "Perfetto, è un ottimo piano. Ci vediamo martedì al parco!"
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-retired
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Ohio si mangia il tacchino, come a novembre. La mattina di Natale si aprono i regali."
    - tutor: "Ah, quindi i regali li aprite la mattina! Da noi molti li aprono la sera della Vigilia. E quando eri bambino, com'era il Natale?"
      goals: [compare]
      new: [{lemma: Vigilia, gloss: Christmas Eve}]
    - learner: "Quando ero bambino, andavamo dai nonni. Mio nonno faceva un dolce di mele e noi giocavamo nella neve."
    - tutor: "Che bel ricordo! La neve a Natale qui da noi è rara."
      goals: [past]
    - learner: "E voi? Quale tradizione è più importante per la tua famiglia?"
    - tutor: "Per noi è il pranzo del 25 con tutti i parenti. Dura quattro ore, a volte cinque!"
      goals: [ask]
    - learner: "Cinque ore! Allora, cosa porto al pranzo? Un vino o un dolce?"
    - tutor: "Porta un panettone, se vuoi, ma non è necessario. Basta che vieni con tanta fame!"
      goals: [plan]
      new: [{lemma: panettone, gloss: Italian Christmas cake}]
    - learner: "Va bene, porto il panettone e tanta fame!"
    - tutor: "Perfetto! Allora ti aspettiamo il 25 alle 12."

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna la festa più importante per i bambini è il 6 gennaio, quando arrivano i Re Magi con i regali."
    - tutor: "Ah, che interessante! Da noi il 6 gennaio arriva la Befana, una vecchia signora che porta dolci ai bambini."
      goals: [compare]
      new: [{lemma: Befana, gloss: Epiphany witch who brings gifts}]
    - learner: "Sì, la conosco! Quando ero piccola, la sera prima noi lasciavamo le scarpe fuori dalla porta."
    - tutor: "Una tradizione simile alla nostra! E che cosa trovavi nelle scarpe la mattina?"
      goals: [past]
    - learner: "Trovavo regali e dolci. Ma tu, ci sono delle tradizioni a Natale che io non conosco?"
    - tutor: "Ce ne sono tante! Per esempio, alla Vigilia molte famiglie non mangiano carne, solo pesce."
      goals: [ask]
      new: [{lemma: Vigilia, gloss: Christmas Eve}]
    - learner: "Che bello. Per il pranzo di Natale, cosa posso portare?"
    - tutor: "Puoi portare un dolce spagnolo, se ti va! A mia madre piacciono le novità."
      goals: [plan]
    - learner: "Allora porto il turrón, un dolce tipico di Natale da noi."
    - tutor: "Perfetto, sono sicura che piacerà a tutti. Ci vediamo a pranzo!"

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao! Sì, vorrei fare qualcosa di utile. Mi sono trasferita a Milano da poco e voglio conoscere persone nuove."
    - tutor: "È un ottimo motivo! Che cosa sai fare, o che esperienza hai?"
      goals: [motivation]
    - learner: "Lavoro nel marketing. So organizzare eventi e scrivere testi per i social."
    - tutor: "Perfetto, ci servono proprio queste competenze. Quanto tempo libero hai?"
      goals: [skills]
      new: [{lemma: competenza, gloss: skill}]
    - learner: "Ho tempo il sabato mattina. È l'unico giorno che sono libera."
      errors: [relative-pronoun]
    - tutor: "L'unico giorno che sei libera? Pensa a come si collega giorno al resto della frase."
      goals: [time]
      prompt: {text: "L'unico giorno che sono libera", tags: [relative-pronoun]}
    - learner: "L'unico giorno in cui sono libera!"
    - tutor: "Esatto! Il sabato abbiamo due attività: la spesa con gli anziani oppure la festa del quartiere. Quale preferisci?"
    - learner: "Preferisco la festa del quartiere, perché posso aiutare con l'organizzazione."
    - tutor: "Ottima scelta! Ti scrivo il nome della responsabile. Ci vediamo sabato!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-traveller
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! L'anno scorso ho fatto volontariato in Irlanda con i bambini e mi è piaciuto molto."
    - tutor: "Bellissimo! Perché lo vuoi fare anche qui in Italia?"
    - learner: "Perché voglio aiutare le persone e anche migliorare il mio italiano."
    - tutor: "Due ottimi motivi! E oltre ai bambini, che cosa sai fare?"
      goals: [motivation]
    - learner: "So cucinare bene e so suonare la chitarra. Posso anche insegnare l'inglese."
    - tutor: "Benissimo! E quanto tempo potresti dedicare all'associazione?"
      goals: [skills]
      new: [{lemma: dedicare, gloss: to devote}]
    - learner: "Potrei venire due pomeriggi a settimana, il martedì e il giovedì."
    - tutor: "Perfetto. Il martedì facciamo i compiti con i bambini e il giovedì cuciniamo per la mensa. Cosa ti piacerebbe?"
      goals: [time]
      new: [{lemma: mensa, gloss: canteen}]
    - learner: "Tutti e due, se è possibile! Ma se devo scegliere, preferisco i compiti con i bambini."
    - tutor: "Va bene, allora cominci martedì con i bambini. Benvenuto nell'associazione!"
      goals: [choose]

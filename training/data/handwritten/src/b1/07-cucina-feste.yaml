# B1, cooking and planning a party (informal), more complaints (formal).
- scenario: cucina-ricetta
  level: B1
  persona: es-m-worker
  history: [imperative-form]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Stasera facciamo le empanadas argentine. Servono carne, cipolla, uova, olive e la pasta per le empanadas."
    - tutor: "Che buone! Non le ho mai fatte. Come cominciamo?"
      goals: [ingredients]
      new: [{lemma: empanada, gloss: Argentine filled pastry}]
    - learner: "Prima tagli la cipolla piccola piccola e la cuoci in una pentola con un po' di olio."
    - tutor: "Fatto! E adesso cosa faccio con la carne?"
      goals: [steps]
    - learner: "Aggiunga la carne e il sale, e mescola bene per dieci minuti."
      errors: [imperative-form]
    - tutor: "Aggiunga? Prima mi davi del tu..."
      prompt: {text: "Aggiunga", tags: [imperative-form]}
    - learner: "Ah, giusto: aggiungi la carne e il sale, e mescola bene."
    - tutor: "Perfetto, aggiungo tutto e giro bene. Quanto tempo devono cuocere in forno, poi?"
      new: [{lemma: forno, gloss: oven}]
    - learner: "Venti minuti a duecento gradi, fino a quando sono dorate."
    - tutor: "Venti minuti, va bene. E come si servono? Calde o fredde?"
      goals: [time]
    - learner: "Calde, con un bicchiere di vino rosso. In Argentina le mangiamo anche con le mani."
    - tutor: "Allora stasera si mangia con le mani! Non vedo l'ora."
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Facciamo un curry di verdure. Ci vogliono patate, carote, cipolla, latte di cocco e spezie."
    - tutor: "Buono! Ho comprato tutto stamattina. Da dove cominciamo?"
      goals: [ingredients]
    - learner: "Prima taglia le patate e le carote. Poi li metti in acqua per cinque minuti."
      errors: [object-pronoun]
    - tutor: "Li metti? Le patate e le carote sono..."
      prompt: {text: "li metti", tags: [object-pronoun]}
    - learner: "Le metti in acqua per cinque minuti!"
    - tutor: "Esatto! Le metto in acqua. E poi cosa faccio?"
      goals: [steps]
    - learner: "La cipolla la cuoci con l'olio e le spezie, poi aggiungi le verdure e il latte di cocco."
    - tutor: "Che profumo già adesso! Per quanto tempo deve cuocere?"
    - learner: "Circa venti minuti, a fuoco basso. Bisogna mescolare ogni tanto."
    - tutor: "Va bene. E con cosa lo serviamo?"
      goals: [time]
      new: [{lemma: curry, gloss: curry}]
    - learner: "Con il riso bianco e un po' di yogurt sopra, se ti piace."
    - tutor: "Mi piace molto! Allora preparo il riso mentre il resto cuoce."
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: en-m-retired
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Stasera faccio la torta di mele di mia madre. Ci vogliono quattro mele, farina, zucchero, burro e due uova."
    - tutor: "Che buona! Abbiamo tutto. Cosa faccio per prima cosa?"
      goals: [ingredients]
    - learner: "Prima sbatti le uova con lo zucchero. Poi aggiungi il burro e la farina, poco alla volta."
    - tutor: "Va bene, sbatto le uova. E le mele quando le aggiungo?"
      goals: [steps]
    - learner: "Le tagli a fette sottili e le metti sopra la torta, alla fine."
    - tutor: "Perfetto. Quanto tempo deve stare in forno?"
      new: [{lemma: forno, gloss: oven}]
    - learner: "Quaranta minuti a centottanta gradi. Ma se la torta diventa troppo scura, la copri con la carta."
    - tutor: "Ottimo consiglio! E come la serviamo?"
      goals: [time]
    - learner: "La serviamo tiepida, con un po' di gelato alla vaniglia. Mia madre faceva così."
    - tutor: "Che bello cucinare un dolce di famiglia. Non vedo l'ora di assaggiarla!"
      goals: [serve]
      new: [{lemma: assaggiare, gloss: to taste}]

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Possiamo fare una festa a sorpresa sabato sera, a casa mia. Il mio appartamento è abbastanza grande."
    - tutor: "Ottima idea! Sabato sera a casa tua, allora. Chi invitiamo?"
      goals: [date]
    - learner: "Invitiamo i suoi amici dell'università e i colleghi. Circa venti persone."
    - tutor: "Benissimo. E da mangiare? Facciamo una cena o qualcosa di semplice?"
      goals: [guests]
    - learner: "Qualcosa di semplice: pizza e patatine. E la torta la ordino in pasticceria."
    - tutor: "Perfetto. Per il regalo, avevi un'idea?"
      goals: [food]
    - learner: "Sì, Sara vuole una borsa nuova. La compriamo insieme e lo diamo dopo la torta."
      errors: [combined-pronouns]
    - tutor: "Lo diamo? Pensa a cosa diamo e a chi..."
      prompt: {text: "lo diamo", tags: [combined-pronouns]}
    - learner: "Ah, gliela diamo dopo la torta!"
    - tutor: "Esatto! Allora domani andiamo a scegliere la borsa. Sarà una festa bellissima!"
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: es-f-erasmus
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Il suo compleanno è venerdì. Potremmo fare un aperitivo in un bar e poi andare a ballare."
    - tutor: "Mi piace! Quale bar?"
    - learner: "Il bar in piazza, quello con la terrazza. Lo prenoterò io domani."
    - tutor: "Perfetto. Chi invitiamo?"
      goals: [date]
    - learner: "I ragazzi del corso di italiano e le sue coinquiline. Le scriverò un messaggio."
    - tutor: "Ottimo. E la torta? Al bar non si può portare una torta, credo."
      goals: [guests]
    - learner: "Allora chiederò al barista se possono fare una piccola torta. Così mangeremo il dolce lì."
    - tutor: "Ottima idea. E per il regalo?"
      goals: [food]
    - learner: "Sara ama la musica. Potremmo regalarle due biglietti per un concerto. Li cercherò su internet."
    - tutor: "È un regalo perfetto! Dividiamo la spesa tra tutti."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-professional
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Sara ama la natura, quindi potremmo fare un picnic al parco domenica."
    - tutor: "Che bella idea! E se piove?"
      new: [{lemma: piovere, gloss: to rain}]
    - learner: "Se piove, facciamo la festa da me. Va bene domenica alle dodici?"
    - tutor: "Va benissimo. Quanti siamo?"
      goals: [date]
    - learner: "Penso dodici persone: la sua famiglia e gli amici più stretti. Ne ho già parlato con suo fratello."
    - tutor: "Perfetto. Chi porta da mangiare?"
      goals: [guests]
    - learner: "Ognuno porta qualcosa. Io preparo i panini e tu potresti fare la torta, se ti va."
    - tutor: "Certo, la faccio io, con la frutta! E il regalo?"
      goals: [food]
    - learner: "Le regaliamo una bicicletta nuova. La sua è vecchia e rotta."
    - tutor: "Fantastico, sarà contentissima! Domani andiamo insieme a sceglierla."
      goals: [gift]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [conditional-form]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, nella mia camera non c'è acqua calda. Volevo fare la doccia, ma l'acqua è fredda."
    - tutor: "Mi dispiace molto. Da quanto tempo non c'è acqua calda?"
      goals: [problem]
    - learner: "Da quando sono arrivata, alle sei. Ho aspettato, ma è ancora fredda."
    - tutor: "Capisco. Che cosa possiamo fare per lei?"
      goals: [since]
    - learner: "Potrebbe chiamare un tecnico? O mi darebbe un'altra camera?"
    - tutor: "Il tecnico arriva domani. Ma le posso dare subito un'altra camera, uguale alla sua."
      goals: [request]
    - learner: "Va bene. E vorrei anche un piccolo rimborso, perché ho perso due ore."
    - tutor: "Ha ragione. Le offriamo la colazione gratis domani. Le va bene così?"
      new: [{lemma: gratis, gloss: free of charge}]
    - learner: "Sì, va benissimo. Grazie per la comprensione."
    - tutor: "Si figuri, e mi scusi ancora. Ecco la chiave della camera 15."
      goals: [agree]

- scenario: restituire-prodotto
  level: B1
  persona: es-f-erasmus
  history: [pronoun-position]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato questo caricatore per il telefono, ma non funziona. Il telefono non si carica."
    - tutor: "Mi dispiace. Quando l'ha comprato? Ha lo scontrino?"
      goals: [problem]
      new: [{lemma: caricatore, gloss: charger}]
    - learner: "L'ho comprato sabato. Sì, ho lo scontrino, ma devo lo cercare nella borsa."
      errors: [pronoun-position]
    - tutor: "Devo lo cercare? Attenzione all'ordine delle parole..."
      prompt: {text: "devo lo cercare", tags: [pronoun-position]}
    - learner: "Lo devo cercare! Ah, eccolo."
    - tutor: "Esatto! Grazie. Sì, è in garanzia. Preferisce un rimborso o un prodotto nuovo?"
      goals: [proof]
    - learner: "Preferisco cambiarlo con uno nuovo, se è possibile."
    - tutor: "Certo. Ne prendo un altro e lo proviamo insieme qui, così è sicura."
      goals: [request]
    - learner: "Perfetto, grazie. Così non devo tornare."
    - tutor: "Ecco, funziona benissimo. Buona giornata!"
      goals: [agree]

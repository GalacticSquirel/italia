# Set r-reply-a1b1, file 7: B1 returns at an electronics shop, the mechanic, opening a bank account, tips for Naples.
- scenario: restituire-prodotto
  # facts: cuffie bianche comprate dieci giorni fa, 89 euro; il lato sinistro non si sente; scontrino presente; in garanzia, entro quattordici giorni sostituzione o rimborso; bianche finite, ci sono nere; sceglie il rimborso sulla stessa carta, arriva in tre o quattro giorni
  level: B1
  persona: es-m-worker
  history: [participle-agreement]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato queste cuffie, ma non funzionano bene."
    - tutor: "Mi dispiace. Che problema hanno?"
    - learner: "Il lato sinistro non si sente. Le ho provate con due telefoni, ma niente."
    - tutor: "Capisco, allora sono difettose. Quando le ha comprate? Ha lo scontrino?"
      goals: [problem]
    - learner: "Le ho comprato dieci giorni fa. Ecco lo scontrino."
      errors: [participle-agreement]
    - tutor: "«Le ho comprato»? Parla delle cuffie: guardi la fine di «comprato»."
      prompt: {text: "Le ho comprato", tags: [participle-agreement]}
    - learner: "Le ho comprate dieci giorni fa."
    - tutor: "Esatto. Sono passati solo dieci giorni, quindi possiamo sostituirle o fare il rimborso. Lei cosa preferisce?"
      goals: [proof]
    - learner: "Preferirei cambiarle per le stesse, bianche."
      errors: [preposition]
    - tutor: "«Cambiarle per le stesse»? Con «cambiare», qui la preposizione è un'altra."
      prompt: {text: "cambiarle per le stesse", tags: [preposition]}
    - learner: "Cambiarle con le stesse, bianche."
    - tutor: "Giusto. Purtroppo le bianche sono finite: ci sono le stesse in nero, oppure il rimborso di ottantanove euro."
      goals: [request]
    - learner: "Il nero non mi piace molto... Allora preferisco la devolución."
      errors: [word-choice]
    - tutor: "Allora il rimborso: lo faccio sulla stessa carta che ha usato, e arriva in tre o quattro giorni."
      recast: {text: "la devolución", fix: "il rimborso", tags: [word-choice]}
    - learner: "D'accordo, accetto. Devo firmare qualcosa?"
    - tutor: "Sì, una firma qui, per favore. Ecco la ricevuta del rimborso."
      goals: [agree]
    - learner: "Grazie, è stato molto gentile."
    - tutor: "Si figuri, arrivederci!"

- scenario: restituire-prodotto
  # facts: macchina del caffè comprata tre settimane fa, pagata con la carta; perde acqua quando si accende; oltre quattordici giorni, niente rimborso; in garanzia: riparazione o sostituzione; due macchine uguali in negozio; sostituzione subito, provata insieme
  level: B1
  persona: en-f-professional
  history: [past-participle-form]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Tre settimane fa ho comprato questa macchina del caffè, ma perde acqua."
    - tutor: "Mi dispiace. Perde sempre, o solo quando fa il caffè?"
    - learner: "Solo quando la accendo. Ieri ha bagnato tutto il tavolo della cucina!"
    - tutor: "Allora va controllata subito. Ha portato lo scontrino?"
      goals: [problem]
    - learner: "Sì, eccolo. L'ho pagata con la carta."
    - tutor: "Grazie. Sono passati più di quattordici giorni, quindi il rimborso non è possibile. Però la macchina è in garanzia."
      goals: [proof]
    - learner: "Ma io ho leggiuto le istruzioni e ho usato la macchina bene. Non è colpa mia."
      errors: [past-participle-form]
    - tutor: "«Ho leggiuto»? «Leggere» al passato ha una forma speciale."
      prompt: {text: "ho leggiuto", tags: [past-participle-form]}
    - learner: "Ho letto le istruzioni! Non è colpa mia."
    - tutor: "Certo, e non lo metto in dubbio. Con la garanzia può avere la riparazione, oppure una macchina nuova."
    - learner: "Preferirei una macchina nuova, subito. Senza caffè la mattina non posso vivere!"
    - tutor: "La capisco! Ne abbiamo ancora due uguali in negozio, quindi posso sostituirla adesso."
      goals: [request]
    - learner: "Perfetto, lo prendo. Posso provarlo qui prima di andare via?"
      errors: [object-pronoun]
    - tutor: "«Lo prendo»? Parla della macchina: è maschile o femminile?"
      prompt: {text: "lo prendo", tags: [object-pronoun]}
    - learner: "La prendo! Posso provarla qui prima di andare via?"
    - tutor: "Esatto. Sì, la apriamo insieme e la proviamo con un po' d'acqua."
      goals: [agree]
    - learner: "Grazie mille, siete stati molto veloci."
    - tutor: "Grazie a lei, e buon caffè!"

- scenario: restituire-prodotto
  # facts: caricabatterie per il computer comprato sabato scorso, 45 euro, pagato con la carta; non carica, la luce non si accende; scontrino perso, pagamento mostrato sul telefono; ne ha già comprato un altro; rimborso sulla carta in pochi giorni; scatola resta al negozio; ricevuta stampata
  level: B1
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Sabato ho comprato questo caricabatterie per il computer, ma non carica."
    - tutor: "Mi dispiace. L'ha provato con un'altra presa?"
    - learner: "Sì, l'ho provato a casa e in ufficio. La luce non si accende mai."
    - tutor: "Allora è difettoso. Ha lo scontrino?"
      goals: [problem]
    - learner: "Lo scontrino l'ho perso, ma ho pagato con la carta. Posso mostrarle il pagamento sul telefono?"
    - tutor: "Sì, va bene anche quello. Me lo fa vedere?"
    - learner: "Ecco: quarantacinque euro, sabato scorso."
    - tutor: "È proprio questo. Preferisce cambiarlo o avere il rimborso?"
      goals: [proof]
    - learner: "Vorrei il rimborso, perché ho già comprato un altro in un altro negozio."
      errors: [ci-ne]
    - tutor: "«Ho già comprato un altro»? Un altro di questi: quale pronome mette prima di «ho»?"
      prompt: {text: "ho già comprato un altro", tags: [ci-ne]}
    - learner: "Ne ho già comprato un altro."
    - tutor: "Esatto, allora il rimborso. Lo faccio sulla sua carta: arriva in pochi giorni."
      goals: [request]
    - learner: "Va bene. E la scatola, la tenete voi?"
    - tutor: "Sì, la teniamo noi. Mi firma qui, per favore?"
      goals: [agree]
    - learner: "Fatto. Mi la può stampare, la ricevuta?"
      errors: [combined-pronouns]
    - tutor: "«Mi la»? Quando «mi» incontra «la», cambia un po'."
      prompt: {text: "Mi la", tags: [combined-pronouns]}
    - learner: "Me la può stampare?"
    - tutor: "Certo, eccola. Buona giornata!"

- scenario: dal-meccanico
  # facts: fischio quando frena, da tre giorni; lunedì in autostrada; pastiglie dei freni consumate; 180 euro tra pezzi e lavoro; preventivo; pronta domani alle cinque
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Quando freno, la macchina fa un rumore strano, come un fischio."
    - tutor: "Un fischio quando frena... Da quando lo sente?"
      goals: [describe]
    - learner: "Da tre giorni. Lunedì ho guidato in autostrada e all'improvviso ho sentito il rumore."
      errors: [tense-aspect]
    - tutor: "«Ho guidato»? Lei era in autostrada quando è arrivato il rumore: quale passato descrive la scena?"
      prompt: {text: "ho guidato", tags: [tense-aspect]}
    - learner: "Ho guidato in autostrada, e poi ho sentito il rumore."
      errors: [tense-aspect]
    - tutor: "«Guidavo in autostrada e ho sentito il rumore»: capisco. Faccio un controllo veloce ai freni: aspetti qui un momento."
      recast: {text: "ho guidato", fix: "Guidavo", tags: [tense-aspect]}
      goals: [when]
    - learner: "Va bene. È pericoloso guidare così?"
    - tutor: "Un po' sì: le pastiglie dei freni sono consumate. Vanno cambiate presto."
      new: [{lemma: pastiglia, gloss: brake pad}, {lemma: consumato, gloss: worn}]
    - learner: "Quanto mi costarà?"
      errors: [future-form]
    - tutor: "«Costarà»? Pensi a «parlerà» o «mangerà»: e «costare»?"
      prompt: {text: "costarà", tags: [future-form]}
    - learner: "Quanto mi costerà?"
    - tutor: "Tra pezzi e lavoro, 180 euro. Le preparo il preventivo?"
      goals: [cost]
    - learner: "Sì, grazie. E quando sarà pronta? Domani mi serve per andare al lavoro."
    - tutor: "Se me la lascia adesso, sarà pronta domani alle cinque. Le va bene?"
    - learner: "Alle cinque va bene. Allora le lascio la macchina e le chiavi."
    - tutor: "Le scrivo il preventivo e, se c'è altro, la chiamo. A domani!"
      goals: [time]

- scenario: dal-meccanico
  # facts: la mattina la macchina non parte subito; spia rossa della batteria; dalla settimana scorsa, quando faceva molto freddo; batteria mai cambiata in tre anni; batteria nuova 120 euro più 20 di lavoro; pronta in circa un'ora; si paga anche con la carta
  level: B1
  persona: en-m-retired
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. La mattina la macchina non parte subito. Devo provare tre o quattro volte."
    - tutor: "E quando parte, si accende qualche spia?"
      goals: [describe]
      new: [{lemma: spia, gloss: warning light}]
    - learner: "Sì, una luce rossa: credo la batteria. È cominciato la settimana scorsa, quando ha fatto molto freddo."
      errors: [tense-aspect]
    - tutor: "«Quando ha fatto molto freddo»? Lei descrive il tempo di quei giorni: quale passato usiamo?"
      prompt: {text: "quando ha fatto molto freddo", tags: [tense-aspect]}
    - learner: "Quando faceva molto freddo."
    - tutor: "Giusto, e con il freddo la batteria soffre. Sa da quanto tempo ha questa batteria?"
      goals: [when]
      new: [{lemma: batteria, gloss: battery}]
    - learner: "Ho comprato la macchina usata tre anni fa, e la batteria non l'ho mai cambiata."
    - tutor: "Allora è vecchia, va cambiata."
    - learner: "Quanto costerà una batteria nuova? Spero che non è troppo cara."
      errors: [subjunctive-use]
    - tutor: "«Spero che non è troppo cara»? Con «spero che» esprime un desiderio: che forma vuole il verbo?"
      prompt: {text: "Spero che non è", tags: [subjunctive-use]}
    - learner: "Ehm... spero che non è cara."
      errors: [subjunctive-use]
    - tutor: "Spero che non sia cara? Non troppo: costa centoventi euro, più venti per il lavoro."
      recast: {text: "spero che non è", fix: "Spero che non sia", tags: [subjunctive-use]}
      goals: [cost]
    - learner: "Va bene. Quando sarà pronta? Alle undici devo prendere mia moglie alla stazione."
    - tutor: "Ci vuole circa un'ora, quindi fa in tempo. Vuole aspettare qui?"
      goals: [time]
    - learner: "No, andrò a bere un caffè e tornerò fra un'ora. Posso pagare con la carta?"
    - tutor: "Accettiamo la carta, sì. A tra un'ora!"

- scenario: banca-conto
  # facts: si è trasferita a Bologna il mese scorso; conto per lo stipendio; documenti: documento d'identità e codice fiscale (codice fiscale portato domani); conto con l'app gratuito o classico a 5 euro al mese; carta di debito compresa, arriva in una settimana; bonifici con l'app; appuntamento domani alle nove
  level: B1
  persona: es-f-teacher
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Vorrei aprire un conto. Mi sono trasferita a Bologna il mese scorso."
    - tutor: "Benvenuta! A cosa le serve il conto?"
      goals: [purpose]
    - learner: "Per lo stipendio. Che documenti devo portare?"
    - tutor: "Un documento d'identità e il codice fiscale. Se li ha con sé, possiamo aprire il conto oggi stesso."
      goals: [documents]
    - learner: "Ho il passaporto, ma il codice fiscale l'ho lasciato a casa. Lo posso portare domani?"
    - tutor: "Domani va benissimo. Nel frattempo, ha qualche domanda sul conto?"
    - learner: "Sì. Quanto costa al mese? Non vorrei di pagare molto."
      errors: [modal-infinitive]
    - tutor: "«Vorrei di pagare»? Dopo «vorrei», il secondo verbo arriva da solo."
      prompt: {text: "vorrei di pagare", tags: [modal-infinitive]}
    - learner: "Non vorrei pagare molto."
    - tutor: "Giusto. C'è il conto con l'app, che è gratuito, e quello classico, a cinque euro al mese."
      goals: [costs]
      new: [{lemma: gratuito, gloss: free of charge}]
    - learner: "Preferisco quello con l'app. Ma è sicuro? Ho letto che ci sono molte estafas."
      errors: [word-choice]
    - tutor: "Le truffe purtroppo esistono, ma la nostra app è molto sicura. Ha altre domande?"
      recast: {text: "estafas", fix: "truffe", tags: [word-choice]}
      new: [{lemma: truffa, gloss: scam}]
    - learner: "Sì. Con questo conto c'è anche una carta di debito?"
    - tutor: "Sì, la carta di debito è compresa e arriva a casa in una settimana. Con l'app può fare anche i bonifici."
      goals: [card]
    - learner: "Perfetto. Allora torno domani con il codice fiscale. A che ora aprite?"
    - tutor: "Apriamo alle otto e mezza. Vuole un appuntamento alle nove?"
    - learner: "Sì, alle nove va bene. Grazie!"
    - tutor: "A domani, allora. Buona giornata!"

- scenario: banca-conto
  # facts: vive in Italia sei mesi l'anno, casa anche in Inghilterra; conto per pagare le bollette; codice fiscale già presente; documenti: passaporto, codice fiscale, contratto della casa (mandato per email); 4 euro al mese, gratis il primo anno; carta di debito valida anche all'estero; app
  level: B1
  persona: en-m-retired
  history: [pronoun-position]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Vorrei aprire un conto. Vivo qui sei mesi all'anno e devo pagare le bollette."
    - tutor: "Per le bollette è comodo. Ha già il codice fiscale?"
      goals: [purpose]
    - learner: "Sì, ce l'ho. Che altri documenti dovrei portare?"
    - tutor: "Il passaporto e il contratto della casa, d'affitto o di proprietà."
      goals: [documents]
    - learner: "Ho tutto con me, tranne il contratto. Posso lo mandare per email?"
      errors: [pronoun-position]
    - tutor: "«Posso lo mandare»? Guardi dove ha messo «lo»: in mezzo ai due verbi non può stare."
      prompt: {text: "Posso lo mandare", tags: [pronoun-position]}
    - learner: "Posso mandarlo per email?"
    - tutor: "Esatto. Sì, per email va bene, oppure lo porta qui in banca."
    - learner: "Quanto costerebbe al mese? Mi hanno detto che le banche italiane sono più care che le inglesi."
      errors: [comparative]
    - tutor: "«Più care che le inglesi»? Con due nomi, qui al posto di «che» ci vuole un'altra parola."
      prompt: {text: "più care che le inglesi", tags: [comparative]}
    - learner: "Più care che quelle inglesi?"
      errors: [comparative]
    - tutor: "Non sempre più care di quelle inglesi! Il conto costa quattro euro al mese, ma il primo anno è gratis."
      goals: [costs]
      recast: {text: "più care che quelle inglesi", fix: "più care di quelle inglesi", tags: [comparative]}
    - learner: "Bene. Vorrei anche una carta per pagare nei negozi. Posso usarla anche in Inghilterra?"
    - tutor: "Sì, la carta di debito funziona anche in Inghilterra. E con l'app controlla il conto anche da casa sua."
      goals: [card]
    - learner: "Perfetto. Allora vi manderò il contratto stasera."
    - tutor: "Benissimo: appena lo riceviamo, il conto è pronto. Adesso le serve solo una firma qui."

- scenario: consigli-viaggio
  # facts: parte venerdì per quattro giorni, prima volta a Napoli; vuole vedere il centro storico e Pompei; mangiare pizza, pizza fritta, sfogliatella; a Pompei in treno dalla stazione Garibaldi, meno di un'ora; in centro metro e a piedi, niente macchina; occhio allo zaino su autobus e metro; Pompei non nelle ore più calde
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì e resto quattro giorni. È la prima volta che vado!"
      errors: [ci-ne]
    - tutor: "«È la prima volta che vado»? Vai dove? Quale pronome usi per dire «a Napoli»?"
      prompt: {text: "la prima volta che vado", tags: [ci-ne]}
    - learner: "È la prima volta che ci vado!"
    - tutor: "Esatto, e ti piacerà tantissimo! Cosa vuoi vedere?"
    - learner: "Vorrei vedere il centro storico e anche Pompei. Cosa mi consigli di mangiare?"
    - tutor: "Assolutamente la pizza, e prova anche quella fritta! Per il dolce, prendi una sfogliatella al bar."
      goals: [plans, advice]
      new: [{lemma: sfogliatella, gloss: Neapolitan pastry}, {lemma: fritto, gloss: fried}]
    - learner: "Buonissimo! E per andare a Pompei, come ci vado?"
    - tutor: "Prendi il treno dalla stazione Garibaldi: in meno di un'ora sei lì."
    - learner: "E in città? Pensavo di noleggiare una macchina, così sono più libera."
    - tutor: "No, assolutamente! In centro usa la metro e cammina: con la macchina è un incubo."
      goals: [transport]
      new: [{lemma: incubo, gloss: nightmare}]
    - learner: "Ho capito. E cosa devo evitare? Non dimmi che è pericoloso!"
      errors: [imperative-form]
    - tutor: "«Non dimmi»? Con «non» davanti, il verbo per «tu» cambia forma."
      prompt: {text: "Non dimmi", tags: [imperative-form]}
    - learner: "Non dirmi che è pericoloso!"
    - tutor: "Esatto. Ma no, non è pericoloso! Però sull'autobus e in metro tieni d'occhio lo zaino, e non andare a Pompei nelle ore più calde."
      goals: [warnings]
    - learner: "Grazie mille, sei gentilissima! Porto la mia camera e ti mando tante foto."
      errors: [false-friend]
    - tutor: "Porta la macchina fotografica e mandami tutto! Buon viaggio!"
      recast: {text: "camera", fix: "macchina fotografica", tags: [false-friend]}
      new: [{lemma: fotografico, gloss: photographic}]

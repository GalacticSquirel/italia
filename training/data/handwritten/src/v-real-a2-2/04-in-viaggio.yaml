# v-real-a2-2, file 04: travelling to visit friends, services on the way (A2, real learner sentences).
- scenario: casa-mia
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    # merlin-1395_0000414-6
    - learner: "Ho cambiato la casa mia."
    - tutor: "Ah, hai cambiato casa! E come va nella casa nuova?"
    # merlin-1395_0000458-1
    - learner: "Alla mia casa va abbastanza bene."
      errors: [articulated-preposition]
    - tutor: "Bene! Ma «alla mia casa»? Prova a dirlo più semplice, senza articolo."
      prompt: {text: "Alla mia casa", tags: [articulated-preposition]}
    - learner: "A casa mia va bene. È un appartamento piccolo, con due camere."
    - tutor: "Esatto! E adesso dove sei, in cucina?"
      goals: [type, rooms]
    # merlin-1395_0001170-0
    - learner: "Io qui mi trovo benissima!"
      errors: [adjective-agreement]
    - tutor: "Che bello! Ma «benissima»? Quella parola dice come ti trovi, non com'è la persona."
      prompt: {text: "benissima", tags: [adjective-agreement]}
    - learner: "Sì, mi trovo benissima, la cucina è la mia stanza preferita!"
      errors: [adjective-agreement]
    - tutor: "Ti trovi benissimo in cucina, si vede! Io invece adoro il mio balcone."
      goals: [favourite]
      recast: {text: "benissima", fix: "benissimo", tags: [adjective-agreement]}
    # merlin-1395_0000565-2
    - learner: "Com'è la tua città?"
    - tutor: "Piccola e tranquilla. E casa mia ha un balcone sul mare!"
      goals: [ask]
      done: false
    # merlin-1395_0001161-3
    - learner: "Ti volevo chiedere, se posso rimanere in casa tua per 2 settimane"
      errors: [preposition]
    - tutor: "Ma certo! Però «in casa tua»? Con casa tua, quale preposizione usiamo?"
      prompt: {text: "in casa tua", tags: [preposition]}
    - learner: "Posso rimanere a casa tua per due settimane?"
    - tutor: "Perfetto! E sì, a casa mia c'è sempre posto per te."

- scenario: biglietto-treno
  level: A2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Un biglietto per Verona, giusto? Quando vuole partire?"
    # merlin-1395_0000556-1
    - learner: "Io penso a arrivare la prossima settimana a lunedì e resto per cinque giorni."
      errors: [preposition]
    - tutor: "Cinque giorni, bene. Ma «penso a arrivare»? Dopo pensare, quale preposizione va?"
      prompt: {text: "penso a arrivare", tags: [preposition]}
    - learner: "Sì, penso a partire lunedì mattina."
      errors: [preposition]
    - tutor: "Va bene, di partire lunedì mattina: c'è un treno alle otto, andata e ritorno. Prima o seconda classe?"
      goals: [destination, type]
      recast: {text: "a partire", fix: "di partire", tags: [preposition]}
    - learner: "Seconda classe, per favore. E vorrei un posto vicino alla ventana."
      errors: [word-choice]
    - tutor: "Seconda classe, vicino al finestrino: ecco fatto. Sono quarantotto euro."
      goals: [class]
      recast: {text: "alla ventana", fix: "al finestrino", tags: [word-choice]}
    # merlin-1365_0100280-7
    - learner: "Dove devo andare?"
    - tutor: "Lunedì il treno parte dal binario 3. Buon viaggio!"
      goals: [platform]

- scenario: chiedere-strada
  level: A2
  persona: en-m-traveller
  history: [article-use]
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Scusi, signora! Dov'è la stazione, per favore?"
    - tutor: "La stazione? È a dieci minuti a piedi. Lei è qui in vacanza?"
      goals: [get-attention, ask-place]
    # merlin-1395_0000504-1
    - learner: "Faccio un corso di italiano di due mesi."
    - tutor: "Ah, ecco perché parla così bene! E da quanto tempo è qui?"
    # merlin-1395_0000597-0
    - learner: "Sono arrivato il sabato scorso."
      errors: [article-use]
    - tutor: "Da una settimana, allora! Ma «il sabato scorso»? Quel «il» serve?"
      prompt: {text: "il sabato scorso", tags: [article-use]}
    - learner: "Sono arrivato sabato scorso. Allora, per la stazione vado dritto?"
    - tutor: "Esatto! Sì, vada dritto fino al semaforo e giri a destra. La stazione è lì davanti."
      goals: [understand]
    # merlin-1395_0000579-2
    - learner: "La città é bella."
      errors: [spelling]
    - tutor: "Grazie! Ma «é»? Guarda bene l'accento."
      prompt: {text: "é", tags: [spelling]}
    - learner: "È bella, con l'altro accento! Grazie mille, signora."
    - tutor: "Perfetto! Prego, e buon viaggio!"
      goals: [thank]

- scenario: autobus
  level: A2
  persona: es-f-teacher
  history: [spelling]
  turns:
    - tutor: "Buongiorno! Dove deve andare?"
    # merlin-1395_0000499-3
    - learner: "Dopo la lezione visitiamo il Collosseo."
      errors: [spelling]
    - tutor: "Scusi, dove? Controlli come si scrive quel nome."
      prompt: {text: "Collosseo", tags: [spelling]}
    - learner: "Il Colosseo, con una elle! Questo autobus ci va?"
    - tutor: "Sì, questa linea va proprio lì. È qui con la scuola?"
      goals: [route]
    # merlin-1395_0001147-5
    - learner: "Nel corso con me ci sono le raggazze e i raggazzi dalla Polonia insieme dodici persone."
      errors: [spelling]
    - tutor: "Dodici persone! Ma «raggazze»? Guardi bene come si scrive."
      prompt: {text: "le raggazze e i raggazzi", tags: [spelling]}
    - learner: "Sì, le raggazze e i ragazzi. Dove compriamo i biglietti?"
      errors: [spelling]
    - tutor: "Le ragazze e i ragazzi possono comprarli in tabaccheria, lì a destra. Poi scendete dopo la piazza!"
      goals: [ticket, stop]
      recast: {text: "le raggazze", fix: "le ragazze", tags: [spelling]}

- scenario: noleggio-bici
  level: A2
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno! Vuole una bicicletta?"
    - learner: "Sì, voglio di noleggiare una bici per andare al lago."
      errors: [modal-infinitive]
    - tutor: "Benissimo! Ma «voglio di noleggiare»? Dopo voglio, quel «di» ci vuole?"
      prompt: {text: "voglio di noleggiare", tags: [modal-infinitive]}
    - learner: "No! Voglio noleggiare una bici."
    - tutor: "Ecco, così va bene! Per quanto tempo?"
      goals: [ask]
    # merlin-1395_0000531-14
    - learner: "Potrei restare 2 settimane e mi potresti mostrare la regione."
      errors: [register]
    - tutor: "Due settimane? Bene! Ma «mi potresti»? Lei parla con me, un signore che non conosce..."
      prompt: {text: "mi potresti", tags: [register]}
    - learner: "Ah, mi potrebbe mostrare la regione?"
    - tutor: "Perfetto, così è più gentile! Per due settimane le faccio un prezzo speciale."
      goals: [duration]
    - learner: "Quanto costa? Il helmet è compreso?"
      errors: [word-choice]
    - tutor: "Cento euro, e il casco è compreso. Per oggi le consiglio il giro del lago."
      recast: {text: "Il helmet", fix: "il casco", tags: [word-choice]}
      goals: [price, route]

- scenario: abbigliamento
  level: A2
  persona: en-m-retired
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    # merlin-1365_0100180-2
    - learner: "Mio fratello mammonia la sua ragazza Anna che conoscete."
      errors: [word-choice]
    - tutor: "Suo fratello sposa Anna, quella del bar qui vicino? Che bella notizia! Le serve qualcosa per il matrimonio?"
      recast: {text: "mammonia", fix: "sposa", tags: [word-choice]}
    # merlin-1365_0100170-6
    - learner: "Devo dire, che sono un po'nervoso. perchè non era mai a una festa per una cerimonia."
      errors: [tense-aspect, spelling]
    - tutor: "Non si preoccupi! Ma «non era mai»? Parla di lei, e di tutta la sua vita..."
      prompt: {text: "non era mai", tags: [tense-aspect]}
    - learner: "Non sono mai stato a un matrimonio! Cerco una camicia bianca."
    - tutor: "Esatto, mai stato! Una camicia bianca, va bene. Che taglia porta?"
      goals: [ask-item]
      new: [{lemma: camicia, gloss: shirt}]
    - learner: "La L, credo. E vorrei anche una cravatta azul chiaro."
      errors: [word-choice]
    - tutor: "Ecco la L, e questa cravatta blu chiaro. Sono sessanta euro in tutto. E buona festa a suo fratello!"
      goals: [size-colour, decide]
      recast: {text: "azul chiaro", fix: "blu chiaro", tags: [word-choice]}

- scenario: ristorante-ordinare
  level: A2
  persona: es-m-worker
  history: [article-use]
  turns:
    - tutor: "Buongiorno, benvenuti! Quanti siete?"
    # merlin-1395_0001065-2
    - learner: "Noi stiamo bene."
    - tutor: "Ah, bene, mi fa piacere! Ma quante persone siete?"
    - learner: "Ah, scusi! Siamo in due, io e mio padre."
    - tutor: "Ecco un tavolo per due. Cosa prendete?"
      goals: [ask-table]
    - learner: "Per me pasta al pomodoro, per lui il pescado del giorno."
      errors: [word-choice]
    - tutor: "Pasta al pomodoro e il pesce del giorno, perfetto. E da bere?"
      goals: [order-food]
      recast: {text: "il pescado del giorno", fix: "il pesce del giorno", tags: [word-choice]}
    - learner: "Una bottiglia di acqua naturale e due bicchiere di vino rosso."
      errors: [noun-number]
    - tutor: "Acqua naturale, e «due bicchiere»? Uno o più?"
      prompt: {text: "due bicchiere", tags: [noun-number]}
    - learner: "Due bicchieri di vino rosso, per favore."
    - tutor: "Esatto! Arrivano subito. Siete in viaggio?"
      goals: [order-drink]
    # merlin-1395_0001116-4
    - learner: "Prendo la macchina per viaggiare in Italia."
    - tutor: "Che bello, l'Italia in macchina è bellissima! Buon viaggio, allora."

- scenario: compleanno
  level: A2
  persona: en-f-student
  history: [demonstrative]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1385_0001188-5
    - learner: "Allora, ci vediamo sabato sera?"
    - tutor: "Sabato sera, perfetto! A casa mia o fuori?"
    # merlin-1385_0001196-6
    - learner: "Conosco un ristorante tailandese molto buono."
    - tutor: "Ottima idea, a Sara piace tanto! Quale?"
    # merlin-1385_0001748-7
    - learner: "Possiamo andare a cena al questa ristorante."
      errors: [demonstrative, articulated-preposition]
    - tutor: "Fammi vedere... Che carino! Ma «questa ristorante»? Ristorante è maschile."
      prompt: {text: "questa ristorante", tags: [demonstrative]}
    - learner: "In questo ristorante! Invitiamo anche i suoi colleghi?"
    - tutor: "Brava, perfetto! Sì, anche i colleghi. E la torta?"
      goals: [date, guests]
    - learner: "Una tarta al cioccolato, la porto io."
      errors: [word-choice]
    - tutor: "Grande, una torta al cioccolato! E il regalo?"
      goals: [food]
      recast: {text: "Una tarta", fix: "una torta", tags: [word-choice]}
    # merlin-1365_0100067-7
    - learner: "Ho qualche idea, peró è solo un progetto."
      errors: [spelling]
    - tutor: "Dimmi pure! Ma «peró»? Guarda l'accento."
      prompt: {text: "peró", tags: [spelling]}
    - learner: "Però! Un corso di cucina tailandese?"
    - tutor: "Esatto, così! Ed è un'idea bellissima, lo regaliamo insieme."
      goals: [gift]

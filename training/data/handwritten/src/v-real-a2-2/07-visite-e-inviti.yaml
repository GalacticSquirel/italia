# v-real-a2-2, file 07: planning a visit to a friend, plans that change (A2, real learner sentences).
- scenario: casa-mia
  level: A2
  persona: en-m-traveller
  history: [conditional-form]
  turns:
    - tutor: "Ciao! Senti, quando vieni a trovarmi qui a Bari? A casa mia c'è una camera per te."
    # merlin-1395_0001167-0
    - learner: "Sono molto contento di venire da te in Italia."
    - tutor: "Anch'io sono contento! Come vieni, e quanti giorni resti?"
    # merlin-1395_0001122-2
    - learner: "Io vengo con il bus e restare 3 giorni."
      errors: [verb-form]
    - tutor: "Con il bus, va bene. Ma «e restare»? Quel verbo deve andare con «io»."
      prompt: {text: "restare 3 giorni", tags: [verb-form]}
    - learner: "Io vengo con il bus e resto tre giorni, da venerdì."
    - tutor: "Esatto! Da venerdì a domenica, perfetto."
    # merlin-1395_0000559-3
    - learner: "E cosa potriamo fare la sera?"
      errors: [conditional-form]
    - tutor: "Tante cose! Ma «potriamo»? Questa forma di potere non va bene."
      prompt: {text: "potriamo", tags: [conditional-form]}
    - learner: "Cosa potriamo fare? Un concerto?"
      errors: [conditional-form]
    - tutor: "Cosa potremmo fare? Potremmo andare a un concerto in piazza, sì!"
      recast: {text: "potriamo", fix: "potremmo", tags: [conditional-form]}
    # merlin-1395_0001167-6
    - learner: "Dopo possiamo andare al restaurante per mangiare una pizza."
      errors: [word-choice]
    - tutor: "Certo, dopo andiamo al ristorante: c'è un posto buonissimo sotto casa mia."
      recast: {text: "al restaurante", fix: "al ristorante", tags: [word-choice]}
    # merlin-1395_0001118-1
    - learner: "Com'è la città?"
    - tutor: "Bellissima, con il mare e tante chiese. E casa mia è a due passi dal porto!"
      goals: [ask]
    # merlin-1395_0000564-9
    - learner: "Scrivi anche il tuo indirizzo."
    - tutor: "Te lo mando per messaggio. Ti aspetto venerdì!"
    # merlin-1395_0001118-6
    - learner: "Grazie e a presto!"
    - tutor: "A presto, buon viaggio!"

- scenario: casa-mia
  level: A2
  persona: es-f-erasmus
  history: [modal-infinitive]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    # merlin-1395_0000414-6
    - learner: "Ho cambiato la casa mia."
    - tutor: "Ah, sì? Io invece ho sempre la mia casa grande in campagna. Quando vieni?"
    # merlin-1395_0001020-2
    - learner: "Vorrei andare a trovare ti perchè mi voglio incontro con te!"
      errors: [pronoun-position, modal-infinitive, spelling]
    - tutor: "Che bello! Ma «andare a trovare ti»? Dove va quel «ti»?"
      prompt: {text: "andare a trovare ti", tags: [pronoun-position]}
    # merlin-1395_0000565-1
    - learner: "Vorrei andare a trovare te in Italia."
    - tutor: "Esatto, così va bene! E vieni quando vuoi."
    # merlin-1395_0000553-4
    - learner: "C'è facile per qualcuno di campania?"
      errors: [ce-ci-sono, word-choice]
    - tutor: "Facile? Ma «c'è facile»? Qui non parli di una cosa che esiste..."
      prompt: {text: "C'è facile", tags: [ce-ci-sono]}
    - learner: "È facile arrivare da te?"
    - tutor: "Perfetto! Sì, è facile: prendi il treno fino a Siena."
    # merlin-1395_0000560-2
    - learner: "O puoi andare a prendermi in macchina?"
    - tutor: "Certo, ti vengo a prendere alla stazione."
    # merlin-1395_0000560-4
    - learner: "Altrimenti prenoterò una camera d'albergo nel centro."
    - tutor: "Ma no, da me c'è posto! Ho quattro camere."
      goals: [ask]
    # merlin-1395_0001122-6
    - learner: "Ci vediamo a presto"
      errors: [word-choice]
    - tutor: "Sì, ci vediamo presto! Ti aspetto."
      recast: {text: "Ci vediamo a presto", fix: "Ci vediamo presto", tags: [word-choice]}

- scenario: casa-mia
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Allora, quando venite a trovarci a Torino? La casa è grande."
    # merlin-1395_0001065-9
    - learner: "Potremmo venire da te in agosto."
    - tutor: "Agosto va benissimo! Tu e chi?"
    # merlin-1395_0001015-3
    - learner: "La sera io posso andare al un concerto con la mia padre o andare in un ristorante con la mia famiglia."
      errors: [article-form, possessive]
    - tutor: "Ah, con la tua famiglia! Ma «con la mia padre»? Con i nomi di famiglia, si usa l'articolo?"
      prompt: {text: "la mia padre", tags: [possessive]}
    - learner: "Con mio padre! Io, mio padre e mia madre."
    - tutor: "Perfetto, in tre! Ad agosto c'è tanta musica al parco."
    # merlin-1395_0000534-6
    - learner: "Lino fammi sapere presto se sei oK, Puoi chiamami a casa."
      errors: [modal-infinitive]
    - tutor: "Lino? Sono Luca! Ma «puoi chiamami»? Dopo puoi, che forma del verbo serve?"
      prompt: {text: "Puoi chiamami", tags: [modal-infinitive]}
    - learner: "Scusa, Luca! Puoi chiamarmi a casa stasera?"
    - tutor: "Perfetto! Ti chiamo stasera. E ti mando le foto della mia casa nuova."
      goals: [ask]
    # merlin-1395_0001122-5
    - learner: "Aspetto la tua telefonata."
    - tutor: "A stasera, allora!"

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1395_0001013-2
    - learner: "Se non c'è lezione, visitiamo la città."
    - tutor: "Ah, tu e la tua classe, che bello! Io il sabato vado a cena fuori. Usciamo insieme giovedì?"
      goals: [hobby]
    # merlin-1385_0001525-2
    - learner: "Mi dispiace molto, ma il mio capo ha organizzato una riunione importante e non ho tempo per visitare te."
      errors: [object-pronoun]
    - tutor: "Peccato! Ma «visitare te»? Prova con il pronome attaccato al verbo."
      prompt: {text: "visitare te", tags: [object-pronoun]}
    - learner: "Non ho tempo per vederti giovedì."
    - tutor: "Esatto! Allora un altro giorno."
    # merlin-1385_0001771-3
    - learner: "Noi possiamo andare in un ristorante tailandese."
    - tutor: "Che bella idea! Sabato sera?"
    # merlin-1385_0001195-3
    - learner: "Mi penso che non abbia di fare niente sabato."
      errors: [reflexive, preposition]
    - tutor: "Chi non ha niente da fare, tu? Ma «mi penso»? Quel «mi» serve?"
      prompt: {text: "Mi penso", tags: [reflexive]}
    - learner: "Penso di non avere niente da fare sabato. Sono libera!"
    - tutor: "Perfetto! Allora sabato alle otto, al ristorante!"
      goals: [propose]

- scenario: tempo-libero
  level: A2
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1395_0000470-0
    - learner: "Ho imparato tante cose."
    - tutor: "Ah, il corso di cucina? Racconta!"
    # merlin-1395_0001084-1
    - learner: "Ieri abbiamo imparato il passato prossimo."
    - tutor: "Ah, il corso di italiano! Io invece cerco lavoro: nel mio ufficio c'è poco lavoro."
      goals: [hobby]
    # merlin-1385_0001790-5
    - learner: "Quando vuoi cominciare con tuo lavoro nuovo?"
      errors: [possessive, preposition]
    - tutor: "Presto, spero! Ma «con tuo lavoro»? Prima di «tuo» manca qualcosa."
      prompt: {text: "tuo lavoro nuovo", tags: [possessive]}
    - learner: "Quando vuoi cominciare il tuo lavoro nuovo?"
    - tutor: "Esatto! A gennaio, spero."
    # merlin-1385_0001789-3
    - learner: "Vorrei sapere che tipo di lavoro vuoi fare?"
    - tutor: "In un ufficio, come adesso. Ma basta lavoro: usciamo sabato?"
    # merlin-1385_0001764-6
    - learner: "Andiamo a cena in il ristorante tailandese in il vicino a statizione?"
      errors: [articulated-preposition, spelling]
    - tutor: "Che bello! Ma «in il ristorante»? Quelle due parole diventano una."
      prompt: {text: "in il ristorante", tags: [articulated-preposition]}
    - learner: "Nel ristorante tailandese vicino a la stazione?"
      errors: [articulated-preposition]
    - tutor: "Al ristorante tailandese vicino alla stazione? Sì, con piacere!"
      goals: [propose]
      recast: {text: "vicino a la stazione", fix: "vicino alla stazione", tags: [articulated-preposition]}

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1395_0000356-0
    - learner: "Studio nella scuola di lingua italiana."
    - tutor: "Brava! E dopo la scuola?"
      goals: [work]
    # merlin-1395_0000646-2
    - learner: "Nel tempo libero andiamo con bus o in treno per vedere altre citté e paesini."
      errors: [article-use, spelling, preposition]
    - tutor: "Che bello! Ma «andiamo con bus»? Prima di bus manca qualcosa."
      prompt: {text: "con bus", tags: [article-use]}
    - learner: "Andiamo con bus o in treno, sì."
      errors: [article-use]
    - tutor: "Ah, con il bus o in treno, bello! E la sera?"
      recast: {text: "con bus", fix: "con il bus", tags: [article-use]}
    # merlin-1395_0001080-4
    - learner: "Doppo le lezione, la sera, vado mangiare con i nuovi amici italiani."
      errors: [preposition, spelling, noun-number]
    - tutor: "«Vado mangiare»? Tra i due verbi manca qualcosa."
      prompt: {text: "vado mangiare", tags: [preposition]}
    - learner: "Vado a mangiare! E tu, la sera cosa fai?"
    - tutor: "Esatto! Io la sera cerco lavoro su internet. Non è divertente!"
      goals: [evening, ask]
    # merlin-1385_0001788-2
    - learner: "Puoi dirmi dove lavori adesso e che lavora fai"
      errors: [word-choice]
    - tutor: "Che lavoro faccio? Lavoro in un bar, ma cerco un ufficio."
      recast: {text: "che lavora", fix: "che lavoro", tags: [word-choice]}
    # merlin-1385_0001789-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
    - tutor: "Grazie, sei gentile! Ti racconto tutto domani a colazione."

- scenario: weekend-scorso
  level: A2
  persona: es-m-worker
  history: [question-form]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1395_0000563-1
    - learner: "Io sto bene."
    - tutor: "Bene! E il weekend? Cosa hai fatto?"
    - learner: "Sono andato a Verona con mia moglie. Abbiamo visto l'Arena."
    - tutor: "Che bello! Io invece ho cercato lavoro tutto il weekend. Qui non mi trovo bene."
      goals: [where, what, with-who]
    # merlin-1385_0001785-0
    - learner: "Puoi mi dice che lavoro fai adesso?"
      errors: [pronoun-position, modal-infinitive]
    - tutor: "Lo sai che lavoro faccio! Ma «puoi mi dice»? Dopo puoi, il verbo e il pronome cambiano."
      prompt: {text: "Puoi mi dice", tags: [pronoun-position]}
    - learner: "Puoi dirmi che lavoro vuoi fare?"
    - tutor: "Perfetto! Vorrei lavorare in una scuola, con i ragazzi."
    # merlin-1385_0000021-3
    - learner: "Puoi dirmi finalmente quando puoi comminciare a lavorare"
      errors: [spelling]
    - tutor: "Ah, tu vuoi sapere tutto! Ma «comminciare»? Guarda le doppie."
      prompt: {text: "comminciare", tags: [spelling]}
    - learner: "Cominciare, con una m! Quando puoi cominciare?"
    - tutor: "Esatto! Da settembre, se tutto va bene."
    # merlin-1385_0001799-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
    - tutor: "Grazie! Stasera ti scrivo tutto."

- scenario: famiglia
  level: A2
  persona: es-f-erasmus
  history: [word-order]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono io con mia madre e mia sorella Carmen, a Siviglia."
    - tutor: "Che belle! E tua sorella com'è?"
      goals: [who]
    # merlin-1395_0000458-5
    - learner: "Sei una infermiera ancora?"
      errors: [word-order]
    - tutor: "Io? Sì! Ma «sei una infermiera ancora»? Dove va «ancora»?"
      prompt: {text: "Sei una infermiera ancora", tags: [word-order]}
    - learner: "Sei ancora una infermiera? Anche mia sorella è infermiera, è molto dolce."
    - tutor: "Esatto! Sì, sono ancora infermiera. E come sta la tua famiglia adesso?"
      goals: [describe]
    # merlin-1395_0000451-4
    - learner: "Mia familia sta molto bene anche."
      errors: [possessive, word-order, spelling]
    - tutor: "Che bello! Ma «sta molto bene anche»? Di nuovo, attenzione al posto di una parola."
      prompt: {text: "sta molto bene anche", tags: [word-order]}
    - learner: "Anche la mia famiglia sta molto bene!"
    - tutor: "Perfetto, così va bene! Che bello."
    # merlin-1395_0000531-6
    - learner: "Come sta la tua famiglia?"
    - tutor: "Bene, grazie! Mio fratello si sposa a maggio."
      goals: [ask]

# v-real-a2-2, file 08: busy weeks, changed plans and news from friends (A2, real learner sentences).
- scenario: serata-cinema
  level: A2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    # merlin-1385_0001120-1
    - learner: "Io sto molto bene ma è una settimana orribile in ufficio c'è molto lavoro e giovedì pomeriggio non posso andare un appuntamento."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace! Ma «andare un appuntamento»? Dopo andare manca qualcosa."
      prompt: {text: "andare un appuntamento", tags: [articulated-preposition]}
    # merlin-1385_0001746-0
    - learner: "Mi dispiace, ma non posso andare a appuntamento con te, perche ho bisogno."
      errors: [articulated-preposition, spelling]
    - tutor: "Ah, non puoi venire all'appuntamento con me giovedì. Va bene! Allora stasera usciamo?"
      recast: {text: "a appuntamento", fix: "all'appuntamento", tags: [articulated-preposition]}
    # merlin-1385_0001759-4
    - learner: "Oppure andiamo a cena in un ristorante tailandese?"
    - tutor: "Prima un film e poi la cena? C'è una commedia alle sette."
      goals: [propose]
    # merlin-1385_0001718-3
    - learner: "Andiamo a cena in un ristaurante tailandese."
      errors: [spelling]
    - tutor: "Sì, dopo il film! Ma «ristaurante»? Guarda bene come si scrive."
      prompt: {text: "ristaurante", tags: [spelling]}
    - learner: "Il ristaurante dopo il film, va bene."
      errors: [spelling]
    - tutor: "Il ristorante dopo il film, perfetto! Ti piacciono le commedie?"
      recast: {text: "ristaurante", fix: "ristorante", tags: [spelling]}
    # merlin-1385_0001760-0
    - learner: "Scusami, è una settimana orribile."
    - tutor: "Allora una commedia è perfetta, per ridere un po'! Ci vediamo alle sette meno dieci davanti al cinema?"
      goals: [genre, choose]
    # merlin-1385_0001752-4
    - learner: "Come sei l'accordo"
      errors: [word-choice]
    - tutor: "Se sono d'accordo? Certo! A stasera."
      goals: [meet]
      recast: {text: "l'accordo", fix: "d'accordo", tags: [word-choice]}
    # merlin-1385_0001158-7
    - learner: "Ricordati che ti aspetto!"
    - tutor: "Non lo dimentico! Ciao, a stasera."

- scenario: giorno-tipico
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1385_0001147-1
    - learner: "Oggi, è una settimana orribile."
    - tutor: "Lo vedo! Ti alzi presto?"
    # merlin-1385_0001524-4
    - learner: "Sono domani a la mattina in ufficio."
      errors: [word-order, articulated-preposition]
    - tutor: "Scusa, come? Prova a mettere «domani» all'inizio."
      prompt: {text: "Sono domani", tags: [word-order]}
    - learner: "Domani sono a la mattina in ufficio."
      errors: [articulated-preposition]
    - tutor: "Ah, domani sei in ufficio la mattina. Ma «a la mattina»? Prova senza «a»."
      prompt: {text: "a la mattina", tags: [articulated-preposition]}
    - learner: "Domani sono in ufficio la mattina, dalle sette!"
    - tutor: "Esatto! Dalle sette, povera te. E la sera?"
      goals: [wake, work]
    # merlin-1395_0000390-1
    - learner: "Da noi è tutto posto pero a lavoro è veramente difficile negli ultimi tempi."
      errors: [preposition, articulated-preposition, spelling]
    - tutor: "Mi dispiace. Ma «tutto posto»? Manca una piccola parola."
      prompt: {text: "tutto posto", tags: [preposition]}
    - learner: "Da noi è tutto posto, sì. La sera dormo."
      errors: [preposition]
    - tutor: "Meno male che da voi è tutto a posto! E la sera dormi, giustamente."
      goals: [evening]
      recast: {text: "tutto posto", fix: "tutto a posto", tags: [preposition]}
    # merlin-1385_0001148-3
    - learner: "Mi dispiace molto!"
    - tutor: "Ma no, è normale! Anche per me la giornata è lunga."
    # merlin-1385_0001793-3
    - learner: "Dove lavori adesso?"
    - tutor: "In un negozio di libri, da settembre. Mi piace tanto!"
      goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: es-f-erasmus
  history: [article-use]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1385_0001719-3
    - learner: "Hai voglia di incontro sabato sera?"
      errors: [article-use]
    - tutor: "Sabato sera? Sì! Ma «voglia di incontro»? Manca qualcosa prima di incontro."
      prompt: {text: "voglia di incontro", tags: [article-use]}
    - learner: "Hai voglia di incontro, sabato?"
      errors: [article-use]
    - tutor: "Sì, ho voglia di un incontro sabato! Cosa facciamo?"
      goals: [propose]
      recast: {text: "voglia di incontro", fix: "voglia di un incontro", tags: [article-use]}
    # merlin-1385_0001751-4
    - learner: "Noi vogliamo andare a cena in un ristorante tailandese."
    - tutor: "Tu e i tuoi amici? Perfetto, vengo anch'io. Ci andate spesso?"
      goals: [hobby]
    # merlin-1365_0100471-6
    - learner: "Poi, vado in un paese sconosciuto, forse Australia, perchè mi piace la natura e la lingua."
      errors: [article-use, spelling]
    - tutor: "Che bello! Ma «forse Australia»? Con i nomi dei paesi, cosa ci vuole?"
      prompt: {text: "forse Australia", tags: [article-use]}
    - learner: "Forse in Australia, l'anno prossimo! Mi piace viaggiare ogni estate."
    - tutor: "Perfetto! Ogni estate un paese nuovo, che bello."
      goals: [frequency]
    # merlin-1385_0000034-2
    - learner: "Che tipo di lavoro vuoi fare?"
    - tutor: "Io? Mi piacerebbe lavorare con i viaggi, come te!"
      goals: [ask]

- scenario: weekend-scorso
  level: A2
  persona: en-f-student
  history: [ce-ci-sono]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1385_0000130-0
    - learner: "È una settimana orribile."
    - tutor: "Davvero? E il weekend?"
    # merlin-1395_0000550-1
    - learner: "C'è un tempo che non ci sentiamo!"
      errors: [ce-ci-sono]
    - tutor: "Hai ragione! Ma «c'è un tempo»? Diciamo in un altro modo, con «da»."
      prompt: {text: "C'è un tempo", tags: [ce-ci-sono]}
    - learner: "C'è da tempo che non ci sentiamo!"
      errors: [ce-ci-sono]
    - tutor: "Eh sì, è da tempo che non ci sentiamo! Allora, dove sei andata sabato?"
      recast: {text: "C'è da tempo", fix: "è da tempo", tags: [ce-ci-sono]}
    # merlin-1395_0001093-5
    - learner: "Una volta sono partita a Genova."
      errors: [preposition]
    - tutor: "A Genova? Ma «partita a»? Con partire, la preposizione è un'altra."
      prompt: {text: "partita a", tags: [preposition]}
    - learner: "Sono partita per Genova con mia sorella."
    - tutor: "Esatto! Genova, che bella. Cosa avete fatto?"
      goals: [where, with-who]
    # merlin-1395_0000379-1
    - learner: "La isola e fantastica, e io penso a te."
      errors: [article-form, spelling]
    - tutor: "Un'isola vicino a Genova? Ma «la isola»? Davanti a «isola», l'articolo cambia."
      prompt: {text: "La isola", tags: [article-form]}
    - learner: "La isola Palmaria, sì. È fantastica."
      errors: [article-form]
    - tutor: "L'isola Palmaria, sì! Ci sono stata da piccola. Ti è piaciuta?"
      goals: [what]
      recast: {text: "La isola", fix: "L'isola", tags: [article-form]}
    # merlin-1395_0000392-3
    - learner: "È molto bello."
    - tutor: "Sono contenta! Ma tu, perché questa settimana è orribile?"
      goals: [opinion]

- scenario: lavanderia
  level: A2
  persona: en-m-retired
  history: [article-form]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    # merlin-1365_0100181-2
    - learner: "Ma ho un problemo con i figli."
      errors: [noun-gender]
    - tutor: "Con i figli? Ma «un problemo»? La parola finisce in un altro modo."
      prompt: {text: "un problemo", tags: [noun-gender]}
    - learner: "Un problemo, sì. Mettono tutto nella lavatrice!"
      errors: [noun-gender]
    - tutor: "Ah, un problema classico! Mettono tutto insieme. Fammi vedere."
      goals: [problem]
      recast: {text: "un problemo", fix: "un problema", tags: [noun-gender]}
    # merlin-1365_0100104-11
    - learner: "Quanto costano le lessione nella scuola e il allogio in una casa privata d'una famiglia Italiana?"
      errors: [spelling, article-form]
    - tutor: "Ah, i figli studiano qui? Ma «il allogio»? Attenzione all'articolo prima di questa parola."
      prompt: {text: "il allogio", tags: [article-form]}
    - learner: "L'alloggio! Ma prima: come funziona questa lavatrice?"
    - tutor: "Esatto! Allora: metti la moneta e scegli il programma a quaranta gradi."
      goals: [ask-how]
    # merlin-1365_0100104-12
    - learner: "Tante grazie per le informazione."
      errors: [noun-number]
    - tutor: "Prego! Ma «le informazione»? Sono tante, no?"
      prompt: {text: "le informazione", tags: [noun-number]}
    - learner: "Le informazioni, scusa! Quanto costa?"
    - tutor: "Esatto! Quattro euro ogni volta."
      goals: [payment]
    # merlin-1365_0100185-2
    - learner: "Mille grazie per il messaggio."
    - tutor: "Il messaggio? Ah, le informazioni! Di niente, buona giornata."
      goals: [thank]

- scenario: famiglia
  level: A2
  persona: es-f-teacher
  history: [subject-verb-agreement]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    # merlin-1395_0000379-2
    - learner: "La nostra familia non devo fare le vacanze insième."
      errors: [subject-verb-agreement, spelling]
    - tutor: "Ah, è la tua famiglia? Ma «la famiglia non devo»? Chi deve?"
      prompt: {text: "non devo fare", tags: [subject-verb-agreement]}
    - learner: "La famiglia non devo, scusa... non può fare le vacanze insieme."
    - tutor: "Ecco, così va bene! Perché non potete?"
      goals: [who]
    # merlin-1395_0000414-4
    - learner: "Papa lavora un può tanto, ma lui vuole."
      errors: [spelling, object-pronoun]
    - tutor: "Ah, papà! Ma «un può»? Lì non c'è il verbo potere..."
      prompt: {text: "un può", tags: [spelling]}
    - learner: "Un po' tanto! Mio padre ha sessant'anni e lavora sempre."
    - tutor: "Esatto, un po'! Sessant'anni e lavora sempre, bravo."
      goals: [describe, ages]
    # merlin-1395_0000529-1
    - learner: "Sto molto bene e anche la mia famiglia."
    - tutor: "Che bello! Mi fa piacere."
    # merlin-1395_0000598-0
    - learner: "Come state?"
    - tutor: "Bene, grazie! Mia sorella aspetta un bambino."
      goals: [ask]

- scenario: compleanno
  level: A2
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1395_0001071-3
    - learner: "Propongo di incontrarci in ottobre."
    - tutor: "Ma il compleanno è il 3 ottobre! Facciamo la festa il sabato prima?"
    # merlin-1385_0001105-2
    - learner: "Hai voglia di andare a cena in ristorante tailandese al sabato sera?"
      errors: [article-use, articulated-preposition]
    - tutor: "Sì! Ma «in ristorante tailandese»? Manca qualcosa prima di ristorante."
      prompt: {text: "in ristorante tailandese", tags: [article-use]}
    - learner: "Sì, in ristorante tailandese, con tutti gli amici."
      errors: [article-use]
    - tutor: "In un ristorante tailandese con tutti gli amici, perfetto! A Sara piace."
      goals: [date, guests, food]
      recast: {text: "in ristorante tailandese", fix: "in un ristorante tailandese", tags: [article-use]}
    # merlin-1365_0100280-10
    - learner: "Vorrei chiedere cosa posso regalare."
    - tutor: "Le piace cucinare. Sabato compro un libro di cucina in centro."
    # merlin-1365_0100228-7
    - learner: "Poi vado con te."
    - tutor: "Perfetto! Lo compreremo insieme sabato mattina."
      goals: [gift]

- scenario: medico-base
  level: A2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    # merlin-1385_0001189-0
    - learner: "È una setimana orribile."
      errors: [spelling]
    - tutor: "Mi dispiace. Ma «setimana»? Guardi bene come si scrive."
      prompt: {text: "setimana", tags: [spelling]}
    - learner: "Settimana! Ho mal di testa e la febbre da lunedì."
    - tutor: "Esatto. Da lunedì, quindi da tre giorni. Ha preso medicine?"
      goals: [symptoms, since-when]
    - learner: "No, niente. Sono allergico a la aspirina."
      errors: [articulated-preposition]
    - tutor: "«A la aspirina»? Quelle due parole diventano una."
      prompt: {text: "a la aspirina", tags: [articulated-preposition]}
    - learner: "Sì, allergico a la aspirina."
      errors: [articulated-preposition]
    - tutor: "Allergico all'aspirina, va bene. Allora prenda questa medicina, due volte al giorno."
      goals: [history]
      recast: {text: "a la aspirina", fix: "all'aspirina", tags: [articulated-preposition]}
    # merlin-1385_0001522-1
    - learner: "Mi scusi, ma ho molto lavoro in uffico questa settimana."
      errors: [spelling]
    - tutor: "Capisco. Ma «uffico»? Guardi bene come si scrive."
      prompt: {text: "uffico", tags: [spelling]}
    - learner: "Ufficio! Ma devo stare a casa?"
    - tutor: "Esatto. Sì, il lavoro può aspettare: resti a casa tre giorni e beva molta acqua!"
      goals: [instructions]

- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  history: [article-use]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100104-5
    - learner: "Mi piace l'idea d'unire le vacance con la possibilità d'imparare una lingua straniera."
      errors: [spelling]
    - tutor: "Ah, una vacanza studio! Ma «le vacance»? Guarda bene come si scrive."
      prompt: {text: "le vacance", tags: [spelling]}
    - learner: "Sì, le vacance con un corso a Perugia, un mese."
      errors: [spelling]
    - tutor: "Le vacanze con un corso a Perugia, bellissimo! Cosa hai visto?"
      goals: [where]
      recast: {text: "le vacance", fix: "le vacanze", tags: [spelling]}
    # merlin-1395_0000364-5
    - learner: "Ti faccio vedere i posti molto interessanti: le città che mi piacciono."
    - tutor: "Che belle foto! E gli altri studenti?"
      goals: [activities]
    # merlin-1395_0001103-3
    - learner: "Sono un vero «Dreamteam»."
    - tutor: "Una squadra perfetta, allora! E la cosa più bella?"
    # merlin-1395_0000458-7
    - learner: "Vorresti incontrarmi prossimo anno?"
      errors: [article-use]
    - tutor: "A Perugia? Ma «prossimo anno»? Manca qualcosa prima."
      prompt: {text: "prossimo anno", tags: [article-use]}
    - learner: "Sì, prossimo anno a Perugia, con il corso!"
      errors: [article-use]
    - tutor: "Il prossimo anno a Perugia con te? Con piacere! Allora la cosa più bella è stata il corso."
      goals: [best]
      recast: {text: "prossimo anno", fix: "il prossimo anno", tags: [article-use]}

# v-real-a2-2, file 05: holidays and weekends told to friends and colleagues (A2, real learner sentences).
- scenario: vacanze-passate
  level: A2
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000548-2
    - learner: "Io sono ritornata delle mie vacanze in Sardegna."
      errors: [articulated-preposition]
    - tutor: "Che bello rivederti! Ma «ritornata delle mie vacanze»? Pensa: torni da un posto..."
      prompt: {text: "delle mie vacanze", tags: [articulated-preposition]}
    - learner: "Sì, sono ritornata delle vacanze sabato."
      errors: [articulated-preposition]
    - tutor: "Ah, sei ritornata dalle vacanze sabato! E com'è la Sardegna?"
      goals: [where]
      recast: {text: "delle vacanze", fix: "dalle vacanze", tags: [articulated-preposition]}
    # merlin-1395_0000392-4
    - learner: "Il tempo è ottimo è la gente molto simpatice."
      errors: [adjective-agreement, spelling]
    - tutor: "Che bello! Ma «la gente molto simpatice»? Gente è una parola singolare."
      goals: [weather]
      prompt: {text: "simpatice", tags: [adjective-agreement]}
    - learner: "La gente è molto simpatica! E il mare è bellissimo."
    - tutor: "Esatto! E cosa hai fatto di bello?"
    # merlin-1395_0000379-3
    - learner: "Ma io fatto delle belle fotografie."
      errors: [auxiliary-choice]
    - tutor: "Fammele vedere! Ma «io fatto»? Al passato manca un pezzo."
      prompt: {text: "io fatto", tags: [auxiliary-choice]}
    - learner: "Io ho fatto delle belle fotografie! Guarda questa."
    - tutor: "Brava! Che spiaggia! E l'acqua così chiara..."
      goals: [activities]
    # merlin-1395_0001147-2
    - learner: "Sono molto fortunata!"
    - tutor: "Proprio! E cosa ti è piaciuto di più?"
    # merlin-1395_0000413-4
    - learner: "Sono anche andata al mare, ho preso il treno per Cagliari."
    - tutor: "Il mare, certo! L'anno prossimo vengo con te."
      goals: [best]

- scenario: vacanze-passate
  level: A2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000465-3
    - learner: "In vacanza sono andata in montagnia - un mio amico ha ci una casa."
      errors: [pronoun-position, spelling]
    - tutor: "In montagna, che bello! Ma «ha ci una casa»? Dove va quel «ci»?"
      prompt: {text: "ha ci una casa", tags: [pronoun-position]}
    - learner: "Ci ha una casa! Un mio amico ci ha una casa."
    - tutor: "Perfetto! E che tempo faceva in montagna?"
      goals: [where]
    - learner: "Faceva fresco, ma c'era il sol ogni giorno."
      errors: [word-choice]
    - tutor: "Fresco, ma con il sole ogni giorno: ideale! E cosa avete fatto?"
      goals: [weather]
      recast: {text: "il sol", fix: "il sole", tags: [word-choice]}
    # merlin-1395_0001093-4
    - learner: "Nel mio tempo libero faccio l'escursioni."
      errors: [article-form, tense-aspect]
    - tutor: "«Faccio»? Parli di adesso o delle vacanze?"
      prompt: {text: "faccio l'escursioni", tags: [tense-aspect]}
    - learner: "Delle vacanze: facevo l'escursioni ogni mattina."
      errors: [article-form]
    - tutor: "Brava, facevi escursioni ogni mattina! Ma «l'escursioni»? Con il plurale, l'articolo cambia."
      goals: [activities]
      prompt: {text: "l'escursioni", tags: [article-form]}
    - learner: "Le escursioni! Facevo le escursioni con il mio amico."
    - tutor: "Esatto! E cosa ti è piaciuto di più?"
    # merlin-1395_0000470-0
    - learner: "Ho imparato tante cose."
    - tutor: "Ah sì? Per esempio?"
    # merlin-1395_0000504-0
    - learner: "C'è un luogo famoso in Sicilia."
    - tutor: "In Sicilia? Ah, vuoi andare là la prossima volta? Bellissima idea!"

- scenario: vacanze-passate
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000575-0
    - learner: "Cari amici, adesso, io sono andati in Sardegna tra due mesi per imparare l'italiano."
      errors: [subject-verb-agreement, preposition]
    - tutor: "Ah, leggi il tuo messaggio agli amici? Ma «io sono andati»? Con «io», il verbo va bene?"
      prompt: {text: "io sono andati", tags: [subject-verb-agreement]}
    - learner: "Io sono andato in Sardegna per due mesi, per il corso di italiano."
    - tutor: "Perfetto! Due mesi in Sardegna, che fortuna. E che tempo faceva?"
      goals: [where]
    - learner: "Sempre sole e caldo, trenta grados."
      errors: [word-choice]
    - tutor: "Trenta gradi, che caldo! E fuori dal corso, cosa facevate?"
      goals: [weather]
      recast: {text: "trenta grados", fix: "Trenta gradi", tags: [word-choice]}
    # merlin-1395_0000646-2
    - learner: "Nel tempo libero andiamo con bus o in treno per vedere altre citté e paesini."
      errors: [article-use, spelling, tense-aspect]
    - tutor: "«Andiamo»? Parli delle vacanze passate o di oggi?"
      prompt: {text: "andiamo con bus", tags: [tense-aspect]}
    - learner: "Andavamo con il bus o in treno a vedere altri paesi."
    - tutor: "Esatto, andavate! Che bello girare così. E oggi, com'è la vita qui?"
      goals: [activities]
    # merlin-1395_0001013-2
    - learner: "Se non c'è lezione, visitiamo la città."
    - tutor: "Ah, il corso continua anche qui! Ma in Sardegna, cosa ti è piaciuto di più?"
    - learner: "Le playe e la gente. E il corso, naturalmente!"
      errors: [word-choice]
    - tutor: "Le spiagge e la gente, che bello! E nel weekend, cosa fai adesso?"
      recast: {text: "Le playe", fix: "Le spiagge", tags: [word-choice]}
      goals: [best]
    # merlin-1395_0001104-2
    - learner: "Qualce volta, vado in calcio."
      errors: [spelling, articulated-preposition]
    - tutor: "Bello! Ma «vado in calcio»? Con calcio, la preposizione è un'altra."
      prompt: {text: "vado in calcio", tags: [articulated-preposition]}
    - learner: "Vado al calcio, a vedere le partite."
    - tutor: "Esatto, al calcio! Allora domenica vengo con te."

- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0001069-5
    - learner: "La settimana scorsa ho fatto delle vacanze."
    - tutor: "Sì, lo so! Ma dove sei andato?"
    # merlin-1395_0001093-5
    - learner: "Una volta sono partita a Firenze."
      errors: [participle-agreement, preposition]
    - tutor: "A Firenze! Ma «sono partita»? Parli di te, un uomo..."
      prompt: {text: "sono partita", tags: [participle-agreement]}
    - learner: "Sono partito! Sono partito a Firenze con mia moglie."
      errors: [preposition]
    - tutor: "Bravo, sei partito! Ma «partito a Firenze»? Con partire, la preposizione è un'altra."
      prompt: {text: "partito a Firenze", tags: [preposition]}
    - learner: "Sono partito a Firenze, sì."
      errors: [preposition]
    - tutor: "Ah, sei partito per Firenze. Che bello! E cosa avete visto?"
      goals: [where]
      recast: {text: "partito a Firenze", fix: "partito per Firenze", tags: [preposition]}
    # merlin-1395_0000565-7
    - learner: "Qualce volta mangiamo asieme al ristorante."
      errors: [spelling]
    - tutor: "Che bello! Ma «qualce» e «asieme»? Guarda bene come si scrivono."
      prompt: {text: "Qualce volta mangiamo asieme", tags: [spelling]}
    - learner: "Qualche volta mangiamo assieme! Mangiavamo al ristorante ogni sera."
    - tutor: "Perfetto! Ci tornerai?"
      goals: [activities]
    # merlin-1395_0001114-2
    - learner: "Ci sono le chiese e c'è qualcos'altro che posso visitare?"
    - tutor: "Gli Uffizi, se non li hai visti! Che belle vacanze."

- scenario: weekend-scorso
  level: A2
  persona: en-f-professional
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1395_0000627-1
    - learner: "Sto molto bene."
    - tutor: "Che bello! E il weekend, cosa hai fatto?"
    # merlin-1395_0000413-4
    - learner: "Sono anche andata al mare, ho preso il treno per Rimini."
    - tutor: "Al mare a novembre! Con chi sei andata?"
      goals: [where]
    - learner: "Con la mia amica Giulia. Siamo andato in treno, solo per un giorno."
      errors: [participle-agreement]
    - tutor: "Con Giulia, che bello! Ma «siamo andato»? Siete due ragazze..."
      prompt: {text: "Siamo andato", tags: [participle-agreement]}
    - learner: "Siamo andate! Siamo andate in treno."
    - tutor: "Brava, perfetto! E cosa avete fatto?"
      goals: [with-who]
    # merlin-1395_0000379-3
    - learner: "Ma io fatto delle belle fotografie."
      errors: [auxiliary-choice]
    - tutor: "Ah, ecco! Ma «io fatto»? Manca un piccolo verbo."
      prompt: {text: "io fatto", tags: [auxiliary-choice]}
    - learner: "Ho fatto le foto del mare e del porto!"
    - tutor: "Esatto! Bellissime, fammele vedere! Ti è piaciuto?"
      goals: [what]
    # merlin-1395_0000392-3
    - learner: "È molto bello."
      errors: [tense-aspect]
    - tutor: "«È»? Parli di adesso o del weekend?"
      prompt: {text: "È molto bello", tags: [tense-aspect]}
    - learner: "È stato molto bello! E il tuo weekend?"
    - tutor: "Esatto! Il mio? Tranquillo, a casa con un libro."
      goals: [opinion]

- scenario: weekend-scorso
  level: A2
  persona: es-f-teacher
  history: [article-form]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1395_0001033-1
    - learner: "Questa volta vorrei fare le esame per «Italiano A2»."
      errors: [article-form]
    - tutor: "Ah, hai studiato tutto il weekend? Ma «le esame»? È uno solo..."
      prompt: {text: "le esame", tags: [article-form]}
    - learner: "Sì, ho studiato a casa per le esame di giugno."
      errors: [article-form]
    - tutor: "Brava, a casa per l'esame di giugno! Hai studiato da sola?"
      goals: [where, what]
      recast: {text: "le esame", fix: "l'esame", tags: [article-form]}
    # merlin-1395_0001058-1
    - learner: "La mia insegnante, Francesca Rossi, è gentille."
      errors: [spelling]
    - tutor: "È venuta lei? Ma «gentille»? Guarda bene le doppie."
      prompt: {text: "gentille", tags: [spelling]}
    - learner: "Sì, è venuta sabato. È molto gentille."
      errors: [spelling]
    - tutor: "Molto gentile, che fortuna! Studiare con lei è meglio."
      goals: [with-who]
      recast: {text: "gentille", fix: "gentile", tags: [spelling]}

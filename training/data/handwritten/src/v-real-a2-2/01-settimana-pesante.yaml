# v-real-a2-2, file 01: a hard week at work, in everyday places (A2, real learner sentences).
- scenario: giorno-tipico
  level: A2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1385_0001196-1
    - learner: "Per me è una settimana orribile."
    - tutor: "Oh no, mi dispiace! Senti, giovedì pomeriggio prendiamo un caffè in centro?"
    # merlin-1385_0001191-1
    - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarmi con te, perché il mio capo ha organizzato una riunione giovedì pomeriggio."
    - tutor: "Peccato! Allora un'altra volta. E la sera cosa fai, di solito?"
      goals: [work]
    # merlin-1395_0001080-4
    - learner: "Doppo le lezione, la sera, vado mangiare con i nuovi amici italiani."
      errors: [spelling, noun-number, preposition]
    - tutor: "Che bello! Ma «vado mangiare»? Tra i due verbi manca qualcosa."
      prompt: {text: "vado mangiare", tags: [preposition]}
    - learner: "Vado a mangiare con loro, in una pizzeria molto barata."
      errors: [word-choice]
    - tutor: "Perfetto! E una pizzeria economica è proprio quello che serve. Io invece la sera sono stanca morta."
      goals: [evening]
      recast: {text: "molto barata", fix: "economica", tags: [word-choice]}
    # merlin-1395_0001076-5
    - learner: "Tutto a posto?"
    - tutor: "Sì, sì, tutto a posto! Lavoro tanto in negozio, ma nel weekend dormo fino a tardi."
      goals: [ask]
    # merlin-1385_0001751-9
    - learner: "Fammi sapere se sei d'accordo"
    - tutor: "D'accordo su cosa? Ah, il caffè! Sì, facciamo sabato mattina."

- scenario: bar-colazione
  level: A2
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno! Un caffè doppio, per favore."
    - tutor: "Doppio, eh? Giornata difficile?"
      goals: [greet, order-drink]
    # merlin-1385_0000127-0
    - learner: "Questa settimana, è una settimana orribile."
    - tutor: "Mi dispiace! Problemi al lavoro?"
    # merlin-1385_0001524-1
    - learner: "Il mio capo ha organizzato una riunione giovedì pomeriggio."
    - tutor: "Ah, una riunione! Allora le serve forza. Un cornetto?"
    - learner: "Sì, un cornetto con jam, per favore. Quanto pago?"
      errors: [word-choice]
    - tutor: "Ecco il cornetto con marmellata. Sono tre euro e venti, e buona fortuna per giovedì!"
      goals: [order-food, pay]
      recast: {text: "con jam", fix: "con marmellata", tags: [word-choice]}
      new: [{lemma: marmellata, gloss: jam}]

- scenario: palestra
  level: A2
  persona: en-f-student
  history: [question-form]
  turns:
    - tutor: "Ciao! Vuoi informazioni sull'abbonamento? Un mese costa quaranta euro, i corsi sono a parte."
    # merlin-1365_0100106-5
    - learner: "Potrebbe dirmi anche questi prezzi?"
    - tutor: "Certo! Yoga costa venti euro al mese, gli altri corsi trenta. E dammi pure del tu!"
      goals: [ask-membership, classes]
    # merlin-1385_0001522-3
    - learner: "Quanto fini lavori a sabato?"
      errors: [question-form, preposition]
    - tutor: "Scusa, «quanto fini»? Non ho capito bene la domanda."
      prompt: {text: "Quanto fini", tags: [question-form]}
    - learner: "Scusa: fino a quando lavori il sabato?"
    - tutor: "Ah, ecco! Il sabato sono qui fino alle sei. Yoga invece c'è il martedì sera."
      goals: [timetable]
    - learner: "Perfetto, allora faccio la subscription per un mese, con yoga."
      errors: [word-choice]
    - tutor: "Perfetto, ti faccio l'iscrizione per un mese! Mi dai un documento?"
      goals: [sign-up]
      recast: {text: "la subscription", fix: "l'iscrizione", tags: [word-choice]}

- scenario: parrucchiere
  level: A2
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
    - learner: "Buongiorno! Vorrei tagliare il pelo, per favore. È troppo lungo."
      errors: [word-choice]
    - tutor: "Tagliamo i capelli, va bene. Quanto corti li vuole?"
      goals: [book]
      recast: {text: "il pelo", fix: "i capelli", tags: [word-choice]}
    - learner: "Non troppo corti. Fino a qui, sotto le orejas."
      errors: [word-choice]
    - tutor: "Sotto le orecchie, perfetto. Ha programmi per il fine settimana?"
      goals: [length]
      recast: {text: "le orejas", fix: "le orecchie", tags: [word-choice]}
      new: [{lemma: orecchio, gloss: ear}]
    # merlin-1385_0001111-3
    - learner: "Andiamo a cena in un ristorante tailandese."
    - tutor: "Che bello! Le piace la cucina di altri paesi?"
    # merlin-1385_0001135-6
    - learner: "Mi piace molto la cucina asiatica e sabato offro io."
    - tutor: "Che brava amica! Ecco fatto, sono trentotto euro. Prendiamo già il prossimo appuntamento, giovedì pomeriggio?"
      goals: [style]
    # merlin-1385_0001761-1
    - learner: "Il mio capo ha organizzato una riunione giovedì pomeriggio."
    - tutor: "Nessun problema, allora venerdì alle cinque. Ecco lo scontrino, buona cena!"
      goals: [pay]

- scenario: medico-base
  level: A2
  persona: en-m-retired
  history: [past-participle-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    # merlin-1385_0001523-1
    - learner: "Io non mi sento troppo bene, è una settimana orribile."
    - tutor: "Mi dispiace. Mi dica: ha la febbre, la tosse?"
    - learner: "Ho mal di testa e un po' di febbre, da lunedì. Non ho dormuto bene."
      errors: [past-participle-form]
    - tutor: "«Non ho dormuto»? Dormire è come finire: ho finito, ho...?"
      goals: [symptoms, since-when]
      prompt: {text: "ho dormuto", tags: [past-participle-form]}
    - learner: "Non ho dormuto, no."
      errors: [past-participle-form]
    - tutor: "Capisco, non ha dormito. Prenda questa medicina due volte al giorno e resti a casa fino a venerdì."
      recast: {text: "dormuto", fix: "dormito", tags: [past-participle-form]}
    # merlin-1385_0001524-1
    - learner: "Il mio capo ha organizzato una riunione giovedì pomeriggio."
    - tutor: "Capisco, ma la salute viene prima. Resti a letto e beva molta acqua!"
      goals: [instructions]

- scenario: weekend-scorso
  level: A2
  persona: en-f-student
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Sabato sei andata a Milano con tuo fratello, vero? Cosa avete visto?"
    # merlin-1395_0001104-4
    - learner: "Ho visitato il duomo."
    - tutor: "Il Duomo è bellissimo! E come siete arrivati in alto?"
    - learner: "Abbiamo salito a piedi. Duecento scalini!"
      errors: [auxiliary-choice]
    - tutor: "Bravi! Ma «abbiamo salito»? Con salire, quale verbo usiamo al passato?"
      prompt: {text: "abbiamo salito", tags: [auxiliary-choice]}
    - learner: "Siamo saliti a piedi, sì. Molto stanchi, ma contenti."
    - tutor: "Brava, così è giusto! E dopo?"
    # merlin-1395_0000627-6
    - learner: "Abbiamo fatto lo shopping."
    - tutor: "Classico! E la sera?"
      goals: [what]
    # merlin-1395_0000383-3
    - learner: "Poi siamo andati in una pizzeria."
    - tutor: "Una giornata perfetta! Ti è piaciuta Milano?"
    # merlin-1395_0001147-2
    - learner: "Sono molto fortunata!"
    - tutor: "Proprio così! Io invece sono rimasta a casa. La prossima volta vengo con voi!"
      goals: [opinion]

- scenario: tempo-libero
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1395_0001045-2
    - learner: "Nel mio tempo libero io vado con gli amici alla città fare shopping e qualche volte noi andiamo in piscina e dopo noi giocciamo a tennis per restare in forma."
      errors: [preposition, noun-number, spelling]
    - tutor: "Quanto sport! Ma «alla città»? Con città, quale preposizione usiamo?"
      prompt: {text: "alla città", tags: [preposition]}
    - learner: "Alla città, con gli amici, il sabato."
      errors: [preposition]
    - tutor: "Ah, in città con gli amici, il sabato. Io invece adoro cucinare, anche cose di altri paesi."
      goals: [hobby]
      recast: {text: "Alla città", fix: "in città", tags: [preposition]}
    # merlin-1385_0001191-3
    - learner: "Hai voglia di andare in un ristorante tailandese?"
    - tutor: "Che bella idea! Sabato sera va bene? Prenoto io."
      goals: [propose]

- scenario: prenotare-tavolo
  level: A2
  persona: es-m-worker
  history: [conditional-form]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    # merlin-1385_0001167-3
    - learner: "Non posso venire al nostro appuntamento."
    - tutor: "Scusi, quale appuntamento? Ha una prenotazione da noi?"
    - learner: "Sì, per giovedì sera, a nome Torres. Ma il mio jefe ha organizzato una riunione."
      errors: [word-choice]
    - tutor: "Ah, il suo capo ha organizzato una riunione, capisco. Vuole cambiare giorno?"
      goals: [name]
      recast: {text: "jefe", fix: "capo", tags: [word-choice]}
    - learner: "Sì, sabato sera, per due persone. Volerei un tavolo alle otto."
      errors: [conditional-form]
    - tutor: "«Volerei»? Ci pensi un attimo: è giusta questa forma di volere?"
      prompt: {text: "Volerei", tags: [conditional-form]}
    - learner: "Vorrei un tavolo alle otto, per favore."
    - tutor: "Perfetto, sabato alle otto per due. Desidera altro?"
      goals: [book, details]
    - learner: "Sì, potremmo mangiare fuori, in jardín?"
      errors: [word-choice]
    - tutor: "Certo, le do un tavolo in giardino. A sabato, signor Torres!"
      recast: {text: "in jardín", fix: "in giardino", tags: [word-choice]}
      new: [{lemma: giardino, gloss: garden}]
      goals: [special]

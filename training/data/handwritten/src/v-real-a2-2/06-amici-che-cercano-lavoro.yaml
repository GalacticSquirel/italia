# v-real-a2-2, file 06: chatting with friends who are looking for a new job (A2, real learner sentences).
- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  history: [article-form]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1395_0001033-5
    - learner: "Ma quando non c'è lezione facciamo le spese."
    - tutor: "Ah, tu e i tuoi compagni del corso? E quanto spesso?"
      goals: [hobby]
    # merlin-1395_0001141-3
    - learner: "Ogni giorno faccio il shopping anche."
      errors: [article-form]
    - tutor: "Ogni giorno! Ma «il shopping»? Attenzione all'articolo prima di questa parola."
      prompt: {text: "il shopping", tags: [article-form]}
    - learner: "Sì, il shopping, ogni giorno."
      errors: [article-form]
    - tutor: "Lo shopping ogni giorno, che vita! Io invece nel tempo libero cerco un lavoro nuovo."
      goals: [frequency]
      recast: {text: "il shopping", fix: "lo shopping", tags: [article-form]}
    # merlin-1385_0000041-3
    - learner: "Vorrei sapere che tipo di lavoro preferisci?"
    - tutor: "Qualcosa con le lingue, magari in un albergo."
    # merlin-1385_0000053-5
    - learner: "Sai lingue diverse?"
    - tutor: "Sì, inglese, francese e un po' di tedesco."
      goals: [ask]
    # merlin-1385_0001794-5
    - learner: "Quando voi incomiccare da lavorare?"
      errors: [verb-form, spelling, preposition]
    - tutor: "«Quando voi»? Parli con me, solo con me..."
      prompt: {text: "Quando voi", tags: [verb-form]}
    - learner: "Quando vuoi cominciare a lavorare?"
    - tutor: "Esatto! Subito, se trovo qualcosa."
    # merlin-1385_0001164-5
    - learner: "O hai voglia di andare al cinema sabato sera?"
    - tutor: "Sì, che bello, così non penso al lavoro!"
      goals: [propose]

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1365_0100098-9
    - learner: "Io lavoro ancora alla banca Ma è bello."
      errors: [preposition]
    - tutor: "Ancora in banca? Ma «alla banca»? Con banca, di solito usiamo un'altra preposizione."
      prompt: {text: "alla banca", tags: [preposition]}
    - learner: "Lavoro in banca, dalle otto alle cinque. Mi sveglio alle sei e mezza."
    - tutor: "Perfetto! Alle sei e mezza, presto! E la sera?"
      goals: [wake, work]
    # merlin-1395_0001045-2
    - learner: "Nel mio tempo libero io vado con gli amici alla città fare shopping e qualche volte noi andiamo in piscina e dopo noi giocciamo a tennis per restare in forma."
      errors: [preposition, noun-number, spelling]
    - tutor: "Quante cose! Ma «alla città fare shopping»? Mancano due piccole preposizioni."
      prompt: {text: "alla città fare shopping", tags: [preposition]}
    - learner: "Vado alla città a fare shopping."
      errors: [preposition]
    - tutor: "Ah, vai in città a fare shopping, con gli amici. Che bello!"
      goals: [evening]
      recast: {text: "alla città", fix: "in città", tags: [preposition]}
    # merlin-1385_0000047-3
    - learner: "Dove lavori adesso?"
    - tutor: "In un negozio di scarpe, ma voglio cambiare."
      goals: [ask]
    # merlin-1385_0001799-6
    - learner: "Ti piace avere un orario di lavoro regolamente?"
      errors: [word-choice]
    - tutor: "Un orario regolare? Sì, tanto! Nel negozio lavoro anche la domenica."
      recast: {text: "regolamente", fix: "regolare", tags: [word-choice]}
    # merlin-1385_0000033-3
    - learner: "Quando vuoi iniziare o quando puoi iniziare?"
    - tutor: "Voglio iniziare subito, ma posso solo da gennaio. Grazie delle domande!"

- scenario: weekend-scorso
  level: A2
  persona: es-f-erasmus
  history: [question-form]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1395_0000353-1
    - learner: "Ecco cosa faccio qui!"
    - tutor: "Ah, mi fai vedere le foto! Dove sei andata?"
    # merlin-1395_0001104-4
    - learner: "Ho visitato il duomo."
    - tutor: "Il Duomo di Siena? Bellissimo! Con chi eri?"
      goals: [where, what]
    # merlin-1395_0000537-4
    - learner: "Siamo andati a scuola insieme dieci anni fa!"
    - tutor: "Ah, con una vecchia compagna di scuola! E ti è piaciuto?"
      goals: [with-who]
    # merlin-1395_0000392-3
    - learner: "È molto bello."
      errors: [tense-aspect]
    - tutor: "«È»? Parli di adesso o di sabato?"
      prompt: {text: "È molto bello", tags: [tense-aspect]}
    - learner: "È stato molto bello! E tu, cosa hai fatto?"
    - tutor: "Esatto! Io ho cercato offerte di lavoro tutto il weekend. Cerco un altro lavoro."
      goals: [opinion]
    # merlin-1385_0000023-0
    - learner: "Puoi dirmi que lavoro tu hai fatto?"
      errors: [word-choice]
    - tutor: "Che lavoro ho fatto? Prima ho lavorato in un albergo, poi qui."
      recast: {text: "que lavoro", fix: "che lavoro", tags: [word-choice]}
    # merlin-1385_0000125-4
    - learner: "Sempre voui lavorare alla commessa?"
      errors: [word-order, spelling, preposition]
    - tutor: "Scusa, come? Prova a mettere le parole in un altro ordine."
      prompt: {text: "Sempre voui lavorare", tags: [word-order]}
    - learner: "Vuoi sempre lavorare come commessa?"
    - tutor: "Perfetto! Sì, voglio sempre fare la commessa: mi piace stare con le persone."

- scenario: famiglia
  level: A2
  persona: en-m-heritage
  history: [possessive]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    # merlin-1395_0000340-1
    - learner: "Mia famiglia sta bene anche."
      errors: [possessive, word-order]
    - tutor: "È la tua famiglia? Ma «mia famiglia»? Prima di «mia» manca qualcosa."
      prompt: {text: "Mia famiglia", tags: [possessive]}
    - learner: "La mia famiglia! Mio padre, mia madre e mio fratello."
    - tutor: "Esatto! E chi è questo signore alto?"
      goals: [who]
    # merlin-1395_0000414-4
    - learner: "Papa lavora un può tanto, ma lui vuole."
      errors: [object-pronoun, spelling]
    - tutor: "«Ma lui vuole»? Vuole cosa? Manca un pronome."
      prompt: {text: "ma lui vuole", tags: [object-pronoun]}
    - learner: "Sì, papà lavora tanto, ma lui vuole, gli piace."
      errors: [object-pronoun]
    - tutor: "Ah, lavora tanto ma lui lo vuole, gli piace il suo lavoro. Bravo papà!"
      goals: [describe]
      recast: {text: "lui vuole", fix: "lui lo vuole", tags: [object-pronoun]}
    - learner: "Sì. Mio fratello è ventisei anni, lavora in banca."
      errors: [essere-avere]
    - tutor: "«È ventisei anni»? Con l'età, quale verbo usiamo?"
      prompt: {text: "è ventisei anni", tags: [essere-avere]}
    - learner: "Sì, mio fratello è ventisei anni."
      errors: [essere-avere]
    - tutor: "Ah, tuo fratello ha ventisei anni, come me!"
      goals: [ages]
      recast: {text: "è ventisei anni", fix: "ha ventisei anni", tags: [essere-avere]}
    # merlin-1395_0000550-8
    - learner: "Come sta il tuo ragazzo Francesco?"
    - tutor: "Sta bene, grazie! Ha appena trovato un nuovo lavoro."
      goals: [ask]

- scenario: famiglia
  level: A2
  persona: es-f-teacher
  history: [possessive]
  turns:
    - tutor: "Guarda questa foto: io e il mio ragazzo! Ci sposiamo il 20 novembre, a Napoli."
    # merlin-1365_0100067-0
    - learner: "Sono molto contenta che finalmente avete preso questa breve decisione."
      errors: [word-choice]
    - tutor: "Grazie! Sì, finalmente abbiamo preso questa decisione. Tu ci sei, il 20?"
      goals: [who]
      recast: {text: "questa breve decisione", fix: "questa decisione", tags: [word-choice]}
    # merlin-1365_0100171-2
    - learner: "Al 20 novembre ho tempo e posso andare a voi matrimonio."
      errors: [possessive, preposition]
    - tutor: "Che bello! Ma «a voi matrimonio»? Il matrimonio è di noi due: come si dice?"
      prompt: {text: "a voi matrimonio", tags: [possessive]}
    - learner: "Posso andare al vostro matrimonio!"
    - tutor: "Esatto! Siamo così contenti. Come arrivi a Napoli?"
    # merlin-1365_0100004-1
    - learner: "Prenderò il treno un giorno prima della cerimonia, perchè lavoro fino il 18 Novembre, ma non c'è problema."
      errors: [preposition, spelling]
    - tutor: "Benissimo! Ma «fino il 18»? Dopo fino, manca una piccola parola."
      prompt: {text: "fino il 18", tags: [preposition]}
    - learner: "Lavoro fino al 18 novembre, poi prendo il treno."
    - tutor: "Perfetto! Lui è tranquillo, e anch'io. Strano, vero?"
      goals: [describe]
    # merlin-1365_0100174-9
    - learner: "Non siete nervosi!"
    - tutor: "No, per niente! Siamo felici. Ti mando l'indirizzo della chiesa."
    # merlin-1365_0100005-4
    - learner: "Aspeto impaziente il giorno del vostro matrimonio."
      errors: [spelling]
    - tutor: "Grazie! Ma «aspeto»? Guarda bene le doppie."
      prompt: {text: "Aspeto", tags: [spelling]}
    - learner: "Sì, aspeto quel giorno!"
      errors: [spelling]
    - tutor: "Aspetto, con due t! E anche noi ti aspettiamo."
      recast: {text: "aspeto", fix: "Aspetto", tags: [spelling]}

- scenario: lavanderia
  level: A2
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie! La lavatrice ha i miei vestiti dentro e non si apre."
    - tutor: "Ah, aspetta due minuti, poi si apre da sola. Sei qui per lavoro?"
      goals: [problem]
    # merlin-1395_0000535-0
    - learner: "Faccio una scuola italiana."
    - tutor: "Brava! Io invece cerco lavoro, sono qui ogni giorno per il bucato!"
      new: [{lemma: bucato, gloss: laundry}]
    # merlin-1385_0001152-3
    - learner: "Vorrei sapere che tipo di lavoro ti interessa?"
    - tutor: "Qualcosa con i bambini, sono insegnante."
    # merlin-1385_0000051-6
    - learner: "Va bene per te iniziare il prossimo aprile"
    - tutor: "Ad aprile? Sì, va benissimo! Perché?"
    # merlin-1385_0001792-5
    - learner: "Conesco molto buoni ristoranti quali cercano di cuochi per il week-end."
      errors: [adjective-agreement, relative-pronoun, spelling, article-use]
    - tutor: "Gentile, ma io non lavoro in cucina! E poi «molto buoni ristoranti»? Ristoranti è plurale..."
      prompt: {text: "molto buoni ristoranti", tags: [adjective-agreement]}
    - learner: "Molti buoni ristoranti, sì. Ma anche una scuola cerca insegnanti."
    - tutor: "Esatto, molti! Una scuola? Fantastico! Senti, i gettoni costano due euro l'uno."
      goals: [payment]

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [reflexive]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    # merlin-1385_0000102-1
    - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrare con te."
      errors: [reflexive]
    - tutor: "Va bene, ma stasera? E poi «non posso incontrare con te»? Manca un pronome."
      prompt: {text: "non posso incontrare con te", tags: [reflexive]}
    - learner: "Giovedì non posso incontrarmi con te, ma stasera sì!"
    - tutor: "Perfetto! Allora stasera. Cosa facciamo?"
    # merlin-1385_0000098-4
    - learner: "Hai voglia di andare a cena in un ristorante tailandese?"
    - tutor: "Mmm, ho già mangiato. Andiamo al cinema? C'è una commedia nuova alle nove."
      goals: [propose, genre]
    # merlin-1385_0000127-3
    - learner: "È possibile per te?"
    - tutor: "Per me sì! Prendo i biglietti per le nove."
      goals: [choose]
    # merlin-1395_0000560-2
    - learner: "O puoi andare a prendermi in macchina?"
    - tutor: "Sì, passo da te alle otto e mezza. Ci vediamo sotto casa tua!"
      goals: [meet]

- scenario: giorno-tipico
  level: A2
  persona: en-m-traveller
  history: [spelling]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1385_0000104-1
    - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrami con te perché devo stare al lavoro."
      errors: [spelling]
    - tutor: "Peccato! Ma «incontrami»? Manca una lettera."
      prompt: {text: "incontrami", tags: [spelling]}
    - learner: "Incontrarmi! Non posso incontrarmi con te giovedì."
    - tutor: "Esatto. Va bene, un altro giorno. E stasera torni tardi?"
      goals: [work]
    # merlin-1385_0001767-3
    - learner: "Mio capo ha organizzato una riunione questo pomeriggio."
      errors: [possessive]
    - tutor: "Che giornata! Ma «mio capo»? Prima di «mio» manca qualcosa."
      prompt: {text: "Mio capo", tags: [possessive]}
    - learner: "Il mio capo! Allora stasera torno alle nove e vado subito a letto."
    - tutor: "Perfetto! Che giornate lunghe. E venerdì sera sei libero?"
      goals: [evening]
    # merlin-1385_0001714-2
    - learner: "Ma mi dispiace, non posso venire giovedi pomeriggio."
      errors: [spelling]
    - tutor: "Venerdì, non giovedì! E poi «giovedi»? Guarda la fine della parola."
      prompt: {text: "giovedi", tags: [spelling]}
    - learner: "Ah, venerdì sì! Venerdì sera sono libero. Mi alzo tardi sabato."
    - tutor: "Esatto! Allora venerdì cena a casa, cucino io."
      goals: [wake]
    # merlin-1385_0001121-0
    - learner: "Come stai?"
    - tutor: "Bene, ma anch'io lavoro tanto in negozio. Venerdì ci rilassiamo!"
      goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: en-f-student
  history: [spelling]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana? Io cerco lavoro, sai?"
    # merlin-1385_0001712-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualque informazione in più."
      errors: [spelling]
    - tutor: "Grazie! Ma «qualque»? Guarda bene come si scrive."
      prompt: {text: "qualque", tags: [spelling]}
    # merlin-1385_0000043-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
    - tutor: "Esatto, così! Certo, chiedi pure."
    # merlin-1385_0000054-1
    - learner: "Ti aiuto volentieri, però vorrei sapere cosa hai fatto esattamente finora e dove hai lavorato"
    - tutor: "Ho lavorato per cinque anni in uno studio medico."
      goals: [ask]
    # merlin-1385_0000053-4
    - learner: "Preferici lavoro tecnico o lavoro i ufficio?"
      errors: [spelling, article-use, preposition]
    - tutor: "Bella domanda! Ma «preferici»? Guarda bene come si scrive."
      prompt: {text: "Preferici", tags: [spelling]}
    - learner: "Preferisci il lavoro tecnico o in ufficio?"
    - tutor: "Esatto! Preferisco l'ufficio. Nel weekend vado al parco a correre."
    # merlin-1385_0000042-5
    - learner: "Vorrei sapere quando vorresti iniziare il tuo lavoro"
    - tutor: "Subito, anche lunedì! Domenica andiamo a correre insieme, così ne parliamo."
      goals: [propose]

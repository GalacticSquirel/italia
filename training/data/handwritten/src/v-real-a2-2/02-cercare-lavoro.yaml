# v-real-a2-2, file 02: work, job hunting and helping a friend find a job (A2, real learner sentences).
- scenario: cercare-lavoro-a2
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    # merlin-1385_0000022-3
    - learner: "In quale mese é possibile a iniziare con il lavoro?"
      errors: [spelling, preposition]
    - tutor: "Cerchiamo camerieri per l'estate. Ma «possibile a iniziare»? Ci pensi: serve quella «a»?"
      goals: [ask]
      prompt: {text: "possibile a iniziare", tags: [preposition]}
    - learner: "Ah, no. È possibile iniziare a giugno?"
    - tutor: "Esatto! Sì, cominciamo il primo giugno. Ha già esperienza come cameriera?"
    # merlin-1395_0000340-3
    - learner: "Lavoro al albergo Alba dove sono cameriera."
      errors: [articulated-preposition]
    - tutor: "Bene! Ma «al albergo»? Prima di «albergo», cosa succede all'articolo?"
      prompt: {text: "al albergo", tags: [articulated-preposition]}
    - learner: "Sì, al albergo Alba, da due anni."
      errors: [articulated-preposition]
    - tutor: "Ah, all'albergo Alba, da due anni! Ottima esperienza. Quando è libera?"
      goals: [experience]
      recast: {text: "al albergo", fix: "all'albergo", tags: [articulated-preposition]}
    # merlin-1395_0000552-4
    - learner: "Sarò libera martedì e mercoledì sera."
    - tutor: "Perfetto, ci servono proprio quelle sere. Mi lascia un numero di telefono?"
      goals: [availability]
    - learner: "Sì, mi chiamo Lucia Ortega. Il mio móvil è 347 221 5680."
      errors: [word-choice]
    - tutor: "Grazie, Lucia: il cellulare è 347 221 5680, giusto? La chiamo entro venerdì!"
      recast: {text: "móvil", fix: "cellulare", tags: [word-choice]}
      goals: [contact]

- scenario: cercare-lavoro-a2
  level: A2
  persona: en-m-heritage
  history: [negation]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Sì, buongiorno. Cercate un cameriere per l'estate?"
    - tutor: "Sì, per luglio e agosto. Lei che lavoro fa adesso?"
      goals: [ask]
    # merlin-1395_0000628-2
    - learner: "Ho cambiato il mio lavoro, sono non piu panetiere."
      errors: [negation, spelling]
    - tutor: "Ah, sì? Ma «sono non»? Attenzione al posto di «non»."
      prompt: {text: "sono non", tags: [negation]}
    - learner: "Non sono più panettiere. Adesso lavoro in un supermercato."
    - tutor: "Giusto! E in un bar ha mai lavorato?"
    - learner: "Sì, due estati fa ho fatto il waiter in una pizzeria."
      errors: [word-choice]
    - tutor: "Ah, ha fatto il cameriere! Ottimo, allora conosce già il lavoro. Quando può cominciare?"
      goals: [experience]
      recast: {text: "il waiter", fix: "il cameriere", tags: [word-choice]}
    # merlin-1395_0001131-5
    - learner: "La prossima settimana ho tre giorni liberi, posso venire?"
    - tutor: "Certo, venga lunedì mattina per una prova. A lunedì, allora!"
      goals: [availability]

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [verb-form]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    # merlin-1395_0001124-0
    - learner: "Frequento un corso per imparare l'italiano."
    - tutor: "Che brava! E a che ora ti alzi per andare a lezione?"
      goals: [work]
    - learner: "Io alzo alle sette, perché la lezione comincia alle nove."
      errors: [reflexive]
    - tutor: "«Io alzo»? Ma chi alzi, il letto? Prova di nuovo!"
      prompt: {text: "Io alzo", tags: [reflexive]}
    - learner: "Ah, mi alzo alle sette!"
    - tutor: "Ecco, così va bene. E la sera cosa fai?"
      goals: [wake]
    # merlin-1395_0001058-3
    - learner: "Quando non c'è lezione vado in città per visitare dei monumenti, faccio shopping e vado al cinema con degli amici italiani."
    - tutor: "Che bella vita! Io invece cerco lavoro tutto il giorno."
      goals: [evening]
    # merlin-1385_0000054-3
    - learner: "Che tipo di lavoro vuoi fare adesso?"
    - tutor: "Qualcosa in un negozio o in un bar. Ma non trovo niente!"
      goals: [ask]
    # merlin-1385_0001785-5
    - learner: "Tu poi lavorare la mattina et anche la sera?"
      errors: [verb-form, word-choice]
    - tutor: "«Tu poi»? Mmm, controlla bene il verbo potere."
      prompt: {text: "Tu poi", tags: [verb-form]}
    - learner: "Tu puoi lavorare anche la sera?"
    - tutor: "Perfetto! Sì, posso lavorare anche la sera. Domani cerco anche nei bar."
    # merlin-1385_0001799-4
    - learner: "Quando vuoi cominciare il lavoro?"
    - tutor: "Anche domani! Speriamo di trovare presto."

- scenario: tempo-libero
  level: A2
  persona: es-m-worker
  history: [reflexive]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    # merlin-1395_0001028-7
    - learner: "Faccio molto sport per esempio tennis, calcio e sciare."
      errors: [word-choice]
    - tutor: "Calcio, tennis e sci? Quanto sport! Io nel tempo libero cerco un altro lavoro. Qui non sono contenta."
      goals: [hobby]
      new: [{lemma: sci, gloss: skiing}]
      recast: {text: "sciare", fix: "sci", tags: [word-choice]}
    # merlin-1385_0001150-3
    - learner: "Vorrei sapere che tipo di lavoro ti preferisci."
      errors: [reflexive]
    - tutor: "Sì, ti dico. Ma «ti preferisci»? Quel «ti» ci vuole davvero?"
      prompt: {text: "ti preferisci", tags: [reflexive]}
    - learner: "No! Che tipo di lavoro preferisci?"
    - tutor: "Esatto! Mi piace lavorare con le persone, magari in un albergo."
      goals: [ask]
    # merlin-1385_0001149-6
    - learner: "Quando vorresti iniziare?"
    - tutor: "Subito, se trovo qualcosa!"
    # merlin-1365_0100268-2
    - learner: "Davvero, nella mia città c'è un albergo che sto cercando personale."
      errors: [subject-verb-agreement]
    - tutor: "Davvero? Ma chi cerca personale, tu o l'albergo? Ripeti la frase."
      prompt: {text: "che sto cercando", tags: [subject-verb-agreement]}
    - learner: "Un albergo che sta cercando personale. Domenica ci andiamo insieme?"
    - tutor: "Sì, che bella idea! Andiamo domenica dopo la tua partita."
      goals: [propose]

- scenario: weekend-scorso
  level: A2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    # merlin-1395_0001069-5
    - learner: "La settimana scorsa ho fatto delle vacanze."
    - tutor: "Ah, è vero, eri via! Io invece sabato ho fatto un colloquio di lavoro, perché voglio cambiare ufficio."
      new: [{lemma: colloquio, gloss: interview}]
    # merlin-1385_0001158-2
    - learner: "Puoi dirmi dove hai lavorato adesso?"
      errors: [tense-aspect]
    - tutor: "«Hai lavorato... adesso»? Parli del passato o di oggi?"
      prompt: {text: "hai lavorato", tags: [tense-aspect]}
    # merlin-1385_0001733-2
    - learner: "Puoi dirmi dove tu lavori ora?"
    - tutor: "Esatto! Adesso lavoro qui, ma vorrei un lavoro più vicino a casa."
    # merlin-1385_0001149-4
    - learner: "Vorrei sapere che tipo di lavoro vuoi fare?"
    - tutor: "Sempre in ufficio, ma con meno ore."
    # merlin-1385_0001789-4
    - learner: "E già sai, quando vuoi iniziare il nuovo lavoro?"
    - tutor: "Se mi prendono, a gennaio. Speriamo bene!"

- scenario: lavanderia
  level: A2
  persona: en-f-professional
  history: [object-pronoun]
  turns:
    - tutor: "La lavatrice non parte? È normale: prima scegli il programma, poi metti il detersivo qui in alto. Sei nuova del quartiere?"
      goals: [problem, ask-how]
      new: [{lemma: quartiere, gloss: neighbourhood}]
    # merlin-1395_0000608-2
    - learner: "Sono contento di trovarmi qui."
      errors: [adjective-agreement]
    - tutor: "Che bello! Ma «contento»? Parli di te, una donna..."
      prompt: {text: "Sono contento", tags: [adjective-agreement]}
    - learner: "Sono contenta, sì! Sono qui da un mese."
    - tutor: "Brava! Io invece cerco lavoro qui in zona. È difficile."
    # merlin-1385_0000022-1
    - learner: "Stai lavorando ancora in ufficio, oppure l'hai già cambiato?"
    - tutor: "Sono ancora in ufficio, ma solo fino a dicembre. Poi cambio."
    # merlin-1385_0001733-3
    - learner: "In un negozio o in un ufficio?"
    - tutor: "In un negozio, magari di vestiti. Senti, la lavatrice vuole due gettoni."
    # merlin-1385_0001792-4
    - learner: "Vuoi lavorare in gastronomia o in un supermercato?"
    - tutor: "No, in un negozio di vestiti è meglio. I gettoni li compri alla macchina vicino alla porta: due euro."
      goals: [payment]

- scenario: casa-mia
  level: A2
  persona: es-f-teacher
  history: [modal-infinitive]
  turns:
    - tutor: "Allora, com'è la tua casa? Vivi con altre persone?"
    # merlin-1395_0001028-4
    - learner: "Ognuno ha una camera sua."
    - tutor: "Che bello, ognuno ha i suoi spazi! Qual è la tua stanza preferita?"
    - learner: "La cocina, è grande e c'è un balcone con i fiori."
      errors: [word-choice]
    - tutor: "La cucina con balcone, che sogno! La mia casa invece è piccola e senza sole. Voglio cambiare città."
      goals: [favourite]
      recast: {text: "La cocina", fix: "La cucina", tags: [word-choice]}
    # merlin-1385_0001158-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in piú."
      errors: [spelling]
    - tutor: "Grazie! Ma «in piú»? Guarda bene l'accento."
      prompt: {text: "piú", tags: [spelling]}
    # merlin-1385_0000048-1
    - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
    - tutor: "Perfetto! Allora: lavoro in cucina, e cerco un ristorante."
    # merlin-1365_0100253-2
    - learner: "A secondo me pottresti lavora in ditta uguale io."
      errors: [modal-infinitive, spelling, word-choice]
    - tutor: "Nella tua ditta? Ma «lavora»? Dopo un verbo come potere, che forma serve?"
      prompt: {text: "pottresti lavora", tags: [modal-infinitive]}
    - learner: "Potresti lavorare nella mia ditta. Ha una mensa grande!"
    - tutor: "Esatto! Bella idea, ci penso. Grazie!"

- scenario: bar-colazione
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno, Paolo! Un cappuccino, per favore."
    - tutor: "Subito! Sa che oggi è il mio ultimo giorno qui? E ormai mi dia del tu!"
      goals: [greet, order-drink]
    # merlin-1385_0001170-2
    - learner: "Perchè vuoi cambiare il tuo lavoro"
      errors: [spelling]
    - tutor: "Eh, è una lunga storia. Ma «perchè»? Guarda bene l'accento."
      prompt: {text: "Perchè", tags: [spelling]}
    - learner: "Ah, perché. Perché vuoi cambiare lavoro?"
    - tutor: "Bravo, così va bene! Vado a lavorare in un albergo, al mare. Vuoi anche un cornetto?"
    # merlin-1385_0000023-1
    - learner: "In Svizzera è possibile da lavorare troppo ma che tipo di lavoro tu voui fare?"
      errors: [preposition, spelling]
    - tutor: "Eh, in Svizzera sì! Ma «possibile da lavorare»? Quel «da» non va bene."
      prompt: {text: "possibile da lavorare", tags: [preposition]}
    - learner: "È possibile lavorare troppo, sì. Ma tu che tipo di lavoro vuoi fare?"
    - tutor: "Esatto! Sempre lo stesso lavoro, ma al mare. Allora, il cornetto?"
    - learner: "Sì, un croissant vuoto. Quanto pago?"
      errors: [word-choice]
    - tutor: "Un cornetto vuoto, eccolo. Oggi lo offro io!"
      recast: {text: "un croissant", fix: "un cornetto", tags: [word-choice]}
      goals: [order-food, pay]

# B1, mixed scenes: work, memories, opinions.
- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Marco Bianchi, sono canadese ma i miei nonni erano di Treviso. Ho ventotto anni e disegno mobili."
    - tutor: "Un canadese con un nome così italiano! Dove ha imparato questo lavoro?"
      goals: [intro]
    - learner: "Da mio nonno, che era falegname. Da bambino passavo le estati nel suo laboratorio. Poi ho lavorato quattro anni in un'azienda di Toronto."
    - tutor: "Una bella scuola, il laboratorio del nonno. E a Toronto di che cosa si occupava?"
    - learner: "Disegnavo sedie e tavoli per uffici. Ma dimmi, tu cerchi qualcuno con più esperienza di me?"
      errors: [register]
    - tutor: "Tu cerchi? Noi due ci siamo appena conosciuti, e siamo in ufficio..."
      prompt: {text: "tu cerchi", tags: [register]}
    - learner: "Mi scusi! Mi dica, lei cerca qualcuno con più esperienza?"
    - tutor: "Non si preoccupi. No, quattro anni vanno benissimo. Quali sono i suoi punti forti e un suo punto debole?"
      goals: [experience]
    - learner: "Lavoro bene con le mani, non solo al computer, e rispetto sempre i tempi. Il punto debole: non mi piace parlare in pubblico."
    - tutor: "Qui si parla poco e si disegna molto, quindi nessun problema. Perché vorrebbe lavorare proprio da noi?"
      goals: [strengths]
    - learner: "Perché usate il legno italiano e fate pochi pezzi, ma belli. È il modo in cui lavorava mio nonno."
    - tutor: "Mi fa piacere sentirlo. Ha una domanda per me?"
      goals: [why]
    - learner: "Sì: potrei lavorare anche in laboratorio qualche giorno, oltre che in ufficio?"
    - tutor: "Certo, lo chiediamo a tutti quelli che disegnano per noi. La chiameremo presto, grazie!"
      goals: [questions]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "La campagna per il nuovo gelato è pronta all'ottanta per cento. Abbiamo le foto e i testi, manca solo il video."
    - tutor: "Bene! E il cliente ha già visto qualcosa?"
      goals: [update]
    - learner: "Sì, e qui c'è il problema. Non gli piace lo slogan: dice che è troppo serio. E io penso che ha ragione."
      errors: [subjunctive-use]
    - tutor: "Davvero? A me piaceva! Ma senti: penso che... ha ragione? Dopo «penso che» ci vuole un altro modo."
      prompt: {text: "che ha ragione", tags: [subjunctive-use]}
    - learner: "Penso che abbia ragione."
    - tutor: "Esatto. E va bene, mi fido di te. Che cosa proponi?"
      goals: [problem]
    - learner: "Propongo di scrivere tre slogan nuovi, più divertenti, e di farli votare a venti persone fuori dall'azienda."
    - tutor: "Mi piace l'idea di farli votare. Ma abbiamo tempo? La scadenza era venerdì."
      goals: [proposal]
    - learner: "Venerdì è impossibile, onestamente. Mi servirebbe una settimana in più, fino al venerdì dopo."
    - tutor: "Una settimana è tanto... Facciamo mercoledì? Così giovedì lo mostriamo al cliente."
    - learner: "Mercoledì si può fare, se qualcuno mi aiuta con il video."
    - tutor: "D'accordo, ti aiuta Paolo. Allora nuova scadenza: mercoledì."
      goals: [deadline]

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Tutte e due le cose. Tre giorni insegno a scuola e due giorni faccio lezioni di spagnolo online, da casa."
    - tutor: "Interessante, hai due lavori diversi! E quale preferisci?"
      goals: [situation]
    - learner: "Dipende. A casa non perdo tempo in autobus e posso preparare meglio le lezioni. Però online guadagno meno che i miei colleghi della scuola."
      errors: [comparative]
    - tutor: "Capisco, i soldi contano. Ma: meno... che i miei colleghi? Davanti a un nome, quale parola usiamo?"
      prompt: {text: "che i miei colleghi", tags: [comparative]}
    - learner: "Guadagno meno dei miei colleghi."
    - tutor: "Giusto! E oltre ai soldi, c'è qualche altro svantaggio?"
      goals: [pros]
    - learner: "Sì, gli studenti. Davanti allo schermo si distraggono, e io non vedo se hanno capito. In classe lo vedo dagli occhi."
    - tutor: "Hai ragione, gli occhi dicono tutto. Se potessi scegliere solo uno dei due, quale terresti?"
      goals: [cons]
    - learner: "Terrei la scuola, senza dubbio. Ma vorrei un giorno da casa per correggere i compiti in pace."
    - tutor: "Mi sembra un'ottima idea. Magari un giorno la scuola te lo permetterà!"
      goals: [preference]

- scenario: volontariato
  level: B1
  persona: en-f-student
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao! Sì, ho visto il vostro annuncio all'università. Mi mancano molto i miei cani, quindi vorrei aiutare al canile."
    - tutor: "Che bello, al canile c'è sempre bisogno! Hai già esperienza con gli animali?"
      goals: [motivation]
    - learner: "Sì, a casa abbiamo tre cani, e ho lavorato un'estate da un veterinario. So fare il bagno ai cani e non ho paura di quelli grandi."
    - tutor: "Perfetto, quelli grandi sono proprio quelli che nessuno vuole portare fuori! Quanto tempo hai?"
      goals: [skills]
    - learner: "Poco, purtroppo: ho lezione tutti i giorni. Potrei venire il sabato mattina, e forse la domenica ogni due settimane."
    - tutor: "Il sabato mattina va benissimo. Puoi scegliere: portare fuori i cani o aiutare a pulire."
      goals: [time]
    - learner: "Preferisco portare fuori i cani, è per questo che sono qui! Ma se serve, pulisco anch'io. C'è un corso prima di cominciare?"
    - tutor: "Sì, un incontro di due ore venerdì sera, in cui ti spieghiamo le regole. Poi sabato cominci con i cani!"
      goals: [choose]
    - learner: "Benissimo. Devo portare qualcosa, scarpe speciali o guanti?"
    - tutor: "Solo scarpe vecchie e tanta pazienza. Ti aspettiamo venerdì alle sei!"

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-retired
  history: [reflexive]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo in una fattoria in Ohio, lontano da tutto. La città più vicina era a quaranta minuti di macchina."
    - tutor: "Una fattoria vera, con gli animali? Com'erano le tue giornate?"
      goals: [place]
    - learner: "Sì, avevamo mucche e galline. Ogni mattina alzavo alle cinque per aiutare mio padre, prima della scuola."
      errors: [reflexive]
    - tutor: "Alle cinque, da bambino! Ma... alzavo? Ti manca una parola piccola davanti al verbo."
      prompt: {text: "alzavo", tags: [reflexive]}
    - learner: "Mi alzavo alle cinque, sì."
    - tutor: "Esatto. E dopo tutto quel lavoro andavi a scuola: com'era?"
      goals: [habits]
    - learner: "Era una scuola piccolissima, con una sola maestra per tutti. Mi piaceva, perché a scuola potevo stare seduto!"
    - tutor: "Ti capisco, dopo tutto quel lavoro una sedia è un regalo! Hai un ricordo speciale di quegli anni?"
      goals: [school]
    - learner: "Sì. A dieci anni ho costruito una radio con mio nonno. Quando abbiamo sentito la prima voce, abbiamo ballato in cucina."
    - tutor: "Che momento! Forse è cominciato lì il tuo amore per la tecnica."
      goals: [event]
      new: [{lemma: tecnica, gloss: technology}]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [piacere]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra si mangia il tacchino con le patate, e alla fine c'è un dolce con la frutta secca che si accende con il fuoco!"
    - tutor: "Un dolce con il fuoco? Devo vederlo! E da piccola come passavi il Natale?"
      goals: [compare]
    - learner: "Andavamo sempre dai nonni. Dopo pranzo guardavamo il discorso della regina in televisione, e poi i bambini aprivano i regali."
    - tutor: "Il discorso della regina, che tradizione! E c'è qualcosa che vorresti sapere del Natale italiano?"
      goals: [past]
    - learner: "Sì! Ho visto il panettone in tutti i supermercati. Mi piace molto i dolci, ma non so quando si mangia: a colazione?"
      errors: [piacere]
    - tutor: "Bella domanda! Ma prima: mi piace... i dolci? Sono tanti, i dolci."
      prompt: {text: "Mi piace molto i dolci", tags: [piacere]}
    - learner: "Mi piacciono molto i dolci!"
    - tutor: "Esatto! Il panettone si mangia alla fine del pranzo, ma il giorno dopo va benissimo anche a colazione."
      new: [{lemma: panettone, gloss: Christmas sweet bread}]
      goals: [ask]
    - learner: "Perfetto, allora lo provo. E per il pranzo da te, cosa porto? Non voglio arrivare a mani vuote."
    - tutor: "Porta quel dolce inglese con il fuoco, se riesci a farlo! Altrimenti basta una bottiglia."
      goals: [plan]

- scenario: film-libro
  level: B1
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto «Io non ho paura» di Niccolò Ammaniti. Parla di un bambino che, un'estate, scopre un segreto terribile vicino al suo paese."
    - tutor: "Un libro che qui conosciamo bene. E Michele, il bambino, che tipo è?"
      goals: [summary]
    - learner: "Ha nove anni, è curioso e più coraggioso degli adulti. All'inizio ha paura, ma poi decide di fare la cosa giusta."
    - tutor: "È vero, è più grande dei grandi. Ti è piaciuto il libro?"
      goals: [characters]
    - learner: "La storia sì, moltissimo. Ma secondo me le descrizioni della campagna sono troppo lunghi, e mi annoiavo."
      errors: [adjective-agreement]
    - tutor: "Davvero? A me piacciono tanto! Però: le descrizioni sono troppo... lunghi?"
      prompt: {text: "lunghi", tags: [adjective-agreement]}
    - learner: "Troppo lunghe, scusa. Ma resto della mia idea!"
    - tutor: "Giusto, e fai bene a dirlo: qui ognuno ha la sua opinione. Io credo che il caldo e i campi siano parte della storia."
    - learner: "Forse hai ragione: senza quel caldo, la paura sarebbe diversa. Però dieci pagine in meno non farebbero male."
    - tutor: "Su questo possiamo metterci d'accordo! A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A chi studia italiano come me, perché la lingua è semplice. E a chi ama le storie con i bambini come protagonisti."
    - tutor: "Ottimo consiglio per chi impara la lingua. Grazie, bella discussione!"
      goals: [recommend]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Allora, gioco a hockey una volta alla settimana, ma per il resto sto seduto tutto il giorno. E mangio troppa pasta, colpa di mia nonna!"
    - tutor: "La pasta della nonna non si tocca! Però una volta alla settimana è poco. Che obiettivo hai?"
      goals: [habits]
    - learner: "Vorrei essere più veloce sul ghiaccio. I ragazzi della squadra hanno vent'anni e io arrivo sempre secondo."
    - tutor: "Bell'obiettivo, molto chiaro. Perché non ti alleni di più?"
      goals: [goal]
    - learner: "La sera sono stanco e resto sul divano con il telefono. Ma da lunedì cambio: berò meno birra e andrò a letto presto."
      errors: [future-form]
    - tutor: "Bravo, mi piace sentirlo! Ma... berò? Il futuro di questo verbo ha una lettera in più."
      prompt: {text: "berò", tags: [future-form]}
    - learner: "Beverò meno birra?"
      errors: [future-form]
    - tutor: "Quasi: berrò meno birra. E io ti aiuterò! Possiamo fare tre allenamenti alla settimana?"
      recast: {text: "Beverò", fix: "berrò", tags: [future-form]}
      goals: [obstacles]
    - learner: "Tre sono tanti con il lavoro. Due con te e l'hockey il sabato, va bene?"
    - tutor: "Va bene: martedì e giovedì con me, sabato hockey. Tra due mesi sarai tu il più veloce!"
      goals: [plan]

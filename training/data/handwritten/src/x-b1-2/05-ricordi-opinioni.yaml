# B1, memories, traditions, books and films, healthy habits.
- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo in un paese vicino a Leeds, in una casa con un giardino enorme. Non era bello come qui, però!"
    - tutor: "Un giardino enorme è il sogno di ogni bambino! Cosa facevi di solito?"
      goals: [place]
    - learner: "Stavo sempre fuori. Io e mio fratello giocavano a calcio nel giardino fino a sera, anche con la pioggia."
      errors: [subject-verb-agreement]
    - tutor: "Anche con la pioggia, che forza! Ma... io e mio fratello giocavano? Io e lui, quindi..."
      prompt: {text: "giocavano", tags: [subject-verb-agreement]}
    - learner: "Giusto, noi giocavamo a calcio!"
    - tutor: "Esatto! E a scuola come andavi? Ti piaceva?"
      goals: [habits]
    - learner: "Non molto. Ero brava in inglese, ma odiavo la matematica. La maestra era severa e io parlavo troppo."
    - tutor: "Parlavi troppo? Non l'avrei mai detto! C'è un ricordo speciale di quegli anni?"
      goals: [school]
    - learner: "Sì! Un'estate ho trovato un gattino nel giardino e l'ho nascosto in camera mia per una settimana. Poi mia madre l'ha scoperto."
    - tutor: "Una settimana intera! E cosa ha detto tua madre?"
    - learner: "Prima si è arrabbiata, poi ha detto che poteva restare. È vissuto con noi per quindici anni."
    - tutor: "Che bella storia, quindici anni insieme! Si vede che gli volevi molto bene."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Buenos Aires, in un quartiere popolare che si chiama La Boca. La nostra casa era piccola, ma sempre piena di gente."
    - tutor: "La Boca, quella con le case di tutti i colori? Dev'essere stato bello crescere lì."
      goals: [place]
    - learner: "Sì, quella! Dopo la scuola io giocaba a calcio in strada con gli altri bambini, fino a quando faceva buio."
      errors: [imperfetto-form]
    - tutor: "In strada fino a sera, che libertà! Ma io... giocaba? In italiano l'imperfetto ha un'altra lettera."
      prompt: {text: "giocaba", tags: [imperfetto-form]}
    - learner: "Io giocavo a calcio in strada."
    - tutor: "Perfetto. E la scuola ti piaceva?"
      goals: [habits]
    - learner: "Poco, preferivo stare in cucina con mia nonna. Però avevo un maestro buono, che mi ha insegnato a leggere con i giornali di calcio."
    - tutor: "Che maestro intelligente! E in cucina con la nonna hai un ricordo speciale?"
      goals: [school]
    - learner: "Sì. Quando avevo otto anni ho fatto la mia prima torta da solo, per il suo compleanno. Era bruttissima, ma lei ha pianto."
    - tutor: "Che bel ricordo! Forse quel giorno hai capito che lavoro volevi fare."
      goals: [event]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-retired
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Anche da noi si mangia molto! In America il piatto più importante è il tacchino, ma a Natale molte famiglie fanno anche il prosciutto al forno."
    - tutor: "Il prosciutto al forno a Natale, non lo sapevo! E tu da piccolo come festeggiavi?"
      goals: [compare]
    - learner: "Da bambino mi svegliavo alle cinque e aprivo i regali con i miei parenti, mamma e papà, ancora in pigiama."
      errors: [false-friend]
    - tutor: "Alle cinque, poveri genitori! Vi immagino tutti in pigiama davanti all'albero. E poi arrivavano anche gli altri parenti?"
      recast: {text: "parenti", fix: "genitori", tags: [false-friend]}
      goals: [past]
    - learner: "Sì, nel pomeriggio arrivavano gli zii e i cugini, e si giocava a carte fino a sera. E in Italia, è vero che si mangia il pesce la sera del ventiquattro?"
    - tutor: "Sì, in molte famiglie quella sera si mangia solo pesce, e la carne si mangia il giorno dopo. Poi si gioca a tombola!"
      new: [{lemma: tombola, gloss: Italian bingo}]
      goals: [ask]
    - learner: "Che bello, voglio provare la tombola! E io che cosa posso portare al pranzo?"
    - tutor: "Niente, sei mio ospite! Ma se proprio vuoi, porta un dolce americano: sono tutti curiosi."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna la festa più importante per i bambini non è Natale, è il sei gennaio. Quel giorno arrivano i Re Magi con i regali."
    - tutor: "Ah, da noi il sei gennaio arriva la Befana! E tu da piccola cosa facevi?"
      goals: [compare]
    - learner: "Da bambina ho lasciato sempre le scarpe vicino alla finestra, con un po' di acqua per i cammelli."
      errors: [tense-aspect]
    - tutor: "L'acqua per i cammelli, che pensiero gentile! Ma succedeva ogni anno, giusto? Allora... ho lasciato sempre?"
      prompt: {text: "ho lasciato sempre", tags: [tense-aspect]}
    - learner: "Da bambina lasciavo sempre le scarpe vicino alla finestra."
    - tutor: "Esatto! E la mattina dopo trovavi i regali, immagino."
      goals: [past]
    - learner: "Sì, e anche un po' di carbone dolce, perché non ero sempre buona! Ma dimmi, chi è la Befana?"
    - tutor: "È una vecchia signora che vola di notte e porta dolci ai bambini buoni. Ai cattivi porta il carbone, proprio come da voi!"
      goals: [ask]
    - learner: "Che simpatica! Senti, per il pranzo da te: preferisci che porti un dolce o una bottiglia di vino?"
    - tutor: "Porta un dolce spagnolo, così lo proviamo tutti. Al vino pensa mio padre!"
      goals: [plan]

- scenario: film-libro
  level: B1
  persona: en-m-traveller
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io! Ho letto una novella lunghissima, «Il nome della rosa» di Umberto Eco. Seicento pagine!"
      errors: [false-friend]
    - tutor: "Seicento pagine in italiano, che coraggio! È un romanzo famoso in tutto il mondo. Di cosa parla, senza dire il finale?"
      recast: {text: "una novella", fix: "un romanzo", tags: [false-friend]}
    - learner: "È una storia del Medioevo. Un monaco inglese arriva in un monastero dove ogni giorno muore qualcuno, e deve scoprire perché."
    - tutor: "Un giallo tra i libri antichi, insomma. E com'è questo monaco?"
      goals: [summary]
    - learner: "Si chiama Guglielmo. È intelligente e curioso, un po' come Sherlock Holmes. Non crede a tutto quello che dicono gli altri."
    - tutor: "Hai ragione, è proprio così! E a te il libro è piaciuto?"
      goals: [characters]
    - learner: "Sì e no. La storia è emozionante, ma ci sono troppe pagine di filosofia. Ho saltato qualche capitolo, lo ammetto!"
    - tutor: "Non sei il solo, tranquillo! A chi lo consiglieresti, allora?"
      goals: [opinion]
    - learner: "A chi ama la storia e ha molta pazienza. Non a chi vuole un libro per la spiaggia!"
    - tutor: "Sono d'accordo, sotto il sole è meglio qualcosa di più leggero. Grazie, ci hai fatto venire voglia di leggerlo!"
      goals: [recommend]

- scenario: film-libro
  level: B1
  persona: es-f-erasmus
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io non ho letto un libro, ma ho visto un film italiano: «C'è ancora domani». Posso parlare di quello?"
    - tutor: "Certo, i film vanno benissimo! Raccontaci la trama, ma senza il finale."
    - learner: "È la storia di Delia, una donna che vive a Roma nel 1946 con un marito violento. Un giorno riceve una lettera che cambia la sua vita."
    - tutor: "Bene, e non dirci cosa c'è nella lettera! Com'è Delia?"
      goals: [summary]
    - learner: "All'inizio sembra debole, ma è molto forte. È una persona di che tutti hanno bisogno: i figli, il marito, i vicini."
      errors: [relative-pronoun]
    - tutor: "Una donna forte, sì. Però: una persona di che...? Dopo una preposizione non usiamo «che»."
      prompt: {text: "di che", tags: [relative-pronoun]}
    - learner: "Una persona di quale tutti hanno bisogno?"
      errors: [relative-pronoun]
    - tutor: "Si dice: una persona di cui tutti hanno bisogno. È proprio così, lei pensa a tutti. E a te il film è piaciuto?"
      recast: {text: "di quale", fix: "di cui", tags: [relative-pronoun]}
      goals: [characters]
    - learner: "Moltissimo. È in bianco e nero, ma non è noioso. Fa ridere e fa piangere, e il finale è una sorpresa."
    - tutor: "Ridere e piangere insieme: è difficile da fare! A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A tutti, ma soprattutto alle ragazze della mia età. Devono sapere com'era la vita delle loro nonne."
    - tutor: "Bellissimo consiglio. Allora la prossima volta lo guardiamo tutti insieme qui!"
      goals: [recommend]

- scenario: salute-stile-vita
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Onestamente, pessime. Lavoro dieci ore al giorno, mangio davanti al computer e l'unico sport è correre per prendere la metro."
    - tutor: "Almeno corri per qualcosa! E di notte quante ore dormi?"
    - learner: "Cinque o sei durante la settimana. Il fine settimana dormo più bene, perché non penso al lavoro."
      errors: [comparative]
    - tutor: "Capisco, lo stress non aiuta. Ma: dormo... più bene? C'è una parola sola per dirlo."
      prompt: {text: "più bene", tags: [comparative]}
    - learner: "Ah, dormo meglio!"
    - tutor: "Esatto. E qual è il tuo obiettivo con me?"
      goals: [habits]
    - learner: "Vorrei sentirmi meno stanca e più forte. Non mi interessa dimagrire, voglio solo avere energia la sera."
    - tutor: "Ottimo obiettivo, e si può fare. Che cosa ti ha fermato fino a oggi?"
      goals: [goal]
    - learner: "Il tempo, soprattutto. E poi le palestre mi annoiano: dopo due settimane smetto sempre."
    - tutor: "Allora niente palestre. Ti propongo due allenamenti da mezz'ora, uno a casa e uno al parco."
      goals: [obstacles]
    - learner: "Mezz'ora mi piace. Ma a casa non ho niente, devo comprare qualcosa? E in che giorni?"
    - tutor: "Non serve niente, usiamo il peso del corpo. Facciamo martedì mattina e sabato, e dopo un mese vedrai la differenza!"
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao. Lavoro in un ristorante, quindi mangio tardi e male. Durante il giorno tomo molto caffè, sette o otto tazze."
      errors: [word-choice]
    - tutor: "Otto tazze! Se bevi molto caffè fino a sera, poi dormire è difficile. A che ora vai a letto?"
      recast: {text: "tomo molto caffè", fix: "bevi molto caffè", tags: [word-choice]}
    - learner: "Verso le due di notte, e mi alzo alle nove. Non faccio sport da quando avevo vent'anni."
    - tutor: "Va bene, partiamo da qui senza fretta. Che cosa vorresti cambiare?"
      goals: [habits]
    - learner: "Ho mal di schiena tutti i giorni, perché sto in piedi dodici ore. Vorrei una schiena più forte e perdere un po' di pancia."
    - tutor: "Sono due obiettivi che vanno bene insieme. Cosa ti sembra più difficile?"
      goals: [goal]
    - learner: "Trovare il tempo. Ho libero solo il lunedì, e la mattina sono sempre stanco morto."
    - tutor: "Allora ti propongo il lunedì con me e dieci minuti di movimento ogni mattina."
      goals: [obstacles]
    - learner: "Ogni mattina è troppo, non ci riesco. Facciamo tre mattine alla settimana?"
    - tutor: "Affare fatto: lunedì insieme e tre mattine da solo. E piano piano proviamo a scendere a quattro caffè!"
      goals: [plan]

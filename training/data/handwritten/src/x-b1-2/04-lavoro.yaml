# B1, work and society: interviews, meetings, remote work, volunteering.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Mi chiamo Claire Dawson, sono australiana e vivo a Milano da due anni. Mi occupo di marketing da otto anni."
    - tutor: "Piacere. Otto anni sono una bella esperienza. Dove ha lavorato prima?"
      goals: [intro]
    - learner: "A Sydney ho lavorato cinque anni per una firma di cosmetici. Gestivo una squadra di sei persone e seguivo i progetti per l'Asia."
      errors: [false-friend]
    - tutor: "Interessante: un'azienda di cosmetici con progetti in Asia. E qui a Milano di che cosa si occupa?"
      recast: {text: "una firma", fix: "un'azienda", tags: [false-friend]}
      goals: [experience]
    - learner: "Qui lavoro in un'agenzia piccola. Mi piace, ma i progetti sono sempre uguali e vorrei crescere."
    - tutor: "Capisco. Secondo lei, quali sono i suoi punti forti? E un punto debole?"
    - learner: "Sono organizzata e lavoro bene con persone diverse. Il mio punto debole è che il mio italiano scritto non è ancora perfetto, ma sto prendendo un corso."
      errors: [word-choice]
    - tutor: "È una risposta onesta, grazie. Se sta seguendo un corso, migliorerà presto. Perché vorrebbe lavorare con noi?"
      recast: {text: "sto prendendo un corso", fix: "sta seguendo un corso", tags: [word-choice]}
      goals: [strengths]
    - learner: "Perché i vostri lavori mi piacciono molto, soprattutto la campagna per il museo. E perché qui potrei imparare dai migliori."
    - tutor: "Grazie, la campagna per il museo è piaciuta molto anche ai clienti. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì. Com'è la squadra con cui lavorerei? E si può lavorare da casa qualche giorno?"
    - tutor: "Lavorerebbe con quattro persone, tutte giovani. Da casa si può lavorare due giorni alla settimana. La chiameremo entro venerdì!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Lucía Romero, ho ventitré anni e sono di Siviglia. Ho studiato design grafico e adesso faccio l'Erasmus a Bologna."
    - tutor: "Benvenuta. Ha già avuto qualche esperienza di lavoro?"
      goals: [intro]
    - learner: "Sì, l'estate scorsa ho fatto tre mesi di pratica in uno studio a Siviglia. Quando ho cominciato, non ho saputo usare bene i programmi, ma ho imparato in fretta."
      errors: [tense-aspect]
    - tutor: "Tre mesi sono un buon inizio. Però, quando ha cominciato... non ho saputo? Era una situazione che durava nel tempo."
      prompt: {text: "non ho saputo", tags: [tense-aspect]}
    - learner: "Certo: quando ho cominciato, non sapevo usare bene i programmi."
    - tutor: "Esatto. E di che cosa si occupava in quello studio?"
    - learner: "Preparavo le immagini per i social e aiutavo con i cataloghi. Alla fine ho disegnato da sola un logo per un bar."
    - tutor: "Molto bene, un progetto tutto suo! Quali sono i suoi punti forti, e un punto debole?"
      goals: [experience]
    - learner: "Sono creativa e precisa. Il punto debole... a volte sono troppo lenta, perché voglio che tutto sia perfetto."
    - tutor: "Meglio lenta e precisa che veloce con errori! E perché ha scelto la nostra azienda?"
      goals: [strengths]
    - learner: "Perché siete piccoli e fate progetti per i musei e i teatri, che è quello che mi interessa. Posso chiederle quante ore alla settimana sono?"
    - tutor: "Sono venti ore, di mattina, così può seguire le lezioni. Le faremo sapere la prossima settimana, grazie!"
      goals: [why, questions]

- scenario: riunione-lavoro
  level: B1
  persona: en-m-heritage
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Il sito per il cliente di Torino è quasi pronto: mancano solo le pagine in inglese."
    - tutor: "Ottimo, sei più avanti di quanto pensavo. C'è qualche problema?"
      goals: [update]
    - learner: "Sì, uno. Il cliente ha cambiato idea sui colori per la terza volta. Così perdiamo tempo, e dobbiamo fare una decisione."
      errors: [word-choice]
    - tutor: "Tre volte, capisco che sei stanco! Hai ragione, dobbiamo prendere una decisione. Tu cosa proponi?"
      recast: {text: "fare una decisione", fix: "prendere una decisione", tags: [word-choice]}
      goals: [problem]
    - learner: "Io proporrei una riunione con loro giovedì. Gli mostriamo due versioni e loro scelgono, ma dopo non si cambia più."
    - tutor: "Mi sembra giusto. E se giovedì non possono?"
      goals: [proposal]
    - learner: "Allora gli mando le due versioni per mail e chiedo una risposta entro lunedì. Però tu dovresti scrivere al loro capo, a te ascolta di più."
    - tutor: "Va bene, gli scrivo io oggi. Con la risposta lunedì, quando riesci a consegnare?"
    - learner: "Se scelgono lunedì, consegno tutto il venerdì dopo. Prima è impossibile, davvero."
    - tutor: "Venerdì va benissimo, non voglio una scadenza troppo vicina. Grazie, bel lavoro!"
      goals: [deadline]

- scenario: riunione-lavoro
  level: B1
  persona: es-f-teacher
  history: [conditional-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Buongiorno a tutti. Il corso online per le scuole va avanti: abbiamo finito sei lezioni su dieci."
    - tutor: "Sei su dieci, bene! Siamo nei tempi?"
      goals: [update]
    - learner: "Purtroppo no. Siamo in ritardo di due settimane, perché chi doveva fare i video è malato da dieci giorni."
    - tutor: "Mi dispiace per lui. E senza i video non possiamo andare avanti, immagino."
      goals: [problem]
    - learner: "Esatto. Io proponerei di chiamare a un'altra persona per finire i video."
      errors: [conditional-form, preposition]
    - tutor: "È un'idea. Ma... proponerei? Il condizionale di questo verbo è un po' diverso."
      prompt: {text: "proponerei", tags: [conditional-form]}
    - learner: "Io proporrei di chiamare un'altra persona."
    - tutor: "Giusto! Sono d'accordo. Conosci già qualcuno?"
      goals: [proposal]
    - learner: "Sì, una ragazza che ha lavorato con noi l'anno scorso. È brava e veloce, ma costa un po' di più."
    - tutor: "Se è brava, va bene. Con lei, quando potremmo finire?"
    - learner: "Se comincia lunedì, credo che finiremo entro il venti del mese. Ti do la conferma domani."
    - tutor: "Perfetto, allora la nuova scadenza è il venti. Aspetto la tua conferma domani!"
      goals: [deadline]

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro sempre da casa, anzi, da dove voglio! Faccio il programmatore per un'azienda di Dublino, quindi mi basta il computer."
    - tutor: "Che fortuna! Quindi puoi lavorare anche mentre viaggi?"
      goals: [situation]
    - learner: "Sì, il mese scorso ho lavorato da un bar a Palermo. Per me lavorare da casa è più comodo di lavorare in ufficio."
      errors: [comparative]
    - tutor: "Da un bar a Palermo, niente male! Però: più comodo... di lavorare? Qui metti insieme due verbi."
      prompt: {text: "di lavorare", tags: [comparative]}
    - learner: "Più comodo... da lavorare in ufficio?"
      errors: [comparative]
    - tutor: "Quasi: è più comodo che lavorare in ufficio, sono d'accordo. E quali altri vantaggi vedi?"
      recast: {text: "da lavorare", fix: "che lavorare", tags: [comparative]}
    - learner: "Non perdo tempo sui mezzi e posso organizzare la giornata come voglio. E risparmio un sacco di soldi per il pranzo."
    - tutor: "Sul pranzo hai proprio ragione! Ma non c'è niente che ti manchi dell'ufficio?"
      goals: [pros]
    - learner: "I colleghi, un po'. A volte passo tre giorni senza parlare con nessuno. E la sera è difficile smettere di lavorare."
    - tutor: "Eh, lo capisco, in ufficio almeno alle sei esci. Se potessi scegliere, cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei continuare così, ma con una settimana al mese in ufficio, per vedere le persone."
    - tutor: "Mi sembra la soluzione perfetta: libertà e un po' di compagnia. Quasi quasi lo propongo anche al mio capo!"
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-m-worker
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Io? Sono cuoco, non posso cucinare da casa per il ristorante! Vado al lavoro tutti i giorni, anche la domenica."
    - tutor: "Hai ragione, che domanda! E com'è il tuo orario?"
      goals: [situation]
    - learner: "Lavoro dalle dieci alle tre e poi dalle sei a mezzanotte. È duro, e in estate in cucina fa molto calore."
      errors: [word-choice]
    - tutor: "Eh sì, in cucina fa molto caldo, con tutti quei fuochi accesi! Ma c'è qualcosa di bello nel lavorare lì, immagino."
      recast: {text: "fa molto calore", fix: "fa molto caldo", tags: [word-choice]}
    - learner: "Certo. Mi piace lavorare in squadra, e quando il cliente è contento lo vedi subito. Tu davanti al computer non lo vedi."
    - tutor: "Questo è vero, a me nessuno dice mai «bravo»! E gli svantaggi, oltre al caldo?"
      goals: [pros]
    - learner: "Non vedo quasi mai i miei amici, perché lavoro quando loro sono liberi. E mi fanno sempre male le gambe."
    - tutor: "Capisco, è il prezzo di questo lavoro. Se potessi cambiare qualcosa, cosa cambieresti?"
      goals: [cons]
    - learner: "Vorrei lavorare solo la sera e avere due giorni liberi di seguito. Ma non cambierei mai la cucina con un ufficio!"
    - tutor: "Si vede che ami il tuo lavoro. Allora ti auguro quei due giorni liberi, te li meriti!"
      goals: [preference]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Buongiorno! Sì, molto. Sono in pensione da un anno e ho troppo tempo libero. Vorrei fare qualcosa di utile."
    - tutor: "Benvenuto, allora! Qui c'è sempre bisogno di una mano. Che lavoro facevi?"
      goals: [motivation]
    - learner: "Ero ingegnere. So riparare quasi tutto: biciclette, computer, lavatrici. E gli anziani sono le persone che lavoro meglio con."
      errors: [relative-pronoun]
    - tutor: "Un ingegnere, fantastico! Solo un attimo: le persone che lavoro meglio con? In italiano «con» non può stare alla fine."
      prompt: {text: "che lavoro meglio con", tags: [relative-pronoun]}
    - learner: "Ah, sì. Sono le persone con cui lavoro meglio."
    - tutor: "Perfetto! E quanto tempo potresti darci?"
      goals: [skills]
    - learner: "Due pomeriggi alla settimana, il martedì e il giovedì. La mattina no, perché studio italiano."
    - tutor: "Due pomeriggi sono tantissimo per noi. Abbiamo due attività: la spesa per gli anziani o un piccolo laboratorio dove ripariamo oggetti."
      goals: [time]
    - learner: "Il laboratorio mi sembra perfetto per me! Ma ci sono già gli attrezzi, o devo portare i miei?"
    - tutor: "Gli attrezzi ci sono, ma se hai i tuoi preferiti portali pure. Ti aspettiamo martedì alle tre!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao! Sì, sono qui per l'Erasmus fino a giugno e vorrei conoscere meglio la città. Voglio aiutare alla gente, e qui la gente sono molto simpatiche."
      errors: [preposition, subject-verb-agreement]
    - tutor: "Grazie, che bello sentirlo! Una cosa sola: aiutare... alla gente? Attenzione a cosa c'è dopo il verbo."
      prompt: {text: "aiutare alla gente", tags: [preposition]}
    - learner: "Voglio aiutare la gente!"
    - tutor: "Esatto. E cosa sai fare? Hai già qualche esperienza?"
      goals: [motivation]
    - learner: "Ho lavorato due estati con i bambini in un campo estivo. So organizzare giochi e parlo spagnolo e inglese."
    - tutor: "Perfetto, cerchiamo proprio persone così! Quanto tempo hai durante la settimana?"
      goals: [skills]
    - learner: "Ho lezione tutte le mattine, ma sono libera il mercoledì e il venerdì pomeriggio. Tre o quattro ore in tutto."
    - tutor: "Benissimo. Puoi aiutare i bambini con i compiti, oppure giocare con loro in cortile il venerdì."
      goals: [time]
    - learner: "Posso fare tutte e due? I compiti il mercoledì e i giochi il venerdì."
    - tutor: "Magari! Allora ti segno per mercoledì e venerdì. I bambini saranno felicissimi."
      goals: [choose]

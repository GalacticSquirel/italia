# B1, work, memories, opinions and complaints: mostly free conversation, one error at a time.
- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [conditional-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Insomma. La campagna per il museo è quasi pronta, ma ieri il cliente ha cambiato idea sui colori e sulle foto."
    - tutor: "Di nuovo? È la terza volta questo mese! Quanto lavoro in più vuol dire?"
      goals: [update]
    - learner: "Almeno una settimana. Il vero problema è che Luca è in ferie fino a lunedì, e da sola non finisco per venerdì."
    - tutor: "Capisco, è un problema serio. Che cosa proponi?"
      goals: [problem]
    - learner: "Potrebbiamo chiedere al cliente di spostare la presentazione di una settimana."
      errors: [conditional-form]
    - tutor: "Potrebbiamo? Pensa a io potrei, tu potresti... e con noi?"
      prompt: {text: "Potrebbiamo", tags: [conditional-form]}
    - learner: "Potrebbemo chiedere una settimana in più, forse."
      errors: [conditional-form]
    - tutor: "Sì, potremmo chiederla, è una buona idea. Lo chiamo io oggi pomeriggio."
      recast: {text: "Potrebbemo", fix: "potremmo", tags: [conditional-form]}
      goals: [proposal]
    - learner: "Grazie. Se dice di sì, consegniamo il venerdì dopo, il 21. Sarà tutto pronto, te lo prometto."
    - tutor: "Perfetto, allora la nuova scadenza è venerdì 21. Lunedì, quando torna Luca, facciamo il punto."
      goals: [deadline]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono spagnola, di Valencia, e porto dieci anni insegnando disegno in una scuola media."
      errors: [word-choice]
    - tutor: "Quindi insegna da dieci anni, conosce bene i ragazzi. Perché adesso vuole lavorare in un'azienda come la nostra?"
      recast: {text: "porto dieci anni insegnando", fix: "insegna da dieci anni", tags: [word-choice]}
      goals: [intro]
    - learner: "Perché ho sempre fatto anche lavori di grafica per conto mio. L'anno scorso, per esempio, ho disegnato i manifesti per il teatro della mia città."
    - tutor: "Li ho visti tra i suoi lavori, sono molto belli. Quali sono i suoi punti forti?"
      goals: [experience]
    - learner: "Sono paziente e so spiegare bene le cose, perché sono insegnante. Un punto debole: non conosco ancora bene alcuni programmi nuovi, ma imparo in fretta."
    - tutor: "La pazienza qui serve molto, mi creda! E perché proprio la nostra azienda?"
      goals: [strengths]
    - learner: "Perché lavorate per le scuole e i musei. Mi piacerebbe che i miei disegni aiutano i bambini a imparare."
      errors: [subjunctive-use]
    - tutor: "Bella idea. Ma: mi piacerebbe che i miei disegni aiutano? Dopo mi piacerebbe che, quel verbo deve cambiare modo."
      prompt: {text: "aiutano", tags: [subjunctive-use]}
    - learner: "Mi piacerebbe che i miei disegni aiutassero i bambini a imparare."
    - tutor: "Perfetto. Ed è proprio quello che cerchiamo. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì: il lavoro sarebbe a tempo pieno? E quando comincerei? Vorrei finire l'anno scolastico con i miei studenti."
    - tutor: "Sì, a tempo pieno, e si comincia a settembre, quindi può finire l'anno con calma. Le faremo sapere entro due settimane."
      goals: [questions]

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Sono cresciuta a Manly, un quartiere di Sydney sul mare. La nostra casa era a cinque minuti dalla spiaggia."
    - tutor: "Che fortuna, il mare sotto casa! E cosa facevi dopo la scuola?"
      goals: [place]
    - learner: "Ogni pomeriggio ho preso la tavola da surf e sono andata in spiaggia con mio fratello."
      errors: [tense-aspect]
    - tutor: "Ogni pomeriggio... ho preso? Succedeva ogni giorno: che tempo usiamo in questo caso?"
      prompt: {text: "ho preso", tags: [tense-aspect]}
    - learner: "Ogni pomeriggio prendevo la tavola e andavo in spiaggia con mio fratello."
    - tutor: "Esatto! Allora sei bravissima in acqua, non lo sapevo. E a scuola com'eri?"
      goals: [habits]
    - learner: "Ero brava in matematica, ma la maestra diceva che parlavo troppo. Mi ricordo che senza cappello non potevamo giocare fuori, per il sole."
    - tutor: "Una regola intelligente! Qui da bambino nessuno ci pensava, tornavo a casa sempre rosso."
      goals: [school]
    - learner: "C'è un ricordo che non dimenticherò mai: quando avevo dieci anni, una balena è arrivata vicino alla spiaggia e tutta la gente correvano a vederla."
      errors: [subject-verb-agreement]
    - tutor: "Che emozione! Ma tutta la gente correvano? Pensa: gente è singolare o plurale?"
      prompt: {text: "tutta la gente correvano", tags: [subject-verb-agreement]}
    - learner: "Singolare! Tutta la gente correva a vederla."
    - tutor: "Giusto. Io non ho mai visto niente del genere, che fortuna! Guarda, quella laggiù era la mia scuola."
      goals: [event]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Argentina Natale è in estate, quindi fa caldissimo. Si mangia carne alla griglia in giardino e a mezzanotte ci sono i fuochi d'artificio."
    - tutor: "Natale con trenta gradi, che strano per me! E quando eri bambino come lo passavi?"
      goals: [compare]
    - learner: "Andavamo tutti a casa della mia nonna, eravamo quasi trenta persone. A mezzanotte noi bambini decevamo «Feliz Navidad» a tutti e aprivamo i regali."
      errors: [possessive, imperfetto-form]
    - tutor: "Trenta persone, che bello! Ma noi bambini decevamo? Il verbo dire, al passato, è un po' speciale."
      prompt: {text: "decevamo", tags: [imperfetto-form]}
    - learner: "Dicevamo! Noi bambini dicevamo «Feliz Navidad» a tutti."
    - tutor: "Esatto. Da noi, invece, molti bambini aprono i regali la mattina del 25."
      goals: [past]
    - learner: "Ho sentito che in Italia c'è anche la Befana, che porta il carbone ai bambini cattivi. È vero?"
    - tutor: "Sì, il 6 gennaio! Ma oggi il carbone è di zucchero e si mangia, quindi anche i bambini cattivi sono contenti."
      goals: [ask]
    - learner: "Che furbi, gli italiani! Senti, cosa porto domani per il pranzo? Posso fare un dolce argentino, gli alfajores."
    - tutor: "Gli alfajores, che buoni! Portali, mia madre sarà curiosissima di provarli."
      goals: [plan]

- scenario: film-libro
  level: B1
  persona: en-f-student
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Inizio io! Ho letto «L'amica geniale» di Elena Ferrante. Racconta l'amicizia tra due bambine di Napoli, negli anni Cinquanta."
    - tutor: "Un classico moderno! E chi sono i personaggi principali?"
      goals: [summary]
    - learner: "Ci sono Lenù, che racconta la storia, e Lila, la sua amica. Lila è intelligentissima ma difficile, ma eventualmente Lenù diventa più brava a scuola."
      errors: [false-friend]
    - tutor: "Sì, e alla fine è Lenù che continua a studiare. E a te che cosa è sembrato?"
      recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
      goals: [characters]
    - learner: "Mi è piaciuto, ma secondo me la prima parte è un po' lenta. Ci sono troppi personaggi e dovevo sempre guardare la lista all'inizio del libro."
    - tutor: "Davvero? Per me invece è proprio il bello del libro: sembra di vivere nel quartiere con loro."
    - learner: "Capisco, ma io preferisco i libri con più azione. Però il finale è fantastico: ho comprato subito il secondo volume!"
    - tutor: "Allora alla fine ti è piaciuto! A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "Lo consiglierei alle persone che piacciono le storie di amicizia. Non a chi vuole un libro veloce!"
      errors: [relative-pronoun]
    - tutor: "Alle persone che piacciono...? Le storie piacciono a queste persone, quindi: alle persone...?"
      prompt: {text: "che piacciono", tags: [relative-pronoun]}
    - learner: "Alle persone a cui piacciono le storie di amicizia!"
    - tutor: "Esatto, perfetto. Bella presentazione, grazie: chi è il prossimo?"
      goals: [recommend]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-traveller
  history: [piacere]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Non male, credo. Faccio la guida a Roma e cammino tutto il giorno, ma non faccio sport da due anni."
    - tutor: "Camminare è già un ottimo inizio. E qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "A marzo voglio correre la mezza maratona di Roma. Il mio amico l'ha corsa l'anno scorso e adesso è molto più in forma di me."
    - tutor: "Bell'obiettivo, e abbiamo quattro mesi. Che cosa ti ha fermato fino a oggi?"
      goals: [goal]
    - learner: "La sera torno a casa stanco e mangio troppo. Il problema è che mi piace troppo i dolci italiani."
      errors: [piacere]
    - tutor: "Ti capisco! Però: mi piace troppo i dolci? Sono tanti, i dolci..."
      prompt: {text: "mi piace troppo i dolci", tags: [piacere]}
    - learner: "Sì, mi piace tutti i dolci, è un vero problema!"
      errors: [piacere]
    - tutor: "Anche a me piacciono tutti i dolci, ti capisco! Allora non li eliminiamo, li mangiamo meno spesso."
      recast: {text: "piace tutti i dolci", fix: "piacciono tutti i dolci", tags: [piacere]}
      goals: [obstacles]
    - learner: "Va bene. Quante volte alla settimana dovrò allenarmi?"
    - tutor: "Tre volte: martedì e giovedì una corsa leggera, il sabato una più lunga. E il dolce solo la domenica!"
    - learner: "Solo la domenica? È più difficile della maratona! Facciamo due volte, la domenica e il mercoledì?"
    - tutor: "Affare fatto: dolce il mercoledì e la domenica, e tre allenamenti. Ci vediamo martedì alle sette!"
      goals: [plan]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, sono nella camera 108. Ho tornato alle dieci e nel bagno non c'erano asciugamano, e la doccia non funziona."
      errors: [auxiliary-choice, noun-number]
    - tutor: "Mi dispiace molto. Solo una cosa: ho tornato? Con tornare non si usa avere."
      prompt: {text: "Ho tornato", tags: [auxiliary-choice]}
    - learner: "Ah, sì: sono tornato alle dieci. E la doccia fa solo acqua fredda."
    - tutor: "Esatto. Le faccio portare subito gli asciugamani. Da quando l'acqua è fredda?"
      new: [{lemma: asciugamano, gloss: towel}]
      goals: [problem]
    - learner: "Anche ieri sera era fredda, ma pensavo che fosse un problema di un momento."
    - tutor: "Capisco, due sere senza acqua calda non vanno bene."
      goals: [since]
    - learner: "Vorrei cambiare camera stasera, se è possibile. E onestamente penso che dovrei pagare meno per la notte scorsa."
    - tutor: "Certo, le do subito la 205. Per lo sconto devo parlare con la direttrice, che arriva domani mattina."
      new: [{lemma: sconto, gloss: discount}]
      goals: [request]
    - learner: "Domani? Non è molto comodo, parto alle otto. Non potrebbe almeno offrirmi la colazione?"
    - tutor: "Ha ragione. Le offro la colazione e lascio un messaggio alla direttrice. Le va bene?"
    - learner: "Sì, grazie, va bene così. Può mandarmi la risposta per email?"
    - tutor: "Certo, le scriviamo domani mattina. Ecco la chiave della 205, buonanotte!"
      goals: [agree]

- scenario: restituire-prodotto
  level: B1
  persona: en-m-heritage
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho un problema con questa macchina fotografica: lo schermo diventa nero dopo cinque minuti."
    - tutor: "Mi faccia vedere... Sì, si spegne proprio. Da quanto tempo ce l'ha?"
      goals: [problem]
    - learner: "L'ho comprato tre settimane fa, proprio qui. Ecco lo scontrino."
      errors: [participle-agreement]
    - tutor: "Grazie. L'ho comprato...? Attenzione: macchina è maschile o femminile?"
      prompt: {text: "L'ho comprato", tags: [participle-agreement]}
    - learner: "Giusto: l'ho comprata tre settimane fa."
    - tutor: "Perfetto. È ancora in garanzia, quindi possiamo mandarla in assistenza. Ci vogliono circa trenta giorni."
      new: [{lemma: assistenza, gloss: repair service}]
      goals: [proof]
    - learner: "Trenta giorni? No, tra dieci giorni parto per il Giappone. Vorrei ritornarla e prendere un'altra macchina uguale, oggi."
      errors: [word-choice]
    - tutor: "Capisco. Se vuole restituirla, possiamo sostituirla subito con una uguale, visto che è difettosa."
      recast: {text: "ritornarla", fix: "restituirla", tags: [word-choice]}
      goals: [request]
    - learner: "Benissimo. Ma se anche la nuova ha lo stesso problema? Allora preferirei il rimborso."
    - tutor: "In quel caso le restituiamo i soldi, glielo prometto. Scrivo una nota sullo scontrino."
    - learner: "D'accordo, allora prendo la nuova. Posso provarla qui prima di andare via?"
    - tutor: "Certo, la proviamo insieme subito. Così parte tranquillo per il Giappone!"
      goals: [agree]

# B1 real-learner letters (round 7): more answers to a friend who has finished school and wants a job.
# The tutor is the friend; questions about unknown people or words are ordinary questions, not corrections.
- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Ho finito la maturità! Ma adesso non so se andare subito all'università o lavorare un po'."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100275-5
    - learner: "Auguri per la maturità Francesco!"
    - tutor: "Grazie! Tu cosa faresti al mio posto?"
    # merlin-1365_0100275-0
    - learner: "Sì, fai bene di lavorare un po', prima che iscrivi all'università così puoi anche guadagnare i soldi."
      errors: [preposition, reflexive]
    - tutor: "Dici davvero? Ma «fai bene di lavorare»: con «fare bene», l'infinito vuole un'altra preposizione. Quale?"
      prompt: {text: "fai bene di lavorare", tags: [preposition]}
    - learner: "Fai bene a lavorare un po', così guadagni qualcosa."
    - tutor: "Esatto! Il problema è che non ho ancora le idee chiare su cosa studiare."
    # merlin-1365_0100275-1
    - learner: "Non è grave, se non hai ancora le idee chiare, sei ancora giovane e hai tempo di pensarci un po' cosa vuoi fare."
    - tutor: "Hai ragione, così mi sento meglio. Ma dove cerco lavoro?"
    # merlin-1365_0100275-2
    - learner: "Quindi, nell'albergo Stella a Rimini cercano personale, manda il tuo curriculum, sono sicura che ti hanno un lavoro."
      errors: [object-pronoun]
    - tutor: "A Rimini? Perfetto! Ma «ti hanno un lavoro»: con «avere un lavoro», come dici che il lavoro è per me?"
      prompt: {text: "ti hanno un lavoro", tags: [object-pronoun]}
    - learner: "Sono sicura che hanno un lavoro per te."
    - tutor: "Esatto! Stasera scrivo all'albergo, promesso. Lavorare al mare d'estate sarebbe perfetto."
      goals: [preference]
    # merlin-1365_0100275-7
    - learner: "Spero che ti ho potuto aiutare."
    - tutor: "Moltissimo, grazie! Se mi prendono, vieni a trovarmi a Rimini."

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Ho finito la scuola, finalmente! E tu? Lavori sempre nello stesso posto?"
    # merlin-1365_0100276-13
    - learner: "Dopo la maturità professionale ho cominciato a lavorare e adesso non trovo più il coraggio, o la voglia, di studiare."
    - tutor: "Ti capisco, dopo una giornata di lavoro studiare è difficile. E non pensi di cambiare?"
      goals: [situation]
    # merlin-1365_0100276-14
    - learner: "Per questo me ne vado via per qualche tempo."
    - tutor: "Davvero? E dove vai?"
    # merlin-1365_0100276-3
    - learner: "Come te l'ho scritto l'ultima volta, vorrei andare a Miami e adesso è tutto prenotato."
    - tutor: "Ah, giusto, Miami! Che bello. Organizzare tutto da sola però non è facile."
    # merlin-1365_0100276-5
    - learner: "Questo viaggio tiene tanto tempo per prepararlo, ma mi piace organizzare."
      errors: [word-choice]
    - tutor: "Eh sì, un viaggio così richiede tanto tempo! Ma se ti piace organizzare, è già una festa. E per me? Hai qualche idea?"
      recast: {text: "tiene tanto tempo", fix: "richiede tanto tempo", tags: [word-choice]}
    # merlin-1365_0100276-7
    - learner: "Mia mamma vuole aprire una yoghurteria in città, e sta cercando qualcuno per aiutarla per il periodo ottobre fino maggio."
      errors: [preposition]
    - tutor: "Una yoghurteria, che idea! Ma «il periodo ottobre fino maggio»: per dire l'inizio e la fine, quali preposizioni usiamo?"
      prompt: {text: "il periodo ottobre fino maggio", tags: [preposition]}
    - learner: "Da ottobre fino a maggio, tutto l'inverno."
    - tutor: "Perfetto, è proprio il periodo giusto per me!"
      goals: [preference]
    # merlin-1365_0100276-8
    - learner: "Cosa ne pensi?"
    - tutor: "Penso che sia un'idea fantastica! Puoi dire a tua mamma che la chiamo domani?"

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [future-form]
  turns:
    - tutor: "Ciao! Grandi notizie: ho preso il massimo dei voti alla maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100472-0
    - learner: "Questo è veramente buono."
    - tutor: "Eh sì, sono contentissimo! E tu? Come va la scuola?"
    # merlin-1365_0100472-1
    - learner: "Nel momento io studio ancora nella scuola, ma l'anno prossimo ho già finito la scuola."
      errors: [future-form, articulated-preposition]
    - tutor: "Dai, ci sei quasi! Ma «l'anno prossimo ho già finito»: è un'azione che sarà finita nel futuro. Che tempo usi?"
      prompt: {text: "ho già finito", tags: [future-form]}
    - learner: "L'anno prossimo avrò già finito la scuola."
    - tutor: "Esatto! E dopo? Hai già un'idea?"
    # merlin-1365_0100472-2
    - learner: "Poi voglio cercare un lavoro che mi piace."
    - tutor: "Fai bene. Io invece ho trovato un posto in un ufficio, al telefono tutto il giorno, ma non mi piace per niente."
      goals: [situation, cons]
    # merlin-1365_0100472-5
    - learner: "E se no, questo lavoro non è giusto per te."
    - tutor: "Hai ragione, forse devo cercare altro. Magari un lavoro vicino a te, in un'altra città!"
    # merlin-1365_0100472-7
    - learner: "Sarebbe veramente bello, se veni nella mia città!"
      errors: [hypothetical]
    - tutor: "Davvero? Ma «se veni»: è un desiderio, una cosa non ancora reale. Dopo «se», quale forma di «venire» ci vuole?"
      prompt: {text: "se veni", tags: [hypothetical]}
    - learner: "Sarebbe veramente bello, se venissi nella mia città!"
    - tutor: "Esatto! Allora ci penso seriamente: una città nuova mi farebbe bene."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [adjective-agreement, piacere]
  turns:
    - tutor: "Ciao! Ho finito la maturità, ma adesso devo decidere: università o lavoro?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100482-2
    - learner: "C'è una decisione molta importante!"
      errors: [adjective-agreement]
    - tutor: "Proprio così! Ma «molta importante»: quella parola qui accompagna un aggettivo, «importante». Cambia con il nome o resta uguale?"
      prompt: {text: "molta importante", tags: [adjective-agreement]}
    - learner: "Resta uguale: una decisione molto importante!"
    - tutor: "Esatto! E io non so proprio cosa scegliere. Per ora vorrei lavorare un po'."
    # merlin-1365_0100482-3
    - learner: "Quindi ho trovato un albergo che cerca personale."
    - tutor: "Davvero? Che bello! Che tipo di albergo?"
    # merlin-1365_0100482-4
    - learner: "Forse ti piaci?"
      errors: [piacere]
    - tutor: "Forse... ma «ti piaci»? Così vuol dire che piaci a te stesso! Di che cosa parli, dell'albergo?"
      prompt: {text: "ti piaci", tags: [piacere]}
    - learner: "Sì, scusa: forse ti piace, l'albergo! È molto bello."
    - tutor: "Esatto! Allora mi piace già. Ma tu hai tempo di vederci quest'estate?"
      goals: [preference]
    # merlin-1365_0100482-11
    - learner: "Però ho tempo per te nel prossimo anno!"
    - tutor: "Va bene, allora l'anno prossimo facciamo una bella vacanza insieme."
    # merlin-1365_0100482-13
    - learner: "Cari saluti!"
    - tutor: "Cari saluti anche a te! E mandami il nome dell'albergo."

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [article-form, auxiliary-choice]
  turns:
    - tutor: "Ciao! Quanto tempo! Io ho finito la scuola e cerco lavoro. E tu, sei tornata al lavoro?"
    # merlin-1365_0100278-2
    - learner: "Così restavo a casa i ultimi 6 mesi, per arrangiarmi, trovarmi nella nuova situazione con la piccola."
      errors: [article-form]
    - tutor: "Certo, con una bambina piccola! Ma «i ultimi»: davanti a «ultimi», quale articolo usiamo?"
      prompt: {text: "i ultimi", tags: [article-form]}
    - learner: "Sono rimasta a casa gli ultimi sei mesi con la piccola."
    - tutor: "Esatto! Fai bene, i primi mesi sono importanti. Senti, conosci qualcuno che cerca personale?"
      goals: [situation]
    # merlin-1365_0100278-5
    - learner: "Anche un altro paio a Bergamo ha un ristorante con 8 camere."
    - tutor: "Un altro paio? Di chi parli, di una coppia di amici? Un ristorante con camere sarebbe perfetto."
    # merlin-1365_0100278-6
    - learner: "Magari lì può essere un po' più interessante per te."
    - tutor: "Sì, mi piacerebbe lavorare in un ristorante! Ma tu? Al lavoro come va?"
    # merlin-1365_0100278-9
    - learner: "Alla nostra ditta ha cambiato tanto, quasi tutto."
      errors: [auxiliary-choice]
    - tutor: "Davvero? Ma «ha cambiato tanto»: qui chi cambia? La ditta stessa. Allora con «cambiare» usiamo «avere» o «essere»?"
      prompt: {text: "ha cambiato tanto", tags: [auxiliary-choice]}
    - learner: "Alla nostra ditta è cambiato tanto, quasi tutto."
    - tutor: "Esatto. Speriamo in meglio! Fammi sapere quando torni."
      goals: [cons]
    # merlin-1365_0100278-12
    - learner: "Aspetto la tua risposta e a presto."
    - tutor: "Ti rispondo presto, promesso! Un bacio alla piccola."

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [noun-number]
  turns:
    - tutor: "Ciao! Hai letto la mia lettera? Ho preso il massimo dei voti alla maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100231-0
    - learner: "Caro Francesco, grazie della tua lettera!"
    - tutor: "Figurati! E tu come stai? Lavori già?"
    # merlin-1365_0100231-4
    - learner: "La mia situazione professionale non è bene."
      errors: [word-choice]
    - tutor: "Non è buona? Mi dispiace. Che cosa succede?"
      recast: {text: "non è bene", fix: "non è buona", tags: [word-choice]}
    # merlin-1365_0100231-5
    - learner: "Vado a scuola ma non ho tempo per lavorare per avere molti soldi."
    - tutor: "Capisco, la scuola prende tutto il tempo. E dopo cosa vuoi fare?"
      goals: [situation]
    # merlin-1365_0100231-6
    - learner: "Dopo la scuola vorrei iscrivermi all'Università per studiare l'italiano."
    - tutor: "Che bella idea! Io invece prima vorrei lavorare un po'. Hai qualche idea per me?"
    # merlin-1365_0100231-8
    - learner: "Penso che abbia delle idea per te."
      errors: [noun-number]
    - tutor: "Davvero? Dimmi! Ma «delle idea»: con «delle», il nome è singolare o plurale?"
      prompt: {text: "delle idea", tags: [noun-number]}
    - learner: "Penso di avere delle idee per te."
    - tutor: "Esatto! Dimmi tutto."
    # merlin-1365_0100231-9
    - learner: "Nella mia città c'è un hotel il quale cerca un'assistente del manager per i turisti italiani."
    - tutor: "Un aiuto per i turisti italiani? Perfetto, parlo bene l'inglese e il tedesco! Mi dai il nome dell'hotel?"
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Ce l'ho fatta, ho superato la maturità! Adesso mi prendo un po' di riposo."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100125-0
    - learner: "Sono contenta per te."
    - tutor: "Grazie! E tu? Non dovevi fare anche tu un esame?"
    # merlin-1365_0100125-3
    - learner: "Anch'io ho fatto l'esame, ho frequentato un corso d'italiano spero che è andata tutto bene."
      errors: [participle-agreement]
    - tutor: "Ah, il corso d'italiano! Ma «è andata tutto bene»: qui parli di «tutto», che è maschile. Allora «andata» va bene così?"
      prompt: {text: "è andata tutto bene", tags: [participle-agreement]}
    - learner: "Spero che sia andato tutto bene!"
    - tutor: "Esatto! Sono sicuro di sì. Allora dobbiamo festeggiare tutti e due!"
    # merlin-1365_0100125-4
    - learner: "Per quello vado anch'io stasera a festeggiare con una mia amica."
    - tutor: "Fai bene! Io invece festeggio domani. Poi però devo trovare un lavoro per l'inverno. Da te com'è?"
    # merlin-1365_0100125-6
    - learner: "Penso che al momento non sia facile di trovare un lavoro, lo sai com'è durante l'inverno a Cortina."
      errors: [preposition]
    - tutor: "Lo so, d'inverno è difficile! Ma «non sia facile di trovare»: pensa a «è facile capire». Com'è la tua frase?"
      prompt: {text: "facile di trovare", tags: [preposition]}
    - learner: "Penso che al momento non sia facile trovare un lavoro."
    - tutor: "Esatto, hai ragione. Allora aspetto la primavera e prima studio un po' di inglese."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Ho finito la maturità! Forse l'anno prossimo vado all'università per diventare insegnante."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100233-4
    - learner: "Secondo me è un bello professione."
      errors: [noun-gender]
    - tutor: "Grazie! Ma «un bello professione»: «professione» è maschile o femminile?"
      prompt: {text: "un bello professione", tags: [noun-gender]}
    - learner: "È una bella professione, secondo me."
    - tutor: "Esatto! E tu? Cosa vuoi fare dopo la scuola?"
    # merlin-1365_0100233-6
    - learner: "Come sai suono la clarinetta, il piano e canto da due mesi."
      errors: [word-choice]
    - tutor: "Sì, il clarinetto e il piano, lo so! E adesso anche il canto? Che bello."
      recast: {text: "la clarinetta", fix: "il clarinetto", tags: [word-choice]}
      new: [{lemma: clarinetto, gloss: clarinet}]
    # merlin-1365_0100233-7
    - learner: "Mi piacerebbe studiare all'Università a Vienna e forse dopo un po' di tempo in Italia."
    - tutor: "Che bel programma! Vienna è perfetta per la musica."
    # merlin-1365_0100233-9
    - learner: "Forse puoi mandarmi alcuni esercizi e informazioni della tua maturità."
    - tutor: "Certo, ti mando tutto! Ho ancora i libri e gli esercizi dell'ultimo anno."
    # merlin-1365_0100233-14
    - learner: "Cari saluti!"
    - tutor: "Cari saluti a te! E se senti di un lavoro per l'estate, dimmelo."

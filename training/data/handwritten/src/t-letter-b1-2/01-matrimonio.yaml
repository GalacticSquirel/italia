# B1 real-learner letters (round 7): answers to a wedding invitation, told aloud to the couple.
# The tutor is the bride or the groom; plural address to the couple («vi», «voi») is correct.
- scenario: compleanno
  level: B1
  persona: es-f-teacher
  history: [verb-form]
  turns:
    - tutor: "Ciao! Allora, hai ricevuto il nostro invito? Stefano e io ci sposiamo il 20 novembre!"
    # merlin-1365_0100020-0
    - learner: "Tanti auguri per il matrimonio."
    - tutor: "Grazie mille! Siamo felicissimi. Il matrimonio è a Napoli, nella chiesa di Santa Chiara, alle undici."
      goals: [date]
    # merlin-1365_0100020-2
    - learner: "Vi ringrazio il vostro invito."
      errors: [preposition]
    - tutor: "Ci fa piacere averti con noi! Ma «ringrazio il vostro invito»: con «ringraziare», davanti alla cosa serve una preposizione. Quale?"
      prompt: {text: "ringrazio il vostro invito", tags: [preposition]}
    - learner: "Ah, sì: vi ringrazio per il vostro invito!"
    - tutor: "Brava! Dopo la chiesa andiamo tutti a pranzo al ristorante «Da Ciro», sul mare. Ti piacerà, si mangia benissimo."
      goals: [food]
    # merlin-1365_0100020-5
    - learner: "Ma ho un piccolo problema, non sei che cose devo regalarvi."
      errors: [verb-form]
    - tutor: "Un problema? Dimmi tutto! Ma «non sei»: stai parlando di te, quindi quale forma di «sapere» ti serve?"
      prompt: {text: "non sei", tags: [verb-form]}
    - learner: "Non so, scusa! Non so che cosa regalarvi."
    - tutor: "Esatto! Non serve niente di speciale. Abbiamo una piccola lista in un negozio del centro, oppure puoi aiutarci con il viaggio."
      goals: [gift]
    # merlin-1365_0100020-12
    - learner: "Spero di ricevere presto una lettera vostra o una vostra telefonata."
    - tutor: "Ti chiamo io domani sera, promesso! Così ti racconto anche chi viene: ci saranno tutti gli amici dell'università."
      goals: [guests]
    # merlin-1365_0100020-13
    - learner: "Baci e abbracci!"
    - tutor: "Un abbraccio forte anche a te, a domani!"

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Ciao, che bello sentirti! Hai ricevuto il nostro invito? Finalmente mi sposo!"
    # merlin-1365_0100261-1
    - learner: "Ti mando le mie congratulazioni."
    - tutor: "Grazie, sei un tesoro! Ancora non ci credo nemmeno io."
    # merlin-1365_0100261-2
    - learner: "Sono molto felice per te."
    - tutor: "Lo so, grazie. Allora, riesci a venire a Napoli per il 20 novembre?"
    # merlin-1365_0100261-3
    - learner: "Vengo volentieri il 20 novembre a Napoli o forse partirò già un giorno primo, altrimenti sarei molto stanca."
      errors: [word-choice]
    - tutor: "Ottima idea partire un giorno prima, così arrivi riposata! Puoi dormire da mia sorella, ha una camera libera."
      recast: {text: "un giorno primo", fix: "un giorno prima", tags: [word-choice]}
      goals: [date]
    # merlin-1365_0100261-4
    - learner: "Non conosco Stefano ancora e così non lo so che cosa vi augurivate."
      errors: [verb-form]
    - tutor: "È vero, non vi siete mai visti! Ma «vi augurivate»? Prova con il presente di «augurarsi», per «voi»."
      prompt: {text: "vi augurivate", tags: [verb-form]}
    - learner: "Scusa: non so che cosa vi augurate, che cosa volete."
    - tutor: "Perfetto! Stefano è un tipo semplice: ama cucinare e viaggiare. Abbiamo una piccola lista in un negozio di casa, ti mando l'indirizzo."
      goals: [gift]
    # merlin-1365_0100261-7
    - learner: "Tanti saluti e a presto!"
    - tutor: "A presto! Al pranzo da Ciro ti metto al tavolo con le mie amiche dell'università, così non sei sola."
      goals: [guests, food]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [verb-form]
  turns:
    - tutor: "Ciao! Sono Stefano. Volevamo darti noi la notizia, di persona: ci sposiamo!"
    # merlin-1365_0100135-0
    - learner: "Sono molto contenta di sentire che vi sposerete il 20 novembre nella chiesa di Santa Chiara."
    - tutor: "Sì, proprio a Santa Chiara, la chiesa preferita della mia ragazza! Dopo la chiesa c'è il pranzo da Ciro."
      goals: [date, food]
    # merlin-1365_0100135-2
    - learner: "Grazie per il vostro invito."
    - tutor: "Figurati, per noi è importante che tu ci sia. Ci saranno anche i tuoi compagni del corso di teatro. E tutti ci chiedono del regalo!"
      goals: [guests]
    # merlin-1365_0100135-5
    - learner: "Che cosa desiderete?"
      errors: [verb-form]
    - tutor: "Ah ah, sei curiosa anche tu! Ma «desiderete»: con «voi», il verbo «desiderare» come finisce?"
      prompt: {text: "desiderete", tags: [verb-form]}
    - learner: "Che cosa desiderate?"
    - tutor: "Brava! Niente di difficile: stiamo mettendo da parte i soldi per il viaggio in Giappone."
      goals: [gift]
    # merlin-1365_0100135-7
    - learner: "Non vedo l'ora di rivedervi e sono in attesa della vostra risposta."
    - tutor: "Anche noi! Allora ti rispondo subito: ti abbiamo messo al tavolo vicino agli sposi."
    # merlin-1365_0100135-8
    - learner: "Ancora una volta: tanti auguri!"
    - tutor: "Grazie di cuore, da parte di tutti e due!"

- scenario: compleanno
  level: B1
  persona: en-m-retired
  history: [imperfetto-form]
  turns:
    - tutor: "Ciao! Finalmente vi sento! Avete ricevuto la nostra lettera?"
    # merlin-1365_0100097-1
    - learner: "Soprattutto grandi congratulazioni, non sapeviamo niente che voi finalmente abbiate deciso sposarvi."
      errors: [imperfetto-form, preposition]
    - tutor: "Eh sì, è stata una decisione veloce! Ma «sapeviamo»: pensa all'imperfetto con «noi», come «avevamo» o «facevamo»."
      prompt: {text: "sapeviamo", tags: [imperfetto-form]}
    - learner: "Non sapevamo niente, davvero!"
    - tutor: "Esatto! Nessuno sapeva niente, neanche i miei genitori. Allora, venite a Napoli il 20 novembre?"
      goals: [date]
    # merlin-1365_0100097-3
    - learner: "Sfortunatamente al momento del matrimonio dobbiamo andare in Francia, dunque non possiamo venire."
    - tutor: "Oh no, che peccato! Ci mancherete tantissimo al pranzo. Ma che cos'è quella foto che mi avete mandato ieri?"
    # merlin-1365_0100097-6
    - learner: "Questa macchina è bellissima, di colore rosso."
    - tutor: "Una macchina rossa? Non capisco: è per noi? È una macchina vera o piccola, per giocare?"
    - learner: "È un modellino, il nostro regalo per voi. Stefano ama le macchine vecchie."
    - tutor: "Che pensiero carino! Stefano ne sarà felicissimo, la metterà subito in camera sua."
      goals: [gift]
    # merlin-1365_0100097-7
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti anche a voi, e buon viaggio in Francia!"

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Sono Stefano. Allora, ti è arrivata la nostra lettera?"
    # merlin-1365_0100288-1
    - learner: "Tanti auguri per te e per tua moglie anche della parte della mia famiglia."
      errors: [articulated-preposition]
    - tutor: "Grazie a tutti! Però «della parte della mia famiglia»: è un modo di dire fisso, con una preposizione semplice. Quale?"
      prompt: {text: "della parte della mia famiglia", tags: [articulated-preposition]}
    - learner: "Da parte della mia famiglia, sì!"
    - tutor: "Perfetto! Ringrazia i tuoi genitori, sono sempre così gentili. Allora, ci vediamo il 20 a Napoli?"
      goals: [date]
    # merlin-1365_0100288-2
    - learner: "Mi piace tanto che ho ricevuto un invitatione per la grande festa."
      errors: [word-choice]
    - tutor: "E noi siamo felici di mandarti un invito! Sarà una grande festa: dopo la chiesa, tutti al ristorante «Da Ciro»."
      recast: {text: "un invitatione", fix: "un invito", tags: [word-choice]}
      goals: [food]
    # merlin-1365_0100288-3
    - learner: "È anche una possibilità di vedere vecchi amici."
    - tutor: "Certo! Vengono Marco, Paola e tutto il gruppo del liceo. Sarà come ai vecchi tempi."
      goals: [guests]
    # merlin-1365_0100288-5
    - learner: "Ma ho una domanda: vorrei sapere cosa posso regalare per il matrimonio."
    - tutor: "Non devi regalare niente, davvero. Ma se vuoi, abbiamo una lista in un negozio di casa in via Toledo."
      goals: [gift]
    # merlin-1365_0100288-6
    - learner: "Tanti saluti e ancora una volta grazie mille."
    - tutor: "Grazie a te! Ci vediamo a novembre."

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [reflexive, object-pronoun]
  turns:
    - tutor: "Ciao! Hai saputo la notizia? Stefano e io ci sposiamo il 20 novembre!"
    # merlin-1365_0100017-0
    - learner: "Voglio congratularvi per i vostro matrimonio."
      errors: [reflexive, article-form]
    - tutor: "Che carina! Ma «voglio congratularvi»: chi fa gli auguri qui? Tu. Allora quale pronome ci vuole al posto di «vi»?"
      prompt: {text: "congratularvi", tags: [reflexive]}
    - learner: "Ah, sì: voglio congratularmi per il vostro matrimonio!"
    - tutor: "Esatto, grazie! Lo so, è stata una sorpresa per tutti. Ma riesci a venire a Napoli?"
    # merlin-1365_0100017-2
    - learner: "Fortunatamente in questa data sono libera come le sapete, così posso venire al vostro matrimonio senza problema."
      errors: [object-pronoun]
    - tutor: "Che bello! Ma «come le sapete»: quel «le», a chi o a che cosa si riferisce?"
      prompt: {text: "come le sapete", tags: [object-pronoun]}
    - learner: "A niente, scusa: come sapete, sono libera!"
    - tutor: "Brava! Allora ti mettiamo nella lista degli invitati. Ci saranno anche i tuoi compagni di Erasmus. Ti mandiamo i dettagli per lettera."
      goals: [date, guests]
    # merlin-1365_0100017-6
    - learner: "Aspetto una risposta vostra, ci vediamo presto."
    - tutor: "Ti scriviamo entro domenica, promesso. Il pranzo sarà al ristorante «Da Ciro», vicino al mare."
      goals: [food]
    # merlin-1365_0100017-7
    - learner: "Tanti auguri e un bacio!"
    - tutor: "Un bacio a te, a presto!"

- scenario: compleanno
  level: B1
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Sono Beatrice. Hai ricevuto l'invito? Ci sposiamo a novembre!"
    # merlin-1365_0100287-0
    - learner: "Grazie per l'invito per il vostro festa del matrimonio."
      errors: [noun-gender]
    - tutor: "Prego, ci teniamo tanto! Ma «il vostro festa»: «festa» è maschile o femminile?"
      prompt: {text: "il vostro festa", tags: [noun-gender]}
    - learner: "Grazie per l'invito per la vostra festa!"
    - tutor: "Brava! Allora ci vediamo il 20 novembre a Santa Chiara? Dopo c'è il pranzo da Ciro."
      goals: [date, food]
    # merlin-1365_0100287-4
    - learner: "Avrei avuto un appuntamento con una mia collega per visitare un teatro."
    - tutor: "Oh no, proprio quel giorno? E adesso come fai?"
    # merlin-1365_0100287-5
    - learner: "Ma preferisco da venire per il vostro matrimonio, senz'altro!"
      errors: [preposition]
    - tutor: "Che amica! Però «preferisco da venire»? Ripeti con calma e guarda bene la parola subito dopo «preferisco»."
      prompt: {text: "preferisco da venire", tags: [preposition]}
    - learner: "Preferisco venire al vostro matrimonio, senz'altro!"
    - tutor: "Esatto! La tua collega capirà. Ti mettiamo al tavolo con Paola e Marco."
      goals: [guests]
    # merlin-1365_0100287-10
    - learner: "Un grande bacio!"
    - tutor: "Un bacio anche a te, a presto!"

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Ciao! Allora, ti è arrivato il nostro invito?"
    # merlin-1365_0100182-0
    - learner: "Quando ho letto quest'invitazione ho telefonato direttamente Paola e Marco e gli ho raccontato la novità!"
      errors: [preposition]
    - tutor: "Che dolce! Ma «ho telefonato direttamente Paola»: con «telefonare», davanti alla persona serve una preposizione. Quale?"
      prompt: {text: "telefonato direttamente Paola", tags: [preposition]}
    - learner: "Ho telefonato direttamente a Paola e Marco!"
    - tutor: "Esatto! Paola mi ha già chiamata tre volte, è più nervosa di me. Io invece ho mille dubbi."
      goals: [guests]
    # merlin-1365_0100182-3
    - learner: "Credo che e il nervosismo e la curiosità e i dubbi siano normali prima della cerimonia."
    - tutor: "Hai ragione, così mi sento meglio. Allora, la chiesa la conosci già. E il ristorante, ti ricordi dove festeggiamo?"
      goals: [date]
    # merlin-1365_0100182-5
    - learner: "Dopo vorreste festeggiare al ristorante che si chiama Da Ciro."
    - tutor: "Sì, proprio quello vicino al mare. Prepareranno un menù tutto di pesce."
      goals: [food]
    # merlin-1365_0100182-6
    - learner: "Mi dispiace, ma lavorò il 20 novembre, conseguentemente parteciperò solitamente alla festa."
      errors: [future-form, word-choice]
    - tutor: "Oh no! Ma «lavorò»: parli del 20 novembre, un giorno che deve ancora venire. Come diventa il verbo?"
      prompt: {text: "lavorò", tags: [future-form]}
    - learner: "Lavorerò il 20 novembre, purtroppo. Però vengo alla festa la sera."
    - tutor: "Esatto. Peccato per la chiesa, ma l'importante è che vieni alla festa! E per il regalo non preoccuparti."
    # merlin-1365_0100182-9
    - learner: "Forse troverò una cosa utile... Spero di ricevere presto una vostra lettera o una vostra telefonata."
    - tutor: "Ti chiamiamo questo fine settimana, così ti raccontiamo tutto. Un abbraccio!"
      goals: [gift]

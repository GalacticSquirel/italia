# B1 real-learner letters (round 7): complaints about a holiday residence, and experiences of learning languages.
# The tutor is the residence, the researcher, a friend or a language school.
- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [ce-ci-sono, preposition]
  turns:
    - tutor: "Buongiorno, albergo Il Lago. Mi dica, c'è qualche problema?"
    # merlin-1325_1001013-4
    - learner: "Ho scelto il vostro villaggio turistico perché sembrava un residence bellissimo."
    - tutor: "Grazie di averci scelto. Ma mi sembra che qualcosa non sia andato bene, vero?"
    # merlin-1325_1001013-0
    - learner: "Prima di tutto sono state grande differenze tra la realtà e l'annuncio pubblicato che ho letto su vostro sito Internet."
      errors: [ce-ci-sono, adjective-agreement, article-use]
    - tutor: "Mi dispiace molto. Ma «sono state grande differenze»: per dire che una cosa esiste, che cosa mettiamo prima di «sono»?"
      prompt: {text: "sono state grande differenze", tags: [ce-ci-sono]}
    - learner: "Ci sono state grandi differenze tra la realtà e l'annuncio."
    - tutor: "Esatto. Mi spiega quali, per favore?"
    # merlin-1325_1001013-3
    - learner: "Non ho potuto nuotare o non ho potuto giocare tennis perché i campi da tennis erano in riparazione."
      errors: [preposition]
    - tutor: "Capisco, è un problema serio. Ma «giocare tennis»: con «giocare» e uno sport, serve una preposizione. Quale?"
      prompt: {text: "giocare tennis", tags: [preposition]}
    - learner: "Sì, non ho potuto giocare tennis per tutta la settimana."
      errors: [preposition]
    - tutor: "Non ha potuto giocare a tennis per tutta la settimana? Ha ragione, i campi sono chiusi da lunedì. Le restituiamo una parte del prezzo."
      recast: {text: "giocare tennis", fix: "giocare a tennis", tags: [preposition]}
      goals: [problem, since, request]
    # merlin-1325_1001013-8
    - learner: "In attesa di una vostra cortese risposta, distinti saluti."
    - tutor: "Le scriviamo domani con la proposta precisa. Arrivederci!"

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000678-1
    - learner: "Invece mi sono trovata a riposarmi in un edificio vecchio, senza aria condizionata e altre scomodità."
    - tutor: "Mi dispiace molto. Quindi l'aria condizionata in camera non c'è proprio?"
    # merlin-1325_9000678-2
    - learner: "Insomma tutto diverso di quello che c'era scritto sull'annuncio."
      errors: [preposition]
    - tutor: "Capisco. Ma «diverso di quello»: dopo «diverso», quale preposizione usiamo?"
      prompt: {text: "diverso di quello", tags: [preposition]}
    - learner: "Tutto diverso da quello che c'era scritto sull'annuncio."
    - tutor: "Esatto. Ha ragione, l'annuncio non era preciso. E la piscina? Ci sono sempre tanti bambini, lo so."
      goals: [problem]
    # merlin-1325_9000678-5
    - learner: "E anche di questo non sono soddisfatta, quindi non si può usarla con pace e silenzio."
    - tutor: "La capisco: da quando è arrivata, sabato, ha avuto solo problemi. Che cosa possiamo fare per lei?"
      goals: [since]
    # merlin-1325_9000678-7
    - learner: "Scritto tutto questo mi sono permessa di chiedervi un rimborso, almeno parziale per farmi dimenticare tutte le scomodità."
    - tutor: "È giusto. Le propongo un rimborso del trenta per cento, e stasera la cena è offerta da noi."
      goals: [request, agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [subject-verb-agreement]
  turns:
    - tutor: "Buongiorno, albergo Il Lago. Mi dica, c'è qualche problema?"
    # merlin-1325_9000602-0
    - learner: "Dopo aver visto il vostro annuncio era felicissimo di poter passare una settimana di relax dopo un anno di lavoro."
      errors: [subject-verb-agreement]
    - tutor: "Mi fa piacere! Ma «era felicissimo»: parla di sé stesso, vero? Allora «era» va bene?"
      prompt: {text: "era felicissimo", tags: [subject-verb-agreement]}
    - learner: "No: ero felicissimo di poter passare una settimana di relax."
    - tutor: "Esatto. Ma qualcosa non è andato bene, mi sembra."
    # merlin-1325_9000602-1
    - learner: "Ma invece è stata una settimana d'incubo!"
    - tutor: "Mi dispiace tantissimo. Che cosa è successo?"
    # merlin-1325_9000602-3
    - learner: "I campi da tennis erano in riparazione e per finire, l'animazione c'era soltanto una volta alla settimana."
    - tutor: "Ha ragione, i campi sono chiusi da luglio e il ragazzo dell'animazione era malato."
      goals: [problem, since]
    # merlin-1325_9000602-5
    - learner: "Siccome io sono una persona molto sportiva durante le mie vacanze in quel residence ho sofferto moltissimo, perché non ho potuto né giocare a tennis né andare a fare le mie 30 vasche al giorno nella piscina."
    - tutor: "Capisco, per chi ama lo sport è terribile. Che cosa possiamo fare per lei?"
    # merlin-1325_9000602-6
    - learner: "Con questa lettera vi chiedo cordialmente di rimborsarmi almeno il 30% dei soldi che ho speso."
    - tutor: "Il trenta per cento mi sembra giusto. Lo chiedo al direttore e le rispondo entro venerdì."
      goals: [request, agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_9000674-0
    - learner: "Per il mio discontento il residence era un vecchio albergo e non un palazzo di recente costruzione come avete scritto."
    - tutor: "Mi dispiace, la parte nuova del residence non è ancora pronta. C'è qualcos'altro che non va?"
      goals: [problem]
    # merlin-1325_9000674-1
    - learner: "Per quanto riguarda l'aria condizionata, quella nella nostra camera è stata rotta e non è stato possibile accenderla."
      errors: [tense-aspect]
    - tutor: "Capisco. Ma «è stata rotta»: qui descrive com'era la situazione, non un'azione. Quale tempo usiamo?"
      prompt: {text: "è stata rotta", tags: [tense-aspect]}
    - learner: "Sì, è stata rotta tutta la settimana."
      errors: [tense-aspect]
    - tutor: "Era rotta tutta la settimana? È gravissimo, mi dispiace. Domani mattina viene qualcuno a ripararla, promesso."
      recast: {text: "è stata rotta", fix: "era rotta", tags: [tense-aspect]}
      goals: [since]
    # merlin-1325_9000674-2
    - learner: "Anche la lontananza tra l'albergo e il lago lasciava molto a desiderare."
    - tutor: "Ha ragione, il lago è a due chilometri. Però c'è un autobus ogni ora."
    # merlin-1325_9000674-7
    - learner: "Anche i campi da tennis non sono stati mantenuti bene, sono stati proprio chiusi per tutto il tempo."
    - tutor: "È vero, purtroppo. Allora, vuole un rimborso?"
    # merlin-1325_9000674-10
    - learner: "Spero pertanto che vorrete considerare la mia richiesta."
    - tutor: "Certo, la consideriamo. Le propongo il venti per cento del prezzo, più una cena gratis."
      goals: [request, agree]

- scenario: reclamo-hotel
  level: B1
  persona: es-f-erasmus
  history: [preposition, piacere]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    # merlin-1325_1001008-2
    - learner: "Siamo appassionati dello sport."
    - tutor: "Ah, che bello! Allora avete scelto il posto giusto: abbiamo campi da tennis e piscina."
    # merlin-1325_1001008-3
    - learner: "Purtroppo non abbiamo potuto giocare tennis perché i campi da tennis erano in riparazione."
      errors: [preposition]
    - tutor: "Oh no! Ma «giocare tennis»: pensi a «giocare a carte». E con il tennis?"
      prompt: {text: "giocare tennis", tags: [preposition]}
    - learner: "Non abbiamo potuto giocare a tennis."
    - tutor: "Esatto. Ha ragione, i campi sono in riparazione da due settimane. Mi dispiace molto."
      goals: [problem, since]
    # merlin-1325_1001008-9
    - learner: "Me la piace molto ma c'era una sola sera quando c'era animazione."
      errors: [piacere, tense-aspect]
    - tutor: "Capisco. Ma «me la piace»: con «piacere», come diciamo «a me»?"
      prompt: {text: "Me la piace", tags: [piacere]}
    - learner: "Mi è piaciuta molto, ma c'era solo una sera."
    - tutor: "Esatto. Purtroppo il ragazzo dell'animazione era malato. Per il tennis, posso offrirvi due ore gratis al club qui vicino."
      goals: [request, agree]
    # merlin-1325_1001008-13
    - learner: "Cordiali saluti!"
    - tutor: "Grazie a lei, buona serata!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [subjunctive-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Lei ha risposto al mio avviso: cerco persone che parlano molte lingue. Mi parli di lei."
    # merlin-1325_1001133-6
    - learner: "Ho studiato inglese per 12 anni, tedesco e italiano 4 anni."
    - tutor: "Dodici anni di inglese! E adesso studia qualcosa di nuovo?"
      goals: [intro]
    # merlin-1325_1001133-7
    - learner: "Studio cinese da mezz'anno."
    - tutor: "Il cinese! Che coraggio. E le lingue le ha usate anche per lavoro?"
    # merlin-1325_1001133-8
    - learner: "Ho lavorato in Inghilterra, Italia."
    - tutor: "Ottimo, allora conosce bene anche la vita in quei paesi. E perché le piacciono tanto le lingue?"
      goals: [experience]
    # merlin-1325_1001133-12
    - learner: "Vorrei conoscere tante lingue perché posso parlare con tanta gente."
    - tutor: "È il motivo più bello. Ha qualche documento dei suoi esami?"
      goals: [why]
    # merlin-1325_1001133-13
    - learner: "In allegato Vi mando le fotocopie dei miei certificati."
    - tutor: "Grazie, li guardo con attenzione. Pensa che siano utili per la ricerca?"
    # merlin-1325_1001133-14
    - learner: "Credo che potere aiutarVi."
      errors: [subjunctive-form]
    - tutor: "Lo spero! Ma «credo che potere»: dopo «credo che» serve un verbo con la sua persona. Chi ci può aiutare? Quei documenti. Allora?"
      prompt: {text: "credo che potere", tags: [subjunctive-form]}
    - learner: "Credo che possano aiutarVi."
    - tutor: "Esatto. Grazie mille, la chiamo la settimana prossima."
      goals: [strengths]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect, preposition]
  turns:
    - tutor: "Che bello qui! Tu dove hai imparato l'italiano? A scuola?"
    # merlin-1325_1001051-0
    - learner: "Io ho cominciato studiare italiano al liceo, ma solo due lezioni per settimana."
      errors: [preposition]
    - tutor: "Al liceo, interessante! Ma «ho cominciato studiare»? Ripeti piano: tra i due verbi, che cosa ci vuole?"
      prompt: {text: "cominciato studiare", tags: [preposition]}
    - learner: "Ho cominciato a studiare italiano al liceo, due ore a settimana."
    - tutor: "Esatto! Poco, però. E poi sei venuta in Italia, giusto? Che cosa facevi qui?"
      goals: [school, place]
    # merlin-1325_1001051-4
    - learner: "Ho dovuto parlare italiano, e lo dovuto capire questa lingue, perché se non ho capito, come ho fatto il caffè per italiani?"
      errors: [tense-aspect, noun-number]
    - tutor: "Che esperienza! Ma «se non ho capito, come ho fatto il caffè»: parli di una cosa che succedeva ogni giorno. Quale passato usiamo?"
      prompt: {text: "se non ho capito, come ho fatto il caffè", tags: [tense-aspect]}
    - learner: "Se non capivo, come facevo il caffè per gli italiani?"
    - tutor: "Esatto! Imparare al bar è il modo migliore. Ora devo andare, ma mi racconti il resto domani?"
      goals: [habits]
    # merlin-1325_1001051-12
    - learner: "Buona giornata!"
    - tutor: "Buona giornata anche a te, a domani!"

- scenario: affittare-appartamento
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Pronto, scuola di italiano, buongiorno! Come posso aiutarla?"
    # merlin-1365_0100057-2
    - learner: "Per me è importante imparare l'italiano."
    - tutor: "Benissimo. Quando vorrebbe venire, e per quanto tempo?"
    # merlin-1365_0100057-3
    - learner: "Io ho la voglia di venire di Natale per quattro settimane e voglio fare un corso in un piccolo gruppo."
      errors: [preposition]
    - tutor: "Ottima idea, la città a dicembre è bellissima! Ma «venire di Natale»: con le feste, quale preposizione usiamo?"
      prompt: {text: "venire di Natale", tags: [preposition]}
    - learner: "Vorrei venire a Natale per quattro settimane."
    - tutor: "Esatto. Per dormire, preferisce una famiglia o un appartamento con altri studenti?"
    # merlin-1365_0100057-9
    - learner: "Se la casa privata costa tantissimo preferisco passare le settimane in un appartamento con gli altri studenti."
    - tutor: "Capisco. Una camera in famiglia costa trecento euro a settimana, in appartamento centocinquanta."
      goals: [rent, condition]
    # merlin-1365_0100057-10
    - learner: "E poi è anche importante sapere i prezzi per il corso in piccolo gruppo e per il corso individuale."
    - tutor: "Certo: il corso in piccolo gruppo costa duecento euro a settimana, quello individuale cinquecento. Vuole anche un'offerta speciale?"
    # merlin-1365_0100057-12
    - learner: "Voglio dire un prezzo dove è dentro il prezzo per il volo, per il corso e per l'alloggio."
    - tutor: "Ah, un prezzo con tutto dentro! Il volo non lo vendiamo noi, ma corso e appartamento insieme costano 1600 euro per quattro settimane."
      goals: [contract]

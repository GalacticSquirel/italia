# B1 real-learner letters (round 7): applications for an internship, retold in the interview.
# The tutor is the person who reads the application; formal register throughout.
- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [preposition, word-order]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei: perché ha scelto proprio noi?"
    # merlin-1325_9000239-0
    - learner: "Conosco molto bene la Metro Italia perché ho già avuto l'opportunità di lavorare in altri gruppi di grande distribuzione come Carrefour o Auchan."
    - tutor: "Quindi conosce già questo tipo di lavoro, ottimo. E l'italiano, dove l'ha imparato?"
      goals: [intro, experience]
    # merlin-1325_9000239-2
    - learner: "Ho imparato l'italiano durante due anni e posso essere a Parma per lavorare nella vostra ditta dal 30 giugno prossimo al 30 settembre."
      errors: [preposition]
    - tutor: "Interessante. Ma «durante due anni»: per dire quanto è durata una cosa, quale preposizione usiamo?"
      prompt: {text: "durante due anni", tags: [preposition]}
    - learner: "Ho imparato l'italiano per due anni, a scuola."
    - tutor: "Esatto. Dal 30 giugno al 30 settembre va benissimo per noi. Che cosa si aspetta da questa esperienza?"
    # merlin-1325_9000239-3
    - learner: "Spero che accetterete la mia domanda e che avrò la possibilità di meglio conoscere il commercio in Italia."
      errors: [word-order]
    - tutor: "Bene. Ma ripeta «la possibilità di meglio conoscere il commercio»: l'ordine delle parole le sembra naturale?"
      prompt: {text: "di meglio conoscere", tags: [word-order]}
    - learner: "La possibilità di conoscere meglio il commercio in Italia."
    - tutor: "Perfetto. La sua esperienza nei grandi supermercati ci interessa molto."
      goals: [why, strengths]
    # merlin-1325_9000239-4
    - learner: "Le sarei grato se potesse rispondermi per poter organizzare il mio viaggio e l'albergo."
    - tutor: "Certo, le rispondiamo entro venerdì. Così ha il tempo di organizzare tutto."
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei e di che cosa cerca."
    # merlin-1325_9000503-1
    - learner: "Mi piacerebbe, dunque, di poter fare uno stage di due o tre mesi durante il periodo estivo presso la Vostra sede centrale."
      errors: [preposition]
    - tutor: "Due o tre mesi d'estate, bene. Ma «mi piacerebbe di poter fare»: pensi a «mi piacerebbe viaggiare». Come diventa la sua frase?"
      prompt: {text: "mi piacerebbe, dunque, di poter fare", tags: [preposition]}
    - learner: "Mi piacerebbe poter fare uno stage di due o tre mesi."
    - tutor: "Esatto. E che tipo di persona è, secondo lei?"
      goals: [intro]
    # merlin-1325_9000503-2
    - learner: "Ritengo di essere una persona comunicativa, aperta, capace di svolgere il lavoro sia individuale che in gruppo."
      errors: [word-choice]
    - tutor: "Quindi lavora bene sia individualmente che in gruppo: per noi è molto importante."
      recast: {text: "sia individuale che in gruppo", fix: "sia individualmente che in gruppo", tags: [word-choice]}
      new: [{lemma: individualmente, gloss: individually}]
      goals: [strengths]
    # merlin-1325_9000503-3
    - learner: "Spero anche che la mia esperienza acquisita durante il periodo dei miei studi possa essere gradita a Voi e ai Vostri clienti."
    - tutor: "Ne sono sicura. E che cosa ha fatto durante gli studi?"
    # merlin-1325_9000503-4
    - learner: "Alla presente allego il mio Curriculum Vitae dal quale risulta il mio percorso formativo, i corsi linguistici fatti ed altri interessi professionali."
    - tutor: "Grazie, lo leggo con attenzione. Vedo già due corsi di inglese e uno di francese. Ha qualche domanda per noi?"
      goals: [experience]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [preposition, essere-avere]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei: perché la moda?"
    # merlin-1325_9000088-2
    - learner: "La moda mi interessa moltissimo per questo ho già lavorato due anni in un negozio tedesco per la moda che si chiama Pur."
      errors: [preposition]
    - tutor: "Due anni, interessante! Ma «un negozio per la moda»: per dire il tipo di negozio, quale preposizione usiamo?"
      prompt: {text: "negozio tedesco per la moda", tags: [preposition]}
    - learner: "In un negozio tedesco di moda, sì."
    - tutor: "Esatto. E l'italiano? Dove l'ha studiato?"
      goals: [intro, experience]
    # merlin-1325_9000088-3
    - learner: "Parlo l'italiano da cinque anni e per questo vorrei lavorare anche in Italia."
    - tutor: "Bene. E secondo lei, perché sarebbe la persona giusta per noi?"
    # merlin-1325_9000088-6
    - learner: "Sarei perfetto per questo lavoro perché amo la moda e non sono i problemi, se devo aiutare una persona a trovare i vestiti perfetti."
      errors: [essere-avere]
    - tutor: "Bella risposta! Ma «non sono i problemi»: qui parla di lei. Con «problemi», quale verbo usiamo per dire che lei non li conosce?"
      prompt: {text: "non sono i problemi", tags: [essere-avere]}
    - learner: "Non ho problemi se devo aiutare una persona."
    - tutor: "Esatto. È proprio quello che cerchiamo: pazienza e amore per la moda."
      goals: [strengths, why]
    # merlin-1325_9000088-9
    - learner: "Vi ringrazio in attesa di una risposta."
    - tutor: "Grazie a lei. Le facciamo sapere entro due settimane."

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei. Che lavoro fa adesso?"
    # merlin-1325_9000505-1
    - learner: "Lavoro in ufficio fiscale."
      errors: [article-use]
    - tutor: "Ah, interessante. Ma «lavoro in ufficio fiscale»: è un ufficio preciso, uno tra tanti. Che cosa ci vuole davanti a «ufficio»?"
      prompt: {text: "in ufficio fiscale", tags: [article-use]}
    - learner: "Lavoro in un ufficio fiscale, da tre anni."
    - tutor: "Esatto. E perché vuole cambiare e lavorare in un'agenzia di viaggi?"
      goals: [intro]
    # merlin-1325_9000505-7
    - learner: "Vorrei fare uno stage nella Loro società, cerco di lavorare il meglio possibile."
    - tutor: "Bene. E che cosa sa dei viaggi? Ha esperienza?"
      goals: [why]
    # merlin-1325_9000505-8
    - learner: "Nella mia vita visitavo tanti paesi e penso che so anche bene raccontare dei altri paesi e della sua tradizione."
      errors: [tense-aspect, article-form, possessive]
    - tutor: "Ha viaggiato molto, quindi! Ma «nella mia vita visitavo tanti paesi»: sono viaggi finiti, che può contare. Quale passato usiamo?"
      prompt: {text: "visitavo tanti paesi", tags: [tense-aspect]}
    - learner: "Nella mia vita ho visitato tanti paesi."
    - tutor: "Esatto. Questa esperienza è utile per noi: i clienti vogliono consigli veri."
      goals: [experience, strengths]
    # merlin-1325_9000505-9
    - learner: "Amo i viaggi in bicicletta."
    - tutor: "Che bello! Abbiamo proprio un nuovo progetto di viaggi in bicicletta in Toscana."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Ho letto la sua lettera. Mi parli un po' di lei: che cosa fa adesso?"
    # merlin-1325_9000099-1
    - learner: "Per il momento lavoro per un negozio sportivo a Lucerna."
    - tutor: "Un negozio sportivo, bene. E come mai le interessa la nostra azienda?"
      goals: [intro]
    # merlin-1325_9000099-8
    - learner: "Mi piace molto la moda di Giorgio Armani e ho fatto una formazione professionale."
    - tutor: "Ah, una formazione nella moda? Mi racconti."
      goals: [why]
    - learner: "Sì. Durante la formazione lavoravo due anni in un negozio di vestiti a Zurigo."
      errors: [tense-aspect]
    - tutor: "Interessante! Ma «lavoravo due anni»: è un periodo preciso e finito. Quale passato usiamo?"
      prompt: {text: "lavoravo due anni", tags: [tense-aspect]}
    - learner: "Ho lavorato due anni in un negozio di vestiti a Zurigo."
    - tutor: "Esatto. Quindi conosce già i clienti e le vendite: questo ci interessa."
      goals: [experience]
    # merlin-1325_9000099-11
    - learner: "In attesa di una vostra risposta, spero una risposta positiva, Vi ringrazio in anticipo."
    - tutor: "Grazie a lei. Le scriviamo entro la fine del mese."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [possessive, noun-number]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei: che lingue parla?"
    # merlin-1325_1001154-4
    - learner: "Parlo abbastanza bene l'inglese, il tedesco e il greco."
    - tutor: "Tre lingue straniere, ottimo per un'azienda come la nostra. Come si descriverebbe?"
      goals: [intro]
    # merlin-1325_1001154-5
    - learner: "Sono una persona amichevole, socievole, affidabile, volenterosa e desiderosa di imparare, e particolarmente interessata al profilo professionale da Vostra richiesto."
      errors: [possessive]
    - tutor: "Molto bene! Ma «da Vostra richiesto»: «vostra» va con un nome, come «vostra azienda». Dopo «da», qui, che parola serve?"
      prompt: {text: "da Vostra richiesto", tags: [possessive]}
    - learner: "Interessata al profilo da Voi richiesto."
    - tutor: "Esatto. E sarebbe disposta a viaggiare per lavoro?"
      goals: [strengths]
    # merlin-1325_1001154-7
    - learner: "Sono altresì disponibile a frequentare un eventuale corsi di formazione ed a fare trasferte anche all'estero."
      errors: [noun-number]
    - tutor: "Ottimo! Ma «un eventuale corsi»: «un» è singolare. Allora «corsi»?"
      prompt: {text: "un eventuale corsi", tags: [noun-number]}
    - learner: "Sì, a frequentare un eventuale corso di formazione."
    - tutor: "Esatto. Allora le mandiamo il programma del corso di settembre."
      goals: [why]
    # merlin-1325_1001154-10
    - learner: "Con i migliori saluti!"
    - tutor: "Grazie a lei, arrivederci!"

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei: perché vuole lavorare con noi?"
    # merlin-1325_1001155-0
    - learner: "Ho letto il vostro annuncio che cercate un'assistente per attività amministrative."
    - tutor: "Sì, cerchiamo una persona per l'ufficio. Ha già fatto un lavoro simile?"
      goals: [intro]
    # merlin-1325_1001155-3
    - learner: "Lì dovevo solo mettere cose in Excel e qualche documenti e chiamare qualcuno che mi ha detto il mio capo."
      errors: [tense-aspect, noun-number]
    - tutor: "Bene. Ma «chiamare qualcuno che mi ha detto il mio capo»: era una cosa di tutti i giorni, che succedeva spesso. Quale passato usiamo?"
      prompt: {text: "mi ha detto il mio capo", tags: [tense-aspect]}
    - learner: "Chiamavo le persone che mi diceva il mio capo."
    - tutor: "Esatto. Quindi conosce già il lavoro d'ufficio. Ha qualche domanda per noi?"
      goals: [experience]
    # merlin-1325_1001155-7
    - learner: "Insomma vorrei chiedere informazioni sull'orario di lavoro e sul retribuzione."
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «sul retribuzione»: «retribuzione» è femminile. Allora come diventa «sul»?"
      prompt: {text: "sul retribuzione", tags: [articulated-preposition]}
    - learner: "Sulla retribuzione, scusi."
    - tutor: "Esatto. Si lavora dalle nove alle cinque, e il lavoro è pagato seicento euro al mese."
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Lei ha risposto al mio avviso: cerco un aiuto per una ricerca sulle lingue. Mi parli di lei."
    # merlin-1325_1001040-8
    - learner: "Ho cominciato studiare l'italiano tre anni fa, perché non c'era la possibilità di studiare lo spagnolo a scuola, però adesso amo l'italiano."
      errors: [preposition]
    - tutor: "Bene. Ma «ho cominciato studiare»: tra «cominciare» e l'infinito, che preposizione mettiamo?"
      prompt: {text: "cominciato studiare", tags: [preposition]}
    - learner: "Ho cominciato a studiare l'italiano tre anni fa."
    - tutor: "Esatto. E oltre all'italiano?"
      goals: [intro]
    # merlin-1325_1001040-6
    - learner: "Studio lo spagnolo da due anni e studiarlo sembra che sia utile, perché molte persone parlano lo spagnolo."
    - tutor: "Verissimo, è una lingua molto parlata. Ha anche un esame da fare?"
      goals: [experience]
    # merlin-1325_1001040-7
    - learner: "Spero che possa superare anche l'esame di lingua in spagnolo."
    - tutor: "In bocca al lupo! E le lingue le usa anche fuori dalla scuola?"
    # merlin-1325_1001040-5
    - learner: "Così posso insegnare l'inglese per esempio ai miei amici."
    - tutor: "Che bello, allora ha già un po' di esperienza come insegnante: per la ricerca è un punto forte. Le scrivo la settimana prossima con gli orari."
      goals: [strengths]
    # merlin-1325_1001040-12
    - learner: "Cordiali saluti!"
    - tutor: "Arrivederci, a presto!"

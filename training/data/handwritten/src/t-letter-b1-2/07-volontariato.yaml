# B1 real-learner letters (round 7): asking to join a summer volunteering project, told to the coordinator.
# The learner may address the whole association with «voi»: that is correct and left alone.
- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000278-3
    - learner: "Sono una persona socievole e mi piacciono molto le pubbliche relazioni."
    - tutor: "Perfetto, ci serve proprio qualcuno che sappia parlare con la gente! Da dove vieni?"
    # merlin-1325_9000278-1
    - learner: "La mia lingua madre è il polacco."
    - tutor: "Il polacco, interessante! E parli anche altre lingue?"
    # merlin-1325_9000278-2
    - learner: "Ho ottime conoscenze del francese e buone conoscenze del tedesco e dell'inglese (parlate e scritte)."
    - tutor: "Ottimo, con il francese puoi aiutarci con le famiglie che arrivano dall'Africa. Quanto tempo hai?"
      goals: [skills]
    # merlin-1325_9000278-4
    - learner: "Scrivo alla vostra azienda perché sono alla ricerca di un lavoro part-time e ho tanto tempo da disposizione."
      errors: [preposition]
    - tutor: "Benissimo! Ma «tempo da disposizione»: è un modo di dire fisso. Con quale preposizione?"
      prompt: {text: "tempo da disposizione", tags: [preposition]}
    - learner: "Ho tanto tempo a disposizione."
    - tutor: "Esatto! Allora potresti lavorare all'ufficio informazioni tre pomeriggi a settimana."
      goals: [time]
    # merlin-1325_9000278-6
    - learner: "Mi piacerebbe essere inserita per offrire il mio aiuto."
    - tutor: "Allora ti metto subito nel gruppo dell'ufficio informazioni. Cominci lunedì!"
      goals: [motivation, choose]

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition, article-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Raccontami un po' di te."
    # merlin-1325_9000676-0
    - learner: "Mi chiamo Maria e sono insegnante di storia in scuola media."
      errors: [articulated-preposition]
    - tutor: "Che bel lavoro! Ma «insegnante in scuola media»: pensa a «lavoro all'università». E con la scuola media?"
      prompt: {text: "in scuola media", tags: [articulated-preposition]}
    - learner: "Sono insegnante di storia alla scuola media."
    - tutor: "Esatto! E perché vuoi fare volontariato quest'estate?"
      goals: [skills]
    # merlin-1325_9000676-3
    - learner: "Quest'anno ho deciso di passare le mie vacanze dedicandomi ai altri."
      errors: [article-form]
    - tutor: "È un motivo bellissimo! Ma «ai altri»: davanti ad «altri», «ai» va bene?"
      prompt: {text: "ai altri", tags: [article-form]}
    - learner: "Dedicandomi agli altri, sì."
    - tutor: "Esatto. Con la tua esperienza potresti aiutare i bambini con i compiti. Quanti anni hai? Alcuni campi sono per giovani."
      goals: [motivation]
    # merlin-1325_9000676-6
    - learner: "Ho 29 anni."
    - tutor: "Perfetto, va benissimo. Allora ti metto nel campo di agosto con i bambini, a Genova."
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [past-participle-form, articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000536-0
    - learner: "Come potrete vedere nel il mio curriculum vitae in allegato, sono studentessa all'università e ho anche già lavorato in un campo di Solidarietà Viva l'anno scorso in estate."
      errors: [articulated-preposition]
    - tutor: "Che bello, sei già stata in un nostro campo! Ma «nel il mio curriculum»: ascolta bene, quanti articoli ci sono?"
      prompt: {text: "nel il mio curriculum", tags: [articulated-preposition]}
    - learner: "Come potrete vedere nel mio curriculum, ho già lavorato in un vostro campo."
    - tutor: "Esatto! E quest'anno che cosa vorresti fare?"
      goals: [motivation]
    # merlin-1325_9000536-1
    - learner: "Inoltre, ho acquisto di buona conoscenze di lavoro nella recuperazione di materiale riciclabile perché leggo regolarmente libri su questo tema."
      errors: [past-participle-form, adjective-agreement]
    - tutor: "Molto utile per noi! Ma «ho acquisto»: «acquisto» è un nome, come in «fare un acquisto». Il passato del verbo com'è?"
      prompt: {text: "ho acquisto", tags: [past-participle-form]}
    - learner: "Ho acquisito buone conoscenze sul riciclo, leggo molti libri."
    - tutor: "Esatto. Allora potresti lavorare nel campo del riciclo, a Bergamo. Quando sei libera?"
      goals: [skills]
    # merlin-1325_9000536-4
    - learner: "Sono disponibile per un lavoro a tempo pieno a Milano e a l'estero."
      errors: [articulated-preposition]
    - tutor: "Anche a tempo pieno, perfetto! Ma «a l'estero»: «a» e «l'» vicini, come diventano?"
      prompt: {text: "a l'estero", tags: [articulated-preposition]}
    - learner: "A Milano e all'estero, va bene tutto."
    - tutor: "Esatto! Allora ti propongo il campo di agosto, a tempo pieno."
      goals: [time, choose]

- scenario: volontariato
  level: B1
  persona: en-m-heritage
  history: [adjective-agreement]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Come ti chiami?"
    # merlin-1325_1001027-0
    - learner: "Sono Michele Rossi."
    - tutor: "Piacere, Michele! Studi o lavori?"
    # merlin-1325_1001027-4
    - learner: "Frequento la Facoltà di Lettere dell'Università di Bologna."
    - tutor: "Lettere, che bello! Sei al primo anno?"
    # merlin-1325_1001027-5
    - learner: "Sono universitario da quattro anni."
    - tutor: "Allora sei quasi alla fine! E perché vuoi fare volontariato con noi?"
    # merlin-1325_1001027-10
    - learner: "Sarei volentieri di nuovo un operaio da Voi."
    - tutor: "Di nuovo? Ah, quindi hai già lavorato con noi! Bene, conosci già i nostri campi."
      goals: [motivation]
    # merlin-1325_1001027-11
    - learner: "Lavorerei volentieri con la gente povero."
      errors: [adjective-agreement]
    - tutor: "Che bel desiderio. Ma «la gente povero»: «gente» è femminile, anche se parla di tante persone. Allora?"
      prompt: {text: "la gente povero", tags: [adjective-agreement]}
    - learner: "Lavorerei volentieri con la gente povera."
    - tutor: "Esatto! Allora il campo di Napoli fa per te: aiutiamo le famiglie del quartiere."
      goals: [choose]
    # merlin-1325_1001027-13
    - learner: "Spero che avrò la possibilità di presentarmi anche personalmente."
    - tutor: "Certo! Vieni in ufficio giovedì alle cinque, così ci conosciamo."
      goals: [time]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000186-0
    - learner: "Ho letto il vostro annuncio sul giornale e vorrei dirvi che sarei molto contenta di poter partecipare al vostro progetto."
    - tutor: "Che bello! Parli dei campi d'estate nella natura, vero? Come mai ti interessano?"
    # merlin-1325_9000186-1
    - learner: "Ho sempre apprezzato questo tipo di azioni e sono sin da piccola amante della natura."
    - tutor: "Allora sei la persona giusta. Hai già esperienza con questi temi?"
      goals: [motivation]
    # merlin-1325_9000186-2
    - learner: "Ai miei 24 anni ho organizzato assieme a due colleghi due corsi informativi per gli allievi in cui abbiamo parlato della importanza del recupero dei materiali riciclabili e della protezione dell'ambiente."
      errors: [preposition]
    - tutor: "Bravissima! Ma «ai miei 24 anni»: per dire a che età hai fatto una cosa, come diciamo in italiano?"
      prompt: {text: "Ai miei 24 anni", tags: [preposition]}
    - learner: "A 24 anni ho organizzato due corsi per gli allievi."
    - tutor: "Esatto! Allora nel campo potresti anche fare lezione ai bambini."
      goals: [skills]
    # merlin-1325_9000186-6
    - learner: "Sarò molto contenta di aiutarvi nella vostra missione, di partecipare al recupero di materiale e di curare l'ambiente."
    - tutor: "Siamo contenti noi! Allora ti metto nel campo di luglio, con le lezioni per i bambini."
      goals: [choose, time]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [demonstrative]
  turns:
    - tutor: "Buongiorno! Le interessa fare volontariato con noi?"
    # merlin-1325_9000686-0
    - learner: "Penso che queste tipo di lavoro potrebbe essere interessante per me, poiché io sono pensionato."
      errors: [demonstrative]
    - tutor: "Che bello! Ma «queste tipo di lavoro»: «tipo» è maschile singolare. Allora «queste» come cambia?"
      prompt: {text: "queste tipo di lavoro", tags: [demonstrative]}
    - learner: "Sì, queste tipo di lavoro mi piace molto."
      errors: [demonstrative]
    - tutor: "Questo tipo di lavoro piace a molte persone in pensione, sa? Ci racconti un po' di lei."
      recast: {text: "queste tipo di lavoro", fix: "questo tipo di lavoro", tags: [demonstrative]}
      goals: [motivation]
    # merlin-1325_9000686-2
    - learner: "Vi voglio dare alcune informazioni sulla mia persona."
    - tutor: "Certo, la ascolto!"
    # merlin-1325_9000686-3
    - learner: "Sono pensionato come ho detto, sono laureato in scienza ambientale ed anche in economia."
    - tutor: "Due titoli di studio, bravo! Per i nostri campi nella natura sono perfetti."
      goals: [skills]
    # merlin-1325_9000686-5
    - learner: "Penso che una cosa sarebbe importante in questo tipo di lavoro, cioè avere conoscimenti nella materia, come è nel mio caso."
      errors: [word-choice]
    - tutor: "Ha ragione, le conoscenze in questo campo sono importanti, e lei ne ha tante."
      recast: {text: "conoscimenti", fix: "conoscenze", tags: [word-choice]}
    # merlin-1325_9000686-6
    - learner: "Poiché sono pensionato, sto sempre a disposizione."
    - tutor: "Perfetto! Allora potrebbe venire tutta l'estate?"
      goals: [time]
    # merlin-1325_9000686-9
    - learner: "Per finire questo scritto, vi voglio informare che parlo bene spagnolo, tedesco, inglese, portoghese e italiano."
    - tutor: "Cinque lingue! Allora lei è perfetto per il campo di agosto, con volontari da tutto il mondo."
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000188-1
    - learner: "Questa estate, proprio nel mese de luglio sarò in vacanza, quindi, vorrei candidarmi a aiutarvi in questo bellissimo progetto."
      errors: [preposition]
    - tutor: "Benvenuta! Ma «nel mese de luglio»: in italiano, quale preposizione mettiamo tra «mese» e «luglio»?"
      prompt: {text: "nel mese de luglio", tags: [preposition]}
    - learner: "Nel mese di luglio sarò in vacanza."
    - tutor: "Esatto! Luglio va benissimo, abbiamo due campi. Come mai ti interessa proprio questo progetto?"
      goals: [time]
    # merlin-1325_9000188-3
    - learner: "Inoltre, come brasiliana e sapendo che il progetto aiuta a finanziare gruppi con scopo di sviluppamento in America latina, mi sento ancora più felice e soddisfatta di poter partecipare."
      errors: [word-choice]
    - tutor: "Certo, i soldi raccolti vanno a gruppi che lavorano per lo sviluppo in America latina. Per te allora è un progetto speciale!"
      recast: {text: "sviluppamento", fix: "sviluppo", tags: [word-choice]}
      new: [{lemma: sviluppo, gloss: development}]
      goals: [motivation]
    # merlin-1325_9000188-4
    - learner: "Colgo l'occasione per chiedere il formulario d'iscrizione."
    - tutor: "Certo, eccolo: lo riempi e me lo porti entro venerdì. Poi ti scriviamo per il campo."
      goals: [choose]
    # merlin-1325_9000188-6
    - learner: "Rimango in attesa della vostra gentile risposta e porgo i miei più distinti saluti."
    - tutor: "Grazie a te! Ti scriviamo presto."

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Le interessa fare volontariato con noi? Mi racconti di lei."
    # merlin-1325_9000317-0
    - learner: "Un anno dopo, sono stato assunto come impiegato statale al Ministero dei servizi sociali e del Sviluppo."
      errors: [article-form]
    - tutor: "Interessante! Ma «del Sviluppo»: davanti a una parola come «Sviluppo», l'articolo «il» cambia. E allora «del»?"
      prompt: {text: "del Sviluppo", tags: [article-form]}
    - learner: "Al Ministero dei servizi sociali e dello Sviluppo."
    - tutor: "Esatto. E adesso? Ha tempo per i nostri campi?"
      goals: [skills]
    # merlin-1325_9000317-5
    - learner: "Desidero lavorare presso la Vostra azienda nei mesi estivi di giugno fino settembre ove sono libero dai impegni."
      errors: [preposition, article-form]
    - tutor: "Bene! Ma «di giugno fino settembre»: per dire quando comincia e quando finisce, queste preposizioni vanno bene?"
      prompt: {text: "di giugno fino settembre", tags: [preposition]}
    - learner: "Da giugno fino a settembre sono libero."
    - tutor: "Esatto! Tre mesi interi, fantastico. Preferisce lavorare con gli anziani o con i bambini?"
      goals: [time]
    - learner: "Con gli anziani: per alcuni anni ho fatto il badante."
    - tutor: "Perfetto, allora la metto nel gruppo degli anziani a Torino. Ci vediamo il primo giugno!"
      goals: [motivation, choose]
    # merlin-1325_9000317-9
    - learner: "Cordiali saluti!"
    - tutor: "Arrivederci, a giugno!"

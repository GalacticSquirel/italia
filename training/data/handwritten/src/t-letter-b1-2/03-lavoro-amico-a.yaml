# B1 real-learner letters (round 7): helping a friend who has just finished school and looks for work.
# The tutor is that friend; the learner retells what the letter said.
- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [hypothetical]
  turns:
    - tutor: "Ciao! Hai saputo? Ho finito la maturità! Adesso però non so proprio cosa fare."
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100164-0
    - learner: "Gratulazione per la maturità e con il massimo dei voti, è buonissimo!"
      errors: [word-choice]
    - tutor: "Grazie per le congratulazioni! Sì, il massimo dei voti, non ci credo ancora."
      recast: {text: "Gratulazione", fix: "Congratulazioni", tags: [word-choice]}
    # merlin-1365_0100164-1
    - learner: "Un mese fa ho anche fatto un esame, ma era solo un esame d'italiano."
    - tutor: "Solo? Un esame d'italiano non è poco! E com'è andato?"
    # merlin-1365_0100164-2
    - learner: "Purtroppo non so ancora se l'ho superato, ma credo di sì."
    - tutor: "Sono sicuro di sì, parli benissimo. Io invece devo decidere: lavoro o università? Tu cosa faresti?"
    # merlin-1365_0100164-8
    - learner: "Ma se non hai nessun'idea, potresti lavorare prima e così provare a trovare qualcosa che ti piace e dopo un anno potresti cominciare a studiare all'università, se avresti voglia."
      errors: [hypothetical]
    - tutor: "Mi sembra un buon piano! Ma «se avresti voglia»: dopo «se», in una frase così, il condizionale va bene?"
      prompt: {text: "se avresti voglia", tags: [hypothetical]}
    - learner: "No: potresti cominciare l'università dopo un anno, se avessi voglia."
    - tutor: "Esatto! Un anno di lavoro mi farebbe bene. Ma dove? Qui in zona non c'è molto."
      goals: [preference]
    # merlin-1365_0100164-9
    - learner: "Purtroppo Barilla non cerca nessuno, ma se cambia ti faccio sapere."
    - tutor: "Grazie, sei gentile. Lavorare alla Barilla sarebbe un sogno!"
    # merlin-1365_0100164-10
    - learner: "Posso anche leggere Il Mondo se trovo un annuncio di un albergo che sta cercando personale."
    - tutor: "«Il Mondo»? È il giornale della tua città? In un albergo lavorerei con piacere, d'estate cercano sempre qualcuno."
      goals: [situation]

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [noun-number]
  turns:
    - tutor: "Ciao! Ho superato l'ultimo esame, finalmente! Adesso cerco un lavoro per qualche mese. Tu come stai, sempre in quell'ufficio?"
    # merlin-1365_0100219-7
    - learner: "Sono impiegato al ufficio del ambiente come giurista."
      errors: [articulated-preposition]
    - tutor: "Ah, giusto, giurista! Ma «al ufficio»: davanti a «ufficio», «al» come diventa?"
      prompt: {text: "al ufficio", tags: [articulated-preposition]}
    - learner: "Sono impiegato all'ufficio dell'ambiente."
    - tutor: "Esatto! E com'è il lavoro? Avete tanto da fare?"
      goals: [situation]
    # merlin-1365_0100219-3
    - learner: "Molti incarti sono bene presentati e non fanno difficoltà."
    - tutor: "Incarti? Non conosco questa parola: sono documenti, pratiche? Allora il lavoro è abbastanza tranquillo."
    # merlin-1365_0100219-4
    - learner: "Per quelli incarti semplice il nostro ufficio cerca una persona per darci una mano per tre mese."
      errors: [noun-number, adjective-agreement, demonstrative]
    - tutor: "Davvero? Che notizia! Ma «tre mese»: dopo un numero come tre, il nome è singolare o plurale?"
      prompt: {text: "tre mese", tags: [noun-number]}
    - learner: "Per tre mesi, da luglio a settembre."
    - tutor: "Esatto! Tre mesi sarebbero perfetti per me. Stasera ti scrivo con tutte le informazioni, grazie!"
      goals: [preference]
    # merlin-1365_0100219-9
    - learner: "Ancora bravo per l'esame superato."
    - tutor: "Grazie! Ho studiato tanto, ma ne è valsa la pena."
    # merlin-1365_0100219-12
    - learner: "Tanti saluti!"
    - tutor: "Ciao, a presto! E grazie ancora per l'aiuto."

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [possessive]
  turns:
    - tutor: "Ciao! Hai visto? Ho finito la maturità, con il massimo dei voti!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100220-1
    - learner: "Auguri per l'esame della maturità linguistica!"
    - tutor: "Grazie mille! Non ci credevo neanche io."
    # merlin-1365_0100220-3
    - learner: "Sono molto felice per te."
    - tutor: "Sei gentile. Adesso però vorrei lavorare qualche mese, prima dell'università. Hai qualche idea?"
    # merlin-1365_0100220-5
    - learner: "Non sono sicura, ma forse il mio padre ha bisogno di un assistente nella sua ditta."
      errors: [possessive]
    - tutor: "Sarebbe fantastico! Ma «il mio padre»: con i nomi di famiglia al singolare, ci vuole quell'articolo?"
      prompt: {text: "il mio padre", tags: [possessive]}
    - learner: "No, scusa: forse mio padre ha bisogno di un assistente."
    - tutor: "Esatto! Lavorare in una ditta sarebbe perfetto per me. Puoi chiederglielo?"
      goals: [preference]
    # merlin-1365_0100220-6
    - learner: "Lo chiederò la settimana prossima quando lo vedo per una festa della mia famiglia."
    - tutor: "Grazie mille, sei un'amica vera! Ma tu come stai? Non ti sento da mesi."
    # merlin-1365_0100220-7
    - learner: "Io voglio scusarmi di non avere scritto più presto."
    - tutor: "Ma figurati, so che hai sempre tanto lavoro. Vai un po' in vacanza quest'estate?"
    # merlin-1365_0100220-14
    - learner: "Sono molto contenta di partire un po' e dimenticare lo stress."
    - tutor: "Fai benissimo, te lo meriti! Ma prima di partire mi dici cosa ha detto tuo padre, va bene?"

- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Ciao! Io ho finito la maturità, finalmente. E tu? Hai già fatto l'esame?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100476-0
    - learner: "Io non ho preso ancora la maturità linguistica."
    - tutor: "Ah, giusto, la tua è più tardi! Io invece non so cosa fare adesso: lavoro o università?"
    # merlin-1365_0100476-4
    - learner: "Anch'io non so ancora che cosa voglio studiare all'università, così ho deciso di andare per un anno all'estero come ragazza alla pari."
    - tutor: "Ragazza alla pari? Che coraggio! Io invece cerco un lavoro per l'estate. Conosci qualcuno?"
    # merlin-1365_0100476-5
    - learner: "Lui mi ha chiesto due settimane fa se voglio aiutargli perché stanno cercando uno che può aiutare a lavorare al bar dell'albergo."
      errors: [object-pronoun]
    - tutor: "Un lavoro al bar, fantastico! Ma «aiutargli»: aiutiamo qualcuno, non a qualcuno. Allora quale pronome serve per «loro»?"
      prompt: {text: "aiutargli", tags: [object-pronoun]}
    - learner: "Il mio vicino lavora in quell'albergo. Mi ha chiesto se voglio aiutarli."
    - tutor: "Esatto! Ah, è il tuo vicino. E cercano qualcuno anche per tutta l'estate?"
      goals: [situation]
    # merlin-1365_0100476-6
    - learner: "Ti do il suo numero di telefono se ti interessa a lavorare lì."
      errors: [preposition]
    - tutor: "Certo che mi interessa! Ma ripeti «ti interessa a lavorare lì» e pensa a «ti piace lavorare lì». È uguale?"
      prompt: {text: "ti interessa a lavorare", tags: [preposition]}
    - learner: "Ti do il suo numero se ti interessa lavorare lì."
    - tutor: "Esatto! Un bar d'albergo d'estate è perfetto per me: meglio di un ufficio, almeno per adesso."
      goals: [preference]
    # merlin-1365_0100476-8
    - learner: "A presto e tanti saluti!"
    - tutor: "A presto, e grazie ancora! In bocca al lupo per l'esame."

- scenario: smartworking
  level: B1
  persona: en-m-retired
  history: [pronoun-position]
  turns:
    - tutor: "Ciao! Hai saputo? Ho superato la maturità!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100266-10
    - learner: "Congratulazioni per il successo tuo!"
    - tutor: "Grazie mille! E tu? Mi hanno detto che fai un corso per imparare a dipingere."
    # merlin-1365_0100266-3
    - learner: "Ho conosciuto tanti motivi, ed adesso posso dipingere fiori bellissimi."
    - tutor: "Motivi? Intendi i disegni, le cose da dipingere? Mi devi far vedere i tuoi fiori! Senti, nel tuo ufficio cercano qualcuno per l'estate?"
    # merlin-1365_0100266-4
    - learner: "Se accettassi, dovrei registrare i fogli di ufficio, come no."
    - tutor: "Registrare documenti? Non è il lavoro dei miei sogni, ma per qualche mese va bene."
      goals: [situation]
    # merlin-1365_0100266-5
    - learner: "Non è un lavoro intellettuale, è sottopagato, ma senza dubbio saresti contento se anche tu cominci a lavorare."
      errors: [hypothetical]
    - tutor: "Hai ragione! Ma «saresti contento se cominci»: è una cosa possibile, non reale: quindi dopo «se» che modo ci vuole?"
      prompt: {text: "se anche tu cominci", tags: [hypothetical]}
    - learner: "Saresti contento se anche tu cominciassi a lavorare."
    - tutor: "Esatto! E un po' di soldi miei mi farebbero comodo. Allora stasera ti mando i miei dati."
      goals: [pros]
    # merlin-1365_0100266-12
    - learner: "Mostrerò lo al capoufficio!"
      errors: [pronoun-position]
    - tutor: "Grazie! Ma «mostrerò lo»: con un verbo al futuro, il pronome «lo» va prima o dopo?"
      prompt: {text: "Mostrerò lo", tags: [pronoun-position]}
    - learner: "Lo mostrerò al capoufficio!"
    - tutor: "Esatto! Grazie mille, sei un vero amico."

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [verb-form]
  turns:
    - tutor: "Ciao! Finalmente ho finito gli esami. Tu come stai? E il lavoro?"
    # merlin-1365_0100456-5
    - learner: "All'ufficio tutto va bene."
    - tutor: "Meno male! Hai sempre tanto da fare?"
    # merlin-1365_0100456-6
    - learner: "Ho molto lavoro ma come sempre è un lavoro interessante che mi dà molta soddisfazione."
    - tutor: "Che fortuna, un lavoro che ti piace! Io invece cerco qualcosa per l'estate. Hai sentito di qualche posto?"
      goals: [situation, pros]
    # merlin-1365_0100456-10
    - learner: "A che riguarda la tua domanda: ho sentito che il cinema Lichtspiel deve traslocare fra poco."
      errors: [word-choice]
    - tutor: "Ah, per quel che riguarda la mia domanda hai già una notizia? Il cinema vicino a casa tua deve traslocare?"
      recast: {text: "A che riguarda", fix: "per quel che riguarda", tags: [word-choice]}
    # merlin-1365_0100456-11
    - learner: "Per questo cercano alcune persone per il trasloco."
    - tutor: "Un lavoro di trasloco? Portare scatole e sedie non mi fa paura, sono forte!"
    # merlin-1365_0100456-12
    - learner: "Forse questo lavoro ti interesse?"
      errors: [verb-form]
    - tutor: "Sì, molto! Ma «ti interesse»: di che cosa parli? Di «questo lavoro», una cosa sola. Allora come finisce il verbo?"
      prompt: {text: "ti interesse", tags: [verb-form]}
    - learner: "Forse questo lavoro ti interessa?"
    - tutor: "Esatto! Sì, mi interessa: preferisco un lavoro con le mani, almeno per l'estate."
      goals: [preference]
    # merlin-1365_0100456-15
    - learner: "Tanti saluti, un abbraccio e a presto!"
    - tutor: "Un abbraccio anche a te! Mi mandi il numero del cinema?"

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [future-form, noun-gender]
  turns:
    - tutor: "Ciao! Io sto benissimo: ho finito la maturità! E tu come stai, in Francia?"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100475-2
    - learner: "Io sto anche bene."
    - tutor: "Che bello! Ti trovi bene? All'inizio non conoscevi nessuno."
    # merlin-1365_0100475-6
    - learner: "Ho già trovato tanti nuovi amici qui."
    - tutor: "Fantastico! E lavori o studi ancora?"
    # merlin-1365_0100475-8
    - learner: "Dopo l'università lavoro in una ristorante tipica francese."
      errors: [noun-gender]
    - tutor: "Che bello, lavori in cucina? Ma «una ristorante»: «ristorante» è maschile o femminile?"
      prompt: {text: "una ristorante tipica", tags: [noun-gender]}
    - learner: "In un ristorante tipico francese, sì. Faccio la cameriera."
    - tutor: "Esatto! Allora conosci bene il lavoro. Io invece non so ancora: lavoro o università?"
      goals: [situation]
    # merlin-1365_0100475-12
    - learner: "Secondo me l'università è un posto dove si può imparare molto."
    - tutor: "Hai ragione, però prima vorrei lavorare un po'. Magari a Roma! Non mi avevi parlato di un tuo amico che affitta una camera lì?"
      goals: [preference]
    # merlin-1365_0100475-22
    - learner: "Io sarò domandare il mio amico."
      errors: [future-form, preposition]
    - tutor: "Sì, Roma sarebbe perfetta! Ma «sarò domandare»: per il futuro di «domandare» basta un verbo solo. Come diventa?"
      prompt: {text: "sarò domandare", tags: [future-form]}
    - learner: "Domanderò al mio amico!"
    - tutor: "Esatto! Grazie mille. E quando vieni in Italia, festeggiamo insieme!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Hai saputo? Alla maturità ho preso il massimo dei voti!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100121-0
    - learner: "È un onore che hai ricevuto il massimo dei voti!"
    - tutor: "Grazie! Ero stanchissimo, ma ne è valsa la pena. E tu? Non ti sento da mesi!"
    # merlin-1365_0100121-1
    - learner: "Nonostante la vacanza in Svezia due mesi fa, ero anch'io molto impegnato nell'ultimo periodo."
      errors: [tense-aspect]
    - tutor: "Lo immagino! Ma «ero impegnato nell'ultimo periodo»: è un periodo chiuso, finito. Quale passato usiamo?"
      prompt: {text: "ero anch'io molto impegnato", tags: [tense-aspect]}
    - learner: "Sono stato anch'io molto impegnato, sì."
    - tutor: "Esatto! E il lavoro? Sempre in quella ditta di computer?"
    # merlin-1365_0100121-2
    - learner: "Nel lavoro stanno arrivando continualmente nuovi progetti."
      errors: [word-choice]
    - tutor: "Continuamente? Allora non ti annoi mai! E l'esame d'italiano, quando lo fai?"
      recast: {text: "continualmente", fix: "continuamente", tags: [word-choice]}
      goals: [situation]
    # merlin-1365_0100121-5
    - learner: "Sono un po' nervoso, ma penso andrà bene."
    - tutor: "Certo che andrà bene, parli benissimo! Senti, io cerco un lavoro per l'estate in un albergo. Ne conosci qualcuno dalle tue parti?"
    # merlin-1365_0100121-8
    - learner: "Ma, mi dispiace, non conosco un albergo particolare."
      errors: [preposition]
    - tutor: "Non importa! Ma attenzione: «un albergo particolare» vuol dire un albergo strano, speciale. Tu volevi dire un'altra cosa, giusto?"
      prompt: {text: "un albergo particolare", tags: [preposition]}
    - learner: "Sì: non conosco un albergo in particolare, mi dispiace."
    - tutor: "Ah, ecco! Non fa niente, cerco su internet. Grazie lo stesso!"

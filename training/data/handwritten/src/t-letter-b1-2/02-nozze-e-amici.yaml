# B1 real-learner letters (round 7): more wedding answers, news to old friends, a changed date.
# The tutor is the person the letter was written to; plural address to a couple is correct.
- scenario: compleanno
  level: B1
  persona: en-f-professional
  turns:
    - tutor: "Ciao! Hai letto la nostra lettera? Alla fine abbiamo deciso: ci sposiamo!"
    # merlin-1365_0100262-0
    - learner: "Sono contentissima che dopo questo periodo lungo, penso che sono almeno otto anni che state insieme, avete deciso di sposarvi."
    - tutor: "Otto anni e mezzo, per essere precisi! Stefano ci ha messo un po' a decidersi. Il matrimonio è il 20 novembre a Napoli."
      goals: [date]
    # merlin-1365_0100262-3
    - learner: "Allora ho prenotato il volo per Napoli subito."
    - tutor: "Già? Sei velocissima! E quando arrivi?"
    # merlin-1365_0100262-4
    - learner: "Arriverò il 19 novembre, così avrò tempo di prepararmi per la festa e di salutare i tuoi genitori che non ho visto per anni."
    - tutor: "Che bello, i miei saranno felicissimi di rivederti! Ti invitano a cena la sera del 19, con i miei zii."
      goals: [guests]
    # merlin-1365_0100262-7
    - learner: "Avete una lista di nozze o desiderate soldi per il vostro viaggio di nozze?"
    - tutor: "Ah ah, vuoi già sapere tutto? Dai, prova a indovinare!"
    # merlin-1365_0100262-8
    - learner: "Sono curiosa, lo so... Ditemi pure!"
    - tutor: "Va bene: niente lista, preferiamo un aiuto per il viaggio. Andiamo in Messico per due settimane!"
      goals: [gift]
    # merlin-1365_0100262-11
    - learner: "Vi abbraccio!"
    - tutor: "Ti abbracciamo anche noi, a presto!"

- scenario: compleanno
  level: B1
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Ciao! Sono Stefano, e c'è anche la mia ragazza qui con me. Hai letto la nostra lettera?"
    # merlin-1365_0100186-0
    - learner: "Caro Stefano, cara Beatrice, che bella novità!"
    - tutor: "Eh sì, finalmente! Dopo dieci anni insieme abbiamo deciso di fare il grande passo."
    # merlin-1365_0100186-2
    - learner: "Spero che stareste insieme tutta la vostra vita."
      errors: [future-form]
    - tutor: "Che dolce! Ma «stareste»: parli del nostro futuro, di una cosa che sarà. Quale tempo serve?"
      prompt: {text: "stareste", tags: [future-form]}
    - learner: "Spero che starete insieme tutta la vostra vita!"
    - tutor: "Grazie, è quello che speriamo anche noi! Ci sposiamo il 20 novembre a Santa Chiara, e poi pranzo da Ciro. Ci sarai?"
      goals: [date, food]
    # merlin-1365_0100186-5
    - learner: "Mi piace molto di festeggiare questo giorno speciale con voi."
      errors: [preposition]
    - tutor: "Che bello! Ma «mi piace molto di festeggiare»: pensa a «mi piace ballare». Che cosa cambia?"
      prompt: {text: "Mi piace molto di festeggiare", tags: [preposition]}
    - learner: "Mi piace molto festeggiare questo giorno speciale con voi."
    - tutor: "Perfetto! Allora ti mettiamo al tavolo con i ragazzi della palestra."
      goals: [guests]
    # merlin-1365_0100186-14
    - learner: "Ci vediamo!"
    - tutor: "Ci vediamo a Napoli! E niente regali, eh: basta che vieni tu."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Pronto? Ciao, sono Beatrice! Qui con me c'è anche Stefano."
    # merlin-1365_0100290-0
    - learner: "Cara Beatrice, caro Stefano, oggi ho ricevuto la vostra lettera."
    - tutor: "Che bello! Allora sai già tutto: il 20 novembre, a Santa Chiara."
      goals: [date]
    # merlin-1365_0100290-3
    - learner: "Beatrice, il tuo papà mi ha raccontato che sei incinta"
    - tutor: "Eh sì, papà non sa tenere un segreto! Nasce a marzo. E i tuoi come stanno?"
    # merlin-1365_0100290-5
    - learner: "Miei genitori vanno a Calabria e io non posso lasciare i piccoli da soli a casa."
      errors: [preposition, possessive]
    - tutor: "Ah, partono! Ma «vanno a Calabria»: pensa a «vanno in Toscana». Con la Calabria, che preposizione usiamo?"
      prompt: {text: "a Calabria", tags: [preposition]}
    - learner: "I miei genitori vanno in Calabria, sì."
    - tutor: "Esatto! Quindi quel fine settimana i bambini sono con te, giusto?"
    # merlin-1365_0100290-6
    - learner: "Adesso volevo chiedere se c'è un problema se vengono con noi alla cerimonia e dopo al ristorante Da Ciro."
    - tutor: "Ma nessun problema, anzi! Ci saranno altri sei bambini: prepariamo un tavolo solo per loro, con la pizza."
      goals: [guests, food]
    # merlin-1365_0100290-8
    - learner: "Per il regalo del matrimonio, avete bisogno di qualcosa speciale?"
      errors: [preposition]
    - tutor: "Che pensiero! Ma «qualcosa speciale»: tra «qualcosa» e un aggettivo, che preposizione mettiamo?"
      prompt: {text: "qualcosa speciale", tags: [preposition]}
    - learner: "Avete bisogno di qualcosa di speciale?"
    - tutor: "Esatto! Non ci serve niente, davvero: la casa è già piena. Al massimo un piccolo aiuto per il viaggio."
      goals: [gift]

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [possessive]
  turns:
    - tutor: "Ciao! Hai ricevuto la mia lettera? Era lunghissima, lo so!"
    # merlin-1395_0000366-0
    - learner: "Cara Anna, grazie della tua lunga lettera."
    - tutor: "Figurati, avevo tante cose da raccontarti! Ma tu come stai adesso? Ero preoccupata."
    # merlin-1395_0000366-2
    - learner: "Io adesso sto bene, mia malattia è passata e spero che non torna più."
      errors: [possessive]
    - tutor: "Che bella notizia! Ma «mia malattia»: con un nome singolare come «malattia», che cosa mettiamo davanti a «mia»?"
      prompt: {text: "mia malattia", tags: [possessive]}
    - learner: "La mia malattia è passata, per fortuna."
    - tutor: "Esatto, e sono proprio contenta! E il lavoro? Riesci a riposarti un po'?"
    # merlin-1395_0000366-4
    - learner: "Meno male che ho fatto già vacanze in quest'anno."
      errors: [article-use, preposition]
    - tutor: "Ah, sei già andata in vacanza! Ma «ho fatto già vacanze»: quale articolo ci vuole davanti a «vacanze»?"
      prompt: {text: "ho fatto già vacanze", tags: [article-use]}
    - learner: "Ho fatto già le vacanze quest'anno, in Sardegna: faceva caldissimo!"
    - tutor: "Esatto! In Sardegna, che bello! E cosa hai fatto, mare tutto il giorno?"
      goals: [where, weather]
    # merlin-1395_0000366-6
    - learner: "Ho fatto molte foto e forse nella prossima settimana te le mando."
    - tutor: "Sì, ti prego! Voglio vedere quel mare blu di cui mi parli sempre."
      goals: [activities]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [article-use]
  turns:
    - tutor: "Ciao! Che sorpresa! Come state tu ed Eva? È passato quasi un anno!"
    # merlin-1395_0000365-1
    - learner: "Vorremmo vederti al più presto, speriamo sia possibile fra qualche mese, quando avremo le vacanze, verso quindici agosto."
      errors: [article-use]
    - tutor: "Anch'io lo vorrei tanto! Ma «verso quindici agosto»: con le date, che cosa mettiamo davanti al numero?"
      prompt: {text: "verso quindici agosto", tags: [article-use]}
    - learner: "Sì, verso il quindici agosto."
    - tutor: "Esatto, Ferragosto insieme! E il lavoro? Lavorate ancora tutte e due in quel negozio vicino alla stazione?"
    # merlin-1395_0000365-4
    - learner: "Lavoriamo sempre in quella panetteria, poi sempre di notte, ogni giorno 10 ore."
    - tutor: "Dieci ore di notte? Ma è tantissimo! Non siete distrutte?"
      goals: [situation]
    # merlin-1395_0000365-6
    - learner: "Anche se siamo già abbastanza stanche, ci sentiamo bene."
    - tutor: "Meno male. E almeno il pomeriggio siete libere, no? Io in ufficio non vedo mai il sole!"
      goals: [pros]
    # merlin-1395_0000365-9
    - learner: "Ti salutiamo e mandiamo tantissimi baci."
    - tutor: "Tantissimi baci anche a voi due! Salutami Eva."
    # merlin-1395_0000365-10
    - learner: "A presto!"
    - tutor: "A presto, e ci sentiamo per agosto!"

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [object-pronoun]
  turns:
    - tutor: "Ciao! Raccontami tutto: come va la vita? È da Pasqua che non ci sentiamo!"
    # merlin-1395_0001061-2
    - learner: "Michele ha tanti clienti come sempre, e io ho dovuto organizzare l'esame finale per gli apprendisti."
    - tutor: "Michele lavora sempre troppo, lo so! E tu, l'esame finale? Che responsabilità!"
    # merlin-1395_0001061-3
    - learner: "In più, mia madre ha cambiato casa."
    - tutor: "Davvero? E dove è andata a vivere?"
    # merlin-1395_0001061-4
    - learner: "Lei è finalmente andata nella casa per gli anziani e noi le abbiamo aiutato."
      errors: [object-pronoun]
    - tutor: "Ah, finalmente! Ma «le abbiamo aiutato»: aiutiamo qualcuno o a qualcuno? Allora quale pronome serve?"
      prompt: {text: "le abbiamo aiutato", tags: [object-pronoun]}
    - learner: "L'abbiamo aiutata con tutte le scatole, io e Michele."
    - tutor: "Esatto! Siete stati bravi. E poi sei riuscita a fare quel corso di francese a Nizza?"
      goals: [where]
    # merlin-1395_0001061-6
    - learner: "La scuola era ben organizzata e l'insegnante era gentile."
    - tutor: "Che bello! E il tempo? A Nizza in primavera è già quasi estate."
      goals: [activities]
    - learner: "Sì, faceva caldo, ventidue gradi. Il fine settimana andavo sempre in spiaggia."
    - tutor: "Che fortuna! Allora, quando ci vediamo? Avevi detto luglio."
      goals: [weather]
    # merlin-1395_0001061-9
    - learner: "Spero che sia veramente il primo luglio!"
    - tutor: "Sì, il primo luglio arrivo da te con il treno, promesso!"
    # merlin-1395_0001061-10
    - learner: "Tanti cari saluti e alla prossima!"
    - tutor: "Alla prossima! Un abbraccio anche a tua madre."

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [possessive]
  turns:
    - tutor: "Pronto? Ciao, sono Silvia! Finalmente ti trovo!"
    # merlin-1395_0000357-0
    - learner: "Cara Silvia, come va?"
    - tutor: "Io bene, grazie! Hai ricevuto la mia lettera? Ero un po' preoccupata per te."
    # merlin-1395_0000357-1
    - learner: "Grazie mille per la tua ultima lettera!"
    - tutor: "Figurati! Allora, come stai davvero? Mi sembravi molto stanca."
    # merlin-1395_0000357-2
    - learner: "Io adesso sto meglio, ma hai ragione, probabilmente lavoro troppo e per questo sono stanchissima."
    - tutor: "Lo dicevo io! Lavori ancora in ufficio tutti i giorni, o qualche volta da casa?"
      goals: [situation]
    # merlin-1395_0000357-3
    - learner: "Abbiamo molte cose da fare e nostro capo è severo."
      errors: [possessive]
    - tutor: "Un capo severo, che pazienza! Ma «nostro capo»: con «capo» singolare, che cosa ci vuole davanti a «nostro»?"
      prompt: {text: "nostro capo", tags: [possessive]}
    - learner: "Il nostro capo è severo, ma è giusto."
    - tutor: "Esatto. Almeno è giusto, questo conta. Ma ci sono anche cose belle in questo lavoro?"
      goals: [cons]
    # merlin-1395_0000357-5
    - learner: "Sono un po' triste perché una settimana fa è morta mia zia Maria, la sorella di mia madre."
    - tutor: "Oh, mi dispiace tantissimo. Ti abbraccio forte. Se hai bisogno di qualcosa, chiamami quando vuoi."
    # merlin-1395_0000357-8
    - learner: "Ti bacio e saluto tutta la tua famiglia!"
    - tutor: "Grazie, li saluto io. Un bacio grande, e salutami tanto tua madre."

- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Ciao! Allora, giovedì pomeriggio festeggiamo il mio compleanno: vieni, vero?"
    # merlin-1385_0001193-0
    - learner: "Mi dispiace così molto ma non ho tempo giovedì pomeriggio perché il mio capo ha organizzato una riunione e devo lavorare."
      errors: [word-choice]
    - tutor: "Ti dispiace così tanto? Non preoccuparti, il lavoro è lavoro. Allora cambiamo giorno!"
      recast: {text: "così molto", fix: "così tanto", tags: [word-choice]}
    # merlin-1385_0001193-1
    - learner: "Hai tempo a sabato sera?"
      errors: [preposition]
    - tutor: "Sabato? Aspetta, «a sabato sera»: ripeti la domanda e guarda bene la parola prima di «sabato»."
      prompt: {text: "a sabato sera", tags: [preposition]}
    - learner: "Hai tempo sabato sera?"
    - tutor: "Sì, sabato sera sono libero! Allora festeggiamo sabato. Hai un'idea per la cena?"
      goals: [date]
    # merlin-1385_0001193-2
    - learner: "Potremmo andare a mangiare in un ristorante tailandese insieme."
    - tutor: "Ottima idea, adoro la cucina tailandese! Chiamo il ristorante e ti faccio sapere se hanno un tavolo."
      goals: [food]
    # merlin-1385_0001193-4
    - learner: "Mi scrivi subito per favore."
    - tutor: "Certo, ti mando un messaggio appena prenoto. Viene anche Giulia, la mia vicina di casa."
      goals: [guests]
    # merlin-1385_0001193-5
    - learner: "Tanti saluti e spero che ci vediamo!"
    - tutor: "Ci vediamo sabato, sicuro! E niente regali, eh!"
      goals: [gift]

# B1 real-learner letters (round 7): friends' news, advice about chats, cooking evenings, courses.
# The tutor is the person the letter was written to and simply carries on when the learner is right.
- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [subject-verb-agreement]
  turns:
    - tutor: "Ciao! Finalmente ti sento! Hai ricevuto la mia lettera sull'esame?"
    # merlin-1365_0100227-0
    - learner: "Mi ho fatto piacere di sentirti."
      errors: [subject-verb-agreement]
    - tutor: "Che carina! Ma «mi ho fatto piacere»: chi fa piacere? La notizia, non tu. Allora quale forma di «avere» ci vuole?"
      prompt: {text: "Mi ho fatto piacere", tags: [subject-verb-agreement]}
    - learner: "Mi ha fatto piacere sentirti!"
    - tutor: "Esatto! Anche a me. Sai che alla fine ho preso il massimo dei voti?"
    # merlin-1365_0100227-2
    - learner: "Complimenti per il tuo esame col risultato straordinario."
    - tutor: "Grazie! Cento su cento, non ci credevo neanche io."
    # merlin-1365_0100227-10
    - learner: "Sei così bravo!"
    - tutor: "Esagerata! E tu? Lavorate sempre tanto in ufficio?"
    # merlin-1365_0100227-7
    - learner: "Però il nostro capo ci ha promesso di andare al ristorante alla fine del mese."
    - tutor: "Una cena con tutta la squadra? Che bello!"
      goals: [situation, pros]
    # merlin-1365_0100227-8
    - learner: "Che ne pensi? È gentile?"
    - tutor: "Sì, è un bel gesto! Spero di trovare anch'io un capo così, quando comincio a lavorare."
    # merlin-1365_0100227-16
    - learner: "Ancora delle felicitazioni per l'esame."
    - tutor: "Grazie ancora! Ci sentiamo presto, e raccontami della cena."

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [article-use, preposition]
  turns:
    - tutor: "Ciao! Hai saputo? Ho superato la maturità con il massimo dei voti!"
      new: [{lemma: maturità, gloss: school-leaving exam}]
    # merlin-1365_0100263-0
    - learner: "Sono tanto contento del tuo successo!"
    - tutor: "Grazie! E tu? Mi hanno detto che hai finito l'università e che vuoi studiare ancora, in un altro paese. Dove?"
    # merlin-1365_0100263-5
    - learner: "Danimarca mi sembra un paese in cui potrei farlo."
      errors: [article-use]
    - tutor: "Davvero, al nord? Ma «Danimarca mi sembra»: con i nomi dei paesi, all'inizio della frase, che cosa mettiamo davanti?"
      prompt: {text: "Danimarca mi sembra", tags: [article-use]}
    - learner: "La Danimarca mi sembra un paese perfetto per farlo."
    - tutor: "Esatto! Che coraggio. Io invece non so cosa fare: lavorare subito o no?"
    # merlin-1365_0100263-6
    - learner: "Ma a te suggerirei di andare per un po' di tempo a vacanza, prima di cominciare a lavorare."
      errors: [preposition]
    - tutor: "Mi piace l'idea! Ma «andare a vacanza»: pensa a «andare in montagna». E con «vacanza»?"
      prompt: {text: "a vacanza", tags: [preposition]}
    - learner: "Ti suggerirei di andare un po' in vacanza, prima di lavorare."
    - tutor: "Esatto! Hai ragione: un mese al mare e poi cerco lavoro."
      goals: [preference]
    # merlin-1365_0100263-10
    - learner: "Tanti saluti!"
    - tutor: "Tanti saluti a te, e in bocca al lupo per la Danimarca!"

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
    - tutor: "Ciao! Sono Giorgio. Hai letto la mia lettera? Non so più cosa fare con le amicizie su internet."
    # merlin-1325_1001059-0
    - learner: "Ho letto la tua lettera sul giornale Settimana Giovani."
    - tutor: "Sì, ho mandato la lettera al giornale perché mi sentivo solo. Passo ore davanti al computer."
      goals: [situation]
    # merlin-1325_1001059-1
    - learner: "Vorrei darti consiglio perché questa problema è famigliare anche per me."
      errors: [noun-gender, article-use]
    - tutor: "Davvero? Allora mi capisci! Ma «questa problema»: attenzione, «problema» finisce in -a, ma è maschile o femminile?"
      prompt: {text: "questa problema", tags: [noun-gender]}
    - learner: "Vorrei darti un consiglio, perché questo problema è familiare anche per me."
    - tutor: "Esatto! Allora dimmi: anche tu passavi tanto tempo a scrivere su internet?"
    # merlin-1325_1001059-3
    - learner: "Ma nessun chat partner era o diventava un'amica vera."
    - tutor: "È proprio quello che succede a me. Parlo con tante persone, ma nessuno diventa un vero amico. E alcuni mi scrivono ogni giorno."
      goals: [cons]
    # merlin-1325_1001059-10
    - learner: "Puoi anche cancellare il tuo profilo: è una cura più dura."
    - tutor: "Cancellare tutto? È una decisione difficile, ma forse hai ragione."
    # merlin-1325_1001059-16
    - learner: "Divertiti con i tuoi amici veri."
    - tutor: "Hai ragione. Questo fine settimana esco con i ragazzi della squadra di calcio, promesso."
      goals: [preference]
    # merlin-1325_1001059-17
    - learner: "Buona fortuna!"
    - tutor: "Grazie, ne ho bisogno! E grazie per i consigli."

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-student
  history: [articulated-preposition, ce-ci-sono]
  turns:
    - tutor: "Pronto, buonasera! Qui le serate di cucina dal mondo. Mi dica pure!"
    # merlin-1325_1001096-1
    - learner: "Studio italiano al liceo da 5 anni."
    - tutor: "Cinque anni, allora capirà bene i nostri cuochi! Abbiamo due gruppi: uno a giugno e uno a luglio. Quale preferisce?"
    # merlin-1325_1001096-8
    - learner: "Così posso andare nel secondo ciclo, cioè nel mese di luglio."
    - tutor: "Perfetto, la segno per luglio. Ha qualche problema con il cibo?"
      goals: [book]
    # merlin-1325_1001096-5
    - learner: "Purtroppo ho allergia sul pesce, per questo non posso mangiare cibi di pesce."
      errors: [articulated-preposition, article-use]
    - tutor: "Grazie di avvisarmi, è importante! Ma «allergia sul pesce»: con «allergia», quale preposizione usiamo per dire a che cosa?"
      prompt: {text: "allergia sul pesce", tags: [articulated-preposition]}
    - learner: "Purtroppo ho l'allergia al pesce."
    - tutor: "Esatto. Nessun problema, lo scrivo: per lei niente pesce."
      goals: [special]
    # merlin-1325_1001096-10
    - learner: "Mi piace se c'è cuochi, che aiutano."
      errors: [ce-ci-sono]
    - tutor: "Certo! Ma «se c'è cuochi»: «cuochi» è plurale. Allora come cambia «c'è»?"
      prompt: {text: "c'è cuochi", tags: [ce-ci-sono]}
    - learner: "Mi piace se ci sono cuochi che aiutano."
    - tutor: "Esatto! E ogni sera ci sono due cuochi che aiutano tutti."
      goals: [details]
    # merlin-1325_1001096-14
    - learner: "C'è un alloggio?"
    - tutor: "Sì, abbiamo alcune camere in un piccolo albergo qui vicino. Mi lascia il suo nome per la prenotazione?"

- scenario: prenotare-tavolo
  level: B1
  persona: es-f-teacher
  history: [noun-number]
  turns:
    - tutor: "Buongiorno, qui le serate di cucina dal mondo. Come posso aiutarla?"
    # merlin-1325_1001083-13
    - learner: "Vorrei chiedere informazioni!"
    - tutor: "Certo, con piacere! Le piace cucinare?"
    # merlin-1325_1001083-0
    - learner: "Mi piace cucinare molto!"
    - tutor: "Benissimo! E di solito cucina spesso a casa?"
    # merlin-1325_1001083-2
    - learner: "Io non ho molto tempo libero, ma i piatti secondo la mia opinione sono molto importanti per una famiglia."
    - tutor: "Sono d'accordo, mangiare insieme è importante. Le nostre serate sono il venerdì e il sabato."
      goals: [details]
    # merlin-1325_1001083-3
    - learner: "Quanto costa questa serate?"
      errors: [noun-number]
    - tutor: "Bella domanda! Ma «questa serate»: «questa» è singolare e «serate» è plurale. Ne vuole dire una o tante?"
      prompt: {text: "questa serate", tags: [noun-number]}
    - learner: "Una. Quanto costa questa serata?"
    - tutor: "Esatto! Trenta euro, cena compresa. Che cosa preferisce cucinare: carne, pesce o verdure?"
      goals: [book]
    # merlin-1325_1001083-8
    - learner: "Io preferisco la gallina."
    - tutor: "La gallina? Ottimo, sabato prossimo cuciniamo proprio la gallina, con una ricetta della nonna!"
      goals: [special]
    # merlin-1325_1001083-11
    - learner: "Se il prezzo è ideale per me, io vorrei presentarmi!"
    - tutor: "Allora la aspettiamo sabato! Mi dice il suo nome per la prenotazione?"

- scenario: cucina-ricetta
  level: B1
  persona: es-m-worker
  history: [verb-form]
  turns:
    - tutor: "Ciao! Quanto tempo! Sai che faccio un corso di cucina? Una sera a settimana!"
    # merlin-1365_0100299-0
    - learner: "Sono felice di aver ricevuto un segno di vita!"
    - tutor: "Hai ragione, scusa, non ti scrivo da mesi! Il corso mi prende tanto tempo, ma è bellissimo."
    # merlin-1365_0100299-1
    - learner: "Che buona idea di imparare a cucinare."
    - tutor: "Vero? Finalmente non mangio solo pasta al pomodoro!"
    # merlin-1365_0100299-2
    - learner: "Saper cucinare è sempre utile... Quante volte avranno luogo queste serate?"
    - tutor: "Ogni giovedì, fino a dicembre. Siamo in dodici."
    # merlin-1365_0100299-3
    - learner: "Ci sono molte persone interessante?"
      errors: [word-choice]
    - tutor: "Sì, tutte persone interessate e gentili! Cuciniamo piatti di tanti paesi. E tu, cosa cucini di buono?"
      recast: {text: "persone interessante", fix: "persone interessate", tags: [word-choice]}
    # merlin-1365_0100299-6
    - learner: "Hai mai fatto un curry verde con gamberoni?"
    - tutor: "No, mai! Mi spieghi come si fa?"
    # merlin-1365_0100299-7
    - learner: "Te lo suggero da fare."
      errors: [verb-form]
    - tutor: "Certo! Ma «te lo suggero»: il verbo è «suggerire», come «finire». Come diventa con «io»?"
      prompt: {text: "suggero", tags: [verb-form]}
    - learner: "Te lo suggerisco! Serve latte di cocco, pasta di curry verde e gamberoni."
    - tutor: "Esatto! Sembra facile. Allora sabato lo cuciniamo insieme da me?"
      goals: [ingredients]
      new: [{lemma: cocco, gloss: coconut}]

- scenario: affittare-appartamento
  level: B1
  persona: en-m-retired
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, scuola di lingua, ufficio per le camere degli studenti. Come posso esserle utile?"
    # merlin-1365_0100147-0
    - learner: "Ho bisogno di apprendere l'italiano per il mio lavoro."
    - tutor: "Benissimo, allora è nel posto giusto! Quale corso le interessa?"
    # merlin-1365_0100147-1
    - learner: "Mi piacerebbe frequentare il corso estivi, scuola e mare, tutto insieme."
      errors: [adjective-agreement]
    - tutor: "Ottima scelta! Ma «il corso estivi»: «corso» è singolare. Allora l'aggettivo come diventa?"
      prompt: {text: "il corso estivi", tags: [adjective-agreement]}
    - learner: "Sì, il corso estivi a luglio."
      errors: [adjective-agreement]
    - tutor: "Il corso estivo di luglio, perfetto: lezioni la mattina e spiaggia il pomeriggio! E per dormire, che cosa cerca?"
      recast: {text: "il corso estivi", fix: "il corso estivo", tags: [adjective-agreement]}
      new: [{lemma: estivo, gloss: summer (adj.)}]
    # merlin-1365_0100147-2
    - learner: "Io desidero la soluzione di 4 settimane con un alloggio appropriato: una camera singole in pensione se è possibile, con una piccola cucina e un bagno."
      errors: [adjective-agreement]
    - tutor: "Capisco. Ma «una camera singole»: «camera» è una sola. Come diventa «singole»?"
      prompt: {text: "una camera singole", tags: [adjective-agreement]}
    - learner: "Una camera singola, con cucina e bagno."
    - tutor: "Esatto! Ne abbiamo una in una pensione vicino alla scuola, a cinque minuti a piedi dal mare."
      goals: [condition, neighbourhood]
    # merlin-1365_0100147-3
    - learner: "Vi prego di comunicarmi i prezzi dell'alloggio e del corso, e la modalità di pagamento."
    - tutor: "Certo: la camera costa quattrocento euro al mese, il corso seicento. Può pagare con la carta, anche dopo l'arrivo."
      goals: [rent, contract]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, si accomodi. Lei ha risposto al mio avviso per la ricerca sulle lingue, giusto?"
    # merlin-1325_1001122-1
    - learner: "L'ultima settimana ho letto il Suo avviso nella bacheca della mia scuola di lingua."
    - tutor: "Benissimo, grazie di essere venuto. Conosce già il mio lavoro all'università?"
      goals: [intro]
    # merlin-1325_1001122-2
    - learner: "Le sue lezioni sono interessanti."
    - tutor: "Grazie, è gentile. Mi parli un po' di lei: lei studia l'italiano anche d'estate, vero?"
    # merlin-1325_1001122-4
    - learner: "Questo è molto utile perché non dimentico la grammatica neanche durante la vacanza."
    - tutor: "Ha ragione, è il segreto. E il suo gruppo si vede anche fuori dalla scuola?"
      goals: [experience]
    # merlin-1325_1001122-5
    - learner: "Ogni anno festeggiamo il Natale anche con il gruppo di lingua italiano."
      errors: [adjective-agreement]
    - tutor: "Che bella tradizione! Ma «lingua italiano»: «lingua» è femminile. Che cosa cambia?"
      prompt: {text: "lingua italiano", tags: [adjective-agreement]}
    - learner: "Con il gruppo di lingua italiana, sì."
    - tutor: "Esatto. Con questa ricerca vogliamo capire come imparano gli adulti e migliorare i corsi."
      goals: [why]
    # merlin-1325_1001122-7
    - learner: "Spero che riesca."
    - tutor: "Lo spero anch'io! Le mando le domande per posta la settimana prossima."
    # merlin-1325_1001122-9
    - learner: "Distinti saluti."
    - tutor: "Arrivederci, e grazie ancora per il suo tempo."

# Round 5b, set v-c2. File 3: in-laws, condolences, weddings and Sunday lunches.
- scenario: cena-suoceri
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "La ringrazio, è un piacere conoscerla finalmente. E Le assicuro che sono in carne e ossa, anche se con questo profumo di ragù rischio di svenire."
    - tutor: "Ah, il ragù è di mia moglie: sei ore sul fuoco, e guai a chi lo chiama sugo. Lo assaggi e mi dica."
    - learner: "Signora, è squisito. Se non è un segreto di famiglia, mi darebbe la ricetta? Vorrei provarla per mia madre, ma non gli dirò che è migliore della sua."
      errors: [object-pronoun]
      gold: {text: "non gli dirò", fix: "non le dirò"}
    - tutor: "Mia moglie è arrossita: ha fatto centro. Ma «non gli dirò», parlando di Sua madre? Quel pronome, di solito, per chi sta?"
      goals: [compliment]
      prompt: {text: "non gli dirò", tags: [object-pronoun]}
    - learner: "Ha ragione, si tratta di mia madre: non le dirò che è migliore della sua, per amor di pace in famiglia."
    - tutor: "Saggia diplomazia. E di lavoro, invece, che cosa fa? Mia figlia è stata piuttosto vaga."
    - learner: "Faccio il restauratore di strumenti antichi, soprattutto violini. Non si diventa ricchi, glielo concedo, ma l'anno prossimo apro un laboratorio con un socio e abbiamo già commesse fino a giugno."
    - tutor: "Violini! Allora, quando mia figlia dice che Lei ha le mani d'oro, non esagera. Speriamo almeno che i violini rendano più della poesia."
      goals: [background]
    - learner: "Più della poesia di sicuro, meno dell'ingegneria: per questo ho ancora bisogno che Sua figlia mi presta la macchina, ogni tanto."
      errors: [subjunctive-use]
      gold: {text: "mi presta", fix: "mi presti"}
    - tutor: "Ecco svelato il mistero dell'auto sempre sparita! Ma «ho bisogno che Sua figlia mi presta»: dopo «ho bisogno che», il verbo come lo metterebbe?"
      goals: [irony]
      prompt: {text: "mi presta", tags: [subjunctive-use]}
    - learner: "Che mi presta, allora... La uso solo per consegnare i violini, glielo giuro."
      errors: [subjunctive-use]
    - tutor: "Basta che qualcuno mi presti la sua, ogni tanto, e io perdono tutto: la mia è dal meccanico da un mese! Senta, a questo punto il Lei mi sembra ridicolo. Io sono Franco: diamoci del tu."
      recast: {text: "mi presta", fix: "mi presti", tags: [subjunctive-use]}
    - learner: "Volentieri, Franco, grazie. Allora te lo dico in confidenza: il ragù di tua moglie batte anche quello di mia nonna."
    - tutor: "Questo glielo riferisco subito: ti sei appena guadagnato la seconda porzione!"
      goals: [tu-lei]

- scenario: condoglianze
  level: C2
  persona: en-f-professional
  history: [imperative-form]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe, sono venuta appena l'ho saputo. Le porgo tutta la mia simpatia, a nome mio e di tutto l'ufficio."
      errors: [false-friend]
    - tutor: "Grazie, la vicinanza dell'ufficio mi fa davvero bene in questi giorni. Mia madre era così fiera che lavorassi con voi."
      goals: [condolences]
      recast: {text: "simpatia", fix: "vicinanza", tags: [false-friend]}
    - learner: "Me lo ricordo: alla festa di Natale di due anni fa ci aveva portato quelle sfogliatelle fatte in casa, e aveva raccontato a tutti di quando Lei, da piccolo, si era perso al mercato."
    - tutor: "Le sfogliatelle! Ne faceva sempre il doppio, «perché in ufficio siete in tanti». Che bel ricordo mi ha riportato."
      goals: [memory]
    - learner: "Era una donna generosa, si vedeva subito. Senta, per il lavoro non si preoccupi: i Suoi clienti li seguo io finché sarà necessario, e se ha bisogno di qualcosa, mi chiama pure a qualsiasi ora."
      errors: [imperative-form]
      gold: {text: "mi chiama pure", fix: "mi chiami pure"}
    - tutor: "Grazie, è un pensiero prezioso. Solo una cosa, visto che al Suo italiano ci tiene tanto: «mi chiama pure» è un invito o una constatazione?"
      goals: [offer-help]
      prompt: {text: "mi chiama pure", tags: [imperative-form]}
    - learner: "Un invito, quindi: mi chiami pure, a qualsiasi ora. Dico sul serio."
    - tutor: "Lo so, e lo terrò a mente. Già sapere che i clienti sono in buone mani mi toglie un peso."
    - learner: "Allora non La trattengo oltre, avrà bisogno di riposare. Torno a trovarla la settimana prossima, se Le fa piacere, e intanto si riguardi."
    - tutor: "Mi farà molto piacere. Grazie ancora di essere passata, davvero."
      goals: [leave]

- scenario: organizzare-matrimonio
  level: C2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo semplice ma curato: un rito civile in un agriturismo in collina, una sessantina di invitati e una lunga tavolata all'aperto, senza troppe formalità."
    - tutor: "Che bella idea. E l'atmosfera: rustica, elegante, a metà strada?"
      goals: [vision]
    - learner: "A metà strada, direi. Ci piacerebbe che anche la cena sia all'aperto, sotto un pergolato, magari con delle lucine appese."
      errors: [subjunctive-use]
      gold: {text: "sia all'aperto", fix: "fosse all'aperto"}
    - tutor: "Il pergolato con le lucine non delude mai. Ma «ci piacerebbe che sia»: dopo un condizionale, quale congiuntivo ci vuole?"
      prompt: {text: "sia all'aperto", tags: [subjunctive-use]}
    - learner: "Fosse, giusto: ci piacerebbe che anche la cena fosse all'aperto. Quanto al budget, contiamo con trentamila euro, tutto compreso."
      errors: [preposition]
      gold: {text: "contiamo con", fix: "contiamo su"}
    - tutor: "Esatto. E sul budget: «contiamo con trentamila euro»? In questo senso, il verbo «contare» regge un'altra preposizione."
      prompt: {text: "contiamo con", tags: [preposition]}
    - learner: "Contiamo su trentamila euro, scusi: in spagnolo si usa «con» e mi confondo sempre."
    - tutor: "Capita spesso. Con trentamila euro e sessanta invitati si sta bene, a patto di non esagerare con i fiori. Per il menù preferite pesce o carne?"
      goals: [budget]
    - learner: "Carne, sicuramente: la famiglia della mia fidanzata è di Arezzo, e senza la fiorentina non verrebbe nessuno. Per la musica, invece, pensavamo a un quartetto d'archi durante l'aperitivo."
    - tutor: "Ottime scelte, e molto coerenti. Vi mando i preventivi di tre agriturismi entro venerdì."
      goals: [choices]
    - learner: "Perfetto. Ci li può mandare anche in copia alla mia fidanzata? È molto più organizzata di me."
      errors: [combined-pronouns]
      gold: {text: "Ci li", fix: "Ce li"}
    - tutor: "Volentieri. Ma «ci li può mandare»: quando due pronomi si incontrano, il primo cambia forma. Come diventa?"
      prompt: {text: "Ci li", tags: [combined-pronouns]}
    - learner: "Ce li può mandare, certo. E per l'acconto, quanto dobbiamo versare alla firma?"
    - tutor: "Il trenta per cento alla firma del contratto e il saldo una settimana prima delle nozze; se annullate con sei mesi di anticipo, vi restituiamo metà dell'acconto."
      goals: [conditions]

- scenario: pranzo-domenicale
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Ciao a tutti! Se c'è da lottare per la lasagna, sono pronta: ho saltato la colazione apposta."
    - tutor: "Brava, così si fa: a pancia vuota si combatte meglio! Tieni, prendine un pezzo prima che sparisca."
      goals: [react]
    - learner: "Grazie! Mmm, è buonissima. Ma è vero che la nonna non dà la ricetta a nessuno? Spero che prima o poi la sveli a qualcuno... tocco legno!"
      errors: [word-choice]
    - tutor: "Tocco ferro anch'io, ma non farti illusioni: la nonna quella ricetta se la porta nella tomba!"
      recast: {text: "tocco legno", fix: "tocco ferro", tags: [word-choice]}
    - learner: "Che peccato! Comunque, rispetto alla lasagna di mia zia in Inghilterra, questa è un altro pianeta: lì ci mettono il cheddar e la pasta è sempre troppo morbida."
      errors: [word-choice]
    - tutor: "Il cheddar e pure la pasta troppo scotta?! Mi si gela il sangue. Ma lassù ne hai mai mangiata una decente?"
      goals: [compare]
      recast: {text: "troppo morbida", fix: "troppo scotta", tags: [word-choice]}
    - learner: "Mai una, giuro. Per questo l'anno scorso sono andata a Bologna a fare un corso di sfoglia. Tu sei mai andato?"
      errors: [ci-ne]
      gold: {text: "Tu sei mai andato", fix: "Tu ci sei mai andato"}
    - tutor: "Un corso di sfoglia, che eroina! Ma «tu sei mai andato?»: andato dove? Manca un pezzettino che riprenda Bologna."
      prompt: {text: "Tu sei mai andato", tags: [ci-ne]}
    - learner: "Ah, giusto: tu ci sei mai andato? Io ci ho passato una settimana e sono tornata con due chili in più."
    - tutor: "Ci vado ogni anno per la fiera, e torno sempre rotolando! E com'è andata con la sfoglia?"
    - learner: "Un disastro, all'inizio: la mia sfoglia era così spessa che la maestra diceva che ci si potevano risuolare le scarpe. Ma l'ultimo giorno era quasi perfetta. Insomma, chi la dura la vince!"
    - tutor: "Chi la dura la vince, brava, detto come una vera emiliana! Adesso però la prossima lasagna la porti tu: è deciso."
      goals: [use-idiom, anecdote]

- scenario: cena-suoceri
  level: C2
  persona: es-f-erasmus
  history: [register]
  turns:
    - tutor: "Prego, si accomodi pure. Nostro figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio inventato."
    - learner: "Grazie, sei molto gentile. Le assicuro che esisto davvero, e sono anche un po' emozionata."
      errors: [register]
      gold: {text: "sei molto gentile", fix: "è molto gentile"}
    - tutor: "Emozionata, addirittura? Noto però un piccolo sbandamento: prima «sei molto gentile», poi «Le assicuro». Allora, con me, per ora che forma usiamo?"
      prompt: {text: "sei molto gentile", tags: [register]}
    - learner: "Il Lei, naturalmente, mi scusi: è molto gentile. E questo profumo... è un brasato? Non ne sentivo uno così da quando ho lasciato la Spagna."
    - tutor: "Brasato al Barolo, ricetta di mia suocera. Se lo dice a mia moglie, si guadagna la sua stima per sempre."
      goals: [compliment]
    - learner: "Allora glielo dirò di sicuro, è tenerissimo! Mia famiglia è di Burgos, e da noi l'arrosto della domenica è sacro come qui."
      errors: [possessive]
      gold: {text: "Mia famiglia", fix: "La mia famiglia"}
    - tutor: "Ecco qualcosa in comune. Ma «mia famiglia è di Burgos»: con «famiglia» al singolare, non manca qualcosa davanti al possessivo?"
      prompt: {text: "Mia famiglia", tags: [possessive]}
    - learner: "La mia famiglia, sì. Comunque io vivo in Italia da sei anni: faccio la ricercatrice al Policlinico e studio le malattie rare dell'infanzia."
    - tutor: "Una ricercatrice! Speriamo che almeno Lei riesca a spiegare a nostro figlio che cosa sia una dieta equilibrata."
      goals: [background]
    - learner: "Ci provo da due anni, ma temo che neanche la scienza basti contro le patatine fritte. Lei però dovrebbe saperlo meglio di me, visto che l'ha criato."
      errors: [word-choice]
    - tutor: "Colpito e affondato: l'ha cresciuto soprattutto mia moglie, ma il vizio delle patatine è colpa mia! Senta, mi pare l'ora di lasciar perdere il Lei: io sono Carlo, diamoci del tu."
      goals: [irony]
      recast: {text: "l'ha criato", fix: "l'ha cresciuto", tags: [word-choice]}
    - learner: "Con piacere, Carlo. E allora, visto che siamo in confidenza, mi passeresti ancora un po' di brasato?"
    - tutor: "Te lo passo volentieri: chi apprezza il brasato di casa nostra è già di famiglia!"
      goals: [tu-lei]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Si figuri, era il minimo. Ho saputo solo ieri che Suo padre è passato via: mi dispiace davvero moltissimo."
      errors: [word-choice]
    - tutor: "Grazie. Sì, è scomparso venerdì notte, nel sonno. Ce lo aspettavamo, ma non si è mai pronti."
      goals: [condolences]
      recast: {text: "è passato via", fix: "è scomparso", tags: [word-choice]}
    - learner: "No, non si è mai pronti, anche se la malattia era lunga. Me lo ricordo bene alla cena per i Suoi vent'anni in azienda: raccontò a tutti di quando Lei, da ragazzo, voleva fare il pilota."
    - tutor: "Il pilota, già! Lo raccontava a chiunque. Mi fa piacere che se lo ricordi."
      goals: [memory]
    - learner: "Era un uomo di spirito. Senta, so che in questi giorni avrà mille cose da sbrigare: se vuole, le pratiche di successione le seguo io. Me ne sono occupato per mia madre due anni fa."
    - tutor: "Lei è molto gentile, ma non vorrei approfittarne."
    - learner: "Nessun disturbo, davvero. Malgrado il periodo è pieno di scadenze, il pomeriggio sono libero."
      errors: [subjunctive-use]
      gold: {text: "Malgrado il periodo è pieno", fix: "Malgrado il periodo sia pieno"}
    - tutor: "Grazie di cuore. E mi lasci fare il pignolo, come sempre: «malgrado il periodo è pieno»... con «malgrado», Lei che modo userebbe?"
      goals: [offer-help]
      prompt: {text: "Malgrado il periodo è pieno", tags: [subjunctive-use]}
    - learner: "Il congiuntivo, ha ragione: malgrado il periodo sia pieno di scadenze. Vedo che non ha perso lo spirito, ed è una buona notizia."
    - tutor: "È lui che me l'ha insegnato: sorridere sempre, anche nei giorni grigi."
    - learner: "Allora La lascio riposare. Mi chiami lunedì per le pratiche, e mi saluti tanto Sua madre."
    - tutor: "Lo farò. Grazie ancora di essere venuto: ha significato molto per me."
      goals: [leave]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-m-heritage
  history: [conditional-form]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie mille. Io sono italoamericano e la mia fidanzata è di Lecce, quindi immaginiamo un matrimonio in masseria, con le due famiglie che finalmente si conoscono."
    - tutor: "Due famiglie, due continenti: una bella sfida! In masseria, a giugno, è un sogno. Che atmosfera vorreste?"
      goals: [vision]
    - learner: "Elegante ma non ingessata. Preferiremo evitare il classico pranzo di sette ore: un aperitivo lungo e poi una cena a buffet, così la gente si muove e balla."
      errors: [conditional-form]
      gold: {text: "Preferiremo", fix: "Preferiremmo"}
    - tutor: "Una formula sempre più richiesta. Ma ascolti come l'ha detto: «preferiremo». È un futuro o un desiderio?"
      prompt: {text: "Preferiremo", tags: [conditional-form]}
    - learner: "Un desiderio: preferiremmo, con due emme. Il budget è di quarantamila euro, ma i miei parenti americani arrivano in cinquanta."
    - tutor: "Cinquanta dall'America più gli invitati di qui... con quarantamila si fa, ma bisogna scegliere bene dove spendere."
      goals: [budget]
    - learner: "Per noi la priorità è la musica: vorremmo una band dal vivo, con la pizzica a fine serata. E la masseria ci chiede la confermazione della data entro dicembre."
      errors: [word-choice]
    - tutor: "La pizzica la ballano anche gli americani, vedrà! Quanto alla conferma della data, nessun problema: la blocchiamo con un piccolo anticipo."
      goals: [choices]
      recast: {text: "la confermazione", fix: "la conferma", tags: [word-choice]}
    - learner: "Perfetto. E se per qualche motivo dovessimo spostare la data, perderemmo l'anticipo?"
    - tutor: "Solo se lo spostamento avviene a meno di quattro mesi dalle nozze; prima, l'anticipo resta valido per un'altra data dell'anno. Lo mettiamo per iscritto nel contratto."
      goals: [conditions]

- scenario: pranzo-domenicale
  level: C2
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Eccomi! Ho fatto le scale di corsa, ma vedo che della lasagna è rimasto ben poco."
    - tutor: "Te ne abbiamo tenuto un pezzo, tranquillo, ma solo perché la zia ti adora. Quanti piatti di pasta riesci a mangiare, di solito, a un pranzo così?"
      goals: [react]
    - learner: "Di solito? Mangio due, poi mi arrendo e passo direttamente al dolce."
      errors: [ci-ne]
      gold: {text: "Mangio due", fix: "Ne mangio due"}
    - tutor: "Solo? Ma attenzione: «mangio due» che cosa? Ti manca la parolina che riprende i piatti."
      prompt: {text: "Mangio due", tags: [ci-ne]}
    - learner: "Ne mangio due, giusto. Ma oggi farò un'eccezione, anche perché a casa mia, in Andalusia, la domenica si mangia molto più leggero."
    - tutor: "Più leggero, dici? E la paella, scusa, dove la metti? A me non sembra proprio un piatto da dieta."
    - learner: "La paella è un piatto unico, appunto: un piatto e via. Qui invece dopo il primo arriva il secondo, poi il contorno, poi la frutta... è un pranzo a puntate, come le telenovele!"
    - tutor: "Un pranzo a puntate: questa me la rubo! E tu, l'hai mai combinata grossa a un pranzo di famiglia?"
      goals: [compare]
    - learner: "Eccome. Alla prima cena con i genitori della mia ragazza ho messo la zampa: ho detto che la carbonara con la panna mi piaceva di più."
      errors: [word-choice]
    - tutor: "Hai fatto una gaffe colossale! La panna nella carbonara, davanti a una famiglia romana? Sei sopravvissuto per miracolo."
      recast: {text: "messo la zampa", fix: "fatto una gaffe", tags: [word-choice]}
    - learner: "Per miracolo, sì. Da allora conto fino a dieci prima di parlare: meglio tacere e sembrare sciocchi che parlare e togliere ogni dubbio, no?"
    - tutor: "Parole sante, anche se qui da noi si dice pure che chi tace acconsente! Dai, mangia, che la lasagna si raffredda."
      goals: [use-idiom, anecdote]

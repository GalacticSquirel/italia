# Round 5b, set v-c2: C2 near-native slips (register, collocations, connectives, concessive
# congiuntivo, false friends, nominalisation, fixed prepositions) beside correct sophisticated
# turns left alone. File 1: offices, complaints and formal letters.
- scenario: email-rettore
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il mio contratto di ricerca scade a marzo, ma il laboratorio in cui lavoro è rimasto chiuso per quattro mesi a causa dei lavori. Vorrei chiedere una proroga di almeno un semestre."
    - tutor: "Una richiesta più che legittima, e i lavori sono documentati. Come pensa di aprire la lettera?"
      goals: [situation]
    - learner: "Pensavo di cominciare con «Magnifico Rettore», come mi hanno consigliato i colleghi, e poi di spiegare subito tutto il casino che è successo con i lavori."
      errors: [register]
      gold: {text: "tutto il casino", fix: "tutti i disagi"}
    - tutor: "L'apertura è impeccabile, complimenti. Ma rilegga mentalmente «tutto il casino che è successo»: Le sembra un'espressione da lettera al Rettore?"
      goals: [opening-formula]
      prompt: {text: "tutto il casino", tags: [register]}
    - learner: "No, per carità! Direi piuttosto: «e poi di illustrare i gravi disagi causati dai lavori di ristrutturazione»."
    - tutor: "Ecco, così va benissimo. Quanto al tono, eviterei di dare l'impressione di lamentarsi dell'ateneo: come imposterebbe la richiesta vera e propria?"
    - learner: "Insisterei sui risultati già ottenuti, sebbene il progetto sia in ritardo, e presenterei la proroga come un'occasione per portarlo a fine, non come un risarcimento."
      errors: [word-choice]
    - tutor: "Ottima strategia: chiedere tempo per portarlo a termine, con un tono positivo e senza recriminazioni. E per congedarsi?"
      goals: [tone]
      recast: {text: "portarlo a fine", fix: "portarlo a termine", tags: [word-choice]}
    - learner: "Chiuderei con «Ringraziandola per l'attenzione, Le porgo i miei più distinti saluti», seguito dalla firma e dal mio ruolo nel dipartimento."
    - tutor: "Perfetto, è proprio la chiusa che userei io. Mi mandi la bozza entro venerdì: la rileggo volentieri prima che parta."
      goals: [closing]

- scenario: reclamo-comune
  level: C2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via dei Mille e da tre settimane il lampione davanti al portone è spento. La sera la strada è completamente buia e due signore anziane sono già cadute."
    - tutor: "Capisco, è una situazione spiacevole. Ha già fatto una segnalazione tramite il portale del Comune?"
      goals: [describe]
    - learner: "Sì, due volte, ma a seguito alla seconda segnalazione nessuno mi ha più risposto. Per questo sono venuto di persona."
      errors: [preposition]
      gold: {text: "a seguito alla", fix: "a seguito della"}
    - tutor: "Ha fatto bene a venire. Mi ripete però «a seguito alla seconda segnalazione»? Dopo «a seguito», che preposizione si usa davanti al nome?"
      prompt: {text: "a seguito alla", tags: [preposition]}
    - learner: "A seguito della seconda segnalazione, giusto. Ma insomma, chi se ne occupa? Ogni ufficio mi dice che non è di sua competenza."
    - tutor: "Esatto. L'illuminazione pubblica è stata affidata a una ditta esterna, quindi il Comune può solo sollecitarla. Vedrò di inoltrare la pratica."
    - learner: "Mi scusi, ma «vedrò» non mi basta. Vorrei sapere entro quando verrà riparato, perché nel frattempo qualcuno si fa danno."
      errors: [word-choice]
    - tutor: "Ha ragione: se qualcuno si fa male, la responsabilità è anche nostra. Di solito questi interventi vengono eseguiti entro dieci giorni dal sollecito ufficiale."
      goals: [insist]
      recast: {text: "si fa danno", fix: "si fa male", tags: [word-choice]}
    - learner: "E se non succede, quali sono le mie opzioni? Posso mettere un reclamo formale, o devo rivolgermi direttamente alla ditta?"
      errors: [word-choice]
    - tutor: "Può presentare un reclamo formale all'Ufficio relazioni con il pubblico: viene protocollato e Lei ha diritto a una risposta entro trenta giorni."
      goals: [rights]
      recast: {text: "mettere un reclamo formale", fix: "presentare un reclamo formale", tags: [word-choice]}
    - learner: "Allora lo faccio subito, così rimane tutto per iscritto. Mi può dare un numero di riferimento per la segnalazione di oggi?"
    - tutor: "Certo: è la pratica 2318, la trova anche sul portale. Il sollecito parte stamattina stessa; se fra dieci giorni il lampione è ancora spento, torni pure da me."
      goals: [commitment]

- scenario: burocrazia-residenza
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Mia moglie e io abbiamo comprato una casa qui vicino e vorremmo trasferire la residenza, ma per ora siamo ancora iscritti all'AIRE come residenti all'estero."
    - tutor: "Benissimo, allora si tratta di un rientro dall'estero. Ha con sé i passaporti e l'atto di acquisto?"
      goals: [request]
    - learner: "I passaporti sì, l'atto no: il notaio dice che l'originale non ci verrà consegnato prima che la trascrizione è completata."
      errors: [subjunctive-use]
      gold: {text: "prima che la trascrizione è completata", fix: "prima che la trascrizione sia completata"}
    - tutor: "Capisco. Torniamo però un attimo su «prima che la trascrizione è completata»: dopo «prima che», quale modo verbale ci vuole?"
      prompt: {text: "prima che la trascrizione è completata", tags: [subjunctive-use]}
    - learner: "Allora... prima che la trascrizione sarà completata?"
      errors: [subjunctive-use]
    - tutor: "Prima che la trascrizione sia completata possono passare settimane, lo so bene. Nel frattempo basta una copia, purché firmata dal notaio. Serve poi il codice fiscale di entrambi."
      goals: [documents]
      recast: {text: "prima che la trascrizione sarà completata", fix: "prima che la trascrizione sia completata", tags: [subjunctive-use]}
    - learner: "Ecco il problema: mia moglie non l'ha mai avuto. Si può richiedere qui, o bisogna andare all'Agenzia delle Entrate?"
    - tutor: "Purtroppo va richiesto all'Agenzia delle Entrate, ma se si prenota online lo rilasciano in giornata. Poi me lo porta e lo allego io alla pratica."
      goals: [problem]
    - learner: "D'accordo. E una volta consegnato tutto, quanto ci vuole perché la residenza sia effettiva?"
    - tutor: "L'iscrizione decorre dal giorno della domanda. Nei quarantacinque giorni successivi passerà la polizia locale per l'accertamento: se non vi trova in casa, lascia un avviso."
      goals: [next]

- scenario: assicurazione-sinistro
  level: C2
  persona: es-f-teacher
  history: [passive]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Sabato pomeriggio la mia auto era parcheggiata regolarmente in piazza Garibaldi. Quando sono tornata, ho trovato la portiera sinistra tutta ammaccata e un biglietto sotto il tergicristallo."
    - tutor: "Un biglietto? Capita di rado, per fortuna capita. Che cosa c'era scritto?"
      goals: [what]
    - learner: "C'erano un nome e un numero di telefono: un ragazzo si scusava, perché aveva fatto manovra con il furgone di suo padre e aveva calcolato male la distanza. È stato molto educato, devo dire."
    - tutor: "Un comportamento esemplare, e piuttosto raro. L'ha già contattato?"
    - learner: "Sì, l'ho chiamato subito e mi ha confermato tutto. Però adesso il padre, che è il proprietario del furgone, sostiene che il danno è venuto fatto da qualcun altro."
      errors: [passive]
      gold: {text: "è venuto fatto", fix: "è stato fatto"}
    - tutor: "Che voltafaccia! Ma un momento: «il danno è venuto fatto». Nei tempi composti, il passivo con «venire» funziona?"
      prompt: {text: "è venuto fatto", tags: [passive]}
    - learner: "No, ha ragione, lì ci vuole «essere». Il padre sostiene che il danno è stato fatto da qualcun altro, ma il biglietto l'ha scritto suo figlio, e io l'ho conservato."
    - tutor: "Esatto. E quel biglietto vale oro: è un'ammissione di responsabilità scritta. Avete compilato anche la constatazione amichevole?"
      goals: [responsibility]
    - learner: "No, perché quando l'ho chiamato erano già passate due ore e lui era tornato a casa. Ho però le foto della portiera e del biglietto, e lo scontrino del parcheggio con l'orario."
    - tutor: "Le foto e il biglietto bastano per aprire la pratica; il modulo lo compileremo noi con i dati del ragazzo. Mi manda tutto per e-mail?"
      goals: [documents]
    - learner: "Certo, entro stasera. E poi? Il perito deve venire a vedere la macchina, o basta il presupposto del carrozziere?"
      errors: [false-friend]
    - tutor: "Per danni sotto i mille euro basta il preventivo del carrozziere. Se il padre continua a contestare, sarà la sua compagnia a sentire il figlio: Lei non deve fare altro."
      goals: [next]
      recast: {text: "il presupposto del carrozziere", fix: "il preventivo del carrozziere", tags: [false-friend]}

- scenario: assemblea-condominio
  level: C2
  persona: en-m-heritage
  history: [hypothetical]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Non sono affatto contrario al cappotto termico, ma vorrei che i lavori venissero spostati alla primavera: a gennaio, con i ponteggi davanti alle finestre, in casa si gela."
    - tutor: "Ricevuto. L'ingegner Bassi, però, fa notare con il suo solito sarcasmo che, se avessimo aspettato la stagione giusta per ogni lavoro, il palazzo sarebbe crollato da un pezzo."
      goals: [position]
    - learner: "Capisco la battuta, e in parte ha ragione. Tuttavia, se l'impresa avesse rispettato il cronoprogramma, a quest'ora avremmo finito da un mese."
    - tutor: "Colpito: anche l'ingegnere ride, e il clima si distende. Ha in mente un'alternativa concreta?"
      goals: [defuse]
    - learner: "Sì: propongo che si cominci subito dal tetto, che non richiede i ponteggi su tutta la facciata, e che il cappotto venga posato da marzo. Così l'impresa non resta ferma e nessuno muore di freddo."
    - tutor: "Ragionevole. L'impresa, però, ha già fatto sapere che lavorare in due fasi costerebbe di più. Cosa risponde?"
      goals: [alternative]
    - learner: "Che se ce l'avrebbero detto prima, avremmo potuto chiedere altri preventivi. Comunque si può pretendere che mettano per iscritto quanto costa in più."
      errors: [hypothetical]
      gold: {text: "se ce l'avrebbero detto", fix: "se ce l'avessero detto"}
    - tutor: "Il punto è giusto, ma riascolti la prima parte: «se ce l'avrebbero detto prima». Nella frase introdotta da «se», quale tempo serve?"
      prompt: {text: "se ce l'avrebbero detto", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se ce l'avessero detto prima, avremmo potuto confrontare altri preventivi."
    - tutor: "Esatto. Allora metto a verbale: tetto subito, cappotto da marzo e richiesta scritta all'impresa dei costi aggiuntivi entro quindici giorni. Tutti d'accordo? Approvato, e grazie della pazienza."
      goals: [compromise]

- scenario: reclamo-comune
  level: C2
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito sopra un locale in piazza Santo Stefano che da giugno ha un dehors con musica fino alle due di notte. Ho già chiamato la polizia locale tre volte."
    - tutor: "Capisco. I dehors estivi sono regolati da un'ordinanza: la musica all'aperto è consentita solo fino a mezzanotte. Ha annotato date e orari?"
      goals: [describe]
    - learner: "Sì, ho tenuto un diario con date e orari, e ho anche dei video. Il problema è che gli agenti arrivano, il volume si abbassa per dieci minuti e poi si ricomincia da capo."
    - tutor: "Un diario è utilissimo. Le consiglio di allegarlo a una segnalazione all'ufficio commercio, che poi valuterà il caso."
    - learner: "Mi perdoni, ma «valuterà» è un po' vago. Ho già fatto due segnalazioni e mi è stato risposto che la pratica era in corso di evaluazione."
      errors: [word-choice]
    - tutor: "Ha ragione, «in corso di valutazione» non dice nulla a chi non dorme da mesi. Vediamo a che punto è davvero: mi dà il numero di protocollo?"
      goals: [insist]
      recast: {text: "in corso di evaluazione", fix: "in corso di valutazione", tags: [word-choice]}
    - learner: "Ecco, è il 4471. E se anche questa volta non succede niente, che strumenti ho? Posso fare un esposto, oppure è inutile?"
    - tutor: "Non è affatto inutile: un esposto al sindaco obbliga l'amministrazione a rispondere entro trenta giorni, e in caso di silenzio può rivolgersi al difensore civico."
      goals: [rights]
    - learner: "Bene, allora lo presento oggi stesso. Vorrei però che qualcuno si prendesse la responsabilità in questi controlli serali."
      errors: [preposition]
      gold: {text: "la responsabilità in questi controlli", fix: "la responsabilità di questi controlli"}
    - tutor: "È giusto pretenderlo. Solo un dettaglio: «la responsabilità in questi controlli»? Dopo «responsabilità», quale preposizione introduce ciò di cui si risponde?"
      prompt: {text: "la responsabilità in questi controlli", tags: [preposition]}
    - learner: "Certo, la responsabilità di questi controlli. Vorrei sapere chi deve rispondere, se il locale continua così."
    - tutor: "Glielo dico subito: la polizia locale, su richiesta dell'ufficio commercio. Scrivo ora un sollecito che cita il Suo diario e Le mando la ricevuta per e-mail entro domani."
      goals: [commitment]

- scenario: burocrazia-residenza
  level: C2
  persona: es-f-erasmus
  history: [subject-verb-agreement]
  turns:
    - tutor: "Buongiorno. Numero 12? Prego, mi dica."
    - learner: "Buongiorno. Sono una ricercatrice spagnola, ho un contratto di due anni con il Politecnico e vorrei iscrivermi all'anagrafe come residente."
    - tutor: "Benvenuta. Per i cittadini dell'Unione serve dimostrare un'attività lavorativa o risorse sufficienti. Ha con sé il contratto?"
      goals: [request]
    - learner: "Sì, eccolo. Si deve presentare anche le buste paga, o basta il contratto firmato?"
      errors: [subject-verb-agreement]
      gold: {text: "Si deve presentare", fix: "Si devono presentare"}
    - tutor: "Domanda sensata. Ma riascolti: «si deve presentare anche le buste paga». Qui il soggetto sono le buste paga: come concorda il verbo?"
      prompt: {text: "Si deve presentare", tags: [subject-verb-agreement]}
    - learner: "Ah, certo: si devono presentare anche le buste paga? Per ora ne ho solo una, perché ho cominciato a ottobre."
    - tutor: "Esatto. Una basta, insieme al contratto. Poi serve la tessera sanitaria europea o un'assicurazione privata."
      goals: [documents]
    - learner: "Ecco, questo è il problema: la mia tessera è scaduta a settembre e l'ufficio di Madrid non ha ancora contestato la mia richiesta di rinnovo."
      errors: [false-friend]
    - tutor: "Capisco. Se Madrid non ha ancora risposto, accettiamo la ricevuta della domanda di rinnovo, purché la tessera nuova arrivi prima della conferma definitiva."
      goals: [problem]
      recast: {text: "contestato", fix: "risposto", tags: [false-friend]}
    - learner: "Perfetto, la ricevuta ce l'ho nella posta elettronica. E dopo, quanto tempo passa prima che la residenza sia confermata?"
    - tutor: "L'iscrizione è immediata; poi un vigile verrà a verificare che Lei abiti davvero all'indirizzo dichiarato. Mi raccomando: il Suo nome sul citofono, ben leggibile."
      goals: [next]

- scenario: email-rettore
  level: C2
  persona: en-m-traveller
  history: [register]
  turns:
    - tutor: "Buongiorno, si accomodi pure. Mi accennava al telefono a una lettera per il Rettore: di che si tratta, esattamente?"
    - learner: "Buongiorno. Ho anticipato di tasca mia le spese di un convegno a Lisbona otto mesi fa e non ho ancora ricevuto il rimborsamento. L'ufficio missioni non risponde più alle mie e-mail."
      errors: [word-choice]
    - tutor: "Otto mesi di attesa per il rimborso sono davvero troppi, ha ragione. Vediamo come impostare la lettera: con che formula pensa di aprire?"
      goals: [situation]
      recast: {text: "il rimborsamento", fix: "il rimborso", tags: [word-choice]}
    - learner: "Scriverei «Magnifico Rettore», e poi andrei dritto al punto: sono stufo di aspettare e vorrei sapere che fine hanno fatto i miei soldi."
      errors: [register]
      gold: {text: "sono stufo di aspettare", fix: "attendo da otto mesi"}
    - tutor: "La formula d'apertura è quella giusta. Ma «sono stufo» e «che fine hanno fatto i miei soldi», letti dal Rettore, che effetto farebbero secondo Lei?"
      goals: [opening-formula]
      prompt: {text: "sono stufo di aspettare", tags: [register]}
    - learner: "Un pessimo effetto, lo ammetto. Meglio: «Mi permetto di segnalarLe che, a otto mesi dalla missione, non ho ancora ricevuto quanto mi spetta»."
    - tutor: "Molto meglio: fermo ma rispettoso. Aggiungerei i numeri di protocollo delle richieste già inviate. E per il tono generale, che cosa vorrebbe evitare?"
    - learner: "Vorrei evitare di accusare l'ufficio missioni, siccome so che è sotto organico da mesi."
      errors: [word-choice]
    - tutor: "Giustissimo, anche perché so che è davvero sotto organico: meglio un tono collaborativo. Potrebbe chiedere al Rettore un intervento per sbloccare la pratica, senza puntare il dito."
      goals: [tone]
      recast: {text: "siccome so", fix: "perché so", tags: [word-choice]}
    - learner: "E per chiudere pensavo a «Confidando in un Suo cortese riscontro, porgo distinti saluti»."
    - tutor: "Ineccepibile. Aggiunga sotto la firma il Suo ruolo e il dipartimento, e la lettera è pronta per il protocollo."
      goals: [closing]

# Round 5b, set v-c2. File 4: book clubs, poetry and exhibitions.
- scenario: circolo-lettura
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: l'ho trovato commovente. Un ragazzino che sale sugli alberi per protesta e non scende più per tutta la vita: è un'idea così assurda da diventare poetica."
    - tutor: "Commovente, addirittura! Ma dimmi: non è un po' troppo comodo ribellarsi stando lassù, lontano da tutto?"
      goals: [impression]
    - learner: "Non direi lontano: Cosimo partecipa a tutto, legge, ama, combatte. È proprio la distanza la quale gli permette di vedere meglio il mondo."
      errors: [relative-pronoun]
      gold: {text: "la quale gli permette", fix: "che gli permette"}
    - tutor: "Interessante. Ma «è proprio la distanza la quale gli permette»: in una frase costruita così, «la quale» ti suona naturale?"
      prompt: {text: "la quale gli permette", tags: [relative-pronoun]}
    - learner: "No, troppo pesante: è proprio la distanza che gli permette di vedere meglio. Il tema, per me, è questo: per capire la propria comunità bisogna anche saperne prendere le distanze."
    - tutor: "Bella formula, la sottoscrivo. E lo stile? Io lo trovo freddino, troppo cerebrale."
      goals: [theme]
    - learner: "Freddino? Al contrario. L'ironia di Calvino è leggera, ma non fredda: anche quando racconta la morte del padre di Cosimo, sorridi e ti si stringe il cuore nello stesso momento."
    - tutor: "Sull'ironia ti do ragione. Resto però convinta che Cosimo sia un egoista travestito da eroe."
      goals: [style]
    - learner: "Se fosse un egoista, non avrebbe aiutato i contadini a spegnere gli incendi. Secondo me confondi la solitudine con l'egoismo, che sono due cose ben diverse."
    - tutor: "Colpita, lo ammetto. Allora, per il prossimo incontro: tu che cosa proporresti?"
      goals: [disagree]
    - learner: "Proporrei «Il sentiero dei nidi di ragno»: è la sua prima novella, e mi incuriosisce vedere com'era Calvino prima dell'ironia."
      errors: [false-friend]
    - tutor: "Il suo primo romanzo, scritto a ventitré anni: scelta interessante. Ma perché dovrebbe piacere a chi ha amato il Barone?"
      recast: {text: "la sua prima novella", fix: "il suo primo romanzo", tags: [false-friend]}
    - learner: "Perché c'è già tutto: un ragazzo solo, uno sguardo dal basso sugli adulti, la guerra vissuta come un gioco crudele. È come se fosse il Barone prima che imparasse a sorridere."
    - tutor: "«Il Barone prima che imparasse a sorridere»: questa la scrivo sulla lavagna della biblioteca. Votiamo? Approvato all'unanimità."
      goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, sì, anche se mi ci sono volute tre settimane. Questo libro si tratta di un'amicizia così intensa che a volte fa quasi male leggerlo."
      errors: [word-choice]
    - tutor: "Vero, questo libro parla di un'amicizia che graffia, altro che storia tenera. Ma alla fine ti è piaciuto o no?"
      recast: {text: "Questo libro si tratta di", fix: "questo libro parla di", tags: [word-choice]}
    - learner: "Molto, anche se mi ha messo a disagio. Non credo che Lila ha sempre fatto le scelte giuste, ma la capisco: in quel quartiere chiunque sarebbe diventato duro."
      errors: [subjunctive-use]
      gold: {text: "Lila ha sempre fatto", fix: "Lila abbia sempre fatto"}
    - tutor: "Duro, sì, ma lei è anche geniale, e lo sa. Però «non credo che Lila ha sempre fatto»: dopo «non credo che», quale modo ti aspetti?"
      goals: [impression]
      prompt: {text: "Lila ha sempre fatto", tags: [subjunctive-use]}
    - learner: "Allora... non credo che Lila avesse sempre fatto le scelte giuste?"
      errors: [subjunctive-use]
    - tutor: "Nemmeno io credo che Lila abbia sempre fatto le scelte giuste: sposarsi a sedici anni con quel commerciante! Tu, al suo posto, che cosa avresti fatto?"
      recast: {text: "Lila avesse sempre fatto", fix: "Lila abbia sempre fatto", tags: [subjunctive-use]}
    - learner: "D'istinto direi che sarei scappato. Ma in quel mondo, per una ragazza povera e senza scuola, sposarsi era l'unica via d'uscita: probabilmente avrei fatto lo stesso."
    - tutor: "Esatto, ed è lì che Lila diventa tragica: sceglie l'unica porta aperta, e si chiude dentro. E lo stile, ti ha convinto?"
      goals: [character]
    - learner: "Non del tutto. L'ho trovato un po' piatto: frasi lunghe, poche immagini, molta cronaca. Mi ha agganciato la storia, non la scrittura."
      errors: [word-choice]
    - tutor: "Ti ha preso la storia e non la scrittura? Piatto?! Per me è proprio quella prosa senza fronzoli che ti trascina. Ti concedo però che i primi capitoli sono lenti."
      goals: [style]
      recast: {text: "agganciato", fix: "preso", tags: [word-choice]}
    - learner: "Lenti, sì. Comunque lo consiglierei a chi è cresciuto in una periferia, perché ci si riconoscerà; non lo consiglierei, invece, a chi cerca una lettura rilassante sotto l'ombrellone."
    - tutor: "Sottoscrivo: sotto l'ombrellone ti rovina le vacanze! Allora lo segno come «consigliato, ma con avvertenze»."
      goals: [recommend]

- scenario: film-libro
  level: C2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, se permettete. Ho riletto «Il Gattopardo», che avevo letto per la prima volta trent'anni fa. È la storia di un principe siciliano il cui mondo crolla con l'arrivo dei Savoia."
    - tutor: "Un classico! E a rileggerlo, che effetto ti ha fatto?"
      goals: [summary]
    - learner: "Più amaro di come lo ricordavo. Il principe capisce tutto, ma non fa niente per opporsi: lascia che il nipote Tancredi, del quale la ambizione è senza limiti, si allei con i nuovi ricchi."
      errors: [relative-pronoun, article-form]
      gold: {text: "del quale la ambizione", fix: "la cui ambizione"}
    - tutor: "Tancredi, che personaggio! Ma «del quale la ambizione»: per dire di chi è l'ambizione, quale relativo useresti?"
      prompt: {text: "del quale la ambizione", tags: [relative-pronoun]}
    - learner: "Ah, giusto: Tancredi, la cui ambizione è senza limiti. E poi c'è Angelica, bellissima e un po' volgare, figlia di un sindaco arricchito."
    - tutor: "Esatto. E nel film Angelica è Claudia Cardinale: l'hai rivisto?"
      goals: [characters]
    - learner: "Sì, subito dopo. Burt Lancaster fa il ruolo del principe con un'eleganza incredibile, anche se in originale recita in inglese e il doppiaggio si sente."
      errors: [word-choice]
    - tutor: "Lancaster fa la parte del principe come se fosse nato a Palermo, è vero. Ma ti è piaciuto di più il libro o il film?"
      recast: {text: "fa il ruolo", fix: "fa la parte", tags: [word-choice]}
    - learner: "Il libro, senza dubbio. Il film è splendido da vedere, però perde la voce del narratore, che commenta tutto con un'ironia quasi crudele."
    - tutor: "Giustissimo: la voce del narratore è metà del romanzo. A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A chi pensa che i classici siano noiosi: «Se vogliamo che tutto rimanga com'è, bisogna che tutto cambi» è una frase che spiega ancora oggi metà della politica italiana."
    - tutor: "Verissimo, e ce ne accorgiamo a ogni elezione! Lo metto in cima alla lista del mese prossimo."
      goals: [recommend]

- scenario: poesia-montale
  level: C2
  persona: en-f-professional
  history: [stare-gerund]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Una sensazione di caldo soffocante, di immobilità. È come se il tempo si fosse fermato in un pomeriggio d'estate."
    - tutor: "Proprio così: il meriggio, l'ora più immobile della giornata. Quale immagine l'ha colpita di più?"
      goals: [first-reading]
    - learner: "Le file di formiche che si rompono e si intrecciano sulle zolle. È un'immagine piccolissima, eppure sembra contenere tutto il senso della poesia."
    - tutor: "Le formiche, sì: un brulichio senza scopo, visto da vicinissimo. E il suono? Ripensi alla prima strofa."
      goals: [image]
    - learner: "Il suono è aspro, quasi sgradevole: «schiocchi di merli, frusci di serpi». Mi sembra che quelle consonanti doppie sono state scelte apposta per farci sentire l'arsura."
      errors: [subjunctive-use]
      gold: {text: "sono state scelte", fix: "siano state scelte"}
    - tutor: "Osservazione acutissima. Ma «mi sembra che sono state scelte»: dopo «mi sembra che», il verbo come andrebbe?"
      prompt: {text: "sono state scelte", tags: [subjunctive-use]}
    - learner: "Mi sembra che siano state scelte apposta, volevo dire. Sono parole che graffiano."
    - tutor: "Esatto: è la poetica dell'aspro, l'opposto della musica levigata di D'Annunzio. E il senso ultimo, secondo lei?"
      goals: [sound]
    - learner: "Nell'ultima strofa Montale sta dicendo che la vita è un camminare lungo una muraglia con in cima cocci aguzzi di bottiglia: non si può passare dall'altra parte."
      errors: [stare-gerund]
      gold: {text: "Montale sta dicendo", fix: "Montale dice"}
    - tutor: "Bella sintesi. Ma «Montale sta dicendo»: per un testo scritto un secolo fa, la perifrasi progressiva le sembra adatta?"
      prompt: {text: "Montale sta dicendo", tags: [stare-gerund]}
    - learner: "No, è un calco dall'inglese: Montale dice che non si può passare dall'altra parte. Eppure, nonostante tutto, si continua a camminare."
    - tutor: "Ecco il senso: nessuna salvezza, ma nemmeno la resa. Ottima lettura; la prossima volta passiamo a «I limoni»."
      goals: [meaning]

- scenario: arte-mostra
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Sinceramente, a prima vista nessuna: qualche bottiglia e una scatola su un tavolo. Però più lo guardo, più mi calma."
    - tutor: "È l'effetto Morandi: sembra niente, e poi non riesci più a staccarti. Descrivimelo bene."
      goals: [react]
    - learner: "Le bottiglie sono larghe e strette, tutte attaccate, quasi senza spazio tra l'una e l'altra. I colori sono polverosi: grigio, rosa pallido, un ocra sbiadito."
      errors: [false-friend]
    - tutor: "Alte e strette, sì, strette come persone in una foto di gruppo. E quel colore polveroso non è un caso: pare che lui lasciasse davvero le bottiglie a prendere polvere."
      goals: [describe]
      recast: {text: "larghe e strette", fix: "alte e strette", tags: [false-friend]}
    - learner: "Davvero? Allora dipingeva la polvere stessa! E sebbene il soggetto è sempre lo stesso, ogni quadro sembra diverso."
      errors: [subjunctive-use]
      gold: {text: "sebbene il soggetto è", fix: "sebbene il soggetto sia"}
    - tutor: "La polvere stessa, esatto. Ma «sebbene il soggetto è sempre lo stesso»: con «sebbene», l'indicativo ti convince?"
      prompt: {text: "sebbene il soggetto è", tags: [subjunctive-use]}
    - learner: "Sebbene il soggetto sia sempre lo stesso, ecco. Secondo me queste bottiglie sono come persone: vicine, ma ognuna chiusa nel suo silenzio."
    - tutor: "Bellissima lettura, e non sei la prima a vederci una famiglia muta. Ti ricorda qualcos'altro?"
      goals: [interpret]
    - learner: "Mi fa pensare alle nature morte spagnole del Seicento, che però sono drammatiche: fondo nero, luce violenta. Qui invece la luce è morbida, e tutto resta sospeso."
    - tutor: "Ottimo paragone: stessa sobrietà, ma Morandi toglie il dramma e lascia solo il silenzio. Andiamo, nella sala dopo ci sono i suoi paesaggi."
      goals: [compare]

- scenario: circolo-lettura
  level: C2
  persona: en-m-heritage
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io, lo confesso. Va bene la protesta, ma passare una vita sugli alberi per un piatto di lumache rifiutato mi sembra puro capriccio. Se scendeva dopo una settimana, il libro finiva a pagina venti!"
    - tutor: "Ah, finalmente qualcuno sincero! Quindi per te è solo un ragazzino viziato che non sa perdere?"
      goals: [impression]
    - learner: "All'inizio sì. Poi però ho capito che il tema è la coerenza: una volta presa una decisione, Cosimo ci resta fedele, anche quando nessuno ricorda più perché."
    - tutor: "La coerenza, certo. Ma coerenza o testardaggine? E Viola, allora, come la leggi?"
      goals: [theme]
    - learner: "Viola è l'unica alla sua altezza, letteralmente. È una ragazza che il suo carattere è più forte di quello di Cosimo, e infatti alla fine se ne va lei."
      errors: [relative-pronoun]
      gold: {text: "che il suo carattere", fix: "il cui carattere"}
    - tutor: "«Alla sua altezza, letteralmente»: bellissima! Però «una ragazza che il suo carattere è più forte»: come lo diresti con un relativo più preciso?"
      prompt: {text: "che il suo carattere", tags: [relative-pronoun]}
    - learner: "Una ragazza il quale carattere... no, aspetta."
      errors: [relative-pronoun]
    - tutor: "Una ragazza il cui carattere è più forte del suo, sì, e che lo lascia proprio per questo. E lo stile, ti ha conquistato almeno quello?"
      recast: {text: "il quale carattere", fix: "il cui carattere", tags: [relative-pronoun]}
    - learner: "Lo stile sì: frasi limpide, ironia continua, ma mai cattiva. Vorrei che anche i romanzieri di oggi scrivevano con questa leggerezza."
      errors: [subjunctive-use]
      gold: {text: "scrivevano", fix: "scrivessero"}
    - tutor: "Leggerezza: parola calviniana per eccellenza. Ma «vorrei che scrivevano»: il verbo dopo «vorrei che» ti suona bene?"
      goals: [style]
      prompt: {text: "scrivevano", tags: [subjunctive-use]}
    - learner: "Vorrei che scrivessero, giusto. Però su una cosa non sono d'accordo con te: Cosimo non è insopportabile, è solo coerente fino al ridicolo, e questo lo rende umano."
    - tutor: "Mi hai quasi convinto: «coerente fino al ridicolo» te lo concedo. E per il prossimo incontro che cosa proponi?"
      goals: [disagree]
    - learner: "«Le città invisibili»: niente trama, solo descrizioni di città immaginarie. Dopo un romanzo d'avventura, mi sembra un bel contrasto."
    - tutor: "Contrasto riuscito: dal bosco alle città che non esistono. Approvato!"
      goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: en-f-student
  history: [conditional-form]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, e l'ho letto in un fiato, anche se il finale mi ha lasciata di sasso."
      errors: [word-choice]
    - tutor: "Anch'io l'ho letto tutto d'un fiato, e quel finale... Ma nel complesso, ti è piaciuto?"
      recast: {text: "in un fiato", fix: "tutto d'un fiato", tags: [word-choice]}
    - learner: "Molto, anche se mi sembra strano che l'autrice ha scelto di far partire Irene senza nessuna spiegazione."
      errors: [subjunctive-use]
      gold: {text: "ha scelto", fix: "abbia scelto"}
    - tutor: "La partenza di Irene è il cuore del libro, ne discuteremo. Ma «mi sembra strano che l'autrice ha scelto»: con «mi sembra strano che», quale modo serve?"
      goals: [impression]
      prompt: {text: "ha scelto", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: mi sembra strano che abbia scelto di non spiegare niente. Io ero convinta che Irene tornerebbe dai figli nell'ultimo capitolo."
      errors: [conditional-form]
      gold: {text: "tornerebbe", fix: "sarebbe tornata"}
    - tutor: "Esatto. E qui ti contraddirò, ma prima: «ero convinta che Irene tornerebbe»... per un futuro visto dal passato, quale condizionale usiamo?"
      prompt: {text: "tornerebbe", tags: [conditional-form]}
    - learner: "Il condizionale passato: ero convinta che Irene sarebbe tornata dai figli. Per me non è una madre crudele: è una donna che si è persa e non sa più come ritrovarsi."
    - tutor: "Su questo siamo d'accordo, ed è proprio il suo fascino: non la giustifica nessuno, nemmeno l'autrice. E la scrittura come l'hai trovata?"
      goals: [character]
    - learner: "Asciutta, quasi chirurgica: frasi brevi, niente aggettivi inutili. All'inizio mi ha infastidita, poi ho capito che quella freddezza era voluta."
    - tutor: "Voluta eccome: la freddezza è il modo in cui Irene guarda il mondo. E a chi lo consiglieresti?"
      goals: [style]
    - learner: "Non a chi cerca una storia consolatoria. Lo regalerei, invece, a mia madre: sono sicura che avrebbe molto da dire su Irene."
    - tutor: "Ottima idea, poi ci racconti com'è andata! Io le preparerei anche una tisana: ci sarà da discutere."
      goals: [recommend]

- scenario: arte-mostra
  level: C2
  persona: en-m-traveller
  history: [passive]
  turns:
    - tutor: "Guarda quest'installazione. Che impressione ti fa?"
    - learner: "Inquietante. Una stanza buia, un solo letto d'ospedale vuoto e il rumore di un respiro registrato. Per quanto mi sforzo, non riesco a restare dentro più di un minuto."
      errors: [subjunctive-use]
      gold: {text: "Per quanto mi sforzo", fix: "Per quanto mi sforzi"}
    - tutor: "È proprio l'effetto che cerca. Ma «per quanto mi sforzo»: con «per quanto», l'indicativo ti torna?"
      prompt: {text: "Per quanto mi sforzo", tags: [subjunctive-use]}
    - learner: "No, hai ragione: per quanto mi sforzi. Il respiro, tra l'altro, a un certo punto si interrompe, e quel silenzio è peggio di tutto."
    - tutor: "Sì, il silenzio dura dodici secondi esatti. Descrivimi il resto della stanza."
      goals: [react]
    - learner: "Le pareti sono coperte di fogli scritti a mano: sembrano cartelle cliniche, ma se ti avvicini sono lettere d'amore. Il cartellino dice che l'opera è venuta acquistata dal museo l'anno scorso."
      errors: [passive]
      gold: {text: "è venuta acquistata", fix: "è stata acquistata"}
    - tutor: "Lettere d'amore: che colpo di scena! Dettaglio da storico dell'arte pignolo, però: «è venuta acquistata». Al passato prossimo, quale ausiliare regge il passivo?"
      goals: [describe]
      prompt: {text: "è venuta acquistata", tags: [passive]}
    - learner: "È stata acquistata, certo. Secondo me parla del padre dell'artista: lei gli ha scritto quelle lettere mentre lui era ricoverato, e lui non ha mai potuto leggerle."
    - tutor: "È esattamente così, lo racconta lei stessa nel catalogo. Hai un intuito notevole."
      goals: [interpret]
    - learner: "Mi ricorda certe installazioni con fotografie di sconosciuti e lampadine accese, tutte sul tema della memoria. È un'opera molto controversiale, però: alcuni la trovano troppo privata per un museo."
      errors: [word-choice]
    - tutor: "Molto controversa, sì: c'è chi parla addirittura di voyeurismo. Tu da che parte stai?"
      goals: [compare]
      recast: {text: "molto controversiale", fix: "molto controversa", tags: [word-choice]}
    - learner: "Dalla parte dell'artista: se il dolore privato non potesse entrare in un museo, metà della storia dell'arte sparirebbe."
    - tutor: "Argomento inattaccabile: pensa a quante crocifissioni sono, in fondo, il dolore di una madre. Andiamo, di là c'è qualcosa di più leggero."

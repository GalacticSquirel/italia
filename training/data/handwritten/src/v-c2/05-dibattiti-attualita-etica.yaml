# Round 5b, set v-c2. File 5: public debates, current affairs and ethics seminars.
- scenario: dibattito-ambiente
  level: C2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco la preoccupazione, ma la penso diversamente. Sono favorevole alla chiusura, purché venga accompagnata da un potenziamento serio del transito pubblico."
      errors: [word-choice]
    - tutor: "Un potenziamento serio dei mezzi pubblici, dice. Ma chi abita in collina come farebbe a fare la spesa?"
      goals: [position]
      recast: {text: "del transito pubblico", fix: "dei mezzi pubblici", tags: [word-choice]}
    - learner: "Per chi abita in collina basterebbero due navette all'ora. E non è detto che i negozi perdono clienti: in una città della Galizia dove ho vissuto, il commercio in centro è addirittura cresciuto."
      errors: [subjunctive-use]
      gold: {text: "i negozi perdono", fix: "i negozi perdano"}
    - tutor: "Esempio interessante. Ma «non è detto che i negozi perdono clienti»: dopo «non è detto che», quale modo ci vuole?"
      prompt: {text: "i negozi perdono", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: non è detto che i negozi perdano clienti. E i dati della Galizia si basano in uno studio dell'università, che posso mandarle."
      errors: [preposition]
      gold: {text: "si basano in", fix: "si basano su"}
    - tutor: "Esatto. E sullo studio: «si basano in uno studio»? Il verbo «basarsi» quale preposizione vuole?"
      goals: [argue]
      prompt: {text: "si basano in", tags: [preposition]}
    - learner: "Su, certo: si basano su uno studio universitario. Lo so che in italiano è diverso, ma mi scappa sempre."
    - tutor: "Capita. Però una città spagnola non è la nostra: qui metà dei clienti arriva dai paesi vicini, e in macchina."
    - learner: "Proprio per questo propongo parcheggi gratuiti alle porte del centro, nella zona in la quale oggi c'è solo il vecchio mercato coperto."
      errors: [articulated-preposition]
      gold: {text: "in la quale", fix: "nella quale"}
    - tutor: "Idea concreta. Ma «la zona in la quale»: preposizione e articolo, lì, restano separati?"
      goals: [counter]
      prompt: {text: "in la quale", tags: [articulated-preposition]}
    - learner: "No, si uniscono: la zona nella quale oggi c'è solo il vecchio mercato. Le concedo però che i primi mesi saranno difficili per qualche negozio."
    - tutor: "Apprezzo la franchezza. Su questo potremmo trovarci d'accordo: chiusura graduale, prima il sabato, e un fondo di sostegno per i negozianti nei primi mesi."
      goals: [concede]

- scenario: turismo-di-massa
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Sono un pensionato inglese e vivo a Venezia da dodici anni. Sono a favore del ticket, anche se da solo non basterà."
    - tutor: "Un veneziano d'adozione, benvenuto! E perché non basterà, secondo Lei?"
      goals: [introduce]
    - learner: "Perché il problema non sono i turisti in sé, ma il turismo di giornata: arrivano alle dieci, scendono dalle navi e ripartono alle cinque. Ogni sabato la città diventa un parco di attrazioni."
      errors: [word-choice]
    - tutor: "Un parco divertimenti a cielo aperto, dice. Ha un esempio concreto di quello che vede dalla sua finestra?"
      recast: {text: "un parco di attrazioni", fix: "un parco divertimenti", tags: [word-choice]}
    - learner: "Certo. Sotto casa mia c'era un forno aperto da novant'anni: ha chiuso l'anno scorso, e al suo posto adesso si vendono maschere di plastica."
    - tutor: "Una storia che sentiamo spesso. Ma faccio l'avvocato del diavolo: i soldi del ticket non servono proprio a salvare forni come quello?"
      goals: [example]
    - learner: "Ammesso che il ticket funziona, i soldi raccolti finiscono nel bilancio generale del Comune, non ai residenti. L'anno scorso sono stato raccolti più di due milioni, e nessuno sa come siano stati spesi."
      errors: [subjunctive-use, passive]
      gold: {text: "Ammesso che il ticket funziona", fix: "Ammesso che il ticket funzioni"}
    - tutor: "Domanda legittima. Ma «ammesso che il ticket funziona»: con «ammesso che», Lei che modo userebbe?"
      prompt: {text: "Ammesso che il ticket funziona", tags: [subjunctive-use]}
    - learner: "Ammesso che funzioni, appunto. E secondo me nessuno può dimostrare che abbia ridotto davvero le presenze."
    - tutor: "I numeri, in effetti, sono contraddittori. Lei, allora, che cosa propone?"
      goals: [rebut]
    - learner: "Un numero chiuso nei giorni di punta, con prenotazione obbligatoria, e i soldi del ticket vincolati per legge agli affitti dei residenti, in modo che i veneziani possono restare."
      errors: [subjunctive-use]
      gold: {text: "possono restare", fix: "possano restare"}
    - tutor: "Proposta chiara. Ma «in modo che i veneziani possono restare»: quando «in modo che» indica uno scopo, che modo vuole?"
      prompt: {text: "possono restare", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: in modo che i veneziani possano restare nella loro città."
    - tutor: "Messaggio forte e chiaro. Grazie, e un saluto a Venezia! Passiamo alla prossima telefonata."
      goals: [proposal]

- scenario: intelligenza-artificiale
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Io la vedo diversamente. Credo che molti lavori cambieranno, certo, ma che ne spariranno meno di quanto si dica."
    - tutor: "Mah, tu sei sempre ottimista. Su che cosa ti basi?"
      goals: [position]
    - learner: "Sul fatto che è già successo: quando sono arrivati i fogli di calcolo, i contabili non sono spariti, hanno cambiato mestiere. Chi saprà prendere vantaggio di questi strumenti lavorerà meglio, non meno."
      errors: [word-choice]
    - tutor: "Chi saprà trarre vantaggio da questi strumenti, d'accordo. Ma gli altri? Mia zia fa la traduttrice e ha perso metà dei clienti in un anno."
      goals: [evidence]
      recast: {text: "prendere vantaggio di", fix: "trarre vantaggio da", tags: [word-choice]}
    - learner: "Su questo hai ragione, non lo nego: per alcuni mestieri il colpo è durissimo. Se i governi avrebbero pensato prima alla formazione, oggi tua zia avrebbe più alternative."
      errors: [hypothetical]
      gold: {text: "Se i governi avrebbero pensato", fix: "Se i governi avessero pensato"}
    - tutor: "Ecco, almeno questo lo ammetti! Però «se i governi avrebbero pensato»: nella frase con «se», quel condizionale ci sta?"
      goals: [concede]
      prompt: {text: "Se i governi avrebbero pensato", tags: [hypothetical]}
    - learner: "No, ci vuole il congiuntivo: se i governi ci avessero pensato prima, oggi tua zia avrebbe più alternative."
    - tutor: "Esatto. E allora, alla fine, che cosa concludi?"
    - learner: "Che dipende da noi: possiamo usarla per sostituire le persone piuttosto che per renderle più brave. Sono due strade, e la scelta è politica, non tecnica."
      errors: [word-choice]
    - tutor: "Sostituire le persone oppure renderle più brave: messa così, la scelta sembra davvero nostra. Ma ti fidi di chi deve farla?"
      recast: {text: "piuttosto che", fix: "oppure", tags: [word-choice]}
    - learner: "Non ciecamente, no. Però preferisco vigilare piuttosto che rassegnarmi: la paura, da sola, non ha mai fermato nessuna tecnologia."
    - tutor: "«Vigilare piuttosto che rassegnarsi»: me lo segno, e la prossima volta che mi deprimo te lo rinfaccio. Brindiamo?"
      goals: [conclude]

- scenario: politica-lavoro
  level: C2
  persona: es-m-worker
  history: [hypothetical]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Metà mi sembra esagerato. Sono convinto che spariranno alcune mansioni, non interi mestieri: un idraulico, per esempio, non lo sostituisci con un algoritmo."
    - tutor: "L'idraulico no, ma l'impiegato di banca sì. E tu che fai il geometra, sei così tranquillo?"
      goals: [opinion]
    - learner: "Tranquillo no. Se avessi studiato informatica da giovane, adesso avrei avuto meno pensieri. Però ho cinquant'anni e mi adatto."
      errors: [hypothetical]
      gold: {text: "adesso avrei avuto", fix: "adesso avrei"}
    - tutor: "Ti capisco. Ma «se avessi studiato, adesso avrei avuto meno pensieri»: con «adesso», la conseguenza sta nel passato o nel presente?"
      prompt: {text: "adesso avrei avuto", tags: [hypothetical]}
    - learner: "Nel presente: adesso avrei meno pensieri. Comunque l'anno scorso ho assistito a un corso di modellazione 3D, e mi ha cambiato il lavoro."
      errors: [false-friend]
    - tutor: "Hai frequentato un corso a cinquant'anni? Questo sì che è un bell'esempio! E che cosa ti ha cambiato, in concreto?"
      goals: [hypothesis]
      recast: {text: "assistito a un corso", fix: "frequentato un corso", tags: [false-friend]}
    - learner: "Prima facevo i rilievi a mano e ci mettevo tre giorni; adesso, con il drone e il software, ci metto mezza giornata e posso portare più cantieri."
      errors: [word-choice]
    - tutor: "Quindi adesso puoi seguire più cantieri: la macchina non ti ha tolto il lavoro, te l'ha moltiplicato."
      goals: [example]
      recast: {text: "portare più cantieri", fix: "seguire più cantieri", tags: [word-choice]}
    - learner: "Esatto. Ma non tutti hanno la possibilità di formarsi: bisognerebbe che lo Stato aiuta chi ha più di cinquant'anni, altrimenti resteranno indietro."
      errors: [subjunctive-use]
      gold: {text: "lo Stato aiuta", fix: "lo Stato aiutasse"}
    - tutor: "Su questo ti do ragione. Ma «bisognerebbe che lo Stato aiuta»: dopo «bisognerebbe», quale congiuntivo serve?"
      prompt: {text: "lo Stato aiuta", tags: [subjunctive-use]}
    - learner: "Il congiuntivo imperfetto: bisognerebbe che lo Stato aiutasse chi resta indietro. Insomma, la tecnologia non è il nemico; il nemico è lasciare sola la gente."
    - tutor: "Mi hai quasi convertito. Allora brindo a questo: alla tecnologia, purché non lasci indietro nessuno!"
      goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [register]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Certo, professore. Più precisamente, la mia tesi è che la responsabilità morale presupponga un'intenzione, e che una macchina, per quanto sofisticata, non possa averne."
    - tutor: "Intenzione, dice. Eppure attribuiamo responsabilità anche alle aziende, che di intenzioni proprie non ne hanno."
      goals: [thesis]
    - learner: "Proprio per questo si deve distinguere due piani: la responsabilità giuridica, che può essere attribuita anche a un ente, e quella morale, che spetta solo a un agente cosciente."
      errors: [subject-verb-agreement]
      gold: {text: "si deve distinguere due piani", fix: "si devono distinguere due piani"}
    - tutor: "Distinzione classica, ma solida. Prima, però: «si deve distinguere due piani». Con il «si» passivante, a che cosa si accorda il verbo?"
      prompt: {text: "si deve distinguere due piani", tags: [subject-verb-agreement]}
    - learner: "Ai due piani: si devono distinguere due piani. Nel caso dell'azienda, la responsabilità morale cade sulle persone che hanno preso le decisioni."
      errors: [word-choice]
    - tutor: "E la responsabilità ricade sulle persone, d'accordo. Ma se la decisione l'ha presa un sistema autonomo, senza che nessuno la approvasse, a chi la attribuisce?"
      goals: [distinguish]
      recast: {text: "cade sulle persone", fix: "ricade sulle persone", tags: [word-choice]}
    - learner: "In quel caso risalirei a chi ha deciso di affidargli quel compito: se nessuno ha deciso direttamente, qualcuno ha comunque deciso di delegare."
    - tutor: "Elegante, ma rischia il regresso all'infinito: chi ha delegato chi ha delegato? Non mi pare che regga, dottoressa."
    - learner: "Prof, su questo non sono mica d'accordo: il regresso si ferma al primo essere umano che poteva prevedere il rischio."
      errors: [register]
      gold: {text: "Prof, su questo non sono mica d'accordo", fix: "Professore, su questo non sono d'accordo"}
    - tutor: "L'argomento c'è. Il tono, però: «Prof, non sono mica d'accordo»... davanti a una commissione di dottorato, come lo riformulerebbe?"
      goals: [objection]
      prompt: {text: "Prof, su questo non sono mica d'accordo", tags: [register]}
    - learner: "Mi perdoni, professore: mi permetto di dissentire. Ammetto, comunque, che il criterio della prevedibilità, applicato a sistemi che apprendono da soli, diventa fragile."
    - tutor: "Concessione onesta, che le fa onore. Ora mi dia una conclusione rigorosa, in una frase."
      goals: [concede]
    - learner: "Concludo così: anche qualora una macchina agisse in modo imprevedibile, la responsabilità morale resterebbe umana, perché solo un essere umano può scegliere di accettarne il rischio."
    - tutor: "Rigorosa e difendibile. Non l'ho convinta, e lei non ha convinto me: segno che il seminario è riuscito."
      goals: [conclude]

- scenario: notizie-attualita
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho seguita. In sintesi, il Comune vuole limitare gli affitti brevi nel centro storico a novanta notti l'anno, perché i residenti non trovano più casa."
    - tutor: "Esatto, novanta notti. Ma stamattina un sito diceva che il governo avrebbe bloccato tutto. Tu che ne pensi?"
      goals: [summarise]
    - learner: "Che quella notizia è già stata negata dal ministero, l'ho letto mezz'ora fa. Comunque io sono favorevole: in una città dove un monolocale costa novecento euro, qualcosa bisogna fare."
      errors: [word-choice]
    - tutor: "Già smentita? Allora quel sito ci ha marciato un'altra volta. E tu dove l'hai letto, che fonti hai?"
      goals: [opinion]
      recast: {text: "negata", fix: "smentita", tags: [word-choice]}
    - learner: "In un periodico spagnolo che ha un corrispondente a Roma, e poi sul sito del Comune, che ha pubblicato la delibera integrale."
      errors: [false-friend]
    - tutor: "L'hai letto in un quotidiano spagnolo e poi nella delibera originale: fonti migliori delle mie, lo ammetto. Ma secondo te i proprietari rispetteranno il limite?"
      goals: [sources]
      recast: {text: "In un periodico", fix: "in un quotidiano", tags: [false-friend]}
    - learner: "Onestamente pensavo che il limite riguardava solo chi possiede più appartamenti, invece vale per tutti. Questo creerà parecchi malumori."
      errors: [subjunctive-use]
      gold: {text: "riguardava", fix: "riguardasse"}
    - tutor: "Malumori garantiti. Ma «pensavo che il limite riguardava»: dopo «pensavo che», quale modo ci vuole?"
      prompt: {text: "riguardava", tags: [subjunctive-use]}
    - learner: "Il congiuntivo imperfetto: pensavo che riguardasse solo i grandi proprietari. Comunque le conseguenze si vedranno presto: o calano gli affitti, o calano i turisti."
    - tutor: "O magari tutte e due le cose. Io scommetto su una pioggia di ricorsi, ma vedremo: ne riparliamo fra sei mesi!"
      goals: [consequences]

- scenario: dibattito-ambiente
  level: C2
  persona: en-m-heritage
  history: [relative-pronoun]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Un disastro mi sembra eccessivo. Io sono per una via di mezzo: chiusura totale nei fine settimana e, nei giorni feriali, una zona a traffico limitato dalle dieci alle diciotto."
    - tutor: "Una via di mezzo, eh? Mi sa che scontenterà tutti. Perché dovremmo farlo?"
      goals: [position]
    - learner: "Perché l'aria in centro è tra le più contaminate della regione, e chi ne paga il prezzo sono i bambini delle due scuole elementari in piazza."
      errors: [word-choice]
    - tutor: "Che l'aria sia tra le più inquinate della regione è vero, lo dicono le centraline. Ma i negozianti, molti dei quali sono già in difficoltà, come la mettiamo?"
      goals: [argue]
      recast: {text: "più contaminate", fix: "più inquinate", tags: [word-choice]}
    - learner: "La colpa non è delle auto: è dei centri commerciali, i quali hanno portato via la clientela già vent'anni fa. Le strade chiuse, al contrario, attirano gente a piedi, la cui spesa media è più alta."
    - tutor: "Dati alla mano? Perché, da quello che vedo io, la gente a piedi guarda le vetrine e poi compra online."
      goals: [counter]
    - learner: "Ci sono studi su diverse città europee, che molti di loro mostrano un aumento delle vendite dopo la chiusura."
      errors: [relative-pronoun]
      gold: {text: "che molti di loro", fix: "molti dei quali"}
    - tutor: "Ah sì? Ma «studi, che molti di loro mostrano»: c'è un modo più preciso di agganciare la relativa?"
      prompt: {text: "che molti di loro", tags: [relative-pronoun]}
    - learner: "Studi, molti dei quali mostrano un aumento delle vendite. Le concedo però che senza parcheggi di scambio la misura andrebbe a discapito per chi abita fuori città."
      errors: [preposition]
      gold: {text: "a discapito per", fix: "a discapito di"}
    - tutor: "Esatto, e la concessione la apprezzo. Ma «a discapito per chi abita fuori»: quale preposizione regge «a discapito»?"
      goals: [concede]
      prompt: {text: "a discapito per", tags: [preposition]}
    - learner: "A discapito di chi abita fuori città. Quindi: parcheggi gratuiti alle porte del centro e navette ogni dieci minuti."
    - tutor: "Messa così, perfino io potrei firmare. Portiamola insieme all'assemblea di quartiere, giovedì."

- scenario: seminario-etica
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "La ringrazio, professore: il dubbio è il benvenuto. La mia tesi pretende dimostrare che senza la capacità di soffrire una pena non ha senso, e quindi non ha senso neanche la responsabilità."
      errors: [false-friend]
    - tutor: "La sua tesi intende dimostrare, dunque, che responsabilità e pena vanno insieme. Ma non è un'idea un po' antiquata della responsabilità?"
      goals: [thesis]
      recast: {text: "pretende dimostrare", fix: "intende dimostrare", tags: [false-friend]}
    - learner: "Non credo. Bisogna distinguere tra responsabilità come risarcimento e responsabilità come colpa. Una macchina può causare un danno; una persona, in cambio, può anche pentirsene."
      errors: [false-friend]
    - tutor: "Una persona, invece, può pentirsi: distinzione chiara. Ma se le dicessi che anche un sistema può «correggersi» dopo un errore?"
      goals: [distinguish]
      recast: {text: "in cambio", fix: "invece", tags: [false-friend]}
    - learner: "Correggersi non è pentirsi. Qualora un sistema sarebbe in grado di modificare il proprio comportamento, lo farebbe per ottimizzare un risultato, non perché riconosce un torto."
      errors: [subjunctive-use]
      gold: {text: "sarebbe in grado", fix: "fosse in grado"}
    - tutor: "Risposta efficace. Ma «qualora un sistema sarebbe in grado»: dopo «qualora», quale modo serve?"
      goals: [objection]
      prompt: {text: "sarebbe in grado", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: qualora un sistema fosse in grado di correggersi, lo farebbe per calcolo, non per coscienza. Le concedo però che anche molti esseri umani si pentono solo per convenienza."
    - tutor: "Concessione pericolosa per la sua tesi, ma onesta. Mi dia ora la conclusione."
      goals: [concede]
    - learner: "Concludo: si può chiedere conto a una macchina dei suoi effetti, ma non si può chiederle di rendere conto delle sue ragioni; e senza ragioni non c'è colpa."
    - tutor: "Formulazione elegante, quasi un aforisma. La metta come ultima frase della tesi."
      goals: [conclude]

# Round 5b, set v-c2. File 2: interviews, promotions, meetings, pitches and negotiations.
- scenario: colloquio-lavoro
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, e grazie per avermi ricevuta. Sono di Valencia, insegno spagnolo da quindici anni e da cinque coordino il dipartimento di lingue di un liceo di Bologna."
    - tutor: "Un profilo interessante. Che cosa fa, esattamente, come coordinatrice?"
      goals: [intro]
    - learner: "Organizzo gli orari, seguo i colleghi più giovani e mi occupo degli scambi con l'estero. L'anno scorso ho realizzato che il nostro programma di scambi era fermo da anni e l'ho rilanciato."
      errors: [false-friend]
    - tutor: "Quindi ha capito che il programma si era arenato e se n'è fatta carico lei: è proprio il tipo di iniziativa che cerchiamo. Quali sono, secondo lei, i suoi punti di forza?"
      goals: [experience]
      recast: {text: "realizzato", fix: "capito", tags: [false-friend]}
    - learner: "Direi la capacità di mediare: nei consigli di classe riesco quasi sempre a trovare un punto d'incontro. Il mio difetto è che fatico a delegare, per cui a volte mi carico di troppo lavoro."
    - tutor: "Una risposta onesta, e il difetto non è raro. Perché ha deciso di lasciare la scuola statale per una scuola di lingue privata?"
      goals: [strengths]
    - learner: "Perché vorrei lavorare con adulti motivati, e mi interesserebbe molto progettare corsi su misura per le aziende. Nella scuola pubblica, per quanto ci si impegna, i margini sono stretti."
      errors: [subjunctive-use]
      gold: {text: "per quanto ci si impegna", fix: "per quanto ci si impegni"}
    - tutor: "Capisco bene la motivazione. Solo una cosa: «per quanto ci si impegna». Con «per quanto» concessivo, il verbo Le suona giusto?"
      goals: [why]
      prompt: {text: "per quanto ci si impegna", tags: [subjunctive-use]}
    - learner: "Ah no, scusi: per quanto ci si impegni. Posso farle io una domanda? Come è organizzata la formazione dei docenti, da voi?"
    - tutor: "Certo. Abbiamo un incontro interno al mese e ogni anno finanziamo un corso esterno a scelta. Se entrerà nel nostro gruppo, sarà proprio lei a coordinare tutto. La ricontatteremo entro venerdì."
      goals: [questions]

- scenario: colloquio-promozione
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Vorrei fare il punto sull'ultimo anno: il mio gruppo ha chiuso tre progetti su tre nei tempi previsti e abbiamo ridotto i costi di manutenzione del diciotto per cento."
    - tutor: "Risultati che conosco e che apprezzo. Immagino però che non sia venuto solo per ricordarmeli."
      goals: [results]
    - learner: "No, infatti. Penso di essermi meritato la posizione di responsabile d'area, e vorrei che la mia candidatura venga presa in considerazione."
      errors: [subjunctive-use]
      gold: {text: "venga presa", fix: "venisse presa"}
    - tutor: "Me lo aspettavo, e ne possiamo parlare. Ma «vorrei che la mia candidatura venga presa»: dopo un condizionale, quale tempo del congiuntivo chiede la concordanza?"
      prompt: {text: "venga presa", tags: [subjunctive-use]}
    - learner: "Il congiuntivo imperfetto: vorrei che venisse presa in considerazione. Mi rendo conto di essere il più giovane del gruppo, ma credo che i risultati parlino da soli."
    - tutor: "Esatto. Il problema, glielo dico francamente, non è l'età: la direzione teme che Lei non abbia ancora esperienza nella gestione di un budget."
      goals: [request]
    - learner: "Lo capisco. Però l'anno scorso, quando Marta era in maternità, ho gestito io il budget del reparto per sei mesi, e non abbiamo mai sforato, invece abbiamo risparmiato il quattro per cento."
      errors: [word-choice]
    - tutor: "Questo non lo sapevo: nessuno sforamento, anzi un risparmio. Cambia parecchio le cose. Mi mandi i rendiconti, li allego alla mia proposta."
      goals: [handle]
      recast: {text: "invece", fix: "anzi", tags: [word-choice]}
    - learner: "Volentieri. Quindi, se ho capito bene, la decisione verrà presa a gennaio? Nel caso in cui fosse negativa, mi piacerebbe sapere su quali competenze lavorare."
    - tutor: "Esatto, a gennaio, insieme alle altre nomine. Se fosse negativa, ne parleremmo subito per costruire insieme un percorso; ma, se fossi in Lei, non partirei sconfitto."
      goals: [next-steps]

- scenario: riunione-lavoro
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Il nuovo sito del museo è quasi pronto: mancano le traduzioni in tedesco e qualche test sui telefoni più vecchi."
    - tutor: "Ottimo. E le traduzioni quando arrivano?"
      goals: [update]
    - learner: "Ecco, è proprio questo il punto: l'agenzia ci ha chiesto altre due settimane, in barba al contratto, che parlava di dieci giorni."
    - tutor: "Due settimane? Ma l'inaugurazione è il quindici! Hai un'idea per uscirne?"
      goals: [problem]
    - learner: "Pensavo di dividere il lavoro: i testi principali li traduce l'agenzia, le schede delle singole opere le affidiamo a un collega tedesco del reparto grafico, che sarebbe interessato in farlo come lavoro extra."
      errors: [preposition]
      gold: {text: "interessato in farlo", fix: "interessato a farlo"}
    - tutor: "Idea furba. Però ripeti un attimo: «sarebbe interessato in farlo»? Con «interessato», quale preposizione regge l'infinito?"
      prompt: {text: "interessato in farlo", tags: [preposition]}
    - learner: "Interessato a farlo, scusa. Così l'agenzia avrebbe meno testi e potrebbe consegnare entro il dieci."
    - tutor: "Mi piace. Ne parlo io con il suo responsabile, così non sembra che glielo rubiamo."
      goals: [proposal]
    - learner: "Grazie. Allora fissiamo il dieci per le traduzioni e il dodici per i test, così avremo tre giorni di margine nel caso in cui qualcosa andrà storto."
      errors: [subjunctive-use]
      gold: {text: "nel caso in cui qualcosa andrà storto", fix: "nel caso in cui qualcosa vada storto"}
    - tutor: "Il margine mi piace. Però «nel caso in cui qualcosa andrà storto»: dopo «nel caso in cui», il futuro ti convince?"
      prompt: {text: "nel caso in cui qualcosa andrà storto", tags: [subjunctive-use]}
    - learner: "Allora... nel caso in cui qualcosa andrebbe storto?"
      errors: [subjunctive-use]
    - tutor: "Ecco, nel caso in cui qualcosa vada storto, quei tre giorni ci salvano la pelle. Allora segno il dieci e il dodici nel calendario condiviso?"
      recast: {text: "nel caso in cui qualcosa andrebbe storto", fix: "nel caso in cui qualcosa vada storto", tags: [subjunctive-use]}
    - learner: "Sì, mettile pure in calendario. Io intanto scrivo all'agenzia per confermare la consegna ridotta."
    - tutor: "Perfetto: traduzioni il dieci, test il dodici e inaugurazione tranquilla il quindici. Buon lavoro!"
      goals: [deadline]

- scenario: presentazione-progetto
  level: C2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "In breve: vogliamo digitalizzare l'archivio dei progetti tecnici. Oggi un ingegnere perde in media due ore alla settimana a cercare disegni vecchi, spesso solo cartacei."
    - tutor: "Due ore a testa? Con duecento ingegneri non è poco. Come funzionerebbe, in pratica?"
      goals: [pitch]
    - learner: "Il progetto consiste di tre fasi: la scansione dei disegni, la classificazione con un software di riconoscimento e, infine, la formazione del personale."
      errors: [preposition]
      gold: {text: "consiste di", fix: "consiste in"}
    - tutor: "Chiaro e ben strutturato. Ma una precisione, visto che lo metterà per iscritto: «consiste di tre fasi»? Il verbo «consistere» quale preposizione vuole?"
      prompt: {text: "consiste di", tags: [preposition]}
    - learner: "Ha ragione: consiste in tre fasi. È un calco dall'inglese che mi scappa sempre."
    - tutor: "Capita a molti. E i benefici, oltre al tempo risparmiato?"
    - learner: "Ridurremmo gli errori dovuti a versioni superate e proteggeremmo meglio le nostre soluzioni tecniche: due di quei disegni sono alla base di una patente che abbiamo depositato nel 2019."
      errors: [false-friend]
    - tutor: "Un brevetto che poggia su disegni introvabili: questo il consiglio lo capirà al volo. Ma i costi? Se le dicessi che il budget dell'anno è già chiuso?"
      goals: [benefits]
      recast: {text: "una patente", fix: "un brevetto", tags: [false-friend]}
    - learner: "Le risponderei che, se il progetto partisse a gennaio, si ripagherebbe in meno di due anni con le sole ore risparmiate. E potremmo cominciare da un reparto pilota, in modo da contenere la spesa iniziale."
    - tutor: "Argomento solido, e il reparto pilota mi convince. Mi manda qualcosa di scritto entro lunedì?"
      goals: [objection]
    - learner: "Certo, lunedì mattina, con la proposizione di budget per il reparto pilota e un calendario di massima."
      errors: [false-friend]
    - tutor: "Benissimo: la proposta di budget e il calendario, lunedì mattina. Chi metterebbe a capo del reparto pilota?"
      recast: {text: "la proposizione di budget", fix: "la proposta di budget", tags: [false-friend]}
    - learner: "Pensavo all'ingegner Ferri: è il più scettico di tutti, e se convinciamo lui, convinciamo chiunque."
    - tutor: "Scelta astuta, approvo. Ci rivediamo martedì con i documenti in mano."
      goals: [next-steps]

- scenario: trattativa-fornitore
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per quello. Un aumento del dodici per cento sulle farine, da un mese all'altro, per un'azienda piccola come la nostra è difficile da assumere."
      errors: [false-friend]
    - tutor: "Capisco che sia difficile da assorbire, non lo nego. Ma il grano duro, quest'anno, a noi è costato il venti per cento in più."
      goals: [problem]
      recast: {text: "assumere", fix: "assorbire", tags: [false-friend]}
    - learner: "Lo so, e non metto in dubbio la sua buona fede. Ma lavoriamo insieme da undici anni, abbiamo sempre pagato a trenta giorni e non abbiamo mai chiesto deroghe. Questo, credo, dovrebbe pur contare qualcosa."
    - tutor: "Conta eccome, e glielo riconosco: siete tra i clienti più affidabili che abbiamo. Ha una proposta?"
      goals: [argue]
    - learner: "Sì. Basterebbe che ci concedete un aumento del sei per cento fino a giugno: in cambio, raddoppieremmo l'ordine minimo mensile."
      errors: [subjunctive-use]
      gold: {text: "ci concedete", fix: "ci concedeste"}
    - tutor: "Interessante. Ma «basterebbe che ci concedete»: dopo un condizionale come «basterebbe», il verbo della subordinata come va?"
      prompt: {text: "ci concedete", tags: [subjunctive-use]}
    - learner: "Ci concedeste, certo, al congiuntivo imperfetto. E con l'ordine raddoppiato, il vostro margine resterebbe praticamente invariato."
    - tutor: "Esatto. Il sei, però, è troppo poco: potrei arrivare all'otto, con ordine doppio e prezzo bloccato fino a settembre."
      goals: [counteroffer]
    - learner: "L'otto fino a settembre... va bene, a patto che le consegne restino settimanali e che il prezzo venga rivisto insieme a fine estate."
    - tutor: "Affare fatto: otto per cento, ordine doppio, consegne settimanali e revisione congiunta a settembre. Le mando la conferma scritta entro oggi."
      goals: [agreement]

- scenario: mediazione-colleghi
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Certo, si sieda pure. Mi dispiace che sia andata così: mi racconti con calma che cosa l'ha ferita."
    - tutor: "Ieri, davanti a tutti, ha detto che la mia parte del report era «superficiale». Ci ho lavorato tre settimane, anche di sera."
      goals: [listen]
    - learner: "Capisco. Se ricordo bene, ho detto che alcune parti erano state scritte di fretta, non che tutto il lavoro fosse superficiale. Ma forse la mia attitudine, in quel momento, era troppo brusca."
      errors: [false-friend]
    - tutor: "Il suo atteggiamento, sì, mi ha colpito più delle parole. Ma lo sa che i dati del cliente mi sono arrivati solo il giorno prima?"
      goals: [clarify]
      recast: {text: "attitudine", fix: "atteggiamento", tags: [false-friend]}
    - learner: "No, questo non lo sapevo. Credevo che li ha ricevuti insieme agli altri, la settimana prima."
      errors: [subjunctive-use]
      gold: {text: "Credevo che li ha ricevuti", fix: "Credevo che li avesse ricevuti"}
    - tutor: "No, nessuno gliel'aveva detto. Ma «credevo che li ha ricevuti»: dopo «credevo che», quale modo e quale tempo servono?"
      prompt: {text: "Credevo che li ha ricevuti", tags: [subjunctive-use]}
    - learner: "Credevo che li avesse ricevuti, scusi. Comunque, se l'avessi saputo, avrei presentato quelle tabelle come provvisorie, e Lei non si sarebbe trovata in imbarazzo."
    - tutor: "Ecco, questo lo apprezzo. Giorgio me li ha girati martedì sera: forse avrei dovuto dirlo io, all'inizio della riunione."
      goals: [perspective]
    - learner: "Facciamo così: d'ora in poi, prima di ogni riunione con il cliente, ci vediamo dieci minuti noi due per fare il punto sui dati. E con Giorgio ci parlo io."
    - tutor: "Mi sembra una soluzione giusta, grazie. E il report lo sistemo entro venerdì, così lo mandiamo al cliente in versione definitiva."
      goals: [solution]

- scenario: colloquio-promozione
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Sono qui da tre anni e in questo periodo ho seguito l'apertura del mercato portoghese: oggi vale il quindici per cento del nostro fatturato estero."
    - tutor: "Lo so bene, e Lisbona è stata una sua scommessa vinta. Mi dica pure."
      goals: [results]
    - learner: "Nel frattempo ho anche realizzato un master serale in gestione d'impresa, a spese mie. Per questo vorrei proporle di diventare responsabile per la penisola iberica."
      errors: [false-friend]
    - tutor: "Ha frequentato un master serale a sue spese? Non lo sapevo, ed è un punto a suo favore. La posizione, però, al momento non esiste."
      goals: [request]
      recast: {text: "realizzato un master", fix: "frequentato un master", tags: [false-friend]}
    - learner: "Lo so, ma potrebbe essere creata senza costi aggiuntivi, accorpando due ruoli che oggi si sovrappongono. E devo essere sincera: qui mi trovo bene, pertanto un'altra azienda mi ha fatto un'offerta."
      errors: [word-choice]
    - tutor: "Apprezzo la franchezza: si trova bene, tuttavia ha un'offerta in tasca. È una posizione di forza, e lo sa. Ma la direzione teme che una nomina così rapida crei malumori nel gruppo."
      recast: {text: "pertanto", fix: "tuttavia", tags: [word-choice]}
    - learner: "È comprensibile. Ma i colleghi lavorano già con me ogni giorno sul mercato iberico, e mi pare che nessuno abbia mai messo in discussione il mio ruolo di fatto."
    - tutor: "Su questo ha ragione: anzi, Paolo mi ha detto proprio la settimana scorsa che senza di lei si sentirebbe perso."
      goals: [handle]
    - learner: "Allora, se possibile, vorrei una risposta entro fine mese, perché l'altra offerta scade il cinque."
    - tutor: "Glielo prometto: porto la proposta in comitato giovedì e le do una risposta entro il trenta. E, se posso permettermi, non firmi niente prima."
      goals: [next-steps]

- scenario: presentazione-progetto
  level: C2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "In due parole: un asilo nido aziendale nell'ex magazzino del piano terra. Abbiamo quaranta dipendenti con figli sotto i tre anni, e il nido comunale ha una lista d'attesa di otto mesi."
    - tutor: "Tema delicato, e costoso. Perché dovrebbe interessare all'azienda, e non solo ai genitori?"
      goals: [pitch]
    - learner: "Perché l'anno scorso abbiamo perso sei persone qualificate dopo la maternità. Sostituirle ci è costato più di quanto costerebbe il nido in due anni, ed è una roba che si poteva evitare."
      errors: [register]
      gold: {text: "è una roba che si poteva evitare", fix: "è un costo che si sarebbe potuto evitare"}
    - tutor: "Il dato è fortissimo. Ma «una roba che si poteva evitare», detto davanti al consiglio di amministrazione, come suonerebbe?"
      prompt: {text: "è una roba che si poteva evitare", tags: [register]}
    - learner: "Troppo colloquiale, ha ragione. Direi: «ed è un costo che si sarebbe potuto evitare»."
    - tutor: "Perfetto. Ma la gestione? Personale, assicurazioni, norme di sicurezza..."
      goals: [benefits]
    - learner: "Non lo gestiremmo noi: ci affideremmo a una cooperativa accreditata, in vista alla convenzione che la Regione rinnova a marzo e che copre fino al trenta per cento dei costi."
      errors: [preposition]
      gold: {text: "in vista alla", fix: "in vista della"}
    - tutor: "La convenzione regionale: questo cambia molto. Però «in vista alla convenzione»? Con «in vista», quale preposizione serve davvero?"
      prompt: {text: "in vista alla", tags: [preposition]}
    - learner: "In vista dalla convenzione?"
      errors: [preposition]
    - tutor: "In vista della convenzione, allora, i tempi sono stretti: chi preparerebbe la domanda per la Regione?"
      goals: [objection]
      recast: {text: "In vista dalla", fix: "in vista della", tags: [preposition]}
    - learner: "Me ne occupo io, insieme all'ufficio del personale. Se il consiglio dà il via libera a dicembre, potremmo aprire a settembre."
    - tutor: "D'accordo: mi porti un piano economico dettagliato per il consiglio di dicembre. Se i numeri tengono, avrà il mio appoggio."
      goals: [next-steps]

# Round 5b, set v-c2. File 6: dialects, translation, idioms, satire and a radio interview.
- scenario: dialetti-regionali
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Ho capito sì e no la metà, ma ho riso per come gesticolavano: sembrava che stessero litigando, e invece credo si stessero solo salutando."
    - tutor: "Esatto, si stavano salutando, e pure con affetto! Che cosa ti ha colpito, a parte i gesti?"
      goals: [notice]
    - learner: "Una parola che hanno ripetuto mille volte, «uè». E poi una frase, qualcosa come «Jamme bell'», di cui non ho capito il senso."
    - tutor: "Vuol dire più o meno «dai, andiamo»: a Napoli si usa per tutto, anche per fare coraggio a qualcuno."
      goals: [example]
    - learner: "Bellissimo. In italiano standard, quindi, si direbbe «forza, andiamo»? Mi sembra che si perde tutta la musicalità."
      errors: [subjunctive-use]
      gold: {text: "si perde", fix: "si perda"}
    - tutor: "Forza, andiamo, sì. Ma «mi sembra che si perde»: dopo «mi sembra che», il verbo come lo metteresti?"
      goals: [standard]
      prompt: {text: "si perde", tags: [subjunctive-use]}
    - learner: "Che si perda, scusa. Tu che sei un linguista, pensi che i dialetti siano destinati a sparire?"
    - tutor: "Al contrario: i ragazzi lo scrivono sui social e lo cantano nel rap. Cambia, ma non muore. Tu che idea ti sei fatto?"
    - learner: "Che sia una ricchezza da insegnare anche a scuola. In Scozia, dove sono cresciuto, in alcune scuole si insegna lo scots, e i ragazzi sono orgogliosi di esso."
      errors: [ci-ne]
      gold: {text: "sono orgogliosi di esso", fix: "ne sono orgogliosi"}
    - tutor: "Idea bellissima. Ma «sono orgogliosi di esso» suona da manuale di grammatica: c'è una particella che lo direbbe in modo molto più naturale."
      goals: [opinion]
      prompt: {text: "sono orgogliosi di esso", tags: [ci-ne]}
    - learner: "Ah, certo: ne sono orgogliosi. Forse un giorno succederà anche qui, chissà."
    - tutor: "Chissà! Intanto, se torni a Napoli, ti porto a sentire un po' di rap in dialetto: ne uscirai quasi madrelingua."

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Me l'aspettavo. Il problema è la scena del funerale: nell'originale lei «pretended not to care», e io ho scritto «pretendeva di non curarsene», che però in italiano vuol dire un'altra cosa."
    - tutor: "Appunto: «pretendere» lì è un falso amico da manuale, e ci sei cascata in pieno. Che alternative hai?"
      goals: [problem, false-friend]
    - learner: "Due: «fingeva che non le importasse» oppure «faceva finta di niente». La prima è più fedele, ma non sono sicura che rende il tono ironico dell'originale."
      errors: [subjunctive-use]
      gold: {text: "rende il tono", fix: "renda il tono"}
    - tutor: "Dubbio legittimo. Ma «non sono sicura che rende»: con un dubbio così, quale modo si aspetta il lettore?"
      goals: [options]
      prompt: {text: "rende il tono", tags: [subjunctive-use]}
    - learner: "Che renda, certo. La seconda, comunque, è più colloquiale e fa giustizia alla voce della protagonista, che parla sempre come al bar."
      errors: [word-choice]
    - tutor: "Rende giustizia alla voce, d'accordo, ma attenzione: «far finta di niente» cancella il dettaglio del non curarsene. Ne vale la pena?"
      recast: {text: "fa giustizia alla voce", fix: "rende giustizia alla voce", tags: [word-choice]}
    - learner: "Secondo me sì: se l'avessi tradotta alla lettera, il lettore italiano avrebbe sentito la traduttrice, non lei. E ho fatto una revisione molto comprensiva del capitolo per controllare il registro."
      errors: [false-friend]
    - tutor: "Una revisione molto approfondita, si vede, e per una volta non ho niente da ridire. Quindi, decisione finale?"
      recast: {text: "molto comprensiva", fix: "molto approfondita", tags: [false-friend]}
    - learner: "«Faceva finta di niente», e scrivo una nota al redattore per spiegare la scelta. E grazie per la stroncatura: mi è servita più di cento complimenti."
    - tutor: "Ecco, così mi piaci. Nota breve, però: i redattori leggono solo le prime due righe."
      goals: [decide]

- scenario: modi-di-dire
  level: C2
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Lascia perdere, una giornata da dimenticare. Stamattina, entrando in ufficio, ho scoperto che il mio collega ha presentato il mio progetto al direttore il giorno prima, come se fosse suo."
      errors: [tense-aspect]
      gold: {text: "ha presentato", fix: "aveva presentato"}
    - tutor: "Cosa?! Aspetta, però: «ho scoperto che ha presentato il giorno prima». Un'azione anteriore a un'altra già passata: che tempo ci vuole?"
      prompt: {text: "ha presentato", tags: [tense-aspect]}
    - learner: "Il trapassato: aveva presentato il mio progetto. E il direttore gli aveva già fatto i complimenti davanti a tutti."
    - tutor: "Che faccia tosta! Altro che collega: quello è un lupo travestito da agnello."
      goals: [tell]
    - learner: "Esatto, e io sembravo l'ultima arrivata. Il bello è che due settimane fa gli avevo chiesto un consiglio proprio su quel progetto: ho gettato le perle ai porci."
    - tutor: "Ma no, non è colpa tua se ti fidi delle persone! La colpa è tutta sua, e un po' del direttore, che non si è accorto di niente."
      goals: [react, blame]
    - learner: "Comunque domani porto al direttore le mail con le date, così si vede chi l'ha scritto davvero. Quel tipo è come una capra, se pensava di farla franca."
      errors: [word-choice]
    - tutor: "Quello è matto da legare, sì, se pensava che nessuno controllasse le date! Con le mail in mano hai il coltello dalla parte del manico."
      recast: {text: "è come una capra", fix: "è matto da legare", tags: [word-choice]}
    - learner: "Esatto. E alla fine, chissà: non c'è male che per bene non venga. Magari adesso il direttore si ricorderà di me."
      errors: [word-choice]
    - tutor: "Non tutto il male vien per nuocere, giusto: magari ne esci con una promozione! E la morale della storia, qual è?"
      recast: {text: "non c'è male che per bene non venga", fix: "non tutto il male vien per nuocere", tags: [word-choice]}
    - learner: "La morale è che le idee buone si condividono, sì, ma solo dopo averle mandate per mail, con tanto di data!"
    - tutor: "Parole d'oro: fidarsi è bene, non fidarsi è meglio. Dai, il caffè lo offro io."
      goals: [moral]

- scenario: umorismo-satira
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Ammetto tutto: non l'avevo capita. Ho riso solo perché ridevi tu, e se non avessi riso mi avresti preso in giro per il resto della serata."
    - tutor: "Ovviamente! Ti spiego: il ministro aveva detto in un'intervista che la carbonara con la panna era «un'evoluzione». Mezza Italia era insorta."
      goals: [missed]
    - learner: "Adesso capisco! Allora, quando l'attore ha detto che la prossima evoluzione sarebbe stata la pizza con l'ananas, era una frecciata al ministro."
    - tutor: "Esatto. E tu quale battuta hai preferito, di tutta la serata?"
    - learner: "Quella sui treni regionali: «In Italia i treni arrivano sempre puntuali, solo che non si sa a quale orario». Mi fa ridere perché lo vivo sulla mia pelle ogni mattina."
    - tutor: "Era la migliore, sono d'accordo. Ma sai spiegarmi perché funziona? Prova a smontare il gioco di parole."
      goals: [favourite]
    - learner: "Credo che giochi su «puntuale»: se un treno è puntuale rispetto a un orario qualsiasi, allora lo è sempre. È come se l'attore avrebbe ribaltato la logica."
      errors: [subjunctive-use]
      gold: {text: "avrebbe ribaltato", fix: "avesse ribaltato"}
    - tutor: "Analisi perfetta. Ma «come se l'attore avrebbe ribaltato»: dopo «come se», quale modo ci vuole?"
      goals: [wordplay]
      prompt: {text: "avrebbe ribaltato", tags: [subjunctive-use]}
    - learner: "Come se avesse ribaltato la logica, ecco. Però non tutto mi è piaciuto: la battuta sui malati di cancro, secondo me, era senza gusto."
      errors: [word-choice]
    - tutor: "Di cattivo gusto, sì, e infatti in sala qualcuno ha smesso di ridere. Ma allora, per te, la satira deve avere dei limiti?"
      recast: {text: "senza gusto", fix: "di cattivo gusto", tags: [word-choice]}
    - learner: "Sì: dovrebbe colpire i potenti, non i deboli. Se ride solo chi sta meglio, non è satira: è bullismo con il microfono."
    - tutor: "«Bullismo con il microfono»: questa la rubo e la rivendo al prossimo spettacolo! Andiamo a berci qualcosa, dai."
      goals: [limits]

- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere essere qui. Il libro si intitola «Gli italiani spiegati a mia madre»: sono lettere immaginarie a mia madre, che vive a Siviglia e non capisce perché io sia rimasta qui."
    - tutor: "Titolo irresistibile. E il libro sta andando molto bene, mi dicono."
      goals: [present-book]
    - learner: "Sì, ha avuto un esito che non mi aspettavo, soprattutto tra gli italiani, il che mi diverte molto."
      errors: [false-friend]
    - tutor: "Un successo che non si aspettava, eppure il libro tocca un nervo scoperto: gli stereotipi. Ce n'è uno che smentisce?"
      recast: {text: "un esito", fix: "un successo", tags: [false-friend]}
    - learner: "Quello del ritardo. Gli italiani arrivano tardi a cena, sì, ma in ufficio sono puntualissimi. Non credo che qualcuno si è offeso, comunque: i lettori ci ridono sopra."
      errors: [subjunctive-use]
      gold: {text: "si è offeso", fix: "si sia offeso"}
    - tutor: "Ci ridono sopra, è vero. Però «non credo che qualcuno si è offeso»: dopo «non credo che», per un fatto passato, quale tempo serve?"
      goals: [stereotype]
      prompt: {text: "si è offeso", tags: [subjunctive-use]}
    - learner: "Il congiuntivo passato: non credo che qualcuno si sia offeso. Anzi, un signore mi ha scritto per dirmi che finalmente sua moglie lo capisce."
    - tutor: "Magnifico! E ci regala un aneddoto dei suoi primi giorni in Italia?"
    - learner: "Certo. Quando sono arrivata a Torino, non ho parlato una parola di italiano, e la prima settimana ho avuto un'avventura in farmacia."
      errors: [tense-aspect]
      gold: {text: "non ho parlato una parola", fix: "non parlavo una parola"}
    - tutor: "Già sento ridere la regia! Ma prima: «quando sono arrivata, non ho parlato una parola»... era un evento o una condizione?"
      prompt: {text: "non ho parlato una parola", tags: [tense-aspect]}
    - learner: "Una condizione: non parlavo una parola di italiano. E così, raffreddata com'ero, ho chiesto qualcosa per il «costipato», come diciamo noi, e mi hanno dato un lassativo."
    - tutor: "Una storia che vale il libro intero! E oggi l'italiano e lo spagnolo, nella sua testa, come convivono?"
      goals: [anecdote]
    - learner: "Convivono, ma litigano spesso: quando sono stanca, mi escono frasi metà e metà. Mia figlia dice che parlo «itañolo»."
    - tutor: "L'itañolo: un'altra lingua da tutelare! Grazie di essere stata con noi, e in bocca al lupo per il libro."
      goals: [language, farewell]

- scenario: traduzione-sfumature
  level: C2
  persona: es-m-worker
  history: [conditional-form]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, me l'hanno già detto. Il problema è il dialogo tra i fratelli: in spagnolo si danno del «usted» per ironia, e in italiano il Lei tra fratelli suona solo ridicolo."
    - tutor: "Ridicolo no: grottesco, il che forse è peggio. E allora che cosa proponi?"
      goals: [problem]
    - learner: "O manteniamo il Lei con un tono pomposo, o usiamo il tu con formule ironiche, tipo «Vostra Eccellenza». Pensavo che l'editore preferirebbe la seconda."
      errors: [conditional-form]
      gold: {text: "preferirebbe", fix: "avrebbe preferito"}
    - tutor: "«Vostra Eccellenza» tra fratelli: non male. Ma «pensavo che l'editore preferirebbe»: è un futuro nel passato, quale condizionale ci vuole?"
      goals: [options]
      prompt: {text: "preferirebbe", tags: [conditional-form]}
    - learner: "Il condizionale passato: pensavo che avrebbe preferito la seconda. Però non ne sono sicuro."
    - tutor: "Fai bene a dubitare. E già che ci siamo: a pagina dodici hai scritto «un largo silenzio». Ti dice niente?"
    - learner: "Ah, maledizione: «largo», in spagnolo, significa lungo! Un lungo silenzio, ovviamente. In italiano un silenzio largo è quasi un'immagine poetica, ma non è quello che dice l'autore."
    - tutor: "Esatto, e un lettore attento penserebbe a una scelta d'autore. Cerca gli altri «largo»: scommetto che ce ne sono."
      goals: [false-friend]
    - learner: "Lo farò stasera. Per i fratelli, invece, scelgo il tu con «Vostra Eccellenza», a meno che tu non preferisci mantenere il Lei."
      errors: [subjunctive-use]
      gold: {text: "non preferisci", fix: "non preferisca"}
    - tutor: "Ma «a meno che tu non preferisci»: con «a meno che», il verbo come va?"
      prompt: {text: "non preferisci", tags: [subjunctive-use]}
    - learner: "A meno che tu non preferisca, scusa. Due errori di fila: oggi non è la mia giornata."
    - tutor: "Lo diventerà, se trovi tutti i «largo» entro domani. Vada per il tu con «Vostra Eccellenza»: è la scelta giusta."
      goals: [decide]

- scenario: dialetti-regionali
  level: C2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Ho riso perché uno dei due ha detto qualcosa tipo «Statte zitto!» con una faccia tragica, e l'altro gli ha risposto ridendo. Non ci ho capito molto altro, a dire il vero."
    - tutor: "Stai zitto, sì: ma detto così è quasi una carezza! Hai notato altro?"
      goals: [notice]
    - learner: "Sì, la cadenza: le vocali finali quasi spariscono. Mi ricorda il dialetto in che sono cresciuto, nel nord dell'Inghilterra, dove le parole si mangiano a metà."
      errors: [relative-pronoun]
      gold: {text: "in che", fix: "in cui"}
    - tutor: "Paragone interessante. Ma «il dialetto in che sono cresciuto»: dopo una preposizione, quale relativo usiamo?"
      prompt: {text: "in che", tags: [relative-pronoun]}
    - learner: "In cui, certo: il dialetto in cui sono cresciuto. Da noi, per dire «ragazza», si dice «lass», e mia nonna non usava mai la parola standard."
    - tutor: "Proprio come a Napoli si dice «guagliona»: ogni regione ha le sue. E tua nonna si vergognava del dialetto, o ne andava fiera?"
      goals: [example]
    - learner: "Ne andava fierissima. Però a scuola ci correggevano, e molti miei compagni hanno smesso di parlarlo. Credo sia quello che è successo anche qui con l'italiano standard."
    - tutor: "Proprio così: negli anni Sessanta la scuola e la televisione hanno spinto tutti verso lo standard."
      goals: [standard]
    - learner: "Peccato. Secondo me si dovrebbe insegnare i dialetti come si insegnano le lingue straniere: non al posto dell'italiano, ma accanto."
      errors: [subject-verb-agreement]
      gold: {text: "si dovrebbe insegnare i dialetti", fix: "si dovrebbero insegnare i dialetti"}
    - tutor: "Proposta coraggiosa, mi piace. Ma «si dovrebbe insegnare i dialetti»: con quel «si», il verbo con che cosa si accorda?"
      prompt: {text: "si dovrebbe insegnare i dialetti", tags: [subject-verb-agreement]}
    - learner: "Con i dialetti: si dovrebbero insegnare. Mi sa che il congiuntivo non è l'unico tranello dell'italiano."
    - tutor: "No davvero! Sull'idea, però, hai ragione: lingua e dialetto non sono nemici. Siamo quasi a Napoli: se vuoi, ti presento due amici che ne parlano uno strettissimo."
      goals: [opinion]

- scenario: umorismo-satira
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Ehi, non è vero! Ho riso perché la battuta era molto graziosa, anche se, lo ammetto, il doppio senso mi è sfuggito."
      errors: [false-friend]
    - tutor: "Molto spiritosa, sì, ma tu ridevi a scoppio ritardato: ti ho vista! Allora, qual è la battuta che ti è piaciuta davvero?"
      recast: {text: "molto graziosa", fix: "molto spiritosa", tags: [false-friend]}
    - learner: "Quella sulla burocrazia: «In Italia, per avere un certificato che dice che sei vivo, devi prima dimostrare di non essere morto». Funziona perché è assurda, ma è quasi vera."
    - tutor: "Quasi?! A me è successo davvero. E la carbonara, allora? Vuoi che te la spieghi?"
      goals: [favourite]
    - learner: "Sì, ti prego. Volevo che me la spieghi già all'uscita, ma c'era troppa gente."
      errors: [subjunctive-use]
      gold: {text: "me la spieghi", fix: "me la spiegassi"}
    - tutor: "Te la spiego subito. Ma «volevo che me la spieghi»: dopo «volevo», quale congiuntivo serve?"
      goals: [missed]
      prompt: {text: "me la spieghi", tags: [subjunctive-use]}
    - learner: "Volevo che me la spiegassi, scusa. Allora, il ministro e la carbonara?"
    - tutor: "Il comico ha detto che il ministro «ha messo la panna sulla Costituzione»: la panna nella carbonara è un sacrilegio, e così lo accusava di rovinare una ricetta perfetta."
    - learner: "Ah, è un gioco tra cucina e politica! Allora ci provo io: «Il governo ha messo troppa pancetta: tanto grasso e poca sostanza»."
    - tutor: "Non male, quasi da professionista! Ma secondo te c'è un limite a quello che si può prendere in giro?"
      goals: [wordplay]
    - learner: "Secondo me no, purché si colpisca chi ha potere. Se ridessimo solo dei deboli, la satira diventerebbe la voce del più forte."
    - tutor: "Sottoscrivo parola per parola. Dai, andiamo a mangiarci una carbonara vera, senza panna e senza ministri."
      goals: [limits]

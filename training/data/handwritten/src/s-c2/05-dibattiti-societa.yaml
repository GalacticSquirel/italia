# Round 8, set s-c2, file 5: debates, news and society. Slips: «fa senso», «non è detto che» +
# indicative, «a seconda i giorni», «metà delle case è stato trasformato», «asequibili»,
# «ho letto che... spettassero» (subjunctive where a fact is reported), «se» + conditional,
# «eventualmente», «nessuno non», «si si» for «ci si», causal «perché» + subjunctive, «più lenta
# che quella», «distraente», «rimanerei», «dipende di», «ne ho pensato», «propine», «i migliaia»,
# «quei alberghi». Correct «ammetto che» + indicative, «argomento» (point) left alone.
- scenario: dibattito-ambiente
  level: C2
  persona: es-m-worker
  history: [word-choice, subjunctive-use]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco la preoccupazione dei commercianti, ma non sono d'accordo. Chiudere il centro alle auto fa molto senso, se nello stesso momento si potenziano i mezzi pubblici."
      errors: [word-choice]
    - tutor: "Ha molto senso, sostiene Lei, ma solo a quella condizione. E i mezzi pubblici di questa città li ha visti? Il 12 passa ogni quaranta minuti."
      goals: [position]
      recast: {text: "fa molto senso", fix: "ha molto senso", tags: [word-choice]}
    - learner: "Appunto, ed è il mio primo argomento: se il Comune togliesse le auto e insieme raddoppiasse le corse, la gente lascerebbe la macchina a casa. Il secondo è la salute: in via Roma l'inquinamento supera i limiti un giorno su tre."
    - tutor: "Sui dati dell'inquinamento non discuto. Ma i negozi? Chi viene dalla provincia a fare acquisti non ci verrà certo in autobus."
      goals: [argue]
    - learner: "Non è detto che i clienti spariscono. In molte città europee, dopo la chiusura del centro, i negozi hanno aumentato gli incassi, perché la gente passeggia e si ferma di più."
      errors: [subjunctive-use]
      gold: {text: "i clienti spariscono", fix: "i clienti spariscano"}
    - tutor: "Lo dicono molti studi, è vero. Ma «non è detto che i clienti spariscono»: con «non è detto che», quale modo serve?"
      prompt: {text: "i clienti spariscono", tags: [subjunctive-use]}
    - learner: "Non è detto che i clienti spariranno?"
      errors: [subjunctive-use]
    - tutor: "Che i clienti spariscano, d'accordo, non è detto. Ma i commercianti di via Roma hanno già perso il trenta per cento con i lavori dell'anno scorso: come li convince?"
      goals: [counter]
      recast: {text: "i clienti spariranno", fix: "i clienti spariscano", tags: [subjunctive-use]}
    - learner: "Ammetto che i lavori sono stati un colpo durissimo, e su questo ha ragione. Proporrei una sperimentazione di sei mesi, alla fine della quale si decide insieme, e un fondo per i negozi che ne hanno più bisogno."
    - tutor: "Una sperimentazione con un fondo per i negozi: su questo potrei perfino votare a favore. La propongo io stesso all'assemblea di giovedì."
      goals: [concede]

- scenario: turismo-di-massa
  level: C2
  persona: es-f-teacher
  history: [passive, articulated-preposition]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno, mi chiamo Paola e insegno storia dell'arte a Mestre. Sono a favore, a condizione che il ticket venga usato per i residenti e non per fare cassa."
    - tutor: "Posizione chiara. Però mi lasci fare l'avvocato del diavolo: cinque euro non hanno mai fermato nessuno."
      goals: [introduce]
    - learner: "Lo so, ma il punto non è fermare, è distribuire: il prezzo dovrebbe cambiare a seconda i giorni, come per i treni. Un sabato di agosto venti euro, un martedì di novembre niente."
      errors: [articulated-preposition]
      gold: {text: "a seconda i giorni", fix: "a seconda dei giorni"}
    - tutor: "Un prezzo dinamico, come per i voli. Ma «a seconda i giorni»: «a seconda» regge direttamente il nome, o vuole una preposizione?"
      prompt: {text: "a seconda i giorni", tags: [articulated-preposition]}
    - learner: "Vuole «di»: a seconda dei giorni. E l'esempio concreto è il Carnevale dell'anno scorso: in certe calli non si riusciva a camminare, e i residenti restavano chiusi in casa."
    - tutor: "Ricordo bene quelle immagini. Ma c'è chi dice che il ticket trasformi Venezia in un parco a tema: che cosa risponde?"
      goals: [example]
    - learner: "Che Venezia un parco a tema lo è già diventata, e non per colpa del ticket: ormai metà delle case del centro è stato trasformato in affittacamere."
      errors: [passive]
      gold: {text: "è stato trasformato", fix: "è stata trasformata"}
    - tutor: "Un dato pesante. Ma «metà delle case è stato trasformato»: il participio, qui, con che cosa si accorda?"
      prompt: {text: "è stato trasformato", tags: [passive]}
    - learner: "Con «metà»: metà delle case è stata trasformata in affittacamere."
    - tutor: "Esatto. Ci resta un minuto: qual è la Sua proposta concreta?"
      goals: [rebut]
    - learner: "Ticket variabile, numero chiuso nei giorni critici e tutti gli incassi investiti in case a prezzi asequibili per chi a Venezia ci vive e ci lavora."
      errors: [word-choice]
    - tutor: "Case a prezzi accessibili per chi ci vive e ci lavora: una proposta chiara, che giro subito all'assessore, nostro ospite dopo la pausa."
      goals: [proposal]
      recast: {text: "a prezzi asequibili", fix: "a prezzi accessibili", tags: [word-choice]}
    - learner: "Grazie a voi. E mi raccomando, chiedetegli anche entro quando."
    - tutor: "Glielo chiederemo, promesso. Restate con noi: dopo la pausa, l'assessore al turismo."

- scenario: notizie-attualita
  level: C2
  persona: en-f-student
  history: [subjunctive-use, hypothetical]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    - learner: "Se ho capito bene, chi affitta per pochi giorni dovrà registrarsi in una banca dati nazionale e avere un codice identificativo, pena multe piuttosto salate."
    - tutor: "Sì, il famoso codice. Ma tu che ne pensi, nel merito?"
      goals: [summarise]
    - learner: "Mi sembra una misura sensata, anche se all'inizio sembrava che il governo volesse vietare tutto. Il problema vero è che, senza controlli, resterà sulla carta."
    - tutor: "Sulla carta, appunto: e i controlli chi li fa? Io ho letto tre giornali e ognuno diceva una cosa diversa."
      goals: [opinion]
    - learner: "Anch'io. Un giornale parlava di nuovi poteri ai comuni, mentre su un altro ho letto che i controlli spettassero alla Guardia di Finanza."
      errors: [subjunctive-use]
      gold: {text: "spettassero", fix: "spettavano"}
    - tutor: "Che confusione. Ma «ho letto che i controlli spettassero»: stai riferendo un fatto che hai letto, non un dubbio. Ti serve davvero il congiuntivo?"
      prompt: {text: "spettassero", tags: [subjunctive-use]}
    - learner: "No, l'indicativo: ho letto che i controlli spettavano alla Guardia di Finanza."
    - tutor: "Proprio così. Ognuno ha scelto il pezzo di notizia che gli faceva comodo, come sempre. Ma alla fine, secondo te, che cosa cambierà per chi affitta?"
      goals: [sources]
    - learner: "Se i controlli funzionerebbero davvero, una parte dei proprietari tornerebbe agli affitti lunghi, e forse gli studenti troverebbero di nuovo una stanza a meno di seicento euro."
      errors: [hypothetical]
      gold: {text: "i controlli funzionerebbero", fix: "i controlli funzionassero"}
    - tutor: "Magari! Ma «se i controlli funzionerebbero»: dopo «se», il condizionale ci può stare?"
      prompt: {text: "i controlli funzionerebbero", tags: [hypothetical]}
    - learner: "Se i controlli funzionino davvero?"
      errors: [hypothetical]
    - tutor: "Se i controlli funzionassero davvero, sì, qualcosa cambierebbe. Io resto scettico: scommettiamo un caffè che tra un anno siamo ancora qui a parlarne?"
      goals: [consequences]
      recast: {text: "i controlli funzionino", fix: "i controlli funzionassero", tags: [hypothetical]}
    - learner: "Scommessa accettata. E se vinco io, il caffè me lo offri con la brioche."
    - tutor: "Affare fatto, brioche compresa. Adesso però torniamo di sopra, che la riunione comincia tra cinque minuti."

- scenario: intelligenza-artificiale
  level: C2
  persona: en-m-heritage
  history: [false-friend, negation]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, ma non sono così pessimista. Alcuni lavori spariranno, è vero; altri cambieranno e altri ancora nasceranno, come è successo con ogni rivoluzione tecnologica."
    - tutor: "Questa la sento dire da tutti. Ma stavolta le macchine non sostituiscono le braccia, sostituiscono il cervello!"
      goals: [position]
    - learner: "Non del tutto. Nel mio ufficio usiamo questi strumenti da un anno per le traduzioni. All'inizio i colleghi erano terrorizzati, ma eventualmente hanno capito che la macchina faceva la bozza e loro il lavoro vero."
      errors: [false-friend]
    - tutor: "E alla fine hanno capito che la macchina li aiutava, d'accordo. Ma finché qualcuno in alto non decide che la bozza basta e avanza: a quel punto che succede?"
      goals: [evidence]
      recast: {text: "eventualmente hanno capito", fix: "alla fine hanno capito", tags: [false-friend]}
    - learner: "Su questo hai ragione, lo ammetto: nessuno non può garantire che le aziende non taglino il personale per risparmiare."
      errors: [negation]
      gold: {text: "nessuno non può", fix: "nessuno può"}
    - tutor: "Finalmente mi dai ragione! Ma «nessuno non può garantire»: con «nessuno» davanti al verbo, la doppia negazione regge?"
      prompt: {text: "nessuno non può", tags: [negation]}
    - learner: "No: nessuno può garantire che non taglino il personale."
    - tutor: "Ecco. E allora che si fa? Aspettiamo che ci licenzino tutti?"
      goals: [concede]
    - learner: "No. Se fossi al governo, investirei tutto nella formazione: se la gente avrebbe le competenze giuste, l'automazione sarebbe un'opportunità e non una condanna."
      errors: [hypothetical]
      gold: {text: "la gente avrebbe", fix: "la gente avesse"}
    - tutor: "Programma ambizioso. Ma nella seconda ipotesi, «se la gente avrebbe le competenze», il verbo è al modo giusto?"
      prompt: {text: "la gente avrebbe", tags: [hypothetical]}
    - learner: "No, ci vuole il congiuntivo: se la gente avesse le competenze giuste."
    - tutor: "Esatto. Sulla formazione, almeno, siamo dalla stessa parte. Brindiamo, allora: è l'unica cosa che una macchina non può fare al posto nostro."
      goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Grazie, professore, è proprio ciò che speravo. La mia tesi è che la responsabilità morale presupponga l'intenzionalità, e che una macchina, per quanto sofisticata, non abbia intenzioni proprie: persegue fini che le sono stati assegnati."
    - tutor: "Ma anche noi perseguiamo fini che ci sono stati assegnati: dall'evoluzione, dall'educazione, dalla cultura. Dove passa il confine?"
      goals: [thesis]
    - learner: "Distinguerei tra avere dei fini e poterli rivedere. Quando si si interroga sui propri desideri, li si può anche rifiutare; una macchina, invece, non si interroga su nulla."
      errors: [reflexive]
      gold: {text: "si si interroga", fix: "ci si interroga"}
    - tutor: "Distinzione interessante. Ma «quando si si interroga»: due «si» di fila, in italiano, possono restare così?"
      prompt: {text: "si si interroga", tags: [reflexive]}
    - learner: "No, il primo diventa «ci»: quando ci si interroga sui propri desideri, li si può anche rifiutare."
    - tutor: "Esatto. Ed ecco la mia obiezione: se un sistema fosse programmato per rivedere i propri obiettivi, sarebbe responsabile?"
      goals: [distinguish]
    - learner: "Non necessariamente. Anche se lo facesse, lo farebbe perché qualcuno gliel'avesse chiesto, non perché lo voglia."
      errors: [subjunctive-use]
      gold: {text: "gliel'avesse chiesto", fix: "gliel'ha chiesto"}
    - tutor: "Risposta elegante. Ma «perché qualcuno gliel'avesse chiesto»: quel «perché» è causale. Vuole davvero il congiuntivo?"
      prompt: {text: "gliel'avesse chiesto", tags: [subjunctive-use]}
    - learner: "Perché qualcuno glielo abbia chiesto?"
      errors: [subjunctive-use]
    - tutor: "«Perché qualcuno glielo ha chiesto»: d'accordo. Ma allora anche un soldato che esegue un ordine non sarebbe responsabile?"
      goals: [objection]
      recast: {text: "glielo abbia chiesto", fix: "glielo ha chiesto", tags: [subjunctive-use]}
    - learner: "Lo sarebbe, invece, perché avrebbe potuto rifiutarsi. Le concedo però che il confine è più sfumato di quanto sostenessi nella premessa: alcuni sistemi prendono decisioni che nessuno ha previsto."
    - tutor: "Una concessione onesta. Mi dia ora una conclusione rigorosa, in una frase sola."
      goals: [concede]
    - learner: "Si può attribuire responsabilità solo a chi avrebbe potuto agire diversamente; dunque, finché una macchina non potrà rifiutare i propri fini, la responsabilità resterà di chi la progetta e di chi la usa."
    - tutor: "Rigorosa e difendibile. Lei non ha convinto me e io non ho convinto Lei: in filosofia è il miglior risultato possibile. Grazie, dottoressa."
      goals: [conclude]

- scenario: smartworking
  level: C2
  persona: en-f-professional
  history: [comparative, conditional-form]
  turns:
    - tutor: "Allora, lavori ancora da casa o ti hanno richiamata in ufficio?"
    - learner: "Mi hanno richiamata due giorni a settimana. Il problema è che in ufficio la connessione è più lenta che quella di casa mia, e le riunioni online da lì sono un incubo."
      errors: [comparative]
      gold: {text: "più lenta che quella", fix: "più lenta di quella"}
    - tutor: "Ironia della sorte. Ma «più lenta che quella di casa»: davanti a un pronome come «quella», il secondo termine come lo introduci?"
      prompt: {text: "più lenta che quella", tags: [comparative]}
    - learner: "Con «di»: più lenta di quella di casa mia."
    - tutor: "Esatto. E allora che vantaggi ci trovi, a tornare in ufficio?"
      goals: [situation]
    - learner: "Più di quanti pensassi, a dire il vero. Le idee migliori nascono davanti alla macchinetta del caffè, non in videochiamata, e i colleghi nuovi finalmente li conosco di persona."
    - tutor: "La macchinetta del caffè, motore dell'innovazione italiana! E i contro, a parte la connessione?"
      goals: [pros]
    - learner: "Due ore e mezza di viaggio al giorno, e in ufficio è difficile concentrarsi: c'è sempre qualcuno che parla al telefono a voce alta, ed è molto distraente."
      errors: [word-choice]
    - tutor: "Uno che parla al telefono a voce alta distrae molto, lo so bene: da noi ce n'è uno in ogni stanza. Se potessi scegliere tu, come ti organizzeresti?"
      goals: [cons]
      recast: {text: "è molto distraente", fix: "distrae molto", tags: [word-choice]}
    - learner: "Se potessi scegliere, rimanerei a casa tre giorni e verrei in ufficio solo per le riunioni importanti."
      errors: [conditional-form]
      gold: {text: "rimanerei", fix: "rimarrei"}
    - tutor: "Equilibrio ragionevole. Ma «rimanerei»: il condizionale di «rimanere» ha davvero quella forma?"
      prompt: {text: "rimanerei", tags: [conditional-form]}
    - learner: "Rimanrei a casa tre giorni?"
      errors: [conditional-form]
    - tutor: "«Rimarrei a casa tre giorni»: lo firmerei subito anch'io. Ne hai già parlato con il tuo capo?"
      goals: [preference]
      recast: {text: "Rimanrei", fix: "Rimarrei", tags: [conditional-form]}
    - learner: "Ci parlo giovedì. Gli porto i dati sulla connessione, così almeno l'argomento tecnico ce l'ho."
    - tutor: "Ottima strategia: prima i dati, poi la richiesta. Fammi sapere com'è andata, che poi ci provo anch'io."

- scenario: politica-lavoro
  level: C2
  persona: es-m-worker
  history: [ci-ne, false-friend]
  turns:
    - tutor: "Secondo me il salario minimo farebbe chiudere metà delle piccole imprese. Tu che dici?"
    - learner: "Dipende di quanto lo si fissa. Nove euro l'ora non mi sembrano una follia, e in molti paesi europei il salario minimo esiste da anni senza che l'economia sia crollata."
      errors: [preposition]
      gold: {text: "Dipende di quanto", fix: "Dipende da quanto"}
    - tutor: "Lì però la produttività è più alta. Ma intanto, «dipende di quanto»: il verbo «dipendere» con quale preposizione si costruisce?"
      prompt: {text: "Dipende di quanto", tags: [preposition]}
    - learner: "Con «da»: dipende da quanto lo si fissa. E non dico che sia facile."
    - tutor: "Infatti. Un bar di paese, con nove euro l'ora a dipendente, chiude."
      goals: [opinion]
    - learner: "Ne ho pensato anch'io, e in parte è vero. Ma se lo Stato abbassasse le tasse sul lavoro per le piccole imprese, il costo per il bar resterebbe più o meno lo stesso."
      errors: [ci-ne]
      gold: {text: "Ne ho pensato", fix: "Ci ho pensato"}
    - tutor: "Ipotesi interessante. Ma «ne ho pensato»: con «pensare a qualcosa», quale pronome riprende la cosa?"
      prompt: {text: "Ne ho pensato", tags: [ci-ne]}
    - learner: "«Ci»: ci ho pensato anch'io. E in quel caso il bar non chiuderebbe."
    - tutor: "Con i soldi di chi, però? Hai un esempio concreto, o solo teorie?"
      goals: [hypothesis]
    - learner: "Mia cugina fa la cameriera a Rimini: prende sei euro l'ora, metà in nero, e vive delle propine dei turisti."
      errors: [false-friend]
    - tutor: "Vive delle mance dei turisti? Allora il problema non è solo il salario minimo, ma anche il lavoro nero."
      goals: [example]
      recast: {text: "delle propine", fix: "delle mance", tags: [false-friend]}
    - learner: "Appunto: le due cose vanno insieme. Senza controlli seri, nessuna legge sul salario funzionerà mai."
    - tutor: "Su questo non posso darti torto. Siamo d'accordo almeno su una cosa, allora: prima i controlli, poi il resto."
      goals: [conclude]

- scenario: turismo-di-massa
  level: C2
  persona: en-m-retired
  history: [demonstrative]
  turns:
    - tutor: "Abbiamo in linea un altro ascoltatore. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Contro, e lo dico da veneziano d'adozione: vivo a Cannaregio da quindici anni. Il ticket colpisce chi viene per un giorno, ma i veri problemi sono altri."
    - tutor: "Quali, per esempio? Molti ascoltatori ci scrivono che, senza ticket, la città scoppia."
      goals: [introduce]
    - learner: "Le grandi navi, prima di tutto. Quando attraccavano in città, i migliaia di passeggeri scendevano tutti alla stessa ora e intasavano Rialto e San Marco per tutta la mattina."
      errors: [noun-gender]
      gold: {text: "i migliaia", fix: "le migliaia"}
    - tutor: "Un'immagine che ricordiamo tutti. Ma «i migliaia di passeggeri»: «migliaia», di che genere è?"
      prompt: {text: "i migliaia", tags: [noun-gender]}
    - learner: "Femminile, giusto: le migliaia di passeggeri. E da quando le navi non entrano più in laguna, la differenza si vede."
    - tutor: "Eppure il sovraffollamento c'è ancora. Il ticket, dicono, almeno scoraggia le gite di un giorno. Non è meglio di niente?"
      goals: [example]
    - learner: "Meglio di niente, forse, ma intanto quei alberghi che si moltiplicano in centro nessuno li tocca."
      errors: [demonstrative]
      gold: {text: "quei alberghi", fix: "quegli alberghi"}
    - tutor: "Lei va dritto al punto. Ma «quei alberghi»: davanti a una vocale, il dimostrativo plurale resta così?"
      prompt: {text: "quei alberghi", tags: [demonstrative]}
    - learner: "Quelli alberghi?"
      errors: [demonstrative]
    - tutor: "Quegli alberghi, appunto, che in centro spuntano come funghi. È questa la Sua obiezione principale al ticket?"
      goals: [rebut]
      recast: {text: "Quelli alberghi", fix: "Quegli alberghi", tags: [demonstrative]}
    - learner: "Sì. Io bloccherei le nuove licenze per alberghi e affitti brevi nel centro storico, e userei le case vuote del Comune per i giovani che vogliono restare a vivere qui."
    - tutor: "Una proposta concreta, e forse più coraggiosa del ticket. Grazie per la telefonata, e buona giornata a Cannaregio!"
      goals: [proposal]

# Round 8, set s-c2, file 2: work, careers and negotiations. Slips: false friends («duplicare»),
# «nel caso in cui» + conditional, «in grado a», future of «mantenere», relative «da cui»,
# «dare» in the imperfect subjunctive, «cercare» with an indirect pronoun, «altrettanto... che»,
# Spanish words. Correct turns with «il cui», «il che», «chiunque abbia», «in cambio» left alone.
- scenario: colloquio-lavoro
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di Lei."
    - learner: "Buongiorno. Sono australiana, vivo a Milano da sei anni e lavoro nel marketing digitale. Negli ultimi tre anni ho coordinato un gruppo di cinque persone in un'agenzia che si occupa soprattutto di moda."
    - tutor: "Un settore esigente. Mi racconti un progetto di cui va particolarmente fiera."
      goals: [intro]
    - learner: "Due anni fa un nostro cliente, un marchio di scarpe, perdeva quote di mercato da anni. Abbiamo ripensato tutta la comunicazione e in otto mesi le vendite online sono duplicate."
      errors: [false-friend]
    - tutor: "Le vendite online sono raddoppiate in otto mesi? Un risultato notevole. Come ci siete riusciti, concretamente?"
      goals: [experience]
      recast: {text: "sono duplicate", fix: "sono raddoppiate", tags: [false-friend]}
    - learner: "Soprattutto ascoltando i clienti. Analizzando le recensioni, abbiamo realizzato che molti si lamentavano delle taglie, e così abbiamo introdotto una guida interattiva."
      errors: [false-friend]
    - tutor: "«Ci siamo resi conto che si lamentavano delle taglie»: un'intuizione semplice ed efficace. Quali sono, secondo Lei, i Suoi punti di forza?"
      recast: {text: "abbiamo realizzato", fix: "ci siamo resi conto", tags: [false-friend]}
    - learner: "Direi la capacità di mediare: in agenzia ho gestito spesso clienti difficili senza perdere la calma. E poi sono una persona molto attenta ai numeri: ogni decisione, per me, deve basarsi su dati concreti."
    - tutor: "In un ruolo come questo, saper mediare è prezioso. Perché ha deciso di candidarsi proprio da noi?"
      goals: [strengths]
    - learner: "Perché la vostra azienda produce in Italia e punta sulla sostenibilità. Mi piacerebbe lavorare per un marchio in cui credo, e penso che la mia esperienza nel digitale potrebbe esservi utile."
    - tutor: "Ci fa piacere sentirlo, perché è proprio sul digitale che vogliamo crescere. Ha qualche domanda da farmi?"
      goals: [why]
    - learner: "Sì: vorrei sapere se è previsto il lavoro da remoto e se l'azienda finanzierebbe un corso di analisi dei dati, nel caso in cui verrei assunta."
      errors: [subjunctive-use]
      gold: {text: "verrei assunta", fix: "venissi assunta"}
    - tutor: "Domande più che legittime. Riprenda però «nel caso in cui verrei assunta»: dopo «nel caso in cui», il condizionale funziona?"
      prompt: {text: "verrei assunta", tags: [subjunctive-use]}
    - learner: "Allora... nel caso in cui verrò assunta?"
      errors: [subjunctive-use]
    - tutor: "«Nel caso in cui venissi assunta»: in quel caso potrebbe lavorare da casa due giorni alla settimana, e un corso di formazione all'anno è compreso nel contratto. Ci sono altri aspetti che vorrebbe chiarire?"
      recast: {text: "verrò assunta", fix: "venissi assunta", tags: [subjunctive-use]}
    - learner: "No, mi sembra tutto molto chiaro. Vi ringrazio per il tempo che mi avete dedicato."
    - tutor: "Grazie a Lei. Abbiamo ancora due colloqui questa settimana: La richiameremo entro la fine del mese, in ogni caso."
      goals: [questions]

- scenario: colloquio-promozione
  level: C2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Volevo fare il punto sull'ultimo anno: abbiamo aperto la seconda cucina in centro e, nonostante i ritardi del cantiere, abbiamo inaugurato in tempo per la stagione."
    - tutor: "Lo so, e i numeri della nuova cucina sono ottimi. Il merito è anche Suo, non lo nego. Dove vuole arrivare?"
      goals: [results]
    - learner: "Arrivo al punto. Vorrei candidarmi alla direzione di entrambe le cucine: le conosco tutte e due, e il personale si fida di me."
    - tutor: "Una richiesta ambiziosa. La proprietà, però, stava pensando a un responsabile esterno, con esperienza nella grande ristorazione. Cosa risponde?"
      goals: [request]
    - learner: "Rispondo che un esterno avrebbe bisogno di mesi per ambientarsi, mentre io sono già in grado a gestire i fornitori, i turni e i costi."
      errors: [preposition]
      gold: {text: "in grado a", fix: "in grado di"}
    - tutor: "Argomento solido. Ma «in grado a gestire»: con «essere in grado», quale preposizione introduce l'infinito?"
      prompt: {text: "in grado a", tags: [preposition]}
    - learner: "Scusi: in grado per gestire i fornitori, volevo dire. E i costi li conosco a memoria."
      errors: [preposition]
    - tutor: "Che Lei sia in grado di gestire i fornitori nessuno lo mette in dubbio. Ma dirigere due cucine vuol dire anche trattare con la proprietà: come se la caverebbe?"
      goals: [handle]
      recast: {text: "in grado per", fix: "in grado di", tags: [preposition]}
    - learner: "Me la caverei: l'anno scorso ho rinegoziato da solo i contratti con i tre fornitori principali e abbiamo risparmiato il dodici per cento. Se mi aveste affidato la direzione prima, avrei fatto lo stesso anche nella prima cucina."
    - tutor: "Lo ricordo, e la proprietà lo ricorda ancora meglio. Facciamo così: Le propongo sei mesi di prova come responsabile di entrambe le cucine, poi valutiamo insieme."
    - learner: "Accetto volentieri, a patto che la prova abbia obiettivi chiari e messi per iscritto, così da evitare malintesi."
    - tutor: "Mi sembra giusto. Entro venerdì Le mando una proposta con obiettivi, budget e scadenze; lunedì ne parliamo con la proprietà."
      goals: [next-steps]

- scenario: riunione-lavoro
  level: C2
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Abbiamo finito la migrazione dei dati dei clienti e la nuova piattaforma funziona, almeno in prova. Il collaudo vero e proprio lo faremo la settimana prossima."
    - tutor: "Ottimo, era il passaggio più delicato. Ci sono intoppi da segnalare?"
      goals: [update]
    - learner: "Uno sì: i fornitori delle licenze dicono che manteneranno i prezzi solo fino a marzo. Se non firmiamo entro allora, i costi saliranno del venti per cento."
      errors: [future-form]
      gold: {text: "manteneranno", fix: "manterranno"}
    - tutor: "Brutta notizia. Ma riascolta «manteneranno»: il futuro di «mantenere» si forma davvero così?"
      prompt: {text: "manteneranno", tags: [future-form]}
    - learner: "No, hai ragione: manterranno i prezzi solo fino a marzo, poi scatta l'aumento."
    - tutor: "Esatto. Venti per cento non è poco. Che cosa proponi?"
      goals: [problem]
    - learner: "Proporrei di firmare subito un contratto di tre anni: salveremmo circa quindicimila euro, e nel frattempo potremmo rinegoziare il numero di licenze."
      errors: [word-choice]
    - tutor: "Quindi risparmieremmo quindicimila euro? Allora l'amministrazione ci starà a sentire. Riesci a prepararmi un confronto tra le due opzioni?"
      goals: [proposal]
      recast: {text: "salveremmo", fix: "risparmieremmo", tags: [word-choice]}
    - learner: "Certo. Te lo mando entro giovedì, così venerdì potrai portarlo direttamente in comitato."
    - tutor: "Perfetto: confronto entro giovedì e decisione in comitato venerdì. La firma, allora, la fissiamo per metà febbraio, così ci teniamo un margine di sicurezza."
      goals: [deadline]

- scenario: presentazione-progetto
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun, subjunctive-form]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Glielo spiego in tre punti. Il progetto prevede una piattaforma per la formazione dei docenti, il cui obiettivo è ridurre del quaranta per cento i costi dei corsi in presenza."
    - tutor: "Quaranta per cento è una promessa impegnativa. Su che cosa si basa?"
      goals: [pitch]
    - learner: "Sul progetto pilota in tre scuole, dove i docenti hanno seguito metà dei corsi online, il che ha dimezzato le spese di trasferta senza peggiorare i risultati. E le scuole di montagna, che il viaggio fino al capoluogo richiede mezza giornata, avrebbero finalmente accesso agli stessi corsi."
      errors: [relative-pronoun]
      gold: {text: "che il viaggio", fix: "da cui il viaggio"}
    - tutor: "Dati interessanti. Ma riascolti «le scuole di montagna, che il viaggio fino al capoluogo...»: quel «che» regge davvero la frase? Pensi a dove comincia il viaggio."
      prompt: {text: "che il viaggio", tags: [relative-pronoun]}
    - learner: "Le scuole di montagna, da cui il viaggio fino al capoluogo richiede mezza giornata. Per loro sarebbe una svolta."
    - tutor: "Esatto. Detto questo, ecco la mia obiezione: se i docenti non completassero i corsi online, avremmo speso per niente."
      goals: [benefits]
    - learner: "È un rischio reale, ma nel pilota li ha completati l'ottantasei per cento. E se la piattaforma dasse un attestato valido per la carriera, la percentuale salirebbe ancora."
      errors: [subjunctive-form]
      gold: {text: "dasse", fix: "desse"}
    - tutor: "Ottantasei per cento è un argomento serio. Ma ripeta «se la piattaforma dasse»: il congiuntivo imperfetto di «dare» è proprio quello?"
      prompt: {text: "dasse", tags: [subjunctive-form]}
    - learner: "Desse, certo: se la piattaforma desse un attestato valido, i docenti avrebbero un motivo in più per finire."
    - tutor: "Esatto, un motivo in più, e il ministero lo riconosce già. Che cosa Le serve per partire?"
      goals: [objection]
    - learner: "Un budget di sessantamila euro per il primo anno e il via libera per estendere il pilota a venti scuole entro settembre. Qualora i risultati non fossero all'altezza, il progetto si fermerebbe dopo dodici mesi."
    - tutor: "Mi sembra una proposta prudente. Mi mandi il piano finanziario entro venerdì: lo porto io al consiglio di amministrazione del mese prossimo."
      goals: [next-steps]

- scenario: trattativa-fornitore
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per il listino. Capisco che i costi siano aumentati per tutti, ma un rincaro del quindici per cento sulle scatole, da un mese all'altro, per noi è insostenibile."
    - tutor: "Lo capisco, ma il cartone riciclato ci costa quasi il trenta per cento in più rispetto all'anno scorso. Una parte dell'aumento l'abbiamo già assorbita noi."
      goals: [problem]
    - learner: "Non lo metto in dubbio. Però lavoriamo insieme da otto anni, e pensavo che ci avvisate con un po' di anticipo, almeno per poterci organizzare."
      errors: [subjunctive-use]
      gold: {text: "ci avvisate", fix: "ci avvisaste"}
    - tutor: "Il preavviso è stato breve, lo ammetto. Ma riprenda «pensavo che ci avvisate»: con «pensavo» al passato, quel verbo è nel modo e nel tempo giusti?"
      prompt: {text: "ci avvisate", tags: [subjunctive-use]}
    - learner: "Pensavo che ci avvisavate, volevo dire, con un po' di anticipo."
      errors: [subjunctive-use]
    - tutor: "«Pensavo che ci avvisaste con un po' di anticipo»: il rimprovero è giusto e lo accetto. Il listino, però, resta quello. Che cosa propone?"
      goals: [argue]
      recast: {text: "ci avvisavate", fix: "ci avvisaste", tags: [subjunctive-use]}
    - learner: "Propongo un rincaro dell'otto per cento adesso e una revisione del listino a settembre, quando si vedrà come va il prezzo del cartone. In cambio potremmo impegnarci ad acquistare un volume minimo garantito."
    - tutor: "Un volume minimo garantito cambia le cose. Di quanto parliamo?"
    - learner: "Diciamo quarantamila scatole al mese, con pagamento a trenta giorni. Ma vorrei che l'accordo fosse messo per iscritto entro la fine del mese."
    - tutor: "Con quarantamila scatole al mese garantite posso scendere al dieci per cento, non oltre. Se Le va bene, preparo il contratto entro venerdì."
      goals: [counteroffer]
    - learner: "Il dieci per cento, con la revisione a settembre? Allora ci stiamo. Aspetto la bozza."
    - tutor: "D'accordo: dieci per cento da subito, quarantamila scatole al mese garantite e revisione del listino a settembre. Venerdì Le arriva la bozza del contratto."
      goals: [agreement]

- scenario: mediazione-colleghi
  level: C2
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si accomodi, anzi, ha fatto bene a venire. Mi dica pure con calma che cosa l'ha ferita."
    - tutor: "Quando ho presentato il piano, Ferraris mi ha interrotta davanti a tutti e ha detto che i miei numeri erano inventati. E Lei non ha detto niente."
      goals: [listen]
    - learner: "Ha ragione, avrei dovuto intervenire, e mi dispiace che si sia sentita umiliata davanti a tutto il gruppo. Dopo la riunione gli ho cercato per chiedergli spiegazioni, ma era già uscito."
      errors: [object-pronoun]
      gold: {text: "gli ho cercato", fix: "l'ho cercato"}
    - tutor: "Sì, è andato via prima di tutti. Ma riprenda «gli ho cercato»: «cercare qualcuno» vuole un complemento diretto o indiretto?"
      prompt: {text: "gli ho cercato", tags: [object-pronoun]}
    - learner: "Diretto: l'ho cercato, ma era già uscito. Mi dica, però: ha detto proprio che i numeri erano inventati, o che non li aveva potuti verificare?"
    - tutor: "Esatto. Ha detto proprio «inventati», e l'hanno sentito tutti. Che adesso lui lo neghi non mi sorprenderebbe."
      goals: [clarify]
    - learner: "Capisco. Provo comunque a mettermi nei suoi panni: Ferraris è sotto pressione per il bilancio e, quando i conti non gli tornano, perde la pazienza. Questo non lo giustifica, e ne parlerò con lui a solas."
      errors: [word-choice]
    - tutor: "Che ne parli con lui a quattr'occhi mi sembra il minimo. Io però quei numeri li avevo controllati due volte, e lui lo sa benissimo."
      goals: [perspective]
      recast: {text: "a solas", fix: "a quattr'occhi", tags: [word-choice]}
    - learner: "Le credo. Le propongo questo: alla prossima riunione chiederò che chiunque abbia dubbi sui dati li sollevi prima, per iscritto. E Le chiedo di ripresentare il piano davanti a tutti."
    - tutor: "Mi sembra una soluzione giusta: così nessuno potrà più screditare in pubblico il lavoro degli altri. La ringrazio di avermi ascoltata."
      goals: [solution]

- scenario: smartworking
  level: C2
  persona: en-m-traveller
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Ormai faccio tre giorni da casa e due in ufficio. All'inizio pensavo che mi sarebbe mancato il contatto con i colleghi, invece mi trovo benissimo."
    - tutor: "Tre e due: l'equilibrio perfetto, dicono. Cosa ti piace di più del lavoro da casa?"
      goals: [situation]
    - learner: "Soprattutto il tempo che risparmio: prima perdevo un'ora e mezza al giorno nel traffico. E poi a casa sono altrettanto produttivo che in ufficio, se non di più."
      errors: [comparative]
      gold: {text: "altrettanto produttivo che", fix: "altrettanto produttivo quanto"}
    - tutor: "Un'ora e mezza al giorno è tanta vita. Ma «altrettanto produttivo che in ufficio»: dopo «altrettanto», il secondo termine lo introduci con «che»?"
      prompt: {text: "altrettanto produttivo che", tags: [comparative]}
    - learner: "Hai ragione, ci vuole «quanto»: a casa sono altrettanto produttivo quanto in ufficio."
    - tutor: "Esatto. E i lati negativi? Io, dopo un mese a casa, parlavo con la pianta del soggiorno."
      goals: [pros]
    - learner: "Il lato negativo è che non stacco mai: il portatile è sempre lì, sul tavolo della cucina, e mi sento sempre in chiamata, anche alle dieci di sera."
      errors: [word-choice]
    - tutor: "Sentirsi sempre reperibile è il classico rovescio della medaglia. E se potessi scegliere liberamente, come ti organizzeresti?"
      goals: [cons]
      recast: {text: "in chiamata", fix: "reperibile", tags: [word-choice]}
    - learner: "Se potessi scegliere, farei esattamente come adesso, magari con un giorno in ufficio in più d'inverno, quando la casa è più fredda dell'ufficio e i colleghi sono meno noiosi del termosifone."
    - tutor: "Quindi il segreto è il riscaldamento, altro che produttività! Allora ci vediamo in ufficio a gennaio, e il caffè te lo offro io."
      goals: [preference]

- scenario: politica-lavoro
  level: C2
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Molti lavori cambieranno, questo sì, ma che spariscano del tutto mi sembra improbabile. È già successo con l'arrivo dei computer, e alla fine i posti di lavoro sono aumentati."
    - tutor: "Sì, ma allora la transizione è durata trent'anni. Stavolta va tutto molto più veloce."
      goals: [opinion]
    - learner: "Può darsi. Ma se i governi investissero davvero nella formazione, la gente potrebbe riqualificarsi in tempo. Il problema è che nessuno ci pensa finché non è troppo tardi."
    - tutor: "E nel caso contrario? Cosa succederebbe, secondo te?"
    - learner: "Se non investirebbero, avremmo milioni di persone senza lavoro e senza le competenze per trovarne un altro."
      errors: [hypothetical]
      gold: {text: "Se non investirebbero", fix: "Se non investissero"}
    - tutor: "Scenario cupo. Ma riascolta «se non investirebbero»: nella frase con «se», il condizionale va bene?"
      prompt: {text: "Se non investirebbero", tags: [hypothetical]}
    - learner: "No, certo: se non investissero, avremmo milioni di persone senza le competenze per ricominciare."
    - tutor: "Esatto. Hai un esempio concreto in mente?"
      goals: [hypothesis]
    - learner: "Mio zio faceva il tipografo a Siviglia. A cinquantacinque anni l'hanno despedito, e nessuno gli ha mai offerto un corso."
      errors: [word-choice]
    - tutor: "A cinquantacinque anni l'hanno licenziato senza offrirgli niente? Che storia amara, e purtroppo comune. Allora, per chiudere: siamo d'accordo almeno su qualcosa?"
      goals: [example]
      recast: {text: "l'hanno despedito", fix: "l'hanno licenziato", tags: [word-choice]}
    - learner: "Su una cosa sì: il futuro del lavoro dipenderà meno dalla tecnologia che dalle scelte politiche. Su questo, credo, puoi darmi ragione anche tu."
    - tutor: "Ti do ragione, ma solo perché è tardi e il vino è finito. Brindiamo alle scelte politiche, allora, con l'ultimo goccio."
      goals: [conclude]

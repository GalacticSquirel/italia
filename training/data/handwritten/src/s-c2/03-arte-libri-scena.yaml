# Round 8, set s-c2, file 3: art, books, translation, comedy and radio. Slips: passive with
# «venire» in a compound tense, «gli» for a direct object, «che» for «in cui», «benché» and
# «a patto che» with the indicative, «se» + conditional, consecutio after «mi sarebbe piaciuto»,
# «mentre» + passato prossimo, habitual past, missing partitive «ne», a tu/Lei slip on air,
# false friends («eccitante», «gente maggiore»), «precipitato». Correct literary turns left alone.
- scenario: arte-mostra
  level: C2
  persona: en-m-traveller
  history: [object-pronoun]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi lascia addosso un'inquietudine strana. È una stanza vuota, con una finestra aperta sul mare, eppure si ha la sensazione che qualcuno sia appena uscito."
    - tutor: "È proprio l'effetto che cercava il pittore: siamo negli anni Venti, in piena stagione metafisica. Guarda bene la luce: da dove arriva?"
      goals: [react]
    - learner: "Da sinistra, bassissima, come al tramonto, e allunga le ombre dei mobili fino alla parete. Ho letto sul pannello che il quadro è venuto dipinto in una sola estate."
      errors: [passive]
      gold: {text: "è venuto dipinto", fix: "è stato dipinto"}
    - tutor: "In una sola estate, con tutta quella precisione! Riprendi però «è venuto dipinto»: nei tempi composti, il passivo con «venire» si può fare?"
      goals: [describe]
      prompt: {text: "è venuto dipinto", tags: [passive]}
    - learner: "No, con «venire» solo nei tempi semplici: è stato dipinto in una sola estate."
    - tutor: "Perfetto. E secondo te che cosa vuole dirci, con quella finestra spalancata su un mare dove non c'è nessuno?"
    - learner: "Credo che la finestra sia una promessa che non viene mantenuta: il mare c'è, ma nessuno lo raggiungerà mai. È come se il pittore ci chiudesse nella stanza insieme a lui."
    - tutor: "Una lettura bella e piuttosto amara. Ti fa pensare a qualche altro pittore?"
      goals: [interpret]
    - learner: "Sì, a Hopper. Anni fa ho visto i suoi quadri a New York e gli ho guardati per ore: anche lì le stanze sono piene di luce e vuote di persone."
      errors: [object-pronoun]
      gold: {text: "gli ho guardati", fix: "li ho guardati"}
    - tutor: "Il confronto con Hopper regge benissimo. Ma «gli ho guardati»: «guardare qualcosa» vuole un complemento diretto o indiretto?"
      prompt: {text: "gli ho guardati", tags: [object-pronoun]}
    - learner: "Diretto, quindi li ho guardati per ore. E anche Hopper, in fondo, dipinge l'attesa più che le persone."
    - tutor: "Esatto. La differenza è che in Hopper l'attesa è quotidiana, quasi americana, mentre qui ha qualcosa di sognato. Andiamo a vedere la sala successiva?"
      goals: [compare]

- scenario: poesia-montale
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
    - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
    - learner: "Mi è rimasta addosso la sensazione di un dolore che non ha bisogno di essere spiegato: Montale non racconta, mostra. E poi quella parola, «prodigio», che quasi stona."
    - tutor: "Stona, sì, ed è voluto. Fermiamoci però su un'immagine sola: quale l'ha colpita di più?"
      goals: [first-reading]
    - learner: "Il cavallo stramazzato. È un'immagine che non c'è niente di poetico: un animale che crolla a terra, e basta."
      errors: [relative-pronoun]
      gold: {text: "che non c'è niente", fix: "in cui non c'è niente"}
    - tutor: "Un'immagine brutale, è vero. Ma riascolti «un'immagine che non c'è niente di poetico»: quel «che» lega davvero le due frasi? Dove, esattamente, non c'è niente di poetico?"
      prompt: {text: "che non c'è niente", tags: [relative-pronoun]}
    - learner: "Nell'immagine, quindi: un'immagine in cui non c'è niente di poetico. Ed è proprio questo che la rende così forte."
    - tutor: "Proprio così. Il male non viene descritto, viene mostrato attraverso le cose. Ora provi a rileggere la prima strofa ad alta voce: che cosa sente?"
      goals: [image]
    - learner: "Parole aspre, piene di consonanti doppie: «strozzato», «gorgoglia», «incartocciarsi». Sembra quasi di sentire il rivo che fatica a scorrere."
    - tutor: "La seconda strofa, invece, cambia musica: suoni più distesi, la statua, la nuvola, il falco alto levato. Che senso dà, allora, a tutta la poesia?"
      goals: [sound]
    - learner: "Direi che l'unico bene possibile è il distacco: guardare il mondo dall'alto, come il falco, con una specie di indifferenza divina. Montale non offre consolazione, e io lo trovo molto eccitante."
      errors: [false-friend]
    - tutor: "Molto stimolante, sì, e insieme vertiginoso: la salvezza coincide con il distacco. Per giovedì prossimo provi a scrivere una pagina proprio su questo."
      goals: [meaning]
      recast: {text: "molto eccitante", fix: "molto stimolante", tags: [false-friend]}
    - learner: "Volentieri. Posso partire dal confronto con un'altra poesia degli «Ossi di seppia», o è meglio restare su questa?"
    - tutor: "Resti su questa, almeno all'inizio: una lettura stretta, verso per verso, vale più di dieci confronti. Ci vediamo giovedì."

- scenario: circolo-lettura
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Insopportabile no, ma testardo sì. Mi ha colpito che una ribellione nata da un piatto di lumache diventi la scelta di tutta una vita."
    - tutor: "Appunto: un capriccio da ragazzino che dura sessant'anni. Io ci vedo più orgoglio che ideali."
      goals: [impression]
    - learner: "All'inizio è un capriccio, d'accordo, ma poi diventa altro. Benché vive sugli alberi, Cosimo partecipa a tutto: legge, scrive, aiuta i contadini, combatte perfino i pirati."
      errors: [subjunctive-use]
      gold: {text: "Benché vive", fix: "Benché viva"}
    - tutor: "Lo difendi con passione. Fermati però su «benché vive sugli alberi»: dopo «benché», che modo ci vuole?"
      prompt: {text: "Benché vive", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: benché viva sugli alberi, partecipa a tutto. La distanza, insomma, non gli impedisce di esserci."
    - tutor: "Giusto. Quindi per te il tema del libro è questo, stare lontani per vedere meglio?"
    - learner: "Sì, ma lo leggerei anche come un'allegoria dell'intellettuale: chi si stacca dalla società per guardarla dall'alto, senza però smettere di occuparsene."
    - tutor: "L'intellettuale sugli alberi, mi piace. E lo stile? A me quell'ironia leggera di Calvino a volte sembra una scusa per non prendere posizione."
      goals: [theme]
    - learner: "Al contrario, è la leggerezza che lo salva: se Calvino avrebbe calcato la mano, il libro sarebbe diventato una predica."
      errors: [hypothetical]
      gold: {text: "avrebbe calcato", fix: "avesse calcato"}
    - tutor: "Una predica, addirittura! Ma riprendi «se Calvino avrebbe calcato la mano»: nella frase con «se», il condizionale ci può stare?"
      prompt: {text: "avrebbe calcato", tags: [hypothetical]}
    - learner: "No: se avesse calcato la mano. Quando parlo in fretta mi scappa sempre."
    - tutor: "Bene così. Su Calvino mi hai quasi convinto, e non succede spesso. Allora, che cosa leggiamo il mese prossimo?"
      goals: [style, disagree]
    - learner: "Proporrei «Le città invisibili»: è più breve, ma ci costringe a discutere di nuovo di leggerezza e del modo in cui si guarda il mondo da lontano."
    - tutor: "Ancora Calvino? Va bene, ma solo perché così posso continuare a provocarvi. Segno «Le città invisibili» per il primo martedì del mese."
      goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, ma in due settimane, non in tre sere. La prima metà mi ha preso tantissimo; la seconda, a dire il vero, l'ho trovata un po' lenta."
    - tutor: "Lenta? Ma è lì che succede tutto! Che cosa intendi?"
      goals: [impression]
    - learner: "Che dopo la guerra la trama si sfilaccia: troppi cugini, troppi matrimoni, e la protagonista sparisce per cento pagine."
    - tutor: "Io credo che quella sparizione sia voluta. Parliamo di lei, allora: che cosa pensi della scelta di Teresa di non tornare più al paese?"
    - learner: "Credo che abbia avuto ragione a partire. Però, se fossi stata in lei, avrei scritto almeno una lettera alla madre: il libro non lo dice, ma secondo me la madre l'avrebbe perdonata."
    - tutor: "Perdonata? Io non ne sono così sicuro: quella madre è di pietra. E lo stile, invece, ti è piaciuto?"
      goals: [character]
    - learner: "Lo stile sì, asciutto e preciso: con un dettaglio, una sedia vuota a tavola, racconta un lutto intero. Però mi sarebbe piaciuto che l'autrice abbia tagliato qualche capitolo nella seconda parte."
      errors: [subjunctive-use]
      gold: {text: "abbia tagliato", fix: "avesse tagliato"}
    - tutor: "La sedia vuota è un'immagine perfetta. Riascolta però «mi sarebbe piaciuto che abbia tagliato»: con un condizionale passato nella principale, la subordinata può restare così?"
      prompt: {text: "abbia tagliato", tags: [subjunctive-use]}
    - learner: "Hai ragione: mi sarebbe piaciuto che avesse tagliato qualche capitolo."
    - tutor: "Perfetto. Sui tagli, però, non ti do ragione: senza quei capitoli lenti il finale non avrebbe lo stesso peso. A chi lo consiglieresti?"
      goals: [style]
    - learner: "A chi ha pazienza e ama le storie di famiglia. Non lo consiglierei ai miei alunni più giovani: lo troverebbero noioso e direbbero che è un libro per gente maggiore."
      errors: [false-friend]
    - tutor: "Un libro per gente anziana? Allora io sono il lettore ideale! E il prossimo, chi lo sceglie?"
      goals: [recommend]
      recast: {text: "per gente maggiore", fix: "per gente anziana", tags: [false-friend]}
    - learner: "Lo scegli tu, dai, ma a una condizione: che non superi le trecento pagine."
    - tutor: "Affare fatto: trecento pagine al massimo, e niente saghe familiari. Ci vediamo il primo giovedì del mese, come sempre."

- scenario: film-libro
  level: C2
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Tu, che cosa hai letto questo mese?"
    - learner: "Comincio io, se volete. Ho letto un giallo ambientato a Trieste negli anni Cinquanta, la cui protagonista è una traduttrice che lavora per gli Alleati."
    - tutor: "Trieste negli anni Cinquanta, città di confine e di spie: promette bene. Senza svelarci il finale, di che cosa parla?"
    - learner: "Mentre ha tradotto un verbale della polizia, la protagonista ha trovato un nome che non doveva esserci: quello di un uomo che tutti credevano morto in guerra."
      errors: [tense-aspect]
      gold: {text: "Mentre ha tradotto", fix: "Mentre traduceva"}
    - tutor: "Ottimo inizio da giallo. Ma «mentre ha tradotto un verbale»: è un'azione conclusa o lo sfondo su cui avviene la scoperta?"
      prompt: {text: "Mentre ha tradotto", tags: [tense-aspect]}
    - learner: "Lo sfondo, quindi: mentre traduceva un verbale della polizia. Il resto non lo dico, se no vi rovino tutto."
    - tutor: "Giusto, niente spoiler. E lei, la protagonista, com'è?"
      goals: [summary]
    - learner: "È una donna di cui all'inizio sappiamo pochissimo: parla quattro lingue, non si fida di nessuno e ha un passato che l'autore ci rivela solo a poco a poco."
    - tutor: "Una protagonista fatta di silenzi, mi piace. E nel complesso, ti è piaciuto?"
      goals: [characters]
    - learner: "Moltissimo. L'unica cosa che non mi ha convinto è il finale, un po' precipitato: le ultime venti pagine risolvono tutto troppo in fretta."
      errors: [word-choice]
    - tutor: "Un finale un po' affrettato è il difetto di tanti gialli: si costruisce la tensione per trecento pagine e poi si chiude in dieci. A chi lo consiglieresti?"
      goals: [opinion]
      recast: {text: "un po' precipitato", fix: "un po' affrettato", tags: [word-choice]}
    - learner: "A chi ama le atmosfere più dei colpi di scena, e a chi conosce Trieste: si riconoscono le vie, i caffè, perfino la bora."
    - tutor: "Allora lo metto nella lista dei prossimi titoli del gruppo. Chi vuole continuare? Laura, tocca a te."
      goals: [recommend]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, il tono è cambiato. Il passaggio più difficile è il dialogo tra le due sorelle: l'ironia sta tutta nelle cose non dette. In inglese basta un «Sure», mentre in italiano «Certo» suona sincero."
    - tutor: "Appunto, e infatti il tuo «Certo» è una dichiarazione d'affetto. Che cosa proponi?"
      goals: [problem]
    - learner: "Avrei due soluzioni: «Come no» oppure «Figurati». «Come no» rende meglio il sarcasmo, a patto che il lettore lo sente con il tono giusto; «Figurati» è più neutro."
      errors: [subjunctive-use]
      gold: {text: "lo sente", fix: "lo senta"}
    - tutor: "Ragionamento sensato, per una volta. Ma «a patto che il lettore lo sente»: dopo «a patto che», l'indicativo regge?"
      prompt: {text: "lo sente", tags: [subjunctive-use]}
    - learner: "No, ci vuole il congiuntivo: a patto che il lettore lo senta con il tono giusto."
    - tutor: "Bene. Ora la riga in cui l'autore descrive la sorella con un aggettivo che ha tradito molti traduttori prima di te. Come l'hai resa?"
      goals: [options]
    - learner: "«Ebbe il buon senso di non chiedere». So dove vuoi arrivare: «sensibile» sarebbe stato un falso amico da manuale, e infatti l'ho evitato."
    - tutor: "Ti avevo sottovalutata. Ma allora perché, due righe sotto, la sorella «realizza» di essere stata tradita?"
      goals: [false-friend]
    - learner: "Lì mi hai beccata: «si rende conto», ovviamente. Mi avevi detto di ricontrollare tutti i verbi più insidiosi, e io ti avevo assicurato che l'avevo fatto."
    - tutor: "E io ti avevo detto che ti avrei corretta con la penna rossa. Allora, decidiamo: «Come no» o «Figurati»?"
    - learner: "«Come no», e lo segnalo in nota al redattore: così, se protesta, se la prende con me e non con l'autore."
    - tutor: "Andata: «Come no», con la nota per il redattore. E la prossima volta il falso amico lo trovi da sola, prima che lo trovi io."
      goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto: non l'ho capita. Ho riso per solidarietà, perché ridevano tutti. Me la spieghi?"
    - tutor: "Il ministro aveva detto in un'intervista che la panna nella carbonara non è un reato. Il comico ha risposto che, per un romano, è l'unico reato che conti davvero."
      goals: [missed]
    - learner: "Adesso sì che ha senso! Io invece ho riso tantissimo alla battuta sui tram: ha detto che di tram, a Roma, ce ne sono tantissimi, ma lui in vent'anni ha visto passare solo tre in orario."
      errors: [ci-ne]
      gold: {text: "ha visto passare solo tre", fix: "ne ha visti passare solo tre"}
    - tutor: "Quella è più cronaca che comicità. Ma «ha visto passare solo tre»: tre che cosa? Con un numero da solo, quale pronome riprende i tram?"
      prompt: {text: "ha visto passare solo tre", tags: [ci-ne]}
    - learner: "Ah, certo: ne ha visti passare solo tre in orario. E la pausa che faceva prima di «tre» era perfetta."
    - tutor: "La pausa era tutto, hai ragione. E tu, un gioco di parole in italiano lo sapresti fare?"
      goals: [favourite]
    - learner: "Ci provo con una freddura che mi ha insegnato mia suocera: qual è il colmo per un elettricista? Non essere al corrente. Il doppio senso sta tutto in «corrente»."
    - tutor: "Classica, da pranzo di Natale: fa ridere proprio perché è terribile. E sulla satira politica? Secondo te dovrebbe avere dei limiti?"
      goals: [wordplay]
    - learner: "Secondo me no, a patto che colpisca chi ha potere e non chi è debole. Se un comico prende in giro un ministro, fa il suo mestiere; ma se ridesse dei poveri, sarebbe solo crudele."
    - tutor: "Quindi il limite non è l'argomento, ma il bersaglio. Mi hai convinto: brindiamo al ministro e alla sua carbonara con la panna."
      goals: [limits]

- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [register, tense-aspect]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie dell'invito. Più coraggio che incoscienza, spero. Il libro racconta i miei primi dieci anni in Italia, visti con gli occhi di chi è arrivato senza sapere nemmeno come si ordina un caffè al banco."
    - tutor: "Un inizio che molti ascoltatori conoscono bene. Ma perché ha sentito il bisogno di scriverlo?"
    - learner: "Perché mi sono accorta che gli italiani si giudicano con molta più severità di quanto li giudichi io. Ma dimmi, tu ti riconosci negli italiani del mio libro?"
      errors: [register]
      gold: {text: "dimmi, tu ti riconosci", fix: "mi dica, Lei si riconosce"}
    - tutor: "Bella domanda, e la girerò ai nostri ascoltatori. Però siamo in diretta nazionale e ci conosciamo da cinque minuti: «dimmi, tu ti riconosci» è il registro giusto?"
      prompt: {text: "dimmi, tu ti riconosci", tags: [register]}
    - learner: "Ha ragione, mi perdoni: mi dica, Lei si riconosce negli italiani del mio libro?"
    - tutor: "Molto meglio. Mi riconosco anche troppo, purtroppo. E veniamo alla domanda provocatoria: gli italiani sono davvero tutti mammoni e ritardatari?"
      goals: [present-book]
    - learner: "Sono stereotipi, ma come tutti gli stereotipi contengono un briciolo di verità. Più che mammoni, direi che gli italiani tengono alla famiglia in un modo che all'inizio mi sembrava soffocante e che adesso invidio."
    - tutor: "Diplomatica, ma non sfuggente. Ci racconti un episodio che Le ha fatto capire qualcosa di noi."
      goals: [stereotype]
    - learner: "Il primo inverno a Bologna avevo la febbre alta e vivevo da sola. La mia vicina, che conoscevo appena, ogni sera è salita con un brodo caldo e il giornale, senza dire una parola."
      errors: [tense-aspect]
      gold: {text: "è salita", fix: "saliva"}
    - tutor: "Una vicina così vale più di mille stereotipi. Ma «ogni sera è salita»: un'abitudine che si ripete nel passato, la racconta con quel tempo?"
      prompt: {text: "è salita", tags: [tense-aspect]}
    - learner: "No, è un'abitudine: ogni sera saliva con un brodo caldo. È stato lì che ho capito che cosa vuol dire vicinanza, qui."
    - tutor: "Proprio così. E l'italiano, imparandolo, che cosa ha cambiato in Lei?"
      goals: [anecdote]
    - learner: "Imparandolo, sono diventata più paziente e anche più teatrale: in italiano gesticolo, alzo la voce, interrompo. Mia madre dice che ho cambiato carattere, non lingua."
    - tutor: "Sua madre ha colto il punto. Per chiudere, una frase per i nostri ascoltatori?"
      goals: [language]
    - learner: "Che venire a vivere qui sia stato un atto di incoscienza, lo confermo; ma è l'incoscienza migliore che abbia mai avuto."
    - tutor: "Chiudiamo su questa, che è perfetta. Grazie, e buona fortuna con il libro. Restate con noi: dopo la pubblicità si parla di cinema."
      goals: [farewell]

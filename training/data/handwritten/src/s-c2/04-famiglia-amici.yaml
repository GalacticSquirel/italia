# Round 8, set s-c2, file 4: family, friends and social occasions. Slips: «mi la» for «me la»,
# «abbia pazienza» / «sia onesto» to someone addressed with tu, «senti» to someone addressed
# with Lei, «le adoravano», missing «ne» with a dislocated partitive, «gli l'ho», «vorremmo che
# vada», «ci lo», «che il padre» for «il cui padre», «purché» with the indicative, «soffrito»,
# missing trapassato, «se l'avrei», «non pretendi», false friends («salgo», «argomento»).
- scenario: cena-suoceri
  level: C2
  persona: en-m-heritage
  history: [combined-pronouns, imperative-form]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Spero di non deludervi, allora. Complimenti per la casa: da quella finestra si vede tutta la cupola, è uno spettacolo."
    - tutor: "La cupola è il nostro vanto, e il nostro tormento quando c'è la fila dei turisti sotto casa. Assaggi il peposo: l'ha preparato mia moglie."
    - learner: "Squisito, davvero. Signora, se non è un segreto di famiglia, mi la scriverebbe la ricetta?"
      errors: [combined-pronouns]
      gold: {text: "mi la scriverebbe", fix: "me la scriverebbe"}
    - tutor: "Mia moglie sorride, è lusingata. Ma «mi la scriverebbe»: quando «mi» incontra «la», resta uguale?"
      goals: [compliment]
      prompt: {text: "mi la scriverebbe", tags: [combined-pronouns]}
    - learner: "No, diventa «me»: me la scriverebbe, la ricetta?"
    - tutor: "Esatto, e vedrà che gliela scrive volentieri. Mi dica piuttosto: Lei di che cosa si occupa, esattamente? Mia figlia è sempre un po' vaga."
    - learner: "Faccio il restauratore di libri antichi, soprattutto per librerie e archivi. Non è un mestiere che rende ricchi, ma mi permette di vivere dignitosamente e di fare ciò che amo."
      errors: [false-friend]
    - tutor: "Restauratore di libri antichi per biblioteche e archivi: perfetto, in questa casa c'è parecchio da restaurare, a cominciare da me."
      goals: [background]
      recast: {text: "per librerie", fix: "per biblioteche", tags: [false-friend]}
    - learner: "Per i libri antichi ho le mani d'oro; per le persone, temo, servirebbe qualcuno più bravo di me. Comincerei piuttosto dalla cornice di quel ritratto, se me lo permette."
    - tutor: "Spiritoso e diplomatico: mia figlia mi aveva avvisato. Senta, a questo punto direi che possiamo darci del tu. Io sono Franco."
      goals: [irony]
    - learner: "Volentieri, Franco, grazie. Però abbia pazienza se ogni tanto mi scappa ancora il Lei: con un suocero che incute un certo rispetto, non è facile."
      errors: [imperative-form]
      gold: {text: "abbia pazienza", fix: "abbi pazienza"}
    - tutor: "Ci mancherebbe! Ma ascolta che cosa hai appena detto: mi dai del tu e poi «abbia pazienza»?"
      prompt: {text: "abbia pazienza", tags: [imperative-form]}
    - learner: "Hai ragione: abbi pazienza. Vedi? Ci sto già prendendo la mano."
    - tutor: "Già meglio di mio cognato, che dopo trent'anni mi dà ancora del Lei. Alla salute, allora!"
      goals: [tu-lei]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [imperative-form]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe, il lavoro può aspettare. Le porto le condoglianze di tutto l'ufficio, e le mie personali: mi dispiace moltissimo."
    - tutor: "Grazie. Alla fine è stata una cosa rapida: tre settimane dall'ospedale a oggi. Forse è stato meglio così."
      goals: [condolences]
    - learner: "Mi ricordo di quando Sua madre è venuta in ufficio con i taralli fatti in casa: li ha offerti a tutti, e i colleghi più giovani le adoravano."
      errors: [object-pronoun]
      gold: {text: "le adoravano", fix: "la adoravano"}
    - tutor: "I taralli erano il suo orgoglio. Ma, mi scusi, «i colleghi le adoravano»: con «adorare qualcuno», il pronome è diretto o indiretto?"
      prompt: {text: "le adoravano", tags: [object-pronoun]}
    - learner: "Diretto, certo: la adoravano. Diceva sempre che eravamo tutti troppo magri."
    - tutor: "Lo diceva a chiunque, anche a me che ho sessant'anni. Mi fa bene sentirlo, sa?"
      goals: [memory]
    - learner: "Senti, se posso fare qualcosa, me lo dica: per le pratiche, per l'ufficio, per qualsiasi cosa."
      errors: [imperative-form]
      gold: {text: "Senti", fix: "Senta"}
    - tutor: "Lei è molto gentile. Però ha cominciato con «senti» e poi mi ha dato del Lei: quale delle due forme stona?"
      prompt: {text: "Senti", tags: [imperative-form]}
    - learner: "Senta, volevo dire. Se posso fare qualcosa, me lo dica: anche solo sbrigare la posta urgente mentre Lei è assente."
    - tutor: "La posta urgente sì, mi toglierebbe un pensiero. Domani Le faccio avere le chiavi dell'armadio con i fascicoli."
      goals: [offer-help]
    - learner: "Allora tolgo il disturbo. Non si preoccupi di niente, in ufficio, e si prenda tutto il tempo che Le serve. Le sono vicino, davvero."
    - tutor: "Grazie di cuore. La accompagno alla porta, e saluti tutti da parte mia."
      goals: [leave]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [ci-ne, combined-pronouns]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Meno male, avevo paura di arrivare tardi! Ho portato un vino dei colli: l'ha scelto il ragazzo dell'enoteca, quindi se è cattivo la colpa è sua."
    - tutor: "Saggio, scaricare la responsabilità. Comunque la nonna dice che chi arriva ultimo resta con un pugno di mosche. Sai che cosa vuol dire?"
    - learner: "Immagino che voglia dire restare senza niente, a mani vuote. Spero di no: di lasagna ne vedo ancora mezza teglia."
    - tutor: "Hai capito al volo. Prendine pure, che oggi la nonna ne ha fatte due teglie."
      goals: [react]
    - learner: "Grazie! Di lasagne così, a Manchester, non ci sono: lì la chiamano lasagna, ma è un'altra cosa."
      errors: [ci-ne]
      gold: {text: "non ci sono", fix: "non ce ne sono"}
    - tutor: "A Manchester la nonna non ci metterebbe piede. Ma «di lasagne così non ci sono»: dopo aver anticipato «di lasagne così», che pronome ti serve per riprenderle?"
      prompt: {text: "non ci sono", tags: [ci-ne]}
    - learner: "Non ci ne sono?"
      errors: [ci-ne]
    - tutor: "Non ce ne sono, appunto, e infatti la nonna è convinta che all'estero mangino tutti male. Da voi c'è un modo di dire simile, su chi arriva tardi?"
      recast: {text: "ci ne sono", fix: "ce ne sono", tags: [ci-ne]}
    - learner: "Il contrario: noi diciamo che l'uccello mattiniero prende il verme. È la stessa idea, ma noi premiamo chi si alza presto, voi punite chi arriva tardi."
    - tutor: "Voi premiate, noi castighiamo: molto italiano. Dai, raccontaci una storia, una di quelle che finiscono con un proverbio."
      goals: [compare]
    - learner: "Una volta il mio capo mi ha chiesto un rapporto per lunedì. Io gli l'ho promesso, poi l'ho rimandato fino a domenica sera, e alla fine ho lavorato tutta la notte."
      errors: [combined-pronouns]
      gold: {text: "gli l'ho promesso", fix: "gliel'ho promesso"}
    - tutor: "Un classico! Ma «gli l'ho promesso»: «gli» più «lo», in italiano, come si fondono?"
      prompt: {text: "gli l'ho promesso", tags: [combined-pronouns]}
    - learner: "In una parola sola: gliel'ho promesso. E la morale è: non rimandare a domani quello che puoi fare oggi."
    - tutor: "Perfetto, e il proverbio è caduto proprio al momento giusto. Brindiamo a chi non rimanda, allora: e passami il vino, prima che se lo finiscano gli zii."
      goals: [use-idiom, anecdote]

- scenario: modi-di-dire
  level: C2
  persona: en-m-heritage
  history: [tense-aspect, imperative-form]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Stamattina sono arrivato in stazione e il treno è già partito: avevo letto male l'orario."
      errors: [tense-aspect]
      gold: {text: "è già partito", fix: "era già partito"}
    - tutor: "Cominciamo bene. Ma «sono arrivato e il treno è già partito»: la partenza viene prima del tuo arrivo, e quale tempo lo mostra?"
      prompt: {text: "è già partito", tags: [tense-aspect]}
    - learner: "Allora... il treno partiva già?"
      errors: [tense-aspect]
    - tutor: "Il treno era già partito, e tu sul binario come un baccalà! E poi?"
      recast: {text: "il treno partiva già", fix: "il treno era già partito", tags: [tense-aspect]}
    - learner: "Poi, cercando un taxi, ho messo il piede in una pozzanghera enorme. Sono arrivato in ufficio con una scarpa fradicia, e la riunione era cominciata da mezz'ora."
    - tutor: "Piove sempre sul bagnato, eh? E in riunione, com'è andata?"
      goals: [tell]
    - learner: "Altro che piovere sul bagnato: era un diluvio! Il capo mi ha guardato come per dire «è la terza volta», e io sono diventato rosso come un peperone."
    - tutor: "Rosso come un peperone e con una scarpa fradicia: una figuraccia da manuale. Ma di chi è la colpa, alla fine?"
      goals: [react]
    - learner: "Metà e metà: io ero andato a letto alle due, ma l'applicazione segnava un orario vecchio. E non guardarmi così: sia onesto, a te non è mai successo?"
      errors: [imperative-form]
      gold: {text: "sia onesto", fix: "sii onesto"}
    - tutor: "A me? Mai, sono un orologio svizzero. Ma «sia onesto»: stai dando del Lei al tuo amico di sempre?"
      prompt: {text: "sia onesto", tags: [imperative-form]}
    - learner: "Sii onesto, volevo dire! Sii onesto e ammetti che l'anno scorso hai perso l'aereo per Lisbona."
    - tutor: "Colpito e affondato: quell'aereo me lo rinfaccerai a vita. Allora, che cosa impari da questa giornata?"
      goals: [blame]
    - learner: "Che chi va piano va sano e va lontano, ma solo se parte in orario. E che la sera prima di una riunione si va a letto presto."
    - tutor: "Saggezza popolare aggiornata! Brindiamo alle sveglie puntuali, allora."
      goals: [moral]

- scenario: organizzare-matrimonio
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo semplice ma curato: una cerimonia civile all'aperto, una sessantina di invitati e soprattutto niente balli di gruppo."
    - tutor: "Niente trenini, ricevuto. Avete già in mente un budget?"
      goals: [vision]
    - learner: "Pensavamo a ventimila euro, tutto compreso. Ma vorremmo che la maggior parte vada nel cibo e nel fotografo."
      errors: [subjunctive-use]
      gold: {text: "la maggior parte vada", fix: "la maggior parte andasse"}
    - tutor: "Cibo e fotografo, priorità sagge. Ma «vorremmo che vada»: dopo un condizionale come «vorremmo», il congiuntivo presente funziona?"
      prompt: {text: "la maggior parte vada", tags: [subjunctive-use]}
    - learner: "Ah... vorremmo che la maggior parte va nel cibo?"
      errors: [subjunctive-use]
    - tutor: "«Vorremmo che la maggior parte andasse nel cibo»: chiarissimo. Si può fare, ma allora conviene risparmiare sulla location. Ne ho due: una masseria vicino a Ostuni, tra gli ulivi, e un ex convento sul lago d'Orta, più raccolto ma più caro di tremila euro."
      goals: [budget]
      recast: {text: "la maggior parte va", fix: "la maggior parte andasse", tags: [subjunctive-use]}
    - learner: "La masseria ci piace di più: è più rustica e gli invitati potrebbero dormire lì. Il convento è suggestivo, ma con sessanta persone sarebbe un po' stretto."
    - tutor: "La masseria, allora: ottima scelta anche per il budget. Ci sono condizioni a cui tenete particolarmente?"
      goals: [choices]
    - learner: "Sì, due. Ogni variazione di prezzo ce la deve comunicare per iscritto. E il menù, quando è pronto, ci lo mandi prima di confermarlo al catering."
      errors: [combined-pronouns]
      gold: {text: "ci lo mandi", fix: "ce lo mandi"}
    - tutor: "Condizioni ragionevoli. Ma «ci lo mandi»: davanti a «lo», che cosa diventa «ci»?"
      prompt: {text: "ci lo mandi", tags: [combined-pronouns]}
    - learner: "Ce lo mandi, certo: ce lo mandi per e-mail, così ne parliamo con calma tra noi."
    - tutor: "Benissimo. Riepilogo: masseria, sessanta invitati, ventimila euro e ogni variazione per iscritto. Il menù ve lo mando lunedì."
      goals: [conditions]

- scenario: dialetti-regionali
  level: C2
  persona: es-m-worker
  history: [relative-pronoun, false-friend]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Un po' sì, ma solo le parole che somigliano allo spagnolo. Il resto era musica: velocissima, con vocali che sparivano a fine parola."
    - tutor: "Le vocali finali che spariscono sono il marchio di fabbrica del napoletano. Che altro hai notato, girando per l'Italia?"
      goals: [notice]
    - learner: "A Milano, per esempio, ho un collega che il padre è siciliano: con gli amici parla milanese, con la nonna solo siciliano."
      errors: [relative-pronoun]
      gold: {text: "che il padre", fix: "il cui padre"}
    - tutor: "Un bilingue di dialetti, bellissimo. Ma «un collega che il padre è siciliano»: per dire di chi è il padre, quale relativo ti serve?"
      prompt: {text: "che il padre", tags: [relative-pronoun]}
    - learner: "Il cui: un collega il cui padre è siciliano. È lui che mi ha insegnato «ghe pensi mi»."
    - tutor: "Perfetto. E in napoletano, c'è una parola che ti incuriosisce?"
    - learner: "Sì, «guaglione». Ho capito che vuol dire ragazzo, ma non so se si possa usare anche in italiano, magari scherzando."
    - tutor: "Si usa eccome, anche fuori da Napoli, ma sempre con un tono affettuoso o ironico. E il dialetto, secondo te, impoverisce l'italiano o lo arricchisce?"
      goals: [example]
    - learner: "Lo arricchisce. L'unico problema è quando si usa per escludere: a volte, quando salgo con i colleghi napoletani, parlano solo dialetto e io resto fuori."
      errors: [false-friend]
    - tutor: "«Quando esco con i colleghi» e loro passano al dialetto, insomma, ti senti tagliato fuori. Spesso, però, è un segno di confidenza: ti trattano già come uno di loro."
      recast: {text: "salgo con i colleghi", fix: "esco con i colleghi", tags: [false-friend]}
    - learner: "Può darsi. Mi sembra che oggi l'italiano e il dialetto convivano senza troppi problemi: si passa dall'uno all'altro anche nella stessa frase."
    - tutor: "È quella che noi linguisti chiamiamo commutazione di codice, e la fanno quasi tutti. Ultima domanda: i dialetti vanno protetti, secondo te?"
      goals: [standard]
    - learner: "Sì, purché non si imbalsamano nei musei: un dialetto vive finché la gente ci litiga, ci scherza, ci fa l'amore."
      errors: [subjunctive-use]
      gold: {text: "non si imbalsamano", fix: "non si imbalsamino"}
    - tutor: "Bellissimo, quel «ci fa l'amore». Ma «purché non si imbalsamano»: «purché» si accontenta dell'indicativo?"
      prompt: {text: "non si imbalsamano", tags: [subjunctive-use]}
    - learner: "No, vuole il congiuntivo: purché non si imbalsamino."
    - tutor: "Esatto. Lo scriverò nel mio prossimo articolo, citandoti. Eccoci a Napoli: benvenuto nella patria delle vocali scomparse!"
      goals: [opinion]

- scenario: vita-in-italia
  level: C2
  persona: en-f-professional
  history: [hypothetical, past-participle-form]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a tutti. In realtà non l'ho scelta io: l'ha scelta l'azienda per cui lavoravo, che mi aveva trasferita a Torino per due anni. Scaduti i due anni, sono rimasta."
    - tutor: "Due anni diventati... quanti, esattamente?"
      goals: [story]
    - learner: "Ormai sono undici. Il primo inverno, però, ho soffrito moltissimo: la nebbia, il buio alle cinque e nessun amico con cui lamentarmene."
      errors: [past-participle-form]
      gold: {text: "ho soffrito", fix: "ho sofferto"}
    - tutor: "Undici anni! Ma «ho soffrito»: il participio di «soffrire» è regolare?"
      prompt: {text: "ho soffrito", tags: [past-participle-form]}
    - learner: "No, è come «offerto»: ho sofferto moltissimo, soprattutto a gennaio."
    - tutor: "Proprio così. E a parte la nebbia, qual è stata la cosa più difficile?"
    - learner: "La burocrazia. Per il permesso di soggiorno sono tornata in questura sei volte, perché ogni volta mancava un documento che nessuno mi ha chiesto prima."
      errors: [tense-aspect]
      gold: {text: "nessuno mi ha chiesto prima", fix: "nessuno mi aveva chiesto prima"}
    - tutor: "Sei volte! Ma «un documento che nessuno mi ha chiesto prima»: quella richiesta mancata viene prima delle visite in questura. Che tempo serve?"
      prompt: {text: "nessuno mi ha chiesto prima", tags: [tense-aspect]}
    - learner: "Che nessuno mi chiedeva prima?"
      errors: [tense-aspect]
    - tutor: "«Nessuno mi aveva chiesto prima»: è la frase che sentiamo da quasi tutti gli stranieri, purtroppo. E Lei, in questi undici anni, come è cambiata?"
      goals: [difficulties]
      recast: {text: "nessuno mi chiedeva prima", fix: "nessuno mi aveva chiesto prima", tags: [tense-aspect]}
    - learner: "Sono diventata meno rigida. Prima, se l'idraulico arrivava con un'ora di ritardo, mi arrabbiavo; adesso penso che abbia avuto i suoi motivi e gli offro un caffè."
    - tutor: "Una conversione completa! E un consiglio per chi ci ascolta e sta pensando di trasferirsi?"
      goals: [change]
    - learner: "Imparate la lingua prima di partire. Se l'avrei imparata meglio, mi sarei risparmiata metà delle code in questura."
      errors: [hypothetical]
      gold: {text: "l'avrei imparata", fix: "l'avessi imparata"}
    - tutor: "Consiglio prezioso. Ma «se l'avrei imparata meglio»: per un'ipotesi nel passato, dopo «se», quale modo ci vuole?"
      prompt: {text: "l'avrei imparata", tags: [hypothetical]}
    - learner: "Il congiuntivo trapassato: se l'avessi imparata meglio, mi sarei risparmiata metà delle code."
    - tutor: "Perfetto, e chi ci ascolta ne farà tesoro. Grazie di essere stata con noi, e buona nebbia torinese!"
      goals: [advice]

- scenario: intervista-podcast
  level: C2
  persona: en-m-retired
  history: [false-friend, imperative-form]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Per colpa di un vino. Trent'anni fa, in vacanza in Umbria, ho bevuto un Sagrantino in una trattoria e mi sono detto che, una volta in pensione, sarei venuto a vivere lì. Ci ho messo trent'anni, ma ce l'ho fatta."
    - tutor: "Una promessa mantenuta: rarissimo! E la prima cosa che ti ha spiazzato, appena arrivato?"
      goals: [story]
    - learner: "Il modo di discutere. Al bar parlavano di politica come se fosse una partita, e all'inizio pensavo che stessero per fare a pugni. In realtà era solo un argomento sul prezzo delle olive."
      errors: [false-friend]
    - tutor: "Una discussione sul prezzo delle olive, in Umbria, è quasi una questione d'onore! E c'è qualcosa che invece proprio non ti va giù?"
      goals: [culture-shock]
      recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
    - learner: "Sinceramente, la burocrazia. Quando ho comprato casa, il notaio ha preteso un certificato che in Inghilterra non esiste nemmeno. Vorrei che qualcuno mi spiega perché."
      errors: [subjunctive-use]
      gold: {text: "qualcuno mi spiega", fix: "qualcuno mi spiegasse"}
    - tutor: "Classico. Ma «vorrei che qualcuno mi spiega»: dopo «vorrei che», quale tempo del congiuntivo ci vuole?"
      prompt: {text: "qualcuno mi spiega", tags: [subjunctive-use]}
    - learner: "Vorrei che qualcuno mi spieghi perché?"
      errors: [subjunctive-use]
    - tutor: "«Vorrei che qualcuno mi spiegasse perché»: lo dicono anche gli italiani, quindi sei perfettamente integrato. Che consiglio daresti a chi sta pensando di trasferirsi?"
      goals: [critique]
      recast: {text: "qualcuno mi spieghi", fix: "qualcuno mi spiegasse", tags: [subjunctive-use]}
    - learner: "Non avere fretta. E non pretendi che tutto funzioni come a casa tua: impara la lingua, siediti al bar e ascolta."
      errors: [imperative-form]
      gold: {text: "non pretendi", fix: "non pretendere"}
    - tutor: "Consiglio d'oro. Ma «non pretendi»: con il tu, l'imperativo negativo come si forma?"
      prompt: {text: "non pretendi", tags: [imperative-form]}
    - learner: "Con l'infinito: non pretendere che tutto funzioni come a casa tua."
    - tutor: "Esatto. E con questo chiudiamo la puntata: grazie, e alla prossima bottiglia di Sagrantino!"
      goals: [advice]

# Round 8, set s-c2, file 8: exhibitions, family dinners, condolences, podcasts, radio, book
# clubs and Sunday lunch. Slips: Spanish words («pintato», «al fondo», «querida», «perdere
# l'umore», «si mettono rossi»), «pensavo che... era», «sappia» to a friend, «la sua figlia»,
# «gli lo», «mi dia» after switching to tu, «stii», «non esita», «non avevo neanche uno»,
# «mi scusi» to a host who uses tu, «aspettarsi che» + indicative, «la sangue», «non ha
# bastato», «benché ho vissuto», «mi sono sembrato», «averei», «avrei preferito che si prenda»,
# «diciavano», «mentre abbiamo fatto», «me lo puoi spiegarlo», missing «ne», «gli li».
# Correct «ne vado fiera», «il cui orgoglio», «ridetene», «ve li tenete» left alone.
- scenario: arte-mostra
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, imperative-form]
  turns:
    - tutor: "Guarda questa tavola. Che impressione ti fa?"
    - learner: "Mi colpisce subito quel blu del manto: è così intenso che sembra pintato ieri."
      errors: [word-choice]
    - tutor: "Sembra dipinto ieri, vero? È lapislazzuli, il pigmento più costoso dell'epoca: il committente voleva far vedere che poteva permetterselo."
      goals: [react]
      recast: {text: "pintato ieri", fix: "dipinto ieri", tags: [word-choice]}
    - learner: "Quindi il colore lo sceglieva il committente, non il pittore? Pensavo che il pittore era libero."
      errors: [subjunctive-use]
      gold: {text: "il pittore era libero", fix: "il pittore fosse libero"}
    - tutor: "Bella domanda. Ma «pensavo che il pittore era libero»: dopo «pensavo che», quale modo ci vuole?"
      prompt: {text: "il pittore era libero", tags: [subjunctive-use]}
    - learner: "Il congiuntivo: pensavo che il pittore fosse libero."
    - tutor: "Esatto. E invece il contratto stabiliva tutto: colori, figure, perfino quanto oro usare. Descrivimi la scena, adesso."
    - learner: "A sinistra l'angelo, in ginocchio, con le ali ancora aperte, come se fosse appena atterrato. A destra la Madonna, sotto un portico, che si ritrae un po'. In mezzo uno spazio vuoto e, al fondo, un giardino in prospettiva."
      errors: [word-choice]
    - tutor: "Sullo sfondo, un giardino chiuso da un muro: è il simbolo della purezza di Maria. E quello spazio vuoto in mezzo, che cosa vuol dire, secondo te?"
      goals: [describe]
      recast: {text: "al fondo", fix: "sullo sfondo", tags: [word-choice]}
    - learner: "Aspetta, non dirmelo: sappia che voglio arrivarci da sola."
      errors: [imperative-form]
      gold: {text: "sappia", fix: "sappi"}
    - tutor: "Brava, arrivaci da sola. Ma «sappia che voglio arrivarci»: con me, che sono tuo amico, quella forma va bene?"
      prompt: {text: "sappia", tags: [imperative-form]}
    - learner: "No, è il Lei: sappi che voglio arrivarci da sola. Ecco: secondo me il vuoto è il tempo dell'attesa, il momento prima della risposta."
    - tutor: "Bellissimo, e molto vicino a quello che scrivono gli studiosi. Ti ricorda l'altra Annunciazione che abbiamo visto stamattina?"
      goals: [interpret]
    - learner: "Sì, quella della prima sala, dove la Madonna legge e l'angelo entra quasi in punta di piedi. Lì l'atmosfera è intima; qui c'è una distanza che quasi mi mette a disagio."
    - tutor: "Hai ragione: lì l'angelo bussa, qui irrompe. Andiamo a prenderci un caffè, che dopo tre ore di Quattrocento ce lo siamo meritato."
      goals: [compare]

- scenario: cena-suoceri
  level: C2
  persona: es-f-teacher
  history: [possessive, combined-pronouns]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Spero di essere all'altezza delle aspettative, allora! Grazie dell'invito: la casa è bellissima, e quel profumo di arrosto si sente fin dalle scale."
    - tutor: "Merito di mia moglie: io mi limito ad aprire il vino. A proposito, lo assaggi: è di un piccolo produttore del Chianti, un amico."
      goals: [compliment]
    - learner: "È buonissimo. La sua figlia mi aveva detto che Lei è un intenditore, e adesso capisco perché."
      errors: [possessive]
      gold: {text: "La sua figlia", fix: "Sua figlia"}
    - tutor: "Mia figlia esagera sempre. Ma «la sua figlia»: con un nome di parentela al singolare, l'articolo ci vuole?"
      prompt: {text: "La sua figlia", tags: [possessive]}
    - learner: "No: Sua figlia mi aveva detto che Lei è un intenditore."
    - tutor: "Esatto. E Lei, mi dica, di che cosa vive? Mia figlia parla di «progetti», al plurale, il che mi preoccupa un po'."
    - learner: "Insegno spagnolo in un liceo e il fine settimana faccio la guida per i gruppi spagnoli. Detto così sembra poco stabile, lo so, ma il posto al liceo è a tempo indeterminato."
    - tutor: "A tempo indeterminato! Allora La perdoniamo per il plurale. Ma mi tolga una curiosità: gli spagnoli cenano davvero alle dieci di sera?"
      goals: [background]
    - learner: "Alle dieci, e a volte anche più tardi. Ma non si preoccupi: se stasera ceniamo alle otto, non lo dirò a nessuno, e se me lo chiedono in Spagna, gli lo negherò."
      errors: [combined-pronouns]
      gold: {text: "gli lo negherò", fix: "glielo negherò"}
    - tutor: "Complice e diplomatica: ottimo. Ma «gli lo negherò»: «gli» e «lo», insieme, che forma prendono?"
      prompt: {text: "gli lo negherò", tags: [combined-pronouns]}
    - learner: "Ce lo negherò?"
      errors: [combined-pronouns]
    - tutor: "«Glielo negherò»: me lo segno, nel caso venissimo a trovarvi in Spagna. Senta, a questo punto direi che possiamo darci del tu. Io sono Paolo."
      goals: [irony]
      recast: {text: "Ce lo negherò", fix: "Glielo negherò", tags: [combined-pronouns]}
    - learner: "Con piacere, Paolo! Allora però mi dia un consiglio: che cosa posso portare la prossima volta?"
      errors: [imperative-form]
      gold: {text: "mi dia", fix: "dammi"}
    - tutor: "Volentieri. Ma ci siamo appena dati del tu, e tu mi dici «mi dia un consiglio»?"
      prompt: {text: "mi dia", tags: [imperative-form]}
    - learner: "Hai ragione: dammi un consiglio! Che cosa ti posso portare la prossima volta?"
    - tutor: "Un'altra bottiglia di questo Chianti, e la ricetta della paella per mia moglie. Alla salute!"
      goals: [tu-lei]

- scenario: condoglianze
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-form, imperative-form]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe. Le porto le condoglianze di tutto il laboratorio. Ho conosciuto Sua madre solo una volta, ma si vedeva che era una persona molto querida da tutti."
      errors: [word-choice]
    - tutor: "Era molto amata da tutti, sì: al funerale c'era mezzo paese. Dove l'aveva conosciuta?"
      goals: [condolences]
      recast: {text: "molto querida da tutti", fix: "molto amata da tutti", tags: [word-choice]}
    - learner: "Alla cena di Natale di due anni fa: mi ha parlato del suo orto per un'ora e alla fine ha voluto che portassi a casa un barattolo di pomodori secchi. Spero che la famiglia stii bene, in questi giorni."
      errors: [subjunctive-form]
      gold: {text: "la famiglia stii", fix: "la famiglia stia"}
    - tutor: "I pomodori secchi, certo: li regalava a chiunque. Ma «spero che la famiglia stii bene»: il congiuntivo di «stare» è proprio quello?"
      prompt: {text: "la famiglia stii", tags: [subjunctive-form]}
    - learner: "Che la famiglia stasse bene?"
      errors: [subjunctive-form]
    - tutor: "«Spero che la famiglia stia bene»: grazie, ci stiamo facendo forza a vicenda. Mio fratello è arrivato ieri da Torino."
      goals: [memory]
      recast: {text: "la famiglia stasse", fix: "la famiglia stia", tags: [subjunctive-form]}
    - learner: "Se ha bisogno di qualcosa, non esita a chiamarmi: posso occuparmi io del seminario di giovedì, così non deve pensarci."
      errors: [imperative-form]
      gold: {text: "non esita", fix: "non esiti"}
    - tutor: "È molto gentile. Ma «non esita a chiamarmi» è un invito, rivolto a me con il Lei: che forma vuole?"
      prompt: {text: "non esita", tags: [imperative-form]}
    - learner: "L'imperativo di cortesia: non esiti a chiamarmi."
    - tutor: "Grazie. Il seminario di giovedì, sì: se può tenerlo Lei, mi toglie un peso. Le mando gli appunti stasera."
      goals: [offer-help]
    - learner: "Lo faccio volentieri. Ora La lascio riposare: si prenda tutto il tempo che Le serve, e ci vediamo quando se la sentirà."
    - tutor: "Grazie di cuore, davvero. La accompagno alla porta."
      goals: [leave]

- scenario: intervista-podcast
  level: C2
  persona: en-f-student
  history: [ci-ne, register]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Per un Erasmus a Bologna, sei anni fa. Avevo già studiato italiano all'università, ma appena arrivata non capivo niente: parlavano tutti molto più in fretta che nei dialoghi del libro."
    - tutor: "I dialoghi del libro, dove tutti ordinano un cappuccino con calma! E poi perché sei rimasta?"
    - learner: "Mi sono innamorata della città, e anche di un bolognese, lo confesso. All'inizio, però, è stata dura: di amici veri non avevo neanche uno."
      errors: [ci-ne]
      gold: {text: "non avevo neanche uno", fix: "non ne avevo neanche uno"}
    - tutor: "Due amori in un colpo solo! Ma «di amici veri non avevo neanche uno»: per riprendere «di amici veri», che cosa ti serve davanti al verbo?"
      prompt: {text: "non avevo neanche uno", tags: [ci-ne]}
    - learner: "«Ne»: di amici veri non ne avevo neanche uno."
    - tutor: "Esatto. E qual è la differenza culturale che ti ha spiazzata di più?"
      goals: [story]
    - learner: "Gli orari delle cene. La prima volta che mi hanno invitata a casa sono arrivata puntuale, alle otto, e loro erano ancora nella doccia. Poi ho imparato che «alle otto» vuol dire «verso le nove meno un quarto»."
      errors: [word-choice]
    - tutor: "Ancora sotto la doccia alle otto: il quarto d'ora accademico, versione cena. E c'è qualcosa che proprio non sopporti?"
      goals: [culture-shock]
      recast: {text: "nella doccia", fix: "sotto la doccia", tags: [word-choice]}
    - learner: "Sì, ma mi scusi, posso essere sincera fino in fondo?"
      errors: [register]
      gold: {text: "mi scusi", fix: "scusami"}
    - tutor: "Certo, è il bello del podcast! Ma «mi scusi»: io ti do del tu da mezz'ora, e tu mi dai del Lei?"
      prompt: {text: "mi scusi", tags: [register]}
    - learner: "Hai ragione, scusami! Allora: certe trasmissioni televisive trattano le donne come soprammobili, e nessuno sembra scandalizzarsene."
    - tutor: "Una critica dura, ma difficile da contestare. Ultima domanda: un consiglio per chi sta pensando di trasferirsi qui?"
      goals: [critique]
    - learner: "Imparate la lingua prima di partire, e non aspettatevi che tutto funziona subito: l'Italia si conquista con la pazienza."
      errors: [subjunctive-use]
      gold: {text: "tutto funziona", fix: "tutto funzioni"}
    - tutor: "Bel motto. Ma «non aspettatevi che tutto funziona»: dopo «aspettarsi che», quale modo ci vuole?"
      prompt: {text: "tutto funziona", tags: [subjunctive-use]}
    - learner: "Che tutto funzionasse?"
      errors: [subjunctive-use]
    - tutor: "«Non aspettatevi che tutto funzioni subito»: lo mettiamo come titolo della puntata."
      goals: [advice]
      recast: {text: "tutto funzionasse", fix: "tutto funzioni", tags: [subjunctive-use]}
    - learner: "Mi sembra perfetto. Grazie a voi, è stato un piacere."
    - tutor: "Il piacere è stato nostro. E voi che ci ascoltate, ci ritroviamo martedì prossimo con un nuovo ospite."

- scenario: vita-in-italia
  level: C2
  persona: es-m-worker
  history: [noun-gender, auxiliary-choice]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno. Sono arrivato vent'anni fa da Buenos Aires: mia nonna era calabrese, e io ho sempre detto di avere la sangue calabrese. Dovevo restare un mese; poi ho trovato lavoro, e sono ancora qui."
      errors: [noun-gender]
      gold: {text: "la sangue", fix: "il sangue"}
    - tutor: "Un mese diventato vent'anni! Ma «la sangue calabrese»: «sangue», in italiano, è maschile o femminile?"
      prompt: {text: "la sangue", tags: [noun-gender]}
    - learner: "Maschile: il sangue calabrese. In spagnolo è femminile, per questo mi confondo."
    - tutor: "Esatto. E all'inizio, qual è stata la cosa più difficile?"
      goals: [story]
    - learner: "Il lavoro. Il primo anno ho cambiato tre impieghi, e il mio stipendio non ha bastato neanche per l'affitto."
      errors: [auxiliary-choice]
      gold: {text: "non ha bastato", fix: "non è bastato"}
    - tutor: "Un inizio in salita. Ma «lo stipendio non ha bastato»: con «bastare», quale ausiliare ci vuole?"
      prompt: {text: "non ha bastato", tags: [auxiliary-choice]}
    - learner: "Essere: lo stipendio non è bastato neanche per l'affitto. Per fortuna mio cugino mi ha ospitato per un anno intero."
    - tutor: "Per fortuna c'era il cugino. E in vent'anni, Lei com'è cambiato?"
      goals: [difficulties]
    - learner: "Sono diventato più italiano degli italiani: mi lamento del governo, del traffico e dell'arbitro. Però, benché ho vissuto qui metà della mia vita, quando sento un tango mi viene ancora un nodo in gola."
      errors: [subjunctive-use]
      gold: {text: "benché ho vissuto", fix: "benché abbia vissuto"}
    - tutor: "Che bella immagine, il tango. Ma «benché ho vissuto qui metà della mia vita»: dopo «benché», quale modo serve?"
      prompt: {text: "benché ho vissuto", tags: [subjunctive-use]}
    - learner: "Benché avessi vissuto qui metà della mia vita?"
      errors: [subjunctive-use]
    - tutor: "«Benché abbia vissuto qui metà della mia vita»: la nostalgia non passa, e forse è giusto così. Che consiglio darebbe a chi pensa di trasferirsi?"
      goals: [change]
      recast: {text: "Benché avessi vissuto", fix: "Benché abbia vissuto", tags: [subjunctive-use]}
    - learner: "Di non aspettare di sentirsi pronto: se avessi aspettato il momento giusto, sarei ancora a Buenos Aires. E di avere pazienza con la burocrazia, senza perdere mai l'umore."
      errors: [word-choice]
    - tutor: "Non perdere mai il buon umore, nemmeno in questura: un consiglio d'oro. Grazie di essere stato con noi!"
      goals: [advice]
      recast: {text: "perdere mai l'umore", fix: "perdere mai il buon umore", tags: [word-choice]}
    - learner: "Grazie a voi. E un saluto a mia nonna, che ci ascolta da lassù."
    - tutor: "Un saluto alla nonna, allora, e a tutti voi che ci ascoltate. Alla prossima puntata!"

- scenario: club-lettura
  level: C2
  persona: en-m-traveller
  history: [participle-agreement, conditional-form]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, e a me è piaciuto, anche se non subito: le prime cinquanta pagine mi sono sembrato lentissime."
      errors: [participle-agreement]
      gold: {text: "mi sono sembrato", fix: "mi sono sembrate"}
    - tutor: "L'inizio è un po' faticoso, è vero. Ma «le prime cinquanta pagine mi sono sembrato»: il participio con che cosa si accorda?"
      prompt: {text: "mi sono sembrato", tags: [participle-agreement]}
    - learner: "Con le pagine: mi sono sembrate lentissime. Poi, dalla guerra in avanti, non riuscivo più a smettere."
    - tutor: "La guerra è il cuore del libro. Che cosa pensi di Ettore, il fratello maggiore?"
      goals: [impression]
    - learner: "È il personaggio che ho odiato di più e quello a cui penso ancora. Un uomo il cui orgoglio rovina tutto, ma con un coraggio che il fratello non ha mai avuto."
    - tutor: "Odiato e ammirato, come tutti i fratelli maggiori. Secondo te ha fatto bene a vendere la casa di famiglia?"
    - learner: "No. Al suo posto, io averei aspettato, o almeno ne avrei parlato prima con la madre: venderla di nascosto è un tradimento."
      errors: [conditional-form]
      gold: {text: "averei aspettato", fix: "avrei aspettato"}
    - tutor: "Una condanna senza appello! Ma «averei aspettato»: il condizionale di «avere» ha davvero quella vocale in più?"
      prompt: {text: "averei aspettato", tags: [conditional-form]}
    - learner: "No: avrei aspettato. Io avrei aspettato, e lui no."
    - tutor: "Esatto. E lo stile? A me quei capitoli brevissimi, quasi telegrafici, sono sembrati geniali."
      goals: [character]
    - learner: "A me un po' meno: alcuni sembrano appunti. Avrei preferito che l'autrice si prenda più spazio per i dialoghi."
      errors: [subjunctive-use]
      gold: {text: "si prenda", fix: "si prendesse"}
    - tutor: "Sei severo. Ma «avrei preferito che si prenda più spazio»: con un condizionale passato nella principale, quel congiuntivo va bene?"
      prompt: {text: "si prenda", tags: [subjunctive-use]}
    - learner: "Che si prende più spazio?"
      errors: [subjunctive-use]
    - tutor: "Avresti preferito che l'autrice si prendesse più spazio: lo capisco, ma per me quel ritmo è il suo marchio. A chi lo consiglieresti?"
      goals: [style]
      recast: {text: "si prende", fix: "si prendesse", tags: [subjunctive-use]}
    - learner: "A chi ha fratelli, sicuramente, e a chi ha litigato per un'eredità. A mia madre, invece, non lo regalerei: si riconoscerebbe troppo."
    - tutor: "Allora lo regalo io alla mia, che con mio zio non si parla da dieci anni. Ci vediamo al prossimo incontro."
      goals: [recommend]

- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  history: [imperfetto-form, word-choice]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere. Più incoscienza che coraggio, direi. Il libro raccoglie gli aneddoti della mia classe serale di spagnolo, dove insegno a adulti italiani da dodici anni."
    - tutor: "Una classe serale: una miniera d'oro per chi scrive. Perché ha deciso di raccontarla?"
    - learner: "Perché ogni martedì i miei studenti diciavano cose più divertenti di qualsiasi romanzo. Uno di loro, un notaio in pensione, traduceva in spagnolo le canzoni di Sanremo, sbagliandole tutte con grande serietà."
      errors: [imperfetto-form]
      gold: {text: "diciavano", fix: "dicevano"}
    - tutor: "Un notaio che traduce Sanremo: già lo adoro. Ma «diciavano»: l'imperfetto di «dire» si forma proprio così?"
      prompt: {text: "diciavano", tags: [imperfetto-form]}
    - learner: "Diceano?"
      errors: [imperfetto-form]
    - tutor: "Dicevano cose più divertenti di qualsiasi romanzo, e Lei prendeva appunti, immagino. Ora la domanda scomoda: è vero che gli italiani non sanno le lingue straniere?"
      goals: [present-book]
      recast: {text: "Diceano", fix: "Dicevano", tags: [imperfetto-form]}
    - learner: "È uno stereotipo, ma un fondo di verità ce l'ha. I miei studenti capiscono benissimo, ma quando devono parlare si mettono rossi e cominciano a scusarsi."
      errors: [word-choice]
    - tutor: "Diventano rossi e chiedono scusa: in effetti, è molto italiano. Ci racconti un episodio della classe che non ha mai dimenticato."
      goals: [stereotype]
      recast: {text: "si mettono rossi", fix: "diventano rossi", tags: [word-choice]}
    - learner: "Una sera, mentre abbiamo fatto il ripasso, è mancata la luce in tutto il quartiere. Invece di andare a casa, abbiamo continuato a lume di candela, e il notaio ha cantato Sanremo in spagnolo."
      errors: [tense-aspect]
      gold: {text: "mentre abbiamo fatto", fix: "mentre facevamo"}
    - tutor: "Già mi immagino la scena. Ma «mentre abbiamo fatto il ripasso»: il ripasso è lo sfondo dell'interruzione, quindi quale tempo serve?"
      prompt: {text: "mentre abbiamo fatto", tags: [tense-aspect]}
    - learner: "L'imperfetto: mentre facevamo il ripasso, è mancata la luce."
    - tutor: "Esatto. E Lei, insegnando agli italiani e vivendo in italiano, come è cambiata?"
      goals: [anecdote]
    - learner: "Vivendo in un'altra lingua ho scoperto un'altra me: in italiano sono più ironica, perfino più paziente. Credo che l'italiano mi abbia insegnato a ridere di me stessa."
    - tutor: "Una bella dichiarazione d'amore. Per chiudere, una frase per i nostri ascoltatori?"
      goals: [language]
    - learner: "Parlate, sbagliate e ridetene: gli errori, se ve li tenete dentro, non servono a niente."
    - tutor: "«Ridetene»: lo scriviamo sulla porta dello studio. Grazie, e in bocca al lupo per il libro!"
      goals: [farewell]

- scenario: pranzo-domenicale
  level: C2
  persona: es-f-erasmus
  history: [ci-ne, pronoun-position]
  turns:
    - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Meno male! Ho portato una torta di mandorle: l'ho fatta io, ma non ne vado molto fiera, è un po' bruciata sotto."
    - tutor: "Bruciata sotto, croccante sopra: qui la chiamiamo «carattere». Lo zio dice che sei arrivata a bocce ferme. Sai che cosa vuol dire?"
    - learner: "Non ne sono sicura... forse quando la partita è già finita? Me lo puoi spiegarlo meglio?"
      errors: [pronoun-position]
      gold: {text: "Me lo puoi spiegarlo", fix: "Me lo puoi spiegare"}
    - tutor: "Ci sei quasi. Ma «me lo puoi spiegarlo»: quei pronomi, li vuoi dire due volte?"
      prompt: {text: "Me lo puoi spiegarlo", tags: [pronoun-position]}
    - learner: "No: me lo puoi spiegare meglio? Oppure: puoi spiegarmelo meglio?"

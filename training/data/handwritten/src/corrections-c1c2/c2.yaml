# C2 dialogues: a near-native learner, rare and subtle errors, light correction between equals.
- scenario: club-lettura
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Finito ieri notte, alle due. Ti dirò: le prime cento pagine le ho trovate faticose, tutte quelle zie e quei cugini da tenere a mente. Poi, da quando la famiglia lascia la campagna per Torino, non sono più riuscita a staccarmi."
  - tutor: "Le zie sono un rito di passaggio: chi sopravvive alle zie viene premiato. E dimmi, chi ti è rimasto addosso, tra tutti?"
    goals: [impression]
  - learner: "Agnese, senza dubbio. Però non so se mi convince fino in fondo. Per tutto il romanzo è una donna prudentissima e poi, di punto in bianco, molla il marito e la fabbrica. Non mi sembra un personaggio consistente."
    errors: [false-friend]
  - tutor: "Poco coerente, dici? Io la vedo al contrario: è una che ingoia per trent'anni, e chi ingoia tanto prima o poi esplode. Se fosse rimasta, il romanzo sarebbe stato più credibile o soltanto più triste?"
    recast: {text: "consistente", fix: "coerente", tags: [false-friend]}
    goals: [character]
  - learner: "Touché. Più triste, e forse anche più falso. Senti, una curiosità: tu prima hai detto 'trama', ma sulla quarta di copertina parlano di 'intreccio'. C'è differenza o è solo un modo più elegante?"
  - tutor: "C'è, anche se a voce si usano come sinonimi. La trama è che cosa succede, l'intreccio è l'ordine in cui l'autore decide di raccontartelo. Qui la trama è semplice, è l'intreccio che fa i salti mortali, con tutti quei ritorni al dopoguerra."
  - learner: "Ecco, proprio quei salti mi hanno stancata un po'. Lo stile invece mi è piaciuto: frasi asciutte, pochissimi aggettivi, e quel narratore che non giudica mai nessuno. Peccato per il finale, che ho trovato sbrigativo."
  - tutor: "Sul finale ti do ragione a metà: è brusco, ma è brusca anche la vita di Agnese. Il narratore che non giudica, invece, è la cosa più bella del libro. A chi lo regaleresti, un romanzo così?"
    goals: [style]
  - learner: "A mia suocera, che di saghe familiari non ne ha mai abbastanza. A mio fratello no: se entro pagina trenta non è morto nessuno, lui chiude il libro."
  - tutor: "Allora per tuo fratello ci vuole un giallo, non una saga. Dai, il mese prossimo scegli tu: vediamo se hai il coraggio di proporre qualcosa senza zie."
    goals: [recommend]
    done: true

- scenario: club-lettura
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, ma a fatica, lo confesso. Non che sia scritto male, anzi. È che ho avuto la sensazione che l'autore volesse commuovermi a ogni costo, e quando me ne accorgo io mi irrigidisco."
  - tutor: "Ah, ecco la prima voce contro! Mi fa piacere, altrimenti stasera ci annoiamo. Però dimmi dove, di preciso: quale scena ti ha fatto pensare che ti stesse tirando per la manica?"
    goals: [impression]
  - learner: "La morte del nonno, per esempio. Tre pagine di neve, campane e bambini che piangono. Sarebbe bastata una riga. Mi è parso che non si fidasse del lettore."
  - tutor: "Le campane te le concedo, sono di troppo. Ma la neve no: torna in ogni capitolo, è quasi un personaggio. E di Pietro che mi dici? Per me il vero protagonista è lui, non Agnese."
  - learner: "Pietro è l'unico che mi ha convinta. Avesse avuto il coraggio di partire per l'Argentina, sarebbe stato un altro uomo; invece resta, e passa la vita a rimproverarlo agli altri. È meschino, ma è vero."
  - tutor: "Meschino ma vero: lo metterei in copertina. E pensa che molti qui lo detestano proprio perché resta. Secondo te l'autore lo assolve o lo condanna?"
    goals: [character]
  - learner: "Né l'uno né l'altro, ed è il suo merito. Lo stile però oscilla: nei dialoghi è secco, credibile, mentre nelle descrizioni si compiace. Certe similitudini sembrano messe lì per essere sottolineate a matita."
  - tutor: "Questa della matita è cattiva, e purtroppo è giusta. Io gliele perdono perché i dialoghi, come dici tu, sono vivi. Insomma, lo consiglieresti a qualcuno o lo lasci sullo scaffale?"
    goals: [style]
  - learner: "Lo consiglierei a chi ama le saghe e non ha fretta. A un lettore impaziente no, e nemmeno a chi, come me, diffida dei libri che vogliono farti piangere."
  - tutor: "Detto da una che l'ha finito, però, vale quasi come un complimento. Il mese prossimo porta tu un titolo: sono curioso di vedere che cosa non ti irrita."
    goals: [recommend]
    done: true

- scenario: notizie-attualita
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "L'ho seguita, sì. Se ho capito bene, la nuova legge impone un limite di notti all'anno per chi affitta ai turisti e obbliga a registrare ogni appartamento. I sindaci delle città d'arte esultano, i proprietari gridano all'esproprio."
  - tutor: "Riassunto impeccabile, meglio di certi titoli. Esproprio, poi... nessuno gli porta via la casa. E tu da che parte stai?"
    goals: [summarise]
  - learner: "Nel mezzo, temo. Capisco chi ha ereditato un appartamento e ci arrotonda la pensione. Ma un centro storico senza residenti non fa senso: diventa un parco a tema."
    errors: [word-choice]
  - tutor: "Sono d'accordo, non ha senso: una città senza panettiere e senza bambini è una scenografia. Però dubito che un limite di notti basti a riportare le famiglie. Tu ci credi?"
    recast: {text: "non fa senso", fix: "non ha senso", tags: [word-choice]}
    goals: [opinion]
  - learner: "Poco. Ho letto due giornali e sembrava che parlassero di due leggi diverse: uno titolava 'Stop alla giungla degli affitti', l'altro 'Lo Stato entra in casa tua'. A proposito, voi dite 'testata' o 'giornale'? Li sento usare tutti e due."
  - tutor: "Giornale è la parola di tutti i giorni. Testata è più da addetti ai lavori: indica il nome, il marchio, e vale anche per siti e telegiornali. Comunque hai ragione, ognuno ha tirato l'acqua al suo mulino. Io mi fido solo di chi ha pubblicato il testo della legge."
    goals: [sources]
  - learner: "Saggio. Da noi in Ohio il problema non esiste, nessuno fa la fila per visitare Dayton. Ma a mia figlia, a Lisbona, hanno raddoppiato l'affitto in tre anni."
  - tutor: "Povera Dayton, non sa che cosa si perde. Lisbona invece è il caso da manuale: prima arrivano i turisti, poi salgono i prezzi, e i residenti fanno le valigie. E qui, con questa legge, che cosa prevedi?"
  - learner: "Niente di buono, a breve. Temo che molti passeranno al nero, o che troveranno il modo di aggirare il limite intestando gli appartamenti a mezza famiglia."
  - tutor: "Fatta la legge, trovato l'inganno: è lo sport nazionale. Magari qualche appartamento tornerà sul mercato normale, ma non mi aspetto miracoli. Tra un anno ne riparliamo davanti a questa macchinetta, se nel frattempo non l'hanno affittata ai turisti."
    goals: [consequences]
    done: true

- scenario: notizie-attualita
  level: C2
  persona: en-f-student
  history: [noun-gender]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Guarda, ho letto solo i titoli sul telefono in metro, quindi prendi tutto con le pinze. Mi pare che vogliano mettere un tetto alle notti e multe salate a chi non si registra. Giusto?"
  - tutor: "Giusto, in due righe hai detto più dei titoli. Ti manca solo un dettaglio: i comuni potranno stringere ancora di più, se vogliono. E a pelle che effetto ti fa?"
    goals: [summarise]
  - learner: "A pelle, bene! Io sono quella che cerca una stanza da tre mesi e trova solo annunci per turisti. Però questa tema è più complicata di così, lo so: mia zia affitta la casa al mare e senza quei soldi non ce la farebbe."
    errors: [noun-gender]
  - tutor: "Tre mesi, che incubo. Un attimo, però: \"questa tema\"? È una di quelle parole in -ma che vengono dal greco e fanno lo sgambetto a tutti."
    prompt: {text: "questa tema", tags: [noun-gender]}
  - learner: "Uffa, è vero: questo tema. Come 'il problema', ci casco sempre. Comunque dicevo: non è tutto bianco o nero."
  - tutor: "Appunto. Tua zia e la studentessa senza stanza sono le due facce della stessa storia, e la legge le tratta allo stesso modo. Hai visto come l'hanno raccontata i vari giornali?"
    goals: [opinion]
  - learner: "Solo di sfuggita. Un sito diceva che è una vittoria per gli inquilini, un altro che è piena di loophole e che i grandi proprietari se la caveranno comunque."
    errors: [word-choice]
  - tutor: "Piena di scappatoie, sì, l'ho letto anch'io, ed è il sospetto più fondato. Curioso che il primo sito non ne parli affatto: stessa legge, due mondi. Di quale dei due ti fidi di più?"
    recast: {text: "loophole", fix: "scappatoie", tags: [word-choice]}
  - learner: "Di nessuno, a dire il vero. Uno è di proprietà di un costruttore, l'altro campa di indignazione. Mi fido di più di quello che vedrò sugli annunci tra sei mesi."
  - tutor: "Risposta da vecchia volpe, altro che studentessa. E tra sei mesi che cosa ti aspetti di vedere?"
    goals: [sources]
  - learner: "Qualche stanza in più, spero, ma a prezzi folli lo stesso. E scommetto che metà degli appartamenti turistici diventeranno 'affitti per studenti' a dieci mesi, giusto per non dare nell'occhio."
  - tutor: "Scommessa accettata, ma temo che vincerai tu. Se intanto sento di una stanza libera ti avviso subito, promesso. Adesso scappo, che il caffè di questa macchinetta non merita un altro minuto."
    goals: [consequences]
    done: true

- scenario: intelligenza-artificiale
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Ma va', sei sempre il solito catastrofista. Lo dicevano anche dei bancomat, e le banche hanno continuato ad assumere per vent'anni. Io dico che cambierà il lavoro, non che sparirà."
  - tutor: "Catastrofista io? Realista, prego. I bancomat contavano i soldi, questi scrivono, disegnano, programmano. Stavolta non tocca alle braccia, tocca alla testa."
    goals: [position]
  - learner: "Sì, però guarda mia cugina a Toronto: fa la traduttrice e pensava di essere finita. Invece adesso rivede i testi della macchina, lavora il doppio e guadagna di più. Certo, i dati non supportano ancora nessuna delle due tesi, è presto."
    errors: [false-friend]
  - tutor: "Ecco, bravo: i dati non sostengono né la tua tesi né la mia, e intanto tua cugina lavora il doppio. Ti sembra un progresso? A me sembra una fregatura con il fiocco."
    recast: {text: "non supportano", fix: "non sostengono", tags: [false-friend]}
    goals: [evidence]
  - learner: "Va be', su questo hai ragione. E ti do anche un altro punto: chi ha cinquant'anni e ha sempre fatto lo stesso mestiere non si reinventa con un corso online di tre settimane."
  - tutor: "Finalmente, mettetelo a verbale: mi ha dato ragione! È proprio quella generazione che mi preoccupa: troppo giovani per la pensione, troppo vecchi per ricominciare. E chi dovrebbe pensarci, secondo te?"
    goals: [concede]
  - learner: "Le aziende, e lo Stato dietro. Se un'impresa risparmia grazie all'automazione, una parte la mette nella formazione di chi resta. Così prendi due piccioni con una pietra: la gente non resta a casa e l'azienda si tiene chi la conosce."
    errors: [word-choice]
  - tutor: "Due piccioni con una fava, vorrai dire: da noi si prendono con i legumi, non chiedermi perché. L'idea mi piace, ma tu le vedi le aziende che ci mettono i soldi di tasca loro?"
    recast: {text: "con una pietra", fix: "con una fava", tags: [word-choice]}
  - learner: "Di tasca loro no, hai ragione. Ci vuole un obbligo, o almeno uno sconto sulle tasse. Ma mio nonno diceva sempre che chi si ferma è perduto, e valeva per lui che faceva il muratore come vale per noi."
  - tutor: "Tuo nonno la sapeva lunga. Allora mettiamola così: la tecnologia non si ferma, ma qualcuno deve pagare il biglietto a chi rischia di restare a terra. Su questo brindo anch'io, e passami il vino prima che lo versi un robot."
    goals: [conclude]
    done: true

- scenario: intelligenza-artificiale
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Paura no, dai. Io nel marketing la uso tutti i giorni e ti assicuro che senza qualcuno che le dica cosa fare produce solo banalità ben impaginate. Detto questo, non faccio finta che sia innocua."
  - tutor: "Banalità ben impaginate: hai appena descritto metà delle riunioni a cui partecipo. Ma se oggi ha bisogno di te per sapere cosa fare, chi ti garantisce che sarà così anche tra cinque anni?"
    goals: [position]
  - learner: "Nessuno. Però ti porto un caso concreto: da noi hanno automatizzato i report mensili e nessuno ha perso il posto. Le due persone che li facevano hanno fatto un po' di upskilling e adesso seguono i clienti."
    errors: [word-choice]
  - tutor: "Un po' di riqualificazione e via, tutti contenti? Due persone in un'azienda di Milano non fanno statistica, lo sai meglio di me. E i centralini, le redazioni, gli studi di traduzione?"
    recast: {text: "upskilling", fix: "riqualificazione", tags: [word-choice]}
    goals: [evidence]
  - learner: "Lì il colpo si sente già, non lo nego. Se le aziende avrebbero investito nella formazione dieci anni fa, oggi non saremmo a questo punto."
    errors: [hypothetical]
  - tutor: "Su questo siamo d'accordo, guarda un po'. Solo che quel \"se avrebbero\" a mia nonna farebbe venire l'orticaria: dopo il \"se\" che cosa ci vuole?"
    prompt: {text: "avrebbero investito", tags: [hypothetical]}
  - learner: "Ahi, hai ragione: se avessero investito. Me lo corregge sempre anche il mio capo."
  - tutor: "La nonna ringrazia. Tornando a noi: tu ammetti che il colpo c'è, io ammetto che non tutto sparirà. Dove ci incontriamo?"
    goals: [concede]
  - learner: "A metà strada: la tecnologia non è il nemico, ma lasciata al mercato fa danni. Servono regole, e soprattutto qualcuno che paghi la formazione prima che i posti saltino, non dopo."
  - tutor: "Prima e non dopo: firmo anch'io, e detto da un pessimista vale doppio. Però il dolce lo taglio a mano, che certe cose a una macchina non le lascio."
    goals: [conclude]
    done: true

- scenario: intervista-podcast
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Per sbaglio, giuro. Dovevo fare tre settimane di zaino in spalla tra Napoli e la Sicilia, poi a Palermo ho perso il traghetto, ho trovato un lavoretto in un ostello e sono passati sette anni."
  - tutor: "Il traghetto perso più fortunato della storia! E dimmi, in quei primi mesi a Palermo che cosa ti ha spiazzato di più?"
    goals: [story]
  - learner: "Il tempo, direi. A Dublino se dici alle otto è alle otto. Qui 'ci vediamo verso le otto' è una dichiarazione d'intenti. Pensa che stamattina presi il caffè con un amico prima di venire qui, e lui arrivò con quaranta minuti di ritardo, tranquillissimo."
    errors: [tense-aspect]
  - tutor: "Quaranta minuti, un classico. Però senti: \"presi\", \"arrivò\"... per una cosa di stamattina mi sembri un romanzo dell'Ottocento. A voce come la racconteresti?"
    prompt: {text: "stamattina presi", tags: [tense-aspect]}
  - learner: "Ah, colpa dei miei anni in Sicilia, lì lo usano per tutto! Va bene: stamattina ho preso il caffè con un amico e lui è arrivato con quaranta minuti di ritardo."
  - tutor: "In Sicilia infatti nessuno ti avrebbe detto niente, è qui al nord che suona strano. Tornando al ritardo: alla fine ti ci sei abituato o ti arrabbi ancora?"
    goals: [culture-shock]
  - learner: "Mi sono abituato, anzi adesso arrivo tardi anch'io. La cosa a cui non mi abituo è la burocrazia. Solo dopo un anno ho realizzato che per ogni documento serve un altro documento, che a sua volta richiede il primo."
    errors: [false-friend]
  - tutor: "E quando ti sei reso conto del circolo vizioso c'eri già dentro fino al collo, immagino. È una critica che sento da ogni ospite, e purtroppo non posso darvi torto. C'è dell'altro, o ti fermi qui per gentilezza?"
    recast: {text: "ho realizzato", fix: "ti sei reso conto", tags: [false-friend]}
    goals: [critique]
  - learner: "Per gentilezza mi fermo qui, sono pur sempre un ospite! Diciamo solo che gli italiani si lamentano dell'Italia meglio di chiunque altro, e io non posso competere."
  - tutor: "Su questo siamo campioni del mondo, altro che calcio. Ultima domanda, quella di rito: che cosa diresti a chi ci ascolta da Dublino e sta pensando di fare le valigie?"
  - learner: "Di venire senza un piano troppo preciso e con molta pazienza. E di imparare la lingua sul serio, non le quattro frasi da ristorante: finché non capisci le battute, resti un turista con il contratto d'affitto."
  - tutor: "Un turista con il contratto d'affitto: questa la rubo per il titolo della puntata. Grazie di cuore, e la prossima volta che perdi un traghetto facci sapere dove vai a finire."
    goals: [advice]
    done: true

- scenario: intervista-podcast
  level: C2
  persona: es-f-erasmus
  history: [preposition]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Con l'Erasmus, come mezza Spagna. Dovevo restare sei mesi a Bologna e tornare a Siviglia a finire la tesi. Poi ho conosciuto un bolognese, la tesi l'ho finita qui e il bolognese, per fortuna, no."
  - tutor: "Come sarebbe \"per fortuna no\"? Adesso devi spiegare, non puoi lasciare gli ascoltatori così."
  - learner: "Nel senso che è durato tre mesi, e meno male. Però mi ha lasciato due cose preziose: la ricetta del ragù di sua nonna e la voglia di restare."
  - tutor: "Direi che ci hai guadagnato tu, soprattutto con il ragù. E da spagnola, che cosa ti ha sorpresa? Tutti pensano che siamo uguali, noi e voi."
    goals: [story]
  - learner: "Uguali per niente! La cosa che mi ha sorpresa di più sono gli orari: qui alle otto si cena e a mezzanotte la città dorme. E poi il cibo è una religione, ma dipende molto della regione: a Bologna guai a chi tocca i tortellini."
    errors: [preposition]
  - tutor: "Guai davvero, c'è gente che ha perso amicizie per la panna nei tortellini. Solo una cosa: dopo \"dipende\" lo spagnolo ti ha fatto uno scherzetto con la preposizione. Come continua, in italiano?"
    prompt: {text: "dipende molto della", tags: [preposition]}
  - learner: "È vero, dipende dalla regione. In spagnolo è 'depende de', e dopo cinque anni mi scappa ancora."
  - tutor: "Ti scappa una volta ogni cinque anni, direi che possiamo perdonarti. E una cosa che invece dell'Italia non ti va giù? Dilla pure, siamo tra amici."
    goals: [culture-shock]
  - learner: "Con affetto: la fatica che si fa da giovani. Stage non pagati, contratti di tre mesi, affitti impossibili. In Spagna non stiamo meglio, eh, però qui a trent'anni ti chiamano ancora 'ragazza' e ti pagano di conseguenza."
  - tutor: "Hai detto una cosa durissima con un garbo invidiabile. E su \"ragazza\" hai ragione: da noi si è giovani fino alla pensione. Che cosa consiglieresti a chi vuole seguire la tua strada?"
    goals: [critique]
  - learner: "Di venire, magari con qualche risparmio da parte. A proposito, una curiosità: 'magari' qui l'ho usato bene? Perché a volte lo sento come 'forse' e a volte come un desiderio, e mi confondo."
  - tutor: "Benissimo, lì vale \"possibilmente\". Poi ci sono gli altri due: \"magari piove\" è un forse, mentre \"magari!\" da solo è un desiderio, come quando ti offrono una settimana di ferie. Tre significati al prezzo di uno."
  - learner: "Chiarissimo, grazie. Allora chiudo così: venite, magari con dei risparmi, e magari restate!"
  - tutor: "Magari! Hai appena dato il consiglio e la lezione insieme. Grazie di essere passata, e salutaci la nonna del ragù, se la senti ancora."
    goals: [advice]
    done: true

- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  history: [noun-number]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Di tutto. Stamattina la sveglia non ha suonato, sono uscita di corsa e ho perso il treno per Milano per trenta secondi. Avevo l'esame alle dieci."
  - tutor: "Trenta secondi: il treno ti ha vista arrivare ed è partito apposta. E poi? Non dirmi che l'esame è saltato."
  - learner: "Quasi. Ho preso un taxi fino alla stazione successiva per salire sul regionale, e mi è costato un occhio dalla testa. Quaranta euro per dieci minuti!"
    errors: [preposition]
  - tutor: "Quaranta euro, che rapina! Aspetta però, il modo di dire zoppica un pochino: un occhio... come? Riprova, c'è una preposizione fuori posto."
    prompt: {text: "un occhio dalla testa", tags: [preposition]}
  - learner: "Un occhio della testa! Giusto, lo sbaglio sempre. Comunque arrivo all'università con venti minuti di ritardo, tutta sudata, e il professore mi fa: 'Signorina, l'appello era ieri.'"
  - tutor: "No! Ieri? Questa è la ciliegina sulla torta. Quindi taxi, corsa e sudata per un esame che non c'era: oggi proprio piove sul bagnato."
    goals: [tell]
  - learner: "Piove sul bagnato, esatto, anzi diluvia! E non è finita: tornando a casa ho chiuso la porta del tram sulla mano e adesso ho due dite gonfie."
    errors: [noun-number]
  - tutor: "Poverina, fammi vedere... Eh sì, belle gonfie. Ma quel plurale è irregolare, come quello di braccio e di uovo. Ci arrivi da sola?"
    prompt: {text: "due dite", tags: [noun-number]}
    goals: [react]
  - learner: "Due dita! Le dita, le braccia, le uova. L'italiano oggi ce l'ha con me come tutto il resto."
  - tutor: "Esatto, e l'italiano almeno ti chiede scusa. Senti, ma l'appello sbagliato... è stata sfortuna o c'entri un po' anche tu?"
  - learner: "Mah, metà e metà. La segreteria ha cambiato la data all'ultimo e l'ha scritto solo sul sito, senza avvisare. Però è anche vero che io il sito non lo guardo mai."
  - tutor: "Allora diciamo concorso di colpa: loro hanno fatto le cose con i piedi, e tu hai dormito sugli allori. Che cosa ti porti a casa da questa giornata, a parte le dita gonfie?"
    goals: [blame]
  - learner: "Che devo controllare il sito ogni sera e mettere due sveglie. E che la prossima volta che perdo un treno torno a letto, tanto peggio di così non può andare."
  - tutor: "Saggia decisione, non tutto il male viene per nuocere. Dai, da bere offro io: dopo una giornata così te lo sei guadagnato."
    goals: [moral]
    done: true

- scenario: modi-di-dire
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia perdere, oggi è andato tutto storto. Avevo il pranzo con i futuri suoceri, la prima volta, e volevo fare bella figura. Arrivo con venti minuti di ritardo perché la macchina non partiva."
  - tutor: "Cominciamo bene! Dai suoceri in ritardo: sei partito con il piede sbagliato. E a tavola com'è andata?"
  - learner: "Peggio. La madre di Chiara aveva fatto il fegato alla veneziana, e io il fegato proprio non lo mando giù. Ho detto, per essere gentile, che il fegato non è la mia tazza di tè. Mi hanno guardato come un matto."
    errors: [word-choice]
  - tutor: "Ci credo, avranno pensato che volessi un tè insieme al fegato! Da noi si dice che una cosa non fa per me, oppure che non è il mio forte. E la signora come l'ha presa?"
    recast: {text: "non è la mia tazza di tè", fix: "non fa per me", tags: [word-choice]}
  - learner: "Male, credo. Poi per rimediare ho mangiato tre porzioni di tiramisù, e il padre ha detto: 'Almeno il dolce gli piace, a questo qui.' Una figuraccia. Anzi, senti: 'figuraccia' e 'brutta figura' sono la stessa cosa?"
  - tutor: "Quasi. La brutta figura può essere anche piccola, una cosa da niente. La figuraccia è quella che ti ricordano al matrimonio, davanti a tutti. La tua, mi dispiace dirlo, è della seconda specie."
    goals: [tell]
  - learner: "Lo sapevo. Però il padre alla fine rideva, quindi forse ho salvato capra e cavoli: non ho mangiato il fegato e non mi hanno cacciato."
  - tutor: "Capra e cavoli salvati alla grande, e l'hai usato pure a proposito! Se il suocero ride, sei a cavallo. Ma di chi è la colpa, alla fine: della macchina, del fegato o tua?"
    goals: [react]
  - learner: "Della macchina per il ritardo, quello non potevo prevederlo. Per il fegato è colpa di Chiara, che sapeva benissimo che non lo mangio e non ha detto niente a sua madre. Ma la tazza di tè, lo ammetto, è tutta mia."
  - tutor: "Giudizio equilibrato, da vero diplomatico. A Chiara però due paroline le direi, perché ti ha mandato allo sbaraglio. E la morale della favola?"
    goals: [blame]
  - learner: "Che la prossima volta porto i fiori, arrivo mezz'ora prima e i modi di dire inglesi li lascio a casa. E che il tiramisù salva sempre la situazione."
  - tutor: "Parole sante: sbagliando s'impara, e con il tiramisù si impara meglio. Alla salute dei suoceri!"
    goals: [moral]
    done: true

- scenario: turismo-di-massa
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno, grazie. Mi chiamo Walter, sono americano e vivo a Venezia da sei anni. Sono a favore, ma con riserva: il ticket da solo è un cerotto su una gamba rotta."
  - tutor: "Un cerotto su una gamba rotta: cominciamo con una bella immagine, Walter. Però \"a favore con riserva\" è comodo. Mi dia un esempio concreto di che cosa non funziona."
    goals: [introduce]
  - learner: "Volentieri. Nel mio sestiere in sei anni hanno chiuso il ferramenta, la merceria e due panifici. Al loro posto ci sono quattro negozi di maschere fatte chissà dove. Il ticket è stato introdotto in ordine a ridurre gli arrivi, ma i negozi non tornano con cinque euro."
    errors: [word-choice]
  - tutor: "Certo, è stato introdotto per ridurre gli arrivi, non per riaprire le mercerie. Ma faccio l'avvocato del diavolo: senza i turisti, Venezia di che cosa vive? Anche quei negozi di maschere pagano degli stipendi."
    recast: {text: "in ordine a ridurre", fix: "per ridurre", tags: [word-choice]}
    goals: [example]
  - learner: "Ma guarda, questo è il solito ricatto! Nessuno vuole zero turisti. Si tratta di scegliere quali: chi dorme tre notti e va ai musei lascia molto di più di chi scende da una nave per quattro ore."
    errors: [register]
  - tutor: "Ricatto è una parola forte, ma la accetto. Piuttosto, Walter: siamo in diretta e ci diamo del Lei, e quel Suo attacco mi ha fatto sentire al bar. Vuole riformulare l'inizio?"
    prompt: {text: "Ma guarda", tags: [register]}
  - learner: "Mi scusi, ha ragione, mi sono scaldato. Ma guardi, questo è il solito ricatto: nessuno vuole zero turisti, si tratta di scegliere quali."
  - tutor: "Così va benissimo, e scaldarsi in radio è permesso. Dunque meno crociere e più soggiorni lunghi. Ma in pratica che cosa propone, visto che il ticket non Le basta?"
    goals: [rebut]
  - learner: "Tre cose. Un numero chiuso vero nei giorni di punta, con prenotazione. I soldi del ticket vincolati alle case per i residenti, non al bilancio generale. E un limite alle licenze per i negozi di souvenir."
  - tutor: "Proposta chiara e, mi permetta, più seria di molte che sento dai politici. Il numero chiuso farà discutere, ma almeno è un'idea. Posso chiederLe se ne ha parlato con i Suoi vicini veneziani?"
  - learner: "Certo, al bar sotto casa non si parla d'altro. I veneziani veri sono più severi di me: molti chiuderebbero il ponte e buonanotte. Io almeno i turisti li lascerei entrare."
  - tutor: "Chiudere il ponte e buonanotte: questa è Venezia in una frase. Grazie, Walter, e buona giornata dalla Sua città d'adozione."
    goals: [proposal]
    done: true

- scenario: turismo-di-massa
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno. Sono Amparo, insegno spagnolo a Firenze da dodici anni. Sono contraria, e non per simpatia verso i turisti: trovo che far pagare l'ingresso a una città sia ammettere che è diventata un museo."
  - tutor: "Buongiorno, Amparo. Posizione netta, mi piace. Ma una città che incassa non è meglio di una città che subisce e basta? Mi faccia un esempio."
    goals: [introduce]
  - learner: "Gliene faccio uno di casa mia. Nella mia via c'erano undici famiglie, ora siamo tre; il resto sono appartamenti con la cassetta delle chiavi sul portone. Quando si discute di ticket io penso nei residenti che se ne sono andati: quei cinque euro a loro non restituiscono niente."
    errors: [preposition]
  - tutor: "Tre famiglie su undici: è un dato che fa impressione. Mi consenta solo una parentesi da pignolo: dopo \"penso\" Le è scappata una preposizione spagnola. In italiano quel verbo ne vuole un'altra."
    prompt: {text: "penso nei residenti", tags: [preposition]}
  - learner: "Ha ragione, è un mio vecchio vizio: penso ai residenti. E appunto, per loro il ticket non cambia nulla."
  - tutor: "Perfetto, chiusa la parentesi. Però mi dica: con quei soldi il Comune potrebbe pulire le strade, pagare più vigili, sistemare i trasporti. Non è già qualcosa, per chi è rimasto?"
    goals: [example]
  - learner: "Sarebbe qualcosa se quei soldi arrivassero davvero ai quartieri. Ma l'esperienza dice che finiscono nel bilancio generale. E poi il turista che ha pagato si sente cliente, e il cliente, si sa, ha sempre ragione: pretende di più, non di meno."
  - tutor: "Il turista che paga e quindi pretende: questa non l'avevo ancora sentita, ed è un'obiezione seria. Allora, se non il ticket, che cosa? Criticare è facile, lo sa meglio di me."
    goals: [rebut]
  - learner: "Giusto. Io metterei un limite agli affitti turistici per ogni palazzo e userei la tassa di soggiorno, che esiste già, per incentivi a chi affitta ai residenti. Una domanda di lingua, se posso: si dice 'costi addizionali' o 'costi aggiuntivi'?"
  - tutor: "Esistono tutte e due le forme. \"Aggiuntivi\" è la scelta più naturale; \"addizionali\" sa di ufficio delle imposte, tant'è che esiste proprio l'addizionale comunale. Quanto alla Sua proposta, ha il pregio di non costare nulla al turista e molto a chi specula."
  - learner: "Allora dirò che la mia proposta non comporta costi aggiuntivi per chi viaggia. Solo qualche regola in più per chi affitta."
  - tutor: "Detto benissimo, e con la parola giusta. Grazie, Amparo: da contraria ci ha portato più idee di tanti favorevoli. Passiamo alla prossima telefonata."
    goals: [proposal]
    done: true

- scenario: arte-mostra
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi mette a disagio, ma in senso buono. Quella testa tagliata sul vassoio, il sangue, e la ragazza che sorride... è un po' morbido, no?"
    errors: [false-friend]
  - tutor: "Morboso sì, e parecchio: all'epoca piaceva proprio per questo. Morbida semmai è la stoffa del vestito, guarda che velluto. Ma oltre al sangue, che cosa ti colpisce?"
    recast: {text: "morbido", fix: "Morboso", tags: [false-friend]}
    goals: [react]
  - learner: "La luce, direi. Arriva da sinistra e prende solo il viso di lei e il bordo del vassoio; tutto il resto affoga nel buio. E poi le mani: la destra è perfetta, la sinistra sembra dipinta da un altro."
  - tutor: "Occhio fino! La sinistra infatti è un restauro dell'Ottocento, e si vede. Tu dici che il resto affoga nel buio: bel verbo, lo userò all'esame. Perché secondo te lei sorride?"
    goals: [describe]
  - learner: "Bella domanda. Non credo sia cattiveria. Forse non ha ancora capito cosa ha fatto, o forse sorride a chi guarda, come a dire: 'L'avresti fatto anche tu.' È questo che dà fastidio."
  - tutor: "Questa lettura mi piace più di quella del catalogo, che parla di \"trionfo della virtù\". Altro che virtù: qui il pittore ci chiama complici. Ti ricorda qualcosa che hai già visto?"
    goals: [interpret]
  - learner: "Caravaggio, ovvio, per il buio. Però lui è più brutale, quasi da cronaca nera. Qui c'è qualcosa di più elegante, di teatrale. Si può dire 'caravaggesco' di un quadro così, o è una parola da professori?"
  - tutor: "Si può dire eccome, ed è la parola esatta: indica chi ha preso quella luce senza prenderne la violenza. Non è da professori, la trovi su qualunque cartellino. Tu quale dei due appenderesti in camera?"
  - learner: "Nessuno dei due, grazie, vorrei dormire! Ma se devo scegliere, questo: almeno lei sorride."
  - tutor: "Con la testa sul vassoio accanto al letto, auguri per i sogni. Dai, andiamo avanti: nella prossima sala ci sono solo paesaggi, così ti riprendi."
    goals: [compare]
    done: true

- scenario: arte-mostra
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sincero? Sulle prime, nessuna. Quattro rettangoli di colore su una tela enorme. Però più lo guardo e più mi accorgo che i bordi non sono netti, vibrano. Da ingegnere, mi chiedo come abbia fatto."
  - tutor: "Da ingegnere è la domanda giusta. Strati sottilissimi, uno sopra l'altro, per settimane. Ma dimmi che cosa vedi, prima di chiederti come funziona."
    goals: [react]
  - learner: "Vedo un rosso scuro che sembra venire avanti e un arancione che invece arretra. Tra i due c'è una striscia quasi nera, larga un palmo. E il tutto, non so perché, sembra illuminato da dietro."
  - tutor: "È esattamente l'effetto che cercava: un colore che respira. E quella striscia nera per te che cos'è, una ferita o una porta?"
    goals: [describe]
  - learner: "Una porta, direi. Mio padre dipingeva la domenica, paesaggi dell'Ohio, granai, cose così. Diceva che l'astratto era per chi non sapeva disegnare. Eventualmente cambiò idea, ma aveva già ottant'anni."
    errors: [false-friend]
  - tutor: "Meglio a ottant'anni che mai! Quindi alla fine cambiò idea anche lui: e che cosa lo convinse, un quadro come questo?"
    recast: {text: "Eventualmente", fix: "alla fine", tags: [false-friend]}
  - learner: "Una mostra a Chicago. Rimase un'ora davanti a una tela tutta blu e uscì dicendo che gli aveva ricordato il lago d'inverno. Forse è questo: non rappresentano niente, ma ti restituiscono qualcosa di tuo."
  - tutor: "Tuo padre ha detto in una frase quello che i critici dicono in trecento pagine. Allora la porta nera dove porta, per te?"
  - learner: "A una stanza dove fa caldo, credo. Il rosso è una stufa, l'arancione la luce sotto la porta. Ma domani potrei vederci un tramonto, e andrebbe bene lo stesso."
  - tutor: "Ed è il bello di questa pittura: non ti corregge mai. Se la metti accanto ai granai di tuo padre, che cosa hanno in comune?"
    goals: [interpret]
  - learner: "Più di quanto lui avrebbe ammesso. Anche nei suoi granai contava il rosso contro il cielo, non il granaio. Solo che lui aveva bisogno di una scusa per usare il colore, e questo pittore la scusa l'ha buttata via."
  - tutor: "Buttare via la scusa: se lo scrivi, io lo cito nella tesi. Andiamo, nell'altra sala ci sono i disegni, così vedi che disegnare sapeva eccome."
    goals: [compare]
    done: true

- scenario: mediazione-colleghi
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Non mi disturba affatto, si sieda. Ho visto che ieri è uscito dalla sala senza dire una parola e avevo intenzione di cercarla io. Mi racconti con calma."
  - tutor: "La ringrazio. Il fatto è semplice: l'analisi sui clienti l'abbiamo fatta in due, io e Bianchi, per tre settimane. Ieri lui l'ha presentata come se fosse soltanto sua, e nessuno ha detto niente."
  - learner: "Capisco, e capisco anche perché ci sia rimasto male: tre settimane di lavoro non sono poche. Dimmi una cosa, però: nella presentazione il suo nome compariva oppure no?"
    errors: [register]
  - tutor: "Sulla prima pagina sì, in piccolo. Ma mi perdoni, dottoressa: un momento fa mi dava del Lei e adesso siamo passati al tu? Già oggi sono confuso di mio."
    prompt: {text: "Dimmi una cosa", tags: [register]}
    goals: [listen]
  - learner: "Ha ragione, mi scusi, è l'abitudine con il resto del gruppo. Mi dica una cosa: prima della riunione vi eravate messi d'accordo su chi avrebbe presentato?"
  - tutor: "No, e forse l'errore è lì. Lui ha detto \"ci penso io\" e io ho creduto che avrebbe parlato a nome di tutti e due. Invece ha detto \"io\" per venti minuti."
    goals: [clarify]
  - learner: "Glielo chiedo perché conosco Bianchi da anni. Non credo che abbia voluto prendere il credito di proposito: quando è sotto pressione parla in prima persona di qualunque cosa, anche del tempo. Questo non toglie che il risultato, per Lei, sia stato lo stesso."
    errors: [word-choice]
  - tutor: "Può darsi che non abbia voluto prendersi il merito di proposito ma, come dice Lei, il risultato non cambia. Il direttore adesso pensa che l'analisi sia sua. E a me che cosa resta?"
    recast: {text: "prendere il credito", fix: "prendersi il merito", tags: [word-choice]}
    goals: [perspective]
  - learner: "Resta che l'analisi è di tutti e due, e intendo che si sappia. Le propongo questo: scrivo io al direttore per precisare chi ha fatto che cosa, e la prossima presentazione la tiene Lei. Poi, se è d'accordo, ci sediamo in tre e chiariamo, senza processi."
  - tutor: "Senza processi mi sta bene, non cerco vendette. Mi basta che le cose vengano dette. E la presentazione la tengo volentieri, grazie."
  - learner: "Bene. Allora parlo con Bianchi oggi stesso e fisso l'incontro per giovedì. E la prossima volta venga da me subito, senza aspettare una notte."
  - tutor: "D'accordo, giovedì. Devo dire che sono entrato con il dente avvelenato e esco più leggero. Grazie di avermi ascoltato, dottoressa."
    goals: [solution]
    done: true

- scenario: trattativa-fornitore
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno, dottor Ferri. Sì, chiamo per quello. Un quindici per cento in un colpo solo è un aumento consistente, e per un'azienda piccola come la nostra pesa parecchio."
  - tutor: "Lo capisco, e non l'abbiamo deciso a cuor leggero. Ma il cartone è salito del venti, e dell'energia non parliamo nemmeno. Il quindici è già una cifra limata."
    goals: [problem]
  - learner: "Può essere. Però lavoriamo insieme da otto anni, non abbiamo mai pagato una fattura in ritardo e l'anno scorso abbiamo aumentato gli ordini del trenta per cento. Questo conterà qualcosa."
  - tutor: "Conta, eccome: siete tra i clienti più puntuali che abbiamo. Ma la fedeltà, mi creda, non abbassa il prezzo del cartone. Che cosa avrebbe in mente?"
    goals: [argue]
  - learner: "Ma dai, non scherziamo! Con il quindici mi salta tutto il margine. Io posso arrivare al sette, e in cambio firmo un contratto di due anni."
    errors: [register]
  - tutor: "Il contratto di due anni mi interessa, glielo dico subito. L'inizio della frase, però, tra un fornitore e un cliente che si danno del Lei suona un po' da osteria. Me lo ripete con un altro tono?"
    prompt: {text: "Ma dai, non scherziamo", tags: [register]}
  - learner: "Ha ragione, mi scusi, mi è uscita così. Volevo dire: mi permetta di dissentire, con il quindici per cento il nostro margine si azzera. Posso arrivare al sette, con un contratto di due anni."
  - tutor: "Così ci capiamo meglio, e apprezzo la franchezza. Il sette non riesco a farlo passare. Con due anni di contratto e ordini minimi garantiti posso scendere al dieci."
  - learner: "Dieci è ancora alto per noi. Facciamo nove, con ordini minimi trimestrali e consegna a carico vostro come adesso. E il prezzo resta fermo per tutti e due gli anni."
  - tutor: "Nove, prezzo bloccato per due anni, minimi trimestrali e consegna a nostro carico. Lei è un osso duro, lo sa? Va bene, ci sto. Le mando la bozza entro venerdì."
    goals: [counteroffer]
  - learner: "Perfetto, aspetto la bozza. La ringrazio per la disponibilità, dottor Ferri, e buon lavoro."
  - tutor: "Grazie a Lei. Otto anni e non abbiamo ancora litigato davvero: speriamo di arrivare a dieci. Buona giornata."
    goals: [agreement]
    done: true

- scenario: presentazione-progetto
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Sarò rapido. Proponiamo di portare online gli ordini dei clienti all'ingrosso, che oggi arrivano ancora per telefono e per mail. Obiettivo: dimezzare gli errori e liberare tre persone dell'ufficio ordini per attività che rendono di più."
  - tutor: "Fin qui ci sono. Ma \"rendono di più\" lo dicono tutti. Mi dia dei numeri, altrimenti restiamo alle buone intenzioni."
    goals: [pitch]
  - learner: "Certo. Oggi il sei per cento degli ordini contiene un errore, e ogni errore ci costa in media centoventi euro: circa novantamila euro l'anno. Stimiamo di recuperarne due terzi già nel primo anno. Credevo che aveva già ricevuto la scheda con i dettagli."
    errors: [subjunctive-use]
  - tutor: "Non ho ricevuto niente, ma i numeri sono chiari anche a voce. Un appunto, visto che in direzione ci fanno caso: dopo \"credevo che\" quel verbo all'indicativo stride. Come lo direbbe meglio?"
    prompt: {text: "che aveva già ricevuto", tags: [subjunctive-use]}
  - learner: "Giusto: credevo che avesse già ricevuto la scheda. Gliela rimando appena usciamo di qui."
  - tutor: "Bene. Veniamo al punto dolente: quanto costa, e che cosa succede se i clienti continuano a telefonare come hanno sempre fatto?"
    goals: [benefits]
  - learner: "Centoquarantamila euro, tutto compreso. Il rischio che Lei dice è reale, per questo non prevediamo un roll-out unico: partiamo con venti clienti pilota per tre mesi. Se meno della metà usa il sistema, ci fermiamo e avremo speso un quinto della cifra."
    errors: [word-choice]
  - tutor: "Quindi niente lancio unico, ma venti clienti di prova e la possibilità di fermarsi: questo mi rassicura più dei numeri. Chi sceglie i venti, e quando potreste partire?"
    recast: {text: "roll-out unico", fix: "lancio unico", tags: [word-choice]}
    goals: [objection]
  - learner: "Li sceglie il commerciale insieme a noi, mescolando clienti grandi e piccoli. Se ho il Suo via libera entro fine mese, partiamo a settembre e a dicembre Le porto i risultati."
  - tutor: "Allora facciamo così: mi mandi la scheda oggi e la lista dei venti entro venerdì. Se regge, lunedì porto la proposta in direzione."
  - learner: "Avrà tutto entro venerdì mattina. Grazie del tempo, so che ne aveva poco."
  - tutor: "Ha usato nove minuti su dieci, e apprezzo anche questo. A lunedì, allora."
    goals: [next-steps]
    done: true

- scenario: trattativa-affitto
  level: C2
  persona: en-m-traveller
  history: [register]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, non glielo nascondo. La luce in soggiorno è splendida e la zona è quella che cercavo. Ho solo una perplessità: gli infissi sono vecchi e d'inverno immagino che il riscaldamento costi una fortuna."
  - tutor: "Osservazione giusta, gli infissi sono originali. In compenso il riscaldamento è autonomo, quindi decide Lei quanto spendere. Il canone è di milleduecento euro, come da annuncio."
    goals: [interest]
  - learner: "Ecco, parliamo del canone. Per un appartamento con quegli infissi e senza ascensore, milleduecento mi pare tanto. Se me lo fai a mille, firmo anche domani."
    errors: [register]
  - tutor: "Mille è una bella discesa, ne devo parlare con la proprietaria. Intanto, mi scusi la pignoleria: finora ci siamo dati del Lei, e in agenzia preferisco tenerlo. Mi ripete l'offerta?"
    prompt: {text: "Se me lo fai", tags: [register]}
  - learner: "Ah, scusi! Volevo dire: se me lo fai a mille, firmo domani. Accidenti, l'ho rifatto, vero?"
    errors: [register]
  - tutor: "L'ha rifatto, ma glielo perdono: \"Se me lo fa a mille, firmo domani\", ricevuto. A mille non ci arrivo. A millecento, con gli infissi nuovi almeno in camera, forse sì."
    recast: {text: "se me lo fai", fix: "Se me lo fa", tags: [register]}
  - learner: "Millecento con gli infissi nuovi in camera mi sembra ragionevole. E il contratto? Io preferirei un quattro più quattro, ma vorrei poter dare la disdetta con tre mesi di preavviso invece di sei."
  - tutor: "Il quattro più quattro va benissimo, alla proprietaria piace chi resta. Sui tre mesi dovrò insistere un po', ma con la cedolare secca di solito un accordo si trova."
    goals: [negotiate]
  - learner: "Bene. E la provvigione dell'agenzia? Nell'annuncio non era indicata, e non vorrei sorprese alla firma."
  - tutor: "Nessuna sorpresa: una mensilità, come d'uso. E due mensilità di deposito come garanzia, che Le tornano indietro alla fine del contratto."
    goals: [conditions]
  - learner: "D'accordo. Allora, se la proprietaria conferma millecento, gli infissi e i tre mesi di preavviso, per me è fatta. Mi faccia sapere e fissiamo la data per la firma."
  - tutor: "Le telefono entro domani sera. Tra parentesi: ha trattato meglio di molti italiani, complimenti. A presto!"
    goals: [conclude]
    done: true

- scenario: colloquio-promozione
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Volevo fare il punto su quest'anno. Ho chiuso i tre progetti che mi erano stati affidati, due in anticipo, e il cliente tedesco ha rinnovato per altri tre anni dopo che l'ho seguito io."
  - tutor: "Il rinnovo dei tedeschi l'ho notato, e non era scontato. Vada avanti."
    goals: [results]
  - learner: "In più, senza che nessuno me lo chiedesse, mi sono interessata per la formazione dei due nuovi assunti, che oggi lavorano in autonomia. Alla luce di tutto questo, Le chiedo di essere valutata per il ruolo di responsabile di area."
    errors: [preposition]
  - tutor: "La richiesta è chiara e arriva al momento giusto. Una nota a margine, perché so che ci tiene: \"interessarsi per\" è un prestito dallo spagnolo. In italiano quel verbo regge un'altra preposizione."
    prompt: {text: "mi sono interessata per", tags: [preposition]}
  - learner: "Vero, grazie: mi sono interessata alla formazione dei nuovi assunti. Anzi, per essere precisa, me ne sono occupata di persona."
  - tutor: "\"Me ne sono occupata\" è ancora meglio, rende l'idea. Vengo al punto: Lei merita la promozione, ma il budget di quest'anno è chiuso e in area c'è chi ha più anzianità."
    goals: [request]
  - learner: "Capisco il vincolo del budget. Sull'anzianità, però, mi permetto di dissentire: se il criterio fossero stati gli anni e non i risultati, il cliente tedesco oggi sarebbe con la concorrenza. Sono disposta ad aspettare l'aumento, non il ruolo."
  - tutor: "Risposta che non lascia molto spazio, devo ammetterlo. Ruolo subito e aumento a gennaio, dunque: è una formula che potrei portare in direzione."
    goals: [handle]
  - learner: "È esattamente quello che Le propongo. Possiamo fissare degli obiettivi per i prossimi sei mesi, così a gennaio la valutazione si fa sui fatti?"
  - tutor: "Mi sembra corretto. Mi mandi una proposta di obiettivi entro la settimana, io ne parlo con la direzione giovedì. Ci rivediamo venerdì con una risposta."
    goals: [next-steps]
  - learner: "Perfetto. Le mando tutto entro mercoledì. Grazie per la franchezza."
  - tutor: "Grazie a Lei: è raro che qualcuno chieda una promozione portando i numeri invece delle lamentele. A venerdì."
    done: true

- scenario: dibattito-ambiente
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Penso il contrario, con tutto il rispetto. I negozi, la zona pedonale li salva, non li ammazza. A Dublino hanno chiuso una via intera e gli incassi sono saliti, perché la gente a piedi si ferma, in macchina no."
  - tutor: "A Dublino, appunto. Qui piove meno, ma i clienti arrivano dalla provincia, e dalla provincia si arriva in macchina. Ha altri argomenti, oltre agli incassi irlandesi?"
    goals: [position]
  - learner: "Due. Il primo è la salute: in via Roma l'inquinamento supera i limiti un giorno su tre, e ci abitano famiglie con bambini. Il secondo è lo spazio: oggi metà della piazza è un parcheggio, e una piazza dovrebbe servire a qualcos'altro."
  - tutor: "Sull'aria non discuto, i dati li ho letti anch'io. Ma mia madre ha ottantadue anni e in centro ci va solo se la accompagno in macchina fin davanti al medico. A lei che cosa diciamo?"
    goals: [argue]
  - learner: "A Sua madre diciamo che i permessi per anziani e disabili restano, ci mancherebbe. E per chi viene da fuori basta un park and ride serio ai margini, con una navetta ogni dieci minuti."
    errors: [word-choice]
  - tutor: "Un parcheggio di scambio con la navetta, dice. Sulla carta funziona; peccato che la navetta, da noi, passi quando ne ha voglia. Chi garantisce che stavolta sarà diverso?"
    recast: {text: "un park and ride", fix: "Un parcheggio di scambio", tags: [word-choice]}
    goals: [counter]
  - learner: "Nessuno, e qui Le do ragione: se i mezzi pubblici restano quelli di oggi, la chiusura sarebbe una punizione e basta. Per questo propongo di andare per gradi: prima la navetta e i parcheggi, poi la chiusura, e solo nel fine settimana per i primi sei mesi."
  - tutor: "Prima i servizi e poi il divieto: detta così, comincio quasi a essere d'accordo. Quasi. Se dopo sei mesi i commercianti hanno perso clienti, si torna indietro?"
  - learner: "Si torna indietro, e lo metterei per iscritto. Una prova è una prova: se fallisce, lo si ammette."
  - tutor: "Allora su una prova a tempo, con i numeri in mano, mi trova disponibile. Non pensavo di dirlo, entrando qui stasera. Lo proponga Lei all'assemblea, io alzo la mano."
    goals: [concede]
    done: true

- scenario: vita-in-italia
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno. Per il cognome, in un certo senso. Mio bisnonno partì da Genova nel 1912 e a Buenos Aires siamo cresciuti tutti con il mito dell'Italia. Io faccio il cuoco, e a un certo punto ho voluto vedere da dove venivano le ricette di mia nonna."
  - tutor: "Un viaggio di ritorno a un secolo di distanza: bella storia. E le ricette della nonna le ha ritrovate, a Bologna?"
    goals: [story]
  - learner: "Macché. Il primo mese scoprii che i 'tallarines' di mia nonna qui non esistono e che il suo ragù a Bologna sarebbe un reato. Però in cucina facetti subito amicizia con tutti, perché sapevo lavorare e stavo zitto."
    errors: [verb-form]
  - tutor: "Un reato, addirittura! Bologna sul ragù non perdona. Sul passato remoto invece siamo più indulgenti, ma mi tolga una curiosità: quel verbo dopo \"in cucina\" lo ha sentito in casa? Perché la forma è un'altra."
    prompt: {text: "facetti", tags: [verb-form]}
  - learner: "Un'invenzione di famiglia, temo: mio nonno diceva così. Feci amicizia, allora. O meglio ancora, parlando: ho fatto amicizia."
  - tutor: "Esatto, e ha ragione Lei: a voce \"ho fatto\" è la scelta più naturale. Lavorare e stare zitto, diceva. La parte più dura qual è stata, allora?"
  - learner: "La solitudine fuori dalla cucina. Dentro ero uno della squadra, fuori ero 'l'argentino'. E la burocrazia: per il riconoscimento della cittadinanza ho aspettato tre anni, con i documenti del bisnonno tradotti quattro volte."
  - tutor: "Tre anni per dimostrare di essere il pronipote di un genovese: la burocrazia italiana riesce a perdere i suoi stessi figli. E Lei, in questi anni, è cambiato?"
    goals: [difficulties]
  - learner: "Parecchio. In Argentina improvvisavo tutto. Qui ho imparato che una ricetta è una cosa seria, che si rispetta. In compenso ho perso un po' di leggerezza: adesso mi arrabbio se vedo il parmigiano sul pesce."
  - tutor: "Allora l'integrazione è compiuta: il parmigiano sul pesce è il nostro vero esame di cittadinanza. Un consiglio per chi ci ascolta e sogna di trasferirsi?"
    goals: [change]
  - learner: "Di venire con un mestiere in mano e senza il mito. L'Italia delle nonne non c'è più, forse non c'è mai stata. Quella vera è più difficile, ma vale la pena."
  - tutor: "Senza il mito e con un mestiere: difficile dirlo meglio. La ringrazio, e spero che un giorno ci faccia assaggiare quel ragù fuorilegge. Restate con noi, torniamo dopo la pubblicità."
    goals: [advice]
    done: true

- scenario: medico-specialista
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio, nel complesso. Il battito irregolare la sera è quasi sparito. Mi resta un certo affaticamento quando salgo le scale: al terzo piano devo fermarmi a riprendere fiato."
  - tutor: "Al terzo piano, bene, è un dato preciso. Dolore al petto, giramenti di testa, gonfiore alle caviglie?"
  - learner: "Nessun dolore. Un lieve capogiro al mattino, se mi alzo di scatto. Le caviglie no. Mi permetta una domanda da insegnante: Lei scrive sempre 'affaticamento', non 'stanchezza'. C'è una differenza clinica?"
  - tutor: "C'è. La stanchezza è quella di tutti, a fine giornata. L'affaticamento è legato a uno sforzo preciso, come le Sue scale, ed è quello che a noi interessa misurare. In famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Mio padre ebbe un infarto a sessantun anni e mia nonna paterna soffriva di pressione alta. Dal lato di mia madre, che io sappia, nulla."
  - tutor: "Ne terremo conto. Gli esami comunque sono incoraggianti: la pressione è rientrata nella norma e il cuore lavora bene. Il colesterolo invece resta un po' alto."
    goals: [history]
  - learner: "Me lo aspettavo. Eppure sto attenta: poca carne rossa, niente burro. Forse esagero con la colazione, perché mangio due uovi quasi ogni mattina."
    errors: [noun-number]
  - tutor: "Ogni mattina è tanto, in effetti, ne riparliamo tra un attimo. Prima una piccola nota da medico a insegnante: quel plurale, in italiano, fa storia a sé. Se lo ricorda?"
    prompt: {text: "due uovi", tags: [noun-number]}
  - learner: "Che vergogna, lo cito perfino ai miei studenti come esempio di plurale irregolare: due uova. Quindi devo ridurle?"
  - tutor: "Nessuna vergogna, capita ai migliori. Sì, le porterei a tre o quattro la settimana. E vorrei aggiungere un farmaco per il colesterolo, a basso dosaggio."
    goals: [understand]
  - learner: "Che effetti collaterali devo aspettarmi? Ho letto di dolori muscolari, e io cammino molto."
  - tutor: "Sono possibili ma poco frequenti, e a questo dosaggio ancora meno. Se compaiono dolori alle gambe, sospenda la terapia e mi chiami. Facciamo un controllo tra tre mesi, con nuovi esami."
  - learner: "D'accordo, dottore. Meno uova, la pastiglia la sera e ci vediamo tra tre mesi."
  - tutor: "Riassunto perfetto, non avrei saputo dirlo meglio. E continui a camminare: è la terapia che costa meno. Arrivederci."
    goals: [treatment]
    done: true

- scenario: smartworking
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Metà e metà. Tre giorni a casa, due in ufficio, in teoria a scelta. In pratica il capo ha 'suggerito' il martedì e il giovedì, e chi sono io per non cogliere un suggerimento."
  - tutor: "Ah, il suggerimento obbligatorio, lo conosco bene. E come ti trovi? Io dopo due anni a casa parlavo con la lavatrice."
    goals: [situation]
  - learner: "La lavatrice almeno non ti interrompe! A me piace: niente metro alle otto, pranzo vero invece del panino, e se devo concentrarmi nessuno mi piomba alla scrivania. Mica male, no?"
  - tutor: "Mica male per niente. Soprattutto il pranzo vero: è l'unico argomento che convince anche me. Ma un lato storto ci sarà pure."
    goals: [pros]
  - learner: "C'è. Senti, prima però: 'mica' l'ho usato giusto? L'ho imparato a orecchio e non ho mai capito se si può mettere dove si vuole."
  - tutor: "Giustissimo. \"Mica\" rinforza una negazione: \"non è mica facile\", oppure da solo in testa, come nel tuo \"mica male\". Dappertutto no: vuole sempre un'idea di negazione intorno. E resta roba da chiacchiera, in una mail al capo lo eviterei."
  - learner: "Chiaro, niente 'mica' al capo. Allora, il lato storto: a casa non stacchi mai. Il computer è lì sul tavolo della cucina e alle dieci di sera ti ritrovi a rispondere alle mail. E poi le cose importanti si decidono ancora alla macchinetta del caffè, e tu non ci sei."
  - tutor: "Questa della macchinetta è verissima: le promozioni nascono lì, non nelle riunioni a distanza. E per il computer in cucina non c'è rimedio, se non chiuderlo in un armadio. Potendo scegliere davvero, senza suggerimenti, che cosa faresti?"
    goals: [cons]
  - learner: "Terrei la formula mista, ma con i giorni scelti da me e un posto fisso dove lavorare, non la cucina. L'ufficio tutti i giorni no, grazie: ho già dato."
  - tutor: "Hai già dato, e si vede che non hai nostalgia. Io invece tornerei in ufficio anche domani, pur di non sentire più il vicino che suona il trombone. Facciamo un altro giro?"
    goals: [preference]
    done: true

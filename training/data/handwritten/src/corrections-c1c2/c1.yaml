# Error correction at C1: sequence of tenses, subjunctive after conjunctions, hypotheticals,
# passives, relatives, calques and false friends, register, idioms, nuance questions and debate.
- scenario: club-lettura
  level: C1
  persona: en-f-professional
  history: [subjunctive-form]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, l'ho finito ieri notte, a fatica. Le prime cento pagine mi hanno conquistata, poi la storia si perde tra troppi cugini e troppi funerali. Avrei voluto che l'autrice taglia almeno un terzo."
    errors: [subjunctive-form]
  - tutor: "Un terzo, addirittura! Sui funerali non hai tutti i torti. Prima però riguarda il verbo dopo \"avrei voluto che\": lì il presente non regge, serve un tempo del passato."
    prompt: {text: "che l'autrice taglia", tags: [subjunctive-form]}
  - learner: "Hai ragione: avrei voluto che l'autrice tagliasse almeno un terzo."
  - tutor: "Ecco. Per me, però, quella confusione è voluta: una famiglia così numerosa la si capisce solo perdendosi tra i nomi. Prendi Elvira, che resta in paese quando tutti partono: tu come la leggi?"
    goals: [impression]
  - learner: "Elvira è il personaggio che mi ha irritata di più. Rinuncia a Torino, al lavoro, a tutto, per una madre che non la ringrazia mai. Per me la sua scelta non fa senso."
    errors: [word-choice]
  - tutor: "Dici che la sua scelta non ha senso, ma io ci vedo una forma di orgoglio: restare è l'unica decisione davvero sua. Se fosse partita, avrebbe fatto quello che volevano i fratelli."
    recast: {text: "non fa senso", fix: "non ha senso", tags: [word-choice]}
    goals: [character]
  - learner: "Mm, orgoglio... può darsi. Una domanda di lingua, però: prima hai detto \"la si capisce\". Potevo dire anche \"si capisce\" e basta? Che differenza c'è?"
  - tutor: "Vanno bene tutte e due. Con \"la si capisce\" tengo la famiglia come oggetto preciso, mentre \"si capisce\" da solo resta più generico, quasi un \"è chiaro\". E dello stile che pensi, a parte la lunghezza?"
  - learner: "Lo stile invece mi è piaciuto, benché è un po' antiquato. Quelle frasi lunghissime, piene di dialetto, hanno un loro ritmo."
    errors: [subjunctive-use]
  - tutor: "Sul ritmo siamo d'accordo, finalmente. Guarda però il verbo dopo \"benché\": con questa congiunzione l'indicativo non basta."
    prompt: {text: "benché è", tags: [subjunctive-use]}
    new: [{lemma: congiunzione, gloss: conjunction}, {lemma: indicativo, gloss: indicative}]
  - learner: "Benché sia un po' antiquato, giusto. Comunque lo consiglierei a mia suocera, che adora le saghe familiari, ma non a chi ha poca pazienza."
  - tutor: "Giusto. Tua suocera e io andremmo d'accordo, allora! Il mese prossimo tocca a te scegliere il libro: vediamo se trovi qualcosa di più corto."
    goals: [style, recommend]
    done: true

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo, dottoressa. Il progetto consiste in una piattaforma unica per gli ordini dei clienti, che oggi vengono gestiti con tre sistemi diversi. L'obiettivo è ridurre gli errori affinché i clienti ricevono la merce nei tempi promessi."
    errors: [subjunctive-use]
  - tutor: "L'obiettivo è chiaro. Solo un dettaglio di forma, visto che lo presenterà anche al consiglio: riformuli la parte dopo \"affinché\", che vuole un altro modo verbale."
    prompt: {text: "affinché i clienti ricevono", tags: [subjunctive-use]}
  - learner: "Certo: affinché i clienti ricevano la merce nei tempi promessi."
  - tutor: "Bene. Fin qui però ho sentito un problema, non un guadagno. Che benefici si aspetta, in cifre?"
    goals: [pitch]
  - learner: "Abbiamo stimato una riduzione del dodici per cento dei resi e circa duecentomila euro di fatturato in più all'anno. Attualmente, il dato sui resi è prudente: il test fatto a Verona ha dato risultati migliori."
    errors: [false-friend]
  - tutor: "In realtà, quindi, il dato sui resi è prudente: questo gioca a suo favore. 200.000 euro però non coprono l'investimento, se ho letto bene il budget. Quanto ci costa, e in quanto tempo rientriamo?"
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    goals: [benefits]
  - learner: "L'investimento è di trecentocinquantamila euro e rientriamo in meno di due anni. Capisco il dubbio, ma il rischio più grande è non fare niente: come vedi dalla tabella, ogni anno perdiamo clienti per colpa dei ritardi."
    errors: [register]
  - tutor: "Il ragionamento regge. Un attimo, però: \"come vedi\"? Davanti al consiglio una forma così le costerebbe cara."
    prompt: {text: "come vedi", tags: [register]}
  - learner: "Mi scusi, dottoressa: come vede dalla tabella, ogni anno perdiamo clienti per colpa dei ritardi."
  - tutor: "Così va meglio. Due anni sono tanti, e i progetti informatici sforano sempre. Chi mi garantisce la scadenza?"
  - learner: "Nessuno può garantirla al cento per cento, ma propongo di procedere a fasi: prima il rollout in una sola sede, con un budget limitato, e solo se i numeri reggono si passa alle altre."
    errors: [word-choice]
  - tutor: "Il lancio in una sola sede mi convince più del progetto intero: se va male, perdiamo poco. Mi mandi entro venerdì un piano con costi e scadenze della prima fase."
    recast: {text: "il rollout", fix: "Il lancio", tags: [word-choice]}
    goals: [objection]
  - learner: "Glielo mando entro giovedì. Se è d'accordo, fisserei poi una riunione con il responsabile delle risorse per la settimana successiva."
  - tutor: "D'accordo, giovedì allora. Per la riunione senta la mia assistente, e porti anche i dati di Verona."
    goals: [next-steps]
    done: true

- scenario: modi-di-dire
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Guarda, oggi mi sono proprio alzato con il piede sbagliato. La sveglia non ha suonato, ho perso il regionale delle otto e sono arrivato al colloquio con quaranta minuti di ritardo."
    errors: [word-choice]
  - tutor: "Ahia, ti sei alzato col piede sinistro, allora! E arrivare tardi a un colloquio è già un bel guaio. Ma almeno il treno dopo l'hai preso senza problemi?"
    recast: {text: "alzato con il piede sbagliato", fix: "alzato col piede sinistro", tags: [word-choice]}
  - learner: "Magari! Avevo fatto il biglietto di corsa, sul telefono, e ho visto il controllore salendo sul treno. A quel punto mi sono accorto che avevo comprato il biglietto per il giorno dopo."
    errors: [verb-form]
  - tutor: "Non ci credo! Aspetta, però, che così mi confondo: sul treno stava montando lui oppure tu? Con il gerundio la frase resta ambigua, prova un'altra strada."
    prompt: {text: "salendo sul treno", tags: [verb-form]}
    new: [{lemma: gerundio, gloss: gerund}, {lemma: ambiguo, gloss: ambiguous}]
  - learner: "Eh, hai ragione. Ho visto il controllore che saliva sul treno, proprio dietro di me."
  - tutor: "Ora ho capito la scena. E quello ti ha fatto la multa, immagino: piove sempre sul bagnato."
    goals: [tell]
  - learner: "Piove sul bagnato? Che vuol dire, che sono sfortunato anche con il tempo?"
  - tutor: "No, il tempo non c'entra! Si dice quando a un guaio se ne aggiunge subito un altro, a chi già ne ha abbastanza. Ti torna, con la tua giornata?"
  - learner: "Ah, mi torna eccome! Allora oggi su di me è piovuto sul bagnato tre volte: la sveglia, il ritardo e cinquanta euro di multa. Se lo sapevo, restavo a letto."
  - tutor: "Tre volte, povero te! E a letto, in effetti, non ti capitava niente. Ma sii sincero: la colpa di chi è, della sveglia o tua?"
    goals: [react]
  - learner: "Un po' mia, lo ammetto: ieri sera sono uscito benché avessi il colloquio. Però anche la app delle ferrovie ha la sua colpa, cambia la data da sola! La multa è stata la goccia che ha fatto rovesciare il vaso."
    errors: [word-choice]
  - tutor: "Capisco, la multa è stata la goccia che ha fatto traboccare il vaso. Però uscire la sera prima di un colloquio... te la sei un po' cercata, dai. Che cosa ti porti a casa da questa giornata?"
    recast: {text: "rovesciare il vaso", fix: "traboccare il vaso", tags: [word-choice]}
    goals: [blame]
  - learner: "Che la sera prima di una cosa importante si sta a casa, e che i biglietti si controllano due volte. E che chi dorme non piglia pesci, ma almeno non piglia multe!"
  - tutor: "Questa è bellissima, la devo ricordare! Dai, non tutto il male viene per nuocere: adesso hai una storia da raccontare. Il prossimo giro lo offro io."
    goals: [moral]
    done: true

- scenario: reclamo-comune
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Abito in via Solferino, dove due mesi fa è stato aperto un cantiere per le tubature. Dopo dieci giorni i lavori sono venuti interrotti e da allora nessuno si è più visto."
    errors: [passive]
  - tutor: "Via Solferino, vedo la segnalazione. Prima di registrarla devo scrivere la frase esatta: mi ripete la parte sui lavori? Con un tempo composto quell'ausiliare non si può usare."
    prompt: {text: "sono venuti interrotti", tags: [passive]}
    new: [{lemma: ausiliare, gloss: auxiliary verb}]
  - learner: "Ha ragione: i lavori sono stati interrotti dopo dieci giorni."
  - tutor: "Perfetto, lo metto a verbale così. Ci risulta che la ditta attenda un'autorizzazione dall'ufficio tecnico. Appena possibile i lavori riprenderanno."
    goals: [describe]
  - learner: "Mi perdoni, ma \"appena possibile\" è la stessa risposta che ho ricevuto un mese fa al telefono. Nel frattempo c'è uno scavo aperto davanti al portone e i residenti, di cui le macchine restano bloccate nel cortile, sono esasperati."
    errors: [relative-pronoun]
  - tutor: "Comprendo il disagio, mi creda. Un'osservazione, se permette: nel reclamo scritto la frase sui residenti va sistemata. Quando il relativo indica possesso, come si costruisce?"
    prompt: {text: "di cui le macchine", tags: [relative-pronoun]}
  - learner: "I residenti, le cui macchine restano bloccate nel cortile, sono esasperati."
  - tutor: "Esattamente. Quanto ai tempi, purtroppo oggi non sono in grado di indicarle una data: dipende da un altro ufficio."
    goals: [insist]
  - learner: "Lo capisco, ma allora vorrei sapere quali sono i miei diritti. Posso presentare un reclamo formale? E posso applicare per un rimborso, visto che pago un garage da due mesi?"
    errors: [word-choice]
  - tutor: "Certamente. Il reclamo si presenta qui, e l'amministrazione ha 30 giorni per risponderle. Può anche fare domanda di rimborso, allegando le ricevute del garage, ma l'esito non è garantito."
    recast: {text: "applicare per un rimborso", fix: "fare domanda di rimborso", tags: [word-choice]}
    goals: [rights]
  - learner: "Bene, allora presento il reclamo oggi stesso. In ordine a evitare altri ritardi, devo scrivere anche all'ufficio tecnico?"
    errors: [word-choice]
  - tutor: "Non è necessario: per evitare altri ritardi basta il reclamo, che trasmettiamo noi all'ufficio tecnico. Le serve altro?"
    recast: {text: "In ordine a evitare", fix: "per evitare", tags: [word-choice]}
  - learner: "Sì: le chiederei un numero di protocollo e il nome di un responsabile, in modo che io possa fare un sollecito se non ricevo risposta."
  - tutor: "Glielo stampo subito: il numero di protocollo è in alto a destra. Il responsabile del procedimento è l'ingegner Ferri, dell'ufficio tecnico. Se entro 30 giorni non riceve nulla, torni pure da me con questo foglio."
    goals: [commitment]
    done: true

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Dai, metà mi sembra esagerato. Secondo me alcuni lavori spariranno, altri cambieranno, e eventualmente ne nasceranno di nuovi, come è sempre successo con ogni tecnologia."
    errors: [false-friend]
  - tutor: "Che alla fine ne nasceranno di nuovi lo dicono tutti, ma intanto chi perde il posto a cinquant'anni che fa? La storia consola gli economisti, non chi resta a casa. Ce l'hai un esempio concreto, o è solo una speranza?"
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    goals: [position]
  - learner: "Ce l'ho. Mia cugina lavora nel customer service di una banca: da quando usano un assistente automatico per le domande semplici, lei si occupa dei casi complicati e guadagna di più."
    errors: [word-choice]
  - tutor: "Un caso felice, non lo nego. Ma all'assistenza clienti della mia banca erano in 20 e adesso sono in 6. Tua cugina è una dei 6, capisci?"
    recast: {text: "customer service", fix: "assistenza clienti", tags: [word-choice]}
    goals: [evidence]
  - learner: "Ok, questo è un punto valido, te lo concedo: non tutti riescono a riqualificarsi. Io stessa, se avrei saputo come cambiava il mercato, non avrei scelto traduzione all'università."
    errors: [hypothetical]
  - tutor: "Ah, vedi che un po' di paura ce l'hai anche tu! Aspetta, però: guarda la prima metà della frase, dopo \"se\". Lì il condizionale non ci può stare: come la sistemi?"
    prompt: {text: "se avrei saputo", tags: [hypothetical]}
    goals: [concede]
  - learner: "Se avessi saputo come cambiava il mercato, non avrei scelto traduzione. Ma senti, tra amici posso dire anche \"se lo sapevo, non sceglievo traduzione\"?"
  - tutor: "Sì, a tavola va benissimo: con l'imperfetto è più colloquiale, e lo diciamo tutti. In un esame o in una mail di lavoro, invece, meglio la versione che hai appena usato. E adesso che l'hai scelta, la traduzione, che pensi di fare?"
  - learner: "Mi specializzo: i testi legali e medici vanno ancora controllati da una persona, e qualcuno deve pur correggere le macchine. Non è che non abbia paura, ma preferisco prepararmi piuttosto che lamentarmi."
  - tutor: "Questa te la rubo. Allora diciamo così: la paura è giusta, purché serva a muoversi e non a restare fermi. Su questo siamo d'accordo, no?"
  - learner: "D'accordo. E adesso passami il vino, prima che un robot impari a versarlo meglio di te."
  - tutor: "Finché non impara a berlo, sto tranquillo! Alla salute, e a tua cugina."
    goals: [conclude]
    done: true

- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno, dottor Marchetti. Sì, la chiamo proprio per quello. Un aumento del quindici per cento, comunicato con due settimane di preavviso, per un'azienda piccola come la nostra è semplicemente insostenibile."
  - tutor: "Mi rendo conto che il preavviso sia stato breve, e me ne scuso. Ma da inizio anno il cartone ci costa il 20% in più: finora la differenza l'abbiamo pagata noi."
    goals: [problem]
  - learner: "Lo capisco, però lavoriamo insieme da otto anni e non abbiamo mai saltato un pagamento. Quando avete avuto problemi di consegna, due anni fa, vi abbiamo supportato senza chiedere penali. Mi aspettavo un trattamento diverso."
    errors: [word-choice]
  - tutor: "È vero, in quell'occasione ci avete sostenuto, e non l'ho dimenticato. Proprio per questo sono disposto a ragionare. Un listino diverso per ogni cliente, però, non posso permettermelo: che cosa propone?"
    recast: {text: "vi abbiamo supportato", fix: "ci avete sostenuto", tags: [word-choice]}
    goals: [argue]
  - learner: "Le propongo questo: accettiamo un aumento del sette per cento, a meno che i costi delle materie prime non scendono prima di giugno, nel qual caso si torna al vecchio listino."
    errors: [subjunctive-use]
  - tutor: "La clausola è ragionevole, ne parliamo subito. Prima, però, rilegga la frase: dopo \"a meno che\" il verbo va cambiato, e in un contratto queste cose saltano all'occhio."
    prompt: {text: "non scendono", tags: [subjunctive-use]}
  - learner: "A meno che i costi non scendano prima di giugno. E in cambio vi garantiamo gli stessi volumi per tutto l'anno."
  - tutor: "Così è corretto. Il 7% però è troppo poco: con quel margine lavoro in perdita. Posso arrivare al 10%, con la clausola di giugno e la consegna gratuita."
  - learner: "Il dieci è ancora alto per noi. Senta, e se aumentassimo l'ordine del venti per cento? Abbiamo una linea nuova che parte a marzo. In quel caso un nove per cento ve lo potremmo riconoscere... anzi, mi tolga un dubbio: parlando con lei, si dice \"ve lo\" o \"glielo\"?"
  - tutor: "Vanno bene entrambi: con \"ve lo\" si rivolge all'azienda, con \"glielo\" a me personalmente. Tra aziende è più comune il primo. Nel merito: con un ordine più alto del 20%, il 9% posso accettarlo."
    goals: [counteroffer]
  - learner: "Perfetto. Allora ricapitolo: aumento del nove per cento, ordine più alto del venti, consegna gratuita e clausola di revisione a giugno. Me lo conferma per iscritto entro domani?"
  - tutor: "Glielo confermo oggi stesso, così lo vede prima di sera. La ringrazio per la franchezza: è un piacere trattare con chi conosce i numeri."
    goals: [agreement]
    done: true

- scenario: medico-specialista
  level: C1
  persona: en-m-retired
  history: [ci-ne]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Meglio di prima, ma non del tutto bene. Quando salgo le scale sento ancora il battito accelerato, e la sera ho un affaticamento che prima non conoscevo. Di pastiglie per la pressione, ho preso una ogni mattina, come mi aveva detto."
    errors: [ci-ne]
  - tutor: "Bene che sia stato regolare con la terapia. Una piccola cosa sulla lingua, poi torniamo al cuore: in \"ho preso una\" manca la parolina che sostituisce \"di pastiglie\". Quale?"
    prompt: {text: "ho preso una", tags: [ci-ne]}
  - learner: "Ne ho presa una ogni mattina, sempre alle otto."
  - tutor: "Esatto. Il battito veloce sotto sforzo, alla sua età, non mi preoccupa troppo. In famiglia qualcuno ha avuto problemi di cuore?"
    goals: [symptoms]
  - learner: "Purtroppo sì. Mio padre ha avuto un infarto a sessantadue anni, e mio fratello maggiore prende da anni un beta blocker. Mia madre invece è arrivata a novantuno senza una medicina."
    errors: [word-choice]
  - tutor: "Il betabloccante di suo fratello è un'informazione utile, la segno. Con un padre e un fratello così, è giusto tenerla sotto controllo. Per il resto, gli esami sono buoni."
    recast: {text: "beta blocker", fix: "betabloccante", tags: [word-choice]}
    new: [{lemma: betabloccante, gloss: beta blocker}]
    goals: [history]
  - learner: "Mi fa piacere. Però vorrei capire meglio: nel referto c'è scritto \"lieve ipertrofia\". È qualcosa di cui dovrei preoccuparmi? E mi permetta una domanda di lingua: lei dice \"affaticamento\", io direi \"stanchezza\". È lo stesso?"
  - tutor: "Quasi. \"Stanchezza\" è la parola di tutti i giorni; \"affaticamento\" è più tecnico e indica la fatica che viene da uno sforzo. Quanto all'ipertrofia, significa che il muscolo del cuore è un po' più spesso: con la pressione sotto controllo non peggiora."
    goals: [understand]
  - learner: "Capisco. Quindi continuo con la stessa terapia? Glielo chiedo perché da qualche settimana ho le caviglie gonfie, e prima che iniziavo le pastiglie non mi era mai successo."
    errors: [subjunctive-use]
  - tutor: "Le caviglie gonfie sono un effetto collaterale noto. Mi ripete l'ultima parte? Dopo \"prima che\" il verbo non può restare all'indicativo."
    prompt: {text: "prima che iniziavo", tags: [subjunctive-use]}
    new: [{lemma: indicativo, gloss: indicative}]
  - learner: "Prima che iniziassi le pastiglie non mi era mai successo."
  - tutor: "Bene. Allora cambiamo farmaco: le scrivo la ricetta per uno simile, che di solito non dà questo problema. Se entro 2 settimane le caviglie non migliorano, mi chiami."
  - learner: "D'accordo. E per il resto posso continuare a camminare ogni giorno, o devo evitare gli sforzi?"
  - tutor: "Cammini pure, anzi: un'ora al giorno è la cura migliore. Eviti solo le salite ripide finché non ci rivediamo, tra 3 mesi, per un controllo."
    goals: [treatment]
    done: true

- scenario: intervista-podcast
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Grazie a voi dell'invito! Sono arrivata sette anni fa per un anno di scambio tra scuole, e pensavo che era una parentesi. Poi ho conosciuto il mio compagno a un corso di ceramica, e la parentesi è diventata la mia vita."
    errors: [subjunctive-use]
  - tutor: "Galeotto fu il corso di ceramica! Senti, prima di andare avanti: \"pensavo che...\" e poi? Riprova con quel verbo, che lì serve un altro modo."
    prompt: {text: "pensavo che era", tags: [subjunctive-use]}
  - learner: "Pensavo che fosse una parentesi. È che in spagnolo lo diciamo con l'indicativo!"
  - tutor: "Lo so, è la trappola classica per voi spagnoli. Dunque sei rimasta per amore. E i primi tempi, che cosa ti ha spiazzata di più?"
    goals: [story]
  - learner: "Gli orari, anche se ti sembrerà strano detto da una spagnola. A Valencia saliamo a cena alle dieci di sera; qui alle sette e mezza i ristoranti sono già pieni, e alle dieci ti guardano male se chiedi un tavolo."
    errors: [false-friend]
  - tutor: "Ah, quindi a Valencia uscite a cena alle dieci, quando noi siamo già al digestivo! In effetti da noi la cucina chiude presto. E c'è qualcosa dell'Italia che proprio non ti va giù? Puoi dirlo, siamo tra amici."
    recast: {text: "saliamo a cena", fix: "uscite a cena", tags: [false-friend]}
    goals: [culture-shock]
  - learner: "Con tutto l'affetto: la burocrazia. Per cambiare la residenza ho girato quattro uffici, e in ognuno mi dicevano una cosa diversa. A proposito, tu sai perché in Italia si usano ancora le marche da bollo? Me lo sono sempre chiesta."
  - tutor: "Bella domanda: credo che non lo sappia più nessuno, nemmeno chi le vende! È una di quelle abitudini che sopravvivono a tutto. Però quattro uffici non sono pochi: ti è mai venuta la tentazione di mollare?"
    goals: [critique]
  - learner: "Qualche volta sì. Il primo inverno a Bologna è stato duro. Ecco, una curiosità: si dice \"avevo nostalgia di casa\" o \"mi mancava casa\"? Le uso tutte e due e non so mai quale sia meglio."
  - tutor: "Sono giuste tutte e due. \"Mi mancava casa\" è la più comune, di tutti i giorni; \"avevo nostalgia\" pesa un po' di più, fa pensare a una distanza lunga. E a chi ci ascolta e sogna di trasferirsi qui, che cosa diresti?"
  - learner: "Di imparare la lingua prima di partire, nonostante all'inizio sembra impossibile. E di non idealizzare: l'Italia non è una cartolina, è un paese vero, con i suoi difetti."
    errors: [subjunctive-use]
  - tutor: "Consiglio saggio. Guarda solo il verbo dopo \"nonostante\": che modo vuole?"
    prompt: {text: "nonostante all'inizio sembra", tags: [subjunctive-use]}
  - learner: "Nonostante all'inizio sembri impossibile. Vedi? Sette anni e ancora ci casco."
  - tutor: "Ci caschiamo anche noi, credimi! Non una cartolina ma un paese vero: lo metto come titolo della puntata. Grazie di cuore, è stato un piacere."
    goals: [advice]
    done: true

- scenario: dibattito-ambiente
  level: C1
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Con rispetto, la penso all'opposto. Sono favorevole alla zona pedonale: il centro è soffocato dal traffico, e chi ci abita respira un'aria che non augurerei a nessuno."
  - tutor: "L'aria è un problema, glielo concedo. Ma io ho una merceria in via Roma da 30 anni, e i miei clienti arrivano in macchina. Se non possono parcheggiare, vanno al centro commerciale."
    goals: [position]
  - learner: "Capisco la preoccupazione, ma i dati dicono altro. A Bolzano, dopo la chiusura, gli incassi sono saliti. E poi ci sono i commercianti, i quali negozi stanno sulle vie già pedonali, che non tornerebbero mai indietro."
    errors: [relative-pronoun]
  - tutor: "Bolzano non è la nostra città, ma ci arrivo. Mi scusi, la frase sui commercianti non l'ho seguita: i negozi sono loro, giusto? Allora il relativo va costruito diversamente."
    prompt: {text: "i quali negozi", tags: [relative-pronoun]}
  - learner: "Sì, mi scusi: i commercianti i cui negozi stanno sulle vie già pedonali non tornerebbero mai indietro."
  - tutor: "Adesso è chiaro. Forse, ma quelli hanno bar e ristoranti. Io vendo bottoni: chi fa 500 metri a piedi dal parcheggio per comprarne uno?"
    goals: [argue]
  - learner: "Qui ha un punto, lo ammetto: non tutti i negozi sono uguali. Però guardi che anche tu potresti guadagnarci, con più gente che passeggia davanti alla vetrina."
    errors: [register]
  - tutor: "Guadagnarci, dice... Ah, un momento: ci conosciamo da 5 minuti e siamo in assemblea. Riformuli, per cortesia, come si fa tra vicini che non si frequentano."
    prompt: {text: "anche tu potresti", tags: [register]}
  - learner: "Ha ragione, mi perdoni. Anche lei potrebbe guadagnarci, con più gente che passeggia davanti alla vetrina."
  - tutor: "Scuse accettate. Gente che passeggia, sì, ma che compra? E i miei clienti anziani, che a piedi non vengono di sicuro?"
  - learner: "Per loro si potrebbe prevedere una navetta elettrica gratuita, e dei permessi per i residenti e per chi ha difficoltà a camminare. Il problema dei parcheggi è reale e deve andare risolto prima della chiusura, non dopo."
    errors: [passive]
  - tutor: "La navetta è una buona idea. Solo un dettaglio: nel passivo con \"andare\" l'obbligo è già dentro il verbo, quindi \"deve\" è di troppo. Come diventa la frase?"
    prompt: {text: "deve andare risolto", tags: [passive]}
    goals: [counter]
  - learner: "Il problema dei parcheggi va risolto prima della chiusura, non dopo."
  - tutor: "Su questo sono d'accordo con lei. Se il Comune costruisce prima il parcheggio e mette la navetta, potrei anche cambiare idea."
  - learner: "Allora proponiamolo insieme: una prova di sei mesi, solo nel fine settimana, con il parcheggio di piazza Mazzini aperto e la navetta. Se gli incassi calano, si torna indietro."
  - tutor: "Una prova di 6 mesi la posso accettare. La firmiamo insieme, la proposta: così nessuno dirà che i commercianti sanno solo protestare."
    goals: [concede]
    done: true

- scenario: notizie-attualita
  level: C1
  persona: en-m-traveller
  history: [hypothetical]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "L'ho letta sul treno. Da quel che ho capito, la legge che ne parlano tutti mette un limite: chi affitta ai turisti per più di novanta giorni all'anno deve registrarsi come impresa e pagare più tasse."
    errors: [relative-pronoun]
  - tutor: "Hai capito bene, più o meno. Però senti: \"la legge che ne parlano tutti\" a voce capita, ma non sta in piedi. Con quale pronome relativo la sistemi?"
    new: [{lemma: relativo, gloss: relative}, {lemma: pronome, gloss: pronoun}]
    prompt: {text: "che ne parlano", tags: [relative-pronoun]}
  - learner: "La legge di cui parlano tutti. Meglio?"
  - tutor: "Molto meglio. E a te sembra giusta? Io ho i miei dubbi: quando lo Stato si mette a contare i giorni, di solito finisce in un pasticcio."
    goals: [summarise]
  - learner: "Mah, io sono diviso. Da un lato a Firenze non si trova più una stanza a meno di ottocento euro, e questo è colpa anche degli affitti brevi. Dall'altro, la signora che affitta la casa della nonna non è mica una multinazionale."
  - tutor: "Ecco, proprio lì volevo arrivare: la legge tratta la signora e il fondo immobiliare allo stesso modo. Tu dove l'hai letta, la notizia? Perché ogni testata la racconta a modo suo."
    goals: [opinion]
  - learner: "Su due giornali. Uno titolava \"Stop alla giungla degli affitti\", l'altro \"Stangata sui piccoli proprietari\". Sembravano due leggi diverse. Attualmente non so quale dei due sia più onesto."
    errors: [false-friend]
  - tutor: "A dire il vero non lo so nemmeno io, quale sia più onesto! Uno parla ai giovani che cercano casa, l'altro ai proprietari. Io di solito vado a leggere il testo della legge, l'unica fonte che non ha un titolo da vendere."
    recast: {text: "Attualmente", fix: "A dire il vero", tags: [false-friend]}
    goals: [sources]
  - learner: "Hai ragione, dovrei farlo anch'io. Ma senti, secondo te cambierà davvero qualcosa? Io penso che molti proprietari troveranno un modo per aggirarla, tipo intestare la casa al cugino."
  - tutor: "Fatta la legge, trovato l'inganno: lo diciamo da secoli. Però non credo che tutti abbiano un cugino disponibile! Qualcuno tornerà agli affitti lunghi, e i prezzi potrebbero scendere un po'."
  - learner: "Speriamo. Se i prezzi scenderebbero anche solo del dieci per cento, io finalmente lascerei la stanza che divido con due studenti."
    errors: [hypothetical]
  - tutor: "Te lo auguro, alla tua età una casa tua ci vuole. Occhio alla frase, però: dopo \"se\" hai messo lo stesso modo che usi nella seconda parte. Lo cambi?"
    prompt: {text: "Se i prezzi scenderebbero", tags: [hypothetical]}
  - learner: "Se i prezzi scendessero del dieci per cento, lascerei la stanza. E ti inviterei a cena, ovviamente."
  - tutor: "Allora tifo per la legge, anche se non mi convince! Dai, torniamo alle scrivanie, che il capo ci guarda."
    goals: [consequences]
    done: true

- scenario: colloquio-promozione
  level: C1
  persona: es-f-teacher
  history: [hypothetical]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, direttore, la ringrazio. Vorrei fare il punto sul mio lavoro. Quest'anno ho coordinato il nuovo programma di formazione: abbiamo formato centoventi persone e le valutazioni finali sono state le più alte degli ultimi cinque anni."
  - tutor: "Ho visto i numeri, e sono ottimi. Mi hanno parlato bene anche del suo modo di gestire la squadra. Dove vuole arrivare?"
    goals: [results]
  - learner: "Arrivo al punto. Da due anni svolgo di fatto compiti da responsabile, senza averne il titolo. Vorrei che lei consideri la mia promozione a responsabile della formazione."
    errors: [subjunctive-form]
  - tutor: "La richiesta è legittima, e apprezzo che me la faccia direttamente. Solo una nota: dopo \"vorrei che\" il congiuntivo presente stona. Mi ridica la frase, la voglio riportare tale e quale alla direzione."
    prompt: {text: "che lei consideri", tags: [subjunctive-form]}
    new: [{lemma: congiuntivo, gloss: subjunctive}]
  - learner: "Vorrei che lei considerasse la mia promozione a responsabile della formazione."
  - tutor: "Così è impeccabile. Nel merito, però, le dico subito il problema: i fondi per quest'anno sono finiti, e le promozioni si decidono a gennaio."
    goals: [request]
  - learner: "Lo immaginavo. Ma mi permetta: se avrei aspettato gennaio ogni volta, non avrei mai lanciato il programma. Il budget si può trovare, se c'è la volontà."
    errors: [hypothetical]
  - tutor: "La volontà c'è, glielo assicuro. Guardi però l'inizio della sua frase, dopo \"se\": lì quel tempo non regge. Vuole riprovare?"
    prompt: {text: "se avrei aspettato", tags: [hypothetical]}
  - learner: "Se aspettavo... no, in questa situazione è meglio: se avessi aspettato gennaio ogni volta, non avrei mai lanciato il programma."
  - tutor: "Esatto, e apprezzo la scelta di registro. Sul merito mi ha quasi convinto. Mi dica: che cosa cambierebbe, in concreto, con il nuovo ruolo?"
  - learner: "Potrei prendere decisioni sui fornitori senza passare ogni volta da tre firme, e seguire anche la sede di Padova. E, sinceramente, sarebbe un riconoscimento: non si lavora solo per lo stipendio, benché lo stipendio conti."
  - tutor: "Su questo ha ragione. Le propongo allora una soluzione: da subito la responsabilità di Padova, con un compenso in più, e a inizio anno porto io la sua promozione in direzione."
    goals: [handle]
  - learner: "Mi sembra un compromesso ragionevole, purché resti scritto. Potrebbe mandarmi due righe di conferma, con la data della valutazione di gennaio?"
  - tutor: "Gliele mando entro venerdì, con la data. E complimenti: ha difeso bene la sua causa."
    goals: [next-steps]
    done: true

- scenario: trattativa-affitto
  level: C1
  persona: en-f-student
  history: [ci-ne]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto, soprattutto la luce in cucina. Però ho notato delle macchie di umidità nel bagno, e prima di decidere devo pensarne con calma."
    errors: [ci-ne]
  - tutor: "Le macchie le ha viste bene: il proprietario farà ridipingere prima della consegna. Quanto a \"pensarne\": con \"pensare a qualcosa\" quale particella si usa? Rifletta un attimo."
    prompt: {text: "pensarne", tags: [ci-ne]}
  - learner: "Devo pensarci con calma, certo."
  - tutor: "Ecco. Non troppa calma, però, mi raccomando: ho altre 2 visite domani. Il canone è di 950 euro al mese."
    goals: [interest]
  - learner: "Novecentocinquanta mi sembra alto per un bilocale al quarto piano senza ascensore. Sarei disposta a firmare subito a ottocentocinquanta, a patto che il proprietario ripara anche la finestra della camera."
    errors: [subjunctive-use]
  - tutor: "La cifra è lontana dalla richiesta, ma la finestra è un punto giusto. Intanto sistemi la condizione: dopo \"a patto che\" serve un altro modo, altrimenti nel contratto non la posso scrivere!"
    prompt: {text: "a patto che il proprietario ripara", tags: [subjunctive-use]}
  - learner: "A patto che il proprietario ripari la finestra. E l'umidità, ovviamente."
  - tutor: "Bene, ora è una condizione in piena regola. Ho sentito il proprietario stamattina: può scendere a 900, non di meno, lavori compresi."
  - learner: "Novecento con i lavori può andare. Senta, cambiando discorso: lei è di qui? Perché non ho ancora capito dove si mangia bene in questo quartiere."
  - tutor: "Sono nato a 2 strade da qui! Vada alla trattoria in fondo a via Cairoli, e prenda i tortelli. Ma torniamo a noi: il contratto è un 4 più 4, con cedolare secca."
    goals: [negotiate]
  - learner: "Quattro anni sono tanti per me: finisco il dottorato tra due anni. Quanto è il preavviso per la disdetta? E i soldi che lascio all'inizio come si chiamano, caparra o cauzione? Li sento usare tutti e due."
  - tutor: "Per un affitto si parla di cauzione, o deposito cauzionale: qui sono 2 mesi. La caparra invece si versa quando si compra casa o si prenota qualcosa. Quanto alla disdetta, lei può andarsene con 6 mesi di preavviso."
    goals: [conditions]
  - learner: "Sei mesi sono troppi. Se mi offrissero un lavoro all'estero, pagherei mezzo anno di affitto a vuoto. Tre mesi, e firmo oggi."
  - tutor: "Va bene, 3 mesi: li scrivo in una clausola a parte. Allora siamo d'accordo: 900 euro, lavori fatti, 3 mesi di preavviso."
  - learner: "Siamo d'accordo. Mi mandi pure la bozza del contratto, la leggo stasera e domani passo a firmare."
  - tutor: "Gliela mando entro un'ora. E domani, dopo la firma, i tortelli li offre lei!"
    goals: [conclude]
    done: true

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Non mi disturba affatto, Giulia, si sieda. Ho visto che è uscita dalla sala scura in volto. Mi racconti tutto con calma, sono qui per ascoltarla."
  - tutor: "La ringrazio. Il rapporto per il cliente l'abbiamo scritto in due, Paolo e io, e io ho fatto tutta l'analisi dei dati. Ieri lui l'ha presentato come se fosse suo, senza nominarmi una volta."
    goals: [listen]
  - learner: "Capisco che sia rimasta male, e al suo posto lo sarei anch'io. Mi aiuti però a capire i fatti: Paolo ha detto esplicitamente che il lavoro era suo, oppure ha parlato al plurale? E lei lo ha già confrontato dopo la riunione?"
    errors: [false-friend]
  - tutor: "No, non l'ho ancora affrontato: ero troppo arrabbiata e avrei detto cose di cui pentirmi. Ha detto \"ho analizzato\", \"ho concluso\": sempre al singolare. Il mio nome era solo sull'ultima pagina, in piccolo."
    recast: {text: "confrontato", fix: "affrontato", tags: [false-friend]}
    goals: [clarify]
  - learner: "Questo è grave, e non lo sottovaluto. Però le chiedo di considerare anche un'altra possibilità: Paolo era molto nervoso, era la sua prima presentazione davanti al cliente. Sebbene ha sbagliato, non credo che l'abbia fatto con cattiveria."
    errors: [subjunctive-use]
  - tutor: "Forse era nervoso, ma il risultato per me non cambia. E mi perdoni se sono pignola, sarà la rabbia: dopo \"sebbene\" quel verbo mi suona male. Lo dice in un altro modo?"
    prompt: {text: "Sebbene ha sbagliato", tags: [subjunctive-use]}
  - learner: "Ha ragione, e fa bene a dirmelo. Sebbene abbia sbagliato, non credo che l'abbia fatto con cattiveria. Questo non toglie che il suo lavoro vada riconosciuto."
  - tutor: "Ecco, questo volevo sentire. Non pretendo delle scuse in pubblico. Voglio solo che il cliente e la direzione sappiano chi ha fatto che cosa."
    goals: [perspective]
  - learner: "Mi sembra una richiesta giusta. Le propongo questo: domani parlo io con Paolo, in privato. Poi mando al cliente una mail con i nomi di tutti e due e i rispettivi contributi. Di questo problema, ne gli parlerò con fermezza, ma senza umiliarlo."
    errors: [combined-pronouns]
  - tutor: "La mail al cliente mi fa stare molto meglio. Solo, quei due pronomi insieme, \"ne\" e \"gli\": in che ordine vanno, e come si uniscono?"
    prompt: {text: "ne gli parlerò", tags: [combined-pronouns]}
    new: [{lemma: pronome, gloss: pronoun}]
  - learner: "Gliene parlerò con fermezza. E alla prossima riunione la presentazione dei dati la fa lei."
  - tutor: "Allora accetto volentieri. Grazie per avermi ascoltata: temevo che finisse tutto con una pacca sulla spalla. Torno al lavoro più leggera."
    goals: [solution]
    done: true

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno a tutti. Mi chiamo Walter, sono americano e vivo a Venezia da sei anni. Sono a favore, benché mi renda conto che non è una soluzione perfetta."
  - tutor: "Un americano a favore del ticket: chi ci ascolta da Venezia la ringrazia! Ma mi spieghi perché. 5 euro fermano davvero qualcuno?"
    goals: [introduce]
  - learner: "Da soli no. Però le faccio un esempio. Io sono stato detto dai vicini che lo scorso aprile, il primo giorno del ticket, in calle si camminava di nuovo: ero via, ma al ritorno l'ho visto con i miei occhi."
    errors: [passive]
  - tutor: "Camminare in calle, un lusso! Mi fermo un secondo sulla forma, perché in italiano una persona non può \"essere detta\". Chi ha parlato, e a chi? Riparta da lì."
    prompt: {text: "sono stato detto", tags: [passive]}
  - learner: "Giusto, è un calco dall'inglese. Mi è stato detto dai vicini che in calle si camminava di nuovo. Oppure, più semplice: me l'hanno detto i vicini."
  - tutor: "Perfette tutte e due. Ora però faccio l'avvocato del diavolo: una città non è un museo. Far pagare l'ingresso non significa ammettere che Venezia è ormai un parco a tema?"
    goals: [example]
  - learner: "È un'obiezione seria, ma la rovescio: Venezia rischia di diventare un parco a tema proprio se non si fa niente. I residenti sono scesi sotto i cinquantamila. Se dieci anni fa avrebbero limitato le crociere, oggi avremmo ancora negozi veri invece di sole maschere di plastica."
    errors: [hypothetical]
  - tutor: "Sulle maschere di plastica non la contraddico. Ma riascolti l'inizio dell'ultima frase: dopo \"se\", per un'ipotesi nel passato, che tempo serve?"
    prompt: {text: "avrebbero limitato", tags: [hypothetical]}
  - learner: "Se dieci anni fa avessero limitato le crociere, oggi avremmo ancora negozi veri."
  - tutor: "Eccola. E su questo, glielo dico fuori dal mio ruolo, è difficile darle torto. Chi vive di turismo, però, le risponderà che con i divieti non si mangia."
    goals: [rebut]
  - learner: "In parte ha ragione: il turismo dà lavoro a mezza città, me compreso, perché faccio la guida. Il problema non è il turismo, è la quantità."
  - tutor: "Una guida che vuole meno lavoro: questa sì che è una notizia! Allora che cosa propone, in pratica?"
  - learner: "Non divieti, ma regole: prenotazione obbligatoria nei giorni di punta, il ricavato del ticket speso solo per le case dei residenti, e un tetto agli affitti turistici. Mi scusi, \"tetto\" si può dire in questo senso?"
  - tutor: "Si può, eccome: \"mettere un tetto\" a prezzi, affitti o stipendi è un'espressione comunissima. 3 proposte concrete in 20 secondi: complimenti, Walter. Grazie della telefonata, e buon pane!"
    goals: [proposal]
    done: true

- scenario: vita-in-italia
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Benvenuto, e benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. I miei nonni erano di un paese vicino a Cosenza, emigrati a Toronto negli anni cinquanta. Sono cresciuto sentendo il dialetto in cucina, e a trentacinque anni ho voluto vedere se quel paese esisteva davvero o solo nei loro racconti."
  - tutor: "Un ritorno a casa, in un certo senso. E quando è arrivato, ha trovato il paese dei racconti?"
    goals: [story]
  - learner: "Per niente! Credevo che il dialetto dei nonni basta per farmi capire, e invece a Milano nessuno mi capiva. Parlavo un calabrese di settant'anni fa, mescolato all'inglese."
    errors: [subjunctive-use]
  - tutor: "Un calabrese d'altri tempi a Milano: avrei pagato per sentirla! Riascolti però la frase: \"credevo che il dialetto...\" e poi? Il verbo deve seguire quel passato."
    prompt: {text: "che il dialetto dei nonni basta", tags: [subjunctive-use]}
  - learner: "Credevo che il dialetto dei nonni bastasse. Mi scusi, faccio ancora questi errori dopo sei anni, e in radio poi... mi vergogno un po'."
  - tutor: "Non ha niente di cui vergognarsi: parla un italiano ricco, e si è corretto da solo in un secondo. Mi dica piuttosto qual è stata la difficoltà più grande, lingua a parte."
  - learner: "Sentirmi straniero due volte. In Canada ero \"l'italiano\", qui sono \"il canadese\". Avevo assunto che gli italiani fossero tutti come i miei nonni, e invece ho dovuto ricominciare da zero, come chiunque."
    errors: [false-friend]
  - tutor: "Aveva dato per scontato di trovare una famiglia, e ha trovato un paese nuovo: capisco la sorpresa. E questi 6 anni come l'hanno cambiata?"
    recast: {text: "Avevo assunto", fix: "Aveva dato per scontato", tags: [false-friend]}
    goals: [difficulties]
  - learner: "Sono diventato più paziente, credo. E ho imparato a perdere tempo bene: un caffè al banco, due chiacchiere col vicino. Essendo ingegnere, all'inizio mi sembrava uno spreco. Posso chiederle una cosa? Si dice \"perdere tempo\" anche quando è una cosa bella?"
  - tutor: "Bella domanda. \"Perdere tempo\" di solito ha un senso negativo; per quello che descrive lei diciamo piuttosto \"prendersela comoda\". Detto questo, \"perdere tempo bene\" mi piace molto: glielo rubo."
    goals: [change]
  - learner: "Lo prenda pure! Un consiglio per chi vuole trasferirsi? Non venire per la cartolina. Se fossi venuto solo per il sole e la pasta, sarei tornato a casa dopo il primo inverno a Milano. Bisogna venire per le persone."
  - tutor: "Per le persone, non per la cartolina. E se dovesse rifare tutto da capo, lo rifarebbe?"
  - learner: "Domani mattina. Magari con un corso di italiano prima di partire, però: i miei nonni mi perdoneranno."
  - tutor: "Ne sono sicura. Grazie per essere stato con noi, e un saluto a Cosenza da parte di tutta la radio."
    goals: [advice]
    done: true

- scenario: smartworking
  level: C1
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Tre giorni a casa e due in ufficio, da quando ho cominciato lo stage a settembre. Se me lo dicevano prima che era così comodo, lo chiedevo già al colloquio!"
  - tutor: "Te lo potevo dire io, che lo faccio da anni! Tre e due mi sembra un buon equilibrio. Che cosa ti piace di più dei giorni a casa?"
    goals: [situation]
  - learner: "Niente metro alle otto di mattina, per cominciare. E riesco a concentrarmi molto meglio: in ufficio c'è sempre qualcuno che ti interrompe. Poi a casa posso fare una lavatrice tra una riunione e l'altra, il che non è poco."
  - tutor: "La lavatrice in orario di lavoro: il vero progresso! Io invece a casa finisco per aprire il frigo ogni mezz'ora. E i lati negativi, li senti?"
    goals: [pros]
  - learner: "Eccome. Vivendo in una stanza di dodici metri quadri, il letto è a un metro dalla scrivania e non stacco mai. E i colleghi li conosco poco: agli aperitivi del giovedì non ne vado quasi mai, perché sono sempre i giorni in cui lavoro da casa."
    errors: [ci-ne]
  - tutor: "Dodici metri quadri sono pochi per vivere e lavorare insieme, hai ragione. Aspetta, però: \"non ne vado\"? Con un posto in cui si va, quella particella non funziona."
    prompt: {text: "non ne vado", tags: [ci-ne]}
  - learner: "Non ci vado quasi mai, giusto. Però ne sento la mancanza, questo sì."
  - tutor: "Ecco, lì \"ne\" è perfetto. E allora perché non scambi un giorno? Vieni in ufficio il giovedì, così l'aperitivo non lo perdi."
    goals: [cons]
  - learner: "Ci ho pensato, ma il giovedì c'è la mia capa, e lei è un po'... come si dice \"micromanager\" in italiano? Una che ti sta addosso tutto il giorno."
  - tutor: "Una parola sola non c'è. Diciamo che vuole controllare ogni cosa, oppure che ti sta col fiato sul collo. Ne ho avuto uno anch'io, ti capisco. E se potessi scegliere liberamente, come lavoreresti?"
  - learner: "Col fiato sul collo, bellissimo, rende l'idea. Se potrei scegliere, farei due giorni a casa e tre in ufficio, ma in un ufficio vicino, non a un'ora di metro."
    errors: [hypothetical]
  - tutor: "Sull'ufficio vicino firmo anch'io. Guarda un attimo il verbo dopo \"se\", però: l'hai appena sentito giusto nella mia domanda!"
    prompt: {text: "Se potrei", tags: [hypothetical]}
  - learner: "Se potessi scegliere! Lo so, lo so, è che quando parlo veloce mi scappa."
  - tutor: "Scappa a tutti, tranquilla. Due giorni a casa e tre in un ufficio vicino: speriamo che la tua capa ci ascolti. Intanto brindiamo al giovedì!"
    goals: [preference]
    done: true

- scenario: arte-mostra
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi inquieta, ma in senso buono. La donna guarda fuori dal quadro come se sa qualcosa che noi non sappiamo."
    errors: [subjunctive-use]
  - tutor: "È vero, ha uno sguardo che ti segue. Senti, dopo \"come se\" il verbo non può restare così: quale forma serve?"
    prompt: {text: "come se sa", tags: [subjunctive-use]}
  - learner: "Come se sapesse qualcosa che noi non sappiamo."
  - tutor: "Proprio quella. E ti dirò, per me lo sa davvero. Raccontami un po' quello che vedi intorno a lei."
    goals: [react]
  - learner: "È seduta vicino a una finestra, con un vestito verde scuro. Lo sfondo è quasi nero, e la luce cade solo sulle mani e sul viso. Le brushstrokes sono molto visibili, quasi violente."
    errors: [word-choice]
  - tutor: "Sì, le pennellate qui sono quasi dei colpi: da vicino sembra tutto confuso, da lontano diventa una faccia. Perché l'avrà dipinta così, secondo te?"
    recast: {text: "brushstrokes", fix: "pennellate", tags: [word-choice]}
    new: [{lemma: pennellata, gloss: brushstroke}]
    goals: [describe]
  - learner: "Forse il pittore mostra una donna che pretende di essere tranquilla, ma dentro è agitata. Le mani la tradiscono: guarda come stringe il fazzoletto."
    errors: [false-friend]
  - tutor: "Una donna che finge di essere tranquilla: mi piace, e quel fazzoletto ti dà ragione. Io ci vedevo solo stanchezza, ma la tua lettura è più interessante."
    recast: {text: "pretende di essere", fix: "finge di essere", tags: [false-friend]}
    goals: [interpret]
  - learner: "Grazie! Una cosa che mi chiedo sempre: tu dici \"quadro\", sul cartellino c'è scritto \"dipinto\". C'è differenza o sono sinonimi?"
  - tutor: "Quasi sinonimi. \"Dipinto\" è la parola più tecnica, da museo, e vale anche per un affresco; \"quadro\" è l'oggetto che appendi al muro, con la sua cornice. Parlando tra noi, \"quadro\" va benissimo."
  - learner: "Chiaro. Comunque mi ricorda i ritratti di un pittore che ho visto la sua mostra a Dublino, ma non mi viene il nome... quello con le facce lunghe e gli occhi senza pupille."
    errors: [relative-pronoun]
  - tutor: "Facce lunghe e occhi vuoti: Modigliani, direi! Però sistema quella frase: \"un pittore che ho visto la sua mostra\" non regge. Come leghi il pittore alla mostra?"
    prompt: {text: "che ho visto la sua mostra", tags: [relative-pronoun]}
  - learner: "Un pittore di cui ho visto la mostra a Dublino. Modigliani, esatto!"
  - tutor: "Ecco. Il confronto regge: anche lui allungava le figure. Ma lì tutto è calmo, qui invece le pennellate sono nervose."
  - learner: "Sì, Modigliani è elegante, questo è più... vero? Meno bello ma più vivo. Se dovessi appenderne uno in casa, sceglierei questo."
  - tutor: "Anch'io, e pensare che siamo entrati per ripararci dalla pioggia! Vieni, nella prossima sala c'è un quadro che ti farà discutere."
    goals: [compare]
    done: true

- scenario: assicurazione-sinistro
  level: C1
  persona: es-m-worker
  history: [combined-pronouns]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri sera, verso le undici, tornavo dal ristorante dove lavoro. Ero fermo al semaforo di via Stalingrado e una macchina mi ha tamponato da dietro. Il paraurti è distrutto e il baule non si chiude più."
  - tutor: "Mi dispiace. Lei sta bene, nessun ferito? E mi conferma che era fermo al rosso quando è stato colpito?"
    goals: [what]
  - learner: "Sto bene, grazie, solo un po' di male al collo. Sì, ero fermo da almeno dieci secondi. La responsabilità è tutta dell'altro conducente: guardava il telefono. Sono venuti i vigili e lui stesso se lo ha detto."
    errors: [combined-pronouns]
  - tutor: "Se c'erano i vigili, la sua posizione è solida. Mi ripete solo l'ultima frase? \"Se lo ha detto\" in italiano fa pensare che parlasse da solo: a chi parlava, e con quale pronome lo indica?"
    prompt: {text: "se lo ha detto", tags: [combined-pronouns]}
    new: [{lemma: pronome, gloss: pronoun}]
  - learner: "Gliel'ha detto, ai vigili. In spagnolo è \"se lo\", mi confondo sempre."
  - tutor: "Capita, tra lingue così vicine. Dunque l'altro ha ammesso la colpa davanti ai vigili: bene. Avete riempito insieme la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo firmata tutti e due. Ho anche le foto della targa e del danno. Però una domanda: c'è una casella che dice \"franchigia\". Che cos'è esattamente?"
  - tutor: "La franchigia è la parte del danno che resta a carico suo. Ma stia tranquillo: avendo ragione, paga tutto l'assicurazione dell'altro conducente. Mi può mandare il modulo e le foto?"
  - learner: "Certo, li invio oggi per mail. Del modulo però ho solo una foto: l'originale è rimasto in macchina, e la macchina l'hanno portata via con il carro attrezzi senza che io ho potuto prenderlo."
    errors: [subjunctive-use]
  - tutor: "Per ora basta una foto leggibile; l'originale lo porta quando può. Un dettaglio: dopo \"senza che\" il verbo va cambiato. Come lo dice?"
    prompt: {text: "senza che io ho potuto", tags: [subjunctive-use]}
    goals: [documents]
  - learner: "Senza che io potessi prenderlo. Grazie. E adesso che cosa succede? Quanto devo aspettare per riparare la macchina?"
  - tutor: "Corretto. Entro 5 giorni la chiama un nostro perito per vedere il danno. Dopo la perizia può far riparare l'auto, e in genere la pratica si chiude in un mese."
  - learner: "Un mese senza macchina è un problema: finisco di lavorare a mezzanotte e a quell'ora non ci sono autobus. Avrei diritto a una macchina sostitutiva?"
  - tutor: "Nella sua polizza l'auto sostitutiva è prevista, per 15 giorni al massimo. Gliela prenoto subito: può ritirarla domani mattina in via Marconi, con patente e documento."
  - learner: "Perfetto, la ringrazio molto. Allora aspetto la chiamata del perito e le mando le foto entro stasera."
  - tutor: "Benissimo. Il numero della pratica le arriva per messaggio tra pochi minuti. Buona giornata, e si faccia vedere quel collo."
    goals: [next]
    done: true

- scenario: politica-lavoro
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che l'ho già sentita, questa frase. Negli anni ottanta lavoravo in una fabbrica di motori in Ohio, e quando sono arrivati i robot tutti dicevano la stessa cosa. Eppure io ho lavorato fino a sessantacinque anni."
  - tutor: "Tu sì, ma quanti dei tuoi colleghi possono dire lo stesso? I robot di allora spostavano pezzi; questi di oggi scrivono, disegnano, fanno diagnosi. Non è la stessa partita."
    goals: [opinion]
  - learner: "Qui ti do ragione a metà. Molti colleghi hanno perso il posto, è vero. Ma quelli che avevano una buona educazione tecnica hanno trovato altro, e spesso meglio pagato. Il problema non erano i robot, era la scuola."
    errors: [false-friend]
  - tutor: "Una buona formazione tecnica aiuta, certo, ma non raccontiamoci favole: a cinquant'anni non si torna a scuola così facilmente. Se domani chiudessero metà degli uffici, che cosa succederebbe a tutti quegli impiegati?"
    recast: {text: "educazione tecnica", fix: "formazione tecnica", tags: [false-friend]}
  - learner: "Succederebbe quello che è successo da noi: qualche anno molto duro, poi nuove aziende. Però ammetto una cosa. Se l'Ohio avesse investito nella formazione trent'anni fa, oggi non avrebbe intere città mezze vuote."
  - tutor: "Ecco, lo vedi? Le città mezze vuote sono proprio quello che temo io. E non venirmi a dire che è stato solo un caso sfortunato."
    goals: [hypothesis]
  - learner: "No, non è stato un caso. Ti faccio un esempio concreto: la mia città, Dayton. La fabbrica di cui ti parlavo, nella quale lavoravano seimila persone, è stata chiusa nel 2008. Tutti pensavano che la città morirà. Oggi nello stesso posto c'è un centro di ricerca con duemila ingegneri."
    errors: [tense-aspect]
  - tutor: "Duemila al posto di seimila, però: i conti non tornano del tutto. E senti: \"pensavano che la città morirà\"? Il futuro visto dal passato in italiano ha una forma sua. Te la ricordi?"
    prompt: {text: "che la città morirà", tags: [tense-aspect]}
  - learner: "Pensavano che la città sarebbe morta. Il condizionale passato, giusto? E sui conti hai ragione: quattromila posti non sono mai tornati."
  - tutor: "Giusto, proprio quello. E grazie dell'onestà: è la prima volta stasera che qualcuno mi concede un numero! Allora dove ci troviamo, tu e io?"
    goals: [example]
  - learner: "A metà strada, direi. I lavori non spariscono tutti, ma non tornano da soli: ci vogliono scuole, soldi pubblici e un po' di fortuna. E tu, Riccardo? Continui a dire metà dei lavori?"
  - tutor: "Diciamo un terzo, va'. E aggiungo che senza scuole serie quel terzo diventa un guaio grosso. Per uno come me, che vede sempre nero, è già tanto!"
    goals: [conclude]
    done: true

- scenario: riunione-lavoro
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. La campagna per il cliente di Torino è quasi pronta: i testi sono stati approvati ieri e le immagini ce le consegnano domani. Siamo in linea con il piano, a meno che non succeda qualcosa all'ultimo momento."
  - tutor: "Ottimo, non era scontato con quel cliente. E il sito? Mi avevano detto che c'erano dei ritardi."
    goals: [update]
  - learner: "Ecco, il sito è il punto debole. L'agenzia che lo sviluppa ha cambiato due persone in un mese, e attualmente siamo indietro di dieci giorni. Il cliente non lo ha ancora realizzato, ma se ne accorgerà presto."
    errors: [false-friend]
  - tutor: "Dieci giorni non sono pochi. Se il cliente non se n'è ancora reso conto, meglio informarlo noi prima che lo scopra da solo. Tu che cosa proponi?"
    recast: {text: "non lo ha ancora realizzato", fix: "non se n'è ancora reso conto", tags: [false-friend]}
    goals: [problem]
  - learner: "Due cose. Primo, chiamo io il cliente oggi e gli spiego la situazione. Secondo, chiederei all'agenzia di consegnare prima le pagine principali, in modo che il cliente può vedere qualcosa già la settimana prossima."
    errors: [subjunctive-use]
  - tutor: "L'idea delle pagine principali mi piace. Occhio solo a \"in modo che\": quando indica uno scopo, il verbo dopo cambia modo. Riprovi?"
    prompt: {text: "in modo che il cliente può", tags: [subjunctive-use]}
  - learner: "In modo che il cliente possa vedere qualcosa già la settimana prossima."
  - tutor: "Esatto. E l'agenzia ce la fa, secondo te, o promette e poi sparisce di nuovo?"
  - learner: "Onestamente non lo so. Gliel'ho chiesto venerdì e mi hanno risposto \"vediamo\". Se entro mercoledì non mi danno una data, propongo di dare una parte del lavoro a un collaboratore esterno che conosco. A proposito, non c'entra niente: è vero che ci spostano al terzo piano?"
  - tutor: "Va bene, ma il collaboratore esterno lo paghiamo dal margine: teniamolo come ultima carta. Il terzo piano? Pare di sì, a marzo, ma finché non vedo le scatole non ci credo. Torniamo al sito: che scadenza diamo al cliente?"
    goals: [proposal]
  - learner: "Direi il venti del mese per le pagine principali e la fine del mese per tutto il resto. Anzi, facciamo il ventidue: preferisco promettere poco e consegnare prima. Si dice così, \"consegnare prima\", o è meglio \"in anticipo\"?"
  - tutor: "Vanno bene tutte e due; \"in anticipo\" è un filo più preciso, perché dice che arrivi prima della scadenza. Allora il 22 per le pagine principali e fine mese per il resto. Lo scrivi tu al cliente?"
  - learner: "Sì, gli scrivo subito dopo la riunione e ti metto in copia."
  - tutor: "Perfetto. Grazie, hai gestito bene una situazione scomoda. Passiamo al prossimo punto."
    goals: [deadline]
    done: true

- scenario: organizzare-matrimonio
  level: C1
  persona: en-f-student
  history: [subjunctive-form]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo piccolo e all'aperto: una sessantina di invitati, in campagna, a fine settembre. Niente di troppo formale. Vorrei che la cerimonia sia in un giardino, con la cena sotto gli alberi."
    errors: [subjunctive-form]
  - tutor: "Settembre in campagna è una scelta splendida. Mi permetta un piccolo appunto, da organizzatrice precisa: dopo \"vorrei che\" il presente non va d'accordo con il condizionale. Come lo sistema?"
    prompt: {text: "che la cerimonia sia", tags: [subjunctive-form]}
  - learner: "Vorrei che la cerimonia fosse in un giardino. Lo sbaglio sempre!"
  - tutor: "Capita a tanti, e l'ha corretto subito. Un giardino e 60 invitati, dunque. Avete già un'idea di quanto volete spendere?"
    goals: [vision]
  - learner: "Il nostro budget è di ventimila euro, tutto compreso. So che per l'Italia non è molto. La mia famiglia viene dall'Inghilterra, quindi vorremmo anche qualche tradizione nostra: per esempio, lanciare i confetti agli sposi all'uscita."
    errors: [false-friend]
  - tutor: "Con 20.000 euro e 60 persone si fa una bella festa, senza sprechi. All'uscita lanceremo i coriandoli, allora, oppure petali di rosa. Da noi i confetti sono dolci di mandorla, e arrivano alla fine!"
    recast: {text: "i confetti", fix: "i coriandoli", tags: [false-friend]}
    new: [{lemma: coriandolo, gloss: confetti (paper)}]
    goals: [budget]
  - learner: "Ah, che figura! Coriandoli, allora. E per il posto, che cosa ci propone?"
  - tutor: "Ho 2 proposte. Una villa sui colli, elegante, con un parco: 6.000 euro. Oppure un agriturismo più semplice, la cui cucina è famosa in tutta la zona: 3.500, con il vino compreso."
  - learner: "La villa è bellissima nelle foto, ma l'agriturismo mi sembra più nostro. E con la differenza potremmo pagare un buon fotografo. C'è un posto al coperto, nel caso che piove?"
    errors: [subjunctive-use]
  - tutor: "Sul fotografo ha ragione, è una spesa che non si rimpiange. Riguardi solo la domanda: dopo \"nel caso che\" il verbo esprime un'ipotesi. In che modo va?"
    prompt: {text: "nel caso che piove", tags: [subjunctive-use]}
  - learner: "Nel caso che piova. O si può dire anche \"in caso di pioggia\", più semplice?"
  - tutor: "Certo, \"in caso di pioggia\" è perfetto e molto usato. E sì, c'è un vecchio fienile sistemato per 80 persone. Allora scegliamo l'agriturismo?"
    goals: [choices]
  - learner: "Sì, a due condizioni. Voglio vedere il posto di persona prima di firmare, e voglio un preventivo scritto con tutte le voci, senza sorprese alla fine."
  - tutor: "Condizioni più che ragionevoli. Sabato mattina la accompagno all'agriturismo, e lunedì riceve il preventivo completo, voce per voce."
    goals: [conditions]
    done: true

- scenario: recensione-ristorante
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e mi dispiace dirlo, perché faccio il cuoco anch'io e so cosa significa una serata piena. Ma la cena è stata deludente, dall'inizio alla fine."
  - tutor: "La ringrazio della franchezza, e detto da un collega pesa il doppio. Mi dica esattamente che cosa non è andato."
    goals: [complain]
  - learner: "Primo, l'attesa: abbiamo aspettato cinquanta minuti per i primi, è stata un'attesa troppo larga. Secondo, il mio risotto era scotto e quello di mia moglie quasi crudo."
    errors: [false-friend]
  - tutor: "Ha ragione, un'attesa troppo lunga, e due risotti con cotture diverse sullo stesso tavolo non sono accettabili. Stasera ci manca un uomo in cucina, ma è una spiegazione, non una scusa. C'è dell'altro?"
    recast: {text: "troppo larga", fix: "troppo lunga", tags: [false-friend]}
    goals: [detail]
  - learner: "Sì. Il cameriere: quando gli ho detto del risotto, ha alzato le spalle e non me l'ha voluto cambiare. In un posto di questo livello, mi aspettavo che qualcuno viene al tavolo a chiedere scusa."
    errors: [subjunctive-use]
  - tutor: "Questo mi dispiace più del risotto, e ne parlerò con il ragazzo stasera. Solo un attimo, se permette: \"mi aspettavo che qualcuno...\"? Con un verbo al passato prima, quello dopo deve cambiare."
    prompt: {text: "che qualcuno viene", tags: [subjunctive-use]}
  - learner: "Mi aspettavo che qualcuno venisse al tavolo a chiedere scusa. Grazie, in cucina a Bologna imparo più dialetto che congiuntivi."
  - tutor: "In cucina è così ovunque, glielo assicuro! Le scuse gliele faccio io adesso, a nome di tutti. Vorrei rimediare: non le faccio pagare i 2 risotti e vi offro il dolce."
    goals: [expectation]
  - learner: "Apprezzo, ma non sono venuto per lo sconto. Se me avessero portato un piatto fatto bene, avrei pagato volentieri il doppio. Preferirei tornare un'altra sera e mangiare come si deve."
    errors: [object-pronoun]
  - tutor: "È la risposta di chi ama questo mestiere. Un dettaglio sul pronome dopo \"se\": lì parla lo spagnolo, in italiano la vocale è un'altra. Come sarebbe?"
    prompt: {text: "Se me avessero", tags: [object-pronoun]}
    new: [{lemma: pronome, gloss: pronoun}, {lemma: vocale, gloss: vowel}]
  - learner: "Se mi avessero portato un piatto fatto bene. Lo spagnolo esce sempre quando sono arrabbiato!"
  - tutor: "Succede anche ai migliori. Allora facciamo così: stasera siete miei ospiti, e la aspetto un'altra sera con sua moglie. Il risotto glielo preparo io personalmente."
  - learner: "Così va bene, accetto volentieri. E se vuole, la prossima volta le porto la ricetta del risotto di mia nonna, che lo faceva con il vino rosso."
  - tutor: "Affare fatto: una ricetta in cambio di una cena. A presto, e grazie di avercelo detto in faccia."
    goals: [resolve]
    done: true

- scenario: film-libro
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io, se nessuno si offende. Ho letto una novella di quattrocento pagine, \"Le otto montagne\". Parla di due ragazzi, uno di città e uno di montagna, e della loro amicizia lungo trent'anni."
    errors: [false-friend]
  - tutor: "Con 400 pagine è un romanzo bello e buono, altro che novella! Lo conosco di fama. Raccontaci la trama, ma senza svelare il finale, mi raccomando."
    recast: {text: "una novella", fix: "un romanzo", tags: [false-friend]}
  - learner: "Niente finale, promesso. Pietro passa le estati in un paese delle Alpi e lì conosce Bruno, che fa il pastore. Crescendo, le loro vite si separano: Pietro gira il mondo, Bruno resta. Poi il padre di Pietro muore e gli lascia un rudere in montagna, e i due lo ricostruiscono insieme."
  - tutor: "Raccontata benissimo, viene voglia di partire. E Pietro che tipo è? Simpatico, o uno di quelli che scappano sempre?"
    goals: [summary]
  - learner: "Scappa sempre, appunto. È uno che non riesce a fermarsi in nessun posto. A un certo punto lui e suo padre hanno un argomento terribile e non si parlano più per anni, e Pietro se ne pente quando è troppo tardi."
    errors: [false-friend]
  - tutor: "Ah, una lite terribile e poi il silenzio: storie così le conosciamo tutti, purtroppo. E a te Pietro è piaciuto comunque, con tutti i suoi limiti?"
    new: [{lemma: lite, gloss: quarrel}]
    recast: {text: "un argomento terribile", fix: "una lite terribile", tags: [false-friend]}
    goals: [characters]
  - learner: "Sì, proprio per i difetti. Ma il libro in generale mi è piaciuto meno di quanto pensavo. Tutti me lo avevano parlato come di un capolavoro, e invece sono rimasto un po' freddo."
    errors: [combined-pronouns]
  - tutor: "Freddo, addirittura! Poi voglio sapere perché. Prima però una cosa: si parla \"di\" un libro, quindi dopo \"me\" quel pronome non può essere \"lo\". Quale serve?"
    prompt: {text: "me lo avevano parlato", tags: [combined-pronouns]}
    new: [{lemma: pronome, gloss: pronoun}]
  - learner: "Me ne avevano parlato come di un capolavoro. E sono rimasto freddo perché la montagna è descritta benissimo, ma le donne del libro quasi non esistono: sono ombre."
  - tutor: "Giusto il pronome, e giusta anche la critica: l'ho sentita da altri lettori. Però forse è voluto: è la storia di due uomini che non sanno parlare, nemmeno tra loro."
    goals: [opinion]
  - learner: "Può essere, ma per me resta un limite. Senti, Roberto, una cosa che non c'entra: è vero che ne hanno fatto un film? Perché quasi quasi lo guardo, se è su una piattaforma."
  - tutor: "Sì, è uscito qualche anno fa, girato in Valle d'Aosta, con paesaggi magnifici. Dicono sia fedele al libro. Ma torniamo a noi: a chi lo consiglieresti?"
  - learner: "A chi ama la montagna e i libri lenti, dove succede poco e si pensa molto. A mio cugino, che legge solo gialli, non lo darei mai."
  - tutor: "Montagna e lentezza: allora il prossimo mese lo leggo io, e ti dico se resto freddo. Grazie, bel racconto. Chi continua?"
    goals: [recommend]
    done: true

- scenario: burocrazia-residenza
  level: C1
  persona: en-m-traveller
  history: [register]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Mi sono trasferito a Bologna tre mesi fa e vorrei chiedere la residenza. Ho già guardato sul sito del Comune, ma sinceramente non ho capito da dove cominciare."
  - tutor: "Nessun problema, è per questo che siamo qui. Lei è cittadino irlandese, vedo: allora la procedura è quella per i cittadini europei. Ha con sé un documento e il contratto di affitto?"
    goals: [request]
  - learner: "Ho il passaporto e il contratto, registrato. Ho portato anche una utility bill a mio nome, nel caso servisse. Di quali altri documenti c'è bisogno?"
    errors: [word-choice]
  - tutor: "La bolletta non serve, ma ha fatto bene a portarla. Servono invece il codice fiscale, una prova che lavora e l'assicurazione sanitaria. Poi c'è questo modulo."
    new: [{lemma: bolletta, gloss: utility bill}]
    recast: {text: "utility bill", fix: "bolletta", tags: [word-choice]}
    goals: [documents]
  - learner: "Il codice fiscale ce l'ho, e ho il contratto di lavoro. E questo modulo, va compilare adesso o posso portarlo a casa?"
    errors: [passive]
  - tutor: "Può fare come preferisce. Guardi però la forma: dopo \"va\", in questa costruzione passiva, il verbo non resta all'infinito. Che cosa ci mette?"
    prompt: {text: "va compilare", tags: [passive]}
    new: [{lemma: infinito, gloss: infinitive}, {lemma: passivo, gloss: passive}]
  - learner: "Va compilato adesso? Ecco. Comunque lo compilo qui, così sono sicuro di non sbagliare."
  - tutor: "Giusto così. Si accomodi pure a quel tavolo. Manca ancora l'assicurazione sanitaria, però: ce l'ha?"
  - learner: "Ecco il problema. Ho la tessera europea, ma è scaduta il mese scorso e quella nuova non è ancora arrivata dall'Irlanda. Finché non arriva, non posso fare niente?"
  - tutor: "Può presentare la domanda oggi lo stesso, e portare la tessera entro 30 giorni. Con un contratto di lavoro regolare, poi, basta l'iscrizione al servizio sanitario."
    goals: [problem]
  - learner: "Meno male. Scusi lo sfogo, ma tra codice fiscale, questura e Comune ho passato più tempo in fila che al lavoro. Non pensavo che fosse così complicato vivere qui. A volte mi chiedo se ne vale la pena."
  - tutor: "La capisco, le file non piacciono nemmeno a noi che stiamo da questa parte. Ma il più è fatto, glielo assicuro: dopo la residenza tutto diventa più semplice. E il suo italiano la aiuterà molto."
  - learner: "Grazie, sei molto gentile. Allora, dopo che consegno il modulo, cosa succede?"
    errors: [register]
  - tutor: "Si figuri. Prima di rispondere, però: \"sei gentile\"? Allo sportello, tra noi due, quale forma si aspetterebbe?"
    prompt: {text: "sei molto gentile", tags: [register]}
  - learner: "Mi scusi, ha ragione: lei è molto gentile. Dopo che consegno il modulo, cosa succede?"
  - tutor: "Così va bene. Entro 2 giorni la residenza risulta registrata, e nelle settimane seguenti passano i vigili a casa sua per un controllo. Se non la trovano, lasciano un avviso e tornano: metta il nome sul campanello, mi raccomando!"
    goals: [next]
    done: true

- scenario: colloquio-lavoro
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, grazie. Mi chiamo Lucía Romero, sono di Siviglia e vivo a Bologna da quattro anni. Ho studiato disegno industriale e sto finendo un master in comunicazione visiva. Quando finisca il master, a giugno, vorrei restare a lavorare in Italia."
    errors: [subjunctive-use]
  - tutor: "Piacere, e complimenti per il percorso. Una cosa sola, prima di proseguire: dopo \"quando\", per un fatto futuro, l'italiano non segue lo spagnolo. Che tempo metterebbe?"
    prompt: {text: "Quando finisca", tags: [subjunctive-use]}
  - learner: "Quando finirò il master, a giugno. È vero, in spagnolo lì va il congiuntivo."
  - tutor: "Esatto, da noi basta il futuro. Veniamo all'esperienza: vedo dal curriculum che ha già lavorato. Dove, e con quale ruolo?"
    goals: [intro]
  - learner: "Per due anni ho lavorato in una piccola officina di design a Siviglia, dove eravamo in cinque. Mi occupavo dell'immagine di aziende locali: logo, confezioni, sito. Qui a Bologna ho collaborato con una casa editrice per le copertine."
    errors: [false-friend]
  - tutor: "Uno studio di design con 5 persone è un'ottima scuola: si impara a fare tutto. E tra questi lavori, ce n'è uno che la rappresenta più degli altri?"
    recast: {text: "officina di design", fix: "studio di design", tags: [false-friend]}
  - learner: "Sì, le confezioni per un produttore di olio di Jaén. È il progetto nel quale sono più orgogliosa: abbiamo ridotto la plastica della metà e le vendite sono salite del trenta per cento."
    errors: [relative-pronoun]
  - tutor: "Meno plastica e più vendite: un risultato che parla da solo. Guardi però il relativo: \"orgogliosa\" regge un'altra preposizione. Come cambia, allora, \"nel quale\"?"
    prompt: {text: "nel quale sono più orgogliosa", tags: [relative-pronoun]}
    new: [{lemma: relativo, gloss: relative pronoun}, {lemma: preposizione, gloss: preposition}]
    goals: [experience]
  - learner: "Il progetto di cui sono più orgogliosa. O \"del quale\", immagino?"
  - tutor: "Vanno bene entrambi; \"del quale\" è solo un po' più formale. Mi dica ora dei suoi punti di forza, e anche di un difetto, se ne ha uno!"
  - learner: "Sono precisa e so ascoltare i clienti, anche quando non sanno cosa vogliono. Il difetto: faccio fatica a delegare. Preferisco rifare un lavoro tre volte piuttosto che darlo a qualcuno e trovarlo fatto male. Ci sto lavorando."
  - tutor: "Un difetto che in uno studio piccolo si paga caro, ma almeno lo riconosce. E perché proprio noi? Di studi a Bologna ce ne sono tanti."
    goals: [strengths]
  - learner: "Perché lavorate con artigiani e piccole aziende, non con le multinazionali. Ho visto il vostro progetto per il caseificio di Parma e ho pensato: ecco gente che fa quello che voglio fare io. E poi, sinceramente, mi piace che siate in dodici e non in duecento."
  - tutor: "Il caseificio è stato un bel lavoro, mi fa piacere che l'abbia notato. Ha qualche domanda per noi?"
    goals: [why]
  - learner: "Una sola: chi entra adesso seguirebbe subito i propri clienti, o lavorerebbe all'inizio accanto a qualcuno con più esperienza?"
  - tutor: "I primi 3 mesi accanto a un collega esperto, poi clienti suoi. Così, tra l'altro, si allena a delegare! Le faremo sapere entro la settimana."
    goals: [questions]
    done: true

- scenario: modi-di-dire
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Una giornata da dimenticare. Dovevo consegnare la tesi in segreteria entro mezzogiorno. Pensavo: è un pezzo di torta, stampo e porto. Invece la stampante della biblioteca si è rotta a pagina quaranta."
    errors: [word-choice]
  - tutor: "Altro che una passeggiata, allora! Le stampanti sentono la paura, lo sai. E a quel punto che hai fatto, sei corsa in copisteria?"
    recast: {text: "un pezzo di torta", fix: "una passeggiata", tags: [word-choice]}
    new: [{lemma: copisteria, gloss: copy shop}]
  - learner: "Esatto, di corsa sotto la pioggia. La copisteria mi ha chiesto sessanta euro per stamparla e rilegarla in un'ora: costa un occhio della testa, ma non avevo scelta. Quando sono arrivata in segreteria, l'impiegata è già andata a pranzo."
    errors: [tense-aspect]
  - tutor: "60 euro, un furto! Aspetta però, fammi capire i tempi: l'impiegata esce prima o dopo il tuo arrivo? Se esce prima, il verbo deve fare un passo indietro."
    prompt: {text: "è già andata", tags: [tense-aspect]}
  - learner: "Prima, purtroppo: quando sono arrivata, era già andata a pranzo. Erano le dodici e quattro minuti."
  - tutor: "Per 4 minuti! Oltre al danno, la beffa. E l'hai aspettata lì davanti, immagino, bagnata come un pulcino."
    goals: [tell]
  - learner: "Bagnata come un pulcino, sì! Questa la conosco. Ho aspettato un'ora seduta per terra. E quando è tornata mi ha detto che la scadenza era stata spostata a venerdì: avevano mandato una mail la settimana scorsa. Sono rimasta di pietra."
    errors: [word-choice]
  - tutor: "Ci credo che sei rimasta di sasso! Tutta quella corsa per niente. Ma scusa, la mail non l'avevi vista? Di chi è la colpa, a questo punto?"
    recast: {text: "rimasta di pietra", fix: "rimasta di sasso", tags: [word-choice]}
    goals: [react]
  - learner: "Mah, un po' di tutti. La segreteria manda cento mail al giorno e nessuno le legge più. Però se la leggevo, mi risparmiavo sessanta euro e una polmonite. Diciamo sessanta per cento colpa mia, quaranta loro."
  - tutor: "Mi sembra una divisione onesta, anche se io alla stampante darei almeno un 10%. E da tutto questo che lezione ti porti a casa?"
    goals: [blame]
  - learner: "Che la fretta è una cattiva consigliera, e che le mail vanno lette. Si dice così, no? \"La fretta è cattiva consigliera\"?"
  - tutor: "Si dice proprio così, parola per parola. E aggiungo: chi ha tempo non aspetti tempo. La prossima tesi stampala una settimana prima!"
  - learner: "La prossima? Per carità, una basta e avanza. Dai, ordiniamo, che offro io: tanto ormai sessanta euro in più o in meno..."
  - tutor: "Così mi piaci: abbiamo fatto trenta, facciamo trentuno. Brindiamo a te, e a quella macchina, che riposi in pace!"
    goals: [moral]
    done: true

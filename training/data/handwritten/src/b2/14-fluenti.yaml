# Fluent B2 learners: six dialogues with no learner errors (the tutor never corrects and only
# engages with the content), then six with exactly one subtle slip late in the conversation.

- scenario: film-libro
  level: B2
  persona: en-f-professional
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio volentieri io. Ho letto «Il barone rampante» di Calvino, e mi è piaciuto da morire. Nel Settecento, in Liguria, un ragazzo di dodici anni litiga con il padre per un piatto di lumache, sale su un albero e giura che non scenderà mai più. Non vi dico se mantiene la promessa!"
  - tutor: "Che bella scelta, è uno dei libri che amo di più! E hai fatto bene a non dire come finisce. Ma che tipo è, secondo te, questo ragazzo che vive sugli alberi?"
    goals: [summary]
  - learner: "Cosimo è testardo come un mulo, ma non è un ribelle qualsiasi. Benché viva lontano da tutti, non smette mai di occuparsi degli altri: legge, studia, aiuta i contadini, si innamora perfino. È come se avesse bisogno di distanza per vedere meglio il mondo."
  - tutor: "«Distanza per vedere meglio il mondo»: l'hai detto meglio di tanti critici! Io da ragazzo lo vedevo solo come uno che scappa. E tu, alla fine, da che parte stai: con lui o con la famiglia?"
    goals: [characters]
  - learner: "Sto dalla sua parte, anche se capisco il padre. Credo che Calvino voglia dirci che si può partecipare alla vita senza accettarne tutte le regole. Se l'avessi letto a vent'anni, forse avrei avuto il coraggio di fare scelte meno prudenti."
  - tutor: "Addirittura! Allora è un libro che fa pensare anche alla propria vita, non solo a quella del personaggio. C'è qualcosa, invece, che non ti ha convinta?"
    goals: [opinion]
  - learner: "A essere sincera, la parte centrale va un po' per le lunghe: ci sono episodi che sembrano messi lì per caso. Però il finale mi ha ripagata di tutto, e ho chiuso il libro con il magone."
  - tutor: "Sono d'accordo, a metà il romanzo perde un po' di forza. Ma quel finale resta in testa per anni. A chi lo consiglieresti, allora?"
  - learner: "Lo consiglierei a chiunque si senta un po' fuori posto, e soprattutto ai ragazzi, purché non glielo impongano a scuola. I libri obbligatori, si sa, finiamo per odiarli tutti."
  - tutor: "Parole sante: a scuola me ne hanno fatti odiare parecchi. Grazie, ci hai fatto venire voglia di leggerlo di nuovo. Il mese prossimo, se vuoi, scegli tu il romanzo per tutti."
    goals: [recommend]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che la fai troppo facile. Io faccio l'idraulico da quindici anni, e ti assicuro che non esistono due bagni uguali. Credo che l'automazione arrivi prima negli uffici che nei cantieri: il rischio più grosso lo corre chi lavora davanti a uno schermo."
  - tutor: "Questa non me l'aspettavo: di solito si dice il contrario! Però un tubo è un tubo. Non credi che prima o poi una macchina imparerà a cambiarlo?"
    goals: [opinion]
  - learner: "Magari fosse così semplice! Se una macchina dovesse entrare in una casa del centro di Genova, con i muri storti e i tubi di cent'anni fa, si arrenderebbe dopo cinque minuti. E anche se ci riuscisse, costerebbe talmente tanto che nessuno la comprerebbe."
  - tutor: "Va bene, sulle case vecchie hai vinto tu. Ma io resto preoccupato per chi lavora in ufficio, come dicevi prima. Conosci qualcuno a cui sta già succedendo davvero?"
    goals: [hypothesis]
  - learner: "Purtroppo sì. Mia cugina lavorava in uno studio di commercialisti: l'anno scorso hanno comprato un programma che fa in un'ora quello che lei faceva in una settimana. Nel giro di sei mesi, di cinque impiegati ne sono rimasti due."
  - tutor: "Ecco, vedi che allora non esagero poi tanto! Tre persone a casa in sei mesi sono tante. E tua cugina adesso che cosa fa?"
    goals: [example]
  - learner: "Si è rimboccata le maniche: ha fatto un corso di formazione e adesso insegna proprio a usare quei programmi. Dice che, se fosse rimasta ad aspettare, sarebbe ancora a casa."
  - tutor: "Brava lei, non è da tutti ricominciare così. Mi sa che la tecnologia fa meno paura a chi non resta fermo."
  - learner: "Appunto. Per tirare le somme: secondo me i lavori non spariranno, ma cambieranno pelle, e chi non si aggiorna rischia grosso. Più che di disoccupazione, parlerei di formazione. E tu, dopo tutto questo, la pensi ancora come prima?"
  - tutor: "Un po' meno, lo ammetto. Resto convinto che molti soffriranno, ma mi hai fatto vedere il rischio in un altro modo. E comunque, quando mi si rompe un tubo, so chi chiamare!"
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: en-m-heritage
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno, e grazie dell'invito. L'ho scelta per un violino, pensi un po'. Mio nonno, che era emigrato da Cremona a Chicago, suonava ogni domenica, e io sono cresciuto con quel suono in casa. Dopo che è mancato, ho deciso di venire a imparare il mestiere di liutaio proprio dove era nato lui."
  - tutor: "Che storia: un violino che riporta a casa il nipote! Immagino però che gli inizi non siano stati facili. Qual è stata la difficoltà più grande?"
    goals: [story]
    new: [{lemma: violino, gloss: violin}]
  - learner: "Più della burocrazia, che pure mi ha fatto sudare sette camicie, mi ha pesato il silenzio della bottega. Il mio maestro parlava pochissimo e io credevo che ce l'avesse con me. Solo dopo mesi ho capito che, per lui, lasciarmi sbagliare era una forma di rispetto."
  - tutor: "È un'idea bellissima, lasciar sbagliare per rispetto. Anche molti nostri nonni insegnavano così, con poche parole. E Lei, in questi anni, in che cosa si sente cambiato?"
    goals: [difficulties]
  - learner: "Sono diventato più paziente, cosa che a Chicago nessuno avrebbe creduto possibile. Prima volevo tutto e subito; qui ho imparato che un violino ha bisogno di mesi, e un'amicizia di anni. Se non mi fossi trasferito, credo che starei ancora correndo senza sapere dove."
  - tutor: "«Correre senza sapere dove»: credo che molti ascoltatori si riconoscano in queste parole. E la nostalgia, le capita mai di sentirla?"
    goals: [change]
  - learner: "Certo, soprattutto a novembre, quando la nebbia non se ne va per giorni e mi manca la mia famiglia. Però è una nostalgia strana: quando torno in America, dopo una settimana mi mancano il mercato del sabato e perfino la nebbia!"
  - tutor: "Allora è proprio diventato uno di noi: solo chi vive qui può avere nostalgia della nebbia! Per chiudere, che consiglio darebbe a chi sogna di trasferirsi in Italia?"
    new: [{lemma: nebbia, gloss: fog}]
  - learner: "Gli direi di non venire in vacanza, ma a vivere: di scegliere una città piccola, imparare la lingua sul serio e accettare di sentirsi stupido per un po'. E soprattutto di non aspettare che tutto sia perfetto, perché non lo sarà mai."
  - tutor: "Parole semplici e vere, grazie. Le auguro tanti violini e tante domeniche di musica, come quelle di suo nonno. E grazie a voi che ci avete ascoltato."
    goals: [advice]
    new: [{lemma: violino, gloss: violin}]

- scenario: arte-mostra
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi mette una pace incredibile, e non me l'aspettavo. A prima vista sembra che non ci sia quasi niente, eppure non riesco a staccare gli occhi."
  - tutor: "Succede a tanti: si entra pensando che sia poca cosa e poi si resta dieci minuti. Prova a raccontarmi che cosa vedi, come se io avessi gli occhi chiusi."
    goals: [react]
  - learner: "Vedo cinque o sei bottiglie e una scatola, strette l'una all'altra su un tavolo, come se avessero freddo. I colori sono tutti spenti: grigi, bianchi sporchi, un rosa che sembra polvere. La luce arriva da sinistra, ma è così morbida che le ombre quasi non si vedono."
  - tutor: "«Come se avessero freddo»: questa te la rubo per la prossima lezione! Pensa che questo pittore ha passato la vita a Bologna, davanti alle stesse bottiglie. Secondo te, che cosa cercava?"
    goals: [describe]
  - learner: "Non credo che gli interessassero le bottiglie in sé. Penso che volesse dimostrare che basta spostare un oggetto di un centimetro perché cambi tutto. Forse è un modo di dire che il mondo è già tutto lì, sul tavolo di casa, purché uno abbia la pazienza di guardarlo."
  - tutor: "Sono d'accordo, e aggiungo una cosa: per me c'è anche molto silenzio, quasi una preghiera. Ti viene in mente un altro pittore, magari molto diverso, da mettere a confronto con lui?"
    goals: [interpret]
  - learner: "Mi viene in mente Caravaggio, che abbiamo visto a Roma il mese scorso. Anche lì la luce è protagonista, ma è l'opposto: in Caravaggio la luce grida, qui parla sottovoce. Se dovessi appendere uno dei due in camera mia, sceglierei questo senza pensarci due volte."
  - tutor: "La luce che grida e quella che parla piano: non avrei saputo dirlo meglio. Anch'io in camera vorrei queste bottiglie, con Caravaggio non si dorme! Vieni, nella prossima sala ci sono altre tre opere sue."
    goals: [compare]

- scenario: smartworking
  level: B2
  persona: en-f-student
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Né l'una né l'altra cosa, in realtà. Da gennaio ho affittato una scrivania in uno spazio condiviso a due passi da casa, perché in cucina non riuscivo più a concentrarmi. L'azienda è a Dublino, quindi un ufficio vero non ce l'ho mai avuto."
  - tutor: "Ah, quindi ti sei fatta un ufficio su misura! Io pensavo che lavorare in pigiama fosse il sogno di tutti. Che cosa ci guadagni, pagando una scrivania di tasca tua?"
    goals: [situation]
    new: [{lemma: pigiama, gloss: pyjamas}, {lemma: scrivania, gloss: desk}]
  - learner: "Ci guadagno la testa, prima di tutto. Uscire di casa la mattina mi dà un ritmo, e l'orario resta flessibile: se voglio andare in piscina alle undici, nessuno mi dice niente. E poi ho conosciuto gente che fa lavori lontanissimi dal mio, il che è molto più stimolante che parlare sempre con gli stessi colleghi."
  - tutor: "Detta così sembra perfetto, e mi fai quasi invidia. Io in ufficio vedo le solite dieci facce da otto anni! Ma un lato negativo ci sarà pure."
    goals: [pros]
  - learner: "Eccome. Il vero svantaggio è che per i miei colleghi sono solo una faccina su uno schermo. Temo che, quando si tratterà di scegliere chi promuovere, si ricordino di chi vedono tutti i giorni alla macchinetta del caffè. E a fine mese quei duecento euro si fanno sentire."
  - tutor: "Su questo purtroppo hai ragione: da noi fa carriera chi pranza con il capo. Se potessi scegliere senza pensare ai soldi, come vorresti lavorare?"
    goals: [cons]
  - learner: "Se dipendesse da me, vorrei un ufficio vero, ma solo due giorni alla settimana, e gli altri tre dove mi pare. Stare sempre insieme mi toglierebbe la libertà, però vedersi ogni tanto di persona è il modo migliore per fidarsi gli uni degli altri."
  - tutor: "Due giorni insieme e tre liberi: firmerei subito anch'io. Mi sa che domani ne parlo al mio capo, male che vada mi dice di no. Intanto, alla salute della tua scrivania!"
    goals: [preference]
    new: [{lemma: scrivania, gloss: desk}]

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-teacher
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco che la cosa la preoccupi, ma io sono favorevole, e non per sentito dire. Ho vissuto dieci anni in una città spagnola che ha chiuso il centro alle auto, e oggi nessuno tornerebbe indietro."
  - tutor: "Interessante, ma la Spagna non è l'Italia. Qui la gente è abituata a lasciare la macchina davanti al negozio. Che cosa le fa pensare che da noi funzionerebbe?"
    goals: [position]
  - learner: "Due cose soprattutto. La prima è che chi cammina si ferma a guardare le vetrine, mentre chi guida pensa solo a trovare parcheggio: nella mia città le vendite sono salite, altro che disastro. La seconda è l'inquinamento: non mi pare giusto che i residenti respirino lo smog di chi attraversa il centro solo per fare prima."
  - tutor: "Sull'inquinamento non ha tutti i torti, lo ammetto. Ma pensi agli anziani e a chi cammina con difficoltà. Come arrivano in centro, se i mezzi pubblici passano ogni mezz'ora?"
    goals: [argue]
  - learner: "È un'obiezione seria, e non la prendo alla leggera. Tuttavia nessuno propone di alzare un muro: basterebbe che i residenti, i taxi e chi ha un permesso per disabili potessero entrare comunque. Quanto ai mezzi pubblici, è proprio il traffico che li rallenta; senza auto in mezzo, passerebbero più spesso."
  - tutor: "Messa così è già più ragionevole. Resta il fatto che i commercianti hanno paura, e li capisco. Se sbagliamo, a chiudere sono loro e non noi."
    goals: [counter]
  - learner: "Su questo le do ragione: il rischio lo corrono loro, e sarebbe ingiusto ignorarlo. Proporrei allora una prova di sei mesi, solo il sabato e la domenica, con un parcheggio gratuito appena fuori dalla zona pedonale. Se alla fine le vendite fossero calate, sarei la prima a chiedere di tornare indietro."
  - tutor: "Una prova di sei mesi, con i numeri in mano alla fine: questa proposta la posso accettare. Anzi, la presentiamo insieme al Comune, così ci ascoltano di più. Grazie, è stato un piacere discutere con Lei."
    goals: [concede]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-professional
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, e preferisco essere diretta. La settimana scorsa ho ricevuto un'offerta da un'altra azienda. Non sono qui per fare pressione: vorrei restare, ma prima di rispondere ci tenevo a parlarne con Lei."
  - tutor: "La ringrazio di avermelo detto subito, non è da tutti. Mi dispiacerebbe molto perderla. Prima di parlare dell'offerta, però, mi dica: come giudica il suo ultimo anno qui?"
  - learner: "Direi che è stato l'anno migliore da quando sono arrivata. Ho aperto il mercato tedesco partendo da zero, e oggi vale un quinto dei nostri ordini. In più ho formato due colleghi giovani, che ormai lavorano da soli."
  - tutor: "I numeri li conosco, e sono risultati che parlano da soli. Immagino quindi che non sia venuta solo per informarmi. Che cosa mi chiede, di preciso?"
    goals: [results]
  - learner: "Le chiedo la promozione a responsabile dell'area estero, con un aumento adeguato. Non vorrei che sembrasse un ricatto: credo semplicemente di meritarla, e l'avrei chiesta comunque a dicembre."
  - tutor: "Sul fatto che la meriti sono d'accordo con Lei. Il problema è che il budget di quest'anno è già chiuso, e un posto così va approvato dalla direzione. Temo che prima di gennaio non si possa fare nulla."
    goals: [request]
  - learner: "Capisco che i conti siano chiusi, ma l'altra azienda aspetta una risposta entro venerdì. Se l'aumento dovesse slittare a gennaio, mi basterebbe avere già adesso il nuovo ruolo, messo per iscritto. E tu cosa ne pensi, sarebbe possibile?"
    errors: [register]
  - tutor: "L'idea mi sembra ragionevole. Però mi scusi un attimo: «tu cosa ne pensi»? Qui in ufficio, tra noi due, di solito ci parliamo in un altro modo."
    goals: [handle]
    prompt: {text: "tu cosa ne pensi", tags: [register]}
  - learner: "Ha ragione, mi è scappato: Lei cosa ne pensa? Se fosse d'accordo, potremmo sentire la direzione già domani."
  - tutor: "Nessun problema, succede. Credo che sia una buona soluzione: domani mattina sento la direzione e giovedì le do una risposta scritta. Intanto non firmi nulla con gli altri, mi raccomando!"
    goals: [next-steps]

- scenario: medico-specialista
  level: B2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Nel complesso bene, tanto che quasi non sarei venuto. L'unica cosa è che in salita mi manca un po' il fiato e sento il battito nelle orecchie; appena mi fermo, però, passa tutto nel giro di un minuto."
  - tutor: "Ha fatto bene a venire, invece. Un po' di affaticamento in salita alla sua età è normale, ma è giusto parlarne. Nella sua famiglia qualcuno ha avuto problemi di cuore?"
    goals: [symptoms]
  - learner: "Purtroppo sì. Mio padre ha avuto un infarto a sessant'anni, benché non avesse mai fumato in vita sua. Mia madre invece è arrivata a novantadue anni senza prendere una medicina, quindi spero di aver preso da lei!"
  - tutor: "Glielo auguro di cuore, 92 anni sono una bella età! Comunque l'infarto di suo padre è un dato che teniamo presente. Voleva chiedermi qualcosa sugli esami?"
    goals: [history]
    new: [{lemma: infarto, gloss: heart attack}]
  - learner: "Sì, e le confesso che c'è un motivo preciso. A maggio vorrei fare a piedi un pezzo della Via Francigena, da Siena a Roma: una ventina di chilometri al giorno per due settimane. Che cosa dicono gli esami? Pensa che il mio cuore possa reggere uno sforzo del genere?"
  - tutor: "Che bel progetto, l'ho fatto anch'io qualche anno fa! Gli esami sono buoni: il cuore lavora bene anche sotto sforzo. Solo la pressione è un po' alta, e prima di partire va messa a posto. Per questo le proporrei una terapia leggera."
    goals: [understand]
  - learner: "Meno male, mi toglie un peso. E questa terapia in che cosa consisterebbe? Glielo chiedo perché la mia sorella prende da anni una pastiglia per la pressione e si lamenta che le gonfia le caviglie."
    errors: [article-use]
  - tutor: "È una sola pastiglia al mattino, niente di pesante. Un momento, però: «la mia sorella»? Con una persona di famiglia, lì c'è una parola di troppo."
    prompt: {text: "la mia sorella", tags: [article-use]}
    new: [{lemma: pastiglia, gloss: pill}]
  - learner: "Giusto: mia sorella. E a me potrebbe dare quel problema, o altri effetti collaterali?"
  - tutor: "Esatto. Sua sorella prende probabilmente un'altra medicina. Con questa, al massimo, si può avere un po' di tosse nei primi giorni. Cominci domani, e tra un mese facciamo un controllo. Poi buon cammino verso Roma!"
    goals: [treatment]
    new: [{lemma: tosse, gloss: cough}]

- scenario: trattativa-affitto
  level: B2
  persona: es-m-worker
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, e a mia moglie ancora di più: è il primo in cui si è immaginata con i bambini. C'è però una cosa che non mi lascia tranquillo. Nella bozza che mi ha mandato c'è una clausola secondo cui il proprietario può riprendersi la casa dopo due anni."
  - tutor: "Vedo che ha letto tutto con attenzione, e fa bene. Il proprietario ha un figlio che studia a Londra e che forse tornerà: per questo ha voluto quella clausola. Per voi due anni sarebbero pochi?"
    goals: [interest]
  - learner: "Pochissimi. Facciamo venire i bambini dalla Spagna e li iscriviamo a scuola qui: non posso rischiare che fra due anni debbano cambiare tutto di nuovo. Se il proprietario togliesse quella clausola, sarei disposto a non discutere il canone, sebbene 950 euro non siano pochi per questa zona."
  - tutor: "È una proposta intelligente: al proprietario interessa più una famiglia seria che 50 euro in più. Gliene parlo volentieri. Che durata avrebbe in mente, allora?"
    goals: [negotiate]
  - learner: "Il classico quattro più quattro, con la cedolare secca, così il canone resta fermo. E vorrei che la disdetta da parte mia fosse di tre mesi invece di sei: qualora la mia azienda mi trasferisse, sei mesi di affitto a vuoto sarebbero un bel problema."
  - tutor: "Sul quattro più quattro non vedo problemi. Tre mesi di disdetta sono pochi, ma con una lettera della sua azienda credo che si possa fare. Se il proprietario accetta tutto, lei firmerebbe già questa settimana?"
    goals: [conditions]
  - learner: "Volentieri, anche domani. Però dipende di una cosa sola: voglio vedere quella clausola cancellata nero su bianco prima di versare la garanzia."
    errors: [preposition]
  - tutor: "Mi sembra giusto. Mi ripeta solo l'inizio: «dipende di una cosa»? Dopo «dipendere» ci vuole un'altra piccola parola."
    prompt: {text: "dipende di una cosa", tags: [preposition]}
  - learner: "Ah, certo: dipende da una cosa sola. Se la clausola sparisce, siamo d'accordo su tutto."
  - tutor: "Perfetto. Chiamo il proprietario oggi e domani le mando il contratto nuovo, senza quella clausola. Se va tutto bene, giovedì firmiamo qui in agenzia. Sua moglie sarà contenta!"
    goals: [conclude]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-student
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Glielo dico subito: lo immaginiamo in due modi diversi, ed è per questo che sono qui. Io vorrei una cerimonia raccolta, una cinquantina di invitati al massimo. La famiglia del mio fidanzato, che è di Napoli, dà per scontato che saremo almeno in duecento."
  - tutor: "Ah, un grande classico! Le assicuro che non siete i primi, e di solito una via di mezzo si trova. E il suo fidanzato da che parte sta?"
    goals: [vision]
  - learner: "Sta in mezzo, poverino. Mi dà ragione quando siamo soli, ma non vuole che sua madre ci rimanga male. Io penso che si possa accontentare tutti, a patto che la festa non diventi uno spettacolo."
  - tutor: "Mi sembra un buon punto di partenza. Si potrebbe fare una cerimonia per pochi e poi una festa più grande la sera. Prima però devo chiederle del budget: su che cifra pensavate di stare?"
  - learner: "Avevamo pensato a trentamila euro, tutto compreso. I miei genitori vorrebbero contribuire, ma preferirei che la cifra non salisse: non mi va di cominciare la vita insieme con dei debiti."
  - tutor: "Con 30.000 euro si può fare molto, anche per tanti invitati. Ho in mente due posti. Uno è una villa elegante sul mare a Sorrento, per 80 persone al massimo. L'altro è una fattoria vicino a Caserta, più semplice, dove ne entrano 200. Quale la convince di più?"
    goals: [budget]
    new: [{lemma: fattoria, gloss: farm}]
  - learner: "Il cuore mi direbbe la villa, ma se scegliessi quella dovrei lasciare fuori mezza famiglia di lui, e non me lo perdonerebbero mai. Scelgo la fattoria: preferisco un posto semplice pieno di gente contenta a un posto elegante pieno di musi lunghi."
  - tutor: "Ottima scelta, e detta benissimo! La fattoria ha un giardino dove si può fare la cerimonia per pochi, prima della festa. Le preparo un preventivo: c'è qualcosa a cui tiene in modo particolare?"
    goals: [choices]
    new: [{lemma: fattoria, gloss: farm}]
  - learner: "Sì, ho due condizioni. Voglio che ogni spesa sopra i 500 euro passi da me prima di essere confermata. E poi il menù: ci abbiamo parlato a lungo ieri sera, e vorremmo che fosse scelto da noi due, non dalle famiglie."
    errors: [ci-ne]
  - tutor: "Sono due richieste chiare, e le rispetterò. Solo una cosa: «ci abbiamo parlato a lungo»? Quando si discute di un argomento, lì ci vuole un'altra piccola parola."
    goals: [conditions]
    prompt: {text: "ci abbiamo parlato", tags: [ci-ne]}
  - learner: "Ha ragione: ne abbiamo parlato a lungo. E siamo d'accordo, il menù lo decidiamo noi."
  - tutor: "Esatto. Allora siamo d'accordo: le spese grandi passano da lei, e il menù resta a voi due. Entro venerdì le mando il preventivo completo. Vedrà che anche la madre del suo fidanzato sarà contenta!"

- scenario: riunione-lavoro
  level: B2
  persona: en-m-traveller
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "A due velocità, direi. Il video per la fabbrica di ceramiche è girato tutto, e le immagini sono venute meglio di quanto sperassi. Il montaggio invece è fermo a metà, e non per colpa nostra."
  - tutor: "Che le immagini siano belle mi fa piacere, ci tenevo molto. Ma quel «non per colpa nostra» mi preoccupa un po'. Che cosa è successo?"
    goals: [update]
  - learner: "È successo che il cliente cambia idea ogni due giorni. Lunedì voleva un video di tre minuti, mercoledì di uno solo, e ieri mi ha scritto il figlio del proprietario per chiedere una musica diversa. Finché non si mettono d'accordo tra loro, qualunque cosa io faccia è lavoro buttato."
  - tutor: "Li conosco, in quella famiglia comanda uno diverso ogni giorno! Hai ragione, così non si può andare avanti. Tu come ne usciresti?"
    goals: [problem]
  - learner: "Io chiederei due cose. Primo, che scelgano una sola persona che parli con noi, chiunque sia. Secondo, manderei loro una versione breve da approvare per iscritto: se dopo la firma vogliono altre modifiche, le pagano a parte. Altrimenti temo che andremo avanti così fino a Natale."
  - tutor: "Mi piace, soprattutto l'idea della firma: quando c'è da pagare, la gente decide in fretta. Li chiamo io oggi, così a te resta il lavoro bello. Se domani abbiamo un solo nome, quando riesci a chiudere?"
    goals: [proposal]
  - learner: "Se domani mi danno il via, penso a consegnare la versione breve entro giovedì prossimo, e quella completa una settimana dopo."
    errors: [preposition]
  - tutor: "Giovedì mi andrebbe benissimo. Aspetta, però: «penso a consegnare»? Quando è una cosa che hai in programma di fare, dopo «penso» ci va un'altra piccola parola."
    prompt: {text: "penso a consegnare", tags: [preposition]}
  - learner: "Giusto: penso di consegnare la versione breve entro giovedì prossimo."
  - tutor: "Perfetto, allora segno giovedì per la versione breve e il giovedì dopo per quella completa. Se il cliente cambia idea di nuovo, me lo dici subito e ci parlo io. Buon lavoro!"
    goals: [deadline]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, e grazie di avermi ricevuta. Mi chiamo Lucía, ho ventiquattro anni e mi sono laureata in design a Valencia. L'anno scorso sono venuta a Milano con l'Erasmus e, come vede, non me ne sono più andata."
  - tutor: "Milano fa questo effetto a molti, è successo anche a me! Ho letto il suo curriculum con interesse. Mi racconti della sua esperienza più importante finora."
    goals: [intro]
  - learner: "Sono cresciuta nella tipografia dei miei genitori, quindi la carta la conosco da quando ero bambina. Ma l'esperienza che conta di più è recente: per la tesi ho progettato, insieme a una piccola azienda che produce olio, una confezione senza plastica. All'inizio nessuno ci credeva; oggi è in vendita in trenta negozi."
  - tutor: "Trenta negozi per un progetto di tesi non sono pochi, davvero. E si vede che conosce il lavoro dal lato pratico, cosa rara. Quali sono, secondo lei, i suoi punti di forza?"
    goals: [experience]
  - learner: "Direi la testardaggine, nel senso buono: se un'idea non funziona, la rifaccio finché non funziona. E so ascoltare i clienti, perché in tipografia ho imparato che spesso non sanno spiegare quello che vogliono. Il mio punto debole, invece, è che faccio fatica a delegare: tendo a voler controllare tutto io."
  - tutor: "Apprezzo che lo dica con tanta chiarezza. In una squadra piccola come la nostra, però, bisogna fidarsi dei colleghi. Perché vorrebbe lavorare proprio con noi?"
    goals: [strengths]
  - learner: "Proprio per questo: perché siete piccoli. In una grande azienda disegnerei per anni lo stesso dettaglio, mentre qui potrei seguire un progetto dall'inizio alla fine. E poi, lo ammetto, se non avessi visto il vostro lavoro per quella cantina, forse non avrei mai scelto questo mestiere."
  - tutor: "Questo mi fa davvero piacere, quel progetto l'abbiamo amato tutti. Direi che il quadro è chiaro. Ha qualche domanda da farmi sul ruolo?"
    goals: [why]
  - learner: "Sì, una sola. So che all'inizio avrò molto da imparare: nei primi mesi potrei contare con un collega più esperto che mi segua?"
    errors: [preposition]
  - tutor: "Bella domanda, la fanno in pochi. Solo un momento: «contare con un collega»? In italiano, dopo «contare», si usa un'altra piccola parola."
    goals: [questions]
    prompt: {text: "contare con un collega", tags: [preposition]}
  - learner: "Ah, sì: contare su un collega più esperto."
  - tutor: "Esatto. E la risposta è sì: per i primi sei mesi lavorerebbe accanto a Marta, che è con noi da dieci anni. Le faremo sapere entro venerdì. Grazie, è stato un piacere conoscerla."

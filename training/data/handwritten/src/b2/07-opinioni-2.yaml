- scenario: dibattito-ambiente
  level: B2
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Buonasera. Io non sono d'accordo, anzi, vorrei che il centro fosse chiuso ancora di più. Vado al lavoro in bicicletta ogni giorno e ho paura."
  - tutor: "La bicicletta, ecco. Ma non tutti possono andare in bicicletta, sa? Perché pensa che chiudere sia la soluzione giusta?"
    goals: [position]
  - learner: "Per due ragioni. La prima è la sicurezza: il mese scorso una macchina mi ha investito in via Roma, la strada di cui le auto vanno più veloci. La seconda è che con meno traffico ci sarebbe meno inquinamento."
    errors: [relative-pronoun]
  - tutor: "«La strada di cui le auto vanno più veloci»? Ripeta quella parte con calma."
    prompt: {text: "la strada di cui le auto vanno più veloci", tags: [relative-pronoun]}
    goals: [argue]
  - learner: "Mi scusi: la strada in cui le auto vanno più veloci. Mi sono rotto un braccio."
  - tutor: "Così va bene. Mi dispiace per il braccio, davvero. Però le auto non sono pericolose da sole, il problema è chi guida distratto. Non basterebbero più controlli e più vigili?"
    new: [{lemma: vigile, gloss: traffic warden}]
  - learner: "I controlli servono, ma non bastano. Nelle città dove hanno fatto le piste ciclabili e il limite dei trenta all'ora gli incidenti sono diminuiti molto. Le regole funzionano solo se la strada è fatta in modo sicuro."
  - tutor: "Sul limite dei trenta all'ora potrei anche ragionare. Ma chi viene da fuori per lavorare, come arriva in centro? C'è qualcosa su cui mi dà ragione?"
    goals: [counter]
  - learner: "Sì, ha ragione su chi viene da fuori: non tutti hanno un treno comodo. Propongo che il centro resti aperto alle auto, ma con il limite dei trenta e una pista ciclabile protetta sulle strade principali."
  - tutor: "Questa proposta la firmo anch'io, guardi. Le auto restano, ma vanno piano, e Lei pedala tranquillo. La presentiamo insieme al prossimo consiglio di quartiere."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-m-heritage
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Secondo me Lei sbaglia. Gestisco una piccola pensione in piazza e i miei ospiti si lamentano sempre del rumore delle macchine. Una zona pedonale porterebbe più turisti, non meno."
  - tutor: "Una pensione, quindi anche Lei è un commerciante. Ma i turisti sono una cosa, i clienti di tutti i giorni un'altra. Che cosa ci guadagnerebbe il quartiere?"
    goals: [position]
  - learner: "Due cose. Prima di tutto penso che i bar possono mettere i tavoli fuori, e una piazza piena di gente attira altra gente. Poi i residenti respirerebbero un'aria più pulita."
    errors: [subjunctive-use]
  - tutor: "«Penso che i bar possono»? Dopo «penso che» ci ripensi un attimo."
    prompt: {text: "penso che i bar possono", tags: [subjunctive-use]}
    goals: [argue]
  - learner: "Sì, penso che i bar possono lavorare di più anche la sera, come in tutte le piazze turistiche."
    errors: [subjunctive-use]
  - tutor: "Anch'io penso che i bar possano lavorare di più, ed è proprio questo il problema. Con i tavoli fuori, chi abita sopra non dorme fino all'una. Lei che cosa risponde ai residenti?"
    recast: {text: "penso che i bar possono", fix: "penso che i bar possano", tags: [subjunctive-use]}
  - learner: "Rispondo che il rumore delle auto c'è tutto il giorno, mentre quello dei bar si può regolare. Il comune può decidere un orario di chiusura per i tavoli all'aperto, per esempio a mezzanotte."
  - tutor: "Mezzanotte, dice. Qui in piazza molti bar oggi chiudono alle due. Su qualcosa mi dà ragione, almeno?"
    goals: [counter]
  - learner: "Sì: ha ragione che una piazza troppo piena può diventare invivibile per chi ci abita. Allora propongo una zona pedonale per un'estate, con i tavoli fuori fino alle undici e i vigili in piazza il fine settimana."
  - tutor: "Un'estate con regole chiare: così è un'altra cosa. Se a settembre i residenti sono contenti, non dirò più niente. Mettiamo la sua proposta ai voti."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-f-professional
  history: [subjunctive-form]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Buonasera. Le dico subito che non sono d'accordo con Lei. Mio figlio ha l'asma e nei giorni di traffico intenso respira male: per me la salute viene prima dei negozi."
  - tutor: "Mi dispiace per suo figlio, sinceramente. Però non è detto che la colpa sia delle auto: d'inverno anche il riscaldamento delle case fa la sua parte. Lei su cosa basa la sua idea?"
    new: [{lemma: riscaldamento, gloss: heating}]
    goals: [position]
  - learner: "Mi baso su due cose. La centralina dell'aria in piazza segna valori molto più alti nelle ore di punta, quando passano più macchine. E poi il pediatra, che ho chiesto un parere, mi ha detto che il traffico è la causa principale."
    errors: [relative-pronoun]
  - tutor: "«Il pediatra, che ho chiesto un parere»? Ci pensi bene: qualcosa non torna."
    prompt: {text: "il pediatra, che ho chiesto un parere", tags: [relative-pronoun]}
    goals: [argue]
  - learner: "Il pediatra a cui ho chiesto un parere, certo."
  - tutor: "Esatto. Ma i dati delle ore di punta li conosco anch'io, e in quelle ore passano anche i vecchi autobus. Se chiudiamo alle auto, con quelli non risolviamo niente, no?"
  - learner: "Ha ragione sugli autobus vecchi, ma il comune ne sta comprando di elettrici: ne arriveranno venti l'anno prossimo. Bisogna che le due cose andiamo avanti insieme."
    errors: [subjunctive-form]
  - tutor: "«Bisogna che le due cose andiamo avanti»? Guardi bene quella forma."
    prompt: {text: "Bisogna che le due cose andiamo avanti", tags: [subjunctive-form]}
  - learner: "Bisogna che le due cose vadano avanti insieme, scusi."
  - tutor: "Così va meglio. Venti autobus nuovi sono una buona notizia, se arrivano davvero. Ma c'è qualcosa su cui riconosce che ho ragione io?"
    goals: [counter]
  - learner: "Sì, sul riscaldamento ha ragione: anche quello conta, e chiudere il centro da solo non basta. Allora propongo di chiudere il centro solo nei giorni in cui l'aria è peggiore, e intanto aiutare i residenti a cambiare le vecchie caldaie."
  - tutor: "Chiudere nei giorni peggiori mi sembra giusto, e le caldaie sono un problema vero. Così nessuno perde tutto e i bambini respirano meglio. Su questo può contare sul mio voto."
    new: [{lemma: caldaia, gloss: boiler}]
    goals: [concede]

- scenario: politica-lavoro
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Mah, secondo me la metà è troppo. Però a scuola vedo già un cambiamento enorme: i miei studenti fanno i compiti con l'intelligenza artificiale e io non me ne accorgo quasi mai."
  - tutor: "Ecco, vedi? Se un programma scrive i temi al posto dei ragazzi, tra poco preparerà anche le lezioni al posto tuo. Cosa succederebbe se le scuole usassero solo programmi?"
    goals: [opinion]
  - learner: "Se le scuole usassero solo programmi, i ragazzi imparerebbero le informazioni, ma non a stare con gli altri. Sarebbe come se la scuola diventerebbe un enorme corso online."
    errors: [subjunctive-use]
  - tutor: "«Come se la scuola diventerebbe»? Dopo «come se» quella forma non va, riprova."
    prompt: {text: "come se la scuola diventerebbe", tags: [subjunctive-use]}
    goals: [hypothesis]
  - learner: "Hai ragione: come se la scuola diventasse un corso online. Nessuno vorrebbe una cosa così."
  - tutor: "Così sì. Però non mi hai ancora convinto che il tuo lavoro sia al sicuro. Hai un esempio di qualcosa che un programma non sa fare?"
  - learner: "Sì. L'anno scorso avevo un ragazzo che non parlava mai in classe. Ho capito che aveva problemi a casa solo perché un giorno l'ho visto piangere in corridoio. Un programma non se ne sarebbe mai accorto."
  - tutor: "Questo è vero, e mi fa pensare. Ma chi decide guarda i costi, non i ragazzi che piangono. Allora, in poche parole, come la vedi?"
    goals: [example]
  - learner: "La vedo così: la tecnologia può sostituire una parte del lavoro, quella noiosa, ma non il rapporto umano. E tu, Riccardo, non pensi che ci sia un rischio anche per il tuo settore?"
  - tutor: "Certo che c'è: faccio il grafico, e i programmi disegnano già meglio di me. Forse dovrei tornare a scuola, ma nella tua classe. Dai, prendiamo il dolce."
    goals: [conclude]
    new: [{lemma: grafico, gloss: graphic designer}]

- scenario: politica-lavoro
  level: B2
  persona: en-m-retired
  history: [conditional-form]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Ho sentito questa frase già negli anni Ottanta, sai? Quando sono arrivati i primi computer in banca, tutti dicevano che avremmo perso il posto. Invece dopo qualche anno eravamo più di prima."
  - tutor: "Altri tempi, però. Allora i computer facevano i conti, oggi parlano e scrivono. Se lo Stato desse uno stipendio a tutti, anche a chi non lavora, cosa succederebbe secondo te?"
    goals: [opinion]
  - learner: "Se lo Stato desse un reddito a tutti, molti farebbero lavori utili ma non pagati, come aiutare gli anziani. Però ho paura che alcuni rimanerebbero sul divano tutto il giorno."
    errors: [conditional-form]
  - tutor: "Sul divano, dici? Ma «rimanerebbero» non suona bene, prova di nuovo."
    prompt: {text: "rimanerebbero", tags: [conditional-form]}
    goals: [hypothesis]
  - learner: "Sì, rimanerebbero a casa senza fare niente, almeno all'inizio."
    errors: [conditional-form]
  - tutor: "Alcuni rimarrebbero a casa, certo, ma tanti già oggi lavorano senza essere pagati. Mi racconti com'era davvero in banca quando sono arrivati i computer?"
    recast: {text: "rimanerebbero", fix: "rimarrebbero", tags: [conditional-form]}
  - learner: "Nel 1985 facevo i conti a mano con una calcolatrice. Con il computer, il lavoro di una settimana lo facevamo in un giorno. Però la banca ha aperto nuovi uffici e ha assunto ragazzi giovani per i nuovi servizi."
  - tutor: "Interessante: più velocità e più uffici, non meno persone. Ma oggi le banche chiudono un ufficio dopo l'altro. Allora, cosa ne concludi?"
    goals: [example]
  - learner: "Concludo che le paure di oggi somigliano molto a quelle di ieri, ma la velocità è diversa. Il rischio è che le persone non abbiano il tempo di adattarsi. Tu cosa ne pensi, Riccardo?"
  - tutor: "Penso che tu abbia ragione sulla velocità: è proprio questo che mi fa paura. Comunque ascoltare uno che c'era vale più di cento articoli. Ancora un po' di vino?"
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Io porto il cibo a domicilio in bici per un'app, qui a Torino, quindi questa cosa la vivo già. Il mio capo non è una persona: è un programma che decide i turni e quanto guadagno."
  - tutor: "Un capo che è un programma: peggio di come pensavo! E se domani le consegne le facessero le macchine da sole, tu cosa faresti?"
    goals: [opinion]
  - learner: "Se le facessero le macchine, cercherei un lavoro nella manutenzione, perché le macchine si rompono. Ho già pensato in iscrivermi a un corso di elettronica, ma costa tanto e non ho tempo."
    errors: [preposition]
  - tutor: "Buona idea. Ma «pensato in iscrivermi»? Controlla la piccola parola dopo «pensato»."
    prompt: {text: "pensato in iscrivermi", tags: [preposition]}
    goals: [hypothesis]
  - learner: "Ho pensato di iscrivermi a un corso, sì. Il problema è che lavoro dieci ore al giorno."
  - tutor: "Ecco, adesso va bene. Dieci ore al giorno in bicicletta sono tante. Mi fai un esempio di come quel programma decide per te?"
  - learner: "Certo. Se rifiuto una consegna perché piove forte, il giorno dopo ricevo meno ordini. Il mese scorso un mio amico è caduto con la bici e per una settimana ha perso il suo punteggio. Nessuno gli ha chiesto come stava."
  - tutor: "Questo è il lato che nessuno racconta. Altro che lavori che non esistono più: qui il lavoro c'è, ma senza diritti. Allora, alla fine, che cosa ne pensi?"
    goals: [example]
  - learner: "Tirando le somme, il problema non è la tecnologia, ma chi la usa e con quali regole. Servirebbero leggi chiare anche per chi lavora con le app. Tu che ne pensi, ti sembra possibile?"
  - tutor: "Possibile sì, ma ci vorranno anni di lotte. Intanto hai ragione tu: più della macchina, mi fa paura chi la comanda. La prossima volta la cena la porto io, a piedi."
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti. Studio canto lirico al conservatorio di Napoli da tre anni. In America avevo sempre ascoltato le opere italiane, e volevo cantarle nel paese dove erano nate."
  - tutor: "La musica come passaporto, che bella storia. Ma Napoli non è una città semplice per chi arriva da fuori. Che cosa le è costato di più?"
    goals: [story]
  - learner: "All'inizio il rumore e il caos: motorini, clacson, gente che parla forte fino a tardi. E poi il dialetto. Ero sicura che parlavo bene l'italiano, ma al mercato non capivo una parola."
    errors: [subjunctive-use]
  - tutor: "Il mercato di Napoli è una scuola a parte! Però «ero sicura che parlavo»? Dopo «ero sicura che» ci ripensi."
    prompt: {text: "Ero sicura che parlavo", tags: [subjunctive-use]}
    goals: [difficulties]
  - learner: "Ero sicura che parlassi bene l'italiano, ma non era così."
  - tutor: "Bene così. E dopo tre anni, in che cosa si sente cambiata?"
  - learner: "Sono diventata meno rigida. Prima, se il treno era in ritardo, mi arrabbiavo moltissimo. Adesso aspetto, chiacchiero con chi ho accanto e spesso imparo qualcosa. Anche la mia voce è cambiata: canto con più calore."
  - tutor: "Più calore nella voce e meno fretta nella vita: Napoli lascia il segno. Che cosa direbbe a un ascoltatore che sogna di venire a studiare qui?"
    goals: [change]
  - learner: "Gli direi di non giudicare la città nelle prime settimane. Napoli è come certe arie difficili: bisogna ascoltarla tante volte prima di capirla. E di lasciarsi aiutare dai vicini, che qui sono una seconda famiglia."
  - tutor: "Ascoltare la città come un'aria difficile: me lo segno. Grazie, e speriamo di sentirla presto su un grande palco. Adesso, per restare in tema, un po' di musica."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno. Sono venuto a Milano per amore, otto anni fa. Avevo conosciuto mia moglie a Barcellona, dove lei faceva un master, e quando è tornata in Italia l'ho seguita."
  - tutor: "Per amore: la ragione più antica del mondo! Ma ricominciare in un altro paese non è mai facile. Qual è stata la cosa più difficile?"
    goals: [story]
  - learner: "Il lavoro. In Spagna facevo l'elettricista da dieci anni, ma qui il mio diploma non valeva niente. Quando finalmente l'hanno riconosciuto, sono già passati quasi due anni."
    errors: [tense-aspect]
  - tutor: "Due anni, che attesa. Ma «sono già passati»? Pensi a che cosa è successo prima e che cosa dopo."
    prompt: {text: "sono già passati", tags: [tense-aspect]}
    goals: [difficulties]
  - learner: "Sì, sono già passati due anni, e intanto lavoravo in un magazzino."
    errors: [tense-aspect]
  - tutor: "Quando l'hanno riconosciuto erano già passati due anni, e Lei intanto in magazzino: ci vuole pazienza. In questi otto anni Lei è cambiato?"
    recast: {text: "sono già passati", fix: "erano già passati", tags: [tense-aspect]}
  - learner: "Sì, sono diventato più flessibile. In Spagna avevo tutto programmato; qui ho imparato che le cose cambiano e che bisogna adattarsi. E adesso, finalmente, ho una piccola ditta tutta mia con due dipendenti."
  - tutor: "Una ditta tutta sua, bravo davvero! Che consiglio darebbe a chi vuole trasferirsi in Italia per lavoro?"
    goals: [change]
  - learner: "Consiglierei di portare tutti i documenti tradotti e con il timbro giusto prima di partire. E di non vergognarsi di cominciare da un lavoro più semplice: è un passo, non una sconfitta."
  - tutor: "Un passo, non una sconfitta: lo dico anche ai miei figli. Grazie mille, e salutiamo sua moglie che ci ascolta da casa. Dopo una breve pausa torniamo con le notizie."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno. Io e mia moglie siamo andati in pensione cinque anni fa e abbiamo comprato una vecchia casa in Umbria. Avevamo passato lì tante vacanze, e un giorno ci siamo detti: perché non restare?"
  - tutor: "Una casa in collina dopo una vita di lavoro: il sogno di tanti. Ma immagino che la realtà sia diversa dalle vacanze. Che cosa è stato più difficile?"
    goals: [story]
  - learner: "La macchina e la salute. Per fare la spesa o andare dal medico bisogna sempre guidare, e io non ero abituato a queste strade strette. Poi mia moglie ha avuto un piccolo problema al cuore e l'ospedale più vicino è a quaranta minuti."
  - tutor: "Quaranta minuti fanno paura, a una certa età. Spero che sua moglie ora stia bene. In questi cinque anni, Lei si sente un'altra persona?"
    goals: [difficulties]
  - learner: "Sì, sta bene, grazie. Io sono cambiato molto: in Inghilterra non conoscevo i miei vicini, qui il fornaio mi chiama per nome. Se sarei rimasto a Londra, non avrei mai imparato a fare l'orto."
    errors: [hypothetical]
  - tutor: "L'orto, che bello! Però «se sarei rimasto»? Dopo «se» quella forma non va."
    prompt: {text: "Se sarei rimasto", tags: [hypothetical]}
    goals: [change]
  - learner: "Se fossi rimasto a Londra, non avrei mai fatto l'orto."
  - tutor: "Perfetto. Molti nostri ascoltatori pensano di fare la stessa scelta per la pensione. Che consiglio darebbe loro?"
  - learner: "Di scegliere un paese vicino a un ospedale e a una stazione, non solo un bel panorama. E di imparare bene la lingua, perché quando sei malato devi spiegare al dottore cosa senti."
  - tutor: "Prima l'ospedale e poi il panorama: un consiglio molto utile. La ringrazio, e tanti saluti ai suoi vicini. Tra poco torniamo con altre storie."
    goals: [advice]

- scenario: smartworking
  level: B2
  persona: es-f-erasmus
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Io studio a Padova, ma da sei mesi lavoro anche da casa: rispondo alle mail dei clienti di un'agenzia di viaggi spagnola, venti ore alla settimana."
  - tutor: "Studi e lavori, brava! E come fai a organizzarti con le lezioni?"
    goals: [situation]
  - learner: "Il vantaggio è che l'orario è flessibile: posso lavorare la sera, dopo le lezioni, o la domenica. E lavorare da casa è molto più comodo che il bar dove lavoravo prima."
    errors: [comparative]
  - tutor: "«Più comodo che il bar»? Quel «che» qui non mi convince, riprova."
    prompt: {text: "più comodo che il bar", tags: [comparative]}
    goals: [pros]
  - learner: "Sì, è più comodo che il bar, anche perché posso lavorare in pigiama."
    errors: [comparative]
  - tutor: "Lo credo che sia più comodo del bar, in pigiama poi! E di negativo cosa c'è?"
    recast: {text: "più comodo che il bar", fix: "più comodo del bar", tags: [comparative]}
  - learner: "A volte non riesco a staccare: la mia stanza è anche il mio ufficio e la mia aula. E i colleghi non li ho mai visti di persona, solo in videochiamata. Mi sento un po' un numero."
  - tutor: "Ti capisco, non è bello sentirsi così. Se potessi scegliere, cosa preferiresti?"
    goals: [cons]
  - learner: "Preferirei un lavoro un po' meno flessibile ma con dei colleghi veri, magari qui a Padova. Mi piacerebbe avere qualcuno con cui prendere un caffè e parlare italiano, non solo spagnolo con i clienti."
  - tutor: "Allora ti avviso se nel mio ufficio cercano qualcuno. Intanto il caffè lo prendi con me, e stasera offro io: alla salute!"
    goals: [preference]

- scenario: smartworking
  level: B2
  persona: en-f-professional
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da settembre vado in ufficio tutti i giorni, purtroppo. La mia azienda ha deciso che dobbiamo tornare cinque giorni su cinque, e nessuno ci ha chiesto un parere."
  - tutor: "Cinque su cinque, che cambio! E come ti trovi adesso?"
    goals: [situation]
  - learner: "Male, onestamente. Da casa lavoravo meglio: non perdevo un'ora e mezza nel traffico e la mattina portavo i bambini a scuola con calma. Ero anche più produttiva che i miei colleghi in ufficio."
    errors: [comparative]
  - tutor: "Ti credo. Ma «più produttiva che i miei colleghi»? Ripensa a quel «che» davanti ai colleghi."
    prompt: {text: "più produttiva che i miei colleghi", tags: [comparative]}
    goals: [pros]
  - learner: "Più produttiva dei miei colleghi, volevo dire. Lo dicevano anche i risultati."
  - tutor: "Giusto. Però qualcosa di buono nel ritorno in ufficio l'avrai trovato, no?"

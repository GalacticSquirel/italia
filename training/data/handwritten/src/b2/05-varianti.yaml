- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [combined-pronouns]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Quest'anno ho coordinato il progetto con Madrid e l'abbiamo consegnato due settimane prima della scadenza. Il cliente era molto contento. Ieri ho visto il direttore e se lo ho detto."
    errors: [combined-pronouns]
  - tutor: "Un ottimo risultato, lo so bene. Ma «se lo ho detto»? In italiano «se lo» qui non funziona: riprovi."
    prompt: {text: "se lo ho detto", tags: [combined-pronouns]}
    goals: [results]
  - learner: "Ah, certo: ieri ho visto il direttore e gliel'ho detto."
  - tutor: "Esatto. Sì, me ne ha parlato anche lui stamattina. E quindi, che cosa voleva chiedermi?"
  - learner: "Vorrei chiedere una promozione a responsabile di progetto. Credo di meritarla, perché da mesi faccio già questo lavoro."
  - tutor: "Il suo lavoro lo conosco e lo apprezzo. Però lei è qui da poco più di un anno, e di solito per quel ruolo ne servono almeno tre. Temo che i colleghi più anziani non la prendano bene. Lei che cosa ne pensa?"
    goals: [request]
  - learner: "Capisco, ma non credo che gli anni siano l'unica cosa importante. I colleghi mi chiedono già aiuto ogni giorno, e nessuno di loro conosce il cliente spagnolo come me."
  - tutor: "Su questo ha ragione, e il cliente ha chiesto proprio di lei. Facciamo così: le do il prossimo progetto con Madrid come responsabile, per sei mesi di prova. Se va bene, a giugno la promozione diventa ufficiale. Le sembra giusto?"
    goals: [handle]
  - learner: "Sì, mi sembra giusto. Potrebbe mettere tutto per iscritto, così è chiaro per tutti? E l'aumento arriverebbe a giugno, con la promozione?"
  - tutor: "Sì, l'aumento arriverebbe insieme al nuovo ruolo. Domani le mando una lettera con le condizioni e gli obiettivi dei sei mesi. Avrei voluto fare di più subito, ma così nessuno potrà dire niente."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Buongiorno, grazie. Lavoro qui per cinque anni e quest'anno il mio reparto ha aumentato le vendite del 15%."
    errors: [preposition]
  - tutor: "Il 15% è un bel numero, lo riconosco. Però ripeta l'inizio: «lavoro qui per cinque anni»? Lei lavora ancora con noi, no?"
    prompt: {text: "Lavoro qui per cinque anni", tags: [preposition]}
    goals: [results]
  - learner: "Sì, certo, lavoro qui per cinque anni, dal 2021. E ho anche formato tre colleghi nuovi."
    errors: [preposition]
  - tutor: "Certo: «lavoro qui da cinque anni», e l'esperienza si vede. Anche i tre colleghi nuovi parlano molto bene di lei. Mi dica, allora: che cosa mi vuole chiedere?"
    recast: {text: "lavoro qui per cinque anni", fix: "lavoro qui da cinque anni", tags: [preposition]}
  - learner: "Vorrei un aumento. Devo essere onesto: un'altra azienda mi ha offerto il 20% in più. Attualmente, non voglio andare via, ma devo pensare anche alla mia famiglia."
    errors: [false-friend]
  - tutor: "La ringrazio per la sincerità. Se in realtà non vuole andare via, mi fa piacere. Però non mi piace discutere un aumento sotto la pressione di un'altra offerta. E il 20% è fuori dalle nostre possibilità."
    recast: {text: "Attualmente", fix: "in realtà", tags: [false-friend]}
    goals: [request]
  - learner: "Non voglio fare pressione, mi creda. Se avessi voluto solo i soldi, avrei già firmato con loro. Le chiedo soltanto di valutare che cosa è possibile."
  - tutor: "Va bene, apprezzo che me l'abbia detto in modo così diretto. Un 20% non posso prometterlo. Un 10% più due giorni di lavoro da casa, invece, forse sì. Le interesserebbe?"
    goals: [handle]
  - learner: "Sì, mi interesserebbe. Quando potrei avere una risposta sicura? L'altra azienda aspetta fino a venerdì."
  - tutor: "Ne parlo domani con la direzione e giovedì mattina le do una risposta. Avrei preferito saperlo qualche settimana fa, ma faremo in tempo. Grazie di essere venuto da me prima di decidere."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-student
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Sono qui da otto mesi come stagista e vorrei parlare di quello che ho fatto. La campagna che ho lavorato in primavera ha portato 40 clienti nuovi."
    errors: [relative-pronoun]
  - tutor: "Me la ricordo bene, è stato un bel lavoro. Ma «la campagna che ho lavorato»? Si lavora «a» una campagna: provi a ripetere la frase."
    prompt: {text: "La campagna che ho lavorato", tags: [relative-pronoun]}
    goals: [results]
  - learner: "Giusto: la campagna a cui ho lavorato in primavera. E da allora seguo da sola i social di due clienti."
  - tutor: "Ora va bene. E lo fa con molta cura, me lo dicono anche i clienti. Che cosa ha in mente per il futuro?"
  - learner: "Lo stage finisce a dicembre. Vorrei chiederle un contratto vero, con uno stipendio adeguato alle responsabilità che ho già."
  - tutor: "Capisco la richiesta, e in buona parte la merita. Il mio dubbio è un altro: lei studia ancora e può venire solo il pomeriggio. Per un contratto vero ho bisogno di qualcuno che ci sia tutto il giorno."
    goals: [request]
  - learner: "È vero, ma mi mancano solo due esami e la tesi. Da gennaio potrei lavorare tutto il giorno, e la tesi la scriverei la sera e nei fine settimana."
  - tutor: "Questo cambia le cose. Allora le propongo un contratto di un anno da gennaio, a tempo pieno. Sullo stipendio devo ancora fare due conti. Le va bene se ne riparliamo?"
    goals: [handle]
  - learner: "Va benissimo, grazie! Quando pensa di potermi dire la cifra? Vorrei organizzarmi con l'università."
  - tutor: "Entro la fine del mese le faccio avere una proposta scritta. Nel frattempo mi mandi le date dei suoi ultimi esami. Sono felice che resti con noi."
    goals: [next-steps]

- scenario: arte-mostra
  level: B2
  persona: en-m-heritage
  history: [comparative]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sinceramente? Non mi dice molto. Sono solo tre strisce di colore su una tela enorme. Potrebbe averlo fatto mio nipote."
  - tutor: "Lo dicono in tanti, sai! Però resta un attimo qui davanti e guardalo con calma. Che cosa vedi, oltre ai tre colori?"
    goals: [react]
  - learner: "Va bene... Il rosso in alto non è uniforme, ci sono parti più scure. E i bordi tra un colore e l'altro non sono netti, sembrano quasi muoversi."
  - tutor: "Ecco, hai già visto molto di più. I colori sono stati messi uno sopra l'altro, a poco a poco, per settimane. Secondo te che cosa cercava il pittore?"
    goals: [describe]
  - learner: "Forse non voleva rappresentare niente di preciso. Penso che voglia farci provare un'emozione, come quando si guarda il tramonto senza pensare."
  - tutor: "È proprio questo. Lui diceva che i suoi quadri vanno sentiti, non capiti. Ti viene in mente qualcosa di simile che abbiamo visto oggi?"
    goals: [interpret]
  - learner: "Il paesaggio della prima sala, quello con il mare. Però questo è più potente che quello, anche se è meno realistico."
    errors: [comparative]
  - tutor: "Bel confronto! Però senti come suona: «più potente che quello»? Tra due quadri, quel «che» non va bene."
    prompt: {text: "più potente che quello", tags: [comparative]}
  - learner: "Ah... più potente che il paesaggio, volevo dire. Mi ha colpito di più."
    errors: [comparative]
  - tutor: "Sì, anche per me è più potente del paesaggio, perché non ti racconta niente e ti lascia solo con il colore. Vedi che alla fine ti ha preso? Dai, andiamo: nella prossima sala c'è un'opera che ti farà discutere ancora di più."
    recast: {text: "più potente che il paesaggio", fix: "più potente del paesaggio", tags: [comparative]}
    goals: [compare]

- scenario: arte-mostra
  level: B2
  persona: es-f-teacher
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Che meraviglia! Mi sembra di essere a Venezia. Si sente quasi il rumore dell'acqua."
  - tutor: "Hai indovinato, è proprio Venezia in un giorno di festa. È stato dipinto verso il 1730. Raccontami che cosa succede nella scena."
    goals: [react]
  - learner: "Ci sono tantissime barche piene di gente elegante. A destra si vede una chiesa bianca, e la gente sale dalla chiesa dopo la messa."
    errors: [false-friend]
  - tutor: "Sì, la gente esce dalla chiesa e va verso le barche: guarda quanti dettagli. Ogni finestra è diversa, e la luce sull'acqua sembra vera. Perché tanta precisione, secondo te?"
    recast: {text: "sale dalla chiesa", fix: "esce dalla chiesa", tags: [false-friend]}
    goals: [describe]
  - learner: "Credo che il pittore voglia mostrare la ricchezza della città. Forse era come una cartolina di lusso per i viaggiatori stranieri."
  - tutor: "Brava, è andata proprio così! Questi quadri venivano comprati dai giovani inglesi in viaggio per l'Italia. Erano il loro ricordo più caro. Lo metteresti vicino a qualcosa che conosci?"
    goals: [interpret]
  - learner: "Mi ricorda i paesaggi di Madrid che ho visto al Prado, però lì il cielo è più importante della città. E poi Venezia non ha cambiato molto da allora, Madrid sì!"
    errors: [auxiliary-choice]
  - tutor: "Giusto, in quelli il cielo occupa mezzo quadro. Ma senti: «Venezia non ha cambiato»? Qui «ha» non funziona, perché è la città che diventa diversa."
    prompt: {text: "Venezia non ha cambiato", tags: [auxiliary-choice]}
  - learner: "Ah, sì: Venezia non è cambiata molto da allora."
  - tutor: "Per fortuna, direi! Qui la prospettiva è precisa come una fotografia, mentre nei quadri spagnoli conta di più l'aria, il cielo. Vieni, ti faccio vedere questo canale dipinto di notte."
    goals: [compare]

- scenario: arte-mostra
  level: B2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi fa girare la testa, ma in senso buono! È tutto movimento, non riesco a fermare gli occhi su un punto."
  - tutor: "Bene, vuol dire che funziona! È un'opera del 1910, e a Milano allora stava cambiando tutto. Prova a dirmi che cosa riesci a vedere."
    goals: [react]
  - learner: "Al centro c'è un cavallo rosso enorme, e degli uomini che cercano di tenerlo. Dietro ci sono altri cavalli, ma sono difficili da contare: io vedo tre."
    errors: [ci-ne]
  - tutor: "Sono difficili, sì. Ma «io vedo tre»? Manca una parola piccola, quella che sta al posto di «cavalli»."
    prompt: {text: "io vedo tre", tags: [ci-ne]}
  - learner: "Giusto: io ne vedo tre. E sullo sfondo ci sono dei palazzi in costruzione, con del fumo."
  - tutor: "Adesso sì. Quei palazzi sono la città nuova che cresce, appena fuori dal centro. Tutto è stato dipinto con piccoli segni di colore puro. Come la leggi, questa scena?"
    goals: [describe]
  - learner: "Per me il cavallo è la forza del progresso. Gli uomini pensano di guidarlo, ma mi pare che sia lui a portare via loro."
  - tutor: "Che bella lettura, non ci avevo mai pensato così! In effetti per quei pittori la velocità era più bella di ogni opera antica. Ti ricorda qualcosa?"
    goals: [interpret]
  - learner: "Un po' gli impressionisti, per i piccoli tocchi di colore. Ma loro dipingevano giardini tranquilli, qui invece sembra che il quadro stia per esplodere."
  - tutor: "È vero, il modo di dipingere viene da lì, ma l'idea è un'altra. Loro guardavano la natura, questi volevano il rumore delle fabbriche. Se ti è piaciuto, nell'ultima sala ce n'è uno ancora più grande."
    goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: es-m-worker
  history: [future-form]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Purtroppo stavolta la colpa è mia. Ieri sera stavo uscendo in retromarcia dal parcheggio del supermercato e ho urtato una macchina che passava dietro di me."
  - tutor: "Capita, non si preoccupi. L'importante è che nessuno si sia fatto male. Come mai non l'aveva vista?"
    goals: [what]
  - learner: "Avevo guardato nello specchietto, ma pioveva forte ed era già buio. L'altra macchina aveva la precedenza, quindi la responsabilità è tutta mia."
  - tutor: "La ringrazio, non tutti lo ammettono così. Avete fatto subito la constatazione amichevole, lì sul posto?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo compilata subito e firmata tutti e due. La signora è stata molto gentile. Ho anche fatto delle foto ai due paraurti."
  - tutor: "Ha fatto benissimo. Sul modulo sono stati indicati la targa e i dati dell'assicurazione della signora?"
  - learner: "Sì, c'è tutto. Però ho una domanda che mi preoccupa: visto che è colpa mia, quanto doverò pagare?"
    errors: [future-form]
  - tutor: "Domanda giusta. Ma «doverò»? Questa forma del futuro non esiste: ci riprovi."
    prompt: {text: "doverò", tags: [future-form]}
    goals: [documents]
  - learner: "Scusi: quanto dovrò pagare?"
  - tutor: "Ecco. Il danno alla signora lo paghiamo noi. Per la sua macchina, invece, il contratto prevede una franchigia di 250 euro. Il resto è coperto."
  - learner: "Meno male. E adesso che cosa succede? Il prezzo dell'assicurazione aumenterà l'anno prossimo?"
  - tutor: "Un po' sì, purtroppo, succede sempre dopo un sinistro con colpa. Intanto mi mandi il modulo e le foto per email. Poi verrà fissata la perizia e la chiameremo entro cinque giorni."
    goals: [next]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-f-professional
  history: [passive]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Stamattina ho avuto un incidente in una rotonda, vicino alla stazione di Padova. Ero già dentro la rotonda quando un furgone è entrato senza fermarsi e mi ha colpita sulla portiera destra."
  - tutor: "Mi dispiace. Prima di tutto: lei sta bene?"
    goals: [what]
  - learner: "Sì, sto bene, è stato solo un grande spavento. Secondo me la colpa è sua, perché io ero già nella rotonda. Ma lui dice che andavo troppo veloce e non ha voluto firmare niente."
  - tutor: "Capisco, purtroppo succede spesso. Chi è già nella rotonda passa per primo, quindi la regola è dalla sua parte. Senza la firma dell'altro, però, la constatazione amichevole vale meno. Ha qualche prova?"
    goals: [responsibility]
    new: [{lemma: rotonda, gloss: roundabout}]
  - learner: "Sì. Una signora aveva visto tutto dal marciapiede e mi ha lasciato il suo numero. E sono stata detta di fare delle foto, così ho fotografato le due macchine e la targa del furgone."
    errors: [passive]
  - tutor: "Ottimo lavoro. Solo una cosa: «sono stata detta»? In italiano questa frase non si può costruire così: provi in un altro modo."
    prompt: {text: "sono stata detta", tags: [passive]}
  - learner: "Hmm... sono stata detta dalla signora, è lei che mi ha consigliato le foto."
    errors: [passive]
  - tutor: "Ho capito: si dice «mi è stato detto di fare delle foto», ed era un buon consiglio. Il modulo lo ha compilato comunque, anche solo con la sua firma?"
    recast: {text: "sono stata detta", fix: "mi è stato detto", tags: [passive]}
  - learner: "Sì, ho compilato la mia parte e ho fatto un disegno dell'incidente. Ho scritto anche il nome e il telefono della signora."
  - tutor: "Perfetto, è proprio quello che ci serve. Me lo mandi oggi insieme alle foto."
    goals: [documents]
  - learner: "Lo mando subito. E poi? Se lui continua a dire che la colpa è mia, cosa succede?"
  - tutor: "Sentiremo la signora e l'assicurazione del furgone, e il danno verrà valutato con una perizia. Ci vorrà circa un mese, ma con queste prove sono abbastanza tranquillo. Per ora non faccia riparare la macchina."
    goals: [next]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-retired
  history: [auxiliary-choice]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri pomeriggio ero in autostrada, vicino a Firenze, e c'era una lunga coda. La macchina davanti a me ha frenato all'improvviso. Io ho riuscito a fermarmi, ma quella dietro no."
    errors: [auxiliary-choice]
  - tutor: "Brutta situazione. Scusi, però: «ho riuscito»? Con «riuscire» non si usa «avere»."
    prompt: {text: "ho riuscito", tags: [auxiliary-choice]}
  - learner: "Ha ragione: sono riuscito a fermarmi, ma la macchina dietro mi ha tamponato e mi ha spinto contro quella davanti."
  - tutor: "Ora è chiaro. Quindi le macchine sono tre, e la sua è stata danneggiata davanti e dietro. Secondo lei di chi è la colpa?"
    goals: [what]
  - learner: "Del terzo guidatore, senza dubbio. Era troppo vicino e, come ha detto lui, stava cambiando la musica alla radio. Io mi ero già fermato quando mi ha colpito."
  - tutor: "Se lei era già fermo, la responsabilità è del terzo guidatore anche per il danno alla prima macchina. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Ne abbiamo compilate due: una con il signore dietro e una con la signora davanti. Non sapevo se fosse giusto, ma un poliziotto mi ha detto di fare così."
  - tutor: "Ha fatto benissimo, con tre macchine si fa proprio così. In quella con il signore dietro è scritto che lei era fermo?"
  - learner: "Sì, lui ha messo la croce su «tamponava un veicolo fermo» e ha firmato. C'è anche la sua targa."
  - tutor: "Allora siamo a posto. Mi mandi tutto, anche solo in foto: una copia per ogni modulo."
    goals: [documents]
  - learner: "Lo faccio stasera. Ma nel frattempo la macchina non parte più. Cosa devo fare, e quanto dovrò aspettare?"
  - tutor: "La perizia verrà fatta entro la settimana nel garage dove è stata portata la macchina. Visto che la colpa non è sua, non pagherà la franchigia. Intanto può chiedere una macchina in prestito: gliela diamo noi, senza spese."
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Sono spagnola e studio a Torino da settembre. Resto fino a luglio, e mi hanno detto che dopo tre mesi devo iscrivermi all'anagrafe."
  - tutor: "È così: i cittadini europei che restano più di tre mesi devono chiedere la residenza. A lei non serve il permesso di soggiorno. Ha portato qualche documento?"
    goals: [request]
  - learner: "Ho la carta d'identità spagnola e il certificato di iscrizione all'università. Serve altro?"
  - tutor: "Sì, si richiedono anche un'assicurazione per la salute e il contratto d'affitto. Inoltre deve dichiarare di avere abbastanza soldi per vivere qui. Ce li ha?"
    goals: [documents]
  - learner: "La tessera sanitaria europea ce l'ho. Il contratto invece è un problema: l'ho firmato, ma la mia copia non è ancora arrivata. Ieri ho chiamato al proprietario e dice che è dal commercialista."
    errors: [preposition]
  - tutor: "Mi dispiace, capita spesso. Però attenzione: «ho chiamato al proprietario»? In italiano, dopo «chiamare», quella «al» è di troppo."
    prompt: {text: "ho chiamato al proprietario", tags: [preposition]}
  - learner: "Giusto, in spagnolo si dice così: ho chiamato il proprietario. Posso fare la domanda senza il contratto?"
  - tutor: "Proprio così. Senza contratto la pratica non può essere accettata, purtroppo. Però basta anche una dichiarazione firmata dal proprietario, con una copia del suo documento. Pensa di riuscire ad averla?"
  - learner: "Sì, credo di sì, abita nel palazzo accanto. Così torno domani con tutto. È una pratica molto larga? Ho gli esami a gennaio."
    errors: [false-friend]
  - tutor: "No, non è una pratica molto lunga, stia tranquilla. Lei domani consegna il modulo e la residenza vale da subito. Poi, entro 45 giorni, passano i vigili a controllare."
    recast: {text: "molto larga", fix: "molto lunga", tags: [false-friend]}
    goals: [problem]
  - learner: "Meno male! E i vigili avvisano prima di venire? Io la mattina sono sempre a lezione."
  - tutor: "No, di solito non avvisano. Se non la trovano, lasciano un biglietto e ripassano un'altra volta. Le consiglio di mettere subito il suo nome sulla porta e sulla posta. A domani, allora!"
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Mi chiamo Anthony Russo, sono americano. Mio nonno era nato in questo paese e io sono venuto a vivere qui per chiedere la cittadinanza italiana. Mi serve la residenza, giusto?"
  - tutor: "Russo? Qui ce ne sono tanti, sa! Sì, per la cittadinanza prima si prende la residenza in questo Comune. Dove abita adesso?"
    goals: [request]
    new: [{lemma: cittadinanza, gloss: citizenship}]
  - learner: "Ho affittato una casa in via Roma, vicino alla chiesa. Ho il contratto registrato e il passaporto. Quali altri documenti si devono presentare?"
  - tutor: "Per ora bastano questi, più il modulo. Però mi faccia vedere il passaporto: ci vuole il timbro di ingresso in Italia. Quando è arrivato?"
    goals: [documents]
    new: [{lemma: timbro, gloss: stamp}]
  - learner: "Sono arrivato dieci giorni fa, ma ho cambiato aereo a Francoforte. Il timbro me l'hanno messo lì, non a Roma. È un problema?"
  - tutor: "Un piccolo problema, sì. Senza timbro italiano serve la dichiarazione di presenza, che viene fatta in questura. Di solito si fa entro otto giorni, ma l'accettano anche un po' dopo."
    new: [{lemma: timbro, gloss: stamp}, {lemma: questura, gloss: police headquarters}]
  - learner: "Ho capito. Allora bisogna che vado in questura prima di tornare da lei?"
    errors: [subjunctive-use]
  - tutor: "Sì, prima lì e poi qui. Ma senta: «bisogna che vado»? Dopo «bisogna che» quel «vado» non suona bene."
    prompt: {text: "bisogna che vado", tags: [subjunctive-use]}

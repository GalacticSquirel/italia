- scenario: arte-mostra
  level: B2
  persona: en-m-retired
  history: [combined-pronouns]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Che sorpresa, lo conosco già! Mia moglie mi lo ha mostrato in un libro tanti anni fa, ma lì sembrava molto più scuro."
    errors: [combined-pronouns]
  - tutor: "Ma dai, che caso! Però «mi lo ha mostrato»... quelle due parole piccole, messe insieme, cambiano forma. Come si dice?"
    prompt: {text: "mi lo ha mostrato", tags: [combined-pronouns]}
  - learner: "Ah, certo: me l'ha mostrato mia moglie."
  - tutor: "Proprio così. Era più scuro perché due anni fa il quadro è stato restaurato, e sono tornati fuori i colori veri. Che cosa vedi adesso, che nel libro non si vedeva?"
    goals: [react]
    new: [{lemma: restaurare, gloss: to restore}]
  - learner: "Adesso si vede bene lo sfondo: c'è una città su una collina, con un cielo quasi verde. E la donna in primo piano ha un vestito rosso, non marrone come pensavo."
  - tutor: "Bravo, hai occhio. Quel rosso era coperto da anni di polvere e di fumo. Secondo te perché il pittore ha messo la città così lontana?"
    goals: [describe]
  - learner: "Credo che voglia dire che la donna ha lasciato la sua casa. Guarda verso di noi, come se chiedesse aiuto. Per me è più triste che il ritratto che abbiamo visto prima."
    errors: [comparative]
  - tutor: "Mi piace questa lettura, non ci avevo pensato. Solo una cosa: «più triste che il ritratto»? Tra due quadri, quel «che» non funziona."
    goals: [interpret]
    prompt: {text: "più triste che il ritratto", tags: [comparative]}
    new: [{lemma: lettura, gloss: "reading, interpretation"}]
  - learner: "Sì, molto più triste che il ritratto del ragazzo. Quello era pieno di luce, questo invece è freddo."
    errors: [comparative]
  - tutor: "Hai ragione, è più triste del ritratto del ragazzo, e anche più moderno. Eppure sono stati dipinti a Venezia a pochi anni di distanza. Quale dei due ti porteresti a casa?"
    goals: [compare]
    recast: {text: "più triste che il ritratto", fix: "più triste del ritratto", tags: [comparative]}
  - learner: "Questo, senza dubbio. Anche se a mia moglie piacerebbe di più l'altro!"
  - tutor: "Allora al negozio del museo ne prendiamo una copia per te e una per lei. Vieni, nella prossima sala c'è un'opera che ti piacerà."

- scenario: arte-mostra
  level: B2
  persona: es-f-erasmus
  history: [relative-pronoun]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sinceramente? Mi lascia un po' fredda. È il quadro che tutti fanno la fila, ma io non capisco perché."
    errors: [relative-pronoun]
  - tutor: "Almeno sei sincera! Ma aspetta: «il quadro che tutti fanno la fila»? Si fa la fila «per» qualcosa... come lo diresti meglio?"
    prompt: {text: "il quadro che tutti fanno la fila", tags: [relative-pronoun]}
  - learner: "Il quadro per cui tutti fanno la fila."
  - tutor: "Perfetto. E a parte il successo che ha, tu che cosa ci vedi?"
    goals: [react]
  - learner: "Vedo una ragazza seduta vicino a una finestra, con una lettera in mano. I colori sono spenti, quasi tutti grigi e marroni, e lo sfondo è vuoto."
  - tutor: "È vero, sullo sfondo non c'è quasi niente. Ma guarda la luce sulla lettera: è l'unico punto chiaro di tutta l'opera. Che cosa pensi che ci sia scritto?"
    goals: [describe]
  - learner: "Mah, penso che sia una brutta notizia, forse di un uomo che non tornerà. La ragazza non piange, però si capisce che ha perso qualcosa."
  - tutor: "Vedi che non ti lascia così fredda? È proprio quello che pensano in molti: il pittore aveva perso un fratello in guerra. Ti ricorda qualche altra opera?"
    goals: [interpret]
  - learner: "Sì, mi ricorda i ritratti spagnoli del Seicento. Di quadri così ho visto molti a Madrid, ma là le figure sono più drammatiche, con forti contrasti."
    errors: [ci-ne]
  - tutor: "È un confronto interessante! Però «di quadri così ho visto molti»... manca una piccola parola prima di «ho». Quale?"
    prompt: {text: "ho visto molti", tags: [ci-ne]}
  - learner: "Ne ho visti molti a Madrid, al Prado."
  - tutor: "Esatto. E hai ragione: qui nessuno grida, tutto è detto a voce bassa. Forse è per questo che le persone si fermano così a lungo. Andiamo avanti?"
    goals: [compare]
  - learner: "Va bene, ma lasciami guardare ancora un minuto. Forse comincio a capire la fila."
  - tutor: "Guarda pure con calma, non abbiamo fretta. Io ti aspetto nella sala accanto, davanti ai disegni."

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [register]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Ho saputo che il posto di coordinatrice è stato dato a un collega arrivato da poco. Sinceramente ci sono rimasta male, e volevo dirti perché."
    errors: [register]
  - tutor: "Ha fatto bene a venire. Però «volevo dirti»... qui in ufficio, con me, quale forma usa di solito?"
    prompt: {text: "volevo dirti", tags: [register]}
  - learner: "Mi scusi, ha ragione: volevo dirle perché."
  - tutor: "Si figuri. La ascolto: quali risultati pensa che non siano stati considerati?"
  - learner: "Quest'anno ho organizzato i corsi serali, che sono passati da 40 a 90 studenti. Inoltre ho formato tre insegnanti nuovi, e nessuno me l'aveva chiesto."
  - tutor: "Sono numeri importanti, e glieli riconosco senza problemi. Che cosa mi chiede, allora?"
    goals: [results]
  - learner: "Le chiedo una promozione, o almeno un aumento. Se avessi saputo che il posto era libero, avessi presentato la mia domanda."
    errors: [hypothetical]
  - tutor: "La richiesta è chiara. Ma senta la seconda metà della frase: «avessi presentato la mia domanda»? Lì la forma non può essere uguale a quella che viene dopo «se»."
    goals: [request]
    prompt: {text: "avessi presentato la mia domanda", tags: [hypothetical]}
  - learner: "Voglio dire che, se l'avessi saputo, avessi presentato la domanda come gli altri."
    errors: [hypothetical]
  - tutor: "Capisco: «se l'avessi saputo, avrei presentato la domanda». E io le credo. Il problema è che la scelta ormai è fatta, e non ho budget per un secondo coordinatore."
    recast: {text: "avessi presentato la domanda", fix: "avrei presentato la domanda", tags: [hypothetical]}
  - learner: "Lo capisco, e non le chiedo di cambiare quella scelta. Potrebbe però affidarmi ufficialmente i corsi serali, con un aumento legato al numero degli studenti."
  - tutor: "Questa è una proposta su cui posso lavorare. Per l'aumento mi serve l'accordo della direzione, ma la responsabilità dei corsi gliela posso dare subito. Le va bene se ci rivediamo a fine mese?"
    goals: [handle]
  - learner: "Sì, mi va bene. Nel frattempo le preparo una pagina con i numeri dei corsi, così la può mostrare alla direzione."
  - tutor: "Ottimo, me la mandi entro il 20. E la prossima volta che si libera un posto, glielo dirò di persona. Grazie di essere venuta."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Pensavo che la mia valutazione era prevista per dicembre, ma vorrei parlarne adesso, se possibile."
    errors: [subjunctive-use]
  - tutor: "Ne possiamo parlare oggi, certo. Solo una cosa: «pensavo che la mia valutazione era»? Dopo «pensavo che», ne è sicuro?"
    prompt: {text: "Pensavo che la mia valutazione era", tags: [subjunctive-use]}
  - learner: "Pensavo che fosse prevista per dicembre."
  - tutor: "Esatto. In effetti era a dicembre, ma l'ascolto volentieri. Com'è andato il suo anno?"
  - learner: "Direi molto bene. Ho seguito il cliente di Monaco, che voleva andarsene. Quando ha chiesto i dati sulle consegne, nessuno gli li aveva preparati, così ho lavorato tutta la notte."
    errors: [combined-pronouns]
  - tutor: "Quella notte me la ricordo bene. Ma ripeta: «nessuno gli li aveva preparati»? «Gli» e «li», uno dopo l'altro, non possono restare così."
    prompt: {text: "nessuno gli li aveva preparati", tags: [combined-pronouns]}
  - learner: "Sì, nessuno gli li aveva preparati, e il cliente era furioso."
    errors: [combined-pronouns]
  - tutor: "È vero, nessuno glieli aveva preparati, e lei ha salvato il contratto. So anche che gli obiettivi di vendita sono stati superati del 15%. Che cosa mi vuole chiedere?"
    goals: [results]
    recast: {text: "nessuno gli li aveva preparati", fix: "nessuno glieli aveva preparati", tags: [combined-pronouns]}
  - learner: "Vorrei diventare responsabile dei clienti esteri. Credo di meritare questa promozione, e anche un aumento adeguato."
  - tutor: "La richiesta non mi sorprende. Però quel ruolo significa guidare sei persone, e lei finora ha sempre lavorato da solo. Non vorrei che fosse troppo presto."
    goals: [request]
  - learner: "Capisco il dubbio. Però l'anno scorso ho formato i due colleghi nuovi, e a marzo ho sostituito la responsabile per un mese senza problemi."
  - tutor: "Questo è vero, e non ci avevo pensato. Facciamo così: le affido il gruppo per tre mesi, in prova. Se va bene, a gennaio la promozione è sua, con l'aumento."
    goals: [handle]
  - learner: "Mi sembra giusto. Potremmo fissare già adesso gli obiettivi dei tre mesi, così so su che cosa sarò valutato?"
  - tutor: "Buona idea. Le mando una proposta scritta entro venerdì e ne discutiamo lunedì mattina. Forse avremmo dovuto parlare di questo già l'anno scorso. Buon lavoro."
    goals: [next-steps]

- scenario: politica-lavoro
  level: B2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Purtroppo credo che tu abbia ragione, almeno in parte. Io faccio la traduttrice, e nel mio settore l'automazione è già arrivata: l'anno scorso ho perso metà dei clienti."
  - tutor: "Metà dei clienti? Questa non la sapevo, mi dispiace. E pensi che si potesse evitare, in qualche modo?"
    goals: [opinion]
  - learner: "Forse sì. Nella mia vecchia agenzia hanno mandato via quattro persone. Se l'agenzia avrebbe investito nella formazione, quelle persone avrebbero imparato a usare i nuovi programmi."
    errors: [hypothetical]
  - tutor: "È possibile. Ma senti come suona: «se l'agenzia avrebbe investito»... Dopo «se» quella forma non ci sta. Come lo diresti?"
    prompt: {text: "Se l'agenzia avrebbe investito", tags: [hypothetical]}
  - learner: "Se l'agenzia avesse investito nella formazione, avrebbero imparato."
  - tutor: "Ecco, così sì. Io però resto dell'idea che la formazione sia una bella parola e basta. Mi fai un esempio di qualcuno che si è salvato davvero?"
    goals: [hypothesis]
  - learner: "Una mia collega ha fatto un corso di sei mesi e ora controlla i testi tradotti dalle macchine. Guadagna meno di prima, ma lavora. Dicono che nasceranno tanti lavori nuovi così, però io non ne credo molto."
    errors: [ci-ne]
  - tutor: "Meno male per lei. Ma «non ne credo molto»? Si crede «a» qualcosa: lì ci vuole un'altra piccola parola."
    goals: [example]
    prompt: {text: "non ne credo molto", tags: [ci-ne]}
  - learner: "Voglio dire che non ne credo molto, a questa storia dei lavori nuovi."
    errors: [ci-ne]
  - tutor: "Ah, se è per questo io non ci credo molto da anni! Ogni tecnologia promette opportunità per tutti, e poi qualcuno resta a casa. Allora, alla fine, tu da che parte stai?"
    recast: {text: "non ne credo molto", fix: "non ci credo molto", tags: [ci-ne]}
  - learner: "Sto nel mezzo. Il rischio di disoccupazione è reale, ma chi si prepara in tempo ha più possibilità. E tu, non hai mai paura per il tuo lavoro?"
  - tutor: "Io faccio il meccanico: finché una macchina non saprà riparare le altre macchine, dormo tranquillo. Però per i miei figli un po' di paura ce l'ho. Dai, beviamo qualcosa."
    goals: [conclude]
    new: [{lemma: meccanico, gloss: mechanic}]

- scenario: politica-lavoro
  level: B2
  persona: en-m-heritage
  history: [pronoun-position]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che vedi tutto nero, come sempre! Mio nonno lavorava in una fabbrica a Torino negli anni Sessanta. Anche lui pensava che le macchine erano un nemico, e invece il lavoro è aumentato."
    errors: [subjunctive-use]
  - tutor: "Io guardo solo i fatti! Ma aspetta: «pensava che le macchine erano»... dopo «pensava che» ti suona bene?"
    prompt: {text: "pensava che le macchine erano", tags: [subjunctive-use]}
  - learner: "Sì, lui pensava che le macchine erano pericolose per gli operai. Lo diceva tutta la fabbrica."
    errors: [subjunctive-use]
  - tutor: "Tuo nonno pensava che le macchine fossero un pericolo, e in parte aveva ragione. Ma allora sostituivano le braccia, oggi sostituiscono la testa. Cosa succederebbe se un programma facesse il tuo lavoro meglio di te?"
    goals: [opinion]
    recast: {text: "pensava che le macchine erano", fix: "pensava che le macchine fossero", tags: [subjunctive-use]}
  - learner: "Se un programma lo facesse meglio di me, cambierei lavoro e basta. E se mio nonno fosse rimasto fermo, non avrebbe mai imparato a usare le macchine nuove. Invece ha studiato di sera."
  - tutor: "Bella risposta, e bravo tuo nonno. Però non tutti a 50 anni possono tornare a studiare. Hai in mente un caso vero, di oggi?"
    goals: [hypothesis]
  - learner: "Sì, mio cugino. Lavorava in banca, allo sportello. Un giorno hanno chiuso la sua sede senza lo avvisare prima. Lui però ha fatto un corso e adesso aiuta i clienti anziani con la tecnologia."
    errors: [pronoun-position]
  - tutor: "Ecco, vedi come fanno le banche? Ma «senza lo avvisare»... quel «lo» è nel posto sbagliato. Dove lo metti?"
    goals: [example]
    prompt: {text: "senza lo avvisare", tags: [pronoun-position]}
  - learner: "Senza avvisarlo prima."
  - tutor: "Giusto. Va bene, tuo cugino ce l'ha fatta, ma è uno su quanti? Allora, alla fine, secondo te dobbiamo avere paura o no?"
  - learner: "Secondo me no. Ogni tecnologia distrugge alcuni lavori e ne crea altri: il rischio vero è restare fermi. Tu invece continui a pensare che finirà male?"
  - tutor: "Diciamo che mi hai tolto metà della paura. Se tutti reagissero come tuo nonno e tuo cugino, starei tranquillo. Ma la formazione costa, e qualcuno la deve pagare. Intanto beviamo alla salute di tuo nonno!"
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti. In realtà non ho scelto l'Italia, ho scelto una persona! Ho conosciuto mia moglie a Siviglia e nel 2019 ci siamo trasferiti in Basilicata, nel paese in che vive la famiglia di lei."
    errors: [relative-pronoun]
  - tutor: "Una bella storia d'amore, allora! Mi scusi, però: «nel paese in che vive»? Dopo «in», al posto di «che», ci vuole un'altra parola."
    prompt: {text: "nel paese in che vive", tags: [relative-pronoun]}
  - learner: "Sì, nel paese in che vive la famiglia di mia moglie, vicino a Matera. Sono 800 abitanti."
    errors: [relative-pronoun]
  - tutor: "Quindi da una grande città al paese in cui vive la famiglia di sua moglie: 800 abitanti! Dev'essere stato un bel cambiamento. Che cosa è stato più difficile?"
    goals: [story]
    recast: {text: "paese in che vive la famiglia", fix: "paese in cui vive la famiglia", tags: [relative-pronoun]}
  - learner: "All'inizio il silenzio, e poi la burocrazia. Prima di partire credevo che la vita in un paese piccolo era semplice. Invece per aprire il mio forno ho aspettato undici mesi."
    errors: [subjunctive-use]
  - tutor: "Undici mesi! Un attimo, però: «credevo che la vita in un paese piccolo era»? Dopo «credevo che» ci vuole un'altra forma."
    prompt: {text: "credevo che la vita in un paese piccolo era", tags: [subjunctive-use]}
  - learner: "Credevo che la vita in un paese piccolo fosse semplice."
  - tutor: "Esatto. Alla fine, però, il forno l'ha aperto. Dopo questi anni si sente cambiato?"
    goals: [difficulties]
    new: [{lemma: forno, gloss: bakery, oven}]
  - learner: "Moltissimo. Ero un uomo di città, sempre di fretta. Qui ho imparato ad aspettare e a parlare con tutti. Se fossi rimasto a Siviglia, non avrei mai conosciuto il nome dei miei vicini."
  - tutor: "Che bella immagine. Molti ascoltatori sognano di trasferirsi in un piccolo paese come il suo. Che cosa direbbe loro?"
    goals: [change]
  - learner: "Direi di non venire solo per il sole e per il cibo. Bisogna imparare la lingua prima, e avere pazienza con gli uffici. E poi consiglio di entrare subito nella vita del paese: la festa, il bar, la squadra di calcio."
  - tutor: "Lingua, pazienza e una squadra di calcio: mi sembra un ottimo programma. La ringrazio di essere stato con noi, e tanti auguri per il suo forno. Restate con noi, cari ascoltatori: dopo la musica torniamo a parlare di chi ha scelto l'Italia."
    goals: [advice]
    new: [{lemma: forno, gloss: bakery, oven}]

- scenario: vita-in-italia
  level: B2
  persona: en-f-student
  history: [ci-ne]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno e grazie dell'invito. Sono arrivata a Bologna sei anni fa per un master di un anno. Non avevo mai pensato di restare, ma dopo pochi mesi mi ne sono innamorata."
    errors: [combined-pronouns]
  - tutor: "Bologna fa spesso questo effetto! Però ripeta: «mi ne sono innamorata»? Davanti a «ne», la prima parola cambia."
    prompt: {text: "mi ne sono innamorata", tags: [combined-pronouns]}
  - learner: "Me ne sono innamorata, mi scusi."
  - tutor: "Esatto. E dopo l'amore a prima vista, immagino, sono arrivati i problemi. Qual è stata la sfida più grande?"
    goals: [story]
  - learner: "Senza dubbio trovare casa. Come puoi immaginare, nessuno voleva affittare a una straniera senza contratto di lavoro. Ho visto più di 20 appartamenti prima di trovarne uno."
    errors: [register]
  - tutor: "Più di 20, addirittura! Ma «come puoi immaginare»... qui in radio, parlando con me, quale forma si usa?"
    prompt: {text: "Come puoi immaginare", tags: [register]}
  - learner: "Ha ragione, mi scusi: come può immaginare."
  - tutor: "Non si preoccupi, capita a tutti. E in questi sei anni, in che cosa sente di essere cambiata?"
    goals: [difficulties]
  - learner: "Sono diventata più aperta e meno puntuale, purtroppo! Scherzi a parte, prima organizzavo ogni minuto. Qui ho capito che un pranzo di tre ore con gli amici non è tempo perso. Se fossi tornata a Londra dopo il master, oggi sarei una persona più ricca ma più sola."
  - tutor: "Più ricca ma più sola: questa frase farà riflettere molti. E a chi ci ascolta e sogna di trasferirsi qui, che consiglio darebbe?"
    goals: [change]
  - learner: "Di non paragonare tutto al proprio paese, perché così si vive male. E di cercare amici italiani fin dal primo giorno, anche se con gli altri stranieri è più facile. Le abitudini si imparano a tavola, non sui libri."
  - tutor: "«Le abitudini si imparano a tavola»: lo scriveremo sulla porta dello studio! Grazie di cuore per essere stata con noi. E a voi, cari ascoltatori, do appuntamento a domani alla solita ora."
    goals: [advice]

- scenario: film-libro
  level: B2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io, se posso. Ho letto un giallo ambientato in Sicilia negli anni Cinquanta. Un giovane commissario arriva in un paese per un omicidio. Quando è arrivato, tutti hanno saputo già la verità, ma nessuno voleva parlare."
    errors: [tense-aspect]
  - tutor: "Un giallo, bene, non ne leggiamo mai! Ma senti: «tutti hanno saputo già la verità»... era una cosa di un momento, o una situazione che durava?"
    prompt: {text: "tutti hanno saputo già la verità", tags: [tense-aspect]}
    new: [{lemma: giallo, gloss: detective novel}]
  - learner: "Voglio dire che quando è arrivato tutti hanno saputo già chi era l'assassino."
    errors: [tense-aspect]
  - tutor: "Ah, ecco: tutti sapevano già chi era stato, e nessuno apriva bocca. È una situazione classica, ma funziona sempre. E questo commissario che tipo è?"
    goals: [summary]
    recast: {text: "tutti hanno saputo già", fix: "tutti sapevano già", tags: [tense-aspect]}
    new: [{lemma: commissario, gloss: police inspector}]
  - learner: "È un uomo del Nord, chi non capisce il dialetto e si sente sempre fuori posto. È testardo ma onesto, ed è l'unico personaggio di cui mi fidavo."
    errors: [relative-pronoun]
  - tutor: "Mi sta già simpatico. Però «un uomo del Nord, chi non capisce»? In mezzo a una frase così, «chi» non va."
    prompt: {text: "un uomo del Nord, chi non capisce", tags: [relative-pronoun]}
  - learner: "Un uomo del Nord che non capisce il dialetto."
  - tutor: "Esatto. E alla fine il libro ti è piaciuto oppure no? Dalla faccia non si capisce."
    goals: [characters]
  - learner: "A metà. La trama è emozionante fino all'ultimo capitolo, ma il finale mi ha deluso: l'autore lascia tutto aperto. Se avesse scritto dieci pagine in più, sarebbe stato un romanzo perfetto."
  - tutor: "I finali aperti dividono sempre il gruppo, vedrai tra poco. A chi lo daresti da leggere, allora?"
    goals: [opinion]
  - learner: "Lo consiglierei a chi ama la Sicilia e ha pazienza. A chi vuole sapere sempre chi è il colpevole, invece, no."
  - tutor: "Allora io lo leggo, perché di pazienza ne ho. Grazie, ottimo inizio! Adesso sentiamo che cosa ha portato Chiara."
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-f-teacher
  history: [combined-pronouns]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io questo mese ho fatto una cosa diversa: ho riletto un romanzo e poi sono andata a vedere il film al cinema. Racconta di due sorelle che ereditano una vecchia casa sul lago e devono decidere se venderla."
  - tutor: "Libro e film insieme, mi piace l'idea. E la sorella più grande, quella di cui parlano tutti, com'è?"
    goals: [summary]
  - learner: "Si chiama Marta, è una donna dura, che non ha mai perdonato suo padre. Nel libro è un personaggio bellissimo. L'autrice ha vinto un premio importante per questo romanzo: se lo hanno dato l'anno scorso."
    errors: [combined-pronouns]
  - tutor: "Sì, me lo ricordo quel premio. Ma «se lo hanno dato»? In italiano «se lo» qui non funziona: a lei, il premio... come si dice?"
    goals: [characters]
    prompt: {text: "se lo hanno dato", tags: [combined-pronouns]}
  - learner: "Ah, ehm... se lo hanno dato a lei, all'autrice."
    errors: [combined-pronouns]
  - tutor: "Ecco: gliel'hanno dato l'anno scorso, a Torino, e secondo me era meritato. Ma torniamo a te: il film com'era?"
    recast: {text: "se lo hanno dato", fix: "gliel'hanno dato", tags: [combined-pronouns]}
  - learner: "Purtroppo mi ha delusa. Il film non è tanto bello come il libro. Gli attori sono bravi, ma il regista ha tagliato tutta la storia del padre, che per me era la parte più emozionante."
    errors: [comparative]
  - tutor: "Peccato per quel taglio. Però «tanto bello come il libro»... dopo «tanto», al posto di «come» ci vuole un'altra parola."
    prompt: {text: "tanto bello come il libro", tags: [comparative]}
  - learner: "Non è tanto bello quanto il libro."
  - tutor: "Proprio così. Succede spesso, del resto: due ore non bastano per 400 pagine. A chi consiglieresti il romanzo?"
    goals: [opinion]
  - learner: "A chi ha fratelli o sorelle, perché ci si riconosce subito. E consiglio di leggere prima il libro: se avessi visto prima il film, forse non l'avrei mai aperto."
  - tutor: "Ottimo consiglio, lo metto nella lista del mese prossimo. Grazie! Chi vuole parlare adesso?"
    goals: [recommend]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Buonasera. Io faccio le consegne con il furgone e passo in centro tutti i giorni. Eppure sono favorevole alla chiusura, anche se può sembrare strano."
  - tutor: "In effetti mi sorprende, detto da chi guida tutto il giorno. Perché è favorevole?"
    goals: [position]
  - learner: "Per due motivi. Il primo è il traffico: per fare 2 chilometri impiego mezz'ora, e intanto respiriamo tutti quell'aria. Il secondo sono i parcheggi: in centro ci sono pochissimi, quindi lascio il furgone in doppia fila e prendo la multa."
    errors: [ci-ne]
  - tutor: "Le multe le conosco anch'io, purtroppo. Ma «in centro ci sono pochissimi»... pochissimi di che cosa? Lì manca una piccola parola."
    prompt: {text: "in centro ci sono pochissimi", tags: [ci-ne]}
    new: [{lemma: multa, gloss: fine}]
  - learner: "Di parcheggi: in centro ci sono pochissimi, e sono sempre occupati."
    errors: [ci-ne]
  - tutor: "Su questo ha ragione: in centro ce ne sono pochissimi. Ma allora servono più parcheggi, non meno auto! Se chiudiamo, i clienti che vengono da fuori andranno tutti al centro commerciale."
    goals: [argue]
    recast: {text: "in centro ci sono pochissimi", fix: "in centro ce ne sono pochissimi", tags: [ci-ne]}
  - learner: "Non credo. A Pontevedra, in Spagna, hanno chiuso il centro vent'anni fa e i negozi non sono morti, anzi. I commercianti i quali negozi erano vuoti oggi lavorano di più, perché la gente passeggia e si ferma."
    errors: [relative-pronoun]
  - tutor: "Un esempio interessante, non lo conoscevo. Però «i commercianti i quali negozi»? Per dire che i negozi sono dei commercianti, «i quali» non basta."
    prompt: {text: "I commercianti i quali negozi", tags: [relative-pronoun]}
  - learner: "I commercianti i cui negozi erano vuoti."
  - tutor: "Adesso è chiaro. Resta però un problema: mia madre ha 84 anni e abita in via Verdi. Come fa ad andare dal medico, se il taxi non può entrare?"
    goals: [counter]
  - learner: "Su questo ha ragione lei, e bisogna ammetterlo: gli anziani e i malati non possono restare isolati. Proporrei un permesso per i residenti e per i taxi, e la chiusura solo dalle 10 alle 19."
  - tutor: "Con i permessi per i residenti e un orario limitato, potrei anche votare a favore. Lo dica a tutti prima del voto: io sarò dalla sua parte. Non pensavo che stasera avremmo trovato un punto d'accordo."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-f-professional
  history: [pronoun-position]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io invece sono favorevole, soprattutto intorno alle scuole. Porto i miei figli in bici ogni mattina, e in via Roma le auto ci passano a pochi centimetri."
  - tutor: "Capisco la paura per i bambini, ci mancherebbe. Ma per questo basta un vigile davanti alla scuola. Perché chiudere tutto il centro?"
    goals: [position]
    new: [{lemma: vigile, gloss: traffic warden}]
  - learner: "Perché il problema non è solo la sicurezza. C'è l'inquinamento: l'anno scorso abbiamo superato i limiti per 60 giorni. E poi c'è lo spazio: io ho la macchina, ma ho deciso di non la usare più in città, perché a piedi arrivo prima."
    errors: [pronoun-position]
  - tutor: "60 giorni sono tanti, lo ammetto. Ma «di non la usare più»? Quel «la» non può stare lì: dove va?"
    goals: [argue]
    prompt: {text: "di non la usare più", tags: [pronoun-position]}
  - learner: "Ho deciso di non usarla più in città."
  - tutor: "Esatto. Lei però ha pensato a chi abita sopra la piazza, come me? Quando è diventata zona pedonale, sono arrivati i bar e il rumore fino alle 2 di notte. A noi residenti chi ci pensa?"
  - learner: "Il rumore di notte è un problema serio, ma non dipende dalle auto. Si risolve con le regole: orari di chiusura per i locali e controlli veri. A Lubiana hanno fatto così, e ho dei dati molto chiari. Se vuole, le li mando domani."
    errors: [combined-pronouns]
  - tutor: "I dati li leggo volentieri. Però «le li mando»... quando si dà del Lei, quelle due parole si uniscono in un'altra forma."
    goals: [counter]
    prompt: {text: "le li mando", tags: [combined-pronouns]}
  - learner: "Glieli mando domani, mi scusi."
  - tutor: "Perfetto, li aspetto. Ammetta però che per i commercianti sarà dura: chi compra una televisione non la porta a casa a piedi."
  - learner: "Su questo ha ragione: per gli acquisti pesanti serve una soluzione. Propongo di lasciare aperto il parcheggio di piazza Cavour e di chiudere solo le strade intorno alle scuole e alla piazza, per un anno di prova."
  - tutor: "Un anno di prova, con il parcheggio aperto e regole chiare per i locali: così ci posso stare. Mi mandi quei dati e ne parliamo alla prossima riunione. Magari scopriamo di essere meno lontani del previsto."
    goals: [concede]

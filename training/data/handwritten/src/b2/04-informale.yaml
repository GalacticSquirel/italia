- scenario: film-libro
  level: B2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io! Ho letto «L'amica geniale» di Elena Ferrante. Racconta l'amicizia tra due bambine che crescono in un quartiere povero di Napoli negli anni Cinquanta. Non dico altro per non rovinare il finale."
  - tutor: "Ottima scelta, e grazie per non aver raccontato il finale! È un romanzo che molti di noi hanno amato. Chi è secondo te il personaggio più importante?"
    goals: [summary]
  - learner: "Per me è Lila, l'amica che Elena parla per tutto il libro. È intelligentissima e coraggiosa, ma a volte anche crudele."
    errors: [relative-pronoun]
  - tutor: "Certo, è lei il cuore della storia! Però «l'amica che Elena parla» non mi suona bene: si parla «di» qualcuno. Come lo diresti meglio?"
    prompt: {text: "l'amica che Elena parla", tags: [relative-pronoun]}
  - learner: "Giusto: l'amica di cui Elena parla per tutto il libro."
  - tutor: "Perfetto. È un personaggio che resta in testa a lungo. E a te il romanzo è piaciuto? Perché?"
    goals: [characters]
  - learner: "Moltissimo. All'inizio pensavo che fosse una storia semplice, invece l'autrice descrive l'amicizia in modo molto onesto, con l'invidia e la competizione. Mi ha ricordato la mia migliore amica del liceo."
  - tutor: "È vero, è un'amicizia piena di luce e di ombra, come quelle vere. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "Lo consiglierei a chi ama le storie lunghe e i personaggi complicati. Forse non a chi cerca un libro leggero per le vacanze, perché poi bisogna leggere anche gli altri tre!"
  - tutor: "Hai ragione, chi comincia non si ferma più. Grazie, è stata una bella presentazione. Adesso sentiamo chi ha letto qualcosa di diverso."
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io questo mese non ho letto molto, lo confesso, però ho visto un film: «C'è ancora domani» di Paola Cortellesi. È la storia di Delia, una donna che vive a Roma nel 1946 con un marito violento e tre figli."
  - tutor: "Va benissimo anche un film, qui non siamo severi. L'ho visto anch'io, quindi attenzione a non raccontare il finale agli altri! Com'è Delia come personaggio?"
    goals: [summary]
  - learner: "È una donna semplice, che lavora tutto il giorno e non si lamenta mai. Però dentro è forte. Mi ha ricordato mia nonna: quando ero bambino, lei ha lavorato sempre in casa e fuori, senza riposare."
    errors: [tense-aspect]
  - tutor: "Che bel ricordo. Però pensa a «lei ha lavorato sempre»: era un'abitudine di tutti i giorni, no? Come si dice allora?"
    prompt: {text: "lei ha lavorato sempre", tags: [tense-aspect]}
  - learner: "Sì, tutti i giorni. Mia nonna ha lavorato sempre, anche la domenica."
    errors: [tense-aspect]
  - tutor: "Capisco: tua nonna lavorava sempre, proprio come Delia. E il film ti è piaciuto?"
    recast: {text: "nonna ha lavorato sempre", fix: "nonna lavorava sempre", tags: [tense-aspect]}
    goals: [characters]
  - learner: "Tanto. È in bianco e nero, ma non è per niente noioso: fa ridere e fa piangere. L'unico difetto è che è un po' largo, dura quasi due ore."
    errors: [false-friend]
  - tutor: "Sì, forse è un po' lungo, ma a me è passato in fretta. E quel finale è davvero emozionante. A chi lo consiglieresti?"
    recast: {text: "un po' largo", fix: "un po' lungo", tags: [false-friend]}
    goals: [opinion]
  - learner: "A tutti, ma soprattutto ai giovani. Penso che debbano sapere com'era la vita delle loro nonne in quegli anni."
  - tutor: "Sono d'accordo, a scuola dovrebbero farlo vedere. Grazie! La prossima volta però ti aspetto con un libro."
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: en-m-retired
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho finalmente finito «Il nome della rosa» di Umberto Eco. È un giallo ambientato nel Medioevo: un frate inglese arriva in un'abbazia del nord Italia dove i monaci muoiono uno dopo l'altro, e cerca di capire perché."
  - tutor: "Finalmente, dici? Quanto tempo ci hai messo? Comunque hai spiegato bene la trama senza dire troppo. Che tipo è il personaggio principale?"
    goals: [summary]
  - learner: "Ci ho messo due mesi! Guglielmo è un uomo molto logico, quasi un detective moderno. Osserva tutto e non crede alle spiegazioni facili. Mi è piaciuto anche il suo giovane assistente, che racconta la storia."
  - tutor: "Sì, sembra quasi Sherlock Holmes nel Medioevo. E il romanzo, alla fine, ti è piaciuto o è stata una fatica?"
    goals: [characters]
  - learner: "Tutte e due le cose. La trama è emozionante, ma ci sono molte pagine in latino e lunghe discussioni di filosofia. Quelle pagine, lo ammetto, le ho saltato."
    errors: [participle-agreement]
  - tutor: "Non sei il solo, tranquillo! Ma senti: «le ho saltato»? Guarda bene la fine dell'ultima parola."
    prompt: {text: "le ho saltato", tags: [participle-agreement]}
  - learner: "Ah, certo: le ho saltate. Però il finale l'ho letto con molta attenzione!"
  - tutor: "Ecco, bravo. Il finale merita davvero. Senti, a chi consiglieresti un libro così?"
    goals: [opinion]
  - learner: "A chi ha pazienza e ama la storia. Non lo consiglierei a chi vuole solo un giallo veloce: in quel caso è meglio vedere il film con Sean Connery."
  - tutor: "Giusto, il film è più semplice, anche se l'autore non lo amava molto. Grazie! Per il mese prossimo ti prometto un romanzo più corto."
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Ho letto «Le otto montagne» di Paolo Cognetti. Parla di Pietro, un ragazzo di Milano che passa le estati in un paese di montagna e lì conosce Bruno, un ragazzo del posto. Il libro segue la loro amicizia per trent'anni."
  - tutor: "Lo conosco, ha vinto il Premio Strega qualche anno fa. Hai raccontato la trama in poche parole, e senza rovinare niente. Com'è Pietro?"
    goals: [summary]
  - learner: "Pietro è un personaggio inquieto. Da giovane litiga con il padre e poi viaggia molto, ma non trova il suo posto. Bruno invece è il contrario: non si muove mai dalla sua montagna. Credo che Pietro è un po' geloso di lui."
    errors: [subjunctive-use]
  - tutor: "Interessante, questo confronto. Però ascolta: «credo che Pietro è»... Dopo «credo che» ti suona bene quel «è»?"
    prompt: {text: "Credo che Pietro è", tags: [subjunctive-use]}
  - learner: "No, hai ragione: credo che Pietro sia un po' geloso di Bruno."
  - tutor: "Così va benissimo. Anch'io ho avuto questa impressione. E tu che cosa ne pensi del libro?"
    goals: [characters]
  - learner: "Mi è piaciuto molto perché è scritto con una lingua semplice e pulita. Insegno letteratura a Valencia e vorrei che i miei studenti leggessero libri così: brevi, ma pieni di silenzi che dicono molto. Solo il finale mi è sembrato troppo triste."
  - tutor: "Triste sì, ma secondo me è l'unico finale possibile. Lo faresti leggere ai tuoi studenti, allora?"
    goals: [opinion]
  - learner: "Sì, a quelli più grandi. E lo consiglierei a chiunque ami camminare in montagna, o abbia un vecchio amico che non vede da tempo."
  - tutor: "Allora devo regalarlo a mio fratello, che vive in Valle d'Aosta. Grazie, adesso lo vogliamo leggere tutti."
    goals: [recommend]

- scenario: riunione-lavoro
  level: B2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Il nuovo sito per l'hotel di Verona è quasi pronto: la grafica è finita e abbiamo già caricato le foto. Manca solo la pagina delle prenotazioni."
  - tutor: "Ottimo, siete più avanti di quanto pensassi. La pagina delle prenotazioni quando sarà pronta?"
    goals: [update]
  - learner: "Ecco, qui c'è un problema. Il cliente doveva mandarci i prezzi e i testi in inglese due settimane fa, ma non abbiamo ricevuto niente. Gli ho scritto tre volte."
  - tutor: "Tre volte senza risposta? Non va bene, così il ritardo diventa colpa nostra. Tu cosa proponi?"
    goals: [problem]
  - learner: "Proporrei di telefonare direttamente al direttore dell'hotel. Se lui ci manderebbe tutto entro domani, potremmo finire senza ritardo."
    errors: [hypothetical]
  - tutor: "Buona idea, lo chiamo io oggi stesso. Ma ripeti un attimo: «se lui ci manderebbe»? Dopo «se» quella forma non funziona."
    prompt: {text: "Se lui ci manderebbe", tags: [hypothetical]}
    goals: [proposal]
  - learner: "Scusa: se lui ci mandasse tutto entro domani, potremmo finire in tempo."
  - tutor: "Esatto. E se invece non risponde nemmeno a me, che cosa facciamo?"
  - learner: "In quel caso metterei dei testi provvisori in italiano e li sostituirei dopo. Così il sito potrebbe andare online lo stesso."
  - tutor: "Mi piace, così non perdiamo altro tempo. Allora che scadenza ci diamo per la consegna?"
  - learner: "Direi venerdì 14. Se i testi arrivano domani, giovedì facciamo le ultime prove e venerdì mattina consegniamo."
  - tutor: "Va bene, venerdì 14 entro mezzogiorno. Io sento il direttore subito dopo la riunione e ti faccio sapere. Grazie, ottimo lavoro."
    goals: [deadline]

- scenario: riunione-lavoro
  level: B2
  persona: es-m-worker
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Insomma, così così. Abbiamo installato il nuovo programma per gli ordini in magazzino e la metà dei colleghi lo usa già. Gli altri cominciano dopo il corso di domani."
  - tutor: "Bene, allora siamo a metà strada. Ci sono state difficoltà in questi giorni?"
    goals: [update]
  - learner: "Sì, una abbastanza seria. Il programma non legge bene i codici dei prodotti vecchi, quindi ogni giorno dobbiamo correggere a mano una trentina di ordini. Si perde più o meno un'ora."
  - tutor: "Un'ora al giorno è tanto, e prima o poi i clienti lo notano. Hai già un'idea per risolvere?"
    goals: [problem]
  - learner: "Ho parlato con l'azienda che ha fatto il programma. Dicono che è un errore loro e che il tecnico venirà giovedì per sistemarlo."
    errors: [future-form]
  - tutor: "Meno male che lo ammettono. Ma senti: il tecnico «venirà»? Questa forma del futuro è un po' strana, riprova."
    prompt: {text: "il tecnico venirà", tags: [future-form]}
  - learner: "Sì, venirà giovedì mattina. E nel frattempo proporrei di mettere una persona in più a controllare gli ordini."
    errors: [future-form]
  - tutor: "D'accordo: il tecnico verrà giovedì, e fino ad allora mettiamo una persona in più. Chiedi a Marta, questa settimana è più libera. Quando sarà tutto a posto, secondo te?"
    recast: {text: "venirà giovedì", fix: "verrà giovedì", tags: [future-form]}
    goals: [proposal]
  - learner: "Se giovedì il tecnico risolve tutto, venerdì facciamo le prove. Direi che per lunedì prossimo il programma funzionerà senza problemi."
  - tutor: "Lunedì prossimo, allora: lo segno come scadenza. Se giovedì qualcosa non funziona, lo voglio sapere subito. Grazie, a dopo."
    goals: [deadline]

- scenario: riunione-lavoro
  level: B2
  persona: en-m-heritage
  history: [conditional-form, subjunctive-use]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, direi. Per la fiera di Bologna abbiamo già prenotato lo spazio e l'albergo per sei persone. Ho anche preparato il programma degli incontri con i clienti."
  - tutor: "Perfetto, sei stato veloce. E il materiale da portare, a che punto è?"
    goals: [update]
  - learner: "Qui c'è un problema. I cataloghi nuovi dovevano arrivare ieri, ma la tipografia ne ha stampati solo la metà. Penso che hanno sbagliato l'ordine."
    errors: [subjunctive-use]
  - tutor: "Solo la metà? Brutta notizia. Però attento: «penso che hanno sbagliato»... dopo «penso che» ci vuole un'altra forma, ricordi?"
    prompt: {text: "Penso che hanno sbagliato", tags: [subjunctive-use]}
  - learner: "Vero: penso che abbiano sbagliato l'ordine. Noi ne avevamo chiesti 2000."
  - tutor: "Giusto. 2000 copie ci servono tutte, la fiera è il nostro momento più importante. Come pensi di risolvere?"
    goals: [problem]
  - learner: "Poterei chiamare un'altra tipografia qui a Milano, che lavora anche di sabato. Costa un po' di più, ma stampa in due giorni."
    errors: [conditional-form]
  - tutor: "L'idea mi piace. Ma «poterei» non esiste, sai? Come si dice, invece?"
    prompt: {text: "Poterei chiamare", tags: [conditional-form]}
  - learner: "Potrei chiamare un'altra tipografia, scusa. A casa mia si parlava italiano, ma certe forme le invento ancora!"
  - tutor: "Succede, e parli benissimo. Va bene, chiama pure, pagheremo qualcosa in più. Entro quando possiamo avere tutto in ufficio?"
    goals: [proposal]
  - learner: "Se li chiamo oggi, mercoledì avremo tutte le copie. La fiera comincia venerdì, quindi restano due giorni per preparare le scatole."
  - tutor: "Allora la scadenza è mercoledì sera, non un giorno di più. Poi mi dici com'è andata la telefonata. Grazie!"
    goals: [deadline]

- scenario: riunione-lavoro

- scenario: smartworking
  level: B2
  persona: en-m-traveller
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, ma «casa» è una parola grande: lavoro per un'azienda di Londra e ogni due o tre mesi cambio città. Adesso sono a Palermo, il mese scorso ero a Lisbona. Mi bastano il computer e una buona connessione."
  - tutor: "Che fortuna! Io sono cinque giorni su cinque in ufficio a Milano. E ti trovi bene così?"
    goals: [situation]
  - learner: "Molto. Il vantaggio più grande è la libertà: ho un orario flessibile, posso lavorare la mattina presto e andare al mare il pomeriggio. E poi mi concentro meglio a casa di in ufficio."
    errors: [comparative]
  - tutor: "Il mare di pomeriggio... non me lo dire! Ma aspetta: «meglio a casa di in ufficio»? Tra due posti quel «di» non va."
    prompt: {text: "meglio a casa di in ufficio", tags: [comparative]}
  - learner: "Sì, meglio a casa di in ufficio, perché in ufficio tutti parlavano e squillava sempre il telefono."
    errors: [comparative]
  - tutor: "Ah, ti capisco: anch'io mi concentro meglio a casa che in ufficio, quando mi lasciano. Ma non c'è proprio nessuno svantaggio?"
    recast: {text: "meglio a casa di in ufficio", fix: "meglio a casa che in ufficio", tags: [comparative]}
    goals: [pros]
  - learner: "Certo che c'è. I colleghi li vedo solo sullo schermo e a volte mi sento solo. E poi ogni volta devo cercare un appartamento, capire dove fare la spesa, ricominciare da zero."
  - tutor: "Eh, immagino, non è tutto mare e sole. Se potessi scegliere, continueresti così per sempre?"
    goals: [cons]
  - learner: "Per sempre no. Preferirei avere una base fissa, magari proprio in Sicilia, e viaggiare solo due o tre mesi all'anno. Così avrei degli amici veri e non solo dei vicini di casa temporanei."
  - tutor: "Mi sembra un bel piano. Intanto, finché sei a Palermo, ti vengo a trovare un fine settimana!"
    goals: [preference]

- scenario: smartworking
  level: B2
  persona: es-f-teacher
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Io sono tornata a scuola da tempo, ma non del tutto: insegno spagnolo in un liceo di Torino tre giorni alla settimana, e gli altri due faccio lezioni online da casa per una scuola privata."
  - tutor: "Ah, quindi fai tutte e due le cose. Io invece sono tornato in ufficio a tempo pieno. Cosa ti piace delle lezioni da casa?"
    goals: [situation]
  - learner: "Il vantaggio principale è il tempo: non devo prendere il tram alle sette e posso organizzare l'orario come voglio. Inoltre gli studenti adulti online sono molto motivati, perché hanno scelto loro di studiare."
  - tutor: "Niente tram alle sette, ti capisco bene. Però davanti a uno schermo tutto il giorno non ti stanchi?"
    goals: [pros]
  - learner: "Sì, ed è proprio questo lo svantaggio. Dopo quattro ore mi fanno male gli occhi, e non riesco a capire se uno studente è confuso o annoiato. In classe invece lo vedo subito dalla faccia. E mi manca il caffè con i colleghi."
  - tutor: "Il caffè con i colleghi è la parte migliore della giornata, su questo non si discute. Se dovessi scegliere una sola delle due cose, quale terresti?"
    goals: [cons]
  - learner: "Terrei la scuola, senza dubbio. Preferirei guadagnare un po' meno ma stare con i ragazzi, perché insegnare per me è soprattutto un rapporto tra persone. Però un giorno da casa alla settimana lo vorrei sempre."
  - tutor: "Quindi quattro giorni in classe e uno a casa: non mi sembra male per niente. Alla salute dei tuoi studenti, allora!"
    goals: [preference]

- scenario: smartworking
  level: B2
  persona: en-f-student
  history: [auxiliary-choice]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Un po' e un po'. Faccio uno stage in uno studio di architettura a Bologna: il lunedì e il mercoledì vado in ufficio, gli altri giorni lavoro dalla mia stanza, che è anche la mia camera da letto."
  - tutor: "Dalla camera da letto, come tutti noi qualche anno fa! E come ti trovi nei giorni a casa?"
    goals: [situation]
  - learner: "Bene, per certe cose. Risparmio tempo e soldi, perché l'autobus per l'ufficio ci mette quasi un'ora. E la settimana scorsa ho riuscita a finire un progetto intero in due giorni, senza nessuna interruzione."
    errors: [auxiliary-choice]
  - tutor: "Un progetto in due giorni, brava! Però aspetta: «ho riuscita»? Qui quel «ho» non va bene, riprova."
    prompt: {text: "ho riuscita a finire", tags: [auxiliary-choice]}
  - learner: "Sono riuscita a finire un progetto intero, giusto. Con «riuscire» sbaglio sempre."
  - tutor: "Adesso sì. Quindi a casa lavori di più e spendi di meno. E gli svantaggi, ci sono?"
    goals: [pros]
  - learner: "Purtroppo sì. Sono l'ultima arrivata e ho ancora molto da imparare, ma da casa è difficile fare domande: devo scrivere un messaggio e aspettare. In ufficio basta girarsi verso un collega. E poi a casa non stacco mai, lavoro anche alle dieci di sera."
  - tutor: "Questo è un rischio vero, soprattutto all'inizio. Quando finisci lì, che tipo di lavoro vorresti?"
    goals: [cons]
  - learner: "Preferirei un lavoro quasi sempre in ufficio, almeno per i primi anni, perché si impara guardando gli altri. Più avanti, quando avrò più esperienza, mi piacerebbe un orario flessibile con due giorni a casa."
  - tutor: "Ragioni già come una che sa cosa vuole. Prima impari dai colleghi, poi ti prendi la libertà. Prendiamo ancora qualcosa da bere?"
    goals: [preference]

- scenario: smartworking

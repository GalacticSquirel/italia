# w-register, file 06: C1 pitches, negotiations, podcasts, news, books, idioms, radio phone-ins.
- scenario: presentazione-progetto
  level: C1
  persona: en-f-professional
  history: [register, hypothetical]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Certo. In poche parole, propongo di sviluppare un'app per gli ordini dei clienti: attualmente perdiamo molti ordini per errori di trascrizione."
    - tutor: "Un'app. Ne abbiamo già viste fallire tre. Che cosa cambia stavolta?"
      goals: [pitch]
    - learner: "Questa volta i numeri sono chiari: se la usasse anche solo la metà dei clienti, risparmieremo circa il quindici per cento sui costi di gestione."
      errors: [hypothetical]
    - tutor: "Se la usasse... risparmieremo? Nella seconda parte dell'ipotesi, il tempo verbale mi convince poco."
      prompt: {text: "risparmieremo", tags: [hypothetical]}
    - learner: "Cioè... risparmiamo circa il quindici per cento sui costi di gestione, e il fatturato crescerebbe grazie ai clienti esteri."
      errors: [hypothetical]
    - tutor: "Risparmieremmo il quindici per cento, dice lei: non è poco, lo ammetto. Ma il budget? E se il progetto si blocca a metà?"
      recast: {text: "risparmiamo", fix: "risparmieremmo", tags: [hypothetical]}
      goals: [benefits]
    - learner: "Il budget è di centoventimila euro, in tre fasi: se la prima non dà risultati, ci fermiamo. E comunque, le storie sui progetti falliti sono tutte balle: erano gestiti male."
      errors: [register]
    - tutor: "«Sono tutte balle»? Guardi che sta parlando con chi quei progetti li ha approvati."
      prompt: {text: "sono tutte balle", tags: [register]}
    - learner: "Mi scusi, mi sono espressa male. Intendevo dire che quei progetti avevano problemi di gestione che oggi abbiamo imparato a evitare."
    - tutor: "Così la ascolto più volentieri. Una sperimentazione in tre fasi riduce il rischio, d'accordo."
      goals: [objection]
    - learner: "Allora le propongo di approvare oggi la prima fase e di rivederci tra due mesi con i primi dati."
    - tutor: "D'accordo per la prima fase. Mi mandi il piano dettagliato entro venerdì, e sia spietata con i numeri."
      goals: [next-steps]

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [register, word-choice]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per il listino: un aumento del dodici per cento è un colpo durissimo per un'azienda piccola come la nostra."
    - tutor: "Lo capisco, ma le assicuro che finora una buona parte dell'aumento l'abbiamo assorbita noi."
      goals: [problem]
    - learner: "Lavoriamo insieme da otto anni e abbiamo sempre pagato puntuali. Credo che questo debba contare qualcosa."
      errors: [word-choice]
    - tutor: "Avete sempre pagato puntualmente, è vero, e lo apprezziamo molto. Ma il listino vale per tutti i clienti."
      recast: {text: "pagato puntuali", fix: "pagato puntualmente", tags: [word-choice]}
      goals: [argue]
    - learner: "Allora le faccio una proposta: accettereste un aumento del cinque per cento se raddoppieremmo l'ordine minimo?"
      errors: [hypothetical]
    - tutor: "Interessante. Ma «se raddoppieremmo»? Riguardi con calma la parte con il «se»."
      prompt: {text: "se raddoppieremmo", tags: [hypothetical]}
    - learner: "Se raddoppiassimo l'ordine minimo, accettereste un aumento del cinque per cento?"
    - tutor: "Con l'ordine doppio potrei arrivare al sette per cento, ma non sotto."
      goals: [counteroffer]
    - learner: "Sette per cento... Dai, fammi un favore: facciamo sei e chiudiamo."
      errors: [register]
    - tutor: "«Fammi un favore»? Da quando siamo passati al tu?"
      prompt: {text: "fammi un favore", tags: [register]}
    - learner: "Mi scusi. Mi faccia questa cortesia: facciamo sei per cento e chiudiamo l'accordo."
    - tutor: "E va bene: sei per cento, ordine minimo raddoppiato e pagamento a trenta giorni. Le mando il contratto aggiornato oggi stesso."
      goals: [agreement]
    - learner: "Perfetto. Mi raccomando, metta per iscritto anche la consegna entro cinque giorni lavorativi."
    - tutor: "Sarà tutto nero su bianco. È stato un piacere trattare con lei, anche se mi ha strappato un punto."

- scenario: intervista-podcast
  level: C1
  persona: en-m-heritage
  history: [register, false-friend]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "La ringrazio infinitamente per il gentile invito, è un vero onore."
      errors: [register]
    - tutor: "Ah ah, «la ringrazio infinitamente»? Qui nel podcast ci diamo tutti del tu, rilassati!"
      prompt: {text: "La ringrazio infinitamente", tags: [register]}
    - learner: "Va bene: grazie a te per l'invito! Sono venuto perché mio nonno era di Lecce, e volevo conoscere le mie radici."
    - tutor: "Che bella storia. E una volta qui, che cosa ti ha sorpreso di più?"
      goals: [story]
    - learner: "Gli orari dei pasti! A Boston ceniamo alle sei, qui alle nove. I primi mesi chiedevo sempre uno spuntino alle sette, e i miei parenti pensavano che fossi un po' rude."
      errors: [false-friend]
    - tutor: "Maleducato, tu? Ma no, avevi solo fame! E c'è qualcosa che proprio non ti va giù?"
      recast: {text: "rude", fix: "maleducato", tags: [false-friend]}
      goals: [culture-shock]
    - learner: "Beh, la burocrazia italiana è una merda, scusa la parola."
      errors: [register]
    - tutor: "Ah ah, siamo in onda, eh! Prova a dirlo in un modo che possano ascoltare anche i bambini."
      prompt: {text: "è una merda", tags: [register]}
    - learner: "Hai ragione. Diciamo che la burocrazia italiana mette alla prova la pazienza di chiunque."
    - tutor: "Detto così, è perfetto! Hai un esempio?"
      goals: [critique]
    - learner: "Per il permesso di soggiorno ho aspettato otto mesi. Ma quando finalmente l'ho ritirato, l'impiegata mi ha fatto le congratulazioni come se mi fossi laureato!"
    - tutor: "Solo in Italia! Ultima domanda: che consiglio daresti a chi sta pensando di trasferirsi qui?"
    - learner: "Gli consiglierei di imparare la lingua prima di partire, e di non prendere niente sul personale: gli italiani sono più accoglienti di quanto sembri all'inizio."
    - tutor: "Parole sante. Grazie mille, è stato un piacere averti qui!"
      goals: [advice]

- scenario: notizie-attualita
  level: C1
  persona: es-f-erasmus
  history: [register, word-choice, subjunctive-use]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho letta su tre periodici diversi. In breve, il comune vuole limitare gli affitti brevi nel centro storico, perché i residenti non trovano più casa."
      errors: [false-friend]
    - tutor: "Esatto, e tutti i giornali ne parlano. E tu che ne pensi? Io temo che sia solo propaganda."
      recast: {text: "periodici", fix: "giornali", tags: [false-friend]}
      goals: [summarise]
    - learner: "Secondo me è una misura necessaria, anche se non basta. Bisogna che il comune costruisce anche nuove case popolari."
      errors: [subjunctive-use]
    - tutor: "Bisogna che il comune... costruisce? Dopo «bisogna che», ti suona davvero bene?"
      prompt: {text: "costruisce", tags: [subjunctive-use]}
    - learner: "Bisogna che costruisca anche nuove case popolari, altrimenti i prezzi non scenderanno mai."
    - tutor: "Su questo hai ragione. Ma hai notato come l'hanno raccontata i giornali?"
      goals: [opinion]
    - learner: "Sì, è curioso: un giornale titolava «Guerra ai proprietari», un altro «Finalmente case per tutti». Il primo era più sensazionalista, ma i dati erano gli stessi."
    - tutor: "Stessa notizia, due mondi. E secondo te che cosa succederà adesso?"
      goals: [sources]
    - learner: "Vale, è difficile dirlo, ma credo che molti proprietari tornerebbero agli affitti lunghi, se le tasse fossero più basse."
      errors: [word-choice]
    - tutor: "Va bene, può darsi. Oppure venderanno tutto e se ne andranno."
      recast: {text: "Vale", fix: "Va bene", tags: [word-choice]}
      goals: [consequences]
    - learner: "È possibile. In ogni caso è una notizia che meriterebbe un approfondimento serio, non solo titoli urlati."
    - tutor: "Su questo siamo d'accordo. Ne riparliamo a pranzo?"

- scenario: club-lettura
  level: C1
  persona: en-f-professional
  history: [register, hypothetical]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, l'ho finito ieri notte! A me è piaciuto moltissimo, anche se l'inizio è un po' lento."
    - tutor: "Lento? Io direi «preparatorio». E la protagonista, come l'hai trovata?"
      goals: [impression]
    - learner: "Secondo me Clara ha sbagliato a lasciare il marito senza spiegazioni. Se gli avrebbe parlato, forse si sarebbero salvati."
      errors: [hypothetical]
    - tutor: "«Se gli avrebbe parlato»? Nell'ipotesi sul passato, dopo il «se» quel tempo non regge."
      prompt: {text: "Se gli avrebbe parlato", tags: [hypothetical]}
    - learner: "Se gli aveva parlato, forse si sarebbero salvati."
      errors: [hypothetical]
    - tutor: "Se gli avesse parlato... può darsi. Ma io credo che lei non avesse più niente da dirgli. E lo stile?"
      recast: {text: "Se gli aveva parlato", fix: "Se gli avesse parlato", tags: [hypothetical]}
      goals: [character]
    - learner: "Lo stile è asciutto, quasi giornalistico: frasi brevi, pochissimi aggettivi. Mi ha ricordato certi romanzi americani."
    - tutor: "Anche a me. E lo consiglieresti?"
      goals: [style]
    - learner: "Sì, a chi ama i romanzi psicologici. Domani c'è l'incontro con l'autrice e voglio dirle: «Ciao, il tuo libro mi ha fatto piangere.»"
      errors: [register]
    - tutor: "«Ciao, il tuo»? Ha settant'anni e non l'hai mai vista: le daresti davvero del tu?"
      prompt: {text: "Ciao, il tuo libro", tags: [register]}
    - learner: "Hai ragione. Allora: «Buongiorno, il tuo libro mi ha fatto piangere.»"
      errors: [register]
    - tutor: "Ecco, dille pure che il suo libro ti ha fatto piangere: sarà il complimento più bello della serata."
      recast: {text: "il tuo libro", fix: "il suo libro", tags: [register]}
      goals: [recommend]
    - learner: "Speriamo! Mi accompagni anche tu all'incontro?"
    - tutor: "Certo, ci vediamo alle sei davanti alla libreria."

- scenario: modi-di-dire
  level: C1
  persona: es-m-worker
  history: [register, tense-aspect]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Prima ho perso il treno, poi mi sono rovesciato il caffè sulla camicia, e alla fine sono arrivato in ritardo alla riunione con il cliente."
    - tutor: "Ah, piove sul bagnato! E il capo?"
      goals: [tell]
    - learner: "Piove sul bagnato, esatto! Sono entrato e gli ho detto: «Scusa il ritardo, ho avuto un problema col treno.»"
      errors: [register]
    - tutor: "Fermo, fermo: al capo hai detto «scusa»? Ma vi date del tu?"
      prompt: {text: "Scusa il ritardo", tags: [register]}
      goals: [react]
    - learner: "No, no, gli do del lei. Gli ho detto: «Mi scusi per il ritardo»... ma ero così agitato!"
    - tutor: "Meno male! E di chi era la colpa, alla fine? Del treno o tua?"
    - learner: "Un po' del treno e un po' mia: la sveglia non ha suonato perché il telefono è stato scarico tutta la notte."
      errors: [tense-aspect]
    - tutor: "È stato scarico? Qui descrivi una situazione, lo sfondo della scena..."
      prompt: {text: "è stato scarico", tags: [tense-aspect]}
    - learner: "Perché il telefono fu scarico?"
      errors: [tense-aspect]
    - tutor: "Ah, il telefono era scarico: classico! Allora la colpa è un po' tua e un po' della tecnologia."
      recast: {text: "fu scarico", fix: "era scarico", tags: [tense-aspect]}
      goals: [blame]
    - learner: "Però alla fine è andata bene: il cliente era più in ritardo di me! Come si dice... non tutti i mali vengono per nuocere?"
    - tutor: "Bravissimo, proprio così! Hai visto? La morale te la sei trovata da solo."
      goals: [moral]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-f-teacher
  history: [register, hypothetical]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, ma secondo me esageri: l'intelligenza artificiale cambierà molti lavori, non li cancellerà."
    - tutor: "Dici così perché fai l'insegnante. A te chi ti sostituisce?"
      goals: [position]
    - learner: "Anzi, la uso già tutti i giorni! Per esempio, mi aiuta a scrivere le email ai genitori. Senti questa: «Cari genitori, la gita è spostata a venerdì. Baci, Carmen.»"
      errors: [register]
    - tutor: "«Baci, Carmen»? Ai genitori dei tuoi alunni? Spero che la macchina te l'abbia fatto notare!"
      prompt: {text: "Baci, Carmen", tags: [register]}
      goals: [evidence]
    - learner: "Ah ah. Allora «Un abbraccio, Carmen»?"
      errors: [register]
    - tutor: "Ancora troppo affettuoso! Io chiuderei con «Cordiali saluti»: con i genitori è la scelta sicura. Comunque il tuo esempio regge."
      recast: {text: "Un abbraccio", fix: "Cordiali saluti", tags: [register]}
    - learner: "Però ammetto che ci sono dei rischi: se gli studenti la userebbero per fare i compiti, non imparerebbero niente."
      errors: [hypothetical]
    - tutor: "Aspetta: «se la userebbero»? Questa te la correggerebbe pure la macchina!"
      prompt: {text: "se gli studenti la userebbero", tags: [hypothetical]}
    - learner: "Se gli studenti la usavano per fare i compiti, non imparerebbero niente."
      errors: [hypothetical]
    - tutor: "Ecco: se la usassero per fare i compiti, sarebbe un disastro. Almeno su questo siamo d'accordo."
      recast: {text: "la usavano", fix: "la usassero", tags: [hypothetical]}
      goals: [concede]
    - learner: "Per questo bisogna formare gli insegnanti, non vietare la tecnologia. Insomma, il problema non è la macchina, ma come la usiamo."
    - tutor: "Va bene, mi hai quasi convinto. Diciamo che il futuro dipende da noi."
      goals: [conclude]

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  history: [register, conditional-form]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Ciao bello! Sono Peter, vivo a Venezia da vent'anni e sono a favore del ticket."
      errors: [register]
    - tutor: "«Ciao bello»? Grazie del complimento, ma siamo in onda: ripartiamo con un saluto per tutti gli ascoltatori?"
      prompt: {text: "Ciao bello", tags: [register]}
    - learner: "Mi scusi! Buongiorno a lei e a tutti gli ascoltatori. Sono Peter, vivo a Venezia da vent'anni e sono a favore del ticket."
    - tutor: "Benvenuto, Peter. A favore, quindi. Ma perché?"
      goals: [introduce]
    - learner: "Perché il centro storico è sovraffollato: d'estate arrivano fino a centomila persone al giorno, e i residenti non riescono neanche a salire sul vaporetto."
    - tutor: "Ma il ticket non rischia di trasformare la città in un museo a pagamento?"
      goals: [example]
    - learner: "Capisco l'obiezione, ma la città è già un museo, solo che non lo paga nessuno. I soldi del ticket potessero servire per i servizi dei residenti."
      errors: [conditional-form]
    - tutor: "«Potessero servire»? Qui lei fa una proposta concreta, non esprime un desiderio..."
      prompt: {text: "potessero servire", tags: [conditional-form]}
    - learner: "Cioè... i soldi possano servire per i servizi dei residenti?"
      errors: [conditional-form]
    - tutor: "Potrebbero servire per le scuole e i trasporti, dice lei: un argomento solido. E se fosse il sindaco, che cosa farebbe?"
      recast: {text: "possano servire", fix: "potrebbero servire", tags: [conditional-form]}
      goals: [rebut]
    - learner: "Metterei un numero massimo di visitatori al giorno, con prenotazione obbligatoria, e lascerei entrare gratis chi dorme in città."
    - tutor: "Proposta chiara e concreta. Grazie, Peter, e buona giornata!"
      goals: [proposal]

# w-register, file 05: B2 debates, radio, friends (too formal or too blunt), C1 mediation and complaints.
- scenario: dibattito-ambiente
  level: B2
  persona: en-f-professional
  history: [register, subjunctive-use]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Ma che dici? È una stupidaggine: la zona pedonale aiuta i negozi."
      errors: [register]
    - tutor: "«Che dici»? Non ci conosciamo, siamo a un incontro pubblico... e mi dà anche dello stupido?"
      prompt: {text: "che dici", tags: [register]}
    - learner: "Mi scusi, mi sono scaldata. Non sono d'accordo con lei: secondo me la zona pedonale aiuta i negozi."
    - tutor: "Scuse accettate. Ma mi spieghi perché: i clienti come arrivano, senza parcheggio?"
      goals: [position]
    - learner: "Nelle città dove hanno chiuso il centro, eventualmente i commercianti hanno guadagnato di più. E poi l'inquinamento diminuisce."
      errors: [false-friend]
    - tutor: "Alla fine ci hanno guadagnato, dice? Sarà. Ma qui gli autobus passano ogni mezz'ora: gli anziani come fanno?"
      recast: {text: "eventualmente", fix: "Alla fine", tags: [false-friend]}
      goals: [argue]
    - learner: "È vero che i mezzi pubblici non bastano. Però è necessario che il comune aumenta le corse prima di chiudere."
      errors: [subjunctive-use]
    - tutor: "È necessario che il comune... aumenta? Dopo «è necessario che», quel modo non va."
      prompt: {text: "aumenta", tags: [subjunctive-use]}
    - learner: "È necessario che il comune aumentasse le corse prima di chiudere."
      errors: [subjunctive-use]
    - tutor: "Che il comune aumenti le corse prima di chiudere... su questo siamo d'accordo, almeno."
      recast: {text: "aumentasse", fix: "aumenti", tags: [subjunctive-use]}
      goals: [counter]
    - learner: "Allora propongo una cosa: cominciamo con la chiusura solo nel fine settimana, e intanto aggiungiamo navette gratuite."
    - tutor: "Una prova nel fine settimana... mi sembra una soluzione ragionevole. Lo proponiamo insieme al sindaco?"
      goals: [concede]
      new: [{lemma: navetta, gloss: shuttle bus}]
    - learner: "Volentieri. E la ringrazio per la pazienza."
    - tutor: "Ma si figuri, è stato un piacere discutere con lei."

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [register, word-choice]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Ciao e grazie a te per l'invito! Ho scelto l'Italia per amore: mia moglie è di Bari."
      errors: [register]
    - tutor: "Che bella ragione! Però «grazie a te»... siamo in diretta e ci siamo appena conosciuti!"
      prompt: {text: "grazie a te", tags: [register]}
    - learner: "Ha ragione: grazie a lei per l'invito!"
    - tutor: "Si figuri! E qual è stata la cosa più difficile, all'inizio?"
      goals: [story]
    - learner: "La burocrazia, senza dubbio. Per il permesso di soggiorno ho fatto la coda tre volte, perché ogni volta mancava un papel."
      errors: [word-choice]
    - tutor: "Mancava sempre un documento: la storia di tanti ascoltatori! E lei, come è cambiato in questi anni?"
      recast: {text: "un papel", fix: "un documento", tags: [word-choice]}
      goals: [difficulties]
    - learner: "Quando sono arrivato ero sempre nervoso. Ora sono più paziente, e gesticolo quando parlo, come un italiano di verità!"
      errors: [word-choice]
    - tutor: "Ah ah, allora ormai è un italiano vero! Che consiglio darebbe a chi vuole trasferirsi qui?"
      recast: {text: "un italiano di verità", fix: "un italiano vero", tags: [word-choice]}
      goals: [change]
    - learner: "Gli direi di imparare bene la lingua prima di venire, e di non arrabbiarsi con gli uffici: tanto non serve!"
    - tutor: "Un consiglio saggio, e molto vero. Grazie di essere stato con noi!"
      goals: [advice]

- scenario: smartworking
  level: B2
  persona: en-m-heritage
  history: [register, comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Vado in ufficio tutti i giorni, purtroppo. Ma vorrei chiedere al mio capo di lavorare da casa il venerdì."
    - tutor: "Fai bene! E perché proprio il venerdì?"
      goals: [situation]
    - learner: "Perché il venerdì abbiamo poche riunioni, e a casa sono più concentrato che in ufficio."
    - tutor: "Ha senso. Pensa bene a cosa scrivere al capo, allora."
    - learner: "Ecco il messaggio: «Dottor Ferri, da lunedì lavoro da casa il venerdì.»"
      errors: [register]
    - tutor: "Mmm, così non è una richiesta, è un annuncio! Se fossi il tuo capo, mi offenderei un po'."
      prompt: {text: "da lunedì lavoro da casa il venerdì", tags: [register]}
    - learner: "Hai ragione. «Dottor Ferri, sarebbe possibile lavorare da casa il venerdì? Risparmierei due ore di treno.»"
    - tutor: "Perfetto, così ti dice di sì di sicuro. E gli svantaggi? Non ti mancano i colleghi?"
      goals: [pros]
    - learner: "Un po' sì. A casa mi sento più solo che prima, e a volte lavoro fino a tardi."
      errors: [comparative]
    - tutor: "Più solo... che prima? Con «prima», il confronto vuole un'altra piccola parola."
      prompt: {text: "più solo che prima", tags: [comparative]}
    - learner: "Più solo come prima?"
      errors: [comparative]
    - tutor: "Ti senti più solo di prima, è normale: succede a molti. E alla fine, cosa preferiresti?"
      recast: {text: "più solo come prima", fix: "più solo di prima", tags: [comparative]}
      goals: [cons]
    - learner: "Se potrei scegliere, farei tre giorni in ufficio e due a casa."
      errors: [hypothetical]
    - tutor: "Se potrei? Dopo «se» quella forma non va."
      prompt: {text: "Se potrei", tags: [hypothetical]}
    - learner: "Se potessi scegliere, farei tre giorni in ufficio e due a casa. Così vedrei i colleghi senza stancarmi troppo."
    - tutor: "La soluzione perfetta! Fammi sapere cosa risponde il capo."
      goals: [preference]

- scenario: film-libro
  level: B2
  persona: es-f-erasmus
  history: [register, relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Se permette, comincio io. Ho letto «L'amica geniale» di Elena Ferrante."
      errors: [register]
    - tutor: "Se permette? Qui al club ci diamo tutti del tu, eh!"
      prompt: {text: "Se permette", tags: [register]}
    - learner: "Ah, è vero! Se permetti, comincio io."
    - tutor: "Certo, vai! Di che cosa parla, senza dire troppo?"
    - learner: "Parla di due amiche che crescono a Napoli negli anni Cinquanta. Una è molto intelligente ma non può continuare a studiare, l'altra sì."
    - tutor: "Brava, e non hai detto troppo! E il personaggio principale com'è?"
      goals: [summary]
    - learner: "Il personaggio che mi sono innamorata è Lila: è ribelle, difficile, ma geniale."
      errors: [relative-pronoun]
    - tutor: "Il personaggio... che mi sono innamorata? Ci si innamora «di» qualcuno: cosa cambia nel pronome?"
      prompt: {text: "Il personaggio che", tags: [relative-pronoun]}
    - learner: "Il personaggio a cui mi sono innamorata?"
      errors: [relative-pronoun]
    - tutor: "Ah, il personaggio di cui ti sei innamorata è Lila! Si capisce, non si dimentica facilmente."
      recast: {text: "Il personaggio a cui", fix: "il personaggio di cui", tags: [relative-pronoun]}
      goals: [characters]
    - learner: "Per me è il romanzo più bello dell'anno, anche se il finale è un po' triste. Lo consiglierei a chi ama le storie lunghe."
    - tutor: "Allora lo mettiamo nella lista per il prossimo mese! Chi vuole continuare?"
      goals: [opinion, recommend]

- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [register, passive]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce molto la luce: sembra che venga da una finestra che non si vede."
    - tutor: "Hai l'occhio! Il pittore la usa per guidare lo sguardo verso il bambino. E cos'altro vedi?"
      goals: [react]
    - learner: "Nello sfondo c'è un paesaggio con delle montagne e un fiume. I colori sono più freddi che in primo piano."
    - tutor: "Esatto, e così il quadro sembra più profondo. Che significato gli daresti?"
      goals: [describe]
    - learner: "Secondo me il paesaggio rappresenta il mondo, e il bambino è stato messo al centro perché è la speranza."
    - tutor: "Interessante, ma io ci vedo solo una scelta di prospettiva: niente simboli."
      goals: [interpret]
    - learner: "Mi consenta di dissentire: nel Rinascimento niente era messo a caso."
      errors: [register]
    - tutor: "«Mi consenta di dissentire»? Ah ah, sembri un politico in televisione! Siamo amici, dai."
      prompt: {text: "Mi consenta di dissentire", tags: [register]}
    - learner: "Scusa, ma non sono d'accordo: nel Rinascimento niente era messo a caso."
    - tutor: "Va bene, hai vinto tu. E rispetto al quadro di Venezia che abbiamo visto prima?"
    - learner: "Questo è più calmo e ordinato. Quello veneziano è stato dipinta con colori più caldi."
      errors: [passive]
    - tutor: "È stato dipinta? Pensa a che cosa si riferisce «quello»."
      prompt: {text: "è stato dipinta", tags: [passive]}
    - learner: "Quello veneziano è stata dipinta?"
      errors: [passive]
    - tutor: "Sì, quello è stato dipinto con colori più caldi: a Venezia il colore contava più del disegno."
      recast: {text: "è stata dipinta", fix: "è stato dipinto", tags: [passive]}
      goals: [compare]
    - learner: "Allora preferisco quello veneziano. Andiamo a rivederlo?"
    - tutor: "Volentieri, e poi andiamo a prendere un caffè!"

- scenario: politica-lavoro
  level: B2
  persona: en-m-traveller
  history: [register, hypothetical]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Alcuni lavori spariranno, ma altri nasceranno, come è sempre successo."
    - tutor: "Sì, ma stavolta è diverso: le macchine imparano da sole."
      goals: [opinion]
    - learner: "Mio padre era operaio in una fabbrica di auto. Egli diceva sempre che ogni macchina nuova faceva paura, all'inizio."
      errors: [register]
    - tutor: "«Egli diceva»? Sembra un libro di storia! A cena, tra amici, come diresti?"
      prompt: {text: "Egli diceva", tags: [register]}
    - learner: "Ah. Allora: esso diceva sempre così."
      errors: [register]
    - tutor: "Ah, lui diceva che ogni macchina nuova faceva paura? Saggio, tuo padre. Ma allora le fabbriche avevano ancora bisogno di operai."
      recast: {text: "esso diceva", fix: "lui diceva", tags: [register]}
      goals: [example]
    - learner: "Appunto. Se il governo investirebbe nella formazione, molti operai potrebbero imparare a controllare i robot."
      errors: [hypothetical]
    - tutor: "Se il governo investirebbe? Ripeti la parte con «se», con calma."
      prompt: {text: "investirebbe", tags: [hypothetical]}
    - learner: "Se il governo investirà nella formazione, molti operai potrebbero imparare a controllare i robot."
      errors: [hypothetical]
    - tutor: "Se il governo investisse davvero, forse. Ma chi ha cinquantacinque anni non si rimette a studiare così facilmente."
      recast: {text: "investirà", fix: "investisse", tags: [hypothetical]}
      goals: [hypothesis]
    - learner: "Hai ragione, per loro è più difficile. In conclusione, penso che il rischio esista, ma che dipenda da noi. Tu cosa ne pensi, davvero?"
    - tutor: "Penso che tu sia troppo positivo... ma forse hai ragione. Facciamo un brindisi al futuro!"
      goals: [conclude]
      new: [{lemma: brindisi, gloss: toast}]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  history: [register, subjunctive-form]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Nessun disturbo, si sieda pure. Mi racconti con calma cosa è successo."
    - tutor: "Il direttore ha presentato il mio progetto come se fosse di Giulia. Ci ho lavorato tre mesi, e lei non ha detto una parola."
    - learner: "Capisco che si senta tradito, e mi dispiace molto che sia andata così."
    - tutor: "Grazie. Almeno qualcuno se ne rende conto."
      goals: [listen]
    - learner: "Per capire meglio: è stato il direttore a nominare Giulia, o è stata lei a presentarsi come autrice?"
    - tutor: "Il direttore. Lei però è rimasta zitta, come se niente fosse."
      goals: [clarify]
    - learner: "Senti, non fare la vittima: magari Giulia era imbarazzata quanto te."
      errors: [register]
    - tutor: "«Non fare la vittima»? Ecco, è proprio questo tono che mi fa sentire ancora meno ascoltato."
      prompt: {text: "non fare la vittima", tags: [register]}
    - learner: "Ha ragione, mi scusi, ho usato un tono sbagliato. Volevo dire che forse Giulia era imbarazzata quanto lei, e non ha avuto il coraggio di intervenire."
    - tutor: "Mmm... è possibile. Non ci avevo pensato."
      goals: [perspective]
    - learner: "Propongo una cosa: domani ci vediamo tutti e tre, e io scrivo al direttore per chiarire chi ha fatto cosa. Purché lei se la senti, naturalmente."
      errors: [subjunctive-form]
    - tutor: "È una buona proposta. Ma «purché lei se la... senti»? Riguardi la forma del verbo."
      prompt: {text: "se la senti", tags: [subjunctive-form]}
    - learner: "Purché lei se la senta, naturalmente."
    - tutor: "Me la sento. Grazie, già adesso mi sento più ascoltato."
      goals: [solution]

- scenario: reclamo-comune
  level: C1
  persona: en-m-retired
  history: [register]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via Garibaldi, e da sei mesi davanti a casa mia c'è un cantiere aperto dove non lavora nessuno."
    - tutor: "Capisco. Ha già fatto una segnalazione all'ufficio tecnico?"
      goals: [describe]
    - learner: "Sì, due volte, ma nessuno mi ha risposto. Ho anche scritto una lettera: «Il cantiere è un casino totale e fa schifo a tutti.»"
      errors: [register]
    - tutor: "Capisco la frustrazione, ma in una lettera al Comune un'espressione così rischia di indebolire le sue ragioni. Come la riformulerebbe?"
      prompt: {text: "è un casino totale e fa schifo a tutti", tags: [register]}
    - learner: "Mmm... «Il cantiere è un disastro e fa schifo a tutti»?"
      errors: [register]
    - tutor: "Diciamo che il cantiere crea disagio a tutti i residenti: è un fatto, e pesa di più. Comunque l'ufficio tecnico ha molte pratiche arretrate; vedrà che prima o poi qualcuno passerà."
      recast: {text: "fa schifo a tutti", fix: "crea disagio a tutti", tags: [register]}
    - learner: "«Prima o poi» non mi basta, mi scusi. Vorrei sapere con precisione quando il cantiere verrà chiuso."
    - tutor: "Ha ragione, una data dovrebbe esserci. Purtroppo io da qui non la vedo."
      goals: [insist]
    - learner: "Allora qual è la procedura formale? Posso mettere un reclamo scritto?"
      errors: [word-choice]
    - tutor: "Certo, può presentare un reclamo scritto: compili questo modulo, e il Comune è tenuto a rispondere entro trenta giorni."
      recast: {text: "mettere un reclamo", fix: "presentare un reclamo", tags: [word-choice]}
    - learner: "E se la risposta non viene data entro trenta giorni?"
    - tutor: "In quel caso può mandare un sollecito e rivolgersi al difensore civico."
      goals: [rights]
    - learner: "Perfetto. Ecco il modulo compilato. Mi può dare il numero di protocollo, per favore?"
    - tutor: "Ecco: protocollo numero 4127. E le prometto che domani chiamo personalmente l'ufficio tecnico."
      goals: [commitment]

    - learner: "Guarda, io pensavo a millecento di canone, così con le spese restiamo sotto i millequattrocento. So che è una bella differenza, ma è quello che possiamo permetterci."
      errors: [register]
    - tutor: "«Guarda»? Finora ci siamo dati del lei, e in agenzia preferirei continuare così. Detto questo, millecento è lontanissimo da quello che il proprietario accetterebbe. Mi riformuli la proposta, magari con un po' di margine."
      prompt: {text: "Guarda", tags: [register]}
    - learner: "Guardi, mi scusi, è l'abitudine di casa. Posso salire a millecentocinquanta, ma prima tengo un dubbio sul contratto: nell'annuncio si parlava di un anno soltanto. Che tipo di contratto è?"
      errors: [word-choice]
    - tutor: "Da queste parti si dice «ho un dubbio», e fa bene a tirarlo fuori. È un contratto transitorio di dodici mesi: il proprietario vuole restare libero, perché forse il figlio tornerà a Bologna. Per lei la disdetta sarebbe di tre mesi."
      goals: [negotiate]
      recast: {text: "tengo un dubbio", fix: "ho un dubbio", tags: [word-choice]}
    - learner: "Ecco, questo per noi cambia tutto. Cerchiamo una casa in cui restare, non una da lasciare fra un anno. Se il proprietario accettasse un quattro più quattro con cedolare secca, sarei disposto anche ad avvicinarmi alla sua cifra. C'è margine?"
    - tutor: "Gliel'ho già chiesto per altri clienti, e la risposta è stata un no secco. Sul canone qualcosa si muove, sulla durata niente. Mi dispiace, perché sareste gli inquilini ideali."
      goals: [conditions]
    - learner: "Dispiace anche a me, davvero. A queste condizioni, però, preferisco rinunciare: fra dodici mesi ci ritroveremmo a cercare casa da capo. Le lascio il mio numero: se il proprietario ci ripensa, o se Le capita un quattro più quattro in zona, mi chiami."
    - tutor: "Lo capisco, e apprezzo la chiarezza. Tengo il suo numero in evidenza: in questa zona qualcosa di stabile ogni tanto si libera. In bocca al lupo per la ricerca, e saluti la sua compagna."
      goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a te dell'invito! Guarda, è colpa di mia moglie. Io ho lavorato trentacinque anni in una fattoria di motori, in Ohio, e sognavo solo di riposarmi. Lei invece sognava una casa di pietra in collina. Siamo venuti nelle Marche in vacanza, e non siamo più ripartiti."
      errors: [false-friend]
    - tutor: "Dalla fabbrica di motori alla casa di pietra, un bel salto! Con una fattoria vera, a questo punto, saresti arrivato più preparato. E l'inizio com'è stato, c'è una cosa che proprio non ti aspettavi?"
      goals: [story]
      recast: {text: "fattoria di motori", fix: "fabbrica di motori", tags: [false-friend]}
    - learner: "I vicini. Da noi, se qualcuno si presenta a casa tua senza avvisare, pensi che sia successo qualcosa di grave. Qui il primo giorno è arrivata la signora accanto con una teglia di lasagne, e dopo dieci minuti sapeva tutto di noi. All'inizio mi sembrava un'invasione; adesso, se non passa nessuno, mi preoccupo."
    - tutor: "Le lasagne come strumento d'indagine, le conosco bene! Insomma, vi hanno adottati. Però non sarà tutto rose e fiori: c'è qualcosa dell'Italia che, con affetto, cambieresti?"
      goals: [culture-shock]
      new: [{lemma: rose e fiori, gloss: a bed of roses}]
    - learner: "Con affetto, sì: i tempi degli uffici. Prima di partire avevo letto della burocrazia, ma credevo che è uno stereotipo, come la pizza e il mandolino. Poi per il permesso di rifare il tetto abbiamo aspettato undici mesi."
      errors: [subjunctive-use]
    - tutor: "Undici mesi per un tetto, e d'inverno immagino che gioia! Aspetta, però: «credevo che è»? Dopo «credevo che» ci vuole un altro modo, e pure un altro tempo. Riprova."
      prompt: {text: "credevo che è", tags: [subjunctive-use]}
    - learner: "Credevo che sia uno stereotipo. Non voglio essere ingiusto, però: gli impiegati sono sempre stati gentili. È il sistema che è lento, non le persone."
      errors: [subjunctive-use]
    - tutor: "Quasi: «credevo che fosse uno stereotipo», al passato. Mi piace questa distinzione tra il sistema e le persone, è una critica da signore. E a chi sogna di fare come voi, che cosa diresti?"
      goals: [critique]
      recast: {text: "Credevo che sia", fix: "credevo che fosse", tags: [subjunctive-use]}
    - learner: "Due cose. Primo, di affittare per un anno prima di comprare: una casa in collina è una meraviglia ad agosto e un'altra faccenda a gennaio. Secondo, di imparare la lingua sul serio. Senza l'italiano resti un turista con le chiavi di casa."
    - tutor: "«Un turista con le chiavi di casa»: questa te la rubo per il titolo della puntata! Grazie di essere venuto, e salutami tua moglie: mi sa che la vera protagonista della storia è lei."
      goals: [advice]

- scenario: intervista-podcast
  level: C1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Ciao, grazie a voi! Un po' per caso, sinceramente. A diciannove anni volevo un anno di pausa prima dell'università e ho trovato una famiglia a Torino che cercava una ragazza alla pari. Dovevo restare un anno; dopo qualche mesi avevo già deciso di iscrivermi all'università qui."
      errors: [noun-number]
    - tutor: "A diciannove anni, da sola, a fare la ragazza alla pari: che coraggio! Una cosa al volo: «qualche mesi»? Occhio, perché «qualche» è un po' traditore con il numero del nome. Ridimmelo, dai."
      goals: [story]
      prompt: {text: "qualche mesi", tags: [noun-number]}
    - learner: "Qualche mese, vero, con «qualche» sempre il singolare! Comunque, dopo qualche mese non volevo più andarmene. La famiglia era fantastica, e i bambini mi correggevano l'italiano senza pietà."
    - tutor: "I bambini sono gli insegnanti più spietati, lo confermo. E dimmi: nei primi tempi c'è stata un'abitudine italiana che ti ha lasciata a bocca aperta?"
      new: [{lemma: spietato, gloss: ruthless}]
    - learner: "Il colpo d'aria! Una mattina sono uscita con i capelli bagnati e la nonna dei bambini mi ha fermata sulla porta, come se stessi per buttarmi da un ponte. In Inghilterra nessuno ci fa caso. All'inizio ero confusa, poi ero quasi eccitata all'idea di scoprire tutte queste regole segrete."
      errors: [false-friend]
    - tutor: "Quindi eri entusiasta delle regole segrete, mi piace! E ce ne sono parecchie: il cappuccino dopo pranzo, la sciarpa a maggio... Ma dopo quattro anni avrai visto anche i difetti. Che cosa ti convince di meno?"
      goals: [culture-shock]
      recast: {text: "eccitata", fix: "entusiasta", tags: [false-friend]}
    - learner: "Mah, lo dico con affetto, perché qui sto benissimo. Però vedo i miei amici italiani, bravissimi, che a ventisei anni fanno ancora tirocini pagati quattrocento euro. Prima di venire qui non ho mai visto una cosa del genere, e mi sembra uno spreco."
      errors: [tense-aspect]
    - tutor: "Tocchi un tasto dolente, e hai ragione da vendere. Però senti: «prima di venire qui non ho mai visto»? Se parli di un tempo precedente al tuo arrivo, ci vuole un passato più... passato. Riprova."
      prompt: {text: "non ho mai visto", tags: [tense-aspect]}
      new: [{lemma: tasto dolente, gloss: sore point}]
    - learner: "Non avevo mai visto una cosa del genere, ecco. E mi dispiace, perché poi i più bravi se ne vanno all'estero, e l'Italia ci perde."
    - tutor: "Detto da una che ha fatto il viaggio al contrario, fa un certo effetto. Chiudiamo in positivo, allora: a una ragazza che domani vuole fare la valigia e venire qui, che cosa consigli?"
      goals: [critique]
    - learner: "Di non venire per l'Italia delle cartoline, perché quella dura due settimane. Di venire per le persone, e di buttarsi con la lingua anche sbagliando: qui nessuno ti prende in giro, anzi ti offrono un caffè. E di portarsi una sciarpa, ovviamente."
    - tutor: "La sciarpa, ovviamente: ormai sei una di noi! Grazie mille, è stato un piacere averti qui. E a chi ci ascolta: buttatevi, che al massimo vi offrono un caffè."
      goals: [advice]

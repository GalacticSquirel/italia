# C1 hand-written dialogues, part 6 (correction-rich round).

- scenario: presentazione-progetto
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Grazie, direttore, sarò breve. Oggi vendiamo un forno a un panificio e poi quel cliente lo rivediamo dopo dieci anni, quando il forno si rompe. Il progetto prevede un abbonamento di manutenzione: sensori sul forno, controlli a distanza e un tecnico che interviene prima del guasto. L'obiettivo è trasformare una vendita in un rapporto che dura."
    - tutor: "Un abbonamento, dunque. L'idea è chiara, ma i nostri clienti sono panettieri e non amano le spese fisse. Quali benefici si aspetta, in cifre?"
      goals: [pitch]
    - learner: "Abbiamo intervistato quaranta clienti e ventidue firmerebbero subito. Con trecento contratti a novanta euro al mese parliamo di oltre trecentomila euro di fatturato all'anno. E credo che è un fatturato stabile, perché non dipende dalle vendite."
      errors: [subjunctive-use]
    - tutor: "Trecentomila euro all'anno meritano attenzione. Mi ripeta però l'ultima frase: «credo che è»? Dopo «credo che» il verbo vuole un altro modo."
      prompt: {text: "credo che è", tags: [subjunctive-use]}
    - learner: "Ha ragione: credo che sia un fatturato stabile, perché arriva ogni mese anche quando il mercato dei forni rallenta. In più, chi ha l'abbonamento tende a ricomprare da noi."
    - tutor: "Stabile, se i contratti si firmano davvero. Ma i sensori costano, e servono tecnici che oggi non abbiamo. Chi mi garantisce che non stiamo comprando un rischio invece di un fatturato?"
      goals: [benefits]
    - learner: "È una preoccupazione legittima. Per questo propongo una prova di sei mesi: due tecnici, che bastano per attendere trenta clienti, e un investimento di quarantamila euro. Se i numeri non convincono, ci fermiamo lì."
      errors: [false-friend]
    - tutor: "Due tecnici per seguire trenta clienti: così il rischio resta limitato, glielo concedo. Quarantamila euro posso trovarli nel budget di quest'anno. Come pensa di procedere, in pratica?"
      goals: [objection]
      recast: {text: "attendere trenta clienti", fix: "seguire trenta clienti", tags: [false-friend]}
    - learner: "Entro venerdì Le mando il piano dettagliato, con costi e scadenze. I trenta clienti li sceglierei insieme ai colleghi delle vendite, e conto con avere i primi dati a marzo."
      errors: [preposition]
    - tutor: "Venerdì va benissimo. Solo un dettaglio: «conto con avere»? Con «contare» seguito da un infinito la preposizione è un'altra. Ci riprovi."
      prompt: {text: "conto con avere", tags: [preposition]}
    - learner: "Certo: conto di avere i primi dati a marzo. A quel punto potremmo rivederci e decidere se estendere il servizio a tutti i clienti."
    - tutor: "D'accordo, allora: piano venerdì, prova da gennaio e ci rivediamo a marzo con i dati in mano. Se i numeri reggono, porto io la proposta in consiglio. Buon lavoro."
      goals: [next-steps]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Grazie, vado dritto al punto. Nei prossimi cinque anni andranno in pensione diciotto dei nostri tecnici più esperti, e con loro se ne va un sapere che non sta scritto da nessuna parte. Il progetto è una scuola interna, in cui sono loro a formare i giovani prima di lasciare l'azienda."
    - tutor: "Il problema lo conosco, ne sento parlare da anni. Finora però nessuno mi ha portato un numero. Lei che benefici prevede, concretamente?"
      goals: [pitch]
    - learner: "Ogni tecnico che sostituiamo dall'esterno ci costa circa sessantamila euro, tra selezione e mesi di affiancamento. Con la scuola interna stimiamo di dimezzare quella cifra, a condizione di partire prima che i più esperti vanno in pensione."
      errors: [subjunctive-use]
    - tutor: "Un risparmio così, per ogni tecnico, non è poco. Però mi fermo su «prima che i più esperti vanno»: dopo «prima che» quel «vanno» non va bene. Come lo direbbe?"
      prompt: {text: "prima che i più esperti vanno", tags: [subjunctive-use]}
    - learner: "Mi scusi: prima che i più esperti andranno in pensione. E c'è un beneficio in più: i giovani restano più volentieri in un'azienda che investe su di loro."
      errors: [subjunctive-use]
    - tutor: "Capisco: prima che i più esperti vadano in pensione. Sui giovani le credo sulla parola. Mi preoccupa altro: se i tecnici insegnano, chi resta in officina a lavorare per i clienti?"
      goals: [benefits]
      recast: {text: "prima che i più esperti andranno", fix: "prima che i più esperti vadano", tags: [subjunctive-use]}
    - learner: "È un rischio che abbiamo considerato. Ogni tecnico insegnerebbe solo quattro ore alla settimana, il venerdì pomeriggio, quando le richieste dei clienti sono poche. Realizzo che non è a costo zero, ma senza fare niente perderemmo molto di più."
      errors: [false-friend]
    - tutor: "Anch'io mi rendo conto che non è a costo zero, ed è per questo che glielo chiedo. Quattro ore il venerdì, però, mi sembrano un compromesso ragionevole. Quante risorse le servono per partire?"
      goals: [objection]
      recast: {text: "Realizzo che non è a costo zero", fix: "mi rendo conto che non è a costo zero", tags: [false-friend]}
    - learner: "Per il primo anno un budget di ottantamila euro, un'aula attrezzata e tre tecnici disposti a insegnare, che ho già individuato. Le proporrei di cominciare a settembre con un gruppo di otto giovani."
    - tutor: "Ottantamila euro non li firmo a scatola chiusa, ma l'idea sta in piedi. Mi prepari un piano con costi, nomi e scadenze, e lo portiamo insieme in direzione. Quando potrebbe averlo pronto?"
      new: [{lemma: a scatola chiusa, gloss: sight unseen}]
    - learner: "Entro la fine del mese, senz'altro. Se per Lei va bene, Le chiederei mezz'ora nella prima settimana di giugno per presentarglielo."
    - tutor: "Va bene, la prima settimana di giugno. Fissi l'incontro con la mia assistente e mi mandi il documento due giorni prima. Adesso devo proprio scappare, ma ha fatto bene a insistere."
      goals: [next-steps]

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [combined-pronouns]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, chiamo per il listino, e Le confesso che l'ho letto due volte per essere sicuro di aver capito bene. Quindici per cento sui vasetti e sui coperchi, da un mese all'altro: per chi fa marmellate come noi, l'imballaggio è già la seconda spesa dopo la frutta."
    - tutor: "Ha capito bene, purtroppo. Per noi il vetro è aumentato del venti, e una parte l'abbiamo assorbita. Mi dica: la preoccupa la cifra in sé, o il momento?"
      goals: [problem]
    - learner: "Tutte e due le cose. Abbiamo già firmato i contratti con i negozi fino a marzo, e quei prezzi non li possiamo toccare. E poi, mi permetta: lavoriamo insieme da sei anni e non Le abbiamo mai chiesto niente, neanche quando una consegna è arrivata con due settimane di ritardo. Mi aspettavo che ci avvisavate prima."
      errors: [subjunctive-use]
    - tutor: "Sul ritardo di allora ha ragione, e lo ricordo bene. Però mi ripeta l'ultima frase: «mi aspettavo che ci avvisavate»? Dopo «mi aspettavo che» ci vuole un altro modo."
      prompt: {text: "Mi aspettavo che ci avvisavate", tags: [subjunctive-use]}
    - learner: "Giusto: mi aspettavo che ci avvisaste prima, almeno con una telefonata. Un cliente che paga sempre a trenta giorni, senza un solo sollecito, credo che se la sia meritata."
    - tutor: "Una telefonata gliela dovevamo, questo glielo riconosco. E clienti puntuali come voi non ne ho molti. Detto questo, il quindici non me lo sono inventato io: lei che cosa avrebbe in mente?"
      goals: [argue]
    - learner: "Le faccio una proposta concreta: un aumento del sei per cento, e in cambio ci impegniamo a comprare da voi tutto il vetro del prossimo anno, circa duecentomila vasetti. Il contratto, se vuole, se lo firmo anche domani."
      errors: [combined-pronouns]
    - tutor: "Duecentomila vasetti sono un ordine che fa gola, non lo nego. Un momento, però: «se lo firmo»? Il contratto lo firma a me, quindi il pronome doppio è un altro."
      prompt: {text: "se lo firmo", tags: [combined-pronouns]}
      new: [{lemma: fare gola, gloss: to be tempting}]
    - learner: "Ah, sì: Le lo firmo anche domani. Allora, che ne dice del sei per cento?"
      errors: [combined-pronouns]
    - tutor: "Si dice «glielo firmo anche domani», e io lo prendo volentieri. Il sei però è troppo poco. Con un contratto annuale posso scendere al nove e bloccare il prezzo per dodici mesi. Ci sta?"
      goals: [counteroffer]
      recast: {text: "Le lo firmo anche domani", fix: "glielo firmo anche domani", tags: [combined-pronouns]}
    - learner: "Nove per cento con il prezzo bloccato per dodici mesi e le consegne garantite entro due settimane: a queste condizioni ci sto. Può mettermelo per iscritto?"
    - tutor: "Affare fatto: nove per cento, prezzo bloccato per un anno e consegna entro quindici giorni dall'ordine. Domani mattina le mando la bozza del contratto. Grazie per la franchezza, si tratta meglio così."
      goals: [agreement]

- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, infatti. Capisco che i costi siano saliti, ma il quindici per cento su tutte le scatole ci mette in seria difficoltà. Alla fine del giorno, siamo un pastificio di venti persone, non una multinazionale."
      errors: [word-choice]
    - tutor: "In fin dei conti siete un'azienda piccola, lo so bene. Ma l'aumento vale per tutti, grandi e piccoli. Quanto pesano le scatole sui vostri costi?"
      goals: [problem]
      recast: {text: "Alla fine del giorno", fix: "In fin dei conti", tags: [word-choice]}
    - learner: "Circa il sette per cento del prezzo finale, e sui formati piccoli anche di più. Mi lasci aggiungere una cosa: ordiniamo da voi da cinque anni, ogni mese, e vi abbiamo presentato almeno tre clienti nuovi. Non credo che questo conti poco."
    - tutor: "Non conta poco, anzi. Dei tre clienti che ci avete mandato, due sono ancora con noi. Ma la riconoscenza da sola non paga la carta: ha una proposta?"
      goals: [argue]
    - learner: "Sì. Possiamo accettare il cinque per cento adesso e riparlarne fra sei mesi. Ho anche il preventivo di un altro fornitore, che non vorrei usare. Preferirei che troviamo un accordo fra noi."
      errors: [subjunctive-use]
    - tutor: "Il preventivo lo tenga pure nel cassetto, spero che non serva. Solo una cosa: «preferirei che troviamo»? Dopo un condizionale come «preferirei» il verbo che segue cambia tempo e modo."
      prompt: {text: "Preferirei che troviamo", tags: [subjunctive-use]}
    - learner: "Ha ragione: preferirei che trovassimo un accordo fra noi. Il cinque per cento, quindi, Le sembra possibile?"
    - tutor: "Il cinque no, sinceramente: lavorerei in perdita. Posso proporle l'otto subito, senza altri aumenti fino a dicembre, e la consegna gratuita sopra i mille pezzi. Voi quante scatole ordinate al mese, di solito?"
      goals: [counteroffer]
    - learner: "Di scatole, ordiniamo circa duemila ogni mese, quindi la consegna gratuita ci farebbe comodo. L'otto è più di quanto speravo, però."
      errors: [ci-ne]
    - tutor: "Duemila al mese, benissimo: allora la consegna sarebbe sempre a carico nostro. Ma in «ordiniamo circa duemila» manca una piccola parola prima di «ordiniamo», quella che riprende «di scatole». Come lo direbbe?"
      prompt: {text: "ordiniamo circa duemila", tags: [ci-ne]}
    - learner: "Ci ordiniamo circa duemila ogni mese. Comunque accetto: otto per cento, niente aumenti fino a dicembre e consegna gratuita. Me lo conferma per iscritto?"
      errors: [ci-ne]
    - tutor: "Quasi: «ne ordiniamo circa duemila». Allora siamo d'accordo: otto per cento, listino fermo fino a dicembre e consegna gratuita. Le mando la conferma scritta entro oggi, e grazie della pazienza."
      goals: [agreement]
      recast: {text: "Ci ordiniamo circa duemila", fix: "ne ordiniamo circa duemila", tags: [ci-ne]}

- scenario: riunione-lavoro
  level: C1
  persona: en-f-student
  history: [participle-agreement]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Direi bene, tutto sommato. Per il convegno del cliente abbiamo confermato la sala e i relatori, e gli iscritti sono già centoventi. Ieri ho anche mandato in stampa il programma definitivo."
    - tutor: "Centoventi iscritti a tre settimane dall'evento, niente male! Però quel «tutto sommato» non mi lascia tranquilla. C'è qualcosa che non va?"
      goals: [update]
    - learner: "Eh, sì. Quelli del catering ci hanno mollati ieri sera: hanno accettato un altro evento lo stesso giorno. Li ho chiamato subito, ma non c'è stato niente da fare."
      errors: [participle-agreement]
    - tutor: "Proprio adesso, a tre settimane dall'evento! Aspetta, però: «li ho chiamato»? Con «li» davanti, la parola «chiamato» non può restare così. Riprova, e poi sentiamo se hai già un'idea."
      goals: [problem]
      prompt: {text: "Li ho chiamato", tags: [participle-agreement]}
    - learner: "Li ho chiamata? No, aspetta... Comunque sì, un'idea ce l'ho: conosco una piccola azienda di Asti che fa catering con prodotti locali. Costano un po' di più, ma quel giorno sono liberi."
      errors: [participle-agreement]
    - tutor: "«Li ho chiamati», al plurale maschile come «li». L'idea di Asti mi piace, i prodotti locali fanno sempre bella figura. Quanto costano in più, più o meno?"
      goals: [proposal]
      recast: {text: "Li ho chiamata", fix: "Li ho chiamati", tags: [participle-agreement]}
    - learner: "Circa ottocento euro in più sul totale. Mi hanno già mandato un preventivo, ma non volevo fare una decisione da sola: il budget del cliente è quello che è."
      errors: [word-choice]
    - tutor: "Hai fatto bene a non prendere una decisione da sola: ottocento euro li deve approvare il cliente. Gli scrivo io oggi. Tu per quando pensi di avere pronto il menù completo?"
      recast: {text: "fare una decisione", fix: "prendere una decisione", tags: [word-choice]}
    - learner: "Se il cliente dice di sì entro domani, giovedì ti mando il menù con i prezzi. Così venerdì possiamo firmare il contratto con quelli di Asti."
    - tutor: "Giovedì il menù, venerdì la firma: affare fatto. Se il cliente non risponde entro domani, lo chiamo io. Brava, hai trovato la soluzione prima ancora che io sapessi del problema."
      goals: [deadline]

- scenario: riunione-lavoro
  level: C1
  persona: es-f-erasmus
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Bene, anzi molto bene fino a ieri. La nuova app delle prenotazioni è praticamente finita: martedì abbiamo subito la versione di prova sui telefoni del cliente, e quella per iPhone funziona senza problemi."
      errors: [false-friend]
    - tutor: "Ottimo, quindi martedì avete caricato la versione di prova e su iPhone gira bene. Quel «fino a ieri», però, mi fa drizzare le orecchie. Che cosa è successo ieri?"
      goals: [update]
      recast: {text: "subito la versione di prova", fix: "caricato la versione di prova", tags: [false-friend]}
      new: [{lemma: drizzare le orecchie, gloss: to prick up one's ears}]
    - learner: "Ieri è saltato fuori un problema serio sulla versione Android: quando l'utente paga con la carta, una volta su dieci il pagamento passa ma la prenotazione non viene registrata. Il cliente ancora non lo sa."
    - tutor: "Ahi. Soldi presi e prenotazione sparita: è il genere di errore che finisce sui giornali. Avete capito da dove viene, o siete ancora al buio?"
      goals: [problem]
    - learner: "Più o meno. Crediamo che il problema viene dal servizio di pagamento esterno, non dal nostro codice. Io proporrei di uscire lunedì solo con l'iPhone e di tenere ferma la versione Android finché non siamo sicuri."
      errors: [subjunctive-use]
    - tutor: "Uscire solo con l'iPhone ha senso, almeno limitiamo i danni. Una cosa, però: «crediamo che il problema viene»? Con «credere che» ci vuole un altro modo. Riformula, così me lo segno bene."
      goals: [proposal]
      prompt: {text: "Crediamo che il problema viene", tags: [subjunctive-use]}
    - learner: "Certo: crediamo che il problema venga dal servizio di pagamento esterno. Li abbiamo già contattati e aspettiamo una risposta."
    - tutor: "Bene. Al cliente lo dico io: meglio una brutta notizia oggi che una figuraccia lunedì. Per Android che tempi ti senti di promettere?"
      new: [{lemma: figuraccia, gloss: embarrassing blunder}]
    - learner: "Se ci rispondono entro mercoledì, penso in chiudere tutto per la fine della settimana prossima. Diciamo venerdì ventiquattro, per stare tranquilli."
      errors: [preposition]
    - tutor: "Venerdì ventiquattro mi sta bene. Occhio solo a «penso in chiudere»: con «pensare» seguito da un infinito la preposizione è un'altra. Me lo ripeti?"
      prompt: {text: "penso in chiudere", tags: [preposition]}
    - learner: "Sì, scusa: penso di chiudere tutto per venerdì ventiquattro. Se il fornitore tarda, ti avviso subito, così non arriviamo all'ultimo giorno con una sorpresa."
    - tutor: "Perfetto, allora: lunedì usciamo con l'iPhone e venerdì ventiquattro con Android. Io oggi chiamo il cliente e gli spiego tutto. Grazie di aver parlato chiaro, non è da tutti."
      goals: [deadline]

- scenario: colloquio-promozione
  level: C1
  persona: en-m-heritage
  history: [subjunctive-form]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie di avermi ricevuto. Volevo fare il punto con Lei su quest'ultimo anno. Da quando seguo il turno di notte, gli scarti sono scesi dal sei al tre per cento e non abbiamo avuto un solo infortunio. Sono risultati di squadra, ma la squadra l'ho organizzata io."
    - tutor: "I numeri del turno di notte li ho visti, e non sono passati inosservati. Anche in direzione se n'è parlato. Dove vuole arrivare, però?"
      goals: [results]
    - learner: "Vengo al dunque. A marzo si libera il posto di responsabile di produzione, e io ho applicato per quel posto la settimana scorsa. Le chiedo di sostenere la mia promozione, con l'aumento che il ruolo prevede."
      errors: [word-choice]
    - tutor: "Ho visto che ha fatto domanda per quel posto, e non mi ha sorpreso. Le dico però il mio dubbio: lei è bravissimo con le persone, ma non ha mai gestito i conti di un reparto. Come pensa di rimediare?"
      goals: [request]
      recast: {text: "ho applicato per quel posto", fix: "ha fatto domanda per quel posto", tags: [word-choice]}
    - learner: "È un'obiezione giusta. I conti del mio turno, però, li seguo già di fatto, anche se non sulla carta. E sono disposto a fare un corso di controllo di gestione, anche a mie spese. Vorrei solo che Lei mi dasse la possibilità di dimostrarlo."
      errors: [subjunctive-form]
    - tutor: "Che segua già i conti del turno non lo sapevo, ed è un punto a suo favore. Un attimo, però, sull'ultima frase: il congiuntivo imperfetto di «dare» ha un'altra forma. Ci riprovi."
      prompt: {text: "mi dasse", tags: [subjunctive-form]}
    - learner: "Che Lei mi dassi... no, non mi viene. Insomma, Le propongo sei mesi di prova nel ruolo, e poi giudica dai risultati."
      errors: [subjunctive-form]
    - tutor: "«Che lei mi desse la possibilità»: sbagliano anche molti italiani, non si preoccupi. I sei mesi di prova mi sembrano una proposta seria. L'aumento, però, arriverebbe solo alla fine: le sta bene?"
      goals: [handle]
      recast: {text: "mi dassi", fix: "mi desse", tags: [subjunctive-form]}
    - learner: "Mi sta bene, purché gli obiettivi dei sei mesi siano messi per iscritto, così a settembre non ci sono discussioni. Il corso lo comincerei già ad aprile."
    - tutor: "D'accordo. Scriviamo insieme tre obiettivi misurabili e li alleghiamo alla sua valutazione. Io ne parlo con l'ufficio del personale entro venerdì e la settimana prossima ci rivediamo. Ha fatto bene a venire."
      goals: [next-steps]

- scenario: colloquio-promozione
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. È una cosa che rimando da mesi, quindi gliela dico senza giri di parole: vorrei parlare del mio stipendio. Prima, però, mi lasci ricordare che cosa è cambiato in magazzino da quando lo coordino io."
    - tutor: "Apprezzo la franchezza, mi risparmia mezz'ora di chiacchiere. Prego, mi ricordi pure che cosa è cambiato."
    - learner: "In due anni abbiamo ridotto gli errori di spedizione del quaranta per cento e i tempi di consegna da cinque giorni a tre. E l'inventario di dicembre, che prima tardava due settimane, l'abbiamo chiuso in quattro giorni."
      errors: [false-friend]
    - tutor: "Un inventario che richiedeva due settimane chiuso in quattro giorni: me lo ricordo, pensavo a un errore. I risultati non si discutono. Che cosa mi chiede, esattamente?"
      goals: [results]
      recast: {text: "tardava due settimane", fix: "richiedeva due settimane", tags: [false-friend]}
    - learner: "Un aumento del dieci per cento. Non chiedo un titolo nuovo. Ma coordino otto persone, quest'anno ho formato a tre colleghi nuovi e rispondo io di ogni errore: credo che lo stipendio debba tenerne conto."
      errors: [preposition]
    - tutor: "Il dieci per cento, dunque. Prima di rispondere, una domanda: «ho formato a tre colleghi»? In quella frase c'è una piccola parola di troppo. Me la ripeta."
      prompt: {text: "ho formato a tre colleghi", tags: [preposition]}
    - learner: "Ho formato tre colleghi nuovi, mi scusi, è lo spagnolo che esce. E li ho formati fuori orario, tra l'altro."
    - tutor: "Lo so, e gliene sono grato. Il problema è un altro: gli altri coordinatori guadagnano quanto lei. Se alzo il suo stipendio, domani ho la fila fuori dalla porta. Come ne usciamo?"
      goals: [request]
    - learner: "Capisco, ma non mi sembra un argomento contro di me. Se i miei colleghi avrebbero gli stessi numeri, meriterebbero lo stesso aumento. La valutazione si fa sui risultati, non sul titolo."
      errors: [hypothetical]
    - tutor: "L'idea mi è chiara, e non è sbagliata. Però «se i miei colleghi avrebbero» non regge: dopo «se» il condizionale non ci va. Me la riformuli, perché è una frase che voglio citare in direzione."

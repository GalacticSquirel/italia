- scenario: modi-di-dire
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Guarda, lasciamo perdere. Stamattina la sveglia non ha suonato, sono uscito di corsa senza fare colazione e, arrivato in stazione, ho scoperto che il mio treno era stato cancellato."
    - tutor: "Ahia, il buongiorno si vede dal mattino! E da come ti sei seduto direi che non è finita lì: oggi piove sul bagnato. Dopo la stazione che cosa ti è capitato?"
      new: [{lemma: piovere sul bagnato, gloss: "when it rains, it pours"}]
    - learner: "Piove sul bagnato, questa me la segno! Ho preso un taxi, sono rimasto bloccato nel traffico e sono arrivato alla riunione con quaranta minuti di ritardo, senza il computer, che avevo lasciato a casa. Il mio capo era proprio annoiato."
      errors: [false-friend]
    - tutor: "Immagino che il tuo capo fosse seccato, e parecchio! Che figuraccia, però: in ritardo e pure senza computer. Ma dimmi la verità, di chi è la colpa?"
      goals: [tell, react]
      recast: {text: annoiato, fix: seccato, tags: [false-friend]}
      new: [{lemma: seccato, gloss: annoyed}]
    - learner: "Mah, diciamo che la sfortuna ci ha messo del suo, però se io avrei controllato la sveglia ieri sera, non sarebbe successo niente."
      errors: [hypothetical]
    - tutor: "«Se io avrei controllato»? Aspetta, dopo quel «se» il condizionale non ci sta proprio: riprova la frase. Comunque apprezzo l'onestà, non è da tutti prendersi la colpa."
      goals: [blame]
      prompt: {text: se io avrei controllato, tags: [hypothetical]}
    - learner: "Giusto: se avessi controllato la sveglia ieri sera, non sarebbe successo niente. Mi sono dato la zappa sui piedi, come dite voi."
    - tutor: "Bravo, la zappa sui piedi qui ci sta benissimo! E adesso che il guaio è passato, che lezione ne tiri fuori?"
      new: [{lemma: darsi la zappa sui piedi, gloss: to shoot oneself in the foot}]
    - learner: "Che d'ora in poi metto due sveglie, e che una giornata storta capita a tutti: tanto vale riderci sopra davanti a un bicchiere."
    - tutor: "Parole sante! Ridere dei propri guai è già mezza soluzione. Allora il prossimo giro lo offro io, e brindiamo alle due sveglie."
      goals: [moral]

- scenario: modi-di-dire
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Uff, non sai che giornata! Prima ho perso l'autobus, poi all'università ho scoperto che l'esame era stato spostato a ieri. A ieri, capisci? E nessuno me l'aveva detto."
    - tutor: "No, dai, spostato a ieri? Questa sì che è una doccia fredda! Immagino che tu sia rimasta di sasso. E a quel punto che cosa hai fatto?"
      new: [{lemma: rimanere di sasso, gloss: to be stunned}]
    - learner: "Di sasso, sì, mi piace! Sono rimasta di sasso per cinque minuti buoni. Poi sono andata dal professore per spiegargli tutto, ma lui mi ha contestato male e mi ha detto che dovevo leggere gli avvisi."
      errors: [false-friend]
    - tutor: "Certo che ti ha risposto male, eh: che modi! Poteva almeno darti una mano. Però, detto tra noi, la colpa secondo te è tutta sua?"
      goals: [tell, react]
      recast: {text: contestato, fix: risposto, tags: [false-friend]}
    - learner: "A dire il vero, no. L'avviso c'era, sul sito, ma io non lo guardo mai. Diciamo che lui poteva essere più gentile, però io avevo la coda di paglia."
    - tutor: "«Avere la coda di paglia»: complimenti, la usi meglio di tanti italiani! Quindi colpa a metà, mi pare giusto. E l'esame, alla fine, è perso o c'è una soluzione?"
      goals: [blame]
      new: [{lemma: avere la coda di paglia, gloss: to have a guilty conscience}]
    - learner: "Posso farlo a febbraio, per fortuna. Benché sono ancora arrabbiata, ammetto che poteva andare peggio."
      errors: [subjunctive-use]
    - tutor: "«Benché sono»? Occhio, con «benché» ci vuole un altro modo: prova a ridirla. E comunque febbraio non è poi così lontano, dai."
      prompt: {text: Benché sono, tags: [subjunctive-use]}
    - learner: "Benché sono... no, aspetta. Benché ero ancora arrabbiata?"
      errors: [subjunctive-use]
    - tutor: "Quasi: «benché sia ancora arrabbiata», con il congiuntivo. Capita, soprattutto dopo una giornata così! Ma una morale, da tutto questo guaio, riesci a tirarla fuori?"
      recast: {text: Benché ero, fix: benché sia, tags: [subjunctive-use]}
    - learner: "Sì: leggere gli avvisi prima di lamentarmi. E poi non tutto il male viene per nuocere, perché adesso ho due mesi in più per studiare!"
    - tutor: "Brava, hai trovato la lezione e anche il modo di dire giusto. Con due mesi in più, quell'esame lo passi a occhi chiusi. Alla tua, allora!"
      goals: [moral]

- scenario: modi-di-dire
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Mah, una di quelle giornate da dimenticare. Sono andato in posta per pagare una bolletta: due ore di fila, e quando è toccato a me il sistema si è bloccato. Tornando a casa, poi, ho bucato una gomma."
    - tutor: "Oggi non te ne è andata bene una, insomma! Mi sa che ti sei alzato con il piede sbagliato. E la gomma l'hai cambiata da solo?"
      new: [{lemma: alzarsi con il piede sbagliato, gloss: to get up on the wrong side of the bed}]
    - learner: "Con il piede sbagliato, altro che! Da noi si dice «dal lato sbagliato del letto», ma il piede rende meglio l'idea. La gomma l'ho cambiata io, sotto la pioggia, e proprio in quel momento mi sono ricordato che era il nostro anniversario. Avevo dimenticato i fiori."
    - tutor: "Oddio, sei caduto dalla padella nella brace! Non oso chiedere come l'ha presa tua moglie. Ma siamo sinceri: è stata tutta sfortuna o c'entri anche tu?"
      goals: [tell, react]
      new: [{lemma: cadere dalla padella nella brace, gloss: "out of the frying pan, into the fire"}]
    - learner: "La posta e la gomma, pura sfortuna: lì non potevo farci niente. I fiori, invece, sono colpa mia, inutile girarci intorno. Me l'ero perfino segnato sul calendario, pensa un po'."
    - tutor: "Almeno non ti arrampichi sugli specchi, e questo ti fa onore. E alla fine come te la sei cavata con lei?"
      goals: [blame]
      new: [{lemma: arrampicarsi sugli specchi, gloss: to make lame excuses}]
    - learner: "Sono arrivato bagnato fradicio e a mani vuote, e lei è scoppiata a ridere. Ha detto che la mia faccia valeva più di un mazzo di rose. Ce la siamo cavata con una pizza."
    - tutor: "Tutto è bene quel che finisce bene, allora! Hai sposato una santa, lasciatelo dire. E da una giornata così che cosa si impara, secondo te?"
    - learner: "Che i fiori si comprano il giorno prima, e che una moglie con il senso dell'umorismo è la miglior fortuna che possa capitare. Per il resto, pazienza."
    - tutor: "Ben detto: pazienza, e domani è un altro giorno. Beviamo alla salute di tua moglie, allora, che se lo merita davvero!"
      goals: [moral]

- scenario: club-lettura
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, anche se a fatica. Nell'insieme mi è piaciuto: l'ambientazione è resa benissimo, ma la parte centrale l'ho trovata lenta, quasi che l'autrice avesse paura di arrivare al punto."
    - tutor: "Lenta? A me quei capitoli sono sembrati il cuore del romanzo, guarda. Ma capisco, è lì che molti si fermano. E dei personaggi che mi dici: Elvira, per esempio, tu l'hai capita?"
      goals: [impression]
    - learner: "Fino a un certo punto. Credo che lei resta con il marito non per amore, ma perché ha paura del giudizio del paese."
      errors: [subjunctive-use]
    - tutor: "«Credo che lei resta»... sicura di quel verbo, dopo «credo che»? Riprova. Sulla sostanza, comunque, non sono d'accordo, ma ti lascio finire."
      prompt: {text: Credo che lei resta, tags: [subjunctive-use]}
    - learner: "Hai ragione: credo che lei resti per paura del giudizio del paese. Se fosse stata davvero innamorata, non avrebbe conservato per trent'anni le lettere dell'altro."
    - tutor: "Le lettere, vero, me n'ero quasi dimenticato. Però secondo me resta per i figli, e in questo c'è una dignità che il narratore non giudica mai. A proposito: dello stile che cosa pensi?"
      goals: [character]
    - learner: "Lo stile mi ha colpita più della trama. Frasi brevi, asciutte, senza una parola di troppo; eppure ogni tanto arriva un'immagine che ti resta addosso per giorni. È una scrittura che si fida del lettore."
    - tutor: "«Si fida del lettore»: questa te la rubo per la prossima riunione! Su questo siamo d'accordo. E a chi lo consiglieresti, un romanzo così?"
      goals: [style]
    - learner: "A chi ha pazienza e ama le storie di famiglia. Non lo consiglierei a mio fratello, che se non succede qualcosa entro pagina dieci chiude il libro. In fondo penso che dipenda dal momento in cui lo leggi."
    - tutor: "Verissimo, certi libri bisogna incontrarli al momento giusto. Su Elvira restiamo di idee diverse, ma è proprio questo il bello del club. Ci vediamo il mese prossimo!"
      goals: [recommend]

- scenario: club-lettura
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, l'ho finito ieri notte. Ti dico la verità: l'argomento del romanzo mi è sembrato prevedibile, ma l'atmosfera del dopoguerra mi ha preso tantissimo."
      errors: [false-friend]
    - tutor: "Prevedibile, la trama? Forse sì: in una storia di famiglia si sa già che qualcuno tradirà qualcun altro. Ma l'atmosfera regge tutto, hai ragione. C'è un personaggio che non sopporti?"
      goals: [impression]
      recast: {text: l'argomento, fix: la trama, tags: [false-friend]}
    - learner: "Il padre, Tommaso, senza dubbio. Vende la terra di nascosto e non dice niente ai figli. Ne ho pensato molto, e ancora non lo perdono."
      errors: [ci-ne]
    - tutor: "«Ne ho pensato»? Attento: si pensa «a» qualcosa, quindi quel pronome non va bene. Riprova! E dimmi anche perché non lo perdoni: in fondo voleva salvare la famiglia dai debiti."
      prompt: {text: Ne ho pensato, tags: [ci-ne]}
    - learner: "Allora... a questa scelta ne ho pensato molto? Non lo perdono perché ha deciso da solo, come se i figli non contassero niente."
      errors: [ci-ne]
    - tutor: "Si dice «ci ho pensato molto», con «ci», perché si pensa a qualcosa. Sul padre hai colto il punto: decide da solo, e il romanzo gliela fa pagare. E come ti è sembrato lo stile?"
      goals: [character]
      recast: {text: ne ho pensato molto, fix: ci ho pensato molto, tags: [ci-ne]}
    - learner: "Mi è piaciuto che il narratore cambi a ogni capitolo: prima la madre, poi il figlio minore, poi perfino la casa. All'inizio mi confondeva, poi ho capito che era il modo di mostrare che nessuno possiede tutta la verità."
    - tutor: "Bella lettura, la tua. La casa che racconta a me è sembrata un'idea un po' furba, ma devo ammettere che funziona. Lo consiglieresti ai tuoi colleghi?"
      goals: [style]
    - learner: "Ad alcuni sì, a quelli che hanno i nonni contadini come me: ci ritroverebbero la propria famiglia. A chi cerca un romanzo leggero per la spiaggia, direi di lasciar perdere."
    - tutor: "Giusto, per la spiaggia proprio no! Mi hai quasi fatto rivalutare Tommaso, e non era facile. La prossima volta il libro lo scegli tu."
      goals: [recommend]

- scenario: club-lettura
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Finito stanotte alle due! Mia nonna raccontava storie così, quindi per me è stato come tornare nella sua cucina. Però il finale, scusa, mi ha lasciato l'amaro in bocca."
    - tutor: "L'amaro in bocca? Per me quel finale è perfetto proprio perché non dà pace a nessuno. Ma ne parliamo dopo. Intanto, Luisa: tu al posto suo saresti partito per l'America?"
      goals: [impression]
    - learner: "Io sì, sarei partito senza pensarci due volte. Lei invece rinuncia per stare vicino alla madre, e secondo me non è generosità: è paura. Le lettere al fratello le ha scritte ma non le ha mai spedite, e questo dice tutto."
    - tutor: "Paura, dici? Io ci vedo una scelta dura, fatta a occhi aperti. Se fosse partita, sua madre sarebbe rimasta sola in quella casa. Questo non conta niente, per te?"
    - learner: "Conta, certo. Ma avrebbe potuto almeno dirlo al fratello, invece di lasciargli credere per vent'anni che non le importasse. Il suo silenzio fa più danni della partenza."
    - tutor: "Sul silenzio non hai tutti i torti, te lo concedo. Lasciamo stare Luisa, altrimenti facciamo notte. Che ne dici di come scrive l'autore?"
      goals: [character]
    - learner: "Scrive come si parlava una volta, con quelle frasi lunghe che sembrano non finire mai, e in mezzo ci mette il dialetto. A me ha fatto tenerezza, anche se capisco che a qualcuno possa pesare."
    - tutor: "A me il dialetto è parso la cosa più viva del libro. Senza, i personaggi parlerebbero tutti come un telegiornale. A chi lo faresti leggere?"
      goals: [style]
    - learner: "A mia madre, di sicuro: glielo regalo per Natale. Ai miei amici americani no, almeno finché non lo traducono come si deve. Senza il dialetto si perde metà del sapore."
    - tutor: "Tua madre ne sarà felice, vedrai. Sul finale non mi hai convinto e io non ho convinto te, quindi siamo pari. Ne riparliamo davanti a un caffè."
      goals: [recommend]

- scenario: film-libro
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, se permettete. Ho letto un romanzo ambientato in Sardegna negli anni Cinquanta: una maestra arriva in un piccolo paese di montagna e a poco a poco scopre perché da lì nessuno vuole andarsene. Di più non dico!"
    - tutor: "Bene, hai detto abbastanza per farci venire voglia di leggerlo e niente di troppo. E questa maestra che tipo è?"
      goals: [summary]
    - learner: "È una donna che il marito è morto in guerra, quindi arriva già segnata, chiusa. Però ha un'ironia tagliente, e con i bambini si trasforma."
      errors: [relative-pronoun]
    - tutor: "«Una donna che il marito è morto»: qui «che» da solo non basta, serve un relativo che indichi possesso. Come lo diresti? Intanto, con quell'ironia, mi è già simpatica."
      prompt: {text: una donna che il marito è morto, tags: [relative-pronoun]}
    - learner: "Ah, sì: una donna il cui marito è morto in guerra. È il personaggio più vero che abbia incontrato quest'anno, perché non diventa mai un'eroina."
    - tutor: "Perfetto. Anche a me piacciono i personaggi che restano umani fino in fondo. E il libro, nel complesso, ti ha convinta?"
      goals: [characters]
    - learner: "Molto, anche se non mi esperavo un finale così aperto. L'autrice scrive con una calma rara e non spiega mai troppo. L'unico difetto è che i capitoli centrali sono un po' ripetitivi."
      errors: [word-choice]
    - tutor: "«Non mi aspettavo un finale così aperto» è la frase che sento più spesso, qui al club! A me i finali aperti piacciono, ma dividono sempre. A chi lo consiglieresti?"
      goals: [opinion]
      recast: {text: non mi esperavo, fix: Non mi aspettavo, tags: [word-choice]}
    - learner: "Ai miei colleghi insegnanti, senza dubbio, e a chiunque ami le storie lente. Chi cerca un libro emozionante dalla prima pagina, forse, resterebbe deluso."
    - tutor: "Chiaro: un romanzo per lettori pazienti. Lo metto nella lista delle proposte per l'autunno. Grazie, hai aperto la serata nel modo migliore!"
      goals: [recommend]

- scenario: film-libro
  level: C1
  persona: en-f-student
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io, se nessun altro si offre! Ho letto un giallo ambientato a Napoli: un commissario vicino alla pensione riapre un caso di vent'anni prima perché riceve una lettera anonima. Mi fermo qui, altrimenti rovino tutto."
    - tutor: "Un giallo, finalmente, che qui si leggono solo saghe familiari! E il commissario com'è: il solito burbero dal cuore d'oro?"
      goals: [summary]
      new: [{lemma: burbero, gloss: gruff}]
    - learner: "È proprio questo il bello: no. È un uomo gentile, quasi timido, che cucina per i vicini e sbaglia spesso. Non ha il genio dei detective classici; arriva alla verità perché sa ascoltare, non perché sia più intelligente degli altri."
    - tutor: "Un commissario che ascolta: mi piace già. E Napoli nel libro è solo uno sfondo, o conta davvero nella storia?"
      goals: [characters]
    - learner: "Conta eccome. Non è la Napoli da cartolina e nemmeno quella dei film violenti: è una città di cortili e di portinaie che sanno tutto. A un certo punto ti accorgi che il vero testimone è il quartiere."
    - tutor: "Il quartiere come testimone, bella idea. Ma il romanzo regge fino all'ultima pagina, secondo te?"
    - learner: "Secondo me sì, benché il colpevole si intuisca abbastanza presto. A me non ha dato fastidio, perché il vero mistero non è chi è stato, ma perché tutti hanno taciuto per vent'anni. È un libro sul silenzio, più che su un delitto."
    - tutor: "Mm, non so. Se indovino il colpevole a metà libro, io mi sento un po' tradito. Però l'idea del silenzio mi convince. Chi dovrebbe leggerlo?"
      goals: [opinion]
    - learner: "Chi di solito i gialli li evita, direi. E magari proprio tu, così poi mi dici se ti sei sentito tradito davvero! Agli appassionati di colpi di scena, invece, consiglierei altro."
    - tutor: "Sfida accettata: lo leggo e il mese prossimo ti dico chi aveva ragione. Intanto grazie, ci hai fatto venire voglia di partire per Napoli."
      goals: [recommend]

- scenario: film-libro
  level: C1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio volentieri. Ho letto una novella di quasi seicento pagine sulla costruzione di una diga in montagna: un ingegnere giovane arriva pieno di fiducia, e intanto il paese sotto la diga comincia ad avere paura."
      errors: [false-friend]
    - tutor: "Seicento pagine: allora è un romanzo bello lungo! La novella, da noi, è un racconto breve. La trama comunque promette bene. Il protagonista è l'ingegnere?"
      goals: [summary]
      recast: {text: una novella, fix: un romanzo, tags: [false-friend]}
    - learner: "Sì, si chiama Ettore. È ambizioso ma onesto, uno di quelli che credono nei numeri. Mi ha ricordato me stesso: quando lavoravo come ingegnere ho pensato sempre che i calcoli bastassero."
      errors: [tense-aspect]
    - tutor: "«Ho pensato sempre»: era un'abitudine di tutti quegli anni, no? Allora quale tempo del passato ci vuole? Bello, comunque, ritrovarsi in un personaggio."
      prompt: {text: ho pensato sempre, tags: [tense-aspect]}
    - learner: "Dunque... avevo pensato sempre che i calcoli bastassero? Insomma, per anni è stata la mia convinzione."
      errors: [tense-aspect]
    - tutor: "Per un'abitudine serve l'imperfetto: «pensavo sempre che i calcoli bastassero». Ettore quindi ti somiglia parecchio! E il libro, alla fine, ti è piaciuto?"
      goals: [characters]
      recast: {text: avevo pensato sempre, fix: pensavo sempre, tags: [tense-aspect]}
    - learner: "Moltissimo, soprattutto perché l'autore non cerca un cattivo. Ognuno ha le sue ragioni, e la tragedia nasce da tante piccole prudenze mancate. L'unico difetto è il finale, che mi è sembrato scritto in fretta."
    - tutor: "Una tragedia senza cattivi è la più difficile da raccontare, e la più vera. Peccato per il finale. A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A mio genero, che fa l'architetto, e a chiunque abbia un lavoro in cui un errore costa caro. Non lo darei a chi vuole distrarsi: è emozionante, ma pesa."
    - tutor: "Emozionante ma pesante: avviso utile per tutti noi. Grazie, si sente che l'hai letto con gli occhi del mestiere. Passiamo al prossimo?"
      goals: [recommend]

- scenario: arte-mostra
  level: C1
  persona: en-f-student
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi mette un po' a disagio, sinceramente, ma non riesco a staccare gli occhi. C'è qualcosa di troppo fermo, come se tutti trattenessero il respiro."
    - tutor: "Il respiro trattenuto, sì: è proprio l'effetto che cercava il pittore. Prova a descrivermi quello che vedi, senza pensare ancora a cosa significa."
      goals: [react]
    - learner: "In primo piano c'è una donna seduta di profilo, vestita di scuro, con una lettera in mano. La luce entra da sinistra e le illumina solo le mani e il foglio. Sullo sfondo si intravede una finestra aperta su un paesaggio quasi vuoto."
    - tutor: "Ottimo occhio: le mani e il foglio, e tutto il resto in ombra. Perché questa scelta, secondo te?"
      goals: [describe]
    - learner: "Penso che la lettera porti una brutta notizia e che lei non abbia ancora deciso se crederci. Secondo me il quadro è venuto dipinto dopo un lutto, perché anche la finestra sembra un'uscita che nessuno usa."
      errors: [passive]
    - tutor: "«È venuto dipinto»? Con «venire» il passivo funziona solo nei tempi semplici: qui, al passato prossimo, quale ausiliare serve? L'idea della finestra come uscita, però, è bellissima."
      prompt: {text: è venuto dipinto, tags: [passive]}
    - learner: "Giusto, è stato dipinto dopo un lutto. Almeno, è quello che immagino io."
    - tutor: "E immagini bene: il pittore aveva appena perso il fratello. Ti ricorda qualche altra opera, o un altro stile?"
      goals: [interpret]
    - learner: "Mi fa pensare ai pittori olandesi del Seicento, per quella luce laterale e gli interni silenziosi. Però lì i colori sono più caldi e la scena è più serena; qui la stessa luce diventa fredda, quasi crudele."
    - tutor: "Confronto perfetto: stessa luce, significato opposto. Dovresti venire tu a fare gli esami al posto mio! Andiamo avanti, nella prossima sala c'è il mio preferito."
      goals: [compare]

- scenario: arte-mostra
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mah, se devo essere sincero mi fa un po' ridere. Non capisco di arte, ma questa signora sembra che stia per cadere dalla sedia."
    - tutor: "Ridere va benissimo, è una reazione vera! E non sei lontano: l'equilibrio qui è strano di proposito. Dimmi che cosa vedi esattamente."
      goals: [react]
    - learner: "Vedo una donna con un collo molto largo, quasi come un cigno, e delle mani enormi. Il bambino che tiene in braccio sembra addormentato, e dietro c'è una colonna senza niente sopra."
      errors: [false-friend]
    - tutor: "Sì, ha un collo molto lungo: largo sarebbe un collo grosso, da toro! Hai notato tutto, anche la colonna. Perché, secondo te, il pittore ha fatto le figure così lunghe?"
      goals: [describe]
      recast: {text: un collo molto largo, fix: un collo molto lungo, tags: [false-friend]}
    - learner: "Può darsi che il pittore voleva mostrare l'eleganza più della realtà. Come quando disegni qualcuno che ammiri e lo fai più alto di quello che è."
      errors: [subjunctive-use]
    - tutor: "«Può darsi che voleva»? Dopo «può darsi che» quel verbo non va bene così: come lo diresti? Il confronto con il disegno, comunque, mi piace molto."
      prompt: {text: Può darsi che il pittore voleva, tags: [subjunctive-use]}
    - learner: "Può darsi che il pittore volesse mostrare l'eleganza più della realtà. O forse cercava solo di stupire, non lo so."
    - tutor: "Tutte e due le cose, probabilmente: dopo il Rinascimento stupire era diventato quasi un dovere. Ti viene in mente un'altra opera da mettere accanto a questa?"
      goals: [interpret]
    - learner: "Da ragazzo ho visto a Madrid i quadri di un pittore greco che allungava i santi allo stesso modo, ma con colori più freddi e cieli da temporale. Questo qui è più dolce, più tranquillo; quello sembrava avere la febbre."
    - tutor: "La febbre! Non potevi descriverlo meglio, e sono davvero parenti stretti. E poi dici che non capisci di arte... Vieni, ti offro un caffè al bar del museo."
      goals: [compare]

- scenario: arte-mostra
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Onestamente? Mi lascia freddo. Vedo che è un'opera importante, lo dice anche il cartellino, ma a me sembra una tela tagliata e basta."
    - tutor: "Almeno sei onesto, che in un museo è merce rara! Facciamo un gioco, allora: dimmi solo quello che vedi, come lo racconteresti al telefono."
      goals: [react]
    - learner: "Una tela tutta rossa, di un rosso pieno, senza sfumature. Al centro ci sono tre tagli verticali, netti, leggermente curvi. Dietro i tagli si vede del nero, e stranamente quel nero sembra più profondo di qualsiasi sfondo dipinto."
    - tutor: "Ecco, l'hai detto tu: più profondo di uno sfondo dipinto. Che cosa voleva fare l'artista, secondo te?"
      goals: [describe]
    - learner: "Suppongo che volesse uscire dal quadro, letteralmente. Per secoli i pittori hanno finto la profondità con la prospettiva; lui invece apre un buco vero. Capisco l'idea, anche se continuo a pensare che un'idea non basti a fare un'opera."
    - tutor: "Ah, qui ti aspettavo! Per me c'è l'idea, ma c'è anche il gesto: prova tu a fare un taglio così pulito senza rovinare tutto. Non conta anche la mano?"
      goals: [interpret]
    - learner: "Conta, te lo concedo. Un taglio storto e sarebbe solo una tela da buttare. Ma ammetterai che, senza qualcuno che me lo spieghi, io da solo non ci sarei mai arrivato."
    - tutor: "Lo ammetto, e non è una colpa: certe opere chiedono un po' di compagnia. Con che cosa lo metteresti a confronto?"
    - learner: "Con gli affreschi che abbiamo visto ieri in chiesa: lì la prospettiva ti invita a entrare in uno spazio finto, qui il taglio ti mostra che dietro c'è il vuoto. Sono due risposte opposte alla stessa domanda. Messa così, devo dire, mi incuriosisce di più."
    - tutor: "Due risposte alla stessa domanda: non avrei saputo dirlo meglio. Non ti ho convinto del tutto, lo vedo, ma un po' di curiosità mi basta. Proseguiamo?"
      goals: [compare]

- scenario: intervista-podcast
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Grazie a voi dell'invito! Ero venuta a Bologna per un progetto di sei mesi, undici anni fa. Poi il progetto è finito, ma nel frattempo avevo conosciuto la città e tanti amici, e l'idea di ripartire mi sembrava assurda."
    - tutor: "Sei mesi che diventano undici anni: la storia più italiana che ci sia! E all'inizio che cosa ti ha sorpresa di più delle nostre abitudini?"
      goals: [story]
    - learner: "Gli orari, senza dubbio. A Londra si cena alle sette; qui alle sette la gente prende ancora l'aperitivo. Attualmente pensavo che fosse uno stereotipo, e invece i primi inviti a cena alle nove e mezza mi hanno distrutta."
      errors: [false-friend]
    - tutor: "«In realtà pensavo che fosse uno stereotipo»: lo dicono quasi tutti i nostri ospiti! Senti, però, questa non è pubblicità per il turismo. C'è qualcosa dell'Italia che proprio non ti va giù?"
      goals: [culture-shock]
      recast: {text: Attualmente pensavo, fix: In realtà pensavo, tags: [false-friend]}
    - learner: "Con tutto l'affetto: la burocrazia. Per rinnovare un documento ho girato tre uffici, e ognuno mi diceva una cosa diversa. Se avrei saputo prima quanto tempo ci voleva, avrei preso una settimana di ferie."
      errors: [hypothetical]
    - tutor: "«Se avrei saputo»... attenta a quel «se»: con un'ipotesi nel passato che forma ci vuole? Sulla burocrazia, purtroppo, non posso darti torto."
      prompt: {text: Se avrei saputo, tags: [hypothetical]}
    - learner: "Se avessi saputo prima quanto tempo ci voleva, avrei preso le ferie. Detto questo, gli impiegati erano gentilissimi: il problema è il sistema, non le persone."
    - tutor: "Il sistema e non le persone: una critica fatta con garbo, la firmo anch'io. Ultima domanda. Che cosa diresti a chi sta pensando di trasferirsi qui?"
      goals: [critique]
      new: [{lemma: garbo, gloss: "tact, grace"}]
    - learner: "Di imparare la lingua prima di tutto, anche male, anche sbagliando. E di non vivere solo tra stranieri: integrarsi costa fatica, ma è l'unico modo per sentirsi a casa e non in vacanza per sempre."
    - tutor: "A casa e non in vacanza per sempre: consiglio prezioso. Grazie di cuore per questa chiacchierata, e buona cena. Alle nove e mezza, naturalmente!"
      goals: [advice]

- scenario: intervista-podcast
  level: C1
  persona: en-m-heritage
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
    - learner: "Grazie a te! Io in un certo senso ci sono tornato, più che arrivato. I miei nonni erano partiti dalla Calabria negli anni Sessanta, e io ho cresciuto a Toronto sentendo parlare di un paese che non avevo mai visto."
      errors: [auxiliary-choice]
    - tutor: "Che bella storia, un ritorno! Solo una cosa: «ho cresciuto a Toronto»... con «crescere», quando parli di te, che ausiliare ci vuole? E poi dimmi che cosa ti ha spinto a partire davvero."
      prompt: {text: ho cresciuto, tags: [auxiliary-choice]}
    - learner: "Ah, scusa: avevo cresciuto a Toronto, volevo dire. Comunque a trent'anni ho perso il lavoro e mi sono detto: adesso o mai più."
      errors: [auxiliary-choice]
    - tutor: "Ci vuole «essere»: «sono cresciuto a Toronto». Adesso o mai più, quindi! E quando sei arrivato, l'Italia vera somigliava a quella dei racconti dei nonni?"
      goals: [story]
      recast: {text: avevo cresciuto, fix: sono cresciuto, tags: [auxiliary-choice]}
    - learner: "Per niente, ed è stato quello lo shock. Io parlavo un dialetto di sessant'anni fa e la gente sorrideva, come davanti a un pezzo da museo. Mi aspettavo di essere a casa, e invece ero straniero due volte."
    - tutor: "Straniero due volte: questa finisce dritta nel titolo della puntata. E oggi, dopo qualche anno, c'è qualcosa che critichi di questo paese?"
      goals: [culture-shock]
    - learner: "Sì, anche se lo dico con affetto. C'è una certa mentalità per cui conta chi conosci più di quello che sai fare. Non dappertutto, per carità, ma abbastanza da scoraggiare i giovani in gamba. Mi dispiace, perché il talento qui non manca."
    - tutor: "Detto con affetto, ma detto chiaro, e temo che molti ascoltatori siano d'accordo con te. A chi ha origini italiane e sogna di fare la tua stessa scelta, che cosa consigli?"
      goals: [critique]
    - learner: "Di venire senza la nostalgia degli altri in valigia. L'Italia dei nonni non esiste più, ed è giusto così: bisogna innamorarsi di quella che c'è adesso."
    - tutor: "La nostalgia degli altri in valigia: mi hai dato anche la frase di chiusura. Grazie davvero, è stato un piacere averti qui."
      goals: [advice]

- scenario: intervista-podcast
  level: C1
  persona: es-f-erasmus
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Ciao, grazie a te! Sono arrivata con l'Erasmus, a Padova, convinta di restare nove mesi. Poi mi sono innamorata, prima della città e poi di un padovano, in quest'ordine. Il padovano non c'è più, la città sì."
    - tutor: "In quest'ordine, mi raccomando! E i tuoi, in Spagna, come hanno preso la notizia che non tornavi?"
    - learner: "Mia madre ha pianto una settimana, poi è venuta a trovarmi, ha assaggiato il tiramisù e ha smesso di protestare. Adesso viene tre volte all'anno e conosce i miei vicini meglio di me."
    - tutor: "Una mamma conquistata dal tiramisù, ottimo! Dalla Spagna all'Italia sembra un salto piccolo. C'è stata comunque una differenza che ti ha spiazzata?"
      goals: [story]
      new: [{lemma: spiazzare, gloss: to catch off guard}]
    - learner: "Tantissime, proprio perché non me le aspettavo. La più grande è il rapporto con il cibo: da noi si mangia bene, ma qui è quasi una religione. La prima volta che ho messo il formaggio sulla pasta con le vongole, il mio coinquilino mi ha guardata come se avessi offeso sua madre."
    - tutor: "Il formaggio sulle vongole... Ti è andata bene che non ti ha cacciata di casa! E invece c'è una cosa che cambieresti di noi?"
      goals: [culture-shock]
    - learner: "Non vorrei sembrare ingrata, perché l'accoglienza è stata splendida. Però trovo che ai giovani si chieda troppa pazienza: uno stage dopo l'altro, contratti di tre mesi. Molti miei amici bravissimi se ne sono andati, ed è un peccato per tutti."
    - tutor: "Non sei ingrata, sei sincera, e purtroppo hai ragione. A una ragazza spagnola che ci ascolta e sta per fare le valigie, che cosa consigli?"
      goals: [critique]
    - learner: "Di non fidarsi della somiglianza tra le lingue! Lo spagnolo aiuta i primi due mesi, poi diventa una trappola. E di dire sempre di sì agli inviti, anche quando è stanca: è a tavola che ci si integra davvero."
    - tutor: "A tavola ci si integra: potrebbe essere il motto del nostro programma. Grazie mille, e salutami tua madre alla prossima visita!"
      goals: [advice]

- scenario: recensione-ristorante
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera, la ringrazio di essere venuto. Sì, purtroppo la cena è stata piuttosto deludente, tra l'attesa e la qualità dei piatti. Preferisco dirglielo di persona piuttosto che scrivere una recensione."
    - tutor: "Ha fatto benissimo, e mi dispiace sinceramente. Mi direbbe con precisione che cosa non è andato?"
      goals: [complain]
    - learner: "Abbiamo aspettato cinquanta minuti per i primi. E quando finalmente è arrivato, il mio risotto è salito dalla cucina freddo e con il riso troppo cotto."
      errors: [false-friend]
    - tutor: "Un risotto che è uscito dalla cucina freddo, dopo cinquanta minuti di attesa: non abbiamo scuse. L'ha fatto presente al cameriere?"
      goals: [detail]
      recast: {text: è salito dalla cucina, fix: è uscito dalla cucina, tags: [false-friend]}
    - learner: "Sì, gli l'ho detto subito, ma mi ha risposto che la cucina era molto impegnata e non è più tornato."
      errors: [combined-pronouns]
    - tutor: "Mi perdoni, non vorrei aver capito male: «gli l'ho detto»? Quei due pronomi, insieme, prendono un'altra forma. In ogni caso, una risposta simile non è accettabile."
      prompt: {text: gli l'ho detto, tags: [combined-pronouns]}
    - learner: "Ha ragione, gliel'ho detto subito. Sinceramente mi sarei aspettata che qualcuno si scusasse, o almeno che ci avvisassero del ritardo. In un locale di questo livello, pensavo che il servizio fosse più attento."
    - tutor: "Le sue aspettative erano del tutto legittime, e mi scuso io a nome di tutto il personale. Vorrei offrirle i primi e non farle pagare il vino. Le sembra una proposta adeguata?"
      goals: [expectation]
    - learner: "La ringrazio, accetto volentieri. Più dello sconto, però, mi farebbe piacere tornare un'altra sera e trovare il servizio che vi ha resi famosi."
    - tutor: "Sarà un piacere dimostrarglielo. Chieda pure di me quando prenota: mi occuperò personalmente del suo tavolo. Grazie per la franchezza, e ancora le mie scuse."
      goals: [resolve]

- scenario: recensione-ristorante
  level: C1
  persona: en-m-traveller
  history: [register]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, mi dispiace disturbarla, ma la bistecca che mi è stata servita non è quella che avevo ordinato, e finora nessuno mi è sembrato interessato alla cosa."
    - tutor: "Ha fatto bene a chiamarmi, e mi scuso se si è sentito ignorato. Che cosa aveva ordinato, esattamente?"
      goals: [complain]
    - learner: "Avevo chiesto una cottura al sangue, e l'avevo anche ripetuto. Mi è arrivata ben cotta, quasi secca. Guarda tu stesso: è grigia fino al centro."
      errors: [register]
    - tutor: "«Guarda tu stesso»? Forse tra noi è più adatta la forma di cortesia: come me lo direbbe? Il piatto, comunque, lo vedo bene, e capisco."
      prompt: {text: Guarda tu stesso, tags: [register]}
    - learner: "Mi scusi, ha ragione: guardi lei stesso. È grigia fino al centro, e in più la porzione è la metà di quella del tavolo accanto."
    - tutor: "Non posso che darle ragione: questa non è una cottura al sangue. Sulla porzione verifico subito con la cucina. Posso chiederle che cosa si aspettava quando ha segnalato il problema?"
      goals: [detail]
    - learner: "Mi aspettavo che il cameriere controllava con la cucina, invece ha alzato le spalle. Per quaranta euro, francamente, pretendo un minimo di attenzione."
      errors: [subjunctive-use]
    - tutor: "Sul prezzo ha perfettamente ragione. Solo un dettaglio: «mi aspettavo che controllava»... dopo «mi aspettavo che» quale modo ci vorrebbe? Intanto le assicuro che parlerò con il cameriere."
      prompt: {text: Mi aspettavo che il cameriere controllava, tags: [subjunctive-use]}
    - learner: "Dunque: mi aspettavo che il cameriere andava a controllare. Insomma, bastava un minuto."
      errors: [subjunctive-use]
    - tutor: "Certo: si aspettava che il cameriere andasse a controllare, e avrebbe dovuto farlo. Le propongo una nuova bistecca, cotta come desidera, e uno sconto del trenta per cento. Accetta?"
      goals: [expectation]
      recast: {text: andava a controllare, fix: andasse a controllare, tags: [subjunctive-use]}
    - learner: "Apprezzo l'offerta, ma a quest'ora non ho più fame. Lo sconto lo accetto; la bistecca, se non le dispiace, la rifiuto. Magari la prossima volta."
    - tutor: "Come preferisce. Applico subito lo sconto e le faccio portare il conto corretto. Spero di rivederla presto, e di farle cambiare idea su di noi."
      goals: [resolve]

- scenario: recensione-ristorante
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera, grazie per la disponibilità. Siamo qui per una cena di lavoro e, mi dispiace dirlo, tra una lunga attesa e un errore serio in un piatto la serata non sta andando come avremmo voluto."
    - tutor: "Mi dispiace molto, soprattutto in un'occasione di lavoro. Potrebbe spiegarmi meglio che cosa è accaduto?"
      goals: [complain]
    - learner: "Avevamo prenotato per le otto e ci hanno fatti sedere alle otto e quaranta. Inoltre avevo segnalato al telefono che uno degli ospiti è celiaco, eppure gli è stato portato un piatto di pasta normale. Per fortuna se n'è accorto in tempo."
    - tutor: "Questo è grave, e la ringrazio di avermelo detto. L'attesa è una mancanza, ma l'errore sul piatto è molto peggio. Chi ha preso la prenotazione le aveva confermato la richiesta?"
      goals: [detail]
      new: [{lemma: celiaco, gloss: coeliac}]
    - learner: "Sì, me l'aveva confermata una sua collega, che mi aveva perfino richiamata il giorno prima. Per questo mi sarei aspettata che la cucina fosse informata. Ho scelto questo locale perché me l'avevano descritto come affidabile, e con dei clienti importanti non potevo permettermi sorprese."
    - tutor: "Capisco perfettamente, e so che l'abbiamo delusa. Vorrei offrire la cena al suo ospite e uno sconto del venti per cento sul conto. Può andare?"
      goals: [expectation]
    - learner: "La ringrazio, ma preferirei di no: non è una questione di soldi. Mi basterebbe che lei si scusasse di persona con il mio ospite e che verificaste come sia potuto succedere. Lo sconto, sinceramente, non cambierebbe l'impressione che abbiamo avuto."
    - tutor: "Lo farò subito, è il minimo che possa fare. Mi permetta almeno di offrirvi il dolce e il caffè: non per rimediare, ma come gesto di cortesia."
    - learner: "Il caffè lo accettiamo volentieri, grazie. E apprezzo che non abbia cercato giustificazioni."
    - tutor: "Giustificazioni non ce ne sono. Vengo con lei al tavolo per scusarmi con il suo ospite, e domani stesso parlerò con la cucina. Grazie della sua pazienza."
      goals: [resolve]

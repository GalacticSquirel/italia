- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, esattamente. Capisco la situazione, ma un aumento del quindici per cento tutto in una volta per noi è difficile da sostenere."
    - tutor: "Lo capisco, e non le nascondo che ne stiamo parlando con molti clienti. Però le chiedo di considerare che negli ultimi due anni non abbiamo mai toccato i prezzi. Che margine di manovra avete voi?"
      goals: [problem]
    - learner: "Il problema è che penso che voi non siete consapevoli di quanto i nostri margini sono già stretti."
      errors: [subjunctive-use]
    - tutor: "Mi scusi, mi ripete la prima parte? «Penso che voi non siete consapevoli»... le suona bene, detto così?"
      prompt: {text: penso che voi non siete consapevoli, tags: [subjunctive-use]}
    - learner: "Ah, certo: penso che voi non siate consapevoli di quanto i nostri margini siano già stretti. Lavoriamo con voi da otto anni, e abbiamo sempre pagato puntuali."
    - tutor: "Questo è vero, e glielo riconosco volentieri: siete tra i clienti più affidabili che abbiamo. Proprio per questo vorrei trovare una soluzione. Lei cosa proporrebbe, concretamente?"
      goals: [argue]
    - learner: "Potremmo accettare un aumento del sette per cento, a patto che ci garantiate le consegne entro dieci giorni e che il prezzo resti bloccato fino a dicembre."
    - tutor: "Il sette mi sembra un po' basso, sinceramente. Se aumentaste anche i volumi dell'ordine, però, potrei arrivare al dieci con il prezzo bloccato fino a fine anno. Le andrebbe bene?"
      goals: [counteroffer]
    - learner: "Se il prezzo rimane bloccato e le consegne sono garantite, il dieci per cento possiamo accettarlo. Mi manderebbe una conferma scritta?"
    - tutor: "Perfetto, allora siamo d'accordo: dieci per cento, prezzo bloccato fino a dicembre e consegna entro dieci giorni. Le mando la conferma via mail entro stasera. È stato un piacere trattare con lei."
      goals: [agreement]

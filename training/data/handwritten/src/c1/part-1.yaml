- scenario: dibattito-ambiente
  level: C1
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Guardi, capisco la sua preoccupazione, ma io sono favorevole alla chiusura. Credo che il centro, così com'è, è diventato invivibile per chi ci abita."
      errors: [subjunctive-use]
    - tutor: "«Credo che il centro è diventato invivibile»: dopo «credo che» ci vorrebbe un altro modo, ci pensi un attimo. E poi invivibile mi pare una parola grossa: su che cosa basa un giudizio così severo?"
      goals: [position]
      prompt: {text: "Credo che il centro, così com'è, è diventato", tags: [subjunctive-use]}
    - learner: "Ha ragione, mi correggo: credo che sia diventato invivibile. Mi baso anzitutto sull'inquinamento: i dati dell'ultimo anno, che ho consultato di persona, superano i limiti di legge un giorno su tre."
    - tutor: "I dati li conosco e non sono incoraggianti, glielo concedo. Però l'aria sporca viene anche dal riscaldamento, non solo dalle macchine. Ha un secondo argomento, o si ferma qui?"
    - learner: "Ne ho un altro, e riguarda il rumore, a causa del quale molti residenti non riescono più a dormire con le finestre aperte. Un quartiere in cui non si riposa non è un quartiere sostenibile."
    - tutor: "Sul rumore ha ragione lei, abito sopra un incrocio. Resta il fatto che i commercianti arrivano già con fatica a fine mese. Se i clienti in auto non vengono più, chi paga i loro affitti?"
      goals: [argue]
    - learner: "È un timore comprensibile, ma nelle città in cui è stata creata una zona pedonale gli incassi, dopo un primo calo, sono tornati a crescere. Chi passeggia si ferma davanti alle vetrine; chi guida tira dritto."
    - tutor: "Può darsi, ma lì i mezzi pubblici funzionano, mentre da noi l'autobus passa quando ne ha voglia. Una persona anziana che abita in centro come porta a casa la spesa?"
      goals: [counter]
    - learner: "Su questo le do ragione: finché i mezzi pubblici non migliorano, non si può chiedere a tutti di rinunciare all'auto. Proporrei allora una chiusura graduale, limitata ai fine settimana, con permessi per i residenti e un parcheggio ai margini del centro."
    - tutor: "Messa così, la cosa comincia a sembrarmi ragionevole. Una prova nei fine settimana, con i permessi per chi ci abita, potrei votarla perfino io. La ringrazio del confronto: è stato più civile di quanto temessi."
      goals: [concede]

- scenario: dibattito-ambiente
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Mi permetta di dissentire. Insegno in una scuola del quartiere e ogni mattina vedo i bambini attraversare tra le macchine in doppia fila: per me il centro va chiuso al traffico, senza se e senza ma."
    - tutor: "Senza se e senza ma, addirittura! Guardi che le doppie file si risolvono con qualche controllo in più, non chiudendo le strade. A parte la sicurezza dei suoi bambini, quali vantaggi vede?"
      goals: [position]
    - learner: "Anzitutto la salute. L'aria che respiriamo dipende della quantità di auto che circolano, e tra i miei alunni i casi di asma sono in aumento da anni."
      errors: [preposition]
    - tutor: "Un momento: «dipende della quantità»? Con il verbo «dipendere» serve un'altra preposizione, ci pensi. Sull'asma, comunque, mi dispiace sinceramente per i suoi alunni. C'è dell'altro?"
      prompt: {text: "dipende della quantità", tags: [preposition]}
    - learner: "Dipende dalla quantità, certo, mi scusi. C'è dell'altro, sì: la vita del quartiere. Una piazza senza macchine torna a essere un luogo in cui ci si incontra, e non un parcheggio a cielo aperto."
    - tutor: "Bella immagine, ma i commercianti non vivono di poesia. Me lo dica con franchezza: chi entra nei negozi, se nessuno riesce più ad arrivarci in macchina?"
      goals: [argue]
    - learner: "Ci entra chi arriva a piedi, in bicicletta o in autobus. Diversi studi indicano che i commercianti sopravvalutano di molto il numero di clienti che vengono in auto."
    - tutor: "Gli studi, gli studi... Qui però l'autobus passa ogni mezz'ora, quando passa. E chi deve caricare la spesa di una settimana o accompagnare un genitore anziano come dovrebbe fare, secondo lei?"
      goals: [counter]
    - learner: "Qui devo riconoscere che ha ragione lei: per certe necessità la macchina resta indispensabile, almeno finché i mezzi pubblici non saranno potenziati. Si potrebbero allora chiudere soltanto le strade intorno alla scuola, e soltanto nelle ore in cui i bambini entrano e salgono da scuola."
      errors: [false-friend]
    - tutor: "Chiudere solo quando i bambini entrano ed escono da scuola: questa sì che è una proposta ragionevole. Su una misura così limitata, con il resto del centro aperto, potremmo anche trovarci d'accordo. La presenti alla prossima riunione e avrà il mio voto."
      goals: [concede]
      recast: {text: "salgono da scuola", fix: "escono da scuola", tags: [false-friend]}

- scenario: dibattito-ambiente
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Con tutto il rispetto, penso l'esatto contrario. Lavoro nel marketing e le assicuro che un centro pieno di auto non attira nessuno: a mio avviso la chiusura sarebbe un investimento, non un disastro."
    - tutor: "Un investimento, dice. Mi perdoni, ma è facile parlare di investimenti con i soldi degli altri. In concreto, che cosa ci guadagnerebbe il quartiere?"
      goals: [position]
    - learner: "In concreto, due cose. Primo, più gente a piedi significa più tempo passato davanti alle vetrine, e quindi più acquisti. Secondo, meno traffico vuol dire immobili che valgono di più, e questo conviene a tutti i residenti, lei compreso."
    - tutor: "Sul valore delle case potrebbe anche avere ragione. Però mio cognato ha un negozio di mobili: mi spiega come fa un cliente a portarsi via un divano senza poter arrivare in macchina?"
      goals: [argue]
    - learner: "Nessuno si porta a casa un divano sotto braccio nemmeno oggi: lo fa consegnare. Basterebbe prevedere delle fasce orarie per il carico e lo scarico, come avviene in qualunque zona pedonale che funzioni."
    - tutor: "D'accordo, il divano glielo concedo. Rimane il fatto che i lavori durerebbero mesi, e in quei mesi qualche negozio rischierebbe davvero di chiudere. Di questo non si preoccupa nessuno?"
      goals: [counter]
    - learner: "Me ne preoccupo eccome, e su questo punto le do atto che il rischio esiste. Per questo proporrei di procedere per gradi: una sola via per sei mesi, con dati alla mano prima di decidere se andare avanti."
    - tutor: "Una sola via, sei mesi, e poi si decide guardando i numeri. Non sono ancora convinto, ma una prova del genere non mi sentirei di bocciarla. A una condizione, però: chi misurerebbe i risultati?"
      goals: [concede]
    - learner: "Un soggetto indipendente, direi: magari l'università, in modo che né il Comune né i commercianti possano accusarsi a vicenda di aver truccato i conti."
    - tutor: "L'università mi sta bene, purché i dati vengano resi pubblici. Vede che, a forza di discutere, qualcosa di buono è venuto fuori? Ne riparleremo alla prossima riunione, con i numeri davanti."

- scenario: politica-lavoro
  level: C1
  persona: en-m-traveller
  history: [hypothetical]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Mah, Riccardo, mi sembri un po' catastrofico. Certo, l'automazione cambierà parecchie cose, però i lavori si trasformano, non spariscono da un giorno all'altro. Lo dicevano anche dei bancomat, no?"
    - tutor: "Catastrofico io? Realista, semmai. I bancomat erano macchinette, qui parliamo di tecnologia che scrive, disegna e guida. Facciamo un gioco: che succederebbe se domani sparissero tutti gli autisti?"
      goals: [opinion]
    - learner: "Beh, se tutti gli autisti perderebbero il lavoro domani, sarebbe un casino, ovvio. Ma non succede così: ci vogliono anni, e nel frattempo la gente si ricicla in altri settori."
      errors: [hypothetical]
    - tutor: "«Se tutti gli autisti perderebbero»: dopo «se» quel condizionale non regge, riprova. Sul casino siamo d'accordo, sul resto meno: un camionista di cinquant'anni in che cosa si ricicla, secondo te?"
      prompt: {text: "se tutti gli autisti perderebbero", tags: [hypothetical]}
    - learner: "Ok, se gli autisti perderanno... no, aspetta: se perderebbero tutti il lavoro insieme, lo Stato dovrebbe pagargli dei corsi di formazione. Il camionista potrebbe gestire la logistica, per dire."
      errors: [hypothetical]
    - tutor: "Se perdessero tutti il lavoro insieme, dici: guarda che è proprio lo scenario che temo. E i corsi di formazione li ho visti, spesso sono parcheggi. Ce l'hai un esempio concreto di qualcuno che ce l'ha fatta davvero?"
      goals: [hypothesis]
      recast: {text: "se perderebbero tutti il lavoro insieme", fix: "Se perdessero tutti il lavoro insieme", tags: [hypothetical]}
    - learner: "Ce l'ho, sì. Mio zio a Dublino faceva il tipografo, e quando la sua ditta ha chiuso ha imparato a impaginare al computer. Oggi lavora più di prima, e guadagna pure meglio."
    - tutor: "Tuo zio è stato bravo, ma uno su quanti? Per ogni tipografo che si è salvato ce ne sono dieci rimasti a spasso. Comunque, dai, tira le somme: alla fine è più un rischio o un'opportunità?"
      goals: [example]
      new: [{lemma: "a spasso", gloss: "out of work (colloquial)"}]
    - learner: "Tirando le somme: è un rischio per chi resta fermo e un'opportunità per chi si aggiorna, quindi tutto dipende da quanto investiamo nella formazione. E tu, sotto sotto, ci credi davvero a questa storia della metà dei lavori?"
    - tutor: "Se ci credo davvero? Forse esagero un po', lo ammetto, mi piace fare l'uccello del malaugurio. Però sulla formazione mi hai quasi convinto. Passami il vino, va', che di lavoro abbiamo parlato abbastanza."
      goals: [conclude]
      new: [{lemma: "uccello del malaugurio", gloss: "prophet of doom"}]

- scenario: politica-lavoro
  level: C1
  persona: es-f-erasmus
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Io dico che sei troppo pessimista, Riccardo. Che l'automazione elimini certi compiti ripetitivi è evidente, ma da qui a dire che sparirà la metà dei lavori ce ne passa."
    - tutor: "Ce ne passa, ce ne passa... Intanto al supermercato sotto casa hanno tolto quattro cassiere su sei. Prova a immaginare: se le macchine facessero tutto, noi di che cosa vivremmo?"
      goals: [opinion]
    - learner: "Se le macchine facessero davvero tutto, lavoreremmo meno ore e ci divideremmo la ricchezza in un altro modo. Sarebbe un problema politico, più che tecnologico. Ma non credo che ci arriveremo tanto presto."
    - tutor: "Un problema politico: appunto, figurati come siamo messi! Comunque le ipotesi sono belle, ma a me servono i fatti. Mi fai un esempio concreto di un settore che non si è fatto travolgere?"
      goals: [hypothesis]
    - learner: "Te ne faccio uno di casa mia. A Siviglia il turismo ha cambiato tantissimo negli ultimi anni con le prenotazioni online, eppure le agenzie non sono sparite: si sono specializzate."
      errors: [auxiliary-choice]
    - tutor: "Aspetta, «il turismo ha cambiato tantissimo»? Qui il turismo non cambia qualcosa, cambia lui: occhio all'ausiliare. E queste agenzie specializzate quanta gente occupano, rispetto a prima?"
      goals: [example]
      prompt: {text: "il turismo ha cambiato tantissimo", tags: [auxiliary-choice]}
    - learner: "Mmm, non lo vedo... Il turismo ha cambiato molto, no? Comunque sì, occupano meno persone, questo è vero, ma più qualificate e pagate meglio."
      errors: [auxiliary-choice]
    - tutor: "Il turismo è cambiato molto, sì: quando «cambiare» non ha un oggetto, vuole «essere». Meno persone ma pagate meglio, dici: bella consolazione per chi resta fuori! Dai, tira le fila: dove andiamo a finire?"
      recast: {text: "Il turismo ha cambiato molto", fix: "Il turismo è cambiato molto", tags: [auxiliary-choice]}
    - learner: "Tiro le fila: la tecnologia distrugge alcuni mestieri e ne crea altri, e chi si forma ha molto esito. Il vero rischio è lasciare indietro chi non può aggiornarsi. E tu, che fai tanto lo scettico, che soluzione proponi?"
      errors: [false-friend]
    - tutor: "Chi si forma ha molto successo, d'accordo, ma io resto dell'idea che serviranno regole, non solo corsi. Una soluzione in tasca non ce l'ho, lo confesso. Però su chi resta indietro la pensiamo allo stesso modo, e non è poco."
      goals: [conclude]
      recast: {text: "ha molto esito", fix: "ha molto successo", tags: [false-friend]}

- scenario: politica-lavoro
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Dico che la spari grossa, come al solito. Qualche mestiere sparirà di sicuro, ma metà mi pare un numero buttato lì per fare scena."
    - tutor: "Per fare scena, io? Guarda che l'ho letto su un giornale serio, mica al bar. Però va bene, ragioniamo: mettiamo che domani un programma sapesse fare il tuo lavoro, tu che faresti?"
      goals: [opinion]
    - learner: "Se un programma sapesse fare il mio lavoro meglio di me, mi metterei a fare quello che il programma non sa fare: parlare con i clienti, capire che cosa vogliono davvero. E se non bastasse, mi rimetterei a studiare, pazienza."
    - tutor: "Facile a dirsi a trent'anni, un po' meno a cinquantacinque con il mutuo da pagare. Ce l'hai un caso vero, uno che conosci, o stiamo parlando per sentito dire?"
      goals: [hypothesis]
      new: [{lemma: mutuo, gloss: mortgage}]
    - learner: "Ce l'ho in famiglia. Mio nonno faceva il sarto in Calabria; quando sono arrivati i vestiti fatti in serie ha perso quasi tutti i clienti, così è emigrato e si è messo a riparare macchine da cucire. Non si è arricchito, ma ha tirato su quattro figli."
    - tutor: "Bella storia, davvero, e tanto di cappello a tuo nonno. Però ha dovuto attraversare un oceano per cavarsela, mica gli è bastato un corso serale! Non ti pare che questo dia ragione a me?"
      goals: [example]
      new: [{lemma: "tanto di cappello", gloss: "hats off"}]
    - learner: "In parte sì, te lo concedo: il prezzo qualcuno lo paga sempre. Ma dimostra anche che la gente si adatta, soprattutto se non viene lasciata sola."
    - tutor: "«Se non viene lasciata sola»: ecco, qui casca l'asino. Chi dovrebbe occuparsene, secondo te, lo Stato o le aziende che con l'automazione ci guadagnano?"
      new: [{lemma: "qui casca l'asino", gloss: "that's the catch, there's the rub"}]
    - learner: "Tutti e due, direi. Quindi, per chiudere: la tecnologia toglie e dà, e la differenza la fa la formazione che offriamo a chi perde il posto. Tu invece come la vedi, alla fine della fiera?"
    - tutor: "Alla fine della fiera la vedo meno nera di prima, ma che resti tra noi. Se Stato e aziende facessero la loro parte, potrei anche ammettere che hai ragione. Intanto beviamo alla salute di tuo nonno, che se lo merita."
      goals: [conclude]

- scenario: turismo-di-massa
  level: C1
  persona: en-f-student
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno a tutti! Mi chiamo Emma, studio storia dell'arte e vivo a Venezia da due anni. Sono a favore del ticket, anche se non credo che basti da solo a risolvere il sovraffollamento."
    - tutor: "Benvenuta, Emma. Favorevole ma con riserva, quindi. Io però faccio l'avvocato del diavolo: far pagare l'ingresso non trasforma una città in un parco a tema? Mi dia un esempio che mi convinca."
      goals: [introduce]
    - learner: "Volentieri. L'anno scorso i residenti del mio sestiere sono stati promessi più controlli sulle crociere, e non è cambiato niente. Il ticket, almeno, è una misura concreta: nei giorni in cui era in vigore ho visto meno comitive ammassate sui ponti."
      errors: [passive]
    - tutor: "Un attimo: «i residenti sono stati promessi»? In italiano chi riceve la promessa non può fare da soggetto: provi a girare la frase. E mi dica, quelle comitive sono sparite o hanno solo cambiato giorno?"
      goals: [example]
      prompt: {text: "i residenti del mio sestiere sono stati promessi", tags: [passive]}
    - learner: "Ah, giusto... I residenti sono stati promessi dal Comune, volevo dire. Comunque qualcuna ha cambiato giorno, certo, ma distribuire gli arrivi è già un risultato, no?"
      errors: [passive]
    - tutor: "Ai residenti sono stati promessi più controlli, ecco come si dice. Distribuire gli arrivi, d'accordo. Molti ascoltatori però ci scrivono che cinque euro non fermano nessuno e servono solo a fare cassa. Che cosa risponde?"
      recast: {text: "I residenti sono stati promessi dal Comune", fix: "Ai residenti sono stati promessi più controlli", tags: [passive]}
    - learner: "Rispondo che hanno ragione a metà. Cinque euro non scoraggiano chi ha già pagato volo e albergo, ma il ticket obbliga a prenotare, e questo permette finalmente di sapere quante persone arriveranno. Senza dati non si governa niente."
    - tutor: "I dati come strumento di governo: argomento interessante, lo ammetto. Ma i numeri da soli non svuotano le calli. Se fosse lei a decidere, quale soluzione realistica proporrebbe?"
      goals: [rebut]
      new: [{lemma: calle, gloss: "narrow Venetian street"}]
    - learner: "Proporrei un tetto giornaliero agli ingressi, con prenotazione obbligatoria, e userei gli incassi per abbassare gli affitti ai residenti. Altrimenti il centro storico si svuota e resta solo la scenografia."
    - tutor: "Un tetto agli ingressi e incassi destinati a chi ci abita: proposta chiara, e non così lontana da ciò che chiedono i comitati. Grazie, Emma, e in bocca al lupo per gli studi. Passiamo alla prossima telefonata."
      goals: [proposal]

- scenario: turismo-di-massa
  level: C1
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno, sono Pablo e faccio il cameriere a Firenze da sei anni. Io sono contrario al ticket: mi pare che è una tassa sui poveri, perché chi ha soldi entra lo stesso."
      errors: [subjunctive-use]
    - tutor: "Buongiorno, Pablo. «Mi pare che è una tassa»: con «mi pare che» quale modo ci aspettiamo? Glielo lascio sistemare. Intanto la provoco: lei di turismo ci vive, non le conviene che arrivi chiunque?"
      goals: [introduce]
      prompt: {text: "mi pare che è una tassa", tags: [subjunctive-use]}
    - learner: "Mi pare che sia una tassa, scusi. Mi conviene fino a un certo punto: nel ristorante dove lavoro, d'estate, serviamo trecento coperti al giorno, ma la gente mangia in venti minuti e scappa. Si guadagna di più, però il lavoro è diventato una catena di montaggio."
    - tutor: "Trecento coperti e nessuno che si goda il pranzo: rende bene l'idea. Però, mi permetta, senza un biglietto d'ingresso i numeri continueranno a salire. Non è meglio una misura imperfetta che niente?"
      goals: [example]
    - learner: "Non sono d'accordo. Una misura imperfetta dà l'impressione che il problema sia risolto, e intanto nessuno tocca le cose che contano: gli affitti brevi e le crociere. È come prendere un'aspirina per una gamba rotta."
    - tutor: "L'aspirina per la gamba rotta me la segno, rende l'idea. Va bene, il ticket non le piace. Ma dire di no è facile: lei che cosa farebbe al posto del sindaco?"
      goals: [rebut]
    - learner: "Limiterei gli affitti brevi nel centro storico e metterei un numero massimo di gruppi organizzati al giorno. E soprattutto bisognerebbe tenere in conto i residenti, che oggi non vengono mai ascoltati."
      errors: [word-choice]
    - tutor: "Tenere conto dei residenti: su questo credo che nessuno in studio avrebbe da ridire. Limiti agli affitti brevi e ai gruppi, dunque. E l'economia locale reggerebbe, con meno visitatori?"
      goals: [proposal]
      recast: {text: "tenere in conto i residenti", fix: "Tenere conto dei residenti", tags: [word-choice]}
    - learner: "Reggerebbe, secondo me, perché un turista che resta tre notti spende più di dieci che passano in giornata. Meno persone, ma che restano di più: è l'unica sostenibilità che conosco."
    - tutor: "Meno persone ma più a lungo: una formula che sentiamo spesso, e detta da chi sta in sala tutti i giorni ha un altro peso. Grazie della telefonata, Pablo, e buon lavoro per stasera."

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
    - learner: "Buongiorno. Mi chiamo Walter, sono un ingegnere in pensione e da qualche anno passo metà dell'anno a Venezia. Sono favorevole al ticket, benché mi renda conto che non è una soluzione popolare."
    - tutor: "Buongiorno, Walter, e complimenti per il suo italiano. Un ospite favorevole a far pagare gli altri ospiti: curioso! Che cosa ha visto, in questi anni, per pensarla così?"
      goals: [introduce]
    - learner: "Ho visto chiudere, uno dopo l'altro, i negozi di cui si servivano i residenti. Sotto casa mia c'era un fornaio; ora al suo posto vendono maschere fabbricate chissà dove. Il turismo di giornata consuma la città senza lasciarle quasi niente."
    - tutor: "Il fornaio sostituito dalle maschere: un'immagine che molti ascoltatori riconosceranno. Ma mi lasci fare la parte del cattivo. Venezia vive di turismo da secoli: non è ipocrita volerne i soldi senza volerne la folla?"
      goals: [example]
    - learner: "Capisco l'obiezione, ma non sei giusto con chi ci abita. Nessuno rifiuta i visitatori; si chiede soltanto che il loro numero sia compatibile con la vita quotidiana. Anche un teatro vive di spettatori, eppure nessuno trova ipocrita che i posti siano limitati."
      errors: [register]
    - tutor: "Il paragone con il teatro regge, glielo riconosco. Però, Walter, siamo in diretta e non ci conosciamo: quel «non sei giusto» come lo direbbe, con un po' più di distanza?"
      goals: [rebut]
      prompt: {text: "non sei giusto", tags: [register]}
    - learner: "Ha perfettamente ragione, mi scusi: volevo dire che lei non è giusto con chi ci abita. L'abitudine di dare del tu ai vicini mi ha tradito."
    - tutor: "Nessun problema: ai vicini si dà del tu, a chi parla alla radio un po' meno! Torniamo a noi. Se il ticket da solo non basta, che cosa si potrebbe fare davvero, secondo lei?"
    - learner: "Proporrei che il numero di ingressi giornalieri venisse fissato per legge e che le grandi crociere fossero dirottate su un porto esterno. Inoltre, gli incassi andrebbero spesi per riportare in centro botteghe e servizi."
    - tutor: "Un numero chiuso, le crociere fuori e gli incassi investiti nelle botteghe: un programma da assessore, altro che pensionato! La ringrazio, Walter, è stato un piacere averla con noi."
      goals: [proposal]
      new: [{lemma: assessore, gloss: "city councillor"}]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-professional
  history: [hypothetical]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la paura, ma secondo me la metti giù troppo dura. Alcuni compiti spariranno, certo, però non interi mestieri: nel mio ufficio usiamo questi strumenti da un anno e nessuno è stato licenziato."
    - tutor: "Per ora, cara mia, per ora. Il primo anno ti aiutano, il secondo ti sostituiscono. Tu dici che non è così: su che cosa ti basi, a parte il tuo ufficio?"
      goals: [position]
    - learner: "Mi baso su quello che è successo con ogni tecnologia. Quando sono arrivati i fogli di calcolo si diceva che i contabili sarebbero spariti; eventualmente ne abbiamo avuti più di prima, solo con competenze diverse."
      errors: [false-friend]
    - tutor: "Alla fine ne abbiamo avuti più di prima, d'accordo, ma un foglio di calcolo non scriveva le relazioni al posto tuo. Stavolta la macchina fa anche il lavoro di testa. Non ti sembra una differenza enorme?"
      goals: [evidence]
      recast: {text: "eventualmente ne abbiamo avuti più di prima", fix: "Alla fine ne abbiamo avuti più di prima", tags: [false-friend]}
    - learner: "È una differenza, lo riconosco. E ti concedo anche un'altra cosa: se io avrei vent'anni e cercassi il primo impiego, sarei molto più preoccupata, perché i lavori d'ingresso sono i primi a rischio."
      errors: [hypothetical]
    - tutor: "Ah, finalmente un po' di sana paura! Però «se io avrei vent'anni» non mi suona: dopo «se» quel modo del verbo non va bene, come lo sistemi? E poi, a quei ragazzi che cosa racconti?"
      goals: [concede]
      prompt: {text: "se io avrei vent'anni", tags: [hypothetical]}
    - learner: "Se avessi vent'anni, giusto. A quei ragazzi direi di non competere con la macchina su ciò che fa bene, ma di imparare a guidarla. E direi alle aziende di investire nella formazione, invece di tagliare e basta."
    - tutor: "Imparare a guidarla: detta così suona quasi rassicurante. Sulla formazione, guarda, ti do ragione senza riserve. A questo punto mi chiedo: che cosa ci divide davvero, io e te?"
    - learner: "Poco, direi. Il rischio è reale, soprattutto per i più giovani, ma non è un destino: dipende da chi governa il cambiamento. Tu temi il peggio, io spero nel meglio, però in fondo chiediamo le stesse cose."
    - tutor: "Chiediamo le stesse cose: formazione seria e qualcuno che governi il cambiamento. Mi sta bene, lo firmo. Resto pessimista di natura, ma stasera un po' meno. Prendi ancora un po' di dolce?"
      goals: [conclude]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Paura no, dai, non esagerare. Preoccupazione sì, quella ce l'ho anch'io. Però a casa metà di noi non credo proprio: dipende molto dal settore in cui lavori."
    - tutor: "Dipende dal settore, dici. Tu lavori in magazzino, giusto? Proprio lì i robot stanno arrivando di corsa. Da voi che aria tira, sinceramente?"
      goals: [position]
    - learner: "Guarda, da noi hanno messo un sistema automatico due anni fa. All'inizio pensavo che era la fine, e invece hanno assunto tre persone in più per gestirlo e fare la manutenzione."
      errors: [subjunctive-use]
    - tutor: "Tre assunzioni in più, questa non me l'aspettavo. Senti però: «pensavo che era la fine»? Con «pensavo che» il verbo va cambiato di modo, riprova. E quelli che spostavano le casse, che fine hanno fatto?"
      goals: [evidence]
      prompt: {text: "pensavo che era la fine", tags: [subjunctive-use]}
    - learner: "Pensavo che sia la fine, volevo dire. Quelli delle casse... beh, due li hanno formati per il nuovo sistema, ma uno più anziano è rimasto fuori, questo è vero. Su di lui hai ragione tu."
      errors: [subjunctive-use]
    - tutor: "Pensavo che fosse la fine: al passato ci vuole l'imperfetto. Comunque grazie per l'onestà, perché è proprio quell'uno rimasto fuori che non mi fa dormire. Che cosa si poteva fare per lui?"
      goals: [concede]
      recast: {text: "Pensavo che sia la fine", fix: "Pensavo che fosse la fine", tags: [subjunctive-use]}
    - learner: "Bastava cominciare prima con la formazione, non a cose fatte. Se l'azienda lo avesse preparato per tempo, oggi sarebbe ancora lì. Il problema non è stata la tecnologia, è stata la fretta."
    - tutor: "Sulla fretta sfondi una porta aperta: le aziende comprano la macchina e alle persone ci pensano dopo. Quindi, in fondo, tu e io litighiamo sul futuro ma non sul da farsi?"
      new: [{lemma: "sfondare una porta aperta", gloss: "to preach to the converted"}]
    - learner: "Esatto. Tu vedi il bicchiere mezzo vuoto e io mezzo pieno, ma tutti e due vogliamo che nessuno venga lasciato indietro. Formazione prima, macchine dopo: su questo possiamo brindare."
    - tutor: "Formazione prima, macchine dopo: lo faccio stampare su una maglietta. Io la paura me la tengo, sia chiaro, ma su questo punto sto con te. Dai, brindiamo."
      goals: [conclude]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-student
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Ma dai, sembri mia nonna quando è uscito il telefonino! Scherzi a parte, un po' ti capisco. Io direi che cambierà quasi tutti i lavori, ma che ne cancellerà molti meno di quanto si pensi."
    - tutor: "Tua nonna aveva ragione: guarda come siamo ridotti, tutti con il naso sullo schermo! E poi «cambiare» è una parola comoda. Hai qualche prova, o è solo l'ottimismo dei vent'anni?"
      goals: [position]
    - learner: "Qualche prova ce l'ho. All'università ho seguito un seminario sulla traduzione: sembrava il primo mestiere destinato a sparire, e invece i traduttori oggi rivedono testi prodotti dalle macchine. È un lavoro diverso, magari meno poetico, ma c'è."
    - tutor: "Rivedere il lavoro di una macchina, pagati la metà: bel progresso. Non è che il posto di lavoro resta e lo stipendio se ne va?"
      goals: [evidence]
    - learner: "Questo è un punto che non posso negare: in parecchi casi le tariffe sono scese davvero, e chi ha iniziato da poco fa una gran fatica. Che il lavoro esista ancora non significa che sia un buon lavoro."
    - tutor: "Oh, meno male, cominciavo a sentirmi solo! Quindi anche tu ammetti che c'è da preoccuparsi. A questo punto che cosa ci divide, secondo te?"
      goals: [concede]
    - learner: "Ci divide il tono, più che la sostanza. Tu dai la cosa per persa; io penso che, se chi lavora avesse voce in capitolo su come si usa la tecnologia, potrebbe andare molto meglio."
    - tutor: "«Voce in capitolo»: bella espressione, e bella speranza. Io ci credo poco, ma ammetto che arrendersi in anticipo non serve a nessuno. Su che cosa potremmo metterci d'accordo, allora?"
    - learner: "Sul fatto che il rischio c'è, che riguarda soprattutto chi ha meno competenze, e che la risposta è la formazione, non la nostalgia. Tu ci metti la prudenza, io la fiducia: insieme facciamo una persona equilibrata."
    - tutor: "Una persona equilibrata in due: mi sembra un buon affare. Vada per la formazione al posto della nostalgia, allora. Però la prudenza me la tengo stretta, non si sa mai."
      goals: [conclude]

- scenario: notizie-attualita
  level: C1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho seguita ieri sera. In pratica la nuova legge obbliga chi affitta ai turisti a registrarsi, e nei centri storici mette un limite al numero di notti all'anno. Attualmente non vieta niente, anche se i titoli facevano pensare il contrario."
      errors: [false-friend]
    - tutor: "Esatto, in realtà non vieta niente: regola, e pure con mano leggera. Eppure a leggere certi titoli sembrava la fine del mondo. A te, nel merito, sembra una buona legge o la solita toppa?"
      goals: [summarise]
      recast: {text: "Attualmente non vieta niente", fix: "in realtà non vieta niente", tags: [false-friend]}
      new: [{lemma: toppa, gloss: "patch, stopgap"}]
    - learner: "Una via di mezzo. L'intenzione è giusta, perché in certe città trovare casa è diventato impossibile. Però ho paura che i controlli restino sulla carta, e una regola che nessuno fa rispettare serve a poco."
    - tutor: "Sui controlli sono più scettico di te, figurati. Io ieri ho letto tre testate diverse e sembravano tre notizie diverse. Tu dove ti sei informato?"
      goals: [opinion]
    - learner: "Ho aperto parecchi articoli sul telefono, ma ho finito solo due, lo confesso. Uno parlava di attacco alla proprietà privata, l'altro di vittoria storica per gli inquilini. Stessi fatti, due mondi."
      errors: [ci-ne]
    - tutor: "Stessi fatti, due mondi: hai colto il punto. Aspetta però, «ho finito solo due»: due di che cosa? Lì manca una parolina, e occhio al participio. Quale dei due ti è sembrato più onesto?"
      goals: [sources]
      prompt: {text: "ho finito solo due", tags: [ci-ne]}
    - learner: "Ah, ho finito solo due di loro! Il più onesto, direi, era il secondo, perché almeno citava il testo della legge. L'altro riportava solo le dichiarazioni di un'associazione di proprietari."
      errors: [ci-ne]
    - tutor: "Si dice «ne ho finiti solo due», con «ne» al posto degli articoli. Citare la fonte fa già la differenza, hai ragione. E adesso, secondo te, che succede: i prezzi scendono davvero?"
      recast: {text: "ho finito solo due di loro", fix: "ne ho finiti solo due", tags: [ci-ne]}
    - learner: "Mah, non ci giurerei. Può darsi che qualche proprietario torni agli affitti lunghi, ma molti troveranno il modo di aggirare la legge. Secondo me tra un anno ne riparleremo, con le stesse polemiche e titoli ancora più grossi."
    - tutor: "Tra un anno, stessa macchinetta e stessa polemica: ci scommetto un caffè anch'io. Però se anche solo qualche casa tornasse sul mercato, sarebbe già qualcosa. Dai, torniamo a lavorare."
      goals: [consequences]

- scenario: notizie-attualita
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
    - learner: "L'ho vista, sì. Da quello che ho capito, il governo ha approvato una legge che limita gli affitti brevi nelle città d'arte: chi ha più di due appartamenti dovrà aprire una partita IVA e rispettare un tetto di notti."
    - tutor: "Riassunto perfetto, meglio di certi telegiornali. E come ti pare? Io ho qualche dubbio: mi sa tanto di legge fatta per i titoli dei giornali."
      goals: [summarise]
    - learner: "Capisco il dubbio, ma io la vedo con più favore. A Siviglia è successa la stessa cosa: il centro si è svuotato di famiglie. Detto questo, un giudizio serio lo potremo dare solo quando la legge entri in vigore."
      errors: [subjunctive-use]
    - tutor: "Giusto aspettare i fatti. Una cosa, però: «quando la legge entri in vigore»? In italiano, per un fatto futuro dopo «quando», il congiuntivo non si usa: prova con un altro tempo. E i giornali come l'hanno raccontata?"
      goals: [opinion]
      prompt: {text: "quando la legge entri in vigore", tags: [subjunctive-use]}
    - learner: "Quando la legge entrerà in vigore, certo: è lo spagnolo che mi tradisce. I giornali? Ognuno ha tirato l'acqua al suo mulino. Una testata titolava «Stangata sui proprietari», un'altra «Finalmente case per i residenti». Solo un approfondimento del fine settimana spiegava i numeri."
    - tutor: "L'acqua al suo mulino, proprio così. Io ho contato quattro versioni diverse della stessa cifra, e nessuna citava la fonte. Con una polemica del genere, che cosa ti aspetti che succeda adesso?"
      goals: [sources]
    - learner: "Credo che nei primi mesi ci sarà molta confusione e qualche ricorso. Poi, se i Comuni faranno sul serio, una parte degli appartamenti tornerà agli affitti normali. Non sarà una rivoluzione, ma potrebbe frenare l'aumento dei prezzi."
    - tutor: "Frenare l'aumento, non invertire la rotta: mi sembra una previsione onesta. Io temo che i furbi troveranno la scappatoia in una settimana. Tu no?"
      goals: [consequences]
      new: [{lemma: scappatoia, gloss: loophole}]
    - learner: "I furbi ci saranno sempre, purtroppo. Ma che qualcuno aggiri una legge non mi pare un buon motivo per non farla. Preferisco una regola imperfetta alla giungla di adesso."
    - tutor: "Una regola imperfetta contro la giungla: messa così è difficile darti torto. Va bene, sospendo il giudizio fino ai primi dati. Intanto il caffè si è raffreddato, come al solito."

- scenario: notizie-attualita
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Come no, a casa mia se n'è parlato tutta la sera. In due parole: d'ora in poi chi affitta ai turisti deve avere un codice identificativo, e nei centri storici non si potranno più aprire nuovi affitti brevi senza il permesso del Comune."
    - tutor: "Preciso. E a casa tua chi ha vinto la discussione? Perché da me mia moglie dice che era ora, e io dico che è fumo negli occhi."
      goals: [summarise]
      new: [{lemma: "fumo negli occhi", gloss: "window dressing, smoke and mirrors"}]
    - learner: "Da me non ha vinto nessuno, come sempre. Per me la legge fa senso sulla carta: mia cugina cerca casa da un anno e non trova niente sotto i mille euro. Ma temo che colpisca il piccolo proprietario e lasci in pace le grandi società."
      errors: [word-choice]
    - tutor: "Sulla carta ha senso, te lo concedo; è nella pratica che vedo i problemi. A proposito, hai notato come l'hanno raccontata i vari giornali? Io ne ho letti tre e mi è venuto il mal di testa."
      goals: [opinion]
      recast: {text: "fa senso", fix: "ha senso", tags: [word-choice]}
    - learner: "L'ho notato eccome. Il quotidiano che legge mio padre parlava di «guerra ai proprietari», mentre un sito che seguo io titolava sulla «svolta per gli inquilini». La cosa buffa è che tutti e due citavano lo stesso comunicato, tagliato in punti diversi."
    - tutor: "Lo stesso comunicato tagliato in due modi: ecco perché non mi fido più dei titoli. L'unico articolo decente era un approfondimento pieno di tabelle, che non avrà letto nessuno. E adesso che cosa succederà, secondo te?"
      goals: [sources]
    - learner: "Secondo me succederà poco, all'inizio. Qualche proprietario venderà, qualcun altro tornerà agli affitti lunghi, e magari tra due anni i prezzi smetteranno di salire. Sempre che nel frattempo non cambi il governo e non cancellino tutto."
    - tutor: "Sempre che non cancellino tutto: da noi è il rischio più concreto. Se dovessi scommettere, però, tua cugina la trova o no una casa entro l'anno?"
      goals: [consequences]
    - learner: "Se dovessi scommettere, direi di sì, ma non grazie alla legge: grazie a una zia che conosce mezzo quartiere. In Italia funziona ancora così, o sbaglio?"
    - tutor: "Non sbagli affatto: la zia batte qualunque legge, da sempre. Fammi sapere come va a finire, che la storia mi interessa più dei giornali. Buon lavoro!"

- scenario: vita-in-italia
  level: C1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno e grazie dell'invito. Ho scelto l'Italia quasi per caso: ero andato in pensione, mia moglie aveva sempre sognato la Toscana, e così ci siamo trasferiti. Ho vissuto a Lucca per sei anni e non ho nessuna intenzione di andarmene."
      errors: [tense-aspect]
    - tutor: "Una scelta d'amore, dunque. Mi tolga una curiosità: dice «ho vissuto a Lucca per sei anni», ma a Lucca ci sta ancora. Come lo direbbe, allora? E mi racconti: che cosa è stato più difficile all'inizio?"
      goals: [story]
      prompt: {text: "Ho vissuto a Lucca per sei anni", tags: [tense-aspect]}
    - learner: "Ha ragione: vivo a Lucca da sei anni. La cosa più difficile è stata la burocrazia. Per ottenere la residenza ho fatto la fila in quattro uffici diversi, e in ognuno mi chiedevano un documento che l'ufficio precedente non mi aveva dato."
    - tutor: "La burocrazia, il nostro sport nazionale! Si consoli, mette alla prova anche noi italiani. E la nostalgia di casa non si è mai fatta sentire?"
      goals: [difficulties]
    - learner: "Si è fatta sentire, soprattutto il primo inverno, quando non conoscevamo nessuno. Mi ha salvato la libreria comunale: ci passavo i pomeriggi a leggere i giornali, e lì ho conosciuto altri pensionati che mi hanno adottato."
      errors: [false-friend]
    - tutor: "La biblioteca comunale come porta d'ingresso nella città: che bella immagine. Dopo sei anni e tanti pomeriggi fra i giornali, in che cosa si sente cambiato?"
      recast: {text: "la libreria comunale", fix: "La biblioteca comunale", tags: [false-friend]}
    - learner: "Sono diventato più paziente, credo. In Ohio misuravo le giornate in cose fatte; qui ho imparato che una chiacchierata di mezz'ora con il fornaio non è tempo perso. Se me l'avessero detto dieci anni fa, non ci avrei creduto."
    - tutor: "Il tempo perso che diventa tempo guadagnato: un cambiamento non da poco per un ingegnere. Per chiudere, che consiglio darebbe a un ascoltatore straniero che sogna di trasferirsi qui?"
      goals: [change]
    - learner: "Gli consiglierei di imparare la lingua prima di partire, e non dopo. E poi di avere pazienza: l'accoglienza c'è, ma bisogna meritarsela, frequentando il bar, il mercato, la piazza. Chi resta chiuso in casa non si integrerà mai."
    - tutor: "Imparare la lingua e frequentare la piazza: consigli semplici e preziosi. La ringrazio di cuore per essere stato con noi, e porti i nostri saluti a Lucca."
      goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno, grazie a voi. Sono arrivata a Bologna quattro anni fa con una borsa Erasmus e dovevo fermarmi sei mesi. Poi mi sono innamorata della città, ho trovato un lavoro in una casa editrice e, semplicemente, non sono più ripartita."
    - tutor: "Sei mesi diventati quattro anni: a Bologna succede a molti. E la sua famiglia come ha preso la notizia che non sarebbe tornata?"
      goals: [story]
    - learner: "Non benissimo, a essere sincera. Quando se l'ho detto a mia madre, ha pianto per una settimana. La nostalgia è stata la sfida più grande, più della burocrazia: le domeniche senza la mia famiglia mi pesavano tantissimo."
      errors: [combined-pronouns]
    - tutor: "Povera mamma, la capisco. Una cosa sola: «se l'ho detto a mia madre»? Quel «se» viene dallo spagnolo; in italiano i due pronomi si fondono in un'altra forma, ci provi. E oggi quelle domeniche pesano ancora?"
      goals: [difficulties]
      prompt: {text: "se l'ho detto a mia madre", tags: [combined-pronouns]}
    - learner: "Ah, sì: quando le lo ho detto, volevo dire. Oggi pesano meno. Ho degli amici che mi invitano a pranzo, e ho capito che la domenica italiana assomiglia molto a quella di Siviglia: si mangia troppo e si parla tutti insieme."
      errors: [combined-pronouns]
    - tutor: "«Quando gliel'ho detto»: ecco la forma giusta. Si mangia troppo e si parla tutti insieme: allora si sente proprio a casa! In questi quattro anni, però, in che cosa è cambiata lei?"
      recast: {text: "quando le lo ho detto", fix: "Quando gliel'ho detto", tags: [combined-pronouns]}
    - learner: "Sono diventata più indipendente e, curiosamente, più puntuale. Prima di trasferirmi pensavo che gli italiani fossero come noi con gli orari; invece a Bologna, se arrivo con dieci minuti di ritardo, mi guardano male. E ho cambiato abitudini: ormai ceno alle otto."
    - tutor: "Cena alle otto: in Spagna non glielo perdoneranno mai! Scherzi a parte, per salutarci: che cosa direbbe a un ascoltatore che sta pensando di trasferirsi in Italia?"
      goals: [change]
    - learner: "Gli direi di non paragonare tutto con il proprio paese, perché è il modo migliore per essere infelici. E di non avere paura di sbagliare con la lingua: gli italiani apprezzano moltissimo chi ci prova. Integrarsi richiede tempo, ma ne vale la pena."
    - tutor: "Non fare confronti e buttarsi con la lingua: due consigli che condivido in pieno. Grazie per questa bella chiacchierata, e buona cena, naturalmente alle otto."
      goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno, e grazie per avermi invitata. A dire il vero non l'ho scelta io: la mia azienda cercava qualcuno per la sede di Milano e io, che ero stanca di Sydney, ho accettato d'istinto. Doveva essere un incarico di due anni; ne sono passati cinque."
    - tutor: "Una scelta d'istinto che dura da cinque anni: evidentemente l'istinto ci aveva visto giusto. Ma immagino che non sia stato tutto facile. Qual è stata la sfida più dura?"
      goals: [story]
    - learner: "Più della burocrazia, che pure mi ha fatto impazzire, direi il lavoro. In riunione non capivo mai se un «vediamo» volesse dire sì o no. Ci ho messo un anno a capire che, quasi sempre, voleva dire no."
    - tutor: "Il famoso «vediamo»! Ha capito una delle nostre abitudini più tipiche. E lei, a forza di interpretare le nostre riunioni, come è cambiata?"
      goals: [difficulties]
    - learner: "Ho imparato a leggere tra le righe, cosa che prima non sapevo fare affatto. Ero abituata a dire le cose in faccia; adesso faccio più attenzione ai modi. I colleghi australiani dicono che sono diventata diplomatica, e non sono sicura che sia un complimento."
    - tutor: "Diplomatica, ma con una punta di ironia, mi pare. C'è qualcosa della sua vita di prima di cui sente la nostalgia, o Milano l'ha conquistata del tutto?"
      goals: [change]
    - learner: "Mi manca il mare a dieci minuti dall'ufficio, inutile negarlo. In compenso ho guadagnato abitudini a cui non rinuncerei più: il caffè al banco, l'aperitivo con gli amici, le domeniche senza fretta."
    - tutor: "Uno scambio che molti milanesi farebbero al contrario! Siamo quasi in chiusura: a chi ci ascolta e sta per trasferirsi in Italia per lavoro, che cosa suggerirebbe?"
    - learner: "Suggerirei di arrivare con molta curiosità e poche certezze. E di investire nelle relazioni prima che nei risultati: qui la fiducia viene prima del contratto. Se l'avessi capito subito, mi sarei risparmiata parecchie frustrazioni."
    - tutor: "La fiducia prima del contratto: una sintesi che molti manager italiani dovrebbero appendere in ufficio. Grazie di essere stata con noi, e buon lavoro a Milano."
      goals: [advice]

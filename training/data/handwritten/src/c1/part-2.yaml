# C1 hand-written dialogues, part 2: work scenarios (pitch, supplier, meeting, promotion,
# interview, mediation).

- scenario: presentazione-progetto
  level: C1
  persona: en-f-professional
  history: [hypothetical]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "La ringrazio, sarò sintetica. Proponiamo un portale per gli ordini dei clienti aziendali: oggi il sessanta per cento arriva ancora per telefono o via mail, e ogni errore di trascrizione ci costa tempo e credibilità. L'obiettivo è portare online almeno metà degli ordini entro un anno."
    - tutor: "Fin qui mi è chiaro, e l'idea in sé non mi dispiace. Però di portali che dovevano cambiarci la vita ne ho visti parecchi. In concreto, quali benefici si aspetta, numeri alla mano?"
      goals: [pitch]
      new: [{lemma: numeri alla mano, gloss: with the figures to hand}]
    - learner: "Numeri alla mano, appunto: stimiamo un risparmio di circa duecentomila euro l'anno sul servizio clienti e un calo degli errori del trenta per cento. Se avremmo lanciato il portale l'anno scorso, avremmo già recuperato l'investimento."
      errors: [hypothetical]
    - tutor: "Un attimo, mi sono persa un passaggio: «se avremmo lanciato»? Dopo «se», in un'ipotesi sul passato, ci vuole un altro modo. Me lo ripeta, perché è proprio il punto che mi interessa."
      prompt: {text: Se avremmo lanciato, tags: [hypothetical]}
    - learner: "Mi scusi: se avessimo lanciato il portale l'anno scorso, avremmo già recuperato l'investimento. Secondo le nostre stime, il punto di pareggio arriva dopo quattordici mesi."
    - tutor: "Quattordici mesi, sulla carta. Il budget che chiede, però, è di trecentomila euro, e il reparto informatico è già sotto pressione. Che cosa succede se i clienti continuano a telefonare come hanno sempre fatto?"
      goals: [benefits]
    - learner: "È un rischio reale, non lo nego. Per questo proporrei di partire con un progetto pilota su venti clienti, quelli che ce lo chiedono da tempo, e di sbloccare il resto del budget solo qualora i risultati lo giustifichino. Quanto alle risorse, ci appoggeremmo a un fornitore esterno per lo sviluppo."
    - tutor: "Il pilota mi convince di più: limita il rischio e ci dà dati veri, non previsioni. Sul fornitore esterno voglio però vedere almeno due preventivi. Entro quando potrebbe portarmi un piano dettagliato?"
      goals: [objection]
      new: [{lemma: preventivo, gloss: quote, estimate}]
    - learner: "Potrei presentarglielo entro la fine del mese, con i due preventivi e l'elenco dei clienti coinvolti. Se per Lei va bene, fisserei già un incontro per la prima settimana di ottobre."
    - tutor: "Va bene, la prima settimana di ottobre, ma mi mandi il documento qualche giorno prima: non mi piace leggere le cose in riunione. Se i numeri reggono, lo porto io stessa in direzione. Buon lavoro."
      goals: [next-steps]

- scenario: presentazione-progetto
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Certo, direttore, vado subito al sodo. Proponiamo di coprire il tetto dello stabilimento di pannelli solari. L'obiettivo è produrre in casa il quaranta per cento dell'energia che consumiamo e dipendere meno dalle oscillazioni del mercato."
    - tutor: "L'energia ci costa un occhio della testa, su questo ha ragione. Ma i pannelli li propongono tutti, e non tutti poi ci guadagnano. Che benefici avremmo noi, in cifre?"
      goals: [pitch]
      new: [{lemma: costare un occhio della testa, gloss: to cost an arm and a leg}]
    - learner: "In cifre, un risparmio di centottantamila euro l'anno sulla bolletta. È un investimento a largo termine, ma dopo sei anni l'impianto si ripaga da solo e continua a produrre per altri venti."
      errors: [false-friend]
    - tutor: "Un investimento a lungo termine, appunto, ed è lì che comincio a preoccuparmi. Sei anni sono tanti, e nel frattempo il budget resta fermo sul tetto. E se i prezzi dell'energia scendessero?"
      goals: [benefits]
      recast: {text: a largo termine, fix: a lungo termine, tags: [false-friend]}
    - learner: "Benché i prezzi possono scendere, nessun analista crede che tornino ai livelli di cinque anni fa. E c'è un altro aspetto: due dei nostri clienti più grandi ci chiedono già dati sulle emissioni."
      errors: [subjunctive-use]
    - tutor: "Il discorso sui clienti è serio, ci torno subito. Prima però una cosa: «benché i prezzi possono»? Dopo «benché» quel verbo, così, non mi torna. Come lo direbbe?"
      prompt: {text: Benché i prezzi possono, tags: [subjunctive-use]}
    - learner: "Sì, mi scusi: benché i prezzi potrebbero scendere, il rischio più grande per noi è perdere quei clienti, che valgono un quinto del fatturato."
      errors: [subjunctive-use]
    - tutor: "Capisco: benché i prezzi possano scendere, perdere un quinto del fatturato sarebbe molto peggio. Questo cambia il quadro. Resta il costo iniziale: come pensa di finanziarlo senza togliere risorse agli altri reparti?"
      recast: {text: benché i prezzi potrebbero, fix: benché i prezzi possano, tags: [subjunctive-use]}
    - learner: "Con un contratto di noleggio operativo: l'impianto lo installa e lo mantiene il fornitore, e noi paghiamo una rata inferiore al risparmio in bolletta. In pratica non tocchiamo il budget di quest'anno."
    - tutor: "Ah, questo non me l'aveva detto, ed è la parte più interessante. Se la rata è davvero più bassa del risparmio, il rischio per noi si riduce parecchio. Quali sarebbero i prossimi passi?"
      goals: [objection]
      new: [{lemma: rata, gloss: instalment}]
    - learner: "Le proporrei di far fare un sopralluogo tecnico la settimana prossima e di chiedere tre offerte. Entro la scadenza del quindici novembre Le porterei un confronto completo, così potrà decidere con tutti gli elementi."
    - tutor: "D'accordo: sopralluogo, tre offerte e confronto entro il quindici novembre. Coinvolga anche l'ufficio legale, perché quei contratti nascondono sempre qualche sorpresa. Per oggi mi ha convinto a metà, che per me è già molto."
      goals: [next-steps]
      new: [{lemma: sopralluogo, gloss: site inspection}]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Grazie del tempo. In due parole: la Germania. Abbiamo già una dozzina di clienti tedeschi che ci hanno trovati da soli, senza che noi muovessimo un dito. Il progetto prevede un piccolo ufficio commerciale a Monaco, con l'obiettivo di trasformare quell'interesse spontaneo in un mercato vero."
    - tutor: "Che i tedeschi ci cerchino mi fa piacere, ma una dozzina di clienti non fa un mercato. Mi dia qualche cifra: quanto vale oggi la Germania per noi e quanto potrebbe valere?"
      goals: [pitch]
    - learner: "Oggi vale circa il quattro per cento del fatturato, ossia poco meno di seicentomila euro. Con due venditori sul posto contiamo di arrivare a due milioni in tre anni. Non sono numeri campati in aria: li abbiamo costruiti sugli ordini reali degli ultimi diciotto mesi."
    - tutor: "Due milioni in tre anni è una bella promessa. Però un ufficio all'estero significa affitto, stipendi e un sacco di grane burocratiche. Chi mi garantisce che non stiamo facendo il passo più lungo della gamba?"
      goals: [benefits]
      new: [{lemma: fare il passo più lungo della gamba, gloss: to bite off more than you can chew}, {lemma: grana, gloss: hassle, trouble}]
    - learner: "Nessuno può garantirglielo, e sarei poco serio se lo facessi. Posso dirLe però che l'investimento iniziale è contenuto, duecentocinquantamila euro, e che abbiamo previsto una verifica a dodici mesi: se non raggiungiamo almeno la metà dell'obiettivo, chiudiamo senza strascichi."
    - tutor: "Apprezzo la franchezza, mi creda. Resto però dell'idea che prima di affittare un ufficio serva uno studio di mercato fatto come si deve. Sarebbe disposto a partire da lì?"
      goals: [objection]
      new: [{lemma: franchezza, gloss: frankness}]
    - learner: "Avrei preferito partire subito, non glielo nascondo, perché temo che nel frattempo si muova la concorrenza. Detto questo, capisco la prudenza. Potremmo affidare lo studio a un'agenzia locale e intanto mandare un venditore a Monaco una settimana al mese."
    - tutor: "Questo compromesso mi piace: costa poco e intanto mettiamo un piede in Germania. Mi prepari una proposta con costi e scadenze, e ne riparliamo a fine mese. Ora devo proprio scappare."
      goals: [next-steps]
    - learner: "Perfetto, gliela mando entro venerdì prossimo. La ringrazio per l'ascolto, e anche per le obiezioni."
    - tutor: "Le obiezioni sono gratis, ne ho sempre una scorta. A venerdì, allora, e mi raccomando i numeri."
      new: [{lemma: scorta, gloss: supply, stock}]

- scenario: trattativa-fornitore
  level: C1
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, La chiamo proprio per questo. Le dico la verità: il nuovo listino ci ha lasciati di sasso. Un aumento del quindici per cento, comunicato con due settimane di preavviso, per un'azienda piccola come la nostra è un colpo duro."
    - tutor: "Mi rendo conto che il preavviso sia stato breve, e me ne dispiace. Le assicuro però che abbiamo retto finché abbiamo potuto. Per voi il problema è più la cifra o la tempistica?"
      goals: [problem]
      new: [{lemma: preavviso, gloss: notice}, {lemma: tempistica, gloss: timing}]
    - learner: "Entrambe, a dire il vero. E poi c'è una questione di metodo: Le ho scritto dieci giorni fa per chiedere spiegazioni e nessuno ha contestato alla mia mail."
      errors: [false-friend]
    - tutor: "Ha ragione, e mi scuso: nessuno ha risposto alla sua mail, ed è una mancanza nostra. D'ora in poi me ne occupo io di persona. Detto questo, sulla cifra che margine vede?"
      recast: {text: nessuno ha contestato, fix: nessuno ha risposto, tags: [false-friend]}
    - learner: "La ringrazio. Guardi, lavoriamo insieme da sei anni e in tutto questo tempo non abbiamo mai saltato un pagamento né ridotto un ordine, neanche nei mesi più difficili. Mi aspetterei che questa fedeltà contasse qualcosa quando si rivedono le condizioni."
    - tutor: "Conta, eccome. Siete un cliente che non ci ha mai dato un pensiero, e non lo dico per cortesia. Proprio per questo sono disposto ad ascoltare una proposta: Lei che cosa ha in mente?"
      goals: [argue]
    - learner: "Le propongo questo: un aumento del sei per cento subito e un altro tre a gennaio. Naturalmente dipende delle quantità: se ci garantite queste condizioni, siamo pronti a firmare un contratto di due anni."
      errors: [preposition]
    - tutor: "Un contratto di due anni mi interessa, glielo dico subito. Solo un dettaglio: «dipende delle quantità» non mi suona, con «dipendere» ci vuole un'altra preposizione. Me lo ripete, e mi dice di che volumi parliamo?"
      prompt: {text: dipende delle quantità, tags: [preposition]}
    - learner: "Dipende dalle quantità, certo. Parliamo di circa quarantamila scatole al mese, con la possibilità di salire a cinquantamila in estate, quando la produzione aumenta."
    - tutor: "Con quarantamila scatole garantite posso fare uno sforzo. Il sei più tre però è poco: Le propongo otto subito e niente a gennaio, con consegna gratuita sopra le cinquantamila. Che ne dice?"
      goals: [counteroffer]
    - learner: "Otto per cento bloccato per due anni e consegna gratuita in estate... Non è quello che speravo, ma è una proposta onesta. Accetto, purché tutto venga messo per iscritto nel contratto."
    - tutor: "Naturalmente. Le mando la bozza del contratto entro giovedì: otto per cento, due anni, consegna gratuita sopra le cinquantamila scatole. E stia tranquilla, alle sue mail d'ora in poi rispondo io."
      goals: [agreement]
      new: [{lemma: bozza, gloss: draft}]

- scenario: trattativa-fornitore
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, è per il listino, e non Le nascondo che sono rimasto piuttosto sorpreso. Che i costi salgano lo so anch'io, compro materie prime da quarant'anni. Ma un quindici per cento in un colpo solo non l'avevo mai visto."
    - tutor: "Quarant'anni di esperienza si sentono, e allora mi capirà: carta e plastica ci costano un terzo in più rispetto a un anno fa. Abbiamo ritoccato il listino solo quando non c'era alternativa. Quanto pesa l'aumento sui vostri conti?"
      goals: [problem]
      new: [{lemma: ritoccare, gloss: to adjust, to touch up}]
    - learner: "Pesa parecchio. Sui nostri prodotti l'imballaggio incide per quasi un decimo del costo finale, e i supermercati non ci lasciano certo alzare i prezzi a piacere. In pratica quell'aumento ce lo mangeremmo tutto noi. E mi permetta: siamo con voi dal primo giorno, quando eravate in tre in un capannone."
    - tutor: "Me lo ricordo bene, il capannone, e mi ricordo anche chi ci ha dato fiducia allora. Non voglio certo perdervi per una questione di listino. Però anch'io devo rispondere a qualcuno: mi aiuti a trovare una via di mezzo."
      goals: [argue]
      new: [{lemma: capannone, gloss: industrial shed}, {lemma: via di mezzo, gloss: middle way, compromise}]
    - learner: "Volentieri. Le dico con franchezza che ho sul tavolo il preventivo di un vostro concorrente, più basso del vostro di otto punti. Preferirei non usarlo. La mia proposta è un aumento del cinque per cento adesso, da rivedere tra sei mesi in base all'andamento delle materie prime."
    - tutor: "Apprezzo che me lo dica apertamente, invece di farmelo scoprire da solo. Il cinque, però, non ci copre nemmeno i costi. Potrei scendere al nove, se accettaste di pagare a trenta giorni anziché a sessanta. Sarebbe fattibile?"
      goals: [counteroffer]
      new: [{lemma: fattibile, gloss: feasible}]
    - learner: "A trenta giorni si può fare, ne ho già parlato con l'amministrazione. Ma al nove non ci arrivo. Facciamo otto, con una clausola di revisione a sei mesi: se i costi scendono, scende anche il prezzo."
    - tutor: "Otto per cento, pagamento a trenta giorni e revisione a sei mesi, in tutte e due le direzioni. Va bene, ci sto. Preferisce che Le mandi il nuovo contratto oggi stesso o lo firmiamo di persona?"
      goals: [agreement]
    - learner: "Di persona, se non Le dispiace: certe cose mi piace ancora chiuderle con una stretta di mano. Passi pure in azienda giovedì, Le offro un caffè e Le faccio assaggiare la nuova linea di conserve."
    - tutor: "Giovedì da voi, allora, con il contratto in mano e una certa curiosità per le conserve. È raro trattare con qualcuno che dice le cose come stanno. A presto, e grazie."
      new: [{lemma: conserva, gloss: preserve (food)}]

- scenario: trattativa-fornitore
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno, sì, ha indovinato. Vengo subito al punto: con il nuovo listino le vostre vaschette ci costerebbero quasi novemila euro in più all'anno. Per un biscottificio di dodici persone non sono spiccioli."
    - tutor: "No, non lo sono, e non voglio minimizzare. Purtroppo l'aumento riguarda tutti i prodotti e tutti i clienti, senza eccezioni. Ha già valutato che effetto avrebbe sui vostri margini?"
      goals: [problem]
    - learner: "L'ho valutato, e il conto è presto fatto: il margine sulle confezioni piccole si dimezza. Vorrei ricordarLe che l'anno scorso, quando avete avuto quei ritardi nelle consegne, non abbiamo chiesto alcun rimborso. Avremmo potuto, ma abbiamo preferito salvaguardare il rapporto."
    - tutor: "È vero, e ce lo ricordiamo: all'epoca siete stati molto corretti con noi. Un fornitore serio certe cose non le dimentica. Mi dica allora che cosa avrebbe in mente."
      goals: [argue]
    - learner: "Cambiare fornitore per noi non fa senso, ci troviamo bene con voi. Però il quindici è troppo. Le proporrei un sette per cento, in cambio di un ordine unico annuale invece di quattro ordini trimestrali."
      errors: [word-choice]
    - tutor: "Mi fa piacere sentire che cambiare fornitore per voi non ha senso, anche perché vale lo stesso per noi. L'ordine unico annuale ci semplifica la vita, lo ammetto. Quanto al sette, però, faccio fatica: e il pagamento come lo vedrebbe?"
      goals: [counteroffer]
      recast: {text: non fa senso, fix: non ha senso, tags: [word-choice]}
    - learner: "Il pagamento potremmo anticiparlo in parte: metà alla firma e metà alla consegna. Ho anche preparato un piano degli ordini mese per mese: se vuole, Le lo mando oggi stesso."
      errors: [combined-pronouns]
    - tutor: "Metà alla firma è un bel segnale, e il piano mi interessa molto. Mi permetta però: «Le lo mando»? Quei due pronomi, quando stanno insieme, in italiano si fondono in una parola sola. Ci riprova?"
      prompt: {text: Le lo mando, tags: [combined-pronouns]}
    - learner: "Glielo mando oggi stesso, certo. E con metà del pagamento anticipato, pensa di poter venire incontro alla nostra richiesta?"
    - tutor: "Con l'ordine annuale e metà alla firma posso arrivare al nove per cento, non di meno. In più vi garantisco la precedenza sulle consegne, così i ritardi dell'anno scorso restano un ricordo. Le sembra ragionevole?"
      new: [{lemma: precedenza, gloss: priority}]
    - learner: "Nove per cento con precedenza sulle consegne... Speravo in qualcosa di meglio, ma mi sembra un accordo equilibrato. Va bene, lo confermo. Aspetto il contratto aggiornato."
    - tutor: "Allora siamo intesi: nove per cento, ordine annuale, metà alla firma e precedenza sulle consegne. Il contratto aggiornato parte domani, e io aspetto il suo piano. Grazie della disponibilità."
      goals: [agreement]

- scenario: riunione-lavoro
  level: C1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene, direi. La nuova versione del sito è quasi pronta: abbiamo chiuso la grafica venerdì e da ieri stiamo caricando i testi. Se tutto fila liscio, giovedì possiamo farla vedere al cliente."
    - tutor: "Ottimo, non ci speravo quasi più! Però quel «se tutto fila liscio» mi mette un po' in allarme. C'è qualcosa che potrebbe andare storto?"
      goals: [update]
      new: [{lemma: andare storto, gloss: to go wrong}, {lemma: filare liscio, gloss: to go smoothly}]
    - learner: "In effetti sì, un intoppo c'è. Il cliente doveva mandarci le foto dei prodotti due settimane fa. Gli ho scritto tre volte, ma di foto non abbiamo ricevute neanche una."
      errors: [ci-ne]
    - tutor: "Tre mail e niente, un classico. Aspetta però: «di foto non abbiamo ricevute neanche una»? Lì manca una piccola parola, quella che riprende «di foto». Come lo diresti?"
      prompt: {text: non abbiamo ricevute neanche una, tags: [ci-ne]}
    - learner: "Ah, già... di foto non ci abbiamo ricevuto neanche una. Comunque, senza quelle immagini le pagine dei prodotti restano vuote."
      errors: [ci-ne]
    - tutor: "Quasi: di foto non ne abbiamo ricevuta neanche una, con «ne». E senza immagini il sito non possiamo certo presentarlo. Tu come pensi di uscirne?"
      goals: [problem]
      recast: {text: non ci abbiamo ricevuto neanche una, fix: non ne abbiamo ricevuta neanche una, tags: [ci-ne]}
    - learner: "Avrei due idee. La prima è chiamare direttamente la loro responsabile marketing, invece di continuare con le mail. La seconda è usare per ora delle immagini provvisorie, così giovedì presentiamo comunque la struttura e loro vedono quanto pesa il ritardo delle foto."
    - tutor: "La seconda mi piace molto: quando vedranno le pagine senza foto si daranno una mossa. La telefonata falla comunque, magari oggi stesso. A questo punto, entro quando riusciamo a chiudere tutto?"
      goals: [proposal]
      new: [{lemma: darsi una mossa, gloss: to get a move on}]
    - learner: "Dipende da loro, più che da noi. Se le foto arrivano entro lunedì, direi che per la fine della settimana prossima il sito è online. Ti andrebbe bene venerdì ventitré come scadenza?"
    - tutor: "Venerdì ventitré va benissimo, e lo scrivo subito nel verbale così non ce lo dimentichiamo. Se lunedì le foto non ci sono, avvisami e chiamo io il loro capo. Grazie, ottimo lavoro."
      goals: [deadline]
      new: [{lemma: verbale, gloss: minutes (of a meeting)}]

- scenario: riunione-lavoro
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Guarda, Federica, ti do prima la buona notizia: la migrazione del gestionale è completata all'ottanta per cento. Magazzino e fatturazione girano già sul sistema nuovo, e finora nessuno è venuto a lamentarsi, il che da noi è quasi un miracolo."
    - tutor: "Un miracolo davvero, me lo segno sul calendario! Però se cominci dalla buona notizia vuol dire che ce n'è anche una cattiva. Dai, sputa il rospo."
      goals: [update]
      new: [{lemma: sputare il rospo, gloss: to spit it out}]
    - learner: "Mi conosci troppo bene. Il problema è il modulo degli ordini: i dati dei clienti storici sono un disastro, doppioni dappertutto, indirizzi vecchi, un cliente compare addirittura undici volte. Se li importiamo così come sono, ci portiamo dietro il caos per altri dieci anni."
    - tutor: "Undici volte lo stesso cliente? Qualcuno gli voleva proprio bene. Scherzi a parte, è un bel guaio. Tu che cosa suggerisci di fare?"
      goals: [problem]
      new: [{lemma: guaio, gloss: trouble, mess}]
    - learner: "Proporrei di fermarci una settimana e ripulire i dati prima di importarli. Mi servirebbero due persone dell'ufficio commerciale, perché solo loro sanno quali clienti sono ancora attivi. So che non è il momento ideale, ma farlo dopo ci costerebbe il triplo."
    - tutor: "Sul ripulire prima sono d'accordo, sul fermarci una settimana intera un po' meno. Il commerciale è sotto pressione fino a fine mese. Ce la faresti con una persona sola e qualche giorno in più?"
      goals: [proposal]
    - learner: "Con una persona sola ce la faccio, a patto che sia Lucia: conosce i clienti meglio di chiunque. In quel caso però la scadenza slitta, non posso prometterti il quindici. Realisticamente parlerei di fine mese."
    - tutor: "Fine mese mi va stretto, perché il trenta ho la riunione con la direzione e vorrei arrivarci con tutto chiuso. Facciamo il ventisei, così ci resta qualche giorno di margine?"
    - learner: "Il ventisei è tirato, ma con Lucia si può fare. Affare fatto. Se poi salta fuori un cliente che compare venti volte, ti avviso e rinegoziamo."
    - tutor: "Affare fatto, il ventisei. A Lucia parlo io oggi pomeriggio, e che nessuno le chieda altro per due settimane. Se trovi il cliente da venti volte, gli mandiamo un premio fedeltà."
      goals: [deadline]

- scenario: riunione-lavoro
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Mah, a essere sincero va così così. La campagna per il lancio è pronta, i video li abbiamo montati e sono venuti bene. Solo che ieri sera il cliente ha cambiato idea sullo slogan, per la terza volta."
    - tutor: "Per la terza volta? Ormai è una tradizione. E questo cambio che conseguenze ha, in pratica?"
      goals: [update]
    - learner: "Pesanti, purtroppo. Lo slogan compare in tutti i video, quindi dobbiamo rifare l'audio e i titoli. Io pensavo che il cliente sia d'accordo, visto che la settimana scorsa aveva approvato tutto per iscritto."
      errors: [subjunctive-use]
    - tutor: "Approvato per iscritto, e poi ci ripensa: ce lo segniamo. Un attimo, però: «pensavo che il cliente sia»? Il verbo principale è al passato, quindi quel congiuntivo va sistemato. Riprova, dai."
      prompt: {text: pensavo che il cliente sia, tags: [subjunctive-use]}
    - learner: "Giusto: pensavo che il cliente fosse d'accordo. Invece no, e adesso rischiamo un ritardo di almeno una settimana sulla consegna."
    - tutor: "Una settimana di ritardo, con il lancio fissato per il venti, non possiamo permettercela. Hai già in mente come uscirne senza rifare tutto da capo?"
      goals: [problem]
    - learner: "Un'idea ce l'avrei. Rifacciamo solo l'audio dei tre video principali e negli altri togliamo lo slogan dal finale. E gli facciamo firmare che questa è la versione definitiva: sennò eventualmente ci chiede la quarta modifica, e io non ci sto."
      errors: [false-friend]
    - tutor: "Hai ragione: sennò prima o poi ci chiede la quarta modifica, e nemmeno io ci sto. La firma mi sembra sacrosanta, e l'idea dei tre video regge. Quanto tempo ti serve?"
      goals: [proposal]
      recast: {text: eventualmente ci chiede, fix: prima o poi ci chiede, tags: [false-friend]}
      new: [{lemma: sacrosanto, gloss: absolutely right, sacrosanct}]
    - learner: "Se lo studio di registrazione è libero domani, per martedì ho tutto. Diciamo mercoledì per stare tranquilli, così mi resta un giorno per ricontrollare i titoli."
    - tutor: "Mercoledì allora, e giovedì mandiamo tutto al cliente con la richiesta di firma. Se lo studio non è libero dimmelo subito, che ne cerco un altro. Bel lavoro, nonostante tutto."
      goals: [deadline]

- scenario: colloquio-promozione
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie per avermi ricevuta. Vorrei fare con Lei il punto sul mio percorso. Nell'ultimo anno ho coordinato il passaggio al nuovo sistema di gestione dei clienti, che abbiamo chiuso con un mese di anticipo, e il mio gruppo ha superato gli obiettivi di vendita del diciotto per cento."
    - tutor: "Sono risultati che conosco bene, e che ho citato più di una volta in direzione. Il progetto sui clienti, in particolare, non era affatto scontato. Immagino però che non sia venuta solo per ricordarmeli."
      goals: [results]
      new: [{lemma: scontato, gloss: "to be taken for granted, a foregone conclusion"}]
    - learner: "No, infatti. Di fatto svolgo da mesi il lavoro di una responsabile di area, senza averne né il titolo né la retribuzione. Credo che sia arrivato il momento di allineare le due cose: Le chiedo quindi di valutare la mia promozione a responsabile, con il relativo aumento."
    - tutor: "La richiesta è legittima, e Le dico subito che nel merito non ho nulla da obiettare. Il problema è il momento: il budget per quest'anno è chiuso, e le promozioni si decidono a gennaio. Come pensa che potremmo muoverci?"
      goals: [request]
    - learner: "Capisco il vincolo, e non Le chiedo di fare miracoli a ottobre. Mi chiedo però se non si possa separare il titolo dall'aumento: il ruolo potrebbe essere formalizzato adesso, dato che di fatto lo ricopro già, e la parte economica seguirebbe a gennaio, magari con un impegno scritto."
    - tutor: "È una proposta intelligente, non lo nego, perché a me costa poco dire di sì al titolo. Sulla parte economica, però, un impegno scritto non posso firmarlo da solo. Si accontenterebbe della mia parola?"
      goals: [handle]
    - learner: "Della Sua parola mi fido, davvero. Ma ho visto cambiare tre direttori in cinque anni, e preferirei che restasse una traccia. Basterebbe una mail in cui riassume quello che ci siamo detti, con in copia le risorse umane."
    - tutor: "Tre direttori in cinque anni: non ha tutti i torti. D'accordo, entro venerdì parlo con le risorse umane per il titolo e Le scrivo la mail. A gennaio mettiamo la Sua valutazione in cima alla lista."
      goals: [next-steps]
    - learner: "La ringrazio, è più di quanto mi aspettassi di ottenere oggi. Le preparo una scheda con i risultati dell'anno, così ha tutto pronto per la discussione di gennaio."
    - tutor: "Ottima idea, mi sarà utile quando dovrò difendere la Sua promozione. E continui così: è raro che qualcuno chieda un aumento con argomenti tanto solidi. Buon lavoro."

- scenario: colloquio-promozione
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use, register]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. È da un po' che volevo chiederLe un colloquio. Coordino i corsi aziendali da tre anni e quest'anno i risultati parlano da soli: gli iscritti sono cresciuti del trenta per cento e abbiamo acquisito due clienti importanti, una banca e un gruppo farmaceutico."
    - tutor: "Due clienti così in un anno non sono poca cosa, lo riconosco. La banca, in particolare, la inseguivamo da tempo. Dove vuole arrivare, se posso chiederlo?"
      goals: [results]
    - learner: "Arrivo al punto. Nonostante ho raggiunto tutti gli obiettivi, il mio stipendio è fermo da tre anni. Vorrei chiederLe un aumento e il passaggio a responsabile della formazione."
      errors: [subjunctive-use]
    - tutor: "Apprezzo che lo dica senza giri di parole. Mi fermo solo su una cosa: «nonostante ho raggiunto»? Dopo «nonostante» il verbo vuole un altro modo. Me lo ripete, per favore?"
      prompt: {text: Nonostante ho raggiunto, tags: [subjunctive-use]}
    - learner: "Certo: nonostante ho raggiunto... no, scusi, nonostante avevo raggiunto tutti gli obiettivi, lo stipendio non è cambiato."
      errors: [subjunctive-use]
    - tutor: "Capisco: nonostante abbia raggiunto tutti gli obiettivi, lo stipendio è rimasto fermo. È un fatto, e non lo discuto. Il punto è che il budget del reparto quest'anno è già impegnato quasi del tutto."
      goals: [request]
      recast: {text: nonostante avevo raggiunto, fix: nonostante abbia raggiunto, tags: [subjunctive-use]}
    - learner: "Lo immaginavo, ma permettimi di insistere. Una parte di quel budget dipende proprio dai contratti che ho portato io: la banca da sola vale ottantamila euro l'anno."
      errors: [register]
    - tutor: "Ottantamila euro sono un argomento che pesa, non c'è dubbio. Un piccolo appunto, però: «permettimi»? Finora ci siamo date del Lei, e in un colloquio così conviene mantenerlo. Come lo direbbe?"
      prompt: {text: permettimi, tags: [register]}
    - learner: "Ha ragione, mi scusi: mi permetta di insistere. Se l'aumento non è possibile subito, potremmo almeno fissare una data e legarlo a obiettivi precisi?"
    - tutor: "Questo è un modo di ragionare che mi piace. Posso offrirle il titolo di responsabile dall'inizio dell'anno e una valutazione prima dell'estate, con l'aumento legato al nuovo contratto della banca. Le sembra una strada percorribile?"
      goals: [handle]
      new: [{lemma: percorribile, gloss: viable, workable}]
    - learner: "Mi sembra ragionevole, purché gli obiettivi siano messi per iscritto e non cambino a metà strada. Se per Lei va bene, Le mando io una bozza entro la settimana e la rivediamo insieme."
    - tutor: "Va bene, aspetto la sua bozza e fisso un incontro per lunedì prossimo. Mi fa piacere che sia venuta a parlarmene di persona, invece di guardarsi intorno in silenzio. A lunedì, allora."
      goals: [next-steps]
      new: [{lemma: bozza, gloss: draft}]

- scenario: colloquio-promozione
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Vorrei parlarLe del mio ruolo. Da due anni seguo i clienti del Nord Europa e nell'ultimo esercizio il fatturato della mia zona è passato da uno virgola due a quasi due milioni. Attualmente, è la zona che è cresciuta di più in tutta l'azienda."
      errors: [false-friend]
    - tutor: "In effetti è la zona che è cresciuta di più, i dati li ho visti anch'io. E non era una zona facile, quando l'ha presa in mano. Che cosa mi vuole chiedere, esattamente?"
      goals: [results]
      recast: {text: "Attualmente, è la zona", fix: In effetti è la zona, tags: [false-friend]}
    - learner: "Vorrei chiederLe una promozione a responsabile commerciale estero. Di fatto sono già responsabile per tre mercati, tratto direttamente con i clienti principali e formo i colleghi nuovi. Credo che il titolo debba rispecchiare quello che faccio."
      errors: [preposition]
    - tutor: "La richiesta in sé non mi stupisce, me l'aspettavo. Una cosa sola: «responsabile per tre mercati»? In italiano con «responsabile» si usa un'altra preposizione. Me lo ripete?"
      prompt: {text: responsabile per tre mercati, tags: [preposition]}
    - learner: "Responsabile di tre mercati, mi scusi. E aggiungo che l'anno scorso ho rinunciato all'offerta di un concorrente perché credevo in questo progetto."
    - tutor: "Non lo sapevo, e Le sono grato di essere rimasto. Le devo però un'obiezione sincera: un responsabile gestisce persone, e Lei finora ha gestito soprattutto clienti. Che cosa mi risponde?"
      goals: [request]
    - learner: "Le rispondo che ha ragione solo in parte. È vero che non ho un gruppo mio, ma i due colleghi arrivati a marzo li ho seguiti io giorno per giorno, e oggi lavorano in autonomia. Se avessi avuto una squadra, l'avrei gestita allo stesso modo. E sono disposto a fare un corso di gestione del personale, se serve."
    - tutor: "È una risposta onesta, e il corso mi sembra un'ottima idea. Facciamo così: Le affido subito i due colleghi in modo ufficiale e tra sei mesi rivediamo insieme il titolo. Ci sta?"
      goals: [handle]
    - learner: "Ci sto, a condizione che tra sei mesi la valutazione si faccia davvero e su criteri chiari. Potremmo fissare già oggi la data e i tre o quattro obiettivi su cui sarò giudicato?"
    - tutor: "Giusto, niente promesse vaghe. Fissiamo il quindici aprile, e gli obiettivi glieli mando per iscritto entro venerdì: fatturato, crescita dei due colleghi e corso completato. Se li raggiunge, la promozione la porto io in direzione."
      goals: [next-steps]

- scenario: colloquio-lavoro
  level: C1
  persona: es-f-erasmus
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, e grazie dell'invito. Mi chiamo Marta, sono di Valencia e vivo a Torino da quattro anni. Sono una grafica specializzata in identità visiva: mi occupo di marchi, confezioni e tutto ciò che fa riconoscere un'azienda a colpo d'occhio."
    - tutor: "Piacere, Marta. Dal curriculum vedo che prima di Torino ha lavorato a Barcellona. Mi racconta com'è stata quell'esperienza e che cosa faceva di preciso?"
      goals: [intro]
    - learner: "A Barcellona ho lavorato tre anni in uno studio piuttosto grande, dove curavo soprattutto le confezioni per aziende alimentari. All'inizio eseguivo le idee degli altri; poi, a poco a poco, mi hanno affidato progetti miei. L'ultimo è stato il rilancio di una storica marca di cioccolato, dal logo fino agli scaffali."
    - tutor: "Il cioccolato è sempre un buon biglietto da visita! Passare dall'eseguire al decidere non è da tutti. Secondo lei quali sono i suoi punti di forza, e dove invece sente di dover migliorare?"
      goals: [experience]
      new: [{lemma: biglietto da visita, gloss: business card, calling card}]
    - learner: "Direi che il mio punto di forza è l'ascolto: prima di disegnare qualsiasi cosa cerco di capire che cosa il cliente non riesce a dire a parole. Il mio limite è che faccio fatica a considerare finito un lavoro. Ritoccherei tutto all'infinito, e ho dovuto imparare a darmi delle scadenze."
    - tutor: "Un difetto che conosciamo bene, qui dentro: abbiamo colleghi che ritoccherebbero anche il menù della pausa pranzo. Mi dica una cosa, però. Perché ha scelto proprio noi, che siamo in dodici?"
      goals: [strengths]
      new: [{lemma: ritoccare, gloss: to touch up, to retouch}]
    - learner: "Proprio perché siete in dodici. In uno studio grande il cliente lo vedi due volte, alla prima riunione e alla consegna. Qui, da quello che ho capito, ogni progetto si segue dall'inizio alla fine. E poi il vostro lavoro per il festival del cinema mi è rimasto impresso: avrei voluto farlo io."
    - tutor: "Lo riferirò a chi l'ha disegnato, ne sarà felice. È vero, da noi nessuno si nasconde dietro un reparto, nel bene e nel male. Ha qualche domanda sul ruolo?"
      goals: [why]
    - learner: "Sì, una in particolare. Mi piacerebbe sapere come è organizzata la squadra: lavorerei sempre con le stesse persone o i gruppi cambiano a seconda del progetto?"
    - tutor: "I gruppi cambiano ogni volta: di solito due grafici, un responsabile del progetto e chi scrive i testi. All'inizio affiancherebbe una collega più esperta, poi avrebbe clienti suoi. Le faremo sapere entro la prossima settimana, grazie di essere venuta."
      goals: [questions]
      new: [{lemma: affiancare, gloss: to work alongside}]

- scenario: colloquio-lavoro
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi presento volentieri, anche se il mio curriculum è più lungo di quanto la buona educazione consentirebbe. Sono un ingegnere meccanico, ho lavorato trentacinque anni nella progettazione di mobili e da due anni, almeno sulla carta, sono in pensione."
    - tutor: "Quel «almeno sulla carta» promette bene, lo ammetto. Trentacinque anni sono una vita intera di lavoro. Mi racconta di che cosa si è occupato in tutto questo tempo?"
      goals: [intro]
    - learner: "Per i primi dieci anni ho disegnato sedie, e Le assicuro che una sedia è molto più difficile di quanto sembri. Poi ho diretto l'ufficio tecnico di un'azienda brianzola: trasformavo le idee dei designer in oggetti che si potessero davvero produrre, senza tradirle troppo. È un mestiere di diplomazia, più che di calcolo."
    - tutor: "«Senza tradirle troppo»: ai nostri designer quel «troppo» piacerebbe un po' meno. Scherzo, è esattamente la figura che ci manca. Che cosa considera il suo punto di forza, e quale invece un suo limite?"
      goals: [experience]
    - learner: "Il punto di forza è che ho già commesso quasi tutti gli errori possibili, quindi li riconosco da lontano. Il limite, glielo dico apertamente, sono i programmi più recenti: me la cavo, ma un ventenne è più veloce di me. In compenso so quando il computer sbaglia."
    - tutor: "Sapere quando il computer sbaglia vale più della velocità, mi creda. Resta una domanda che devo farle: perché rimettersi in gioco proprio adesso, e proprio in un'azienda piccola come la nostra?"
      goals: [strengths]
      new: [{lemma: rimettersi in gioco, gloss: to get back in the game}]
    - learner: "Perché ho scoperto che la pensione mi annoia, e mia moglie ha scoperto che io annoiato sono insopportabile. Parlando seriamente: voi fate pochi oggetti e li fate bene, e io vorrei passare gli anni di lavoro che mi restano accanto a persone giovani, a cui magari posso risparmiare qualche sbaglio."
    - tutor: "Sua moglie ha tutta la mia comprensione, e la motivazione mi sembra sincera. Di competenze come le sue qui c'è un gran bisogno. Prima di chiudere, c'è qualcosa che vorrebbe chiedere lei a me?"
      goals: [why]
    - learner: "Sì, una cosa pratica. Il ruolo prevede una presenza fissa in ufficio, oppure sarebbe possibile una collaborazione di tre giorni alla settimana? Vorrei lavorare, ma non ricominciare da capo."
    - tutor: "Tre giorni alla settimana andrebbero benissimo, anzi era proprio ciò che avevamo in mente. Ne parlo con i soci e la richiamo entro venerdì. Intanto la ringrazio: è stato un colloquio diverso dal solito."
      goals: [questions]

- scenario: colloquio-lavoro
  level: C1
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno, grazie. Mi chiamo Emily e mi sono laureata in design della comunicazione a Milano lo scorso luglio. Sono inglese, ma vivo in Italia da cinque anni, e ormai sogno perfino in italiano, errori compresi."
    - tutor: "Sognare con gli errori è segno che la lingua è diventata sua! Vedo che durante gli studi ha già fatto qualche esperienza. Me ne parla?"
      goals: [intro]
    - learner: "Sì, ho fatto un tirocinio di sei mesi in un'agenzia che progetta applicazioni per musei. In quel periodo ho cresciuto molto, perché mi hanno lasciata lavorare a contatto con i clienti fin dalla seconda settimana."
      errors: [auxiliary-choice]
    - tutor: "A contatto con i clienti dalla seconda settimana: coraggiosi, in quell'agenzia. Un attimo, però: «ho cresciuto molto»? Quando si parla di sé, quel verbo vuole un altro ausiliare. Come lo direbbe?"
      prompt: {text: ho cresciuto molto, tags: [auxiliary-choice]}
      new: [{lemma: ausiliare, gloss: auxiliary verb}]
    - learner: "Sono cresciuta molto, certo. Ho imparato soprattutto a fare domande agli utenti: abbiamo osservato decine di visitatori per capire dove si bloccavano, e ho ridisegnato da zero il percorso per l'acquisto dei biglietti."
    - tutor: "Osservare gli utenti dal vivo è la scuola migliore, e non tutti hanno la pazienza di farlo. Parliamo di lei, adesso: quali sono i suoi punti di forza, e quale difetto si riconosce?"
      goals: [experience]
    - learner: "Credo di essere curiosa e precisa: mi piace capire il perché di ogni scelta. Il mio difetto è che in riunione parlo poco. È un aspetto su che sto lavorando, anche se non è facile."
      errors: [relative-pronoun]
    - tutor: "Parlare poco non è sempre un difetto, glielo assicuro. Mi fermo però su «un aspetto su che sto lavorando»: dopo una preposizione, «che» non va bene. Quale pronome ci vuole?"
      prompt: {text: su che sto lavorando, tags: [relative-pronoun]}
      new: [{lemma: pronome, gloss: pronoun}]
    - learner: "Dopo una preposizione... un aspetto sul che sto lavorando? Mi scusi, questa regola mi sfugge sempre."
      errors: [relative-pronoun]
    - tutor: "Capita anche ai migliori: è un aspetto su cui sto lavorando, con «cui». E il fatto che ci lavori mi sembra già un buon segno. Mi dica invece perché vorrebbe questo ruolo, e proprio da noi."
      goals: [strengths]
      recast: {text: sul che sto lavorando, fix: su cui sto lavorando, tags: [relative-pronoun]}
    - learner: "Perché la vostra azienda progetta servizi per gli ospedali e i comuni, cioè cose che la gente usa per necessità e non per divertimento. Lì un buon design fa davvero la differenza. Posso farLe anch'io una domanda? Chi entra da voi come junior viene affiancato da qualcuno, nei primi mesi?"
    - tutor: "Bella motivazione, è la stessa che ha portato qui molti di noi. Sì, per i primi sei mesi avrebbe al suo fianco una collega esperta, con cui rivedere ogni progetto. La squadra è piccola, quindi si impara in fretta. Le daremo una risposta entro lunedì."
      goals: [why, questions]

- scenario: mediazione-colleghi
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Non mi disturba affatto, anzi ha fatto bene a venire. Si sieda, chiudo la porta. Mi racconti con calma che cosa è successo, dal Suo punto di vista."
    - tutor: "Grazie. Il fatto è questo: all'analisi sui clienti ho lavorato tre settimane, sere comprese. Ieri Paolo l'ha presentata alla direzione dicendo «ho preparato», «ho analizzato». Il mio nome non è uscito nemmeno una volta."
    - learner: "Capisco che ci sia rimasta male, e al Suo posto ci sarei rimasto male anch'io. Tre settimane di lavoro meritano di essere riconosciute, su questo non si discute. Posso farLe qualche domanda per capire meglio come sono andate le cose?"
    - tutor: "Certo, chieda pure. Ho anche le mail, se servono, perché non voglio passare per quella che si inventa le cose. Mi dà già sollievo che lei mi ascolti."
      goals: [listen]
      new: [{lemma: sollievo, gloss: relief}]
    - learner: "Le mail potranno servire, ma per ora mi basta la Sua parola. Mi dica: la presentazione l'avete preparata insieme, o Paolo ha lavorato sulle slide per conto suo? E prima della riunione avevate deciso chi dei due avrebbe parlato?"
    - tutor: "Le slide le ha fatte lui, questo è vero, partendo però dai miei dati. Su chi dovesse parlare non ci siamo mai detti niente di chiaro. Io davo per scontato che avrebbe almeno fatto il mio nome."
      goals: [clarify]
      new: [{lemma: dare per scontato, gloss: to take for granted}]
    - learner: "La ringrazio della precisione. Mi permetta un'ipotesi, senza con questo giustificarlo: può darsi che Paolo, preso dall'ansia di parlare davanti alla direzione, abbia usato la prima persona senza rendersi conto dell'effetto. Non sarebbe la prima volta che un malinteso nasce da una leggerezza e non dalla malafede."
    - tutor: "Può darsi, non lo escludo. Paolo sotto pressione non è mai stato un campione di tatto. Resta il fatto che la direzione adesso pensa che il merito sia tutto suo, e questo mi brucia."
      goals: [perspective]
      new: [{lemma: tatto, gloss: tact}]
    - learner: "Ha ragione, e questo va corretto, a prescindere dalle intenzioni. Le propongo due cose. Parlo io con Paolo oggi stesso, poi ci vediamo tutti e tre per un chiarimento. E nel resoconto che mando alla direzione scriverò chiaramente che l'analisi è Sua. D'ora in poi, inoltre, ogni presentazione riporterà i nomi di chi ci ha lavorato."
    - tutor: "Questo mi sembra giusto, sinceramente più di quanto sperassi. Al chiarimento con Paolo ci vengo, purché ci sia anche lei. Grazie: avevo bisogno di sapere che in questa squadra il lavoro conta."
      goals: [solution]


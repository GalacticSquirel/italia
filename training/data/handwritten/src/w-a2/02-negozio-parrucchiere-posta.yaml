# w-a2, file 02: clothes shop, hairdresser and post office (A2, broad coverage).
- scenario: abbigliamento
  level: A2
  persona: en-m-heritage
  history: [demonstrative, adjective-agreement]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Buongiorno. Cerco una giacca per l'inverno. Posso vedere quello giacca in vetrina?"
      errors: [demonstrative]
    - tutor: "Certo! Ma «quello giacca»? Giacca è una parola femminile."
      goals: [ask-item]
      prompt: {text: "quello giacca", tags: [demonstrative]}
    - learner: "Ah, sì: quella giacca blu, in vetrina."
    - tutor: "Bella, vero? Che taglia porta?"
    - learner: "Di solito porto la L. Ce l'avete anche in nero?"
    - tutor: "Sì, in nero e in grigio. Ecco la L nera."
      goals: [size-colour]
    - learner: "Posso provarla? Dov'è il camerino?"
    - tutor: "Certo, il camerino è lì, a destra."
      goals: [try]
    - learner: "Mmm, è un po' stretto sulle spalle."
      errors: [adjective-agreement]
    - tutor: "Stretto? Ma parliamo della giacca, no?"
      prompt: {text: "un po' stretto", tags: [adjective-agreement]}
    - learner: "Sì, la giacca... è un po' stretto."
      errors: [adjective-agreement]
    - tutor: "Ha ragione, è un po' stretta sulle spalle. Provi la XL!"
      recast: {text: "un po' stretto", fix: "un po' stretta", tags: [adjective-agreement]}
      new: [{lemma: stretto, gloss: tight}]
    - learner: "Questa va bene! La prendo. Posso pagare con la carta?"
    - tutor: "Certo. Con lo sconto sono ottanta euro. Ecco lo scontrino!"
      goals: [decide]

- scenario: abbigliamento
  level: A2
  persona: es-f-teacher
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Buongiorno. Cerco un vestito elegante per il matrimonio di mia cugina."
    - tutor: "Che bello! Di che colore lo vuole?"
      goals: [ask-item]
    - learner: "Non nero e non bianco. Forse verde o blu. Porto la taglia 42."
    - tutor: "Abbiamo questo vestito verde, in taglia 42. Le piace?"
      goals: [size-colour]
    - learner: "Sì, è molto bonito! Posso provarlo?"
      errors: [word-choice]
    - tutor: "Sì, è molto bello! Il camerino è qui a destra."
      goals: [try]
      recast: {text: "molto bonito", fix: "molto bello", tags: [word-choice]}
    - learner: "Mi sta bene! Avete anche delle borse piccoli per la sera?"
      errors: [adjective-agreement]
    - tutor: "Delle borse... piccoli? Ascolti la fine della parola «borse»."
      prompt: {text: "borse piccoli", tags: [adjective-agreement]}
    - learner: "Sì, borse piccoli."
      errors: [adjective-agreement]
    - tutor: "Sì, borse piccole: ecco, questa è verde come il vestito."
      recast: {text: "borse piccoli", fix: "borse piccole", tags: [adjective-agreement]}
    - learner: "Perfetta. Prendo il vestito e questa borsa. Quanto è in tutto?"
    - tutor: "In tutto sono centoventi euro. Paga con la carta?"
    - learner: "Sì, con la carta. Grazie mille!"
    - tutor: "Grazie a lei! Ecco lo scontrino, e buona festa!"
      goals: [decide]

- scenario: abbigliamento
  level: A2
  persona: en-f-student
  history: [word-order]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Sì, grazie. Cerco dei jeans neri, non troppo cari."
    - tutor: "Ecco, questi jeans neri sono in sconto: trenta euro."
      goals: [ask-item]
    - learner: "Belli! Ma avete questi in un più piccola taglia? Porto la 38."
      errors: [word-order]
    - tutor: "«Un più piccola taglia»? L'ordine delle parole non va."
      prompt: {text: "un più piccola taglia", tags: [word-order]}
    - learner: "Ah... in una taglia più piccola? La 38."
    - tutor: "Perfetto! Ecco la 38."
      goals: [size-colour]
    - learner: "Posso provarli? Dove sono i camerini?"
    - tutor: "In fondo a sinistra. Prego!"
      goals: [try]
    - learner: "Questi jeans sono più comodi che i miei vecchi jeans!"
      errors: [comparative]
    - tutor: "Che bello! Ma più comodi... che i miei? Prima di «i miei» serve un'altra parola."
      prompt: {text: "più comodi che i miei", tags: [comparative]}
    - learner: "Più comodi dei miei vecchi jeans!"
    - tutor: "Brava! Allora li prende?"
    - learner: "Sì, li prendo. Pago in cash."
      errors: [word-choice]
    - tutor: "Benissimo, in contanti: trenta euro. Ecco lo scontrino!"
      recast: {text: "in cash", fix: "in contanti", tags: [word-choice]}
      goals: [decide]

- scenario: parrucchiere
  level: A2
  persona: es-m-worker
  history: [object-pronoun, comparative]
  turns:
    - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
    - learner: "Buongiorno. Solo un taglio: ho i capelli troppo lunghi."
    - tutor: "Va bene. Li laviamo prima?"
    - learner: "Sì, grazie. E anche la barba: lo può tagliare un po'?"
      errors: [object-pronoun]
    - tutor: "Certo. Ma la barba... «lo» può tagliare? La barba è maschile?"
      goals: [book]
      prompt: {text: "lo può tagliare", tags: [object-pronoun]}
    - learner: "No, è femminile. La può tagliare un po'?"
    - tutor: "Esatto! E i capelli, quanto corti li vuole?"
    - learner: "Corti ai lati, sopra un po' più lunghi."
    - tutor: "Va bene. Le consiglio anche un taglio più moderno dietro. Le piace l'idea?"
      goals: [length]
    - learner: "Sì, proviamo! ... Mi piace, è più bello che prima."
      errors: [comparative]
    - tutor: "Grazie! Più bello... che prima? Con «prima» usiamo un'altra parola."
      goals: [style]
      prompt: {text: "più bello che prima", tags: [comparative]}
    - learner: "Sì, sì, molto più bello che prima!"
      errors: [comparative]
    - tutor: "Sono contento, è davvero più bello di prima! Si guardi allo specchio."
      recast: {text: "più bello che prima", fix: "più bello di prima", tags: [comparative]}
    - learner: "Perfetto. Quanto costa?"
    - tutor: "In tutto sono venticinque euro."
    - learner: "Ecco a lei. Grazie, alla prossima!"
    - tutor: "Grazie a lei, arrivederci!"
      goals: [pay]

- scenario: parrucchiere
  level: A2
  persona: en-f-professional
  history: [pronoun-position]
  turns:
    - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
    - learner: "Buongiorno. Vorrei un taglio e la frangia. Ho questa foto."
    - tutor: "Che bella foto! Allora taglio e frangia."
      goals: [book]
    - learner: "Sì. I capelli sono troppo lunghi: può tagliare li fino alle spalle?"
      errors: [pronoun-position]
    - tutor: "Fino alle spalle, va bene. Ma «tagliare li»? Il pronome va in un altro posto."
      prompt: {text: "tagliare li", tags: [pronoun-position]}
    - learner: "Ah: può tagliarli fino alle spalle?"
    - tutor: "Certo. E la frangia, la faccio un po' più lunga della foto?"
      goals: [length]
    - learner: "Sì, buona idea. Più lunga è più pratica per il lavoro."
    - tutor: "Ecco fatto. Si guardi allo specchio: le piace?"
      goals: [style]
    - learner: "Sì, è perfetta! Quanto le devo?"
    - tutor: "Sono sessanta euro, con la piega."
      new: [{lemma: piega, gloss: blow-dry}]
    - learner: "Ecco la carta. Grazie, è bellissimo!"
    - tutor: "Grazie a lei, arrivederci e buon lavoro!"
      goals: [pay]

- scenario: ufficio-postale
  level: A2
  persona: es-f-erasmus
  history: [word-choice, adjective-agreement]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Finisco l'Erasmus e devo spedire i miei libri a Siviglia."
    - tutor: "Va bene. Ha già un pacco pronto?"
      goals: [send]
    - learner: "No, i libri sono qui nella borsa. Vendete le cajas?"
      errors: [word-choice]
    - tutor: "Sì, vendiamo le scatole: piccole e grandi."
      recast: {text: "le cajas", fix: "le scatole", tags: [word-choice]}
      new: [{lemma: scatola, gloss: box}]
    - learner: "Una scatola grande, per favore. Qual è il modo più economico?"
    - tutor: "Il pacco normale: arriva in dieci giorni. Va bene?"
    - learner: "Sì, va bene, non ho prisa."
      errors: [word-choice]
    - tutor: "Se non ha fretta, va benissimo. Ora scriva qui l'indirizzo e che cosa c'è dentro."
      recast: {text: "prisa", fix: "fretta", tags: [word-choice]}
      goals: [speed]
    - learner: "Fatto. Dentro ho scritto: libri vecchio."
      errors: [adjective-agreement]
    - tutor: "Libri... vecchio? Ma sono tanti libri, no?"
      prompt: {text: "libri vecchio", tags: [adjective-agreement]}
    - learner: "Ah, sì: libri vecchi!"
    - tutor: "Perfetto. Sono ventidue euro."
      goals: [form]
    - learner: "Posso pagare con la carta?"
    - tutor: "Certo. Ecco la ricevuta, e buon viaggio!"
      goals: [pay]

- scenario: ufficio-postale
  level: A2
  persona: en-m-traveller
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Ciao! Devo spedire questa chitarra a mio fratello in Cork."
      errors: [preposition, register]
    - tutor: "Una chitarra, va bene. Ma «in Cork»? Con le città usiamo un'altra preposizione."
      prompt: {text: "in Cork", tags: [preposition]}
    - learner: "A Cork! In Irlanda."
    - tutor: "Esatto. La vuole spedire normale o veloce?"
      goals: [send]
    - learner: "Veloce, per favore. Venerdì è il suo compleanno."
    - tutor: "Allora la mandiamo veloce: arriva in tre giorni."
      goals: [speed]
    - learner: "Perfetto. L'indirizzo ce l'ho sul telefono."
    - tutor: "Bene, lo scriva qui sul modulo, per favore."
    - learner: "Ok, l'ho scritta."
      errors: [participle-agreement]
    - tutor: "L'ho scritta? Ma parliamo dell'indirizzo, giusto?"
      prompt: {text: "l'ho scritta", tags: [participle-agreement]}
    - learner: "Sì, scusi: l'ho scritto."
    - tutor: "Perfetto, grazie. Sono trentacinque euro."
      goals: [form]
    - learner: "Ecco. Pago con la carta."
    - tutor: "Grazie! Ecco la ricevuta, e auguri a suo fratello!"
      goals: [pay]
      new: [{lemma: auguri, gloss: best wishes}]

- scenario: ufficio-postale
  level: A2
  persona: en-m-retired
  history: [object-pronoun, ci-ne]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire questo pacco a mia nipote, a Boston."
    - tutor: "Molto bene. Che cosa c'è dentro?"
      goals: [send]
    - learner: "Ci sono foto e un libro. La scatola è aperta: posso chiuderlo qui?"
      errors: [object-pronoun]
    - tutor: "Sì, certo. Ma «chiuderlo»? Di che cosa parliamo?"
      prompt: {text: "chiuderlo", tags: [object-pronoun]}
    - learner: "Della scatola. Posso chiuderla qui?"
    - tutor: "Esatto! Ecco, la chiudiamo insieme. Normale o veloce?"
    - learner: "Normale. Mia nipote non ha fretta."
    - tutor: "Allora arriva in due settimane, più o meno. Le servono anche francobolli?"
      goals: [speed]
    - learner: "Sì, vorrei comprare cinque per le cartoline."
      errors: [ci-ne]
    - tutor: "Comprare cinque... che cosa? Senza ripetere «francobolli», come dice?"
      prompt: {text: "comprare cinque", tags: [ci-ne]}
    - learner: "Vorrei comprare cinque, sì."
      errors: [ci-ne]
    - tutor: "Certo, può comprarne cinque. Ecco qua. Ora scriva qui l'indirizzo, per favore."
      recast: {text: "comprare cinque", fix: "comprarne cinque", tags: [ci-ne]}
    - learner: "Ecco fatto. Ho scritto anche il mio numero di telefono."
    - tutor: "Perfetto. In tutto sono ventotto euro."
      goals: [form]
    - learner: "Ecco trenta euro."
    - tutor: "Grazie, ecco il resto e la ricevuta. Buona giornata!"
      goals: [pay]

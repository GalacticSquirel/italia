# w-a2, file 07: childhood memories, a birthday plan, family and daily routine (A2, broad coverage).
- scenario: ricordi-infanzia
  level: A2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo in una fattoria in Ohio, vicino a un piccolo paese."
    - tutor: "In una fattoria! E cosa facevi tutti i giorni?"
      goals: [place]
    - learner: "Ogni mattina ho dato da mangiare alle mucche con mio padre."
      errors: [tense-aspect]
    - tutor: "Ogni mattina... «ho dato»? Lo facevi sempre, no?"
      prompt: {text: "ho dato", tags: [tense-aspect]}
    - learner: "Ah, sì: davo da mangiare alle mucche ogni mattina!"
    - tutor: "Bravo! E a scuola, com'era la tua maestra?"
      goals: [habits]
      new: [{lemma: maestra, gloss: primary school teacher}]
    - learner: "Si chiamava Mrs Brown. Era molto severo, ma brava."
      errors: [adjective-agreement]
    - tutor: "Severo? Ma parliamo di una donna..."
      prompt: {text: "molto severo", tags: [adjective-agreement]}
    - learner: "Sì, era molto severo con tutti."
      errors: [adjective-agreement]
    - tutor: "Molto severa con tutti, ma brava, allora!"
      goals: [school]
      recast: {text: "molto severo", fix: "Molto severa", tags: [adjective-agreement]}
      new: [{lemma: severo, gloss: strict}]
    - learner: "Esatto! Un inverno c'era una grande tempesta e la scuola chiudeva per tre giorni."
      errors: [tense-aspect]
    - tutor: "La scuola «chiudeva»? Ma è successo una volta sola!"
      prompt: {text: "chiudeva", tags: [tense-aspect]}
    - learner: "Ah! La scuola ha chiuso per tre giorni."
    - tutor: "Che bello per un bambino! Tre giorni di neve e di giochi."
      goals: [event]

- scenario: ricordi-infanzia
  level: A2
  persona: es-f-teacher
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo in un paese vicino a Valencia, in mezzo agli aranci."
    - tutor: "Che bello! E cosa facevi dopo la scuola?"
      goals: [place]
    - learner: "Con i miei cugini giocavamos in strada fino a sera."
      errors: [imperfetto-form]
    - tutor: "«Giocavamos»? Mmm, sembra spagnolo!"
      prompt: {text: "giocavamos", tags: [imperfetto-form]}
    - learner: "Giocavamo in strada fino a sera."
    - tutor: "Esatto! E chi cucinava a casa?"
      goals: [habits]
    - learner: "Mia nonna! Lei cucinaba per tutta la famiglia."
      errors: [imperfetto-form]
    - tutor: "«Cucinaba»? Di nuovo una lettera spagnola..."
      prompt: {text: "cucinaba", tags: [imperfetto-form]}
    - learner: "Sì, cucinaba la paella ogni domenica."
      errors: [imperfetto-form]
    - tutor: "Tua nonna cucinava la paella ogni domenica? Che fortuna!"
      recast: {text: "cucinaba", fix: "cucinava", tags: [imperfetto-form]}
    - learner: "Sì! A scuola, invece, non ero molto buona in matematica."
      errors: [word-choice]
    - tutor: "Non eri molto brava in matematica? Anch'io no! Hai un ricordo speciale?"
      goals: [school]
      recast: {text: "molto buona in matematica", fix: "molto brava in matematica", tags: [word-choice]}
    - learner: "Sì: a dieci anni ho vinto un concorso di poesia e il sindaco mi ha dato un premio."
    - tutor: "Che brava! E scrivi ancora oggi?"
      goals: [event]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-traveller
  history: [tense-aspect, piacere]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "In Dublino, in una casa con un giardino grande."
      errors: [preposition]
    - tutor: "«In Dublino»? Con le città usiamo un'altra preposizione."
      prompt: {text: "In Dublino", tags: [preposition]}
    - learner: "A Dublino! Giocavo sempre in giardino con i miei fratelli."
    - tutor: "Esatto! E a scuola com'eri?"
      goals: [place, habits]
    - learner: "Ero un po' pigro. Non mi piaceva i compiti."
      errors: [piacere]
    - tutor: "Non mi «piaceva» i compiti? Ma sono tanti compiti..."
      prompt: {text: "piaceva i compiti", tags: [piacere]}
    - learner: "Sì, non mi piaceva i compiti, mai!"
      errors: [piacere]
    - tutor: "Non ti piacevano i compiti? Neanche a me! E un ricordo speciale?"
      goals: [school]
      recast: {text: "piaceva i compiti", fix: "piacevano i compiti", tags: [piacere]}
    - learner: "Una volta cadevo da un albero e mi sono rotto il braccio."
      errors: [tense-aspect]
    - tutor: "«Cadevo»? Ma è successo una volta sola, no?"
      prompt: {text: "cadevo", tags: [tense-aspect]}
    - learner: "Sono caduto da un albero! Avevo otto anni."
    - tutor: "Povero! Un brutto ricordo, ma anche un po' divertente."
      goals: [event]

- scenario: compleanno
  level: A2
  persona: en-f-student
  history: [future-form, object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a sorpresa! Sabato sera, a casa mia?"
    - tutor: "Ottima idea! Chi invitiamo?"
      goals: [date]
    - learner: "Inviteremo i suoi compagni di università e la sua sorella."
      errors: [possessive]
    - tutor: "«La sua sorella»? Mmm, c'è una parola in più."
      prompt: {text: "la sua sorella", tags: [possessive]}
    - learner: "E sua sorella Giulia. Poi io farò le pizzette e tu comprarai la torta."
      errors: [future-form]
    - tutor: "Benissimo. E io... «comprarai»? Il futuro di comprare non fa così."
      goals: [guests]
      prompt: {text: "comprarai", tags: [future-form]}
    - learner: "Tu comprerai la torta!"
    - tutor: "Va bene, comprerò una torta buonissima. E il regalo?"
      goals: [food]
    - learner: "Possiamo regalare un libro a Sara. Gli piace molto leggere."
      errors: [object-pronoun]
    - tutor: "«Gli piace»? Ma parliamo di Sara, no?"
      prompt: {text: "Gli piace molto leggere", tags: [object-pronoun]}
    - learner: "Sì, gli piace molto leggere."
      errors: [object-pronoun]
    - tutor: "Hai ragione, le piace molto leggere. Allora un bel libro!"
      goals: [gift]
      recast: {text: "gli piace molto leggere", fix: "le piace molto leggere", tags: [object-pronoun]}
    - learner: "Perfetto! Lo compro io domani."
    - tutor: "Benissimo, a sabato allora!"

- scenario: compleanno
  level: A2
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una cena nel ristorante dove lavoro, venerdì sera."
    - tutor: "Bella idea! Quante persone invitiamo?"
      goals: [date]
    - learner: "Quindici, più o meno. Inviteremo anche i suoi genitori? Gli conosco bene."
      errors: [object-pronoun]
    - tutor: "«Gli conosco»? Conosci... chi?"
      prompt: {text: "Gli conosco", tags: [object-pronoun]}
    - learner: "I suoi genitori. Li conosco bene!"
    - tutor: "Esatto! Allora invitiamo anche loro."
      goals: [guests]
    - learner: "Io farò le lasagne. La torta la farà il mio collega pastelero."
      errors: [word-choice]
    - tutor: "Il tuo collega pasticcere? Perfetto, allora la torta sarà buonissima!"
      goals: [food]
      recast: {text: "pastelero", fix: "pasticcere", tags: [word-choice]}
      new: [{lemma: pasticcere, gloss: pastry chef}]
    - learner: "Sara vuole andare a un concerto. Possiamo regalarli due biglietti?"
      errors: [object-pronoun]
    - tutor: "Regalarli... a chi? Sara è una ragazza."
      prompt: {text: "regalarli", tags: [object-pronoun]}
    - learner: "Sì, regalarli due biglietti."
      errors: [object-pronoun]
    - tutor: "Sì, possiamo regalarle due biglietti! Ottima idea."
      goals: [gift]
      recast: {text: "regalarli", fix: "regalarle", tags: [object-pronoun]}
    - learner: "Domani compro i biglietti. Non dirai niente a Sara, eh?"
    - tutor: "Tranquillo, non le dirò niente!"

- scenario: compleanno
  level: A2
  persona: en-m-heritage
  history: [future-form, pronoun-position]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo un picnic al parco domenica! Il tempo esserà bello."
      errors: [future-form]
    - tutor: "«Esserà»? Il futuro di essere è speciale..."
      prompt: {text: "esserà bello", tags: [future-form]}
    - learner: "Sì, domenica esserà bello."
      errors: [future-form]
    - tutor: "Sì, domenica sarà bello! Ottima idea, andiamo al parco."
      goals: [date]
      recast: {text: "esserà bello", fix: "sarà bello", tags: [future-form]}
    - learner: "Invitiamo i nostri amici del calcetto e anche i suoi co-workers."
      errors: [word-choice]
    - tutor: "Sì, anche i suoi colleghi! Scrivo io a tutti."
      goals: [guests]
      recast: {text: "i suoi co-workers", fix: "i suoi colleghi", tags: [word-choice]}
    - learner: "Grazie! Mia nonna farà la sua famosa lasagna."
    - tutor: "Fantastico! E il regalo?"
      goals: [food]
    - learner: "Sara ha bisogno di una bici nuova. Possiamo comprare la insieme?"
      errors: [pronoun-position]
    - tutor: "«Comprare la»? Dove va il pronome?"
      prompt: {text: "comprare la", tags: [pronoun-position]}
    - learner: "Possiamo comprarla insieme?"
    - tutor: "Sì, così paghiamo tutti un po'!"
      goals: [gift]
    - learner: "Benissimo. La porterò io al parco, con un nastro rosso."
    - tutor: "Che bello, sarà una sorpresa perfetta!"

- scenario: famiglia
  level: A2
  persona: es-f-erasmus
  history: [adjective-agreement, false-friend]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei genitori, mio fratello e le mie sorelle, a Siviglia."
    - tutor: "Che bella famiglia! Quanti anni hanno le tue sorelle?"
      goals: [who]
    - learner: "Sì, sono gemelli! Hanno diciotto anni."
      errors: [noun-gender]
    - tutor: "Gemelli? Ma sono due ragazze..."
      goals: [ages]
      prompt: {text: "sono gemelli", tags: [noun-gender]}
    - learner: "Sì, sono gemelli, uguali uguali!"
      errors: [noun-gender]
    - tutor: "Ah, sono gemelle! Diciotto anni, che bell'età."
      recast: {text: "sono gemelli", fix: "sono gemelle", tags: [noun-gender]}
      new: [{lemma: gemello, gloss: twin}]
    - learner: "E questo è mio fratello. Tiene venticinque anni e fa il medico."
      errors: [false-friend]
    - tutor: "Ha venticinque anni ed è già medico? Bravo!"
      recast: {text: "Tiene venticinque anni", fix: "Ha venticinque anni", tags: [false-friend]}
    - learner: "Sì, è molto intelligente e generosa."
      errors: [adjective-agreement]
    - tutor: "Generosa? Ma parliamo di tuo fratello..."
      prompt: {text: "generosa", tags: [adjective-agreement]}
    - learner: "Generoso! È molto generoso con tutti."
    - tutor: "Allora è un fratello perfetto!"
      goals: [describe]
    - learner: "Sì! E tu, Marco? Hai fratelli?"
    - tutor: "No, sono figlio unico. Ma ho tanti cugini!"
      goals: [ask]

- scenario: giorno-tipico
  level: A2
  persona: en-m-retired
  history: [reflexive, subject-verb-agreement]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Sveglio alle sei, anche se sono in pensione!"
      errors: [reflexive]
    - tutor: "Svegli... chi? Manca qualcosa davanti."
      prompt: {text: "Sveglio", tags: [reflexive]}
    - learner: "Mi sveglio alle sei!"
    - tutor: "Così presto! E poi cosa fai la mattina?"
      goals: [wake]
    - learner: "Faccio una passeggiata e poi cucino: sono imparando a fare il pane."
      errors: [stare-gerund]
    - tutor: "«Sono imparando»? Per un'azione di adesso usiamo un altro verbo."
      prompt: {text: "sono imparando", tags: [stare-gerund]}
    - learner: "Sto imparando a fare il pane!"
    - tutor: "Bravo! E la sera cosa fai?"
      goals: [work]
    - learner: "La sera io leggo e mia moglie guardano la televisione."
      errors: [subject-verb-agreement]
    - tutor: "Tua moglie «guardano»? Ma è una persona sola!"
      prompt: {text: "guardano", tags: [subject-verb-agreement]}
    - learner: "Sì, mia moglie guardano i film."
      errors: [subject-verb-agreement]
    - tutor: "Ah, tua moglie guarda i film e tu leggi. Una bella serata!"
      goals: [evening]
      recast: {text: "guardano", fix: "guarda", tags: [subject-verb-agreement]}
    - learner: "Sì, molto tranquilla. E tu, Anna? A che ora ti svegli?"
    - tutor: "Io mi sveglio alle otto, ma la sera vado a letto tardi!"
      goals: [ask]

# w-a2, file 06: last weekend, past holidays, home and family (A2, broad coverage).
- scenario: weekend-scorso
  level: A2
  persona: es-f-teacher
  history: [auxiliary-choice, participle-agreement]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Molto bene! Sabato sono andata a Verona con mia sorella."
    - tutor: "A Verona, che bello! Cosa avete fatto?"
      goals: [where, with-who]
    - learner: "Abbiamo visitato l'Arena e abbiamo mangiato in una trattoria. Poi mia sorella ha salito sulla torre."
      errors: [auxiliary-choice]
    - tutor: "Tua sorella «ha salito»? Con salire, avere o essere?"
      prompt: {text: "ha salito", tags: [auxiliary-choice]}
    - learner: "Sì, lei ha salito sulla torre, io no!"
      errors: [auxiliary-choice]
    - tutor: "Ah, è salita sulla torre e tu no! E domenica?"
      goals: [what]
      recast: {text: "ha salito", fix: "è salita", tags: [auxiliary-choice]}
    - learner: "Domenica siamo restato a casa. Ho dormido tutto il giorno!"
      errors: [participle-agreement, past-participle-form]
    - tutor: "«Siamo restato»? Ma siete due donne..."
      prompt: {text: "siamo restato", tags: [participle-agreement]}
    - learner: "Siamo restate a casa, sì. Ho dormido tanto!"
      errors: [past-participle-form]
    - tutor: "Brava! Ma «ho dormido»? Sembra spagnolo!"
      prompt: {text: "dormido", tags: [past-participle-form]}
    - learner: "Ah, ho dormito! Mi è piaciuto molto il fine settimana. E tu, cosa hai fatto?"
    - tutor: "Io sono rimasta a casa e ho letto un bel libro."
      goals: [opinion]

- scenario: weekend-scorso
  level: A2
  persona: en-m-traveller
  history: [past-participle-form, reflexive]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Fantastico! Sono andato in montagna, sulle Dolomiti."
    - tutor: "Che bello! Con chi sei andato?"
      goals: [where]
    - learner: "Con mio amico Sean e sua ragazza."
      errors: [possessive]
    - tutor: "Con «mio amico»? Per un amico serve una piccola parola in più."
      prompt: {text: "mio amico", tags: [possessive]}
    - learner: "Con il mio amico Sean e la sua ragazza."
    - tutor: "Esatto! E cosa avete fatto?"
      goals: [with-who]
    - learner: "Abbiamo camminato tanto e abbiamo vedeto un lago bellissimo."
      errors: [past-participle-form]
    - tutor: "«Abbiamo vedeto»? Vedere al passato fa diverso."
      prompt: {text: "vedeto un lago", tags: [past-participle-form]}
    - learner: "Abbiamo... vedeto un lago, sì."
      errors: [past-participle-form]
    - tutor: "Avete visto un lago? Che bello!"
      goals: [what]
      recast: {text: "vedeto un lago", fix: "visto un lago", tags: [past-participle-form]}
    - learner: "Sì! E la sera abbiamo divertito molto in un rifugio."
      errors: [reflexive]
    - tutor: "Avete divertito... chi? Lì manca qualcosa."
      prompt: {text: "abbiamo divertito", tags: [reflexive]}
    - learner: "Ci siamo divertiti molto! È stato bellissimo. E il tuo fine settimana?"
    - tutor: "Io sono andata al cinema con mia madre. Niente di speciale!"
      goals: [opinion]

- scenario: weekend-scorso
  level: A2
  persona: en-f-student
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Stanco! Sabato abbiamo andato a una festa a casa di Tom."
      errors: [auxiliary-choice, adjective-agreement]
    - tutor: "Una festa! Ma «abbiamo andato»? Con andare quale verbo usiamo?"
      prompt: {text: "abbiamo andato", tags: [auxiliary-choice]}
    - learner: "Siamo andati a una festa a casa di Tom."
    - tutor: "Esatto! Ed era una bella festa?"
      goals: [where]
    - learner: "Sì, molto! Abbiamo ballato tutta la notte. La festa ha finito alle quattro!"
      errors: [auxiliary-choice]
    - tutor: "Mmm, la festa «ha finito»? Pensa a «siamo andati»..."
      prompt: {text: "ha finito", tags: [auxiliary-choice]}
    - learner: "Sì, ha finito alle quattro di mattina."
      errors: [auxiliary-choice]
    - tutor: "È finita alle quattro? Che notte!"
      goals: [what]
      recast: {text: "ha finito", fix: "È finita", tags: [auxiliary-choice]}
    - learner: "E domenica ho studiato per l'esame con mia amica Emma."
      errors: [possessive]
    - tutor: "Brava! Ma «mia amica»? Con «amica» manca una piccola parola."
      prompt: {text: "mia amica", tags: [possessive]}
    - learner: "Con la mia amica Emma."
    - tutor: "Esatto! Allora ti è piaciuto il fine settimana?"
      goals: [with-who]
    - learner: "Sì, molto! Ma sono ancora stanca. E tu, cosa hai fatto?"
    - tutor: "Io sono andata al lago con il mio ragazzo. Bellissimo!"
      goals: [opinion]

- scenario: vacanze-passate
  level: A2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "In Sicilia, a Palermo, con mia moglie. Una settimana."
    - tutor: "Che bello! E che tempo faceva?"
      goals: [where]
    - learner: "Ogni giorno è stato caldo, trentacinque gradi!"
      errors: [tense-aspect]
    - tutor: "Ogni giorno... «è stato caldo»? Pensa: com'era il tempo?"
      prompt: {text: "è stato caldo", tags: [tense-aspect]}
    - learner: "Sì, è stato molto caldo ogni giorno."
      errors: [tense-aspect]
    - tutor: "Faceva molto caldo ogni giorno? Qui invece pioveva!"
      goals: [weather]
      recast: {text: "è stato molto caldo", fix: "Faceva molto caldo", tags: [tense-aspect]}
    - learner: "Siamo andati alla playa tutti i giorni e abbiamo mangiato tanto pesce."
      errors: [word-choice]
    - tutor: "Alla spiaggia tutti i giorni, che fortuna! E poi?"
      recast: {text: "alla playa", fix: "Alla spiaggia", tags: [word-choice]}
    - learner: "Abbiamo visitato Monreale e Cefalù. Molto belle!"
    - tutor: "Due posti bellissimi. Cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il mercato! Io sono cuoco, e mi è piaciuto molto i mercati di Palermo."
      errors: [piacere]
    - tutor: "Ti «è piaciuto» i mercati? Ma sono tanti mercati..."
      prompt: {text: "mi è piaciuto molto i mercati", tags: [piacere]}
    - learner: "Mi sono piaciuti molto i mercati!"
    - tutor: "Ti capisco! I mercati di Palermo sono un sogno."
      goals: [best]

- scenario: vacanze-passate
  level: A2
  persona: en-m-heritage
  history: [imperfetto-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono andato in Abruzzo, nel paese dei miei nonni. Era la prima volta!"
    - tutor: "Che bello! E che tempo faceva?"
      goals: [where]
    - learner: "Di giorno faceva caldo, ma la sera faceva freddo."
    - tutor: "Normale, in montagna! Cosa hai fatto lì?"
      goals: [weather]
    - learner: "Ho conosciuto i miei cugini e ho aiutato mio nonno in il giardino."
      errors: [articulated-preposition]
    - tutor: "Bravo! Ma «in il giardino»? Le due parole si uniscono."
      prompt: {text: "in il giardino", tags: [articulated-preposition]}
    - learner: "Nel giardino! Ogni mattina."
    - tutor: "Esatto! E qual è stata la cosa più bella?"
      goals: [activities]
    - learner: "Le storie di mio nonno. Ogni sera lui bevava un bicchiere di vino e raccontava storie."
      errors: [imperfetto-form]
    - tutor: "«Bevava»? Attenzione: bere, al passato, è un po' speciale."
      prompt: {text: "bevava", tags: [imperfetto-form]}
    - learner: "Sì, lui bevava un bicchiere di vino..."
      errors: [imperfetto-form]
    - tutor: "Tuo nonno beveva un bicchiere di vino e raccontava storie? Che bello!"
      goals: [best]
      recast: {text: "bevava un bicchiere", fix: "beveva un bicchiere", tags: [imperfetto-form]}
    - learner: "Sì, e io lo ascoltavo per ore. Voglio tornare l'anno prossimo!"
    - tutor: "Ma certo! Tanti saluti ai tuoi nonni."

- scenario: vacanze-passate
  level: A2
  persona: es-f-erasmus
  history: [participle-agreement, false-friend]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "In Puglia, con tre amiche dell'Erasmus. Il viaggio in autobus era molto largo!"
      errors: [false-friend]
    - tutor: "Un viaggio molto lungo, eh? Ma la Puglia è bellissima!"
      goals: [where]
      recast: {text: "molto largo", fix: "molto lungo", tags: [false-friend]}
    - learner: "Sì! Le mie amiche sono arrivato prima, in aereo."
      errors: [participle-agreement]
    - tutor: "Le tue amiche «sono arrivato»? Ma sono ragazze..."
      prompt: {text: "sono arrivato", tags: [participle-agreement]}
    - learner: "Sì, sono arrivato prima."
      errors: [participle-agreement]
    - tutor: "Ah, sono arrivate prima, in aereo! E il tempo?"
      recast: {text: "sono arrivato", fix: "sono arrivate", tags: [participle-agreement]}
    - learner: "Perfetto: c'era sempre il sole."
    - tutor: "Che fortuna! E cosa avete fatto?"
      goals: [weather]
    - learner: "Siamo state sempre in spiaggia e la sera siamo salite a ballare."
      errors: [false-friend]
    - tutor: "Siete uscite a ballare ogni sera? Che bella vita! Cosa ti è piaciuto di più?"
      recast: {text: "salite a ballare", fix: "uscite a ballare", tags: [false-friend]}
      goals: [activities]
    - learner: "Il mare di Otranto: è più bello che il mare in Spagna!"
      errors: [comparative]
    - tutor: "Più bello... «che il mare»? Prima di un nome usiamo un'altra parola."
      prompt: {text: "più bello che il mare", tags: [comparative]}
    - learner: "Più bello del mare in Spagna!"
    - tutor: "Davvero? Allora l'anno prossimo vengo con te."
      goals: [best]

- scenario: casa-mia
  level: A2
  persona: es-m-worker
  history: [ce-ci-sono, adjective-agreement]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    - learner: "Vivo in un monolocale, sopra il ristorante dove lavoro."
    - tutor: "Che bello! Quante stanze ci sono?"
      goals: [type]
    - learner: "Solo una stanza e un bagno. Non è cucina, perché mangio al ristorante!"
      errors: [ce-ci-sono]
    - tutor: "«Non è cucina»? Vuoi dire che in casa la cucina manca, no?"
      prompt: {text: "Non è cucina", tags: [ce-ci-sono]}
    - learner: "Sì: non c'è la cucina!"
    - tutor: "Esatto! Allora mangi sempre al lavoro!"
      goals: [rooms]
    - learner: "Sì! La cosa più bella è la finestra: la vista è bellissimo."
      errors: [adjective-agreement]
    - tutor: "La vista... bellissimo? Ascolta bene la fine."
      prompt: {text: "è bellissimo", tags: [adjective-agreement]}
    - learner: "Sì, la vista è bellissimo, vedo tutta la piazza."
      errors: [adjective-agreement]
    - tutor: "La vista è bellissima, allora! Vedi tutta la piazza, che fortuna."
      goals: [favourite]
      recast: {text: "è bellissimo", fix: "è bellissima", tags: [adjective-agreement]}
    - learner: "E tu, Luca? La tua casa è grande che la mia?"
      errors: [comparative]
    - tutor: "Grande... che la tua? Lì manca qualcosa."
      prompt: {text: "è grande che la mia", tags: [comparative]}
    - learner: "È più grande della mia?"
    - tutor: "Sì, un po': ho tre stanze e un balcone."
      goals: [ask]

- scenario: famiglia
  level: A2
  persona: en-f-professional
  history: [possessive, essere-avere]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "È il mio matrimonio, a Sydney. Questi sono i miei genitori e questa è la mia nonna."
      errors: [possessive]
    - tutor: "Che bella festa! Ma «la mia nonna»? Con la famiglia, al singolare..."
      prompt: {text: "la mia nonna", tags: [possessive]}
    - learner: "Ah, sì: questa è mia nonna."
    - tutor: "Esatto! Com'è tua nonna?"
      goals: [who]
    - learner: "È molto simpatica e ancora molto attivo: fa yoga ogni mattina!"
      errors: [adjective-agreement]
    - tutor: "Attivo? Ma parliamo di tua nonna..."
      prompt: {text: "molto attivo", tags: [adjective-agreement]}
    - learner: "Sì, molto attivo!"
      errors: [adjective-agreement]
    - tutor: "Ancora molto attiva, brava lei! Quanti anni ha?"
      goals: [describe]
      recast: {text: "molto attivo", fix: "molto attiva", tags: [adjective-agreement]}
      new: [{lemma: attivo, gloss: active}]
    - learner: "Lei è novantuno anni."
      errors: [essere-avere]
    - tutor: "«È novantuno anni»? Per l'età usiamo un altro verbo."
      prompt: {text: "è novantuno anni", tags: [essere-avere]}
    - learner: "Ha novantuno anni!"
    - tutor: "Incredibile! Tanti auguri alla nonna."
      goals: [ages]
      new: [{lemma: auguri, gloss: best wishes}]
    - learner: "Grazie! E la tua famiglia, Marco? È grande?"
    - tutor: "Abbastanza: ho due fratelli e tanti cugini!"
      goals: [ask]

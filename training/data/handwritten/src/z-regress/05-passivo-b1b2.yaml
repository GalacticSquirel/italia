# z-regress, file 05: B1-B2, passive (essere/venire/andare + participle, si passivante).
- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [passive]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra si mangia il tacchino e si apre i regali la mattina del 25."
      errors: [passive]
    - tutor: "«Si apre i regali»? Pensa: i regali sono tanti..."
      prompt: {text: "si apre i regali", tags: [passive]}
    - learner: "Si aprono i regali la mattina del 25."
    - tutor: "Esatto! Da noi invece, in molte famiglie, si aprono la sera prima di Natale."
      goals: [compare]
    - learner: "Quando ero piccola, l'albero veniva decorato da tutta la famiglia insieme."
    - tutor: "Che bel ricordo! E poi cosa facevate?"
    - learner: "Il pranzo era preparato dalla nonna, e dopo si guardava il discorso della regina."
    - tutor: "Una vera tradizione!"
      goals: [past]
    - learner: "E a Capodanno, cosa si mangia qui? Ho sentito che si mangiano le lenticchie."
    - tutor: "Sì, le lenticchie portano fortuna!"
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Quest'anno vorrei fare un Capodanno italiano. Le lenticchie vanno cucinato il giorno prima?"
      errors: [passive]
    - tutor: "«Vanno cucinato»? Attenzione: parliamo delle lenticchie."
      prompt: {text: "vanno cucinato", tags: [passive]}
    - learner: "Sì, vanno cucinato il giorno prima?"
      errors: [passive]
    - tutor: "No, le lenticchie vanno cucinate il giorno stesso. Se vuoi, le prepariamo insieme!"
      recast: {text: "vanno cucinato", fix: "vanno cucinate", tags: [passive]}
      new: [{lemma: lenticchia, gloss: lentil}]
      goals: [plan]

- scenario: dal-meccanico
  level: B1
  persona: es-m-worker
  history: [passive]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Fa un ruido strano quando freno, soprattutto in discesa."
      errors: [word-choice]
    - tutor: "Capisco, un rumore strano. Da quando lo sente?"
      recast: {text: "un ruido strano", fix: "un rumore strano", tags: [word-choice]}
      goals: [describe]
    - learner: "Da una settimana. Eppure i freni sono stato cambiati l'anno scorso."
      errors: [passive]
    - tutor: "«Sono stato cambiati»? Parliamo dei freni: controlli bene tutto il verbo."
      prompt: {text: "sono stato cambiati", tags: [passive]}
    - learner: "I freni sono stati cambiati l'anno scorso, a marzo."
    - tutor: "Allora forse non è niente di grave. Lo controllo subito."
      goals: [when]
    - learner: "Quanto costerà la riparazione?"
    - tutor: "Se è un problema piccolo, costerà circa ottanta euro."
      goals: [cost]
    - learner: "Va bene. E quando sarà pronta? La macchina mi serve per il lavoro."
    - tutor: "Sarà pronta domani alle cinque."
      goals: [time]
    - learner: "Perfetto. L'anno scorso la mia macchina è venuta riparata in un'altra officina, ma male."
      errors: [passive]
    - tutor: "«È venuta riparata»? Al passato prossimo, «venire» qui non funziona."
      prompt: {text: "è venuta riparata", tags: [passive]}
    - learner: "Sì, è venuta riparata male."
      errors: [passive]
    - tutor: "Ah, quindi è stata riparata male. Stavolta ci penso io, non si preoccupi!"
      recast: {text: "è venuta riparata", fix: "è stata riparata", tags: [passive]}

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [passive]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, nella mia camera il riscaldamento non funziona e fa molto freddo."
    - tutor: "Mi dispiace molto. Che numero di camera ha?"
      goals: [problem]
    - learner: "La 305. Il problema è stato segnalata già ieri sera, ma nessuno è venuto."
      errors: [passive]
    - tutor: "«È stato segnalata»? Pensi a «il problema»..."
      prompt: {text: "è stato segnalata", tags: [passive]}
    - learner: "Il problema è stato segnalato già ieri sera."
    - tutor: "Ha ragione, mi scusi. Quindi ha freddo da ieri sera?"
      goals: [since]
    - learner: "Sì. Potrebbe darmi un'altra camera, per favore?"
    - tutor: "Certo, le posso dare la 412: è più grande e più calda."
      goals: [request]
    - learner: "Grazie. Le mie valigie verranno portate su da qualcuno?"
    - tutor: "Sì, gliele porta su un collega tra cinque minuti."
    - learner: "E per il disturbo, la colazione di domani viene offerta dall'hotel?"
    - tutor: "Certo, la colazione gliela offriamo noi, ci mancherebbe."
      goals: [agree]

- scenario: volontariato
  level: B1
  persona: es-f-erasmus
  history: [passive]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Ho letto che la vostra associazione è stato fondata da un gruppo di studenti."
      errors: [passive]
    - tutor: "«È stato fondata»? Pensa: l'associazione è femminile."
      prompt: {text: "è stato fondata", tags: [passive]}
    - learner: "È stata fondata da studenti, vero?"
    - tutor: "Esatto, nel 2010! E tu perché vuoi aiutarci?"
    - learner: "Perché voglio conoscere persone nuove e fare qualcosa di utile per la città."
    - tutor: "Bellissimo. Cosa sai fare?"
      goals: [motivation]
    - learner: "Parlo spagnolo e inglese, e so usare bene l'ordenador."
      errors: [word-choice]
    - tutor: "Perfetto, chi sa usare il computer ci serve sempre, e anche chi traduce."
      recast: {text: "l'ordenador", fix: "il computer", tags: [word-choice]}
      goals: [skills]
    - learner: "Quante ore alla settimana devo lavorare?"
    - tutor: "Bastano tre ore, il sabato o la domenica."
      goals: [time]
    - learner: "I pacchi di cibo viene preparati il sabato?"
      errors: [passive]
    - tutor: "«Viene preparati»? Quanti pacchi sono?"
      prompt: {text: "viene preparati", tags: [passive]}
    - learner: "Sì, viene preparati il sabato mattina?"
      errors: [passive]
    - tutor: "Sì, i pacchi vengono preparati il sabato mattina. Ti metto nel gruppo del sabato?"
      recast: {text: "viene preparati", fix: "vengono preparati", tags: [passive]}
      new: [{lemma: pacco, gloss: parcel}]
    - learner: "Sì, perfetto!"
    - tutor: "Benissimo, ti aspettiamo sabato alle nove!"
      goals: [choose]

- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [passive]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi lascia senza parole: i colori sono così vivi che sembra dipinto ieri."
    - tutor: "Vero? Eppure ha più di cinquecento anni. Cosa vedi?"
      goals: [react]
    - learner: "Vedo una Madonna con il bambino, e dietro un paesaggio con un lago e delle montagne."
    - tutor: "Brava, e guarda la luce sul viso. Secondo te cosa vuole comunicare?"
      goals: [describe]
    - learner: "Una grande calma. Ho letto che è stato ordinato da una famiglia ricca, ma poi è venuto rubato nell'Ottocento."
      errors: [passive]
    - tutor: "Bella lettura. Ma «è venuto rubato»? Ci ripensi: con il passato prossimo, «venire» non va."
      prompt: {text: "è venuto rubato", tags: [passive]}
      goals: [interpret]
    - learner: "Ah, giusto: è stato rubato nell'Ottocento."
    - tutor: "Esatto, e per fortuna è stato ritrovato. E rispetto a quello accanto, cosa noti?"
    - learner: "Le figure dell'altro quadro sono state dipinto con colori più scuri."
      errors: [passive]
    - tutor: "«Sono state dipinto»? Controlla l'accordo con «le figure»."
      prompt: {text: "sono state dipinto", tags: [passive]}
    - learner: "Sì, sono state dipinto con colori scuri, e sono più rigide."
      errors: [passive]
    - tutor: "Giusto, sono state dipinte con colori più scuri, e infatti sembrano più lontane. Bella osservazione!"
      recast: {text: "sono state dipinto", fix: "sono state dipinte", tags: [passive]}
      goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: es-m-worker
  history: [passive]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri mattina la mia macchina è stata colpita da un furgone mentre era parcheggiata."
    - tutor: "Mi dispiace. Lei era dentro la macchina?"
    - learner: "No, ero al bar. Il furgone non aveva visto la mia macchina perché stava aparcando."
      errors: [word-choice]
    - tutor: "Capisco, stava parcheggiando. E l'altra persona ha ammesso la sua responsabilità?"
      recast: {text: "stava aparcando", fix: "stava parcheggiando", tags: [word-choice]}
      goals: [what]
    - learner: "Sì, il modulo di constatazione amichevole è stato firmata da entrambi."
      errors: [passive]
    - tutor: "«È stato firmata»? Qual è il soggetto della frase?"
      prompt: {text: "è stato firmata", tags: [passive]}
    - learner: "Il modulo è stato firmato da entrambi, sul posto."
    - tutor: "Perfetto, così è tutto più semplice."
      goals: [responsibility]
    - learner: "Quali documenti devo mandare?"
    - tutor: "Il modulo, le foto dei danni e una copia dei documenti della macchina."
      goals: [documents]
    - learner: "Le foto sono state fatte subito dopo l'incidente. Spero che i danni vengono pagato presto, perché la macchina mi serve."
      errors: [passive, subjunctive-use]
    - tutor: "«Vengono pagato»? Pensi all'accordo con «i danni»."
      prompt: {text: "vengono pagato", tags: [passive]}
    - learner: "Sì, spero che vengono pagato presto."
      errors: [passive, subjunctive-use]
    - tutor: "Di solito i danni vengono pagati entro trenta giorni. La terrò aggiornato su ogni passaggio."
      recast: {text: "vengono pagato", fix: "vengono pagati", tags: [passive]}
      goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: en-m-heritage
  history: [passive]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Vorrei applicare per la residenza: mi sono trasferito qui a ottobre."
      errors: [word-choice]
    - tutor: "Bene, per fare domanda di residenza serve questo modulo. L'ha già compilato?"
      recast: {text: "applicare per la residenza", fix: "fare domanda di residenza", tags: [word-choice]}
      goals: [request]
    - learner: "Sì, l'ho compilato ieri sera, ma non so quali documenti si deve allegare."
      errors: [passive]
    - tutor: "«Si deve allegare»? Pensi a che cosa si porta: i documenti."
      prompt: {text: "si deve allegare", tags: [passive]}
    - learner: "Quali documenti si devono allegare?"
    - tutor: "Il passaporto, il codice fiscale e il contratto d'affitto."
      goals: [documents]
      new: [{lemma: fiscale, gloss: tax (as in tax code)}]
    - learner: "Il contratto non è ancora stato registrato dal proprietario. È un problema?"
    - tutor: "Purtroppo sì: senza registrazione la domanda non può essere accettata."
      goals: [problem]
    - learner: "Allora la domanda va presentato dopo la registrazione?"
      errors: [passive]
    - tutor: "«Va presentato»? Con «la domanda», l'accordo cambia."
      prompt: {text: "va presentato", tags: [passive]}
    - learner: "Quindi va presentato dopo?"
      errors: [passive]
    - tutor: "Sì, va presentata dopo: appena il contratto è registrato, torni da noi e la pratica verrà chiusa in pochi giorni."
      recast: {text: "va presentato", fix: "va presentata", tags: [passive]}
      goals: [next]

- scenario: riunione-lavoro
  level: B2
  persona: en-f-professional
  history: [passive]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Il nuovo sito è stato pubblicato lunedì e i primi dati sono positivi."
    - tutor: "Ottimo! E i problemi della settimana scorsa?"
      goals: [update]
    - learner: "Purtroppo alcuni ordini sono stati persi a causa di un errore nel sistema di pagamento."
    - tutor: "Accidenti. Quanti?"
    - learner: "Una ventina. Tutti i clienti sono stato contattati ieri dal servizio clienti."
      errors: [passive]
    - tutor: "«Sono stato contattati»? Guarda bene il verbo: parliamo di «tutti i clienti»."
      prompt: {text: "sono stato contattati", tags: [passive]}
    - learner: "Sono stati contattati ieri, tutti quanti."
    - tutor: "Bene, almeno abbiamo reagito in fretta. Cosa proponi?"
      goals: [problem]
    - learner: "Proporrei di testare ogni aggiornamento per due giorni prima di pubblicarlo. Così gli errori verrebbero trovato in anticipo."
      errors: [passive]
    - tutor: "«Verrebbero trovato»? Gli errori sono tanti..."
      prompt: {text: "verrebbero trovato", tags: [passive]}
    - learner: "Sì, gli errori verrebbero trovato prima."
      errors: [passive]
    - tutor: "Mi convince: così gli errori verrebbero trovati prima di arrivare ai clienti. Quando potresti partire?"
      recast: {text: "verrebbero trovato", fix: "verrebbero trovati", tags: [passive]}
      goals: [proposal]
    - learner: "Da lunedì prossimo. Il piano sarà pronto entro venerdì."
    - tutor: "Perfetto, allora venerdì ne parliamo."
      goals: [deadline]

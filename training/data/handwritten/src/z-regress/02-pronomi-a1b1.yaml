# z-regress, file 02: A1-B1, object pronouns (lo/la/li/le, gli/le), with clitics on infinitives.
- scenario: cucina-ricetta
  level: A2
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Facciamo la pasta con le zucchine! Ho comprato tutto al mercato."
    - tutor: "Buona idea! Cosa serve?"
    - learner: "Servono zucchine, aglio, olio e parmesan."
      errors: [word-choice]
    - tutor: "Perfetto, anche il parmigiano c'è. Come cominciamo?"
      recast: {text: "parmesan", fix: "parmigiano", tags: [word-choice]}
      new: [{lemma: parmigiano, gloss: parmesan cheese}]
      goals: [ingredients]
    - learner: "Prima lavi le zucchine e poi li tagli a pezzetti."
      errors: [object-pronoun]
    - tutor: "Li tagli? Le zucchine sono femminili..."
      prompt: {text: "li tagli", tags: [object-pronoun]}
    - learner: "Ah, le tagli a pezzetti. Poi le cuoci in padella con l'aglio."
    - tutor: "Benissimo! E per quanto tempo?"
      goals: [steps]
    - learner: "Dieci minuti. Intanto l'acqua per la pasta la metti sul fuoco."
    - tutor: "Va bene, la metto subito."
      goals: [time]
    - learner: "Quando la pasta è pronta, bisogna mescolarli con le zucchine."
      errors: [object-pronoun]
    - tutor: "Mescolarli? Pensa alla pasta."
      prompt: {text: "mescolarli", tags: [object-pronoun]}
    - learner: "Sì, bisogna mescolarli bene."
      errors: [object-pronoun]
    - tutor: "Giusto, bisogna mescolarla bene. E poi?"
      recast: {text: "mescolarli", fix: "mescolarla", tags: [object-pronoun]}
      new: [{lemma: mescolare, gloss: to mix}]
    - learner: "Poi la serviamo con un po' di parmigiano sopra."
    - tutor: "Che fame! Andiamo a tavola."
      goals: [serve]

- scenario: lavanderia
  level: A2
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie! La lavatrice non funziona. Ho messo i vestiti ma non parte."
    - tutor: "Ah, capito. Hai messo le monete?"
      goals: [problem]
    - learner: "No, non lo sapevo. Come funziona?"
    - tutor: "Prima metti le monete e poi chiudi bene la porta."
      goals: [ask-how]
    - learner: "E il detersivo? Devo comprarla qui?"
      errors: [object-pronoun]
    - tutor: "Comprarla? Pensa: il detersivo è maschile."
      prompt: {text: "comprarla", tags: [object-pronoun]}
    - learner: "Ah, devo comprarlo qui?"
    - tutor: "Esatto! Lo vendono qui, vicino all'uscita."
    - learner: "Quanto costa un lavado?"
      errors: [word-choice]
    - tutor: "Un lavaggio costa quattro euro, e l'asciugatrice tre."
      recast: {text: "un lavado", fix: "un lavaggio", tags: [word-choice]}
      new: [{lemma: lavaggio, gloss: wash}]
      goals: [payment]
    - learner: "Va bene. Per fortuna mia madre gli ha messe nel mio zaino, le monete."
      errors: [object-pronoun]
    - tutor: "Gli ha messe? Pensa alle monete."
      prompt: {text: "gli ha messe", tags: [object-pronoun]}
    - learner: "Sì, mia madre gli ha messe nello zaino."
      errors: [object-pronoun]
    - tutor: "Che brava, tua madre le ha messe nello zaino! Allora sei pronta."
      recast: {text: "gli ha messe", fix: "le ha messe", tags: [object-pronoun]}
    - learner: "Sì! Grazie mille per l'aiuto."
    - tutor: "Di niente, ciao!"
      goals: [thank]

- scenario: ufficio-postale
  level: A2
  persona: en-m-retired
  history: [object-pronoun]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire questo pacco a mia figlia in Canada."
    - tutor: "Certo, il Canada è lontano!"
      goals: [send]
    - learner: "Quanto tempo ci vuole? Mia figlia lo aspetta per il suo compleanno."
    - tutor: "Con la posta normale, circa due settimane."
    - learner: "È troppo. Voglio mandarla con la posta veloce."
      errors: [object-pronoun]
    - tutor: "Mandarla? Di cosa parliamo, del pacco?"
      prompt: {text: "mandarla", tags: [object-pronoun]}
    - learner: "Sì, voglio mandarlo con la posta veloce."
    - tutor: "Va bene, allora arriva in cinque giorni."
      goals: [speed]
    - learner: "Perfetto. E la forma? La compilo adesso?"
      errors: [false-friend]
    - tutor: "Sì, il modulo lo scriva qui, con nome e indirizzo."
      recast: {text: "la forma", fix: "il modulo", tags: [false-friend]}
      goals: [form]
    - learner: "Ecco fatto. Poi telefono a mia figlia per dargli il numero del pacco."
      errors: [object-pronoun]
    - tutor: "Dargli? Ma parliamo di sua figlia..."
      prompt: {text: "dargli", tags: [object-pronoun]}
    - learner: "Sì, per dargli il numero."
      errors: [object-pronoun]
    - tutor: "Certo, può darle il numero: eccolo qui. Sono trentadue euro."
      recast: {text: "dargli il numero", fix: "darle il numero", tags: [object-pronoun]}
    - learner: "Ecco, pago con la carta. Grazie, arrivederci!"
    - tutor: "Grazie a Lei, arrivederci!"
      goals: [pay]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Possiamo fare una festa sabato sera, il 14. Sara è libera quel giorno."
    - tutor: "Sabato 14 va benissimo. Chi invitiamo?"
      goals: [date]
    - learner: "I suoi colleghi e le sue amiche della palestra. Gli chiamo io domani."
      errors: [object-pronoun]
    - tutor: "«Gli chiamo»? Chiamare qualcuno: che pronome serve qui?"
      prompt: {text: "Gli chiamo", tags: [object-pronoun]}
    - learner: "Li chiamo io domani, tranquillo."
    - tutor: "Perfetto, grazie! E da mangiare cosa prepariamo?"
      goals: [guests]
    - learner: "Io faccio le lasagne e tu porti il pastel. Sara lo adora al cioccolato."
      errors: [false-friend]
    - tutor: "Ottimo, la torta al cioccolato la compro io."
      recast: {text: "il pastel", fix: "la torta", tags: [false-friend]}
      goals: [food]
    - learner: "E il regalo? Vorrei regalarla un corso di cucina."
      errors: [object-pronoun]
    - tutor: "Regalarla? Attenzione: il corso lo regali a Sara."
      prompt: {text: "regalarla", tags: [object-pronoun]}
    - learner: "Sì, regalarla un corso, perché le piace cucinare."
      errors: [object-pronoun]
    - tutor: "Bellissima idea: regalarle un corso di cucina è perfetto per lei! Lo prenoto io domani."
      recast: {text: "regalarla un corso", fix: "regalarle un corso", tags: [object-pronoun]}
      goals: [gift]

- scenario: medico-base
  level: B1
  persona: en-f-professional
  history: [object-pronoun]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Da tre giorni ho una gola dolorosa e un po' di febbre."
      errors: [word-choice]
    - tutor: "Mi dispiace, con il mal di gola si sta proprio male. La febbre è alta?"
      recast: {text: "una gola dolorosa", fix: "mal di gola", tags: [word-choice]}
      goals: [symptoms, since-when]
    - learner: "No, trentotto la sera. Ieri ho chiamato mia madre e gli ho chiesto un consiglio."
      errors: [object-pronoun]
    - tutor: "«Gli ho chiesto»? Ma parliamo di sua madre..."
      prompt: {text: "gli ho chiesto", tags: [object-pronoun]}
    - learner: "Ah, le ho chiesto un consiglio. Mi ha detto di bere molto tè caldo."
    - tutor: "Ha fatto bene. Prende qualche medicina di solito? Ha allergie?"
    - learner: "No, nessuna allergia. Prendo solo le vitamine, ma le ho finite la settimana scorsa."
    - tutor: "Va bene. Allora le prescrivo uno sciroppo per la gola."
      goals: [history]
      new: [{lemma: prescrivere, gloss: to prescribe}, {lemma: sciroppo, gloss: syrup}]
    - learner: "Quante volte al giorno devo prenderla?"
      errors: [object-pronoun]
    - tutor: "«Prenderla»? Ma parliamo di uno sciroppo..."
      prompt: {text: "prenderla", tags: [object-pronoun]}
      new: [{lemma: sciroppo, gloss: syrup}]
    - learner: "Sì, quante volte devo prenderla?"
      errors: [object-pronoun]
    - tutor: "Deve prenderlo due volte al giorno, a pranzo e a cena, per una settimana."
      recast: {text: "prenderla", fix: "prenderlo", tags: [object-pronoun]}
    - learner: "Perfetto. E ai miei colleghi devo dirlo che sono malata?"
      errors: [object-pronoun]
    - tutor: "«Dirlo»? Pensi a chi riceve il messaggio: i colleghi."
      prompt: {text: "dirlo", tags: [object-pronoun]}
    - learner: "Sì, devo dirlo che sono malata?"
      errors: [object-pronoun]
    - tutor: "Sì, è meglio dirgli che è malata e restare a casa tre giorni."
      recast: {text: "dirlo che", fix: "dirgli che", tags: [object-pronoun]}
      goals: [instructions]

- scenario: restituire-prodotto
  level: B1
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato questi auricolari la settimana scorsa, ma uno non funziona."
    - tutor: "Mi dispiace. Avete provato a usarli con un altro telefono?"
      goals: [problem]
    - learner: "Sì, mio marito gli ha provati con due telefoni diversi."
      errors: [object-pronoun]
    - tutor: "«Gli ha provati»? Pensi a cosa ha provato: che pronome usiamo?"
      prompt: {text: "gli ha provati", tags: [object-pronoun]}
    - learner: "Sì, mio marito gli ha provati, ma niente."
      errors: [object-pronoun]
    - tutor: "Capisco: se suo marito li ha provati con due telefoni, allora sono proprio rotti. Ha lo scontrino?"
      recast: {text: "gli ha provati", fix: "li ha provati", tags: [object-pronoun]}
    - learner: "Sì, eccolo. L'ho conservato nel portafoglio."
    - tutor: "Perfetto, è tutto in regola. Preferisce un cambio o il rimborso?"
      goals: [proof]
    - learner: "Preferisco la devoluzione dei soldi, per favore. Posso averla sulla carta?"
      errors: [false-friend]
    - tutor: "Certo, il rimborso lo riceve sulla carta in tre o quattro giorni."
      recast: {text: "la devoluzione dei soldi", fix: "il rimborso", tags: [false-friend]}
      goals: [request]
    - learner: "Va bene, grazie. Gli auricolari li lascio a Lei?"
    - tutor: "Sì, li lasci pure qui. Buona giornata!"
      goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, sono il vicino del secondo piano. Mi chiamo Daniel."
    - tutor: "Ah, piacere, Daniel! Mi dica."
      goals: [greet]
    - learner: "Scusi il disturbo, ma la sera sento la musica e la lavatrice anche dopo mezzanotte."
    - tutor: "Oh, mi dispiace, non pensavo che si sentisse così tanto."
      goals: [problem]
    - learner: "Mia moglie lavora presto la mattina. Ieri sera gli ho promesso di venire a parlarle."
      errors: [object-pronoun]
    - tutor: "«Gli ho promesso»? Parliamo di sua moglie, giusto?"
      prompt: {text: "gli ho promesso", tags: [object-pronoun]}
    - learner: "Sì, le ho promesso di venire qui stasera."
    - tutor: "Ha fatto benissimo. Cosa possiamo fare, secondo lei?"
    - learner: "Potrebbe abbassare la musica dopo le dieci? E la lavatrice, potrebbe usarlo di giorno?"
      errors: [object-pronoun]
    - tutor: "Usarlo? Pensi alla lavatrice."
      prompt: {text: "usarlo", tags: [object-pronoun]}
      goals: [request]
    - learner: "Sì, potrebbe usarlo di giorno, per favore?"
      errors: [object-pronoun]
    - tutor: "Certo, posso usarla di giorno, nessun problema. E la musica la abbasso dopo le dieci."
      recast: {text: "usarlo", fix: "usarla", tags: [object-pronoun]}
    - learner: "Grazie mille, è molto gentile. Se ha bisogno di qualcosa, mi chiami."
    - tutor: "Grazie a Lei! Facciamo così: se c'è un problema, me lo dice subito."
      goals: [compromise]

- scenario: mercato-frutta
  level: A1
  persona: en-m-retired
  history: [object-pronoun]
  turns:
    - tutor: "Ciao! Cosa ti do oggi?"
    - learner: "Ciao! Quanto costano le mele?"
    - tutor: "Due euro al chilo. Sono buonissime!"
      goals: [ask-price]
    - learner: "Va bene, li prendo. Un chilo, per favore."
      errors: [object-pronoun]
    - tutor: "Li prendo? Pensa: le mele..."
      prompt: {text: "li prendo", tags: [object-pronoun]}
    - learner: "Le prendo, un chilo."
    - tutor: "Bravo! Ecco le mele. Altro?"
      goals: [buy-quantity]
    - learner: "Hai le fragole?"
    - tutor: "Sì, oggi sono molto buone."
      goals: [ask-other]
    - learner: "Posso assaggiarla?"
      errors: [object-pronoun]
    - tutor: "Assaggiarla? Ma sono tante!"
      prompt: {text: "assaggiarla", tags: [object-pronoun]}
    - learner: "Sì, posso assaggiarla?"
      errors: [object-pronoun]
    - tutor: "Certo, puoi assaggiarle! Sono buone."
      recast: {text: "assaggiarla", fix: "assaggiarle", tags: [object-pronoun]}
      new: [{lemma: assaggiare, gloss: to taste}]
    - learner: "Buonissime! Mezzo chilo. Ecco cinque euro."
    - tutor: "Grazie! Ecco un euro di resto. Ciao!"
      goals: [pay]

# z-regress, file 04: B2 comparatives in arguments and interviews; A1-A2 noun plurals in shops and families.
- scenario: smartworking
  level: B2
  persona: en-m-heritage
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Da quando la mia azienda ha cambiato politica, vado in ufficio quattro giorni su cinque."
    - tutor: "Ah, quindi è cambiato parecchio! E come l'hai presa?"
      goals: [situation]
    - learner: "All'inizio male, ma devo ammettere che in ufficio sono più produttivo che a casa: ci sono meno distrazioni."
    - tutor: "Interessante, di solito si sente dire il contrario. Quindi vedi soprattutto vantaggi?"
      goals: [pros]
    - learner: "Non solo. Il viaggio è più lungo di quanto pensassi e spendo il doppio che prima per la benzina."
      errors: [comparative]
    - tutor: "«Il doppio che prima»? Con «il doppio», dopo serve un'altra parola."
      prompt: {text: "il doppio che prima", tags: [comparative]}
    - learner: "Sì, spendo il doppio che prima, quasi duecento euro al mese."
      errors: [comparative]
    - tutor: "Il doppio di prima, duecento euro al mese: è una bella cifra! Non hai pensato al treno?"
      recast: {text: "il doppio che prima", fix: "il doppio di prima", tags: [comparative]}
      goals: [cons]
    - learner: "Ci ho pensato, ma i treni dalla mia zona sono meno frequenti che gli autobus."
      errors: [comparative]
    - tutor: "«Meno frequenti che gli autobus»? Davanti a un nome, quale preposizione serve?"
      prompt: {text: "meno frequenti che gli autobus", tags: [comparative]}
    - learner: "Sono meno frequenti degli autobus. Alla fine preferirei un giorno in più a casa."
    - tutor: "Mi sembra una soluzione ragionevole. Hai già provato a chiederlo?"
      goals: [preference]
    - learner: "Non ancora, ma il mio capo è tanto rigido quanto la sua collega, quindi ho poche speranze."
    - tutor: "Mai dire mai: magari con i numeri giusti lo convinci!"

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-teacher
  history: [comparative]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io non sono d'accordo. Penso che una zona peatonale porti più clienti, non meno."
      errors: [word-choice]
    - tutor: "Davvero crede che una zona pedonale porti più clienti? I commercianti, però, dicono il contrario."
      recast: {text: "zona peatonale", fix: "zona pedonale", tags: [word-choice]}
      goals: [position]
    - learner: "In molte città europee il centro, dopo la chiusura, è diventato più vivace di prima."
    - tutor: "Può farmi un esempio preciso?"
    - learner: "A Pontevedra, in Spagna, i negozi del centro guadagnano più che quelli della periferia."
      errors: [comparative]
    - tutor: "«Più che quelli»? Davanti a un pronome serve un'altra parola."
      prompt: {text: "più che quelli", tags: [comparative]}
    - learner: "Guadagnano più di quelli della periferia, secondo i dati del comune."
    - tutor: "Ammettiamo pure che sia così. Ma chi abita lontano come arriva in centro?"
      goals: [argue]
    - learner: "Con i mezzi pubblici: un autobus elettrico è molto meno inquinante come mille macchine."
      errors: [comparative]
    - tutor: "«Meno inquinante come»? Riprovi: qui «come» non va bene."
      prompt: {text: "meno inquinante come", tags: [comparative]}
    - learner: "Sì, un autobus è meno inquinante come tante macchine."
      errors: [comparative]
    - tutor: "D'accordo, un autobus elettrico è meno inquinante di mille macchine, su questo non discuto. Ma gli anziani?"
      recast: {text: "meno inquinante come", fix: "meno inquinante di", tags: [comparative]}
      goals: [counter]
    - learner: "Ha ragione, per gli anziani servono soluzioni speciali, come navette gratuite. Su questo le do ragione."
    - tutor: "Vede che alla fine non siamo così lontani?"
      goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-f-student
  history: [comparative]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto «Il Gattopardo» e poi ho visto il film di Visconti."
    - tutor: "Bella coppia! Di cosa parla, in breve?"
    - learner: "Parla di un principe siciliano durante l'unità d'Italia, che vede finire il suo mondo."
    - tutor: "Esatto. E i personaggi, come li hai trovati?"
      goals: [summary]
    - learner: "Il principe è il più interessante; Tancredi, invece, è più furbo che intelligente."
    - tutor: "Bella definizione! E tra libro e film, quale ti è piaciuto di più?"
      goals: [characters]
    - learner: "Secondo me il film è più meglio del libro, soprattutto la scena del ballo."
      errors: [comparative]
    - tutor: "«Più meglio»? Ripeti la frase: qualcosa non torna."
      prompt: {text: "più meglio", tags: [comparative]}
    - learner: "Sì, il film è più meglio del libro, per me."
      errors: [comparative]
    - tutor: "Quindi per te il film è meglio del libro: in effetti la scena del ballo è famosissima. Perché ti ha colpito?"
      recast: {text: "è più meglio del libro", fix: "è meglio del libro", tags: [comparative]}
      goals: [opinion]
    - learner: "Perché le immagini sono così belle come i quadri. Lo consiglierei a tutti, anche a chi non ama i film lunghi."
    - tutor: "Allora lo mettiamo nella lista del prossimo mese!"
      goals: [recommend]

- scenario: affittare-appartamento
  level: B2
  persona: en-m-retired
  history: [comparative]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno! È più luminoso di quello che ho visto ieri. Quanto costa al mese?"
    - tutor: "Novecento euro al mese, più le spese."
      goals: [rent]
    - learner: "Mmm, è più caro che l'altro appartamento, ma è anche più spazioso."
      errors: [comparative]
    - tutor: "«Più caro che l'altro»? Davanti a un nome, quale parola usiamo?"
      prompt: {text: "più caro che l'altro", tags: [comparative]}
    - learner: "È più caro dell'altro, ma è anche più spazioso."
    - tutor: "Proprio così. Il contratto è di quattro anni più quattro, con due mesi di deposito."
      goals: [contract]
    - learner: "Le finestre sono nuove? D'inverno qui fa più freddo di quanto mi aspettassi."
    - tutor: "Le abbiamo cambiate l'anno scorso, e anche il riscaldamento è nuovo."
      goals: [condition]
    - learner: "E il quartiere? Mi sembra tanto tranquillo che quello dove abito adesso."
      errors: [comparative]
    - tutor: "«Tanto tranquillo che»? Dopo «tanto» ci vuole un'altra parola."
      prompt: {text: "tanto tranquillo che", tags: [comparative]}
    - learner: "Sì, tanto tranquillo che il mio."
      errors: [comparative]
    - tutor: "È tanto tranquillo quanto il suo, glielo assicuro, e c'è un mercato a due passi."
      recast: {text: "tanto tranquillo che", fix: "tanto tranquillo quanto", tags: [comparative]}
      goals: [neighbourhood]
    - learner: "Va bene, mi piace. Ci penso stasera e la chiamo domani mattina."
    - tutor: "Perfetto, aspetto la sua chiamata."
      goals: [decide]

- scenario: colloquio-lavoro
  level: B2
  persona: es-m-worker
  history: [comparative]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Javier, ho trentaquattro anni e lavoro nella logistica da dieci anni."
    - tutor: "Dieci anni sono tanti. Dove ha lavorato finora?"
      goals: [intro]
    - learner: "Prima lavoravo in un almacén a Valencia, poi sono passato a un'azienda più grande a Milano."
      errors: [word-choice]
    - tutor: "In un magazzino, quindi conosce bene il settore. E che differenze ha notato tra le due aziende?"
      recast: {text: "un almacén", fix: "un magazzino", tags: [word-choice]}
      goals: [experience]
    - learner: "Qui i ritmi sono più veloci che in Spagna, ma l'organizzazione è più migliore."
      errors: [comparative]
    - tutor: "«Più migliore»? Ci pensi un attimo: che cosa c'è di troppo?"
      prompt: {text: "più migliore", tags: [comparative]}
    - learner: "Ah, certo: l'organizzazione è migliore."
    - tutor: "Bene. Quali sono i suoi punti di forza?"
    - learner: "Sono una persona precisa e lavoro meglio in equipo che da solo."
      errors: [word-choice]
    - tutor: "Ottimo, qui lavorare in squadra è molto importante. E perché vuole lavorare proprio da noi?"
      recast: {text: "in equipo", fix: "in squadra", tags: [word-choice]}
      goals: [strengths]
    - learner: "Perché la vostra azienda cresce più rapidamente delle altre del settore."
    - tutor: "Ci fa piacere sentirlo. Ha domande per me?"
      goals: [why]
    - learner: "Sì: lo stipendio sarebbe tanto alto che quello attuale?"
      errors: [comparative]
    - tutor: "«Tanto alto che»? Ci ripensi: con «tanto», la parola dopo cambia."
      prompt: {text: "tanto alto che", tags: [comparative]}
    - learner: "Sarebbe tanto alto che il mio stipendio di adesso?"
      errors: [comparative]
    - tutor: "Sarebbe almeno tanto alto quanto quello attuale, sì. Ne parliamo meglio al secondo colloquio."
      recast: {text: "tanto alto che", fix: "tanto alto quanto", tags: [comparative]}
      goals: [questions]

- scenario: mercato-frutta
  level: A1
  persona: en-f-student
  history: [noun-number]
  turns:
    - tutor: "Ciao! Cosa ti do oggi?"
    - learner: "Ciao! Vorrei due chili di pomodoro, per favore."
      errors: [noun-number]
    - tutor: "Di pomodoro? Sono uno o tanti?"
      prompt: {text: "di pomodoro", tags: [noun-number]}
    - learner: "Due chili di pomodori."
    - tutor: "Brava! Ecco qui."
      goals: [buy-quantity]
    - learner: "Quanto costano le arance?"
    - tutor: "Un euro e cinquanta al chilo."
      goals: [ask-price]
    - learner: "Allora prendo anche tre limone e un melone."
      errors: [noun-number]
    - tutor: "Tre limone? Uno, due, tre..."
      prompt: {text: "tre limone", tags: [noun-number]}
    - learner: "Sì, tre limone."
      errors: [noun-number]
    - tutor: "Ecco tre limoni. Altro?"
      recast: {text: "tre limone", fix: "tre limoni", tags: [noun-number]}
      new: [{lemma: limone, gloss: lemon}]
      goals: [ask-other]
    - learner: "No, basta così. Ecco dieci euro."
    - tutor: "Grazie! Ecco tre euro di resto. Ciao!"
      goals: [pay]

- scenario: panetteria
  level: A1
  persona: en-m-retired
  history: [noun-number]
  turns:
    - tutor: "Buongiorno! Mi dica."
    - learner: "Buongiorno! Vorrei quattro panino, per favore."
      errors: [noun-number]
    - tutor: "Quattro panino? Ascolti la fine della parola."
      prompt: {text: "quattro panino", tags: [noun-number]}
    - learner: "Quattro panini!"
    - tutor: "Bravo! Ecco i panini."
      goals: [greet, order-bread]
    - learner: "E anche due cornetti alla crema."
    - tutor: "Ecco i cornetti. Altro?"
    - learner: "Sì, sei biscotto al cioccolato."
      errors: [noun-number]
    - tutor: "Sei biscotto? Pensi: sono sei!"
      prompt: {text: "sei biscotto", tags: [noun-number]}
    - learner: "Sei biscotto, sì."
      errors: [noun-number]
    - tutor: "Ecco sei biscotti. Altro?"
      recast: {text: "sei biscotto", fix: "sei biscotti", tags: [noun-number]}
      new: [{lemma: biscotto, gloss: biscuit}]
      goals: [order-extra]
    - learner: "No, grazie. Ecco dieci euro."
    - tutor: "Grazie! Ecco due euro di resto. Buona giornata!"
      goals: [pay]

- scenario: famiglia
  level: A2
  persona: en-m-traveller
  history: [noun-number]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei genitori e i miei due fratello."
      errors: [noun-number]
    - tutor: "Due fratello? Ascolta bene la fine della parola."
      prompt: {text: "due fratello", tags: [noun-number]}
    - learner: "I miei due fratelli, Tom e Jack."
    - tutor: "Bravo! Quanti anni hanno?"
      goals: [who]
    - learner: "Tom ha venticinque anni e Jack ventidue. Jack ha già due figlio piccoli."
      errors: [noun-number]
    - tutor: "Due figlio? Quanti sono?"
      prompt: {text: "due figlio", tags: [noun-number]}
    - learner: "Sì, ha due figlio, un maschio e una femmina."
      errors: [noun-number]
    - tutor: "Ah, ha già due figli, un maschio e una femmina! Che bello."
      recast: {text: "due figlio", fix: "due figli", tags: [noun-number]}
      goals: [ages]
    - learner: "Mio padre è alto e simpatico, mia madre è corta e molto allegra."
      errors: [word-choice]
    - tutor: "Tua madre è bassa e allegra, come la mia! Si vede che state bene insieme."
      recast: {text: "corta", fix: "bassa", tags: [word-choice]}
      goals: [describe]
    - learner: "E tu, Marco? Hai fratelli?"
    - tutor: "Sì, una sorella più grande."
      goals: [ask]

# z-regress, file 06: C1, passive in complaints, debates, news, art and planning.
- scenario: reclamo-comune
  level: C1
  persona: es-f-teacher
  history: [passive]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Vorrei segnalare che il lampione davanti al mio portone è rotto da due mesi, e di notte la strada è completamente al buio."
    - tutor: "Capisco il disagio. Ha già fatto una segnalazione tramite il portale del Comune?"
      goals: [describe]
    - learner: "Sì, ben tre volte, ma ogni volta mi è stato risposto che la pratica era stata presa in carico, e poi più niente."
    - tutor: "Mi rendo conto. Purtroppo gli interventi vengono programmati in base alle priorità della zona."
    - learner: "Ma qui non si tratta di estetica: la settimana scorsa una signora anziana è caduta. La questione doveva essere risolto già da tempo."
      errors: [passive]
    - tutor: "Ha ragione sulla sicurezza. Però, «doveva essere risolto»? Pensi al soggetto: «la questione»."
      prompt: {text: "doveva essere risolto", tags: [passive]}
    - learner: "Sì, doveva essere risolta già da tempo."
    - tutor: "Esatto, e la sicurezza viene prima di tutto."
      goals: [insist]
    - learner: "Inoltre, se non sbaglio, per regolamento i guasti all'illuminazione pubblica vanno riparato entro trenta giorni."
      errors: [passive]
    - tutor: "In effetti c'è un regolamento in materia. Ma «vanno riparato»? Ricontrolli l'accordo con «i guasti»."
      prompt: {text: "vanno riparato", tags: [passive]}
    - learner: "Sì, vanno riparato entro un mese, appunto."
      errors: [passive]
    - tutor: "Esatto: i guasti vanno riparati entro trenta giorni, e lei ha tutto il diritto di pretenderlo."
      recast: {text: "vanno riparato", fix: "vanno riparati", tags: [passive]}
      goals: [rights]
    - learner: "La ringrazio. E nel caso in cui non si faccia niente entro fine mese?"
    - tutor: "Le prometto che la sua segnalazione verrà inoltrata oggi stesso all'ufficio tecnico, con priorità alta. Se entro fine mese non cambia nulla, torni pure da me."
      goals: [commitment]

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  history: [passive]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno! Sono a favore, anche se capisco le perplessità. Vivo a Venezia da quindici anni e vedo ogni giorno quanto la città venga consumata dal turismo."
    - tutor: "Un residente, allora! Ci faccia un esempio concreto di quello che vede."
      goals: [introduce]
    - learner: "Negli ultimi anni centinaia di negozi per i residenti sono stato sostituiti da negozi di souvenir."
      errors: [passive]
    - tutor: "Un dato significativo. Però «sono stato sostituiti»? Guardi bene il verbo: i negozi sono centinaia."
      prompt: {text: "sono stato sostituiti", tags: [passive]}
    - learner: "Sono stati sostituiti da negozi di souvenir, quasi tutti uguali."
    - tutor: "Eppure c'è chi dice che il ticket trasformi Venezia in un parco a tema. Cosa risponde?"
      goals: [example]
    - learner: "Che purtroppo lo è già diventata. Il ticket almeno permette di regolare i flussi, e con i soldi si potrebbe finanziare i servizi per chi ci abita."
      errors: [passive]
    - tutor: "«Si potrebbe finanziare i servizi»? Attenzione: con questo «si», il verbo guarda all'oggetto."
      prompt: {text: "si potrebbe finanziare i servizi", tags: [passive]}
    - learner: "Sì, con quei soldi si potrebbe finanziare i servizi."
      errors: [passive]
    - tutor: "Capisco: con quei soldi si potrebbero finanziare i servizi per i residenti. Ma basterebbe, secondo lei?"
      recast: {text: "si potrebbe finanziare i servizi", fix: "si potrebbero finanziare i servizi", tags: [passive]}
      goals: [rebut]
    - learner: "Da solo no. Proporrei anche di limitare gli affitti brevi, che hanno svuotato il centro storico."
    - tutor: "Una proposta chiara. Grazie per essere intervenuto!"
      goals: [proposal]

- scenario: arte-mostra
  level: C1
  persona: en-f-professional
  history: [passive]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi inquieta, a dire il vero. Quella figura in primo piano sembra fissarmi, ovunque io mi sposti."
    - tutor: "È proprio l'effetto che cercava il pittore. Cosa ti colpisce, oltre allo sguardo?"
      goals: [react]
    - learner: "Il contrasto tra la luce sul volto e il buio del fondo. Ho letto che la tela venne tagliato nell'Ottocento."
      errors: [passive]
    - tutor: "«Venne tagliato»? Di che cosa stiamo parlando, esattamente?"
      prompt: {text: "venne tagliato", tags: [passive]}
    - learner: "Sì, venne tagliato per farla entrare in una cornice."
      errors: [passive]
    - tutor: "Sì, la tela venne tagliata per farla entrare in una cornice più piccola: ne mancano quasi venti centimetri. Tu come la interpreti?"
      recast: {text: "venne tagliato", fix: "venne tagliata", tags: [passive]}
      goals: [describe]
    - learner: "Credo che il pittore volesse mostrare un uomo diviso, e che questa ambiguità sia stata voluto."
      errors: [passive]
    - tutor: "Lettura interessante. Ma «sia stata voluto»? Pensi a che cosa si riferisce il participio."
      prompt: {text: "sia stata voluto", tags: [passive]}
    - learner: "Che questa ambiguità sia stata voluta, intendo."
    - tutor: "Sono d'accordo con te. E se lo confronti con il ritratto della sala precedente?"
      goals: [interpret]
    - learner: "Lì tutto è più ordinato: si percepisce che il quadro è stato commissionato per celebrare, non per interrogare."
    - tutor: "Bella formula: celebrare contro interrogare. La rubo per la mia prossima visita guidata!"
      goals: [compare]

- scenario: assicurazione-sinistro
  level: C1
  persona: en-m-traveller
  history: [passive]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Sabato notte, mentre ero in vacanza, il mio appartamento è stato allagato a causa di un tubo rotto al piano di sopra."
    - tutor: "Che brutta sorpresa. Quando l'ha scoperto?"
      goals: [what]
    - learner: "Domenica mattina, quando sono rientrato. Il vicino aveva già chiamato l'idraulico, ma il parquet è venuto completamente rovinato."
      errors: [passive]
    - tutor: "Mi dispiace molto. Ma «è venuto rovinato»? Qui il verbo «venire» non funziona: provi con un altro verbo."
      prompt: {text: "è venuto completamente rovinato", tags: [passive]}
    - learner: "Il parquet è stato completamente rovinato, purtroppo."
    - tutor: "Capisco. La perdita è partita dall'appartamento del vicino, quindi in linea di principio risponde la sua assicurazione."
      goals: [responsibility]
    - learner: "Sì, il vicino è stato molto sensibile e ha ammesso subito che il tubo andava sostituito da anni."
      errors: [false-friend]
    - tutor: "Meno male che è stato ragionevole. Ci servono le foto dei danni, la relazione dell'idraulico e i preventivi per i lavori."
      recast: {text: "sensibile", fix: "ragionevole", tags: [false-friend]}
      goals: [documents]
    - learner: "Le foto le ho già. I preventivi verranno mandato entro la settimana da due ditte diverse."
      errors: [passive]
    - tutor: "«Verranno mandato»? Pensi all'accordo con «i preventivi»."
      prompt: {text: "verranno mandato", tags: [passive]}
    - learner: "Sì, verranno mandato entro venerdì."
      errors: [passive]
    - tutor: "Perfetto: quando i preventivi verranno mandati, li inoltri a questo indirizzo e apriamo la pratica. Il perito la contatterà entro dieci giorni."
      recast: {text: "verranno mandato", fix: "verranno mandati", tags: [passive]}
      goals: [next]

- scenario: burocrazia-residenza
  level: C1
  persona: es-f-erasmus
  history: [passive]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Mi hanno comunicato che la mia richiesta di residenza è stata respinta, ma non capisco il motivo."
    - tutor: "Vediamo... Sì, risulta che durante il controllo lei non sia stata trovata all'indirizzo indicato."
      goals: [request]
    - learner: "Strano: in quei giorni ero a Siviglia per un esame. Nessuno mi aveva avvisato che sarebbe venuto fatto un controllo."
      errors: [passive]
    - tutor: "Capisco. Però «sarebbe venuto fatto»? In un tempo composto «venire» non si può usare così: come lo direbbe?"
      prompt: {text: "sarebbe venuto fatto", tags: [passive]}
    - learner: "Nessuno mi aveva avvisato che sarebbe stato fatto un controllo."
    - tutor: "Esatto. Purtroppo i controlli non vengono annunciati, ma lei può presentare una nuova domanda."
      goals: [problem]
    - learner: "Va bene. Quali documenti si deve presentare questa volta?"
      errors: [passive]
    - tutor: "«Quali documenti si deve presentare»? Ci ripensi: i documenti sono più d'uno."
      prompt: {text: "si deve presentare", tags: [passive]}
    - learner: "Sì, quali documenti si deve presentare?"
      errors: [passive]
    - tutor: "Si devono presentare gli stessi documenti, più una dichiarazione dell'università che attesti la sua assenza in quei giorni."
      recast: {text: "si deve presentare", fix: "si devono presentare", tags: [passive]}
      goals: [documents]
    - learner: "Perfetto, la chiedo domani. Quanto tempo ci vorrà questa volta?"
    - tutor: "Una volta protocollata la domanda, il controllo verrà ripetuto entro quarantacinque giorni."
      goals: [next]

- scenario: notizie-attualita
  level: C1
  persona: en-f-student
  history: [passive]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Ho letto che il nuovo decreto è stato approvato ieri sera, e che eventualmente dovrà passare in Parlamento."
      errors: [false-friend]
    - tutor: "Esatto, e alla fine dovrà passare in Parlamento. Ma in sostanza cosa prevede?"
      recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
    - learner: "Secondo il decreto, gli affitti sotto i tre giorni saranno vietato nei centri storici delle grandi città."
      errors: [passive]
    - tutor: "«Saranno vietato»? Guarda bene l'accordo con «gli affitti»."
      prompt: {text: "saranno vietato", tags: [passive]}
    - learner: "Saranno vietati nei centri storici, giusto."
    - tutor: "Esatto. E tu, cosa ne pensi?"
      goals: [summarise]
    - learner: "Penso che sia una misura giusta, anche se arriva tardi: in alcuni quartieri gli abitanti sono già stati sostituiti dai turisti."
    - tutor: "Eppure c'è chi sostiene che i proprietari troveranno il modo di aggirarla. Tu ti fidi dei dati del governo?"
      goals: [opinion]
    - learner: "Non del tutto. Secondo un'inchiesta che ho letto, i numeri ufficiali venivano sottostimato da anni."
      errors: [passive]
    - tutor: "«Venivano sottostimato»? Di che cosa stai parlando, esattamente?"
      prompt: {text: "venivano sottostimato", tags: [passive]}
    - learner: "Sì, i numeri venivano sottostimato."
      errors: [passive]
    - tutor: "Ah, quindi i numeri venivano sottostimati da anni: questo cambia parecchio le cose. E secondo te quali saranno le conseguenze?"
      recast: {text: "venivano sottostimato", fix: "venivano sottostimati", tags: [passive]}
      goals: [sources]
    - learner: "Probabilmente gli affitti per gli studenti scenderanno un po', ma molti proprietari passeranno agli affitti di un mese."
    - tutor: "Vedremo. Di sicuro se ne parlerà ancora a lungo."
      goals: [consequences]

- scenario: presentazione-progetto
  level: C1
  persona: es-m-worker
  history: [passive]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Certo. Proponiamo un'app che permetta ai clienti di prenotare le riparazioni online. Oggi tutte le richieste vengono gestite per telefono."
    - tutor: "E quale sarebbe il vantaggio concreto?"
      goals: [pitch]
    - learner: "Secondo le nostre stime, il quaranta per cento delle chiamate verrebbe eliminato, e il personale potrebbe dedicarsi ad altre tareas."
      errors: [word-choice]
    - tutor: "Sulla carta funziona: meno telefonate e personale libero per altre mansioni. Ma l'anno scorso un progetto simile è stato abbandonato dopo sei mesi."
      recast: {text: "altre tareas", fix: "altre mansioni", tags: [word-choice]}
      goals: [benefits]
    - learner: "Lo so, ma quel progetto era stato sviluppato senza consultare i tecnici. Questa volta i tecnici sono stato coinvolto fin dall'inizio."
      errors: [passive]
    - tutor: "«Sono stato coinvolto»? I tecnici sono parecchi, mi pare."
      prompt: {text: "sono stato coinvolto", tags: [passive]}
    - learner: "Sì, sono stato coinvolto fin dall'inizio, tutti."
      errors: [passive]
    - tutor: "Se i tecnici sono stati coinvolti fin dall'inizio, è già una differenza importante. Quando sarebbe pronto un prototipo?"
      recast: {text: "sono stato coinvolto", fix: "sono stati coinvolti", tags: [passive]}
      goals: [objection]
    - learner: "Se ci date il via libera questa settimana, il prototipo potrebbe essere pronto a marzo."
    - tutor: "Mi mandi un piano dettagliato entro venerdì e ne riparliamo."
      goals: [next-steps]

- scenario: organizzare-matrimonio
  level: C1
  persona: en-f-professional
  history: [passive]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Ci piacerebbe una cosa semplice ma elegante, in campagna, con non più di ottanta invitati."
    - tutor: "Ottima scelta. Avete già un'idea di budget?"
      goals: [vision]
    - learner: "Circa venticinquemila euro, tutto compreso. I miei parenti ci hanno promesso un contributo."
      errors: [false-friend]
    - tutor: "Che bello che i genitori vi diano una mano! Con quella cifra si può fare molto, se si scelgono bene le priorità."
      recast: {text: "parenti", fix: "genitori", tags: [false-friend]}
      goals: [budget]
    - learner: "Abbiamo visto una villa in Toscana, ma ci hanno detto che va prenotato con un anno di anticipo."
      errors: [passive]
    - tutor: "«Va prenotato»? Attenzione all'accordo con «la villa»."
      prompt: {text: "va prenotato", tags: [passive]}
    - learner: "Va prenotata con un anno di anticipo, sì."
    - tutor: "È vero, le ville più richieste spariscono in fretta. E per il menù?"
    - learner: "Vorremmo che i piatti venissero preparati con prodotti locali, e che il vino si scegliesse insieme al sommelier."
    - tutor: "Si può fare senz'altro. Ci sono altre condizioni per voi irrinunciabili?"
      goals: [choices]
    - learner: "Sì: niente musica dopo mezzanotte, perché gli ospiti più anziani sono già stato avvisati che finiremo presto."
      errors: [passive]
    - tutor: "«Sono già stato avvisati»? Rifletta sul plurale."
      prompt: {text: "sono già stato avvisati", tags: [passive]}
    - learner: "Sì, sono già stato avvisati."
      errors: [passive]
    - tutor: "Benissimo: se gli ospiti sono già stati avvisati, organizziamo un finale tranquillo, magari con un buffet di dolci."
      recast: {text: "sono già stato avvisati", fix: "sono già stati avvisati", tags: [passive]}
      goals: [conditions]

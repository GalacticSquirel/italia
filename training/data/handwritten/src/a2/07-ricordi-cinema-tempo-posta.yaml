- scenario: ricordi-infanzia
  level: A2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo in una piccola città in Ohio, vicino a un fiume."
    - tutor: "Che bello, un fiume! E cosa facevi d'estate?"
      goals: [place]
    - learner: "Ogni estate sono andato a pescare con mio padre."
      errors: [tense-aspect]
    - tutor: "Ogni estate sono andato? Lo facevi sempre, no? Allora come lo dici?"
      prompt: {text: "ogni estate sono andato", tags: [tense-aspect]}
    - learner: "Ogni estate andavo a pescare con mio padre."
    - tutor: "Esatto! E a scuola com'eri? Eri bravo?"
      goals: [habits]
    - learner: "Ero bravo in matematica, ma non mi piaceva scrivere."
    - tutor: "Anche io odiavo scrivere! Ti ricordi un giorno speciale?"
      goals: [school]
    - learner: "Sì. Un giorno, quando avevo dieci anni, ho preso un pesce enorme!"
    - tutor: "Un pesce enorme! E tuo padre cosa ha detto?"
      goals: [event]
    - learner: "Era molto contento. Abbiamo fatto una foto e l'ho ancora."
    - tutor: "Che bel ricordo! Un giorno devi mostrarmi quella foto."

- scenario: ricordi-infanzia
  level: A2
  persona: es-f-erasmus
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo a Siviglia, in un quartiere con tanti bambini."
    - tutor: "Ah, Siviglia! E con chi giocavi?"
      goals: [place]
    - learner: "Giocavo sempre in strada con i miei cugini. Erano tutti più grandi di me."
    - tutor: "E andavi d'accordo con loro?"
    - learner: "Sì, ma a volte loro mi dicevano che ero troppo piccola. Io piangevo e andevo dalla nonna."
      errors: [imperfetto-form]
    - tutor: "Attenzione, andare è come abitare: io abitavo, io..."
      prompt: {text: "andevo", tags: [imperfetto-form]}
    - learner: "Andavo dalla nonna!"
    - tutor: "Brava! E la nonna cosa faceva?"
      goals: [habits]
    - learner: "Mi dava sempre un dolce. Poi un'estate la nonna mi ha portato al mare per la prima volta."
    - tutor: "Che bello! Ti è piaciuto il mare?"
      goals: [event]
    - learner: "Moltissimo! E la scuola invece non mi piaceva tanto."
    - tutor: "Davvero? Io invece la amavo, ma ero sempre in ritardo!"
      goals: [school]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-heritage
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Toronto, ma ogni estate venivo qui in Italia dai nonni."
    - tutor: "Ah, quindi conosci questo paese! Dove abitavano i tuoi nonni?"
      goals: [place]
    - learner: "In una casa vicino alla chiesa. La nonna cucinava sempre per tutti."
    - tutor: "Che bello! E tu cosa facevi tutto il giorno?"
    - learner: "Giocavo a calcio in piazza con i bambini del paese. Non parlavo bene italiano, ma giocavamo insieme."
    - tutor: "Il calcio è una lingua per tutti! E a Toronto andavi a una scuola italiana?"
      goals: [habits]
    - learner: "No, andavo a una scuola normale. Ma il sabato facevo un corso di italiano."
    - tutor: "Bravo! E ti ricordi un momento speciale qui?"
      goals: [school]
    - learner: "Sì, un'estate il nonno mi ha insegnato a guidare il suo trattore!"
    - tutor: "Il trattore del nonno, che bello! Quanti anni avevi?"
      new: [{lemma: trattore, gloss: tractor}]
      goals: [event]
    - learner: "Avevo dodici anni. La nonna era molto arrabbiata!"
    - tutor: "Posso immaginare! Andiamo a vedere la casa dei tuoi nonni?"

- scenario: serata-cinema
  level: A2
  persona: en-f-student
  history: [piacere]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Sì! Andiamo al cinema? C'è un film nuovo con Paola Cortellesi."
    - tutor: "Bella idea! È una commedia?"
      goals: [propose]
    - learner: "Sì, è una commedia. Io piaccio molto le commedie."
      errors: [piacere]
    - tutor: "Io piaccio le commedie? Attenzione, con piacere cambia tutto. Prova con mi."
      prompt: {text: "io piaccio molto le commedie", tags: [piacere]}
    - learner: "Mi piacciono molto le commedie!"
    - tutor: "Brava! Anche a me. I film di guerra invece sono più noiosi."
      goals: [genre]
    - learner: "Allora andiamo a vedere questa commedia. Ci sono spettacoli stasera?"
    - tutor: "Sì, c'è uno spettacolo alle otto e uno alle dieci. Quale preferisci?"
      goals: []
    - learner: "Alle otto, così dopo mangiamo una pizza."
    - tutor: "Perfetto! Compro io i biglietti. Ci vediamo davanti al cinema alle sette e mezza?"
      goals: [choose]
    - learner: "Sì, va benissimo. A stasera!"
    - tutor: "A stasera!"
      goals: [meet]

- scenario: serata-cinema
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Io finisco di lavorare alle nove. Andiamo al cinema dopo?"
    - tutor: "Sì, dai! Che tipo di film ti piace?"
      goals: [propose]
    - learner: "Mi piacciono i film d'azione. Le commedie mi piacciono meno."
    - tutor: "Io invece preferisco le commedie, sono più divertenti! Però stasera scegli tu."
      goals: [genre]
    - learner: "Grazie! C'è il nuovo film di James Bond alle dieci e mezza."
    - tutor: "Va bene, lo vediamo. Ma è un po' tardi, no?"
      goals: [choose]
    - learner: "Sì, ma domani non lavoro. Ci vediamo alle dieci e un quarto davanti al cinema?"
    - tutor: "Perfetto, a dopo! Prendo io i biglietti."
      goals: [meet]

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [article-use]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Di solito il sabato leggo molto. Mi piace musica classica e la ascolto quando leggo."
      errors: [article-use]
    - tutor: "Mi piace musica classica? Manca una piccola parola prima di musica."
      prompt: {text: "mi piace musica classica", tags: [article-use]}
    - learner: "Mi piace la musica classica!"
    - tutor: "Esatto! Anche a me piace molto. Vai spesso ai concerti?"
      new: [{lemma: concerto, gloss: concert}]
      goals: [hobby]
    - learner: "Sì, vado a un concerto una volta al mese. E la domenica faccio sport."
    - tutor: "Che sport fai?"
      goals: [frequency]
    - learner: "Corro nel parco con una mia amica. E tu, cosa fai nel weekend?"
    - tutor: "Io vado spesso al cinema. Sabato c'è un bel concerto in centro, vieni anche tu?"
      new: [{lemma: concerto, gloss: concert}]
      goals: [ask]
    - learner: "Sì, volentieri! A che ora?"
    - tutor: "Alle nove. Ci vediamo alle otto e mezza in piazza."
      goals: [propose]

- scenario: tempo-libero
  level: A2
  persona: en-m-traveller
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Nel weekend faccio sempre sport. Il sabato gioco a calcio con i colleghi."
    - tutor: "Ah, che bello! E la domenica?"
      goals: [hobby]
    - learner: "La domenica mattina dormo, e il pomeriggio vado spesso in montagna a camminare."
    - tutor: "Anche io adoro la montagna! Ci vai ogni settimana?"
      new: [{lemma: adorare, gloss: to love}]
      goals: [frequency]
    - learner: "Quasi ogni settimana, se il tempo è bello. Tu fai sport?"
    - tutor: "Sì, vado in piscina due volte alla settimana. Però non sono brava a correre!"
      new: [{lemma: piscina, gloss: swimming pool}]
      goals: [ask]
    - learner: "Allora domenica vieni in montagna con me?"
    - tutor: "Perché no? Va bene, ma andiamo piano!"
      goals: [propose]

- scenario: ufficio-postale
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Devo spedire questo pacco a Sydney, in Australia."
    - tutor: "Va bene. Vuole la spedizione normale o veloce?"
      new: [{lemma: spedizione, gloss: shipping}]
      goals: [send]
    - learner: "Quanti giorni ci vogliono con la normale?"
    - tutor: "Con la normale ci vogliono circa venti giorni. Con la veloce cinque giorni."
    - learner: "Allora la veloce, per favore. È un regalo per il compleanno di mia madre."
    - tutor: "Va bene. Deve compilare questo modulo con il suo indirizzo e quello di sua madre."
      new: [{lemma: compilare, gloss: to fill in}]
      goals: [speed]
    - learner: "Ecco fatto. Ho scritto l'indirizzo su il pacco."
      errors: [articulated-preposition]
    - tutor: "Su il pacco? Attenzione, queste due parole diventano una."
      prompt: {text: "su il pacco", tags: [articulated-preposition]}
    - learner: "Sul pacco! L'ho scritto sul pacco."
    - tutor: "Perfetto, grazie. Sono 45 euro."
      goals: [form]
    - learner: "Posso pagare con la carta?"
    - tutor: "Sì, certo. Ecco la ricevuta, il pacco parte domani."
      new: [{lemma: ricevuta, gloss: receipt}]
      goals: [pay]

- scenario: ufficio-postale
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire una lettera raccomandata a Roma."
    - tutor: "Certo. Ha già la busta con l'indirizzo?"
      goals: [send]
    - learner: "Sì, eccola. Quando arriva?"
    - tutor: "Arriva in due o tre giorni."
      goals: [speed]
    - learner: "Va bene. Devo scrivere qualcosa?"
    - tutor: "Sì, deve compilare questo modulo. Scriva qui il suo nome e il suo indirizzo."
      new: [{lemma: compilare, gloss: to fill in}]
    - learner: "Fatto. Quanto costa?"
      goals: []
    - tutor: "Sono 6 euro e 50. Vuole anche dei francobolli?"
      goals: [form]
    - learner: "No, grazie. Ecco 10 euro."
    - tutor: "Ecco il resto e la ricevuta. Buona giornata!"
      goals: [pay]

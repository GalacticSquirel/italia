- scenario: famiglia
  level: A2
  persona: en-f-professional
  history: [possessive]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Questa è la mia famiglia a Natale. Qui c'è la mia madre e qui mio padre."
      errors: [possessive]
    - tutor: "La mia madre? Attenzione, con madre c'è una parola in più."
      prompt: {text: "la mia madre", tags: [possessive]}
    - learner: "Ah, sì! Qui c'è mia madre."
    - tutor: "Esatto! E questo ragazzo alto chi è?"
      goals: [who]
    - learner: "È mio fratello Tom. È molto simpatico e gioca a calcio."
    - tutor: "Sembra molto in forma! Quanti anni ha?"
      goals: [describe]
    - learner: "Ha ventotto anni. Io sono la più grande, ho trentadue anni."
    - tutor: "Ah, quindi sei la sorella grande! Vedi spesso la tua famiglia?"
      goals: [ages]
    - learner: "No, purtroppo vivono in Australia. E tu, hai fratelli o sorelle?"
    - tutor: "Sì, ho una sorella più piccola. Si chiama Giulia e studia a Bologna."
      goals: [ask]

- scenario: famiglia
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei figli, Mateo e Lucas. Questa foto è dell'estate scorsa."
    - tutor: "Che carini! Sono gemelli?"
      goals: [who]
      new: [{lemma: gemello, gloss: twin}]
    - learner: "No, Mateo è più grande. Lui ha dieci anni e Lucas ha sette anni."
    - tutor: "Ah, dieci e sette. E come sono? Tranquilli?"
      goals: [ages]
    - learner: "Mateo è tranquillo, gli piace leggere. Lucas è molto vivace, non sta mai fermo!"
    - tutor: "Come tutti i bambini di sette anni! Vivono qui a Bologna con te?"
      goals: [describe]
    - learner: "No, vivono a Buenos Aires con la mamma. Li vedo in estate. E tu hai figli?"
    - tutor: "No, non ho figli, ma ho tre nipoti. Li vedo ogni domenica a pranzo!"
      new: [{lemma: nipote, gloss: nephew/niece}]
      goals: [ask]

- scenario: giorno-tipico
  level: A2
  persona: en-m-heritage
  history: [reflexive]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Di solito sveglio alle sei e mezza. È presto!"
      errors: [reflexive]
    - tutor: "Sveglio alle sei e mezza? Chi svegli? Manca una piccola parola."
      prompt: {text: "sveglio alle sei e mezza", tags: [reflexive]}
    - learner: "Mi sveglio alle sei e mezza!"
    - tutor: "Esatto! È davvero presto. E poi vai subito al lavoro?"
      goals: [wake]
    - learner: "Prima faccio colazione e mi faccio la doccia. Poi prendo il tram alle otto."
    - tutor: "E a che ora finisci di lavorare?"
      goals: [work]
    - learner: "Finisco alle cinque. La sera vado in palestra o cucino con mia ragazza."
      errors: [possessive]
    - tutor: "Con mia ragazza? Attenzione, manca una piccola parola prima di mia."
      prompt: {text: "con mia ragazza", tags: [possessive]}
    - learner: "Con la mia ragazza!"
    - tutor: "Perfetto! E cosa cucinate di solito?"
      goals: [evening]
    - learner: "Cuciniamo spesso la pasta. E tu, a che ora ti svegli?"
    - tutor: "Io mi sveglio tardi, alle nove! Lavoro da casa, che fortuna."
      goals: [ask]

- scenario: giorno-tipico
  level: A2
  persona: es-f-erasmus
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Mi alzo alle otto, ma la mattina non ho mai lezione. Studio in biblioteca."
    - tutor: "Ah, studi la mattina! E a lezione quando vai?"
      goals: [wake]
    - learner: "Il pomeriggio, dalle due alle sei. Poi torno a casa a piedi."
    - tutor: "E la sera cosa fai? Esci con gli amici?"
      goals: [work]
    - learner: "Sì, spesso usciamo a bere qualcosa. Ma ceniamo tardi, alle dieci, come in Spagna!"
    - tutor: "Alle dieci? Per noi è molto tardi! Io mangio alle otto."
      goals: [evening]
    - learner: "Lo so! E tu a che ora vai a dormire?"
    - tutor: "Tardi, verso le 23. Ma domani mi alzo presto, quindi stasera vado a letto prima."
      goals: [ask]

- scenario: lavanderia
  level: A2
  persona: en-m-retired
  history: [object-pronoun]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie. La lavatrice non funziona. Ho messo i vestiti ma non parte."
    - tutor: "Ah, capisco. Hai messo i gettoni?"
      goals: [problem]
    - learner: "Gettoni? No. Dove li compro?"
    - tutor: "Li compri da quella macchina vicino alla porta. Ci vogliono quattro gettoni."
      goals: [payment]
    - learner: "Va bene. E poi metto i gettoni qui?"
    - tutor: "Sì, poi scegli il programma. Per i colori di solito uso quello a 40 gradi."
      goals: [ask-how]
    - learner: "E il detersivo? Lo ho portato da casa."
      errors: [pronoun-position]
    - tutor: "Lo ho portato? Attenzione, lo davanti a ho cambia un po'."
      prompt: {text: "lo ho portato", tags: [pronoun-position]}
    - learner: "L'ho portato da casa!"
    - tutor: "Bravo! Allora mettilo qui sopra, e la lavatrice parte."
    - learner: "Ecco, funziona! Grazie mille per l'aiuto."
    - tutor: "Di niente! Ci vuole circa un'ora. Buona giornata!"
      goals: [thank]

- scenario: lavanderia
  level: A2
  persona: es-f-teacher
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie. È la prima volta che vengo qui e non so come funziona l'asciugatrice."
    - tutor: "Nessun problema, è facile. Hai le monete?"
      goals: [problem]
    - learner: "Ho solo una moneta da due euro. Basta?"
    - tutor: "Due euro sono venti minuti. Per le cose grandi ci vogliono 40 minuti."
      goals: [payment]
    - learner: "Allora metto quattro euro. Quale programma uso per le magliette?"
    - tutor: "Per le magliette usa il programma con la temperatura bassa."
      new: [{lemma: temperatura, gloss: temperature}]
      goals: [ask-how]
    - learner: "Perfetto, ho capito. Sei molto gentile, grazie!"
    - tutor: "Di niente! Se hai bisogno, sono qui."
      goals: [thank]

- scenario: medico-base
  level: A2
  persona: en-f-student
  history: [essere-avere]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Mi fa male la gola e sono la tosse."
      errors: [essere-avere]
    - tutor: "Sono la tosse? Con la tosse non usiamo essere."
      prompt: {text: "sono la tosse", tags: [essere-avere]}
    - learner: "Ho la tosse!"
    - tutor: "Esatto. Da quanti giorni ha mal di gola e tosse?"
      goals: [symptoms]
    - learner: "Da tre giorni. Ieri ho avuto anche un po' di febbre."
    - tutor: "Capisco. Ha preso qualche medicina?"
      goals: [since-when]
    - learner: "Sì, ho preso un'aspirina ieri sera. Ah, e sono allergica alla penicillina."
    - tutor: "Va bene, grazie. Allora le do un'altra medicina, senza penicillina."
      goals: [history]
    - learner: "Quante volte al giorno devo prenderla?"
    - tutor: "Due volte al giorno, dopo i pasti, per cinque giorni. Ecco la ricetta."
      new: [{lemma: pasto, gloss: meal}]
      goals: [instructions]
    - learner: "Grazie mille, dottore. Arrivederci."
    - tutor: "Arrivederci e buona guarigione!"
      new: [{lemma: guarigione, gloss: recovery}]

- scenario: medico-base
  level: A2
  persona: en-m-traveller
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno. Ho un forte dolore alla pancia e ho dormito male."
    - tutor: "Mi dispiace. Da quando ha questo dolore?"
      goals: [symptoms]
    - learner: "Da ieri sera. Ho mangiato frutti di mare in un ristorante sul porto."
    - tutor: "Ah, capisco. Ha anche la febbre?"
      goals: [since-when]
    - learner: "No, la febbre no. Ma ieri ho vomitato due volte."
    - tutor: "Va bene. È allergico a qualche medicina?"
    - learner: "No, non sono allergico a niente."
    - tutor: "Bene. Allora le do questa medicina. Deve prenderla tre volte al giorno."
      goals: [history]
    - learner: "D'accordo. Posso mangiare normalmente?"
    - tutor: "Per due giorni deve mangiare solo riso e bere molta acqua."
      new: [{lemma: riso, gloss: rice}]
      goals: [instructions]
    - learner: "Va bene, riso e acqua. Grazie, dottore!"
    - tutor: "Prego. Se non sta meglio, può tornare qui. Arrivederci!"

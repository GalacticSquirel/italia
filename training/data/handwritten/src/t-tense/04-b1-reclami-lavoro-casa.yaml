# B1, tense-aspect in complaints, work and home: single events vs background, habits,
# «da» + present, trapassato; correct turns use the same contrasts.
- scenario: restituire-prodotto
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato questo frullatore dieci giorni fa, ma non funziona più."
    - tutor: "Mi dispiace. Che cosa succede, esattamente?"
    - learner: "I primi giorni andava benissimo. Poi sabato mattina, mentre facevo un frullato, il motore si fermava e usciva del fumo."
      errors: [tense-aspect]
    - tutor: "Che spavento! Ma sabato mattina «il motore si fermava»? È successo una volta, all'improvviso."
      prompt: {text: "il motore si fermava", tags: [tense-aspect]}
    - learner: "Sì, il motore si fermava all'improvviso, e poi niente."
      errors: [tense-aspect]
    - tutor: "Capisco, il motore si è fermato all'improvviso e non è più partito. Ha lo scontrino?"
      recast: {text: "si fermava", fix: "si è fermato", tags: [tense-aspect]}
      goals: [problem]
    - learner: "Sì, eccolo. L'ho conservato perché il commesso mi aveva detto di tenerlo."
    - tutor: "Benissimo, è tutto in regola: il prodotto è ancora in garanzia."
      goals: [proof]
    - learner: "Preferirei avere i soldi indietro, non un altro frullatore. Due anni fa ho comprato lo stesso modello e anche quello si rompeva dopo un mese."
      errors: [tense-aspect]
    - tutor: "«Anche quello si rompeva dopo un mese»? È successo una volta, in un momento preciso."
      prompt: {text: "si rompeva dopo un mese", tags: [tense-aspect]}
    - learner: "Sì, anche quello si rompeva dopo un mese, e l'ho buttato."
      errors: [tense-aspect]
    - tutor: "Capisco: se anche quello si è rotto dopo un mese, è meglio cambiare prodotto. Possiamo farle il rimborso completo sulla carta."
      recast: {text: "si rompeva dopo un mese", fix: "si è rotto dopo un mese", tags: [tense-aspect]}
      goals: [request]
    - learner: "Perfetto, grazie. Quando l'ho pagato, ho usato la carta di mia moglie: è un problema?"
    - tutor: "Nessun problema: il rimborso torna sulla stessa carta. Firmi qui, per favore."
      goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, scusi il disturbo. Sono la vicina del piano di sotto."
    - tutor: "Piacere, signora. Mi dica pure."
      goals: [greet]
    - learner: "Ecco, ieri notte c'è musica fino alle due e non ho dormito."
      errors: [tense-aspect]
    - tutor: "Scusi, ieri notte «c'è musica»? Parla di ieri, di una situazione che non c'è più."
      prompt: {text: "c'è musica", tags: [tense-aspect]}
    - learner: "Ieri notte c'era musica fino alle due."
    - tutor: "Ah, sì, era il compleanno di mio figlio. Mi dispiace molto."
      goals: [problem]
    - learner: "Capisco, ma succede spesso. Anche sabato scorso, mentre ho cercato di dormire, qualcuno ha ballato sopra la mia testa."
      errors: [tense-aspect]
    - tutor: "Ha ragione, i ragazzi esagerano. Ma «mentre ho cercato di dormire»: era un'azione in corso. Come lo direbbe?"
      prompt: {text: "mentre ho cercato di dormire", tags: [tense-aspect]}
    - learner: "Mentre cercavo di dormire, qualcuno ballava sopra la mia testa."
    - tutor: "Esatto. Che cosa mi chiede, allora?"
    - learner: "Potreste abbassare la musica dopo le undici? Lavoro presto la mattina."
    - tutor: "Certo, è giusto. Dopo le undici niente musica alta, glielo prometto."
      goals: [request]
    - learner: "Grazie. E se fate una festa, mi potete avvisare prima? Così dormo da mia sorella."
    - tutor: "Ottima idea: la prossima volta le lascio un biglietto sotto la porta. Grazie della pazienza!"
      goals: [compromise]

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro da casa tre giorni alla settimana da due anni. Prima andavo in ufficio tutti i giorni."
    - tutor: "E come ti trovi? Meglio di prima?"
      goals: [situation]
    - learner: "Molto meglio. Quando sono andato in ufficio tutti i giorni, ho perso due ore nel traffico."
      errors: [tense-aspect]
    - tutor: "«Quando sono andato in ufficio tutti i giorni»: parli di quel periodo, di una cosa che si ripeteva. Come lo diresti?"
      prompt: {text: "Quando sono andato in ufficio", tags: [tense-aspect]}
    - learner: "Quando andavo in ufficio, perdevo due ore al giorno nel traffico."
    - tutor: "Due ore al giorno, pazzesco! E adesso cosa fai con quel tempo?"
      goals: [pros]
    - learner: "Vado a correre la mattina. Ma a volte mi sento solo: ieri non parlo con nessuno per tutto il giorno."
      errors: [tense-aspect]
    - tutor: "Ti capisco. Ma «ieri non parlo»? Ieri è già passato."
      prompt: {text: "ieri non parlo", tags: [tense-aspect]}
    - learner: "Ieri non ho parlato con nessuno per tutto il giorno."
    - tutor: "È il rischio più grande del lavoro da casa. E i colleghi li vedi ogni tanto?"
      goals: [cons]
    - learner: "Sì, il giovedì. La settimana scorsa pranzavamo insieme e mi divertivo un sacco."
      errors: [tense-aspect]
    - tutor: "Bello! Ma «la settimana scorsa pranzavamo»: parli di un pranzo solo, già finito."
      prompt: {text: "pranzavamo", tags: [tense-aspect]}
    - learner: "La settimana scorsa abbiamo pranzato insieme e mi sono divertito un sacco."
    - tutor: "Allora, se potessi scegliere, staresti sempre a casa?"
    - learner: "No, credo che tre giorni a casa e due in ufficio siano perfetti."
    - tutor: "Sono d'accordo, è la soluzione giusta. Anch'io farei così!"
      goals: [preference]

- scenario: salute-stile-vita
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Insomma... Mangio abbastanza bene, ma non faccio sport da quando è nata mia figlia, tre anni fa."
    - tutor: "Capisco, con una bambina piccola il tempo è poco. Prima facevi sport?"
      goals: [habits]
    - learner: "Sì, prima correvo tre volte alla settimana. Quando abitavo a Madrid, il mio quartiere è stato pieno di parchi."
      errors: [tense-aspect]
    - tutor: "Bello! Però «il mio quartiere è stato pieno di parchi»: stai dicendo com'era il posto, non raccontando un fatto."
      prompt: {text: "è stato pieno di parchi", tags: [tense-aspect]}
    - learner: "Sì, è stato pieno di parchi e di persone che correvano."
      errors: [tense-aspect]
    - tutor: "Ah, il tuo quartiere era pieno di parchi: perfetto per correre! E adesso qual è il tuo obiettivo?"
      recast: {text: "è stato pieno di parchi", fix: "era pieno di parchi", tags: [tense-aspect]}
    - learner: "Vorrei tornare in forma e perdere cinque chili prima dell'estate."
    - tutor: "Mi sembra un obiettivo possibile. Che cosa ti ha bloccato finora?"
      goals: [goal]
    - learner: "Il tempo, soprattutto. A gennaio mi iscrivevo in palestra, ma ci andavo solo due volte."
      errors: [tense-aspect]
    - tutor: "«A gennaio mi iscrivevo»? È successo una volta, a gennaio. E anche le due volte in palestra sono un numero preciso."
      prompt: {text: "mi iscrivevo", tags: [tense-aspect]}
    - learner: "A gennaio mi sono iscritta in palestra, ma ci sono andata solo due volte."
    - tutor: "Succede a tanti! Allora facciamo un piano semplice: tre allenamenti brevi a casa."
      goals: [obstacles]
    - learner: "Perfetto. Una mia collega ha fatto lo stesso l'anno scorso e perdeva otto chili in quattro mesi."
      errors: [tense-aspect]
    - tutor: "Brava la tua collega! Ma «perdeva otto chili in quattro mesi»: è un risultato finito, con un tempo preciso."
      prompt: {text: "perdeva otto chili", tags: [tense-aspect]}
    - learner: "Sì, perdeva otto chili e adesso sta benissimo."
      errors: [tense-aspect]
    - tutor: "Se la tua collega ha perso otto chili, puoi farcela anche tu! Iniziamo lunedì: venti minuti la mattina, prima che si svegli la bambina."
      recast: {text: "perdeva otto chili", fix: "ha perso otto chili", tags: [tense-aspect]}
      goals: [plan]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto. Sono in pensione da sei mesi e ho tanto tempo libero."
    - tutor: "Benvenuto! Come mai hai pensato al volontariato?"
    - learner: "Per mia moglie. Lei ha fatto la volontaria per anni: ogni sabato è andata alla mensa per i poveri."
      errors: [tense-aspect]
    - tutor: "Che bello! Ma «ogni sabato è andata»: era una cosa che si ripeteva ogni settimana, no?"
      prompt: {text: "è andata alla mensa", tags: [tense-aspect]}
    - learner: "Sì, ogni sabato è andata alla mensa, anche d'inverno."
      errors: [tense-aspect]
    - tutor: "Ah, tua moglie andava alla mensa ogni sabato, anche d'inverno! Allora conosci già un po' il nostro lavoro."
      recast: {text: "è andata alla mensa", fix: "andava alla mensa", tags: [tense-aspect]}
      goals: [motivation]
    - learner: "Un po', sì. So cucinare abbastanza bene e parlo inglese e francese. In banca mi occupavo dei clienti stranieri."
    - tutor: "Utilissimo! Abbiamo tante famiglie straniere a cui serve aiuto con i documenti."
      goals: [skills]
    - learner: "Sarebbe perfetto. Posso venire il martedì e il giovedì mattina."
    - tutor: "Benissimo. Allora, preferisci la cucina o l'ufficio per gli stranieri?"
      goals: [time]
    - learner: "L'ufficio, credo. Ieri ho letto il vostro sito e quel progetto mi piaceva subito."
      errors: [tense-aspect]
    - tutor: "«Mi piaceva subito»? Con «subito» parli di un momento preciso, ieri."
      prompt: {text: "mi piaceva subito", tags: [tense-aspect]}
    - learner: "Quel progetto mi è piaciuto subito!"
    - tutor: "Ottima scelta! Allora ti aspettiamo martedì alle nove per conoscere il gruppo."
      goals: [choose]

- scenario: consigli-viaggio
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì prossimo e resto quattro giorni. Non ci sono mai stata!"
    - tutor: "Quattro giorni sono perfetti! Dove dormi?"
      goals: [plans]
    - learner: "In un B&B nel centro storico. Una mia amica ci è stata a maggio e mi ha detto che era bellissimo."
    - tutor: "Allora sei in buone mani. Ti do un consiglio: mangia la pizza per strada!"
      goals: [advice]
    - learner: "D'accordo! E come arrivo dall'aeroporto al centro? L'anno scorso, quando sono arrivata a Roma, il mio telefono è stato scarico e mi sono persa."
      errors: [tense-aspect]
    - tutor: "Oh no! Ma il telefono «è stato scarico»? Qui parli dello stato del telefono quando sei arrivata."
      prompt: {text: "è stato scarico", tags: [tense-aspect]}
    - learner: "Sì, il telefono è stato scarico e non avevo la mappa."
      errors: [tense-aspect]
    - tutor: "Ah, il telefono era scarico e senza mappa... che incubo! A Napoli prendi l'autobus dell'aeroporto: in venti minuti sei in centro."
      recast: {text: "è stato scarico", fix: "era scarico", tags: [tense-aspect]}
      goals: [transport]
    - learner: "Perfetto. Ci sono zone pericolose? Una mia amica dice che, quando è stata a Napoli, qualcuno le rubava il portafoglio."
      errors: [tense-aspect]
    - tutor: "«Qualcuno le rubava il portafoglio»? È successo una volta, in un momento preciso."
      prompt: {text: "le rubava il portafoglio", tags: [tense-aspect]}
    - learner: "Sì, qualcuno le rubava il portafoglio sull'autobus."
      errors: [tense-aspect]
    - tutor: "Eh, se qualcuno le ha rubato il portafoglio, è stata sfortunata. Sugli autobus pieni tieni la borsa davanti a te, ma il centro è tranquillo."
      recast: {text: "le rubava", fix: "le ha rubato", tags: [tense-aspect]}
      goals: [warnings]
    - learner: "Va bene, starò attenta. Grazie mille, Valentina!"
    - tutor: "Figurati! E mandami una foto del mare."

- scenario: riunione-lavoro
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Lavoro al nuovo sito da tre settimane e la parte grafica è quasi finita."
    - tutor: "Bene, la grafica è la parte più lunga. E il resto del lavoro?"
      goals: [update]
    - learner: "Lì c'è un problema. Lunedì il server si blocca due volte e abbiamo perso dei dati."
      errors: [tense-aspect]
    - tutor: "Lunedì il server «si blocca»? Parli di lunedì scorso, di un fatto già finito."
      prompt: {text: "si blocca", tags: [tense-aspect]}
    - learner: "Sì, il server si bloccava due volte lunedì."
      errors: [tense-aspect]
    - tutor: "Se il server si è bloccato due volte, dobbiamo capire subito perché. Hai già un'idea?"
      recast: {text: "si bloccava", fix: "si è bloccato", tags: [tense-aspect]}
      goals: [problem]
    - learner: "Credo di sì. Quando sono arrivato nel progetto, il collega di prima aveva già installato un programma vecchio."
    - tutor: "Ah, ecco. Che cosa proponi, allora?"
    - learner: "Proporrei di cambiare server. Nella mia vecchia azienda abbiamo avuto lo stesso problema e lo risolvevamo così."
      errors: [tense-aspect]
    - tutor: "«Lo risolvevamo»? Parli di un intervento preciso, fatto una volta."
      prompt: {text: "lo risolvevamo", tags: [tense-aspect]}
    - learner: "L'abbiamo risolto così, in due giorni."
    - tutor: "Mi sembra una buona idea. Entro quando puoi farlo?"
      goals: [proposal]
    - learner: "Entro venerdì prossimo, se il tecnico è disponibile."
    - tutor: "Perfetto, allora venerdì prossimo. Ne parliamo di nuovo alla riunione di lunedì."
      goals: [deadline]

- scenario: affittare-appartamento
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno! È proprio luminoso. Quanto costa al mese?"
    - tutor: "Seicentocinquanta euro, spese di condominio comprese."
      goals: [rent]
    - learner: "Va bene. E il contratto quanto dura? Nel mio appartamento di prima avevo un contratto di un anno."
    - tutor: "Qui facciamo quattro anni più quattro, ma può andare via con sei mesi di preavviso."
      goals: [contract]
      new: [{lemma: preavviso, gloss: notice}]
    - learner: "Perfetto. La cucina sembra nuova. Nel vecchio appartamento, il riscaldamento si è rotto ogni inverno."
      errors: [tense-aspect]
    - tutor: "«Si è rotto ogni inverno»? Succedeva tutti gli anni: che tempo serve?"
      prompt: {text: "si è rotto ogni inverno", tags: [tense-aspect]}
    - learner: "Il riscaldamento si rompeva ogni inverno! Era terribile."
    - tutor: "Qui non succederà: la cucina e la caldaia sono nuove, le ho cambiate l'anno scorso."
      goals: [condition]
      new: [{lemma: caldaia, gloss: boiler}]
    - learner: "Bene. Ieri sono venuta qui per vedere la zona e quando sono arrivata, c'è stato un mercato in piazza."
      errors: [tense-aspect]
    - tutor: "«C'è stato un mercato»? Parla di quello che ha trovato al suo arrivo: una scena, non un evento."
      prompt: {text: "c'è stato un mercato", tags: [tense-aspect]}
    - learner: "Sì, c'è stato un mercato con frutta e fiori."
      errors: [tense-aspect]
    - tutor: "Ah, ieri era martedì: c'era un mercato perché lo fanno ogni settimana. Di giorno c'è sempre gente, ma la sera la zona è tranquilla."
      recast: {text: "c'è stato un mercato", fix: "c'era un mercato", tags: [tense-aspect]}
      goals: [neighbourhood]
    - learner: "Mi piace molto. Ci penso stasera e la chiamo domani mattina, va bene?"
    - tutor: "Benissimo, aspetto la sua telefonata. Arrivederci!"
      goals: [decide]

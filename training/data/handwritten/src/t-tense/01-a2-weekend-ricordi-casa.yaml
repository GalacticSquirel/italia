# A2, tense-aspect: passato prossimo vs imperfetto (descriptions, habits, interrupted actions),
# present used for a finished event, «da» + present for ongoing duration.
- scenario: weekend-scorso
  level: A2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Bene, grazie! Sabato sono andata al lago con mia sorella."
    - tutor: "Che bello! Quale lago?"
      goals: [where]
    - learner: "Il Lago di Como. Quando siamo arrivate, è piovuto, ma dopo un'ora è uscito il sole."
      errors: [tense-aspect]
    - tutor: "«È piovuto» quando siete arrivate? Parli della situazione in quel momento: che forma del verbo ci vuole?"
      prompt: {text: "è piovuto", tags: [tense-aspect]}
    - learner: "Sì, quando siamo arrivate è piovuto tanto."
      errors: [tense-aspect]
    - tutor: "Ah, pioveva tanto quando siete arrivate! Per fortuna poi è uscito il sole. Cosa avete fatto?"
      recast: {text: "è piovuto tanto", fix: "pioveva tanto", tags: [tense-aspect]}
    - learner: "Abbiamo fatto un giro in barca e abbiamo mangiato il pesce in un piccolo ristorante."
    - tutor: "Un giro in barca, che bello! Eravate solo voi due?"
      goals: [what]
    - learner: "No, c'era anche il ragazzo di mia sorella. Al ritorno ha guidato lui, perché io ero stanca."
    - tutor: "Che gentile! E siete tornati tardi?"
      goals: [with-who]
    - learner: "Sì, alle dieci. Quando siamo arrivati a Milano, è stato già buio."
      errors: [tense-aspect]
    - tutor: "«È stato già buio»? Parli di com'era la sera, non di un fatto. Prova di nuovo!"
      prompt: {text: "è stato già buio", tags: [tense-aspect]}
    - learner: "Sì... è già stato buio, e io ho dormito in macchina."
      errors: [tense-aspect]
    - tutor: "Ah, era già buio: una giornata lunga! Ma ti è piaciuto il lago?"
      recast: {text: "è già stato buio", fix: "era già buio", tags: [tense-aspect]}
    - learner: "Moltissimo! L'acqua era bellissima e la gente era molto gentile."
    - tutor: "Allora ci vado anch'io il mese prossimo. Grazie del consiglio!"
      goals: [opinion]

- scenario: vacanze-passate
  level: A2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao Elena! Sono stato in Sicilia, a Palermo, per dieci giorni."
    - tutor: "Palermo! Ci sono stata da ragazza. Avete preso l'aereo?"
      goals: [where]
    - learner: "Sì, da Barcellona. Ma il primo giorno ci sono problemi: l'albergo non ha la nostra prenotazione."
      errors: [tense-aspect]
    - tutor: "Il primo giorno «ci sono problemi»? Parli di un giorno già finito."
      prompt: {text: "ci sono problemi", tags: [tense-aspect]}
    - learner: "Il primo giorno ci sono stati problemi: l'albergo non ha la nostra prenotazione."
      errors: [tense-aspect]
    - tutor: "Che brutta sorpresa, l'albergo non aveva la prenotazione! E poi avete trovato un'altra camera?"
      recast: {text: "non ha", fix: "non aveva", tags: [tense-aspect]}
    - learner: "Sì, in un piccolo albergo vicino al mare. Faceva molto caldo. Una mattina, mentre abbiamo fatto il bagno, è arrivato un delfino!"
      errors: [tense-aspect]
    - tutor: "Un delfino, fantastico! Ma «mentre abbiamo fatto il bagno» era un'azione in corso. Come lo dici?"
      goals: [weather]
      prompt: {text: "mentre abbiamo fatto il bagno", tags: [tense-aspect]}
    - learner: "Mentre facevamo il bagno! Era piccolo e molto vicino a noi."
    - tutor: "Che fortuna! E cos'altro avete fatto?"
    - learner: "Abbiamo visitato Monreale e il mercato di Ballarò. Il mercato è stato pieno di colori e di profumi."
      errors: [tense-aspect]
    - tutor: "Che bello! Ma il mercato «è stato pieno di colori»? Parli del mercato in quel momento, non di un fatto."
      prompt: {text: "è stato pieno di colori", tags: [tense-aspect]}
    - learner: "Sì, il mercato è stato pieno di colori e di gente."
      errors: [tense-aspect]
    - tutor: "Eh sì, era pieno di colori e di gente: è sempre così! E qual è il ricordo più bello?"
      recast: {text: "è stato pieno di colori", fix: "era pieno di colori", tags: [tense-aspect]}
      goals: [activities]
    - learner: "Il delfino, sicuramente!"
    - tutor: "Ci credo! Un delfino non si dimentica. Mi mandi le foto?"
      goals: [best]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-heritage
  history: [tense-aspect, imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Boston, ma ogni estate andavo in Calabria dai nonni."
    - tutor: "In Calabria! E cosa facevi là con i nonni?"
      goals: [place]
    - learner: "Ogni mattina sono andato al mercato con il nonno e ho comprato il pane."
      errors: [tense-aspect]
    - tutor: "Ogni mattina «sono andato»? Era una cosa di tutti i giorni, che si ripeteva. Prova a dirlo di nuovo."
      prompt: {text: "sono andato", tags: [tense-aspect]}
    - learner: "Ogni mattina andavo al mercato con il nonno e compravo il pane."
    - tutor: "Bravo, che bel ricordo! E la nonna cosa faceva?"
      goals: [habits]
    - learner: "La nonna ha cucinato sempre per tutti. Faceva la pasta a mano."
      errors: [tense-aspect]
    - tutor: "«Ha cucinato sempre»? Anche questa è una cosa di tutti i giorni."
      prompt: {text: "ha cucinato sempre", tags: [tense-aspect]}
    - learner: "Sì, la nonna ha cucinato sempre per tutti."
      errors: [tense-aspect]
    - tutor: "Ah, la nonna cucinava sempre per tutti: che fortuna! E a scuola andavi in Italia?"
      recast: {text: "ha cucinato sempre", fix: "cucinava sempre", tags: [tense-aspect]}
    - learner: "No, a scuola andavo in America. Ma un'estate ho fatto un corso di italiano a Cosenza."
    - tutor: "Un corso a Cosenza! Com'è stato?"
      goals: [school]
    - learner: "Bellissimo. Un giorno, mentre giocavamo a calcio, è arrivato mio zio con un cane piccolo: era per me!"
    - tutor: "Che sorpresa! E come l'hai chiamato?"
      goals: [event]

- scenario: medico-base
  level: A2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Ho mal di gola e un po' di febbre."
    - tutor: "Mi dispiace. Da quanto tempo ha la febbre?"
      goals: [symptoms]
    - learner: "Ho avuto la febbre da due giorni."
      errors: [tense-aspect]
    - tutor: "«Ho avuto» da due giorni? Ma la febbre c'è ancora oggi, giusto? Allora che tempo serve?"
      prompt: {text: "Ho avuto", tags: [tense-aspect]}
    - learner: "Sì, c'è ancora. Ho la febbre da due giorni."
    - tutor: "Bene, è chiaro. Di solito sta bene? Ha altri problemi di salute?"
      goals: [since-when]
    - learner: "No, sto bene di solito. Ma da bambino avevo spesso mal di gola."
    - tutor: "Capisco. In questi giorni ha mangiato qualcosa di molto freddo?"
      goals: [history]
    - learner: "Sì, ieri mia moglie compra un gelato enorme e lo mangiamo insieme."
      errors: [tense-aspect]
    - tutor: "Ieri sua moglie «compra»? Ieri è già passato."
      prompt: {text: "compra", tags: [tense-aspect]}
    - learner: "Ieri mia moglie comprava un gelato enorme e lo abbiamo mangiato insieme."
      errors: [tense-aspect]
    - tutor: "Ah, sua moglie ha comprato un gelato! Buono, ma freddo per la gola. Le do uno sciroppo, tre volte al giorno."
      recast: {text: "comprava", fix: "ha comprato", tags: [tense-aspect]}
      goals: [instructions]
      new: [{lemma: sciroppo, gloss: syrup}]
    - learner: "Va bene. Posso viaggiare domani?"
    - tutor: "Se non ha più la febbre, sì. Beva molta acqua e dorma molto!"

- scenario: cercare-lavoro-a2
  level: A2
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Sì, buongiorno! Cercate una cameriera? Sono interessata."
    - tutor: "Sì, cerchiamo una persona per l'estate. Ha già lavorato in un bar?"
      goals: [ask]
    - learner: "Sì, in Spagna ho lavorato in una caffetteria per due anni. Quando ho cominciato, la caffetteria è stata nuova."
      errors: [tense-aspect]
    - tutor: "«È stata nuova»? Qui parli della situazione del locale, non di un fatto."
      prompt: {text: "è stata nuova", tags: [tense-aspect]}
    - learner: "Sì, all'inizio la caffetteria è stata nuova e piccola."
      errors: [tense-aspect]
    - tutor: "Ah, era nuova e piccola, capisco. E perché ha lasciato quel lavoro?"
      recast: {text: "è stata nuova", fix: "era nuova", tags: [tense-aspect]}
      goals: [experience]
    - learner: "Perché l'anno scorso vengo in Italia per studiare."
      errors: [tense-aspect]
    - tutor: "«L'anno scorso vengo»? È successo l'anno scorso, è un fatto finito."
      prompt: {text: "l'anno scorso vengo", tags: [tense-aspect]}
    - learner: "L'anno scorso sono venuta in Italia per studiare."
    - tutor: "Ecco. E adesso quando può lavorare? Anche il fine settimana?"
    - learner: "Sì, sono libera il sabato e la domenica. Il lunedì ho lezione all'università."
    - tutor: "Perfetto, a noi serve proprio il fine settimana. Mi lascia il suo numero?"
      goals: [availability]
    - learner: "Certo! È 347 2215890. Può chiamarmi quando vuole."
    - tutor: "Grazie, la chiamo domani mattina. A presto!"
      goals: [contact]

- scenario: famiglia
  level: A2
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei nonni, il giorno del loro matrimonio. È una foto molto vecchia, del 1965."
    - tutor: "Che belli! Dove si sono sposati?"
      goals: [who]
    - learner: "In una piccola chiesa in Toscana. La nonna ha avuto solo diciannove anni."
      errors: [tense-aspect]
    - tutor: "«Ha avuto diciannove anni»? Parli della sua età quel giorno, non di un fatto."
      prompt: {text: "ha avuto", tags: [tense-aspect]}
    - learner: "Sì, la nonna ha avuto diciannove anni, e il nonno ventitré."
      errors: [tense-aspect]
    - tutor: "Ah, la nonna aveva solo diciannove anni! Giovanissimi. E il nonno com'era?"
      recast: {text: "ha avuto", fix: "aveva", tags: [tense-aspect]}
      goals: [ages]
    - learner: "Era molto allegro. Quando ero piccola, mi ha cantato sempre una canzone napoletana."
      errors: [tense-aspect]
    - tutor: "«Mi ha cantato sempre»? Succedeva tante volte quando eri piccola, vero?"
      prompt: {text: "mi ha cantato sempre", tags: [tense-aspect]}
    - learner: "Mi cantava sempre una canzone napoletana! Il nonno è morto nel 2010."
    - tutor: "Mi dispiace. E la nonna dove abita adesso?"
      goals: [describe]
    - learner: "Abita ancora in Toscana, e la vado a trovare ogni estate. E i tuoi nonni dove abitano?"
    - tutor: "I miei nonni abitano a Bari, vicino a noi. Li vedo ogni domenica a pranzo."
      goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Di solito vado a ballare la salsa. Ballo da cinque anni."
    - tutor: "La salsa! Dove vai a ballare?"
      goals: [hobby]
    - learner: "In una scuola vicino a casa mia. Vado ogni sabato sera, e a volte anche il mercoledì."
    - tutor: "Ogni sabato, brava! Ma come hai cominciato?"
      goals: [frequency]
    - learner: "Cinque anni fa una collega mi porta a una festa latina."
      errors: [tense-aspect]
    - tutor: "«Cinque anni fa» e «mi porta»? Il verbo deve dire che è successo allora."
      prompt: {text: "mi porta", tags: [tense-aspect]}
    - learner: "Una collega mi ha portato a una festa latina, e la salsa mi è piaciuta subito!"
    - tutor: "Che bella storia! E prima facevi altri sport?"
    - learner: "Da ragazza ho giocato a pallavolo tutti i giorni. E tu cosa fai il fine settimana?"
      errors: [tense-aspect]
    - tutor: "Te lo dico subito! Ma «ho giocato» tutti i giorni? Era una cosa normale in quegli anni, no?"
      prompt: {text: "ho giocato", tags: [tense-aspect]}
    - learner: "Ah, giusto: da ragazza giocavo a pallavolo tutti i giorni."
    - tutor: "Perfetto! Io il fine settimana leggo e vado in bicicletta. Però voglio provare la salsa!"
      new: [{lemma: salsa, gloss: salsa (dance)}]
      goals: [ask]
    - learner: "Allora vieni con me sabato! Il corso per principianti comincia alle otto."
    - tutor: "Sì, vengo! Ci vediamo sabato alle otto davanti alla scuola."
      goals: [propose]

- scenario: casa-mia
  level: A2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    - learner: "Adesso abito in un appartamento in centro, al terzo piano. Prima avevamo una casa grande in campagna."
    - tutor: "Una casa in campagna! Perché avete cambiato?"
      goals: [type]
    - learner: "Perché i figli sono andati via e la casa è stata troppo grande per noi due."
      errors: [tense-aspect]
    - tutor: "«È stata troppo grande»? Parli della casa in quegli anni, non di un fatto."
      prompt: {text: "è stata troppo grande", tags: [tense-aspect]}
    - learner: "Sì, la casa è stata troppo grande e c'era molto lavoro in giardino."
      errors: [tense-aspect]
    - tutor: "Capisco, era troppo grande, e il giardino dà tanto lavoro. E l'appartamento quante stanze ha?"
      recast: {text: "è stata troppo grande", fix: "era troppo grande", tags: [tense-aspect]}
    - learner: "Ci sono due camere, un salotto e una cucina piccola, ma c'è un bel balcone."
    - tutor: "Un balcone in centro, che bello! Qual è il tuo posto preferito?"
      goals: [rooms]
    - learner: "Il balcone! Ieri sera ceno lì con mia moglie e guardiamo il tramonto."
      errors: [tense-aspect]
    - tutor: "«Ieri sera ceno»? Ieri sera è già passata."
      prompt: {text: "Ieri sera ceno", tags: [tense-aspect]}
    - learner: "Ieri sera ho cenato lì con mia moglie e abbiamo guardato il tramonto. E la tua casa com'è?"
    - tutor: "Che bello! La mia casa è piccola, ma ha un balcone pieno di fiori."
      goals: [favourite, ask]

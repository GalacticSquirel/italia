# B1-B2, tense-aspect: habits and bounded periods («per un'ora»), interrupted actions,
# trapassato, future in the past; correct turns use the same contrasts.
- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Anche da noi! In Inghilterra il 25 si mangia il tacchino a pranzo, con le patate al forno."
    - tutor: "Il tacchino, come in America! E la sera prima cosa fate?"
      goals: [compare]
    - learner: "Niente di speciale. Da piccola, la sera prima ho lasciato sempre un bicchiere di latte per Babbo Natale."
      errors: [tense-aspect]
    - tutor: "Che dolce! Ma «da piccola ho lasciato sempre»: era una cosa di ogni anno, no?"
      prompt: {text: "ho lasciato sempre", tags: [tense-aspect]}
    - learner: "Lasciavo sempre un bicchiere di latte, e anche una carota per le renne!"
    - tutor: "Le renne, certo! E la mattina il bicchiere era vuoto?"
    - learner: "Sì! Ma una volta ho visto mio padre in cucina, alle due di notte: beveva il latte e mangiava i biscotti."
    - tutor: "Ah ah, il segreto di Babbo Natale! Quanti anni avevi?"
      goals: [past]
    - learner: "Sette. Quando l'ho scoperto ero triste, e mio fratello rideva di me per un'ora."
      errors: [tense-aspect]
    - tutor: "Povera! Ma «rideva per un'ora»: con «per un'ora» l'azione ha un inizio e una fine precisi."
      prompt: {text: "rideva", tags: [tense-aspect]}
    - learner: "Sì, mio fratello rideva per un'ora intera."
      errors: [tense-aspect]
    - tutor: "Che cattivo, ha riso di te per un'ora intera! E voi a Capodanno cosa fate?"
      recast: {text: "rideva", fix: "ha riso", tags: [tense-aspect]}
    - learner: "Niente di tradizionale. L'anno scorso ero a Roma, e a mezzanotte tutti lanciavano i fuochi d'artificio per strada."
    - tutor: "Eh sì, a Capodanno qui c'è un po' di rumore! Noi mangiamo le lenticchie, che portano soldi. Vuoi venire da noi quest'anno?"
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Volentieri! Porto io il dolce?"
    - tutor: "Perfetto, allora ti aspettiamo il 31 alle nove, con il dolce!"
      goals: [plan]

- scenario: dal-meccanico
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Stamattina non partiva. Ho provato tre volte, poi finalmente è partita."
    - tutor: "Capisco. Con il freddo può essere la batteria. È vecchia?"
      goals: [describe]
      new: [{lemma: batteria, gloss: battery}]
    - learner: "No, la batteria è nuova: l'ho cambiata a ottobre."
    - tutor: "Allora sentiamo il motore. Quando è cominciato il problema?"
    - learner: "Domenica. Siamo andati al mare e mentre abbiamo tornato, la luce della batteria si è accesa."
      errors: [auxiliary-choice, tense-aspect]
    - tutor: "«Mentre abbiamo tornato»: era un viaggio in corso quando si è accesa la luce. Come lo direbbe?"
      prompt: {text: "mentre abbiamo tornato", tags: [tense-aspect]}
    - learner: "Mentre tornavamo, la luce della batteria si è accesa."
    - tutor: "Ecco, questo è importante. Allora può essere l'alternatore."
      goals: [when]
      new: [{lemma: alternatore, gloss: alternator}]
    - learner: "E quanto costa? L'anno scorso mio cugino cambiava l'alternatore e spendeva quattrocento euro."
      errors: [tense-aspect]
    - tutor: "L'anno scorso suo cugino «cambiava»? Parla di un lavoro fatto una volta sola."
      prompt: {text: "cambiava l'alternatore", tags: [tense-aspect]}
    - learner: "Sì, mio cugino cambiava l'alternatore e ha speso quattrocento euro."
      errors: [tense-aspect]
    - tutor: "Se suo cugino ha cambiato l'alternatore, sa che non è economico. Qui siamo sui trecentocinquanta euro."
      recast: {text: "cambiava l'alternatore", fix: "ha cambiato l'alternatore", tags: [tense-aspect]}
      goals: [cost]
    - learner: "Va bene. Quando posso tornare a prenderla?"
    - tutor: "Venerdì mattina sarà pronta. Le mando un messaggio appena finisco."
      goals: [time]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono Lucía, sono messicana e sono maestra di scuola primaria. Vivo a Bologna da due anni."
    - tutor: "Piacere. E come mai a Bologna?"
      goals: [intro]
    - learner: "Mio marito ha trovato lavoro qui. In Messico ho insegnato per otto anni in una scuola bilingue."
    - tutor: "Otto anni, ottima esperienza. Qual è stato il momento più difficile?"
    - learner: "Il primo anno. Avevo una classe di trenta bambini e un giorno, mentre ho spiegato la lezione, un bambino è svenuto."
      errors: [tense-aspect]
    - tutor: "Che paura! Ma «mentre ho spiegato la lezione»: era un'azione in corso quando il bambino è svenuto."
      prompt: {text: "mentre ho spiegato", tags: [tense-aspect]}
    - learner: "Mentre spiegavo la lezione, un bambino è svenuto."
    - tutor: "E come ha gestito la situazione?"
      goals: [experience]
    - learner: "Ho chiamato subito la direttrice, che è stata nella classe vicina, e ho tenuto calmi gli altri bambini."
      errors: [tense-aspect]
    - tutor: "La direttrice «è stata nella classe vicina»? Qui dice dove si trovava in quel momento, non racconta un fatto."
      prompt: {text: "è stata nella classe vicina", tags: [tense-aspect]}
    - learner: "Sì, la direttrice è stata nella classe vicina ed è venuta subito."
      errors: [tense-aspect]
    - tutor: "Per fortuna la direttrice era nella classe vicina! E lei è rimasta calma: per noi è una qualità molto importante."
      recast: {text: "è stata nella classe vicina", fix: "era nella classe vicina", tags: [tense-aspect]}
      goals: [strengths]
    - learner: "Grazie. Vorrei lavorare qui perché è una scuola bilingue come la mia, e il vostro progetto mi è piaciuto subito. Quando comincerebbe il lavoro?"
    - tutor: "A settembre, quando ricominciano le lezioni. Le faremo sapere entro due settimane."
      goals: [why, questions]

- scenario: film-libro
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Questo mese non ho letto un libro, ma ho visto un film: «Perfetti sconosciuti». Va bene lo stesso?"
    - tutor: "Certo, parliamo anche di film! Di che cosa parla?"
    - learner: "Sette amici cenano insieme e decidono di mettere i telefoni sul tavolo. Ogni messaggio che arriva lo leggono tutti."
    - tutor: "Un'idea pericolosa! E cosa succede?"
      goals: [summary]
    - learner: "Escono tanti segreti. Il personaggio che mi è piaciuto di più è Peppe: è timido e nasconde una cosa importante."
    - tutor: "Anche a me piace Peppe, è il più umano. E la fine ti è piaciuta?"
      goals: [characters]
    - learner: "Sì e no. L'ho visto con mia moglie e mentre l'abbiamo guardato, lei mi ha preso il telefono per scherzo!"
      errors: [tense-aspect]
    - tutor: "Ah ah! Ma «mentre l'abbiamo guardato»: era un'azione in corso quando tua moglie ha preso il telefono."
      prompt: {text: "mentre l'abbiamo guardato", tags: [tense-aspect]}
    - learner: "Mentre lo guardavamo, lei mi ha preso il telefono!"
    - tutor: "Un film che fa danni! Allora lo consiglieresti al gruppo?"
      goals: [opinion]
    - learner: "Sì. Quando l'ho visto, il film ha già vinto tanti premi, ma non sapevo niente della storia."
      errors: [tense-aspect]
    - tutor: "I premi sono arrivati prima del giorno in cui l'hai visto: che tempo usiamo per un passato ancora più lontano?"
      prompt: {text: "ha già vinto", tags: [tense-aspect]}
    - learner: "Sì, il film ha già vinto tanti premi in Italia."
      errors: [tense-aspect]
    - tutor: "Infatti, quando è arrivato nelle sale aveva già vinto tanti premi. Lo guardiamo insieme alla prossima serata?"
      recast: {text: "ha già vinto", fix: "aveva già vinto", tags: [tense-aspect]}
    - learner: "Ottima idea! Porto io i popcorn."
    - tutor: "Perfetto, e i telefoni restano sul tavolo!"
      goals: [recommend]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri pomeriggio ho avuto un incidente in via Garibaldi. Sono stata ferma al semaforo rosso quando una macchina mi ha tamponata."
      errors: [tense-aspect]
    - tutor: "Mi dispiace. Ma «sono stata ferma al semaforo»: è la situazione in cui si trovava quando l'hanno colpita, non un fatto concluso."
      prompt: {text: "Sono stata ferma", tags: [tense-aspect]}
    - learner: "Ero ferma al semaforo rosso quando una macchina mi ha tamponata."
    - tutor: "Chiaro. Lei si è fatta male?"
      goals: [what]
    - learner: "Io sto bene, per fortuna. Quando sono scesa dalla macchina, l'altro conducente ha già chiamato la polizia."
      errors: [tense-aspect]
    - tutor: "Bene. Però la telefonata è avvenuta prima che lei scendesse: quale tempo usiamo per un fatto avvenuto prima di un altro, nel passato?"
      prompt: {text: "ha già chiamato", tags: [tense-aspect]}
    - learner: "Sì, ha già chiamato la polizia e anche un'ambulanza, per sicurezza."
      errors: [tense-aspect]
    - tutor: "Bene: se l'altra persona aveva già chiamato la polizia, avremo anche il loro rapporto. Ha ammesso la sua responsabilità?"
      recast: {text: "ha già chiamato", fix: "aveva già chiamato", tags: [tense-aspect]}
    - learner: "Sì, ha ammesso subito di essersi distratto: stava guardando il navigatore."
    - tutor: "Allora la responsabilità è chiara. Avete compilato insieme il modulo di constatazione amichevole?"
      goals: [responsibility]
      new: [{lemma: constatazione, gloss: (accident) report}]
    - learner: "Sì, l'abbiamo compilato sul posto. Ho anche le foto dei danni, che ho scattato subito dopo l'incidente."
    - tutor: "Le foto sono molto utili. Mi mandi tutto via email, insieme a una copia dei documenti della macchina."
      goals: [documents]
    - learner: "Certo. Un'ultima domanda: la settimana scorsa ho portato la macchina dal meccanico perché i freni facevano rumore. Può essere un problema?"
    - tutor: "No, non c'entra nulla: lei era ferma. Entro dieci giorni un perito valuterà i danni, e poi procederemo con il rimborso."
      goals: [next]
      new: [{lemma: perito, gloss: assessor}]

- scenario: vita-in-italia
  level: B2
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie dell'invito. Vivo a Bari da quattro anni. I miei nonni erano pugliesi e mi hanno sempre parlato di questa terra."
    - tutor: "Quindi un ritorno alla terra dei nonni, in un certo senso. Com'è stato l'arrivo?"
      goals: [story]
    - learner: "All'inizio difficile. Quando sono arrivato, ho parlato solo un italiano molto elementare, quello dei nonni."
      errors: [tense-aspect]
    - tutor: "«Quando sono arrivato, ho parlato solo»: qui descrive la sua condizione di allora, non un'azione conclusa."
      prompt: {text: "ho parlato solo", tags: [tense-aspect]}
    - learner: "Parlavo solo un italiano molto elementare, con tante parole di dialetto."
    - tutor: "Il dialetto dei nonni, che bello! E la burocrazia? Molti ascoltatori ce ne parlano come del problema più grande."
    - learner: "Eh, sì. Per la residenza ho aspettato sei mesi. Il primo impiegato mi ha detto che il mio documento scadeva da due settimane."
      errors: [tense-aspect]
    - tutor: "«Scadeva da due settimane»? Il documento non era più valido già prima del colloquio con l'impiegato: come lo esprimiamo?"
      prompt: {text: "scadeva", tags: [tense-aspect]}
    - learner: "Sì, scadeva da due settimane, ma nessuno mi aveva avvisato."
      errors: [tense-aspect]
    - tutor: "Che rabbia: il documento era scaduto da due settimane e nessuno l'aveva avvisato. E poi che cosa è cambiato nella sua vita qui?"
      recast: {text: "scadeva", fix: "era scaduto", tags: [tense-aspect]}
      goals: [difficulties]
    - learner: "Moltissimo. Ho aperto un piccolo studio di grafica e adesso lavoro con aziende locali. Mi sento a casa."
    - tutor: "Che bel percorso! Che consiglio darebbe a chi sta pensando di trasferirsi qui?"
      goals: [change]
    - learner: "Di imparare bene la lingua prima di partire. Io l'avevo studiata poco, e all'inizio è stato un limite."
    - tutor: "Un consiglio prezioso. Grazie per essere stato con noi, e buona fortuna con lo studio!"
      goals: [advice]

- scenario: medico-specialista
  level: B2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Abbastanza bene, dottore, ma a volte ho il fiato corto quando salgo le scale."
    - tutor: "Capisco. Le capita anche a riposo, o solo sotto sforzo?"
    - learner: "Solo sotto sforzo. Però domenica scorsa, mentre ho portato la spesa al terzo piano, ho sentito una fitta al petto."
      errors: [tense-aspect]
    - tutor: "Questo è importante. Ma «mentre ho portato la spesa»: era un'azione in corso quando è arrivata la fitta."
      prompt: {text: "mentre ho portato la spesa", tags: [tense-aspect]}
    - learner: "Mentre portavo la spesa al terzo piano, ho sentito una fitta al petto."
    - tutor: "E quanto è durata?"
      goals: [symptoms]
    - learner: "Qualche minuto. Mi sono seduto sul gradino e dopo un po' il dolore passava."
      errors: [tense-aspect]
    - tutor: "«Dopo un po' il dolore passava»? È finito in un momento preciso, non è una situazione che continua."
      prompt: {text: "passava", tags: [tense-aspect]}
    - learner: "Sì, il dolore passava dopo cinque minuti."
      errors: [tense-aspect]
    - tutor: "Per fortuna il dolore è passato in fretta. In famiglia ci sono stati problemi di cuore?"
      recast: {text: "passava", fix: "è passato", tags: [tense-aspect]}
    - learner: "Sì, mio padre ha sofferto di cuore per molti anni. Quando è morto, aveva settantadue anni."
    - tutor: "Capisco, è un dato importante. Dagli esami risulta un leggero restringimento di un'arteria."
      goals: [history]
      new: [{lemma: restringimento, gloss: narrowing}, {lemma: arteria, gloss: artery}]
    - learner: "Restringimento? Non sono sicuro di aver capito. Vuol dire che l'arteria è più stretta del normale?"
    - tutor: "Esattamente: il sangue passa con più fatica, per questo le manca il fiato quando fa le scale."
      goals: [understand]
    - learner: "Ah, adesso è chiaro. Due anni fa il mio medico voleva che facessi un controllo, ma l'ho sempre rimandato."
    - tutor: "Purtroppo succede spesso. Iniziamo una terapia leggera e ripetiamo gli esami tra tre mesi."
      goals: [treatment]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono ingegnere ambientale, ho trentaquattro anni e lavoro nel settore delle energie rinnovabili da quasi dieci anni."
    - tutor: "Un'esperienza importante. Dove ha lavorato finora?"
      goals: [intro]
    - learner: "Ho cominciato a Londra, in una piccola società di consulenza. Poi, nel 2019, mi sono trasferito a Milano, dove mi sono occupato per tre anni di parchi eolici."
    - tutor: "Interessante. Qual è stato il progetto più difficile?"
    - learner: "Un parco eolico in Basilicata. Quando sono entrato nel progetto, i lavori sono già cominciati e c'erano gravi ritardi."
      errors: [tense-aspect]
    - tutor: "«I lavori sono già cominciati»: i lavori sono cominciati prima del suo ingresso nel progetto. Che tempo serve?"
      prompt: {text: "sono già cominciati", tags: [tense-aspect]}
    - learner: "Sì, i lavori sono già cominciati da un anno."
      errors: [tense-aspect]
    - tutor: "Quindi i lavori erano già cominciati da un anno, e lei ha dovuto recuperare il ritardo. Come ci è riuscito?"
      recast: {text: "sono già cominciati", fix: "erano già cominciati", tags: [tense-aspect]}
      goals: [experience]
    - learner: "Ho riorganizzato le squadre e ho parlato con tutti i fornitori. Alla fine abbiamo chiuso con soli due mesi di ritardo."
    - tutor: "Notevole. Quali direbbe che sono i suoi punti di forza?"
    - learner: "Sono molto organizzato e so mediare. Il mio capo diceva sempre che riuscivo a calmare anche i clienti più difficili."
    - tutor: "Una qualità rara. E perché vorrebbe lavorare con noi?"
      goals: [strengths]
    - learner: "Perché il vostro lavoro sull'idrogeno mi interessa molto. Una domanda: la sua collega mi aveva detto che il colloquio sarà con due persone."
      errors: [tense-aspect]
    - tutor: "«Mi aveva detto che il colloquio sarà»? Con «aveva detto», come si esprime un futuro visto dal passato?"
      goals: [why]
      prompt: {text: "sarà", tags: [tense-aspect]}
    - learner: "Sì, mi aveva detto che il colloquio sarà con due persone. Arriverà qualcun altro?"
      errors: [tense-aspect]
    - tutor: "Sì, le avevano detto che sarebbe stato con due persone, ed è così: il direttore tecnico ci raggiunge tra cinque minuti. Nel frattempo, ha altre domande?"
      recast: {text: "sarà", fix: "sarebbe stato", tags: [tense-aspect]}
    - learner: "Sì: è previsto un periodo di formazione all'inizio?"
    - tutor: "Sì, un mese in sede con il team di progetto. Ecco, sta arrivando il direttore."
      goals: [questions]

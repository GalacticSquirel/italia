# B1, tense-aspect: imperfetto for background and habits, passato prossimo for events,
# trapassato for the earlier past, «da» + present; correct turns use the same contrasts.
- scenario: ricordi-infanzia
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo a Valencia, in un palazzo vicino al porto. Dal balcone si vedevano le navi."
    - tutor: "Che vista! E cosa facevi di solito dopo la scuola?"
      goals: [place]
    - learner: "Giocavo in cortile con i figli dei vicini fino all'ora di cena. Mia madre ci chiamava dal balcone."
    - tutor: "Mi immagino la scena! E a scuola com'eri, una bambina tranquilla?"
      goals: [habits]
    - learner: "Abbastanza. Ma in terza elementare ho cambiato scuola tre volte, perché mio padre ha lavorato per una compagnia di navi."
      errors: [tense-aspect]
    - tutor: "Tre scuole in un anno! Però «mio padre ha lavorato per una compagnia»: è la situazione generale di quegli anni. Come lo diresti?"
      prompt: {text: "ha lavorato", tags: [tense-aspect]}
    - learner: "Sì, mio padre ha lavorato per una compagnia di navi e ci spostavamo spesso."
      errors: [tense-aspect]
    - tutor: "Ah, tuo padre lavorava per una compagnia di navi, ecco perché vi spostavate tanto. Era difficile cambiare scuola?"
      recast: {text: "ha lavorato", fix: "lavorava", tags: [tense-aspect]}
    - learner: "Un po'. Quando sono arrivata nella terza scuola, non ho conosciuto nessuno."
      errors: [tense-aspect]
    - tutor: "«Non ho conosciuto nessuno»? Parli della tua situazione al primo giorno, non di un fatto."
      prompt: {text: "non ho conosciuto nessuno", tags: [tense-aspect]}
    - learner: "Non conoscevo nessuno, è vero, ma dopo un mese avevo già tante amiche."
    - tutor: "Brava, i bambini fanno amicizia in fretta! C'è un giorno che ricordi in modo speciale?"
      goals: [school]
    - learner: "Sì, il mio decimo compleanno. Mentre spegnevo le candeline, è entrato mio nonno: era arrivato dall'Argentina senza dirlo a nessuno!"
    - tutor: "Che sorpresa meravigliosa! Immagino la tua faccia in quel momento."
      goals: [event]

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao Elena! Io e mia moglie siamo stati in Puglia, a Lecce, per due settimane."
    - tutor: "Lecce, che bella! C'eravate già stati?"
      goals: [where]
    - learner: "No, era la prima volta. Ma un nostro amico ci aveva parlato tanto di Lecce, quindi eravamo molto curiosi."
    - tutor: "E com'è andata? Che tempo avete trovato?"
    - learner: "Quando siamo arrivati, ha fatto un caldo terribile, trentotto gradi!"
      errors: [tense-aspect]
    - tutor: "Trentotto gradi! Ma «quando siete arrivati, ha fatto un caldo terribile»: stai descrivendo il tempo che avete trovato. Che forma serve?"
      prompt: {text: "ha fatto un caldo terribile", tags: [tense-aspect]}
    - learner: "Sì, ha fatto un caldo terribile, ma dopo due giorni è arrivato il fresco."
      errors: [tense-aspect]
    - tutor: "Eh, a luglio laggiù faceva un caldo terribile, lo so bene! Per fortuna poi è arrivato il fresco. Cosa avete visitato?"
      recast: {text: "ha fatto un caldo terribile", fix: "faceva un caldo terribile", tags: [tense-aspect]}
      goals: [weather]
    - learner: "Le chiese barocche e il mare a Otranto. Un giorno abbiamo perso l'ultimo autobus: quando siamo arrivati alla fermata, è già partito."
      errors: [tense-aspect]
    - tutor: "Che peccato! Però l'autobus è partito prima del vostro arrivo alla fermata: che tempo usiamo per un fatto ancora più lontano?"
      prompt: {text: "è già partito", tags: [tense-aspect]}
    - learner: "Sì, è già partito, e abbiamo preso un taxi."
      errors: [tense-aspect]
    - tutor: "Ah, l'autobus era già partito, quindi taxi! E qual è stato il momento più bello del viaggio?"
      recast: {text: "è già partito", fix: "era già partito", tags: [tense-aspect]}
      goals: [activities]
    - learner: "Il tramonto a Otranto, sicuramente. Ci siamo seduti sul porto e abbiamo mangiato un gelato guardando il mare."
    - tutor: "Che scena romantica! Mi hai fatto venire voglia di partire."
      goals: [best]

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna si festeggia soprattutto la notte del 24. Si cena tutti insieme e si mangia molto pesce."
    - tutor: "Anche da noi la sera del 24 si mangia pesce! E il 25?"
      goals: [compare]
    - learner: "Il 25 si pranza con la famiglia. Ma la festa più importante per i bambini è il 6 gennaio, con i Re Magi."
    - tutor: "Come da noi con la Befana! E tu da bambino cosa facevi il 6 gennaio?"
    - learner: "La sera prima mettevo le scarpe vicino alla finestra, e i Re Magi hanno lasciato sempre i regali."
      errors: [tense-aspect]
    - tutor: "Che bello! Ma i Re Magi «hanno lasciato sempre»: succedeva ogni anno, giusto?"
      prompt: {text: "hanno lasciato sempre", tags: [tense-aspect]}
    - learner: "Sì, i Re Magi hanno lasciato sempre caramelle e regali."
      errors: [tense-aspect]
    - tutor: "Ah, i Re Magi lasciavano sempre caramelle e regali: proprio come la nostra Befana! Ti ricordi un regalo speciale?"
      recast: {text: "hanno lasciato sempre", fix: "lasciavano sempre", tags: [tense-aspect]}
    - learner: "Sì, quando avevo otto anni ricevevo una bicicletta rossa. Era il regalo più bello della mia vita!"
      errors: [tense-aspect]
    - tutor: "Che regalo! Però «ricevevo una bicicletta»: è successo una volta sola, quell'anno."
      prompt: {text: "ricevevo", tags: [tense-aspect]}
    - learner: "Ho ricevuto una bicicletta rossa! Ci andavo dappertutto."
    - tutor: "Ci credo! E qui in Italia, ti piacerebbe vedere come festeggiamo la Befana?"
      goals: [past]
    - learner: "Sì, molto! Cosa fate voi il 6 gennaio?"
    - tutor: "I bambini ricevono una calza piena di dolci, e quelli cattivi solo il carbone! Vuoi venire da noi quel giorno?"
      goals: [ask]
      new: [{lemma: carbone, gloss: coal}]
    - learner: "Volentieri! Porto io il roscón, il dolce tipico spagnolo."
    - tutor: "Perfetto, allora il 6 a pranzo da noi: tu porti il dolce, noi la calza!"
      goals: [plan]

- scenario: dal-meccanico
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Fa un rumore strano quando freno, e da ieri si accende una luce rossa."
    - tutor: "Capisco. Quando ha sentito il rumore per la prima volta?"
      goals: [describe]
    - learner: "Tre giorni fa. Ho guidato in autostrada quando ho sentito un colpo forte sotto la macchina."
      errors: [tense-aspect]
    - tutor: "«Ho guidato in autostrada quando ho sentito»: era un'azione in corso quando è arrivato il colpo. Come lo direbbe?"
      prompt: {text: "Ho guidato in autostrada", tags: [tense-aspect]}
    - learner: "Guidavo in autostrada quando ho sentito un colpo forte."
    - tutor: "Esatto. Forse ha preso una buca: capita spesso. Andava veloce?"
      goals: [when]
      new: [{lemma: buca, gloss: pothole}]
    - learner: "No, andavo piano perché pioveva. Il rumore è cominciato subito dopo."
    - tutor: "Allora controllo i freni e le gomme. Il preventivo è di circa duecento euro."
      goals: [cost]
    - learner: "Va bene. Il mese scorso un altro meccanico controllava i freni e diceva che erano a posto."
      errors: [tense-aspect]
    - tutor: "Il mese scorso «controllava i freni»? È stato un controllo solo, già finito."
      prompt: {text: "controllava i freni", tags: [tense-aspect]}
    - learner: "Sì, il meccanico controllava i freni il mese scorso."
      errors: [tense-aspect]
    - tutor: "Se un altro meccanico ha controllato i freni il mese scorso, forse il problema è nelle gomme. Lo vediamo subito."
      recast: {text: "controllava i freni", fix: "ha controllato i freni", tags: [tense-aspect]}
    - learner: "D'accordo. Quando sarà pronta?"
    - tutor: "Domani pomeriggio, verso le cinque. Le telefono io appena ho finito."
      goals: [time]

- scenario: medico-base
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Ho sempre sonno e mi fa male la testa quasi ogni giorno."
    - tutor: "Mi dispiace. Da quanto tempo va avanti così?"
      goals: [symptoms]
    - learner: "Sono stata così da un mese, più o meno."
      errors: [tense-aspect]
    - tutor: "«Sono stata così da un mese»? Ma il problema continua anche oggi, vero? Allora che tempo serve con «da»?"
      prompt: {text: "Sono stata così da un mese", tags: [tense-aspect]}
    - learner: "Ah, sì: sto così da un mese."
    - tutor: "Un mese è parecchio. È cambiato qualcosa nella sua vita, in questo periodo?"
      goals: [since-when]
    - learner: "Sì, prima vivevo a Siviglia e lavoravo di giorno. Da quando sono arrivata a Bologna, lavoro di notte in un hotel."
    - tutor: "Ecco, il lavoro di notte può spiegare molto. Ha avuto altri problemi di salute in passato?"
    - learner: "No, niente di grave. Solo l'anno scorso mi sono rotta un braccio mentre ho sciato."
      errors: [tense-aspect]
    - tutor: "Mi dispiace! Però «mentre ho sciato»: era un'azione in corso quando è successo l'incidente."
      prompt: {text: "mentre ho sciato", tags: [tense-aspect]}
    - learner: "Mentre sciavo, scusi. Sono caduta sulla neve ghiacciata."
    - tutor: "Capisco. Le faccio fare degli esami del sangue, per sicurezza. Beve molto caffè?"
      goals: [history]
    - learner: "Sì, troppo. Ieri ho preso due caffè la sera, e poi non riuscivo a dormire."
    - tutor: "Ecco, niente caffè dopo pranzo! E cerchi di dormire almeno sette ore, anche di giorno."
      goals: [instructions]

- scenario: film-libro
  level: B1
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Inizio io! Ho letto «Io non ho paura» di Niccolò Ammaniti."
    - tutor: "Un classico moderno! Di cosa parla?"
    - learner: "Parla di un bambino, Michele, che vive in un piccolo paese del Sud. Un giorno, mentre gioca con gli amici, trova un buco nel terreno, e dentro c'è un altro bambino."
    - tutor: "Che inizio forte! E chi è quel bambino?"
      goals: [summary]
    - learner: "È un bambino di Milano che alcuni uomini del paese hanno rapito. E il padre di Michele è uno di loro."
    - tutor: "Terribile. E cosa pensi di Michele?"
    - learner: "Michele è coraggioso e molto umano. Conoscevo già la storia: quando ho comprato il libro, il film è già uscito da anni."
      errors: [tense-aspect]
    - tutor: "Il film è uscito prima che tu comprassi il libro: che tempo usiamo per un fatto ancora più lontano nel passato?"
      prompt: {text: "è già uscito", tags: [tense-aspect]}
    - learner: "Sì, il film è già uscito da anni."
      errors: [tense-aspect]
    - tutor: "Ah, il film era già uscito, quindi hai visto prima il film! Ti è piaciuto di più il libro?"
      recast: {text: "è già uscito", fix: "era già uscito", tags: [tense-aspect]}
      goals: [characters]
    - learner: "Sì, molto di più. Il libro è più duro, ma anche più poetico."
    - tutor: "Bella definizione! Lo consiglieresti a tutti?"
      goals: [opinion]
    - learner: "Sì, ma non ai ragazzi troppo giovani. L'ho letto la prima volta quando sono stato al liceo, e alcune scene mi hanno fatto paura."
      errors: [tense-aspect]
    - tutor: "«Quando sono stato al liceo»: parli di un periodo della tua vita, non di un fatto. Prova a ripetere."
      prompt: {text: "quando sono stato al liceo", tags: [tense-aspect]}
    - learner: "L'ho letto quando ero al liceo, e alcune scene mi hanno fatto paura."
    - tutor: "Giusto, meglio leggerlo da adulti. Grazie, lo metto nella lista del gruppo!"
      goals: [recommend]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Emily, ho ventiquattro anni e sono inglese. Vivo a Torino da un anno e mezzo."
    - tutor: "Benvenuta. E che cosa fa qui a Torino?"
      goals: [intro]
    - learner: "Insegno inglese in una scuola privata. Prima, in Inghilterra, ho lavorato due anni in un'agenzia di viaggi."
    - tutor: "Interessante. Di che cosa si occupava, in agenzia?"
    - learner: "Organizzavo viaggi per gruppi di studenti. Una volta, mentre ho accompagnato un gruppo a Firenze, un ragazzo ha perso il passaporto."
      errors: [tense-aspect]
    - tutor: "«Mentre ho accompagnato un gruppo»: era un'azione in corso quando il ragazzo ha perso il passaporto. Come lo direbbe?"
      prompt: {text: "mentre ho accompagnato", tags: [tense-aspect]}
    - learner: "Mentre accompagnavo un gruppo a Firenze, un ragazzo ha perso il passaporto."
    - tutor: "Che situazione difficile! E come ha risolto?"
      goals: [experience]
    - learner: "Sono andata subito al consolato con lui. Quando siamo arrivati, l'ufficio ha già chiuso, ma una signora ci ha aiutato lo stesso."
      errors: [tense-aspect]
    - tutor: "«Quando siete arrivati, l'ufficio ha già chiuso»: l'ufficio ha chiuso prima del vostro arrivo. Che tempo serve?"
      prompt: {text: "ha già chiuso", tags: [tense-aspect]}
    - learner: "Sì, l'ufficio ha già chiuso alle cinque."
      errors: [tense-aspect]
    - tutor: "Quindi l'ufficio aveva già chiuso, ma lei ha trovato una soluzione: questa è una qualità importante. Quali altri punti di forza ha?"
      recast: {text: "ha già chiuso", fix: "aveva già chiuso", tags: [tense-aspect]}
    - learner: "Sono paziente e organizzata, e parlo tre lingue."
    - tutor: "Tre lingue sono utilissime da noi. E perché vuole lavorare per la nostra agenzia?"
      goals: [strengths]
    - learner: "Perché il turismo mi manca, e voi lavorate con le scuole, come la mia agenzia di prima. Quante ore si lavora alla settimana?"
    - tutor: "Trentacinque, dal lunedì al venerdì. Le faremo sapere entro venerdì prossimo."
      goals: [why, questions]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, nella mia camera, la 214, l'aria condizionata non funziona."
    - tutor: "Mi dispiace molto. Da quando non funziona?"
      goals: [problem]
    - learner: "Non ha funzionato da questo pomeriggio. Quando sono rientrato alle cinque, la camera è stata caldissima."
      errors: [tense-aspect]
    - tutor: "«Non ha funzionato da questo pomeriggio»? Ma il problema c'è ancora adesso, giusto? Allora con «da» che tempo serve?"
      prompt: {text: "Non ha funzionato", tags: [tense-aspect]}
    - learner: "Non funziona da questo pomeriggio. E la camera è stata caldissima."
      errors: [tense-aspect]
    - tutor: "Capisco, la camera era caldissima: con questo caldo non si riesce a dormire."
      recast: {text: "è stata caldissima", fix: "era caldissima", tags: [tense-aspect]}
      goals: [since]
    - learner: "Sarebbe possibile cambiare camera? Ieri notte ho dormito pochissimo per il rumore della strada."
    - tutor: "Certo. Ho una camera libera al quinto piano, sul cortile: è molto più tranquilla."
      goals: [request]
    - learner: "Perfetto, grazie. Quando ho prenotato, il sito diceva che tutte le camere avevano l'aria condizionata nuova."
    - tutor: "Ha ragione, e mi scuso. Per il disturbo le offriamo la colazione in camera domani mattina."
    - learner: "Molto gentile, accetto volentieri. Vado a prendere la valigia."
    - tutor: "Benissimo. Ecco la chiave della 512: un collega l'aiuta con le valigie."
      goals: [agree]

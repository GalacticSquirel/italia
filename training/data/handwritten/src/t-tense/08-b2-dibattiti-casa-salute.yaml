# B2, tense-aspect: future in the past, bounded vs ongoing actions, trapassato, «da» + present;
# correct turns use the same contrasts.
- scenario: politica-lavoro
  level: B2
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Molti lavori cambieranno, ma non spariranno."
    - tutor: "Dici? Guarda le casse al supermercato: ormai paghi da solo."
      goals: [opinion]
    - learner: "È vero, ma qualcuno deve sempre controllare. Mia zia ha fatto la cassiera per vent'anni e adesso si occupa dei clienti."
    - tutor: "Va bene, ma tua zia è stata fortunata. Se il suo supermercato avesse chiuso, cosa avrebbe fatto?"
    - learner: "Avrebbe trovato un altro lavoro, credo. Quando sono arrivati i computer, tutti pensavano che le segretarie spariranno."
      errors: [tense-aspect]
    - tutor: "«Tutti pensavano che le segretarie spariranno»: con «pensavano» il futuro si guarda dal passato. Come diventa?"
      prompt: {text: "spariranno", tags: [tense-aspect]}
    - learner: "Sì, pensavano che spariranno tutte, e invece no."
      errors: [tense-aspect]
    - tutor: "Già, tutti dicevano che sarebbero sparite, e invece il lavoro si è solo trasformato. Hai altri esempi?"
      recast: {text: "spariranno", fix: "sarebbero sparite", tags: [tense-aspect]}
      goals: [hypothesis]
    - learner: "Mio padre lavorava in una tipografia. Quando è arrivata la stampa digitale, imparava a usare i nuovi programmi in pochi mesi."
      errors: [tense-aspect]
    - tutor: "Bell'esempio. Ma «imparava in pochi mesi»: è un risultato raggiunto, con un tempo preciso."
      prompt: {text: "imparava", tags: [tense-aspect]}
    - learner: "Sì, mio padre imparava tutto in pochi mesi, a cinquant'anni."
      errors: [tense-aspect]
    - tutor: "Tuo padre ha imparato tutto in pochi mesi, a cinquant'anni? Lo ammetto, è un caso che fa riflettere. Ma non tutti sanno cambiare come lui."
      recast: {text: "imparava", fix: "ha imparato", tags: [tense-aspect]}
      goals: [example]
    - learner: "Certo, per questo servono corsi di formazione. Se lo Stato investisse di più, nessuno resterebbe indietro."
    - tutor: "Su questo hai ragione. Diciamo che il futuro dipende da come ci prepariamo, d'accordo?"
      goals: [conclude]

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io non sono d'accordo. Credo che una zona pedonale porti più clienti, non meno."
    - tutor: "Lo dice lei, ma la gente vuole parcheggiare davanti al negozio."
      goals: [position]
    - learner: "Ho vissuto due anni a Pontevedra, in Spagna. Quando sono arrivata, il centro è già stato pedonale e i negozi lavoravano benissimo."
      errors: [tense-aspect]
    - tutor: "«Il centro è già stato pedonale»: lei descrive com'era la città al suo arrivo, non racconta un fatto."
      prompt: {text: "è già stato pedonale", tags: [tense-aspect]}
    - learner: "Sì, il centro è già stato pedonale da molti anni."
      errors: [tense-aspect]
    - tutor: "Capisco, quindi il centro era già pedonale da molti anni. Ma all'inizio i commercianti cosa dicevano?"
      recast: {text: "è già stato pedonale", fix: "era già pedonale", tags: [tense-aspect]}
      goals: [argue]
    - learner: "All'inizio protestavano, proprio come lei. Ma due anni dopo la chiusura le vendite aumentavano del trenta per cento."
      errors: [tense-aspect]
    - tutor: "«Le vendite aumentavano del trenta per cento»: è un risultato preciso, arrivato dopo due anni."
      prompt: {text: "aumentavano", tags: [tense-aspect]}
    - learner: "Sì, in due anni le vendite aumentavano del trenta per cento."
      errors: [tense-aspect]
    - tutor: "Se le vendite sono aumentate del trenta per cento, è un argomento forte, lo riconosco. Però qui servirebbero parcheggi fuori dal centro."
      recast: {text: "aumentavano", fix: "sono aumentate", tags: [tense-aspect]}
      goals: [counter]
    - learner: "Su questo ha ragione: senza parcheggi e autobus frequenti, il progetto non funzionerebbe."
    - tutor: "Allora siamo d'accordo almeno su un punto. Proponiamolo insieme alla prossima riunione!"
      goals: [concede]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Immaginiamo una cosa semplice, all'aperto, in campagna. Ci siamo conosciuti in Toscana, durante una vendemmia."
    - tutor: "Che romantico! Quindi una cerimonia in Toscana, in campagna?"
      goals: [vision]
    - learner: "Esatto. L'anno scorso andavamo a un matrimonio in una villa vicino a Siena e ci piaceva moltissimo."
      errors: [tense-aspect]
    - tutor: "Conosco bene la zona! Ma «l'anno scorso andavamo a un matrimonio»: parla di un giorno preciso, una volta sola."
      prompt: {text: "andavamo a un matrimonio", tags: [tense-aspect]}
    - learner: "L'anno scorso siamo andati a un matrimonio in quella villa e ci è piaciuta moltissimo."
    - tutor: "Ottimo punto di partenza. Quanti invitati pensate di avere, e che budget avete?"
    - learner: "Circa ottanta persone, e vorremmo restare sotto i trentamila euro. Mia sorella si è sposata due anni fa e ha speso il doppio, perché non aveva un limite preciso."
    - tutor: "Con trentamila euro per ottanta persone si può fare, se scegliamo bene. Preferite un pranzo o una cena?"
      goals: [budget]
    - learner: "Una cena. Al matrimonio di mia sorella il pranzo durava fino alle sette di sera e gli invitati erano esausti."
      errors: [tense-aspect]
    - tutor: "«Il pranzo durava fino alle sette»? Con un limite di tempo preciso, l'azione è conclusa."
      prompt: {text: "durava fino alle sette", tags: [tense-aspect]}
    - learner: "Sì, durava fino alle sette, troppo per tutti."
      errors: [tense-aspect]
    - tutor: "Eh, se il pranzo è durato fino alle sette, gli invitati avevano ragione! Allora facciamo una cena, con un aperitivo al tramonto."
      recast: {text: "durava fino alle sette", fix: "è durato fino alle sette", tags: [tense-aspect]}
      goals: [choices]
    - learner: "Perfetto. Però la villa deve avere un piano B se piove: al matrimonio di Siena è cominciato a piovere mentre gli sposi si scambiavano le promesse!"
    - tutor: "Il piano B è la prima cosa che controllo, ve lo garantisco. Vi mando tre proposte entro la fine della settimana."
      goals: [conditions]

- scenario: affittare-appartamento
  level: B2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Ah, è molto più grande di come sembrava nelle foto. Quanto viene l'affitto?"
    - tutor: "Lo dicono tutti! L'affitto è di ottocento euro, spese escluse."
      goals: [rent]
    - learner: "D'accordo. Che tipo di contratto propone? Nell'appartamento dove vivo adesso ho avuto un contratto a canone concordato da tre anni."
      errors: [tense-aspect]
    - tutor: "«Ho avuto un contratto da tre anni»? Ma quel contratto vale ancora oggi, giusto? Con «da» che tempo serve?"
      prompt: {text: "ho avuto un contratto", tags: [tense-aspect]}
    - learner: "Ho un contratto a canone concordato da tre anni, e mi trovo bene."
    - tutor: "Perfetto, allora conosce già questo tipo di contratto: anche qui facciamo tre anni più due."
      goals: [contract]
    - learner: "Bene. Vedo una macchia sul soffitto del bagno. Glielo chiedo perché il mio proprietario attuale, quando sono entrato, mi ha detto che ha rifatto il bagno, ma non era vero."
      errors: [tense-aspect]
    - tutor: "«Mi ha detto che ha rifatto il bagno»: i lavori, se c'erano, venivano prima di quella conversazione. Che tempo serve?"
      prompt: {text: "ha rifatto il bagno", tags: [tense-aspect]}
    - learner: "Sì, mi ha detto che ha rifatto il bagno da poco."
      errors: [tense-aspect]
    - tutor: "Che brutta esperienza! Le ha detto che aveva rifatto il bagno e non era vero? Qui la macchia è vecchia: il tetto è stato riparato a settembre."
      recast: {text: "ha rifatto il bagno", fix: "aveva rifatto il bagno", tags: [tense-aspect]}
      goals: [condition]
    - learner: "Va bene, mi fido. Com'è il quartiere la sera? Prima abitavo vicino ai locali e non riuscivo a dormire."
    - tutor: "Qui è tranquillo: ci sono soprattutto famiglie, e i locali più vicini sono a dieci minuti a piedi."
      goals: [neighbourhood]
    - learner: "Ottimo. Ci penso stanotte e domani le do una risposta, se per lei va bene."
    - tutor: "Certo, ma non aspetti troppo: giovedì ho altre due visite."
      goals: [decide]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Sabato sera qualcuno ha urtato la mia macchina nel parcheggio del supermercato e se n'è andato."
    - tutor: "Che rabbia! Lei era presente, o ha trovato il danno al ritorno?"
    - learner: "L'ho trovato al ritorno. Quando sono uscito dal supermercato, l'altro guidatore è già scappato."
      errors: [tense-aspect]
    - tutor: "«È già scappato»: la fuga viene prima della sua uscita dal supermercato. Che tempo usiamo per questo passato più lontano?"
      prompt: {text: "è già scappato", tags: [tense-aspect]}
    - learner: "Sì, è già scappato senza lasciare un biglietto."
      errors: [tense-aspect]
    - tutor: "Quindi il responsabile era già scappato senza lasciare nulla. Che danni ha la macchina? Ci sono testimoni?"
      recast: {text: "è già scappato", fix: "era già scappato", tags: [tense-aspect]}
    - learner: "Il fanale posteriore è rotto. E sì, un ragazzo che lavorava nel parcheggio ha visto tutto e ha scritto la targa."
    - tutor: "Ottimo, con la targa possiamo risalire al responsabile."
      goals: [what, responsibility]
    - learner: "Bene. Ho chiamato subito i carabinieri, ma mi hanno detto che dovevo fare la denuncia il giorno dopo."
    - tutor: "Ha fatto bene. Mi serve una copia della denuncia e le foto del danno."
      goals: [documents]
    - learner: "Certo, le mando oggi. Quanto ci vorrà per il rimborso? L'anno scorso, per un altro incidente, aspettavo quattro mesi."
      errors: [tense-aspect]
    - tutor: "«Aspettavo quattro mesi»? È un periodo chiuso, di quattro mesi precisi."
      prompt: {text: "aspettavo quattro mesi", tags: [tense-aspect]}
    - learner: "Ho aspettato quattro mesi, ed è stato un incubo."
    - tutor: "Questa volta dovrebbe essere più veloce: circa sei settimane, se il responsabile è assicurato."
      goals: [next]

- scenario: vita-in-italia
  level: B2
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a tutti! Sono arrivata a Padova con l'Erasmus sei anni fa e non sono più tornata in Spagna."
    - tutor: "Un Erasmus che dura da sei anni! Cosa l'ha convinta a restare?"
      goals: [story]
    - learner: "Durante l'Erasmus ho conosciuto il mio compagno. Quando l'ho conosciuto, ha già finito l'università e lavorava in un laboratorio."
      errors: [tense-aspect]
    - tutor: "«Ha già finito l'università»: gli studi sono finiti prima del vostro incontro. Che tempo serve?"
      prompt: {text: "ha già finito", tags: [tense-aspect]}
    - learner: "Sì, ha già finito l'università da un anno."
      errors: [tense-aspect]
    - tutor: "Quindi lui aveva già finito l'università e lavorava già. E per lei è stato facile trovare lavoro?"
      recast: {text: "ha già finito", fix: "aveva già finito", tags: [tense-aspect]}
    - learner: "Per niente. Per un anno ho mandato curriculum dappertutto, ma nessuno mi rispondeva."
    - tutor: "Un anno lungo, immagino. Come ne è uscita?"
      goals: [difficulties]
    - learner: "Una scuola di lingue mi ha chiamata per una sostituzione. Ci insegno da quattro anni, e da settembre la dirigo."
    - tutor: "Che percorso! Che consiglio darebbe a chi arriva oggi in Italia?"
      goals: [change]
    - learner: "Di non arrendersi. Io pensavo che dopo l'Erasmus tornerò a casa, e invece eccomi qui."
      errors: [tense-aspect]
    - tutor: "«Pensavo che tornerò»? Il futuro visto dal passato ha una forma particolare. Come lo direbbe?"
      prompt: {text: "tornerò", tags: [tense-aspect]}
    - learner: "Pensavo che sarei tornata a casa, e invece eccomi qui!"
    - tutor: "Un finale perfetto per la nostra intervista. Grazie, e in bocca al lupo!"
      goals: [advice]

- scenario: medico-specialista
  level: B2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Meglio, grazie. Da quando prendo le pastiglie, il cuore non batte più così forte."
    - tutor: "Bene, è quello che speravo. Le palpitazioni sono sparite del tutto?"
      new: [{lemma: palpitazione, gloss: palpitation}]
    - learner: "Quasi. Giovedì scorso, mentre salivo in ufficio, ho sentito di nuovo il cuore accelerare, ma per pochi secondi."
    - tutor: "Pochi secondi non mi preoccupano. In passato ha avuto altri episodi del genere?"
      goals: [symptoms]
    - learner: "No, mai. Da giovane ho giocato a calcio tutti i giorni e non ho avuto mai problemi."
      errors: [tense-aspect]
    - tutor: "«Da giovane ho giocato a calcio tutti i giorni»: parla di un'abitudine di quegli anni. Come cambia il verbo?"
      prompt: {text: "ho giocato a calcio tutti i giorni", tags: [tense-aspect]}
    - learner: "Da giovane giocavo a calcio tutti i giorni e non avevo mai problemi."
    - tutor: "Questo è utile. E in famiglia?"
    - learner: "Mio fratello ha avuto un infarto l'anno scorso: quando è arrivata l'ambulanza, è già svenuto."
      errors: [tense-aspect]
    - tutor: "Mi dispiace. Ma «quando è arrivata l'ambulanza, è già svenuto»: suo fratello ha perso i sensi prima dell'arrivo dell'ambulanza."
      prompt: {text: "è già svenuto", tags: [tense-aspect]}
    - learner: "Sì, è già svenuto in cucina."
      errors: [tense-aspect]
    - tutor: "Se suo fratello era già svenuto, la situazione era grave. Il suo caso è diverso: gli esami mostrano solo un'aritmia leggera."
      recast: {text: "è già svenuto", fix: "era già svenuto", tags: [tense-aspect]}
      goals: [history]
      new: [{lemma: aritmia, gloss: arrhythmia}]
    - learner: "Quindi non è pericolosa? Con le pastiglie resta sotto controllo?"
    - tutor: "Esatto, non è pericolosa. Continui la terapia per sei mesi e ripetiamo gli esami a marzo."
      goals: [understand, treatment]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Carmen, ho ventisei anni e mi sono laureata in Economia a Salamanca. Vivo a Milano da un anno."
    - tutor: "Benvenuta. Cosa l'ha portata a Milano?"
      goals: [intro]
    - learner: "Uno stage in una società di moda. Quando ho mandato la candidatura, non ho sperato davvero di essere scelta."
      errors: [tense-aspect]
    - tutor: "«Non ho sperato davvero»: parla di quello che sentiva in quel momento, non di un'azione."
      prompt: {text: "non ho sperato", tags: [tense-aspect]}
    - learner: "Non speravo davvero di essere scelta, e invece mi hanno presa!"
    - tutor: "Ottimo! E di che cosa si occupava, in quella società?"
    - learner: "Analizzavo i dati delle vendite online. Quando sono arrivata, il programma per i report è stato nuovo per tutti, ma l'ho imparato in una settimana."
      errors: [tense-aspect]
    - tutor: "«Il programma è stato nuovo per tutti»? Qui descrive la situazione che ha trovato al suo arrivo."
      prompt: {text: "è stato nuovo per tutti", tags: [tense-aspect]}
    - learner: "Sì, il programma è stato nuovo per tutti, anche per il mio capo."
      errors: [tense-aspect]
    - tutor: "Se il programma era nuovo per tutti, impararlo in una settimana è notevole. Direi che la velocità è un suo punto di forza."
      recast: {text: "è stato nuovo per tutti", fix: "era nuovo per tutti", tags: [tense-aspect]}
      goals: [experience, strengths]
    - learner: "Grazie. Vorrei lavorare con voi perché lavorate con marchi sostenibili. Quando ho scoperto la vostra azienda, avete appena lanciato una linea di abiti riciclati."
      errors: [tense-aspect]
    - tutor: "«Avete appena lanciato»: il lancio è avvenuto prima che lei conoscesse l'azienda. Come lo segnala il verbo?"
      prompt: {text: "avete appena lanciato", tags: [tense-aspect]}
    - learner: "Quando vi ho scoperti, avevate appena lanciato una linea di abiti riciclati."
    - tutor: "Esatto, ed è stato un successo. Ha domande per me?"
      goals: [why]
    - learner: "Sì: è previsto un periodo di prova?"
    - tutor: "Sì, di tre mesi. Le daremo una risposta entro la fine del mese."
      goals: [questions]

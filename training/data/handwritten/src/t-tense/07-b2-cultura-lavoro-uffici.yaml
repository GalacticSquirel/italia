# B2, tense-aspect: description vs event, trapassato, future in the past and sequence of
# tenses; correct turns use the same contrasts (and colloquially acceptable ones).
- scenario: film-libro
  level: B2
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto «La Storia» di Elsa Morante. Ci ho messo tre settimane, ma ne valeva la pena."
    - tutor: "Un romanzo enorme, brava! Di che cosa parla, in breve?"
    - learner: "Racconta la vita di Ida, una maestra che vive a Roma durante la guerra con il figlio piccolo."
    - tutor: "Il bambino è un personaggio che non si dimentica. Che cosa ti ha colpito di lui?"
      goals: [summary]
    - learner: "La sua gioia. Anche quando intorno ci sono state la fame e le bombe, lui trovava sempre qualcosa di bello."
      errors: [tense-aspect]
    - tutor: "Bellissimo. Ma «ci sono state la fame e le bombe»: è il mondo in cui vive il bambino, la situazione generale, non un singolo evento."
      prompt: {text: "ci sono state", tags: [tense-aspect]}
    - learner: "Sì, anche quando ci sono state la fame e le bombe, lui era felice."
      errors: [tense-aspect]
    - tutor: "Già, anche quando c'erano la fame e le bombe, lui era felice: è questo che spezza il cuore. E il libro nel complesso, ti è piaciuto?"
      recast: {text: "ci sono state", fix: "c'erano", tags: [tense-aspect]}
      goals: [characters]
    - learner: "Moltissimo. Prima di cominciarlo pensavo che sarà noioso, ma mi sbagliavo."
      errors: [tense-aspect]
    - tutor: "«Pensavo che sarà noioso»: con «pensavo» anche il futuro va guardato dal passato. Come diventa?"
      prompt: {text: "sarà noioso", tags: [tense-aspect]}
    - learner: "Sì, pensavo che il libro sarà noioso e troppo lungo."
      errors: [tense-aspect]
    - tutor: "Anch'io pensavo che sarebbe stato noioso, prima di leggerlo! E invece è uno dei libri più belli del Novecento."
      recast: {text: "sarà noioso", fix: "sarebbe stato noioso", tags: [tense-aspect]}
      goals: [opinion]
    - learner: "Esatto. Quando l'ho finito, ho pianto per mezz'ora: il finale mi distruggeva."
      errors: [tense-aspect]
    - tutor: "Ti capisco. Però «il finale mi distruggeva»: parli dell'effetto di un momento preciso, la fine del libro."
      prompt: {text: "mi distruggeva", tags: [tense-aspect]}
    - learner: "Il finale mi ha distrutta, davvero."
    - tutor: "Succede a tutti quelli che lo leggono. Lo consiglieresti al gruppo?"
    - learner: "Sì, ma con calma: non è un libro da leggere in spiaggia, ci vuole tempo."
    - tutor: "Ottimo consiglio! Lo mettiamo in lista per l'autunno, così abbiamo tutto il tempo che serve."
      goals: [recommend]

- scenario: smartworking
  level: B2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Ormai quasi sempre da casa. Da quando la scuola ha introdotto i corsi online per adulti, insegno dal salotto."
    - tutor: "Insegnare dal salotto, che cambiamento! E ti trovi bene?"
      goals: [situation]
    - learner: "Per certi versi sì: risparmio tempo e soldi. Prima spendevo cento euro al mese di benzina, perché la scuola è stata a trenta chilometri da casa mia."
      errors: [tense-aspect]
    - tutor: "«La scuola è stata a trenta chilometri»? Qui descrivi una situazione stabile di quel periodo, non un fatto."
      prompt: {text: "è stata a trenta chilometri", tags: [tense-aspect]}
    - learner: "Sì, la scuola è stata a trenta chilometri, in un paese vicino."
      errors: [tense-aspect]
    - tutor: "Capisco, se la scuola era a trenta chilometri, il risparmio è davvero notevole. E gli svantaggi?"
      recast: {text: "è stata a trenta chilometri", fix: "era a trenta chilometri", tags: [tense-aspect]}
      goals: [pros]
    - learner: "Il rumore, a volte. Il primo anno, mentre ho fatto lezione, i vicini hanno cominciato a fare lavori in casa."
      errors: [tense-aspect]
    - tutor: "Che incubo! Ma «mentre ho fatto lezione»: era l'azione in corso quando sono cominciati i lavori."
      prompt: {text: "mentre ho fatto lezione", tags: [tense-aspect]}
    - learner: "Mentre facevo lezione, i vicini hanno cominciato a fare lavori in casa, con un rumore terribile."
    - tutor: "Con venti studenti collegati, immagino. E i colleghi, li vedi ancora?"
      goals: [cons]
    - learner: "Sì, l'anno scorso la direttrice ha deciso che ogni venerdì andiamo tutti a scuola per una riunione."
    - tutor: "Mi sembra una buona soluzione. Se potessi scegliere, cosa preferiresti?"
    - learner: "Tre giorni a casa e due a scuola. Quando insegnavo solo in presenza ero più stanca, ma conoscevo meglio i miei studenti."
    - tutor: "Ha senso: il contatto umano non si sostituisce con uno schermo. Speriamo che la tua scuola ti ascolti!"
      goals: [preference]

- scenario: riunione-lavoro
  level: B2
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Direi bene. La campagna pubblicitaria è partita lunedì e i primi dati sono incoraggianti."
    - tutor: "Che bella notizia! Ci sono stati problemi?"
      goals: [update]
    - learner: "Uno sì. Il fornitore dei video ci ha consegnato il materiale con una settimana di ritardo, perché il loro tecnico si ammalava."
      errors: [tense-aspect]
    - tutor: "«Il tecnico si ammalava»? La malattia viene prima della consegna in ritardo: quale tempo indica un fatto avvenuto ancora prima?"
      prompt: {text: "si ammalava", tags: [tense-aspect]}
    - learner: "Sì, si ammalava proprio la settimana prima."
      errors: [tense-aspect]
    - tutor: "Capisco, se il tecnico si era ammalato la settimana prima, il ritardo era difficile da evitare. Come facciamo la prossima volta?"
      recast: {text: "si ammalava", fix: "si era ammalato", tags: [tense-aspect]}
      goals: [problem]
    - learner: "Per evitare che succeda di nuovo, proporrei di lavorare con due fornitori invece di uno."
    - tutor: "Mi sembra ragionevole, anche se costa di più. Hai già chiesto qualche prezzo?"
      goals: [proposal]
    - learner: "Sì. Ieri ho sentito un'altra agenzia: mi hanno detto che possono consegnare in cinque giorni."
    - tutor: "Cinque giorni sono pochi, interessante. Allora prepara un confronto tra le due offerte."
    - learner: "D'accordo. Ah, un'ultima cosa: stamattina, quando ho controllato il budget, ho visto che qualcuno ha già speso il trenta per cento."
      errors: [tense-aspect]
    - tutor: "Davvero? Però «ha già speso»: la spesa viene prima del tuo controllo di stamattina. Come lo diresti?"
      prompt: {text: "ha già speso", tags: [tense-aspect]}
    - learner: "Sì, qualcuno ha già speso il trenta per cento del totale."
      errors: [tense-aspect]
    - tutor: "Se qualcuno aveva già speso il trenta per cento, lo controllo io con il direttore. Tu mandami il confronto entro giovedì, va bene?"
      recast: {text: "ha già speso", fix: "aveva già speso", tags: [tense-aspect]}
      goals: [deadline]

- scenario: arte-mostra
  level: B2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce molto. Quei colori scuri mi mettono un po' di inquietudine."
    - tutor: "Anche a me. Che cosa vedi, esattamente?"
      goals: [react]
    - learner: "Una donna alla finestra che guarda il mare in tempesta. Sembra che aspetti qualcuno."
    - tutor: "È proprio così. Secondo te chi aspetta?"
      goals: [describe]
    - learner: "Forse il marito pescatore. Mi ricorda mia madre: quando mio padre usciva in barca, lei è rimasta alla finestra per ore."
      errors: [tense-aspect]
    - tutor: "Che ricordo! Ma «quando usciva in barca, lei è rimasta»: succedeva ogni volta, non una volta sola."
      prompt: {text: "è rimasta alla finestra", tags: [tense-aspect]}
    - learner: "Sì, lei è rimasta alla finestra ogni volta."
      errors: [tense-aspect]
    - tutor: "Che immagine forte: tua madre rimaneva alla finestra ogni volta, ad aspettarlo. Forse il pittore ha voluto raccontare proprio questo."
      recast: {text: "è rimasta alla finestra", fix: "rimaneva alla finestra", tags: [tense-aspect]}
      goals: [interpret]
    - learner: "Può darsi. Mi ricorda anche Turner: quando sono andato alla sua mostra a Londra, i biglietti sono già finiti da settimane."
      errors: [tense-aspect]
    - tutor: "«I biglietti sono già finiti»: erano spariti prima del tuo arrivo. Che tempo usiamo per questo passato più lontano?"
      prompt: {text: "sono già finiti", tags: [tense-aspect]}
    - learner: "Sì, i biglietti sono già finiti, ma un amico me ne ha regalato uno."
      errors: [tense-aspect]
    - tutor: "Che fortuna, se i biglietti erano già finiti! E che differenza vedi tra Turner e questo pittore?"
      recast: {text: "sono già finiti", fix: "erano già finiti", tags: [tense-aspect]}
    - learner: "Turner usava colori più chiari, quasi d'oro. Qui invece la luce è quasi assente."
    - tutor: "Verissimo: due modi molto diversi di raccontare lo stesso mare."
      goals: [compare]

- scenario: colloquio-promozione
  level: B2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Lavoro qui da cinque anni e vorrei parlare del mio ruolo."
    - tutor: "Certo, mi dica pure."
    - learner: "Quest'anno ho seguito il progetto con il cliente tedesco. Mentre ci ho lavorato, ho fatto tre viaggi a Monaco."
      errors: [tense-aspect]
    - tutor: "Lo so, è stato un anno intenso. Ma «mentre ci ho lavorato»: è il periodo in corso dentro cui ci sono stati i viaggi."
      prompt: {text: "Mentre ci ho lavorato", tags: [tense-aspect]}
    - learner: "Mentre ci lavoravo, ho fatto tre viaggi a Monaco, e ho conosciuto tutto il loro gruppo."
    - tutor: "E com'è andata, alla fine?"
    - learner: "Bene. Quando ho preso il progetto, il cliente ha già minacciato di cambiare fornitore."
      errors: [tense-aspect]
    - tutor: "«Il cliente ha già minacciato»: la minaccia viene prima del momento in cui lei ha preso il progetto."
      prompt: {text: "ha già minacciato", tags: [tense-aspect]}
    - learner: "Sì, ha già minacciato di andare via."
      errors: [tense-aspect]
    - tutor: "Ricordo bene: il cliente aveva già minacciato di cambiare fornitore, e lei l'ha convinto a restare. Oggi ordina il doppio."
      recast: {text: "ha già minacciato", fix: "aveva già minacciato", tags: [tense-aspect]}
      goals: [results]
    - learner: "Esatto. Per questo vorrei chiederle una promozione a responsabile di reparto."
    - tutor: "Capisco. I risultati ci sono, ma quest'anno il budget è molto limitato."
      goals: [request]
    - learner: "Lo so. Però l'anno scorso, quando Laura è diventata responsabile, il budget è stato altrettanto limitato."
      errors: [tense-aspect]
    - tutor: "«Il budget è stato altrettanto limitato»? Qui descrive la situazione di quel momento."
      prompt: {text: "è stato altrettanto limitato", tags: [tense-aspect]}
    - learner: "Sì, il budget è stato altrettanto limitato, eppure l'azienda ha trovato una soluzione."
      errors: [tense-aspect]
    - tutor: "Ha ragione, anche allora il budget era altrettanto limitato. Facciamo così: le propongo il ruolo da gennaio, con un aumento graduale nei primi sei mesi."
      goals: [handle]
      recast: {text: "è stato altrettanto limitato", fix: "era altrettanto limitato", tags: [tense-aspect]}
    - learner: "Mi sembra un'ottima soluzione. Da quando lavoro qui, mi sono sempre trovato bene."
    - tutor: "Ne sono felice. Preparo una proposta precisa e ne parliamo venerdì."
      goals: [next-steps]

- scenario: recensione-ristorante
  level: B2
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, purtroppo. Abbiamo aspettato i primi per più di un'ora, e quando sono arrivati erano freddi."
    - tutor: "Mi dispiace moltissimo. Può raccontarmi meglio cosa è successo?"
      goals: [complain]
    - learner: "Avevamo prenotato per le otto e mezza, ma quando siamo arrivati, il tavolo non è stato pronto."
      errors: [tense-aspect]
    - tutor: "«Il tavolo non è stato pronto»? Descrive quello che avete trovato al vostro arrivo."
      prompt: {text: "non è stato pronto", tags: [tense-aspect]}
    - learner: "Sì, il tavolo non è stato pronto, e nessuno ci ha detto niente."
      errors: [tense-aspect]
    - tutor: "Capisco: il tavolo non era pronto e nessuno vi ha avvisati. Non doveva succedere, e me ne scuso."
      recast: {text: "non è stato pronto", fix: "non era pronto", tags: [tense-aspect]}
      goals: [detail]
    - learner: "Poi il cameriere ha portato il vino sbagliato: avevamo ordinato un rosso e ci ha portato un bianco."
    - tutor: "Una serata davvero difficile. Che cosa si sarebbe aspettata da noi?"
    - learner: "Un po' di attenzione. Siamo venuti perché un amico ci aveva detto che il servizio sarà eccellente."
      errors: [tense-aspect]
    - tutor: "«Ci aveva detto che il servizio sarà»? Il verbo principale è nel passato: il resto della frase deve seguirlo."
      prompt: {text: "sarà eccellente", tags: [tense-aspect]}
    - learner: "Sì, il nostro amico ci aveva detto che il servizio sarà eccellente."
      errors: [tense-aspect]
    - tutor: "Capisco: vi aveva detto che il servizio era eccellente, e di solito lo è, glielo assicuro. Ieri sera mancavano due camerieri: per scusarci, vorremmo offrirvi una cena completa."
      recast: {text: "sarà eccellente", fix: "era eccellente", tags: [tense-aspect]}
      goals: [expectation]
    - learner: "Capisco, grazie. Accettiamo volentieri: torniamo sabato prossimo."
    - tutor: "Benissimo, vi preparo io il tavolo migliore. A sabato, e grazie della pazienza."
      goals: [resolve]

- scenario: trattativa-affitto
  level: B2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto. È luminoso e la zona è comoda per il mio lavoro."
    - tutor: "Ne sono contento. Ci sono già altre persone interessate, quindi le conviene decidere in fretta."
      goals: [interest]
    - learner: "Capisco, però il prezzo mi sembra alto. L'appartamento dove abitavo prima è stato più grande e costava duecento euro in meno."
      errors: [tense-aspect]
    - tutor: "«È stato più grande»? Sta descrivendo la casa di prima, non raccontando un fatto."
      prompt: {text: "è stato più grande", tags: [tense-aspect]}
    - learner: "Sì, l'appartamento di prima è stato più grande e più economico."
      errors: [tense-aspect]
    - tutor: "Capisco, il suo appartamento di prima era più grande, ma qui i prezzi sono saliti molto negli ultimi due anni. Quanto sarebbe disposto a pagare?"
      recast: {text: "è stato più grande", fix: "era più grande", tags: [tense-aspect]}
    - learner: "Novecento al mese. Ieri ho visto un annuncio simile, ma quando ho chiamato, qualcuno l'ha già affittato."
      errors: [tense-aspect]
    - tutor: "«Qualcuno l'ha già affittato»: l'affitto è avvenuto prima della sua telefonata. Che tempo serve?"
      prompt: {text: "l'ha già affittato", tags: [tense-aspect]}
    - learner: "Sì, quando ho chiamato, qualcuno l'ha già affittato."
      errors: [tense-aspect]
    - tutor: "Eh, quando ha chiamato qualcuno l'aveva già affittato: il mercato è veloce. Posso arrivare a novecentocinquanta."
      recast: {text: "l'ha già affittato", fix: "l'aveva già affittato", tags: [tense-aspect]}
      goals: [negotiate]
    - learner: "Va bene, se il proprietario cambia la lavatrice. Quando l'ho provata, faceva un rumore terribile."
    - tutor: "Mi sembra giusto: gliela faccio sostituire prima del suo ingresso."
      goals: [conditions]
    - learner: "Perfetto. Il mio contratto attuale finisce a fine mese: potrei entrare il primo novembre?"
    - tutor: "Sì, nessun problema. Preparo il contratto e ci vediamo giovedì per firmare."
      goals: [conclude]

- scenario: burocrazia-residenza
  level: B2
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Vorrei chiedere la residenza: mi sono trasferita qui da Londra tre mesi fa."
    - tutor: "Benissimo. Ha con sé il passaporto e il contratto d'affitto?"
      goals: [request]
    - learner: "Sì, eccoli. Ho anche il codice fiscale: l'ho richiesto appena sono arrivata."
    - tutor: "Grazie. Però vedo che il contratto non risulta registrato."
      goals: [documents]
    - learner: "Davvero? Il proprietario mi ha assicurato che lo registrava la settimana dopo."
      errors: [tense-aspect]
    - tutor: "«Mi ha assicurato che lo registrava»? La registrazione era un'azione futura rispetto a quel momento: quale forma usiamo?"
      prompt: {text: "lo registrava", tags: [tense-aspect]}
    - learner: "Sì, mi ha detto che lo registrava subito."
      errors: [tense-aspect]
    - tutor: "Capisco: le aveva detto che l'avrebbe registrato, ma qui non risulta ancora. Succede più spesso di quanto si pensi."
      recast: {text: "lo registrava", fix: "l'avrebbe registrato", tags: [tense-aspect]}
      goals: [problem]
    - learner: "Che pasticcio! Quando ho firmato, ero sicura che è tutto in regola."
      errors: [tense-aspect]
    - tutor: "Lo immagino. Però «ero sicura che è tutto in regola»: la frase principale è al passato. Che cosa cambia nella seconda parte?"
      prompt: {text: "è tutto in regola", tags: [tense-aspect]}
    - learner: "Sì, ero sicura che è tutto in regola, perché lui è molto gentile."
      errors: [tense-aspect]
    - tutor: "Capisco, era sicura che fosse tutto in regola. Non si preoccupi, si risolve: il proprietario deve registrarlo entro trenta giorni dalla firma."
      recast: {text: "è tutto in regola", fix: "fosse tutto in regola", tags: [tense-aspect]}
    - learner: "Allora gli telefono oggi stesso. Cosa devo fare dopo?"
    - tutor: "Quando avrà la ricevuta della registrazione, torni qui con una copia: poi in circa un mese passerà un vigile per il controllo."
      goals: [next]

# Set u-right-c1c2, file 6: C2, poetry, ethics, translation, satire, art and books. Correct
# concessives, si dice che + subjunctive, segnamela, preferisco che me lo dica tu, rileggersi;
# subtle slips (agreement, calque, spelling of qual è, imperative, hypothetical, article, verb form).
- scenario: poesia-montale
  level: C2
  persona: es-f-teacher
  history: [subject-verb-agreement]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una sensazione di aridità, quasi fisica. È come se Montale avesse voluto togliere alla poesia ogni consolazione: non c'è un io che si lamenta, ci sono solo cose che soffrono. E questo, paradossalmente, mi ha commossa più di qualsiasi lamento."
  - tutor: "«Cose che soffrono»: ha toccato il cuore della sua poetica. Quale immagine l'ha colpita di più?"
    goals: [first-reading]
  - learner: "Mi ha colpito soprattutto le tre immagini della prima strofa, una dopo l'altra: il rivo strozzato, la foglia riarsa, il cavallo stramazzato. Sono tre regni diversi, l'acqua, il vegetale, l'animale, come se il male attraversasse tutta la natura."
    errors: [subject-verb-agreement]
  - tutor: "Analisi finissima. Ma all'inizio: «mi ha colpito le tre immagini». Chi è il soggetto, e quindi come va il verbo?"
    prompt: {text: "Mi ha colpito soprattutto le tre immagini", tags: [subject-verb-agreement]}
  - learner: "Ah, certo: mi hanno colpito soprattutto le tre immagini. E il cavallo stramazzato è la più violenta, perché è l'unica in cui il dolore ha un corpo."
  - tutor: "Esatto, il corpo che cade. E il suono? Ha notato qualcosa nelle parole che sceglie?"
    goals: [image]
  - learner: "Sì, è pieno di consonanti doppie e di gruppi aspri: strozzato, incartocciarsi, stramazzato. Leggendole ad alta voce si sente quasi lo sforzo, come se la lingua stessa facesse fatica. Nella seconda strofa, invece, il suono si distende, con parole più lunghe e aperte."
  - tutor: "La lingua che fa fatica: bellissimo. E il senso complessivo? Che cosa contrappone Montale al male di vivere?"
    goals: [sound]
  - learner: "La divina Indifferenza: la statua, la nuvola, il falco alto levato. Non è un bene che consola, ma una distanza dal dolore, quasi un'anestesia. Credo che sia una delle risposte più amare e più oneste che la poesia del Novecento abbia dato."
  - tutor: "Amara e onesta: non avrei saputo dirlo meglio. Per la prossima volta legga «Meriggiare pallido e assorto», e ne riparliamo."
    goals: [meaning]

- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [spelling]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Dubiti pure, professore, è il suo mestiere. La mia tesi è che la responsabilità presupponga la capacità di rispondere delle proprie azioni, cioè di comprenderle e di giustificarle. Una macchina, per quanto sofisticata, esegue: non sceglie, e quindi non può rispondere di nulla."
  - tutor: "Eppure un'auto senza conducente «sceglie» se frenare o sterzare. Che cosa la distingue da un autista?"
    goals: [thesis]
  - learner: "Bisogna distinguere tra decidere e scegliere. L'auto decide, nel senso che seleziona un'opzione in base a dei criteri, ma quei criteri glieli ha dati qualcun altro. L'autista invece sceglie, perché può anche tradire i propri criteri, e proprio per questo è responsabile."
  - tutor: "Distinzione elegante. Ma se nessun essere umano può prevedere ciò che la macchina farà, chi ne risponde?"
    goals: [distinguish]
  - learner: "È l'obiezione più seria, lo riconosco. In quel caso, però, credo che debbano prendere la responsabilità coloro che hanno deciso di mettere in circolazione un sistema imprevedibile. Non è la macchina a essere colpevole, ma chi ha accettato il rischio."
    errors: [word-choice]
  - tutor: "Quindi devono assumersi la responsabilità i produttori, non la macchina: è coerente. Ma così non rischia di rendere colpevoli persone che non hanno fatto nulla di male?"
    goals: [objection]
    recast: {text: "prendere la responsabilità", fix: "assumersi la responsabilità", tags: [word-choice]}
  - learner: "Sì, e su questo le concedo qualcosa. Forse non dovremmo parlare di colpa in senso morale, ma di responsabilità oggettiva, come accade già per i proprietari di animali. Qual'è il limite, però, resta difficile dirlo."
    errors: [spelling]
  - tutor: "Concessione interessante. Una piccola cosa sulla forma scritta, però: guardi come ha scritto «qual'è». Ci vuole davvero l'apostrofo?"
    prompt: {text: "Qual'è", tags: [spelling]}
  - learner: "No, è un troncamento, non un'elisione: qual è, senza apostrofo. Lo sapevo, ma la mano va da sola."
  - tutor: "Esatto, capita anche a molti italiani. Allora, per concludere: dove arriva la sua tesi, dopo le mie obiezioni?"
    goals: [concede]
  - learner: "Direi così: una macchina non può essere moralmente responsabile, ma può essere l'occasione di una responsabilità umana più ampia, distribuita tra chi la progetta, chi la vende e chi la usa. Se lo dimenticassimo, finiremmo per usare le macchine come alibi."
  - tutor: "Le macchine come alibi: una conclusione con cui la lascio volentieri vincere, per oggi."
    goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  history: [imperative-form]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Me l'aspettavo, purtroppo. Ho cercato di rendere la frase più fluida, perché l'originale inglese è pieno di ripetizioni, e temevo che il lettore italiano le prendesse per sciatteria. Ma forse, togliendole, ho tolto anche il ritmo dell'autore."
  - tutor: "Esatto: quelle ripetizioni sono la sua voce. Che alternative vedi?"
    goals: [problem]
  - learner: "Ne vedo due. Potrei ripristinare le ripetizioni tali e quali, accettando che in italiano suonino un po' più insistite, oppure sostituirle con un ritmo equivalente, per esempio con delle anafore. La seconda strada mi tenta di più, ma temo di tradire l'autore una seconda volta."
  - tutor: "Ti tenta perché ti fa sentire autore. Resta fedele. E a pagina trentadue, «sensible» come l'hai tradotto?"
    goals: [options]
  - learner: "Con «sensibile», e mi rendo conto adesso che è sbagliato: nel contesto vuol dire «assennato», «ragionevole». Non ti preoccupi, la correggo stasera stessa, insieme a tutte le ripetizioni che ho eliminato."
    errors: [imperative-form]
  - tutor: "Bene che te ne sia accorto. Ma «non ti preoccupi»: a me dai del tu, quindi come suona l'imperativo negativo?"
    prompt: {text: "Non ti preoccupi", tags: [imperative-form]}
  - learner: "Giusto: non preoccuparti, la correggo stasera stessa. All'imperativo negativo, con il tu, ci vuole l'infinito."
  - tutor: "Esatto. Allora: ripetizioni ripristinate e «sensible» corretto. Quando mi mandi la nuova versione?"
    goals: [false-friend]
  - learner: "Te la mando venerdì mattina, così hai il fine settimana per rileggerla. E se trovassi ancora qualche frase troppo levigata, segnamela pure senza pietà: preferisco che me lo dica tu adesso piuttosto che un recensore dopo."
  - tutor: "Senza pietà, come sempre. Venerdì mattina, allora: e lascia parlare l'autore."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-traveller
  history: [hypothetical]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Lo ammetto, mi hai beccato. Avevo capito che parlava della panna, ma non perché fosse così grave. Se l'avrei capita, avrei riso anch'io, te lo giuro: di solito rido persino alle battute brutte."
    errors: [hypothetical]
  - tutor: "Persino a quelle brutte, lo so bene! Ma «se l'avrei capita»: dopo il se, per un'ipotesi nel passato, che cosa ci vuole?"
    prompt: {text: "Se l'avrei capita", tags: [hypothetical]}
  - learner: "Hai ragione: se l'avessi capita, avrei riso anch'io. Ma spiegamela, dai: che c'entra la panna?"
  - tutor: "Esatto. La panna nella carbonara, per un romano, è un sacrilegio, e il ministro aveva detto in TV che la mette sempre. Mezzo Paese si è indignato."
  - learner: "Adesso è chiarissimo! Quindi la battuta era doppia: prendeva in giro il ministro, che ha fatto una gaffe, e anche gli italiani, che si indignano più per la carbonara che per le leggi. È geniale proprio perché colpisce tutti e due."
  - tutor: "Esatto, colpisce tutti. E tu, quali comici guardi?"
    goals: [missed]
  - learner: "In Inghilterra adoro quelli che fanno satira politica in modo asciutto, quasi senza sorridere. Qui invece mi piace molto un comico che fa finta di essere un professore e spiega le notizie con i giochi di parole. L'altra sera ha detto che il governo «ha messo le mani avanti, e poi anche nelle tasche». Ci ho messo un secondo, ma poi ho riso davvero."
  - tutor: "«Le mani avanti» e poi «nelle tasche», bellissima. Ma secondo te, la satira ha dei limiti?"
    goals: [favourite, wordplay]
  - learner: "Secondo me satira deve colpire chi ha il potere, non chi è debole. Ridere di un ministro va benissimo; ridere di un malato o di un povero mi sembra crudeltà, non satira."
    errors: [article-use]
  - tutor: "Ti seguo. Ma «secondo me satira deve colpire»: davanti a un nome usato in senso generale, in italiano che cosa mettiamo?"
    prompt: {text: "satira deve colpire", tags: [article-use]}
  - learner: "La satira, certo: la satira deve colpire chi ha il potere. Anche se ammetto che, quando una battuta è davvero intelligente, a volte fatico a indignarmi."
  - tutor: "Esatto, dal basso verso l'alto. E sull'indignazione che non arriva, confesso che capita anche a me."
    goals: [limits]

- scenario: arte-mostra
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi lascia senza fiato, e non in senso positivo. Il sangue che schizza, le braccia di Giuditta tese come quelle di un macellaio, la serva che tiene fermo Oloferne: è una scena di una violenza quasi insostenibile. Eppure non riesco a distogliere lo sguardo."
  - tutor: "È l'effetto che voleva Artemisia. Guarda bene i volti: che cosa vedi?"
    goals: [react]
  - learner: "Giuditta non sembra arrabbiata, ma concentrata, come una che sta facendo un lavoro difficile e vuole farlo bene. Oloferne invece ha gli occhi spalancati, e si capisce che si è svegliato troppo tardi. La luce arriva da sinistra e colpisce solo i corpi, mentre lo sfondo resta completamente nero."
  - tutor: "Concentrata, sì, è la parola giusta. E secondo te perché la dipinge così?"
    goals: [describe]
  - learner: "Si dice che Artemisia l'ha dipinto pochi anni dopo il processo contro l'uomo che l'aveva violentata, e molti critici ci vedono una specie di vendetta. Io però credo che sia riduttivo leggerlo solo così: è anche un modo di mostrare una donna che agisce, invece di subire."
    errors: [subjunctive-use]
  - tutor: "Lettura molto interessante. Ma «si dice che Artemisia l'ha dipinto»: dopo si dice che, quale modo è più adatto?"
    prompt: {text: "Si dice che Artemisia l'ha dipinto", tags: [subjunctive-use]}
  - learner: "Il congiuntivo: si dice che Artemisia l'abbia dipinto pochi anni dopo il processo. Ed è un'informazione che non si può verificare del tutto, quindi il congiuntivo ci sta ancora meglio."
  - tutor: "Esatto, proprio per questo. Una donna che agisce: mi piace. L'hai mai confrontata con la Giuditta di Caravaggio?"
    goals: [interpret]
  - learner: "Sì, l'ho vista a Roma l'anno scorso. Quella di Caravaggio sembra quasi disgustata, tiene la spada lontana da sé come se avesse paura di sporcarsi. Quella di Artemisia, invece, si rimbocca le maniche: è molto più fisica e, se vuoi, molto più credibile."
  - tutor: "Una che si sporca le mani e una che ha paura di farlo: hai riassunto in due frasi una lezione intera di storia dell'arte."
    goals: [compare]

- scenario: club-lettura
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Ce l'ho fatta, ma ti confesso che sono tra quelli a cui non è piaciuto. Non che sia scritto male, anzi: è che ho avuto la sensazione che l'autrice volesse metterci dentro tutto, la guerra, l'emigrazione, il boom, le lotte operaie, e che alla fine non approfondisse niente."
  - tutor: "Davvero? A me proprio quella ricchezza ha conquistato. Quale personaggio ti ha convinto meno?"
    goals: [impression]
  - learner: "Il padre, Ettore. Per trecento pagine è un uomo di principi, che rifiuta perfino un posto alla Fiat pur di non tradire i compagni, e poi d'un tratto, senza che ci venga spiegato perché, diventa un piccolo imprenditore avido. Se l'autrice ci avesse mostrato il momento del cambiamento, l'avrei trovato credibile."
  - tutor: "Ma il salto è voluto! È il boom economico che cambia le persone senza chiedere permesso."
    goals: [character]
  - learner: "Può darsi, e capisco l'intenzione. Però un conto è suggerire un cambiamento, un altro è saltarlo a piè pari. Lo stile, poi, mi è sembrato un po' monotono: frasi brevi, tutte uguali, che alla lunga mi hanno stancato più della trama."
  - tutor: "Lo stile asciutto a me è sembrato un pregio. Allora non lo consiglieresti a nessuno?"
    goals: [style]
  - learner: "Non direi a nessuno. Lo consiglierei a chi conosce poco la storia italiana del dopoguerra, perché come affresco funziona benissimo. A chi cerca personaggi complessi, invece, consiglierei di rileggersi la Ginzburg."
  - tutor: "Hai toccato un nervo scoperto: la Ginzburg è il mio grande amore. Il mese prossimo la proponiamo al gruppo."
    goals: [recommend]

- scenario: medico-specialista
  level: C2
  persona: es-f-teacher
  history: [verb-form]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Nel complesso bene: le palpitazioni sono diminuite molto da quando prendo la terapia. Mi sento solo un po' più stanca del solito, e la sera mi dolono le gambe, soprattutto le caviglie."
    errors: [verb-form]
  - tutor: "Mi fa piacere per le palpitazioni. Ma «mi dolono le gambe»: dolere è irregolare, come fa alla terza persona plurale?"
    prompt: {text: "mi dolono", tags: [verb-form]}
  - learner: "Ha ragione, è irregolare: mi dolgono le gambe. Come valere, valgono."
  - tutor: "Esatto. Le caviglie gonfie possono dipendere dal farmaco. In famiglia ci sono stati altri problemi di cuore o di pressione?"
    goals: [symptoms]
  - learner: "Mia madre ha sempre avuto la pressione alta, e mia nonna è morta di ictus a settantacinque anni. Mio fratello, invece, che pure fuma come un turco, ha un cuore da atleta: la genetica, evidentemente, ha un suo senso dell'umorismo."
  - tutor: "La genetica sa essere ironica, sì. Gli ultimi esami mostrano una pressione un po' alta: centocinquanta su novanta."
    goals: [history]
  - learner: "Centocinquanta mi sembra tanto. Potrebbe dipendere dal fatto che in questi giorni sono un po' constipata? Ho preso freddo al mercato domenica, e da allora ho il naso chiuso e un po' di tosse."
    errors: [false-friend]
  - tutor: "Se è raffreddata, la pressione può alzarsi un po', soprattutto con certi spray per il naso. Ne sta usando qualcuno?"
    goals: [understand]
    recast: {text: "constipata", fix: "raffreddata", tags: [false-friend]}
  - learner: "Sì, uno spray che mi ha consigliato il farmacista. Non sapevo che potesse alzare la pressione: se l'avessi saputo, gliel'avrei chiesto prima. Lo sospendo subito, se lei è d'accordo."
  - tutor: "Lo sospenda pure e usi una soluzione salina. Per le caviglie riduciamo un po' la dose: se tra due settimane non migliora, cambiamo farmaco."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-m-heritage
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Abbiamo le idee abbastanza chiare: vorremmo sposarci in Puglia, in una masseria, a fine maggio. Mia moglie, cioè, la mia futura moglie, scusi, ha dei parenti a Ostuni, e vorrebbe che la cerimonia si svolgesse all'aperto, tra gli ulivi."
  - tutor: "Tra gli ulivi a maggio: un sogno. Quanti invitati, e con che budget?"
    goals: [vision]
  - learner: "Centoventi invitati, più o meno, e un budget di trentacinquemila euro. So che per la Puglia in alta stagione non è molto, ma preferiremmo rinunciare a qualcosa piuttosto che indebitarci per una giornata, per quanto bella."
  - tutor: "È fattibile. Ho trovato due masserie: una vicino al mare, più cara, e una nell'interno, più economica ma con un uliveto splendido."
    goals: [budget]
  - learner: "Quella nell'interno mi sembra più adatta a noi, anche perché la spiaggia a fine maggio è un'incognita, con il vento. E poi, se risparmiassimo sulla location, potremmo permetterci un'orchestra dal vivo, a cui la mia fidanzata tiene moltissimo."
  - tutor: "Ottima scelta. Ora il catering: vuole che sia io a mandargli la lista degli invitati con le intolleranze?"
    goals: [choices]
  - learner: "No, grazie, la lista gli la mandiamo noi, perché ci sono molte allergie e preferiamo seguirle personalmente. Però le chiederei una cosa: che ogni variazione del preventivo ci venga comunicata per iscritto."
    errors: [combined-pronouns]
  - tutor: "Condizione legittima. Prima però guardiamo «gli la mandiamo»: quei due pronomi, uniti, che forma prendono?"
    prompt: {text: "gli la mandiamo", tags: [combined-pronouns]}
  - learner: "Sì, giusto, la lista gli la mandiamo noi la settimana prossima, appena abbiamo tutte le conferme."
    errors: [combined-pronouns]
  - tutor: "D'accordo, gliela mandate voi la settimana prossima. E ogni variazione del preventivo ve la comunico per iscritto, ha la mia parola."
    goals: [conditions]
    recast: {text: "gli la", fix: "gliela", tags: [combined-pronouns]}
  - learner: "Perfetto, mi sembra tutto chiarissimo. Allora aspettiamo il contratto e una data per andare a vedere la masseria."
  - tutor: "Le mando tutto entro venerdì. E si prepari: a maggio, tra quegli ulivi, piangeranno anche i camerieri."

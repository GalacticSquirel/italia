# Set u-right-c1c2, file 4: C1, stories, interviews and work. Correct pluperfect, prima che +
# subjunctive, ne with agreement, se dovessero; subtle slips (tense, reflexive, adjective agreement,
# gender, participle form, future form, demonstrative, conditional) and two failed prompts.
- scenario: modi-di-dire
  level: C1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lasciamo perdere, è stata una giornata da dimenticare. Stamattina la sveglia non è suonata, perché ieri sera mi ero dimenticata di ricaricare il telefono. Mi sono vestita di corsa e sono uscita senza neanche fare colazione."
  - tutor: "Cominciamo bene! E poi?"
  - learner: "Poi, quando sono arrivata in stazione, il treno delle otto è già partito, e quello dopo era stato soppresso per uno sciopero. Insomma, sono rimasta lì come una cretina, con il cornetto in mano."
    errors: [tense-aspect]
  - tutor: "Ahia. Ma aspetta: «quando sono arrivata, il treno è già partito». Le due cose succedono insieme, o una viene prima dell'altra?"
    prompt: {text: "il treno delle otto è già partito", tags: [tense-aspect]}
  - learner: "Una viene prima, sì: il treno è già partito da cinque minuti quando sono arrivata. Alla fine ho preso un taxi fino a Bergamo."
    errors: [tense-aspect]
  - tutor: "Quindi il treno era già partito da cinque minuti: beffa doppia! E il taxi, quanto ti è costato?"
    goals: [tell]
    recast: {text: "il treno è già partito", fix: "il treno era già partito", tags: [tense-aspect]}
  - learner: "Novanta euro, un occhio della faccia! E il tassista, per giunta, si è perso due volte perché non si fidava del navigatore."
    errors: [word-choice]
  - tutor: "Novanta euro, un occhio della testa davvero! Eh, piove sempre sul bagnato."
    recast: {text: "un occhio della faccia", fix: "un occhio della testa", tags: [word-choice]}
  - learner: "«Piove sul bagnato», non lo conoscevo, ma rende perfettamente l'idea! In spagnolo diciamo che le disgrazie non vengono mai da sole. Comunque la colpa è un po' mia: se avessi caricato il telefono, niente di tutto questo sarebbe successo."
  - tutor: "Un po' tua e un po' della sfortuna, diciamo metà e metà. E la morale qual è?"
    goals: [react, blame]
  - learner: "La morale è che d'ora in poi metterò due sveglie, una sul telefono e una di quelle vecchie, che fanno un rumore infernale. Come dite voi, meglio prevenire che curare!"
  - tutor: "Meglio prevenire che curare, brava! E adesso brindiamo, che te lo sei meritato."
    goals: [moral]

- scenario: intervista-podcast
  level: C1
  persona: es-f-erasmus
  history: [reflexive]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Ciao a tutti! Sono arrivata per amore, come in un film: ho conosciuto il mio compagno a Barcellona, dove faceva l'Erasmus, e dopo due anni di aerei avanti e indietro ho deciso di trasferirmi a Lecce. Oggi abbiamo un piccolo forno in centro."
  - tutor: "Dall'Erasmus al forno, che bel percorso. Che cosa ti ha sorpresa di più, all'inizio?"
    goals: [story]
  - learner: "Gli orari, senza dubbio. In Spagna si cena alle dieci, quindi pensavo che sarebbe stato facile, e invece qui d'estate tutto chiude nel pomeriggio, per la controra. All'inizio mi sembrava assurdo, ma poi ho abituato anch'io a riposare dopo pranzo."
    errors: [reflexive]
  - tutor: "La controra, che bella parola. Ma «ho abituato anch'io»: il verbo è abituarsi, quindi... non manca qualcosa?"
    prompt: {text: "ho abituato", tags: [reflexive]}
  - learner: "Sì: mi sono abituata anch'io a riposare dopo pranzo. Adesso, se non faccio un pisolino, sono di cattivo umore tutta la sera."
  - tutor: "Esatto! La controra conquista tutti, prima o poi. C'è invece qualcosa che ti piace meno?"
    goals: [culture-shock]
  - learner: "Una cosa che trovo ancora molto strano è che i giovani se ne vadano quasi tutti al Nord appena finiscono la scuola. I nostri due ragazzi in laboratorio sono un'eccezione, e ogni anno temo che anche loro decidano di partire."
    errors: [adjective-agreement]
  - tutor: "Un tema serio. Ma «una cosa che trovo molto strano»: l'aggettivo si riferisce a «cosa», giusto?"
    prompt: {text: "molto strano", tags: [adjective-agreement]}
  - learner: "Giusto: una cosa che trovo molto strana. È un peccato, perché qui la qualità della vita è altissima e il lavoro, volendo, ci sarebbe."
  - tutor: "Esatto. È una ferita aperta del Sud, purtroppo. E a chi pensa di trasferirsi qui, che cosa diresti?"
    goals: [critique]
  - learner: "Di venire prima in inverno, non in agosto, per vedere com'è davvero la vita di tutti i giorni. E di imparare qualche parola di dialetto: le signore al mercato ti guardano in un altro modo, quando le saluti come si deve."
  - tutor: "Consiglio d'oro: prima l'inverno, poi il dialetto. Grazie di essere passata, e un saluto al forno!"
    goals: [advice]

- scenario: notizie-attualita
  level: C1
  persona: en-f-professional
  history: [noun-gender]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Sì, l'ho letta ieri sera sul giornale, e devo dire che mi riguarda da vicino. Come sai, ho ereditato un bilocale a Bologna da mia zia, e da due anni lo affitto ai turisti. Se ho capito bene, d'ora in poi non potrò affittarlo per più di novanta notti all'anno."
  - tutor: "Ah già, il bilocale della zia! Quindi tu stai dalla parte dei proprietari?"
    goals: [summarise]
  - learner: "Non proprio, la cosa è più complicata. Da un lato mi dispiace perdere un'entrata, dall'altro capisco benissimo chi non trova più casa: mia nipote studia a Bologna e paga seicento euro per una stanza. Penso che la legge sia giusta, anche se arriva tardi e con regole un po' confuse."
  - tutor: "Confuse in che senso? I giornali le spiegano in modi molto diversi."
    goals: [opinion]
  - learner: "Infatti. Su un quotidiano ho letto che i controlli saranno affidati ai Comuni, mentre un altro sostiene che la sistema dei controlli sarà nazionale, con una banca dati unica. Uno dei due si sbaglia, ovviamente, o forse non lo sanno ancora nemmeno al ministero."
    errors: [noun-gender]
  - tutor: "Chi avrà ragione? Ma prima rileggi «la sistema»: finisce in -a, d'accordo, però di che genere è?"
    prompt: {text: "la sistema", tags: [noun-gender]}
  - learner: "Sì, la sistema nazionale, con una banca dati unica per tutta l'Italia."
    errors: [noun-gender]
  - tutor: "Ah, il sistema nazionale con la banca dati unica: l'ho letto anch'io sul sito del ministero, quindi mi sembra la versione più credibile."
    goals: [sources]
    recast: {text: "la sistema nazionale", fix: "il sistema nazionale", tags: [noun-gender]}
  - learner: "Speriamo. Quanto a me, credo che alla fine affitterò il bilocale a uno studente con un contratto normale. Guadagnerò un po' meno, ma non dovrò più cambiare le lenzuola ogni due giorni, e forse dormirò anche meglio la notte."
  - tutor: "Uno studente in più con un tetto e una proprietaria più serena: mi sembra un ottimo affare. Dai, il caffè lo offro io."
    goals: [consequences]

- scenario: assicurazione-sinistro
  level: C1
  persona: es-m-worker
  history: [past-participle-form]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Il mio caso è un po' particolare. Stamattina ho trovato la mia macchina, che era parcheggiata sotto casa, con lo specchietto rotto e una bella ammaccatura sulla portiera. Chi l'ha colpita, però, mi ha lasciato un biglietto con nome e numero di telefono, il che di questi tempi è quasi un miracolo."
  - tutor: "Un automobilista onesto, ci fa piacere sentirlo. L'ha già chiamato?"
    goals: [what]
  - learner: "Sì, l'ho chiamato subito. È un signore anziano molto dispiaciuto: mi ha spiegato che stava facendo manovra e che non si era accorto della distanza. Si è detto disposto a firmare tutto quello che serve."
  - tutor: "Bene. Allora potete compilare insieme il modulo di constatazione amichevole. Ci sono testimoni o foto?"
    goals: [responsibility]
  - learner: "Testimoni no, perché è successo di notte, ma ho fatto una decina di foto stamattina. Il signore è stato così gentile che è rimanuto con me mezz'ora, sotto la pioggia, finché non abbiamo finito di compilare il modulo."
    errors: [past-participle-form]
  - tutor: "Davvero gentile. Ma «è rimanuto»: rimanere, al passato, fa davvero così?"
    prompt: {text: "è rimanuto", tags: [past-participle-form]}
  - learner: "No, scusi: è rimasto con me mezz'ora. Il modulo l'abbiamo firmato tutti e due, e glielo posso mandare oggi stesso."
  - tutor: "Perfetto. Me lo mandi con le foto, e indichi anche il numero di polizza del signore."
    goals: [documents]
  - learner: "D'accordo. E i tempi? Vorrei sapere quanto ci vorrà prima che il carrozziere possa cominciare, perché la macchina mi serve per andare al lavoro e non vorrei restare a piedi troppo a lungo."
  - tutor: "Di solito un nostro tecnico passa a vedere la macchina entro una settimana, e dopo il carrozziere può partire subito. Se le serve, la polizza le dà diritto anche a un'altra auto nel frattempo."
    goals: [next]

- scenario: reclamo-comune
  level: C1
  persona: en-m-heritage
  history: [future-form]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Vengo per il parco giochi di via Verdi, quello dietro la scuola elementare. Da settembre l'altalena è legata con un nastro bianco e rosso, e lo scivolo è così arrugginito che i bambini si graffiano le gambe ogni volta che ci salgono."
  - tutor: "Lo conosco, ci passo spesso. Ha già scritto all'ufficio del verde pubblico?"
    goals: [describe]
  - learner: "Ho scritto due volte e non ho mai ricevuto nessuna risposta, neanche un messaggio automatico. Capisco che i soldi siano pochi, ma un parco giochi in cui i bambini si fanno male è peggio di un parco giochi chiuso. Insisto perché qualcuno venga almeno a vedere."
  - tutor: "Ha ragione, quell'ufficio è indietro con tutte le pratiche. Purtroppo non posso prometterle tempi certi."
    goals: [insist]
  - learner: "Mi permetta però di farle notare che il Comune è responsabile della sicurezza delle aree gioco. Se un bambino si facesse male seriamente, la responsabilità sarebbe vostra, e credo che nessuno voglia arrivare a quel punto."
  - tutor: "Su questo non posso darle torto. Faccio subito una richiesta urgente all'ufficio competente."
    goals: [rights]
  - learner: "La ringrazio. Le lascio il mio numero e la mia mail, così possono avvisarmi quando passano. Nel frattempo tenerò d'occhio la situazione con gli altri genitori, e se cambia qualcosa glielo faccio sapere."
    errors: [future-form]
  - tutor: "Molto utile, grazie. Solo un dettaglio: «tenerò d'occhio». Il futuro di tenere è proprio così?"
    prompt: {text: "tenerò", tags: [future-form]}
  - learner: "Ah, no: terrò d'occhio la situazione. È irregolare, come rimanere, rimarrò."
  - tutor: "Esatto, proprio come rimarrò. Le prometto che entro venerdì qualcuno passa a vedere il parco, e intanto facciamo togliere lo scivolo."
    goals: [commitment]

- scenario: colloquio-lavoro
  level: C1
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono inglese, di Leeds, e mi sono laureata in grafica a Londra. Da quando mi sono trasferita a Milano lavoro in proprio, soprattutto per piccole case editrici, per le quali disegno copertine e impagino libri."
  - tutor: "Copertine di libri, un lavoro affascinante. Da quanto tempo collabora con loro?"
    goals: [intro]
  - learner: "Con la casa editrice più grande ho lavorato da tre anni, quasi senza interruzioni. Mi mandano circa quindici titoli all'anno, e ormai conosco così bene il loro stile che mi lasciano molta libertà."
    errors: [tense-aspect]
  - tutor: "Quindici titoli all'anno, non male. Ma «ho lavorato da tre anni»: se la collaborazione continua ancora oggi, quale tempo ci vuole?"
    prompt: {text: "ho lavorato da tre anni", tags: [tense-aspect]}
  - learner: "Ah, giusto: con loro lavoro da tre anni, e la collaborazione continua. L'ultima copertina che ho disegnato è uscita proprio la settimana scorsa."
  - tutor: "Esatto. Allora mi parli dei suoi punti di forza, e magari di un difetto."
    goals: [experience]
  - learner: "Credo di avere un buon occhio per i dettagli e di saper rispettare le scadenze, anche quando sono strettissime. Il mio difetto è che, lavorando sempre da sola, non sono abituata a ricevere critiche in tempo reale, e all'inizio potrei prenderle un po' troppo sul personale."
  - tutor: "È un difetto onesto, lo apprezzo. E perché ha deciso di lasciare il lavoro in proprio?"
    goals: [strengths]
  - learner: "Perché mi manca lavorare in squadra. Quando ho visto il vostro annuncio, ho mandato subito la mia applicazione, perché i vostri progetti per i musei sono esattamente il tipo di lavoro che vorrei fare."
    errors: [false-friend]
  - tutor: "E la sua candidatura ci ha colpito proprio per l'interesse verso i musei. Ha qualche domanda per me?"
    goals: [why]
    recast: {text: "applicazione", fix: "candidatura", tags: [false-friend]}
  - learner: "Sì, una sola. Vorrei sapere se è previsto un periodo di prova e, nel caso, quanto dura."
  - tutor: "Sì, tre mesi, con un responsabile che la segue passo passo. Le faremo sapere entro la fine del mese."
    goals: [questions]

- scenario: film-libro
  level: C1
  persona: es-f-teacher
  history: [demonstrative]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Questo mese, lo confesso, più che leggere ho guardato: ho visto il film tratto da un romanzo che avevo letto anni fa, sulla vita di un pescatore di Trieste. Il film segue il libro abbastanza fedelmente, anche se hanno tagliato tutta la parte della guerra."
  - tutor: "Succede spesso, quando un libro diventa un film. E il protagonista com'è reso?"
    goals: [summary]
  - learner: "Molto bene, devo dire. Lo interpreta quel attore napoletano che fa sempre la parte del duro, ma questa volta è fragile e quasi timido. Mi ha commosso soprattutto nelle scene con la figlia, che lo tratta con una freddezza terribile."
    errors: [demonstrative]
  - tutor: "Ah, ho capito chi intendi. Ma «quel attore»: davanti a una vocale, quel cambia forma?"
    prompt: {text: "quel attore", tags: [demonstrative]}
  - learner: "Sì, scusa: quell'attore napoletano. È bravissimo, e credo che meriterebbe un premio per questo ruolo."
  - tutor: "Esatto. Un duro che diventa fragile: dev'essere stato difficile. E a te, nel complesso, è piaciuto?"
    goals: [characters]
  - learner: "Mi è piaciuto, ma meno del libro. Nel romanzo i pensieri del pescatore occupavano pagine intere, e nel film invece sembra che il regista non sa come mostrarli, quindi ci sono lunghi silenzi un po' vuoti."
    errors: [subjunctive-use]
  - tutor: "Capisco. Però «sembra che il regista non sa»: dopo sembra che, quale modo usiamo?"
    prompt: {text: "sembra che il regista non sa", tags: [subjunctive-use]}
  - learner: "Giusto: sembra che il regista non sappia come mostrarli. Forse una voce fuori campo avrebbe aiutato."
  - tutor: "Esatto, una voce fuori campo poteva funzionare. A chi lo consiglieresti, il film o il libro?"
    goals: [opinion]
  - learner: "Consiglierei prima il libro e poi il film, a chi ama le storie di mare e di famiglia. A chi non ha mai letto il romanzo, invece, direi di non aspettarsi troppo: senza il libro, il film rischia di sembrare lento."
  - tutor: "Prima il libro e poi il film: lo terrò a mente. Grazie, chi vuole continuare?"
    goals: [recommend]

- scenario: riunione-lavoro
  level: C1
  persona: en-m-heritage
  history: [conditional-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene, direi. Il trasferimento dei dati dei clienti sul nuovo gestionale è quasi finito: ne abbiamo spostati circa novantamila su centomila, e finora non si è perso niente."
  - tutor: "Novantamila su centomila, ottimo. E gli ultimi diecimila?"
    goals: [update]
  - learner: "Ecco, lì c'è un problema. Sono i clienti più vecchi, registrati prima del 2010, e i loro dati sono in un formato che il nuovo sistema non riconosce. Il fornitore dice che serve un programma apposito, e che non sarà pronto prima di tre settimane."
  - tutor: "Tre settimane? Ma il vecchio sistema lo spegniamo a fine mese!"
    goals: [problem]
  - learner: "Appunto. Potressimo tenere acceso il vecchio sistema solo per la consultazione, finché il programma non è pronto. Così nessuno perde l'accesso ai dati, e i nuovi clienti si registrano già sul gestionale."
    errors: [conditional-form]
  - tutor: "Idea sensata. Ma «potressimo»: prova a ripetere il condizionale di potere, con noi."
    prompt: {text: "Potressimo", tags: [conditional-form]}
  - learner: "Sì, potressimo tenerlo acceso, ma solo in lettura, per un mese al massimo."
    errors: [conditional-form]
  - tutor: "Sì, potremmo tenerlo acceso in sola lettura: per un mese non costa quasi nulla. Mi piace."
    goals: [proposal]
    recast: {text: "potressimo", fix: "potremmo", tags: [conditional-form]}
  - learner: "Perfetto. Allora chiedo al fornitore di consegnarci il programma entro il venti, così ci restano dieci giorni per le prove. Se dovessero esserci ritardi, ti avviso subito."
  - tutor: "D'accordo: programma entro il venti e vecchio sistema spento a fine mese. Tienimi aggiornata ogni venerdì."
    goals: [deadline]

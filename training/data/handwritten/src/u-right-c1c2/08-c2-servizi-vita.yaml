# Set u-right-c1c2, file 8: C2, complaints, housing, bureaucracy and life stories. Correct
# near-misses («più facile da casa che in ufficio», «se mi lascia finire», «ho realizzato un
# sogno», gliela faccio firmare); slips in plurals, piacere, negation, questions, pronoun position,
# word order, subjunctive form, reflexive, auxiliaries, prepositions and false friends.
- scenario: recensione-ristorante
  level: C2
  persona: en-f-student
  history: [noun-number]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Mi dispiace disturbarla, ma ci tengo a dirle che la serata è stata deludente, e non per un solo motivo. Avevamo scelto il menù degustazione proprio perché ce ne avevano parlato benissimo, e francamente ci aspettavamo tutt'altro."
  - tutor: "Mi dispiace sentirlo. Mi dica pure, nel dettaglio, che cosa non è andato."
    goals: [complain]
  - learner: "Il primo antipasto, quello con gli uovi di quaglia, è arrivato freddo, e il cameriere ci ha assicurato che era voluto. Può anche darsi, ma allora sarebbe stato il caso di avvertirci prima."
    errors: [noun-number]
  - tutor: "Ha ragione, andava detto. Ma «gli uovi di quaglia»: uovo al plurale è un nome un po' particolare, ricorda come fa?"
    prompt: {text: "gli uovi", tags: [noun-number]}
  - learner: "Ah, sì, è irregolare: le uova di quaglia. Come il braccio, le braccia."
  - tutor: "Esatto. E il resto della cena?"
  - learner: "Il resto peggio. Non mi è piaciuto per niente i ravioli al tartufo: il tartufo non si sentiva, e la pasta era così spessa che sembrava cruda. Per non parlare dei tempi: tra una portata e l'altra passavano venti minuti buoni."
    errors: [piacere]
  - tutor: "Venti minuti sono davvero troppi. Ma «non mi è piaciuto i ravioli»: con piacere, il verbo si accorda con che cosa?"
    goals: [detail]
    prompt: {text: "Non mi è piaciuto per niente i ravioli", tags: [piacere]}
  - learner: "Con i ravioli: non mi sono piaciuti per niente. E per un menù da novanta euro a persona, ci saremmo aspettati un servizio all'altezza del prezzo."
  - tutor: "Esatto, e avete ragione su tutta la linea. Posso togliere dal conto il menù degustazione e offrirvi i vini: le sembra un modo accettabile di rimediare?"
    goals: [expectation]
  - learner: "È un gesto che apprezzo, e lo accetto. Mi auguro però che riferisca in cucina quello che le ho detto, perché sarebbe un peccato che un locale con queste potenzialità si perdesse per qualche disattenzione."
  - tutor: "Lo riferisco stasera stessa allo chef, glielo prometto. E spero di rivedervi presto, per farvi cambiare idea."
    goals: [resolve]

- scenario: reclamo-comune
  level: C2
  persona: en-m-retired
  history: [negation]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Le sarei grato se mi ascoltasse per qualche minuto, perché la questione si trascina da mesi. Da quando hanno spostato le campane del vetro sotto le mie finestre, in via Solferino, ogni notte alle tre veniamo svegliati da un camion che le svuota con un fracasso infernale."
  - tutor: "Capisco, il vetro è rumorosissimo. Ha già fatto presente la cosa all'azienda dei rifiuti?"
    goals: [describe]
  - learner: "Ho scritto quattro volte, sia all'azienda sia all'ufficio ambiente, e nessuno non mi ha mai risposto, nemmeno per dirmi che la segnalazione era arrivata. Abito lì da vent'anni, e mi creda, non sono uno che si lamenta per niente."
    errors: [negation]
  - tutor: "Le credo. Però «nessuno non mi ha mai risposto»: quando nessuno viene prima del verbo, ci vuole anche il non?"
    prompt: {text: "nessuno non mi ha mai risposto", tags: [negation]}
  - learner: "No, giusto: nessuno mi ha mai risposto. Con nessuno all'inizio, il non sparisce."
  - tutor: "Esatto. Purtroppo, però, l'orario del servizio lo decide l'azienda, non il Comune."
    goals: [insist]
  - learner: "Questo mi sorprende, perché il contratto con l'azienda lo firma il Comune. E poi esiste un regolamento comunale sul rumore che vieta le attività rumorose tra le ventitré e le sei, salvo deroghe motivate. Che cosa è il motivo per cui proprio la raccolta del vetro dovrebbe fare eccezione?"
    errors: [question-form]
  - tutor: "Domanda legittima. Ma «che cosa è il motivo»: per chiedere quale, fra tanti motivi possibili, come comincia la domanda in italiano?"
    prompt: {text: "Che cosa è il motivo", tags: [question-form]}
  - learner: "Ha ragione: qual è il motivo per cui la raccolta del vetro dovrebbe fare eccezione? Vorrei saperlo, perché a me non sembra che ce ne sia uno valido."
  - tutor: "Esatto. E lei ha ragione anche nel merito: la deroga dev'essere motivata, e io non ne trovo traccia."
    goals: [rights]
  - learner: "Allora le chiederei di trasmettere la mia segnalazione all'ufficio che gestisce il contratto, chiedendo formalmente di spostare la raccolta dopo le sei. E vorrei ricevere una risposta scritta entro trenta giorni, come prevede la legge."
  - tutor: "Lo faccio subito e le do il numero di protocollo: la risposta scritta deve arrivarle entro trenta giorni."
    goals: [commitment]

- scenario: trattativa-affitto
  level: C2
  persona: es-f-erasmus
  history: [word-order]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Moltissimo, e glielo dico con una certa cautela, perché so che in una trattativa non dovrei mostrare troppo entusiasmo. Lo vedendo stamattina con la luce del sole, mio marito e io ci siamo guardati e abbiamo pensato la stessa cosa: è quello giusto."
    errors: [pronoun-position]
  - tutor: "Apprezzo la sincerità! Ma «lo vedendo»: con il gerundio, dove va il pronome?"
    prompt: {text: "Lo vedendo", tags: [pronoun-position]}
  - learner: "Dopo, attaccato: vedendolo stamattina con la luce del sole. Comunque, entusiasmo a parte, ci sono un paio di cose di cui vorrei parlare."
  - tutor: "Esatto. Mi dica pure: il proprietario è una persona ragionevole."
    goals: [interest]
  - learner: "Il canone di milleduecento euro ci sembra in linea con la zona, ma il riscaldamento è autonomo e la caldaia ha più di quindici anni. In tutta la nostra vita in affitto non abbiamo visto mai una caldaia così vecchia funzionare bene a lungo, e non vorremmo trovarci al freddo a gennaio."
    errors: [word-order]
  - tutor: "Timore comprensibile. Ma «non abbiamo visto mai»: in un tempo composto, dove si mette mai?"
    prompt: {text: "non abbiamo visto mai", tags: [word-order]}
  - learner: "Sì: non abbiamo visto mai, in tutta la nostra vita, una caldaia così vecchia che funzioni bene."
    errors: [word-order]
  - tutor: "Anche noi in agenzia non abbiamo mai visto miracoli del genere, quindi la capisco. Proporrò al proprietario di sostituirla prima del vostro ingresso."
    goals: [negotiate]
    recast: {text: "non abbiamo visto mai", fix: "non abbiamo mai visto", tags: [word-order]}
  - learner: "Sarebbe perfetto. In quel caso saremmo disposti a firmare un contratto di quattro anni più quattro, e a versare tre mensilità di deposito invece di due, purché la caldaia nuova venga installata entro ottobre."
  - tutor: "Mi sembra un'offerta seria. La porto al proprietario oggi pomeriggio e la richiamo domattina."
    goals: [conditions]
  - learner: "D'accordo. Se il proprietario accetta, possiamo firmare già la settimana prossima: mio marito è di turno fino a giovedì, ma venerdì siamo liberi tutti e due."
  - tutor: "Venerdì, allora, salvo sorprese. Ho la sensazione che quella vecchia caldaia abbia i giorni contati."
    goals: [conclude]

- scenario: turismo-di-massa
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno. Sono contrario, e le spiego perché. Non nego che Venezia soffra per il sovraffollamento, ma far pagare l'ingresso a una città significa trasformarla definitivamente in un museo, cioè accettare proprio ciò che si dice di voler combattere."
  - tutor: "Però qualcosa bisogna fare. Che cosa, secondo lei, ha davvero peggiorato le cose?"
    goals: [introduce]
  - learner: "Prendiamo un esempio concreto: le grandi navi. Per anni sono entrate in laguna scaricando migliaia di turisti in poche ore, e solo quando sono state vietate il centro ha respirato un po'. Il problema non è il singolo visitatore, ma il turismo organizzato su scala industriale."
  - tutor: "Ma il ticket colpisce proprio i turisti mordi e fuggi, quelli che vengono in giornata."
    goals: [example]
  - learner: "Questo è vero solo in teoria. Il ticket così com'è non è consistente con l'obiettivo dichiarato: si pagano cinque euro, che per chi arriva da lontano sono una cifra irrisoria, e intanto chi paga si sente autorizzato a comportarsi come in un parco a tema."
    errors: [false-friend]
  - tutor: "Quindi, secondo lei, il ticket non è coerente con l'obiettivo perché costa troppo poco? Allora basterebbe alzarlo?"
    recast: {text: "consistente", fix: "coerente", tags: [false-friend]}
  - learner: "No, perché così diventerebbe una città per ricchi. Se mi lascia finire, le spiego la mia proposta: limitare l'accesso dei gruppi organizzati con un sistema di prenotazione, lasciare liberi i singoli visitatori e restituire le case del centro ai residenti, con incentivi agli affitti lunghi."
  - tutor: "Gruppi su prenotazione e case ai residenti: una proposta concreta. Ma le agenzie protesteranno."
    goals: [rebut]
  - learner: "Che protestino pure, è legittimo. Ma una città non può essere governata in funzione di chi la visita per sei ore. Se fra dieci anni a Venezia non ci abitasse più nessuno, anche le agenzie perderebbero ciò che vendono."
  - tutor: "Un argomento difficile da contestare. Grazie della telefonata, e buona giornata."
    goals: [proposal]

- scenario: burocrazia-residenza
  level: C2
  persona: en-f-professional
  history: [subjunctive-form]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Mi sono trasferita da Torino a Milano a gennaio e vorrei cambiare la residenza. Ho letto sul sito del Comune che la domanda si può presentare anche online, ma siccome sono cittadina britannica temevo che ci fossero passaggi in più, e ho preferito venire di persona."
  - tutor: "Ha fatto bene. Per i cittadini britannici serve anche la carta di soggiorno. Ce l'ha con sé?"
    goals: [request]
  - learner: "Sì, eccola, è quella rilasciata dopo la Brexit. Il problema è che riporta ancora l'indirizzo di Torino. Occorre che io vadi prima in questura a cambiarlo, o potete aggiornarlo voi dopo il cambio di residenza?"
    errors: [subjunctive-form]
  - tutor: "Domanda giusta. Ma «occorre che io vadi»: il congiuntivo di andare, con io, è proprio questo?"
    prompt: {text: "vadi", tags: [subjunctive-form]}
  - learner: "No, scusi: occorre che io vada. È la stessa forma per io, tu e lui, se non sbaglio."
  - tutor: "Esatto. E no, non deve passare prima dalla questura: la carta si aggiorna dopo, quando la residenza sarà confermata."
    goals: [documents]
  - learner: "Meno male. C'è un'ultima cosa: il proprietario non mi ha ancora dato una copia del contratto registrato, perché dice che l'Agenzia delle Entrate gliel'ha restituito con un errore. Posso presentare la domanda lo stesso, o devo aspettare che me la dia?"
  - tutor: "Può presentarla con una dichiarazione del proprietario, firmata e con la copia del suo documento. Il contratto lo porterà quando sarà pronto."
    goals: [problem]
  - learner: "Perfetto, gliela faccio firmare stasera stessa. E dopo, quanto tempo passa prima che la residenza diventi effettiva? Avrei bisogno del certificato per iscrivere mio figlio all'asilo."
  - tutor: "La residenza vale dal giorno della domanda, ed entro quarantacinque giorni passa la polizia locale per il controllo. Il certificato per l'asilo può chiederlo già da domani."
    goals: [next]

- scenario: vita-in-italia
  level: C2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie a voi. Non l'ho scelta, a dire il vero: ci sono capitato per un progetto di ingegneria a Bari, nel 2012, e avrei dovuto restare sei mesi. Poi ho sposato con una ragazza di Polignano, e i sei mesi sono diventati dodici anni."
    errors: [reflexive]
  - tutor: "Una storia d'amore, mi piace. Ma «ho sposato con»: quel con, insieme a sposare, che cosa richiede?"
    prompt: {text: "ho sposato con una ragazza", tags: [reflexive]}
  - learner: "Ah, giusto: mi sono sposato con una ragazza di Polignano. Oppure, più semplicemente, ho sposato una ragazza di Polignano."
  - tutor: "Esatto, vanno bene tutte e due. E le difficoltà, all'inizio?"
    goals: [story]
  - learner: "Le più grandi sono state la lingua e il dialetto, in ordine inverso: l'italiano l'avevo studiato, il barese no. Mia suocera parlava solo in dialetto, e capirla mi ha costato mesi di cene in silenzio, annuendo e sorridendo senza sapere a cosa."
    errors: [auxiliary-choice]
  - tutor: "Annuire senza capire, un classico! Ma «capirla mi ha costato»: costare va davvero con avere?"
    prompt: {text: "mi ha costato", tags: [auxiliary-choice]}
  - learner: "Sì, credo di sì: capirla mi ha costato tanta fatica, all'inizio."
    errors: [auxiliary-choice]
  - tutor: "Le è costato tanta fatica, ci credo! Ma nel frattempo, qualcosa è cambiato anche in lei?"
    goals: [difficulties]
    recast: {text: "ha costato", fix: "è costato", tags: [auxiliary-choice]}
  - learner: "Moltissimo. Sono diventato meno rigido con gli orari e molto più attento alle persone: in Spagna ero sempre di corsa, qui ho imparato che un caffè con il vicino può valere più di una riunione. E oggi, a dire il vero, il barese lo capisco quasi tutto."
  - tutor: "Un caffè con il vicino che vale una riunione: lo diremo al nostro direttore. Un consiglio per chi ci ascolta e pensa di trasferirsi?"
    goals: [change]
  - learner: "Di non arrivare con l'idea di trovare l'Italia delle cartoline, ma di lasciarsi sorprendere da quella vera, che è più complicata e molto più interessante. E di imparare almeno qualche parola di dialetto: apre più porte di qualsiasi laurea."
  - tutor: "Il dialetto che apre più porte di una laurea: mi sembra il titolo perfetto per questa puntata. Grazie, e buon ritorno a Polignano!"
    goals: [advice]

- scenario: intervista-podcast
  level: C2
  persona: en-f-professional
  history: [preposition]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Ciao, grazie dell'invito! Sono arrivata nel 2016 con una borsa di studio per un corso di restauro a Firenze, convinta che sarei tornata a Manchester dopo un anno. Invece ho realizzato un sogno che avevo da ragazzina: oggi restauro affreschi nelle chiese di mezza Toscana."
  - tutor: "Restaurare affreschi in Toscana, altro che sogno! Che cosa ti ha colpita di più, all'inizio?"
    goals: [story]
  - learner: "Il rapporto con il tempo. In Inghilterra, se dici che un lavoro sarà pronto martedì, è pronto martedì; qui martedì è più che altro un'intenzione. All'inizio mi faceva impazzire, poi ho capito che dietro c'è anche una certa saggezza: un affresco di cinquecento anni può aspettare una settimana."
  - tutor: "Un affresco può aspettare, mi piace. E c'è qualcosa che invece ti fa ancora arrabbiare?"
    goals: [culture-shock]
  - learner: "Sì, e mi dispiace dirlo: l'abbandono del patrimonio minore. Penso spesso di quelle chiesette di campagna che ho visto chiudere una dopo l'altra, con affreschi bellissimi che nessuno vedrà più, perché mancano i fondi anche solo per un custode."
    errors: [preposition]
  - tutor: "Un tema doloroso. Ma «penso spesso di quelle chiesette»: con pensare, nel senso di avere in mente qualcosa, quale preposizione usiamo?"
    prompt: {text: "Penso spesso di quelle chiesette", tags: [preposition]}
  - learner: "Giusto: penso spesso a quelle chiesette. «Pensare di» si usa con l'infinito, per esempio «penso di partire»."
  - tutor: "Esatto, proprio così. E a chi ci ascolta e sogna di trasferirsi, che consiglio daresti?"
    goals: [critique]
  - learner: "Di venire con un progetto preciso, non solo con un sogno, perché il mercato del lavoro qui non regala niente a nessuno. E di avere pazienza con la burocrazia: alla fine le cose si sbloccano, magari non quando vorresti tu, ma si sbloccano."
  - tutor: "Un progetto preciso e tanta pazienza: un consiglio da restauratrice. Grazie mille di essere stata con noi!"
    goals: [advice]

- scenario: smartworking
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa quasi sempre, ormai. Da quando l'azienda ha chiuso la sede di Bologna, gestisco una squadra sparsa tra Lisbona, Varsavia e Palermo, quindi l'ufficio, di fatto, è lo schermo del mio portatile."
  - tutor: "Una squadra in tre Paesi, accidenti. E come ti trovi?"
    goals: [situation]
  - learner: "Nel complesso bene. Per concentrarmi è molto più facile lavorare da casa che in ufficio, e ho recuperato le due ore che passavo in treno ogni giorno: adesso le uso per andare a correre o per cucinare con calma."
  - tutor: "Due ore al giorno sono un regalo. Ma qualche svantaggio ci sarà, no?"
    goals: [pros]
  - learner: "Eccome. Il problema è che la giornata non finisce mai: ieri, per esempio, ho dovuto attendere a tre riunioni consecutive con fusi orari diversi, e alla fine ho chiuso il computer alle nove di sera. E poi mi manca il contatto umano: con i colleghi non c'è più quella confidenza che nasce davanti alla macchinetta del caffè."
    errors: [false-friend]
  - tutor: "Dover partecipare a tre riunioni di fila, fino alle nove: altro che regalo! E la confidenza davanti al caffè, quella, online non si recupera."
    goals: [cons]
    recast: {text: "attendere a tre riunioni", fix: "partecipare a tre riunioni", tags: [false-friend]}
  - learner: "Proprio così. Per questo sto pensando di proporre all'azienda uno spazio di coworking a Bologna, dove chi vuole possa venire un paio di giorni alla settimana. Se potessi scegliere, farei metà e metà: tre giorni a casa e due in mezzo alla gente."
  - tutor: "Metà e metà, la soluzione più saggia. Se ti serve una mano a scrivere la proposta, chiamami."
    goals: [preference]
  - learner: "Ti prendo in parola! Te la mando domani sera, così mi dici se è abbastanza convincente o se sembro solo uno che si annoia a casa."
  - tutor: "Te la rileggo volentieri. E se sembri uno che si annoia, tanto meglio: almeno sei sincero."

# Set u-right-c1c2, file 2: C1, art, books and opinions. Correct hypotheticals, relative
# clauses with cui/il quale, gerunds, sarebbe ora che, non è detto che; one subtle error at most
# in most dialogues (comparative, hypothetical, relative pronoun, participle agreement...).
- scenario: arte-mostra
  level: C1
  persona: en-f-student
  history: [comparative]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sinceramente, la prima impressione è di calma assoluta. Sono solo bottiglie e scatole, eppure non riesco a smettere di guardarle. Mi sembra che il tempo si sia fermato dentro la stanza."
  - tutor: "È l'effetto Morandi: dipingeva le stesse bottiglie per anni. Che cosa vedi, esattamente?"
    goals: [react]
  - learner: "Vedo sei oggetti stretti l'uno contro l'altro, quasi tutti dello stesso colore polveroso, tra il grigio e il rosa. La luce viene da sinistra, ma è così morbida che le ombre si notano appena. E i contorni non sono mai netti, come se le bottiglie si stessero sciogliendo."
  - tutor: "Bella osservazione: quei contorni che tremano sono il suo marchio. Secondo te, perché dipingere sempre le stesse cose?"
    goals: [describe]
  - learner: "Credo che a Morandi non interessassero gli oggetti in sé, ma il modo in cui la luce li cambia. Dipingendo sempre le stesse bottiglie, poteva concentrarsi solo su quello. È un po' come un musicista che suona lo stesso brano per tutta la vita, cercando ogni volta una sfumatura diversa."
  - tutor: "Mi piace il paragone del musicista. E rispetto ad altri pittori di nature morte, che differenza noti?"
    goals: [interpret]
  - learner: "Rispetto alle nature morte olandesi che ho visto ad Amsterdam, è tutto il contrario. Là c'erano frutta, pesci, bicchieri d'argento, tutto lucido e pieno di dettagli. Qui invece c'è una povertà quasi monastica, e secondo me è molto più moderna che quei quadri."
    errors: [comparative]
  - tutor: "Una povertà monastica, che bella definizione. Ma «più moderna che quei quadri»: quando metti a confronto due cose, dopo «più moderna» che cosa usi?"
    prompt: {text: "più moderna che quei quadri", tags: [comparative]}
  - learner: "Più moderna di quei quadri, certo. Anche se, a pensarci bene, pure gli olandesi in fondo parlavano del tempo che passa."
  - tutor: "Proprio così, la candela spenta, il fiore appassito. Morandi dice la stessa cosa, ma senza alzare la voce."
    goals: [compare]

- scenario: club-lettura
  level: C1
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Ce l'ho fatta, ma ci ho messo quasi un mese. Le prime cento pagine mi sono sembrate lentissime, e più di una volta sono stato sul punto di lasciarlo. Poi, quando la famiglia si trasferisce a Torino, la storia mi ha preso e non sono più riuscito a smettere."
  - tutor: "Succede spesso con le saghe: bisogna entrarci. Quale personaggio ti ha colpito di più?"
    goals: [impression]
  - learner: "La nonna, Ida, senza dubbio. Mi ha colpito che, pur avendo perso il marito in guerra, non si lamenti mai e tenga in piedi tutta la famiglia. L'unica cosa che non le perdono è aver costretto la figlia a sposare un uomo che non amava."
  - tutor: "Io invece quella scelta la capisco: erano anni di fame, e il matrimonio era una sicurezza. Non trovi?"
  - learner: "Capisco il contesto, però secondo me lo faceva anche per tenere la figlia vicino a sé. Se la figlia avrebbe sposato il ragazzo di cui era innamorata, sarebbe andata a vivere a Genova, e Ida avrebbe perso il suo aiuto in casa."
    errors: [hypothetical]
  - tutor: "Lettura interessante. Ma ascolta l'inizio della frase: «se la figlia avrebbe sposato». Dopo il se, quale tempo ci vuole?"
    prompt: {text: "se la figlia avrebbe sposato", tags: [hypothetical]}
  - learner: "Hai ragione: se la figlia avesse sposato il ragazzo di cui era innamorata. Ida, in fondo, aveva paura di restare sola."
  - tutor: "Esatto. La paura di restare sola: è un'interpretazione che non avevo considerato. E lo stile, ti è piaciuto?"
    goals: [character]
  - learner: "Moltissimo, soprattutto i dialoghi, che sono scritti in un italiano un po' piemontese. Alcune espressioni le ho dovute cercare, ma danno un sapore autentico a tutta la storia. Le descrizioni, invece, a volte mi sono sembrate un po' troppo lunghe."
  - tutor: "Sui dialoghi hai ragione, sembrano registrati in cortile. A chi lo consiglieresti?"
    goals: [style]
  - learner: "A chi ha pazienza e ama le storie di famiglia, magari a chi ha dei nonni che hanno vissuto quegli anni. A chi cerca un ritmo veloce, invece, lo sconsiglierei senza pensarci due volte."
  - tutor: "Allora lo regalo a mio padre, che di pazienza ne ha da vendere. Il mese prossimo scegli tu il libro!"
    goals: [recommend]

- scenario: film-libro
  level: C1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io, se nessuno ha niente in contrario. Ho letto un romanzo ambientato in un'isola delle Eolie negli anni Cinquanta, scritto da una giovane autrice siciliana. Racconta di un maestro che arriva dal continente e che, a poco a poco, si fa accettare dagli isolani, benché all'inizio nessuno si fidi di lui."
  - tutor: "Un maestro venuto da fuori su un'isola: mi piace già. Com'è questo maestro?"
    goals: [summary]
  - learner: "È un uomo timido e un po' goffo, che ha scelto l'isola per fuggire da un dolore del quale non parla mai. Ho apprezzato che l'autrice non ce lo spieghi subito: lo si capisce solo verso la fine, attraverso piccoli indizi."
  - tutor: "Un personaggio costruito per sottrazione, mi piace. E nel romanzo, che cosa ti ha conquistato di più?"
    goals: [characters]
  - learner: "La parte migliore è quella del bambino che il maestro si affeziona subito, un ragazzino che non vuole andare a scuola e che lui conquista portandolo a pescare. Il finale invece mi è sembrato un po' affrettato."
    errors: [relative-pronoun]
  - tutor: "La pesca come lezione, che bella idea. Ma «il bambino che il maestro si affeziona»: affezionarsi regge una preposizione, quindi quale relativo ci vuole?"
    prompt: {text: "bambino che il maestro si affeziona", tags: [relative-pronoun]}
  - learner: "Sì, scusa: è il bambino che il maestro si affeziona a lui, perché gli ricorda qualcuno del suo passato."
    errors: [relative-pronoun]
  - tutor: "Quindi il bambino a cui il maestro si affeziona è legato al suo dolore? Non dire altro, non voglio sapere il finale!"
    goals: [opinion]
    recast: {text: "il bambino che il maestro si affeziona a lui", fix: "il bambino a cui il maestro si affeziona", tags: [relative-pronoun]}
  - learner: "Non dico niente, promesso. Lo consiglierei a chi ama i libri lenti e pieni di mare, e anche agli insegnanti, perché fa venire voglia di fare questo mestiere con passione."
  - tutor: "Allora lo segno per mia sorella, che insegna alle elementari. Grazie, hai aperto benissimo la serata."
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-f-teacher
  history: [participle-agreement]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco la tua paura, ma non sono così pessimista. È probabile che alcuni lavori spariscano, però è già successo con ogni grande invenzione, dalla stampa al computer. Il problema, semmai, è che stavolta il cambiamento è molto più veloce."
  - tutor: "Più veloce e più vasto: stavolta tocca anche gli impiegati, non solo gli operai."
    goals: [position]
  - learner: "Ti faccio un esempio concreto. A scuola, quest'anno, abbiamo provato dei programmi che correggono i temi in pochi secondi. Io li ho usato per un mese con i miei studenti, e devo dire che segnalavano bene gli errori di ortografia, ma l'ironia non la capivano affatto."
    errors: [participle-agreement]
  - tutor: "E com'è andata davvero? Aspetta, prima rileggi «li ho usato»: con quel «li» davanti, il participio resta così?"
    prompt: {text: "li ho usato", tags: [participle-agreement]}
  - learner: "No, hai ragione: li ho usati per un mese. Sugli errori erano bravissimi, ma un tema pieno di sarcasmo l'hanno valutato come un elogio sincero."
  - tutor: "Esatto. Un tema sarcastico preso per un elogio, fantastico! Quindi l'insegnante serve ancora."
    goals: [evidence]
  - learner: "Serve eccome. Però devo ammettere che su una cosa hai ragione: chi fa lavori ripetitivi, come la traduzione di manuali tecnici, rischia davvero. Una mia amica traduttrice ha perso due clienti in sei mesi, e non è detto che riesca a sostituirli."
  - tutor: "Mi dispiace per la tua amica. Vedi che un po' di paura è giustificata?"
    goals: [concede]
  - learner: "Un po' sì, lo ammetto. Forse siamo d'accordo più di quanto sembri: la tecnologia in sé non è né buona né cattiva, dipende da come la useremo e da chi ne trarrà profitto. Sarebbe ora che se ne occupasse seriamente anche la politica."
  - tutor: "Su questo brindo volentieri: più politica e meno paura. Ti verso un altro bicchiere?"
    goals: [conclude]

- scenario: notizie-attualita
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "L'ho vista, sì, ne parlavano anche alla radio mentre venivo qui. Se ho capito bene, nei centri storici delle grandi città non si potranno più affittare case ai turisti per più di novanta notti all'anno. E chi non rispetta il limite rischia multe piuttosto pesanti."
  - tutor: "Esatto, novanta notti. E a te sembra una buona idea?"
    goals: [summarise]
  - learner: "In linea di principio sì, perché a Firenze ormai nel centro non ci abita quasi più nessuno. Però temo che i controlli siano difficili, e che alla fine paghino solo i piccoli proprietari, mentre le grandi società trovano sempre il modo di aggirare le regole."
  - tutor: "Il dubbio sui controlli ce l'ho anch'io. Ma hai visto come ne hanno parlato i giornali?"
    goals: [opinion]
  - learner: "Ne ho letti due, e sembravano parlare di due leggi diverse. Il primo la presentava come una rivoluzione, mentre il secondo sosteneva che la legge ha preso effetto troppo tardi e che ormai il danno è fatto. Mi ha colpito quanto il titolo cambiasse tutta la percezione della notizia."
    errors: [word-choice]
  - tutor: "Già, per uno è una svolta storica, per l'altro è entrata in vigore troppo tardi. Quale versione ti convince di più?"
    goals: [sources]
    recast: {text: "ha preso effetto", fix: "è entrata in vigore", tags: [word-choice]}
  - learner: "Più la seconda, purtroppo. Se l'avessero approvata dieci anni fa, forse i quartieri storici non si sarebbero svuotati così. Molti residenti se ne sono già andati, e difficilmente torneranno."
  - tutor: "Quindi, secondo te, che cosa cambierà davvero nei prossimi anni?"
  - learner: "Immagino che gli affitti lunghi aumentino un po', perché alcuni proprietari torneranno ad affittare agli studenti. Però non mi stupirei se i prezzi restassero altissimi, almeno finché il turismo rimane così forte."
  - tutor: "Speriamo almeno negli studenti, allora. Dai, che il caffè si fredda e la riunione comincia tra cinque minuti."
    goals: [consequences]

- scenario: politica-lavoro
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-form]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Metà mi sembra un'esagerazione, Riccardo. Molti lavori cambieranno, questo sì, ma non credo che spariscano così in fretta. Pensa ai cassieri: dicevano che sarebbero scomparsi vent'anni fa, e invece al supermercato sotto casa mia ce ne sono ancora quattro."
  - tutor: "Quattro adesso, ma tra dieci anni? Prova a immaginare: se domani le casse fossero tutte automatiche, che succederebbe?"
    goals: [opinion]
  - learner: "Se succedesse domani, sarebbe un dramma, soprattutto per le donne sopra i cinquant'anni, che sono la maggior parte dei cassieri. Per questo penso che sia indispensabile che lo Stato intervenghi prima, con corsi di formazione seri e non con i soliti corsi inutili."
    errors: [subjunctive-form]
  - tutor: "Sui corsi seri sono d'accordo. Ma «che lo Stato intervenghi»: il congiuntivo di intervenire è proprio quello?"
    prompt: {text: "intervenghi", tags: [subjunctive-form]}
  - learner: "No, scusa: che lo Stato intervenga. È come venire: che io venga, che lui venga."
  - tutor: "Esatto, proprio come venire. Hai un esempio di formazione che abbia funzionato davvero?"
    goals: [hypothesis]
  - learner: "Sì, mia zia, a Siviglia. Lavorava in una banca che ha chiuso metà delle filiali, e invece di licenziarla le hanno pagato un corso di analisi dei dati. Adesso guadagna più di prima e dice che non tornerebbe indietro per niente al mondo."
  - tutor: "Bella storia, ma tua zia è stata fortunata: non tutte le banche sono così generose."
    goals: [example]
  - learner: "È vero, ed è proprio questo il punto: non possiamo affidarci alla generosità delle aziende. Insomma, il lavoro non finirà, ma senza regole chiare a pagare saranno sempre i più deboli. Tu invece continui a pensare che sia tutto perduto?"
  - tutor: "Diciamo che mi hai fatto passare da «tutto perduto» a «quasi tutto». Per stasera è già un bel progresso!"
    goals: [conclude]

- scenario: dibattito-ambiente
  level: C1
  persona: en-m-retired
  history: [passive]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la sua preoccupazione, ma io sono favorevole alla chiusura, almeno nelle ore centrali della giornata. Abito qui da trent'anni e non ricordo un periodo in cui il traffico fosse peggiore di adesso."
  - tutor: "Trent'anni sono tanti, lei il quartiere lo conosce bene. Ma perché pensa che la chiusura convenga?"
    goals: [position]
  - learner: "Per due ragioni. La prima è la salute: a mio nipote, che ha sei anni, hanno diagnosticato l'asma, e il pediatra dice che lo smog c'entra eccome. La seconda è economica: quando via Garibaldi è stato chiuso al traffico, tre anni fa, i negozi sono addirittura aumentati."
    errors: [passive]
  - tutor: "Il caso di via Garibaldi è interessante. Ma «via Garibaldi è stato chiuso»: parlando di una via, il participio va bene così?"
    prompt: {text: "via Garibaldi è stato chiuso", tags: [passive]}
  - learner: "Ha ragione: via Garibaldi è stata chiusa al traffico. E da allora, a quanto mi risulta, hanno aperto almeno una decina di negozi nuovi."
  - tutor: "Esatto. Però via Garibaldi è una strada turistica, il nostro quartiere no: qui la gente viene in macchina a fare la spesa."
    goals: [argue]
  - learner: "È un'obiezione sensata, ma i dati del Comune dicono che più della metà dei clienti dei negozi del quartiere arriva a piedi o in bicicletta. Chi viene in macchina, poi, spesso non trova parcheggio e finisce per andare al centro commerciale."
  - tutor: "I dati del Comune li ho visti anch'io, ma i commercianti più anziani non ci credono."
    goals: [counter]
  - learner: "Su questo le do ragione: un cambiamento così brusco spaventerebbe chiunque. Potremmo proporre di chiudere il centro solo il sabato e la domenica, per sei mesi, e poi valutare i risultati insieme ai commercianti. Se le cose andassero male, si tornerebbe indietro."
  - tutor: "Una prova di sei mesi nei fine settimana, con i commercianti coinvolti: questa potrei sostenerla anch'io."
    goals: [concede]

- scenario: turismo-di-massa
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno a lei e agli ascoltatori. Sono a favore, anche se con qualche riserva. Vivo a Venezia da dodici anni, e ho visto il centro trasformarsi in un parco divertimenti dove i residenti sono diventati quasi un ostacolo."
  - tutor: "Un parco divertimenti: parole forti. Ci fa un esempio concreto?"
    goals: [introduce]
  - learner: "Glielo faccio volentieri. L'estate scorsa mia figlia ha avuto la febbre alta, e per arrivare in farmacia abbiamo impiegato venti minuti invece di cinque, perché il ponte era bloccato dai gruppi. Nessuno di loro si rendeva conto che lì ci viviamo."
  - tutor: "Capisco l'esasperazione. Però molti dicono che un ticket trasforma la città in un museo, e che chi ha pochi soldi non ci entra più."
    goals: [example]
  - learner: "È un rischio reale, e non lo nego. Ma il ticket di cui parliamo vale solo per chi viene in giornata, non per chi dorme in città, né per gli studenti o per chi ci lavora. E sinceramente, che una città si difenda dal sovraffollamento non mi sembra uno scandalo."
  - tutor: "Quindi per lei il problema non è il ticket in sé, ma come viene applicato."
    goals: [rebut]
  - learner: "Esattamente. Io proporrei un sistema a prenotazione con un numero massimo di visitatori al giorno, come si fa già per alcuni musei. Il prezzo potrebbe variare a seconda della stagione, e i soldi andrebbero spesi per la manutenzione e per le case dei residenti."
  - tutor: "Una proposta chiara: prenotazione, numero chiuso e soldi reinvestiti in città. Grazie della telefonata, e buona giornata a Venezia!"
    goals: [proposal]

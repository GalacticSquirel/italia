# Set u-right-c1c2, file 5: C2, social and formal scenes. Long correct turns with concessives,
# imperfect subjunctive, il quale, mi ci ha accompagnata, non me ne sono persa una; subtle slips
# (benché + indicative, preposition, subjunctive form, register, relative il cui, calques).
- scenario: assemblea-condominio
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Grazie, sarò breve. Benché capisco le ragioni di chi vuole rifare la facciata subito, credo che sia prudente rimandare i lavori. Molti di noi sono pensionati, e una spesa di dodicimila euro a famiglia, da un giorno all'altro, sarebbe un colpo durissimo."
    errors: [subjunctive-use]
  - tutor: "Un attimo, prima di andare avanti: «benché capisco». Dopo benché, il verbo resta all'indicativo?"
    prompt: {text: "Benché capisco", tags: [subjunctive-use]}
  - learner: "Ha ragione: benché capisca le loro ragioni. Il punto, comunque, è che non tutti possono permettersi una spesa simile adesso."
  - tutor: "Esatto. Ma il signor Bruzzone, dal terzo piano, fa notare che allora aspettiamo che un pezzo di cornicione cada in testa a qualcuno."
    goals: [position]
  - learner: "Capisco la preoccupazione del signor Bruzzone, e non la prendo alla leggera. Proprio per questo non propongo di lasciar perdere, ma di mettere in sicurezza le parti pericolanti subito, con una spesa limitata, e di rimandare il resto."
  - tutor: "Il geometra stima la messa in sicurezza in circa ventimila euro per tutto il palazzo. E il resto?"
    goals: [defuse]
  - learner: "Il resto lo rimanderei a un anno, il tempo di accantonare la cifra con un fondo mensile. Inoltre, se aspettassimo la primavera, potremmo approfittare del nuovo bando regionale, di cui ci ha parlato lei stesso a settembre."
    errors: [preposition]
  - tutor: "Il bando potrebbe aiutare, è vero. Ma «lo rimanderei a un anno»: per dire di quanto si sposta una cosa nel tempo, che preposizione usiamo?"
    prompt: {text: "rimanderei a un anno", tags: [preposition]}
  - learner: "Giusto: lo rimanderei di un anno. Con un fondo di cento euro al mese a famiglia, in dodici mesi la cifra ci sarebbe quasi tutta."
  - tutor: "Esatto. Mi sembra una proposta che può mettere d'accordo quasi tutti. La mettiamo ai voti?"
    goals: [alternative]
  - learner: "Sì, grazie. E chiederei che a verbale risulti chiaramente l'impegno a cominciare i lavori entro la prossima primavera, così nessuno potrà dire che abbiamo voluto soltanto prendere tempo."
  - tutor: "Lo metto a verbale parola per parola: messa in sicurezza subito, fondo mensile e lavori entro la primavera. Votiamo."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-m-worker
  history: [subjunctive-form]
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Le assicuro che sono in carne e ossa, anche se stasera un po' emozionato. Grazie dell'invito. Devo dire che, entrando, sono rimasto senza parole: questa casa è splendida, e dalla cucina arriva un profumo che fa venire l'acquolina in bocca."
  - tutor: "Il merito del profumo è tutto di mia moglie, io mi limito a scegliere il vino. Giulia ci dice che Lei è ingegnere?"
    goals: [compliment]
  - learner: "Sì, mi occupo di ponti, per una società di Bologna. Mi piace molto, anche se mi porta spesso fuori casa. Con Giulia stiamo pensando di trasferirci a Firenze tra un paio d'anni, purché io riesca a trovare un lavoro altrettanto interessante."
  - tutor: "Un ingegnere che costruisce ponti e vuole avvicinarsi ai suoceri: o è molto coraggioso, o non ci conosce ancora abbastanza."
    goals: [background]
  - learner: "Diciamo che mi piace correre qualche rischio calcolato. E poi Giulia mi ha avvertito che Lei ha un senso dell'umorismo molto fiorentino, quindi immagino che questa sia solo la prima di molte prove."
  - tutor: "E l'ha superata brillantemente. Senta, diamoci del tu, che tanto prima o poi ci toccherà."
    goals: [irony]
  - learner: "Con piacere, grazie. Spero solo che tu abbi un po' di pazienza, se all'inizio mi scappa ancora qualche Lei."
    errors: [subjunctive-form]
  - tutor: "La pazienza non mi manca, tranquillo. Ma «che tu abbi»: il congiuntivo di avere, con tu, è proprio così?"
    prompt: {text: "abbi", tags: [subjunctive-form]}
  - learner: "Hai ragione: spero che tu abbia un po' di pazienza. Vedi? Il tu mi riesce già meglio del congiuntivo."
  - tutor: "Esatto, e il tu ti riesce benissimo. Adesso però assaggia l'arrosto, prima che mia moglie si offenda."
    goals: [tu-lei]
  - learner: "Lo assaggio subito. È davvero squisito, e lo dico senza nessuna piaggeria: se tua moglie mi desse la ricetta, la porterei a mia madre a Siviglia."
  - tutor: "La ricetta è un segreto di famiglia, ma visto che ormai ne fai parte, se ne può parlare."

- scenario: circolo-lettura
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io no, anzi, mi è sembrato commovente. Certo, a dodici anni salire su un albero per protesta contro un piatto di lumache è un capriccio, ma il fatto che non scenda più per tutta la vita lo trasforma in qualcos'altro. Cosimo tiene la sua promessa anche quando nessuno ci crede più."
    errors: [word-choice]
  - tutor: "Un capriccio che diventa destino: Cosimo mantiene la sua promessa fino alla fine, è vero. Ma per te, di che cosa parla davvero il romanzo?"
    goals: [impression]
    recast: {text: "tiene la sua promessa", fix: "mantiene la sua promessa", tags: [word-choice]}
  - learner: "Secondo me parla della distanza necessaria per capire il mondo. Dagli alberi Cosimo vede tutto meglio di chi sta a terra, e allo stesso tempo partecipa alla vita del paese: legge, aiuta i contadini, si innamora. Non fugge dal mondo, lo guarda da un altro punto di vista."
  - tutor: "Bella lettura. E lo stile? A me certe pagine sembrano un po' troppo levigate."
    goals: [theme]
  - learner: "A me invece è proprio quella leggerezza ad affascinare. Calvino racconta cose assurde con un tono serissimo, da cronaca settecentesca, e l'ironia nasce da lì. C'è il fratello narratore, il cui il punto di vista è sempre un po' ingenuo, e questo rende tutto ancora più divertente."
    errors: [relative-pronoun]
  - tutor: "Il fratello narratore, certo. Ma rileggi «il cui il punto di vista»: non c'è qualcosa di troppo?"
    prompt: {text: "il cui il punto di vista", tags: [relative-pronoun]}
  - learner: "Sì, un articolo di troppo: il fratello, il cui punto di vista è sempre un po' ingenuo. È lui che fa di Cosimo quasi un eroe da leggenda."
  - tutor: "Esatto. Però non mi convinci: per me Cosimo è soprattutto un egoista che fa soffrire la madre."
    goals: [style]
  - learner: "Capisco perché tu lo dica, ma non sono d'accordo. La madre, in fondo, è l'unica che lo capisce: lo segue con il cannocchiale e non gli chiede mai di scendere. Se fosse stato davvero un egoista, non sarebbe corso ad aiutare il paese durante l'incendio."
  - tutor: "Colpita: la scena dell'incendio me l'ero dimenticata. Allora, che cosa leggiamo il mese prossimo?"
    goals: [disagree]
  - learner: "Proporrei «Il cavaliere inesistente», così restiamo con Calvino ma cambiamo completamente registro. È più breve, e chi stasera ha trovato Cosimo insopportabile potrà finalmente prendersela con un'armatura vuota."
  - tutor: "Un'armatura vuota da criticare: perfetto per me. Approvato!"
    goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: en-f-professional
  history: [register]
  turns:
  - tutor: "Grazie di essere venuta, davvero. Non se lo doveva disturbare, con tutto il lavoro che ha."
  - learner: "Si figuri, non potevo non venire. Le porgo le mie più sentite condoglianze, anche a nome di tutto l'ufficio. Lo abbiamo saputo solo lunedì, e tutti mi hanno chiesto di dirle che le sono vicini."
  - tutor: "Grazie, siete molto cari. Mia madre aveva novantun anni, ma uno non è mai pronto."
    goals: [condolences]
  - learner: "È vero, non lo si è mai. Me la ricordo alla sua festa di pensionamento, due anni fa: era venuta apposta da Lecce e aveva portato una teglia di pasticciotti che è sparita in cinque minuti. Lei ne parlava sempre con un orgoglio commovente."
  - tutor: "I suoi pasticciotti, già. Li faceva ogni domenica, fino all'ultimo."
    goals: [memory]
  - learner: "Immagino che adesso ci siano mille cose da sistemare, e che lei non abbia la testa per occuparsene. Se le può essere d'aiuto, posso seguire io la pratica Rinaldi finché non torna in ufficio."
  - tutor: "Lo farebbe davvero? Mi toglierebbe un gran peso: la scadenza è tra dieci giorni."
  - learner: "Ma certo, ci mancherebbe. Mandami le carte quando puoi, senza nessuna fretta, e per tutto il resto non pensarci neanche."
    errors: [register]
  - tutor: "Grazie. Mi perdoni se faccio il professore anche oggi: «mandami le carte quando puoi». Noi due ci davamo del tu?"
    prompt: {text: "Mandami le carte quando puoi", tags: [register]}
  - learner: "Ha ragione, mi scusi: mi mandi le carte quando può. Adesso però è meglio che vada, immagino che sia stanchissimo e che abbia bisogno di stare con la sua famiglia."
  - tutor: "Grazie davvero, per la visita e per la pratica. Mi ha fatto bene parlare un po' di lei."
    goals: [offer-help, leave]

- scenario: dialetti-regionali
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Qualcosa, ma molto poco: parlavano velocissimo e si mangiavano metà delle parole. Una parola però l'ho riconosciuta, «guaglione», perché la usa sempre il mio coinquilino di Caserta."
  - tutor: "Guaglione, il classico! E che altro hai notato, oltre alla velocità?"
  - learner: "Che la fine delle parole quasi non si sentiva, come se la lasciassero a metà. E il mio coinquilino fa lo stesso: con me parla un italiano perfetto, ma quando sale con i suoi amici di Caserta passa al dialetto senza neanche accorgersene."
    errors: [false-friend]
  - tutor: "Quando esce con i suoi amici cambia lingua senza pensarci: succede a quasi tutti noi del Sud. E «guaglione», sai da dove viene?"
    goals: [notice]
    recast: {text: "sale con i suoi amici", fix: "esce con i suoi amici", tags: [false-friend]}
  - learner: "No, non ne ho idea. Immagino che abbia a che fare con «ragazzo», ma la parola è così diversa che non riesco a vedere il collegamento."
  - tutor: "Viene probabilmente da una parola latina che indicava i servi giovani. Il dialetto conserva tracce che l'italiano ha perso."
    goals: [example]
  - learner: "È affascinante. Quindi non è che il dialetto sia un italiano rovinato, come pensano in molti: è una lingua sorella, con una storia propria. Le scuole dovrebbero spiegarlo, invece di far vergognare i ragazzi che lo parlano."
  - tutor: "Proprio così, lingue sorelle. Ma allora andrebbero protette per legge, secondo te?"
    goals: [standard]
  - learner: "Mi sembra difficile imporre una lingua per legge. Però credo che le istituzioni devono almeno sostenere chi la studia e la insegna, come si fa in Spagna con il catalano o il galiziano, che a lungo sono stati considerati dialetti."
    errors: [subjunctive-use]
  - tutor: "Il paragone con il catalano è interessante. Ma «credo che le istituzioni devono»: dopo credo che, ci vuole l'indicativo?"
    prompt: {text: "credo che le istituzioni devono", tags: [subjunctive-use]}
  - learner: "No, il congiuntivo: credo che le istituzioni debbano almeno sostenerla. Non obbligare, ma nemmeno lasciar morire."
  - tutor: "Esatto: non obbligare, ma nemmeno lasciar morire. Lo scriverei sulla porta di ogni scuola del Sud."
    goals: [opinion]

- scenario: email-rettore
  level: C2
  persona: en-m-heritage
  history: [subjunctive-form]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Buongiorno, e grazie di avermi ricevuto. Il mio assegno di ricerca è stato revocato perché il contratto risultava firmato con due giorni di ritardo, ma il ritardo era dovuto all'ufficio del personale, che me l'aveva spedito all'indirizzo sbagliato. Vorrei che la revoca venisse annullata, e ho tutte le mail che lo dimostrano."
  - tutor: "Una situazione spiacevole, ma con le prove in mano. Come pensava di cominciare la lettera?"
    goals: [situation]
  - learner: "Avevo scritto «Gentile Rettore», ma un collega mi ha detto che è troppo semplice. Ho letto che esiste una formula tradizionale, «Magnifico Rettore», ma temo che suoni un po' esagerata, quasi ironica."
  - tutor: "Non è affatto ironica: «Magnifico Rettore» è la formula corretta, e un rettore se l'aspetta. Poi può proseguire con «mi permetto di sottoporre alla Sua attenzione»."
    goals: [opening-formula]
  - learner: "Perfetto. Il problema è la frase centrale. Avevo scritto: «La revoca è ingiusta e vi chiedo di annullarla subito». Mi rendo conto che è troppo diretta, ma non so come renderla più cortese senza che perda forza."
  - tutor: "Proviamo insieme: come la riformulerebbe, con un condizionale e un po' di distanza?"
  - learner: "Forse così: «Alla luce della documentazione allegata, Le sarei grato se volesse riconsiderare il provvedimento, il quale, mi permetto di osservare, non sembra tenere conto delle circostanze in cui il ritardo si è verificato»."
  - tutor: "Eccellente: ferma, ma impeccabile. Manca solo la chiusa."
    goals: [tone]
  - learner: "Pensavo di chiudere con «Ringraziandola per l'attenzione, Le porgo distinti saluti». Oppure è meglio qualcosa come «Con osservanza»? Se Lei potessi scegliere al posto mio, quale userebbe?"
    errors: [subjunctive-form]
  - tutor: "Bella domanda. Ma «se Lei potessi»: con Lei, quella forma del congiuntivo va bene?"
    prompt: {text: "Lei potessi", tags: [subjunctive-form]}
  - learner: "No: se Lei potesse scegliere. Mi scusi, con il Lei a volte la terza persona mi sfugge."
  - tutor: "Esatto. Io sceglierei «Con osservanza», seguito da nome e qualifica: con un rettore è la scelta più elegante."
    goals: [closing]

- scenario: intervista-radio
  level: C2
  persona: en-f-student
  history: [articulated-preposition]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie a voi, è un piacere. Il libro nasce da un taccuino che tenevo nei primi mesi a Napoli, dove annotavo tutto quello che non capivo: i gesti, i silenzi, le regole non scritte. Rileggendolo dopo dieci anni, mi sono accorta che quelle incomprensioni dicevano più sui italiani di qualsiasi guida turistica."
    errors: [articulated-preposition]
  - tutor: "Un taccuino di incomprensioni, bellissimo. Ma «più sui italiani»: con quel sostantivo, la preposizione articolata è giusta?"
    prompt: {text: "sui italiani", tags: [articulated-preposition]}
  - learner: "Ha ragione: dicevano più sugli italiani di qualsiasi guida. È curioso, perché nel libro parlo proprio di quanto siano difficili i nostri articoli."
  - tutor: "Esatto! Allora, la domanda che tutti aspettano: gli italiani sono davvero rumorosi, come si dice?"
    goals: [present-book]
  - learner: "Attualmente gli italiani non sono più rumorosi degli inglesi: lo sono in momenti diversi. Noi inglesi esplodiamo il sabato sera al pub, voi fate rumore a pranzo, la domenica, in famiglia. È una questione di orari, più che di carattere."
    errors: [false-friend]
  - tutor: "Quindi in realtà è solo una questione di orari? Lo dirò ai miei vicini. Ci racconta un episodio del libro?"
    goals: [stereotype]
    recast: {text: "Attualmente", fix: "in realtà", tags: [false-friend]}
  - learner: "Volentieri. Il primo giorno a Napoli ho chiesto a un signore dove fosse la stazione. Lui, invece di rispondermi, mi ha presa sottobraccio e mi ci ha accompagnata, raccontandomi nel frattempo la storia di tutta la sua famiglia. Sono arrivata con mezz'ora di ritardo e un invito a pranzo per la domenica."
  - tutor: "E ci è andata, al pranzo?"
    goals: [anecdote]
  - learner: "Certo, e da allora non ho più saltato una domenica. Ma la cosa più importante che mi ha insegnato l'italiano è un'altra: a convivere con le sfumature. In inglese ero abituata a essere diretta, qui ho imparato che a volte un congiuntivo dice più di dieci parole."
  - tutor: "Il congiuntivo come forma di cortesia, che bella immagine. Siamo in chiusura: ci lascia con una frase?"
    goals: [language]
  - learner: "Direi questo: l'Italia non si capisce, si frequenta. E più la si frequenta, meno si ha voglia di capirla fino in fondo."
  - tutor: "Meravigliosa. Grazie di essere stata con noi, e buona lettura a tutti gli ascoltatori."
    goals: [farewell]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Grazie, che accoglienza! Allora mi siedo subito, prima che sparisca anche l'ultima lasagna. Anche se, a giudicare dagli sguardi, mi sa che per quella dovrò combattere."
  - tutor: "Eh, qui chi dorme non piglia pesci: o ti servi subito, o resti a bocca asciutta."
  - learner: "«Chi dorme non piglia pesci», mi piace. Immagino voglia dire che chi aspetta troppo perde le occasioni, giusto? Allora mi servo subito, prima di restare a bocca asciutta, come dici tu."
  - tutor: "Esatto, proprio quello. E dimmi, tu come sei finito a Bologna?"
    goals: [react, use-idiom]
  - learner: "Sono venuto per un master in architettura, e ho scoperto che la città è piena di portici. Così ho deciso di scrivere la tesi proprio sui portici: in questo modo ho ucciso due uccelli con una pietra, studiando e passeggiando allo stesso tempo."
    errors: [word-choice]
  - tutor: "Hai preso due piccioni con una fava, altro che! Bologna e la tesi nello stesso pacchetto."
    recast: {text: "ucciso due uccelli con una pietra", fix: "preso due piccioni con una fava", tags: [word-choice]}
  - learner: "Ah, ecco come si dice! In inglese è proprio così, con gli uccelli e la pietra, ma i piccioni e la fava mi piacciono di più: c'entra anche il cibo, quindi è molto più italiano."
  - tutor: "Da noi c'entra sempre il cibo! Raccontami qualcosa che ti è successo qui, dai."
    goals: [compare]
  - learner: "La settimana scorsa la nonna della mia coinquilina mi ha insegnato a fare i tortellini. Ne ho chiusi forse venti in un'ora, tutti storti, e lei ne ha fatti duecento nello stesso tempo. In Inghilterra di nonne così ci sono poche, purtroppo."
    errors: [ci-ne]
  - tutor: "Venti contro duecento, povero te! Ma «di nonne così ci sono poche»: quando parli di una quantità, non manca un pronome?"
    prompt: {text: "di nonne così ci sono poche", tags: [ci-ne]}
  - learner: "Sì: di nonne così ce ne sono poche. Comunque alla fine mi ha detto che sbagliando s'impara, e che tra un anno sarò bravo quanto lei."
  - tutor: "Sbagliando s'impara, certo! E quella nonna ha ragione: per i tortellini ci vuole pazienza, non talento."
    goals: [anecdote]

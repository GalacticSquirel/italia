# Set u-right-c1c2, file 3: C1, services, health, home and life in Italy. Correct combined and
# reflexive clitics (me l'ha, me lo sono fatto, gliela), preferirei che, purché, temo che; a few
# hidden slips (combined pronouns, false friend, ci/ne, possessive, auxiliary, object pronoun).
- scenario: assicurazione-sinistro
  level: C1
  persona: en-f-professional
  history: [combined-pronouns]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri sera, verso le sette, ero ferma a un semaforo in via Mazzini, a Verona, quando un furgone mi ha tamponata. Per fortuna andava piano, quindi nessuno si è fatto male, ma il paraurti posteriore è da rifare."
  - tutor: "Mi dispiace, ma meno male che state tutti bene. Lei era ferma, quindi: il conducente ha ammesso la colpa?"
    goals: [what]
  - learner: "Sì, l'ha ammessa subito, anche perché c'era una signora che aveva visto tutto. Mi ha detto che si era distratto un attimo con il navigatore. È stato molto gentile, devo dire, e si è scusato più volte."
  - tutor: "Bene, con un testimone è tutto più semplice. Avete compilato il modulo di constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo compilato insieme sul posto e l'abbiamo firmato tutti e due. Mi sono anche fatta lasciare il numero della signora, nel caso servisse. Se vuole, gli lo mando subito per email, insieme alle foto dei danni."
    errors: [combined-pronouns]
  - tutor: "Benissimo. Solo una cosa: «gli lo mando». Quando questi due pronomi si incontrano, che forma prendono?"
    prompt: {text: "gli lo mando", tags: [combined-pronouns]}
  - learner: "Ah, sì: glielo mando subito, insieme alle foto. A quale indirizzo devo scrivere?"
  - tutor: "Esatto. Lo spedisca all'indirizzo che trova sulla sua polizza, indicando il numero di pratica che le do adesso."
    goals: [documents]
  - learner: "Perfetto. E poi come funziona? Dovrò portare la macchina da un vostro carrozziere, oppure posso scegliere io dove farla riparare? Preferirei che se ne occupasse il mio meccanico, di cui mi fido ciecamente."
  - tutor: "Può scegliere lei, ma un nostro perito deve vedere l'auto prima della riparazione. La chiameranno entro tre giorni lavorativi."
    goals: [next]

- scenario: medico-specialista
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio, nel complesso, anche se un paio di volte ho avuto ancora quella sensazione del cuore che batte all'impazzata, soprattutto la sera, quando mi metto a letto. Di solito passa in pochi minuti, ma mi lascia molto stanco."
  - tutor: "Le capita anche sotto sforzo, per esempio salendo le scale?"
  - learner: "Mai sotto sforzo, curiosamente: ieri ho fatto tre piani di scale senza problemi. Martedì scorso però è durata quasi mezz'ora, e mi sono spaventato. Ho aspettato un po', sperando che passasse da sola, ma eventualmente sono andato al pronto soccorso."
    errors: [false-friend]
  - tutor: "Ha fatto benissimo ad andarci alla fine: in questi casi è sempre meglio farsi vedere. In famiglia qualcuno ha avuto problemi di cuore?"
    goals: [symptoms]
    recast: {text: "eventualmente", fix: "alla fine", tags: [false-friend]}
  - learner: "Sì, purtroppo. Mio padre è morto d'infarto a sessantadue anni, e mio fratello maggiore porta un pacemaker da quando ne aveva cinquanta. Per questo, quando il medico di base mi ha consigliato di venire da lei, non me lo sono fatto ripetere due volte."
  - tutor: "Ha fatto bene. Gli esami, comunque, sono abbastanza rassicuranti."
    goals: [history]
  - learner: "Mi fa piacere sentirlo. Ma, se non sono indiscreto, che cosa significa esattamente l'aritmia di cui parla il referto? Temo che possa peggiorare con l'età, e vorrei capire se c'è qualcosa che posso fare io."
  - tutor: "È un'aritmia che compare e scompare da sola. Va tenuta sotto controllo, ma con la terapia giusta si vive benissimo."
    goals: [understand]
  - learner: "E la terapia ha degli effetti collaterali? Mia moglie prende un farmaco simile e dice che le fa venire sonno tutto il giorno."
  - tutor: "Le prescrivo un farmaco a basso dosaggio: all'inizio può dare un po' di stanchezza, ma di solito passa in due settimane. Ci rivediamo tra un mese."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: C1
  persona: es-f-erasmus
  history: [ce-ci-sono]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille! Lo immaginiamo semplice ma curato: una cerimonia all'aperto, in campagna, con al massimo ottanta invitati. Il mio fidanzato vorrebbe che fosse a settembre, quando fa meno caldo, e su questo sono d'accordo anch'io."
  - tutor: "Settembre in campagna è perfetto, la luce è bellissima. Avete già pensato a una cifra?"
    goals: [vision]
  - learner: "Ci abbiamo pensato a lungo, e vorremmo non superare i venticinquemila euro, viaggio di nozze escluso. So che con ottanta persone non è moltissimo, ma preferiremmo spendere meno per il ricevimento e qualcosa in più per il fotografo."
  - tutor: "Con venticinquemila si può fare un bel matrimonio, se scegliamo bene. Vi ho mandato le schede delle due ville: quale vi convince di più?"
    goals: [budget]
  - learner: "Ci sono piaciute tutte e due, ma per motivi diversi. La prima ha una vista sulle colline che toglie il fiato, però la sala interna è piccola, e se piovesse saremmo un po' stretti. Nella seconda invece è anche una piccola cappella, e la mia futura suocera ne sarebbe felicissima."
    errors: [ce-ci-sono]
  - tutor: "Una cappella, che sorpresa per la suocera! Però «nella seconda è anche una cappella»: per dire che una cosa si trova in un luogo, che cosa usiamo?"
    prompt: {text: "Nella seconda invece è anche una piccola cappella", tags: [ce-ci-sono]}
  - learner: "Ah, certo: nella seconda c'è anche una piccola cappella. Quindi, se dovessimo scegliere oggi, sceglieremmo la seconda."
  - tutor: "Ottimo. Tra l'altro la seconda è più comoda da raggiungere per gli invitati anziani."
    goals: [choices]
  - learner: "Perfetto. Però vorrei porre due condizioni: che ogni spesa superiore ai cinquecento euro ci venga comunicata prima, e che il menù sia preparato da un cuoco della zona. Ci tengo che si mangino prodotti del posto."
  - tutor: "Condizioni giustissime, le metto nero su bianco nel contratto. La prossima settimana andiamo insieme a vedere la villa."
    goals: [conditions]

- scenario: recensione-ristorante
  level: C1
  persona: en-m-traveller
  history: [object-pronoun]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, mi dispiace doverlo dire, perché il locale è bellissimo, ma la cena non è stata all'altezza. Abbiamo prenotato tre settimane fa per festeggiare l'anniversario dei miei genitori, e speravamo che fosse una serata speciale."
  - tutor: "Mi dispiace molto, soprattutto per un'occasione così. Mi dica pure che cosa non è andato."
    goals: [complain]
  - learner: "Innanzitutto abbiamo aspettato quasi un'ora tra l'antipasto e il primo. Quando ho chiamato il cameriere, lo ho chiesto se ci fosse un problema in cucina, e lui mi ha risposto che non sapeva niente. Poi i risotti sono arrivati tiepidi, e uno era decisamente troppo salato."
    errors: [object-pronoun]
  - tutor: "Un'ora è davvero troppo, ha ragione. Ma «lo ho chiesto»: si chiede qualcosa a qualcuno, quindi per il cameriere quale pronome serve?"
    prompt: {text: "lo ho chiesto", tags: [object-pronoun]}
  - learner: "Giusto: gli ho chiesto se ci fosse un problema. E lui ha alzato le spalle, come se la cosa non lo riguardasse."
  - tutor: "Esatto. E questo, glielo assicuro, non è il nostro modo di lavorare: ne parlerò con lui stasera stessa."
    goals: [detail]
  - learner: "Lo apprezzo. Non pretendevamo la perfezione, ma da un ristorante con una stella ci saremmo aspettati almeno un po' di attenzione. Mia madre si era vestita elegante, ci teneva tantissimo."
  - tutor: "Aveva tutto il diritto di aspettarsela. Mi permetta di offrirvi la cena di stasera, e di invitare i suoi genitori a tornare come nostri ospiti."
    goals: [expectation]
  - learner: "È un gesto molto gentile, e lo accetto volentieri a nome di tutti. I miei genitori torneranno di sicuro, purché questa volta il risotto arrivi caldo!"
  - tutor: "Glielo prometto: il risotto lo porto io, personalmente, appena esce dalla cucina."
    goals: [resolve]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Sono qui per il lampione davanti al civico 14 di via dei Mille, che è spento da quasi due mesi. La sera la strada è completamente buia, e la settimana scorsa una signora anziana è inciampata sul marciapiede e si è rotta il polso."
  - tutor: "Mi dispiace per la signora. Ha già fatto una segnalazione?"
    goals: [describe]
  - learner: "Di segnalazioni ho fatte tre, sempre online, e tutte e tre le volte mi è arrivata una mail automatica con scritto che la pratica era stata presa in carico. Da allora, però, non si è visto nessuno."
    errors: [ci-ne]
  - tutor: "Tre volte, capisco la frustrazione. Ma «di segnalazioni ho fatte tre»: quando indica una quantità, non le manca un pronome?"
    prompt: {text: "di segnalazioni ho fatte tre", tags: [ci-ne]}
  - learner: "Ah, sì: di segnalazioni ne ho fatte tre. E vorrei capire che fine abbiano fatto, perché tre mail automatiche non bastano."
  - tutor: "Ha ragione. Purtroppo passano tutte all'ufficio tecnico, e lì i tempi sono lunghi."
    goals: [insist]
  - learner: "Capisco che l'ufficio tecnico sia sommerso di lavoro, ma qui si tratta della sicurezza delle persone. Mi risulta che, quando un guasto mette in pericolo i passanti, il Comune sia tenuto a intervenire entro pochi giorni. O mi sbaglio?"
  - tutor: "Non si sbaglia: per i guasti pericolosi il regolamento prevede un intervento entro dieci giorni."
    goals: [rights]
  - learner: "Allora le chiedo di farlo presente all'ufficio tecnico, per iscritto e citando anche l'incidente della signora. E vorrei un numero di protocollo, così, se fra dieci giorni il lampione fosse ancora spento, saprei a chi rivolgermi."
  - tutor: "Glielo preparo subito, con il riferimento all'incidente. Ecco il protocollo: se entro dieci giorni non cambia nulla, chieda direttamente del responsabile tecnico."
    goals: [commitment]

- scenario: trattativa-affitto
  level: C1
  persona: en-f-student
  history: [possessive]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, devo dire. È luminoso, il quartiere è tranquillo, e soprattutto è a dieci minuti a piedi dalla facoltà dove faccio il dottorato. L'unica cosa che mi lascia un po' perplessa è la cucina, che mi sembra rimasta agli anni Settanta."
  - tutor: "La cucina è un po' vecchia, lo ammetto, ma funziona tutto. Il proprietario chiede novecento euro al mese."
    goals: [interest]
  - learner: "Novecento mi sembrano tanti, considerando la cucina e il fatto che le finestre non sono doppie. Annunci simili nella zona li ho visti a ottocento, ottocentocinquanta al massimo. Se il proprietario accettasse ottocentocinquanta, firmerei anche domani."
  - tutor: "Posso provare a proporglielo, ma non le garantisco niente. Ha altre richieste?"
    goals: [negotiate]
  - learner: "Sì, due. Vorrei che la caldaia venisse controllata prima del mio ingresso, perché il libretto risulta scaduto da un anno. E poi, siccome la mia sorella verrà a stare da me per qualche mese, vorrei sapere se nel contratto ci sono limiti per gli ospiti."
    errors: [possessive]
  - tutor: "Richieste ragionevoli. Ma ripeta «la mia sorella»: con i nomi di parentela al singolare, l'articolo ci vuole?"
    prompt: {text: "la mia sorella", tags: [possessive]}
  - learner: "No, giusto: mia sorella. Starà da me da marzo a giugno, per uno stage."
  - tutor: "Perfetto. Per un ospite di qualche mese non ci sono problemi, e la caldaia gliela facciamo controllare entro fine mese."
    goals: [conditions]
  - learner: "Allora, se il proprietario accetta gli ottocentocinquanta euro, per me possiamo procedere. Mi faccia sapere entro venerdì, perché sto valutando anche un altro appartamento e non vorrei perderli tutti e due."
  - tutor: "Lo chiamo oggi stesso e la richiamo entro giovedì. Ho la sensazione che ci metteremo d'accordo."
    goals: [conclude]

- scenario: vita-in-italia
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. In realtà non l'ho scelta io, è stata l'Italia a scegliere me: ero venuta a Perugia per un corso estivo di tre settimane, e alla fine sono rimasta sette anni. Se qualcuno me l'avesse detto allora, mi sarei messa a ridere."
  - tutor: "Tre settimane diventate sette anni: una bella storia. E le difficoltà più grandi, all'inizio?"
    goals: [story]
  - learner: "Senza dubbio la burocrazia. Per ottenere il permesso di soggiorno sono dovuta tornare in questura cinque volte, e ogni volta mi chiedevano un documento diverso. Ricordo un impiegato che, vedendomi arrivare per la quarta volta, mi ha offerto un caffè per consolarmi."
  - tutor: "Almeno il caffè! E lei, in questi anni, è cambiata?"
    goals: [difficulties]
  - learner: "Moltissimo. Sono diventata molto più paziente, e ho imparato a dare importanza a cose che prima trascuravo, come pranzare con calma o fare due chiacchiere con il vicino. Quando torno a Londra, i miei amici mi dicono che parlo con le mani, e hanno ragione."
  - tutor: "Parlare con le mani è il primo segno di integrazione! Che consiglio darebbe a chi pensa di trasferirsi qui?"
    goals: [change]
  - learner: "Gli direi di imparare la lingua prima di partire, anche solo le basi, perché cambia completamente il modo in cui si viene accolti. E di non farsi scoraggiare dalle prime difficoltà: chi ha pazienza, prima o poi viene ricompensato."
  - tutor: "Imparare la lingua e armarsi di pazienza: due consigli preziosi. Grazie di essere stata con noi."
    goals: [advice]

- scenario: intervista-podcast
  level: C1
  persona: en-m-traveller
  history: [auxiliary-choice]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Ciao, grazie a voi! Sono arrivato per lavoro, nel 2018: l'azienda di software per cui lavoravo a Dublino aveva aperto un ufficio a Torino e cercava qualcuno disposto a trasferirsi. Mi ero offerto quasi per scherzo, e due mesi dopo ero già qui."
  - tutor: "Quasi per scherzo, mi piace. E il primo impatto com'è stato?"
    goals: [story]
  - learner: "Divertente e un po' traumatico. La cosa che mi ha sorpreso di più è il rapporto con il cibo: in ufficio si parlava di cosa mangiare a pranzo già alle dieci di mattina. E guai a ordinare un cappuccino dopo pranzo: la prima volta che l'ho fatto, il barista mi ha guardato come se avessi bestemmiato."
  - tutor: "Il cappuccino dopo pranzo, un classico! C'è anche qualcosa che ti piace meno, dell'Italia?"
    goals: [culture-shock]
  - learner: "Sì, anche se lo dico con affetto. Mi pesa il fatto che per molte cose servano le conoscenze giuste: quando cercavo casa, per esempio, ho rimasto senza risposta per mesi, finché un collega non ha telefonato a un suo cugino."
    errors: [auxiliary-choice]
  - tutor: "Le conoscenze giuste, eh. Ma «ho rimasto»: rimanere, al passato prossimo, va davvero con avere?"
    prompt: {text: "ho rimasto", tags: [auxiliary-choice]}
  - learner: "Ah, giusto: sono rimasto senza risposta per mesi. Il cugino, invece, mi ha trovato un appartamento in due giorni."
  - tutor: "Esatto, e il cugino risolve tutto: lo conosciamo bene. Che consiglio daresti a chi ci ascolta e pensa di trasferirsi?"
    goals: [critique]
  - learner: "Di costruirsi subito una rete di amicizie italiane, invece di frequentare solo altri stranieri. Io all'inizio ho fatto questo errore, e me ne sono pentito. E poi di non prendersela troppo per la burocrazia: prima o poi tutto si risolve, magari davanti a un caffè."
  - tutor: "Una rete di amici e un po' di filosofia: consiglio prezioso. Grazie mille di essere passato!"
    goals: [advice]

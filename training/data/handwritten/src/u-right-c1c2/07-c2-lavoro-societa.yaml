# Set u-right-c1c2, file 7: C2, work and society. Correct che + subjunctive subject clauses,
# perché + subjunctive of purpose, vorrei che ne parlassimo, a patto che; slips in subjunctive
# after preferirei / a patto che (failed prompts recast with neutral spans), relative a cui,
# false friends, calques, register, ne with dislocated partitives, passive agreement.
- scenario: colloquio-promozione
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie di avermi concesso questo spazio. Come sa, da quando Marco è andato via, il coordinamento dei due progetti europei è ricaduto su di me, e nonostante il carico di lavoro raddoppiato abbiamo rispettato tutte le scadenze. Ci tenevo che lo sapesse da me, prima di leggerlo nelle relazioni."
  - tutor: "Lo so, e non è passato inosservato. Che cosa mi chiede, esattamente?"
    goals: [results]
  - learner: "Le chiedo di essere nominata responsabile dell'area progetti, con il relativo adeguamento economico. Non pretendo una risposta oggi, ma preferirei che la decisione viene presa prima della pausa estiva, perché a settembre partono due nuovi bandi."
    errors: [subjunctive-use]
  - tutor: "Richiesta chiara. Ma «preferirei che la decisione viene presa»: dopo un condizionale come preferirei, che modo e che tempo servono?"
    prompt: {text: "preferirei che la decisione viene presa", tags: [subjunctive-use]}
  - learner: "Sì, scusi: preferirei che la decisione sia presa prima della pausa estiva."
    errors: [subjunctive-use]
  - tutor: "Lei vorrebbe che la decisione venisse presa prima dell'estate, e lo capisco. Il problema è che il budget del personale si decide a ottobre."
    goals: [request]
    recast: {text: "che la decisione sia presa", fix: "che la decisione venisse presa", tags: [subjunctive-use]}
  - learner: "Ne sono consapevole, ed è proprio per questo che ne parlo adesso. Se la nomina arrivasse a luglio, l'adeguamento potrebbe benissimo decorrere da ottobre: a me interessa soprattutto avere l'autorità per firmare i nuovi accordi con i partner."
  - tutor: "Questa è una proposta che posso portare in direzione. Mi dia una settimana."
    goals: [handle]
  - learner: "Una settimana va benissimo. Intanto le preparo una nota sintetica con i risultati degli ultimi due anni, così avrà tutti gli elementi a portata di mano quando ne parlerà con la direzione."
  - tutor: "Perfetto, me la mandi entro mercoledì. Ci rivediamo lunedì prossimo con una risposta."
    goals: [next-steps]

- scenario: dibattito-ambiente
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Con tutto il rispetto, non sono d'accordo. Che la chiusura abbia un costo nel breve periodo non lo nego, ma in quasi tutte le città europee in cui è stata fatta, dopo un paio d'anni i negozi del centro hanno visto aumentare i clienti, non diminuire."
  - tutor: "Le città europee hanno metropolitane e parcheggi di scambio. Noi abbiamo due autobus all'ora."
    goals: [position]
  - learner: "È proprio questo il punto. La chiusura dovrebbe andare di pari passo con un piano di trasporti serio: autobus ogni dieci minuti e una pista ciclabile larga tre chilometri, dalla stazione fino al centro storico. Senza alternative, chiudere sarebbe solo una punizione."
    errors: [false-friend]
  - tutor: "Una pista ciclabile lunga tre chilometri costa, e anche gli autobus ogni dieci minuti. Chi li paga?"
    goals: [argue]
    recast: {text: "larga tre chilometri", fix: "lunga tre chilometri", tags: [false-friend]}
  - learner: "In parte i fondi europei per la mobilità sostenibile, che il nostro Comune finora non ha mai chiesto, e in parte gli introiti dei parcheggi a pagamento in periferia. Non è fantascienza: Ferrara lo fa da anni, e nessuno pensa di tornare indietro."
  - tutor: "Ferrara è in pianura e piena di biciclette per tradizione. Qui siamo in collina."
    goals: [counter]
  - learner: "Su questo ha ragione, lo concedo: non possiamo copiare Ferrara tale e quale. Potremmo però cominciare con una zona a traffico limitato solo nelle ore di punta, e intanto potenziare gli autobus elettrici sulle salite. Se tra un anno i dati fossero negativi, si potrebbe sempre ridiscutere tutto."
  - tutor: "Una zona limitata nelle ore di punta, con una verifica dopo un anno: su questo possiamo lavorare insieme."
    goals: [concede]

- scenario: intelligenza-artificiale
  level: C2
  persona: en-m-retired
  history: [stare-gerund]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco che faccia paura, ma ricordati che la stessa cosa si diceva dei computer negli anni Ottanta. Io ho lavorato in banca per trentacinque anni, e quando sono arrivati i primi terminali tutti erano convinti che metà degli sportelli avrebbe chiuso entro dieci anni."
  - tutor: "E infatti gli sportelli hanno chiuso, solo che ci hanno messo trent'anni!"
  - learner: "Vero, ma nel frattempo sono nati lavori che allora nessuno immaginava. Non dico che andrà tutto bene, dico solo che le previsioni catastrofiche si sono quasi sempre rivelate sbagliate. Detto questo, ultimamente sto avendo qualche dubbio anch'io, soprattutto per i giovani che cominciano adesso."
    errors: [stare-gerund]
  - tutor: "Ah, anche tu! Ma «sto avendo qualche dubbio»: con un verbo di stato come avere, la forma con stare suona naturale in italiano?"
    goals: [position]
    prompt: {text: "sto avendo qualche dubbio", tags: [stare-gerund]}
  - learner: "No, hai ragione, è un calco dall'inglese: ho qualche dubbio anch'io. Mio nipote fa il grafico, e da quando i clienti generano le immagini da soli ha perso quasi metà del lavoro."
  - tutor: "Esatto. Vedi? È proprio quello che dicevo io."
    goals: [evidence]
  - learner: "Su questo ti do ragione: per chi fa lavori creativi di base il colpo è durissimo, e sarebbe ipocrita negarlo. Però mio nipote si è reinventato: adesso insegna ai piccoli studi a usare questi programmi, e guadagna più di prima. Non è detto che vada così per tutti, ma dimostra che un margine c'è."
  - tutor: "Tuo nipote è uno sveglio, ma non tutti hanno la sua prontezza."
    goals: [concede]
  - learner: "Appunto. Ed è lì che dovremmo intervenire: non per fermare la tecnologia, che sarebbe impossibile, ma perché nessuno resti indietro. Forse su questo, alla fine, la pensiamo allo stesso modo."
  - tutor: "Diciamo che ci incontriamo a metà strada: io meno catastrofico, tu un po' meno ottimista. Brindiamo?"
    goals: [conclude]

- scenario: mediazione-colleghi
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ha fatto bene a venire, e la ringrazio della franchezza. Mi dica pure, con calma: preferisco sentire la sua versione prima di farmi un'idea."
  - tutor: "Nella newsletter interna è uscito un articolo sul nostro progetto europeo, firmato solo da Luca. Io ci ho messo sei mesi, e il mio nome non c'è."
    goals: [listen]
  - learner: "Capisco che sia umiliante, soprattutto dopo un lavoro così lungo. Mi aiuti a capire una cosa: l'articolo Luca l'ha scritto da solo, o ha ripreso parti della bozza che tutti abbiamo lavorato a gennaio?"
    errors: [relative-pronoun]
  - tutor: "Grazie di chiederlo. Ma «la bozza che tutti abbiamo lavorato»: si lavora a qualcosa, quindi quale relativo ci vuole?"
    prompt: {text: "bozza che tutti abbiamo lavorato", tags: [relative-pronoun]}
  - learner: "Sì, scusi: la bozza che tutti abbiamo lavorato sopra a gennaio, quella condivisa."
    errors: [relative-pronoun]
  - tutor: "La bozza a cui tutti abbiamo lavorato a gennaio, esatto: interi paragrafi sono copiati da lì, parola per parola."
    goals: [clarify]
    recast: {text: "la bozza che tutti abbiamo lavorato sopra", fix: "la bozza a cui tutti abbiamo lavorato", tags: [relative-pronoun]}
  - learner: "Allora la cosa è seria, e non la lascerò correre. Detto questo, stamattina ho parlato con Luca, e mi ha detto che la redazione gli aveva chiesto un testo in poche ore e che, nella fretta, non aveva pensato a citare gli altri. Non lo giustifico, ma credo che sia stata più distrazione che malafede."
  - tutor: "Sarà. Ma intanto in azienda tutti pensano che il progetto sia suo."
    goals: [perspective]
  - learner: "Per questo propongo due cose. Chiederò alla redazione di pubblicare una rettifica nel prossimo numero, con i nomi di tutto il gruppo, e d'ora in avanti ogni testo sul progetto passerà da me prima di uscire. Se lei è d'accordo, vorrei anche che ne parlassimo tutti e tre insieme, venerdì."
  - tutor: "Mi sembra giusto. La rettifica mi basta, e venerdì ci sarò."
    goals: [solution]

- scenario: notizie-attualita
  level: C2
  persona: en-f-student
  history: [register]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Sì, l'ho seguita con un interesse un po' egoistico, devo ammettere. Sto cercando una stanza a Milano da tre mesi, e ogni volta che ne trovo una decente scopro che il proprietario preferisce affittarla ai turisti per il fine settimana. Se la legge funzionasse, molte di quelle stanze tornerebbero sul mercato."
  - tutor: "Tre mesi, che incubo. Ma ti sembra che la legge vada nella direzione giusta?"
    goals: [summarise]
  - learner: "Nella direzione sì, nei tempi no. Il limite di novanta notti è ragionevole, però i proprietari avranno due anni per adeguarsi, e nel frattempo noi studenti continueremo a pagare settecento euro per un posto letto. È una di quelle riforme che piacciono a tutti proprio perché non cambiano niente subito."
  - tutor: "Cinica, ma non hai torto. E all'estero come ne hanno parlato?"
    goals: [opinion]
  - learner: "Un giornale inglese l'ha messa in prima pagina, con un titolo sull'Italia che finalmente si sveglia, mentre un quotidiano spagnolo la definiva timida rispetto a Barcellona. Ieri ho anche preso una foto della prima pagina di un giornale di Milano, che parlava invece di «guerra ai proprietari»: tre giornali, tre leggi diverse."
    errors: [word-choice]
  - tutor: "Hai fatto una foto alla prima pagina? Mandamela, voglio vedere quel titolo. Tre giornali, tre leggi: un classico."
    goals: [sources]
    recast: {text: "preso una foto", fix: "fatto una foto", tags: [word-choice]}
  - learner: "Te la mando subito. Comunque, secondo Lei, che cosa succederà ai prezzi nei prossimi due anni? Io temo che scendano solo di poco."
    errors: [register]
  - tutor: "Ehi, «secondo Lei»? Da quando in qua ci diamo del Lei, noi due?"
    prompt: {text: "secondo Lei", tags: [register]}
  - learner: "Hai ragione, scusa, mi è scappato: secondo te, che cosa succederà ai prezzi? Io temo che scendano di poco, e che i proprietari più furbi trovino qualche scappatoia."
  - tutor: "Così va meglio. Secondo me in periferia scenderanno un po', in centro per niente. Ma la tua stanza la troviamo, vedrai: chiedo anche a mia zia."
    goals: [consequences]

- scenario: politica-lavoro
  level: C2
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Tu lo dici da almeno cinque anni, Riccardo, e intanto la disoccupazione è scesa. Che molti lavori cambino radicalmente è sicuro, ma ti ricordo che negli ultimi vent'anni, di lavori nuovi, sono nati tantissimi: chi avrebbe mai immaginato un mestiere come il social media manager?"
    errors: [ci-ne]
  - tutor: "Il social media manager, che mestiere! Ma «di lavori nuovi, sono nati tantissimi»: con quel «di lavori» staccato all'inizio, non manca un pronome?"
    prompt: {text: "di lavori nuovi, sono nati tantissimi", tags: [ci-ne]}
  - learner: "Sì: di lavori nuovi ne sono nati tantissimi. E nessuno li aveva previsti, nemmeno gli esperti."
  - tutor: "Esatto. Ma immagina: se domani un'intelligenza artificiale facesse anche il social media manager, che cosa resterebbe?"
    goals: [opinion]
  - learner: "Resterebbe tutto ciò che richiede fiducia e responsabilità. Anche se una macchina scrivesse i post di un'azienda, ci vorrebbe comunque qualcuno che decida che cosa dire, a chi e quando, e che ne risponda se qualcosa va storto."
  - tutor: "Bella frase, ma fammi un esempio concreto, non una teoria."
    goals: [hypothesis]
  - learner: "Mio cugino lavora in un'agenzia di viaggi a Valencia. Quando sono arrivate le prenotazioni online, tutti gli dicevano che avrebbe chiuso entro un anno; invece si è specializzato in viaggi su misura per anziani e famiglie numerose, cioè proprio quei clienti che online si perdono. Adesso ha più lavoro di prima."
  - tutor: "Tuo cugino si è trovato una nicchia, ma non tutti possono vivere di nicchie."
    goals: [example]
  - learner: "Lo so, e ammetto che il passaggio sarà doloroso per molti. In sintesi, penso che il lavoro cambierà forma, ma non sparirà, a patto che la politica accompagni il cambiamento invece di subirlo. Tu però, sinceramente, credi ancora che metà dei lavori sia destinata a sparire?"
  - tutor: "Diciamo che stasera sono sceso al trenta per cento. Merito tuo, e di questo vino."
    goals: [conclude]

- scenario: presentazione-progetto
  level: C2
  persona: en-m-traveller
  history: [passive]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie per il tempo. Il progetto è semplice: affiancare a ogni neoassunto un collega esperto per i primi sei mesi. L'anno scorso abbiamo perso dodici dei trenta giovani assunti entro il primo anno, e dai colloqui di uscita emerge che quasi tutti si sentivano abbandonati a se stessi."
  - tutor: "Dodici su trenta è un dato pesante. Ma che cosa ci guadagna l'azienda, in concreto?"
    goals: [pitch]
  - learner: "Ogni sostituzione ci costa, tra selezione e formazione, circa quindicimila euro. Se il programma dimezzasse le uscite, risparmieremmo novantamila euro all'anno, contro un costo di circa trentamila per le ore dei mentori. Insomma, anche nell'ipotesi più prudente, l'investimento fa senso."
    errors: [word-choice]
  - tutor: "Sì, l'investimento ha senso, se quelle stime reggono. Ma chi ci garantisce che i colleghi esperti abbiano tempo e voglia di fare i mentori?"
    goals: [benefits]
    recast: {text: "fa senso", fix: "ha senso", tags: [word-choice]}
  - learner: "È il rischio principale, e ci ho riflettuto a lungo. I mentori sarebbero scelto su base volontaria, con due ore settimanali riconosciute come orario di lavoro e un piccolo premio legato alla permanenza dei neoassunti. In questo modo nessuno si sentirebbe costretto, e chi partecipa avrebbe un interesse reale."
    errors: [passive]
  - tutor: "Il premio legato ai risultati mi piace. Ma «i mentori sarebbero scelto»: il participio concorda con chi?"
    prompt: {text: "I mentori sarebbero scelto", tags: [passive]}
  - learner: "Con i mentori, naturalmente: sarebbero scelti su base volontaria. Abbiamo già una quindicina di colleghi che si sono detti disponibili."
  - tutor: "Esatto. Quindici volontari prima ancora di partire sono un buon segnale."
    goals: [objection]
  - learner: "Proporrei di partire a gennaio con un gruppo pilota di dieci neoassunti e dieci mentori, e di misurare i risultati a giugno. Se lei fosse d'accordo, potrei presentarle un calendario dettagliato già la settimana prossima."
  - tutor: "D'accordo per il gruppo pilota. Mi porti il calendario giovedì, e prepari anche gli indicatori con cui misureremo i risultati."
    goals: [next-steps]

- scenario: trattativa-fornitore
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, e non le nascondo che il vostro nuovo listino ci ha messo in difficoltà. Un aumento del dodici per cento sulle scatole per le bottiglie, a due mesi dalla vendemmia, ci costringerebbe a rivedere tutti i prezzi già concordati con i distributori."
  - tutor: "Lo capisco, ma il cartone è aumentato del venti per cento in sei mesi. Noi ne assorbiamo già una parte."
    goals: [problem]
  - learner: "Non lo metto in dubbio. Mi permetto però di ricordarle che siamo vostri clienti da undici anni e che, in tutto questo tempo, non vi abbiamo mai chiesto una dilazione di pagamento. Se cambiassimo fornitore adesso, perderemmo entrambi: noi la vostra qualità, voi un cliente che paga a trenta giorni."
  - tutor: "Su questo siamo d'accordo. Che cosa mi propone?"
    goals: [argue]
  - learner: "Le propongo di applicare un aumento del sei per cento, a patto che il prezzo resta bloccato fino a dicembre. In cambio vi anticiperemmo l'ordine di tutto l'anno, circa quarantamila scatole, così potreste organizzare la produzione con largo anticipo."
    errors: [subjunctive-use]
  - tutor: "Interessante, l'ordine annuale anticipato. Ma «a patto che il prezzo resta»: a patto che, come purché, quale modo richiede?"
    prompt: {text: "a patto che il prezzo resta", tags: [subjunctive-use]}
  - learner: "Sì, giusto: a patto che il prezzo rimane bloccato fino a dicembre, senza altri ritocchi."
    errors: [subjunctive-use]
  - tutor: "D'accordo: sei per cento, a patto che il prezzo rimanga bloccato fino a dicembre e che l'ordine annuale ci arrivi entro il mese. Mi sembra un equilibrio ragionevole."
    goals: [counteroffer]
    recast: {text: "che il prezzo rimane bloccato", fix: "che il prezzo rimanga bloccato", tags: [subjunctive-use]}
  - learner: "Perfetto. Allora le mando oggi stesso l'ordine firmato e le chiedo di confermarmi le condizioni per iscritto. Mi farebbe piacere che, con il nuovo anno, ci rivedessimo per parlare di un accordo pluriennale."
  - tutor: "Le confermo tutto per iscritto entro domani. E dell'accordo pluriennale parliamo volentieri a gennaio, magari davanti a un bicchiere del vostro vino."
    goals: [agreement]

# Set u-right-c1c2, file 1: C1, work and paperwork. Long, correct learner turns with advanced
# grammar (benché, purché, vorrei che, preferirei che, gradirei che, combined clitics, passive
# with venire/andare); a few subtle errors hidden inside otherwise correct turns.
- scenario: colloquio-lavoro
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, grazie per avermi ricevuta. Sono spagnola, di Valencia, e ho insegnato disegno tecnico in un liceo per quasi dieci anni. Benché l'insegnamento mi piacesse molto, da un po' sentivo il bisogno di mettermi alla prova in un ambiente diverso."
  - tutor: "Dal liceo a uno studio di design: un bel salto. Che cosa faceva, oltre alle lezioni?"
    goals: [intro]
  - learner: "Coordinavo i laboratori di progettazione, e due anni fa i miei studenti hanno vinto un concorso regionale con una lampada che avevano disegnato e stampato loro. Il prototipo, che ci era stato chiesto da un'azienda di Alicante, è poi andato in produzione."
  - tutor: "Una lampada in produzione: complimenti ai suoi ragazzi, e a chi li guidava. Quali sono i suoi punti di forza? E, se vuole, anche un punto debole."
    goals: [experience]
  - learner: "Credo di saper spiegare idee complicate in modo semplice, il che con i clienti serve parecchio. Come punto debole, tendo a voler controllare ogni dettaglio da sola, anche quando sarebbe più sensato delegare."
  - tutor: "Lo dicono in tanti, ma lei almeno ne è consapevole. Perché proprio il nostro studio?"
    goals: [strengths]
  - learner: "Ho seguito i vostri progetti per le biblioteche di quartiere, e mi ha colpito che abbiate coinvolto i bambini nella progettazione. Se potessi lavorare a progetti di quel tipo, metterei a frutto tutto quello che ho imparato a scuola. Mi piacerebbe che il mio lavoro avesse ancora un lato educativo."
  - tutor: "Le biblioteche sono il progetto di cui andiamo più fieri. Ha qualche domanda per noi?"
    goals: [why]
  - learner: "Sì, vorrei sapere se il ruolo prevede rapporti diretti con i clienti, o se il lavoro si svolge soprattutto in studio. E, se non è indiscreto, quando pensate di prendere una decisione."
  - tutor: "Metà e metà: si lavora in studio, ma con un incontro settimanale con i clienti. Decidiamo entro due settimane e la chiamiamo in ogni caso."
    goals: [questions]

- scenario: colloquio-promozione
  level: C1
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, se ha qualche minuto. Da gennaio seguo io le prenotazioni dei gruppi, e il fatturato di quel settore è cresciuto del diciotto per cento. Non è detto che dipenda tutto da me, ma il nuovo sistema di offerte l'ho ideato io."
  - tutor: "Un diciotto per cento si nota, l'ho visto anch'io nei dati di questi mesi. Dove vuole arrivare?"
    goals: [results]
  - learner: "Vorrei che il mio ruolo venisse riconosciuto anche formalmente. Al momento sono inquadrato come assistente, ma di fatto gestisco un portafoglio clienti da solo. Preferirei che se ne parlasse adesso, prima della revisione dei contratti di marzo."
  - tutor: "Capisco. Però lei è con noi da meno di due anni, e di solito per un passaggio del genere ne servono almeno tre."
    goals: [request]
  - learner: "Lo so, e non pretendo che si faccia un'eccezione solo per me. Però potremmo concordare tre obiettivi precisi per i prossimi mesi. Se li raggiungessi entro giugno, la promozione me la daresti già con il nuovo anno?"
    errors: [register]
  - tutor: "Proposta interessante. Ma rilegga mentalmente quel «me la daresti»: con chi sta parlando, in questo momento?"
    prompt: {text: "me la daresti", tags: [register]}
  - learner: "Ha ragione, mi scusi: me la darebbe già con il nuovo anno? Con i colleghi mi viene spontaneo il tu."
  - tutor: "Perfetto, nessun problema. L'idea degli obiettivi mi convince: ne fissiamo tre, misurabili, e a giugno facciamo il punto."
    goals: [handle]
  - learner: "Mi sembra corretto. Se è d'accordo, le mando una proposta di obiettivi entro venerdì, così ne parliamo con calma la settimana prossima."
  - tutor: "D'accordo, aspetto la sua proposta venerdì. E se a giugno i numeri sono questi, il titolo glielo firmo io stesso."
    goals: [next-steps]

- scenario: presentazione-progetto
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "La ringrazio. Le propongo di installare dei pannelli solari sui tetti dei nostri tre magazzini. Si tratta di una superficie enorme che oggi non viene usata per niente, e che potrebbe coprire quasi metà del nostro fabbisogno elettrico."
  - tutor: "Metà del fabbisogno è un'affermazione forte. Su che numeri si basa?"
    goals: [pitch]
  - learner: "Su due studi che ci sono stati preparati gratuitamente da due fornitori diversi. Entrambi stimano che l'impianto si ripagherebbe in sei anni, e dopo continuerebbe a produrre per almeno altri quindici. Senza contare gli incentivi regionali, di cui potremmo approfittare fino a dicembre."
  - tutor: "Gli incentivi li conosco, e scadono davvero a dicembre. Ma sei anni sono tanti, e il tetto di Lodi ha più di trent'anni."
    goals: [benefits]
  - learner: "È un dubbio legittimo, e me lo sono posto anch'io. Il fornitore più serio ha fatto un sopralluogo e dice che i tetti reggono, purché si rinforzano le travi del magazzino di Lodi. Ho già chiesto un preventivo anche per questo lavoro."
    errors: [subjunctive-use]
  - tutor: "Bene il preventivo. Ma ripeta quel «purché si rinforzano»: dopo purché, quale modo vuole il verbo?"
    prompt: {text: "purché si rinforzano", tags: [subjunctive-use]}
  - learner: "Purché si rinforzino le travi, certo. Il lavoro costa circa quarantamila euro, già compresi nel piano che le ho mandato."
  - tutor: "Esatto. Quarantamila sul totale sono accettabili, se il resto dei conti regge."
    goals: [objection]
  - learner: "Allora le proporrei di partire dal magazzino di Pavia, che è il più recente. Se lei è d'accordo, potrei convocare i due fornitori entro la fine del mese, così avrebbe davanti le offerte definitive."
  - tutor: "Va bene, cominciamo da Pavia. Fissi l'incontro e mi mandi le due offerte almeno tre giorni prima."
    goals: [next-steps]

- scenario: riunione-lavoro
  level: C1
  persona: es-m-worker
  history: [article-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Insomma, ci siamo quasi. Lo stand per la fiera di Verona è stato approvato dagli organizzatori, e i pannelli vanno consegnati entro il dieci. Mancano solo i materiali stampati, che ho ordinato ieri."
  - tutor: "Mi sembra tutto in ordine. Allora perché quella faccia?"
    goals: [update]
  - learner: "Perché la tipografia mi ha appena scritto che la carta che avevamo scelto è finita. Me l'hanno detto solo stamattina, anche se probabilmente lo sapevano da giorni. Se me l'avessero detto prima, avrei potuto cercare un'alternativa con calma."
  - tutor: "Classico. E adesso che strade abbiamo?"
    goals: [problem]
  - learner: "Ne vedo due. O accettiamo una carta riciclata, che costa un po' di più ma arriva subito, o rimandiamo la stampa di una settimana. Io sarei per la prima: la differenza è di trecento euro, e in fiera parlare di sostenibilità fa sempre una bella figura."
  - tutor: "Trecento euro li troviamo. Vada per la riciclata."
    goals: [proposal]
  - learner: "Perfetto, allora confermo l'ordine oggi pomeriggio. Se tutto va bene, i depliant arriveranno il otto, cioè due giorni prima della consegna dei pannelli."
    errors: [article-form]
  - tutor: "Ottimo. Solo una cosa: «il otto». Davanti a quel numero, l'articolo resta così?"
    prompt: {text: "il otto", tags: [article-form]}
  - learner: "No, giusto: arriveranno l'otto. Quindi ci restano due giorni di margine, che non sono tanti ma dovrebbero bastare."
  - tutor: "Esatto. Due giorni bastano: l'importante è che mi scrivi appena hai la conferma della tipografia."
    goals: [deadline]

- scenario: smartworking
  level: C1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Ormai faccio metà e metà: lunedì e venerdì da casa, gli altri giorni in redazione. All'inizio pensavo che sarei stato più produttivo a casa, ma mi sono accorto che senza i colleghi intorno mi distraggo molto di più."
  - tutor: "Succede a tanti. E l'ufficio che cosa ti dà, in concreto?"
    goals: [situation]
  - learner: "Le chiacchiere alla macchinetta, soprattutto. Sembra una sciocchezza, ma molte idee per i nostri articoli sono nate così, davanti a un caffè. E poi in redazione c'è sempre qualcuno a cui chiedere un parere al volo."
  - tutor: "Vero, le idee migliori arrivano spesso per caso. Però da casa almeno risparmi il viaggio, no?"
    goals: [pros]
  - learner: "Quello sì, e non è poco: in treno metto un'ora e mezza ad andare e altrettanto a tornare. Però, lavorando da solo, finisco per non staccare mai, e la sera mi ritrovo ancora davanti al computer alle nove."
    errors: [ci-ne]
  - tutor: "Tre ore al giorno, accidenti. Ma ripeti quel «metto un'ora e mezza»: quando parli del tempo di un viaggio, al verbo non manca una parolina?"
    prompt: {text: "metto un'ora e mezza", tags: [ci-ne]}
  - learner: "Hai ragione: ci metto un'ora e mezza. E mia moglie dice che, tra il treno e il lavoro fino a tardi, sono diventato un fantasma."
  - tutor: "Esatto. Un fantasma con il portatile, me lo immagino! Quindi, potendo scegliere, come ti organizzeresti?"
    goals: [cons]
  - learner: "Se potessi decidere io, andrei in redazione tre giorni e lavorerei da casa gli altri due. Il mio capo preferisce che stiamo tutti in ufficio il mercoledì, per la riunione, quindi il mercoledì lo terrei comunque fisso."
  - tutor: "Il mercoledì fisso ha senso. E tre giorni su cinque mi sembrano un buon equilibrio: ne parlerai al capo?"
    goals: [preference]
  - learner: "Sì, glielo propongo lunedì, sperando che non la prenda male. È un tipo un po' permaloso, ma in fondo è una brava persona."
  - tutor: "Se glielo presenti come un modo per lavorare meglio, non avrà niente da ridire. Poi mi racconti com'è andata."

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno, sì, la chiamo proprio per quello. Capisco che i costi siano saliti, ma un aumento del quindici per cento tutto in una volta per noi è insostenibile. Lavoriamo insieme da sei anni e non ci era mai successo niente di simile."
  - tutor: "Lo so, e mi dispiace. Ma il cacao è quasi raddoppiato in un anno: non possiamo assorbire tutto noi."
    goals: [problem]
  - learner: "Non pretendo che lo assorbiate voi. Le faccio solo notare che abbiamo sempre pagato puntualmente, e che i nostri ordini sono cresciuti ogni anno. Un cliente così, di questi tempi, non lo si trova facilmente."
  - tutor: "Questo glielo riconosco: siete tra i clienti più affidabili che abbiamo. Che cosa propone?"
    goals: [argue]
  - learner: "Le proporrei un aumento dell'otto per cento adesso e un altro piccolo ritocco a settembre, se il prezzo del cacao non scende. In cambio ci impegneremmo di ordinare almeno venti quintali al mese per tutto l'anno."
    errors: [preposition]
  - tutor: "Venti quintali al mese, interessante. Ma «ci impegneremmo di ordinare»: con impegnarsi, quale preposizione regge l'infinito?"
    prompt: {text: "ci impegneremmo di ordinare", tags: [preposition]}
  - learner: "Ci impegneremmo a ordinare, mi scusi. Venti quintali al mese, con un contratto annuale."
  - tutor: "Giusto. Con un contratto annuale posso portare la sua proposta alla direzione già domani."
    goals: [counteroffer]
  - learner: "Mi farebbe un grande favore. Gradirei che mi rispondeste entro venerdì, perché lunedì dobbiamo chiudere il listino per i negozi, e preferirei non doverlo cambiare dopo."
  - tutor: "Facciamo così: se la direzione approva il contratto annuale, l'otto per cento glielo garantisco io. Venerdì le mando la conferma per iscritto."
    goals: [agreement]

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ha fatto bene a venire subito, invece di tenerselo dentro. Si sieda, prego. Mi racconti con calma che cosa è successo, così capisco anche il suo punto di vista."
  - tutor: "Ieri Paolo ha presentato al cliente l'analisi dei costi come se l'avesse fatta lui. Io ci ho lavorato tre settimane, e non mi ha nemmeno nominata."
    goals: [listen]
  - learner: "Capisco quanto sia stato frustrante, soprattutto davanti al cliente. Mi aiuti a ricostruire i fatti: l'analisi gliel'aveva mandata lei, o Paolo l'aveva trovata nella cartella condivisa?"
  - tutor: "Gliel'avevo mandata io, venerdì, con una mail in cui chiedevo di citare tutto il gruppo. Quella mail ce l'ho ancora."
    goals: [clarify]
  - learner: "Allora i fatti sono chiari. Detto questo, conosco Paolo da anni e non credo che l'abbia fatto con cattiveria: quando è sotto pressione tende a dimenticarsi di tutto il resto. Questo non lo giustifica, naturalmente, ma forse spiega quello che è successo."
  - tutor: "Può darsi. Ma intanto il cliente è convinto che il lavoro sia suo."
    goals: [perspective]
  - learner: "Su questo ha ragione, e bisogna rimediare. Scriverò io stessa al cliente per ringraziare tutta la squadra, citando chi ha lavorato all'analisi. E con Paolo parlerò domani a quattro occhi, perché una cosa del genere non succede più."
    errors: [subjunctive-use]
  - tutor: "Lo apprezzo. Solo una cosa: «perché non succede più». Qui perché vuol dire «affinché»: che modo ci vuole, allora?"
    prompt: {text: "perché una cosa del genere non succede più", tags: [subjunctive-use]}
  - learner: "Giusto: perché una cosa del genere non succeda più. E dalla prossima presentazione metteremo sempre i nomi degli autori nella prima pagina."
  - tutor: "Esatto. I nomi nella prima pagina mi sembrano la soluzione più giusta. Grazie di avermi ascoltata."
    goals: [solution]

- scenario: burocrazia-residenza
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Sono spagnola e mi sono trasferita a Padova a settembre per un dottorato. Vorrei chiedere la residenza, perché senza non posso scegliere il medico di base."
  - tutor: "Certo. Ha con sé un documento d'identità e il contratto d'affitto?"
    goals: [request]
  - learner: "Il passaporto sì, eccolo. Il contratto invece non ce l'ho: me l'aveva ricordato anche la mia coinquilina, ma stamattina sono uscita di corsa e l'ho lasciato sulla scrivania."
  - tutor: "Peccato, perché senza contratto non posso aprire la pratica. Oltre al contratto le serve anche il codice fiscale."
    goals: [documents]
  - learner: "Il codice fiscale ce l'ho, me l'hanno dato all'università il primo giorno. Per il contratto, non sarebbe possibile che glielo mandassi per email oggi pomeriggio? Abito a dieci minuti da qui, ma alle due ho lezione."
  - tutor: "Purtroppo no, la copia va consegnata allo sportello. Però può tornare domani senza rifare la fila: le lascio una ricevuta con la priorità."
    goals: [problem]
  - learner: "Mi sembra una buona soluzione, la ringrazio. E dopo, quanto tempo ci vuole? Mi hanno detto che qualcuno passa a controllare che io abiti davvero lì."
  - tutor: "Esatto, i vigili passano entro quarantacinque giorni dalla domanda. Se l'accertamento va bene, la residenza parte dalla data di oggi."
  - learner: "Quarantacinque giorni! Lavoro in laboratorio tutto il giorno, e la mia coinquilina è spesso fuori. Se passassero proprio quando non c'è nessuno, sarebbe un disgusto."
    errors: [false-friend]
  - tutor: "Sarebbe una seccatura, è vero, ma non si preoccupi: se non trovano nessuno lasciano un avviso, e lei li richiama per fissare un orario."
    goals: [next]
    recast: {text: "un disgusto", fix: "una seccatura", tags: [false-friend]}
  - learner: "Meno male, così mi organizzo. Allora a domani, e grazie della pazienza."
  - tutor: "Si figuri. A domani, e non dimentichi il contratto!"

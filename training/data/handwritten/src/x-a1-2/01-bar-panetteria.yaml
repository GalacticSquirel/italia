      goals: [greet]
      prompt: {text: tre panino, tags: [noun-number]}
    - learner: Tre panini!
    - tutor: Bravo! Ecco tre panini piccoli. Altro?
      goals: [order-bread]
    - learner: Sì, una pizza piccola per mio figlio.
    - tutor: Ecco la pizza. È molto buona!
      goals: [order-extra]
    - learner: Grazie. Quanto pago?
    - tutor: Sei euro, grazie.
    - learner: Ecco. Buona giornata!
    - tutor: Grazie, anche a Lei!
      goals: [pay]


- scenario: hotel-checkin
  level: A1
  persona: es-f-teacher
  turns:
    - tutor: Buonasera e benvenuti! Ha una prenotazione?
    - learner: Buonasera. Ho una prenotazione a nome García.
    - tutor: Buonasera! Sì, una camera singola.
      goals: [booking]
      new: [{lemma: singolo, gloss: single}]
    - learner: Scusi, che cosa significa "singola"?
    - tutor: È una camera per una persona sola.
    - learner: Ah, sì, giusto. Ecco il mio documento.
    - tutor: Grazie. Ecco la chiave, camera 9.
      goals: [document, key]
    - learner: Che ora è la colazione?
      errors: [question-form]
    - tutor: Che ora è la colazione? Manca una piccola parola all'inizio.
      prompt: {text: Che ora è la colazione, tags: [question-form]}
    - learner: A che ora è la colazione?
    - tutor: Esatto! Dalle sette alle dieci.
      goals: [breakfast]
    - learner: Grazie mille. Buonanotte.
    - tutor: Buonanotte!

- scenario: abbigliamento
  level: A1
  persona: en-f-student
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno. Cerco una bianca maglietta.
      errors: [word-order]
    - tutor: Una bianca maglietta? Guardi dove mette il colore...
      prompt: {text: una bianca maglietta, tags: [word-order]}
    - learner: Una maglietta bianca!
    - tutor: Benissimo! Che taglia porta?
      goals: [ask-item]
    - learner: Porto la S.
    - tutor: Ecco, taglia S.
      goals: [size-colour]
    - learner: Grazie. Posso provare la maglietta?
    - tutor: Certo! Il camerino è lì a destra.
      goals: [try]
    - learner: Va bene, mi piace. Quanto costa?
    - tutor: Costa quindici euro.
    - learner: La prendo. Ecco la carta.
    - tutor: Grazie mille! Buona giornata!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: en-m-retired
  history: [adjective-agreement]
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno. Vorrei una maglietta rosso, taglia L.
      errors: [adjective-agreement]
    - tutor: Una maglietta rosso? Maglietta è femminile...
      prompt: {text: una maglietta rosso, tags: [adjective-agreement]}
    - learner: Una maglietta rossa.
    - tutor: Perfetto! Ecco, taglia L.
      goals: [ask-item, size-colour]
    - learner: Dov'è il camerino? Vorrei provare.
    - tutor: È lì, a sinistra.
      goals: [try]
    - learner: È un po' piccola. Avete una XL?
    - tutor: Sì, ecco la XL.
    - learner: Questa va bene. Quanto costa?
    - tutor: Venti euro. Oggi c'è lo sconto.
    - learner: Bene, la prendo.
    - tutor: Grazie! Ecco la maglietta. Arrivederci!
      goals: [decide]

- scenario: abbigliamento
  level: A1
  persona: es-f-erasmus
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno! Cerco una maglietta blu, taglia M.
    - tutor: Buongiorno! Ecco, questa è molto bella.
      goals: [ask-item, size-colour]
    - learner: Quanto costa?
    - tutor: Costa quaranta euro.
    - learner: Oh! Avete una maglietta più barata?
      errors: [word-choice]
    - tutor: Più economica? Sì, questa costa quindici euro.
      recast: {text: più barata, fix: Più economica, tags: [word-choice]}
      new: [{lemma: economico, gloss: cheap}]

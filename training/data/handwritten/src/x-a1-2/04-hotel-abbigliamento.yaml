- scenario: abbigliamento
  level: A1
  persona: en-f-professional
  turns:
    - tutor: Buongiorno! Posso aiutarla?
    - learner: Buongiorno. Cerco due magliette blu per le mie figlie.
    - tutor: Certo. Che taglia portano?
      goals: [ask-item]
    - learner: Portano la S. Queste sono carino!
      errors: [adjective-agreement]
    - tutor: Sono carino? Le magliette sono due...
      prompt: {text: sono carino, tags: [adjective-agreement]}
    - learner: Sono carini?
      errors: [adjective-agreement]
    - tutor: Sì, sono carine! E costano poco.
      goals: [size-colour]
      recast: {text: Sono carini, fix: sono carine, tags: [adjective-agreement]}
    - learner: Scusi, come si dice "fitting room" in italiano?
    - tutor: Si dice camerino. È lì, a destra.
    - learner: Grazie. Posso provare una maglietta nel camerino?
    - tutor: Certo, prego!
      goals: [try]
    - learner: Va bene, prendo due magliette. Ecco la carta.
    - tutor: Grazie mille! Buona giornata!
      goals: [decide]

    - tutor: Perfetto! Ha un documento, per favore?
      goals: [booking]
    - learner: Sì, ecco il passaporto.
    - tutor: Grazie. La camera è la 7.
      goals: [document]
    - learner: A che ora è la colazione?
    - tutor: La colazione è dalle sette e mezza.
      goals: [breakfast]
    - learner: Grazie. Può ripetere il numero della camera?
    - tutor: Certo, è la 7. Ecco la chiave.
      goals: [key]
    - learner: Grazie, buonasera.
    - tutor: Prego, buonanotte!


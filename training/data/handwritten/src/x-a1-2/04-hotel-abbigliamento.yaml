- scenario: hotel-checkin
  level: A1
  persona: en-f-professional
  turns:
    - tutor: Buonasera e benvenuti! Ha una prenotazione?
    - learner: Buonasera. Sì, ho una prenotazione. Mi chiamo Kate Wilson.
    - tutor: Sì, ecco. Una camera per due notti.
      goals: [booking]
    - learner: Esatto. Ecco il mio passaporto.
    - tutor: Grazie mille. Va tutto bene.
      goals: [document]
    - learner: A che ora è la colazione?
    - tutor: Dalle sette alle dieci, al primo piano.
      goals: [breakfast]
    - learner: Perfetto. E la mia camera dov'è?
    - tutor: È la 12, al secondo piano. Ecco la chiave.
      goals: [key]

- scenario: hotel-checkin
  level: A1
  persona: en-m-retired

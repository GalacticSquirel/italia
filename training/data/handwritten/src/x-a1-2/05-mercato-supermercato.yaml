- scenario: mercato-frutta
  level: A1
  persona: en-f-student
  turns:
    - tutor: Ciao! Cosa ti do oggi?
    - learner: Ciao! Quanto costano le mele?
    - tutor: Due euro al chilo. Sono molto buone!
      goals: [ask-price]
    - learner: Allora prendo un chilo di mele.
    - tutor: Ecco un chilo. Altro?
      goals: [buy-quantity]
    - learner: Sì, anche mezzo chilo di pomodori.
    - tutor: Ecco i pomodori, sono freschi.
      goals: [ask-other]
    - learner: Grazie. Quanto pago?
    - tutor: Tre euro e cinquanta in tutto.
    - learner: Ecco. Ciao, buona giornata!
    - tutor: Grazie, ciao!
      goals: [pay]

- scenario: mercato-frutta
  level: A1
  persona: en-m-traveller
  history: [noun-number]
  turns:
    - tutor: Ciao! Cosa ti do oggi?
    - learner: Ciao! Quanto costano le arance?
    - tutor: Un euro e ottanta al chilo.
      goals: [ask-price]
    - learner: Va bene! Prendo due chilo.
      errors: [noun-number]
    - tutor: Due chilo? Sono due, non uno...
      prompt: {text: due chilo, tags: [noun-number]}
    - learner: Due chili!
    - tutor: Bravo! Ecco due chili di arance.
      goals: [buy-quantity]
    - learner: Hai anche le banane?
    - tutor: Sì, guarda che belle!
    - learner: Quattro banane, per favore.
    - tutor: Ecco. Sono cinque euro in tutto.
      goals: [ask-other]
    - learner: Ecco cinque euro. Grazie!
    - tutor: Grazie a te, ciao!
      goals: [pay]

- scenario: mercato-frutta
  level: A1
  persona: es-m-worker

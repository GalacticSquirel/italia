    - tutor: Sì, ecco il basilico fresco.
      goals: [ask-other]
    - learner: Grazie. Quanto è?
    - tutor: Quattro euro.
    - learner: Ecco. Ciao!
    - tutor: Ciao, buon lavoro!
      goals: [pay]

- scenario: mercato-frutta
  level: A1
  persona: en-m-retired
  turns:
    - tutor: Ciao! Cosa ti do oggi?
    - learner: Buongiorno. Quanto costa i mele?
      errors: [subject-verb-agreement, noun-gender]
    - tutor: I mele? Mela è una parola femminile.
      prompt: {text: i mele, tags: [noun-gender]}
    - learner: Le mele. Quanto costano le mele?
    - tutor: Perfetto! Due euro e venti al chilo.
      goals: [ask-price]
    - learner: Vorrei mezzo chilo, per favore.
    - tutor: Ecco mezzo chilo. Altro?
      goals: [buy-quantity]
    - learner: Come si chiama questa frutta?
    - tutor: Queste sono pesche. Sono molto buone!
      new: [{lemma: pesca, gloss: peach}]
    - learner: Allora tre pesche, grazie.
    - tutor: Ecco. Sono tre euro in tutto.
      goals: [ask-other]
    - learner: Ecco tre euro. Grazie!
    - tutor: Grazie, buona giornata!
      goals: [pay]

- scenario: mercato-frutta
  level: A1
  persona: es-f-teacher
  turns:
    - tutor: Ciao! Cosa ti do oggi?
    - learner: Buongiorno. Le arance sono fresco?
      errors: [adjective-agreement]

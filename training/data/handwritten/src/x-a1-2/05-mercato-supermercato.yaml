      prompt: {text: sono fresco, tags: [adjective-agreement]}
    - learner: Sono fresche?
    - tutor: Brava! Sì, sono di oggi.
    - learner: Quanto costano?
    - tutor: Due euro al chilo.
      goals: [ask-price]
    - learner: Un chilo e mezzo, per favore.
    - tutor: Ecco qui. Vuoi altro?
      goals: [buy-quantity]

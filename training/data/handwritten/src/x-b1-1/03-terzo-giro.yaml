# B1, correction-dense: comparatives, pronouns, ci/ne, modal verbs.
- scenario: salute-stile-vita
  level: B1
  persona: en-m-traveller
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Lavoro in un pub, quindi vado a letto tardissimo e mangio male. Però cammino molto."
    - tutor: "Camminare è già qualcosa! E qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Voglio essere più forte e dormire meglio. Adesso sono più stanco che i miei amici."
      errors: [comparative]
    - tutor: "Più stanco 'che' i tuoi amici? Prima di un nome usiamo un'altra parola..."
      prompt: {text: "che i miei amici", tags: [comparative]}
    - learner: "Più stanco dei miei amici?"
    - tutor: "Esatto! Vedrai, tra un mese sarai più in forma di loro. Cosa ti ferma, di solito?"
      goals: [goal]
    - learner: "Lo stress e gli orari. Finisco di lavorare alle due di notte e la mattina non ho energia."
    - tutor: "Capisco. Allora niente allenamento di mattina: ci vediamo il pomeriggio."
      goals: [obstacles]
    - learner: "Sì, meglio. Potrei venire il lunedì e il giovedì alle quattro."
    - tutor: "Perfetto: lunedì e giovedì alle quattro. E cerca di dormire almeno sette ore!"
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Tre giorni a casa e due in ufficio. La mia azienda ha un orario molto flessibile."
    - tutor: "Che fortuna! E ti trovi bene?"
      goals: [situation]
    - learner: "Sì. Il vantaggio principale è che non perdo tempo sui mezzi. Lavorare da casa è più comodo di andare in ufficio."
      errors: [comparative]
    - tutor: "Certo! Ma tra due verbi, 'più comodo di andare'? Lì ci vuole un'altra parola..."
      prompt: {text: "di andare", tags: [comparative]}
    - learner: "Più comodo... da andare in ufficio?"
      errors: [comparative]
    - tutor: "Quasi! È più comodo che andare in ufficio, soprattutto quando piove. Ci sono anche svantaggi?"
      recast: {text: "da andare", fix: "che andare", tags: [comparative]}
      goals: [pros]
    - learner: "Sì: a casa mi sento sola e a volte è difficile concentrarsi, perché i vicini fanno rumore."
    - tutor: "Ti capisco, anche a me mancano i colleghi. Se potessi scegliere, cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei continuare così, metà e metà, perché ho tempo per me ma vedo anche la squadra."
    - tutor: "Mi sembra la soluzione migliore. Allora beviamo al lavoro flessibile!"
      goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna la festa più importante è il 6 gennaio, il giorno dei Re Magi. Si mangia un dolce speciale e i bambini ricevono i regali."
    - tutor: "Che bella usanza! E tu come festeggiavi da bambina?"
      goals: [compare]
    - learner: "Da bambina ho scritto ogni anno una lettera ai Re Magi e la sera andavamo tutti in piazza a vederli."
      errors: [tense-aspect]
    - tutor: "Che dolce! Però 'ho scritto ogni anno'? Era una cosa che si ripeteva: quale tempo ci vuole?"
      prompt: {text: "ho scritto", tags: [tense-aspect]}
    - learner: "Scrivevo ogni anno una lettera ai Re Magi."
    - tutor: "Esatto. Anch'io mandavo sempre la mia lettera a Babbo Natale!"
      goals: [past]
    - learner: "E in Italia? È vero che la Befana porta il carbone ai bambini cattivi?"
    - tutor: "Sì, il 6 gennaio porta dolci ai bambini buoni e carbone agli altri. Ma oggi il carbone è di zucchero!"
      goals: [ask]
    - learner: "Che simpatico! E per il pranzo di Natale, cosa posso portare?"
    - tutor: "Porta un dolce del tuo paese, se vuoi: i miei parenti saranno curiosi di provarlo."
      goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono stata in Sardegna con due amiche. Abbiamo rimasto due settimane in un piccolo albergo vicino al mare."
      errors: [auxiliary-choice]
    - tutor: "In Sardegna, che fortuna! Ma 'abbiamo rimasto'? Questo verbo funziona come andare e restare..."
      prompt: {text: "Abbiamo rimasto", tags: [auxiliary-choice]}
    - learner: "Ah sì: siamo rimaste due settimane."
    - tutor: "Perfetto! E il tempo com'era?"
      goals: [where]
    - learner: "Bellissimo, faceva caldo ma c'era sempre un po' di vento. Ha piovuto solo un giorno."
    - tutor: "Meno male! E cosa avete fatto?"
      goals: [weather]
    - learner: "Ogni mattina andavamo in spiaggia. Un giorno abbiamo preso una barca e abbiamo visitato un'isola piccolissima."
    - tutor: "Che bello! E qual è la cosa che ti è piaciuta di più?"
      goals: [activities]
    - learner: "Il mare, senza dubbio: l'acqua era trasparente. Però mi sono piaciuti molto anche i tramonti."
    - tutor: "Ti credo! L'anno prossimo voglio andarci anch'io."
      goals: [best]

- scenario: vicino-rumoroso
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, mi scusi per il disturbo. Sono Diego, il vicino del secondo piano."
    - tutor: "Piacere. Mi dica pure."
      goals: [greet]
    - learner: "Ecco, io lavoro in un ristorante e mi alzo alle cinque. La sera sento la sua musica fino a tardi e non posso dormire."
    - tutor: "Oh, mi dispiace, non lo sapevo. Suono la chitarra dopo cena."
      goals: [problem]
      new: [{lemma: chitarra, gloss: guitar}]
    - learner: "Capisco, e suona bene! Ma la vorrei chiedere un favore: potrebbe smettere prima delle dieci?"
      errors: [object-pronoun]
    - tutor: "Grazie! Scusi, 'la vorrei chiedere'? Si chiede qualcosa a qualcuno: quale pronome ci vuole?"
      prompt: {text: "la vorrei chiedere", tags: [object-pronoun]}
    - learner: "Le vorrei chiedere un favore."
    - tutor: "Ecco, esatto. Prima delle dieci è un po' presto... Le andrebbe bene fino alle dieci e mezza, con il volume basso?"
      goals: [request]
    - learner: "Sì, con il volume basso va bene. Lei è molto gentile."
    - tutor: "Si figuri. E se le do ancora fastidio, me lo dica subito. Buona serata!"
      goals: [compromise]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao! Sì, molto. Studio qui da un anno e vorrei fare qualcosa di utile per la città."
    - tutor: "Che bello! E perché proprio il volontariato?"
    - learner: "Perché voglio conoscere le persone chi vivono qui, non solo altri studenti."
      errors: [relative-pronoun]
    - tutor: "Bella ragione! Ma le persone 'chi' vivono qui? 'Chi' va bene nelle domande; e qui?"
      prompt: {text: "chi vivono", tags: [relative-pronoun]}
    - learner: "Le persone che vivono qui!"
    - tutor: "Esatto. E cosa sai fare? Hai già esperienza?"
      goals: [motivation]
    - learner: "A Leeds aiutavo i bambini con i compiti. So anche suonare il pianoforte e parlo inglese, ovviamente."
    - tutor: "Ottimo, cerchiamo proprio qualcuno per il doposcuola. Quanto tempo hai?"
      goals: [skills]
      new: [{lemma: doposcuola, gloss: after-school club}]
    - learner: "Sono disponibile il martedì e il giovedì pomeriggio, due o tre ore."
    - tutor: "Perfetto. Puoi aiutare i bambini con l'inglese, oppure tenere compagnia agli anziani. Cosa preferisci?"
      goals: [time]
    - learner: "Preferisco il doposcuola con i bambini. Potrei cominciare la settimana prossima?"
    - tutor: "Certo! Ti aspetto martedì alle tre, così ti presento gli altri volontari."
      goals: [choose]

- scenario: affittare-appartamento
  level: B1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. È carino. La cucina è già arredata? Io sono cuoco, per me è importante."
    - tutor: "Sì, è tutto arredato: ci sono il forno, il frigorifero e anche la lavastoviglie."
      goals: [condition]
      new: [{lemma: lavastoviglie, gloss: dishwasher}]
    - learner: "Molto bene. Quanto costa l'affitto? Le spese sono incluse?"
    - tutor: "L'affitto è di 680 euro. Le spese di condominio sono a parte, circa 50 euro al mese."
      goals: [rent]
    - learner: "Capisco. Per il contratto, devo pagare una caparra? Di quanti mesi?"
    - tutor: "Sì, chiedo due mesi di caparra. Il contratto è di quattro anni."
      goals: [contract]
    - learner: "Due mesi... Posso pagare uno adesso e uno il mese prossimo?"
      errors: [ci-ne]
    - tutor: "Vediamo. Ma 'pagare uno'? Parla dei mesi: manca una piccola parola..."
      prompt: {text: "pagare uno adesso", tags: [ci-ne]}
    - learner: "Posso pagarne uno adesso e uno il mese prossimo?"
    - tutor: "Esatto. Sì, per me va bene, possiamo fare così."
    - learner: "Grazie. Un'ultima domanda: il quartiere è tranquillo? Io torno dal lavoro a mezzanotte."
    - tutor: "È molto tranquillo, e la fermata dell'autobus è a due minuti."
      goals: [neighbourhood]
    - learner: "Allora sono interessato. Vorrei firmare il contratto questa settimana."
    - tutor: "Benissimo! Preparo i documenti e ci vediamo venerdì."
      goals: [decide]

- scenario: banca-conto
  level: B1
  persona: en-m-retired
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Mi sono trasferito in Italia dopo la pensione e voglio di aprire un conto."
      errors: [modal-infinitive]
    - tutor: "Benvenuto! Scusi, 'voglio di aprire'? Lì c'è una parola di troppo..."
      prompt: {text: "voglio di aprire", tags: [modal-infinitive]}
    - learner: "Ah: voglio aprire un conto."
    - tutor: "Esatto. Per aprirlo mi servono alcuni documenti."
      goals: [purpose]
    - learner: "Quali documenti devo portare? Ho il passaporto e il codice fiscale."
    - tutor: "Vanno bene. Mi serve anche un documento con il suo indirizzo in Italia."
      goals: [documents]
    - learner: "Ce l'ho, è il contratto della casa. Quanto costa il conto ogni mese?"
    - tutor: "Costa 4 euro al mese e comprende la carta. Con l'app i bonifici non costano niente."
      goals: [costs]
    - learner: "Bene. Mio figlio dice che dovrei usare l'app, ma io non sono bravo con il telefono. Posso venire qui in banca?"
    - tutor: "Certamente, può sempre venire da noi. Ma se vuole, le mostro come funziona l'app: è semplice."
      goals: [card]
    - learner: "Grazie, molto gentile. Allora firmo qui?"
    - tutor: "Sì, una firma qui e una qui. Benvenuto nella nostra banca!"

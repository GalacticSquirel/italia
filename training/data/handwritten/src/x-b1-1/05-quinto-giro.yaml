# B1, correction-dense: future forms, piacere, ne, prepositions, register, relative pronouns.
- scenario: salute-stile-vita
  level: B1
  persona: es-f-teacher
  history: [future-form]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao. Lavoro a scuola, quindi sto molte ore in piedi, ma non faccio sport. Mangio bene, però bevo troppo caffè."
    - tutor: "Quanti caffè al giorno? E dormi bene?"
    - learner: "Ne bevo cinque o sei. Dormo poco, sei ore, perché la sera correggo i compiti."
    - tutor: "Capito. E cosa vorresti cambiare?"
      goals: [habits]
    - learner: "Vorrei avere meno stress e più energia. Il mio obiettivo è correre cinque chilometri senza fermarmi."
    - tutor: "Bellissimo obiettivo! E finora cosa ti ha fermata?"
      goals: [goal]
    - learner: "Il tempo, soprattutto. E poi sono pigra: dico sempre 'lunedì cominciarò', ma poi non faccio niente."
      errors: [future-form]
    - tutor: "Succede a tutti! Ma 'cominciarò'? Nel futuro di questi verbi una lettera cambia..."
      prompt: {text: "cominciarò", tags: [future-form]}
    - learner: "Lunedì comincerò! E questa volta davvero."
    - tutor: "Così mi piace! Allora partiamo piano: due allenamenti alla settimana, mezz'ora di corsa leggera."
      goals: [obstacles]
    - learner: "Va bene. Potrei il mercoledì dopo la scuola e il sabato mattina."
    - tutor: "Perfetto: mercoledì e sabato. E proviamo a scendere a tre caffè al giorno, d'accordo?"
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [piacere, conditional-form]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro sempre da casa, da tre anni. La mia azienda è a Toronto, quindi non ho scelta."
    - tutor: "Sempre da casa! E com'è?"
      goals: [situation]
    - learner: "Ci sono vantaggi: l'orario è flessibile e posso pranzare con mia moglie. Mi piace molto le mattine tranquille."
      errors: [piacere]
    - tutor: "Lo credo! Però 'mi piace le mattine'? Le mattine sono tante..."
      prompt: {text: "Mi piace molto le mattine", tags: [piacere]}
    - learner: "Giusto: mi piacciono molto le mattine tranquille."
    - tutor: "Ecco. E gli svantaggi? Ce ne sono?"
      goals: [pros]
    - learner: "Sì. Ho riunioni alle dieci di sera, perché a Toronto è ancora pomeriggio. E non vedo mai i colleghi."
    - tutor: "Riunioni alle dieci di sera, povero te! Se potessi cambiare, cosa faresti?"
      goals: [cons]
    - learner: "Io preferirebbe andare in ufficio due giorni alla settimana, per parlare con persone vere."
      errors: [conditional-form]
    - tutor: "'Io preferirebbe'? Quella è la forma per lui o lei. E per 'io'?"
      prompt: {text: "preferirebbe", tags: [conditional-form]}
    - learner: "Io preferirei andare in ufficio due giorni alla settimana."
    - tutor: "Esatto, e ti capisco benissimo. Per ora puoi venire a lavorare nel mio ufficio, c'è una scrivania libera!"
      goals: [preference]
      new: [{lemma: scrivania, gloss: desk}]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Irlanda il giorno più importante è il 25. Si mangia il tacchino e poi tutti guardano la TV o vanno al pub."
    - tutor: "Al pub a Natale, mi piace! E da bambino come festeggiavi?"
      goals: [compare]
    - learner: "Da bambino mi svegliavo alle cinque per aprire i regali. I miei genitori non erano molto contenti!"
    - tutor: "Alle cinque, poveri genitori! E ricevevi tanti regali?"
      goals: [past]
    - learner: "Sì, ricevevo molti, perché ho sei zii."
      errors: [ci-ne]
    - tutor: "Sei zii, che fortuna! Ma 'ricevevo molti'... Manca una piccola parola davanti al verbo."
      prompt: {text: "ricevevo molti", tags: [ci-ne]}
    - learner: "Lo ricevevo molti?"
      errors: [ci-ne]
    - tutor: "Quasi! Con 'molti' e con i numeri usiamo 'ne': ne ricevevo molti. Anch'io, e li aprivo tutti subito!"
      recast: {text: "Lo ricevevo molti", fix: "ne ricevevo molti", tags: [ci-ne]}
    - learner: "Ne ricevevo molti, ho capito. E in Italia quando si aprono i regali?"
    - tutor: "Dipende dalla famiglia: da noi si aprono la sera del 24, dopo cena."
      goals: [ask]
    - learner: "Bello. Senti, per il pranzo cosa porto? Non voglio arrivare a mani vuote."
    - tutor: "Porta una bottiglia di vino o un dolce, e mia madre sarà felicissima."
      goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Sono andato a Sicilia con la mia ragazza. Dieci giorni, in agosto."
      errors: [preposition]
    - tutor: "Che bello! Ma 'a Sicilia'? Con le regioni e le isole grandi usiamo un'altra preposizione..."
      prompt: {text: "a Sicilia", tags: [preposition]}
      new: [{lemma: regione, gloss: region}]
    - learner: "Sono andato in Sicilia."
    - tutor: "Esatto! E come siete arrivati?"
      goals: [where]
    - learner: "In macchina e poi in traghetto. È stato un viaggio molto largo, quasi quindici ore."
      errors: [false-friend]
    - tutor: "Quindici ore, un viaggio davvero lungo! E che tempo avete trovato?"
      recast: {text: "largo", fix: "lungo", tags: [false-friend]}
    - learner: "Faceva caldissimo, quaranta gradi. Per fortuna vicino al mare c'era vento."
    - tutor: "Quaranta gradi! E cosa avete fatto con quel caldo?"
      goals: [weather]
    - learner: "La mattina stavamo in spiaggia e la sera visitavamo i paesi. Abbiamo mangiato pesce ogni giorno, e io ho imparato due ricette nuove."
    - tutor: "Bravo, poi me le prepari! E la cosa più bella?"
      goals: [activities]
    - learner: "L'Etna. Siamo saliti di notte e abbiamo visto la lava. Non lo dimenticherò mai."
    - tutor: "Dev'essere stato incredibile. La prossima volta mi fai vedere le foto!"
      goals: [best]

- scenario: vicino-rumoroso
  level: B1
  persona: en-f-professional
  history: [register]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Mi chiamo Kate, abito al terzo piano, proprio sotto di lei. Mi dispiace disturbarla."
    - tutor: "Piacere, signora. Non si preoccupi, mi dica."
      goals: [greet]
    - learner: "Il problema è il rumore. Ogni sera, dopo le undici, sento passi molto forti e mobili che si muovono."
    - tutor: "Ah, mi dispiace. Lavoro fino a tardi e quando torno metto in ordine la casa."
      goals: [problem]
    - learner: "Capisco. Ma io devo alzarmi presto. Puoi fare meno rumore dopo le undici, per favore?"
      errors: [register]
    - tutor: "'Puoi'? Tra vicini che si conoscono appena, che forma usiamo?"
      prompt: {text: "Puoi fare", tags: [register]}
    - learner: "Scusi. Tu puoi... no, potresti fare meno rumore?"
      errors: [register]
    - tutor: "Con il lei diciamo 'potrebbe fare meno rumore'. Ha ragione, e ci proverò: dopo le undici non muovo più niente."
      recast: {text: "potresti fare", fix: "potrebbe fare", tags: [register]}
      goals: [request]
    - learner: "Grazie. Potrebbe anche mettere un tappeto in soggiorno? Aiuterebbe molto."
    - tutor: "Buona idea, ne compro uno questo fine settimana. Così siamo contenti tutti e due."
      goals: [compromise]
    - learner: "Perfetto. Grazie per la comprensione, e buona serata."
    - tutor: "Buona serata a lei, e grazie per avermelo detto in modo così gentile."

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [subjunctive-form]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Ciao. Sì, ho visto la vostra associazione su internet. Penso che voi faciate un lavoro molto importante."
      errors: [subjunctive-form]
    - tutor: "Grazie! Bravo, hai usato il congiuntivo. Ma la forma 'faciate' non è del tutto giusta: prova ancora."
      prompt: {text: "faciate", tags: [subjunctive-form]}
    - learner: "Penso che voi facciate un lavoro importante."
    - tutor: "Perfetto! E perché vorresti aiutarci?"
    - learner: "Perché sono arrivato in Italia da solo e all'inizio è stato difficile. Adesso vorrei aiutare chi ha bisogno."
    - tutor: "Bellissimo motivo. E cosa sai fare?"
      goals: [motivation]
    - learner: "Sono cuoco. So cucinare per molte persone e so organizzare una cucina."
    - tutor: "Allora sei perfetto per la nostra mensa! Quanto tempo hai?"
      goals: [skills]
      new: [{lemma: mensa, gloss: canteen}]
    - learner: "Il lunedì il ristorante è chiuso, quindi sono disponibile tutto il giorno."
    - tutor: "Benissimo. Il lunedì cuciniamo per sessanta persone. Preferisci cucinare o portare il pranzo a casa degli anziani?"
      goals: [time]
    - learner: "Preferisco cucinare. È l'attività che so fare meglio."
    - tutor: "Allora ci vediamo lunedì alle nove in cucina. Benvenuto tra noi!"
      goals: [choose]

- scenario: biglietto-treno
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno. Vorrei un biglietto a Venezia per oggi pomeriggio."
      errors: [preposition]
    - tutor: "Oggi pomeriggio, bene. Ma un biglietto 'a' Venezia? Con la parola biglietto usiamo un'altra preposizione."
      prompt: {text: "un biglietto a Venezia", tags: [preposition]}
    - learner: "Un biglietto per Venezia, giusto?"
    - tutor: "Giusto! C'è un treno alle 14:20 e uno alle 15:05."
    - learner: "Prendo quello delle 14:20. Quanto tempo prende il viaggio?"
      errors: [word-choice]
    - tutor: "Il viaggio dura due ore e dieci minuti. Vuole solo andata o anche il ritorno?"
      recast: {text: "prende il viaggio", fix: "Il viaggio dura", tags: [word-choice]}
      goals: [destination]
    - learner: "Solo andata, grazie. Resto a Venezia fino a lunedì e poi continuo per Trieste."
    - tutor: "Va bene. Preferisce la prima o la seconda classe?"
      goals: [type]
    - learner: "La seconda. Se è possibile, vorrei un posto con il tavolino, perché devo studiare."
    - tutor: "Ecco: carrozza 6, posto 12, con il tavolino. Sono 24 euro."
      goals: [class]
      new: [{lemma: carrozza, gloss: carriage}]
    - learner: "Grazie. Da che binario parte?"
    - tutor: "Dal binario 9. Il treno è già lì, quindi ha tutto il tempo. Buon viaggio!"
      goals: [platform]

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Lucía, sono di Valencia e vivo a Bologna da un anno."
    - tutor: "Piacere. Che esperienza ha?"
      goals: [intro]
    - learner: "Ho lavorato come insegnante durante dieci anni. Organizzavo anche i progetti europei della mia scuola."
      errors: [preposition]
    - tutor: "Interessante! Scusi, 'durante dieci anni'? Per dire quanto tempo usiamo un'altra preposizione."
      prompt: {text: "durante dieci anni", tags: [preposition]}
    - learner: "Ho lavorato come insegnante per dieci anni."
    - tutor: "Perfetto. E quali sono i suoi punti forti e i suoi punti deboli?"
      goals: [experience]
    - learner: "Sono organizzata e ho molta pazienza. Però a volte voglio controllare tutto e non lascio lavoro agli altri."
    - tutor: "Lo capisco. E perché ha scelto noi?"
      goals: [strengths]
    - learner: "Perché questa è un'azienda in che potrei usare le mie competenze e imparare cose nuove."
      errors: [relative-pronoun]
    - tutor: "Un'azienda 'in che'? Dopo la preposizione ci vuole un altro pronome..."
      prompt: {text: "in che", tags: [relative-pronoun]}
    - learner: "Un'azienda in cui potrei usare le mie competenze."
    - tutor: "Esatto. Ha delle domande per noi?"
      goals: [why]
    - learner: "Sì. Quali sarebbero le mie responsabilità nei primi mesi?"
    - tutor: "All'inizio seguirebbe i progetti per le scuole, insieme a una collega. Grazie, le faremo sapere presto!"
      goals: [questions]

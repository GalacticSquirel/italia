# B1, correction-dense: indirect and combined pronouns, imperatives, pronoun position, futuro.
- scenario: compleanno
  level: B1
  persona: en-m-heritage
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Secondo me dobbiamo fare una festa a sorpresa. Sara compie trent'anni, è un compleanno importante!"
    - tutor: "Giusto! Quando la facciamo, e dove?"
    - learner: "Sabato prossimo, nel giardino dei miei genitori. C'è molto spazio e possiamo cucinare la carne fuori."
    - tutor: "Perfetto, sabato in giardino. Chi invitiamo?"
      goals: [date]
    - learner: "I suoi colleghi, le amiche del liceo e suo fratello. Stasera telefono io a suo fratello."
    - tutor: "Bene, io scrivo alle amiche. E per la torta?"
      goals: [guests]
    - learner: "La ordino io: una torta al limone, la sua preferita. Per il resto facciamo carne e insalate."
    - tutor: "Buonissimo. Manca il regalo: hai un'idea?"
      goals: [food]
    - learner: "Sì! Sara ama viaggiare. La possiamo regalare una valigia nuova."
      errors: [object-pronoun]
    - tutor: "Bella idea! Ma «la possiamo regalare»? Regaliamo qualcosa a Sara: che pronome serve?"
      prompt: {text: "La possiamo regalare", tags: [object-pronoun]}
    - learner: "Le possiamo regalare una valigia nuova."
    - tutor: "Esatto! E dentro la valigia le mettiamo un biglietto con le firme di tutti. Sarà felicissima!"
      goals: [gift]

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [imperative-form]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto il 2 maggio con due colleghi del ristorante. Restiamo tre giorni, vogliamo soprattutto mangiare bene!"
    - tutor: "Allora siete nella città giusta!"
      goals: [plans]
    - learner: "Tu sei di Napoli: dicimi dove fanno la pizza migliore."
      errors: [imperative-form]
    - tutor: "Certo! Ma «dicimi»? Questa forma del verbo dire, con «mi», è molto più corta..."
      prompt: {text: "dicimi", tags: [imperative-form]}
    - learner: "Dimmi dove fanno la pizza migliore!"
    - tutor: "Ecco! Andate in via dei Tribunali e provate anche la pizza fritta. E visitate il centro, è bellissimo."
      goals: [advice]
      new: [{lemma: fritto, gloss: fried}]
    - learner: "Perfetto. E per muoverci? Prendiamo un taxi o la metro?"
    - tutor: "Prendete la metro, costa poco. In centro però andate a piedi, è tutto vicino."
      goals: [transport]
    - learner: "Va bene. C'è qualche zona da evitare, o qualche errore tipico dei turisti?"
    - tutor: "Evitate i ristoranti per turisti davanti alla stazione. E non prendete il caffè seduti: costa il doppio!"
      goals: [warnings]
    - learner: "Buono a sapersi. Grazie, ti porto un dolce da Napoli."
    - tutor: "Portamene due! Buon viaggio e buon appetito."

- scenario: cucina-ricetta
  level: B1
  persona: en-f-student
  history: [pronoun-position]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Facciamo un curry di verdure, la ricetta della mia coinquilina. Servono patate, carote, cipolla, latte di cocco e riso."
    - tutor: "Buono! Ho tutto. Cosa faccio per prima cosa?"
      goals: [ingredients]
    - learner: "Prima lava le patate e le carote. Poi devi le tagliare a pezzi piccoli."
      errors: [pronoun-position]
    - tutor: "Subito. Ma «devi le tagliare»? Il pronome non può stare lì in mezzo: dove lo mettiamo?"
      prompt: {text: "devi le tagliare", tags: [pronoun-position]}
    - learner: "Devi tagliarle a pezzi piccoli. Oppure: le devi tagliare?"
    - tutor: "Tutte e due giuste, bravissima! Ecco, fatto. E adesso?"
    - learner: "Adesso metti l'olio in pentola, aggiungi la cipolla e dopo due minuti le verdure. Poi aggiungi il latte di cocco e un po' di sale."
    - tutor: "Fatto. Che profumo! Quanto deve cuocere?"
      goals: [steps]
    - learner: "Circa venticinque minuti, a fuoco basso. Nel frattempo cuociamo il riso in un'altra pentola."
    - tutor: "Va bene, al riso penso io. E alla fine come lo serviamo?"
      goals: [time]
    - learner: "Mettiamo il riso nel piatto e il curry sopra, con qualche foglia verde."
    - tutor: "Perfetto, preparo i piatti. Ho già fame!"
      goals: [serve]

- scenario: dal-meccanico
  level: B1
  persona: es-f-erasmus
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Il motore fa un rumore molto raro quando accelero, e si è accesa una luce rossa."
      errors: [false-friend]
    - tutor: "Un rumore strano e una luce rossa: non va bene. Quando è iniziato?"
      recast: {text: "raro", fix: "strano", tags: [false-friend]}
      goals: [describe]
    - learner: "Tre giorni fa. Tornavo da Firenze in autostrada e all'improvviso ho sentito il rumore."
    - tutor: "Capisco. Ha controllato l'olio?"
      goals: [when]
      new: [{lemma: olio, gloss: oil}]
    - learner: "No, non so come si fa. Secondo lei è grave? Quanto costarà la riparazione?"
      errors: [future-form]
    - tutor: "Devo prima guardare il motore. Ma «costarà»? Al futuro questo verbo cambia una lettera..."
      prompt: {text: "costarà", tags: [future-form]}
    - learner: "Quanto costerà la riparazione?"
    - tutor: "Esatto. Se è una cosa piccola, sono trenta euro. Se il problema è un pezzo del motore, le preparo un preventivo."
      goals: [cost]
    - learner: "Va bene. Ho bisogno della macchina sabato per andare a un matrimonio. Sarà pronta?"
    - tutor: "Sì, la guardo già oggi e la chiamo stasera. Per venerdì sarà pronta di sicuro."
      goals: [time]

- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [combined-pronouns]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Ho un'idea: una cena a sorpresa nel suo ristorante preferito, venerdì sera. Sono così eccitata!"
      errors: [false-friend]
    - tutor: "Ti capisco, sei emozionata, e lo sono anch'io: è una bellissima idea! Quante persone invitiamo?"
      recast: {text: "eccitata", fix: "emozionata", tags: [false-friend]}
      goals: [date]
      new: [{lemma: emozionato, gloss: excited}]
    - learner: "Non troppe: i suoi genitori, sua sorella e quattro o cinque amici. Dodici persone al massimo."
    - tutor: "Va bene, chiamo io il ristorante. E la torta?"
      goals: [guests]
    - learner: "Chiedo al ristorante di preparare una torta con le candeline. Per la cena ognuno ordina quello che vuole."
    - tutor: "Perfetto. E il regalo? Io avevo pensato a un orologio."
      goals: [food]
    - learner: "Sì, un orologio è perfetto. Le lo diamo alla fine della cena, con la torta."
      errors: [combined-pronouns]
    - tutor: "Bel momento! Ma «le lo diamo»? Questi due pronomi insieme diventano una parola sola..."
      prompt: {text: "Le lo diamo", tags: [combined-pronouns]}
    - learner: "Glielo diamo alla fine della cena!"
    - tutor: "Esatto! Allora io compro l'orologio e tu parli con il ristorante. Sara non deve sapere niente!"
      goals: [gift]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto a fine settembre con mia moglie. Restiamo una settimana, e vorremmo vedere anche la costa."
    - tutor: "Settembre è il mese migliore: c'è meno gente e il mare è ancora caldo."
      goals: [plans]
    - learner: "Che cosa ci consigli di visitare? A noi interessano la storia e l'arte."
    - tutor: "Allora visitate il museo più grande della città e poi Pompei. E mangiate il pesce vicino al mare!"
      goals: [advice]
    - learner: "Benissimo. Vorrei noleggiare una macchina per la costa. Pensi che è una buona idea?"
      errors: [subjunctive-use]
    - tutor: "Mmm, «pensi che è»? Dopo «pensare che» ci vuole il congiuntivo. Prova ancora!"
      prompt: {text: "Pensi che è", tags: [subjunctive-use]}
    - learner: "Pensi che sia una buona idea?"
    - tutor: "Bravo! Secondo me no: le strade sono strette e c'è traffico. Prendete il traghetto, è comodo e si vede la costa dal mare."
      goals: [transport]
    - learner: "D'accordo, niente macchina. C'è altro che dobbiamo evitare?"
    - tutor: "Evitate la domenica a Capri, c'è troppa gente. Andateci di martedì o mercoledì."
      goals: [warnings]
    - learner: "Grazie, sei stata gentilissima. Ti mandiamo una cartolina!"
    - tutor: "Che bello, grazie! Buon viaggio a tutti e due."

- scenario: cucina-ricetta
  level: B1
  persona: en-m-traveller
  history: [imperative-form]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Un piatto irlandese! È la ricetta di mia nonna: carne, patate, carote, cipolle e una birra scura."
    - tutor: "La birra con la carne? Interessante! Da dove comincio?"
      goals: [ingredients]
    - learner: "Taglia la carne a pezzi e mettila in pentola con un po' d'olio. Dopo cinque minuti aggiungi le verdure."
    - tutor: "Fatto. Metto anche il sale?"
    - learner: "Sì, ma non metti troppo sale! La birra ha già molto sapore."
      errors: [imperative-form]
    - tutor: "Va bene, poco sale. Però «non metti»? Per dire a un amico di non fare qualcosa, che forma usiamo?"
      prompt: {text: "non metti", tags: [imperative-form]}
    - learner: "Ah, giusto: non mettere troppo sale!"
    - tutor: "Perfetto, ne metto pochissimo! E adesso la birra?"
      goals: [steps]
    - learner: "Sì, aggiungila tutta e copri la pentola. Deve cuocere piano per due ore."
    - tutor: "Due ore! Va bene, io preparo la tavola. Come lo serviamo?"
      goals: [time]
    - learner: "In un piatto fondo, con molto pane. E con un'altra birra, naturalmente!"
    - tutor: "Naturalmente! Tua nonna sarebbe contenta di noi."
      goals: [serve]

- scenario: dal-meccanico
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. La macchina non parte più. Giro la chiave ma il motore non fa niente."
    - tutor: "Capisco. Quando è successo?"
      goals: [describe]
    - learner: "Ieri sera. Tornavo dall'ufficio e, a un semaforo, il motore si spegneva. Poi non è più ripartito."
      errors: [tense-aspect]
    - tutor: "Ho capito. Però «il motore si spegneva»? È successo una volta sola, in un momento preciso..."
      prompt: {text: "si spegneva", tags: [tense-aspect]}
    - learner: "Il motore... si era spegnendo?"
      errors: [tense-aspect]
    - tutor: "Diciamo «il motore si è spento». Potrebbe essere la batteria: è vecchia?"
      recast: {text: "si era spegnendo", fix: "si è spento", tags: [tense-aspect]}
      goals: [when]
      new: [{lemma: batteria, gloss: battery}]
    - learner: "Sì, ha sei anni. Quanto costa cambiare la batteria?"
    - tutor: "Con il lavoro, circa 120 euro. Se poi trovo altri problemi, la chiamo prima di fare qualsiasi cosa."
      goals: [cost]
    - learner: "Perfetto, grazie. Quando potrò venire a prendere la macchina?"
    - tutor: "Se non trovo altri problemi, sarà pronta oggi alle sei."
      goals: [time]

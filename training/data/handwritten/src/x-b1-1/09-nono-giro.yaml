# B1, correction-dense: meglio, ce ne sono, picking one error out of two, agreement, c'è, demonstratives.
- scenario: salute-stile-vita
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Ciao! Lavoro dieci ore al giorno, sempre seduta. Pranzo davanti al computer e la sera sono troppo stanca per cucinare."
    - tutor: "Capisco, una vita piena. E come dormi?"
    - learner: "Dormo male. Nel fine settimana dormo più bene, perché non penso al lavoro."
      errors: [comparative]
    - tutor: "Lo immagino. Ma «più bene»? C'è una parola sola per dirlo..."
      prompt: {text: "più bene", tags: [comparative]}
    - learner: "Nel fine settimana dormo meglio."
    - tutor: "Esatto! Allora lo stress conta molto. Qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Vorrei avere abitudini sane: muovermi tre volte alla settimana e mangiare cibo vero."
    - tutor: "Ottimo obiettivo, chiaro e possibile. Cosa ti ha fermata finora?"
      goals: [goal]
    - learner: "Le riunioni che finiscono tardi. E quando arrivo a casa, il divano è più forte di me!"
    - tutor: "Il divano vince sempre! Allora ci alleniamo prima del lavoro, alle sette. Che ne dici?"
      goals: [obstacles]
    - learner: "Alle sette... è presto, ma ci provo. Lunedì, mercoledì e venerdì?"
    - tutor: "Perfetto: tre mattine alla settimana, quaranta minuti. Cominciamo lunedì!"
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro da casa: faccio traduzioni per un'azienda spagnola, dieci ore alla settimana, dopo le lezioni."
    - tutor: "Che brava, studio e lavoro! E ti piace lavorare così?"
      goals: [situation]
    - learner: "Sì, vantaggi ci sono molti: scelgo io l'orario e non spendo soldi per i trasporti."
      errors: [ci-ne]
    - tutor: "Vero! Ma «vantaggi ci sono molti»? Quando dici «molti» senza il nome dopo, a «ci» si aggiunge una piccola parola..."
      prompt: {text: "ci sono molti", tags: [ci-ne]}
    - learner: "Vantaggi ci ne sono molti?"
      errors: [ci-ne]
    - tutor: "Quasi: ce ne sono molti, con «ce». E gli svantaggi, invece?"
      recast: {text: "ci ne sono molti", fix: "ce ne sono molti", tags: [ci-ne]}
      goals: [pros]
    - learner: "Lavoro in camera mia, quindi è difficile concentrarsi: le mie compagne di casa fanno rumore. E non conosco i colleghi."
    - tutor: "Eh, una casa di studenti non è un ufficio! In futuro cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei un lavoro misto: qualche giorno in ufficio, per imparare dai colleghi, e qualche giorno a casa."
    - tutor: "Ti capisco, anch'io sceglierei così. E brava per l'italiano, migliora ogni settimana!"
      goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Australia a Natale è estate! Si mangia all'aperto: pesce, gamberi e un dolce freddo con la frutta."
    - tutor: "Natale in estate, che strano per noi! E da bambina cosa facevi?"
      goals: [compare]
    - learner: "Quando ero bambina, il 25 abbiamo andato sempre in spiaggia con tutta la famiglia."
      errors: [tense-aspect, auxiliary-choice]
    - tutor: "Bellissimo! Però «abbiamo andato sempre»? Lo facevate ogni anno: quale tempo ci vuole?"
      prompt: {text: "abbiamo andato sempre", tags: [tense-aspect]}
    - learner: "Andavamo sempre in spiaggia!"
    - tutor: "Esatto. Natale al mare, che bello!"
      goals: [past]
    - learner: "Sì! Ma dimmi una cosa: perché in Italia si mangiano le lenticchie a Capodanno?"
    - tutor: "È un'usanza molto vecchia: si dice che portino soldi e fortuna per l'anno nuovo."
      goals: [ask]
    - learner: "Che carino. E per il pranzo da voi, cosa porto? Un dolce australiano?"
    - tutor: "Magari! Un dolce australiano sarebbe una bella sorpresa per tutti."
      goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao! Siamo andati in montagna, sulle Dolomiti. Mia moglie è rimasto senza parole davanti a quel panorama."
      errors: [participle-agreement]
    - tutor: "Le Dolomiti, che belle! Ma tua moglie «è rimasto»? Guarda bene l'ultima lettera..."
      prompt: {text: "è rimasto", tags: [participle-agreement]}
    - learner: "Mia moglie è rimasti?"
      errors: [participle-agreement]
    - tutor: "Quasi! Tua moglie è rimasta senza parole, e la capisco. Che tempo avete trovato?"
      recast: {text: "è rimasti", fix: "è rimasta", tags: [participle-agreement]}
      goals: [where]
    - learner: "È rimasta, certo. Il tempo era fresco e c'era il sole quasi ogni giorno. Solo una sera è piovuto forte."
    - tutor: "Fresco in agosto, che fortuna. E cosa avete fatto in montagna?"
      goals: [weather]
    - learner: "Abbiamo camminato molto, ogni giorno un sentiero diverso. Un giorno siamo saliti a duemila metri e abbiamo mangiato in un rifugio."
    - tutor: "Bravi, duemila metri! Cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il silenzio. La mattina presto si sentivano solo le campane delle mucche."
    - tutor: "Che pace. Mi hai fatto venire voglia di partire subito!"
      goals: [best]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [ce-ci-sono]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Mi scusi se la disturbo. Sono il signor Miller, abito qui sotto da un mese."
    - tutor: "Piacere di conoscerla. Che cosa posso fare per lei?"
      goals: [greet]
    - learner: "Ecco, la sera è molto rumore dal suo appartamento. Credo che sia la televisione."
      errors: [ce-ci-sono]
    - tutor: "Oh! Scusi, «è molto rumore»? Per dire che una cosa esiste in un posto, manca una piccola parola prima di «è»..."
      prompt: {text: "è molto rumore", tags: [ce-ci-sono]}
    - learner: "C'è molto rumore la sera."
    - tutor: "Ora è chiaro, e mi dispiace. Sento poco, quindi tengo il volume alto."
      goals: [problem]
    - learner: "Capisco benissimo, anch'io non sento più come una volta. Potrebbe abbassare il volume dopo le dieci? Mia moglie va a letto presto."
    - tutor: "Certo. Però dopo le dieci c'è il mio programma preferito... Potrei usare le cuffie, che ne dice?"
      goals: [request]
      new: [{lemma: cuffie, gloss: headphones}]
    - learner: "Sarebbe perfetto! Con le cuffie sentirà anche meglio."
    - tutor: "Ha ragione! Le compro domani. Grazie, e buona serata a lei e a sua moglie."
      goals: [compromise]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Buongiorno! Sì. Sono in pensione da due anni e ho molto tempo libero. Vorrei essere utile a qualcuno."
    - tutor: "Benvenuto! Qui ci diamo tutti del tu. Che cosa sai fare?"
      goals: [motivation]
    - learner: "Ero ingegnere. So riparare quasi tutto: biciclette, lampade, computer vecchi. E so guidare un furgone."
    - tutor: "Ma è fantastico, ci serve proprio una persona così! Quanto tempo hai?"
      goals: [skills]
    - learner: "Sono disponibile tre mattine alla settimana. Mi piacerebbe aiutare agli anziani del quartiere."
      errors: [preposition]
    - tutor: "Ottimo. Ma aiutare «agli» anziani? Con questo verbo c'è qualcosa di troppo..."
      prompt: {text: "aiutare agli anziani", tags: [preposition]}
    - learner: "Aiutare gli anziani, giusto?"
    - tutor: "Giusto! Abbiamo due attività: riparare piccole cose a casa degli anziani, oppure accompagnarli dal medico in macchina."
      goals: [time]
    - learner: "Preferisco riparare le cose. Così posso anche parlare un po' con loro."
    - tutor: "Perfetto, saranno felici. Cominci martedì: ti presento la signora Maria, che ha una radio rotta da un mese!"
      goals: [choose]

- scenario: affittare-appartamento
  level: B1
  persona: en-f-student
  history: [demonstrative]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Che carino! È tutto arredato? Anche quel armadio grande resta qui?"
      errors: [demonstrative]
    - tutor: "Sì, resta tutto. Ma «quel armadio»? Davanti a una vocale questa parola cambia forma..."
      prompt: {text: "quel armadio", tags: [demonstrative]}
      new: [{lemma: vocale, gloss: vowel}]
    - learner: "Quell'armadio, con l'apostrofo!"
    - tutor: "Esatto. Era di mia nonna, è molto grande."
    - learner: "Bello. E il riscaldamento? È incluso nell'affitto?"
    - tutor: "L'affitto è di 550 euro. Il riscaldamento è a parte, circa 40 euro al mese in inverno."
      goals: [rent, condition]
    - learner: "Va bene. Sono una studentessa, quindi vorrei un contratto di un anno. Quanto chiede di caparra?"
    - tutor: "Per gli studenti faccio contratti di dodici mesi. La caparra è di un mese."
      goals: [contract]
    - learner: "Perfetto. Il quartiere è sicuro la sera? Torno spesso tardi dalla biblioteca."
    - tutor: "Sì, è una zona tranquilla e piena di studenti. L'università è a dieci minuti a piedi."
      goals: [neighbourhood]
    - learner: "Allora lo prendo! Quando potrei entrare?"
    - tutor: "Dal primo del mese. Le mando il contratto domani."
      goals: [decide]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [register]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Sean, sono irlandese e viaggio in Italia da sei mesi. Adesso vorrei fermarmi a Bologna."
    - tutor: "Bene. Che lavori ha fatto finora?"
      goals: [intro]
    - learner: "A Dublino lavoravo in un ostello: accoglievo i clienti e organizzavo le visite della città. Poi ho fatto il cameriere a Roma per tre mesi."
    - tutor: "Interessante. E i suoi punti forti e deboli?"
      goals: [experience]
    - learner: "Parlo con tutti senza problemi e resto calmo quando c'è molta gente. Il punto debole è il mio italiano scritto."
    - tutor: "Su quello si può lavorare. Perché le interessa questo posto?"
      goals: [strengths]
    - learner: "Perché mi piace il contatto con le persone. E tu cerchi qualcuno con un buon inglese, no?"
      errors: [register]
    - tutor: "Sì, è vero. Ma... «tu cerchi»? Siamo in un ufficio e non ci conosciamo: che forma si usa?"
      prompt: {text: "tu cerchi", tags: [register]}
    - learner: "Mi scusi! Lei cerca qualcuno con un buon inglese."
    - tutor: "Ecco, molto meglio. Ha una domanda sul ruolo?"
      goals: [why]
    - learner: "Sì. Quali sarebbero gli orari? E lavorerei da solo o in squadra?"
    - tutor: "Lavorerebbe in una squadra di tre persone, dalle nove alle cinque. Le daremo una risposta in settimana."
      goals: [questions]

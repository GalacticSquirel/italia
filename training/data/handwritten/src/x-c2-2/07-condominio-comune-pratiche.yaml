# C2: assemblee, reclami agli uffici, residenza e sinistri: registro formale e trattativa civile.
- scenario: assemblea-condominio
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Vorrei dire subito che nessuno qui nega che la facciata vada sistemata: i calcinacci che cadono sul marciapiede li vediamo tutti. La mia obiezione riguarda i tempi. Un preventivo di centottantamila euro da approvare stasera, con la prima rata già a gennaio, per molte famiglie è un colpo difficile da reggere."
  - tutor: "La ringrazio per il tono, signora, che stasera non è scontato. Le riporto però l'obiezione del signor Rossi, che dal fondo mi fa segni: «Chi rimanda oggi paga il doppio domani, e intanto i calcinacci li prendiamo in testa noi». Che cosa gli risponde?"
    goals: [position]
  - learner: "Gli rispondo che sui calcinacci ha perfettamente ragione, e che proprio per questo non propongo di aspettare a braccia conserte. Capisco la sua esasperazione, signor Rossi: abita sopra il punto peggiore, e la capisco più di chiunque. Ma rimandare il grosso dei lavori non significa lasciar cadere tutto."
  - tutor: "Il signor Rossi si è seduto, il che a quest'ora è già un risultato. Allora, in concreto: che cosa propone all'assemblea?"
    goals: [defuse]
  - learner: "Propongo due cose. Primo, un intervento urgente di messa in sicurezza, con un ponteggio soltanto sul lato della strada, che costerebbe una frazione del totale. Secondo, che si chiedano altri due preventivi, perché uno solo, presentato dalla stessa ditta che ha fatto il sopralluogo, non mi sembra che basti. Se li avessimo chiesti già a giugno, adesso non saremmo qui a discutere."
  - tutor: "Sui due preventivi ha ragione, e lo dico contro il mio interesse, visto che quello che avete davanti l'ho chiesto io. La messa in sicurezza parziale si può deliberare stasera stessa. Resta il nodo dei tempi: fino a quando vorrebbe rimandare il resto?"
    goals: [alternative]
  - learner: "Direi di convocare un'assemblea straordinaria entro marzo, in cui confrontare i tre preventivi. Nel frattempo la messa in sicurezza verrebbe ripartita secondo i millesimi e pagata in due rate. E chiedo che questa proposta è messa a verbale con queste parole esatte."
    errors: [subjunctive-use]
  - tutor: "La proposta è chiara e la segretaria sta già scrivendo. Ma per un verbale che resterà agli atti, ripensi alla fine: «chiedo che questa proposta è messa a verbale». Dopo chiedo che, il modo del verbo Le sembra quello giusto?"
    prompt: {text: "chiedo che questa proposta è messa a verbale", tags: [subjunctive-use]}
  - learner: "No, certo: chiedo che sia messa a verbale. È la stanchezza dell'ora. E aggiungo che, se a marzo i preventivi fossero tutti simili a quello di stasera, voterei a favore anch'io, senza ulteriori discussioni."
  - tutor: "Sia messa, esattamente. Metto ai voti: messa in sicurezza subito, ripartita per millesimi in due rate, e assemblea straordinaria a marzo con tre preventivi. Le mani alzate sono la maggioranza: approvato e messo a verbale. Buonanotte a tutti, e grazie."
    goals: [compromise]

- scenario: assemblea-condominio
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Grazie, ragioniere. Sarò breve. Io non sono contrario ai lavori, sono contrario a farli adesso. Ho fatto due conti: con i miei millesimi la mia parte sarebbe di quasi novemila euro, e non sono l'unico che a gennaio non li avrà. Chiedo soltanto un rinvio di un anno, non di dieci."
  - tutor: "Chiaro e misurato, grazie. Purtroppo la signora Bianchi, in prima fila, commenta a voce alta: «Facile chiedere rinvii quando si abita al primo piano e la facciata la si vede solo dal bar». Vuole replicare?"
    goals: [position]
  - learner: "Signora, ha tutto il diritto di essere arrabbiata, e Le do ragione su una cosa: dal primo piano si vede meno. Ma non voglio molestare nessuno con un capriccio. Se chiedo un rinvio è perché ho fatto i conti, non perché la facciata non mi interessi."
    errors: [false-friend]
  - tutor: "Nessuno pensa che Lei voglia disturbare per capriccio, ci mancherebbe; e vedo che la signora Bianchi annuisce, il che a quest'ora è un piccolo miracolo. Un rinvio secco, però, l'assemblea non lo voterà mai. Ha un'alternativa concreta?"
    goals: [defuse]
    recast: {text: "molestare", fix: "disturbare", tags: [false-friend]}
  - learner: "Disturbare, ecco: «molestare» da voi è molto più grave, me lo ricordo adesso. L'alternativa ce l'ho. Si potrebbe approvare il lavoro adesso ma dividerlo in due lotti: prima il lato sulla strada, che è quello pericoloso, poi i cortili interni l'anno prossimo. E invece di quattro rate ne chiederei otto, mensili, così nessuno deve chiedere un prestito."
  - tutor: "Due lotti e otto rate: l'impresa me ne aveva accennato, e tecnicamente si può fare, a patto di montare il ponteggio due volte. Questo ha un costo, glielo dico subito: circa il sei per cento in più. Le va bene lo stesso?"
    goals: [alternative]
  - learner: "Se il sei per cento è il prezzo per non mettere in difficoltà le famiglie, lo pago volentieri. Vorrei però che nella delibera fosse scritto chiaramente che il secondo lotto partirà entro dodici mesi, così nessuno potrà pensare che lo rimandiamo all'infinito."
  - tutor: "Lo scriviamo nero su bianco: primo lotto subito, secondo entro dodici mesi, otto rate mensili e il sei per cento in più ripartito per millesimi. Votiamo... approvato a larga maggioranza, e va a verbale. Grazie, signore: Lei ci ha salvato la serata."
    goals: [compromise]

- scenario: reclamo-comune
  level: C2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Vorrei presentare un reclamo formale, e Le spiego subito perché. In via dei Mille, davanti al numero quattordici, c'è un cantiere aperto dal quindici settembre: hanno scavato una buca, l'hanno recintata e da allora non si è più visto nessuno. Sono passati due mesi. Mia moglie usa il deambulatore, e per uscire di casa deve camminare in mezzo alla strada."
  - tutor: "Mi dispiace molto, soprattutto per Sua moglie. Per quei lavori, però, risulta una pratica dell'azienda del gas, non del Comune: probabilmente sono in attesa di un'autorizzazione. Le consiglierei di avere ancora un po' di pazienza."
    goals: [describe]
  - learner: "Con tutto il rispetto, la pazienza l'abbiamo esaurita a ottobre. Che i lavori siano dell'azienda del gas lo capisco, ma la strada è comunale e il permesso di scavare l'ha rilasciato il Comune. Non mi basta sentirmi dire di aspettare: vorrei sapere quale ufficio si occupa a controllare questi cantieri, con nome e numero di telefono."
    errors: [preposition]
  - tutor: "Ha ragione: il permesso lo rilascia l'ufficio tecnico, e la Sua domanda è legittima. Visto che vuole un reclamo impeccabile, però, riascolti un attimo: «si occupa a controllare»? Con occuparsi, la preposizione è un'altra."
    goals: [insist]
    prompt: {text: "si occupa a controllare", tags: [preposition]}
  - learner: "Si occupa di controllare, certo: è una di quelle che dimentico sempre. Allora, come funziona la procedura? Ho diritto a una risposta scritta, e in quanto tempo?"
  - tutor: "Di controllare, esatto. Il reclamo si presenta su questo modulo e viene protocollato subito; l'amministrazione è tenuta a rispondere per iscritto entro trenta giorni. Se la risposta non arriva, può inviare un sollecito o rivolgersi al difensore civico."
    goals: [rights]
  - learner: "Benissimo, allora lo compilo adesso. Le chiederei però un favore: oltre a protocollarlo, potrebbe girare la segnalazione all'ufficio tecnico oggi stesso, specificando che è coinvolta una persona con disabilità? Trenta giorni, per chi deve uscire in mezzo alle macchine, sono un'eternità."
  - tutor: "Lo faccio senz'altro, e aggiungo una nota sull'urgenza. Ecco il numero di protocollo: duemilacinquecentodiciotto, con la data di oggi. Se entro dieci giorni nessuno si fa vivo, torni pure da me: il sollecito lo mando io, personalmente."
    goals: [commitment]

- scenario: reclamo-comune
  level: C2
  persona: es-f-erasmus
  history: [hypothetical]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Senti, scusa, vorrei fare un reclamo per il cantiere di via Marsala. Da sei settimane la pista ciclabile è chiusa con le transenne e i lavori sono fermi. Le biciclette devono passare in mezzo agli autobus, e la settimana scorsa una mia coinquilina è caduta."
    errors: [register]
  - tutor: "Mi dispiace per la sua coinquilina, spero niente di grave. Prima di procedere, però, un consiglio da sportello: «Senti, scusa», con un impiegato che non conosce, suona piuttosto confidenziale. Come lo riformulerebbe?"
    goals: [describe]
    prompt: {text: "Senti, scusa", tags: [register]}
  - learner: "Ha ragione, mi perdoni: senta, scusi. In Spagna diamo del tu quasi a tutti, anche in banca. Comunque la mia coinquilina si è solo sbucciata un ginocchio, per fortuna. Che cosa si può fare?"
  - tutor: "Senta, scusi: perfetto, e si figuri. Quanto alla ciclabile, le dico la verità: il cantiere è della Regione, noi possiamo soltanto inoltrare la segnalazione. Prima o poi qualcuno risponderà."
  - learner: "Prima o poi, però, non è una risposta. Capisco che il cantiere non sia vostro, ma la strada attraversa il Comune, e il Comune ha tutto il diritto di chiedere quando riprenderanno i lavori. Potrebbe almeno dirmi a chi viene inoltrata la segnalazione, ed entro quando?"
  - tutor: "Ha ragione, «prima o poi» non è una risposta, me ne rendo conto. La segnalazione va all'ufficio infrastrutture della Regione, con la nostra richiesta di un cronoprogramma. Se vuole, può anche presentare un reclamo a suo nome: ha più peso."
    goals: [insist]
    new: [{lemma: cronoprogramma, gloss: work schedule}]
  - learner: "Sì, lo presento a mio nome. E se non risponderebbero, che cosa posso fare? Ho letto che esiste un termine per la risposta."
    errors: [hypothetical]
  - tutor: "Domanda giustissima. Prima, però, ripensi a quell'ipotesi: «se non risponderebbero». Dopo se, in una frase così, il condizionale le sembra al posto giusto?"
    prompt: {text: "se non risponderebbero", tags: [hypothetical]}
  - learner: "Se non rispondessero! Lo so, il condizionale dopo se è il mio peccato capitale. Allora: se non rispondessero?"
  - tutor: "Rispondessero, esatto, e il peccato è veniale. In quel caso ha diritto a una risposta scritta entro trenta giorni dal protocollo; trascorso quel termine, può inviare un sollecito o rivolgersi al difensore civico regionale."
    goals: [rights]
  - learner: "Perfetto. Allora mi dia il modulo, lo compilo subito, e mi lasci il numero di protocollo, per favore, così lo giro anche ai miei coinquilini."
  - tutor: "Eccolo. Compilato e protocollato: numero quattromiladuecentosette, con la data di oggi. Lo giri pure ai coinquilini, e mi faccia sapere se la Regione si fa viva: la pratica la seguo io."
    goals: [commitment]

- scenario: burocrazia-residenza
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno, sì, il quarantasette sono io. Vorrei chiedere la residenza: mi sono trasferita a Bologna a settembre per un dottorato, e senza residenza non posso né cambiare il medico di base né iscrivermi alla biblioteca comunale."
  - tutor: "Benissimo: si tratta di una prima iscrizione all'anagrafe, allora. Mi servono un documento d'identità, il permesso di soggiorno, se non è cittadina europea, e il contratto d'affitto. Ha tutto con sé?"
    goals: [request]
  - learner: "Credo di sì. Sono britannica, quindi niente Unione Europea, purtroppo, da qualche anno. Ecco il passaporto, il permesso di soggiorno per studio, valido fino al duemilaventotto, e il contratto."
  - tutor: "Il passaporto e il permesso vanno benissimo. Il contratto, invece, mi crea un problema: non vedo gli estremi della registrazione all'Agenzia delle Entrate. Senza quelli, la residenza non può essere concessa."
    goals: [documents]
  - learner: "Ah. Il proprietario mi ha assicurato che l'avesse registrato a ottobre, ma la ricevuta non me l'ha mai mandata. Vive a Napoli e ci sentiamo solo per mail."
    errors: [subjunctive-use]
  - tutor: "Capita più spesso di quanto creda. Ma torniamo un attimo alla sua frase: «mi ha assicurato che l'avesse registrato». Assicurare presenta un fatto come certo: le serve davvero il congiuntivo?"
    prompt: {text: "mi ha assicurato che l'avesse registrato", tags: [subjunctive-use]}
  - learner: "No, giusto: mi ha assicurato che l'aveva registrato. Il congiuntivo mi piace così tanto che lo metto anche dove non serve. Comunque, posso chiedergli la ricevuta adesso, per mail?"
  - tutor: "L'aveva registrato, esatto: un eccesso di zelo, il suo, decisamente simpatico. Sì, gli scriva pure: basta la ricevuta di registrazione, anche in PDF. Intanto avvio la pratica e la lascio in sospeso: ha dieci giorni per integrarla."
    goals: [problem]
  - learner: "Perfetto, gliela chiedo subito. E dopo, che cosa succede? Mi hanno detto che passano i vigili a controllare: devo restare a casa ad aspettarli?"
  - tutor: "Una volta integrata la pratica, entro quarantacinque giorni passano i vigili per l'accertamento. Non deve restare chiusa in casa: se non la trovano, lasciano un avviso e ripassano. Se va tutto bene, la residenza vale da oggi e il certificato lo scarica online."
    goals: [next]

- scenario: burocrazia-residenza
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Vengo per il cambio di residenza: mi sono trasferito da Torino a Bergamo per lavoro, in un'impresa di costruzioni. In cantiere mi hanno detto che va fatto entro venti giorni dal trasloco, e oggi è il dodicesimo."
  - tutor: "Esatto, venti giorni, e Lei è nei tempi. Trattandosi di un trasferimento da un altro Comune, mi servono un documento, il permesso di soggiorno e il titolo dell'abitazione: contratto d'affitto o dichiarazione di ospitalità."
    goals: [request]
  - learner: "Ecco il passaporto, sono argentino. Il permesso di soggiorno, invece, è in rinnovo: ho solo la ricevuta della posta. Il vecchio è scaduto ad agosto, ma la domanda di rinnovo l'ho presentata in tempo, a luglio."
  - tutor: "La ricevuta va bene, purché risulti che la domanda è stata presentata prima della scadenza, come nel Suo caso. E per l'abitazione? Vedo che non mi ha dato un contratto."
    goals: [documents]
  - learner: "No, perché il contratto è intestato a mio cugino: vivo con lui da quando sono arrivato. Però ho portato una carta firmata da lui, in cui dice che sono suo ospite e che è d'accordo."
  - tutor: "Una dichiarazione firmata da Suo cugino è un buon inizio, ma da sola non basta: serve la dichiarazione di ospitalità su questo modulo, con la copia del suo documento. Se lui non può venire, la firma a casa e Lei me la riporta."
    goals: [problem]
  - learner: "Va bene, gliela faccio firmare stasera. Devo tornare qui e rifare la fila, o posso mandarla in un altro modo?"
  - tutor: "Niente fila, per fortuna: può inviarla per posta elettronica certificata, o anche con una mail normale, allegando i documenti scansionati, entro dieci giorni. Poi i vigili passeranno a verificare che Lei abiti davvero lì, e la conferma Le arriverà per posta."
    goals: [next]

- scenario: assicurazione-sinistro
  level: C2
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri sera, verso le sette, stavo uscendo in retromarcia dal parcheggio del supermercato, molto piano, quando un'auto che passava dietro di me mi ha urtato. Nessun ferito, per fortuna, ma il mio paraurti posteriore è da rifare."
  - tutor: "Meno male che nessuno si è fatto male. Le chiedo una precisazione importante: Lei era in retromarcia e l'altra auto circolava nella corsia del parcheggio? Perché in quel caso, temo, la responsabilità tende a ricadere su chi esce."
    goals: [what]
  - learner: "Capisco il principio, ma qui c'è un dettaglio. Prima di uscire ho guardato nello specchietto e non c'è stato nessuno. L'altro conducente veniva contromano: la corsia è a senso unico, con le frecce dipinte per terra, e lui andava nel senso opposto parlando al telefono."
    errors: [tense-aspect]
  - tutor: "Questo cambia parecchio, se è documentabile. Mi ripete però il momento dello specchietto: «non c'è stato nessuno»? Lì descrive una situazione, non un evento: che tempo userebbe?"
    goals: [responsibility]
    prompt: {text: "non c'è stato nessuno", tags: [tense-aspect]}
  - learner: "Non c'era nessuno, giusto: era la scena, non l'azione. Per il senso unico ho fatto le foto alle frecce, e una signora che ha visto tutto mi ha lasciato il suo numero."
  - tutor: "Non c'era, perfetto. Le foto e una testimone valgono oro. Avete compilato la constatazione amichevole sul posto? E l'altro conducente l'ha firmata?"
  - learner: "Sì, l'abbiamo compilata insieme, ma con un problema: nelle circostanze lui ha segnato soltanto che io uscivo da un parcheggio, non che lui andava contromano. Io ho firmato lo stesso, perché era tardi e lui insisteva. Ho fatto male?"
  - tutor: "Non ha fatto male, diciamo che non ha fatto benissimo: firmando, ha accettato quella versione. Può comunque allegare una Sua dichiarazione con la ricostruzione, le foto e il recapito della testimone; il perito ne terrà conto."
    goals: [documents]
  - learner: "La preparo oggi stesso. E adesso quali sono i prossimi passi? Devo portare l'auto da un carrozziere convenzionato o aspettare il perito?"
  - tutor: "Prima il perito: La contatterà entro cinque giorni lavorativi per vedere l'auto. Dopo la perizia può scegliere la carrozzeria; con una convenzionata non anticipa nulla. Sulla franchigia decideremo quando sarà chiarita la responsabilità."
    goals: [next]

- scenario: assicurazione-sinistro
  level: C2
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. La chiamo perché stamattina ho trovato la mia macchina danneggiata: era parcheggiata sotto casa, in via Garibaldi, e qualcuno l'ha urtata sul lato del conducente, rompendo lo specchietto e rigando tutta la portiera. Sul parabrezza, naturalmente, nessun biglietto."
  - tutor: "Che brutta sorpresa, mi dispiace. Senza un responsabile identificato, però, la sua polizza copre il danno solo se ha la garanzia contro gli atti vandalici. Ha qualche elemento per risalire all'altro veicolo?"
    goals: [what]
  - learner: "Forse sì. Il portiere del palazzo di fronte sostiene che la mia macchina è venuta urtata da un furgone bianco mentre faceva manovra, verso le sei. Dice anche di aver annotato le prime lettere della targa."
    errors: [passive]
  - tutor: "Un testimone con mezza targa è già moltissimo. Un dettaglio, visto che la sua versione andrà messa per iscritto: «è venuta urtata»? Nei tempi composti, il passivo con venire non regge. Come lo direbbe?"
    goals: [responsibility]
    prompt: {text: "è venuta urtata", tags: [passive]}
  - learner: "È stata urtata, certo. Con venire funziona solo nei tempi semplici: viene urtata, veniva urtata. E pensare che lo spiego ai miei studenti ogni anno."
  - tutor: "È stata urtata, esatto: come vede, capita anche alle migliori insegnanti. Con le prime lettere della targa e il modello possiamo chiedere una verifica. Il portiere sarebbe disposto a firmare una dichiarazione?"
  - learner: "Credo di sì, è una persona molto precisa. Che cosa dovrei mandarvi, esattamente? Ho fatto una decina di foto, ma la constatazione amichevole, ovviamente, non ce l'ho: non c'era nessuno con cui compilarla."
  - tutor: "Ovviamente, sì. Ci mandi le foto, la dichiarazione firmata del portiere con la copia del suo documento e, cosa fondamentale, la denuncia ai Carabinieri o alla Polizia locale: senza quella non possiamo aprire un sinistro con un veicolo non identificato."
    goals: [documents]
  - learner: "Allora vado dai Carabinieri oggi pomeriggio. E dopo? Se trovano il furgone, chi paga il danno? E la franchigia, in quel caso, resta a mio carico?"
  - tutor: "Se il furgone viene identificato, il risarcimento lo chiediamo alla compagnia del furgone, e la franchigia non la riguarda: paga chi ha causato il danno. Un perito la chiamerà entro una settimana. Le mando subito per mail il numero di pratica."
    goals: [next]

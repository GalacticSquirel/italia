# C2: il club del libro, la bottega del traduttore, la satira al bar.
- scenario: film-libro
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io, se nessuno si offende. Ho letto «Le otto montagne» di Cognetti. È la storia di un'amicizia tra due ragazzini, uno di città e uno di montagna, che si ritrovano ogni estate in un paesino ai piedi del Monte Rosa. Poi crescono, si perdono e si cercano di nuovo, ma non vi dico come."
  - tutor: "Brava, riassunto pulito e nessun finale rovinato: qui dentro è una virtù rara. Parlaci del protagonista, allora. Che tipo è questo ragazzino di città?"
    goals: [summary]
  - learner: "Pietro è uno che osserva più di quanto parli. Da bambino subisce le camminate imposte dal padre, da adulto scappa lontano, fino in Nepal, e a metà libro ho realizzato che in fondo passa la vita a cercare un posto dove restare. Bruno, l'amico, è il suo contrario: non si è mai mosso dalla sua valle."
    errors: [word-choice]
  - tutor: "Anch'io, più o meno a metà, mi sono reso conto che il vero viaggio di Pietro è quello verso casa. Uno che parte sempre e uno che non parte mai: la coppia regge tutto il romanzo. E a te, alla fine, è piaciuto davvero?"
    goals: [characters]
    recast: {text: "ho realizzato che", fix: "mi sono reso conto che", tags: [word-choice]}
  - learner: "Molto, anche se con una riserva. Mi è piaciuto perché non idealizza la montagna: ci sono il freddo, i debiti, la solitudine che ti indurisce. La riserva è che le donne restano sullo sfondo, quasi fossero parte del paesaggio."
  - tutor: "Riserva legittima, l'ho sentita fare anche ad altri: è un libro di padri, figli e amici, e le madri guardano da lontano. Però la montagna senza cartolina è un merito grande. A chi lo metteresti in mano?"
    goals: [opinion]
  - learner: "A chiunque abbia un amico che non sente da anni e non sa bene perché. E a chi ha avuto un padre difficile da capire. Non lo consiglierei, invece, a chi cerca colpi di scena: qui la cosa più rumorosa è la neve che cade."
  - tutor: "«La cosa più rumorosa è la neve che cade»: la scrivo sulla lavagna del club. Grazie, hai aperto la serata nel modo migliore. Chi vuole essere il prossimo?"
    goals: [recommend]

- scenario: film-libro
  level: C2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io, se permettete. Ho letto «Il Gattopardo», finalmente. Siamo in Sicilia nel 1860, sbarcano i garibaldini e un principe, don Fabrizio, guarda il suo mondo che finisce senza muovere un dito. Il nipote invece corre dove tira il vento. Di più non racconto."
  - tutor: "Finalmente davvero, era ora! E l'hai riassunto senza svelare nulla, complimenti. Com'è, visto da vicino, questo principe che non muove un dito?"
    goals: [summary]
  - learner: "È un uomo enorme, in tutti i sensi: alto, forte, colto, e stanco. Guarda le stelle col telescopio perché sono l'unica cosa che non cambia. Capisce tutto prima degli altri, e proprio per questo non fa niente: sa che è inutile. Non è pigrizia, è lucidità."
  - tutor: "Lucidità che paralizza: è il ritratto esatto. E tu da che parte stai? Ti ha conquistato o ti ha fatto venire voglia di scuoterlo?"
    goals: [characters]
  - learner: "Tutte e due le cose. Il libro mi ha piaciuto moltissimo, soprattutto il pranzo con il timballo di maccheroni: da cuoco ti dico che quella pagina è scritta da uno che sapeva mangiare. Però certe riflessioni del principe le ho trovate lunghe, quasi compiaciute."
    errors: [auxiliary-choice]
  - tutor: "Il timballo lo citano tutti, ma detto da un cuoco pesa di più. Solo una cosa: «mi ha piaciuto»? Con piacere, al passato, l'ausiliare non è quello. Come lo ridici?"
    goals: [opinion]
    prompt: {text: "mi ha piaciuto", tags: [auxiliary-choice]}
  - learner: "Mi è piaciuto, hai ragione: in spagnolo usiamo «haber» e ogni tanto mi scappa. Lo consiglierei a chi ha pazienza e ama i libri che parlano di una fine. A un ragazzo di vent'anni forse no: bisogna aver perso qualcosa per capirlo."
  - tutor: "Esatto, mi è piaciuto. E quell'ultima frase è verissima: è un libro che si capisce meglio dopo qualche sconfitta. Grazie, e se un giorno prepari quel timballo, il club si offre volontario per l'assaggio."
    goals: [recommend]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Lo so, e ti dico anche dove l'ho perso: a pagina quarantadue. «She was nobody's fool.» Quattro parole, secche, da narratore di noir. In italiano o la allungo o la addolcisco, e in tutti e due i casi lui smette di parlare e comincio io."
  - tutor: "Almeno la diagnosi è giusta, il che per una bozza è già molto. Tu hai scritto «era una donna tutt'altro che ingenua»: sembra il verbale di un notaio. Che alternative avevi scartato?"
    goals: [problem]
  - learner: "Due. «Non era la scema di nessuno», che ricalca l'inglese e mantiene il ritmo, ma in italiano non esiste. E «non era nata ieri», che è idiomatica e breve, però ha un tono quasi bonario, da zia. Fra una fedeltà che suona falsa e una naturalezza che cambia registro, ho scelto la prudenza, e ho sbagliato."
  - tutor: "La prima è un calco che farebbe ridere il redattore, concordo. Sulla seconda sei severa: la zia la senti tu. E già che ci siamo, qualche riga sotto mi hai tradotto «eventually she talked» con «eventualmente parlò». Me la spieghi?"
    goals: [options]
  - learner: "Non te la spiego, me ne vergogno e basta. «Eventually» vuol dire «alla fine», mentre «eventualmente» introduce un'ipotesi: è il falso amico del primo anno, e ci sono cascata alle due di notte. Metto «alla fine parlò», o meglio ancora «finì per parlare», che ha lo stesso passo stanco dell'originale."
  - tutor: "«Finì per parlare» è ottimo, e le due di notte non sono un'attenuante, ma le accetto. Torniamo alla signora che non è la scema di nessuno. Decidi tu, però voglio una ragione, non un'intuizione."
    goals: [false-friend]
  - learner: "Allora propongo una terza via: «Non la fregava nessuno.» Quattro parole come in inglese, registro basso ma non volgare, e il narratore torna a parlare come uno che ha passato la vita nei bar. Rinuncio alla lettera, ma salvo la voce, che in un noir conta di più."
  - tutor: "«Non la fregava nessuno.» Ecco, adesso sento l'autore, e sento pure il bar. Approvata: salvi la voce e paghi il prezzo giusto. Rivedi il resto del capitolo con lo stesso orecchio e domani ne riparliamo."
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-teacher
  history: [false-friend]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autrice a parlare."
  - learner: "Me lo temevo. Il fatto è che la narratrice parla tutta per attenuazioni, da inglese beneducata: «I was not entirely displeased», dice, quando in realtà è felicissima. Se traduco alla lettera sembra fredda; se dico quello che intende, perdo il gioco."
  - tutor: "E tu, nel dubbio, hai scritto «ero contentissima», cioè hai fatto dire alla signora quello che non direbbe nemmeno sotto tortura. Quali strade vedi, a parte quella sbagliata?"
    goals: [problem]
  - learner: "Due. «Non mi dispiacque del tutto» conserva la litote, e in italiano la litote esiste: diciamo «non è male» per dire che è ottimo. Oppure «la cosa non mi lasciò indifferente», più elegante ma più vaga. L'autrice non pretende di far ridere apertamente; vuole che il lettore sorrida da solo, e la prima soluzione glielo permette."
    errors: [false-friend]
  - tutor: "Giusto: l'autrice non intende far ridere apertamente, lascia il lavoro al lettore, e la litote italiana regge benissimo. Occhio a «pretendere», che da noi vuol dire esigere. A proposito di trappole: a pagina sessanta, «a sensible girl» è diventata «una ragazza sensibile»."
    goals: [options]
    recast: {text: "non pretende di far ridere", fix: "non intende far ridere", tags: [false-friend]}
    new: [{lemma: litote, gloss: "litotes, understatement by negation"}]
  - learner: "Hai ragione su tutti e due i fronti, e mi brucia soprattutto il secondo. «Sensible» è assennata, giudiziosa; «sensibile» sarebbe «sensitive». Ed è grave, perché tutto il capitolo oppone lei, che ha la testa sulle spalle, alla sorella che piange per un nonnulla. Metterei «una ragazza assennata»."
  - tutor: "«Assennata» ha la patina giusta per una narratrice così, e rimette in piedi il contrasto con la sorella. Bene. Ci resta la frase da cui siamo partiti: che cosa mandiamo in stampa?"
    goals: [false-friend]
  - learner: "«Non mi dispiacque del tutto», senza esitazioni. È fedele alla lettera e al carattere, e chi legge capisce subito con chi ha a che fare. Se poi il redattore la trova fredda, gli spiego che è fredda apposta."
  - tutor: "Glielo spieghi tu, e io vengo a godermi la scena. Decisione presa, e per le ragioni giuste: fedele alla frase e al personaggio. Vedi che quando ti fidi dell'autrice il testo scorre lo stesso?"
    goals: [decide]

- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Touché. Il problema è il narratore: ha sedici anni e infila «like» ogni tre parole. «It was, like, the worst day ever.» Se lo tolgo, parla come un professore; se lo lascio, non so che cosa metterci."
  - tutor: "E così l'hai tolto, e adesso il ragazzino si esprime come un editoriale di prima pagina. Con che cosa pensavi di sostituirlo, prima di arrenderti?"
    goals: [problem]
  - learner: "Con «tipo» oppure con «cioè». «Tipo» è quello che dicono davvero i sedicenni oggi: «è stato, tipo, il giorno peggiore di sempre». «Cioè» mi suona più anni Ottanta, da film con i paninari. Nonostante il romanzo è ambientato nel 2019, temevo che «tipo» invecchiasse in fretta."
    errors: [subjunctive-use]
  - tutor: "I paninari, addirittura: hai fatto i compiti. Su «tipo» ci torniamo subito. Prima però rileggi «Nonostante il romanzo è ambientato»: quella congiunzione, dopo di sé, che modo pretende?"
    goals: [options]
    prompt: {text: "Nonostante il romanzo è ambientato", tags: [subjunctive-use]}
  - learner: "Il congiuntivo, ovvio: nonostante il romanzo sia ambientato nel 2019. E a proposito di cose che invecchiano male, ho visto che ho tradotto «Are you serious?» con «Sei serio?». Lo sento dire in tutti i doppiaggi, ma è un calco, no? In italiano verrebbe «Dici sul serio?»."
  - tutor: "Ecco, bravo, due correzioni in un colpo solo. Sì, è un calco da doppiaggio: ormai circola, ma in un libro stona, e «Dici sul serio?» è quello che direbbe un ragazzo vero. Resta «tipo». Mi convinci o no?"
    goals: [false-friend]
  - learner: "Ti convinco. Un libro del 2019 deve suonare come il 2019, anche a costo di invecchiare: fra vent'anni farà parte del suo fascino, come lo slang di Holden. Però lo doserei: una volta ogni due o tre «like», altrimenti in italiano diventa una caricatura."
  - tutor: "Dosato, d'accordo: l'inglese sopporta la ripetizione, l'italiano molto meno. Vada per «tipo», una volta su tre, e Holden come avvocato difensore. Rimettici mano e ridammi il capitolo venerdì."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Colpevole. Ho riso mezzo secondo dopo gli altri, per educazione. Ho capito il ministro, ho capito la carbonara, ma perché dovremmo «dormire tra due guanciali»? Che c'entrano i cuscini?"
  - tutor: "C'entrano eccome. «Dormire tra due guanciali» vuol dire stare tranquilli, senza pensieri. Ma il guanciale è anche quello che va nella carbonara, e guai a metterci la pancetta. Il ministro la difende, quindi possiamo stare sereni: tra due guanciali, appunto."
    goals: [missed]
    new: [{lemma: guanciale, gloss: "pillow; also cured pork cheek"}]
  - learner: "Ah, ecco! Doppio senso tra il letto e la padella. Adesso che me l'hai spiegata fa meno ridere, ovviamente. Quella che invece mi ha steso è stata la battuta sull'autobus: «A Roma l'autobus non è un mezzo di trasporto, è un atto di fede.» Lì ho riso prima di tutti, perché stamattina ho aspettato il 64 per quaranta minuti."
  - tutor: "Le battute spiegate sono come le rane sezionate: si capisce tutto, ma la rana muore. Quella dell'autobus funziona perché è vera, e il 64 ne è la prova vivente. Dai, adesso tocca a te: un gioco di parole in italiano, anche brutto."
    goals: [favourite]
  - learner: "Ci provo, ma non garantisco. Restando in cucina: «Quel ministro deve aver fatto il cuoco, perché nessuno sa rigirare la frittata come lui.» Regge? «Rigirare la frittata» l'ho imparato dalla mia padrona di casa, che lo dice di suo marito."
  - tutor: "Regge benissimo, e te lo dice uno che ride poco: senso letterale e senso figurato stanno in piedi tutti e due. Al comico di stasera gliela venderei. Certo che lui col ministro c'è andato giù pesante: secondo te ha esagerato?"
    goals: [wordplay]
  - learner: "Secondo me no. La satira deve poter mordere chi comanda: se un ministro non regge una battuta sulla carbonara, ha sbagliato mestiere. Il limite lo metterei altrove, quando si prende di mira chi non può difendersi. Ridere dei potenti è satira; ridere dei deboli è solo cattiveria con il microfono."
  - tutor: "«Cattiveria con il microfono»: sottoscrivo, e detto così è più chiaro di tanti editoriali. In alto si può colpire, in basso no. Su questo brindiamo, e il prossimo giro lo offre il ministro."
    goals: [limits]

- scenario: umorismo-satira
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-form]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "L'ho capita a metà, lo ammetto, ma non è quella che mi ha messa in difficoltà. Il vero buio è arrivato dopo: «Tutte le strade portano a Roma, ma poi nessuna ne esce: benvenuti sul raccordo.» Rideva tutta la sala e io guardavo il soffitto. Che cos'è il raccordo?"
  - tutor: "È il Grande Raccordo Anulare, l'anello di autostrada che gira intorno alla città. Ci entri alle otto e ne esci a Natale. Per un romano è più familiare del Colosseo, e fa pure più paura."
    goals: [missed]
    new: [{lemma: raccordo, gloss: "ring road, junction"}]
  - learner: "Adesso sì! A Siviglia abbiamo la nostra tangenziale, stessa disperazione. Quella che invece ho capito al volo era sulla manovra: «Il governo ha varato la manovra. Peccato che fossimo in retromarcia.» Funziona perché «manovra» è la legge di bilancio, ma anche quello che fai con la macchina per parcheggiare."
  - tutor: "Spiegata meglio del comico, che infatti non spiega niente e fa bene. Hai preso il doppio senso e pure il sottinteso: si va indietro. Quindi è quella la tua preferita, o ce n'è un'altra che ti ha fatta ridere di pancia?"
    goals: [wordplay]
  - learner: "Di pancia mi ha fatta ridere l'imitazione della turista che ordina il cappuccino dopo l'amatriciana, perché quella turista ero io il primo mese. Funzionava perché non era cattiva: se il comico mi dasse della stupida non riderei, invece prendeva in giro il cameriere scandalizzato tanto quanto lei."
    errors: [subjunctive-form]
  - tutor: "Il cameriere scandalizzato era un capolavoro, confermo, e la scena funziona proprio perché colpisce da tutte e due le parti. Però, «se il comico mi dasse»? Quel congiuntivo di dare è irregolare: come fa?"
    goals: [favourite]
    prompt: {text: "se il comico mi dasse", tags: [subjunctive-form]}
  - learner: "Desse, certo: se mi desse della stupida. In spagnolo è «diese» e faccio un misto. E qui arrivo a quello che volevo dire: per me il limite della satira sta lì. Si può ridere di tutti, purché si rida anche di sé stessi e nessuno venga umiliato per quello che è, anziché per quello che fa."
  - tutor: "Desse, brava. E la distinzione tra quello che uno è e quello che uno fa è la cosa più seria che abbia sentito stasera, comico compreso. Io aggiungerei solo che il potere va punzecchiato sempre. Andiamo, che se prendiamo il raccordo arriviamo a Natale."
    goals: [limits]

- scenario: umorismo-satira
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Ti sbagli, quella l'ho capita benissimo: semplicemente non faceva ridere. Quella che non ho preso è arrivata dopo, sul sindaco: lui dice «stiamo lavorando» e il comico risponde «sì, stiamo freschi». La sala è venuta giù e io sono rimasta lì come un pesce lesso."
    errors: [word-choice]
  - tutor: "Come un pesce lesso, però detto bene. Quella che non hai capito gioca su un modo di dire: «stiamo freschi» non c'entra con la temperatura, vuol dire che siamo messi male. Il sindaco lavora, e noi aspettiamo invano."
    goals: [missed]
    recast: {text: "non ho preso", fix: "non hai capito", tags: [word-choice]}
  - learner: "Capita, ecco, non presa: me lo segno. Allora «stiamo freschi» è ironico, il contrario di quello che sembra. Bella. La mia preferita resta comunque quella sulle due città: «A Milano se arrivi con cinque minuti di ritardo chiedi scusa; a Roma se arrivi con cinque minuti di ritardo sei il primo.» Io lavoro a Milano e ho riso amaro."
  - tutor: "Ridi amaro perché sai che è vera, ed è per questo che funziona: uno stereotipo, ma ribaltato in un complimento a metà. Noi romani la prendiamo come una medaglia. Ora però ti metto alla prova: fammi tu un gioco di parole."
    goals: [favourite]
  - learner: "Sul mio mestiere, allora, così non offendo nessuno tranne me. «Lavoro nel marketing: vendo fumo, ma ho smesso con le sigarette.» Troppo debole? Volevo giocare su «vendere fumo», che avevo sentito dire di un mio collega."
  - tutor: "Debole per niente: «vendere fumo» preso alla lettera, con la sigaretta a fare da spalla. Al terzo spritz è una signora battuta. E sul finale dello spettacolo, quando ha tirato in mezzo la religione, tu che dici: si può?"
    goals: [wordplay]
  - learner: "Si può, ma bisogna saperlo fare. Per me non esistono argomenti vietati, esistono battute pigre. Se usi la religione, o una tragedia, soltanto per scioccare, il pubblico lo sente e si irrigidisce. Se invece la battuta dice qualcosa di vero, anche chi si offende sotto sotto capisce perché gli altri ridono."
  - tutor: "Nessun argomento vietato, solo battute pigre: è la regola più onesta che conosca, e stasera il comico l'ha rispettata a metà. Dai, paga il venditore di fumo o pago io?"
    goals: [limits]

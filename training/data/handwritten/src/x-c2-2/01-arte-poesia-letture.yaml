# C2, cultura e testi: mostre, Montale, Calvino, club di lettura.
- scenario: arte-mostra
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Di primo acchito quasi nessuna, e te lo dico con un certo imbarazzo. Sei bottiglie e una scatola su un tavolo: mi verrebbe da tirare dritto. Eppure è da due minuti che non riesco a staccare gli occhi."
  - tutor: "Quell'«eppure» vale più di mille complimenti: con Morandi succede quasi sempre così. Prova allora a dirmi che cosa vedi davvero, come se dovessi descriverlo a qualcuno al telefono."
    goals: [react]
  - learner: "Vedo oggetti stretti l'uno all'altro, come se avessero freddo. I colori sono pochissimi: grigi, un bianco sporco, un rosa spento. E la luce non arriva da nessuna parte precisa, sembra che ce l'abbiano dentro le bottiglie stesse."
  - tutor: "«Come se avessero freddo» te la rubo per la prossima lezione. E hai visto giusto sulla luce: non c'è una finestra, non c'è un'ora del giorno. Secondo te, perché un uomo dipinge le stesse bottiglie per quarant'anni?"
    goals: [describe]
  - learner: "Forse perché le bottiglie sono un pretesto. Non credo gli interessasse l'oggetto in sé, ma il rapporto tra le cose: la distanza, il peso, il silenzio che c'è in mezzo. È pittura che parla di pittura, più che del mondo."
  - tutor: "Sono d'accordo, e aggiungo una cosa: quella polvere sui colori non è un caso, lui lasciava davvero che la polvere si posasse sugli oggetti dello studio. Se dovessi accostarlo a qualcuno che conosci, a chi penseresti?"
    goals: [interpret]
  - learner: "Mi viene in mente Chardin, per la stessa devozione alle cose umili. Ma in Chardin senti ancora la cucina, la casa, qualcuno che sta per rientrare. Qui invece non rientrerà nessuno: è una natura morta portata fino all'astrazione."
  - tutor: "Chardin è il paragone che farebbe qualunque buon critico, e la differenza l'hai detta meglio di tanti cataloghi. Vieni, nella prossima sala ci sono i paesaggi: voglio vedere se anche lì trovi che non rientra nessuno."
    goals: [compare]

- scenario: arte-mostra
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi fa venire fame, per cominciare. Scherzi a parte, mi stordisce: c'è tanta di quella roba che non so dove posare lo sguardo. Pesci, carne appesa, formaggi, limoni... sembra il mercato dove vado io alle sei di mattina."
  - tutor: "Detto da un cuoco è la recensione migliore. È la Vucciria di Guttuso, il mercato di Palermo. Tu che i banchi li conosci dal vero, dimmi: che cosa noti che un visitatore qualunque non noterebbe?"
    goals: [react]
  - learner: "Noto che la merce è dipinta con più amore delle persone. Il pesce spada è lucido, quasi vivo, mentre le facce sono dure, chiuse. E poi non c'è cielo: i colori riempiono tutto, rosso e giallo dappertutto, e la prospettiva ti spinge dentro il vicolo senza via d'uscita."
  - tutor: "Occhio da professionista: il cielo manca davvero, e quel passaggio stretto ti costringe a camminare tra i banchi. Ora fai un passo in più. Tutta questa abbondanza, per te, è una festa o nasconde dell'altro?"
    goals: [describe]
  - learner: "Per me nasconde la morte, anche se suona esagerato. La carne aperta a metà, il pesce con la testa tagliata, e nessuno che sorrida. Capisco perché il quadro abbia avuto tanto esito: ti seduce con il colore e poi ti lascia inquieto."
    errors: [false-friend]
  - tutor: "Non è affatto esagerato: molti leggono in quell'abbondanza proprio un presagio di morte. E capisco anch'io perché abbia avuto tanto successo, dato che seduce e inquieta insieme. Ti ricorda qualcosa che hai già visto, magari di tutt'altra epoca?"
    goals: [interpret]
    recast: {text: "tanto esito", fix: "tanto successo", tags: [false-friend]}
    new: [{lemma: presagio, gloss: omen}]
  - learner: "Successo, certo: lo spagnolo qui mi tradisce sempre. Mi ricorda le nature morte fiamminghe, quelle con la selvaggina e il limone sbucciato. Solo che là tutto è immobile e silenzioso, mentre qui senti le voci dei venditori."
  - tutor: "Paragone azzeccato: stessa abbondanza, stesso pensiero della fine, ma i fiamminghi sussurrano e Guttuso grida. Adesso però ti porto al bar del museo, prima che tu mi svenga davanti al pesce spada."
    goals: [compare]

- scenario: poesia-montale
  level: C2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Mi è rimasto addosso il primo verbo, più di ogni immagine: «ho incontrato». Il male non lo si subisce né lo si medita, lo si incontra per strada, come un conoscente che si preferirebbe evitare. L'ho trovato di una sobrietà quasi sconcertante."
  - tutor: "Un conoscente che si preferirebbe evitare: è proprio questo il tono, niente tragedia, quasi un appunto di cronaca. E quell'avverbio in apertura, «spesso», che cosa aggiunge secondo lei a un incontro del genere?"
    goals: [first-reading]
  - learner: "Aggiunge l'abitudine, e toglie l'eccezione. È un male a cui nessuno ne parla perché è quotidiano: sta nel ruscello, nella foglia, nel cavallo. Fra tutte scelgo la foglia che si accartoccia, perché è l'unica che compie un gesto, quasi si ritraesse."
    errors: [relative-pronoun]
  - tutor: "La foglia che si ritrae è una scelta finissima: è l'unica delle tre a difendersi. Mi permetta però di tornare su «a cui nessuno ne parla»: lì il pronome relativo zoppica, e c'è una particella di troppo. Provi a riformulare."
    goals: [image]
    prompt: {text: "a cui nessuno ne parla", tags: [relative-pronoun]}
  - learner: "Ha ragione, ho messo due pronomi dove ne bastava uno: è un male di cui nessuno parla. Quanto al suono, mi pare che la prima strofa sia tutta un inciampo di consonanti, mentre la seconda si distende e si apre in vocali larghe: «statua», «sonnolenza», «nuvola»."
  - tutor: "Esatto, e l'orecchio non la inganna: dopo l'attrito della prima quartina la seconda respira, come se il verso stesso si allontanasse dal dolore. Due strofe, due movimenti. Che cosa ne ricava, alla fine, sul senso dell'insieme?"
    goals: [sound]
  - learner: "Ne ricavo che Montale non propone un rimedio, ma una postura. Il bene non è la gioia: è quel «prodigio» raro che schiude l'indifferenza, cioè un attimo in cui si riesce a guardare senza essere feriti. Trovo che sia una saggezza amara, da uomo che non si fa illusioni."
  - tutor: "«Non un rimedio, ma una postura»: la formula è sua e gliela invidio. Ha colto anche che il prodigio è raro, un'eccezione concessa e non conquistata. Ci fermiamo qui: giovedì leggeremo «Meriggiare pallido e assorto», e ritroverà quello stesso mezzogiorno."
    goals: [meaning]

- scenario: poesia-montale
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una specie di stupore, professoressa. In Spagna a scuola ci fanno leggere Machado, che il dolore lo canta; qui invece lo si constata, come farebbe un medico. Otto versi e nemmeno un punto esclamativo."
  - tutor: "Il confronto con Machado è prezioso, lo tenga da parte. Montale diffida del canto: preferisce l'elenco, la cosa nuda. Fra le cose che elenca, ce n'è una davanti alla quale si è fermata più a lungo?"
    goals: [first-reading]
  - learner: "Sì, davanti alla statua. Mi incuriosisce che, per dire il bene, scelga un oggetto di pietra, immobile «nella sonnolenza del meriggio». Come se star bene volesse dire, in fondo, non essere più del tutto vivi."
  - tutor: "Ha toccato il nervo della poesia: la statua non soffre perché non sente, e Montale lo sa benissimo. Ora mi dica della forma. Come sono costruite queste due quartine, e che effetto le fa sentirle una dopo l'altra?"
    goals: [image]
  - learner: "Sono speculari: ognuna si apre con una dichiarazione e poi offre tre esempi, tre per il male e tre per il bene. Solo che le rime della prima sono chiuse, incrociate, mentre nella seconda l'ultimo verso si allunga e sfugge alla misura, quasi che il falco se lo portasse via."
  - tutor: "Analisi da manuale, e le aggiungo un dettaglio che le piacerà: quell'ultimo verso, pur sfuggendo alla misura, rima con «incontrato» e «stramazzato». Il falco sale, ma la rima lo riporta al male. Come cambia, alla luce di questo, la sua lettura complessiva?"
    goals: [sound]
  - learner: "La rende più cupa. Pensavo che la seconda strofa fosse una via d'uscita, e invece è un'evasione sorvegliata: per quanto in alto si salga, il suono ci ricorda da dove siamo partiti. Direi che la poesia non oppone il bene al male, ma mostra che il bene è soltanto la distanza dal male."
  - tutor: "«Un'evasione sorvegliata»: non l'avevo mai sentita dire così, e regge perfettamente. Lei è partita da Machado ed è arrivata a una lettura tutta sua, che è quanto chiedo a questo corso. Per giovedì, se vuole, porti una poesia di Machado da mettere accanto a questa."
    goals: [meaning]

- scenario: circolo-lettura
  level: C2
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Insopportabile no, ma testardo come un mulo, quello sì. A me però il romanzo è piaciuto proprio per questo: parte da un piatto di lumache rifiutato a tavola e ne fa una vita intera. C'è qualcosa di comico e di serissimo insieme."
  - tutor: "Le lumache come atto fondativo, d'accordo. Ma dimmi di che cosa parla davvero, secondo te, questa vita sugli alberi: e portami un passo del libro, non un'impressione."
    goals: [impression]
  - learner: "Parla della distanza giusta. Cosimo non scappa nel bosco a fare l'eremita: dagli alberi legge, organizza i contadini contro gli incendi, scrive ai filosofi. Se sarebbe sceso, avrebbe visto meno, non di più. Sta in alto per guardare meglio la terra."
    errors: [hypothetical]
  - tutor: "L'episodio degli incendi è l'esempio che volevo, bravo: l'uomo più isolato è anche il più utile agli altri. Un attimo, però: «Se sarebbe sceso»? Dopo quel «se» il condizionale non ci può stare. Riprova, che la frase merita."
    goals: [theme]
    prompt: {text: "Se sarebbe sceso", tags: [hypothetical]}
  - learner: "Se fosse sceso, avrebbe visto meno. A casa dei miei nonni il congiuntivo lo si saltava volentieri, e mi è rimasto nell'orecchio. Quanto allo stile, quello che mi incanta è il narratore: Biagio, il fratello rimasto a terra, che racconta con affetto e con un filo di invidia."
  - tutor: "Perfetto. E su Biagio hai ragione: è l'ironia di chi è rimasto a terra a tenere leggero il libro. Io però resto della mia idea: Cosimo è un egoista di lusso, uno che pianta la famiglia per un capriccio e lo chiama coerenza."
    goals: [style]
  - learner: "Non sono d'accordo, e te lo dico con tutto il rispetto per i tuoi capelli bianchi. Un egoista non si sarebbe dato tanta pena per gli altri. E poi il prezzo lo paga lui: perde Viola proprio perché non scende. Calvino non lo assolve, gli fa pagare il conto."
  - tutor: "Viola è un colpo basso, e purtroppo va a segno: lì la coerenza gli costa cara, lo ammetto. Mi tengo metà della mia tesi e ti cedo l'altra. Allora, visto che oggi comandi tu, che cosa leggiamo il mese prossimo?"
    goals: [disagree]
  - learner: "Proporrei «Il giorno della civetta» di Sciascia. È breve, così nessuno ha scuse, e dopo un barone che guarda il mondo dall'alto mi piacerebbe un capitano che ci sbatte contro dal basso."
  - tutor: "Dall'albero alla Sicilia, dall'allegoria al giallo civile: il salto mi piace, e la motivazione ancora di più. Aggiudicato Sciascia. Ora versami un altro bicchiere, che perdere una discussione mette sete."
    goals: [recommend]

- scenario: circolo-lettura
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io, e non me ne vergogno. Per metà libro l'ho trovato un ragazzino viziato che fa pagare a tutti il suo puntiglio. Poi, però, mi sono accorta che Calvino lo sa benissimo, e da lì il romanzo mi ha conquistata."
  - tutor: "Finalmente un'alleata, anche se a metà! E che cosa ti ha fatto cambiare idea? Voglio una scena precisa, altrimenti penso che tu l'abbia perdonato solo per buona educazione."
    goals: [impression]
  - learner: "Il momento in cui capisci che le regole se le dà da solo. Nessuno lo obbliga a restare sugli alberi, eppure non mette mai piede a terra, nemmeno quando gli converrebbe. È lì il tema, per me: la ribellione vale qualcosa solo se chi si ribella è più severo con sé stesso di quanto lo fosse suo padre con lui."
  - tutor: "Una ribellione con più disciplina dell'obbedienza: da insegnante a insegnante, è un'idea che avrei voluto avere io. E la lingua di Calvino, come ti è parsa? C'è chi la trova fin troppo limpida."
    goals: [theme]
  - learner: "Limpida sì, ma non ingenua. Mi ha colpita come riesca a dire cose gravi senza mai alzare la voce: la morte del padre, la follia di Viola, tutto scivola via con una leggerezza che non è superficialità. È un'ironia che non ferisce nessuno e non risparmia nessuno."
  - tutor: "Ben detto. Eppure ti provoco: tolta la leggerezza, che cosa resta? Un'allegoria dell'intellettuale che guarda la storia dal ramo e non si sporca le mani. A me, oggi, pare una favola consolatoria."
    goals: [style]
  - learner: "Qui non ti seguo. Se fosse una favola consolatoria finirebbe bene, e invece Cosimo invecchia solo, la Rivoluzione lo delude e lui sparisce aggrappato a una mongolfiera. Calvino non celebra la distanza: ne mostra il costo. Chiamarla consolazione mi sembra far torto al finale."
  - tutor: "Il finale, già: su quella mongolfiera la mia tesi vacilla. Te la do vinta, ma solo perché hai citato il testo. A questo punto scegli tu il prossimo libro, e fammi capire perché."
    goals: [disagree]
  - learner: "Vorrei «Lessico famigliare» della Ginzburg. Dopo un figlio che scappa dalla famiglia salendo su un albero, mi piacerebbe leggere di una figlia che la famiglia la salva ricordandone le parole. E poi anche lì si ride molto, a denti stretti."
  - tutor: "Dalla fuga alla memoria, e sempre con l'ironia di mezzo: è una scelta che fa dialogare i due libri, e per un circolo non c'è di meglio. Vada per la Ginzburg, allora."
    goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Ce l'ho fatta, ma per un pelo: l'ultimo capitolo l'ho letto stamattina sul tram. Mi è piaciuto più di quanto pensassi. All'inizio temevo il solito polpettone sul dopoguerra, e invece è una storia di soldi, di terra e di gente che non si perdona niente."
  - tutor: "«Gente che non si perdona niente» è il riassunto più onesto che abbia sentito. E tra tutti questi rancorosi, chi ti ha dato più da pensare?"
    goals: [impression]
  - learner: "Ettore, il padre. Vende la vigna di nascosto per pagare gli studi al figlio minore, e non lo dice a nessuno per vent'anni. Credo che l'autrice ha voluto farne un personaggio ambiguo apposta: non capisci mai se è generoso o soltanto orgoglioso."
    errors: [subjunctive-use]
  - tutor: "Generoso e orgoglioso insieme, direi, ed è per questo che funziona. Aspetta, però: «Credo che l'autrice ha voluto»? Dopo «credo che» il verbo chiede un altro modo. Come la diresti?"
    goals: [character]
    prompt: {text: "Credo che l'autrice ha voluto", tags: [subjunctive-use]}
  - learner: "Ah, giusto. Credo che l'autrice voleva farne un personaggio ambiguo. No, aspetta, non mi suona nemmeno così."
    errors: [subjunctive-use]
  - tutor: "Ci eri quasi: credo che l'autrice abbia voluto farne un personaggio ambiguo, e ci è riuscita in pieno. Se Ettore avesse parlato subito, i figli lo avrebbero capito? Io temo di no. Dimmi invece della scrittura: ti ha convinta?"
    recast: {text: "Credo che l'autrice voleva", fix: "credo che l'autrice abbia voluto", tags: [subjunctive-use]}
  - learner: "Abbia voluto, certo. La scrittura sì, mi ha convinta, soprattutto per come usa il dialetto: mai una frase intera, solo una parola qua e là, quanto basta per sentire la cucina. I capitoli brevi poi aiutano. L'unica cosa che non mi è andata giù è il narratore che ogni tanto anticipa le disgrazie."
  - tutor: "Quelle anticipazioni dividono anche noi: per me creano attesa, per altri rovinano la sorpresa. Sul dialetto dosato col contagocce, invece, siamo tutti d'accordo. A chi lo daresti da leggere, e a chi proprio no?"
    goals: [style]
  - learner: "Lo darei a mio padre, che è cresciuto in una fattoria e di silenzi in famiglia se ne intende. Non lo consiglierei a chi cerca una trama veloce: qui per duecento pagine succede pochissimo, e quel poco succede a tavola."
  - tutor: "A tavola, come in ogni famiglia italiana che si rispetti. Regalalo a tuo padre, allora, e poi raccontami se si è riconosciuto in Ettore. Alla prossima!"
    goals: [recommend]

- scenario: club-lettura
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Finito, sì, anche se non ti nascondo che a metà ho avuto la tentazione di mollarlo. Non è brutto, per carità, ma l'ho trovato prevedibile: appena compare il cugino tornato dalla prigionia, capisci già come andrà a finire."
  - tutor: "Prevedibile! E io che ci ho pianto sopra. Va bene, ti ascolto, ma voglio le prove: c'è almeno un personaggio che ti abbia sorpreso, o li butti tutti dalla finestra?"
    goals: [impression]
  - learner: "Una sola, Ines. Tutti si aspettano che sposi il farmacista e resti in paese, e lei invece parte per il Belgio con un contratto da operaia. Quello che mi ha colpito è che non parte per amore né per fame: parte perché non sopporta più di essere guardata. Avrebbe potuto restare e stare comoda, e ha scelto la fatica."
  - tutor: "Vedi che qualcosa ti è piaciuto? Ines che parte per non essere più guardata è, per me, la pagina più bella. E dello stile che mi dici? Non venirmi a raccontare che è prevedibile anche quello."
    goals: [character]
  - learner: "No, lo stile gliel'ho invidiato. Scrive frasi lunghe che non perdono mai il filo, e ha un orecchio straordinario per come parla la gente quando non vuole dire le cose. Però l'ambientazione è da cartolina: troppi tramonti sulle colline, troppo pane appena sfornato."
  - tutor: "Sul pane appena sfornato ti do ragione, ce n'è da sfamare un reggimento. Ma le frasi lunghe che non perdono il filo sono merce rara, tienilo a mente. Insomma: lo consiglieresti o no?"
    goals: [style]
  - learner: "A mia madre sì, senza esitare: lei adora le storie in cui alla fine ogni cosa torna al suo posto. A un amico che legge poco no, perché gli confermerebbe l'idea che i romanzi italiani parlino solo di nonne e di guerra."
  - tutor: "Nonne e guerra: ci hai messi in fila tutti in tre parole, e la cosa peggiore è che non hai tutti i torti. Il mese prossimo, allora, porta tu un romanzo italiano senza nonne. Ti sfido."
    goals: [recommend]

# C2: la vita in azienda (aumenti, colloqui, riunioni, mediazioni, lavoro da casa).
- scenario: colloquio-promozione
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Vorrei parlare della mia posizione, e ho preferito chiederle un incontro piuttosto che accennarne in corridoio. Comincio da ciò che ho fatto: quest'anno ho riorganizzato il servizio di assistenza, i tempi di risposta sono passati da quattro giorni a uno, e le disdette dei clienti sono calate del venti per cento."
  - tutor: "Sono numeri che conosco e che apprezzo; il calo delle disdette, in particolare, l'ha notato anche l'amministratore. Immagino che ci sia un seguito."
    goals: [results]
  - learner: "C'è. Ritengo che questi risultati giustifichino un adeguamento della retribuzione. Sono stata assunta tre anni fa con uno stipendio pensato per un ruolo esecutivo; oggi gestisco un servizio e sei persone. Le chiedo un aumento del dodici per cento, che mi riporterebbe in linea con i colleghi di pari responsabilità."
  - tutor: "La richiesta è chiara e non è irragionevole. Devo però dirle che, se la accogliessi, domani avrei la fila fuori dalla porta: gli altri responsabili chiederebbero lo stesso, e non tutti con i suoi numeri."
    goals: [request]
  - learner: "Capisco la preoccupazione, ma mi permetta di vederla al contrario. Se l'aumento è legato a risultati misurabili, la fila non è un problema: chi porta numeri analoghi lo merita, chi non li porta ha una risposta chiara. Il rischio vero, mi pare, è che passi l'idea che ottenere risultati o non ottenerli sia indifferente."
  - tutor: "Legare l'aumento a risultati misurabili mi darebbe in effetti un criterio da opporre agli altri, anziché un precedente da temere. Il dodici per cento in un'unica soluzione, tuttavia, non lo ottengo. Come vogliamo procedere?"
    goals: [handle]
  - learner: "Sono disposta a ragionare sui tempi, non sul principio. Potremmo fare un sette per cento da subito e il resto a gennaio, a condizione che le disdette restino sotto la soglia attuale. Le chiederei soltanto che l'accordo fosse scritto, e di rivederci a dicembre con i dati."
  - tutor: "Sette subito, cinque a gennaio se le disdette tengono, e verifica a dicembre: lo porto in direzione questa settimana con parere favorevole. Le faccio avere la risposta scritta entro venerdì. Ha preparato bene questo incontro, e si vede."
    goals: [next-steps]

- scenario: colloquio-lavoro
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, e grazie dell'invito. Mi chiamo Hannah Reid, sono australiana e vivo a Milano da sei anni. Mi occupo di strategia di marca: negli ultimi quattro anni ho guidato il marketing di un'azienda di arredamento, dopo una prima esperienza in agenzia a Sydney."
  - tutor: "Benvenuta. Un italiano così, dopo sei anni, non è da tutti. Mi racconti di questi quattro anni nell'arredamento: di che cosa si occupava, concretamente?"
    goals: [intro]
  - learner: "All'inizio eravamo in due e facevamo di tutto, dal catalogo alle fiere. Poi l'azienda è cresciuta e ho costruito una squadra di cinque persone. Il progetto di cui vado più fiera è il rilancio di una linea di sedie che non si vendeva più: abbiamo cambiato il racconto, non il prodotto, e in diciotto mesi il fatturato di quella linea è raddoppiato."
  - tutor: "Cambiare il racconto e non il prodotto: è una frase che in uno studio di design suona bene. Passiamo a lei, ora. Quali considera i suoi punti di forza, e dove invece sa di dover migliorare?"
    goals: [experience]
  - learner: "Il mio punto di forza è che so ascoltare i progettisti e tradurre le loro idee per chi deve comprare. E sono una persona confidente: non ho paura di difendere una proposta davanti a un cliente difficile. Il punto debole è la delega. Tendo a rivedere tutto di persona, e la squadra a volte lo vive come sfiducia; ci sto lavorando."
    errors: [false-friend]
  - tutor: "Una persona sicura di sé che ammette di delegare male: la combinazione è credibile, e apprezzo la sincerità. Piccola nota tra noi: «confidente», in italiano, è l'amico a cui si raccontano i segreti. Perché proprio il nostro studio?"
    goals: [strengths]
    recast: {text: "una persona confidente", fix: "una persona sicura di sé", tags: [false-friend]}
  - learner: "Sicura di sé, grazie: è un falso amico che mi perseguita. Il vostro studio perché siete piccoli e fate cose che durano. Ho seguito il progetto delle lampade per la biblioteca di Bergamo e mi è piaciuto che non l'abbiate raccontato quasi a nessuno. Credo che abbiate un lavoro migliore della vostra visibilità, ed è esattamente il tipo di distanza che so colmare."
  - tutor: "«Un lavoro migliore della visibilità»: è la diagnosi che facciamo anche noi, con meno eleganza. Ha qualche domanda sul ruolo, prima che le presenti i soci?"
    goals: [why]
  - learner: "Una, sì. A chi risponderei direttamente, e quanta libertà avrei nel decidere che cosa non comunicare? Perché nella mia esperienza la parte più difficile non è promuovere un progetto, ma convincere tutti che certi lavori è meglio non mostrarli."
  - tutor: "Domanda rara, e molto giusta. Risponderebbe ai due soci, e sulla selezione dei progetti avrebbe l'ultima parola, salvo veto motivato. Venga, glieli presento: credo che avrete parecchio da dirvi."
    goals: [questions]

- scenario: colloquio-lavoro
  level: C2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Robert Hayes, sono un ingegnere meccanico e, lo dico subito, ho sessantasette anni. Per trent'anni lavoravo nella stessa azienda in Ohio, dove progettavamo componenti per elettrodomestici. Da tre anni vivo a Lucca e cerco un incarico a tempo parziale, non una carriera."
    errors: [tense-aspect]
  - tutor: "Benvenuto, ingegnere, e grazie della franchezza sull'età: qui conta quello che uno sa fare. Una curiosità linguistica, prima di proseguire: «per trent'anni lavoravo»? Con una durata conclusa e precisa, che tempo si aspetterebbe un italiano?"
    goals: [intro]
    prompt: {text: "Per trent'anni lavoravo", tags: [tense-aspect]}
  - learner: "Il passato prossimo: per trent'anni ho lavorato nella stessa azienda. L'imperfetto mi tradisce ancora, quando racconto. In quegli anni sono passato dal tavolo da disegno alla direzione tecnica: gli ultimi dieci li ho trascorsi a far dialogare progettisti e fabbrica, che è un mestiere a sé."
  - tutor: "Esatto, «ho lavorato». E far dialogare progettisti e fabbrica è proprio ciò che a noi manca: disegniamo oggetti bellissimi che poi costano il doppio da produrre. In che cosa si sente forte, e in che cosa meno?"
    goals: [experience]
  - learner: "Sono forte nel capire presto se un oggetto si può fabbricare, e a che prezzo: di solito mi basta guardare lo spessore e gli angoli. E ho pazienza con i giovani. Il mio limite è la velocità: con i programmi di oggi sono più lento di un neolaureato, e non fingo il contrario. Compenso sbagliando meno."
  - tutor: "Più lento ma con meno errori: in produzione è uno scambio che firmerei subito. Mi dica però perché un ingegnere con la sua storia vorrebbe lavorare in uno studio di dodici persone."
    goals: [strengths]
  - learner: "Perché in una grande azienda si vede un pezzo, e qui si vede l'oggetto intero, dall'idea alla scatola. E perché, a essere sincero, la pensione mi annoia. Ho visto la vostra caffettiera alla fiera di Milano: bella, ma con un manico che in fabbrica deve aver fatto imprecare qualcuno. Mi piacerebbe arrivare un passo prima di quel momento."
  - tutor: "Il manico ha fatto imprecare parecchie persone, glielo confermo. Arrivare un passo prima è esattamente il ruolo che abbiamo in mente. Ha domande per noi?"
    goals: [why]
  - learner: "Una sola. Quando un progettista e io non saremo d'accordo, e succederà, chi decide? Non lo chiedo per avere l'ultima parola, ma per sapere fin dall'inizio come si discute qui dentro."
  - tutor: "Decide il responsabile del progetto, dopo avervi ascoltati entrambi, e le discussioni qui sono vivaci ma leali. Mi sembra che ci siamo capiti, ingegnere. La richiamo entro la settimana per parlare di giorni e compenso."
    goals: [questions]

- scenario: riunione-lavoro
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Va avanti, anche se non veloce come vorrei. La nuova versione del sito è pronta all'ottanta per cento: le pagine dei prodotti sono finite, il catalogo è caricato, e ieri abbiamo fatto le prime prove sul telefono. Mancano i testi in inglese e la parte dei pagamenti."
  - tutor: "Ottanta per cento è più di quanto sperassi, brava. Ma ti conosco: quando dici «non veloce come vorrei» c'è sotto qualcosa. Che cosa ti preoccupa?"
    goals: [update]
  - learner: "I testi. Il cliente doveva mandarci le descrizioni definitive due settimane fa e ne è arrivata la metà, piena di correzioni a mano. Senza quelle non posso far partire la traduzione. Gli ho scritto tre volte; l'ultima mi ha risposto che è in fiera e che ci penserà al ritorno. Il ritardo, se lo dico chiaro al cliente, magari si sveglia."
    errors: [combined-pronouns]
  - tutor: "Il classico: loro ritardano e poi la colpa è nostra. Aspetta, però, mi sono persa un pezzo: «se lo dico chiaro al cliente»? In italiano quei due pronomi, insieme, prendono un'altra forma."
    goals: [problem]
    prompt: {text: "se lo dico chiaro", tags: [combined-pronouns]}
  - learner: "Glielo dico chiaro, hai ragione: lo spagnolo «se lo» mi insegue. Comunque la mia proposta sarebbe questa: invece di aspettare tutto, pubblichiamo il sito in italiano alla data prevista e aggiungiamo l'inglese in un secondo momento. Nel frattempo potrei far tradurre la metà che abbiamo, così non perdiamo tempo."
  - tutor: "Esatto, glielo dici tu, e io ti copro le spalle se protesta. L'idea delle due fasi mi piace: salva la data e mette il ritardo dove deve stare, cioè a casa loro. Per quando ce la faresti?"
    goals: [proposal]
  - learner: "L'italiano sarà in linea venerdì ventuno, come promesso. Per l'inglese mi servirebbero dieci giorni lavorativi a partire da quando ricevo i testi completi: se arrivano lunedì, chiuderemmo entro il quattro del mese prossimo. Lo metto per iscritto nella mail, così la scadenza dipende anche da loro."
  - tutor: "Perfetto: italiano il ventuno, inglese dieci giorni dopo i testi, tutto scritto. Mandami la mail in copia prima di spedirla. Ottimo lavoro, e la prossima volta dimmelo subito quando un cliente sparisce."
    goals: [deadline]

- scenario: riunione-lavoro
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene nel complesso, con un punto interrogativo. La migrazione dei dati dal vecchio gestionale è finita mercoledì: quarantamila schede cliente trasferite, e i controlli a campione tornano. Da lunedì il reparto vendite lavora già sul sistema nuovo, e per ora nessuno si è lamentato, il che per i venditori è un record."
  - tutor: "Un record davvero, di solito si lamentano prima ancora di accendere il computer. E il punto interrogativo?"
    goals: [update]
  - learner: "Sono le fatture vecchie. Il sistema nuovo legge male quelle di prima del 2019: circa tremila documenti in cui gli importi compaiono senza IVA. Non è un disastro, perché sono archiviate e non servono tutti i giorni, ma se arrivasse un controllo fiscale ci troveremmo con numeri che non tornano. Preferisco dirtelo adesso che scoprirlo a marzo."
  - tutor: "Hai fatto bene, queste sono le cose che esplodono sei mesi dopo. Hai già in mente come uscirne, o ci dobbiamo ragionare insieme?"
    goals: [problem]
  - learner: "Un'idea ce l'avrei. Correggerle a mano è impensabile; però l'errore è sempre lo stesso, quindi basterebbe un piccolo programma che ricalcoli gli importi. Potrei scriverlo io, ma mi ci vorrebbero due settimane e fermerei tutto il resto. In alternativa chiederei una giornata di consulenza al fornitore: costerebbe sugli ottocento euro, ma loro il formato lo conoscono a memoria."
  - tutor: "Ottocento euro contro due settimane tue? Non c'è partita, chiamiamo il fornitore. Il budget lo trovo io. Quando pensi di poter chiudere la faccenda?"
    goals: [proposal]
  - learner: "Se il fornitore ci dà una data entro questa settimana, direi che per fine mese sarà tutto a posto: un giorno per la correzione, due per i controlli, e mi tengo un margine perché non mi fido mai. Diciamo il trenta, e venerdì prossimo ti aggiorno su come stiamo."
  - tutor: "Il trenta, con aggiornamento venerdì: segnato. E quel margine tienitelo stretto, che è la cosa più saggia che ho sentito oggi. Grazie, passiamo al prossimo punto."
    goals: [deadline]

- scenario: mediazione-colleghi
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Non mi disturba affatto, anzi: si accomodi e chiuda pure la porta. Ho visto che ieri è uscita dalla riunione scura in volto, e avrei voluto cercarla io. Mi racconti con calma che cosa è successo, dal suo punto di vista."
  - tutor: "È successo che Marco ha presentato l'analisi dei costi come se fosse sua. Tre settimane di lavoro mio, le tabelle le ho fatte io di sera, e lui ha detto «ho pensato», «ho verificato». Io ero lì seduta e nessuno mi ha nemmeno guardata."
  - learner: "Capisco che le sia rimasto sullo stomaco: vedere il proprio lavoro presentato da un altro, senza una parola di riconoscimento, ferirebbe chiunque. E mi dispiace non essermene accorta sul momento. Posso farle un paio di domande per capire meglio? Prima della riunione vi eravate messi d'accordo su chi avrebbe presentato?"
  - tutor: "Sì, questo sì: avevamo deciso che parlasse lui, perché io davanti ai dirigenti mi blocco. Ma un conto è presentare, un conto è far credere di aver fatto tutto da solo."
    goals: [listen]
  - learner: "È una distinzione giusta, e la tengo presente. Un'ultima cosa: nelle diapositive compariva il suo nome? E lui le ha detto qualcosa, dopo?"
  - tutor: "Il mio nome c'era, in piccolo, nell'ultima diapositiva, quella che non guarda nessuno. E dopo mi ha detto solo «è andata bene, no?», tutto contento. Non credo nemmeno che se ne sia reso conto."
    goals: [clarify]
  - learner: "Ecco, questo mi pare importante. Non voglio giustificarlo, ma può darsi che Marco, preso dall'agitazione, abbia parlato in prima persona senza pensarci, come si fa quando si ha paura di perdere il filo. Che non l'abbia fatto apposta non cancella il torto che Lei ha subito; cambia però il modo in cui conviene affrontarlo."
  - tutor: "Può essere che non l'abbia fatto apposta, lo ammetto. È uno che parla prima di pensare. Ma il risultato è che la direzione crede che l'analisi sia sua, e a me questo non sta bene."
    goals: [perspective]
  - learner: "Ha ragione, e a questo si rimedia. Le propongo due cose. Oggi stesso scrivo alla direzione per mandare il documento completo, indicando chiaramente che l'analisi è sua. E vorrei che ne parlaste voi due, con me presente se preferisce, perché Marco sappia l'effetto che ha avuto. Per il futuro, stabiliamo che chi presenta nomina sempre chi ha fatto il lavoro, all'inizio e non in fondo."
  - tutor: "La mail alla direzione mi toglie un peso, davvero. E con Marco ci parlo, ma preferisco che ci sia anche lei, almeno la prima volta. Grazie di avermi ascoltata senza dirmi che esageravo."
    goals: [solution]

- scenario: mediazione-colleghi
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Nessun disturbo, entri. Ieri l'ho vista lasciare la riunione senza dire una parola, e non è da Lei. Si sieda e mi dica tutto, senza fretta: il servizio comincia tra un'ora."
  - tutor: "Il risotto al limone bruciato. L'idea era mia e di Paolo, ci abbiamo lavorato insieme per un mese dopo la chiusura. Ieri, davanti al proprietario, lui ha detto «il mio risotto». Il mio. E io zitta, come una stupida."
  - learner: "Non come una stupida: come una persona corretta che non ha voluto fare una scenata davanti al proprietario. Capisco la rabbia, un mese di lavoro non è poco. Mi aiuti a ricostruire: chi ha avuto la prima idea, e chi ha fatto che cosa durante le prove?"
  - tutor: "L'idea del limone bruciato è stata mia, l'ho portata da un viaggio in Sicilia. Paolo ha messo a punto la cottura, questo glielo riconosco. Ma senza il limone quel piatto è un risotto qualunque."
    goals: [listen]
  - learner: "Quindi un piatto a quattro mani, in cui ciascuno ha messo una parte essenziale. E ieri, prima della riunione, avevate parlato di come presentarlo? Paolo sapeva che Lei ci teneva a essere nominata?"
  - tutor: "No, non ne avevamo parlato. Davo per scontato che avrebbe detto «il nostro». Forse ho sbagliato a darlo per scontato, ma mi sembrava il minimo."
    goals: [clarify]
  - learner: "Era il minimo, sono d'accordo. Però conosco Paolo da otto anni: è orgoglioso, parla troppo, ma non credo che l'ha fatto con cattiveria. Quando è nervoso davanti al proprietario dice «mio» anche del forno. Questo non lo scusa, sia chiaro; spiega soltanto perché non se n'è accorto."
    errors: [subjunctive-use]
  - tutor: "Anche del forno, è vero, l'ho sentito anch'io. Mi scusi se glielo faccio notare proprio oggi, ma è stato lei a chiedermi di correggerla: «non credo che l'ha fatto»? Dopo «non credo che» serve un altro modo."
    goals: [perspective]
    prompt: {text: "non credo che l'ha fatto", tags: [subjunctive-use]}
  - learner: "Non credo che l'abbia fatto con cattiveria: grazie, continui a correggermi. Ora la parte che conta. Stasera il risotto va in carta, e sul menù ci saranno i vostri due nomi, lo scrivo io. Prima del servizio parlo con Paolo e poi vi sedete insieme cinque minuti. E d'ora in poi ogni piatto nuovo si presenta con i nomi di chi ci ha lavorato."
  - tutor: "Così, sì. I due nomi sul menù valgono più di qualunque scusa, e con Paolo ci parlo volentieri, se comincia lei. Grazie: torno in cucina, che i limoni non si bruciano da soli."
    goals: [solution]

- scenario: smartworking
  level: C2
  persona: en-m-heritage
  history: [reflexive]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Metà e metà, ormai da due anni. Lunedì e venerdì da casa, gli altri tre giorni in ufficio a Sesto. All'inizio era un'emergenza, poi l'azienda si è accorta che risparmiava sulle scrivanie e ha deciso che ci piaceva."
  - tutor: "Ha deciso che vi piaceva: tipico. E a te piace davvero, o fai buon viso a cattivo gioco? Io sono tornato in ufficio cinque giorni su cinque e certe mattine vi invidio."
    goals: [situation]
  - learner: "Mi piace più di quanto pensassi. Il vantaggio grosso è il tempo: risparmio un'ora e mezza di metropolitana al giorno, e la uso per portare mia figlia a scuola. E poi a casa concentro molto meglio: in ufficio c'è sempre qualcuno che ti chiede «hai un minuto?», e quel minuto dura mezz'ora."
    errors: [reflexive]
  - tutor: "Il famoso minuto di mezz'ora, lo conosco bene. E portare la bambina a scuola vale da solo il prezzo del biglietto. Senti, ma «a casa concentro molto meglio»? A quel verbo manca un pezzetto, pensaci."
    goals: [pros]
    prompt: {text: "concentro molto meglio", tags: [reflexive]}
  - learner: "Mi concentro, giusto, è riflessivo. Però non è tutto rose e fiori, eh. Il venerdì sera mi accorgo che non ho parlato con un adulto dal mattino. E per chi è appena arrivato è peggio: i ragazzi nuovi non imparano niente, perché le cose vere si imparano ascoltando le telefonate degli altri, non nelle riunioni a distanza."
  - tutor: "Ecco, così. E quella dei ragazzi nuovi è un'osservazione che i capi dovrebbero appendersi al muro: il mestiere si ruba con gli occhi e con le orecchie. Ma se domani ti facessero scegliere liberamente, che cosa faresti?"
    goals: [cons]
  - learner: "Terrei esattamente questo equilibrio, forse con un giorno in più a casa d'inverno. Tutto da casa no: diventerei un orso. Tutto in ufficio nemmeno: tornerei a vedere mia figlia solo a cena. Più che il posto, vorrei poter scegliere io i giorni, secondo quello che ho da fare, invece di averli fissi."
  - tutor: "Scegliere i giorni in base al lavoro e non al calendario: sarebbe la soluzione più ragionevole, e infatti non la adotta quasi nessuno. Fortunato te, comunque. Dai, prendiamo un altro bicchiere, che io domani mattina ho un'ora di traffico."
    goals: [preference]

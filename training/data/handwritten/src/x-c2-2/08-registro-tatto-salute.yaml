# C2: tatto e registro: cene in famiglia, visite di cordoglio, lettere al Rettore, visite specialistiche.
- scenario: cena-suoceri
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Grazie, è molto gentile. Le confesso che anch'io, salendo le scale, mi chiedevo se sarei stato all'altezza del racconto. E complimenti per la casa: da quella finestra si vede la cupola, ed è uno spettacolo. Il profumo che arriva dalla cucina, poi, mi ha già conquistato."
  - tutor: "Il profumo è tutto merito di mia moglie; io mi limito a raccogliere i complimenti. La cupola, invece, è l'unica cosa di questa casa che non abbiamo dovuto restaurare. Mi dica: di che cosa si occupa, esattamente? Mia figlia è stata piuttosto vaga."
    goals: [compliment]
  - learner: "Sono ingegnere, mi occupo di restauro strutturale: consolido edifici storici perché non crollino al primo terremoto. Sono arrivato a Firenze per un cantiere a Santa Croce, e di sua figlia mi sono innamorato in biblioteca, mentre lei studiava e io fingevo di farlo. Se vuole, gli lo racconto nei dettagli, ma rischio di annoiarla."
    errors: [combined-pronouns]
  - tutor: "Nei dettagli? Con piacere, ma dopo il dolce. Prima, però, mi ripeta quel «gli lo racconto»: quando due pronomi si incontrano, in italiano, si fondono in un modo particolare."
    goals: [background]
    prompt: {text: "gli lo racconto", tags: [combined-pronouns]}
  - learner: "Glielo racconto, tutto attaccato: me lo ricorda sempre anche sua figlia. Prometto, comunque: solo dopo il dolce."
  - tutor: "Glielo, appunto: vedo che è in buone mani. Restauro strutturale, dunque: il mestiere ideale per entrare in questa famiglia, dove le fondamenta scricchiolano da secoli. Spero che non sia venuto a consolidare anche noi."
  - learner: "Se posso permettermi, per le famiglie fiorentine i preventivi li faccio solo dopo un'attenta perizia, e per ora vedo strutture solidissime. Al massimo qualche crepa d'ironia, ma quella, mi dicono, è un elemento originale e va conservato."
  - tutor: "Ha la risposta pronta, e in casa nostra questo è un titolo di merito. Senta, a questo punto mi sembra ridicolo continuare con il Lei: ci diamo del tu? Io sono Giorgio."
    goals: [irony]
  - learner: "Con molto piacere, Giorgio, e grazie: lo prendo come un complimento. Però ti avverto: per il primo bicchiere mi verrà ancora spontaneo darti del Lei, mia madre mi ha educato così."
  - tutor: "Allora brindiamo subito, così il primo bicchiere passa in fretta. Alla tua salute, e benvenuto in famiglia: crepe originali comprese."
    goals: [tu-lei]

- scenario: cena-suoceri
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda pure. Mio figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Esisto, glielo garantisco, anche se capisco il sospetto: Matteo racconta tutto con molta fantasia. La ringrazio dell'accoglienza. Che bella tavola: mia nonna, a Siviglia, diceva che una famiglia si capisce da come apparecchia, e qui si capisce che amate le cose fatte bene."
  - tutor: "Sua nonna aveva l'occhio lungo. La tavola l'ha apparecchiata mia moglie, il vino l'ho scelto io: così, se qualcosa non va, sa già chi accusare. Matteo dice che Lei insegna: dove, e che cosa?"
    goals: [compliment]
  - learner: "Insegno spagnolo in un liceo linguistico di Prato. Mi piace molto, anche se i ragazzi di sedici anni sono un pubblico difficile. L'anno prossimo vorrei fare il concorso per entrare di ruolo: se lo vincessi, potrei restare in Toscana senza ricominciare da capo ogni settembre."
  - tutor: "Un liceo linguistico: che coraggio. Quindi Lei passa le giornate a insegnare una lingua straniera ai toscani, impresa titanica, visto che noi facciamo fatica già ad accettare l'italiano degli altri."
    goals: [background]
  - learner: "Le assicuro che i toscani sono alunni bravissimi, a condizione che nessuno gli dice che sbagliano. Il segreto è far credere loro che l'errore sia del libro."
    errors: [subjunctive-use]
  - tutor: "Colpito e affondato, e con eleganza. Ma da vecchio studente a insegnante, mi conceda una pignoleria: «a condizione che nessuno gli dice»... dopo a condizione che, quel verbo può davvero restare così?"
    goals: [irony]
    prompt: {text: "a condizione che nessuno gli dice", tags: [subjunctive-use]}
  - learner: "No, ha ragione: a condizione che nessuno gli dica che sbagliano. Vede? Funziona anche con me: mi correggono e mi offendo subito."
  - tutor: "Gli dica, bravissima; e il metodo del libro colpevole lo adotterò con i miei nipoti. Senta, mi sembra ormai assurdo continuare con il Lei, a meno che non preferisca così: ci diamo del tu?"
  - learner: "Volentieri, grazie. E allora, visto che siamo passati al tu: me lo passi, il vino che hai scelto? Voglio vedere se è all'altezza della tavola."
  - tutor: "Eccolo, e giudica pure con severità: in questa casa le critiche sono ammesse, purché argomentate. Benvenuta, cara. Alla salute!"
    goals: [tu-lei]

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
  - learner: "Ci mancherebbe, il lavoro può aspettare. Sono venuto per esserle vicino, e per portarle le condoglianze di tutto l'ufficio. Mi dispiace moltissimo per la sua mamma."
  - tutor: "Grazie, le ricevo con il cuore. Se n'è andata nel sonno, a novantun anni, senza soffrire: ce lo ripetiamo tutti, come se servisse a qualcosa. Si sieda, la prego. Un caffè lo prende?"
    goals: [condolences]
  - learner: "Volentieri, grazie. Sa, io la sua mamma l'ho conosciuta una volta sola, alla festa per i suoi trent'anni di servizio, ma me la ricordo benissimo: è stata l'unica a chiedermi se avessi mangiato abbastanza. E parlava di Lei con un orgoglio che non si dimentica."
  - tutor: "Questo è proprio da lei: misurava l'affetto in piatti di orecchiette. Grazie di avermelo raccontato, non lo sapevo. Sono questi ricordi, in questi giorni, a tenermi in piedi."
    goals: [memory]
  - learner: "Se c'è qualcosa che posso fare, me lo dica senza problemi. In ufficio, per esempio, potrei occuparmi io della pratica con la Regione finché non torna. E se le serve qualcuno che vada a prendere i parenti alla stazione per il funerale, ho la macchina e il tempo."
  - tutor: "La pratica della Regione mi toglierebbe davvero un pensiero, grazie: i documenti sono nella cartella blu, sulla mia scrivania. Per la stazione ci pensano i miei nipoti, ma mi commuove che ci abbia pensato."
    goals: [offer-help]
  - learner: "Allora non la trattengo oltre, avrà tante persone da ricevere. Le lascio il mio numero: di giorno o di notte, se ha bisogno, mi chiami. E si prenda tutto il tempo che le serve, in ufficio ce la caveremo."
  - tutor: "Grazie, davvero. La sua visita, glielo dico sinceramente, mi ha dato più conforto di tanti telegrammi. La accompagno alla porta; e saluti tutti in ufficio da parte mia."
    goals: [leave]

- scenario: condoglianze
  level: C2
  persona: es-f-teacher
  history: [word-choice]
  turns:
  - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
  - learner: "Non è un disturbo, anzi. Le porgo le mie più sentite condoglianze, anche a nome di tutti i colleghi della scuola. Quando ci hanno dato la notizia, in sala professori è calato un silenzio che non dimenticherò."
  - tutor: "Grazie, mi fa bene saperlo. Mia madre teneva molto alla scuola: aveva insegnato lì per trent'anni, prima di me, e i colleghi più anziani se la ricordano ancora. Si accomodi, prego."
    goals: [condolences]
  - learner: "La ricordo anch'io, dalla festa di fine anno: mi aveva preparato dei taralli con le sue mani, perché avevo detto che in Spagna non ne avevo mai assaggiati. Era una donna molto carinosa, con tutti, anche con chi conosceva da cinque minuti."
    errors: [word-choice]
  - tutor: "Affettuosa, sì, con tutti: era il suo modo di stare al mondo. E i taralli erano la sua firma; ne preparava a chili, per chiunque passasse. Grazie per questo ricordo, non lo conoscevo."
    goals: [memory]
    recast: {text: "carinosa", fix: "affettuosa", tags: [word-choice]}
  - learner: "Affettuosa, ecco la parola: in spagnolo diciamo «cariñosa». Se posso esserle utile in qualche modo, me lo dica. Potrei sostituirla con le sue classi, la settimana prossima, o anche solo portare a casa i compiti da correggere: so quanto pesano, in momenti come questi."
  - tutor: "Le classi mi preoccupavano davvero, e la sua offerta è un sollievo: ne parlerò con la preside domani. I compiti, invece, me li lasci: correggerli mi aiuterà a pensare ad altro."
    goals: [offer-help]
  - learner: "Capisco benissimo. Allora la lascio con la sua famiglia, avrà bisogno di riposare. Se le va, uno di questi giorni le porto un caffè e facciamo due passi; senza fretta, quando se la sentirà."
  - tutor: "Mi farà piacere, davvero: quando sarò pronta, glielo dirò. Grazie di essere passata, e di aver portato con sé anche un po' della scuola. Saluti tutti da parte mia."
    goals: [leave]

- scenario: email-rettore
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Grazie per avermi ricevuta. Sono ricercatrice ospite al dipartimento di Fisica, con una borsa di dodici mesi. A settembre il consiglio di dipartimento ha deliberato di sospendermi l'accesso ai laboratori per un ritardo nella consegna di un modulo. Il punto è che il modulo mi è stato inviato dopo la scadenza, e ho le mail che lo provano. Vorrei chiedere al Rettore di riesaminare la delibera."
  - tutor: "Una situazione spiacevole, ma con le prove scritte dalla sua parte. Cominciamo dall'inizio, che con un Rettore conta moltissimo: come pensava di aprire la lettera?"
    goals: [situation]
  - learner: "Pensavo a «Gentile Rettore», seguito da una frase di presentazione. Mi sembrava cortese senza essere servile."
  - tutor: "Cortese lo è, ma la tradizione vuole qualcosa di più solenne: «Magnifico Rettore». Suona antiquato, lo so, eppure la sua assenza verrebbe notata. E subito dopo, quale formula d'apertura metterebbe?"
  - learner: "Allora «Magnifico Rettore», e poi: «mi permetto di sottoporre alla Sua cortese attenzione la situazione che segue, in merito alla delibera del consiglio di dipartimento del dodici settembre». Va bene, o è troppo?"
  - tutor: "Va benissimo: misurata, chiara, e con la maiuscola su «Sua», che in queste lettere è d'obbligo. Veniamo al cuore: come pensava di dire che il ritardo è dipeso dall'ufficio?"
    goals: [opening-formula]
  - learner: "Avevo scritto così: «È evidente che l'errore è dell'ufficio, che non ha fatto il suo lavoro, e pretendo che la delibera venga annullata immediatamente»."
    errors: [register]
  - tutor: "Il contenuto è sacrosanto, ma «pretendo che la delibera venga annullata immediatamente» è un pugno sul tavolo. Al Rettore si chiede, con fermezza, ma si chiede: come la riformulerebbe?"
    prompt: {text: "pretendo che la delibera venga annullata immediatamente", tags: [register]}
  - learner: "Proviamo: «Alla luce della documentazione allegata, da cui risulta che il modulo mi è stato trasmesso oltre il termine, chiedo cortesemente che la delibera venga riesaminata con la massima sollecitudine». E toglierei del tutto la frase sull'ufficio: le mail parlano da sole."
  - tutor: "Perfetto: ferma, documentata e senza accuse, che le mail rendono superflue. Resta la chiusura: quale formula pensava di usare?"
    goals: [tone]
  - learner: "«In attesa di un Suo cortese riscontro, porgo distinti saluti», e poi nome, qualifica e dipartimento. Oppure è meglio «con osservanza»?"
  - tutor: "«Con osservanza» oggi suona un po' d'altri tempi, anche per un Rettore. La sua formula è impeccabile: aggiunga soltanto «Le» davanti a «porgo», e firmi con nome, qualifica e recapito. Se crede, me la mandi prima di spedirla."
    goals: [closing]

- scenario: email-rettore
  level: C2
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Volentieri. Sono uno storico in pensione, ospite dell'università per un anno grazie a un accordo con Edimburgo. Il mese scorso il Senato accademico ha stabilito che i ricercatori ospiti non possono più accedere all'archivio storico senza un docente che li accompagni. Il mio referente è in congedo fino a giugno: per me significa fermare il lavoro. Vorrei chiedere una deroga."
  - tutor: "Una richiesta di deroga, dunque, non un ricorso: buona notizia, perché il tono può essere più disteso. Come aveva pensato di cominciare?"
    goals: [situation]
  - learner: "Ho scritto «Egregio Rettore», ma ho un dubbio: se avrei scritto «Caro Rettore», sarebbe stato troppo familiare?"
    errors: [hypothetical]
  - tutor: "Il dubbio è legittimo, ci arriviamo subito. Prima, però, riascolti la sua ipotesi: «se avrei scritto». In un periodo ipotetico sul passato, dopo se, quel condizionale la convince?"
    prompt: {text: "se avrei scritto", tags: [hypothetical]}
  - learner: "Se avessi scritto, naturalmente. È il mio errore preferito: lo faccio da quarant'anni. Allora, se avessi scritto «Caro Rettore», sarebbe stato troppo familiare?"
  - tutor: "Avessi scritto, esatto: quarant'anni di fedeltà meritano rispetto. «Caro» sarebbe troppo confidenziale, sì, ma anche «Egregio» qui non è il massimo: per tradizione si scrive «Magnifico Rettore». Come proseguirebbe?"
  - learner: "«Magnifico Rettore», dunque, e poi: «mi permetto di rivolgermi a Lei per chiedere una deroga alla delibera del Senato accademico del tre ottobre». Nel corpo, però, avevo scritto «la decisione è assurda e danneggia la ricerca», e mi rendo conto da solo che è un po' brusco."
  - tutor: "L'apertura va benissimo. Quanto ad «assurda», ha ragione: è un giudizio, e in una lettera al Rettore i giudizi si pagano. Provi a dire la stessa cosa descrivendo le conseguenze, anziché qualificare la decisione."
    goals: [opening-formula]
  - learner: "Ci provo: «Pur comprendendo le ragioni di tutela che hanno ispirato la delibera, mi permetto di segnalare che, nel mio caso specifico, essa comporterebbe l'interruzione di un progetto di ricerca già avviato e finanziato». Così?"
  - tutor: "Così è perfetto: riconosce le ragioni dell'altro e presenta il danno come un fatto. Nessuno potrà sentirsi accusato. Per chiudere, che cosa pensava?"
    goals: [tone]
  - learner: "Pensavo a «Ringraziandola per l'attenzione, Le porgo i miei più cordiali saluti». Oppure sarebbe meglio «distinti»?"
  - tutor: "«Distinti saluti» è più adatto: «cordiali» presuppone una conoscenza personale. Aggiunga «in attesa di un Suo cortese riscontro», e la lettera è pronta. Complimenti: poche persone scrivono al Rettore con questa misura."
    goals: [closing]

- scenario: medico-specialista
  level: C2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Meglio, ma non benissimo. Il batticuore di notte è diminuito, però tre o quattro volte, salendo le scale della scuola, ho avuto una specie di fiato corto, come se avessi corso. Dura pochi minuti e poi passa."
  - tutor: "Mi descriva questi episodi con precisione: compaiono sempre sotto sforzo, o le è capitato anche a riposo? E ha notato dolore al petto o al braccio?"
  - learner: "Sempre sotto sforzo, mai a riposo, e nessun dolore: solo un grande affaticamento. Ah, una volta, a ottobre, in classe mi è girata la testa e mi sono dovuta sedere, ma era una giornata caldissima."
  - tutor: "Bene, cioè, è un bene che sia legato allo sforzo: il quadro è più chiaro. In famiglia ci sono stati problemi di cuore? Genitori, fratelli?"
    goals: [symptoms]
  - learner: "Mio padre aveva un infarto a sessantadue anni; si è ripreso bene, ma da allora prende parecchi farmaci. Mia nonna, invece, ha sofferto di pressione alta per tutta la vita, anche se ai suoi tempi nessuno la curava davvero."
    errors: [tense-aspect]
  - tutor: "Sono informazioni importanti. Mi chiarisca però una cosa: «mio padre aveva un infarto». Lo racconta come un evento preciso o come una situazione che durava?"
    goals: [history]
    prompt: {text: "Mio padre aveva un infarto", tags: [tense-aspect]}
  - learner: "Un evento preciso: mio padre ha avuto un infarto, nel duemilaquindici. Mi è scappato l'imperfetto. Ma gli esami, allora, che cosa dicono?"
  - tutor: "Ha avuto, esatto. Gli esami confermano quello che sospettavo: il cuore è sano, ma la pressione sotto sforzo sale troppo. Con la familiarità che mi descrive, va tenuta sotto controllo, anche se non è nulla di allarmante."
  - learner: "Quando dice che sale troppo, che cosa intende, in numeri? E il fiato corto dipende da quello, o potrebbe esserci qualcos'altro che gli esami non hanno visto?"
  - tutor: "Durante la prova da sforzo la massima è arrivata a centonovanta, troppo per la sua età. Il fiato corto si spiega così, e l'ecografia esclude problemi alle valvole. Per ora non credo che servano altri accertamenti."
    goals: [understand]
  - learner: "Allora che terapia mi propone? Vorrei sapere anche quali effetti collaterali devo aspettarmi, perché passo cinque ore al giorno in piedi a parlare, e non vorrei che un farmaco mi stancasse."
  - tutor: "Una compressa al mattino, a basso dosaggio. Nelle prime settimane può dare un po' di stanchezza o qualche capogiro se si alza in fretta; poi, di solito, passa. Misuri la pressione due volte al giorno e ci rivediamo tra due mesi per il controllo."
    goals: [treatment]

- scenario: medico-specialista
  level: C2
  persona: en-m-traveller
  history: [false-friend]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Abbastanza bene, direi. Ho seguito i suoi consigli: niente caffè dopo pranzo e una passeggiata ogni sera. Però il battito irregolare si fa ancora sentire, soprattutto la sera, quando mi sdraio: come un colpo a vuoto, poi una pausa, poi riparte."
  - tutor: "È una descrizione molto precisa, grazie. Quante volte le capitano, più o meno, questi colpi a vuoto? E le danno capogiri, affanno, o li sente soltanto?"
  - learner: "Li sento soltanto, cinque o sei volte a sera, mai di giorno. Il mio medico di base dice che attualmente sono una cosa innocua, ma a me fanno un certo effetto, soprattutto quando sono solo in albergo."
    errors: [false-friend]
  - tutor: "In realtà il suo medico ha ragione, ma capisco benissimo che sentirli da solo, la sera, faccia impressione. Mi dica: in famiglia qualcuno ha avuto problemi di ritmo o di cuore?"
    goals: [symptoms]
    recast: {text: "attualmente", fix: "in realtà", tags: [false-friend]}
  - learner: "Mio padre ha portato un pacemaker dagli ottant'anni in poi, e mio fratello maggiore ha una fibrillazione atriale, credo che si chiami così, scoperta per caso durante la visita per il rinnovo della patente."
  - tutor: "Si chiama proprio così. È una familiarità da tenere d'occhio, ma l'Holter che ha fatto è rassicurante: i colpi a vuoto sono extrasistoli, isolate e benigne."
    goals: [history]
    new: [{lemma: extrasistole, gloss: extra heartbeat}]
  - learner: "Benigne nel senso che non diventeranno mai qualcosa di più serio, o nel senso che per ora non è necessario intervenire? Sono due cose diverse, e vorrei capire quale delle due."
  - tutor: "Domanda giusta. Nel senso che, nel suo caso, non indicano una malattia del cuore e di solito non peggiorano; il «mai» non posso garantirglielo, ma il rischio è basso. Lo stress e la stanchezza dei viaggi, invece, le rendono più frequenti."
    goals: [understand]
  - learner: "Allora serve una terapia, o devo solo imparare a conviverci? Se c'è un farmaco, preferirei conoscerne prima gli effetti collaterali, perché per lavoro guido molto."
  - tutor: "Per ora niente farmaci: i betabloccanti le darebbero più fastidi che benefici, a cominciare dalla stanchezza alla guida. Riduca ancora un po' il caffè, dorma con regolarità e ci rivediamo a maggio per un controllo."
    goals: [treatment]

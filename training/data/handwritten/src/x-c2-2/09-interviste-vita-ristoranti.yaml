# C2: interviste radiofoniche e podcast sulla vita in Italia, reclami al ristorante con garbo.
- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [participle-agreement]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, e buongiorno a tutti. Incoscienza, direi: solo una straniera poteva pensare di spiegare gli italiani agli italiani. Il libro si intitola «Il caffè si beve in piedi» e racconta i miei dieci anni a Napoli. L'ho scritto quando mi sono accorta che non osservavo più l'Italia da fuori: ci ero finita dentro."
  - tutor: "Un titolo che è già una dichiarazione di poetica. Ma veniamo alla domanda che i nostri ascoltatori aspettano: anche lei ha scritto di pizza, mandolino e mammismo, o è riuscita a sfuggire agli stereotipi?"
    goals: [present-book]
  - learner: "Ci ho provato, ma non le prometto di esserci riuscita del tutto. Gli stereotipi non sono mai del tutto falsi: sono verità rimpicciolite. Il mammismo esiste, certo, ma nel libro racconto anche l'altra faccia: il figlio di cinquant'anni che pranza dalla madre ogni domenica è lo stesso che le fa la spesa quando lei non ce la fa più. Da noi, in Inghilterra, quella madre finisce in una casa di riposo."
  - tutor: "«Verità rimpicciolite»: me la segno, è una definizione formidabile. Ci regala un aneddoto, uno di quelli che hanno fatto ridere, o piangere, i suoi lettori?"
    goals: [stereotype]
  - learner: "Volentieri. Il primo mese a Napoli ho chiesto al tabaccaio sotto casa un'indicazione stradale. Lui ha chiuso il negozio, le chiavi le ha lasciato al barista accanto e mi ha accompagnata fino alla fermata. Mentre aspettavamo l'autobus mi ha raccontato la storia di tutta la sua famiglia, e quando l'autobus è arrivato io sapevo il nome di sua suocera e lui sapeva che ero divorziata."
    errors: [participle-agreement]
  - tutor: "Una scena da film, e molto napoletana. Mi permetta però una pignoleria da conduttore: «le chiavi le ha lasciato»? Con quel pronome davanti, il participio non può restare così."
    goals: [anecdote]
    prompt: {text: "le chiavi le ha lasciato", tags: [participle-agreement]}
  - learner: "Le ha lasciate, ha ragione. Il mio editor me ne ha corretti a decine, di participi così, e qualcuno gli è sfuggito di sicuro."
  - tutor: "Lasciate, appunto, e il suo editor ha tutta la mia solidarietà. Un'ultima riflessione: imparare l'italiano che cosa le ha cambiato, oltre al vocabolario?"
  - learner: "Mi ha cambiato il modo di litigare. In inglese litighiamo per sottintesi, con una gentilezza gelida; in italiano ho imparato che si può alzare la voce, dirsi tutto e poi andare a cena insieme. E ho scoperto il congiuntivo, che è un modo elegante di ammettere che non si è sicuri di niente."
  - tutor: "Il congiuntivo come forma di modestia: anche questa me la rubo. Siamo in chiusura, purtroppo: ci lascia con una frase per chi ci ascolta?"
    goals: [language]
  - learner: "Direi questo: venite in Italia per i monumenti, ma restate per il tabaccaio. I monumenti stanno fermi; le persone, invece, vi accompagnano alla fermata."
  - tutor: "Meglio di così non si poteva chiudere. «Il caffè si beve in piedi» è in libreria da questa settimana: grazie alla nostra ospite, e grazie a voi, cari ascoltatori, per essere stati con noi in questa puntata."
    goals: [farewell]

- scenario: intervista-radio
  level: C2
  persona: en-m-heritage
  history: [preposition]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un autore che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuto!"
  - learner: "Grazie a voi. Incoscienza, sicuramente. Il libro si chiama «Il paese di mio nonno» e racconta il mio ritorno in Calabria, nel paese da cui mio nonno era partito nel cinquantadue. Volevo capire che cosa avesse lasciato, e ho scoperto che il paese, in un certo senso, lo aspettava ancora."
  - tutor: "Una storia di ritorni, quindi. Ma mi tolga una curiosità maliziosa: un americano che scrive del Sud non rischia di vedere soltanto nonne vestite di nero e fichi d'India? Insomma, la cartolina."
    goals: [present-book]
  - learner: "Il rischio c'era, e i primi capitoli erano proprio una cartolina. Poi ho conosciuto i ragazzi del paese, quelli che lavorano a distanza per aziende di Milano e la sera giocano a carte al bar, e ho smesso a scrivere cartoline. Il Sud che racconto è pieno di nonne e di fibra ottica, tutto insieme."
    errors: [preposition]
  - tutor: "Nonne e fibra ottica: ecco il titolo del seguito. Solo un dettaglio, visto che siamo in diretta e ci ascoltano in tanti: «ho smesso a scrivere»? Con smettere, la preposizione è un'altra."
    goals: [stereotype]
    prompt: {text: "ho smesso a scrivere", tags: [preposition]}
  - learner: "Ho smesso di scrivere, certo. Mio nonno metteva la «a» dappertutto, e da lui ho preso il dialetto e le preposizioni sbagliate."
  - tutor: "Di scrivere, perfetto; il nonno, comunque, è assolto. Ci racconta un episodio del libro che le è rimasto addosso?"
  - learner: "Il giorno in cui sono arrivato, un'anziana signora mi ha fermato in piazza e mi ha detto: «Tu sei il nipote di Totò». Non mi aveva mai visto, ma avevo il naso di mio nonno. Settant'anni dopo la sua partenza, il paese lo riconosceva ancora, attraverso di me. Quella sera ho scritto la prima pagina vera del libro."
  - tutor: "Il naso del nonno come passaporto: ascoltatori, ammettetelo, vi siete commossi anche voi. E la lingua? Che cosa le ha dato l'italiano, che l'inglese non le dava?"
    goals: [anecdote]
  - learner: "Mi ha dato un passato. In inglese ero soltanto un americano qualunque; in italiano, e soprattutto in calabrese, sono il pezzo di una storia che continua. Ogni parola che imparo è una porta che mio nonno aveva chiuso e che io riapro."
  - tutor: "Una porta riaperta parola per parola: bellissimo. Siamo agli ultimi secondi: ci saluta con una battuta?"
    goals: [language]
  - learner: "Certo: mio nonno è partito con una valigia di cartone, io sono tornato con un trolley. Il bagaglio è cambiato, ma la fila alla posta è rimasta la stessa."
  - tutor: "Applausi in studio, e anche in regia. «Il paese di mio nonno» è in tutte le librerie: grazie al nostro ospite, e a voi che ci ascoltate. Alla prossima puntata!"
    goals: [farewell]

- scenario: intervista-podcast
  level: C2
  persona: es-m-worker
  history: [ci-ne]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Ciao, grazie a voi! Per amore, come metà degli stranieri che conosco. Mia moglie è di Verona: ci eravamo conosciuti a Valencia, dove lei faceva l'Erasmus, e dopo tre anni a distanza abbiamo deciso che uno dei due doveva trasferirsi. Abbiamo tirato a sorte, praticamente, e ho perso io. O vinto, dipende dai giorni."
  - tutor: "«Ho perso io, o vinto, dipende dai giorni»: questa è già la sigla della puntata! E il primo impatto? C'è stata una cosa che proprio non ti aspettavi?"
    goals: [story]
  - learner: "Gli orari dei pasti, ovviamente: in Spagna si cena alle dieci, qui alle sette e mezza mia suocera aveva già sparecchiato. Ma la sorpresa più grande è stata il cappuccino. La prima volta l'ho ordinato dopo pranzo, e il barista mi ha guardato come se avessi bestemmiato. Ancora oggi ci parlo con gli amici e ridiamo."
    errors: [ci-ne]
  - tutor: "Il barista che ti fulmina con lo sguardo, un classico! Però, «ancora oggi ci parlo con gli amici»: ci parli, con il barista? Se ti riferisci a quella storia, che pronome ti serve?"
    goals: [culture-shock]
    prompt: {text: "ci parlo con gli amici", tags: [ci-ne]}
  - learner: "Ne parlo, ne parlo! Con il barista, invece, non ci parlo più, per la vergogna."
  - tutor: "Ne parli, perfetto, e il gioco di parole è tutto tuo. Passiamo alla parte scomoda: c'è qualcosa dell'Italia che proprio non sopporti? Con garbo, eh, che i nostri ascoltatori sono permalosi."
  - learner: "Con garbo, allora: la burocrazia. Non tanto la lentezza, a cui ormai mi sono abituato, quanto la sensazione che ogni ufficio abbia regole sue. Per il codice fiscale sono andato tre volte, e ogni volta mi chiedevano un documento diverso. Se me l'avessero detto subito, avrei risparmiato tre mattine di ferie."
  - tutor: "Tre mattine di ferie sacrificate: ti capisco, e ci sono passato anch'io, da italiano. Ultima domanda: cosa diresti a uno spagnolo che sta pensando di trasferirsi qui?"
    goals: [critique]
  - learner: "Gli direi di imparare l'italiano sul serio, senza il «tanto è simile allo spagnolo». La trappola è proprio la somiglianza: capisci tutto e non sai dire niente con precisione. E poi di farsi un amico al bar sotto casa: apre più porte di qualunque ufficio."
  - tutor: "Imparare la lingua sul serio e farsi un amico al bar: lo mettiamo come motto della puntata. Grazie di essere stato con noi, è stata una chiacchierata bellissima."
    goals: [advice]

- scenario: intervista-podcast
  level: C2
  persona: en-f-student
  history: [subjunctive-form]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Ciao, grazie dell'invito! Ci sono arrivata quasi per caso. Dovevo passare sei mesi a Bologna per la tesi di dottorato, sull'urbanistica medievale, e i sei mesi sono diventati sette anni. A un certo punto mi sono resa conto di aver lasciato scadere il biglietto di ritorno, e che non mi dispiaceva affatto."
  - tutor: "Il biglietto lasciato scadere: c'è dentro tutta una filosofia! E dimmi, che cosa ti ha spiazzata di più, all'inizio?"
    goals: [story]
  - learner: "Il rapporto con il tempo. A Londra, se un amico dice «ci vediamo alle otto», alle otto è lì. Qui, la prima volta, ho aspettato quaranta minuti, convinta che gli fosse successo qualcosa; poi ho pensato che mi stassero prendendo in giro. Solo dopo ho capito che a Bologna le otto sono un concetto filosofico."
    errors: [subjunctive-form]
  - tutor: "Le otto bolognesi, con quaranta minuti di tolleranza garantita! Però fermiamoci su «stassero»: ripensa al congiuntivo imperfetto di stare, c'è una vocale traditrice."
    goals: [culture-shock]
    prompt: {text: "stassero", tags: [subjunctive-form]}
  - learner: "Stessero! Lo so benissimo, eppure ogni tanto mi esce l'altra forma. In compenso adesso arrivo in ritardo anch'io, quindi direi che mi sono integrata."
  - tutor: "Stessero, brava, e complimenti per l'integrazione, soprattutto quella sull'orologio. Adesso però voglio una critica vera: che cosa non ti piace dell'Italia?"
  - learner: "Il modo in cui tratta i giovani, se posso dirlo con franchezza. I miei colleghi italiani più bravi lavorano con contratti di un anno, rinnovati all'ultimo minuto, e a trentacinque anni vivono ancora con i genitori. Non è pigrizia, come sento dire: è che il sistema non lascia loro spazio. Mi fa rabbia, perché sono la parte migliore del Paese."
  - tutor: "È una critica dura ma giusta, e detta da chi questo Paese lo ama si ascolta meglio. Chiudiamo in positivo: che consiglio daresti a chi sta pensando di trasferirsi qui?"
    goals: [critique]
  - learner: "Di non venire a cercare la cartolina, ma di accettare le contraddizioni: la bellezza e il disordine vanno insieme, non si può avere l'una senza l'altro. E di non frequentare solo stranieri: è comodo, ma poi si resta turisti per sempre."
  - tutor: "La bellezza e il disordine nello stesso pacchetto: niente di più vero. Grazie di cuore, è stato un piacere averti qui; e a chi ci ascolta, alla prossima puntata!"
    goals: [advice]

- scenario: vita-in-italia
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
  - tutor: "Bentrovati, cari ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie a voi per l'invito. A dire il vero, l'Italia l'ha scelta il caso: sono venuta a Padova per un Erasmus di sei mesi, sei anni fa, e non sono più ripartita. Mi sono iscritta alla magistrale, poi ho trovato lavoro in uno studio di architettura. Ho rimandato il ritorno così a lungo che ormai tornare sarebbe partire."
  - tutor: "Una frase che varrebbe una puntata intera. E in questi sei anni, qual è stata la sfida più dura?"
    goals: [story]
  - learner: "Senza dubbio il lavoro. Il mondo degli studi di architettura è molto gerarchico, e da straniera e giovane partivo due volte svantaggiata. Mandavo le mie proposte ai clienti e per giorni nessuno mi contestava; poi scoprivo che avevano parlato direttamente con il titolare, come se io non esistessi."
    errors: [false-friend]
  - tutor: "«Per giorni nessuno mi rispondeva»: quanti ascoltatori stranieri, e non solo stranieri, si riconosceranno in questa frase! Immagino la frustrazione. E Lei, attraverso queste esperienze, come è cambiata?"
    goals: [difficulties]
    recast: {text: "nessuno mi contestava", fix: "nessuno mi rispondeva", tags: [false-friend]}
  - learner: "Rispondeva, certo: in spagnolo «contestar» vuol dire rispondere, che trappola. Comunque, ho imparato a farmi rispettare senza alzare la voce, ed è una lezione che a casa forse avrei imparato più tardi. E sono diventata più paziente: prima mi arrabbiavo per ogni coda, adesso porto un libro."
  - tutor: "Il libro in coda come strategia esistenziale: lo consiglierò a tutti. E a chi sta pensando di trasferirsi qui, che cosa direbbe?"
    goals: [change]
  - learner: "Di non aspettare di parlare bene per buttarsi: io ho imparato l'italiano sbagliando davanti a tutti, ed è stato il modo migliore. E di non fare continuamente il confronto con il proprio paese: se ogni giorno ti chiedi se a casa sarebbe stato meglio, non ti integrerai mai davvero."
  - tutor: "Sbagliare davanti a tutti e smettere di fare confronti: due consigli preziosi, e per niente scontati. La ringraziamo per essere stata con noi, e in bocca al lupo per il Suo lavoro."
    goals: [advice]

- scenario: vita-in-italia
  level: C2
  persona: en-m-retired
  history: [comparative]
  turns:
  - tutor: "Bentrovati, cari ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. L'ho scelta per un motivo molto inglese: il tempo. Dopo quarant'anni di pioggia a Manchester, quando sono andato in pensione io e mia moglie abbiamo deciso di inseguire il sole. Siamo finiti in un paesino dell'Umbria, vicino a Todi, perché ci eravamo innamorati di una casa vista in foto. Sono passati otto anni."
  - tutor: "Il sole come ragione di vita: lo capisco benissimo. E la parte più difficile, qual è stata? Immagino che una casa vista in foto riservi qualche sorpresa."
    goals: [story]
  - learner: "Più d'una! Ma la vera difficoltà è stata la solitudine dei primi anni. In paese erano tutti gentilissimi, però gentilezza non vuol dire amicizia: per due anni siamo stati «gli inglesi», invitati alle feste ma mai a cena. È cambiato tutto quando ho cominciato ad aiutare il vicino con la vendemmia."
  - tutor: "Dalla gentilezza all'amicizia passando per la vendemmia: una strada antica e sempre valida. E Lei, come si sente cambiato?"
    goals: [difficulties]
  - learner: "Mi sento più lento, nel senso buono. Ho imparato che il pranzo non è un'interruzione del lavoro, ma il motivo per cui si lavora. Sono più felice che non sono mai stato, anche se mia figlia dice che sono diventato un vecchio brontolone come i miei vicini."
    errors: [comparative]
  - tutor: "Detto da Sua figlia, il brontolone è quasi una cittadinanza onoraria! Ma riascolti la Sua frase: «più felice che non sono mai stato». Come si costruisce, in italiano, un confronto di questo tipo con tutto il proprio passato?"
    goals: [change]
    prompt: {text: "più felice che non sono mai stato", tags: [comparative]}
  - learner: "Allora... più felice che sono mai stato? Questi paragoni mi confondono sempre."
    errors: [comparative]
  - tutor: "Più felice di quanto non sia mai stato: è una costruzione che fa inciampare anche molti italiani, si consoli, e resta una bellissima confessione. Che consiglio darebbe a chi sogna di trasferirsi qui?"
    recast: {text: "più felice che sono mai stato", fix: "più felice di quanto non sia mai stato", tags: [comparative]}
  - learner: "Di imparare la lingua prima di comprare la casa, non dopo, come abbiamo fatto noi. E di accettare che ci vorranno anni per essere invitati a cena: però, quando succede, è per sempre."
  - tutor: "Anni per un invito a cena, ma poi per sempre: è il ritratto perfetto della provincia italiana. La ringrazio per essere stato con noi, e un saluto ai Suoi vicini brontoloni."
    goals: [advice]

- scenario: recensione-ristorante
  level: C2
  persona: en-m-traveller
  history: [conditional-form]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e preferisco dirlo a Lei piuttosto che scriverlo domani in una recensione. Abbiamo prenotato per festeggiare il nostro anniversario e, sinceramente, la serata è stata deludente. Non si tratta di un singolo episodio, ma di una serie di piccole cose che, messe insieme, hanno rovinato l'atmosfera."
  - tutor: "La ringrazio per averlo detto a me, davvero: mi dà la possibilità di rimediare. Mi spieghi pure nei dettagli: che cosa non ha funzionato?"
    goals: [complain]
  - learner: "Prima di tutto l'attesa: abbiamo aspettato cinquanta minuti per i primi, senza che nessuno ci dicesse niente. Poi il filetto: l'avevo chiesto al sangue ed è arrivato ben cotto, praticamente una suola. Quando l'ho fatto notare, il cameriere ha alzato le spalle e ha detto che la cucina era piena."
  - tutor: "Cinquanta minuti senza una spiegazione e una cottura sbagliata: ha tutte le ragioni. L'alzata di spalle, poi, non doveva succedere, e ne parlerò con il ragazzo. Che cosa si sarebbe aspettato, in quel momento?"
    goals: [detail]
  - learner: "Mi aspetterei almeno una parola, in quel momento. Se ci avessero avvisati del ritardo, avremmo preso un aperitivo invece di guardare l'orologio. E il filetto, in un locale di questo livello, mi aspettavo che lo rifacessero senza discutere."
    errors: [conditional-form]
  - tutor: "Su entrambi i punti non posso darle torto. Solo una cosa: «mi aspetterei almeno una parola», riferito a una sera ormai trascorsa... le suona giusto?"
    goals: [expectation]
    prompt: {text: "Mi aspetterei almeno una parola", tags: [conditional-form]}
  - learner: "Mi sarei aspettato, certo: parliamo del passato. Il senso, comunque, resta quello."
  - tutor: "Mi sarei aspettato, esatto, e il senso è chiarissimo. Le propongo di togliere i secondi dal conto e di offrirvi il dolce e una bottiglia di spumante, per l'anniversario. E se vorrete tornare, la prossima volta avrete il trenta per cento di sconto."
  - learner: "Lo spumante lo accettiamo volentieri, grazie; il dolce no, di attese ne abbiamo avute abbastanza. Accetto anche di non pagare i secondi. Quanto alla prossima volta, preferisco decidere a mente fredda: se torneremo, sarà perché ce ne sarà venuta voglia, non per lo sconto."
  - tutor: "Rispetto la sua scelta, ed è la risposta di una persona corretta. Le porto subito lo spumante e il conto rifatto. Spero davvero di rivedervi, per farvi cambiare idea su di noi."
    goals: [resolve]

- scenario: recensione-ristorante
  level: C2
  persona: es-f-erasmus
  history: [noun-gender]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Mi dispiace disturbarla, ma volevamo dirle che stasera qualcosa non è andato. Siamo in sei, avevamo prenotato da una settimana per il compleanno di una mia amica, e la cena è stata, diciamo, al di sotto delle aspettative."
  - tutor: "Non disturba affatto, anzi, la ringrazio. Mi dispiace che sia successo proprio per un compleanno. Che cosa non è andato, esattamente?"
    goals: [complain]
  - learner: "Le tagliatelle al ragù erano immangiabili: c'era troppa sale, al punto che due di noi le hanno lasciate quasi intere. E le porzioni del secondo erano davvero piccole per il prezzo: diciotto euro per tre fettine di vitello."
    errors: [noun-gender]
  - tutor: "Due piatti lasciati quasi interi: è un segnale che prendo molto sul serio. Mi perdoni, però: «troppa sale»? Ripensi al genere di quella parola, che in spagnolo e in italiano non coincide."
    goals: [detail]
    prompt: {text: "troppa sale", tags: [noun-gender]}
  - learner: "Troppo sale, certo: il sale. È una di quelle parole che mi tradiscono sempre. In ogni caso, ci aspettavamo una cucina all'altezza delle recensioni che avevamo letto: quattro stelle e mezza, e tutti parlavano proprio delle tagliatelle."
  - tutor: "Troppo sale, esatto. Le recensioni di solito dicono il vero, e stasera non siamo stati alla loro altezza: il cuoco titolare è a casa con la febbre, ma non è una scusa che debba riguardarvi. Posso proporvi qualcosa?"
    goals: [expectation]
  - learner: "Ci dica pure."
  - tutor: "Vi tolgo dal conto le tagliatelle e vi offro il dolce: una torta con la candelina per la vostra amica. E sul resto della cena vi faccio il dieci per cento di sconto."
  - learner: "La torta con la candelina è un pensiero carino, la accettiamo volentieri, e anche lo sconto va bene. Però, se posso, glielo dico con simpatia: dica al cuoco di guarire presto, perché le famose tagliatelle vorremmo assaggiarle davvero."
  - tutor: "Glielo riferisco parola per parola, e sono sicuro che gli farà piacere. Arrivo subito con la torta; e tornate a trovarci quando c'è lui: le tagliatelle, quella volta, ve le offro io."
    goals: [resolve]

# C2: modi di dire tra amici, pranzi domenicali, matrimoni da organizzare e lavoro da casa.
- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  history: [preposition]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, una giornata da dimenticare. Stamattina la sveglia non ha suonato, perché la sera prima avevo spento il telefono per non essere disturbata e mi ero dimenticata di riaccenderlo. Sono uscita di corsa senza fare colazione e, ovviamente, ho perso il treno per Milano, quello delle sette e dieci."
  - tutor: "Cominciamo bene, insomma: la giornata è partita col piede sbagliato. E poi? Con quella faccia, immagino che il treno sia stato solo l'antipasto."
  - learner: "Esatto, l'antipasto. Sono arrivata alla riunione con un'ora di ritardo, e il cliente mi ha guardata come se fossi un fantasma. Poi, mentre presentavo i dati, ho aperto per sbaglio la cartella con le foto delle vacanze. Davanti a tutti. Io in costume a Sardegna."
    errors: [preposition]
  - tutor: "Una figuraccia epica, altro che caduta di stile! Ma aspetta: «a Sardegna»? Con le grandi isole, la preposizione cambia."
    goals: [tell]
    prompt: {text: "a Sardegna", tags: [preposition]}
  - learner: "In Sardegna, sì, come con le regioni. Comunque, a quel punto avrei voluto sprofondare. E non è finita: uscendo dall'ufficio ho scoperto che mi avevano rubato la bici."
  - tutor: "In Sardegna, perfetto. Ma no, anche la bici! Le disgrazie non vengono mai sole, eh."
  - learner: "Piove sul bagnato, si dice anche così, no? Ecco, oggi pioveva sul bagnato dalla mattina alla sera: la sveglia, il treno, le foto, la bici. Mancava solo la multa sull'autobus, e infatti il biglietto l'avevo lasciato a casa."
  - tutor: "Piove sul bagnato, appunto: l'hai usato alla perfezione, e con tanto di gran finale. Ma di chi è la colpa, alla fine? Della sveglia, del destino o un po' anche tua?"
    goals: [react]
  - learner: "Diciamo che la colpa è un po' di tutti. Della sveglia no, poverina: da spenta non poteva suonare. Il treno era in orario, quindi colpa mia. Le foto le avevo messe io sul desktop la sera prima. La bici, invece, è colpa del ladro, quella almeno non me la prendo. Ripensandoci, la sfortuna c'entra poco."
  - tutor: "Almeno sei onesta, il che non è poco: la sfortuna ci ha messo lo zampino, ma tu le hai dato una bella mano. E la morale della favola, qual è?"
    goals: [blame]
  - learner: "Che il telefono non si spegne mai, che le foto delle vacanze stanno sul telefono e non sul computer di lavoro, e che dopo una giornata così l'unica cosa sensata è un altro aperitivo. Offri tu, vero?"
  - tutor: "Ah, adesso la colpa diventa mia! Va bene, offro io, ma solo perché la storia della foto in costume vale il prezzo del biglietto. Domani è un altro giorno, e peggio di così non può andare."
    goals: [moral]

- scenario: modi-di-dire
  level: C2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia perdere. Stamattina dovevo montare una cucina a casa di una cliente nuova. Sono arrivato puntuale, ho scaricato tutto dal furgone, e lì ho scoperto che il magazzino mi aveva dato i pensili di un altro ordine: bianchi invece che rossi. Il lavoro di tutta la giornata, sparito in un secondo."
  - tutor: "Partenza col botto, insomma. E la signora? Immagino che non l'abbia presa con filosofia."
  - learner: "Per niente. Ha cominciato a urlare, e io, per calmarla, le ho promesso che sarei andato al magazzino e tornato in un'ora. Ma correndo giù per le scale con un pensile in mano, ho caduto e mi sono fatto male al polso. Niente di rotto, però adesso guido con una mano sola."
    errors: [auxiliary-choice]
  - tutor: "Accidenti, ci mancava solo questa! Ma fammi capire: «ho caduto»? Cadere, in italiano, con quale ausiliare va?"
    goals: [tell]
    prompt: {text: "ho caduto", tags: [auxiliary-choice]}
  - learner: "Sono caduto, sono caduto. Lo sbaglio sempre, perché in spagnolo è sempre «haber». E la signora, vedendomi per terra, si è calmata subito e mi ha perfino fatto un caffè."
  - tutor: "Sono caduto, giusto. Vedi? Non tutto il male vien per nuocere: almeno il caffè te lo sei guadagnato. Lo conosci questo detto?"
  - learner: "Non lo conoscevo, ma lo capisco: da una cosa brutta può nascere una cosa buona. Da noi diciamo «no hay mal que por bien no venga», è quasi uguale. Ecco, il caffè è stato il bene, il polso il male."
  - tutor: "Identico, guarda: segno che la saggezza popolare viaggia senza passaporto. Ma la colpa di tutto questo pasticcio, di chi è? Del magazzino, tua, della signora?"
    goals: [react]
  - learner: "La colpa principale è del magazzino, che ha scambiato le etichette. Però una parte è mia: di solito controllo i pezzi prima di partire, e stamattina, essendo in ritardo, non l'ho fatto. La signora, poverina, non c'entra: ha solo alzato un po' la voce."
  - tutor: "Riconoscere la propria parte è da persone serie. E quindi, la lezione di oggi? Dimmela in una frase."
    goals: [blame]
  - learner: "Chi va piano va sano e va lontano. Se avessi controllato i pezzi e fossi sceso con calma, adesso avrei due polsi buoni e una cliente contenta."
  - tutor: "Chi va piano va sano e va lontano: perfetto, e detto da te con il polso fasciato è ancora più convincente. Brindiamo alla prossima cucina, quella rossa."
    goals: [moral]

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Grazie! Per l'ultima lasagna non mi metto in mezzo, ci tengo alla pelle. Però «scannarsi» non lo conoscevo: immagino che voglia dire litigare in modo feroce, quasi con il coltello?"
  - tutor: "Proprio così: alla lettera sarebbe tagliarsi la gola, ma a tavola vuol dire litigare come cani e gatti. Tranquillo, qui ci si scanna con affetto. Ne vuoi un po'? Ce n'è ancora, se sei svelto."
    goals: [react]
  - learner: "Ci prendo volentieri, grazie. A proposito di cani e gatti: io e mio fratello da piccoli eravamo così. Una volta, per l'ultima fetta di torta, abbiamo litigato talmente tanto che nostra madre se l'è mangiata davanti a noi. Tra i due litiganti il terzo gode, e il terzo era la mamma."
    errors: [ci-ne]
  - tutor: "Tua madre è un genio, e il proverbio l'hai piazzato alla perfezione. Ma all'inizio: «ci prendo volentieri»... parlando di un po' di lasagna, quale pronome ti serve?"
    goals: [use-idiom]
    prompt: {text: "Ci prendo volentieri", tags: [ci-ne]}
  - learner: "Ne prendo, ne prendo! E pensare che me l'avevi servito su un piatto d'argento."
  - tutor: "Ne prendo, bravo; e anche «su un piatto d'argento» calza a pennello. Ma dimmi: in inglese avete qualcosa di simile a «tra i due litiganti il terzo gode»?"
  - learner: "Non esattamente. Abbiamo un'espressione con due cani che litigano per un osso, mentre un terzo cane se lo porta via, ma si usa poco. La vostra è più elegante, con quel «gode» che fa quasi ridere."
  - tutor: "Il terzo cane che scappa con l'osso rende l'idea, ma il nostro «gode» ha più malizia, hai ragione. Adesso però tocca a te: raccontaci una storia che finisca con un proverbio, come si deve."
    goals: [compare]
  - learner: "Va bene. L'anno scorso a Napoli ho chiesto a un tassista di portarmi in albergo per la strada più breve. Mi ha fatto fare tutto il lungomare, il Vomero e mezza città, giurando che era per evitare il traffico. Il conto è stato il triplo del previsto. Morale: chi lascia la strada vecchia per la nuova sa quel che lascia, ma non sa quel che trova."
  - tutor: "Applausi da tutta la tavola, anche dalla zia che di solito non ride mai! Proverbio perfetto, e storia da napoletano adottivo. Adesso però mangia, che la lasagna si raffredda."
    goals: [anecdote]

- scenario: pranzo-domenicale
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Ciao a tutti, e grazie dell'invito! Non mordete, ma vi scannate: quindi è meglio che stia lontana dalla lasagna, no? Scannarsi vuol dire litigare tantissimo, giusto? Lo capisco più dal tono che dalla parola."
  - tutor: "Hai capito benissimo: letteralmente sarebbe tagliarsi la gola, ma qui significa litigare all'ultimo sangue. Poi, quando arriva il caffè, sono tutti amici come prima. Siediti accanto alla nonna: lei non litiga, osserva."
    goals: [react]
  - learner: "La nonna mi ha appena messo nel piatto un pezzo enorme, e quando le ho detto che era troppo mi ha risposto: «Mangia, che sei tutta pelle e ossa». Le nonne spagnole dicono la stessa cosa! La lasagna è buonissima, comunque. La ricetta, nonna, me lo può dare?"
    errors: [combined-pronouns]
  - tutor: "«Tutta pelle e ossa» è un classico delle nonne di tutto il mondo, vedo. Ma la nonna ti guarda perplessa: «me lo può dare»? Ricetta è femminile: controlla il pronome."
    prompt: {text: "me lo può dare", tags: [combined-pronouns]}
  - learner: "Me la può dare, scusa, nonna! Speriamo che non me la tenga segreta per vendetta."
  - tutor: "Me la può dare, brava. La nonna ride e dice che la ricetta non si dà, si ruba con gli occhi: dovrai venire a guardarla mentre la prepara. Ma dimmi, tu ce l'hai una storia che finisca con un modo di dire italiano?"
  - learner: "Sì, una l'ho imparata a mie spese. Il primo mese a Bologna ho prestato la bici a un ragazzo del corso che conoscevo appena, e non l'ho più rivista. Quando l'ho raccontato alla mia coinquilina, mi ha detto: «Fidarsi è bene, non fidarsi è meglio». Da allora ci penso due volte prima di prestare qualcosa."
  - tutor: "Lezione costosa ma indimenticabile, e il proverbio l'hai usato a regola d'arte. In spagnolo avete un equivalente?"
    goals: [use-idiom, anecdote]
  - learner: "Non proprio uguale. Noi diciamo «piensa mal y acertarás», cioè pensa male e indovinerai. È più cinico del vostro, forse. Però anche voi avete «a pensar male si fa peccato, ma spesso ci si azzecca», no? Me l'ha insegnato il mio professore di storia."
  - tutor: "Esatto, e l'ha reso famoso un politico che di peccati se ne intendeva. Spagnoli e italiani, a quanto pare, pensano male allo stesso modo. Adesso però basta proverbi: la nonna ha portato il tiramisù."
    goals: [compare]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo piccolo e all'aperto: una cinquantina di invitati, solo famiglia e amici stretti, in campagna, possibilmente in Toscana. Una cerimonia civile breve, e poi una cena lunga, senza balli di gruppo né lancio del bouquet. Vorremmo che gli ospiti si sentissero a una festa tra amici, non a uno spettacolo."
  - tutor: "Un'idea chiara e di gran gusto, il che mi semplifica molto il lavoro. Parliamo di cifre, allora: che budget avete in mente, più o meno?"
    goals: [vision]
  - learner: "Abbiamo messo da parte trentamila euro, tutto compreso: location, cena, fotografo, fiori; abiti esclusi. È una cifra che non vorremmo superare, perché il resto ci serve per la casa. Secondo Lei è realistica, per cinquanta persone?"
  - tutor: "È realistica, purché scegliamo bene la stagione: a giugno costa tutto un terzo in più. Vi ho selezionato due location: un casale vicino a Siena, con la cena sotto il pergolato, e una villa sul lago Trasimeno, più elegante ma con meno verde. Quale vi attira di più?"
    goals: [budget]
  - learner: "Il casale, senza dubbio: il pergolato è esattamente ciò che sognavamo. Ho però una perplessità: se piove, dove ci mettono? Non vorrei che la cena finisse in un fienile improvvisato. La villa, invece, ha una sala interna, giusto?"
  - tutor: "Osservazione giusta. Il casale ha una limonaia coperta per cinquanta persone, con vetrate sul giardino: niente fienile, glielo garantisco. La villa ha una sala più grande, ma costa anche il venti per cento in più."
  - learner: "Allora scegliamo il casale, con la limonaia come piano B. Prima di firmare, però, vorrei porre alcune condizioni: vorrei che il fotografo sia discreto, niente pose di gruppo infinite, e che i fornitori ci mandino i preventivi scritti entro fine mese. Se ce le garantisce, procediamo."
    errors: [subjunctive-use]
  - tutor: "Ottima scelta, il casale vi somiglia. Sulle condizioni sono d'accordo, ma riascolti la sua frase: «vorrei che il fotografo sia discreto». Dopo un condizionale come vorrei, quale tempo del congiuntivo ci vuole?"
    goals: [choices]
    prompt: {text: "vorrei che il fotografo sia discreto", tags: [subjunctive-use]}
  - learner: "Giusto: vorrei che il fotografo fosse discreto. Il condizionale si porta dietro l'imperfetto. E un'ultima condizione: vorrei essere informata di qualsiasi cambiamento, anche minimo, prima che venga deciso, non dopo."
  - tutor: "Fosse, perfetto. Le condizioni sono tutte ragionevoli e le metto nel contratto: fotografo discreto, preventivi scritti entro fine mese, nessuna modifica senza il vostro consenso. Vi mando la bozza entro venerdì."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: C2
  persona: en-m-heritage
  history: [false-friend]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille! Lo immaginiamo in Puglia, nel paese dei miei nonni, vicino a Lecce. Grande, temo: tra la mia famiglia americana e quella di Giulia arriviamo a centottanta invitati. Vorremmo sposarci nella chiesa dove si sono sposati i miei nonni, e poi fare festa in una masseria, con musica dal vivo fino a tardi."
  - tutor: "Che bella idea, chiudere il cerchio nella chiesa dei nonni. Centottanta invitati in masseria si gestiscono benissimo. Avete un'idea del budget?"
    goals: [vision]
  - learner: "Abbiamo circa sessantamila euro. Le famiglie vorrebbero aggiungere qualcosa, ma preferiamo non dipendere da loro, perché poi ognuno vuole dire la sua. Su questo siamo molto sensibili: meglio una festa più semplice, ma tutta nostra."
  - tutor: "Restare indipendenti è la scelta più saggia: chi paga decide, si sa. Con sessantamila euro per centottanta persone si lavora bene, purché si eviti agosto. Vi propongo due masserie: una vicino al mare, l'altra tra gli ulivi, più vicina al paese."
    goals: [budget]
  - learner: "Quella tra gli ulivi, assolutamente. I miei nonni hanno novant'anni e così non devono fare chilometri; e le foto tra gli ulivi secolari sono proprio quello che sogniamo."
  - tutor: "Ottima scelta: la masseria tra gli ulivi è anche quella con il menù più legato al territorio. Prima di procedere, ci sono condizioni che volete porre?"
    goals: [choices]
  - learner: "Due, soprattutto. La prima: niente decisioni prese con le nostre famiglie senza di noi. Se mia madre la chiama per cambiare il menù, e lo farà, ce lo deve dire prima di risponderle di sì. La seconda: vogliamo che il fotografo sia di qui, uno che conosca la luce del Salento, non uno mandato da un'agenzia di Milano."
  - tutor: "Condizioni chiarissime e, mi creda, molto sagge, soprattutto la prima: le mamme sono il mio pane quotidiano. Le metto per iscritto nel contratto, e per il fotografo ho già in mente un nome di Otranto. Vi mando tutto entro lunedì."
    goals: [conditions]

- scenario: smartworking
  level: C2
  persona: es-f-erasmus
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, sempre, ormai da tre anni. L'azienda è a Madrid e io vivo qui a Bologna: in ufficio ci vado due volte l'anno, per la cena di Natale e per la riunione di luglio. Il resto del tempo il mio ufficio è il tavolo della cucina, tra il computer e la moka."
  - tutor: "Il tavolo della cucina: l'ufficio più ambito d'Italia! E ti trovi bene, o certi giorni ti manca un collega con cui lamentarti del capo?"
    goals: [situation]
  - learner: "Molto bene, soprattutto per la libertà. Mi organizzo gli orari come voglio: se la mattina ho voglia di una passeggiata sotto i portici, recupero la sera. E poi vivo dove ho scelto io: Bologna è più piccola che Madrid, ma si vive molto meglio, e gli affitti sono un'altra cosa."
    errors: [comparative]
  - tutor: "La passeggiata sotto i portici in orario di lavoro: ti invidio profondamente. Però, «più piccola che Madrid»... quando confronti due città, quale parolina usi dopo più?"
    goals: [pros]
    prompt: {text: "più piccola che Madrid", tags: [comparative]}
  - learner: "Più piccola di Madrid, giusto: «que» in spagnolo, «di» in italiano. Però gli svantaggi ci sono, eh. Certe settimane non parlo con nessuno dal lunedì al venerdì, se non in videochiamata, e la sera ho bisogno di uscire per non impazzire."
  - tutor: "Di Madrid, perfetto. E il silenzio della settimana è il prezzo che si paga: lo dicono tutti quelli che lavorano a distanza. Ma se potessi scegliere, torneresti in un ufficio, magari qui a Bologna?"
    goals: [cons]
  - learner: "Tutti i giorni no, morirei. Ma uno spazio condiviso due o tre giorni a settimana, sì, lo preferirei: avrei dei colleghi, anche se di altre aziende, e un confine tra la casa e il lavoro. Adesso, quando chiudo il computer, il lavoro resta lì sul tavolo, accanto alla cena."
  - tutor: "Il lavoro accanto alla cena: hai detto in una frase quello che i libri sul lavoro a distanza spiegano in duecento pagine. Lo spazio condiviso mi sembra il compromesso perfetto. Dai, brindiamo alla tua cucina-ufficio."
    goals: [preference]

- scenario: smartworking
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "In ufficio, cinque giorni su cinque, da quando è finita l'emergenza. Il nuovo direttore è convinto che a casa la gente non lavori, e per una volta non mi lamento: abito a dieci minuti a piedi, e a casa ho due coinquilini rumorosissimi."
  - tutor: "Dieci minuti a piedi: questo non è andare in ufficio, è una passeggiata digestiva. Quindi per te i vantaggi dell'ufficio battono quelli di casa?"
    goals: [situation]
  - learner: "Per me sì, decisamente. In ufficio separo il lavoro dalla vita: alle sei chiudo la porta e il lavoro resta lì. E poi imparo di più: sento come i colleghi più esperti trattano con i clienti, e molte cose le ho capite così, ascoltando di nascosto le loro telefonate."
  - tutor: "Rubare il mestiere con le orecchie: un metodo antico e infallibile. Ma qualche svantaggio ci sarà, no? Non mi dire che ami anche le riunioni del lunedì."
    goals: [pros]
  - learner: "Le riunioni del lunedì sono il mio inferno personale. E poi c'è la rigidità: se ho una visita medica, devo chiedere un permesso anche per un'ora sola. Se potrei lavorare da casa quel giorno, non perderei mezza giornata di ferie."
    errors: [hypothetical]
  - tutor: "Le riunioni del lunedì sono l'inferno di tutti, consolati. Ma «se potrei lavorare da casa»: dopo quel se, il condizionale ti sembra davvero al suo posto?"
    goals: [cons]
    prompt: {text: "Se potrei lavorare da casa", tags: [hypothetical]}
  - learner: "No, hai ragione: se potessi lavorare da casa quel giorno, non perderei mezza giornata. Ecco, è proprio quello che direi al direttore, se mi ascoltasse."
  - tutor: "Se potessi, perfetto, e anche la seconda ipotesi è impeccabile. Quindi, se dipendesse da te, come organizzeresti la settimana ideale?"
  - learner: "Quattro giorni in ufficio e uno da casa, a scelta: per le visite, le consegne, o quando devo concentrarmi su un documento lungo senza interruzioni. Più flessibile di così non mi serve: il resto della settimana voglio i colleghi intorno e il caffè della macchinetta, anche se è imbevibile."
  - tutor: "Il caffè imbevibile della macchinetta, l'unica vera colla aziendale! Mi sembra una proposta equilibrata: preparala bene e portala al direttore, magari non di lunedì. Intanto, un altro giro?"
    goals: [preference]

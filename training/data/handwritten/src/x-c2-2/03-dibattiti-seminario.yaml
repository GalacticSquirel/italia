# C2: dibattiti pubblici (centro pedonale, turismo) e seminario di filosofia.
- scenario: dibattito-ambiente
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Penso, con rispetto, che il disastro lo stiamo già vivendo. Io sono favorevole alla chiusura, purché sia graduale e accompagnata da servizi seri. Un centro pedonale fatto bene non svuota i negozi: li riempie di gente che cammina invece di cercare parcheggio."
  - tutor: "Gente che cammina, dice. Io ho una merceria da trent'anni e le mie clienti arrivano in macchina, con le borse. Mi dia almeno una ragione concreta per cui dovrei crederle."
    goals: [position]
  - learner: "Gliene do due. La prima è l'aria: in via Mazzini i valori dell'inquinamento superano i limiti un giorno su tre, e chi ci lavora otto ore, come Lei, la respira più di chiunque. La seconda è economica: dove sono state create zone pedonali, gli incassi dei negozi dopo un paio d'anni sono cresciuti, non calati."
  - tutor: "Altrove, forse. Qui siamo in provincia e gli autobus passano ogni mezz'ora, quando passano. Senza mezzi pubblici decenti, le mie clienti anziane come ci arrivano, in monopattino?"
    goals: [argue]
  - learner: "È un'obiezione seria, e non la liquido. Ma proprio per questo la chiusura andrebbe votata insieme a un piano dei trasporti: una navetta elettrica ogni dieci minuti dai parcheggi di scambio, gratuita per i residenti sopra i sessantacinque anni. Senza la navetta, sarei il primo a votare contro."
  - tutor: "La navetta ogni dieci minuti la voglio vedere, ma ammetto che così il discorso cambia. Resta il carico e scarico: i fornitori non me li porta la navetta."
    goals: [counter]
  - learner: "Su questo ha ragione Lei, e glielo concedo senza riserve: un negozio senza consegne chiude davvero. Propongo allora un compromesso: accesso libero ai fornitori fino alle dieci del mattino, e un anno di prova soltanto nel fine settimana. Se dopo dodici mesi gli incassi saranno calati, si torna indietro."
  - tutor: "Fornitori fino alle dieci e un anno di prova nel fine settimana: messa così, potrei perfino firmarla. Non mi ha convinta del tutto, ma mi ha ascoltata, e di questi tempi non è poco. Lo proponga all'assemblea, avrà il mio voto."
    goals: [concede]

- scenario: dibattito-ambiente
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Ne penso il contrario, se mi permette. Insegno nella scuola elementare di piazza Garibaldi e ogni mattina vedo il centro trasformato in un parcheggio in doppia fila. Per me chiuderlo alle auto non è un capriccio da ambientalisti: è una questione di buon senso."
  - tutor: "Di buon senso, addirittura. Io ho un bar proprio su quella piazza, e il caffè delle otto me lo chiedono i genitori che si fermano un minuto in macchina. Che cosa ci guadagnerei, me lo spiega?"
    goals: [position]
  - learner: "Glielo spiego volentieri. Primo, la sicurezza: è una scuola che i suoi alunni devono attraversare tra le macchine in manovra, e l'anno scorso abbiamo avuto due incidenti. Secondo, il rumore e l'aria: una piazza senza motori è una piazza dove la gente si siede, e chi si siede consuma più di chi lascia il motore acceso."
    errors: [relative-pronoun]
  - tutor: "Sul motore acceso può darsi che abbia ragione. Mi scusi però, non ho afferrato bene: «una scuola che i suoi alunni»? Mi ripeta la frase, perché gli incidenti mi interessano."
    goals: [argue]
    prompt: {text: "una scuola che i suoi alunni", tags: [relative-pronoun]}
  - learner: "Ha ragione, mi sono espressa male: è una scuola i cui alunni devono attraversare tra le macchine in manovra. Due incidenti in un anno, per fortuna lievi."
  - tutor: "Adesso è chiaro, e due incidenti non sono pochi, lo riconosco. Però il rimedio è peggiore del male: se chiudete tutto, i genitori lasceranno i figli a tre isolati di distanza e il traffico si sposterà nelle vie accanto. Ci avete pensato?"
  - learner: "Ci abbiamo pensato, e in parte è vero: il traffico non sparisce, si sposta. Ma altrove ha funzionato il pedibus: i bambini si ritrovano in due punti di raccolta e arrivano a scuola a piedi, in fila, con due adulti. I genitori si fermano una volta sola, lontano dalla piazza, e le vie laterali non si intasano."
  - tutor: "Il pedibus l'ho visto fare a mia nipote, e funzionava, devo ammetterlo. Resta che io alle otto perdo i miei caffè, e quelli non me li restituisce nessuno."
    goals: [counter]
    new: [{lemma: pedibus, gloss: "walking school bus"}]
  - learner: "Su questo Le do ragione: nell'immediato qualcosa Lei lo perderebbe, e sarebbe ingiusto far finta di no. Le propongo una via di mezzo: chiusura soltanto negli orari di entrata e di uscita, dalle otto alle nove e dalle quattro alle cinque, e uno dei punti di raccolta del pedibus proprio davanti al Suo bar."
  - tutor: "Il punto di raccolta davanti al bar: Lei, signora maestra, sa trattare meglio di un sindacalista. Un'ora al mattino e una al pomeriggio le posso sopportare. Proviamo così, e i genitori il caffè lo prenderanno a piedi."
    goals: [concede]

- scenario: dibattito-ambiente
  level: C2
  persona: en-f-student
  history: [register]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Penso che sia un'occasione, più che un disastro. Io studio qui da quattro anni e mi muovo solo in bicicletta: un centro senza auto sarebbe più sicuro, più silenzioso e, mi creda, anche più frequentato."
  - tutor: "Più frequentato da voi studenti, forse, la sera. Ma io abito in via dei Mille con mia madre, che ha ottantasei anni e non va in bicicletta. Perché dovrebbe convenire anche a noi?"
    goals: [position]
  - learner: "Guarda, capisco la preoccupazione, e ti porto due argomenti. Il primo: meno traffico vuol dire ambulanze e taxi che arrivano prima, non dopo. Il secondo: i marciapiedi oggi sono occupati dalle auto in sosta, e proprio le persone anziane sono costrette a camminare in mezzo alla strada."
    errors: [register]
  - tutor: "Gli argomenti li ascolto volentieri, signorina. Però, «ti porto due argomenti»... ci conosciamo da cinque minuti, e siamo in un'assemblea pubblica. Vuole ripartire da capo?"
    goals: [argue]
    prompt: {text: "ti porto due argomenti", tags: [register]}
  - learner: "Mi scusi, ha ragione, è l'abitudine dell'università. Guardi, capisco la Sua preoccupazione, e Le ripeto i due argomenti: i soccorsi arrivano prima e i marciapiedi tornano a chi cammina."
  - tutor: "Così va meglio, grazie, e gli argomenti non sono sciocchi. Ma mi dica: quando mia madre deve andare dal medico, la porto in spalla? Un'auto sotto casa per lei non è un lusso, è una necessità."
  - learner: "No di certo, e nessuna proposta seria lo chiede. In tutte le città che hanno chiuso il centro, i residenti con problemi di mobilità mantengono un permesso, e così chi li assiste. Sua madre arriverebbe sotto casa esattamente come oggi, anzi trovando finalmente posto, perché non ci sarebbero le auto di chi viene da fuori."
  - tutor: "Se il permesso c'è davvero e non serve un anno di carte bollate per averlo, è già un altro discorso. Resta il chiasso la sera: senza macchine, sotto le mie finestre ci sarete voi fino alle tre."
    goals: [counter]
  - learner: "Qui non ho difese: il rumore notturno esiste, e certe sere esageriamo. Glielo concedo. Si potrebbe trovare un accordo: zona pedonale sì, ma con i locali che ritirano i tavolini all'aperto a mezzanotte, e controlli veri. Noi guadagniamo le strade, voi il sonno."
  - tutor: "Tavolini ritirati a mezzanotte e permessi per chi ne ha bisogno: su queste basi potrei perfino votare a favore. Lo metta per iscritto e lo presenti al consiglio di quartiere; la firma di una vecchia brontolona gliela garantisco."
    goals: [concede]

- scenario: turismo-di-massa
  level: C2
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno, mi chiamo Diego, sono cuoco e lavoro a Bologna da nove anni. Sono contrario al ticket, ma non per le ragioni solite: non mi scandalizza far pagare, mi sembra soltanto che non serva a niente."
  - tutor: "Un cuoco contrario al ticket: mi aspettavo il contrario, visto che i turisti li sfamate voi. Perché non servirebbe, scusi? Cinque euro a testa qualcuno lo scoraggeranno."
    goals: [introduce]
  - learner: "Non scoraggiano nessuno: chi ha speso mille euro di volo non rinuncia per cinque. Glielo dico per esperienza. Nella via dove lavoro, in pochi anni le vecchie botteghe sono state sostituiti da locali che vendono taglieri tutti uguali, e nessun biglietto avrebbe cambiato questo. Il problema non è quanta gente entra, è che cosa trova."
    errors: [passive]
  - tutor: "L'esempio dei taglieri tutti uguali rende l'idea, e temo che molti ascoltatori lo riconoscano. Una cosa, però: «le vecchie botteghe sono state sostituiti»? Riascolti la frase: quel participio con chi deve andare d'accordo?"
    goals: [example]
    prompt: {text: "le vecchie botteghe sono state sostituiti", tags: [passive]}
  - learner: "Con le botteghe, certo: sono state sostituite. Mi scusi, la diretta mi emoziona."
  - tutor: "Perfetto, e non si scusi: parla meglio di tanti ospiti in studio. Però mi lasci fare l'avvocato del diavolo. Senza ticket non resta che il numero chiuso, e allora la città diventa davvero un museo con il tornello. È questo che vuole?"
  - learner: "No, ed è proprio l'argomento che rovescerei. Il museo con il tornello lo crea il ticket, perché trasforma la città in un prodotto: paghi, entri, consumi, esci. Io credo che vada regolato ciò che si offre, non chi entra: limiti agli affitti brevi, canoni agevolati per le botteghe storiche. Una città dove la gente abita si difende da sola."
  - tutor: "«Regolare ciò che si offre, non chi entra»: è una distinzione netta, gliela riconosco. Ma i sindaci vogliono misure che si possano applicare domani mattina. Me ne dica una, concreta."
    goals: [rebut]
  - learner: "Una sola, allora: un tetto alle licenze di ristorazione, strada per strada. Quando in una via un locale su tre vende cibo ai turisti, non se ne aprono altri finché non torna un artigiano o un negozio di quartiere. Da cuoco Le dico che farebbe bene anche a noi: meno locali, ma migliori."
  - tutor: "Un tetto alle licenze proposto da un cuoco: questa non me l'aspettavo, ed è la prima idea della mattinata che non costa un euro ai visitatori. Grazie della telefonata, e buon lavoro in cucina."
    goals: [proposal]

- scenario: turismo-di-massa
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
  - learner: "Buongiorno, sono Kate, vivo a Milano da sei anni e mi occupo di marketing. Sono a favore, anche se con qualche condizione: il ticket da solo non risolve nulla, ma è uno strumento, e rinunciarvi per principio mi pare un lusso che Venezia non può permettersi."
  - tutor: "A favore con riserva, dunque. Mi dia un caso concreto, però, perché finora chi ha telefonato a favore mi ha parlato di principi e mai di fatti."
    goals: [introduce]
  - learner: "Volentieri. L'anno scorso ho accompagnato dei clienti a Venezia un sabato di maggio: sul ponte di Rialto non ci si muoveva, e una signora con la spesa ha impiegato dieci minuti per fare venti metri. La maggior parte di quella folla era arrivata la mattina e sarebbe ripartita la sera, senza dormire né cenare in città. È il turismo che consuma di più e lascia di meno."
  - tutor: "L'immagine della signora con la spesa vale più di una statistica. Ma mi permetta: far pagare l'ingresso a una città non significa riservarla a chi può permetterselo? Oggi cinque euro, domani cinquanta, e Venezia diventa un circolo privato."
    goals: [example]
  - learner: "Capisco il timore, ma credo che confonda due piani. Chi oggi viene escluso non è il turista con pochi soldi: è il residente, che se ne va perché non trova più casa né un panettiere. Un contributo modesto, da cui siano esentati studenti, lavoratori e chi pernotta, non seleziona per reddito: chiede soltanto, a chi viene per poche ore, di partecipare ai costi che genera."
  - tutor: "Rovesciare l'accusa di esclusione sul destino dei residenti è una mossa abile, e non priva di fondamento. Ammettiamo pure che sia giusto. Come lo farebbe funzionare, in pratica, senza code ai varchi e senza burocrazia?"
    goals: [rebut]
  - learner: "Con la prenotazione obbligatoria e un prezzo che varia: quasi nulla un martedì di novembre, più alto nei fine settimana di punta. E soprattutto con un vincolo scritto: che ogni euro raccolto venga destinato agli alloggi per i residenti e ai servizi di quartiere, con un bilancio pubblico. Se i veneziani non vedono dove finiscono i soldi, il ticket resterà una tassa odiosa."
  - tutor: "Prezzo variabile e bilancio pubblico: una proposta precisa, finalmente, e con una clausola che molti amministratori preferirebbero non sentire. La ringrazio della telefonata; restate con noi, torniamo subito dopo la pubblicità."
    goals: [proposal]

- scenario: seminario-etica
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Dubiti pure, professore, è per questo che siamo qui. Preciso però la tesi: non sostengo che una macchina non possa causare un danno, bensì che non le si possa imputare moralmente. La responsabilità morale presuppone un agente capace di comprendere le ragioni per cui agisce, e nessun sistema attuale lo è."
  - tutor: "«Comprendere le ragioni» è un'espressione comoda. Un sistema che valuta alternative e sceglie la migliore, in che cosa differirebbe da noi? Mi serve un criterio, non un'intuizione."
    goals: [thesis]
  - learner: "Il criterio è la distinzione tra responsabilità causale e responsabilità morale. Un fulmine che incendia un fienile ne è la causa, eppure nessuno lo biasima. Perché il biasimo abbia senso occorre l'intenzionalità: che l'agente si rappresenti l'azione come propria e possa risponderne. La macchina ottimizza una funzione; non risponde di nulla a nessuno."
  - tutor: "Benissimo. Allora Le obietto questo: se l'intenzionalità si riconosce dal comportamento, e una macchina si comportasse in tutto come un agente intenzionale, con quale diritto gliela negheremmo? Non rischia un pregiudizio a favore del carbonio?"
    goals: [distinguish]
  - learner: "Il rischio c'è, ma l'obiezione prova troppo. Se bastasse il comportamento, dovremmo ritenere responsabile anche un attore per i delitti del suo personaggio. Attribuire intenzionalità non è solo descrivere una condotta: è inserire qualcuno in una pratica di richieste e giustificazioni reciproche. Finché una macchina non può essere chiamata a giustificarsi, né sentirsi in debito, la pratica gira a vuoto."
  - tutor: "L'attore è un esempio efficace, glielo riconosco. Ma Lei ha detto «finché». Dunque la sua tesi vale per le macchine di oggi, non per quelle possibili: quel «mai» iniziale mi pare ormai indifendibile."
    goals: [objection]
  - learner: "Su questo punto cedo, professore: «mai» era più di quanto potessi dimostrare. Se un giorno esistesse un sistema dotato di coscienza e capace di rispondere delle proprie ragioni, non avrei argomenti per escluderlo. Ma la concessione non intacca il nucleo: la responsabilità dipende da quelle capacità, non dalla complessità del calcolo."
  - tutor: "Una ritirata ordinata, che lascia intatto ciò che conta: è così che si concede in filosofia. Ora mi chiuda il cerchio. In una frase, rigorosa, che cosa abbiamo stabilito questo pomeriggio?"
    goals: [concede]
  - learner: "Che la responsabilità morale non è una proprietà che si misura dalle prestazioni, ma uno statuto che si riconosce a chi può dare e ricevere ragioni; e che pertanto le macchine attuali ne sono prive non per principio, ma di fatto, restando la responsabilità in capo a chi le progetta e le impiega."
  - tutor: "«Non per principio, ma di fatto»: è la formulazione che metterei nel titolo del suo capitolo. Ha difeso la tesi correggendola, che è il modo migliore di difenderla. Grazie, dottoressa; la settimana prossima tocca a chi sostiene il contrario."
    goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Bene, dottore, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Me lo aspettavo, professore, e La ringrazio della franchezza. La mia tesi, detta con precisione, è questa: una macchina non può essere il destinatario appropriato del biasimo o della lode, perché non ha nulla da perdere né da imparare da essi. Può sbagliare, ma non può essere colpevole."
  - tutor: "«Nulla da perdere»: curioso argomento, per un ingegnere. Eppure le macchine imparano dai propri errori meglio dei miei studenti. Su che cosa fonda, esattamente, la differenza tra errore e colpa?"
    goals: [thesis]
  - learner: "Sulla distinzione tra malfunzionamento e trasgressione. Un ponte che crolla ha un difetto; l'ingegnere che ha firmato il progetto ha una colpa, perché conosceva la norma e poteva attenervisi. Se un'auto a guida autonoma investirebbe un pedone, diremmo che il sistema ha fallito, non che ha violato un dovere: i doveri si rivolgono a chi può riconoscerli come tali."
    errors: [hypothetical]
  - tutor: "L'esempio del ponte è limpido, e viene dal suo mestiere. Prima di attaccarlo, però, un'osservazione di forma: «Se un'auto a guida autonoma investirebbe». In un'ipotesi, dopo «se», quale modo si richiede?"
    goals: [distinguish]
    prompt: {text: "Se un'auto a guida autonoma investirebbe", tags: [hypothetical]}
  - learner: "Il congiuntivo imperfetto, naturalmente: se un'auto a guida autonoma investisse un pedone, diremmo che il sistema ha fallito. Chiedo scusa, a settant'anni la grammatica va sorvegliata quanto i ponti."
  - tutor: "Ecco fatto, e il paragone con i ponti regge. Ora l'obiezione. Noi riteniamo responsabili le società per azioni, che non hanno coscienza né rimorsi. Se una persona giuridica può rispondere, perché non un algoritmo?"
  - learner: "Perché dietro la persona giuridica ci sono sempre persone fisiche: amministratori che deliberano, soci che ne traggono profitto. La società è un modo di organizzare responsabilità umane, non un soggetto morale in più. Quando la condanniamo, puniamo in realtà una rete di decisioni di cui qualcuno, a monte, doveva rispondere."
  - tutor: "Risposta solida. Tuttavia il diritto è pragmatico: potrebbe un domani attribuire alla macchina una personalità giuridica, con un patrimonio per risarcire i danni. A quel punto, il suo «mai» che fine fa?"
    goals: [objection]
  - learner: "Fa una fine onorevole, spero. Concedo senz'altro che il diritto possa creare una simile finzione, e che potrebbe perfino essere utile per risarcire le vittime. Ma sarebbe, appunto, una responsabilità giuridica: uno strumento per distribuire i costi. La tesi morale resta in piedi, perché una finzione non prova rimorso."
  - tutor: "Distinguere il piano giuridico da quello morale Le consente di cedere terreno senza perdere la posizione: ben giocato. Mi dia ora la conclusione, come la scriverebbe nell'ultima riga della relazione."
    goals: [concede]
  - learner: "Scriverei così: alle macchine si può attribuire, per convenzione, l'obbligo di risarcire, ma non la colpa; e poiché la colpa richiede un soggetto capace di riconoscere un dovere, essa ricade interamente su coloro che le macchine le progettano, le addestrano e decidono di impiegarle."
  - tutor: "Sobria, completa e priva di aggettivi inutili: da ingegnere, nel senso migliore. La discuteremo con gli altri dottorandi giovedì. Grazie, dottore, è stato un piacere dubitare di Lei."
    goals: [conclude]

- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [word-choice]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "È un dubbio legittimo, professoressa, e provo a meritarmelo. Sostengo che la responsabilità presupponga la possibilità di agire altrimenti: lodiamo e biasimiamo soltanto chi avrebbe potuto fare una scelta diversa. Una macchina esegue ciò che il suo programma e i suoi dati determinano; dunque non sceglie, e non risponde."
  - tutor: "Formulazione chiara, e proprio per questo vulnerabile. Prima di colpirla, però, mi dica su quale distinzione poggia: che cosa separa, per Lei, un'azione da un semplice evento?"
    goals: [thesis]
  - learner: "Vorrei fare un punto proprio su questo. Un evento accade; un'azione è compiuta da qualcuno per una ragione. Se inciampo e rompo un vaso, è un evento; se lo scaglio a terra per rabbia, è un'azione, perché posso dire perché l'ho fatto. La macchina produce esiti, ma le ragioni sono quelle di chi l'ha costruita."
    errors: [word-choice]
  - tutor: "Fa bene a sollevare un punto così, perché è il cardine della questione, e la coppia evento e azione è ben scelta. Eccole l'obiezione. Anche i suoi neuroni obbediscono a leggi fisiche: se il determinismo assolve la macchina, perché non assolve Lei?"
    goals: [distinguish]
    recast: {text: "fare un punto", fix: "sollevare un punto", tags: [word-choice]}
  - learner: "Sollevare un punto, grazie. L'obiezione è forte, ma non mi pare decisiva. Anche ammesso che il mio cervello sia determinato, io resto sensibile alle ragioni: se Lei mi mostra che sbaglio, posso cambiare idea e condotta. È questa capacità di lasciarsi correggere da un argomento, e non una libertà assoluta, a renderci imputabili."
  - tutor: "Vede però che cosa ha appena fatto? Ha abbandonato il «poter agire altrimenti» per la sensibilità alle ragioni. È un altro criterio, dottoressa, e un sistema che si corregge davanti a nuovi dati potrebbe soddisfarlo."
    goals: [objection]
  - learner: "Ha ragione, e lo riconosco apertamente: il criterio della possibilità alternativa non reggeva, e l'ho sostituito strada facendo. Concedo anche che una macchina futura potrebbe, in linea di principio, soddisfare il nuovo criterio. Tengo ferma però la sostanza: correggere un parametro non equivale a capire di avere torto, e solo la seconda cosa fonda la responsabilità."
  - tutor: "Ammettere di aver cambiato criterio a metà strada richiede più coraggio che difenderlo a oltranza. Bene: raccolga i pezzi e mi dia una conclusione che starebbe in piedi anche davanti a una commissione."
    goals: [concede]
  - learner: "Eccola: è responsabile chi può comprendere una ragione come ragione e modificare per essa la propria condotta; le macchine odierne modificano la condotta senza comprendere, e perciò non sono responsabili, benché nulla escluda in via di principio che un giorno lo diventino."

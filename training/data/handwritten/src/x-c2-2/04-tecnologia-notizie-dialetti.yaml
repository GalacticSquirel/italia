# C2: discussioni tra amici e colleghi su lavoro, tecnologia, notizie e dialetti.
- scenario: intelligenza-artificiale
  level: C2
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "La paura la capisco, ma «metà di noi a casa» mi sembra una profezia da bar. Io la vedo così: molti mestieri cambieranno pelle, pochi spariranno del tutto. E te lo dice uno che ha visto arrivare i computer in un ufficio dove si disegnava ancora a mano."
  - tutor: "Ecco, tu sei ottimista perché sei già in pensione. Cambiare pelle a cinquant'anni non è uno scherzo. Hai qualcosa di più solido dei ricordi di gioventù?"
    goals: [position]
  - learner: "Qualcosa sì. Quando nel mio studio arrivò il disegno al computer, tutti dissero che i disegnatori erano finiti. Dieci anni dopo eravamo il doppio, perché progettare costava meno e i clienti chiedevano di più. È probabile che molti lavori cambieranno allo stesso modo: meno fatica ripetitiva, più richiesta."
    errors: [subjunctive-use]
  - tutor: "La storia dei disegnatori raddoppiati non la conoscevo, e come prova regge. Senti, però: «È probabile che molti lavori cambieranno»? Dopo «è probabile che» ci va un altro modo. Come la sistemi?"
    goals: [evidence]
    prompt: {text: "È probabile che molti lavori cambieranno", tags: [subjunctive-use]}
  - learner: "È probabile che molti lavori cambino. Giusto, il futuro lì non ci sta. Detto questo, una cosa te la concedo: stavolta la velocità è un'altra. Noi abbiamo avuto dieci anni per adattarci; oggi un programma nuovo esce ogni sei mesi, e chi resta indietro rischia davvero di non recuperare."
  - tutor: "Appunto, cambino, e in fretta: è questo che mi toglie il sonno. Mio nipote fa il traduttore e in un anno ha perso metà dei clienti. A lui che cosa racconto, la favola dei disegnatori?"
    goals: [concede]
  - learner: "No, a lui la favola non serve. Gli direi che ha ragione di essere preoccupato e che la differenza la farà la formazione: non corsi di tre giorni, ma tempo e denaro veri, pagati anche da chi con l'automazione guadagna. Forse su questo ci incontriamo: tu temi la tecnologia, io temo che la si lasci governare da sola."
  - tutor: "Che la si lasci governare da sola: ecco, lì mi trovi d'accordo, più che sul tuo ottimismo. Diciamo che tu porti la speranza e io la prudenza, e che servono tutte e due. Versa il vino, che almeno quello lo facciamo ancora a mano."
    goals: [conclude]

- scenario: intelligenza-artificiale
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Io un po' di paura ce l'ho, ma non quella che dici tu. Non credo che resteremo a casa in massa; credo che cambierà chi decide e chi esegue. Se devo riassumere: né apocalisse né paradiso, piuttosto una redistribuzione, e bisogna vedere a favore di chi."
  - tutor: "Redistribuzione, che parola elegante per dire licenziamenti. Voi giovani ci scherzate perché con questi aggeggi ci siete nati. Ma un esempio vero, di qualcuno che non ci ha rimesso, ce l'hai?"
    goals: [position]
  - learner: "Ne ho uno in famiglia. Mia madre lavora in uno studio di commercialisti a Siviglia: da due anni le fatture le registra un programma, e tutti aspettavano i licenziamenti. Invece non hanno mandato via nessuno; lei adesso passa le giornate a spiegare ai clienti che cosa significano i numeri, cosa che prima non aveva mai tempo di fare. Dice che lavora più con la testa e meno con le dita."
  - tutor: "Tua madre è stata fortunata, o ha un capo intelligente. Ma pensa a chi nello studio faceva solo quello, registrare fatture, e non sa spiegare niente a nessuno. Per uno così, la tua redistribuzione come finisce?"
    goals: [evidence]
  - learner: "Finisce male, se nessuno lo aiuta, e qui hai ragione tu. Non tutti possono reinventarsi consulenti da un giorno all'altro, e dire «basta formarsi» a un cinquantenne è una presa in giro. Ti concedo anche che i primi a pagare saranno i meno qualificati, cioè quelli che avevano già meno."
  - tutor: "Oh, finalmente qualcuno che lo ammette senza girarci intorno. E allora, se siamo d'accordo che qualcuno pagherà, in che cosa saremmo diversi, tu e io?"
    goals: [concede]
  - learner: "Nel tono, più che nella sostanza. Tu dici «andrà male», io dico «andrà come decideremo». Ma su un punto la pensiamo uguale: se si lasciasse tutto al mercato, il conto arriverebbe ai soliti. Quindi il problema non è la macchina, è chi ne incassa i vantaggi, e mi pare che su questo possiamo brindare insieme."
  - tutor: "Sul conto che arriva sempre ai soliti brindo volentieri, anche da pessimista. Diciamo che abbiamo paura della stessa cosa con due caratteri diversi. Dai, passami il pane, che il sugo almeno non l'ha fatto un algoritmo."
    goals: [conclude]

- scenario: politica-lavoro
  level: C2
  persona: en-f-professional
  history: [false-friend]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Attualmente, non sono d'accordo. Metà mi sembra una cifra buttata lì per fare effetto. Secondo me spariranno molte mansioni, non molti mestieri: il mio lavoro di dieci anni fa non esiste più, eppure io sono ancora qui, e ho più da fare di prima."
    errors: [false-friend]
  - tutor: "In realtà non sei d'accordo, e chissà perché me lo aspettavo. Mansioni e non mestieri: bella distinzione. Ma facciamo un'ipotesi cattiva: domani un programma scrive le campagne meglio di te. Che succede?"
    goals: [opinion]
    recast: {text: "Attualmente, non sono d'accordo", fix: "In realtà non sei d'accordo", tags: [false-friend]}
  - learner: "In realtà, sì, grazie: l'inglese «actually» mi frega ancora. Se domani un programma scrivesse le campagne meglio di me, smetterei di scriverle e passerei a decidere quali valgono la pena. Qualcuno dovrebbe pur capire il cliente, dire di no alle idee brutte e prendersi la colpa quando va male. Se poi la macchina sapesse fare anche questo, allora sì, aprirei un agriturismo."
  - tutor: "L'agriturismo è il piano di riserva di tutti i milanesi, lo sai? Va bene, in teoria fila. Ma io voglio un caso vero, non un'ipotesi: dove l'hai visto succedere?"
    goals: [hypothesis]
  - learner: "Nel mio ufficio, l'anno scorso. Avevamo tre grafici che passavano le giornate a ridimensionare immagini per i vari formati. Adesso lo fa un programma in dieci secondi. Due di loro si occupano della direzione creativa e guadagnano di più; la terza, però, non ha voluto o potuto cambiare, e a giugno se n'è andata. Quindi non ti racconto che va tutto bene: due su tre."
  - tutor: "Due su tre. E la terza è proprio quella di cui parlo io, guarda caso. Almeno sei onesta, non mi vendi il paradiso. Allora, tira le somme."
    goals: [example]
  - learner: "Le tiro così: il lavoro non finisce, si sposta, e nello spostamento qualcuno cade. La differenza la fanno la formazione e il tempo che un'azienda è disposta a concedere. Ma tu, Riccardo, che fai lo scettico di professione: se avessi vent'anni oggi, che mestiere sceglieresti?"
  - tutor: "Bella domanda, e cattiva. L'idraulico, credo: nessun programma si infila sotto un lavandino. Sul resto mi hai convinto a metà, che per le mie abitudini è un trionfo. Su, ordiniamo il dolce prima che automatizzino anche quello."
    goals: [conclude]

- scenario: politica-lavoro
  level: C2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che metà è troppo, ma che un terzo non mi stupirebbe. Mio nonno faceva il sarto in Calabria e ripeteva che il suo mestiere sarebbe morto con lui. Aveva ragione a metà: i sarti di paese sono spariti, ma i vestiti si fanno ancora, solo che li fa qualcun altro, da un'altra parte."
  - tutor: "Vedi che tuo nonno la pensava come me? I sarti sono spariti, punto. Che i vestiti li cucia qualcuno dall'altra parte del mondo, a lui che gliene veniva? Prova a immaginare che succeda a te."
    goals: [opinion]
  - learner: "Ci provo. Se la mia azienda automatizzasse il magazzino, e ci sta pensando, io che ci lavoro avrei due strade: imparare a far funzionare i robot oppure cercarmi altro. Di robot, a una fiera a Bologna, ho visti tanti: fanno paura per quanto sono veloci, ma si bloccano per una scatola storta, e lì serve ancora una persona."
    errors: [ci-ne]
  - tutor: "La scatola storta che ferma il robot mi consola poco, ma mi consola. Aspetta un attimo, però: «Di robot ho visti tanti»? Lì manca una parolina, piccola piccola, davanti al verbo."
    goals: [hypothesis]
    prompt: {text: "ho visti tanti", tags: [ci-ne]}
  - learner: "Ne ho visti tanti, giusto. È la parolina che mia nonna metteva dappertutto e io mai. Comunque, un esempio concreto ce l'ho: mio cugino a Toronto guidava i camion nel porto. Hanno messo le gru automatiche e lui adesso le controlla da una sala con sei schermi. Stesso stipendio, schiena salva. Però erano in quaranta e ne hanno tenuti dodici."
  - tutor: "Ne hanno tenuti dodici su quaranta: ecco, e stavolta la parolina l'hai messa da solo. Tuo cugino è tra i fortunati, gli altri ventotto fanno numero nella mia statistica. Dove vuoi arrivare?"
    goals: [example]
  - learner: "Voglio arrivare qui: hai ragione sui numeri e torto sul tono. I posti calano, ma quelli che restano sono migliori, e la partita vera è che cosa si fa per i ventotto. Tu però da un'ora fai domande e non rispondi mai: secondo te che cosa si dovrebbe fare, in pratica?"
  - tutor: "Mi hai incastrato, bravo. In pratica? Tassare un po' chi risparmia con i robot e pagarci la scuola a chi resta fuori, anche se dubito che lo faranno. Per stasera chiudiamola in pareggio, e il prossimo giro lo offro io."
    goals: [conclude]

- scenario: notizie-attualita
  level: C2
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "Me la sono fatta a fatica, perché ognuno la racconta a modo suo. Da quel che ho capito, chi affitta ai turisti dovrà registrarsi con un codice nazionale, non potrà superare un certo numero di notti all'anno nei centri storici, e i comuni potranno fissare un tetto alle licenze. Le multe, per chi non si adegua, sono salate."
  - tutor: "Meglio di come l'ha spiegata il telegiornale, che ha parlato solo delle multe. Ma a te convince? Perché io, quando sento «tetto» e «codice nazionale», penso subito a nuove carte da compilare."
    goals: [summarise]
  - learner: "Mi convince l'intenzione, meno lo strumento. Che un quartiere non possa diventare un albergo diffuso mi pare sacrosanto: nel mio palazzo, su dodici appartamenti, cinque hanno la cassetta per le chiavi. Però temo che la legge colpisca la vedova con una stanza quanto la società con quaranta appartamenti, e non mi sembra giusto che vengano trattate allo stesso modo."
  - tutor: "La vedova e la società con quaranta appartamenti: è il punto debole, e l'hanno scritto in pochi. A proposito, tu dove l'hai seguita? Perché io ho letto tre giornali e sembravano tre leggi diverse."
    goals: [opinion]
  - learner: "Ho avuto la stessa impressione. Ieri nel giornale locale c'era scritto che la legge avrebbe «salvato il centro storico», con la foto del sindaco sorridente. Un quotidiano economico, invece, sosteneva che avrebbe fatto crollare il valore delle case. E il sito che seguo di solito è stato l'unico a pubblicare il testo e a far parlare un inquilino."
    errors: [preposition]
  - tutor: "Un inquilino, pensa: l'unico che in questa storia ci abita davvero. Solo una cosa, da collega pignolo: «nel giornale locale c'era scritto»? Con i giornali, in italiano, la preposizione è un'altra. Ti viene?"
    goals: [sources]
    prompt: {text: "nel giornale locale", tags: [preposition]}
  - learner: "Sul giornale locale, è vero: in spagnolo diciamo «en el periódico» e lo traduco pari pari. Quanto alle conseguenze, se dovessi scommettere direi che nel primo anno cambierà poco: i grandi troveranno il modo di aggirare la legge, e i piccoli venderanno. Se invece i comuni facessero davvero i controlli, qualche casa tornerebbe sul mercato degli affitti normali, e i prezzi si calmerebbero."
  - tutor: "Sul giornale, appunto. E la tua scommessa è anche la mia: tutto dipende dai controlli, cioè dalla parte che in Italia ci riesce peggio. Vedremo tra un anno chi dei due deve un caffè all'altro; intanto questo lo offro io."
    goals: [consequences]

- scenario: notizie-attualita
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Un'idea confusa, a dirla tutta. In sostanza il governo vuole mettere un freno a chi affitta le case ai turisti per pochi giorni: registrazione obbligatoria, un minimo di due notti nelle grandi città e più potere ai sindaci. Ho capito bene, o mi sono perso qualche pezzo?"
  - tutor: "Hai capito benissimo, e ti sei perso solo il pezzo che si sono persi tutti: i decreti per applicarla non ci sono ancora. Ma dimmi tu, che in quegli appartamenti ci hai dormito mezza vita: è giusta o no?"
    goals: [summarise]
  - learner: "Ecco, mi tocca fare l'esame di coscienza. Da viaggiatore mi è sempre convenuto: spendevo la metà di un albergo e avevo una cucina. Da quando abito qui, però, la vedo dall'altra parte: ho cercato casa per quattro mesi, e i proprietari mi dicevano chiaramente che con i turisti guadagnavano il triplo. Quindi direi che è giusta, anche se arriva tardi e un po' mi condanna."
  - tutor: "Un pentito, addirittura. Però ragioni bene: stessa persona, due punti di vista. E i giornali, li hai guardati? Io ne ho letti quattro e mi è venuto il mal di testa."
    goals: [opinion]
  - learner: "Ne ho guardati due, più un sacco di commenti in rete. Il quotidiano che compra il mio capo titolava che la legge era «un attacco alla proprietà privata», come se venissero a prenderti le chiavi. Quello che leggo io parlava di «primo passo timido». La cosa buffa è che citavano lo stesso ministro: uno riportava che avrebbe difeso i residenti, l'altro che aveva promesso di non toccare i piccoli proprietari."
  - tutor: "Stesso ministro, due frasi, due titoli: benvenuto nella stampa italiana. Ognuno taglia la citazione dove gli fa comodo. E secondo te, alla fine, che cosa cambierà davvero?"
    goals: [sources]
  - learner: "Poco subito, qualcosa col tempo. Immagino che i prezzi per i turisti saliranno, perché ci saranno meno appartamenti, e che qualcuno tornerà ad affittare a chi lavora. Ma se nessuno controllasse, e ho il sospetto che andrà così, tra due anni saremmo qui a parlare di una nuova legge per far rispettare la vecchia."
  - tutor: "Una nuova legge per far rispettare la vecchia: l'hai detta da italiano vero, ormai sei dei nostri. Speriamo di sbagliarci tutti e due. Dai, torniamo alle scrivanie prima che si accorgano che manchiamo."
    goals: [consequences]

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho vista ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Capito è una parola grossa: avrò afferrato una frase su tre. Ridevo perché uno dei due ha detto qualcosa come «mo' vengo» e l'altro ha risposto «statte buono», e mi sono accorta che riuscivo a seguire il tono anche senza le parole. A Bologna, dove studio, la gente parla in tutt'altro modo: più lenta, con quelle esse strane."
  - tutor: "La esse bolognese, quella che sembra passata nel burro! Hai orecchio, complimenti. E «mo'» vuol dire «adesso»: lo sentirai da Roma in giù. C'è qualche altra parola che ti ha incuriosita, in questi anni?"
    goals: [notice]
  - learner: "Una su tutte: «tenere» al posto di «avere». I miei coinquilini di Bari dicono «tengo fame», «tengo sonno», e all'inizio pensavo che scherzassero. E poi c'è il verbo «stare»: «sto a casa» lo capisco, ma «il libro sta sul tavolo» a lezione mi avevano detto che era sbagliato. È dialetto o è italiano?"
  - tutor: "Bella domanda, da linguista. Non è dialetto: è italiano regionale del Sud, cioè italiano con il sapore del posto. «Tengo fame» a un esame non lo scriverei, ma a Napoli è la cosa più naturale del mondo. Tu come te la immagini, la differenza tra dialetto e lingua?"
    goals: [example]
  - learner: "Me la immagino come una scala, più che come un muro. In fondo c'è il dialetto vero, quello che non capirei mai; in cima c'è l'italiano dei telegiornali, che in realtà non parla nessuno; e in mezzo ci stanno tutti, salendo e scendendo a seconda di chi hanno davanti. I signori di prima, con il controllore, hanno cambiato registro in mezzo secondo."
  - tutor: "Una scala: è esattamente l'immagine che usiamo noi, e la scena del controllore vale una lezione intera. Si sale e si scende, e saperlo fare è una ricchezza. Ma allora, secondo te, i dialetti vanno protetti o è una battaglia di nostalgici?"
    goals: [standard]
  - learner: "Protetti sì, imbalsamati no. Mi sembra giusto che si registrino, che si studino, che i nonni li parlino ai nipoti senza vergognarsene. Insegnarli a scuola per obbligo, invece, mi convince poco: una lingua che sopravvive solo perché c'è il compito in classe è già un pezzo da museo. In Inghilterra abbiamo perso quasi tutto, e ora ce ne pentiamo."
  - tutor: "«Protetti sì, imbalsamati no»: te la rubo per il prossimo convegno, citando la fonte. Un dialetto vive se serve a dirsi le cose di casa, non se finisce in una teca. Senti, a Napoli scendo anch'io: ti porto a sentire il napoletano vero, davanti a un caffè."
    goals: [opinion]

- scenario: dialetti-regionali
  level: C2
  persona: es-m-worker
  history: [comparative]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Ho capito abbastanza, perché in cucina ho due colleghi di Salerno che parlano così tutto il giorno. Ridevo perché uno ha detto «jamme, jamme» e a Buenos Aires mio nonno, che era di Avellino, lo diceva per farci sbrigare. Mi è sembrato di sentirlo. Quello che noto, lavorando a Bologna, è che al Nord le vocali le tagliano e al Sud le allungano."
  - tutor: "Un nonno di Avellino a Buenos Aires: allora sei mezzo dei nostri! E sulle vocali hai visto giusto, è una delle differenze più nette. In cucina, poi, ne sentirai di parole strane. Ce n'è una che non hai mai capito fino in fondo?"
    goals: [notice]
  - learner: "Una sì: «sfizio». I ragazzi di Salerno dicono «mi è venuto lo sfizio», «un piatto sfizioso», e il capo, che è bolognese, lo usa anche lui. Capisco che è una voglia, un capriccio, ma non so se sia dialetto. E poi il napoletano mi pare più difficile che il bolognese: il bolognese almeno, in cucina, non lo parla più nessuno."
    errors: [comparative]
  - tutor: "«Sfizio» è nato a Napoli e ha conquistato tutta l'Italia: è la voglia di qualcosa di cui non hai bisogno, e proprio per questo la vuoi. Senti però: «più difficile che il bolognese»? Fra due nomi, quel paragone come si costruisce?"
    goals: [example]
    prompt: {text: "più difficile che il bolognese", tags: [comparative]}
    new: [{lemma: sfizio, gloss: "whim, fancy"}]
  - learner: "Più difficile del bolognese, scusa: in castigliano diciamo «que» e non me lo tolgo. Comunque è curioso: mio nonno diceva di parlare italiano, e quando sono arrivato qui ho scoperto che parlava avellinese. L'italiano l'ho imparato dopo, alla scuola serale. Per lui dialetto e lingua erano la stessa cosa, o meglio, la lingua era quella di casa."
  - tutor: "Del bolognese, perfetto. E la storia di tuo nonno è quella di milioni di emigrati: partirono prima che l'italiano diventasse la lingua di tutti, e la televisione fece il resto. Oggi il dialetto rischia di sparire: secondo te vale la pena difenderlo?"
    goals: [standard]
  - learner: "Secondo me sì, ma senza farne una bandiera. Il dialetto di mio nonno mi ha dato una famiglia; l'italiano mi ha dato un lavoro e la possibilità di parlare con un veneto e con un siciliano. Servono tutti e due. Quello che non mi piace è quando si usa il dialetto per chiudere la porta a chi viene da fuori: una lingua dovrebbe aprire, non escludere."
  - tutor: "Il dialetto per la famiglia, l'italiano per il mondo, e nessuno dei due come muro: è una posizione saggia, e non la sento spesso. Tuo nonno sarebbe contento di come parli. Vieni, che al vagone bar c'è un caffè quasi decente: te lo offro io."
    goals: [opinion]

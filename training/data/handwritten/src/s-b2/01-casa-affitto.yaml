# s-b2: B2 renting and negotiating a flat.
- scenario: affittare-appartamento
  level: B2
  persona: es-f-teacher
  history: [ci-ne, relative-pronoun]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno. È luminoso, mi piace. L'annuncio diceva 720 euro: le spese di condominio sono incluse?"
  - tutor: "No, quelle sono a parte: circa 70 euro al mese, per la pulizia delle scale e il giardino. Vuole vedere anche la cucina?"
    goals: [rent]
  - learner: "Sì, grazie. E il riscaldamento com'è? Nella casa dove abito adesso d'inverno fa sempre freddo."
  - tutor: "Qui è autonomo, con una caldaia cambiata l'anno scorso. Anche la lavatrice e il forno sono nuovi."
    goals: [condition]
    new: [{lemma: caldaia, gloss: boiler}]
  - learner: "Perfetto. Ho due figli piccoli, e la scuola che vanno adesso è dall'altra parte della città."
    errors: [relative-pronoun]
  - tutor: "Allora il quartiere conta molto, glielo dico subito. Prima però ascolti: «la scuola che vanno». Qui «che» da solo non basta: con «andare» serve una preposizione. Quale aggiungerebbe?"
    prompt: {text: "la scuola che vanno", tags: [relative-pronoun]}
  - learner: "Giusto: la scuola in cui vanno adesso è lontana. Qui vicino c'è una scuola elementare?"
  - tutor: "Esatto. Sì, ce n'è una in fondo alla via, e la fermata del tram è proprio davanti al portone."
    goals: [neighbourhood]
  - learner: "Che fortuna. Lei vuole vedere le mie buste paga? Io ho solo due, perché lavoro in questa scuola da febbraio."
    errors: [ci-ne]
  - tutor: "Due bastano, non si preoccupi. Però «io ho solo due»: due buste paga, certo, ma in italiano le riprendiamo con un pronome prima del verbo. Quale?"
    prompt: {text: "Io ho solo due", tags: [ci-ne]}
  - learner: "Ah, certo: ne ho solo due."
  - tutor: "Perfetto. Il contratto è di quattro anni più quattro, con due mesi di caparra. Le buste paga me le porta quando firmiamo."
    goals: [contract]
  - learner: "Va bene. Stasera ne parlo con mio marito e la richiamo domani mattina."
  - tutor: "Benissimo, aspetto la sua telefonata. Se decidete di prenderlo, possiamo firmare già lunedì."
    goals: [decide]

- scenario: affittare-appartamento
  level: B2
  persona: en-m-traveller
  history: [participle-agreement, combined-pronouns]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno. Le foto dell'annuncio erano belle, ma dal vivo è ancora meglio. Quanto viene l'affitto al mese?"
  - tutor: "Sono 950 euro, spese di condominio comprese. Non è poco, lo so, ma siamo a cinque minuti dalla metropolitana."
    goals: [rent]
  - learner: "Capisco. Io lavoro in centro, quindi la metro è importante. L'appartamento è arredato?"
  - tutor: "Sì, completamente. I mobili della cucina li abbiamo cambiati due anni fa, e il frigorifero è nuovissimo."
  - learner: "E il riscaldamento? Nel mio ultimo appartamento i termosifoni non funzionavano mai, e il proprietario non li ha mai riparato."
    errors: [participle-agreement]
  - tutor: "Che inverni avrà passato! Qui il riscaldamento funziona benissimo. Ma «non li ha mai riparato»: «li» sono i termosifoni, quindi «riparato» come deve finire?"
    prompt: {text: "non li ha mai riparato", tags: [participle-agreement]}
    goals: [condition]
  - learner: "Ah, giusto: non li ha mai riparati. Per fortuna me ne sono andato!"
  - tutor: "Esatto. Qui non avrà questo problema: la caldaia viene controllata ogni anno. Passiamo al contratto?"
    new: [{lemma: caldaia, gloss: boiler}]
  - learner: "Sì. Quanto chiede di caparra? E il contratto me lo può mandare prima per email? Lo vorrei leggere con calma."
  - tutor: "Chiedo tre mesi di caparra, e il contratto è di tre anni più due. Certo, glielo mando stasera stessa."
    goals: [contract]
  - learner: "Grazie. Ultima domanda: com'è il quartiere la sera? Un mio amico abita qui vicino e dice che è un po' rumoroso."
  - tutor: "Il venerdì e il sabato c'è un po' di movimento per via dei locali, ma le camere danno sul cortile, quindi si dorme tranquilli."
    goals: [neighbourhood]
  - learner: "Allora per me va bene. Quando mi manda il contratto, gli lo faccio vedere anche al mio avvocato."
    errors: [combined-pronouns]
  - tutor: "Ottimo. Solo un dettaglio: «gli lo faccio vedere». Quando «gli» e «lo» si incontrano, diventano una parola sola: come?"
    prompt: {text: "gli lo faccio vedere", tags: [combined-pronouns]}
  - learner: "Glielo faccio vedere, certo. Poi la chiamo venerdì."
  - tutor: "Perfetto, aspetto la sua chiamata venerdì. Fino ad allora l'appartamento non lo mostro a nessun altro."
    goals: [decide]

- scenario: affittare-appartamento
  level: B2
  persona: es-m-worker
  history: [subjunctive-use, preposition]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno. Prima di tutto, quanto costa? Nell'annuncio il prezzo non c'era."
  - tutor: "Sono 680 euro al mese, più circa 50 di spese per l'acqua e la pulizia delle scale."
    goals: [rent]
  - learner: "Va bene, rientra nel mio budget. Però è importante che l'appartamento è vicino al lavoro, perché non ho la macchina."
    errors: [subjunctive-use]
  - tutor: "Capisco. Ma ascolti: «è importante che l'appartamento è vicino». Dopo «è importante che», va bene questo modo del verbo?"
    prompt: {text: "è importante che l'appartamento è vicino", tags: [subjunctive-use]}
  - learner: "No, è importante che sia vicino al lavoro. Lavoro in un'officina in via Mazzini."
  - tutor: "Esatto. Via Mazzini è a dieci minuti a piedi. E il quartiere è tranquillo, con un mercato tutte le mattine."
    goals: [neighbourhood]
  - learner: "Che bello. Ho deciso a cambiare casa perché adesso divido l'appartamento con tre persone e non dormo mai."
    errors: [preposition]
  - tutor: "Tre persone in casa, immagino la confusione! Però «ho deciso a cambiare»: con «decidere», quale preposizione va prima dell'infinito?"
    prompt: {text: "Ho deciso a cambiare", tags: [preposition]}
  - learner: "Sì, ho deciso a cambiare casa, perché voglio stare da solo."
    errors: [preposition]
  - tutor: "«Ho deciso di cambiare casa»: lo capisco benissimo. Qui sarebbe tutto per lei: una camera, un piccolo studio e il bagno con la finestra."
    recast: {text: "deciso a cambiare", fix: "deciso di cambiare", tags: [preposition]}
  - learner: "E il riscaldamento funziona bene? Mi hanno detto che in questa zona gli inverni sono umidi."
  - tutor: "Il riscaldamento è autonomo e le finestre sono state cambiate l'anno scorso, quindi l'umidità non è un problema."
    goals: [condition]
  - learner: "Perfetto. E il contratto? Vorrei firmarlo per almeno due anni."
  - tutor: "Il contratto è di tre anni più due, con una caparra di due mesi. Le andrebbe bene?"
    goals: [contract]
  - learner: "Sì, mi va bene. Credo di prenderlo, ma prima vorrei tornare a vederlo di sera, per sentire i rumori."
  - tutor: "Ottima idea. Può venire giovedì alle sette? Così poi mi dà una risposta definitiva."
    goals: [decide]

- scenario: affittare-appartamento
  level: B2
  persona: en-f-student
  history: [ci-ne, subject-verb-agreement]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno! Sono Emily, ho chiamato ieri per l'annuncio. Il soggiorno è enorme!"
  - tutor: "Piacere, Emily. Sì, è la stanza più grande della casa, con due finestre sul parco. Lei studia qui in città?"
  - learner: "Sì, studio architettura al Politecnico. Quanto tempo vuole per arrivare all'università con i mezzi?"
    errors: [ci-ne]
  - tutor: "Il Politecnico, che bello! Però «quanto tempo vuole» sembra chiedere quanto tempo voglio io. Per il tempo necessario, che cosa mettiamo davanti a «vuole»?"
    prompt: {text: "Quanto tempo vuole", tags: [ci-ne]}
  - learner: "Quanto tempo ci vuole, giusto!"
  - tutor: "Esatto! Ci vogliono venti minuti con il tram, che passa ogni dieci minuti qui sotto."
    goals: [neighbourhood]
  - learner: "Perfetto. E quanto costa l'affitto? Io e una mia amica cerchiamo una casa da dividere."
  - tutor: "Sono 1.000 euro in tutto, spese comprese, quindi 500 a testa. Le due camere sono uguali, così non dovrete discutere su chi prende la più grande."
    goals: [rent]
  - learner: "Ottimo. Il contratto lo deve firmare tutte e due, o basta una persona?"
    errors: [subject-verb-agreement]
  - tutor: "Bella domanda. Ma «lo deve firmare tutte e due»: il soggetto sono due persone. Come cambia il verbo?"
    prompt: {text: "lo deve firmare tutte e due", tags: [subject-verb-agreement]}
  - learner: "Lo devono firmare tutte e due?"
  - tutor: "Sì, tutte e due. Chiedo anche la firma dei vostri genitori, visto che ancora studiate. La caparra è di due mesi."
    goals: [contract]
  - learner: "Va bene, i miei genitori sono d'accordo. Ma se il riscaldamento si rompe a gennaio, chi paga la riparazione?"
  - tutor: "Le riparazioni importanti le pago io, quelle piccole voi. Comunque la caldaia ha solo tre anni e viene controllata ogni autunno."
    goals: [condition]
    new: [{lemma: caldaia, gloss: boiler}]
  - learner: "Mi sembra giusto. Allora lo prendiamo! Lo dico alla mia amica e domani le mando i nostri documenti."
  - tutor: "Perfetto, aspetto i documenti domani. Così la settimana prossima firmiamo e vi consegno le chiavi."
    goals: [decide]

- scenario: trattativa-affitto
  level: B2
  persona: en-f-professional
  history: [hypothetical, ci-ne]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto, soprattutto la terrazza. Però il canone mi sembra un po' alto per la zona: 1.300 euro sono tanti."
  - tutor: "Capisco. Il proprietario ha appena rifatto la cucina e i bagni, quindi il prezzo è giustificato. Cosa la preoccupa di più?"
    goals: [interest]
  - learner: "Soprattutto il canone. Se il proprietario accetterebbe 1.150 euro, firmerei anche domani."
    errors: [hypothetical]
  - tutor: "Una proposta chiara, mi piace. Ma «se il proprietario accetterebbe»: dopo «se», in una frase come questa, il condizionale va bene?"
    prompt: {text: "Se il proprietario accetterebbe", tags: [hypothetical]}
  - learner: "No, scusi: se il proprietario accettasse 1.150 euro, firmerei domani."
  - tutor: "Esatto. Glielo propongo oggi stesso, ma dubito che scenda così tanto. Forse a 1.200 si può arrivare."
  - learner: "1.200 euro va bene, ma allora vorrei che le spese di condominio sono incluse."
    errors: [subjunctive-use]
  - tutor: "Si può chiedere. Però ascolti: «vorrei che le spese sono incluse». Dopo «vorrei che», quale modo e quale tempo ci vogliono?"
    prompt: {text: "vorrei che le spese di condominio sono incluse", tags: [subjunctive-use]}
  - learner: "Vorrei che le spese siano incluse."
    errors: [subjunctive-use]
  - tutor: "Ho capito: vorrebbe che le spese fossero incluse nei 1.200 euro. È una richiesta ragionevole, la giro al proprietario."
    recast: {text: "siano incluse", fix: "fossero incluse", tags: [subjunctive-use]}
    goals: [negotiate]
  - learner: "Grazie. E quanto dura il contratto? Ho paura di dover lasciare l'appartamento se la mia azienda mi manda all'estero."
  - tutor: "È un quattro più quattro, ma lei può dare disdetta in qualsiasi momento con sei mesi di preavviso."
    new: [{lemma: disdetta, gloss: notice of termination}, {lemma: preavviso, gloss: notice period}]
  - learner: "Sei mesi sono tanti. Ne vorrei tre, se è possibile."
  - tutor: "Tre sono pochi per un proprietario, ma quattro potrebbero andare. Quindi: 1.200 euro spese incluse e quattro mesi di preavviso. Se lui è d'accordo, procediamo?"
    goals: [conditions]
  - learner: "Sì, a queste condizioni ci sto. Aspetto la sua telefonata."
  - tutor: "Perfetto. Lo sento oggi pomeriggio e la richiamo entro stasera con la risposta."
    goals: [conclude]

- scenario: trattativa-affitto
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun, subjunctive-use]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Mi è piaciuto, sì. È luminoso e la zona è tranquilla. Però mi preoccupa la provvigione dell'agenzia: quant'è?"
  - tutor: "La provvigione è pari a un mese di affitto, quindi 850 euro più IVA. È quello che chiediamo a tutti i clienti."
    goals: [interest]
    new: [{lemma: provvigione, gloss: agency fee}]
  - learner: "Un mese intero? L'agenzia che ho trovato il mio ultimo appartamento chiedeva la metà."
    errors: [relative-pronoun]
  - tutor: "Ogni agenzia ha i suoi prezzi. Ma «l'agenzia che ho trovato l'appartamento»: l'ha trovato attraverso l'agenzia, quindi il «che» da solo non basta. Come la sistemerebbe?"
    prompt: {text: "L'agenzia che ho trovato il mio ultimo appartamento", tags: [relative-pronoun]}
  - learner: "L'agenzia con cui ho trovato il mio ultimo appartamento chiedeva la metà."
  - tutor: "Esatto. Le posso venire incontro: se firma entro venerdì, la provvigione scende a 600 euro."
  - learner: "È già meglio. E il canone? 850 euro è trattabile, o il proprietario non vuole scendere?"
  - tutor: "Il proprietario è disposto a scendere a 820 euro, ma solo se il contratto dura almeno quattro anni."
    goals: [negotiate]
  - learner: "Quattro anni mi vanno bene, a patto che posso andarmene prima se cambio città."
    errors: [subjunctive-use]
  - tutor: "Ragionevole. Però «a patto che posso»: «a patto che» vuole un modo particolare del verbo. Quale?"
    prompt: {text: "a patto che posso", tags: [subjunctive-use]}
  - learner: "A patto che io possa andarmene prima, certo."
  - tutor: "Perfetto. In quel caso basta una disdetta con sei mesi di preavviso, e lo scriviamo chiaramente nel contratto."
    goals: [conditions]
    new: [{lemma: disdetta, gloss: notice of termination}, {lemma: preavviso, gloss: notice period}]
  - learner: "Benissimo. Allora possiamo procedere. Quando firmiamo?"
  - tutor: "Giovedì alle dieci, qui in agenzia. Porti un documento d'identità e le ultime tre buste paga."
    goals: [conclude]

- scenario: trattativa-affitto
  level: B2
  persona: en-m-heritage
  history: [conditional-form, combined-pronouns]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, è bellissimo, ma la camera da letto dà sulla strada e io ho il sonno leggero."
  - tutor: "È vero, è l'unica stanza sulla strada. Però le finestre hanno il doppio vetro: di notte si sente pochissimo."
    goals: [interest]
  - learner: "Speriamo. Il canone è 1.050 euro, giusto? Potrebbe chiedere al proprietario se accettarebbe 950?"
    errors: [conditional-form]
  - tutor: "Posso provarci. Ma «accettarebbe»: provi a dirlo prima al futuro, e poi trasformi il futuro in condizionale."
    prompt: {text: "accettarebbe", tags: [conditional-form]}
  - learner: "Accetterebbe 950, giusto?"
  - tutor: "Giusto. Novecentocinquanta è difficile, ma potrei proporre mille euro al proprietario, se lei accetta un contratto di quattro anni."
    goals: [negotiate]
  - learner: "Mille euro va bene. E se dovessi andarmene prima? Il mio contratto di lavoro scade fra due anni."
  - tutor: "Può dare disdetta per gravi motivi, come un trasferimento di lavoro, con sei mesi di preavviso."
    goals: [conditions]
    new: [{lemma: disdetta, gloss: notice of termination}, {lemma: preavviso, gloss: notice period}]
  - learner: "Perfetto. Mi può mandare una bozza del contratto? Mio padre mi fa da garante e vorrebbe leggerla prima."
  - tutor: "Certo, gliela mando stasera per email. Suo padre può firmare la garanzia anche a distanza, se abita lontano."
    new: [{lemma: bozza, gloss: draft}]
  - learner: "Grazie. Appena la ricevo, gli la giro subito."
    errors: [combined-pronouns]
  - tutor: "Benissimo. Solo una cosa: «gli la giro». Con «gli» davanti a «la», che forma unica si ottiene?"
    prompt: {text: "gli la giro", tags: [combined-pronouns]}
  - learner: "Sì, gli la giro appena arriva."
    errors: [combined-pronouns]
  - tutor: "«Appena la ricevo, gliela giro»: perfetto. Aspettiamo il parere di suo padre e poi fissiamo la firma."
    recast: {text: "gli la giro", fix: "gliela giro", tags: [combined-pronouns]}
  - learner: "D'accordo. Se è tutto a posto, firmiamo la settimana prossima."
  - tutor: "Allora siamo d'accordo: mille euro al mese e quattro anni di contratto. La chiamo appena suo padre ha letto la bozza."
    goals: [conclude]

- scenario: trattativa-affitto
  level: B2
  persona: es-m-worker
  history: [passive, ci-ne]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, mi è piaciuto. Però ho visto una macchia di umidità nel bagno. È stata riparata?"
  - tutor: "Non ancora, ma il proprietario ha già chiamato l'idraulico: il lavoro sarà fatto prima che lei entri."
    goals: [interest]
  - learner: "Bene. E la cucina mi sembra un po' vecchia. Gli elettrodomestici sono stato comprati quando?"
    errors: [passive]
  - tutor: "Hanno qualche anno, è vero. Ma «sono stato comprati»: il soggetto è «gli elettrodomestici», quindi anche «stato» deve concordare. Come diventa?"
    prompt: {text: "sono stato comprati", tags: [passive]}
  - learner: "Sono stati comprati quando?"
  - tutor: "Esatto. Nel 2016, ma funzionano tutti bene. Il forno, però, è un po' lento."
  - learner: "Allora, considerando la cucina, si potrebbe fare uno sconto sul canone? Pensavo a 50 euro in meno."
  - tutor: "Il proprietario non vuole abbassare il canone, ma è disposto a cambiare il forno a spese sue. Le serve anche un posto auto in garage?"
    goals: [negotiate]
  - learner: "Sì, abbiamo due macchine, quindi vorrei due, se possibile."
    errors: [ci-ne]
  - tutor: "Due macchine, d'accordo. Ma «vorrei due»: due cosa? La parola che riprende «posti auto» va messa davanti al verbo."
    prompt: {text: "vorrei due", tags: [ci-ne]}
  - learner: "Ah, sì: ne vorrei due."
  - tutor: "Perfetto. Ce ne sono due liberi, a 80 euro al mese l'uno. Il contratto, invece, è di quattro anni più quattro."
  - learner: "Quattro anni va bene. Ma se perdo il lavoro, posso cancellare il contratto?"
    errors: [word-choice]
  - tutor: "Sì, per gravi motivi può disdire il contratto con sei mesi di preavviso, senza pagare altro. Lo scriviamo chiaramente."
    recast: {text: "cancellare il contratto", fix: "disdire il contratto", tags: [word-choice]}
    goals: [conditions]
    new: [{lemma: disdire, gloss: to terminate (a contract)}, {lemma: preavviso, gloss: notice period}]
  - learner: "Perfetto. Allora accetto, con il forno nuovo e i due posti auto."
  - tutor: "Benissimo. Preparo il contratto e ci vediamo lunedì mattina in agenzia per la firma."
    goals: [conclude]

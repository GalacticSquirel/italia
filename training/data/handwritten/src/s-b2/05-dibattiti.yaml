# s-b2: B2 debates on the city centre and the future of work.
- scenario: dibattito-ambiente
  level: B2
  persona: en-f-professional
  history: [subjunctive-use, ci-ne]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io non sono d'accordo. Penso che una zona pedonale è un vantaggio anche per i negozi."
    errors: [subjunctive-use]
  - tutor: "Vedremo. Ma «penso che una zona pedonale è»: dopo «penso che», in una discussione come questa, quale modo usiamo?"
    prompt: {text: "Penso che una zona pedonale è", tags: [subjunctive-use]}
  - learner: "Penso che sia un vantaggio anche per i negozi."
  - tutor: "Esatto. Ma perché dovrebbe essere un vantaggio? I clienti arrivano in macchina."
    goals: [position]
  - learner: "Non tutti. In molte città europee hanno chiuso il centro e i negozi hanno venduto di più. E poi c'è la salute: l'inquinamento fa male ai bambini."
  - tutor: "Due argomenti seri, lo ammetto. Ma i commercianti di via Roma dicono che senza parcheggi perderanno metà dei clienti."
    goals: [argue]
  - learner: "Lo capisco, ma i parcheggi si possono costruire fuori dal centro. Bisogna che il Comune mette delle navette gratuite."
    errors: [subjunctive-use]
  - tutor: "Un'idea interessante. Però «bisogna che il Comune mette»: con «bisogna che», come cambia il verbo?"
    prompt: {text: "Bisogna che il Comune mette", tags: [subjunctive-use]}
  - learner: "Sì, bisogna che il Comune mette le navette, e che siano frequenti."
    errors: [subjunctive-use]
  - tutor: "Quindi, secondo lei, bisogna che il Comune metta le navette. E chi le paga? Le tasse sono già alte."
    recast: {text: "il Comune mette", fix: "il Comune metta", tags: [subjunctive-use]}
    goals: [counter]
  - learner: "Si potrebbero pagare con i soldi delle multe. Ma ha ragione, i commercianti non possono pagare tutto loro."
  - tutor: "Almeno su questo siamo d'accordo. Quindi, in pratica, che cosa propone?"
  - learner: "Chiudiamo il centro solo il sabato e la domenica per un anno, e poi vediamo i risultati. Quanti negozi ci sono in via Roma? Ci sono una cinquantina, no?"
    errors: [ci-ne]
  - tutor: "Più o meno. Ma «ci sono una cinquantina»: una cinquantina di negozi, e quel «di negozi» va ripreso con un pronome. Come diventa?"
    prompt: {text: "Ci sono una cinquantina", tags: [ci-ne]}
  - learner: "Ce ne sono una cinquantina. Potremmo chiedere a ognuno che cosa ne pensa."
  - tutor: "Va bene, su un anno di prova nel fine settimana posso essere d'accordo. Portiamo la proposta alla riunione di giovedì."
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [relative-pronoun, preposition]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io invece sono favorevole. Lavoro in centro e ogni mattina ci metto quaranta minuti per trovare parcheggio."
  - tutor: "Proprio per questo servono più parcheggi, non meno! Perché è favorevole?"
    goals: [position]
  - learner: "Perché il traffico è il problema principale. La strada che lavoro è sempre piena di macchine e di rumore."
    errors: [relative-pronoun]
  - tutor: "La conosco, è vero. Ma «la strada che lavoro»: lei lavora in quella strada. Come cambia allora il «che»?"
    prompt: {text: "La strada che lavoro", tags: [relative-pronoun]}
  - learner: "La strada in cui lavoro è sempre piena di macchine. E un secondo argomento: i turisti vengono di più se il centro è bello e tranquillo."
  - tutor: "Esatto. I turisti, d'accordo, ma gli anziani? Come arrivano in centro senza macchina?"
    goals: [argue]
  - learner: "Con l'autobus. Il Comune deve occuparsi a migliorare i mezzi pubblici: più corse, anche la sera."
    errors: [preposition]
  - tutor: "Ma gli autobus sono sempre in ritardo! E poi, «occuparsi a migliorare»: con «occuparsi», davanti all'infinito, quale preposizione va?"
    prompt: {text: "occuparsi a migliorare", tags: [preposition]}
  - learner: "Deve occuparsi di migliorare i mezzi. E per gli anziani si possono fare dei permessi speciali."
  - tutor: "Esatto. I permessi speciali sono un'idea ragionevole, lo riconosco."
    goals: [counter]
  - learner: "Allora siamo d'accordo almeno su una cosa! Io però capisco i commercianti: hanno paura a perdere i clienti."
    errors: [preposition]
  - tutor: "Certo che hanno paura! Ma «hanno paura a perdere»: controlli bene la preposizione che segue «paura»."
    prompt: {text: "paura a perdere", tags: [preposition]}
  - learner: "Hanno paura a perdere i clienti, sì."
    errors: [preposition]
  - tutor: "Sì, hanno paura di perdere i clienti, ed è normale. Quindi che cosa propone per loro?"
    recast: {text: "paura a perdere", fix: "paura di perdere", tags: [preposition]}
  - learner: "Proporrei uno sconto sulle tasse per i negozi del centro per il primo anno, pagato dal Comune."
  - tutor: "Su questo posso essere d'accordo: un aiuto ai negozi per un anno, e poi vediamo. Ne parliamo alla prossima riunione?"
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: en-m-retired
  history: [subjunctive-use, hypothetical]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la sua preoccupazione, ma secondo me è necessario che le auto escano dal centro. L'aria è irrespirabile."
  - tutor: "Irrespirabile mi sembra esagerato. Ma perché, oltre all'aria?"
    goals: [position]
  - learner: "Perché il centro storico è delicato: i camion fanno tremare i palazzi antichi. E le piazze sono diventate parcheggi."
  - tutor: "Questi sono due argomenti seri. Però i negozi hanno bisogno dei clienti in macchina, altrimenti chiudono."
    goals: [argue]
  - learner: "Non credo che i clienti arrivano tutti in macchina. A Ferrara molti vanno in bicicletta."
    errors: [subjunctive-use]
  - tutor: "Ferrara è un caso particolare. Ma «non credo che i clienti arrivano»: dopo «non credo che», quale modo ci vuole?"
    prompt: {text: "Non credo che i clienti arrivano", tags: [subjunctive-use]}
  - learner: "Non credo che arrivino tutti in macchina. Molti vengono a piedi o in bici."
  - tutor: "Esatto. Ma qui le salite sono tante, e non siamo a Ferrara!"
    goals: [counter]
  - learner: "È vero, le salite sono un problema. Se il Comune comprerebbe delle biciclette elettriche, molte persone le userebbero."
    errors: [hypothetical]
  - tutor: "Forse. Ma «se il Comune comprerebbe»: dopo «se», il condizionale non va. Che tempo usiamo?"
    prompt: {text: "Se il Comune comprerebbe", tags: [hypothetical]}
  - learner: "Se il Comune compra delle biciclette, le persone le userebbero."
    errors: [hypothetical]
  - tutor: "Se il Comune comprasse delle biciclette elettriche, forse sì, ma costano molto. Lei che cosa propone per i negozi?"
    recast: {text: "Se il Comune compra", fix: "Se il Comune comprasse", tags: [hypothetical]}
  - learner: "Ha ragione sul costo. Allora propongo di chiudere il centro solo la domenica, e di vedere che cosa succede."
  - tutor: "La domenica a piedi: questa la posso accettare. Ne parliamo con gli altri residenti?"
    goals: [concede]

- scenario: dibattito-ambiente
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun, passive]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io sono a favore della zona pedonale, perché ho visto cosa è successo nella mia città, in Spagna."
  - tutor: "E che cosa è successo?"
    goals: [position]
  - learner: "Il centro è stato chiuso alle auto dieci anni fa, e adesso è pieno di vita: ci sono terrazze, mercati, bambini che giocano."
    errors: [false-friend]
  - tutor: "Tavolini all'aperto e bambini che giocano, d'accordo. Ma in Spagna fa più caldo, si vive di più fuori. E qui?"
    recast: {text: "terrazze", fix: "Tavolini all'aperto", tags: [false-friend]}
    new: [{lemma: tavolino, gloss: small café table}]
  - learner: "Anche qui. E poi i bambini: la scuola che insegno è proprio in centro, e i genitori hanno paura del traffico."
    errors: [relative-pronoun]
  - tutor: "Questo è un punto importante. Ma «la scuola che insegno»: lei insegna in una scuola. Come diventa il «che»?"
    prompt: {text: "la scuola che insegno", tags: [relative-pronoun]}
  - learner: "La scuola in cui insegno. Lì i bambini respirano aria inquinata tutti i giorni."
  - tutor: "Esatto. Va bene, la salute dei bambini conta. Ma i commercianti? Molti hanno fatto debiti per aprire il negozio."
    goals: [argue]
  - learner: "Lo so, ma i negozi in una zona pedonale vendono di più. Uno studio fatto a Madrid lo dimostra: le vendite sono aumentate."
  - tutor: "Gli studi dicono tutto e il contrario di tutto. Però ammetto che a Madrid ha funzionato."
    goals: [counter]
  - learner: "Allora proviamo per sei mesi. Le regole sarebbero decise insieme ai commercianti, non imposto dal Comune."
    errors: [passive]
  - tutor: "Una proposta ragionevole. Ma «decise..., non imposto»: le regole sono femminili plurali, quindi anche «imposto» deve concordare. Come diventa?"
    prompt: {text: "non imposto", tags: [passive]}
  - learner: "Non imposto dal Comune, sì: decise insieme."
    errors: [passive]
  - tutor: "Regole decise insieme e non imposte dal Comune: su questo sono d'accordo. Lo proponiamo alla prossima riunione dei residenti?"
    recast: {text: "Non imposto", fix: "non imposte", tags: [passive]}
    new: [{lemma: imporre, gloss: to impose}]
    goals: [concede]

- scenario: politica-lavoro
  level: B2
  persona: en-m-heritage
  history: [hypothetical, subjunctive-use]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri. Alcuni lavori spariranno, è vero, ma ne nasceranno di nuovi."
  - tutor: "Lo dicono tutti, ma quali? Io vedo solo gente che perde il lavoro."
    goals: [opinion]
  - learner: "Pensa a cent'anni fa: nessuno faceva il programmatore, e adesso ce ne sono milioni."
  - tutor: "D'accordo, ma un autista di camion di cinquant'anni non diventa programmatore in un mese. Che cosa succederebbe se domani i camion guidassero da soli?"
  - learner: "Se i camion guiderebbero da soli, molti autisti perderebbero il lavoro, è vero."
    errors: [hypothetical]
  - tutor: "Ecco, lo ammetti! Ma «se i camion guiderebbero»: dopo «se», in una frase così, il condizionale non va. Che forma serve?"
    prompt: {text: "Se i camion guiderebbero", tags: [hypothetical]}
  - learner: "Se guidassero da soli, molti perderebbero il lavoro. Ma lo Stato potrebbe pagare la formazione."
  - tutor: "Esatto. Ma lo Stato non ha soldi! Chi la paga, questa formazione?"
    goals: [hypothesis]
  - learner: "Le aziende che usano i robot. Mio cugino lavorava in una fattoria di automobili a Detroit: quando sono arrivati i robot, l'azienda gli ha pagato un corso, e adesso li ripara."
    errors: [false-friend]
  - tutor: "In una fabbrica di automobili, quindi: un caso fortunato. Ma non credo che succeda spesso."
    recast: {text: "una fattoria", fix: "una fabbrica", tags: [false-friend]}
    goals: [example]
  - learner: "Forse no, ma vorrei che i governi ci pensano adesso, prima che sia troppo tardi."
    errors: [subjunctive-use]
  - tutor: "Su questo ti do ragione. Ma «vorrei che i governi ci pensano»: dopo «vorrei che», quale tempo del congiuntivo ci vuole?"
    prompt: {text: "vorrei che i governi ci pensano", tags: [subjunctive-use]}
  - learner: "Vorrei che ci pensino adesso."
    errors: [subjunctive-use]
  - tutor: "Vorresti che ci pensassero adesso, e hai ragione. Quindi, alla fine, tu come la vedi?"
    recast: {text: "ci pensino", fix: "ci pensassero", tags: [subjunctive-use]}
  - learner: "In modo positivo. Il lavoro cambierà, ma non sparirà. E tu, sei davvero così pessimista?"
  - tutor: "Un po' meno di prima, lo ammetto. Ma ne parliamo di nuovo tra dieci anni!"
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-form, hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Non sono d'accordo. Credo che la tecnologia crei più lavoro di quello che distrugge."
  - tutor: "Bella frase, ma ne sei sicura? Pensa ai supermercati: ormai paghi da solo, senza nessuno alla cassa."
    goals: [opinion]
  - learner: "Sì, ma qualcuno deve riparare quelle macchine e scrivere i programmi. Se io lavorassi alla cassa, farei un corso di informatica."
  - tutor: "Facile a dirsi! E se tu avessi cinquant'anni e due figli?"
  - learner: "Se avrei cinquant'anni, sarebbe più difficile, lo so."
    errors: [hypothetical]
  - tutor: "Ecco. Ma «se avrei cinquant'anni»: dopo «se», per una situazione che non è reale, quale forma usiamo?"
    prompt: {text: "Se avrei cinquant'anni", tags: [hypothetical]}
  - learner: "Se avessi cinquant'anni, sarebbe più difficile. Ma non impossibile."
  - tutor: "Esatto. Quindi ammetti che qualcuno resterà indietro."
    goals: [hypothesis]
  - learner: "Sì. Per esempio mia zia lavorava in una banca a Siviglia: hanno chiuso la sua filiale, e lei a sessant'anni non ha più trovato niente."
  - tutor: "Vedi? È proprio quello che dico io."
    goals: [example]
  - learner: "Però non era colpa della tecnologia, ma della banca. Bisognerebbe che le aziende dassero dei corsi ai dipendenti prima di licenziarli."
    errors: [subjunctive-form]
  - tutor: "Su questo potrei essere d'accordo. Ma «dassero»: il congiuntivo imperfetto di «dare» non segue la regola. Come fa?"
    prompt: {text: "dassero", tags: [subjunctive-form]}
  - learner: "Dessero! Bisognerebbe che le aziende dessero dei corsi."
  - tutor: "Esatto. Allora, per concludere: tu come vedi il futuro?"
  - learner: "Lo vedo bene, ma con attenzione. Tutto dipende di quello che facciamo adesso. E tu, che cosa ne pensi?"
    errors: [preposition]
  - tutor: "Ci sto pensando. Ma «dipende di quello che facciamo»: «dipendere» vuole un'altra preposizione. Quale?"
    prompt: {text: "dipende di quello", tags: [preposition]}
  - learner: "Dipende da quello che facciamo adesso."
  - tutor: "Esatto. E su questo hai ragione tu: io continuo a vedere il futuro un po' nero, ma meno di prima."
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: en-f-student
  history: [subjunctive-use, relative-pronoun]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Mah, non lo so. Ho paura che tu abbia ragione: anche il lavoro dei miei sogni potrebbe sparire."
  - tutor: "E qual è il lavoro dei tuoi sogni?"
  - learner: "Vorrei fare la traduttrice. Ma ormai i programmi traducono quasi tutto, e lo fanno in pochi secondi."
  - tutor: "Appunto! Allora perché la studi? È un rischio enorme."
  - learner: "Perché è un lavoro che sono appassionata da quando ero piccola. E penso che una macchina non capisce l'ironia."
    errors: [relative-pronoun, subjunctive-use]
  - tutor: "Questa è una posizione chiara. Ma «penso che una macchina non capisce»: dopo «penso che», quale modo ci vuole?"
    prompt: {text: "penso che una macchina non capisce", tags: [subjunctive-use]}
  - learner: "Penso che una macchina non capisca l'ironia, né i giochi di parole."
  - tutor: "Esatto. Ma se un giorno le macchine capissero anche l'ironia, che cosa faresti?"
    goals: [opinion]
  - learner: "Se capissero anche l'ironia, cambierei lavoro, ma sarei molto triste."
  - tutor: "Almeno sei sincera! E conosci qualcuno che ha già perso il lavoro così?"
    goals: [hypothesis]
  - learner: "Sì, la madre di una mia amica, che lavorava in un'agenzia di traduzioni. Adesso l'agenzia usa un programma, il cui testo viene corretto da una persona sola."
  - tutor: "Ecco, un esempio perfetto. Quindi la macchina non sostituisce tutti, ma molti sì."
    goals: [example]
  - learner: "Esatto. Insomma, il lavoro cambierà molto, ma le persone creative serviranno sempre. Tu davvero credi che sparisce tutto?"
    errors: [subjunctive-use]
  - tutor: "Non tutto, la metà! Ma «credi che sparisce»: anche nella domanda, dopo «credi che», il modo è lo stesso di prima. Quale?"
    prompt: {text: "credi che sparisce", tags: [subjunctive-use]}
  - learner: "Sì: credi che sparisce davvero tutto?"
    errors: [subjunctive-use]
  - tutor: "Se credo che sparisca tutto? No, certo, non proprio tutto. Ma anche i lavori creativi come il tuo cambieranno molto nei prossimi anni, e io spero davvero di sbagliarmi."
    recast: {text: "sparisce", fix: "sparisca", tags: [subjunctive-use]}
    new: [{lemma: sparire, gloss: to disappear}]
    goals: [conclude]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [hypothetical, ci-ne]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Io dico che hai ragione solo in parte. Nel mio settore, la costruzione, le macchine non possono fare tutto."
    errors: [word-choice]
  - tutor: "Nell'edilizia, dici? Per adesso! Ci sono già macchine che costruiscono case intere."
    recast: {text: "la costruzione", fix: "l'edilizia", tags: [word-choice]}
    goals: [opinion]
    new: [{lemma: edilizia, gloss: construction industry}]
  - learner: "Sì, ne ho vista una in un video, ma qualcuno deve controllarla. Se le macchine farebbero tutto, chi controllerebbe le macchine?"
    errors: [hypothetical]
  - tutor: "Bella domanda. Ma «se le macchine farebbero tutto»: dopo «se», quale forma del verbo usiamo per immaginare?"
    prompt: {text: "Se le macchine farebbero tutto", tags: [hypothetical]}
  - learner: "Se le macchine facessero tutto, chi le controllerebbe?"
  - tutor: "Esatto. Dei tecnici, ma pochi. E tutti gli altri operai?"
    goals: [hypothesis]
  - learner: "Per esempio, nella mia ditta l'anno scorso è arrivata una gru automatica. Nessuno è stato licenziato: chi la guidava è diventato tecnico."
  - tutor: "Interessante. E tu, farai altri corsi per restare aggiornato?"
    goals: [example]
  - learner: "Sì, l'anno prossimo farò altri due: uno sulla sicurezza e uno di informatica."
    errors: [ci-ne]
  - tutor: "Bravo! Ma «farò altri due»: altri due corsi, certo, però in italiano li riprendiamo con un pronome. Dove lo metti?"
    prompt: {text: "farò altri due", tags: [ci-ne]}
  - learner: "Sì, farò altri due, anche se la sera sono stanco."
    errors: [ci-ne]
  - tutor: "«Ne farò altri due»: bravo, anche se la sera sei stanco. Allora, per concludere: secondo te chi deve pagare questi corsi?"
    recast: {text: "farò altri due", fix: "Ne farò altri due", tags: [ci-ne]}
  - learner: "Le aziende e lo Stato insieme. Insomma, il lavoro non sparisce, cambia. E tu la vedi ancora così nera?"
  - tutor: "Un po' meno, grazie al tuo esempio. Però continuo a pensare che molti resteranno indietro."
    goals: [conclude]

# s-b2: B2 job interviews and asking for a promotion.
- scenario: colloquio-lavoro
  level: B2
  persona: en-f-professional
  history: [tense-aspect, relative-pronoun]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Sarah, ho trentadue anni e sono ingegnera gestionale. Vivo a Torino da quattro anni."
  - tutor: "Benvenuta. Quattro anni sono già un bel periodo. E prima di Torino dove lavorava?"
    goals: [intro]
  - learner: "Ho lavorato a Londra per un'azienda di trasporti. Ogni giorno ho controllato le consegne di cinquanta camion."
    errors: [tense-aspect]
  - tutor: "Cinquanta camion, mica pochi! Ma «ogni giorno ho controllato»: è qualcosa che succedeva di solito, tutti i giorni. Che tempo usiamo per le abitudini del passato?"
    prompt: {text: "Ogni giorno ho controllato", tags: [tense-aspect]}
  - learner: "Ogni giorno controllavo le consegne, e organizzavo anche i turni degli autisti."
  - tutor: "Esatto. E qual è il progetto di cui è più orgogliosa?"
  - learner: "Un nuovo sistema per i percorsi dei camion: con quel sistema abbiamo ridotto i costi del dodici per cento in un anno."
  - tutor: "Un risultato notevole. Secondo lei, quali sono i suoi punti di forza? E un punto debole?"
    goals: [experience]
  - learner: "Sono molto organizzata e lavoro bene sotto pressione. Il mio punto debole è che faccio fatica a delegare, ma eventualmente sto imparando."
    errors: [false-friend]
  - tutor: "Col tempo si impara, e il fatto che lei lo sappia è già un buon segno. Perché vorrebbe lavorare proprio da noi?"
    recast: {text: "eventualmente", fix: "Col tempo", tags: [false-friend]}
    goals: [strengths]
  - learner: "Perché la vostra è un'azienda che ho sentito parlare molto bene, e vorrei lavorare in un ambiente internazionale."
    errors: [relative-pronoun]
  - tutor: "Fa piacere saperlo! Ma «un'azienda che ho sentito parlare»: si sente parlare «di» qualcosa. Allora come cambia quel «che»?"
    prompt: {text: "un'azienda che ho sentito parlare", tags: [relative-pronoun]}
  - learner: "Sì, è un'azienda che ho sentito parlare molto bene."
    errors: [relative-pronoun]
  - tutor: "«Un'azienda di cui ho sentito parlare molto bene»: questo ci fa davvero piacere. Ha qualche domanda sul ruolo?"
    recast: {text: "che ho sentito parlare", fix: "di cui ho sentito parlare", tags: [relative-pronoun]}
    goals: [why]
  - learner: "Sì: quante persone ci sono nel gruppo in cui lavorerei?"
  - tutor: "Sarebbero sei persone, e il responsabile è appena arrivato da Milano. Le faremo sapere qualcosa entro dieci giorni."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  history: [preposition, tense-aspect]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Lucía, sono spagnola, di Valencia, e ho appena finito un master in marketing a Bologna."
  - tutor: "Piacere, Lucía. Un master a Bologna: ottima scelta. Ha già qualche esperienza di lavoro?"
    goals: [intro]
  - learner: "Sì, l'anno scorso ho fatto delle pratiche in una casa editrice. Mentre ho lavorato lì, ho imparato a gestire i social."
    errors: [false-friend, tense-aspect]
  - tutor: "Interessante. Ma «mentre ho lavorato lì»: con «mentre» descrive un periodo che durava, non un fatto concluso. Quale tempo del passato ci vuole?"
    prompt: {text: "Mentre ho lavorato lì", tags: [tense-aspect]}
  - learner: "Mentre lavoravo lì, ho imparato a gestire i social."
  - tutor: "Esatto. E che cosa faceva, di preciso, ogni giorno?"
  - learner: "Scrivevo i post, rispondevo ai lettori e preparavo una lettera per gli abbonati ogni settimana. Ho anche organizzato due presentazioni di libri."
  - tutor: "Un lavoro molto vario. Secondo lei, quali sono i suoi punti di forza? E un punto debole?"
    goals: [experience]
  - learner: "Sono creativa e imparo in fretta. Un difetto: sono molto severa con me stessa, e mi innervosisco se non riesco di finire un lavoro."
    errors: [preposition]
  - tutor: "Sincera, lo apprezzo. Però «riesco di finire»: «riuscire» vuole un'altra preposizione davanti all'infinito. Quale?"
    prompt: {text: "riesco di finire", tags: [preposition]}
  - learner: "Sì, se non riesco di finire in tempo, mi innervosisco."
    errors: [preposition]
  - tutor: "«Se non riesco a finire in tempo, mi innervosisco»: succede a molti, l'importante è saperlo. Perché ha scelto proprio la nostra agenzia?"
    recast: {text: "riesco di finire", fix: "riesco a finire", tags: [preposition]}
    goals: [strengths]
  - learner: "Perché lavorate con molti clienti spagnoli, e io potrei essere un ponte tra i due mercati. E poi mi piacerebbe restare in Italia."
  - tutor: "In effetti per noi sarebbe un vantaggio. Ha qualche domanda sul ruolo?"
    goals: [why]
  - learner: "Sì: lo stage è pagato? E dopo sei mesi c'è la possibilità di restare con un contratto?"
  - tutor: "Lo stage è pagato 800 euro al mese, e dopo sei mesi decidiamo se offrirle un contratto. Le faremo sapere entro venerdì."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-heritage
  history: [participle-agreement, conditional-form]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono Daniel, sono nato a Boston, ma mia madre è di Bari, quindi in famiglia ho sempre parlato italiano."
  - tutor: "Piacere, Daniel. Allora l'italiano lo conosce da sempre. Di che cosa si occupa adesso?"
    goals: [intro]
  - learner: "Faccio il cuoco da dieci anni. Ho lavorato in tre ristoranti a Boston, e due anni fa ho aperto un piccolo locale mio, ma poi l'ho dovuto chiudere."
  - tutor: "Mi dispiace. Come mai l'ha chiuso?"
  - learner: "Per l'affitto, che era troppo alto. Ma le ricette della nonna le ho portato con me in Italia!"
    errors: [participle-agreement]
  - tutor: "Ottimo, sono il suo vero tesoro. Però «le ho portato»: «le» sono le ricette, femminile plurale. E la fine del verbo?"
    prompt: {text: "le ho portato", tags: [participle-agreement]}
  - learner: "Le ho portate con me, certo."
  - tutor: "Esatto. Quali sono i suoi punti di forza in cucina? E il suo punto debole?"
    goals: [experience]
  - learner: "Sono veloce e resto calmo anche quando la cucina è molto occupata. Il punto debole: sono troppo perfezionista con i piatti."
    errors: [word-choice]
  - tutor: "Quando la cucina è piena di lavoro, restare calmi vale moltissimo. E un cuoco perfezionista, per noi, non è un difetto! Perché vuole lavorare qui?"
    recast: {text: "è molto occupata", fix: "è piena di lavoro", tags: [word-choice]}
    goals: [strengths]
  - learner: "Perché fate cucina pugliese, come mia nonna. E poi mi piacerebbe imparare a fare la pasta fresca come si fa qui."
  - tutor: "Allora è nel posto giusto: la pasta la facciamo tutta a mano, ogni mattina. Ha domande per me?"
    goals: [why]
  - learner: "Sì: dovrei lavorare anche la domenica? E vorrebbi sapere quanti giorni di ferie ci sono."
    errors: [conditional-form]
  - tutor: "Domande giuste. Ma «vorrebbi»: è la prima persona del condizionale di «volere». Come finisce?"
    prompt: {text: "vorrebbi", tags: [conditional-form]}
  - learner: "Vorrei sapere quanti giorni di ferie ci sono, scusi."
  - tutor: "Esatto. La domenica sì, a pranzo, ma il lunedì siamo chiusi. Le ferie sono quattro settimane, tutte in agosto."
    goals: [questions]

- scenario: colloquio-lavoro
  level: B2
  persona: es-m-worker
  history: [hypothetical, ci-ne]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Mi chiamo Javier, ho quarantacinque anni e lavoro nei trasporti da più di vent'anni."
  - tutor: "Piacere. Vent'anni sono tanti: dove ha cominciato?"
    goals: [intro]
  - learner: "Ho cominciato in Argentina in un magazzino, poi sono diventato encargado di tutto il reparto."
    errors: [word-choice]
  - tutor: "Da semplice operaio a responsabile di tutto il reparto: una bella carriera. Perché si è trasferito in Italia?"
    recast: {text: "encargado", fix: "responsabile", tags: [word-choice]}
  - learner: "Mia moglie è italiana. Quando siamo arrivati, non conoscevo nessuno e non parlavo bene la lingua, ma ho trovato subito lavoro."
  - tutor: "Capisco. Quali sono i suoi punti forti, e su cosa deve ancora migliorare?"
    goals: [experience]
  - learner: "So organizzare bene il lavoro degli altri. Devo migliorare con il computer: se avevo più tempo, farei un corso di Excel."
    errors: [hypothetical]
  - tutor: "È utile saperlo. Ma «se avevo più tempo, farei»: con il condizionale nell'altra parte della frase, dopo «se» quale tempo serve?"
    prompt: {text: "se avevo più tempo", tags: [hypothetical]}
  - learner: "Ah, sì: se avessi più tempo, farei un corso di Excel."
  - tutor: "Esatto. Da noi i corsi si fanno in orario di lavoro, quindi il tempo lo troverebbe. Perché le interessa questo posto?"
    goals: [strengths]
  - learner: "Perché la vostra azienda sta crescendo, e a me piacciono le sfide. Ho letto che aprirete un nuovo magazzino a Piacenza."
  - tutor: "Esatto, apre a marzo, e cerchiamo proprio qualcuno che lo diriga. Ha domande per me?"
    goals: [why]
  - learner: "Quanti dipendenti ci saranno? Nel mio ultimo lavoro avevo trenta, e mi trovavo bene."
    errors: [ci-ne]
  - tutor: "All'inizio circa venti. Ma «avevo trenta»: trenta dipendenti, certo, però in italiano li riprendiamo con un pronome. Dove lo metterebbe?"
    prompt: {text: "avevo trenta", tags: [ci-ne]}
  - learner: "Ne avevo trenta, sì."
  - tutor: "Perfetto, allora un gruppo così lo sa gestire. Le faremo sapere qualcosa entro la fine del mese."
    goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-professional
  history: [subjunctive-use, combined-pronouns]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Volevo parlare dei risultati di quest'anno: il mio gruppo ha superato gli obiettivi di vendita del quindici per cento."
  - tutor: "Lo so, i numeri li ho visti e sono ottimi. Che cosa mi vuole proporre?"
    goals: [results]
  - learner: "Penso che è il momento giusto per una promozione. Da due anni faccio anche il lavoro di coordinatrice, senza il titolo."
    errors: [subjunctive-use]
  - tutor: "Capisco. Ma «penso che è il momento»: dopo «penso che», in una conversazione come questa, quale modo usiamo?"
    prompt: {text: "Penso che è il momento", tags: [subjunctive-use]}
  - learner: "Penso che sia il momento giusto, sì."
  - tutor: "Esatto. Il problema è il budget: quest'anno gli aumenti sono bloccati fino a settembre."
    goals: [request]
  - learner: "Lo capisco. Ma se un aumento adesso non è possibile, almeno il titolo me lo potrebbe dare subito?"
  - tutor: "Il titolo si può discutere. Però la direzione vorrà vedere un piano per il prossimo anno: me lo prepara lei?"
    goals: [handle]
  - learner: "Certo, glielo preparo entro venerdì. Vorrei che lei lo presenta alla direzione insieme a me."
    errors: [subjunctive-use]
  - tutor: "D'accordo per venerdì. Ma «vorrei che lei lo presenta»: con «vorrei», nella seconda parte cambiano sia il modo sia il tempo. Ci prova?"
    prompt: {text: "Vorrei che lei lo presenta", tags: [subjunctive-use]}
  - learner: "Vorrei che lei lo presenti insieme a me."
    errors: [subjunctive-use]
  - tutor: "«Vorrei che lei lo presentasse insieme a me»: d'accordo, lo presentiamo insieme, così risponde lei alle domande sui numeri."
    recast: {text: "lo presenti", fix: "lo presentasse", tags: [subjunctive-use]}
  - learner: "Grazie mille. Allora le mando il piano venerdì e fissiamo una data per la riunione?"
  - tutor: "Perfetto. Fissiamo la riunione con la direzione per il 28, così ha tutto il tempo di prepararsi."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: es-m-worker
  history: [hypothetical, passive]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Lavoro qui da cinque anni, e in questi anni il reparto è cresciuto molto: i clienti sono duplicati."
    errors: [false-friend]
  - tutor: "È vero, i clienti sono raddoppiati, e una parte del merito è sua. A che cosa sta pensando?"
    recast: {text: "sono duplicati", fix: "sono raddoppiati", tags: [false-friend]}
    goals: [results]
    new: [{lemma: raddoppiare, gloss: to double}]
  - learner: "Vorrei un aumento di stipendio. L'anno scorso il nuovo sistema di magazzino è stato progettato da me, e ha fatto risparmiare molti soldi all'azienda."
  - tutor: "Lo ricordo bene. Però le devo essere sincera: il budget di quest'anno è stato chiuso a gennaio."
    goals: [request]
  - learner: "Lo so, ma se me l'avrebbe detto prima, avrei chiesto l'aumento a dicembre."
    errors: [hypothetical]
  - tutor: "Forse dovevamo parlarne prima, ha ragione. Ma «se me l'avrebbe detto»: dopo «se», per un fatto passato che non si è realizzato, quale tempo usiamo?"
    prompt: {text: "se me l'avrebbe detto", tags: [hypothetical]}
  - learner: "Se me l'avesse detto prima, avrei chiesto l'aumento a dicembre."
  - tutor: "Esatto. Le faccio una proposta: a luglio si discute di nuovo il budget, e io metto il suo aumento al primo posto."
  - learner: "Va bene, ma vorrei qualcosa di scritto. L'anno scorso una promessa simile è stata fatta a un collega e non è stato mantenuto."
    errors: [passive]
  - tutor: "Capisco che voglia essere sicuro. Però «non è stato mantenuto»: di che cosa parla? Della promessa. Allora come concorda?"
    prompt: {text: "non è stato mantenuto", tags: [passive]}
  - learner: "Non è stata mantenuta. Per questo vorrei un documento."
  - tutor: "Giusto. Le mando oggi stesso una lettera, firmata da me, con l'impegno per luglio."
    goals: [handle]
  - learner: "Perfetto, mi sembra una buona soluzione. Allora ci rivediamo a luglio."
  - tutor: "Sì, metto in agenda un incontro per il 10 luglio. E intanto grazie per il lavoro di quest'anno."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-traveller
  history: [ci-ne, preposition]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Ho appena chiuso il progetto con il cliente tedesco, con due settimane di anticipo e sotto il budget."
  - tutor: "Me l'hanno detto, e il cliente è molto soddisfatto. Ottimo lavoro. Di che cosa voleva parlarmi?"
    goals: [results]
  - learner: "Ci ho pensato molto, e credo di meritare un ruolo da responsabile. Ho già guidato tre progetti come questo."
  - tutor: "È vero, li ha guidati bene. Ma per quel ruolo di solito chiediamo almeno cinque anni di esperienza, e lei ne ha tre."
    goals: [request]
  - learner: "È vero, ho solo tre, ma in questi anni ho lavorato con quasi tutti i clienti più importanti."
    errors: [ci-ne]
  - tutor: "Questo è un buon argomento. Però «ho solo tre»: tre anni, sì, ma in italiano li riprendiamo con un pronome prima del verbo. Quale?"
    prompt: {text: "ho solo tre", tags: [ci-ne]}
  - learner: "Ne ho solo tre, ma ho lavorato con quasi tutti i clienti."
  - tutor: "Esatto. E i clienti la apprezzano, lo so. Che cosa propone, in pratica?"
  - learner: "Propongo di provare per sei mesi: se non sono capace a gestire il gruppo, torno al mio ruolo."
    errors: [preposition]
  - tutor: "Una proposta coraggiosa. Ma «capace a gestire»: dopo «capace», quale preposizione va davanti all'infinito?"
    prompt: {text: "capace a gestire", tags: [preposition]}
  - learner: "Sì: se non sono capace a gestirlo, torno indietro."
    errors: [preposition]
  - tutor: "«Se non sono capace di gestirlo, torno indietro»: è un patto onesto. Ne parlo con la direzione e lunedì le do una risposta."
    recast: {text: "capace a gestirlo", fix: "capace di gestirlo", tags: [preposition]}
    goals: [handle]
  - learner: "Grazie. Mi farebbe sapere anche se con il nuovo ruolo è previsto un aumento?"
  - tutor: "Certo: ci sarebbe un aumento del dieci per cento dopo i sei mesi di prova. Lunedì alle nove le confermo tutto."
    goals: [next-steps]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun, subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì. Quest'anno i miei corsi hanno avuto il trenta per cento di iscritti in più, e i questionari degli studenti sono stati ottimi."
  - tutor: "Lo so, li ho letti: gli studenti la adorano. Che cosa voleva chiedermi?"
    goals: [results]
  - learner: "Vorrei diventare coordinatrice dei corsi di spagnolo. È un ruolo che mi interessa da anni e per cui mi sento pronta."
  - tutor: "È un ruolo importante. Però l'attuale coordinatrice va in pensione solo a giugno."
    goals: [request]
  - learner: "Lo so, ma bisogna che qualcuno la aiuta già da adesso: ha troppo lavoro."
    errors: [subjunctive-use]
  - tutor: "Su questo ha ragione. Ma «bisogna che qualcuno la aiuta»: dopo «bisogna che», quale modo usiamo?"
    prompt: {text: "bisogna che qualcuno la aiuta", tags: [subjunctive-use]}
  - learner: "Bisogna che qualcuno la aiuti, sì."
  - tutor: "Esatto. Quindi lei propone di lavorare al suo fianco fino a giugno?"
    goals: [handle]
  - learner: "Sì. Potrei occuparmi dei nuovi corsi online, il cui programma ho già preparato l'anno scorso."
  - tutor: "Lo conosco, è un buon programma. Allora facciamo così: da settembre lei aiuta la collega, e a giugno ne parliamo di nuovo."
  - learner: "Mi sembra giusto. Lei è la persona a che devo mandare il programma aggiornato?"
    errors: [relative-pronoun]
  - tutor: "Sì, lo mandi pure a me. Però «la persona a che»: dopo una preposizione non si usa «che». Che parola serve?"
    prompt: {text: "la persona a che", tags: [relative-pronoun]}
  - learner: "La persona a cui devo mandarlo, giusto."
  - tutor: "Giusto. Me lo mandi entro fine mese, e a settembre fissiamo il primo incontro con la collega."
    goals: [next-steps]

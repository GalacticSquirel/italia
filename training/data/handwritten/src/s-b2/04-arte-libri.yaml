# s-b2: B2 exhibitions and book club.
- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [subjunctive-use, passive]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi piace moltissimo! Sembra che la luce viene da una finestra, ma la finestra non si vede."
    errors: [subjunctive-use]
  - tutor: "Bella osservazione. Ma «sembra che la luce viene»: dopo «sembra che», quale modo vuole il verbo?"
    prompt: {text: "Sembra che la luce viene", tags: [subjunctive-use]}
  - learner: "Sembra che la luce venga da una finestra."
  - tutor: "Esatto, ed è proprio questo il trucco del pittore. Che cosa vedi, oltre alla luce?"
    goals: [react]
  - learner: "C'è una donna che cuce vicino a un tavolo, e nello sfondo c'è una porta aperta su un cortile. Ha un vestito blu bellissimo."
  - tutor: "Quel blu, all'epoca, costava carissimo: si faceva con una pietra che arrivava da molto lontano."
    goals: [describe]
  - learner: "Davvero? Allora il quadro è stato pagato da qualcuno molto ricco. Forse è stato ordinato da un mercante."
  - tutor: "Probabilmente sì. E secondo te, a che cosa sta pensando la donna?"
  - learner: "Penso che la donna è in attesa di qualcuno: guarda verso la porta, non il suo lavoro."
    errors: [subjunctive-use]
  - tutor: "Interessante. Ma «penso che la donna è»: anche qui, dopo «penso che», come cambia il verbo?"
    prompt: {text: "Penso che la donna è", tags: [subjunctive-use]}
  - learner: "Sì, penso che è in attesa di suo figlio, o di un uomo."
    errors: [subjunctive-use]
  - tutor: "Anch'io penso che sia in attesa di qualcuno: la porta aperta fa pensare a un ritorno."
    recast: {text: "è in attesa", fix: "sia in attesa", tags: [subjunctive-use]}
    goals: [interpret]
  - learner: "Mi ricorda i quadri olandesi che ho visto ad Amsterdam: anche lì c'è sempre una scena di casa, molto silenziosa."
  - tutor: "Il confronto è giusto: la stessa calma, la stessa luce che entra da sinistra. Andiamo a vedere la sala successiva?"
    goals: [compare]

- scenario: arte-mostra
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun, ci-ne]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mamma mia, è enorme! Mi fa un po' paura, con tutti questi colori oscuri e questi corpi che cadono."
    errors: [word-choice]
  - tutor: "È l'effetto che voleva il pittore: con quei colori scuri ti senti dentro la scena. Che cosa vedi, esattamente?"
    recast: {text: "colori oscuri", fix: "colori scuri", tags: [word-choice]}
    goals: [react]
  - learner: "In alto ci sono angeli che combattono, e in basso uomini che cadono nel fuoco. Il cielo è rosso come il sangue."
  - tutor: "Sì, è un Giudizio finale, e il pittore voleva spaventare chi guardava. Secondo te, perché ha messo quella donna con il bambino proprio al centro?"
    goals: [describe]
  - learner: "Forse è la Madonna, la persona che tutti chiedono aiuto."
    errors: [relative-pronoun]
  - tutor: "Possibile. Ma «la persona che tutti chiedono aiuto»: si chiede aiuto «a» qualcuno. Allora come diventa il «che»?"
    prompt: {text: "la persona che tutti chiedono aiuto", tags: [relative-pronoun]}
  - learner: "La persona a cui tutti chiedono aiuto. Così, in mezzo alla paura, c'è anche la speranza."
  - tutor: "Esatto, ed è un'interpretazione molto bella. Ti ricorda qualche altra opera?"
    goals: [interpret]
  - learner: "Sì, la Cappella Sistina, che ho visto due anni fa. Però lì i corpi sono più forti e c'è più movimento."
  - tutor: "Giusto, Michelangelo era il modello di tutti. Quante volte sei stata a Roma?"
    goals: [compare]
  - learner: "Sono andata tre volte, ma la Sistina l'ho vista solo una volta."
    errors: [ci-ne]
  - tutor: "Che fortuna! Ma «sono andata tre volte»: dove? A Roma. Quale pronome usi per non ripetere il luogo?"
    prompt: {text: "Sono andata tre volte", tags: [ci-ne]}
  - learner: "Ci sono andata tre volte. La prossima volta ci andiamo insieme?"
  - tutor: "Volentieri, organizziamo per la primavera! Ma prima finiamo questa sala: c'è un ritratto che devi assolutamente vedere."

- scenario: arte-mostra
  level: B2
  persona: en-m-heritage
  history: [passive, combined-pronouns]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Che bello! È rilassante. Mi sembra di essere in campagna, in una giornata d'estate."
  - tutor: "Sì, è la campagna vicino a Siena, dipinta nell'Ottocento. Che cosa ti colpisce di più?"
    goals: [react]
  - learner: "Le ombre degli alberi. Sono stato dipinte con pochissimi colpi di pennello, ma sembrano vere."
    errors: [passive]
  - tutor: "Hai l'occhio! Ma «sono stato dipinte»: le ombre sono femminili plurali, quindi anche «stato» deve concordare. Come diventa?"
    prompt: {text: "Sono stato dipinte", tags: [passive]}
  - learner: "Sono state dipinte con pochi colpi di pennello."
  - tutor: "Esatto. Questi pittori lavoravano all'aperto, davanti alla natura. E in primo piano, che cosa vedi?"
  - learner: "Due contadine che parlano e un cane che dorme. È una scena molto semplice, ma piena di vita."
  - tutor: "Proprio così. Secondo te, che cosa voleva dirci il pittore con una scena così semplice?"
    goals: [describe]
  - learner: "Forse che la felicità si trova nelle piccole cose. Mio nonno era contadino, e questo quadro me lo ricorda tantissimo."
  - tutor: "Che bel legame. Credo che tu abbia ragione: in quegli anni tutto cambiava, e la campagna sembrava un rifugio."
    goals: [interpret]
  - learner: "Assomiglia un po' agli impressionisti francesi, no? La luce è simile, ma i colori sono meno vivaci."
  - tutor: "Sì, sono quasi dello stesso periodo, ma questi pittori italiani erano più legati al disegno. Vuoi una cartolina del quadro? Te la regalo io."
    goals: [compare]
  - learner: "Sì, grazie! La voglio regalare a mia madre: gli la porto a Natale."
    errors: [combined-pronouns]
  - tutor: "Che bel pensiero. Ma «gli la porto»: «gli» e «la» insieme diventano una parola sola. Quale?"
    prompt: {text: "gli la porto", tags: [combined-pronouns]}
  - learner: "Glielo porto a Natale."
    errors: [combined-pronouns]
  - tutor: "«Gliela porto a Natale»: tua madre sarà contentissima. Andiamo al negozio del museo, allora?"
    recast: {text: "Glielo porto", fix: "Gliela porto", tags: [combined-pronouns]}

- scenario: arte-mostra
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-use, preposition]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sinceramente? Non capisco niente. Sono solo tre linee rosse su un fondo bianco."
  - tutor: "È una reazione normalissima! Prova a guardarlo più da vicino: che cosa noti?"
    goals: [react]
  - learner: "Le linee non sono perfette, si vede la mano del pittore. E il bianco non è tutto uguale: ci sono zone più grigie."
  - tutor: "Brava, è proprio quello che conta. L'artista voleva che chi guarda notasse questi piccoli segni."
    goals: [describe]
  - learner: "Ah, quindi bisogna che uno guarda il quadro per molto tempo?"
    errors: [subjunctive-use]
  - tutor: "In un certo senso, sì. Ma «bisogna che uno guarda»: dopo «bisogna che», quale modo ci vuole?"
    prompt: {text: "bisogna che uno guarda", tags: [subjunctive-use]}
  - learner: "Bisogna che uno guarda con calma, va bene. Ma io non ho pazienza!"
    errors: [subjunctive-use]
  - tutor: "Sì, bisogna che uno guardi con calma, e tu sei sempre di corsa! Allora dimmi: secondo te, che cosa rappresentano quelle tre linee?"
    recast: {text: "uno guarda", fix: "uno guardi", tags: [subjunctive-use]}
  - learner: "Forse tre persone, o tre momenti della vita. Mi fa pensare a mia madre, a mia nonna e a me."
  - tutor: "Che bella interpretazione: tre donne, tre generazioni. Non ci avevo mai pensato."
    goals: [interpret]
  - learner: "Però continuo a preferire i quadri antichi. Ho cominciato di andare nei musei da bambina, con mia nonna, e lei amava solo il Rinascimento."
    errors: [preposition]
  - tutor: "Ecco da dove viene il tuo gusto! Ma «ho cominciato di andare»: con «cominciare», davanti all'infinito, quale preposizione si usa?"
    prompt: {text: "Ho cominciato di andare", tags: [preposition]}
  - learner: "Ho cominciato ad andare nei musei con lei, sì."
  - tutor: "Esatto. E rispetto al Rinascimento, che cosa manca qui, secondo te?"
  - learner: "La storia. Nei quadri del Rinascimento c'è sempre un racconto; qui devi inventare tutto tu."
  - tutor: "Bella differenza: lì il pittore ti racconta una storia, qui la storia la scrivi tu. Andiamo a prendere un caffè e ne parliamo?"
    goals: [compare]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  history: [relative-pronoun, tense-aspect]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Inizio io! Ho letto un romanzo di una scrittrice napoletana. Parla di due amiche che crescono in un quartiere povero."
  - tutor: "Bel tema. Senza dirci il finale, che cosa succede nella prima parte?"
  - learner: "Da bambine le due amiche hanno giocato sempre insieme nel cortile, e andavano a scuola insieme."
    errors: [tense-aspect]
  - tutor: "Che bell'immagine. Ma «hanno giocato sempre insieme»: è un'abitudine dell'infanzia. Quale tempo usiamo per le abitudini?"
    prompt: {text: "hanno giocato sempre insieme", tags: [tense-aspect]}
  - learner: "Giocavano sempre insieme nel cortile. Poi un giorno una delle due ha lasciato la scuola."
  - tutor: "Esatto, ed ecco che la storia cambia. Com'è il personaggio principale?"
    goals: [summary]
  - learner: "È una ragazza intelligente e un po' timida, che ha sempre paura di non essere abbastanza brava. L'amica, invece, è un personaggio che tutti hanno paura."
    errors: [relative-pronoun]
  - tutor: "Due caratteri molto diversi, interessante. Ma «un personaggio che tutti hanno paura»: si ha paura «di» qualcuno. Come cambia il «che»?"
    prompt: {text: "un personaggio che tutti hanno paura", tags: [relative-pronoun]}
  - learner: "Sì, un personaggio che tutti hanno paura di lei."
    errors: [relative-pronoun]
  - tutor: "Un personaggio di cui tutti hanno paura, ma che tutti ammirano: capisco perché il libro ti abbia presa. Ti è piaciuto fino alla fine?"
    recast: {text: "che tutti hanno paura", fix: "di cui tutti hanno paura", tags: [relative-pronoun]}
    goals: [characters]
  - learner: "Attualmente all'inizio non mi piaceva, ma poi non riuscivo più a smettere di leggere."
    errors: [false-friend]
  - tutor: "In realtà succede spesso con i libri lenti: all'inizio fanno fatica, poi non li lasci più. A chi lo consiglieresti?"
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    goals: [opinion]
  - learner: "A chi ha avuto un'amica molto importante da giovane. E a chi vuole capire Napoli, naturalmente."
  - tutor: "Allora lo segno per il mese prossimo. Grazie! Chi vuole parlare adesso?"
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-m-worker
  history: [relative-pronoun, ci-ne]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho letto un giallo svedese. Un commissario deve trovare una ragazza che è scomparsa durante una festa."
  - tutor: "Ah, un giallo! E dove si svolge la storia?"
  - learner: "In un'isola piccola, in cui tutti si conoscono. È un posto dove non succede mai niente, fino a quella notte."
  - tutor: "Un'atmosfera perfetta per un giallo. E il commissario com'è?"
    goals: [summary]
  - learner: "È un uomo vecchio e stanco, che beve troppo. Ha una figlia che non vede da anni, e questo lo fa soffrire."
  - tutor: "Un classico eroe pieno di problemi. E la figlia ha un ruolo nella storia?"
  - learner: "Sì, ma non posso dire di più! È il personaggio che ho pensato di più dopo aver finito il libro."
    errors: [relative-pronoun]
  - tutor: "Niente sorprese rovinate, bravo! Ma «il personaggio che ho pensato di più»: si pensa «a» qualcuno. Come diventa il «che»?"
    prompt: {text: "il personaggio che ho pensato di più", tags: [relative-pronoun]}
  - learner: "Il personaggio che ci ho pensato di più, sì."
    errors: [relative-pronoun]
  - tutor: "«Il personaggio a cui ho pensato di più»: allora dev'essere davvero speciale. Nel complesso, il libro ti è piaciuto?"
    recast: {text: "che ci ho pensato", fix: "a cui ho pensato", tags: [relative-pronoun]}
    goals: [characters]
  - learner: "Molto. Il finale è sorprendente. Ma ci sono troppi personaggi: dopo cento pagine, ne avevo dimenticati la metà."
  - tutor: "Succede spesso con i gialli del Nord! A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "A chi piace il mistero e ha pazienza. L'autore ha scritto dieci gialli, e io voglio leggere almeno altri due."
    errors: [ci-ne]
  - tutor: "Allora ti è piaciuto davvero! Ma «voglio leggere almeno altri due»: due gialli, certo, però in italiano li riprendiamo con un pronome. Dove va?"
    prompt: {text: "voglio leggere almeno altri due", tags: [ci-ne]}
  - learner: "Ne voglio leggere almeno altri due!"
  - tutor: "Perfetto. Allora il prossimo lo leggiamo tutti insieme, e lo scegli tu. Chi vuole continuare?"
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: en-m-retired
  history: [tense-aspect, passive]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho letto un romanzo storico sulla costruzione del duomo di Firenze. Il personaggio principale è un giovane muratore."
  - tutor: "Che argomento! Di che cosa parla, senza dire troppo?"
  - learner: "Il ragazzo arrivava a Firenze nel 1420, senza soldi, e trova lavoro nel cantiere della cupola."
    errors: [tense-aspect]
  - tutor: "Bell'inizio. Ma «arrivava a Firenze nel 1420»: è un fatto unico, in un momento preciso, e subito dopo dici «trova». Come lo racconteresti?"
    prompt: {text: "arrivava a Firenze nel 1420", tags: [tense-aspect]}
  - learner: "Arriva a Firenze nel 1420 e trova lavoro nel cantiere."
  - tutor: "Esatto, così il racconto fila. E com'è questo ragazzo?"
    goals: [summary]
  - learner: "È coraggioso ma anche ingenuo. Si innamora della figlia di un mercante, ma la loro storia viene scoperta dal padre di lei."
  - tutor: "Ahi, immagino i problemi! E nel libro c'è anche Brunelleschi?"
    goals: [characters]
  - learner: "Sì, ma solo un po'. Secondo l'autore, i mattoni sono stato portati in alto con una macchina inventata da lui."
    errors: [passive]
  - tutor: "Quelle macchine sono famose! Ma «i mattoni sono stato portati»: «stato» deve concordare con «i mattoni». Come diventa?"
    prompt: {text: "sono stato portati", tags: [passive]}
  - learner: "Sì, sono stato portati con una macchina speciale."
    errors: [passive]
  - tutor: "Sì, i mattoni sono stati portati in alto così: un'idea geniale. E il libro, nel complesso, ti è piaciuto?"
    recast: {text: "sono stato portati", fix: "sono stati portati", tags: [passive]}
  - learner: "Molto, anche se il finale è un po' triste. Ci ho pensato per giorni."
  - tutor: "Un finale triste che ti resta in mente: allora funziona. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "A chi ama Firenze e la storia, ma anche ai ragazzi: io l'ho regalato a mio nipote, che studia architettura."
  - tutor: "Ottima idea. Allora lo metto nella lista del mese prossimo. Grazie!"
    goals: [recommend]

- scenario: film-libro
  level: B2
  persona: es-f-teacher
  history: [hypothetical, relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Io ho letto un libro di fantascienza. In un futuro vicino le persone non possono più sognare, e una ragazza scopre di essere l'unica che sogna ancora."
  - tutor: "Che idea originale! E che cosa le succede?"
  - learner: "Il governo la cerca, perché vuole studiare il suo cerebro. Lei scappa con un ragazzo che conosce da poco."
    errors: [word-choice]
  - tutor: "Vogliono studiare il suo cervello? Che paura! Una storia di fuga, quindi. E lei com'è?"
    recast: {text: "il suo cerebro", fix: "il suo cervello", tags: [word-choice]}
    goals: [summary]
  - learner: "È testarda e curiosa, ma ha anche molta paura. È un personaggio con cui mi sono identificata subito."
  - tutor: "Si sente da come ne parli. E tu che cosa pensi del libro?"
    goals: [characters]
  - learner: "Mi è piaciuto, ma il finale non mi ha convinto. Se l'autore avrebbe scritto un altro capitolo, sarebbe stato perfetto."
    errors: [hypothetical]
  - tutor: "Capita spesso con i finali! Ma «se l'autore avrebbe scritto»: dopo «se», per una cosa passata che non è successa, quale tempo usiamo?"
    prompt: {text: "Se l'autore avrebbe scritto", tags: [hypothetical]}
  - learner: "Se l'autore avesse scritto un altro capitolo, sarebbe stato perfetto."
  - tutor: "Esatto. E in quel capitolo che cosa avresti voluto leggere?"
    goals: [opinion]
  - learner: "Che cosa succede al ragazzo! È un personaggio che non sappiamo niente alla fine."
    errors: [relative-pronoun]
  - tutor: "Ah, ti capisco! Ma «un personaggio che non sappiamo niente»: non sappiamo niente «di» lui. Come diventa il «che»?"
    prompt: {text: "un personaggio che non sappiamo niente", tags: [relative-pronoun]}
  - learner: "Un personaggio di cui non sappiamo niente. Lo consiglierei comunque ai ragazzi, perché fa pensare."
  - tutor: "Esatto. E un finale aperto fa sempre discutere: lo propongo anche al gruppo. Grazie! Chi è il prossimo?"
    goals: [recommend]

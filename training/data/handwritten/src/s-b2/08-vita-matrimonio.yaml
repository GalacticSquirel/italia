# s-b2: B2 radio interviews about life in Italy, and planning a wedding.
- scenario: vita-in-italia
  level: B2
  persona: en-f-professional
  history: [tense-aspect, subjunctive-use]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. Sono arrivata nel 2018 per amore: avevo conosciuto mio marito due anni prima, in vacanza in Sicilia."
  - tutor: "Una storia romantica! E com'è stato l'arrivo?"
    goals: [story]
  - learner: "Difficile. Ogni volta che sono andata in un ufficio, mi hanno chiesto un documento diverso."
    errors: [tense-aspect]
  - tutor: "La famosa burocrazia! Ma «ogni volta che sono andata»: è una cosa che si ripeteva. Quale tempo usiamo per le abitudini del passato?"
    prompt: {text: "Ogni volta che sono andata", tags: [tense-aspect]}
  - learner: "Sì, ogni volta che sono andata, volevano un documento nuovo."
    errors: [tense-aspect]
  - tutor: "«Ogni volta che andavo in un ufficio»: molti nostri ascoltatori stranieri la capiscono bene! E qual è stata la cosa più dura?"
    recast: {text: "ogni volta che sono andata", fix: "Ogni volta che andavo", tags: [tense-aspect]}
  - learner: "La solitudine. Mio marito lavorava tutto il giorno, e io stavo a casa da sola. Un giorno piangevo per tre ore senza motivo."
    errors: [tense-aspect]
  - tutor: "Che momento difficile. Ma «un giorno piangevo per tre ore»: è un episodio preciso, con una durata chiusa. Quale tempo serve?"
    prompt: {text: "Un giorno piangevo per tre ore", tags: [tense-aspect]}
  - learner: "Un giorno ho pianto per tre ore. Poi ho deciso di iscrivermi a un corso di ceramica."
  - tutor: "Esatto. E il corso l'ha aiutata?"
    goals: [difficulties]
  - learner: "Moltissimo. Lì ho conosciuto le mie migliori amiche. Credo che quel corso mi ha cambiato la vita."
    errors: [subjunctive-use]
  - tutor: "Che bello. Ma «credo che quel corso mi ha cambiato»: dopo «credo che», per un fatto passato, quale forma usiamo?"
    prompt: {text: "Credo che quel corso mi ha cambiato", tags: [subjunctive-use]}
  - learner: "Credo che mi abbia cambiato la vita, davvero."
  - tutor: "Esatto. E lei, in questi anni, com'è cambiata?"
  - learner: "Attualmente sono molto più paziente di prima. E ho imparato a godermi il tempo: il pranzo della domenica, le chiacchiere al bar."
  - tutor: "Che bel cambiamento. Che consiglio darebbe a chi vuole trasferirsi in Italia?"
    goals: [change]
  - learner: "Di imparare la lingua prima di partire. Se l'avessi studiata prima, sarebbe stato tutto più facile."
  - tutor: "Un consiglio prezioso. Grazie di essere stata con noi, e in bocca al lupo per i suoi prossimi lavori!"
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [hypothetical, relative-pronoun]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti. Sono venuto in Italia dodici anni fa per lavoro: in Argentina c'era una crisi terribile, e qui avevo uno zio."
  - tutor: "Quindi all'inizio non è stata proprio una scelta libera."
    goals: [story]
  - learner: "Esatto. Lo zio che sono venuto da lui aveva una pizzeria a Genova, e ho cominciato lì come cameriere."
    errors: [relative-pronoun]
  - tutor: "Capisco. Ma «lo zio che sono venuto da lui»: c'è un «che» e anche un «da lui». Come si possono unire?"
    prompt: {text: "Lo zio che sono venuto da lui", tags: [relative-pronoun]}
  - learner: "Lo zio da cui sono venuto aveva una pizzeria a Genova."
  - tutor: "Esatto. E che cosa è stato più difficile, all'inizio?"
  - learner: "Il dialetto! I clienti anziani parlavano genovese, e io non capivo una parola. Molte volte ho pensato di tornare in Argentina."
  - tutor: "Me lo immagino! E perché alla fine è rimasto?"
    goals: [difficulties]
  - learner: "Perché ho conosciuto mia moglie. Se non l'avrei conosciuta, forse sarei tornato."
    errors: [hypothetical]
  - tutor: "Ecco il motivo! Ma «se non l'avrei conosciuta»: dopo «se», il condizionale non va. Quale tempo serve?"
    prompt: {text: "Se non l'avrei conosciuta", tags: [hypothetical]}
  - learner: "Se non la conoscevo, sarei tornato."
    errors: [hypothetical]
  - tutor: "«Se non l'avessi conosciuta, sarei tornato»: allora sua moglie ha cambiato tutto! E lei, com'è cambiato in questi anni?"
    recast: {text: "Se non la conoscevo", fix: "Se non l'avessi conosciuta", tags: [hypothetical]}
  - learner: "Sono diventato un po' genovese: brontolo sempre e sono molto tacagno!"
    errors: [word-choice]
  - tutor: "Tirchio? Ah, a Genova lo dicono tutti! Che consiglio darebbe a chi arriva oggi in Italia?"
    recast: {text: "tacagno", fix: "Tirchio", tags: [word-choice]}
    goals: [change]
    new: [{lemma: tirchio, gloss: stingy}]
  - learner: "Di non avere fretta, e di trovare una persona di cui fidarsi, come mio zio per me."
  - tutor: "Ottimo consiglio. Grazie di essere stato con noi, e un saluto a tutta la sua famiglia."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: en-m-retired
  history: [subjunctive-use, participle-agreement]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno. Io e mia moglie siamo venuti in Umbria sei anni fa, quando siamo andati in pensione. Ci eravamo innamorati della regione durante una vacanza."
  - tutor: "Una scelta coraggiosa. Perché proprio l'Umbria?"
    goals: [story]
  - learner: "Per la tranquillità, il cibo e i prezzi delle case. In Inghilterra una casa con giardino costa tre volte di più."
  - tutor: "E che cosa è stato difficile?"
  - learner: "La burocrazia, senza dubbio. Le pratiche per la residenza le abbiamo rifatto tre volte, perché mancava sempre un timbro."
    errors: [participle-agreement]
  - tutor: "Tre volte! Ma «le pratiche le abbiamo rifatto»: «le» sono le pratiche, quindi «rifatto» deve concordare. Come diventa?"
    prompt: {text: "le abbiamo rifatto", tags: [participle-agreement]}
  - learner: "Le abbiamo rifatte tre volte. Alla fine un vicino ci ha aiutato."
  - tutor: "Esatto. I vicini sono preziosi! E lei, com'è cambiato in questi anni?"
    goals: [difficulties]
  - learner: "Sono più lento, nel senso buono. Mangio con calma e parlo con tutti al mercato. Mia figlia dice che sembra che sono nato qui."
    errors: [subjunctive-use]
  - tutor: "Che complimento! Ma «sembra che sono nato»: dopo «sembra che», quale forma usiamo per un fatto passato?"
    prompt: {text: "sembra che sono nato", tags: [subjunctive-use]}
  - learner: "Sì, sembra che sono nato qui, anche se l'accento dice il contrario!"
    errors: [subjunctive-use]
  - tutor: "Sembra che sia nato qui, sì, e l'accento conta poco. Che consiglio darebbe a chi vuole venire a vivere in Italia dopo la pensione?"
    recast: {text: "sono nato", fix: "sia nato", tags: [subjunctive-use]}
    goals: [change]
  - learner: "Di imparare l'italiano prima di comprare casa. E di non pensare che tutto funzioni come a casa propria."
  - tutor: "Due consigli preziosi. Grazie di essere stato con noi, e un saluto a sua moglie."
    goals: [advice]

- scenario: vita-in-italia
  level: B2
  persona: es-f-erasmus
  history: [combined-pronouns, ci-ne]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Ciao a tutti! Sono venuta a Bologna con l'Erasmus quattro anni fa, e non sono più tornata in Spagna."
  - tutor: "Una storia classica! Che cosa l'ha convinta a restare?"
    goals: [story]
  - learner: "La città, l'università... e un lavoro che mi hanno offerto subito dopo la licenciatura."
    errors: [word-choice]
  - tutor: "Un lavoro subito dopo la laurea: che fortuna! E qual è stata la parte più difficile?"
    recast: {text: "la licenciatura", fix: "la laurea", tags: [word-choice]}
    new: [{lemma: laurea, gloss: university degree}]
  - learner: "Il freddo e la nebbia d'inverno! In Andalusia non ne avevo mai vista. E poi la mancanza della famiglia."
  - tutor: "La nostalgia è dura. Come la affronta?"
    goals: [difficulties]
  - learner: "Chiamo mia madre ogni giorno. A volte mi manda il prosciutto, e io le mando i tortellini. Anzi, quest'anno gli li porto io a Natale."
    errors: [combined-pronouns]
  - tutor: "Che scambio delizioso! Ma «gli li porto»: «gli» e «li» si uniscono in una parola sola. Come?"
    prompt: {text: "gli li porto", tags: [combined-pronouns]}
  - learner: "Glieli porto io a Natale."
  - tutor: "Esatto. E in questi anni, lei com'è cambiata?"
  - learner: "Sono più organizzata, e ceno più presto: in Spagna cenavo alle dieci, adesso alle otto! E di amici italiani ho tanti."
    errors: [ci-ne]
  - tutor: "Alle otto, che cambiamento! Ma «di amici italiani ho tanti»: con «di amici» davanti, serve un pronome prima del verbo. Quale?"
    prompt: {text: "ho tanti", tags: [ci-ne]}
  - learner: "Di amici italiani ho tanti, sì!"
    errors: [ci-ne]
  - tutor: "«Di amici italiani ne ho tanti»: si sente che è felice qui. Che consiglio darebbe a uno studente Erasmus che arriva adesso?"
    recast: {text: "ho tanti", fix: "ne ho tanti", tags: [ci-ne]}
    goals: [change]
  - learner: "Di uscire dal gruppo degli stranieri e parlare italiano dal primo giorno, anche se fa paura."
  - tutor: "Consiglio perfetto. Grazie di essere stata con noi, e buon Natale in anticipo alla sua mamma!"
    goals: [advice]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-professional
  history: [combined-pronouns, subjunctive-use]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Vorremmo una cosa semplice, all'aperto, in campagna. Al massimo ottanta invitati."
  - tutor: "Bellissimo: un matrimonio in campagna, tra gli alberi, è sempre magico. Avete già pensato a un budget?"
    goals: [vision]
  - learner: "Sì, abbiamo circa venticinquemila euro. Ma è importante che il budget comprende anche il fotografo."
    errors: [subjunctive-use]
  - tutor: "Si può fare. Ma «è importante che il budget comprende»: dopo «è importante che», quale modo ci vuole?"
    prompt: {text: "è importante che il budget comprende", tags: [subjunctive-use]}
  - learner: "Sì, è importante che comprende il fotografo."
    errors: [subjunctive-use]
  - tutor: "Certo, è importante che comprenda il fotografo: lo mettiamo subito nel conto. Con questa cifra abbiamo due possibilità: una villa sulle colline o un agriturismo vicino al lago."
    recast: {text: "comprende", fix: "comprenda", tags: [subjunctive-use]}
    goals: [budget]
    new: [{lemma: agriturismo, gloss: farm stay}]
  - learner: "Quanto costano tutte e due? E il menù, chi ce lo prepara?"
  - tutor: "La villa costa ottomila euro, ma il menù lo scegliete voi con un cuoco esterno. L'agriturismo ne costa seimila, e la cucina è la loro."
  - learner: "Allora preferiremmo l'agriturismo: per noi il cibo fatto in casa è più importante della villa."
  - tutor: "Ottima scelta. Se volete, chiedo un preventivo e ve lo mando entro venerdì."
    goals: [choices]
  - learner: "Sì, grazie. I genitori del mio fidanzato pagano una parte, quindi quando arriva gli lo inoltro subito."
    errors: [combined-pronouns]
  - tutor: "Perfetto. Solo una cosa: «gli lo inoltro». Quando «gli» incontra «lo», come diventa?"
    prompt: {text: "gli lo inoltro", tags: [combined-pronouns]}
  - learner: "Sì, gli lo inoltro stasera stessa."
    errors: [combined-pronouns]
  - tutor: "«Glielo inoltro stasera stessa»: benissimo. Ultima cosa: avete delle condizioni per me?"
    recast: {text: "gli lo inoltro", fix: "Glielo inoltro", tags: [combined-pronouns]}
    new: [{lemma: inoltrare, gloss: to forward}]
  - learner: "Sì: vogliamo che lei ci chieda sempre il permesso prima di firmare qualsiasi contratto, e che non superi mai il budget."
  - tutor: "Condizioni giustissime: niente firme senza di voi, e il budget resta quello. Ci vediamo venerdì con il preventivo!"
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-m-worker
  history: [conditional-form, ci-ne]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille! La mia fidanzata vorrebbe una festa grande, con tutta la famiglia: siamo messicani, e da noi i matrimoni sono enormi."
  - tutor: "Che bello! Quante persone pensate di invitare?"
    goals: [vision]
  - learner: "Duecento, più o meno. Dal Messico vengono solo quaranta, ma qui abbiamo tanti amici."
    errors: [ci-ne]
  - tutor: "Duecento, che festa! Ma «dal Messico vengono solo quaranta»: quaranta invitati, e in italiano li riprendiamo con un pronome. Dove va?"
    prompt: {text: "vengono solo quaranta", tags: [ci-ne]}
  - learner: "Dal Messico ne vengono solo quaranta. E non vogliamo spendere più di trentamila euro."
  - tutor: "Esatto. Con duecento invitati è un budget stretto, ma si può fare: una villa con un grande parco, a cento euro a persona, oppure un castello a centoquaranta."
    goals: [budget]
  - learner: "Io sceglierebbi la villa: costa meno e c'è spazio per ballare."
    errors: [conditional-form]
  - tutor: "Ottima idea. Ma «sceglierebbi»: con «io», come finisce il condizionale?"
    prompt: {text: "sceglierebbi", tags: [conditional-form]}
  - learner: "Io sceglierebbi la villa, sì, ma decidiamo insieme stasera."
    errors: [conditional-form]
  - tutor: "«Io sceglierei la villa»: mi sembra la scelta giusta per una festa così. Decidete pure con calma. Avete altre richieste per me?"
    recast: {text: "sceglierebbi", fix: "sceglierei", tags: [conditional-form]}
    goals: [choices]
  - learner: "Sì, la musica: vorremmo due gruppi, uno messicano e uno italiano. Lei conosce?"
    errors: [ci-ne]
  - tutor: "Due gruppi, che bello! Ma «lei conosce?»: conosco che cosa? Dei gruppi, e in italiano li riprendiamo con un pronome. Quale?"
    prompt: {text: "Lei conosce?", tags: [ci-ne]}
  - learner: "Lei ne conosce qualcuno?"
  - tutor: "Esatto. Sì, ne conosco tre bravissimi, e li chiamo io. Ci sono condizioni da mettere nel contratto?"
  - learner: "Sì: non un euro sopra i trentamila, e vogliamo vedere ogni preventivo prima di firmare."
  - tutor: "Perfetto: nessuna firma senza di voi. Vi mando i preventivi della villa e dei gruppi entro una settimana."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-m-traveller
  history: [subjunctive-use, preposition]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Io e la mia fidanzata vorremmo sposarci in spiaggia, al tramonto, in Puglia."
  - tutor: "Che sogno! Una cerimonia in spiaggia al tramonto. Quanti invitati pensate di avere?"
    goals: [vision]
  - learner: "Una cinquantina. Però molti vengono dall'Australia, quindi bisogna che il matrimonio è in un posto facile da raggiungere."
    errors: [subjunctive-use]
  - tutor: "Giusto pensarci. Ma «bisogna che il matrimonio è»: dopo «bisogna che», quale modo usiamo?"
    prompt: {text: "bisogna che il matrimonio è", tags: [subjunctive-use]}
  - learner: "Bisogna che sia in un posto facile da raggiungere, vicino all'aeroporto."
  - tutor: "Esatto. Allora la zona di Bari è perfetta. Qual è il vostro budget?"
  - learner: "Circa trentamila euro, ma vorremmo risparmiare per il viaggio di nozze. Abbiamo deciso a fare un matrimonio piccolo."
    errors: [preposition]
  - tutor: "Saggio. Ma «abbiamo deciso a fare»: con «decidere», davanti all'infinito, quale preposizione va?"
    prompt: {text: "Abbiamo deciso a fare", tags: [preposition]}
  - learner: "Abbiamo deciso di fare un matrimonio piccolo."
  - tutor: "Esatto. Allora vi propongo due posti: una villa con piscina a venti minuti dal mare, o uno stabilimento privato direttamente sulla spiaggia."
    goals: [budget]
  - learner: "Che differenza c'è di prezzo? Penso che la spiaggia costa di più."
    errors: [subjunctive-use]
  - tutor: "Bella domanda. Ma «penso che la spiaggia costa»: anche qui, dopo «penso che», come cambia il verbo?"
    prompt: {text: "Penso che la spiaggia costa", tags: [subjunctive-use]}
  - learner: "Penso che la spiaggia costa di più, no?"
    errors: [subjunctive-use]
  - tutor: "Pensate che la spiaggia costi di più? In realtà no: costa meno della villa, perché non c'è niente da affittare oltre alla sala."
    recast: {text: "la spiaggia costa", fix: "la spiaggia costi", tags: [subjunctive-use]}
  - learner: "Allora scegliamo la spiaggia! Ma se piove? Ci serve un piano B."
  - tutor: "Lo stabilimento ha una grande sala coperta, quindi siete tranquilli. Avete altre condizioni per me?"
    goals: [choices]
  - learner: "Sì: vogliamo che tutti i fornitori siano pugliesi, e che i fiori siano di stagione."
  - tutor: "Perfetto, così si spende anche meno. Vi mando le proposte dei fornitori entro dieci giorni."
    goals: [conditions]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-f-teacher
  history: [relative-pronoun, combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Ci sposiamo a settembre. Vorremmo un matrimonio elegante ma non troppo formale, in una città d'arte."
  - tutor: "Che bello. Avete già in mente una città?"
    goals: [vision]
  - learner: "Sì, Firenze: è la città dove ci siamo conosciuti, durante un corso estivo."
  - tutor: "Romantico! E il budget, più o meno?"
  - learner: "Quarantamila euro. Ma mio padre, che vuole pagare una parte, vorrebbe che la cerimonia fosse in una chiesa antica."
  - tutor: "Con quarantamila euro a Firenze si può fare molto. E di chiese antiche ce ne sono di bellissime."
    goals: [budget]
  - learner: "La chiesa che pensavo è quella di San Miniato, sopra la città."
    errors: [relative-pronoun]
  - tutor: "Splendida scelta. Ma «la chiesa che pensavo»: si pensa «a» qualcosa. Come diventa il «che»?"
    prompt: {text: "La chiesa che pensavo", tags: [relative-pronoun]}
  - learner: "La chiesa che ci pensavo, sì, San Miniato."
    errors: [relative-pronoun]
  - tutor: "«La chiesa a cui pensavo»: perfetto, domani chiamo per la data. Per la cena vi propongo due ville: una sulle colline, con la vista sulla città, o una in centro, più elegante."
    recast: {text: "che ci pensavo", fix: "a cui pensavo", tags: [relative-pronoun]}
  - learner: "La villa sulle colline, senza dubbio! E il menù, ci lo fanno provare prima?"
    errors: [combined-pronouns]
  - tutor: "Certo. Ma «ci lo fanno provare»: davanti a «lo», «ci» cambia. Come diventa?"
    prompt: {text: "ci lo fanno provare", tags: [combined-pronouns]}
  - learner: "Ce lo fanno provare prima del matrimonio?"
  - tutor: "Esatto, sì: ve lo fanno provare un mese prima. E la visita alla villa la organizzo per sabato."
    goals: [choices]
  - learner: "Perfetto. Una condizione: le foto le vogliamo vedere prima che le mandate agli invitati."
    errors: [subjunctive-use]
  - tutor: "Giustissimo. Ma «prima che le mandate»: dopo «prima che», quale modo serve?"
    prompt: {text: "prima che le mandate", tags: [subjunctive-use]}
  - learner: "Prima che le mandiate. E la lista degli invitati gliela mando io la settimana prossima."
  - tutor: "Perfetto, aspetto la lista. Allora: villa sulle colline, menù da provare ad agosto e nessuna foto agli invitati senza il vostro permesso."
    goals: [conditions]

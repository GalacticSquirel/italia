- scenario: smartworking
  level: C1
  persona: en-f-student
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Un po' e un po'. Faccio uno stage in un'agenzia di comunicazione: tre giorni da casa e due in ufficio, il martedì e il giovedì. All'inizio mi sembrava il paradiso, adesso ho qualche dubbio."
    - tutor: "Tre giorni a casa a ventidue anni? Io alla tua età avrei firmato subito! Che cosa c'è di bello, intanto?"
      goals: [situation]
    - learner: "Di bello c'è che risparmio due ore di treno al giorno e un sacco di soldi. E poi, diciamolo, lavorare da casa è più comodo di andare in ufficio: scrivo in tuta, mangio quando ho fame e nessuno mi interrompe ogni cinque minuti."
      errors: [comparative]
    - tutor: "La tuta è un argomento serio, lo riconosco! Però senti: «più comodo di andare»? Quando metti a confronto due verbi, quella parolina cambia."
      goals: [pros]
      prompt: {text: "più comodo di andare", tags: [comparative]}
    - learner: "Giusto: lavorare da casa è più comodo che andare in ufficio. Comodo, però, non vuol dire meglio, ed è qui che nascono i dubbi."
    - tutor: "Ecco, proprio «che». E adesso sentiamo i dubbi, perché mi sa che il paradiso non è poi così perfetto."
    - learner: "Per niente. Da stagista dovrei imparare guardando gli altri, e da casa non vedo nessuno. Le cose importanti si decidono al caffè, il martedì, e io le scopro il giovedì. In più abito in una stanza di dodici metri: letto, scrivania e cucina sono praticamente lo stesso mobile."
    - tutor: "Dodici metri per vivere e lavorare: altro che paradiso! Hai ragione, il mestiere si ruba con gli occhi. E se potessi scegliere tu?"
      goals: [cons]
      new: [{lemma: rubare il mestiere con gli occhi, gloss: to learn a trade by watching}]
    - learner: "Se potessi scegliere, farei il contrario: tre giorni in ufficio e due a casa, almeno per il primo anno. Più avanti, quando saprò fare il mio lavoro senza chiedere tutto a tutti, un orario flessibile me lo godrei di più."
    - tutor: "Ragionamento da persona saggia, altro che ventidue anni. Proponilo al tuo capo: secondo me lo apprezza. Intanto prendiamo ancora due olive?"
      goals: [preference]

- scenario: smartworking
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Né l'uno né l'altro, in realtà: lavoro da dove capita. Faccio il programmatore per un'azienda di Dublino, quindi il mio ufficio è il portatile. Questo mese sono a Palermo, il mese scorso ero a Lisbona."
    - tutor: "Che invidia! Tu lavori con vista sul mare e io con vista sul parcheggio. Dai, fammi soffrire fino in fondo: quali sono i vantaggi?"
      goals: [situation]
    - learner: "Il vantaggio principale è la libertà, ovvio. Scelgo io dove vivere e, entro certi limiti, quando lavorare. E poi è molto conveniente non dover prendere la metropolitana ogni mattina: mi alzo, faccio il caffè e sono già alla scrivania."
      errors: [false-friend]
    - tutor: "Certo che è comodo non dover prendere la metropolitana: io ci passo un'ora e mezza al giorno! Va bene, ho sofferto abbastanza. Adesso dimmi che c'è almeno uno svantaggio, ti prego."
      goals: [pros]
      recast: {text: "conveniente", fix: "comodo", tags: [false-friend]}
    - learner: "Ce ne sono, tranquillo. Il più pesante è la solitudine: i colleghi sono faccine su uno schermo, e certe settimane l'unica persona con cui parlo dal vivo è il barista. E poi l'orario: essendo sempre «flessibile», finisce che non stacco mai, perché c'è sempre qualcuno sveglio dall'altra parte del mondo."
    - tutor: "Ah, ecco. La libertà di lavorare quando vuoi, cioè sempre: non ci avevo pensato. Quindi, potendo scegliere, torneresti in un ufficio vero?"
      goals: [cons]
    - learner: "In un ufficio tutti i giorni no, non ce la farei più. Però mi piacerebbe una via di mezzo: una base fissa, in una città sola, con uno spazio condiviso dove andare due o tre volte alla settimana. Mi sono accorto che non mi manca l'ufficio: mi mancano i colleghi con cui pranzare."
    - tutor: "Allora fermati a Palermo, che lì il pranzo è una cosa seria! A parte gli scherzi, mi sembra la scelta giusta: un po' di libertà e un po' di compagnia."
      goals: [preference]

- scenario: smartworking
  level: C1
  persona: es-f-erasmus
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Vado in ufficio tutti i giorni, purtroppo. Lavoro in una casa editrice piccola, e la direttrice è convinta che, se non ci vede seduti, non stiamo lavorando. Durante la pandemia abbiamo lavorato da casa per un anno, e poi è tornato tutto come prima."
    - tutor: "Classico: il capo che ti conta le ore sulla sedia. E a te come andava, quell'anno a casa?"
      goals: [situation]
    - learner: "Benissimo, per certi versi. Per correggere le bozze mi serve silenzio, e a casa riuscivo a concentrarmi come in ufficio non mi capita mai: facevo in quattro ore quello che adesso faccio in sette. E l'orario flessibile mi permetteva di andare a correre a metà mattina."
    - tutor: "Quattro ore invece di sette: se lo sapesse la tua direttrice! Ma se era tutto così bello, perché dici «per certi versi»?"
      goals: [pros]
    - learner: "Perché dopo qualche mese ho cominciato a sentirmi fuori dal mondo. Le idee per i libri nuovi nascevano dalle chiacchiere in corridoio, e in videochiamata nessuno chiacchiera. E poi, vivendo sola, certi giorni mi accorgevo alle sei di sera di non aver detto una parola ad alta voce."
    - tutor: "Questo fa un po' impressione, in effetti. Quindi nemmeno a casa era la soluzione. Che cosa chiederesti, se la direttrice ti desse carta bianca?"
      goals: [cons]
      new: [{lemma: dare carta bianca, gloss: to give free rein}]
    - learner: "Chiederei due giorni a casa, da dedicare al lavoro che richiede concentrazione, e tre in ufficio per le riunioni e per i colleghi. Sarebbe meglio per me e, ne sono convinta, anche per la casa editrice. Magari un giorno troverò il coraggio di proporglielo."
    - tutor: "Trovalo, il coraggio, perché contro l'argomento delle quattro ore non c'è risposta. Portale i numeri e vedrai. Alla tua, e ai due giorni a casa!"
      goals: [preference]

- scenario: trattativa-affitto
  level: C1
  persona: en-m-traveller
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, mi è definitivamente piaciuto: è luminoso, e la posizione è perfetta per me. Ho però una perplessità, e preferisco dirgliela subito: le finestre sono vecchie, e d'inverno temo che il riscaldamento mi costi una fortuna."
      errors: [false-friend]
    - tutor: "Mi fa piacere che le sia piaciuto davvero, e l'osservazione sulle finestre è corretta: sono quelle originali. Il proprietario lo sa, ed è uno dei motivi per cui il canone, 950 euro, è sotto la media della zona."
      goals: [interest]
      recast: {text: "definitivamente", fix: "davvero", tags: [false-friend]}
    - learner: "Sotto la media, forse, ma non di molto: ho visto un appartamento simile a due strade da qui a novecento euro, con le finestre nuove. Se il proprietario scendesse a 870, sarei disposto a firmare questa settimana."
    - tutor: "A 870 dubito che accetti. Il canone è trattabile, ma entro certi limiti. Potrei proporgli 900, se lei mi dà qualche elemento in più: che tipo di contratto ha in mente?"
    - learner: "Ho un contratto di lavoro a tempo indeterminato e resterei volentieri a lungo. Mi andrebbe bene un quattro più quattro. E se il proprietario si impegnasse a cambiare le finestre entro un anno, accetterei anche 920."
    - tutor: "Questa è una proposta intelligente: un inquilino stabile gli interessa più di cinquanta euro. Devo però avvisarla che chiederà tre mesi di garanzia, e che la disdetta va data con sei mesi di anticipo."
      goals: [negotiate]
    - learner: "Tre mesi di garanzia mi stanno bene. Sei mesi di preavviso, invece, mi sembrano tanti: se la mia azienda mi trasferisse, mi troverei a pagare due affitti. Sarebbe possibile inserire una clausola che li riduca a tre in caso di trasferimento per lavoro?"
    - tutor: "È una clausola abbastanza comune, credo che si possa ottenere. Ricapitolo: 920 euro, finestre nuove entro dodici mesi messe per iscritto, tre mesi di garanzia e disdetta più breve per motivi di lavoro."
      goals: [conditions]
    - learner: "Esatto. A queste condizioni firmo. Se invece il proprietario non volesse impegnarsi per iscritto sulle finestre, preferirei lasciar perdere, con dispiacere."
    - tutor: "Chiarissimo, e mi sembra una posizione corretta. Lo chiamo oggi pomeriggio e le faccio sapere entro domani; ho buone ragioni per essere ottimista."
      goals: [conclude]

- scenario: trattativa-affitto
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Molto, non glielo nascondo. La cucina è grande, e il balcone sul cortile interno è una rarità. Mi interessa seriamente, ma c'è una cosa che mi frena: il canone di milletrecento euro supera di parecchio la cifra che mi ero prefissata."
    - tutor: "La ringrazio per la chiarezza. Tenga presente che il proprietario applica la cedolare secca, quindi il canone non aumenterà per tutta la durata del contratto. Che cifra aveva in mente?"
      goals: [interest]
    - learner: "Millecento, spese escluse. So che la distanza è notevole, ma offro alcune garanzie: sono insegnante di ruolo, non ho animali e sarei pronta a entrare già dal primo del mese, evitandovi settimane di appartamento vuoto."
    - tutor: "Sono elementi che contano, e glieli riconosco. Tuttavia millecento è lontano: il proprietario ha già rifiutato milleduecento la settimana scorsa. Potrei forse arrivare a milleduecentocinquanta, compreso il posto auto."
    - learner: "Il posto auto non mi serve, perché non ho la macchina; preferirei che lo affittasse a qualcun altro e mi togliesse quei cinquanta euro. E il contratto, di che tipo sarebbe? Se fosse un tre più due, con una disdetta ragionevole, potrei fare uno sforzo."
    - tutor: "Sarebbe proprio un tre più due, con disdetta a tre mesi. Senza il posto auto posso proporgli 1.200 euro, ma glielo dico francamente: sotto quella cifra non scenderà."
      goals: [negotiate, conditions]
    - learner: "Apprezzo la sincerità, e la ricambio. Milleduecento, con le spese di condominio, vuol dire più del quaranta per cento del mio stipendio, e non sarebbe prudente. A malincuore devo rinunciare."
    - tutor: "Mi dispiace, ma la capisco: è una decisione saggia. Se permette, tengo il suo numero: sta per liberarsi un appartamento più piccolo nella stessa zona, che potrebbe fare al caso suo."
    - learner: "Volentieri, mi farebbe un grande favore. E se il proprietario dovesse ripensarci, sa dove trovarmi. La ringrazio per il tempo e per la correttezza."
    - tutor: "Grazie a lei. La chiamo appena l'altro appartamento è disponibile, e chissà che nel frattempo il proprietario non cambi idea. Buona giornata!"
      goals: [conclude]

- scenario: trattativa-affitto
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto, e sono pronta a parlarne sul serio. C'è però un punto che vorrei chiarire prima: nell'annuncio si parla di una provvigione pari a due mensilità, che mi sembra alta rispetto a quello che chiedono altre agenzie."
    - tutor: "È una domanda che mi fanno spesso. Due mensilità è la nostra tariffa abituale, ma comprende la registrazione del contratto e l'assistenza per tutto il primo anno. Detto questo, se troviamo un accordo sul resto, un margine c'è."
      goals: [interest]
    - learner: "Bene, allora parliamo del resto. Ho letto la bozza del contratto e ho pagato molta attenzione alle clausole. Il canone di millecinquanta euro mi sta bene, a patto che comprenda le spese di condominio, che nell'annuncio non erano indicate."
      errors: [word-choice]
    - tutor: "Si vede che ha prestato molta attenzione alle clausole, e ha fatto bene. Le spese di condominio sono circa ottanta euro al mese: il proprietario difficilmente le includerà tutte, ma potremmo dividerle a metà."
      recast: {text: "pagato molta attenzione", fix: "prestato molta attenzione", tags: [word-choice]}
    - learner: "A metà potrei accettare, se in cambio la provvigione scendesse a una mensilità e mezza. Mi sembra uno scambio equilibrato: io vengo incontro al proprietario, e l'agenzia viene incontro a me."
    - tutor: "È un modo elegante di metterla, e non posso dirle di no: una mensilità e mezza, con le spese divise a metà. Passiamo alla durata? Il proprietario propone un quattro più quattro."
      goals: [negotiate]
    - learner: "Il quattro più quattro va benissimo. Mi preoccupa soltanto la clausola sulla disdetta: sei mesi di preavviso, senza eccezioni. Vorrei che fosse previsto un preavviso di tre mesi nel caso in cui dovessi lasciare la città per motivi di lavoro o di famiglia."
    - tutor: "È una richiesta ragionevole, e credo che il proprietario la accetterà, soprattutto se la garanzia resta di tre mensilità."
      goals: [conditions]
    - learner: "Sulle tre mensilità di garanzia sono d'accordo. Allora, se mi conferma tutto per iscritto, per me l'accordo è fatto."
    - tutor: "Perfetto. Le mando stasera la bozza aggiornata e, se va tutto bene, firmiamo lunedì in agenzia. Benvenuta nella sua nuova casa, o quasi!"
      goals: [conclude]

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per questo. Capisco che i costi siano aumentati, ma i vostri prezzi sono subiti del quindici per cento da un giorno all'altro, e per un'azienda piccola come la nostra è un colpo difficile da assorbire."
      errors: [false-friend]
    - tutor: "Mi rendo conto che, quando i prezzi sono saliti del quindici per cento in una volta sola, la notizia non fa piacere. Le assicuro però che abbiamo aspettato fino all'ultimo: la carta e la plastica ci costano un quinto in più rispetto a gennaio."
      goals: [problem]
      recast: {text: "sono subiti", fix: "sono saliti", tags: [false-friend]}
    - learner: "Non lo metto in dubbio. Tuttavia lavoriamo insieme da otto anni, non abbiamo mai pagato una fattura in ritardo, e i nostri ordini sono cresciuti ogni anno. Mi sarei aspettato che un cliente così venisse almeno avvisato prima, e trattato diversamente da chi ordina una volta sola."
    - tutor: "Ha ragione, avremmo dovuto chiamarla prima, e me ne scuso. Quanto al trattamento, il listino è uguale per tutti; ma per i clienti di lunga data un po' di margine si può trovare. Che cosa ha in mente?"
      goals: [argue]
    - learner: "Le propongo questo: accettiamo un aumento del sette per cento, e in cambio ci impegniamo con un contratto di due anni e con un ordine minimo più alto del dieci per cento. Voi avreste la certezza delle quantità, noi quella dei prezzi."
    - tutor: "Il sette è troppo poco, glielo dico subito: non copre nemmeno i nostri costi. Con un contratto di due anni, però, posso scendere al dieci, e tenere fermo il prezzo per i primi dodici mesi."
      goals: [counteroffer]
    - learner: "Al dieci potrei arrivare, se il prezzo restasse fermo per tutta la durata del contratto e se la consegna rimanesse gratuita, com'è stata finora. Altrimenti sarei costretto a chiedere un preventivo anche ad altri fornitori, cosa che preferirei evitare."
    - tutor: "Lo preferirei anch'io. D'accordo: dieci per cento, prezzo fermo per ventiquattro mesi e consegna gratuita, in cambio di un ordine minimo più alto del dieci."
    - learner: "Affare fatto. Mi manda lei la bozza del contratto, così la faccio vedere al titolare? Se arriva entro la settimana, il primo ordine alle nuove condizioni parte a inizio mese."
    - tutor: "Gliela mando domani mattina. La ringrazio per la fiducia e per la sua onestà: con clienti così si lavora volentieri."
      goals: [agreement]

- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, è per il listino, e non le nascondo che l'aumento ci ha colti di sorpresa. Un quindici per cento sugli imballaggi significa, per noi, rivedere i prezzi di metà dei prodotti, proprio adesso che abbiamo appena firmato con due catene di supermercati."
    - tutor: "Capisco la difficoltà, e mi dispiace che arrivi in un momento delicato. Purtroppo non è una scelta: se non alzassimo i prezzi, lavoreremmo in perdita."
      goals: [problem]
    - learner: "Nessuno le chiede di lavorare in perdita. Le faccio però notare che, grazie a quei due contratti, i nostri ordini raddoppieranno entro l'anno. Se i vostri costi fissi restano gli stessi, un cliente che compra il doppio dovrebbe costarvi, in proporzione, di meno. Non crede che questo meriti di essere considerato?"
    - tutor: "È un argomento serio, e glielo riconosco. Per ora, però, è soltanto una previsione. Se avessi un impegno scritto sulle quantità, potrei parlarne diversamente con la direzione."
      goals: [argue]
    - learner: "Mi sembra giusto. Le propongo allora uno sconto legato alle quantità: prezzo di listino sui primi ordini, e un aumento ridotto al sei per cento, applicato a tutto l'anno, se superiamo le quantità che le indico per iscritto. Se non le raggiungessimo, pagheremmo la differenza."
    - tutor: "La formula mi piace, la cifra meno. Al sei non arrivo; all'otto sì, facendo i conti a fine anno come dice lei. E mi servirebbe un pagamento a trenta giorni invece che a sessanta."
      goals: [counteroffer]
    - learner: "Otto per cento e pagamento a trenta giorni: potrei accettare, a patto che i tempi di consegna scendano da dieci a sette giorni. Con i supermercati non possiamo permetterci ritardi."
    - tutor: "Sette giorni si possono garantire, con ordini di quella dimensione. Allora siamo d'accordo su tutto?"
    - learner: "Direi di sì: otto per cento una volta raggiunte le quantità, pagamento a trenta giorni, consegna in sette. Le chiedo solo di mettere tutto in un'unica pagina, così la firmo entro venerdì."
    - tutor: "La riceverà domani. È stato un piacere trattare con lei: dura, ma leale. A presto, e in bocca al lupo con i supermercati."
      goals: [agreement]

- scenario: vita-in-italia
  level: C1
  persona: es-f-teacher
  turns:
    - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a lei e a chi ci ascolta. In realtà non l'ho scelta io: è stata l'Italia a scegliere me. Sono arrivata a Napoli nove anni fa con una borsa di studio di sei mesi, e prima che finisse avevo già trovato un lavoro in un liceo e, soprattutto, un quartiere dove mi sentivo a gusto."
      errors: [false-friend]
    - tutor: "«Un quartiere dove mi sentivo a mio agio»: che bella frase, ed è la cosa più difficile da trovare, altro che il lavoro! Ma immagino che non sia stato tutto rose e fiori. Qual è stata la parte più dura?"
      goals: [story]
      recast: {text: "a gusto", fix: "a mio agio", tags: [false-friend]}
    - learner: "Senza dubbio la burocrazia. Per ottenere il permesso di soggiorno ho fatto la fila in questura sei volte, e ogni volta mancava un documento diverso. Se qualcuno me l'avesse detto prima, avrei portato tutto la prima volta."
    - tutor: "Sei volte: c'è chi avrebbe fatto le valigie alla terza! E lei, in questi nove anni, come è cambiata?"
      goals: [difficulties]
    - learner: "Sono diventata più paziente, questo è sicuro. E anche più flessibile: in Spagna pianificavo tutto, qui ho imparato che un piano B serve sempre, e a volte anche un piano C. Mia madre dice che ormai parlo spagnolo con le mani, come una napoletana."
    - tutor: "Parlare con le mani è il segno che l'integrazione è riuscita, glielo garantisco! Per chiudere: che consiglio darebbe a un ascoltatore che sta pensando di trasferirsi?"
      goals: [change]
    - learner: "Gli direi di imparare la lingua prima di partire, almeno un po', e di non chiudersi nella comunità degli stranieri. E poi di armarsi di pazienza con la burocrazia, ma di non giudicare l'Italia dagli uffici: le persone, qui, ti accolgono se fai il primo passo."
    - tutor: "Un consiglio prezioso, e detto con il cuore. Grazie di essere stata con noi, e buona continuazione a Napoli!"
      goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-m-retired
  history: [hypothetical]
  turns:
    - tutor: "Benvenuti ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto proprio l'Italia?"
    - learner: "Grazie dell'invito. Diciamo che l'ho scelta per pigrizia meteorologica: dopo quarant'anni di pioggia a Manchester, quando sono andato in pensione io e mia moglie abbiamo cercato un posto dove il sole non fosse un evento. Così, sei anni fa, abbiamo comprato una casa in Umbria."
    - tutor: "Pigrizia meteorologica: questa me la segno! E una volta arrivati, qual è stata la parte più difficile?"
      goals: [story]
    - learner: "La lingua, senza dubbio. Avevo fatto un corso a Manchester, ma in paese parlano un dialetto stretto e per mesi ho capito una parola su dieci. Se avrei saputo quanto era diverso, avrei cominciato a studiare molto prima."
      errors: [hypothetical]
      gold: {text: "Se avrei saputo", fix: "Se avessi saputo"}
    - tutor: "Una parola su dieci, che fatica! Però attenzione a quel «se avrei saputo»: dopo il «se», in un'ipotesi sul passato, che modo ci vuole?"
      prompt: {text: "Se avrei saputo", tags: [hypothetical]}
    - learner: "Ah, il congiuntivo, giusto: se avessi saputo quanto era diverso. Adesso, per fortuna, al bar del paese mi capiscono, e soprattutto li capisco io."
    - tutor: "Perfetto, proprio così. E in questi sei anni, oltre all'orecchio, che cosa è cambiato in lei?"
      goals: [difficulties]
    - learner: "Ho rallentato. A Manchester mangiavo un panino davanti al computer; qui il pranzo dura un'ora e nessuno si scusa. All'inizio mi sembrava tempo perso, adesso mi sembra la cosa più sensata del mondo."
    - tutor: "Benvenuto nella civiltà del pranzo! E a un ascoltatore inglese che ci sta pensando, che cosa direbbe?"
      goals: [change]
    - learner: "Di venire prima in affitto per un anno, in tutte le stagioni, perché un paese ad agosto e lo stesso paese a febbraio sono due mondi diversi. E di comprare casa solo dopo, se ne è ancora convinto."
    - tutor: "Saggezza pura: agosto inganna, febbraio dice la verità. Grazie di cuore per essere stato con noi!"
      goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-f-student
  turns:
    - tutor: "Benvenute e benvenuti ai nostri ascoltatori. Oggi è con noi una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno! Sono venuta a Bologna per un dottorato in storia medievale, perché i documenti che studio sono qui, negli archivi. Pensavo di restare tre anni, e invece sono già cinque."
    - tutor: "Gli archivi come motivo per cambiare vita: è la prima volta che lo sento in questa trasmissione! Cinque anni, quindi: qual è stata la difficoltà più grande?"
      goals: [story]
    - learner: "Sai, la cosa più difficile non è stata la lingua ma la solitudine dei primi mesi. Gli italiani sono simpaticissimi, però hanno già i loro amici dai tempi del liceo, ed entrare in quei gruppi è un'impresa."
      errors: [register]
    - tutor: "È un'osservazione che fanno in tanti, ha ragione. Un attimo, però: «sai»? Siamo in onda, e finora ci siamo dati del lei."
      prompt: {text: "Sai", tags: [register]}
    - learner: "Ha ragione, scusi: sa, volevo dire. Comunque alla fine ci sono riuscita grazie a un coro: si canta insieme una volta alla settimana, e dopo le prove si va tutti in pizzeria."
    - tutor: "Non si preoccupi. Il coro e la pizzeria: una ricetta d'integrazione che consiglierei a chiunque. E lei, in questi anni, in che cosa è cambiata?"
      goals: [difficulties]
    - learner: "Ho realizzato che prima ero molto rigida con gli orari. Adesso, se un amico dice «alle otto», so che vuol dire le otto e mezza, e non mi arrabbio più. Forse sono diventata un po' bolognese."
      errors: [false-friend]
    - tutor: "«Mi sono resa conto che alle otto vuol dire alle otto e mezza»: ecco una frase da vera bolognese! Ultima domanda: che consiglio darebbe a chi sta per trasferirsi?"
      goals: [change]
      recast: {text: "Ho realizzato", fix: "Mi sono resa conto", tags: [false-friend]}
    - learner: "Di trovare subito un'attività di gruppo, qualunque essa sia: un coro, una squadra, un corso di cucina. E di non aspettare che siano gli altri a invitarti: in Italia, chi invita per primo trova amici per la vita."
    - tutor: "Un consiglio concreto e generoso. Grazie mille, e salutiamo il suo coro, che magari ci sta ascoltando!"
      goals: [advice]

- scenario: turismo-di-massa
  level: C1
  persona: es-m-worker
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno. Sono spagnolo, ma vivo a Venezia da dodici anni e faccio il cameriere a due passi da Rialto. Sono contrario al ticket: non perché il problema non esista, ma perché credo che non serva a niente."
    - tutor: "Contrario, ma per motivi diversi dai soliti: interessante. Però mi spieghi: perché non dovrebbe servire, se scoraggia chi viene solo per un giorno?"
      goals: [introduce]
    - learner: "Perché cinque euro, per chi ha speso duemila euro per una crociera, non sono niente. L'estate scorsa, nei giorni del ticket, davanti al mio locale c'era sempre la stessa folla, e per attraversare il ponte si faceva una coda larga venti minuti."
      errors: [false-friend]
    - tutor: "Una coda lunga venti minuti per attraversare un ponte: immagino la pazienza dei residenti. Ma faccio l'avvocato del diavolo: senza quei turisti, lei il lavoro ce l'avrebbe?"
      goals: [example]
      recast: {text: "larga", fix: "lunga", tags: [false-friend]}
    - learner: "Ce l'avrei, e forse migliore. Il turista di un giorno porta il panino da casa e non si siede al tavolo; chi resta tre notti, invece, va al ristorante, al museo, dall'artigiano. Non è che l'economia locale viva grazie alla folla: vive nonostante la folla."
    - tutor: "«Nonostante la folla»: bella frase, e difficile da contraddire. Allora, se il ticket non funziona, che cosa propone?"
      goals: [rebut]
    - learner: "Un numero chiuso vero, con prenotazione obbligatoria nei giorni di punta, e soprattutto un limite alle grandi navi. E i soldi raccolti andrebbero spesi per le case dei residenti, perché una città senza abitanti non è più una città, è un museo."
    - tutor: "Numero chiuso, meno navi e case per chi ci vive: una proposta chiara, anche se scontenterà qualcuno. Grazie della telefonata, e buon lavoro a Rialto!"
      goals: [proposal]

- scenario: turismo-di-massa
  level: C1
  persona: en-f-professional
  turns:
    - tutor: "Abbiamo in linea una nuova ascoltatrice. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno, sono un'architetta inglese e lavoro a Firenze da otto anni. Sono a favore, anche se con qualche riserva: un ticket da solo non risolve niente, ma è un primo segnale."
    - tutor: "Un primo segnale, dice lei. Però c'è chi sostiene che sia solo una tassa in più, e basta: lei che esempio ci porta?"
      goals: [introduce]
    - learner: "Le porto quello della mia via. Cinque anni fa c'erano una panetteria, un ferramenta e un calzolaio; oggi ci sono tre negozi di souvenir e due gelaterie. Il problema dello svuotamento del centro deve essere affrontare subito, prima che sia troppo tardi."
      errors: [passive]
      gold: {text: "deve essere affrontare", fix: "deve essere affrontato"}
    - tutor: "Dalla panetteria al souvenir: un esempio che parla da solo. Ma ripeta quella fine: il problema «deve essere affrontare»?"
      prompt: {text: "deve essere affrontare", tags: [passive]}
    - learner: "Ah, sì: deve essere affrontato subito. Ecco, il ticket, per me, è il segnale che finalmente qualcuno ci prova."
    - tutor: "Esatto, affrontato. Però le faccio una domanda scomoda: chi viene da lontano paga senza problemi, mentre chi vive a Firenze si sente ospite in casa propria. Non le sembra strano?"
      goals: [example]
    - learner: "Sarebbe strano, sì, se il ticket servisse soltanto a fare cassa. Ma se gli incassi venissero vincolati per legge ai servizi per i residenti, cioè affitti calmierati, trasporti e negozi di quartiere, la contraddizione sparirebbe: pagherebbero i visitatori, e ne beneficerebbe chi resta."
    - tutor: "Un ticket con il vincolo di spesa: lo difende bene, devo ammetterlo. E oltre al ticket, che altro proporrebbe?"
      goals: [rebut]
    - learner: "Incentivi fiscali per chi affitta a lungo termine a studenti e famiglie, e un tetto agli affitti brevi nel centro storico, come hanno fatto ad Amsterdam. Il turismo non è il nemico; il nemico è una città pensata soltanto per chi se ne va la sera."
    - tutor: "Una città pensata per chi resta: mi sembra un ottimo slogan per chiudere. Grazie della telefonata e buona giornata!"
      goals: [proposal]

- scenario: turismo-di-massa
  level: C1
  persona: en-m-heritage
  turns:
    - tutor: "Abbiamo in linea un altro ascoltatore. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno! Sono nato a Boston, ma i miei nonni erano di Amalfi e da tre anni vivo lì. Sul ticket ho una posizione scomoda: lo trovo giusto per Venezia, ma sbagliato per i paesi piccoli come il mio."
    - tutor: "Una posizione a metà strada, quindi. Perché per Amalfi no, se il sovraffollamento è lo stesso?"
      goals: [introduce]
    - learner: "Guarda, il sovraffollamento ad Amalfi ha un'altra causa: la strada. C'è una sola strada costiera, e d'estate i pullman turistici la bloccano per ore; una volta un'ambulanza è rimasta ferma quaranta minuti dietro a una fila di autobus."
      errors: [register]
    - tutor: "Quaranta minuti per un'ambulanza: è un esempio che fa venire i brividi. Mi scusi, però: «guarda»? Siamo in diretta, e ci siamo appena conosciuti."
      prompt: {text: "Guarda", tags: [register]}
    - learner: "Ha ragione, chiedo scusa: guardi, volevo dire. Il punto è che un ticket non toglierebbe un solo pullman dalla strada."
    - tutor: "Nessun problema. Le faccio però notare che i pullman portano clienti a ristoranti e alberghi: limitarli non rischia di strangolare l'economia locale?"
      goals: [example]
    - learner: "È un rischio, non lo nego. Ma chi arriva in pullman alle dieci e riparte alle tre spende pochissimo; i clienti degli alberghi, invece, arrivano in traghetto o con i mezzi locali, e continuerebbero a venire. Anzi, se la costa fosse meno caotica, forse verrebbero più volentieri."
    - tutor: "Quindi meno pullman non vuol dire meno gente, ma gente diversa. E allora, in pratica, che cosa propone?"
      goals: [rebut]
    - learner: "Un sistema di prenotazione per i pullman, con un numero massimo al giorno, e più traghetti da Salerno e da Positano. Il mare è la strada più antica della costiera: tanto vale tornare a usarlo."
    - tutor: "Tornare al mare come strada: un'idea antica e modernissima insieme. Grazie della telefonata, e un saluto ad Amalfi!"
      goals: [proposal]

- scenario: club-lettura
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Finito ieri notte, e ancora ci penso. Mi è piaciuto moltissimo, soprattutto la prima metà: la Torino del dopoguerra, la fabbrica, le case di ringhiera. Nella seconda parte, invece, mi è sembrato che la trama corresse troppo."
    - tutor: "Corresse troppo? Secondo me è il ritmo della vita che accelera, ma ne riparliamo. Intanto, quale personaggio ti è rimasto addosso?"
      goals: [impression]
    - learner: "La madre, Ada. Rinuncia a tutto per i figli, e alla fine nessuno dei due la ringrazia. Credo che l'autrice ha voluto mostrare quanto costava, per una donna di quegli anni, scegliere di non scegliere."
      errors: [subjunctive-use]
      gold: {text: "l'autrice ha voluto", fix: "l'autrice abbia voluto"}
    - tutor: "Ada è anche il mio personaggio preferito. Ma rileggi un attimo quel pezzo: «credo che l'autrice ha voluto»?"
      prompt: {text: "l'autrice ha voluto", tags: [subjunctive-use]}
    - learner: "Hai ragione: credo che l'autrice abbia voluto mostrare proprio questo. E secondo me Ada, se avesse avuto un'altra occasione, avrebbe fatto le stesse scelte, ed è questo che fa male."
    - tutor: "Perfetto. E sono d'accordo, è proprio lì il dolore del libro. Ma lo stile? A me quelle frasi brevi e asciutte hanno conquistato subito."
      goals: [character]
    - learner: "A me un po' meno, lo confesso. Sono belle, ma dopo duecento pagine diventano monotone; avrei preferito qualche descrizione in più, soprattutto dei luoghi. Il narratore sa tutto e non ci dice quasi niente."
    - tutor: "Per me è proprio quel silenzio del narratore la forza del libro, ma ognuno ha i suoi gusti. A chi lo consiglieresti?"
      goals: [style]
    - learner: "A chi ama le saghe familiari e ha pazienza. Non lo consiglierei a mio figlio, che ha sedici anni: lo troverebbe lento. Ma a mia madre lo regalerò sicuramente, perché quegli anni li ha vissuti."
    - tutor: "Regalo perfetto, e poi fatti raccontare che cosa ne pensa lei: sarà la recensione più autentica di tutte. Il mese prossimo tocca a te scegliere il libro!"
      goals: [recommend]

- scenario: club-lettura
  level: C1
  persona: en-m-retired
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Finito, sì, ma con calma: ci ho messo tre settimane. Non perché fosse noioso, anzi, a tratti è stato davvero eccitante; è che certe pagine le ho rilette due volte per gustarle."
      errors: [false-friend]
    - tutor: "Appassionante a tratti, e da leggere piano: mi sembra un complimento bellissimo. Quali pagine hai letto due volte?"
      goals: [impression]
      recast: {text: "eccitante", fix: "appassionante", tags: [false-friend]}
    - learner: "Soprattutto quelle sul padre, quando torna dalla prigionia in Germania e non riconosce più i figli. Ho trovato giusto che non chieda scusa a nessuno: se l'avesse fatto, il personaggio sarebbe diventato falso."
    - tutor: "Giusto? Io invece l'avrei preso a schiaffi, quell'uomo! Ma dimmi: secondo te perché non parla mai della guerra?"
    - learner: "Perché sa che nessuno potrebbe capire. Mio padre era così: tornato dalla Corea, non ne ha mai parlato. Il silenzio, per lui, era l'unico modo di proteggere la famiglia, anche se finiva per allontanarla."
    - tutor: "Allora il libro ti ha toccato da vicino, e si capisce. E lo stile, con tutti quei salti avanti e indietro nel tempo?"
      goals: [character]
    - learner: "All'inizio mi hanno confuso, e avrei preferito una cronologia più lineare. Poi ho capito che l'autrice voleva farci vivere la memoria come la vive chi è anziano: a pezzi, senza ordine. È una scelta coraggiosa, e alla fine mi ha convinto."
    - tutor: "La memoria a pezzi: è proprio così, l'hai detto meglio di qualsiasi recensione. E a chi lo consiglieresti?"
      goals: [style]
    - learner: "A chi ha avuto un padre silenzioso, prima di tutto. E a chi crede di non amare i romanzi storici: questo non è un libro sulla guerra, è un libro su ciò che la guerra lascia nelle case."
    - tutor: "Su ciò che la guerra lascia nelle case: se permetti, questa frase la userò la prossima volta che lo consiglierò a qualcuno. Mi hai fatto venire voglia di leggerlo di nuovo."
      goals: [recommend]

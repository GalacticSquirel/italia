# Set w-a1, file 3: A1 introductions and swapping phone numbers.
- scenario: presentarsi
  level: A1
  persona: es-f-erasmus
  history: [essere-avere]
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao Giulia! Mi chiamo Lucia. Sono di Siviglia."
  - tutor: "Piacere, Lucia! Siviglia è in Spagna, vero?"
    goals: [say-name, say-origin]
  - learner: "Sì. Io sono ventidue anni e studio qui."
    errors: [essere-avere]
  - tutor: "Sono ventidue anni? Per l'età, quale verbo usiamo?"
    prompt: {text: "sono ventidue anni", tags: [essere-avere]}
  - learner: "Ho ventidue anni!"
  - tutor: "Esatto! E cosa studi qui?"
  - learner: "Medicina. Sono studente."
    errors: [noun-gender]
  - tutor: "Studente? Ma tu sei una ragazza!"
    prompt: {text: "studente", tags: [noun-gender]}
  - learner: "Sì, sono studente di medicina."
    errors: [noun-gender]
  - tutor: "Ah, sei studentessa di medicina! Che brava."
    goals: [say-job]
    recast: {text: "studente di medicina", fix: "studentessa di medicina", tags: [noun-gender]}
    new: [{lemma: studentessa, gloss: female student}]
  - learner: "Grazie! E tu, di dove sei? Sei de Roma?"
    errors: [preposition]
  - tutor: "De Roma? Quasi, ma questa è una parola spagnola!"
    prompt: {text: "de Roma", tags: [preposition]}
  - learner: "Sei di Roma?"
  - tutor: "No, sono di Napoli, ma vivo qui da due anni."
    goals: [ask-back]

- scenario: presentarsi
  level: A1
  persona: en-m-traveller
  history: [subject-verb-agreement]
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao Giulia! Io sono Sean. Sono irlandese, di Dublino."
  - tutor: "Ciao Sean, piacere! Che lavoro fai?"
    goals: [say-name, say-origin]
  - learner: "Adesso niente, io viaggio. Ma a Dublino io è cameriere."
    errors: [subject-verb-agreement]
  - tutor: "Io è? Ascolta: io...?"
    prompt: {text: "io è", tags: [subject-verb-agreement]}
  - learner: "Io sono cameriere."
  - tutor: "Bravo! Anch'io lavoro in un bar, il sabato."
    goals: [say-job]
  - learner: "Davvero? Dove tu lavori?"
    errors: [question-form]
  - tutor: "Dove tu lavori? Prova a mettere «tu» alla fine."
    prompt: {text: "Dove tu lavori", tags: [question-form]}
  - learner: "Dove lavori tu?"
  - tutor: "Perfetto! In un bar vicino alla stazione."
    goals: [ask-back]
  - learner: "Cool! Io amo pizza."
    errors: [word-choice, article-use]
  - tutor: "Amo pizza? Manca qualcosa prima di «pizza»."
    prompt: {text: "amo pizza", tags: [article-use]}
  - learner: "Amo la pizza!"
  - tutor: "Anch'io! Allora una sera andiamo a mangiare la pizza."

- scenario: presentarsi
  level: A1
  persona: en-f-student
  history: [preposition]
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao! Mi chiamo Emily. Piacere!"
  - tutor: "Piacere, Emily! Di dove sei?"
    goals: [say-name]
  - learner: "Io sono da Leeds, in Inghilterra."
    errors: [preposition]
  - tutor: "Sei da Leeds? Con «essere» si dice in un altro modo."
    prompt: {text: "sono da Leeds", tags: [preposition]}
  - learner: "Sono da Leeds... no?"
    errors: [preposition]
  - tutor: "Ah, sei di Leeds! È una città grande?"
    goals: [say-origin]
    recast: {text: "da Leeds", fix: "di Leeds", tags: [preposition]}
  - learner: "Sì, abbastanza. Io studio la arte qui."
    errors: [article-form]
  - tutor: "La arte? Attenzione: senti come comincia «arte»."
    prompt: {text: "la arte", tags: [article-form]}
  - learner: "L'arte! Studio l'arte."
  - tutor: "Perfetto! E io studio musica."
    goals: [say-job]
  - learner: "Bello! Quale è il tuo strumento?"
    errors: [spelling]
  - tutor: "Quale è? Guarda bene: qui «quale» è più corto."
    prompt: {text: "Quale è", tags: [spelling]}
  - learner: "Qual è il tuo strumento?"
  - tutor: "Brava! È la chitarra."
    goals: [ask-back]
    new: [{lemma: chitarra, gloss: guitar}]

- scenario: presentarsi
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Me chiamo Diego."
    errors: [reflexive]
  - tutor: "Me chiamo? Quasi! Guarda la prima parola."
    prompt: {text: "Me chiamo", tags: [reflexive]}
  - learner: "Mi chiamo Diego. Sono argentino."
  - tutor: "Piacere, Diego! Di quale città?"
    goals: [say-name]
  - learner: "Di Buenos Aires. Ma adesso vivo in Bologna."
    errors: [preposition]
  - tutor: "In Bologna? Attenzione: Bologna è una città, non un paese."
    prompt: {text: "in Bologna", tags: [preposition]}
  - learner: "Vivo a Bologna."
  - tutor: "Esatto! E cosa fai a Bologna?"
    goals: [say-origin]
  - learner: "Sono cocinero in una trattoria."
    errors: [word-choice]
  - tutor: "Ah, fai il cuoco! Che bel lavoro."
    goals: [say-job]
    recast: {text: "cocinero", fix: "cuoco", tags: [word-choice]}
    new: [{lemma: cuoco, gloss: cook}]
  - learner: "Sì, mi piace. Tu parla spagnolo?"
    errors: [subject-verb-agreement]
  - tutor: "Tu parla? Ascolta bene: tu...?"
    prompt: {text: "Tu parla", tags: [subject-verb-agreement]}
  - learner: "Tu parli spagnolo?"
  - tutor: "Sì, un po'! Studio spagnolo all'università."
    goals: [ask-back]

- scenario: numero-telefono
  level: A1
  persona: en-f-professional
  history: [pronoun-position]
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, bellissima! Possiamo cucinare insieme anche a casa, se vuoi."
  - tutor: "Che bella idea! Mi dai il tuo numero?"
    goals: [propose]
  - learner: "Certo. Posso lo scrivere sul tuo telefono?"
    errors: [pronoun-position]
  - tutor: "Posso lo scrivere? Attenzione: dove va «lo»?"
    prompt: {text: "Posso lo scrivere", tags: [pronoun-position]}
  - learner: "Posso scriverlo sul tuo telefono?"
  - tutor: "Perfetto! Ecco il telefono."
  - learner: "Fatto! Quando tu sei libero?"
    errors: [question-form]
  - tutor: "Grazie! Quando tu sei libero? Prova senza «tu»."
    goals: [number]
    prompt: {text: "Quando tu sei libero", tags: [question-form]}
  - learner: "Quando sei libero?"
  - tutor: "Esatto! Domenica mattina. Per te va bene?"
  - learner: "Sì, domenica è bene!"
    errors: [word-choice]
  - tutor: "Domenica va bene, allora! Alle undici?"
    recast: {text: "è bene", fix: "va bene", tags: [word-choice]}
  - learner: "Sì, alle undici a casa mia."
  - tutor: "Perfetto. A domenica, ciao!"
    goals: [when]

- scenario: numero-telefono
  level: A1
  persona: es-m-worker
  history: [modal-infinitive]
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, molto bella. Il risotto è riquísimo."
    errors: [word-choice]
  - tutor: "Sì, è buonissimo! Tu sei bravo a cucinare."
    recast: {text: "riquísimo", fix: "buonissimo", tags: [word-choice]}
    new: [{lemma: buonissimo, gloss: delicious}]
  - learner: "Sono cuoco, è il mio lavoro! Vuoi tomare un caffè, adesso?"
    errors: [word-choice]
  - tutor: "Ah, ecco! Prendere un caffè? Sì, volentieri!"
    goals: [propose]
    recast: {text: "tomare un caffè", fix: "prendere un caffè", tags: [word-choice]}
    new: [{lemma: volentieri, gloss: gladly}]
  - learner: "Bene. Puoi chiamare me adesso? Così hai il numero."
    errors: [pronoun-position]
  - tutor: "Chiamare me? Mmm, «me» qui va in un altro posto."
    prompt: {text: "chiamare me", tags: [pronoun-position]}
  - learner: "Puoi chiamarmi adesso? Tre tre otto, quattro cinque sei, nove nove."
  - tutor: "Ecco, ti chiamo. Adesso ho il tuo numero!"
    goals: [number]
  - learner: "Perfetto. E ci vediamo ancora il lunedì?"
    errors: [article-use]
  - tutor: "Il lunedì? Cioè tutti i lunedì?"
    prompt: {text: "il lunedì", tags: [article-use]}
  - learner: "No, solo questo lunedì. Lunedì prossimo."
  - tutor: "Ah, va bene! Lunedì prossimo alle dieci, allora."
    goals: [when]

- scenario: numero-telefono
  level: A1
  persona: en-m-retired
  history: [future-form]
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, molto! Ma la mia pasta è un disastro."
  - tutor: "Ma no, era buona! Tu cucini molto a casa?"
  - learner: "Sì, ogni giorni. Vuoi venire a cucinare da me?"
    errors: [noun-number]
  - tutor: "Ogni giorni? Dopo «ogni»: uno o tanti?"
    prompt: {text: "ogni giorni", tags: [noun-number]}
  - learner: "Ogni giorno!"
  - tutor: "Bravo! E sì, vengo volentieri da te."
    goals: [propose]
    new: [{lemma: volentieri, gloss: gladly}]
  - learner: "Bene! Ecco il mio numero: tre due nove, uno uno quattro. Tu può scrivere?"
    errors: [subject-verb-agreement]
  - tutor: "Tu può? Ascolta bene: tu...?"
    prompt: {text: "Tu può", tags: [subject-verb-agreement]}
  - learner: "Puoi scrivere?"
  - tutor: "Sì, certo. Fatto, ho il tuo numero!"
    goals: [number]
  - learner: "Perfetto. Io ti chiamarò domani sera."
    errors: [future-form]
  - tutor: "Chiamarò? Attenzione: qui «chiamare» cambia la «a»."
    prompt: {text: "chiamarò", tags: [future-form]}
  - learner: "Ti chiamerò domani sera. Sabato va bene per cucinare?"
  - tutor: "Esatto! Sabato è perfetto. A domani!"
    goals: [when]

- scenario: numero-telefono
  level: A1
  persona: es-f-teacher
  history: [question-form]
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, molto. Il professore è molto simpatico."
  - tutor: "Vero! E la tua pasta era ottima."
  - learner: "Grazie! Io vorrebbe fare un'altra cena insieme. Ti va?"
    errors: [conditional-form]
  - tutor: "Io vorrebbe? Ascolta: io...?"
    prompt: {text: "Io vorrebbe", tags: [conditional-form]}
  - learner: "Io vorrei fare un'altra cena insieme."
  - tutor: "Sì, mi piace molto l'idea!"
    goals: [propose]
  - learner: "Allora, che è il tuo numero?"
    errors: [question-form]
  - tutor: "Che è il tuo numero? C'è una parola migliore per chiedere."
    prompt: {text: "che è", tags: [question-form]}
  - learner: "Cuál è il tuo numero?"
    errors: [question-form]
  - tutor: "Qual è il mio numero? Te lo scrivo. E il tuo?"
    recast: {text: "Cuál è", fix: "Qual è", tags: [question-form]}
  - learner: "Il mio è tre quattro zero, due due cinque, otto uno."
  - tutor: "Grazie! Quando facciamo la cena? Venerdì?"
    goals: [number]
  - learner: "Sì, venerdì alle otto, da me."
  - tutor: "Perfetto, a venerdì! Ciao!"
    goals: [when]

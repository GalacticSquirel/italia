# Correction-dense A1 dialogues (set x-a1-1), file 3.
- scenario: bar-colazione
  level: A1
  persona: en-m-retired
  history: [article-form]
  turns:
  - tutor: "Buongiorno! Cosa prende?"
  - learner: "Buongiorno. Vorrei uno cappuccino, per favore."
    errors: [article-form]
  - tutor: "Uno cappuccino? Cappuccino comincia con c: quale articolo va bene?"
    prompt: {text: "uno cappuccino", tags: [article-form]}
  - learner: "Un cappuccino, per favore."
  - tutor: "Esatto! Ecco il cappuccino. Qualcosa da mangiare?"
    goals: [greet, order-drink]
  - learner: "Sì, un cornetto con la marmellata."
  - tutor: "Ecco il cornetto. Buona colazione!"
    goals: [order-food]
  - learner: "Grazie. Adesso voglio di pagare."
    errors: [modal-infinitive]
  - tutor: "Voglio di pagare? Dopo voglio c'è una parola in più."
    prompt: {text: "voglio di pagare", tags: [modal-infinitive]}
  - learner: "Voglio pagare. Quanto costa?"
  - tutor: "Perfetto! Sono tre euro in tutto."
  - learner: "Ecco tre euro. Arrivederci!"
  - tutor: "Grazie, ecco lo scontrino. Arrivederci!"
    goals: [pay]

- scenario: casa-mia
  level: A1
  persona: es-f-erasmus
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Abito in un appartamento con due amiche. È in centro."
  - tutor: "In centro, che bello! È grande?"
    goals: [type]
  - learner: "No, è piccolo. Ci sono tre camere, una cucina e un bagno."
  - tutor: "Tre camere e un bagno solo! E la tua camera com'è?"
    goals: [rooms]
  - learner: "La mia camera è piccola, ma ha una finestra grande. È la mia stanza preferita."
  - tutor: "Che bella! C'è anche un balcone?"
    goals: [favourite]
  - learner: "No, non c'è. E tu, dove abiti?"
  - tutor: "Abito in una casa con i miei genitori."
    goals: [ask]
  - learner: "La tua casa è grande?"
  - tutor: "Sì, molto. Ci sono cinque camere e un giardino."
    new: [{lemma: "giardino", gloss: "garden"}]

- scenario: chiedere-strada
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Buongiorno, scusi. Dov'è la stazione, per favore?"
  - tutor: "La stazione? Non è lontana. Vada dritto fino alla piazza."
    goals: [get-attention, ask-place]
  - learner: "E poi vado a la destra?"
    errors: [article-use]
  - tutor: "A la destra? Qui c'è una parola in più."
    prompt: {text: "a la destra", tags: [article-use]}
  - learner: "Ah! Poi vado a destra?"
  - tutor: "Esatto, a destra. La stazione è dopo il semaforo."
  - learner: "Dritto, la piazza, a destra, il semaforo. Giusto?"
  - tutor: "Sì, perfetto! Sono dieci minuti a piedi."
    goals: [understand]
  - learner: "Grazie, Lei è molto amabile."
    errors: [word-choice]
  - tutor: "Prego! Anche Lei è molto gentile."
    goals: [thank]
    recast: {text: "molto amabile", fix: "molto gentile", tags: [word-choice]}
  - learner: "Buona giornata, arrivederci!"
  - tutor: "Arrivederci e buon viaggio!"

- scenario: famiglia
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questo è mio padre e questa è mia sorella Lucy."
  - tutor: "Che bella famiglia! Com'è tua sorella?"
    goals: [who]
  - learner: "Lucy è molto simpatico e ama la musica."
    errors: [adjective-agreement]
  - tutor: "Lucy è simpatico? Lucy è una ragazza: come finisce la parola?"
    prompt: {text: "simpatico", tags: [adjective-agreement]}
  - learner: "Lucy è molto simpatica!"
  - tutor: "Esatto! E quanti anni ha Lucy?"
    goals: [describe]
  - learner: "Lei è sedici anni."
    errors: [essere-avere]
  - tutor: "Lei è sedici anni? Per gli anni usiamo un altro verbo."
    prompt: {text: "è sedici anni", tags: [essere-avere]}
  - learner: "Lei è sedici anni, sì. È giovane."
    errors: [essere-avere]
  - tutor: "Ah, ha sedici anni. Sì, è giovane!"
    goals: [ages]
    recast: {text: "è sedici anni", fix: "ha sedici anni", tags: [essere-avere]}
  - learner: "E tu, Marco, hai una sorella?"
  - tutor: "No, ho due fratelli. Sono più grandi."
    goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao Anna! Mi sveglio tardi, alle dieci."
  - tutor: "Alle dieci, che bello! E la mattina cosa fai?"
    goals: [wake]
  - learner: "La mattina no lavoro. Vado al mercato."
    errors: [negation]
  - tutor: "No lavoro? Prima del verbo la parola è un po' diversa."
    prompt: {text: "no lavoro", tags: [negation]}
  - learner: "La mattina non lavoro."
  - tutor: "Giusto! E quando lavori?"
    goals: [work]
  - learner: "Lavoro la sera in un ristorante. Finiscio a mezzanotte."
    errors: [verb-form]
  - tutor: "Finiscio? Attenzione al verbo finire con io."
    prompt: {text: "Finiscio", tags: [verb-form]}
  - learner: "Finisco a mezzanotte."
  - tutor: "Bravo! È tardi. Poi torni a casa?"
  - learner: "Sì, torno a casa, mangio qualcosa e dormo."
  - tutor: "Che giornata lunga!"
    goals: [evening]
  - learner: "E tu, Anna? Cosa fai la sera?"
  - tutor: "Io torno alle sei. Poi faccio la cena e leggo."
    goals: [ask]

- scenario: hotel-checkin
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, io ha una prenotazione. Sono Kate Wilson."
    errors: [subject-verb-agreement]
  - tutor: "Io ha? Con io il verbo avere cambia."
    prompt: {text: "io ha", tags: [subject-verb-agreement]}
  - learner: "Io ho una prenotazione, scusi."
  - tutor: "Perfetto, signora Wilson. Una camera per due notti. Ha un documento?"
    goals: [booking]
  - learner: "Sì, ecco il passaporto."
  - tutor: "Grazie. La sua camera è al secondo piano."
    goals: [document]
  - learner: "Bene. Che ora è la colazione?"
    errors: [question-form]
  - tutor: "Che ora è la colazione? Manca una piccola parola prima di che."
    prompt: {text: "Che ora è la colazione", tags: [question-form]}
  - learner: "A che ora è la colazione?"
  - tutor: "Esatto! La colazione è dalle sette e mezza alle dieci."
    goals: [breakfast]
  - learner: "Grazie. Posso avere la chiave?"
  - tutor: "Certo, ecco la chiave. Camera 24. Buonanotte!"
    goals: [key]

- scenario: mercato-frutta
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Ciao! Cosa ti do oggi?"
  - learner: "Ciao! Quanto costano le mele?"
  - tutor: "Le mele rosse costano due euro al chilo."
    goals: [ask-price]
  - learner: "Sono fresche?"
  - tutor: "Sì, molto fresche. Sono buonissime!"
  - learner: "Allora prendo un chilo di mele."
  - tutor: "Ecco un chilo di mele. Altro?"
    goals: [buy-quantity]
  - learner: "Hai anche le arance?"
  - tutor: "Sì, ho delle arance molto buone. Quante ne vuoi?"
  - learner: "Mezzo chilo, grazie. Quant'è?"
  - tutor: "Sono tre euro e cinquanta in tutto."
    goals: [ask-other]
  - learner: "Ecco quattro euro."
  - tutor: "Grazie! Ecco il resto. Ciao e buon sabato!"
    goals: [pay]

- scenario: numero-telefono
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, bellissima! Cuciniamo insieme next week?"
    errors: [word-choice]
  - tutor: "La prossima settimana? Sì, che bella idea! Mi dai il tuo numero?"
    goals: [propose]
    recast: {text: "next week", fix: "la prossima settimana", tags: [word-choice]}
  - learner: "Sì. Il mio numero è 339 418 2276."
  - tutor: "Grazie! Ti mando un messaggio adesso."
    goals: [number]
  - learner: "Perfetto. Io sono libero su sabato."
    errors: [preposition]
  - tutor: "Su sabato? Serve davvero su, con i giorni?"
    prompt: {text: "su sabato", tags: [preposition]}
  - learner: "Sono libero sabato!"
  - tutor: "Bravo! Anch'io sono libero sabato. Alle sette?"
  - learner: "Alle sette va bene. A sabato!"
  - tutor: "Perfetto, a sabato! Ciao."
    goals: [when]

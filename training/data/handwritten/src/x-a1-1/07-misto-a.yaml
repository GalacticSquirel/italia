# Correction-dense A1 dialogues (set x-a1-1), file 7.
- scenario: bar-colazione
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno! Cosa prende?"
  - learner: "Buongiorno. Un caffè con leche, per favore."
    errors: [word-choice]
  - tutor: "Un caffè con latte? Subito!"
    goals: [greet, order-drink]
    recast: {text: "Un caffè con leche", fix: "Un caffè con latte", tags: [word-choice]}
  - learner: "Grazie. E anche due cornetti, per favore."
  - tutor: "Ecco due cornetti caldi."
    goals: [order-food]
  - learner: "Che buoni! Quanto costano tutto?"
    errors: [subject-verb-agreement]
  - tutor: "Quanto costano tutto? Tutto è una cosa sola: e il verbo?"
    prompt: {text: "Quanto costano tutto", tags: [subject-verb-agreement]}
  - learner: "Quanto costa tutto?"
  - tutor: "Giusto! Sono tre euro e sessanta."
  - learner: "Ecco quattro euro."
  - tutor: "Grazie! Ecco il resto e lo scontrino."
    goals: [pay]
  - learner: "Grazie, buona giornata!"
  - tutor: "Buona giornata anche a Lei!"

- scenario: casa-mia
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Vivo in un appartamento con tre studenti."
  - tutor: "Che bello! Quante camere ci sono?"
    goals: [type]
  - learner: "Ci sono quattro camere. Ma le camere sono piccolo."
    errors: [adjective-agreement]
  - tutor: "Le camere sono piccolo? Le camere sono tante: e la parola piccolo?"
    prompt: {text: "le camere sono piccolo", tags: [adjective-agreement]}
  - learner: "Le camere sono piccole."
  - tutor: "Esatto! E qual è la tua stanza preferita?"
    goals: [rooms]
  - learner: "La mia preferita stanza è la cucina."
    errors: [word-order]
  - tutor: "La mia preferita stanza? Attenzione al posto delle parole."
    prompt: {text: "La mia preferita stanza", tags: [word-order]}
  - learner: "La mia stanza preferita è la cucina. È grande e mangiamo insieme."
  - tutor: "Benissimo! Mangiare tutti insieme è bello."
    goals: [favourite]
  - learner: "E tu, Luca? Hai un balcone?"
  - tutor: "Sì, ho un balcone piccolo con un tavolo."
    goals: [ask]

- scenario: chiedere-strada
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Buongiorno, scusi. È una stazione qui vicino?"
    errors: [ce-ci-sono]
  - tutor: "È una stazione? All'inizio della domanda manca una piccola parola."
    prompt: {text: "È una stazione qui vicino", tags: [ce-ci-sono]}
  - learner: "È qui vicino una stazione?"
    errors: [ce-ci-sono]
  - tutor: "Sì, c'è una stazione qui vicino. Sono cinque minuti."
    goals: [get-attention, ask-place]
    recast: {text: "È qui vicino una stazione", fix: "c'è una stazione qui vicino", tags: [ce-ci-sono]}
  - learner: "Grazie. Vado dritto?"
  - tutor: "Sì, dritto fino alla piazza. Poi giri a destra."
  - learner: "Dritto fino al piazza, poi a destra."
    errors: [noun-gender]
  - tutor: "Al piazza? Piazza è una parola femminile."
    prompt: {text: "al piazza", tags: [noun-gender]}
  - learner: "Fino alla piazza, poi a destra."
  - tutor: "Perfetto! La stazione è lì."
    goals: [understand]
  - learner: "Grazie mille, molto gentile. Arrivederci!"
  - tutor: "Prego, arrivederci!"
    goals: [thank]

- scenario: famiglia
  level: A1
  persona: es-f-teacher
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono i miei genitori e mio fratello Pablo."
  - tutor: "Che bella famiglia! Com'è tuo fratello?"
    goals: [who]
  - learner: "È alto e molto simpatico. Fa il medico a Valencia."
  - tutor: "Un medico, che bravo! Quanti anni ha?"
    goals: [describe]
  - learner: "Ha trentacinque anni. Io ho trentuno anni."
  - tutor: "Siete giovani! E i tuoi genitori?"
    goals: [ages]
  - learner: "Mio padre ha sessantotto anni e mia madre sessantacinque."
  - tutor: "Che bello! Vivono vicino a te?"
  - learner: "Sì, vivono a Valencia. E tu, Marco, hai fratelli?"
  - tutor: "Ho una sorella. Ha due figli piccoli!"
    goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao Anna! Mi sveglio alle otto e prendo colazione."
    errors: [word-choice]
  - tutor: "Anch'io faccio colazione alle otto! E poi?"
    goals: [wake]
    recast: {text: "prendo colazione", fix: "faccio colazione", tags: [word-choice]}
  - learner: "Poi vado al lavoro con il autobus."
    errors: [article-form]
  - tutor: "Il autobus? Prima di una a, l'articolo cambia."
    prompt: {text: "il autobus", tags: [article-form]}
  - learner: "Con l'autobus!"
  - tutor: "Esatto! E dove lavori?"
  - learner: "Lavoro in un bar fino alle quattro."
  - tutor: "Che bello! E la sera cosa fai?"
    goals: [work]
  - learner: "La sera suono la chitarra o esco con gli amici."
  - tutor: "La chitarra, che bravo!"
    goals: [evening]
  - learner: "E tu, Anna? La tua giornata è lunga?"
  - tutor: "Sì! Lavoro fino alle sei e torno tardi."
    goals: [ask]

- scenario: hotel-checkin
  level: A1
  persona: en-m-heritage
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, ho un prenotazione. Il nome è Rossi."
    errors: [noun-gender]
  - tutor: "Un prenotazione? Prenotazione è femminile."
    prompt: {text: "un prenotazione", tags: [noun-gender]}
  - learner: "Sì, un prenotazione per due notti."
    errors: [noun-gender]
  - tutor: "Sì, ecco: una prenotazione per due notti, signor Rossi."
    goals: [booking]
    recast: {text: "un prenotazione", fix: "una prenotazione", tags: [noun-gender]}
  - learner: "Grazie. Ecco mio documento."
    errors: [possessive]
  - tutor: "Mio documento? Prima di mio manca una piccola parola."
    prompt: {text: "mio documento", tags: [possessive]}
  - learner: "Ecco il mio documento."
  - tutor: "Perfetto, grazie. Camera 5, primo piano."
    goals: [document]
  - learner: "A che ora è la colazione?"
  - tutor: "Dalle sette alle dieci."
    goals: [breakfast]
  - learner: "Benissimo. E la chiave?"
  - tutor: "Ecco la chiave della camera 5. Buonanotte!"
    goals: [key]

- scenario: mercato-frutta
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Ciao! Cosa ti do oggi?"
  - learner: "Buongiorno. Vorrei tre mela, per favore."
    errors: [noun-number]
  - tutor: "Tre mela? Sono tre: la parola cambia alla fine."
    prompt: {text: "tre mela", tags: [noun-number]}
  - learner: "Tre mele, per favore."
  - tutor: "Bravo! Ecco tre mele."
    goals: [buy-quantity]
  - learner: "Grazie. Quanto costano i pomodori?"
  - tutor: "Due euro e cinquanta al chilo."
    goals: [ask-price]
  - learner: "Sono fresco?"
    errors: [adjective-agreement]
  - tutor: "Sono fresco? I pomodori sono tanti: e la parola fresco?"
    prompt: {text: "Sono fresco", tags: [adjective-agreement]}
  - learner: "I pomodori sono fresco oggi?"
    errors: [adjective-agreement]
  - tutor: "Sì, sono freschi, di questa mattina!"
    recast: {text: "sono fresco", fix: "sono freschi", tags: [adjective-agreement]}
  - learner: "Allora prendo mezzo chilo di pomodori."
  - tutor: "Ecco mezzo chilo. Sono tre euro in tutto."
    goals: [ask-other]
  - learner: "Ecco tre euro. Grazie, arrivederci!"
  - tutor: "Grazie a te! Ciao, buona giornata."
    goals: [pay]

- scenario: numero-telefono
  level: A1
  persona: en-f-student
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì! Vuoi cucinare con me un'altra volta?"
  - tutor: "Sì, volentieri! Quando?"
    goals: [propose]
    new: [{lemma: "volentieri", gloss: "gladly"}]
  - learner: "Non lo so ancora. Puoi mi chiamare domani?"
    errors: [pronoun-position]
  - tutor: "Puoi mi chiamare? La parola mi va in un altro posto."
    prompt: {text: "Puoi mi chiamare", tags: [pronoun-position]}
  - learner: "Mi puoi chiamare domani?"
  - tutor: "Perfetto! Sì, ma non ho il tuo numero."
  - learner: "Il mio numero è 351 209 4486."
  - tutor: "Grazie! Ti chiamo domani sera."
    goals: [number]
  - learner: "Va bene. Io sono libera il venerdì e la domenica."
  - tutor: "Allora domenica prossima? Io sono libero."
  - learner: "Domenica prossima, perfetto!"
  - tutor: "Benissimo. A domenica, ciao!"
    goals: [when]

# Correction-dense A1 dialogues (set x-a1-1), file 8.
- scenario: orari-negozio
  level: A1
  persona: es-f-teacher
  turns:
  - tutor: "Pronto, negozio Bianchi, buongiorno!"
  - learner: "Buongiorno. Chiamo per sapere gli orari, per favore."
  - tutor: "Certo! Apriamo alle nove di mattina."
    goals: [greet]
  - learner: "Grazie. E a che ora chiude la tienda?"
    errors: [word-choice]
  - tutor: "Il negozio chiude alle sette e mezza."
    goals: [ask-hours]
    recast: {text: "la tienda", fix: "Il negozio", tags: [word-choice]}
  - learner: "Bene. Siete aperti tutti i giorno?"
    errors: [noun-number]
  - tutor: "Tutti i giorno? Con tutti i, la parola cambia."
    prompt: {text: "tutti i giorno", tags: [noun-number]}
  - learner: "Siete aperti tutti i giorni?"
  - tutor: "Esatto! Quasi tutti: dal lunedì al sabato."
  - learner: "Allora la domenica il negozio è chiuso?"
  - tutor: "Sì, la domenica siamo chiusi tutto il giorno."
    goals: [ask-day]
  - learner: "Ho capito. Grazie mille, arrivederci!"
  - tutor: "Grazie a Lei! Arrivederci."
    goals: [goodbye]

- scenario: panetteria
  level: A1
  persona: en-m-heritage
  turns:
  - tutor: "Buongiorno! Mi dica."
  - learner: "Buongiorno! Vorrei un chilo di pane e un pizza piccola."
    errors: [noun-gender]
  - tutor: "Un pizza? Pizza finisce in a: attenzione all'articolo."
    prompt: {text: "un pizza", tags: [noun-gender]}
  - learner: "Una pizza piccola, scusi."
  - tutor: "Benissimo! Ecco il pane e la pizza."
    goals: [greet, order-bread, order-extra]
  - learner: "Grazie. Quanto costano quelli grissini?"
    errors: [demonstrative]
  - tutor: "Quelli grissini? Prima di un nome, quelli cambia."
    prompt: {text: "quelli grissini", tags: [demonstrative]}
  - learner: "Quanto costano quelli grissini lì?"
    errors: [demonstrative]
  - tutor: "Quei grissini costano due euro al sacchetto."
    recast: {text: "quelli grissini", fix: "Quei grissini", tags: [demonstrative]}
  - learner: "Va bene, prendo un sacchetto."
  - tutor: "Ecco. Sono sei euro e cinquanta in tutto."
  - learner: "Ecco sette euro. Grazie e arrivederci!"
  - tutor: "Grazie, ecco il resto. Arrivederci!"
    goals: [pay]

- scenario: presentarsi
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
  - learner: "Ciao! Sono Liam. Sono da Dublino."
    errors: [preposition]
  - tutor: "Da Dublino? Con sono e una città usiamo un'altra parola."
    prompt: {text: "da Dublino", tags: [preposition]}
  - learner: "Sono di Dublino!"
  - tutor: "Esatto! Piacere, Liam. Cosa fai qui in Italia?"
    goals: [say-name, say-origin]
  - learner: "Viaggio molto. In Irlanda lavoro in un pub."
  - tutor: "Che bello! Ti piace il tuo lavoro?"
    goals: [say-job]
  - learner: "Sì, mi piace. E tu, dove sei da?"
    errors: [question-form]
  - tutor: "Dove sei da? In italiano la domanda comincia con di."
    prompt: {text: "dove sei da", tags: [question-form]}
  - learner: "Di dove sei?"
  - tutor: "Bravo! Sono di Verona, ma studio qui."
    goals: [ask-back]

- scenario: ristorante-ordinare
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, benvenuti! Quanti siete?"
  - learner: "Buongiorno. Un tavolo per quattro, per favore."
  - tutor: "Certo, prego. Ecco il menù."
    goals: [ask-table]
  - learner: "Grazie. Qual è il piatto del giorno?"
  - tutor: "Oggi c'è la pasta al pesce. È molto buona!"
  - learner: "Allora prendo la pasta al pesce. E un'insalata."
  - tutor: "Benissimo. E da bere?"
    goals: [order-food]
  - learner: "Una bottiglia di acqua frizzante e un bicchiere di vino bianco."
  - tutor: "Acqua e vino bianco. Arrivano subito!"
    goals: [order-drink]
  - learner: "È tutto buonissimo, grazie. Possiamo avere il conto?"
  - tutor: "Grazie! Ecco il conto."
    goals: [ask-bill]
  - learner: "Posso pagare con la carta?"
  - tutor: "Certo. Grazie mille e arrivederci!"

- scenario: supermercato
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno, cerca qualcosa?"
  - learner: "Buongiorno! Scusi, dove il latte è?"
    errors: [word-order]
  - tutor: "Dove il latte è? Attenzione al posto del verbo."
    prompt: {text: "dove il latte è", tags: [word-order]}
  - learner: "Dov'è il latte?"
  - tutor: "Perfetto! Il latte è in fondo, a destra."
    goals: [ask-product]
  - learner: "Grazie. E dove sono le eggs?"
    errors: [word-choice]
  - tutor: "Le uova? Sono vicino al latte, sullo scaffale."
    goals: [ask-other]
    recast: {text: "le eggs", fix: "Le uova", tags: [word-choice]}
  - learner: "Ah, le uova! Grazie. E la cassa?"
  - tutor: "La cassa è lì, a sinistra."
  - learner: "Grazie mille, molto gentile!"
  - tutor: "Prego! Buona giornata."
    goals: [thank]

- scenario: taxi
  level: A1
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno! Dove la porto?"
  - learner: "Buongiorno! Puoi portarmi alla stazione centrale?"
    errors: [register]
  - tutor: "Puoi? Non ci conosciamo: tu o Lei?"
    prompt: {text: "Puoi portarmi", tags: [register]}
  - learner: "Scusi! Può portarmi alla stazione centrale?"
  - tutor: "Certo, signora! Alla stazione centrale."
    goals: [destination]
  - learner: "Grazie. Ho una maleta grande."
    errors: [word-choice]
  - tutor: "Una valigia grande? La metto io in macchina."
    recast: {text: "una maleta grande", fix: "Una valigia grande", tags: [word-choice]}
  - learner: "Grazie. Quanto tempo ci vuole?"
  - tutor: "Ci vogliono venticinque minuti."
    goals: [ask-time]
  - learner: "E quanto costa?"
  - tutor: "Costa trentacinque euro. Carta o contanti?"
    goals: [ask-price]
  - learner: "Carta, per favore. Ecco. Arrivederci!"
  - tutor: "Grazie mille! Arrivederci e buon viaggio."
    goals: [pay]

- scenario: tempo-libero
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Mi piace leggere. Io legio molti libri."
    errors: [verb-form]
  - tutor: "Legio? Quasi! Il verbo con io è un po' diverso."
    prompt: {text: "Io legio", tags: [verb-form]}
  - learner: "Io leggo molti libri."
  - tutor: "Brava! Leggi tutti i giorni?"
    goals: [hobby]
  - learner: "Sì, ogni sera. E io mai guardo la TV."
    errors: [negation]
  - tutor: "Io mai guardo? Con mai manca una piccola parola prima del verbo."
    prompt: {text: "io mai guardo", tags: [negation]}
  - learner: "Io mai non guardo la TV?"
    errors: [negation]
  - tutor: "Non guardi mai la TV? Che brava!"
    goals: [frequency]
    recast: {text: "mai non guardo", fix: "Non guardi mai", tags: [negation]}
  - learner: "Sì, è vero. E tu, Sara, cosa fai nel tempo libero?"
  - tutor: "Io vado spesso al cinema con gli amici."
    goals: [ask]
  - learner: "Bello! Andiamo al cinema insieme sabato?"
  - tutor: "Sì, che bella idea!"
    goals: [propose]

- scenario: abbigliamento
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Buongiorno! Posso aiutarla?"
  - learner: "Buongiorno! Cerco una maglietta rosso."
    errors: [adjective-agreement]
  - tutor: "Una maglietta rosso? Maglietta è femminile: e il colore?"
    prompt: {text: "una maglietta rosso", tags: [adjective-agreement]}
  - learner: "Sì, rosso, una maglietta rosso, taglia M."
    errors: [adjective-agreement]
  - tutor: "Ecco una maglietta rossa, taglia M."
    goals: [ask-item, size-colour]
    recast: {text: "una maglietta rosso", fix: "una maglietta rossa", tags: [adjective-agreement]}
  - learner: "Grazie. Posso provo?"
    errors: [modal-infinitive]
  - tutor: "Posso provo? Dopo posso, come finisce il verbo?"
    prompt: {text: "Posso provo", tags: [modal-infinitive]}
  - learner: "Posso provare la maglietta?"
  - tutor: "Certo! Il camerino è lì, a sinistra."
    goals: [try]
  - learner: "Mi piace molto. Quanto costa?"
  - tutor: "Costa sedici euro."
  - learner: "Va bene, la prendo. Ecco venti euro."
  - tutor: "Grazie! Ecco il resto. Arrivederci!"
    goals: [decide]

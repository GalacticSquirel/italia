# Correction-dense A1 dialogues (set x-a1-1), file 5.
- scenario: bar-colazione
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Buongiorno! Cosa prende?"
  - learner: "Buongiorno! Una caffè, per favore."
    errors: [noun-gender]
  - tutor: "Una caffè? Caffè è una parola maschile."
    prompt: {text: "Una caffè", tags: [noun-gender]}
  - learner: "Un caffè, per favore."
  - tutor: "Benissimo, ecco il caffè. Altro?"
    goals: [greet, order-drink]
  - learner: "Sì, sono fame!"
    errors: [essere-avere]
  - tutor: "Sono fame? Con fame usiamo un altro verbo."
    prompt: {text: "sono fame", tags: [essere-avere]}
  - learner: "Ho fame! Vorrei un cornetto."
  - tutor: "Esatto! Ecco un cornetto caldo."
    goals: [order-food]
  - learner: "Grazie. Quanto costa tutto?"
  - tutor: "Sono due euro e cinquanta."
  - learner: "Ecco. Buona giornata!"
  - tutor: "Grazie, ecco lo scontrino. Buona giornata!"
    goals: [pay]

- scenario: casa-mia
  level: A1
  persona: en-m-heritage
  history: [ce-ci-sono]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Vivo in un appartamento a Toronto, con mia moglie."
  - tutor: "Che bello! Quante camere ci sono?"
    goals: [type]
  - learner: "Ci sono due camere, e ci sono una cucina grande."
    errors: [ce-ci-sono]
  - tutor: "Ci sono una cucina? La cucina è una sola: attenzione al verbo."
    prompt: {text: "ci sono una cucina", tags: [ce-ci-sono]}
  - learner: "Ci sono una cucina molto grande."
    errors: [ce-ci-sono]
  - tutor: "Ah, c'è una cucina molto grande. Che bello!"
    goals: [rooms]
    recast: {text: "Ci sono una cucina", fix: "c'è una cucina", tags: [ce-ci-sono]}
  - learner: "Sì. La cucina è la mia stanza preferita. Ha una bella finestra."
  - tutor: "Allora cucini molto! Io invece non cucino mai."
    goals: [favourite]
  - learner: "E tu, Luca? Dove vivi?"
  - tutor: "Vivo in una casa piccola, vicino al mare."
    goals: [ask]

- scenario: chiedere-strada
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Buongiorno, scusi. Cerco la stazione. È lontana?"
  - tutor: "No, è vicina. Sono dieci minuti a piedi."
    goals: [get-attention, ask-place]
  - learner: "Bene. Come arrivo alla stazione?"
  - tutor: "Vada dritto per questa strada, fino al semaforo."
  - learner: "E al semaforo giro a destra?"
  - tutor: "No, a sinistra. La stazione è dopo la piazza."
  - learner: "Allora dritto, poi a sinistra, dopo la piazza."
  - tutor: "Sì, proprio così!"
    goals: [understand]
  - learner: "Grazie mille per l'aiuto. Arrivederci!"
  - tutor: "Prego! Arrivederci e buona giornata."
    goals: [thank]

- scenario: famiglia
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questi sono i miei fratelli e questo è mio grandfather."
    errors: [word-choice]
  - tutor: "Ah, tuo nonno! Che bella famiglia. Come sono i tuoi fratelli?"
    goals: [who]
    recast: {text: "grandfather", fix: "nonno", tags: [word-choice]}
  - learner: "I miei fratelli sono alto e molto simpatici."
    errors: [adjective-agreement]
  - tutor: "I fratelli sono alto? Sono due: e la parola alto?"
    prompt: {text: "sono alto", tags: [adjective-agreement]}
  - learner: "Sono alti!"
  - tutor: "Esatto! E tuo nonno, quanti anni ha?"
    goals: [describe]
  - learner: "Ha ottantadue anni. È molto forte!"
  - tutor: "Ottantadue anni, che bravo!"
    goals: [ages]
  - learner: "E tu, Marco? Com'è la tua famiglia?"
  - tutor: "Siamo in quattro: i miei genitori, mia sorella e io."
    goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao Anna. Mi sveglio alle sette e faccio colazione."
  - tutor: "Che bravo! E poi, la mattina?"
    goals: [wake]
  - learner: "Io uscio di casa alle nove e cammino nel parco."
    errors: [verb-form]
  - tutor: "Uscio? Il verbo uscire cambia molto con io."
    prompt: {text: "Io uscio", tags: [verb-form]}
  - learner: "Ah, sì! Esco di casa alle nove."
  - tutor: "Esatto! E la sera cosa fai?"
    goals: [work]
  - learner: "Ceno con mia moglie e vado a letto a dieci."
    errors: [articulated-preposition]
  - tutor: "A dieci? Con le ore serve anche l'articolo."
    prompt: {text: "a dieci", tags: [articulated-preposition]}
  - learner: "Vado a letto a dieci ore."
    errors: [articulated-preposition]
  - tutor: "Ah, vai a letto alle dieci. È presto!"
    goals: [evening]
    recast: {text: "a dieci ore", fix: "alle dieci", tags: [articulated-preposition]}
  - learner: "Sì, è vero. E tu, a che ora vai a letto?"
  - tutor: "Io vado a letto alle undici. Guardo sempre un film!"
    goals: [ask]

- scenario: hotel-checkin
  level: A1
  persona: es-f-teacher
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, ho una prenotazione per tre notte. Mi chiamo Carmen Ruiz."
    errors: [noun-number]
  - tutor: "Tre notte? Con tre, la parola notte cambia."
    prompt: {text: "tre notte", tags: [noun-number]}
  - learner: "Per tre notti, scusi."
  - tutor: "Perfetto, signora Ruiz. Tre notti, camera 8. Ha un documento?"
    goals: [booking]
  - learner: "Sì, ecco la mia carta d'identità."
  - tutor: "Grazie mille, va benissimo."
    goals: [document]
  - learner: "A che ora è il desayuno?"
    errors: [word-choice]
  - tutor: "La colazione è dalle sette alle nove e mezza."
    goals: [breakfast]
    recast: {text: "il desayuno", fix: "La colazione", tags: [word-choice]}
  - learner: "Grazie. La camera è al primo piano?"
  - tutor: "No, al secondo. Ecco la chiave. Buona notte!"
    goals: [key]

- scenario: mercato-frutta
  level: A1
  persona: es-f-erasmus
  turns:
  - tutor: "Ciao! Cosa ti do oggi?"
  - learner: "Ciao! Quanto costano queste pomodori?"
    errors: [demonstrative]
  - tutor: "Queste pomodori? Pomodori è maschile. E la prima parola?"
    prompt: {text: "queste pomodori", tags: [demonstrative]}
  - learner: "Quanto costano questi pomodori?"
  - tutor: "Brava! Costano tre euro al chilo."
    goals: [ask-price]
  - learner: "Va bene, prendo un chilo."
  - tutor: "Ecco un chilo di pomodori freschi. Altro?"
    goals: [buy-quantity]
  - learner: "Sì, anche tre naranjas."
    errors: [word-choice]
  - tutor: "Tre arance? Certo, ecco qui."
    goals: [ask-other]
    recast: {text: "tre naranjas", fix: "Tre arance", tags: [word-choice]}
  - learner: "Grazie. Quant'è in tutto?"
  - tutor: "Sono quattro euro e venti."
  - learner: "Ecco cinque euro. Ciao!"
  - tutor: "Grazie, ecco il resto. Ciao, a sabato!"
    goals: [pay]

- scenario: numero-telefono
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, molto bella. Mi piace cucinare con te."
  - tutor: "Grazie! Anche tu cucini bene."
  - learner: "Ci vediamo un'altra volta? Possiamo cucinare a casa mia."
  - tutor: "Sì, che bella idea! Mi dai il tuo numero?"
    goals: [propose]
  - learner: "Certo. Il mio numero è 328 604 7715."
  - tutor: "Grazie, ti mando un messaggio. Quando sei libero?"
    goals: [number]
  - learner: "Sono libero lunedì sera. E tu?"
  - tutor: "Lunedì lavoro. Sabato prossimo va bene?"
  - learner: "Sì, sabato prossimo va benissimo."
  - tutor: "Perfetto! A sabato, allora. Ciao!"
    goals: [when]

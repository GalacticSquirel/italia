# Correction-dense A1 dialogues (set x-a1-1), file 9.
- scenario: bar-colazione
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno! Cosa prende?"
  - learner: "Buongiorno! Due caffi, per favore. Uno è per il mio collega."
    errors: [noun-number]
  - tutor: "Due caffi? Attenzione: questa parola non cambia mai."
    prompt: {text: "Due caffi", tags: [noun-number]}
  - learner: "Due caffè!"
  - tutor: "Esatto! Ecco due caffè. Qualcosa da mangiare?"
    goals: [greet, order-drink]
  - learner: "Sì, un cornetto con cioccolato."
    errors: [preposition]
  - tutor: "Con cioccolato? Per i cornetti usiamo un'altra piccola parola."
    prompt: {text: "con cioccolato", tags: [preposition]}
  - learner: "Un cornetto di cioccolato?"
    errors: [preposition]
  - tutor: "Un cornetto al cioccolato, ecco! È ancora caldo."
    goals: [order-food]
    recast: {text: "di cioccolato", fix: "al cioccolato", tags: [preposition]}
  - learner: "Grazie! Quanto pago?"
  - tutor: "Sono tre euro e quaranta."
  - learner: "Ecco. Buona giornata!"
  - tutor: "Grazie, ecco lo scontrino. Buona giornata!"
    goals: [pay]

- scenario: casa-mia
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "Vivo in un piso piccolo a Bologna."
    errors: [word-choice]
  - tutor: "Ah, in un appartamento piccolo! E quante camere ci sono?"
    goals: [type]
    recast: {text: "un piso piccolo", fix: "un appartamento piccolo", tags: [word-choice]}
  - learner: "Ci sono due camere, un bagno e una cucina."
  - tutor: "Bene! E qual è la tua stanza preferita?"
    goals: [rooms]
  - learner: "La cucina! Mia cucina è piccola ma molto bella."
    errors: [possessive]
  - tutor: "Mia cucina? Qui prima di mia manca qualcosa."
    prompt: {text: "Mia cucina", tags: [possessive]}
  - learner: "La mia cucina è piccola ma molto bella."
  - tutor: "Giusto! Una bella cucina è importante."
    goals: [favourite]
  - learner: "Sì! E la tua casa, Luca, com'è?"
  - tutor: "È un appartamento grande, con un balcone."
    goals: [ask]
  - learner: "Che bello! C'è anche una cucina grande?"
  - tutor: "No, la cucina è piccola. Ma io non cucino mai!"

- scenario: chiedere-strada
  level: A1
  persona: en-m-traveller
  turns:
  - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
  - learner: "Buongiorno, scusi! Io non sapo dov'è la stazione."
    errors: [verb-form]
  - tutor: "Non sapo? Il verbo sapere con io è diverso."
    prompt: {text: "non sapo", tags: [verb-form]}
  - learner: "Io non so dov'è la stazione."
  - tutor: "Esatto! La stazione è vicina. Vada dritto fino al semaforo."
    goals: [get-attention, ask-place]
  - learner: "E al semaforo io deve girare a destra?"
    errors: [subject-verb-agreement]
  - tutor: "Io deve? Attenzione al verbo con io."
    prompt: {text: "io deve", tags: [subject-verb-agreement]}
  - learner: "Io devo girare a destra?"
  - tutor: "Bravo! Sì, a destra. Poi vede la stazione."
    goals: [understand]
  - learner: "Perfetto: dritto, poi a destra. Grazie mille!"
  - tutor: "Prego! Buona giornata."
    goals: [thank]

- scenario: famiglia
  level: A1
  persona: en-m-retired
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questi sono miei figli, Tom e Sarah."
    errors: [possessive]
  - tutor: "Miei figli? Con figli, prima di miei manca qualcosa."
    prompt: {text: "miei figli", tags: [possessive]}
  - learner: "Sono miei due figli."
    errors: [possessive]
  - tutor: "Ho capito, i tuoi due figli! Come sono?"
    goals: [who]
    recast: {text: "miei due figli", fix: "i tuoi due figli", tags: [possessive]}
  - learner: "Tom è alto e tranquillo. Sarah è molto simpatica."
  - tutor: "Che bravi! Quanti anni hanno?"
    goals: [describe]
  - learner: "Tom ha quarant'anni e Sarah trentasei. I miei figli vive a Chicago."
    errors: [subject-verb-agreement]
  - tutor: "I miei figli vive? I figli sono due: e il verbo?"
    prompt: {text: "I miei figli vive", tags: [subject-verb-agreement]}
  - learner: "I miei figli vivono a Chicago."
  - tutor: "Perfetto! Che bella città, Chicago."
    goals: [ages]
  - learner: "Sì. E tu, Marco, hai figli?"
  - tutor: "No, ma ho una sorella e un fratello."
    goals: [ask]

- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Ciao Anna! Mi sveglio alle sette e mezza."
  - tutor: "Presto! Fai colazione a casa?"
    goals: [wake]
  - learner: "Sì, bevo un caffè e mangio pane e marmellata. Poi vado all'università."
  - tutor: "E studi tutta la mattina?"
  - learner: "Sì, ho lezione fino all'una. Il pomeriggio studio in biblioteca."
  - tutor: "Che brava! E la sera cosa fai?"
    goals: [work]
  - learner: "Torno a casa, preparo la cena e guardo un film."
  - tutor: "Che bella sera!"
    goals: [evening]
  - learner: "E tu, Anna? A che ora ti svegli?"
  - tutor: "Mi sveglio alle sei, perché lavoro presto."
    goals: [ask]
  - learner: "Alle sei! E a che ora vai a dormire?"
  - tutor: "Alle dieci. La sera sono molto stanca!"
    new: [{lemma: "stanco", gloss: "tired"}]

- scenario: hotel-checkin
  level: A1
  persona: es-m-worker
  turns:
  - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
  - learner: "Buonasera. Sì, ho una reserva. Mi chiamo Diego Sosa."
    errors: [word-choice]
  - tutor: "Bene, ha una prenotazione, signor Sosa. Per quante notti?"
    goals: [booking]
    recast: {text: "una reserva", fix: "una prenotazione", tags: [word-choice]}
  - learner: "Per una notte."
  - tutor: "Perfetto. Ha il passaporto, per favore?"
    new: [{lemma: "passaporto", gloss: "passport"}]
  - learner: "No ho il passaporto qui. Ho la carta d'identità."
    errors: [negation]
  - tutor: "No ho? Prima del verbo usiamo una parola un po' diversa."
    prompt: {text: "No ho", tags: [negation]}
  - learner: "Non ho il passaporto. Ecco la carta d'identità."
  - tutor: "Giusto! La carta va benissimo, grazie."
    goals: [document]
  - learner: "A che ora è la colazione domani?"
  - tutor: "Dalle sei e mezza alle dieci, al piano terra."
    goals: [breakfast]
  - learner: "Bene. E la mia camera?"
  - tutor: "Camera 31, terzo piano. Ecco la chiave!"
    goals: [key]

- scenario: mercato-frutta
  level: A1
  persona: en-f-professional
  turns:
  - tutor: "Ciao! Cosa ti do oggi?"
  - learner: "Ciao! Quanto molto costano le mele?"
    errors: [question-form]
  - tutor: "Quanto molto? Per il prezzo, basta una parola sola."
    prompt: {text: "Quanto molto", tags: [question-form]}
  - learner: "Quanto costano le mele?"
  - tutor: "Esatto! Costano un euro e ottanta al chilo."
    goals: [ask-price]
  - learner: "Bene, prendo mezzo chilo."
  - tutor: "Ecco mezzo chilo di mele. Altro?"
    goals: [buy-quantity]
  - learner: "Sì, anche uno chilo di arance."
    errors: [article-form]
  - tutor: "Uno chilo? Prima di chilo l'articolo è più piccolo."
    prompt: {text: "uno chilo", tags: [article-form]}
  - learner: "Un chilo di arance!"
  - tutor: "Brava! Ecco le arance. Sono fresche."
    goals: [ask-other]
  - learner: "Grazie. Quant'è?"
  - tutor: "Tre euro e venti in tutto."
  - learner: "Ecco. Ciao, buona giornata!"
  - tutor: "Grazie! Ciao, a presto."
    goals: [pay]

- scenario: numero-telefono
  level: A1
  persona: en-m-heritage
  turns:
  - tutor: "È stata una bella lezione, vero?"
  - learner: "Sì, bellissima! Facciamo la pasta insieme un altro giorno?"
  - tutor: "Sì, con piacere!"
    goals: [propose]
  - learner: "Bene! Cosa è il tuo numero?"
    errors: [question-form]
  - tutor: "Cosa è il tuo numero? Qui non usiamo cosa. Quale parola usiamo?"
    prompt: {text: "Cosa è il tuo numero", tags: [question-form]}
  - learner: "Come è il tuo numero?"
    errors: [question-form]
  - tutor: "Qual è il tuo numero, dici? Il mio è 340 771 5629."
    recast: {text: "Come è il tuo numero", fix: "Qual è il tuo numero", tags: [question-form]}
  - learner: "Grazie. Il mio numero è 347 118 9052."
  - tutor: "Grazie, adesso ho il tuo numero. Quando sei libero?"
    goals: [number]
  - learner: "Tu poti venire sabato?"
    errors: [verb-form]
  - tutor: "Tu poti? Il verbo potere cambia molto con tu."
    prompt: {text: "Tu poti", tags: [verb-form]}
  - learner: "Tu puoi venire sabato?"
  - tutor: "Bravo! Sì, sabato sono libero. A sabato!"
    goals: [when]

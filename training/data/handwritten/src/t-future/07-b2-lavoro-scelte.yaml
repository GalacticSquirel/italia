# t-future, file 07: B2 work, plans and negotiations (spariranno, tradurrà, avremo finito, ridurrà, otterrò, metteranno, garantirà, avranno, valuteremo, avrà, sarà stato, ordineremo, pagherò, converrà).
- scenario: politica-lavoro
  level: B2
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Molti lavori cambieranno, ma non spareranno."
      errors: [future-form]
      gold: {text: "spareranno", fix: "spariranno"}
    - tutor: "Spareranno? Così sembra il futuro di sparare, con le pistole! Qual è l'infinito che hai in mente?"
      prompt: {text: "spareranno", tags: [future-form]}
    - learner: "Ah, scusa: non spariranno. Le macchine faranno i compiti ripetitivi e le persone si occuperanno del resto."
    - tutor: "Vedi tutto positivo, tu! E se un programma facesse il tuo lavoro domani, cosa faresti?"
      goals: [opinion]
    - learner: "Se succedesse, farei un corso di formazione e cambierei settore. Non mi fermerei."
    - tutor: "Facile a dirsi. Hai un esempio reale di qualcuno che si è adattato?"
      goals: [hypothesis]
    - learner: "Mia cugina fa la traduttrice. Il programma le propone una prima versione e lei la corregge: tra qualche anno traducerà il doppio dei testi."
      errors: [future-form]
      gold: {text: "traducerà", fix: "tradurrà"}
    - tutor: "Traducerà? Tradurre ha un futuro contratto, come condurre o produrre."
      prompt: {text: "traducerà", tags: [future-form]}
    - learner: "Sì, tradurerà il doppio, credo."
      errors: [future-form]
    - tutor: "Quindi tua cugina tradurrà il doppio dei testi. Ma la pagheranno il doppio, secondo te?"
      goals: [example]
      recast: {text: "tradurerà", fix: "tradurrà", tags: [future-form]}
    - learner: "Non lo so, dipenderà dal mercato. Comunque la formazione varrà più di tutto. E tu, sei davvero così pessimista?"
    - tutor: "Un po' sì, ma mi hai convinto a metà. Tra dieci anni vedremo chi aveva ragione!"
      goals: [conclude]

- scenario: riunione-lavoro
  level: B2
  persona: es-f-teacher
  history: [future-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Siamo a buon punto: entro venerdì averemo finito tutta la parte grafica."
      errors: [future-form]
      gold: {text: "averemo finito", fix: "avremo finito"}
    - tutor: "Averemo finito? Il tempo che hai scelto è giusto, ma attenzione al futuro di avere."
      prompt: {text: "averemo finito", tags: [future-form]}
    - learner: "Entro venerdì avremo finito la parte grafica."
    - tutor: "Ottimo. E il cliente ha già visto le prime pagine?"
      goals: [update]
    - learner: "Non ancora, gliele mando domani. Ma c'è un problema: il server attuale non reggerà il traffico del lancio."
    - tutor: "Questo è serio. Che cosa proponi?"
      goals: [problem]
    - learner: "Propongo di passare a un servizio più potente. Costerà di più, ma ridurà i rischi."
      errors: [future-form]
      gold: {text: "ridurà", fix: "ridurrà"}
    - tutor: "Ridurà? Pensa all'infinito, ridurre: al futuro che cosa resta?"
      prompt: {text: "ridurà", tags: [future-form]}
    - learner: "Costerà di più, ma riducerà i rischi."
      errors: [future-form]
    - tutor: "Capisco: costerà di più, ma ridurrà i rischi. Quanto in più, più o meno?"
      goals: [proposal]
      recast: {text: "riducerà", fix: "ridurrà", tags: [future-form]}
    - learner: "Circa duecento euro al mese. Se il cliente approva entro lunedì, saremo online il quindici, e quando l'avremo testato ti manderò un rapporto."
    - tutor: "D'accordo: ne parlo io con il cliente oggi stesso. Allora online il quindici, rapporto subito dopo."
      goals: [deadline]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-professional
  history: [future-form]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Quest'anno il mio gruppo ha battuto gli obiettivi del venti per cento e abbiamo portato tre nuovi clienti."
      errors: [word-choice]
    - tutor: "Avete superato gli obiettivi del venti per cento, lo so bene, e i nuovi clienti sono un ottimo risultato. Dove vuole arrivare?"
      goals: [results]
      recast: {text: "battuto gli obiettivi", fix: "superato gli obiettivi", tags: [word-choice]}
    - learner: "Vorrei chiederle una promozione a responsabile di area. Credo che la merito."
      errors: [subjunctive-use]
      gold: {text: "Credo che la merito", fix: "Credo di meritarla"}
    - tutor: "Credo che la merito? Dopo credo che, il verbo va bene così? Oppure c'è una forma più semplice."
      prompt: {text: "Credo che la merito", tags: [subjunctive-use]}
    - learner: "Credo di meritarla."
    - tutor: "Non lo metto in dubbio. Il problema è il budget: quest'anno non ci sono fondi per gli aumenti."
      goals: [request]
    - learner: "Capisco. Allora propongo questo: per ora accetto il ruolo senza aumento, e l'anno prossimo, se i risultati si confermano, otenerò l'aumento."
      errors: [future-form]
      gold: {text: "otenerò", fix: "otterrò"}
    - tutor: "Otenerò? Ottenere ha lo stesso futuro particolare di tenere."
      prompt: {text: "otenerò", tags: [future-form]}
    - learner: "L'anno prossimo otterrò l'aumento, se i risultati si confermano."
    - tutor: "È una proposta ragionevole. Ne parlerò con la direzione."
      goals: [handle]
    - learner: "Grazie. Quando saprò qualcosa? Vorrei organizzare il lavoro del gruppo."
    - tutor: "Le darò una risposta entro la fine del mese. Nel frattempo, prepari un piano per il nuovo ruolo."
      goals: [next-steps]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Immaginiamo una festa in campagna, semplice ma elegante. Ci saranno circa centoventi invitati."
    - tutor: "Bellissimo. E che budget avete in mente?"
      goals: [vision]
    - learner: "Non più di trentamila euro. I miei genitori ci aiuteranno, e anche i genitori di Laura poneranno qualcosa."
      errors: [word-choice]
    - tutor: "Perfetto, se anche i genitori di Laura metteranno qualcosa, con trentamila euro si fa una bella festa. Ho due proposte: una villa con giardino o un agriturismo in collina, più economico."
      goals: [budget]
      recast: {text: "poneranno", fix: "metteranno", tags: [word-choice]}
    - learner: "La villa è splendida, ma l'agriturismo costerà meno. Lei che cosa ci consiglia?"
    - tutor: "Io sceglierei l'agriturismo: ha anche un piccolo lago, ideale per le foto."
    - learner: "Va bene, l'agriturismo. Ma se piove, il proprietario ci garanterà un piano B?"
      errors: [future-form]
      gold: {text: "garanterà", fix: "garantirà"}
    - tutor: "Garanterà? Pensi all'infinito: finisce come dormire, non come vedere."
      prompt: {text: "garanterà", tags: [future-form]}
    - learner: "Il proprietario garantarà un piano B?"
      errors: [future-form]
    - tutor: "Sì, il proprietario garantirà una grande tenda in caso di pioggia: è nel contratto."
      goals: [choices]
      recast: {text: "garantarà", fix: "garantirà", tags: [future-form]}
    - learner: "Perfetto. Un'ultima cosa: vogliamo che lei ci mandi ogni spesa per email prima di confermarla."
    - tutor: "Certo, nessuna spesa senza la vostra approvazione. Vi mando il primo preventivo entro venerdì."
      goals: [conditions]

- scenario: dibattito-ambiente
  level: B2
  persona: en-m-retired
  history: [future-form]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Non sono d'accordo. Secondo me chiudere il centro alle auto lo renderà più vivibile."
    - tutor: "Più vivibile, forse, ma vuoto! Chi verrà a fare la spesa senza parcheggio?"
      goals: [position]
    - learner: "Le do due argomenti: primo, l'aria sarà più pulita; secondo, la gente camminerà di più e i negozi averanno più clienti, non meno."
      errors: [future-form]
      gold: {text: "averanno", fix: "avranno"}
    - tutor: "Averanno? Il futuro di avere è più breve di così."
      prompt: {text: "averanno", tags: [future-form]}
    - learner: "Sì, i negozi averanno più clienti."
      errors: [future-form]
    - tutor: "Lei dice che i negozi avranno più clienti? Mi sembra molto sicuro. E gli anziani, come arriveranno in centro?"
      goals: [argue]
      recast: {text: "averanno", fix: "avranno", tags: [future-form]}
    - learner: "Il comune potenzierà gli autobus e metterà navette elettriche gratuite. Così anche gli anziani si muoveranno facilmente."
    - tutor: "Navette gratuite... e chi le pagherà?"
      goals: [counter]
    - learner: "Su questo ha ragione, costeranno molto. Propongo un compromesso: chiudiamo il centro solo nel fine settimana e tra un anno valutaremo i risultati."
      errors: [future-form]
      gold: {text: "valutaremo", fix: "valuteremo"}
    - tutor: "Valutaremo? Attenzione: con valutare la a del futuro cambia."
      prompt: {text: "valutaremo", tags: [future-form]}
    - learner: "Tra un anno valuteremo i risultati."
    - tutor: "Solo il fine settimana, per un anno di prova... Ecco, su questo potrei anche essere d'accordo."
      goals: [concede]

- scenario: medico-specialista
  level: B2
  persona: es-f-teacher
  history: [future-form]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
    - learner: "Mi stanco molto quando salgo le scale. La settimana scorsa, mentre facevo la spesa, mi girava la testa e mi sedevo per terra."
      errors: [tense-aspect]
      gold: {text: "mi sedevo", fix: "mi sono seduta"}
    - tutor: "Mi sedevo? Qui parla di un fatto preciso, successo una volta in quel momento."
      prompt: {text: "mi sedevo", tags: [tense-aspect]}
    - learner: "Mi sono seduta per terra, ero spaventata."
    - tutor: "Capisco. Qualcuno nella sua famiglia ha avuto problemi di cuore?"
      goals: [symptoms]
    - learner: "Sì, mio padre aveva la pressione alta e ha avuto un infarto a sessant'anni."
    - tutor: "Gli esami mostrano una pressione un po' alta, ma niente di grave per ora."
      goals: [history]
    - learner: "Meno male. Ma cosa significa, esattamente? Dovrò fare altri esami?"
    - tutor: "Significa che dobbiamo tenerla sotto controllo: faremo un nuovo controllo tra tre mesi. Intanto le prescrivo una terapia leggera."
      goals: [understand]
    - learner: "La terapia tendrà effetti collaterali?"
      errors: [future-form]
      gold: {text: "tendrà", fix: "avrà"}
    - tutor: "Tendrà? Questo è spagnolo! In italiano, una terapia che cosa fa al futuro?"
      prompt: {text: "tendrà", tags: [future-form]}
    - learner: "La terapia averà effetti collaterali?"
      errors: [future-form]
    - tutor: "Di solito la terapia non avrà effetti importanti: al massimo un po' di mal di testa all'inizio."
      goals: [treatment]
      recast: {text: "averà", fix: "avrà", tags: [future-form]}
    - learner: "Va bene. E potrò continuare a camminare ogni giorno?"
    - tutor: "Certo, anzi glielo consiglio: mezz'ora al giorno, senza fare troppa fatica."

- scenario: recensione-ristorante
  level: B2
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Sì, purtroppo. Abbiamo aspettato quasi un'ora per i secondi, e la carne era fredda."
    - tutor: "Mi dispiace moltissimo. Stasera in cucina mancava un cuoco, ma non è una scusa."
      goals: [complain, detail]
    - learner: "Il cuoco esserà stato stanchissimo, poverino."
      errors: [future-form]
      gold: {text: "esserà stato", fix: "sarà stato"}
    - tutor: "Esserà stato? L'idea è giusta, ma attenzione al futuro di essere."
      prompt: {text: "esserà stato", tags: [future-form]}
    - learner: "Sarrà stato stanco."
      errors: [future-form]
    - tutor: "Sì, sarà stato stanchissimo: era da solo per tutta la sala. Ma voi non dovevate aspettare così tanto."
      recast: {text: "Sarrà stato", fix: "sarà stato", tags: [future-form]}
    - learner: "Infatti. Ci aspettavamo di più: ci avevano detto che era il miglior ristorante della zona."
    - tutor: "Avete ragione. Vorrei offrirvi la cena di stasera, se accettate."
      goals: [expectation]
    - learner: "Accettiamo volentieri, grazie. Torneremo il mese prossimo e quella volta ordinaremo il pesce."
      errors: [future-form]
      gold: {text: "ordinaremo", fix: "ordineremo"}
    - tutor: "Ordinaremo? Pensi a come cambia ordinare al futuro."
      prompt: {text: "ordinaremo", tags: [future-form]}
    - learner: "Ordineremo il pesce, che dicono sia ottimo."
    - tutor: "Il pesce è il nostro piatto migliore, e vi prometto che non aspetterete. Grazie per la pazienza."
      goals: [resolve]

- scenario: trattativa-affitto
  level: B2
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto. Però il canone di novecento euro mi sembra alto per la zona."
    - tutor: "Il proprietario è disposto a trattare, ma non troppo. Cosa propone?"
      goals: [interest]
    - learner: "Ottocento euro. In cambio, mi occuperò io delle piccole riparazioni e pagarò sei mesi in anticipo."
      errors: [future-form]
      gold: {text: "pagarò", fix: "pagherò"}
    - tutor: "Pagarò? Al futuro pagare cambia la a, e anche un suono."
      prompt: {text: "pagarò", tags: [future-form]}
    - learner: "Pagherò sei mesi in anticipo."
    - tutor: "Proposta interessante: credo che il proprietario accetterà ottocentocinquanta. Il contratto è di quattro anni più quattro, con sei mesi di preavviso per la disdetta."
      goals: [negotiate]
    - learner: "Sei mesi sono troppi. Forse il mio lavoro mi porterà all'estero, e allora il contratto mi conveniterà poco."
      errors: [future-form]
      gold: {text: "conveniterà", fix: "converrà"}
    - tutor: "Conveniterà? Convenire al futuro si comporta come venire."
      prompt: {text: "conveniterà", tags: [future-form]}
    - learner: "Il contratto mi converà poco."
      errors: [future-form]
    - tutor: "Capisco: con sei mesi di avviso, il contratto le converrà poco. Chiederò al proprietario tre mesi invece di sei."
      goals: [conditions]
      recast: {text: "converà", fix: "converrà", tags: [future-form]}
    - learner: "Perfetto. Se il proprietario accetta tre mesi e ottocentocinquanta euro, firmo la settimana prossima."
    - tutor: "Benissimo, lo chiamo oggi pomeriggio e le faccio sapere entro domani."
      goals: [conclude]

# t-future, file 03: A2 past stories that end in plans, and errands in town (visiteremo, tornerà, vedrà, vedranno, vorrà, aspetterà, metterò, cambierà, pagheremo).
- scenario: vacanze-passate
  level: A2
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono andato in Sardegna con la mia famiglia. Siamo stato in un albergo vicino al mare."
      errors: [participle-agreement]
      gold: {text: "Siamo stato", fix: "Siamo stati"}
    - tutor: "Siamo stato? Attenzione: eravate in tanti, non solo tu."
      prompt: {text: "Siamo stato", tags: [participle-agreement]}
    - learner: "Siamo stati in un albergo vicino al mare."
    - tutor: "Che bello! Che tempo ha fatto?"
      goals: [where]
    - learner: "Ha fatto molto caldo, trentacinque gradi! Ma l'acqua del mare era fresca."
    - tutor: "Perfetto per nuotare! E che cosa avete fatto?"
      goals: [weather]
    - learner: "Abbiamo nuotato tutti i giorni e abbiamo visitato un pueblo antico in montagna."
      errors: [word-choice]
    - tutor: "Ah, avete visitato un paese antico! In Sardegna ce ne sono di bellissimi."
      goals: [activities]
      recast: {text: "un pueblo antico", fix: "un paese antico", tags: [word-choice]}
    - learner: "Sì, bellissimo. L'anno prossimo torneremo e visitaremo anche il nord dell'isola."
      errors: [future-form]
      gold: {text: "visitaremo", fix: "visiteremo"}
    - tutor: "Visitaremo? Attenzione alla a di visitare: al futuro non resta."
      prompt: {text: "visitaremo", tags: [future-form]}
    - learner: "Visiteremo anche il nord dell'isola."
    - tutor: "Bravo! E cosa ti è piaciuto di più?"
    - learner: "Il cibo! Mia moglie ha comprato un libro di cucina sarda. Sabato prossimo cucina per tutti, vieni anche tu?"
    - tutor: "Sì, grazie, vengo con piacere! Porto io il vino."
      goals: [best]

- scenario: weekend-scorso
  level: A2
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Benissimo! Sono andato a Verona con due amiche."
      errors: [participle-agreement]
      gold: {text: "andato", fix: "andata"}
    - tutor: "Sei andato? Pensa a chi parla: sei una ragazza."
      prompt: {text: "andato", tags: [participle-agreement]}
    - learner: "Sono andata a Verona con due amiche."
    - tutor: "A Verona, che bello! E cosa avete fatto?"
      goals: [where, with-who]
    - learner: "Abbiamo visto l'Arena e mangiato il risotto. Giulia ci tornarà il mese prossimo per l'opera."
      errors: [future-form]
      gold: {text: "tornarà", fix: "tornerà"}
    - tutor: "Tornarà? Pensa a tornare: al futuro la a cambia."
      prompt: {text: "tornarà", tags: [future-form]}
    - learner: "Sì, ci tornarà per l'opera."
      errors: [future-form]
    - tutor: "Ah, Giulia ci tornerà per l'opera? Che fortunata! Che cosa vedrà?"
      goals: [what]
      recast: {text: "tornarà", fix: "tornerà", tags: [future-form]}
    - learner: "Vederà l'Aida, e forse io vado con lei."
      errors: [future-form]
      gold: {text: "Vederà", fix: "Vedrà"}
    - tutor: "Vederà? Pensa al futuro di avere: Giulia avrà, Giulia... ?"
      prompt: {text: "Vederà", tags: [future-form]}
    - learner: "Vedrà l'Aida!"
    - tutor: "Esatto! L'Aida all'Arena è bellissima. Allora, ti è piaciuta Verona?"
    - learner: "Sì, moltissimo. È più piccola di Milano, ma più bella. E il tuo fine settimana?"
    - tutor: "Tranquillo: sono rimasta a casa a leggere. Ma la prossima volta vengo con voi!"
      goals: [opinion]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-retired
  history: [future-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo in un piccolo paese in Scozia, vicino al mare."
    - tutor: "Al mare! E cosa facevi d'estate?"
      goals: [place]
    - learner: "Ogni estate sono andato a pescare con mio nonno."
      errors: [tense-aspect]
      gold: {text: "sono andato", fix: "andavo"}
    - tutor: "Sei andato? Ma ogni estate... era una cosa di tutti gli anni."
      prompt: {text: "sono andato", tags: [tense-aspect]}
    - learner: "Ogni estate andavo a pescare con mio nonno."
    - tutor: "Che bel ricordo! E a scuola com'eri? Ti ricordi un giorno speciale?"
      goals: [habits]
    - learner: "A scuola ero tranquillo. Un giorno, però, il nonno mi ha portato in barca e abbiamo visto i delfini!"
    - tutor: "I delfini, che bello! Torni ancora in quel paese?"
      goals: [school, event]
    - learner: "Sì, quest'estate porterò i miei nipoti. Pescaremo insieme, come con il nonno."
      errors: [future-form]
      gold: {text: "Pescaremo", fix: "Pescheremo"}
    - tutor: "Pescaremo? Attenzione: al futuro qui cambiano due cose."
      prompt: {text: "Pescaremo", tags: [future-form]}
    - learner: "Pescheremo insieme, e i bambini vederanno i delfini, spero!"
      errors: [future-form]
    - tutor: "Sicuramente i tuoi nipoti vedranno i delfini, come te da piccolo!"
      recast: {text: "vederanno", fix: "vedranno", tags: [future-form]}
    - learner: "Grazie, Matteo. E tu dove abitavi?"
    - tutor: "Io abitavo in città, a Torino. Niente mare, ma tanta neve d'inverno!"

- scenario: lavanderia
  level: A2
  persona: es-f-erasmus
  history: [future-form]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie. La lavatrice non funziona. Ho messo i soldi, ma niente. Come si usa?"
    - tutor: "Prima scegli il programma, qui. Poi spingi qui, sul verde."
      goals: [problem, ask-how]
    - learner: "Ah, funziona! Quanto tempo ci vorerà?"
      errors: [future-form]
      gold: {text: "vorerà", fix: "vorrà"}
    - tutor: "Ci vorerà? Il futuro di volere è speciale, come quello di venire."
      prompt: {text: "vorerà", tags: [future-form]}
    - learner: "Ci volerà un'ora?"
      errors: [future-form]
    - tutor: "Sì, ci vorrà un'ora, più o meno."
      recast: {text: "volerà", fix: "vorrà", tags: [future-form]}
    - learner: "Va bene. E l'asciugatrice? Come la pago?"
    - tutor: "Con i gettoni: li compri alla macchina vicino alla porta, due euro l'uno."
      goals: [payment]
    - learner: "Grazie mille! Mentre aspetto, andarò a prendere un caffè."
      errors: [future-form]
      gold: {text: "andarò", fix: "andrò"}
    - tutor: "Andarò? Ascolta: io vado, domani io... ?"
      prompt: {text: "andarò", tags: [future-form]}
    - learner: "Andrò a prendere un caffè. Vuoi qualcosa anche tu?"
    - tutor: "Che gentile! Un caffè anche per me, grazie."
      goals: [thank]

- scenario: autobus
  level: A2
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Dove deve andare?"
    - learner: "Buongiorno. Questo autobus va al stadio? Stasera c'è la partita."
      errors: [articulated-preposition]
      gold: {text: "al stadio", fix: "allo stadio"}
    - tutor: "Al stadio? Attenzione all'articolo di stadio."
      prompt: {text: "al stadio", tags: [articulated-preposition]}
    - learner: "Allo stadio, scusi. Arriveremo prima delle otto?"
    - tutor: "Sì, la linea dodici va allo stadio e ci mette venti minuti. Ha il biglietto?"
      goals: [route]
    - learner: "No, non ce l'ho. Posso comprarlo da lei?"
    - tutor: "Sì, costa due euro. Ecco il biglietto."
      goals: [ticket]
    - learner: "A che fermata devo scendere? Mio cugino mi aspettarà davanti allo stadio."
      errors: [future-form]
      gold: {text: "aspettarà", fix: "aspetterà"}
    - tutor: "Aspettarà? Attenzione alla a di aspettare al futuro."
      prompt: {text: "aspettarà", tags: [future-form]}
    - learner: "Mi aspetterrà davanti allo stadio."
      errors: [future-form]
    - tutor: "Allora scenda alla fermata dello stadio: suo cugino l'aspetterà proprio lì."
      goals: [stop]
      recast: {text: "aspetterrà", fix: "aspetterà", tags: [future-form]}
    - learner: "Grazie mille, è molto gentile!"
    - tutor: "Prego! Buona partita!"
      goals: [thank]

- scenario: chiedere-strada
  level: A2
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Sì, scusi. È una stazione qui vicino?"
      errors: [ce-ci-sono]
      gold: {text: "È una stazione", fix: "C'è una stazione"}
    - tutor: "È una stazione? Vuole sapere se qui vicino esiste una stazione? Come si chiede?"
      prompt: {text: "È una stazione", tags: [ce-ci-sono]}
    - learner: "C'è una stazione qui vicino? Il mio treno partirà tra mezz'ora."
    - tutor: "Sì, è vicina. Vada dritto fino al semaforo, poi giri a destra."
      goals: [get-attention, ask-place]
    - learner: "Dritto fino al semaforo, poi a sinistra?"
    - tutor: "No, a destra! Poi vede subito la piazza della stazione."
      goals: [understand]
    - learner: "Ah, a destra. Quanto tempo ci meterò a piedi?"
      errors: [future-form]
      gold: {text: "meterò", fix: "metterò"}
    - tutor: "Ci meterò? Attenzione al suono di mettere."
      prompt: {text: "meterò", tags: [future-form]}
    - learner: "Quanto tempo ci metterò a piedi?"
    - tutor: "Dieci minuti, non di più. Arriva in tempo, non c'è problema."
    - learner: "Grazie mille, lei è molto gentile!"
    - tutor: "Di niente! Buon viaggio!"
      goals: [thank]

- scenario: abbigliamento
  level: A2
  persona: en-f-professional
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Buongiorno. Cerco una maglietta per mio figlio. Domenica compirà dodici anni."
    - tutor: "Che bello! Di che colore e che taglia?"
      goals: [ask-item]
    - learner: "Blu o verde. È alto come me, quindi una S da adulto."
    - tutor: "Ecco, ho questa blu e quella verde con il cane."
      goals: [size-colour]
    - learner: "Quella verda è carina!"
      errors: [adjective-agreement]
      gold: {text: "verda", fix: "verde"}
    - tutor: "Verda? Attenzione: questo colore finisce sempre in -e, come grande."
      prompt: {text: "verda", tags: [adjective-agreement]}
    - learner: "Quella verde è carina! Posso provarla io? Abbiamo la stessa taglia."
    - tutor: "Certo, il camerino è lì a destra."
      goals: [try]
    - learner: "Mi sta bene. Se non gli piace, mio figlio la cambiarà?"
      errors: [future-form]
      gold: {text: "cambiarà", fix: "cambierà"}
    - tutor: "Cambiarà? Attenzione: al futuro cambiare non tiene la a."
      prompt: {text: "cambiarà", tags: [future-form]}
    - learner: "Sì... la cambiarà senza problemi?"
      errors: [future-form]
    - tutor: "Sì, suo figlio la cambierà senza problemi, con lo scontrino. La prende?"
      recast: {text: "cambiarà", fix: "cambierà", tags: [future-form]}
    - learner: "Sì, la prendo. Pago con la carta."
    - tutor: "Sono diciannove euro. Ecco lo scontrino, e buon compleanno a suo figlio!"
      goals: [decide]

- scenario: ristorante-ordinare
  level: A2
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Buongiorno, benvenuti! Quanti siete?"
    - learner: "Siamo in due adesso, ma tra dieci minuti arriverà un amico."
    - tutor: "Allora vi do un tavolo per tre, vicino alla finestra. Ecco il menù."
      goals: [ask-table]
    - learner: "Grazie. Per me le tagliatelle al ragù. Il mio amico è vegetariano: lui vorà il risotto ai funghi, penso."
      errors: [future-form]
      gold: {text: "vorà", fix: "vorrà"}
    - tutor: "Vorà? Ascolti bene volere al futuro: è come venire."
      prompt: {text: "vorà", tags: [future-form]}
    - learner: "Lui volerà il risotto ai funghi."
      errors: [future-form]
    - tutor: "Va bene, allora il suo amico vorrà il risotto ai funghi. E da bere?"
      goals: [order-food]
      recast: {text: "volerà", fix: "vorrà", tags: [future-form]}
    - learner: "Una bottiglia di vino rosso e acqua frizzante, per favore."
    - tutor: "Benissimo, arrivano subito."
      goals: [order-drink]
    - learner: "Scusi, il conto, per favore. Pagaremo con la carta."
      errors: [future-form]
      gold: {text: "Pagaremo", fix: "Pagheremo"}
    - tutor: "Pagaremo? Attenzione: pagare al futuro cambia la a, e non solo."
      prompt: {text: "Pagaremo", tags: [future-form]}
    - learner: "Pagheremo con la carta."
    - tutor: "Certo, le porto subito il conto."
      goals: [ask-bill]

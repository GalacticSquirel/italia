# t-future, file 01: A2 plans with friends and services (farò, comprerà, potremo, sarò, darò, potrò, verrò, rimarrò, potrà, pagherò).
- scenario: compleanno
  level: A2
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Il compleanno è venerdì, ma facciamo la festa sabato sera, va bene?"
    - tutor: "Sabato sera è perfetto, venerdì lei lavora fino a tardi. Chi invitiamo?"
      goals: [date]
    - learner: "Io inviterò i suoi amici dell'università e tu inviti i colleghi."
    - tutor: "D'accordo, scrivo ai colleghi stasera. E da mangiare?"
      goals: [guests]
    - learner: "Io farerò una lasagna grande per tutti."
      errors: [future-form]
      gold: {text: "farerò", fix: "farò"}
    - tutor: "Farerò? Attenzione, il futuro di fare è più semplice. Prova ancora!"
      prompt: {text: "farerò", tags: [future-form]}
    - learner: "Farò una lasagna grande per tutti."
    - tutor: "Brava! Io porto da bere e il dolce. E il regalo?"
      goals: [food]
    - learner: "Sara vuole un corso di cucina. Lo comprarà sua sorella, e noi diamo dei soldi."
      errors: [future-form]
      gold: {text: "comprarà", fix: "comprerà"}
    - tutor: "Comprarà? Pensa alla a di comprare: al futuro cambia. Come si dice?"
      prompt: {text: "comprarà", tags: [future-form]}
    - learner: "Lo compererà sua sorella."
      errors: [future-form]
    - tutor: "Ah, lo comprerà sua sorella, bene! Allora le mando dieci euro anch'io."
      goals: [gift]
      recast: {text: "compererà", fix: "comprerà", tags: [future-form]}
    - learner: "Perfetto. E io scriverò un biglietto per tutti."
    - tutor: "Ottima idea, Sara sarà contentissima. Ci sentiamo domani!"

- scenario: noleggio-bici
  level: A2
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Vuole una bicicletta?"
    - learner: "Sì, due biciclette: una per me e una per mia figlia. Lei ha dieci anni."
    - tutor: "Allora una bicicletta grande e una più piccola. Per quanto tempo le servono?"
      goals: [ask]
    - learner: "Per tre ore. Poderemo tornare all'una?"
      errors: [future-form]
      gold: {text: "Poderemo", fix: "Potremo"}
    - tutor: "Poderemo? Pensi al futuro di potere: perde una lettera. Prova ancora."
      prompt: {text: "Poderemo", tags: [future-form]}
    - learner: "Potremo tornare all'una? E pago quando torniamo?"
    - tutor: "Certo, all'una va benissimo. Sono dodici euro in tutto, ma si paga adesso, per favore."
      goals: [duration, price]
    - learner: "Grazie. Dove ci consiglia di andare? Mia figlia vuole vedere la fiume."
      errors: [noun-gender]
      gold: {text: "la fiume", fix: "il fiume"}
    - tutor: "La fiume? Attenzione: fiume è come mare, non come casa."
      prompt: {text: "la fiume", tags: [noun-gender]}
    - learner: "Ah, il fiume! Mia figlia vuole vedere il fiume."
    - tutor: "Sì! C'è una strada lungo il fiume, molto tranquilla. Vada sempre dritto per venti minuti."
      goals: [route]
    - learner: "Perfetto. Allora all'una le bici esseranno qui."
      errors: [future-form]
      gold: {text: "esseranno", fix: "saranno"}
    - tutor: "Esseranno? Al futuro essere cambia tutto. Prova ancora!"
      prompt: {text: "esseranno", tags: [future-form]}
    - learner: "All'una le bici saranno qui, promesso."
    - tutor: "Benissimo! Buona giornata a lei e a sua figlia."

- scenario: serata-cinema
  level: A2
  persona: en-f-professional
  history: [future-form]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Sì! Andiamo al cinema? Al Lux c'è un film nuovo."
    - tutor: "Bella idea! Che film è? A me piacciono tanto le commedie."
      goals: [propose]
    - learner: "È un film d'azione. A me piace di più i film d'azione, ma una commedia va bene."
      errors: [piacere]
      gold: {text: "piace di più i film", fix: "piacciono di più i film"}
    - tutor: "Ti piace i film? Attenzione: i film sono tanti, non uno."
      prompt: {text: "piace di più i film", tags: [piacere]}
    - learner: "Mi piacciono di più i film d'azione."
    - tutor: "Allora facciamo così: al Lux c'è anche una commedia d'azione. Comincia alle nove meno un quarto."
      goals: [genre]
    - learner: "Va bene, la vediamo! Compri tu i biglietti? Io ti darerò i soldi al cinema."
      errors: [future-form]
      gold: {text: "darerò", fix: "darò"}
    - tutor: "Darerò? Il futuro di dare è facile, come quello di fare. Prova ancora."
      prompt: {text: "darerò", tags: [future-form]}
    - learner: "Ti darò i soldi al cinema."
    - tutor: "D'accordo, li compro io su internet. Dove ci vediamo?"
      goals: [choose]
    - learner: "Davanti al cinema alle otto e mezza? Io esserò in bici."
      errors: [future-form]
      gold: {text: "esserò", fix: "sarò"}
    - tutor: "Esserò? Al futuro essere cambia molto. Prova ancora!"
      prompt: {text: "esserò", tags: [future-form]}
    - learner: "Sarò in bici, allora ti aspetto davanti."
    - tutor: "Perfetto, a stasera allora!"
      goals: [meet]

- scenario: palestra
  level: A2
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Ciao! Vuoi informazioni sull'abbonamento?"
    - learner: "Sì, grazie. Quanto costa un abbonamento per tre mesi?"
    - tutor: "Costa centoventi euro, con tutti i corsi. Che cosa ti piace fare?"
      goals: [ask-membership]
    - learner: "Mi piace nuotare, ma qui non c'è la piscina, vero? Allora proverò lo yoga."
    - tutor: "No, qui niente piscina, mi dispiace. Lo yoga c'è il lunedì e il giovedì."
      goals: [classes]
    - learner: "Il giovedì lavoro fino alle sette. Poterò venire alle otto?"
      errors: [future-form]
      gold: {text: "Poterò", fix: "Potrò"}
    - tutor: "Poterò? Il futuro di potere perde una lettera. Prova ancora."
      prompt: {text: "Poterò", tags: [future-form]}
    - learner: "Potrò venire alle otto?"
    - tutor: "Sì, il giovedì c'è una lezione alle otto e un quarto."
      goals: [timetable]
    - learner: "Benissimo. Mi iscrivo oggi e comincio giovedì prossimo."
    - tutor: "Perfetto! Mi dai un documento e compiliamo il modulo?"
    - learner: "Ecco la carta d'identità. Mia amica Kate verà con me la prima volta."
      errors: [possessive, future-form]
      gold: {text: "verà", fix: "verrà"}
    - tutor: "Verà? Ascolta bene il futuro di venire: è un po' più forte."
      prompt: {text: "verà", tags: [future-form]}
    - learner: "La mia amica Kate verrà con me."
    - tutor: "Bene, per lei la prima lezione non si paga!"
      goals: [sign-up]

- scenario: cercare-lavoro-a2
  level: A2
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Buongiorno, sì. Cercate un cameriere per l'estate?"
    - tutor: "Sì, per luglio e agosto. Ha già lavorato in un bar?"
      goals: [ask]
    - learner: "Sì, ho lavorato due anni in un bar a Londra. Ho fatto i caffè e ho servito ai tavoli."
    - tutor: "Molto bene. Quando può cominciare?"
      goals: [experience]
    - learner: "Finisco l'università il venti giugno. Dopo averò tempo tutti i giorni."
      errors: [future-form]
      gold: {text: "averò", fix: "avrò"}
    - tutor: "Averò? Al futuro avere perde una lettera. Come si dice?"
      prompt: {text: "averò", tags: [future-form]}
    - learner: "Dopo avrò tempo tutti i giorni, anche la domenica."
    - tutor: "Ottimo, la domenica abbiamo sempre tanto lavoro. Mi lascia il suo numero?"
      goals: [availability]
    - learner: "Certo, eccolo. E mi chiamarà questa settimana?"
      errors: [future-form]
      gold: {text: "chiamarà", fix: "chiamerà"}
    - tutor: "Chiamarà? Attenzione alla a di chiamare al futuro."
      prompt: {text: "chiamarà", tags: [future-form]}
    - learner: "Sì, ma mi chiamarà venerdì?"
      errors: [future-form]
    - tutor: "Sì, mia moglie la chiamerà venerdì: il bar è anche suo."
      goals: [contact]
      recast: {text: "chiamarà", fix: "chiamerà", tags: [future-form]}
    - learner: "Grazie mille, arrivederci!"
    - tutor: "Arrivederci e a presto!"

- scenario: biglietto-treno
  level: A2
  persona: en-m-retired
  history: [future-form]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno. Devo andare a Bologna sabato mattina."
    - tutor: "Bene. Solo andata o andata e ritorno?"
      goals: [destination]
    - learner: "Andata e ritorno. Rimanerò a Bologna due notti."
      errors: [future-form]
      gold: {text: "Rimanerò", fix: "Rimarrò"}
    - tutor: "Rimanerò? Il futuro di rimanere è speciale, come quello di venire."
      prompt: {text: "Rimanerò", tags: [future-form]}
    - learner: "Rimarrò a Bologna due notti."
    - tutor: "Perfetto, allora il ritorno è lunedì. Prima o seconda classe?"
      goals: [type]
    - learner: "Seconda, grazie. Vorrei un posto vicino alla finestra."
      errors: [word-choice]
    - tutor: "Va bene, le do un posto vicino al finestrino."
      goals: [class]
      recast: {text: "alla finestra", fix: "al finestrino", tags: [word-choice]}
      new: [{lemma: finestrino, gloss: train window}]
    - learner: "Grazie. Il treno partirà in orario? Ieri c'era uno sciopero."
    - tutor: "Sì, sabato non ci sono problemi. Parte dal binario cinque alle otto e dieci."
      goals: [platform]
    - learner: "Benissimo. Allora sarò qui alle otto."
    - tutor: "Buon viaggio e buon fine settimana a Bologna!"

- scenario: prenotare-tavolo
  level: A2
  persona: es-f-teacher
  history: [future-form]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per domani sera."
    - tutor: "Certo. Per quante persone e a che ora?"
      goals: [book]
    - learner: "Saremo in otto. Arriveremo alle otto, ma due amici vengono più tardi."
    - tutor: "Va bene, otto persone alle otto. Teniamo due posti per i suoi amici."
      goals: [details]
    - learner: "Grazie. Una mia amica è vegetariana. Poterà mangiare qualcosa?"
      errors: [future-form]
      gold: {text: "Poterà", fix: "Potrà"}
    - tutor: "Poterà? Attenzione al futuro di potere. Come si dice?"
      prompt: {text: "Poterà", tags: [future-form]}
    - learner: "Poderà mangiare qualcosa?"
      errors: [future-form]
    - tutor: "Sì, certo, la sua amica potrà mangiare una pasta alle verdure."
      recast: {text: "Poderà", fix: "potrà", tags: [future-form]}
    - learner: "Perfetto. E per il dolce? Domani è il compleanno di mio marito."
    - tutor: "Allora alla fine portiamo un dolce speciale! A che nome prenoto?"
      goals: [special]
    - learner: "A nome García. Pagheremo con la carta."
    - tutor: "Benissimo, signora. A domani sera!"
      goals: [name]

- scenario: tempo-libero
  level: A2
  persona: en-m-heritage
  history: [future-form]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Di solito gioco a tennis il sabato mattina. Questo sabato giocherò una partita importante."
    - tutor: "Una partita importante? Contro chi?"
      goals: [hobby]
    - learner: "Contro il mio vecchio professore! Giochiamo insieme ogni settimana, ma lui vince sempre."
    - tutor: "Allora vi vedete spesso! Questa volta vincerai tu?"
      goals: [frequency]
    - learner: "Speriamo! Se perdo, pagerò la cena."
      errors: [future-form]
      gold: {text: "pagerò", fix: "pagherò"}
    - tutor: "Pagerò? Attenzione al suono di pagare: deve restare duro. Prova ancora."
      prompt: {text: "pagerò", tags: [future-form]}
    - learner: "Se perdo, pagherò la cena."
    - tutor: "Esatto! Allora devi vincere per forza."
    - learner: "E tu cosa fai nel fine settimana?"
    - tutor: "Io vado spesso in montagna a camminare. Domenica vado sul Monte Grappa con mio marito."
      goals: [ask]
    - learner: "Che bello! Io e mia moglie veniremo volentieri, se possiamo."
      errors: [future-form]
      gold: {text: "veniremo", fix: "verremo"}
    - tutor: "Veniremo? Il futuro di venire è speciale. Prova ancora!"
      prompt: {text: "veniremo", tags: [future-form]}
    - learner: "Io e mia moglie verremo volentieri."
    - tutor: "Benissimo, allora partiamo domenica alle sette!"
      goals: [propose]

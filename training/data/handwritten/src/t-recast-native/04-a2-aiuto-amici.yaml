# Set t-recast-native, file 4: A2, friends' news, job hunting, plans and family (real learner
# sentences corrected by a native speaker; recasts use the native fix of the learner's span).

- scenario: weekend-scorso
  level: A2
  persona: es-f-teacher
  history: [article-use]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Così così. Venerdì la mia amica Giulia ha lasciato il suo ragazzo."
  - tutor: "Oh no, povera Giulia! Perché?"
  # merlin-1365_0100098-5
  - learner: "Il Paolo non era fedele."
    errors: [article-use]
  - tutor: "Che brutto! Ma «il Paolo»: davanti al nome di una persona, usiamo l'articolo?"
    prompt: {text: "Il Paolo", tags: [article-use]}
  - learner: "Sì, il Paolo aveva un'altra ragazza da tre mesi."
    errors: [article-use]
  - tutor: "Paolo aveva un'altra ragazza da tre mesi? Che storia! E Giulia non sapeva niente?"
    recast: {text: "il Paolo", fix: "Paolo", tags: [article-use]}
  # merlin-1365_0100098-16
  - learner: "Ma sapeva già!"
    errors: [object-pronoun]
  - tutor: "Davvero? Ma «sapeva già»: sapeva che cosa? Metti un pronome per questa cosa."
    prompt: {text: "sapeva già", tags: [object-pronoun]}
  - learner: "Ma lo sapeva già! Per questo sabato siamo andate al mare insieme, a parlare."
  - tutor: "Esatto! Siete state al mare insieme: brava amica. E adesso come sta Giulia?"
    goals: [where, what, with-who]
  # merlin-1365_0100098-3
  - learner: "Non ha cambiato tanto solo qualcosa"
    errors: [auxiliary-choice]
  - tutor: "Meno male! Ma «non ha cambiato»: qui la cosa cambia da sola. Con «avere» o con «essere»?"
    prompt: {text: "Non ha cambiato", tags: [auxiliary-choice]}
  - learner: "Sì, non ha cambiato tanto, lei è forte. E il tuo fine settimana com'è andato?"
    errors: [auxiliary-choice]
  - tutor: "Non è cambiato tanto, bene: Giulia è forte! Il mio invece è stato tranquillo, a casa con il gatto."
    goals: [opinion]
    recast: {text: "non ha cambiato", fix: "non è cambiato", tags: [auxiliary-choice]}
  - learner: "Anche il gatto è una bella compagnia! Sabato prossimo usciamo con Giulia?"
  - tutor: "Sì, certo! Andiamo tutte e tre a mangiare una pizza."

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [word-order]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi alzo alle sette, lavoro in un negozio fino alle tre e la sera studio."
  - tutor: "Che giornata piena! La mia invece è vuota: cerco lavoro da due mesi."
    goals: [wake, work, evening]
  # merlin-1385_0000044-1
  - learner: "Vorrei aiutarti, ma ho bisogno di piu informazioni."
  - tutor: "Grazie, sei gentile! Chiedi pure."
  # merlin-1385_0001712-2
  - learner: "Che lavoro tu fai adesso?"
    errors: [word-order]
  - tutor: "Adesso niente! Ma «che lavoro tu fai»: in questa domanda, «tu» serve? E dove va?"
    prompt: {text: "Che lavoro tu fai", tags: [word-order]}
  # merlin-1385_0001712-4
  - learner: "Che cosa di preciso tu vuoi fare?"
    errors: [word-order]
  - tutor: "«Che cosa vuoi fare di preciso?» Bella domanda: vorrei lavorare in un albergo."
    goals: [ask]
    recast: {text: "Che cosa di preciso tu vuoi fare", fix: "Che cosa vuoi fare di preciso", tags: [word-order]}
  # merlin-1365_0100228-9
  - learner: "Uno di miei amici ha un albergo e cerca una persona la quale mette le stanze in ordine."
    errors: [articulated-preposition, subjunctive-use]
  - tutor: "Davvero? Ma «uno di miei amici»: tra «di» e «miei», cosa succede?"
    prompt: {text: "Uno di miei amici", tags: [articulated-preposition]}
  - learner: "Uno dei miei amici, Paolo. Ti do il suo numero!"
  - tutor: "Esatto! Grazie mille, lo chiamo domani mattina."

- scenario: casa-mia
  level: A2
  persona: es-m-worker
  history: [modal-infinitive]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "È un appartamento con due camere e un balcone grande. Il balcone è la mia parte preferita."
  - tutor: "Bello! La mia casa è piccola, e adesso cerco anche un lavoro nuovo."
    goals: [type, rooms, favourite]
  # merlin-1385_0001160-0
  - learner: "Ho letto la tua email, e voglio ti do un'aiuto, ma all'inizio devo sapere che cosa vuoi fare."
    errors: [modal-infinitive, pronoun-position]
  - tutor: "Grazie! Ma «voglio ti do»: dopo «voglio», quale forma del verbo usiamo?"
    prompt: {text: "voglio ti do", tags: [modal-infinitive]}
  - learner: "Voglio darti un aiuto! Allora, che cosa vuoi fare?"
  - tutor: "Perfetto! Vorrei lavorare in montagna, in un albergo."
  # merlin-1385_0000035-13
  - learner: "In inverno invece è più facile a trovare un lavoro in montagna."
    errors: [preposition]
  - tutor: "Vero! Ma «è più facile a trovare»: dopo «è facile», serve «a»?"
    prompt: {text: "è più facile a trovare", tags: [preposition]}
  - learner: "Sì, è più facile a trovare lavoro a dicembre."
    errors: [preposition]
  - tutor: "È più facile trovare lavoro a dicembre? Allora aspetto l'inverno!"
    recast: {text: "è più facile a trovare", fix: "è più facile trovare", tags: [preposition]}
  # merlin-1385_0000041-2
  - learner: "Che cosa hai fatto al tuo ultimo lavoro?"
    errors: [articulated-preposition]
  - tutor: "Lavoravo in un bar. Ma «al tuo ultimo lavoro»: per dire dove, quale preposizione usiamo con «lavoro»?"
    prompt: {text: "al tuo ultimo lavoro", tags: [articulated-preposition]}
  - learner: "Nel tuo ultimo lavoro, scusa. E la tua casa com'è? È vicino alle montagne?"
  - tutor: "Esatto! No, la mia casa è in città, ma dalla finestra vedo le montagne."
    goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: en-f-student
  history: [article-form]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Di solito vado in bicicletta, ogni domenica mattina. E tu?"
  - tutor: "Io niente! Sono nuova in città e non so cosa fare."
    goals: [hobby, frequency, ask]
  # merlin-1365_0100228-6
  - learner: "Puoi fare il shopping o andare in piscina o andare in cinema."
    errors: [article-form, articulated-preposition]
  - tutor: "Buone idee! Ma «il shopping»: pensa a «lo studente». Quale articolo va qui?"
    prompt: {text: "il shopping", tags: [article-form]}
  - learner: "Sì, il shopping in centro è bello."
    errors: [article-form]
  - tutor: "Lo shopping in centro è bello, sì, ma costa tanto!"
    recast: {text: "il shopping", fix: "Lo shopping", tags: [article-form]}
  # merlin-1365_0100471-19
  - learner: "Ho solamente fatto un proposto, non devi accettare questo proposto, perchè è la mia opinione."
    errors: [word-choice]
  - tutor: "Ma è una proposta bellissima, davvero! Andare a nuotare mi piace molto."
    new: [{lemma: proposta, gloss: proposal}]
    recast: {text: "un proposto", fix: "una proposta", tags: [word-choice]}
  - learner: "Allora domenica andiamo in piscina insieme?"
  - tutor: "Sì, che bello! Alle dieci davanti alla piscina."
    goals: [propose]

- scenario: serata-cinema
  level: A2
  persona: en-m-retired
  history: [article-use]
  turns:
  - tutor: "Giovedì pomeriggio sono libera. Facciamo qualcosa?"
  # merlin-1385_0000100-2
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non posso incontrare."
    errors: [object-pronoun]
  - tutor: "Peccato! Ma «non posso incontrare»: incontrare chi? Metti la persona nel verbo."
    prompt: {text: "non posso incontrare", tags: [object-pronoun]}
  - learner: "Non posso incontrarti giovedì, scusa! Ho una riunione."
  - tutor: "Esatto. Non importa, facciamo un'altra volta!"
  # merlin-1385_0000102-2
  - learner: "Possiamo incontrarci in altro giorno."
    errors: [article-use]
  - tutor: "Certo! Ma «in altro giorno»: prima di «altro», cosa ci vuole?"
    prompt: {text: "in altro giorno", tags: [article-use]}
  - learner: "Sì, in altro giorno, per esempio sabato, al cinema. Mi piacciono i film di guerra."
    errors: [article-use]
  - tutor: "In un altro giorno, sì: sabato va benissimo! Alle nove c'è un film sulla guerra in Africa. Ci vediamo alle otto e mezza?"
    goals: [propose, genre, choose]
    recast: {text: "in altro giorno", fix: "in un altro giorno", tags: [article-use]}
  - learner: "Sì, alle otto e mezza. E scusa ancora per giovedì!"
  - tutor: "Non c'è problema! Allora a sabato, davanti al cinema."
    goals: [meet]

- scenario: famiglia
  level: A2
  persona: es-f-teacher
  history: [possessive]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono io con mio marito e i nostri figli: Luca ha sette anni e Anna quattro. Anna è molto timida."
  - tutor: "Che bella famiglia! Anna sembra proprio dolce. È passato tanto tempo, eh?"
    goals: [who, ages, describe]
  # merlin-1395_0000631-2
  - learner: "E gia da molto tempo che non ti ho visto piu."
    errors: [tense-aspect, spelling]
  - tutor: "Sì, troppo! Ma «non ti ho visto»: con «è da molto tempo», quale tempo usiamo?"
    prompt: {text: "non ti ho visto", tags: [tense-aspect]}
  - learner: "È già da molto tempo che non ti vedo più!"
  - tutor: "Esatto, troppo tempo! Mi fa piacere vederti adesso."
  # merlin-1395_0001117-1
  - learner: "E come sta tua famiglia?"
    errors: [possessive]
  - tutor: "Gentile! Ma «tua famiglia»: prima di «tua», cosa mettiamo?"
    prompt: {text: "tua famiglia", tags: [possessive]}
  # merlin-1395_0000516-1
  - learner: "E tua famiglia"
    errors: [possessive]
  - tutor: "«E la tua famiglia?» Stanno tutti bene, grazie! Mia madre chiede sempre di te."
    goals: [ask]
    recast: {text: "tua famiglia", fix: "la tua famiglia", tags: [possessive]}
  # merlin-1395_0000380-7
  - learner: "Scrivimi una e - mail si tu hai voglia e tempo per vederci."
    errors: [word-choice]
  - tutor: "«Se tu hai voglia e tempo»: certo che ho voglia di vedervi! Venite a trovarmi?"
    recast: {text: "si tu hai voglia", fix: "se tu hai voglia", tags: [word-choice]}
  # merlin-1395_0000554-8
  - learner: "Se hai tempo e un spazio per noi per due notte, telefona mi sta sera!"
    errors: [noun-number, article-form]
  - tutor: "Certo, che bello! Ma «due notte»: con «due», come diventa «notte»?"

    prompt: {text: "due notte", tags: [noun-number]}
  - learner: "Due notti! Hai uno spazio per noi?"
  - tutor: "Esatto! Per voi c'è sempre spazio. Ti telefono stasera."

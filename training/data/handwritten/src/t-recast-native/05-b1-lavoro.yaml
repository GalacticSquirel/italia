- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [word-choice]
  turns:
  - tutor: "Ciao! Ti interessa fare volontariato con noi?"
  # merlin-1325_9000152-0
  - learner: "Ho la possibilità di viaggiare ed io vorrei dare la mano a questo proggetto."
    errors: [word-choice]
  - tutor: "Che bello che vuoi dare una mano a questo progetto! Perché ti interessa?"
    recast: {text: "dare la mano", fix: "dare una mano", tags: [word-choice]}
  # merlin-1365_0100267-4
  - learner: "La natura e la protezione dell'ambiente erano sempre importanti per me, e il WWF sembra molto professionale e entusiasta per me."
    errors: [article-use]
  - tutor: "Anche per noi la natura è importantissima. Ma «il WWF»: con il nome di un'associazione, mettiamo l'articolo?"
    prompt: {text: "il WWF", tags: [article-use]}
  - learner: "Mmm... no, WWF sembra molto professionale. Anche voi lavorate per l'ambiente?"
  - tutor: "Esatto. Sì, noi puliamo le spiagge e i parchi."
    goals: [motivation]
  # merlin-1325_1001023-3
  - learner: "Cosa é necessario esattamente per lavorare?"
  - tutor: "Serve un po' di tempo e tanta voglia. Tu che cosa sai fare?"
  # merlin-1325_9000296-2
  - learner: "La mia conoscenza vi aiuterà per questo programma."
    errors: [preposition]
  - tutor: "Quale conoscenza? Ma prima: «vi aiuterà per questo programma», con «aiutare», quale preposizione ci vuole qui?"
    prompt: {text: "aiuterà per questo programma", tags: [preposition]}
  - learner: "Sì, vi aiuterà per questo programma: sono biologa."
    errors: [preposition]
  - tutor: "«Vi aiuterà in questo programma»: certo, una biologa ci serve proprio! Quanto tempo hai?"
    goals: [skills]
    recast: {text: "vi aiuterà per questo programma", fix: "vi aiuterà in questo programma", tags: [preposition]}
  # merlin-1325_9000137-6
  - learner: "Vorrei volentieri partecipare al primo campo, ma sfortunamente non sono libera."
  - tutor: "Peccato, il primo campo è a giugno. Il secondo, a settembre, ti andrebbe bene?"
    goals: [time]
  - learner: "Sì, a settembre sono libera due settimane. Mi piace l'idea di pulire le spiagge."
  - tutor: "Perfetto, ti scrivo per il campo in Sardegna a settembre!"
    goals: [choose]


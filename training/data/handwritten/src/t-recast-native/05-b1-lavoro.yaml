# Set t-recast-native, file 5: B1, job interviews, work talk and volunteering (real learner
# sentences corrected by a native speaker; recasts use the native fix of the learner's span).

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [noun-number]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  # merlin-1325_1001011-1
  - learner: "Sono molto socievole, e ho giá lavorato in Italia per tre mesi."
  - tutor: "Tre mesi in Italia, interessante! Dove ha lavorato?"
    goals: [intro]
  # merlin-1325_1001011-5
  - learner: "Come ho scritto prima, ho già qualche esperienze lavorative: ho lavorato in Italia con il programma Leonardo da Vinci."
    errors: [noun-number, adjective-agreement]
  - tutor: "Il programma Leonardo, bene! Ma «qualche esperienze»: dopo «qualche», il nome va al singolare o al plurale?"
    prompt: {text: "qualche esperienze lavorative", tags: [noun-number]}
  - learner: "Sì, ho qualche esperienze lavorative, anche in un'agenzia di Milano."
    errors: [noun-number, adjective-agreement]
  - tutor: "Qualche esperienza lavorativa in un'agenzia di Milano è già un ottimo inizio, sì. Di che cosa si occupava, lì?"
    goals: [experience]
    new: [{lemma: lavorativo, gloss: work-related}]
    recast: {text: "qualche esperienze lavorative", fix: "qualche esperienza lavorativa", tags: [noun-number]}
  # merlin-1325_1001093-7
  - learner: "Quindi l'esperienza a tenere i contatti con i clienti è ottimale."
    errors: [preposition]
  - tutor: "Il rapporto con i clienti per noi è molto importante. Ma «l'esperienza a tenere»: dopo «esperienza», quale preposizione usiamo?"
    prompt: {text: "l'esperienza a tenere", tags: [preposition]}
  - learner: "L'esperienza di tenere i contatti, scusi. Il mio punto forte è la pazienza, quello debole... parlo troppo! Mi piace il vostro stile: quando inizia il lavoro?"
  - tutor: "Esatto, ed è una risposta sincera! Il ruolo parte a settembre, con un mese di corso interno. Le faremo sapere entro venerdì."
    goals: [strengths, why, questions]

- scenario: colloquio-lavoro

# Set t-recast-native, file 8: A2 and B1, a friend's wedding, moving a date, the language school,
# free time, a trip and an interview (real learner sentences corrected by a native speaker).

- scenario: casa-mia
  level: A2
  persona: en-f-student
  history: [piacere]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "È piccola: una camera, una cucina e un bagno. La cucina è la mia stanza preferita."
  - tutor: "Carina! Ho una notizia: io e Giulia andiamo a vivere insieme. A giugno ci sposiamo!"
    goals: [type, rooms, favourite]
  # merlin-1365_0100067-3
  - learner: "Vengo volentieri per guardala questa stupenda cerimonia."
    errors: [preposition, spelling]
  - tutor: "Che bello, ti aspettiamo! Ma «per guardala»: dopo «vengo», quale preposizione usiamo?"
    prompt: {text: "per guardala", tags: [preposition]}
  # merlin-1365_0100199-2
  - learner: "Cosi è possibile di participare alla vostra festa."
    errors: [preposition, spelling]
  - tutor: "«Mi è possibile partecipare alla vostra festa»: che bello! La casa nuova è grande, ma ancora un po' vuota."
    new: [{lemma: partecipare, gloss: to take part}]
    recast: {text: "è possibile di participare", fix: "mi è possibile partecipare", tags: [preposition]}
  # merlin-1365_0100181-6
  - learner: "Forse mancate qualche cosa per la cucina oppure per i bambini?"
    errors: [piacere]
  - tutor: "Sì, un po'! Ma «mancate»: questo verbo funziona come «piacere». Come lo dici?"
    goals: [ask]
    prompt: {text: "mancate qualche cosa", tags: [piacere]}
  - learner: "Sì, forse mancate qualche cosa per la cucina? Piatti, bicchieri..."
    errors: [piacere]
  - tutor: "«Forse vi manca qualche cosa per la cucina?» Sì, ci mancano proprio i bicchieri!"
    recast: {text: "mancate qualche cosa", fix: "vi manca qualche cosa", tags: [piacere]}
  # merlin-1365_0100203-5
  - learner: "Altro non so che regalo vi piacerebbe."
    errors: [word-choice]
  - tutor: "«Inoltre non so che regalo vi piacerebbe»? Tranquilla, una cosa per la cucina va benissimo!"
    new: [{lemma: inoltre, gloss: moreover}]
    recast: {text: "Altro", fix: "Inoltre", tags: [word-choice]}
  - learner: "Allora vi regalo sei bicchieri belli, di vetro colorato."
  - tutor: "Che bel regalo, grazie! Saremo contentissimi."

- scenario: serata-cinema
  level: A2
  persona: en-f-professional
  history: [reflexive]
  turns:
  - tutor: "Giovedì pomeriggio sono libera. Facciamo qualcosa?"
  # merlin-1385_0001724-2
  - learner: "Siccome il mio capo ha organizzato una riunione, non ho tempo per incontrare con te."
    errors: [reflexive]
  - tutor: "Che peccato! Ma «incontrare con te»: qui il verbo vuole un pronome. Quale?"
    prompt: {text: "incontrare con te", tags: [reflexive]}
  # merlin-1385_0001134-2
  - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso incontrarvi con te."
    errors: [reflexive]
  - tutor: "«Non posso incontrarmi con te»: va bene, ho capito. Facciamo un altro giorno?"
    recast: {text: "incontrarvi", fix: "incontrarmi", tags: [reflexive]}
  # merlin-1385_0001751-2
  - learner: "Hai voglia di incontrare a sabato sera?"
    errors: [reflexive, preposition]
  - tutor: "Sì! Ma «di incontrare»: siamo noi due insieme. Come finisce il verbo?"
    prompt: {text: "di incontrare", tags: [reflexive]}
  - learner: "Hai voglia di incontrarci sabato sera? Andiamo al cinema!"
  - tutor: "Esatto! Sabato sera al cinema, che bello. C'è una commedia italiana alle nove: dove ci vediamo?"
    goals: [propose, genre, choose]
  # merlin-1385_0001752-5
  - learner: "Scrivi mi la risposte. Per favore."
    errors: [noun-number]
  - tutor: "Certo, ti scrivo! Ma «la risposte»: è una sola o sono tante?"
    prompt: {text: "la risposte", tags: [noun-number]}
  - learner: "La risposta, scusa! Allora ci vediamo davanti al cinema alle nove meno un quarto?"
  - tutor: "Perfetto, davanti al cinema alle nove meno un quarto. A sabato!"
    goals: [meet]

- scenario: giorno-tipico
  level: A2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi sveglio alle sette e alle nove vado al corso d'italiano."
  - tutor: "Presto! E com'è il corso?"
    goals: [wake]
  # merlin-1395_0000604-0
  - learner: "La mia insegnante è la signora Rossi, e siamo dieci in la clase."
    errors: [articulated-preposition]
  - tutor: "Siete pochi, bene! Ma «in la clase»: per dire dove siete, «in la» va bene?"
    prompt: {text: "in la clase", tags: [articulated-preposition]}
  # merlin-1395_0000403-1
  - learner: "Impariamo tanto e mi sento molto bene nella classe con gli altri."
    errors: [articulated-preposition]
  - tutor: "Ti senti bene in classe con gli altri: che bello! E i compagni sono gentili?"
    goals: [work]
    recast: {text: "nella classe", fix: "in classe", tags: [articulated-preposition]}
  # merlin-1395_0001045-1
  - learner: "Loro mi auitano sempre, quando io non capisco niente."
  - tutor: "Che bravi compagni! E la sera, dopo il corso?"
  - learner: "La sera cucino e studio un po'. E tu, com'è la tua giornata?"
  - tutor: "Io lavoro in farmacia fino alle sette. Poi torno a casa e guardo un film."
    goals: [evening, ask]

- scenario: tempo-libero
  level: A2
  persona: en-m-heritage
  history: [preposition]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  - learner: "Gioco a calcio con gli amici, ogni sabato mattina. E tu?"
  - tutor: "Bravo! Io cammino in montagna, e a Natale faccio un corso di cucina. Ti interessa?"
    goals: [hobby, frequency, ask]
  # merlin-1365_0100104-3
  - learner: "Il corso mentre i giorni festivi, dal 26 dicembre al 6 gennaio, mi interessa molto."
    errors: [word-choice]
  - tutor: "Il corso durante i giorni festivi? Allora vieni con me! E in ufficio come va, con il nuovo capo?"
    recast: {text: "mentre i giorni festivi", fix: "durante i giorni festivi", tags: [word-choice]}
  # merlin-1395_0001066-4
  - learner: "Al officio va bene anche, ho un nuovo capo, ed è molto piacevole di lavore con lui."
    errors: [preposition, articulated-preposition, spelling]
  - tutor: "Che fortuna! Ma «è piacevole di lavore»: dopo «è piacevole», serve «di»?"
    prompt: {text: "piacevole di lavore", tags: [preposition]}
  - learner: "Sì, è piacevole di lavorare con lui, è molto simpatico."
    errors: [preposition]
  - tutor: "È piacevole lavorare con lui: che bello! Allora, al corso andiamo insieme?"
    recast: {text: "piacevole di lavorare", fix: "piacevole lavorare", tags: [preposition]}
  # merlin-1395_0000399-8
  - learner: "Quando a incontriamo?"
    errors: [reflexive]
  - tutor: "Ma «a incontriamo»: siamo noi due insieme. Quale pronome va prima del verbo?"
    prompt: {text: "a incontriamo", tags: [reflexive]}
  - learner: "Quando ci incontriamo per l'iscrizione?"
  - tutor: "Esatto! Domani alle sei, davanti all'ufficio."
    goals: [propose]

- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  history: [word-order]
  turns:
  - tutor: "Stasera sono libera. Facciamo qualcosa?"
  - learner: "Sì! Andiamo al cinema? C'è un dramma spagnolo nuovo alle nove e mezza. E prima mangiamo qualcosa?"
  - tutor: "Va bene, mi piacciono anche i film seri! E il ristorante qui vicino è buono."
    goals: [propose, genre, choose]

  # merlin-1385_0001730-6
  - learner: "Vogliamo qui andare a cena stasera?"
    errors: [word-order]
  - tutor: "Sì, dai! Ma «vogliamo qui andare»: dove mettiamo «qui»?"
    prompt: {text: "qui andare", tags: [word-order]}
  - learner: "Sì, vogliamo qui andare alle otto?"
    errors: [word-order]
  - tutor: "«Vogliamo andare qui alle otto?» Sì, perfetto! Mia sorella dice che è la pizza più buona della città."
    recast: {text: "qui andare", fix: "andare qui", tags: [word-order]}
  # merlin-1395_0001076-9
  - learner: "Anche la seconda te?"
    errors: [word-choice]
  - tutor: "«Anche secondo te?» Sì, anche secondo me è buonissima!"
    recast: {text: "la seconda te", fix: "secondo te", tags: [word-choice]}
  - learner: "Allora ci vediamo alle otto davanti alla pizzeria."
  - tutor: "Alle otto, a dopo!"
    goals: [meet]

- scenario: giorno-tipico
  level: A2
  persona: en-f-student
  history: [adjective-agreement]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi alzo alle otto e alle nove comincia la lezione."
  - tutor: "E com'è la tua classe?"
    goals: [wake]
  # merlin-1395_0000612-1
  - learner: "Stiamo diece studiente: otto donne e due signore."
    errors: [noun-number, word-choice, spelling]
  - tutor: "Pochi, bene! Ma «diece studiente»: sono tante persone, quindi «studiente»...?"
    prompt: {text: "diece studiente", tags: [noun-number]}
  - learner: "Siamo dieci studenti: otto donne e due signore anziane."
  - tutor: "Esatto! E i compagni come sono?"
    goals: [work]
  # merlin-1395_0000649-3
  - learner: "La gente nella classe à molto diverso."
    errors: [adjective-agreement, spelling]
  - tutor: "Interessante! Ma «la gente è molto diverso»: «gente» è femminile. E l'aggettivo?"
    prompt: {text: "molto diverso", tags: [adjective-agreement]}
  - learner: "Sì, la gente è molto diverso: giovani, vecchi, tedeschi, cinesi."
    errors: [adjective-agreement]
  - tutor: "La gente è molto diversa, che bello! Così impari tante cose."
    recast: {text: "molto diverso", fix: "molto diversa", tags: [adjective-agreement]}
  # merlin-1395_0000596-2
  - learner: "Nostra insegnante à da Firenze."
    errors: [preposition, possessive]
  - tutor: "Ah, Firenze! Ma «è da Firenze»: per dire di dove è una persona, quale preposizione usiamo?"
    prompt: {text: "da Firenze", tags: [preposition]}
  - learner: "È di Firenze! La sera usciamo tutti insieme. E tu cosa fai la sera?"
  - tutor: "Esatto. Io la sera vado a nuotare con mia sorella."
    goals: [evening, ask]

- scenario: famiglia
  level: A2
  persona: en-m-retired
  history: [possessive]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono mia moglie e mia figlia, l'estate scorsa a Venezia. Mia figlia ha vent'anni."
  - tutor: "Che belle! E come state tutti?"
    goals: [who, ages]
  # merlin-1395_0000369-1
  - learner: "Io sto molto bene, come anche mia famiglia."
    errors: [possessive]
  - tutor: "Meno male! Ma «mia famiglia»: con «famiglia», cosa mettiamo prima di «mia»?"
    prompt: {text: "mia famiglia", tags: [possessive]}
  - learner: "Sì, anche mia famiglia sta bene, grazie."
    errors: [possessive]
  - tutor: "«Anche la mia famiglia sta bene»: che bello! Tua figlia studia?"
    recast: {text: "mia famiglia", fix: "la mia famiglia", tags: [possessive]}
  - learner: "Sì, studia musica. Suona il violino benissimo ed è molto timida. E tuo figlio?"
  - tutor: "Che brava! Anche mio figlio ama la musica: ha sedici anni e vive con noi a Roma. Vieni a trovarci?"
    goals: [describe, ask]
  # merlin-1395_0000392-5
  - learner: "Spero incontrarti presto."
    errors: [preposition]
  - tutor: "Anch'io! Ma «spero incontrarti»: tra «spero» e il verbo, cosa ci va?"
    prompt: {text: "Spero incontrarti", tags: [preposition]}
  - learner: "Spero di incontrarti presto, a Roma!"
  - tutor: "Esatto! Allora ti aspetto a Roma in primavera."

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Allora, quando parti per Napoli?"
  - learner: "Parto lunedì mattina in aereo e resto cinque giorni."
  - tutor: "Perfetto! E stasera cosa fai, prepari la valigia?"
    goals: [plans]
  # merlin-1395_0000443-5
  - learner: "Stasera andrò mangiare uno bello gelato al ristaurante."
    errors: [preposition, article-form, spelling]
  - tutor: "Prima il gelato, giusto! Ma «andrò mangiare»: tra i due verbi, cosa ci va?"
    prompt: {text: "andrò mangiare", tags: [preposition]}
  - learner: "Sì, andrò mangiare un gelato con mia sorella."
    errors: [preposition]
  - tutor: "«Andrò a mangiare un gelato con mia sorella»: bravo! A Napoli però ne mangerai di ancora più buoni."
    recast: {text: "andrò mangiare", fix: "andrò a mangiare", tags: [preposition]}
  - learner: "Cosa devo vedere assolutamente? Come mi muovo in città? E c'è qualcosa da evitare?"
  - tutor: "Il centro, il mare e i musei, a piedi o con la metro. Attento al telefono in mezzo alla gente! Mandami il tuo numero nuovo."
    goals: [advice, transport, warnings]

  # merlin-1395_0000391-9
  - learner: "Questo è il mio nuovo numero di telefono: 347 1234567, chiama mi."
  - tutor: "Salvato! Ti chiamo domenica sera per gli ultimi consigli."

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono Tom, sono grafico e lavoro da sei anni per alcune riviste inglesi."
  - tutor: "Bene. E adesso abita qui vicino?"
    goals: [intro, experience]
  # merlin-1325_1001153-10
  - learner: "Abito in Modena così non è problema di viaggiare all'ufficio."
    errors: [preposition, article-use]
  - tutor: "Modena non è lontana. Ma «in Modena»: con una città, quale preposizione usiamo?"
    prompt: {text: "in Modena", tags: [preposition]}
  - learner: "Sì, abito in Modena da due anni, con la mia compagna."
    errors: [preposition]
  - tutor: "«Abito a Modena da due anni»: allora venire qui in treno è facile. Ha portato qualche lavoro da farci vedere?"
    recast: {text: "in Modena", fix: "a Modena", tags: [preposition]}
  # merlin-1325_9000211-5
  - learner: "Vi invito alcuni dei miei lavori."
    errors: [word-choice]
  - tutor: "«Vi invio alcuni dei miei lavori»: perfetto, li guardiamo con piacere. Quali sono i suoi punti di forza?"
    recast: {text: "Vi invito", fix: "Vi invio", tags: [word-choice]}
  - learner: "Sono veloce e preciso; il mio difetto è che parlo poco. Mi piace il vostro stile pulito. Quando saprò la risposta?"
  - tutor: "Entro venerdì, le scriviamo noi. Grazie e buona giornata!"
    goals: [strengths, why, questions]

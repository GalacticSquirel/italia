- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [possessive]
  turns:
  - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
  - learner: "In Spagna festeggiamo soprattutto la Vigilia e il sei gennaio, con i Re Magi."
  - tutor: "Che bello! E quest'anno io e Luca festeggiamo anche un'altra cosa: ci sposiamo a maggio, a Napoli!"
    goals: [compare]
  # merlin-1365_0100096-3
  - learner: "Penso, che in questi momenti dovete essere tanto felice."
    errors: [adjective-agreement]
  - tutor: "Sì, tantissimo! Ma «dovete essere tanto felice»: parli di noi due. E l'aggettivo?"
    prompt: {text: "tanto felice", tags: [adjective-agreement]}
  - learner: "Tanto felici, certo! Che bella notizia."
  - tutor: "Esatto! Sei invitato, naturalmente."
  # merlin-1365_0100095-1
  - learner: "Volentieri verrò a Napoli per festeggiare con voi e vostri parenti ed amici."
    errors: [possessive]
  - tutor: "Che bello! Ma «e vostri parenti»: davanti a «vostri», cosa ci vuole?"
    prompt: {text: "e vostri parenti", tags: [possessive]}
  # merlin-1365_0100204-2
  - learner: "Arriveró con la mia moglie."
    errors: [possessive]
  - tutor: "«Arriverò con mia moglie»: certo, siete invitati tutti e due! Ma torniamo a Natale: da bambino come lo festeggiavi?"
    recast: {text: "con la mia moglie", fix: "con mia moglie", tags: [possessive]}
  - learner: "A casa dei nonni, con trenta parenti e tanto rumore! E qui, cosa si mangia il 25? Cosa posso portare?"
  - tutor: "Si mangiano la pasta al forno, il pesce e tanti dolci. Porta un dolce spagnolo, così lo proviamo tutti!"
    goals: [past, ask, plan]


    goals: [cons, preference]


- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  # merlin-1325_9000322-3
  - learner: "Lavoro come impiegata commerciale presso una dittà che produce vetro speciale."
  - tutor: "Interessante. E con le lingue come va? Qui ne servono molte."
    goals: [intro, experience]
  # merlin-1325_1001035-7
  - learner: "Penso che l'italiano sia molto utile, ma bisogna che io parla anche bene il francese per motivi professionali."
    errors: [subjunctive-use, word-order]
  - tutor: "Il francese ci serve, sì. Ma «bisogna che io parla»: dopo «bisogna che», quale modo usiamo?"
    prompt: {text: "io parla", tags: [subjunctive-use]}
  - learner: "Bisogna che io parli bene il francese, sì. Lo sto studiando la sera."
  - tutor: "Esatto. E il tedesco? Molti nostri clienti sono di Monaco."
  # merlin-1325_1001035-6
  - learner: "Se vorrei fare una carriera nel campo del commercio dell'estero presso questa ditta, devo cominciare a studiare anche una altra lingua."
    errors: [hypothetical]
  - tutor: "Sarebbe utile, sì. Ma «se vorrei»: dopo «se», il condizionale va bene?"
    prompt: {text: "Se vorrei", tags: [hypothetical]}
  - learner: "Se volessi fare carriera qui, dovrei studiare anche il tedesco. E lo farei volentieri."
  - tutor: "Perfetto! Come ha saputo di questo posto, e perché le interessa?"
  # merlin-1325_1001144-0
  - learner: "Ho trovato questo avviso nella bacheca della mia scuola di lingua e ho sentito che devo scrivere."
    errors: [tense-aspect]
  - tutor: "Bella storia! Ma «ho sentito che devo»: il primo verbo è al passato. E il secondo?"
    prompt: {text: "che devo scrivere", tags: [tense-aspect]}
  - learner: "Sì, ho sentito che devo scrivere subito, era il lavoro perfetto."
    errors: [tense-aspect]
  - tutor: "«Ho sentito che dovevo scrivere» subito: mi fa piacere! Quali sono i suoi punti di forza?"
    goals: [why]
    recast: {text: "che devo scrivere", fix: "che dovevo scrivere", tags: [tense-aspect]}
  - learner: "Sono precisa e paziente, ma a volte parlo troppo veloce. Posso chiederle quanti giorni si lavora in ufficio?"
  - tutor: "Quattro in ufficio e uno da casa. La ringrazio, le faremo sapere presto."
    goals: [strengths, questions]


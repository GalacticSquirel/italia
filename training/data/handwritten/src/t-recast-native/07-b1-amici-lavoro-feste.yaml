# Set t-recast-native, file 7: B1, helping friends who look for work, interviews about languages,
# weddings and parties, a doctor's visit (real learner sentences corrected by a native speaker).

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, tre giorni su cinque. E tu? Hai trovato lavoro dopo la scuola?"
  - tutor: "Non ancora, sto cercando. Senza esperienza è difficile."
    goals: [situation]
  # merlin-1365_0100474-6
  - learner: "Naturalmente ti auito di trovare un lavoro."
    errors: [preposition, spelling]
  - tutor: "Grazie, sei un tesoro! Ma dopo questo verbo, «di trovare» va bene? Quale preposizione usiamo?"
    prompt: {text: "auito di trovare", tags: [preposition]}
  # merlin-1365_0100221-5
  - learner: "Potrei domandere per un lavoro e dirli di conoscerti molto bene."
    errors: [preposition, object-pronoun, spelling]
  - tutor: "«Potrei domandare un lavoro» al tuo capo? Sarebbe fantastico, grazie!"
    recast: {text: "domandere per un lavoro", fix: "domandare un lavoro", tags: [preposition]}
  # merlin-1365_0100225-6
  - learner: "Se io sento qualcosa ti lo dico subito."
    errors: [combined-pronouns]
  - tutor: "Sei proprio un'amica. Ma «ti lo dico»: quando due pronomi stanno insieme, «ti» cambia. Come?"
    prompt: {text: "ti lo dico", tags: [combined-pronouns]}
  - learner: "Te lo dico subito! Lavorare da casa è comodo, ma a volte mi sento sola. Preferirei due giorni in ufficio."
  - tutor: "Esatto. Ti capisco: speriamo che presto anch'io abbia dei colleghi da vedere!"
    goals: [pros, cons, preference]

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "In ufficio, due giorni alla settimana, perché studio ancora. E tu? Com'è andata la scuola?"
  - tutor: "Benissimo, finalmente ho preso il voto finale: novanta!"
    goals: [situation]
  # merlin-1365_0100229-15
  - learner: "Anch'io sono molto, molto felice che l'hai preso finalmente."
  - tutor: "Grazie! Però l'ultimo esame, quello a voce, è stato terribile."
  # merlin-1365_0100481-14
  - learner: "Penso che l'esame orale è il più difficile esame del maturità."
    errors: [articulated-preposition, subjunctive-use]
  - tutor: "Lo penso anch'io! Ma «del maturità»: «maturità» è femminile. Come cambia «del»?"
    prompt: {text: "del maturità", tags: [articulated-preposition]}
  - learner: "Della maturità, sì. Io la faccio l'anno prossimo."
  - tutor: "Esatto! Vedrai, andrà benissimo."
  # merlin-1365_0100481-13
  - learner: "Spero che io possa fare la mia maturità come tu."
    errors: [object-pronoun]
  - tutor: "Ma certo! Però «come tu»: dopo «come», quale pronome usiamo?"
    prompt: {text: "come tu", tags: [object-pronoun]}
  - learner: "Come te! E adesso, lavoro o università?"
  - tutor: "Esatto. Non lo so ancora, sono un po' confuso."
  # merlin-1365_0100481-6
  - learner: "Lavorare è una bella idea perchè riceveresti molti soldi ma studiare all'Università è una possibilità per incontrare nuovi amici con chi puoi avere molta gioia."
    errors: [relative-pronoun]
  - tutor: "È vero. Ma «nuovi amici con chi»: dopo una preposizione, «chi» va bene qui?"
    prompt: {text: "amici con chi", tags: [relative-pronoun]}
  - learner: "Sì, all'università trovi amici con chi studiare e uscire. In ufficio è più noioso, ma pagano bene."
    errors: [relative-pronoun]
  - tutor: "Amici con cui studiare e uscire, giusto! E tu, se potessi scegliere, preferiresti l'ufficio o lavorare da casa?"
    goals: [pros, cons]
    recast: {text: "amici con chi", fix: "amici con cui", tags: [relative-pronoun]}
  - learner: "Da casa, sicuramente: dormirei mezz'ora di più!"
  - tutor: "Ah, il sonno prima di tutto! Ti capisco."
    goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-student

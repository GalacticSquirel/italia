- scenario: compleanno
  level: B1
  persona: en-m-retired
  history: [article-use]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Una festa a sorpresa sabato nel mio giardino, con Luca e i colleghi dell'ufficio."
  - tutor: "Perfetto! E il regalo? Hai qualche idea?"
    goals: [date, guests]
  # merlin-1365_0100138-2
  - learner: "Non ho una minima idea."
    errors: [article-use]
  - tutor: "Neanch'io! Ma «una minima idea»: in questo modo di dire, quale articolo usiamo?"
    prompt: {text: "una minima idea", tags: [article-use]}
  - learner: "No, davvero, non ho una minima idea. Sara ha già tutto."
    errors: [article-use]
  - tutor: "Non hai la minima idea, e io nemmeno: chiediamo a Luca e alla sorella di Sara, così decidiamo insieme."
    recast: {text: "una minima idea", fix: "la minima idea", tags: [article-use]}
  # merlin-1365_0100136-9
  - learner: "Fammelo sapere, che desideri hanno le due fidanzati?"
    errors: [noun-gender]
  - tutor: "Ah, vuoi un'idea per tutti e due! Ma «le due fidanzati»: sono un ragazzo e una ragazza. Quale articolo usiamo?"
    prompt: {text: "le due fidanzati", tags: [noun-gender]}
  - learner: "I due fidanzati, giusto. Io preparo anche le lasagne per la festa."
  - tutor: "Esatto. Le tue lasagne sono famose! Io porto la torta."
    goals: [food]
  # merlin-1365_0100204-4
  - learner: "Sarei molto contento se uno mi scrivesse un e - mail con una proposta prima l'appuntamento della festa."

  - tutor: "Ci penso io! Ma «prima l'appuntamento»: dopo «prima», cosa ci va davanti a un nome?"
    prompt: {text: "prima l'appuntamento", tags: [preposition]}
  - learner: "Prima dell'appuntamento della festa. Così compriamo il regalo venerdì."
  - tutor: "Perfetto, venerdì andiamo insieme a comprarlo!"
    goals: [gift]

- scenario: medico-base
  level: B1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
  - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
  - learner: "Ho mal di pancia da tre giorni e un po' di nausea."
  - tutor: "Capisco. Ha mangiato qualcosa di diverso dal solito? Ha delle allergie?"
    goals: [symptoms, since-when]
  # merlin-1325_1001084-4
  - learner: "Ho una grande problema perchè sono allergica a latte."
    errors: [articulated-preposition, noun-gender]
  - tutor: "Questo è importante. Ma «allergica a latte»: con il nome di un cibo, basta «a»?"
    prompt: {text: "allergica a latte", tags: [articulated-preposition]}
  # merlin-1325_1001164-4
  - learner: "Devo informarvi di mia allergia di zucchero di latte."
    errors: [articulated-preposition, possessive]
  - tutor: "Un'allergia allo zucchero di latte: è un'informazione utile. Allora prenda questa medicina due volte al giorno, dopo mangiato, per cinque giorni."
    goals: [history]
    recast: {text: "di zucchero di latte", fix: "allo zucchero di latte", tags: [articulated-preposition]}
  - learner: "Due volte al giorno dopo mangiato, per cinque giorni. E niente latte, giusto?"
  - tutor: "Esatto, niente latte e niente formaggi freschi. Se fra cinque giorni non sta meglio, torni da me."
    goals: [instructions]

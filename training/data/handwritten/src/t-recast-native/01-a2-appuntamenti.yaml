# Set t-recast-native, file 1: A2, moving a date, free time and weekends (real learner sentences
# corrected by a native speaker; recasts use the native fix of the learner's own span).

- scenario: serata-cinema
  level: A2
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Giovedì pomeriggio sono libera. Facciamo qualcosa?"
  # merlin-1385_0001138-0
  - learner: "È una settimana orribile."
  - tutor: "Oh no, mi dispiace! Cosa succede?"
  # merlin-1385_0001162-1
  - learner: "In ufficio c'è molto lavoro e giovedi pomeriggio non posso venire."
  - tutor: "Che peccato! Allora facciamo un altro giorno. Quando sei libero?"
  # merlin-1385_0001522-5
  - learner: "Hai tempo a sabato sera?"
    errors: [preposition]
  - tutor: "«A sabato sera»? Davanti ai giorni della settimana, usiamo una preposizione?"
    prompt: {text: "a sabato sera", tags: [preposition]}
  - learner: "Ah, senza. Hai tempo sabato sera?"
  - tutor: "Esatto! Sì, sabato sera sono libera. Cosa ti va di fare?"
  # merlin-1395_0001019-8
  - learner: "Ci incontriamo e andiamo al cinema e guardiamo un bel film?"
  - tutor: "Sì, dai! C'è un film nuovo, una commedia. Lo vediamo?"
    goals: [propose]
  # merlin-1395_0001076-8
  - learner: "A me piace di vederlo insieme."
    errors: [preposition]
  - tutor: "Che carino! Ma «piace di vederlo»: dopo «piace», il verbo vuole quella «di»?"
    prompt: {text: "piace di vederlo", tags: [preposition]}
  - learner: "Sì, mi piace di vederlo con te. Le commedie sono il mio genere."
    errors: [preposition]
  - tutor: "Anche a me piace vederlo con te! Allora il film è alle nove: ci vediamo davanti al cinema alle otto e mezza."
    goals: [genre, choose]
    recast: {text: "piace di vederlo", fix: "piace vederlo", tags: [preposition]}
  # merlin-1385_0001768-6
  - learner: "Cari saluti a presto."
  - tutor: "A sabato, ciao!"
    goals: [meet]


- scenario: serata-cinema
  level: A2
  persona: es-f-erasmus
  history: [article-use]
  turns:
  - tutor: "Ciao! Giovedì pomeriggio facciamo qualcosa insieme?"
  # merlin-1385_0001522-2
  - learner: "Giovedi pomeriggio non posso."
  - tutor: "Peccato! Sei in viaggio di lavoro con i colleghi? Quando tornate?"
  # merlin-1395_0000599-2
  - learner: "Torniamo il lundì prossimo."
    errors: [article-use]
  - tutor: "«Il lundì prossimo»? Quando parli di un giorno che viene, l'articolo serve?"
    prompt: {text: "il lundì prossimo", tags: [article-use]}
  - learner: "Sì, torniamo il lunedì prossimo, con il treno delle dieci."
    errors: [article-use]
  - tutor: "Ah, tornate lunedì prossimo! Allora possiamo mangiare insieme martedì sera?"
    recast: {text: "il lunedì prossimo", fix: "lunedì prossimo", tags: [article-use]}
  # merlin-1385_0001746-4
  - learner: "O cinema in venerdi a pomeriggio?"
    errors: [preposition, articulated-preposition]
  - tutor: "Il cinema mi piace! Ma «in venerdi a pomeriggio»: servono «in» e «a»?"
    prompt: {text: "in venerdi a pomeriggio", tags: [preposition]}
  - learner: "No... O al cinema venerdì pomeriggio?"
  - tutor: "Perfetto! Venerdì pomeriggio va benissimo. Facciamo una commedia? Ce n'è una alle cinque."
    goals: [propose, genre]
  - learner: "Va bene, una commedia alle cinque. Ci vediamo davanti al cinema?"
  - tutor: "Sì, alle cinque meno un quarto davanti al cinema. A venerdì!"
    goals: [choose, meet]

- scenario: serata-cinema
  level: A2
  persona: en-f-professional
  history: [reflexive]
  turns:
  - tutor: "Ciao! Allora, giovedì pomeriggio sono libera. Facciamo qualcosa?"
  # merlin-1385_0001748-2
  - learner: "Scrivo per dire che non posso incontrare con te giovedi pomeriggio."
    errors: [reflexive]
  - tutor: "Oh, peccato! Ma «non posso incontrare con te»: qui il verbo vuole un pronome. Come lo dici?"
    prompt: {text: "non posso incontrare con te", tags: [reflexive]}
  - learner: "Ah: non posso incontrarmi con te giovedì. Il mio capo ha organizzato una riunione."
  - tutor: "Giusto! Che peccato. Allora quando sei libera?"
  # merlin-1385_0001120-2
  - learner: "Possiamo incontrare sabato sera se vuoi andiamo a cena in un ristorante tailandese"
    errors: [reflexive]
  - tutor: "Un ristorante tailandese, che bello! Però «possiamo incontrare»: noi due, insieme... come diventa il verbo?"
    prompt: {text: "Possiamo incontrare", tags: [reflexive]}
  - learner: "Sì, possiamo incontrare sabato sera e dopo la cena andiamo al cinema."
    errors: [reflexive]
  - tutor: "Sì, possiamo incontrarci sabato sera! Prima la cena e poi il cinema: perfetto. Che film ti va?"
    goals: [propose]
    recast: {text: "possiamo incontrare", fix: "possiamo incontrarci", tags: [reflexive]}
  - learner: "Una commedia italiana. Ci vediamo alle otto al ristorante e poi andiamo al cinema alle dieci."
  - tutor: "Ottimo, alle dieci c'è proprio una commedia nuova, con attori bravissimi."
    goals: [genre, choose]
  # merlin-1385_0001147-7
  - learner: "Va bene cosí?"
  - tutor: "Benissimo così! Allora alle otto al ristorante. A sabato!"
    goals: [meet]

- scenario: tempo-libero
  level: A2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1395_0000469-3
  - learner: "In tempo libero io sono in giro alla città per visitare diversi musei."
    errors: [articulated-preposition]
  - tutor: "Che bello! Ma «in tempo libero»: con «tempo libero», la preposizione si unisce all'articolo. Come diventa?"
    prompt: {text: "In tempo libero", tags: [articulated-preposition]}
  - learner: "Sì, in tempo libero visito i musei e le chiese antiche."
    errors: [articulated-preposition]
  - tutor: "Allora nel tempo libero vai nei musei! Ci vai da solo?"
    goals: [hobby]
    recast: {text: "in tempo libero", fix: "nel tempo libero", tags: [articulated-preposition]}
  - learner: "No, ogni sabato vado con mia sorella. Lei è qui a Torino da un mese."
  - tutor: "Ah, tua sorella è in Italia! E cosa fa qui?"
    goals: [frequency]
  # merlin-1395_0001141-6
  - learner: "Vuole apprende un po'd'italiano."
    errors: [verb-form]
  - tutor: "Che brava tua sorella! Ma «vuole apprende»: dopo «vuole», quale forma del verbo ci vuole?"
    prompt: {text: "Vuole apprende", tags: [verb-form]}
  - learner: "Vuole apprendere un po' d'italiano. E tu, cosa fai nel weekend?"
  - tutor: "Esatto! Io vado a correre al parco e la sera esco con gli amici."
    goals: [ask]
  - learner: "Sabato prossimo andiamo insieme al museo del cinema?"
  - tutor: "Sì, che bello! Ci vediamo alle dieci davanti al museo."
    goals: [propose]

- scenario: tempo-libero
  level: A2
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Cosa fai di bello nel fine settimana?"
  # merlin-1395_0001070-2
  - learner: "Mia figlia ha cominciato a giocare al tennis e adesso andiamo a giocare insieme ogni lunedì."
    errors: [articulated-preposition]
  - tutor: "Che bello giocare con tua figlia! Ma «giocare al tennis»: con gli sport, serve l'articolo?"
    prompt: {text: "giocare al tennis", tags: [articulated-preposition]}
  - learner: "Sì, giochiamo al tennis il lunedì sera, al club vicino a casa."
    errors: [articulated-preposition]
  - tutor: "«Giochiamo a tennis il lunedì sera»: che bello, ogni settimana! E hai tempo anche per altro?"
    goals: [hobby, frequency]
    recast: {text: "giochiamo al tennis", fix: "giochiamo a tennis", tags: [articulated-preposition]}
  # merlin-1395_0001133-6
  - learner: "Ho molto tempo libero anche."
    errors: [word-order]
  - tutor: "Fortunato! Ma «ho molto tempo libero anche»: «anche» va bene alla fine?"
    prompt: {text: "Ho molto tempo libero anche", tags: [word-order]}
  - learner: "Ah, ho anche molto tempo libero, perché sono in pensione."
  - tutor: "Bravo, è così. Che fortuna! Io invece lavoro anche il sabato."
  - learner: "Davvero? E la domenica cosa fai?"
  - tutor: "La domenica cammino molto con il cane, al parco."
    goals: [ask]
  - learner: "Domenica facciamo una passeggiata insieme? Io porto il pranzo."
  - tutor: "Che bella idea! Ci vediamo alle dieci al parco. Grazie per il pranzo!"
    goals: [propose]

- scenario: giorno-tipico
  level: A2
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi sveglio alle sette e mezza e faccio colazione con te, no?"
  - tutor: "Sì, è vero, alle otto siamo sempre in cucina insieme! E poi vai al corso?"
    goals: [wake]
  # merlin-1395_0000500-0
  - learner: "Ogni giorno vado al corso con 10 studenti che vengono dal tutto il mondo."
    errors: [articulated-preposition]
  - tutor: "Dieci studenti, che bella classe! Ma «dal tutto il mondo»: c'è già «il». Serve anche in «dal»?"
    prompt: {text: "dal tutto il mondo", tags: [articulated-preposition]}
  - learner: "Sì, vengono dal tutto il mondo: Brasile, Giappone, Svezia..."
    errors: [articulated-preposition]
  - tutor: "Che bello, vengono da tutto il mondo! Così parlate solo italiano. E a che ora finisce la lezione?"
    goals: [work]
    recast: {text: "dal tutto il mondo", fix: "da tutto il mondo", tags: [articulated-preposition]}
  # merlin-1395_0000583-2
  - learner: "Faccio una pausa fino la due meno un quarto e dopo finisco alle quatro un quarto."
    errors: [articulated-preposition, spelling]
  - tutor: "Una giornata lunga! Ma «fino la due meno un quarto»: tra «fino» e l'ora, cosa ci vuole?"
    prompt: {text: "fino la due meno un quarto", tags: [articulated-preposition]}
  - learner: "Fino alle due meno un quarto. Poi la sera cucino e guardo una serie. E tu a che ora esci la mattina?"
  - tutor: "Esatto! Io esco alle sette, perché l'ufficio è lontano. Torno solo alle sei, stanchissima!"
    goals: [evening, ask]

- scenario: giorno-tipico

# Set t-recast-native, file 6: B1, hotel complaints, habits and screens, holidays and trips
# (real learner sentences corrected by a native speaker; recasts use the native fix).

- scenario: reclamo-hotel
  level: B1
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Buonasera. Mi dica, c'è qualche problema?"
  # merlin-1325_9000141-4
  - learner: "Poi l'aria condizionata non ha fonzionato quando faceva molto caldo."
    errors: [tense-aspect, spelling]
  - tutor: "Mi dispiace molto. Ma «non ha fonzionato quando faceva caldo»: è una situazione che durava. Quale passato usiamo?"
    prompt: {text: "non ha fonzionato", tags: [tense-aspect]}
  # merlin-1325_9000141-5
  - learner: "In più, non ho avuto la possibilità di fare dello sport: la piscina è sempre stata sovraffollata, i campi di tennis sono stati in riparazione."
    errors: [tense-aspect, preposition]
  - tutor: "Capisco: la piscina era sempre sovraffollata e i campi erano chiusi. Da quando ha tutti questi problemi?"
    goals: [problem]
    recast: {text: "la piscina è sempre stata sovraffollata", fix: "la piscina era sempre sovraffollata", tags: [tense-aspect]}
  - learner: "Da lunedì, cioè dal primo giorno."
  - tutor: "Le chiedo scusa, non è la vacanza che le avevamo promesso. Che cosa possiamo fare?"
    goals: [since]
  # merlin-1325_9000138-1
  - learner: "Richiedo un parziale rimborso, a causa delle condizioni, neelle quali la mia famiglia ed io abbiamo dovuto passare le nostre vacanze."
  - tutor: "È una richiesta giusta. Posso toglierle il trenta per cento dal conto di tutto il soggiorno."
    goals: [request]
  # merlin-1325_9000141-11
  - learner: "Cambiate questo annuncio perchè non dice la verità!"
  - tutor: "Ha ragione, lo dirò al direttore domani mattina. Allora, accetta la mia proposta?"
  - learner: "Sì, va bene il trenta per cento. Grazie."
  - tutor: "Grazie a lei per la pazienza. Domani le preparo il conto nuovo."
    goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-m-retired
  history: [noun-number]
  turns:

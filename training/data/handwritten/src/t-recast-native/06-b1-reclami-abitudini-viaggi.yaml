    recast: {text: "in camere", fix: "in camera", tags: [noun-number]}
  # merlin-1325_1001015-5
  - learner: "Ogni giorno saremmo nuotato, ma la piscina era sempre sovrafollata."
    errors: [auxiliary-choice, spelling]
  - tutor: "Che peccato. Ma «saremmo nuotato»: con «nuotare», usiamo «avere» o «essere»?"
    prompt: {text: "saremmo nuotato", tags: [auxiliary-choice]}
  - learner: "Avremmo nuotato ogni giorno, da domenica. Vorrei un piccolo rimborso."
  - tutor: "Esatto. Le chiedo scusa: posso rimborsarle due notti su sette."
    goals: [since, request]
  - learner: "Due notti mi sembra giusto. D'accordo."
  - tutor: "Perfetto, preparo subito il documento. Buona serata, nonostante tutto."
    goals: [agree]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Buonasera. Mi dica, c'è qualche problema?"
  - learner: "Sì. Ho prenotato per la piscina, ma in questi tre giorni è stata sempre piena di gente."
  - tutor: "Mi dispiace. Quindi non è riuscita a nuotare?"
    goals: [problem, since]
  # merlin-1325_9000241-1
  - learner: "È stato sempre difficile, dunque, nuotare e prendere il fresco dell'aqua."
    errors: [tense-aspect]
  - tutor: "Capisco. Ma «è stato sempre difficile»: parla di tre giorni, una situazione che si ripeteva. Quale passato va meglio?"
    prompt: {text: "È stato sempre difficile", tags: [tense-aspect]}
  - learner: "Sì, è stato sempre difficile nuotare, anche la mattina presto."
    errors: [tense-aspect]
  - tutor: "Era sempre difficile nuotare, anche la mattina presto: le chiedo davvero scusa."
    recast: {text: "è stato sempre difficile", fix: "Era sempre difficile", tags: [tense-aspect]}
  # merlin-1325_9000316-20
  - learner: "Non interesate se una persona sarà contenta oppure scontenta."
    errors: [piacere, spelling]
  - tutor: "No, per noi lei è importante! Ma «non interesate»: questo verbo funziona come «piacere». Come lo dice?"
    prompt: {text: "Non interesate", tags: [piacere]}
  - learner: "Non vi interessa se sono contenta! Voglio un rimborso."
  - tutor: "Esatto, ma le assicuro che ci interessa. Le rimborso il prezzo della piscina e le preparo una lettera di conferma."
    goals: [request]
  # merlin-1325_1001164-9
  - learner: "Vi prego di inviarmelo quanto primo."
    errors: [word-choice]
  - tutor: "Certo, glielo invio quanto prima, stasera stessa."
    recast: {text: "quanto primo", fix: "quanto prima", tags: [word-choice]}
  - learner: "Va bene, grazie. Allora accetto."
  - tutor: "Grazie a lei. Buona serata!"
    goals: [agree]


- scenario: salute-stile-vita
  level: B1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
  - learner: "Non buone: passo troppe ore davanti al computer, anche di notte."
  - tutor: "Capisco. E che cosa fai al computer per tante ore?"
    goals: [habits]
  # merlin-1325_1001136-1
  - learner: "Anch'io ho qualche amico virtuale, generalmente faccio chat con loro e giochiamo sull'Internet."
    errors: [articulated-preposition, article-use]
  - tutor: "Ah, i giochi in rete. Ma «sull'Internet»: con «Internet», mettiamo l'articolo?"
    prompt: {text: "sull'Internet", tags: [articulated-preposition]}
  # merlin-1325_9000105-4
  - learner: "Ci sono sul internet cose pericoloze per giovani."
    errors: [articulated-preposition, article-use, spelling]
  - tutor: "È vero, su internet ci sono cose pericolose, per i giovani e non solo. Qual è il tuo obiettivo?"
    recast: {text: "sul internet", fix: "su internet", tags: [articulated-preposition]}
  # merlin-1325_1001039-6
  - learner: "Io ho usato il chat nel passato, ma mi sono realizzato che non ho bisogno, ho cancellato il mio profilo, e non me ne sono pendita."
    errors: [noun-gender, reflexive, ci-ne, spelling]
  - tutor: "Brava, hai fatto bene! Ma «il chat»: «chat» è maschile o femminile?"
    prompt: {text: "il chat", tags: [noun-gender]}
  - learner: "La chat, giusto. Il mio obiettivo è dormire di più, ma la sera sono stanca e resto sempre a casa."
  - tutor: "Esatto. Allora facciamo così: allenamento tre volte alla settimana e, la sera, esci con gli amici invece di stare al computer."
    goals: [goal, obstacles]
  # merlin-1395_0001115-6
  - learner: "Sono certa che c'é un sacco di cose da fare insieme, per esempio andare in discoteca."
  - tutor: "Ottimo, anche ballare è allenamento! Cominciamo lunedì."
    goals: [plan]


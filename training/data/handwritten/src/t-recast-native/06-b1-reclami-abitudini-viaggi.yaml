  # merlin-1325_1001015-3
  - learner: "Le parete sono sporche."
    errors: [noun-number]
  - tutor: "Oh, mi dispiace! Ma «le parete»: è plurale, come cambia la fine della parola?"
    prompt: {text: "Le parete", tags: [noun-number]}
  # merlin-1325_9000209-2
  - learner: "Secondo problema è che ci sono troppe differenze tra la realtà e l'annuncio pubblicitario, perchè per esempio non c'era l'aria condizionata in camere e la piscina era chiusa per tutti i giorni o sovraffollata."
    errors: [noun-number, article-use, preposition]
  - tutor: "Ha ragione: non c'era l'aria condizionata in camera, e anche la piscina è stata un problema. Da quando è qui?"

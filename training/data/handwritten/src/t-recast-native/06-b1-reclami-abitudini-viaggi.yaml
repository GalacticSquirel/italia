  - learner: "Vorrei perdere cinque chili, ma la sera sono troppo stanco. Potrei allenarmi la mattina presto."
  - tutor: "Allora alleniamoci la mattina: martedì, giovedì e sabato alle sette. Vedrai, dopo due settimane è più facile!"

    errors: [adjective-agreement, article-use, verb-form]
  - tutor: "Purtroppo è vero. Ma «persone cattivi»: «persone» è femminile, e l'aggettivo?"
    prompt: {text: "persone cattivi", tags: [adjective-agreement]}

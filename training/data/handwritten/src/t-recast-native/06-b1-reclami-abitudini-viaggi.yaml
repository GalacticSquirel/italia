- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [preposition, adjective-agreement]
  turns:
  - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
  - learner: "Lavoro otto ore in ufficio e la sera sto sempre su internet. Non faccio sport."
  - tutor: "Internet tutte le sere? Che cosa ci fai?"

# Set t-recast-native, file 2: A2, family photos, homes, visits and holidays (real learner
# sentences corrected by a native speaker; recasts use the native fix of the learner's own span).

- scenario: famiglia
  level: A2
  persona: en-f-student
  history: [subject-verb-agreement]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Sono i miei genitori, mio fratello e mia cugina, a Natale."
  - tutor: "Che bella famiglia! La mia sta bene, sai. E la tua come sta?"
    goals: [who]
  # merlin-1395_0000390-2
  - learner: "E anche la nostra famiglia stanno molto bene."
    errors: [subject-verb-agreement]
  - tutor: "Che bello! Ma «la nostra famiglia stanno»: «famiglia» è una parola singolare o plurale?"
    prompt: {text: "la nostra famiglia stanno", tags: [subject-verb-agreement]}
  - learner: "Sì, la famiglia stanno bene, grazie."
    errors: [subject-verb-agreement]
  - tutor: "Meno male, se la famiglia sta bene è tutto a posto! E la ragazza vicino a te, chi è?"
    recast: {text: "la famiglia stanno", fix: "la famiglia sta", tags: [subject-verb-agreement]}
  # merlin-1395_0000596-3
  - learner: "Lei chiama Daniela."
    errors: [reflexive]
  - tutor: "«Lei chiama Daniela»? Così sembra che lei chiama qualcuno al telefono!"
    prompt: {text: "Lei chiama Daniela", tags: [reflexive]}
  - learner: "Ah, no! Lei si chiama Daniela, ha ventidue anni e studia medicina."
  - tutor: "Ecco, ora è chiaro! Ventidue anni e medicina: è proprio brava."
    goals: [describe, ages]
  # merlin-1395_0001120-2
  - learner: "Come va tua familia?"
    errors: [possessive, spelling]
  - tutor: "Grazie della domanda! Ma «tua familia»: prima di «tua», cosa mettiamo qui?"
    prompt: {text: "tua familia", tags: [possessive]}
  - learner: "E come va la tua famiglia?"
  - tutor: "Esatto! Va tutto bene, grazie. I miei genitori vivono al mare, a Pescara."
    goals: [ask]

- scenario: casa-mia
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  # merlin-1395_0001015-2
  - learner: "Con la mia famiglia io sto un una grande casa con un piccolo giardino."
    errors: [preposition]
  - tutor: "Con il giardino, che bello! Ma «sto un una grande casa»: per dire dove sei, quale preposizione usi?"
    prompt: {text: "un una grande casa", tags: [preposition]}
  - learner: "Sto in una grande casa, vicino al centro. Ci sono quattro camere e la cucina è la mia stanza preferita."
  - tutor: "Esatto! Anch'io amo la cucina. La mia però è piccola piccola!"
    goals: [type, rooms, favourite]
  # merlin-1395_0001120-9
  - learner: "Posso rimanere tre giorni in tuo casa?"
    errors: [preposition, possessive]
  - tutor: "Ma certo! Però «in tuo casa»: con «casa», usiamo proprio «in»?"
    prompt: {text: "in tuo casa", tags: [preposition]}
  - learner: "Sì, in tuo casa, a maggio. Va bene?"
    errors: [preposition, possessive]
  - tutor: "«Tre giorni a casa tua» a maggio? Va benissimo, ho una camera per gli amici."
    recast: {text: "in tuo casa", fix: "a casa tua", tags: [preposition]}
  # merlin-1395_0001117-6
  - learner: "Com'è tua città?"
    errors: [possessive]
  - tutor: "Bella domanda! Ma «tua città»: davanti a «tua», ci va l'articolo?"
    prompt: {text: "tua città", tags: [possessive]}
  - learner: "Com'è la tua città?"
  - tutor: "Sì! È piccola, sul mare, e la mia casa ha un balcone con vista sulle barche."
    goals: [ask]

- scenario: famiglia
  level: A2
  persona: en-m-heritage
  history: [subject-verb-agreement]
  turns:
  - tutor: "Che bella foto! Chi sono queste persone?"
  - learner: "Questa è mia nonna, a novant'anni. Vive ancora in Calabria e cucina per tutti la domenica."
  - tutor: "Novant'anni, che bello! Sembra molto forte. Anche mia nonna è così: piccola, ma parla tantissimo!"
    goals: [who, ages, describe]
  # merlin-1395_0001076-4
  - learner: "E come state la tua famiglia?"
    errors: [subject-verb-agreement]
  - tutor: "Gentile! Ma «come state»: parli di una famiglia, una cosa sola. Come cambia il verbo?"
    prompt: {text: "come state", tags: [subject-verb-agreement]}
  # merlin-1395_0001122-1
  - learner: "E come state la tua famiglia, tutto a posto?"
    errors: [subject-verb-agreement]
  - tutor: "«Come sta la tua famiglia»? Bene, grazie! Tutto a posto, siamo tutti in salute."
    recast: {text: "come state", fix: "come sta", tags: [subject-verb-agreement]}
  # merlin-1395_0000630-4
  - learner: "Anche la mia famiglia va tutto bene!"
    errors: [preposition]
  - tutor: "Che bello! Ma «la mia famiglia va tutto bene»: a chi va bene? Pensa alla preposizione."
    prompt: {text: "la mia famiglia va tutto bene", tags: [preposition]}
  - learner: "Anche alla mia famiglia va tutto bene!"
  - tutor: "Perfetto! Allora tanti saluti alla nonna."
    goals: [ask]

- scenario: vacanze-passate
  level: A2
  persona: es-f-teacher
  history: [preposition]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0001071-1
  - learner: "L'anno scorso siamo andati a Sardegna."
    errors: [preposition]
  - tutor: "Che bello! Ma «a Sardegna»: Sardegna è il nome di una città? Quale preposizione usiamo?"
    prompt: {text: "a Sardegna", tags: [preposition]}
  - learner: "Sì, siamo andati a Sardegna e quest'anno a Milano, con trentacinque gradi."
    errors: [preposition]
  - tutor: "«Siamo andati in Sardegna» l'anno scorso, e quest'anno a Milano: che caldo! E cosa avete visto?"
    goals: [where, weather]
    recast: {text: "a Sardegna", fix: "in Sardegna", tags: [preposition]}
  # merlin-1395_0000563-2
  - learner: "La città è bellissima, con le cathedrale e il grande Giuseppe Meazza stadio!"
    errors: [noun-number, word-order]
  - tutor: "Il Duomo, bellissimo! Ma «le cathedrale»: quante sono, una o tante?"
    prompt: {text: "le cathedrale", tags: [noun-number]}
  - learner: "Una! La cattedrale, il Duomo. E siamo andati allo stadio Giuseppe Meazza."
  - tutor: "Esatto, una sola! E allo stadio avete visto una partita?"
    goals: [activities]
  # merlin-1395_0000636-2
  - learner: "Sì, ma il lavoro è dificile perché c'è molte gente."
    errors: [adjective-agreement]
  - tutor: "Il lavoro? Ah, lavori lì! Ma «molte gente»: «gente» è singolare. Allora «molte»...?"
    prompt: {text: "molte gente", tags: [adjective-agreement]}
  - learner: "Sì, c'è molte gente, ma mi piace tanto."
    errors: [adjective-agreement]
  - tutor: "Certo, lì c'è molta gente, ma è bello! Allora cosa ti è piaciuto di più?"
    recast: {text: "molte gente", fix: "molta gente", tags: [adjective-agreement]}
  - learner: "Lo stadio, assolutamente! È stato il giorno più bello."
  - tutor: "Ti capisco, una partita dal vivo è bellissima. Ben tornata a casa!"
    goals: [best]

- scenario: weekend-scorso
  level: A2
  persona: es-f-erasmus
  history: [article-use]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Benissimo! Sabato sono andata con Lucia e Marco a una festa argentina in centro."
  - tutor: "Ah, una festa argentina a Bologna! Dov'era?"
    goals: [where, with-who]
  # merlin-1395_0001170-2
  - learner: "C'é nel centro una discoteca meravigliosa, dove posso ballare anche del tango con qualche nuovi amici italiani!"
    errors: [article-use, noun-number]
  - tutor: "Il tango, che bello! Ma «ballare del tango»: per un ballo, quale articolo usiamo?"
    prompt: {text: "ballare anche del tango", tags: [article-use]}
  - learner: "Sì, ballare del tango con gli amici è bellissimo."
    errors: [article-use]
  - tutor: "Ballare il tango con gli amici dev'essere bellissimo! Siete tornati tardi?"
    goals: [what]
    recast: {text: "Ballare del tango", fix: "ballare il tango", tags: [article-use]}
  # merlin-1395_0001122-3
  - learner: "A la sera andiamo al cinema."
    errors: [preposition]
  - tutor: "Ah, al cinema! Ma «a la sera»: per dire «di solito, la sera», serve la preposizione?"
    prompt: {text: "A la sera", tags: [preposition]}
  - learner: "La sera andiamo al cinema, ma sabato no: siamo rimasti in discoteca fino alle tre! È stato bellissimo."
  - tutor: "Fino alle tre, brava! Io invece niente di speciale: ho dormito e ho visto un film a casa."
    goals: [opinion]

- scenario: biglietto-treno
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
  - tutor: "Buongiorno, dove deve andare? E quando vuole partire?"
  # merlin-1395_0001167-7
  - learner: "Penso que ritorno in Svizzera al 27 Novembre la mattina, va bene cosi?"
    errors: [preposition, spelling]
  - tutor: "Sì, la mattina ci sono treni. Ma «al 27 novembre»: per una data, quale parola usiamo prima del numero?"
    prompt: {text: "al 27 Novembre", tags: [preposition]}
  - learner: "Sì, al 27 novembre, alle nove."
    errors: [preposition]
  - tutor: "Allora «il 27 novembre» alle nove: c'è un treno alle nove e dieci. Solo andata?"
    goals: [destination]
    recast: {text: "al 27 novembre", fix: "il 27 novembre", tags: [preposition]}
  - learner: "Sì, solo andata, in seconda classe. Vicino al finestrino, per favore."
  - tutor: "Ecco, posto 42, vicino al finestrino. Sono sessantacinque euro."
    goals: [type, class]
  - learner: "Grazie. E da quale binario parte il treno?"
  - tutor: "Di solito dal binario sei, ma controlli sempre prima. Buon viaggio!"
    goals: [platform]

- scenario: compleanno
  level: A2
  persona: en-m-traveller
  history: [preposition]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  - learner: "Facciamo una cena a casa mia sabato sera, con i suoi amici e sua sorella?"
  - tutor: "Perfetto, casa tua è grande. E da mangiare? Io faccio la torta."
    goals: [date, guests]
  - learner: "Io faccio una pizza grande e porto la frutta."
  - tutor: "Ottimo! E il regalo? Hai un'idea?"
    goals: [food]
  # merlin-1365_0100171-8
  - learner: "Un tavolo, una lampada o qualcosa tipico tedesco per mangiare?"
    errors: [preposition]
  - tutor: "Bella idea, Sara ama la Germania! Ma «qualcosa tipico»: tra «qualcosa» e l'aggettivo, cosa ci vuole?"
    prompt: {text: "qualcosa tipico", tags: [preposition]}
  - learner: "Sì, qualcosa tipico tedesco, per esempio dei dolci di Natale."
    errors: [preposition]
  - tutor: "Qualcosa di tipico tedesco, sì! Dei dolci di Natale le piacciono di sicuro."
    recast: {text: "qualcosa tipico", fix: "qualcosa di tipico", tags: [preposition]}
  # merlin-1365_0100170-15
  - learner: "Ma la prossima settimana sara al IKEA e lì trovo un regalo buono."
    errors: [future-form, articulated-preposition]
  - tutor: "Anche un regalo per la casa è bello. Ma «sara al IKEA»: chi ci va, tu o lei? Pensa alla persona."
    prompt: {text: "sara", tags: [future-form]}
  - learner: "Io! La prossima settimana sarò all'IKEA. Compro la lampada e i dolci."
  - tutor: "Esatto! Allora dolci e lampada: Sara sarà contentissima."
    goals: [gift]

- scenario: casa-mia
  level: A2
  persona: es-f-teacher
  history: [modal-infinitive]
  turns:
  - tutor: "Allora, com'è la tua casa?"
  - learner: "È un appartamento piccolo con due camere. Mi piace soprattutto il balcone: la sera guardo le montagne."
  - tutor: "Che bello, con vista sulle montagne! Io invece vedo solo il mare."
    goals: [type, rooms, favourite]

  # merlin-1395_0001117-3
  - learner: "Voglio di andare da te in Italia."
    errors: [modal-infinitive]
  - tutor: "Che bello, ti aspetto! Ma «voglio di andare»: dopo «voglio», la «di» serve?"
    prompt: {text: "Voglio di andare", tags: [modal-infinitive]}
  - learner: "Sì, voglio di andare in estate, in luglio."
    errors: [modal-infinitive]
  - tutor: "«Voglio andare in estate»: perfetto, a luglio il mare è bellissimo!"
    recast: {text: "voglio di andare", fix: "voglio andare", tags: [modal-infinitive]}
  # merlin-1395_0001076-3
  - learner: "Perché con la tua macchina é molto comodo arriviamo a casa tua."
    errors: [verb-form]
  - tutor: "Certo, ti vengo a prendere io! Ma «è molto comodo arriviamo»: dopo «è comodo», che forma del verbo usiamo?"
    prompt: {text: "molto comodo arriviamo", tags: [verb-form]}
  - learner: "È molto comodo arrivare con la tua macchina. Com'è la tua casa?"
  - tutor: "Esatto! La mia casa è piccola, ma ha un bel balcone con i fiori."
    goals: [ask]

# Set t-recast-native, file 3: A2, moving a date, life at a language school, weekends
# (real learner sentences corrected by a native speaker; recasts use the native fix).

- scenario: serata-cinema
  level: A2
  persona: en-m-heritage
  history: [reflexive]
  turns:
  - tutor: "Ciao! Giovedì pomeriggio sono libera. Andiamo a vedere un film?"
  # merlin-1385_0001746-2
  - learner: "Purtroppo non ho tempo per incontrarvi con te."
    errors: [reflexive]
  - tutor: "Oh, peccato! Ma «incontrarvi»: «vi» è per «voi». Qui chi deve incontrare me?"
    prompt: {text: "incontrarvi", tags: [reflexive]}
  # merlin-1385_0001132-1
  - learner: "Ti scrivo per dirti una cosa: questa settimana ho molto lavoro in ufficio. Allora non ho tempo per incontrarvi con tu."
    errors: [reflexive, object-pronoun]
  - tutor: "«Non ho tempo per incontrarmi con te»: ho capito, troppo lavoro! Allora quando sei libero?"
    recast: {text: "incontrarvi", fix: "incontrarmi", tags: [reflexive]}
  # merlin-1385_0001103-1
  - learner: "Pero possiamo incontravi a sabato sera."
    errors: [reflexive, preposition]
  - tutor: "Sabato sera va bene! Ma «incontravi»: siamo noi due insieme. Come finisce il verbo?"
    prompt: {text: "incontravi", tags: [reflexive]}
  - learner: "Possiamo incontrarci sabato sera, al cinema? Mi piacciono le commedie."
  - tutor: "Esatto, sabato sera al cinema! Alle nove c'è una commedia francese. Ci vediamo davanti al cinema alle otto e mezza?"
    goals: [propose, genre, choose]
  # merlin-1395_0000611-4
  - learner: "Ci vediamo presto."
  - tutor: "Sì, a sabato! Ciao!"
    goals: [meet]

- scenario: serata-cinema
  level: A2
  persona: es-f-teacher
  history: [reflexive]
  turns:
  - tutor: "Ciao! Giovedì pomeriggio sono libera. Facciamo qualcosa?"
  # merlin-1385_0001107-2
  - learner: "In ufficio c'é molto lavoro e giovedì pomeriggio non posso incontrare con te."
    errors: [reflexive]
  - tutor: "Peccato! Ma «non posso incontrare con te»: qui il verbo vuole un pronome. Quale?"
    prompt: {text: "non posso incontrare con te", tags: [reflexive]}
  # merlin-1385_0001118-1
  - learner: "In ufficio c'e molto lavoro e giovedi pomeriggio non posso incontrare con tua al giovedi pomeriggio."
    errors: [reflexive, object-pronoun]
  - tutor: "«Non posso incontrarmi con te» giovedì: va bene, capisco. Ma sabato sono libera!"
    recast: {text: "non posso incontrare con tua", fix: "non posso incontrarmi con te", tags: [reflexive]}
  # merlin-1395_0000631-7
  - learner: "Vorrei uscire una sera con te, andare mangiare una spezialità della tua regione."
    errors: [preposition, spelling]
  - tutor: "Che bella idea! Ma «andare mangiare»: tra i due verbi, cosa ci va?"
    prompt: {text: "andare mangiare", tags: [preposition]}
  - learner: "Sì, andare mangiare le orecchiette, e dopo il cinema."
    errors: [preposition]
  - tutor: "Andare a mangiare le orecchiette e poi al cinema: perfetto! Che film vuoi vedere?"
    goals: [propose]
    recast: {text: "andare mangiare", fix: "andare a mangiare", tags: [preposition]}
  - learner: "Un film giallo, se c'è. Mi piacciono molto."
  - tutor: "C'è un giallo alle dieci e mezza. Allora ci vediamo sabato alle otto, al ristorante!"
    goals: [genre, choose, meet]

- scenario: giorno-tipico
  level: A2
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi sveglio alle sette e mezza e alle nove vado a scuola."
  - tutor: "Presto! E com'è la scuola? Chi è l'insegnante?"
    goals: [wake]
  # merlin-1395_0000447-2
  - learner: "La nostra insegnante si ciama Maria Rossi è viene di Sicilia."
    errors: [articulated-preposition, spelling]
  - tutor: "Che bello, la Sicilia! Ma «viene di Sicilia»: per dire da dove arriva una persona, quale preposizione usiamo?"
    prompt: {text: "viene di Sicilia", tags: [articulated-preposition]}
  - learner: "Sì, viene di Sicilia, di Palermo."
    errors: [articulated-preposition]
  - tutor: "Viene dalla Sicilia, da Palermo! Allora cucina bene, di sicuro."
    recast: {text: "viene di Sicilia", fix: "viene dalla Sicilia", tags: [articulated-preposition]}
  # merlin-1395_0000644-1
  - learner: "Imparo molte nuove parole e lavoro anche sulla grammatica con gli altri studenti."
  - tutor: "Parole e grammatica: bene! E alla fine c'è una prova?"
    goals: [work]
  # merlin-1395_0000402-3
  - learner: "Farò l'esame B2 alla fine de lo corso."
    errors: [articulated-preposition]
  - tutor: "Brava! Ma «de lo corso»: «di» e «lo» insieme, come diventano?"
    prompt: {text: "de lo corso", tags: [articulated-preposition]}
  - learner: "Alla fine del corso! Per questo la sera studio sempre in camera. E tu, cosa fai la sera?"
  - tutor: "Esatto! Io la sera vado in palestra e poi guardo un po' di televisione."
    goals: [evening, ask]

- scenario: giorno-tipico
  level: A2
  persona: en-m-heritage
  history: [ce-ci-sono]
  turns:
  - tutor: "Ciao! Com'è la tua giornata di solito?"
  - learner: "Mi sveglio alle otto e dalle nove all'una sono al corso d'italiano."
  - tutor: "Ah, il corso! E come sono i compagni?"
    goals: [wake, work]
  # merlin-1395_0000499-2
  - learner: "Nel mio corso c'è anchora 5 persone della Francia."
    errors: [ce-ci-sono, spelling]
  - tutor: "Cinque francesi! Ma «c'è cinque persone»: sono tante persone, il verbo va bene?"
    prompt: {text: "c'è anchora 5 persone", tags: [ce-ci-sono]}
  # merlin-1395_0000470-3
  - learner: "Nel corso con me altre ragazzi di Lione."
    errors: [ce-ci-sono, adjective-agreement]
  - tutor: "«Con me ci sono altri ragazzi di Lione»: allora parlate anche un po' di francese?"
    recast: {text: "con me altre ragazzi", fix: "con me ci sono altri ragazzi", tags: [ce-ci-sono]}
  # merlin-1395_0001103-1
  - learner: "In nostro corso ci sono tante persone differente."
    errors: [adjective-agreement, articulated-preposition]
  - tutor: "Bello! Ma «persone differente»: «persone» è plurale, e l'aggettivo?"
    prompt: {text: "persone differente", tags: [adjective-agreement]}
  - learner: "Tante persone differenti! E la sera usciamo tutti insieme. La tua giornata com'è?"
  - tutor: "Perfetto! Io lavoro in banca dalle otto alle cinque. Poi torno a casa e cucino."
    goals: [evening, ask]

- scenario: tempo-libero
  level: A2
  persona: es-m-worker
  history: [stare-gerund]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1395_0000355-0
  - learner: "Sto fare un corso di italiano."
    errors: [stare-gerund]
  - tutor: "Che bravo! Ma «sto fare»: con «stare», quale forma del verbo usiamo?"
    prompt: {text: "Sto fare", tags: [stare-gerund]}
  - learner: "Sì, sto fare il corso il sabato mattina."
    errors: [stare-gerund]
  - tutor: "«Sto facendo il corso il sabato mattina»: ogni settimana, allora! E con chi sei al corso?"
    goals: [hobby, frequency]
    recast: {text: "sto fare", fix: "Sto facendo", tags: [stare-gerund]}
  # merlin-1395_0000609-2
  - learner: "Sono con un group di Francese Molto simpatico."
    errors: [noun-number, word-choice, adjective-agreement]
  - tutor: "Bene! Ma «un group di Francese»: sono tante persone o una sola?"
    prompt: {text: "group di Francese", tags: [noun-number]}
  - learner: "Sono con un gruppo di francesi molto simpatici."
  - tutor: "Esatto! E ti piace stare in Italia?"
  # merlin-1395_0000642-6
  - learner: "Italia è bello!"
    errors: [article-use, adjective-agreement]
  - tutor: "Sono d'accordo! Ma «Italia»: davanti al nome di un paese, cosa mettiamo?"
    prompt: {text: "Italia", tags: [article-use]}
  - learner: "L'Italia è bella! E tu, cosa fai il sabato? Vieni a cena con noi?"
  - tutor: "Esatto! Io il sabato vado a correre, ma la sera sono libera: vengo con piacere!"
    goals: [ask, propose]

- scenario: vacanze-passate
  level: A2
  persona: en-f-student
  history: [future-form]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  - learner: "Ho passato agosto a Perugia, per un corso d'italiano. Faceva caldo, ma la cosa più bella è stata un concerto in piazza."
  - tutor: "A Perugia, che bello! Io e Marco invece partiamo adesso: tre settimane in Grecia."
    goals: [where, weather, activities, best]
  # merlin-1395_0000355-4
  - learner: "Peccato che proprio in questo tempo ci siete in vacanza e non ci posiamo vedere."
    errors: [ci-ne, spelling]
  - tutor: "Eh sì, peccato! Ma «ci siete in vacanza»: qui quel «ci» serve?"
    prompt: {text: "ci siete in vacanza", tags: [ci-ne]}
  - learner: "Ah, no: siete in vacanza e non ci possiamo vedere."
  - tutor: "Esatto. Ma torniamo a settembre! Quando ci vediamo, allora?"
  # merlin-1395_0000451-7
  - learner: "Vederemo alla fine dell'anno."
    errors: [future-form]
  - tutor: "Così tardi? Ma «vederemo»: il futuro di «vedere» è un po' più corto. Come lo dici?"
    prompt: {text: "Vederemo", tags: [future-form]}
  - learner: "Sì, vederemo a dicembre, a Natale."
    errors: [future-form]
  - tutor: "«Vedremo a dicembre»? Allora a Natale ci vediamo di sicuro!"
    recast: {text: "vederemo", fix: "Vedremo", tags: [future-form]}
  # merlin-1395_0001013-4
  - learner: "Tanti saluti ed a presto."
  - tutor: "A presto! Ti mando una foto dalla Grecia."

- scenario: weekend-scorso
  level: A2
  persona: en-m-traveller
  history: [noun-gender]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  - learner: "Bene! Sabato sono andato a Napoli con mia moglie e abbiamo mangiato in una pizzeria famosa."
  - tutor: "A Napoli, che fortuna! Com'era la pizzeria?"
    goals: [where, with-who, what]

  # merlin-1385_0000129-6
  - learner: "Le menu sono buoni."
    errors: [noun-gender]
  - tutor: "Bene! Ma «le menu»: questa parola è maschile o femminile?"
    prompt: {text: "Le menu", tags: [noun-gender]}
  - learner: "Sì, le menu sono buoni e non cari."
    errors: [noun-gender]
  - tutor: "I menù sono buoni e non cari: perfetto, allora ci vado anch'io! E stasera cosa fate?"
    recast: {text: "le menu", fix: "I menù", tags: [noun-gender]}
  # merlin-1395_0001141-1
  - learner: "Stasera vogliamo mangiare dei specialità in un ristaurante."
    errors: [noun-gender, spelling]
  - tutor: "Ancora! Ma «dei specialità»: la parola è femminile. Come cambia «dei»?"
    prompt: {text: "dei specialità", tags: [noun-gender]}
  - learner: "Delle specialità napoletane, ma non la pizza! E il tuo fine settimana?"
  - tutor: "Esatto! Il mio è stato tranquillo: ho dormito tanto e letto un libro."
    goals: [opinion]

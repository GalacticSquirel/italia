# z-moves, C2: subtle errors still follow the policy. Calques, false friends and collocations are
# recast at once; grammar errors (subjunctive, hypotheticals, relatives, ci/ne, register) are
# prompted first, praised when repaired and recast when the repair fails; correct turns get none.
- scenario: circolo-lettura
  level: C2
  persona: en-f-professional
  history: [relative-pronoun, hypothetical]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: l'ho trovato commovente nella sua ostinazione. Salire sugli alberi e non scendere più è un gesto di ribellione che ho ammirato dall'inizio alla fine."
    - tutor: "Commovente, addirittura! E secondo te che cosa rappresenta quella ribellione?"
      goals: [impression]
    - learner: "Il rifiuto delle regole paterne, ma anche un modo di partecipare al mondo da lontano, che è paradossale."
      errors: [relative-pronoun]
    - tutor: "«Da lontano, che è paradossale»: quel «che» si riferisce al mondo o a tutta l'idea?"
      prompt: {text: "che è paradossale", tags: [relative-pronoun]}
    - learner: "A tutta l'idea: partecipa al mondo stando sopra, che è paradossale."
      errors: [relative-pronoun]
    - tutor: "Partecipa stando sopra, il che è paradossale, certo: è l'allegoria dell'intellettuale che osserva dall'alto senza mai staccarsi del tutto."
      goals: [theme]
      recast: {text: "che è paradossale", fix: "il che è paradossale", tags: [relative-pronoun]}
    - learner: "E il fratello narratore ha un tono che mi ha fatto ridere fuori forte in più punti."
      errors: [word-choice]
    - tutor: "Ti ha fatto ridere di gusto, eh? È l'ironia di Calvino: leggera, ma mai superficiale."
      goals: [style]
      recast: {text: "ridere fuori forte", fix: "ridere di gusto", tags: [word-choice]}
    - learner: "Però su Cosimo non sono d'accordo con te: non è insopportabile, è coerente. Se Cosimo avrebbe ceduto anche una volta, il suo gesto sarebbe stato solo un capriccio, e invece eventualmente diventa una scelta di vita."
      errors: [hypothetical, false-friend]
    - tutor: "«Se Cosimo avrebbe ceduto»: dopo quel «se», ti convince il condizionale?"
      prompt: {text: "avrebbe ceduto", tags: [hypothetical]}
    - learner: "Ah, se Cosimo avesse ceduto anche una volta, il suo gesto sarebbe stato solo un capriccio."
    - tutor: "Esatto. E su questo mi hai quasi convinta: coerente, più che insopportabile. Che cosa proponi per il prossimo incontro?"
      goals: [disagree]
    - learner: "Proporrei «Se una notte d'inverno un viaggiatore»: restiamo con Calvino, ma ne vediamo il lato più sperimentale."
    - tutor: "Ottima scelta: dopo gli alberi, un labirinto di romanzi. Lo propongo al gruppo."
      goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: es-m-worker
  history: [register, subjunctive-use]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe. Le porgo le mie più sentite condoglianze, a lei e a tutta la famiglia."
    - tutor: "Grazie, è molto gentile. È stato tutto così improvviso."
      goals: [condolences]
    - learner: "Suo padre era una persona straordinaria. Una volta mi regalò un libro di poesie, e ancora oggi ne parlo con molto cariño."
      errors: [word-choice]
    - tutor: "Con affetto, sì: lui aveva questo dono, si faceva voler bene da tutti."
      goals: [memory]
      recast: {text: "cariño", fix: "affetto", tags: [word-choice]}
    - learner: "Se hai bisogno di qualcosa, per le pratiche o per qualsiasi altra cosa, chiamami pure."
      errors: [register]
    - tutor: "«Se hai bisogno... chiamami»: fino a un attimo fa ci davamo del lei, ricorda?"
      prompt: {text: "Se hai bisogno", tags: [register]}
    - learner: "Mi scusi: se ha bisogno di qualcosa, mi chiami pure, anche per le pratiche."
    - tutor: "Grazie, davvero. Forse per le pratiche della pensione di mia madre avrò bisogno di una mano."
      goals: [offer-help]
    - learner: "Certamente. E spero che sua madre trova un po' di pace, in questi giorni."
      errors: [subjunctive-use]
    - tutor: "«Spero che sua madre trova»: dopo «spero che», le suona bene?"
      prompt: {text: "trova", tags: [subjunctive-use]}
    - learner: "Sì, spero che trova un po' di serenità."
      errors: [subjunctive-use]
    - tutor: "Speriamo che trovi un po' di serenità, sì: adesso è la cosa più importante."
      recast: {text: "trova", fix: "trovi", tags: [subjunctive-use]}
    - learner: "Adesso la lascio riposare. Se le occorre qualcosa, non esiti a chiamarmi."
    - tutor: "Grazie di cuore per la visita. Mi ha fatto bene parlare un po' di lui."
      goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: en-m-heritage
  history: [word-choice, relative-pronoun]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Solo qualche parola! Mi ha colpito la cadenza: sembrava che cantassero, ogni frase saliva alla fine."
    - tutor: "È la cadenza napoletana, inconfondibile. Hai riconosciuto qualche parola?"
      goals: [notice]
    - learner: "Uno ha detto «guagliò». Mio nonno lo usava sempre con me, ma io ho sempre assunto che fosse un nome!"
      errors: [false-friend]
    - tutor: "Hai sempre creduto che fosse un nome? Che tenerezza! In realtà vuol dire «ragazzo!», quando si chiama qualcuno."
      goals: [example]
      recast: {text: "assunto", fix: "creduto", tags: [false-friend]}
    - learner: "Che bello. Molti pensano che il dialetto è italiano storpiato, ma non è così, vero?"
      errors: [subjunctive-use]
    - tutor: "«Molti pensano che il dialetto è»: dopo «pensano che», ti torna?"
      prompt: {text: "il dialetto è", tags: [subjunctive-use]}
    - learner: "Ah, molti pensano che il dialetto sia italiano storpiato."
    - tutor: "Esatto, e hai ragione: il napoletano ha una storia sua, parallela all'italiano, non derivata."
      goals: [standard]
    - learner: "Infatti ha una tradizione letteraria e musicale enorme, in cui pensiamo subito quando sentiamo una canzone."
      errors: [relative-pronoun]
    - tutor: "«Una tradizione in cui pensiamo»: «pensare» regge davvero quella preposizione?"
      prompt: {text: "in cui pensiamo", tags: [relative-pronoun]}
    - learner: "Sì, una tradizione in cui pensiamo tutti."
      errors: [relative-pronoun]
    - tutor: "Una tradizione a cui pensiamo tutti, certo: basta una canzone per riconoscerla."
      recast: {text: "in cui pensiamo", fix: "a cui pensiamo", tags: [relative-pronoun]}
    - learner: "Secondo me i dialetti andrebbero tutelati, ma senza imporli a scuola: dovrebbero vivere in famiglia e per strada."
    - tutor: "Sono d'accordo: un dialetto imposto per legge muore due volte. E adesso, guagliò, ti insegno qualche parola prima della prossima fermata!"
      goals: [opinion]

- scenario: email-rettore
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il mio contratto di ricerca scade a marzo e vorrei chiedere una proroga di sei mesi per completare il progetto."
    - tutor: "Capisco. Allora cominciamo dall'intestazione: come pensava di aprire la lettera?"
      goals: [situation]
    - learner: "Pensavo di scrivere «Caro Rettore», come in spagnolo si scrive «Estimado»."
      errors: [word-choice]
    - tutor: "«Magnifico Rettore», piuttosto: è la formula d'uso, e con un Rettore non si sbaglia mai."
      goals: [opening-formula]
      recast: {text: "Caro Rettore", fix: "Magnifico Rettore", tags: [word-choice]}
    - learner: "Poi pensavo di scrivere: «Voglio che mi concede la proroga entro febbraio»."
      errors: [subjunctive-use]
    - tutor: "«Voglio che mi concede»: prima ancora del tono, dopo «voglio che» quale modo serve?"
      prompt: {text: "mi concede", tags: [subjunctive-use]}
    - learner: "Ah, certo: «Voglio che mi conceda la proroga entro febbraio»."
    - tutor: "Corretto. Ora però il tono: «voglio», con un Rettore, è decisamente troppo diretto, non trova?"
    - learner: "Allora: «Le sarei grata se mi concederebbe una proroga di sei mesi»."
      errors: [hypothetical]
    - tutor: "«Se mi concederebbe»: dopo quel «se», il condizionale regge?"
      prompt: {text: "concederebbe", tags: [hypothetical]}
    - learner: "Sì: «Le sarei grata se mi concederebbe una proroga»."
      errors: [hypothetical]
    - tutor: "Il tono ora è perfetto: «Le sarei grata se mi concedesse una proroga di sei mesi». Ferma e cortese insieme."
      goals: [tone]
      recast: {text: "concederebbe", fix: "concedesse", tags: [hypothetical]}
    - learner: "E per chiudere? «Distinti saluti» va bene, o è troppo freddo?"
    - tutor: "Va bene, ma con un Rettore direi: «In attesa di cortese riscontro, porgo distinti saluti». Elegante e senza fronzoli."
      goals: [closing]

- scenario: intervista-radio
  level: C2
  persona: en-f-student
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere essere qui. Diciamo incoscienza, così mi metto al riparo dalle critiche!"
    - tutor: "Prudente! Allora ci racconti: che libro è, e perché proprio sugli italiani?"
    - learner: "È una collezione di storie vere, raccolte in otto anni a Bologna: volevo fissare il mio stupore prima di diventare troppo italiana per notarlo."
      errors: [word-choice]
    - tutor: "Una raccolta di storie vere, quindi. Ma non teme che il suo libro rafforzi gli stereotipi su di noi?"
      goals: [present-book]
      recast: {text: "collezione", fix: "raccolta", tags: [word-choice]}
    - learner: "Non credo che li ha rafforzati: chi l'ha letto mi dice il contrario."
      errors: [subjunctive-use]
    - tutor: "«Non credo che li ha rafforzati»: dopo «non credo che», che modo ci aspettiamo?"
      prompt: {text: "li ha rafforzati", tags: [subjunctive-use]}
    - learner: "Sì, non credo che li ha rafforzati, anzi."
      errors: [subjunctive-use]
    - tutor: "Lei non crede che li abbia rafforzati, anzi. Mi permetta di restare scettico, ma ci racconti un aneddoto."
      goals: [stereotype]
      recast: {text: "li ha rafforzati", fix: "li abbia rafforzati", tags: [subjunctive-use]}
    - learner: "Un signore alla fermata dell'autobus mi ha spiegato per mezz'ora la recipe del ragù, e alla fine mi invitava a pranzo."
      errors: [tense-aspect, word-choice]
    - tutor: "«E alla fine mi invitava»: era un'abitudine o un fatto successo una volta sola?"
      prompt: {text: "mi invitava", tags: [tense-aspect]}
    - learner: "Ah, alla fine mi ha invitata a pranzo! Ci sono andata, e da allora gesticolo e interrompo tutti: l'italiano mi ha cambiata."
    - tutor: "Benvenuta nel club! Un anziano bolognese che invita una sconosciuta: tutto il nostro paese in una scena. Un'ultima battuta per gli ascoltatori?"
      goals: [anecdote, language]
    - learner: "Venite a trovarci, ma lasciate a casa la panna nella carbonara!"
    - tutor: "Una chiusura degna di una vera italiana! Grazie, e alla prossima puntata."
      goals: [farewell]

- scenario: pranzo-domenicale
  level: C2
  persona: es-m-worker
  history: [ci-ne, tense-aspect]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Meno male! «Scannarsi» per una lasagna... immagino che voglia dire litigare ferocemente, no?"
    - tutor: "Esatto, in senso figurato, per fortuna! E tu, che hai in quella borsa?"
      goals: [react]
    - learner: "Il vino per voi: l'ho preso in un'enoteca del centro e mi è costato un occhio della faccia!"
      errors: [word-choice]
    - tutor: "Un occhio della testa, diciamo noi! Ma rende benissimo l'idea, grazie."
      recast: {text: "un occhio della faccia", fix: "un occhio della testa", tags: [word-choice]}
    - learner: "In spagnolo diciamo proprio «un ojo de la cara», della faccia! È curioso che cambi solo una parola."
    - tutor: "Bellissimo: stessa immagine, una parola diversa. E da voi c'è un piatto della domenica?"
      goals: [compare]
    - learner: "Mia nonna faceva una specie di lasagna con le melanzane, ma ormai in famiglia nessuno parla più."
      errors: [ci-ne]
    - tutor: "«Nessuno parla più»: parla più... di che cosa? Manca un pronome."
      prompt: {text: "parla più", tags: [ci-ne]}
    - learner: "Sì, purtroppo nessuno parla più, è un peccato."
      errors: [ci-ne]
    - tutor: "Nessuno ne parla più? Che peccato: le ricette delle nonne andrebbero scritte prima che spariscano."
      recast: {text: "parla più", fix: "ne parla più", tags: [ci-ne]}
    - learner: "Una volta l'ha bruciata davanti agli ospiti, e mio nonno, ridendo, le diceva: «Non tutte le ciambelle riescono col buco»."
      errors: [tense-aspect]
    - tutor: "«E mio nonno le diceva»: è successo una volta sola, giusto? Che tempo ci vuole?"
      prompt: {text: "le diceva", tags: [tense-aspect]}
    - learner: "Ah, le ha detto: «Non tutte le ciambelle riescono col buco»."
    - tutor: "Perfetto, e proverbio azzeccatissimo! Tuo nonno sapeva il fatto suo."
      goals: [use-idiom, anecdote]

- scenario: seminario-etica
  level: C2
  persona: en-f-professional
  history: [subjunctive-use, hypothetical]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Prego, professore, dubiti pure. Sostengo che la responsabilità morale presupponga intenzionalità, e che una macchina ne sia priva."
    - tutor: "E se le dicessi che anche l'intenzionalità umana è, in fondo, il prodotto di meccanismi?"
      goals: [thesis]
    - learner: "Distinguerei tra causare un evento ed esserne l'agente: una frana causa danni, ma nessuno la rende responsabile in senso morale."
      errors: [word-choice]
    - tutor: "Nessuno la ritiene responsabile, certo, ma una frana non prende decisioni. Un algoritmo sì, o almeno così sembra."
      goals: [distinguish]
      recast: {text: "la rende responsabile", fix: "la ritiene responsabile", tags: [word-choice]}
    - learner: "Sembra, appunto. Un algoritmo decide perché qualcuno l'ha programmato: se nessuno lo avrebbe programmato, non deciderebbe nulla."
      errors: [hypothetical]
    - tutor: "«Se nessuno lo avrebbe programmato»: in questa ipotesi, quel condizionale la convince?"
      prompt: {text: "lo avrebbe programmato", tags: [hypothetical]}
    - learner: "Ha ragione: se nessuno l'avesse programmato, non deciderebbe nulla."
    - tutor: "Esatto. Ma i sistemi che apprendono da soli si allontanano parecchio dalle istruzioni originarie, non crede?"
      goals: [objection]
    - learner: "Lo concedo: è possibile che il comportamento finale non era prevedibile neanche per i programmatori."
      errors: [subjunctive-use]
    - tutor: "«È possibile che non era prevedibile»: dopo «è possibile che», che modo ci vuole?"
      prompt: {text: "non era prevedibile", tags: [subjunctive-use]}
    - learner: "Sì, è possibile che non era prevedibile per nessuno."
      errors: [subjunctive-use]
    - tutor: "Bene: è possibile che non fosse prevedibile per nessuno. E allora di chi è la responsabilità?"
      goals: [concede]
      recast: {text: "non era prevedibile", fix: "non fosse prevedibile", tags: [subjunctive-use]}
    - learner: "Resta umana: semmai si dovrebbe parlare di responsabilità distribuita tra chi progetta, chi addestra e chi usa il sistema, non di colpa della macchina."
    - tutor: "Una conclusione rigorosa, lo ammetto. Ne discuteremo ancora, ma oggi il punto è suo."
      goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-erasmus
  history: [false-friend, relative-pronoun]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, ho reso il tono più leggero di quanto fosse nell'originale. Il problema è una frase ironica che gioca su un doppio senso."
    - tutor: "Appunto. E non è l'unico punto: rileggimi la frase sul padre."
      goals: [problem]
    - learner: "«La sua attitudine verso il padre era apertamente ostile»."
      errors: [false-friend]
    - tutor: "Il suo atteggiamento verso il padre, semmai: «attitudine» è un falso amico da manuale."
      recast: {text: "attitudine", fix: "atteggiamento", tags: [false-friend]}
    - learner: "Che figuraccia: pensavo che «attitudine» voleva dire la stessa cosa dello spagnolo «actitud»."
      errors: [subjunctive-use]
    - tutor: "«Pensavo che voleva dire»: a questo livello, quel «che» merita un altro modo, no?"
      prompt: {text: "voleva dire", tags: [subjunctive-use]}
    - learner: "Ah, pensavo che volesse dire la stessa cosa."
    - tutor: "Appunto. I falsi amici tradiscono proprio quando ci fidiamo di più. Ora, per la frase ironica: che opzioni hai?"
      goals: [false-friend]
    - learner: "Ho una resa letterale e una più libera. Preferisco la versione libera, la quale ironia è più vicina all'originale."
      errors: [relative-pronoun]
    - tutor: "«La versione, la quale ironia»: come si esprime il possesso con un relativo?"
      prompt: {text: "la quale ironia", tags: [relative-pronoun]}
    - learner: "Sì, la versione libera, la quale ironia funziona meglio."
      errors: [relative-pronoun]
    - tutor: "La versione libera, la cui ironia funziona meglio: d'accordo, ma rischi di riscrivere l'autore."
      goals: [options]
      recast: {text: "la quale ironia", fix: "la cui ironia", tags: [relative-pronoun]}
    - learner: "Allora tengo la versione libera, ma recupero il registro asciutto dell'originale nel resto della frase."
    - tutor: "Mi sembra un compromesso onesto. Rimandamela entro venerdì e vediamo se l'autore torna a parlare."
      goals: [decide]

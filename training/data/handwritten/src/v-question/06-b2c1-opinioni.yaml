# Set v-question, file 6: B2 radio interview and work debate; C1 podcast, mediation, town hall, supplier, news, book club.
- scenario: vita-in-italia
  level: B2
  persona: en-m-traveller
  history: [question-form]
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti! Sono venuto per un anno sabbatico, ma poi mi sono innamorato di Bologna e sono rimasto."
  - tutor: "Una storia classica! E qual è stata la cosa più difficile, all'inizio?"
    goals: [story]
  - learner: "Senza dubbio la burocrazia. Il primo anno ho passato più tempo negli uffici che al lavoro."
  - tutor: "Lo dicono in molti! E lei come è cambiato, in questi anni?"
    goals: [difficulties]
  - learner: "Sono più paziente, e ho imparato a godermi i pranzi lunghi. Forse adesso sono più rilassato che i miei amici inglesi."
    errors: [comparative]
  - tutor: "Più rilassato che i suoi amici? Davanti a un nome, dopo «più», quale parola usiamo?"
    prompt: {text: "più rilassato che i miei amici", tags: [comparative]}
  - learner: "Più rilassato dei miei amici inglesi, sicuramente."
  - tutor: "Esatto! E che consiglio darebbe a chi sta pensando di trasferirsi qui?"
    goals: [change]
  - learner: "Prima di tutto, imparare la lingua. Cosa se uno non la impara? Resta sempre un turista."
    errors: [question-form]
  - tutor: "«Cosa se uno non la impara?» Mmm, così suona molto inglese."
    prompt: {text: "Cosa se uno non la impara", tags: [question-form]}
  - learner: "Che se uno non la impara, resta sempre un turista."
    errors: [question-form]
  - tutor: "E se uno non la impara, resta un turista: verissimo, e lo dice uno che ce l'ha fatta. Altri consigli?"
    recast: {text: "Che se uno non la impara", fix: "E se uno non la impara", tags: [question-form]}
  - learner: "Sì: non abbiate paura di sbagliare. Gli italiani apprezzano chi ci prova."
  - tutor: "Parole sante. Grazie di essere stato con noi!"
    goals: [advice]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [question-form]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri. Alcuni lavori spariranno, ma ne nasceranno altri."
  - tutor: "Sì, ma chi perde il lavoro a cinquant'anni, che fa?"
    goals: [opinion]
  - learner: "Se lo Stato investerebbe di più nella formazione, potrebbe trovare un altro lavoro."
    errors: [hypothetical]
  - tutor: "Se lo Stato investerebbe? Dopo «se», in questo tipo di frase, il condizionale non va."
    prompt: {text: "Se lo Stato investerebbe", tags: [hypothetical]}
  - learner: "Se lo Stato investisse di più nella formazione, potrebbe trovarlo."
  - tutor: "Perfetto. Facile a dirsi, però. Hai un esempio reale?"
    goals: [hypothesis]
  - learner: "Sì: mio cugino era operaio in una fattoria di auto. Ha fatto un corso e adesso programma i robot."
    errors: [false-friend]
  - tutor: "Da una fabbrica di auto ai robot: bella storia, ma secondo me è un caso raro."
    recast: {text: "fattoria", fix: "fabbrica", tags: [false-friend]}
    goals: [example]
  - learner: "Per che lo dici?"
    errors: [question-form]
  - tutor: "Per che lo dici? Ripeti la domanda: c'è qualcosa che non va nella prima parola."
    prompt: {text: "Per che lo dici", tags: [question-form]}
  - learner: "Perché lo dici?"
  - tutor: "Perché leggo i giornali: le aziende comprano macchine e assumono sempre meno persone."
  - learner: "Va bene. Che tal se facciamo una scommessa? Tra dieci anni vediamo chi ha ragione."
    errors: [question-form]
  - tutor: "Che tal se...? Questa espressione in italiano non esiste."
    prompt: {text: "Che tal se", tags: [question-form]}
  - learner: "Tal se facciamo una scommessa?"
    errors: [question-form]
  - tutor: "E se facciamo una scommessa? Ci sto! Chi perde paga la cena."
    recast: {text: "Tal se", fix: "E se", tags: [question-form]}
  - learner: "Affare fatto. Riassumendo: il rischio esiste, ma con la formazione può diventare un'opportunità. Tu, alla fine, cosa ne pensi?"
  - tutor: "Penso che tu sia davvero troppo positivo. Ma la cena me la offrirai tu, vedrai."
    goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-f-professional
  history: [question-form]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Grazie a voi! Nel 2018 la mia azienda mi aveva proposto un trasferimento a Milano, e io avevo appena divorziato: mi è sembrato un segno."
  - tutor: "Un nuovo inizio, insomma. E cosa ti ha spiazzata di più, i primi tempi?"
    goals: [story]
  - learner: "Il rapporto con il tempo. A Londra, se una riunione è alle nove, inizia alle nove. Qui... dipende."
  - tutor: "Dipende da chi la organizza, diciamo! Ma c'è qualcosa che proprio non sopporti?"
    goals: [culture-shock]
  - learner: "Sinceramente, che tutti parlino al telefono in treno a voce altissima. E poi una curiosità: come mai che gli italiani hanno sempre fretta al bar e mai a tavola?"
    errors: [question-form]
  - tutor: "Come mai che...? Lì c'è una parola di troppo."
    prompt: {text: "come mai che", tags: [question-form]}
    goals: [critique]
  - learner: "Come mai gli italiani hanno sempre fretta al bar e mai a tavola?"
  - tutor: "Bellissima domanda! Il caffè è un rito veloce, il pranzo invece è sacro."
  - learner: "E il coperto? Cosa è il punto del coperto, se il pane non lo chiedo?"
    errors: [question-form]
  - tutor: "Cosa è il punto? È un calco dall'inglese: in italiano suona proprio strano."
    prompt: {text: "Cosa è il punto", tags: [question-form]}
  - learner: "Cosa è il punto, allora?"
    errors: [question-form]
  - tutor: "Che senso ha il coperto, dici? Bella domanda: ufficialmente paghi la tovaglia e il servizio, in pratica la tradizione."
    recast: {text: "Cosa è il punto", fix: "Che senso ha", tags: [question-form]}
  - learner: "Chi è che l'ha inventato, secondo te?"
  - tutor: "Nessuno e tutti: è un'eredità delle vecchie osterie. Ma veniamo a chi ci ascolta: che consiglio daresti a chi sta pensando di trasferirsi?"
  - learner: "Direi di imparare le regole non scritte prima ancora della grammatica: quando si bacia, quando si dà del lei, quando non si chiede il cappuccino."
  - tutor: "Il cappuccino dopo pranzo: il vero confine tra turisti e residenti! Grazie mille, è stato un piacere."
    goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: es-f-teacher
  history: [question-form]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Si sieda, per favore. Mi racconti tutto con calma: sono qui per ascoltarla."
  - tutor: "Marco ha presentato il progetto come se fosse tutto merito suo. Io ci ho lavorato tre mesi!"
  - learner: "Capisco che si è sentita messa da parte. Dev'essere stato frustrante."
    errors: [subjunctive-use]
  - tutor: "«Capisco che si è sentita»... Dopo «capisco che», con questo significato, che modo usiamo?"
    prompt: {text: "Capisco che si è sentita", tags: [subjunctive-use]}
  - learner: "Capisco che si sia sentita messa da parte."
  - tutor: "Proprio così. E nessuno ha detto niente, nemmeno il direttore."
    goals: [listen]
  - learner: "Mi può dire che cosa ha detto Marco, esattamente?"
  - tutor: "Ha detto «il mio progetto», tre volte, davanti a tutti."
  - learner: "E lei gli ha chiesto che perché l'ha fatto?"
    errors: [question-form]
  - tutor: "Gli ha chiesto che perché? C'è una parola in più."
    prompt: {text: "che perché", tags: [question-form]}
  - learner: "Sì, voglio dire: gli ha chiesto che perché, dopo la riunione?"
    errors: [question-form]
  - tutor: "Se gli ho chiesto perché? No, ero troppo arrabbiata: me ne sono andata e basta."
    recast: {text: "che perché", fix: "perché", tags: [question-form]}
    goals: [clarify]
  - learner: "Io ho parlato con lui stamattina. Mi ha detto che era convinto che il progetto è del gruppo."
    errors: [subjunctive-use]
  - tutor: "Era convinto che il progetto... è? Con «era convinto che» serve un congiuntivo, e al passato."
    prompt: {text: "il progetto è del gruppo", tags: [subjunctive-use]}
  - learner: "Era convinto che il progetto fosse del gruppo, non solo suo."
  - tutor: "Del gruppo? Va bene, forse non l'ha fatto apposta. Ma il nome sulle slide era solo il suo."
    goals: [perspective]
  - learner: "Che ne dice se domani ne parliamo tutti e tre, e alla prossima presentazione intervenite insieme?"
  - tutor: "Mi sembra giusto. Purché sia chiaro a tutti chi ha fatto cosa."
    goals: [solution]

- scenario: reclamo-comune
  level: C1
  persona: en-m-retired
  history: [question-form]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Da sei settimane c'è un cantiere sotto casa mia, e i lavori iniziano alle sei del mattino."
  - tutor: "Capisco il disagio. Si tratta di lavori urgenti sulla rete dell'acqua, che si concluderanno a breve."
    goals: [describe]
  - learner: "«A breve» cosa significa, esattamente? Una settimana? Sei mesi?"
  - tutor: "Non posso darle una data precisa: dipende dall'ufficio tecnico."
  - learner: "Mi permetta di insistere: con chi posso parlare con all'ufficio tecnico?"
    errors: [question-form]
  - tutor: "Con chi posso parlare con? Una delle due preposizioni è di troppo."
    prompt: {text: "con chi posso parlare con", tags: [question-form]}
  - learner: "Con chi posso parlare all'ufficio tecnico?"
  - tutor: "Con il responsabile dei lavori pubblici, che riceve il giovedì mattina. Le scrivo l'orario."
    goals: [insist]
  - learner: "Grazie. E l'orario del cantiere? È permesso di iniziare alle sei?"
    errors: [preposition]
  - tutor: "È permesso di iniziare? C'è una parola che non serve."
    prompt: {text: "È permesso di iniziare", tags: [preposition]}
  - learner: "È permesso iniziare alle sei?"
  - tutor: "No: il regolamento comunale consente i lavori rumorosi solo dalle sette. Prima è una violazione."
  - learner: "Allora vorrei presentare un reclamo formale. Che è la procedura?"
    errors: [question-form]
  - tutor: "Che è la procedura? Provi a cominciare la domanda con un'altra parola."
    prompt: {text: "Che è la procedura", tags: [question-form]}
  - learner: "Cosa è la procedura?"
    errors: [question-form]
  - tutor: "Qual è la procedura? Compila questo modulo, lo firma e io lo protocollo subito."
    recast: {text: "Cosa è la procedura", fix: "Qual è la procedura", tags: [question-form]}
    goals: [rights]
  - learner: "Ecco fatto. Mi può dare il numero di protocollo, così posso fare un sollecito se non succede niente?"
  - tutor: "Certo: è il 1187. Per legge la risposta deve arrivare entro trenta giorni."
    goals: [commitment]

- scenario: trattativa-fornitore
  level: C1
  persona: en-m-heritage
  history: [question-form]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo proprio per quello: un aumento del dodici per cento, per noi, è difficile da sostenere."
  - tutor: "Lo capisco, ma anche i nostri margini si sono ridotti parecchio."
    goals: [problem]
  - learner: "Lavoriamo insieme da otto anni e abbiamo sempre pagato puntualmente. Questo conta qualcosa, non è?"
    errors: [question-form]
  - tutor: "«Non è?» Alla fine di una frase così, in italiano, si dice altro."
    prompt: {text: "non è", tags: [question-form]}
  - learner: "Questo conta qualcosa, no?"
  - tutor: "Conta moltissimo, ed è proprio per questo che ne parliamo di persona."
    goals: [argue]
  - learner: "Allora le faccio una proposta: se l'aumento sarebbe del sei per cento, raddoppieremmo gli ordini estivi."
    errors: [hypothetical]
  - tutor: "Se l'aumento sarebbe? Dopo «se», nell'ipotesi, quale modo ci vuole?"
    prompt: {text: "se l'aumento sarebbe", tags: [hypothetical]}
  - learner: "Se l'aumento fosse del sei per cento, raddoppieremmo gli ordini estivi."
  - tutor: "Interessante. E per quanto tempo garantireste questi volumi?"
    goals: [counteroffer]
  - learner: "Per tutto l'anno prossimo. La consegna, la fate sempre in quarantotto ore?"
  - tutor: "Sì, su quella non cambia niente."
  - learner: "E cosa sui costi di trasporto? Restano a carico vostro?"
    errors: [question-form]
  - tutor: "Cosa sui costi? È una costruzione presa dall'inglese."
    prompt: {text: "cosa sui costi di trasporto", tags: [question-form]}
  - learner: "Cosa dei costi di trasporto?"
    errors: [question-form]
  - tutor: "E i costi di trasporto? Restano a carico nostro, come sempre. Allora: sei per cento e ordini estivi raddoppiati."
    recast: {text: "Cosa dei costi di trasporto", fix: "E i costi di trasporto", tags: [question-form]}
  - learner: "Perfetto. Me lo conferma per iscritto entro venerdì?"
  - tutor: "Le mando il nuovo contratto domani mattina. Affare fatto, e grazie per la sincerità."
    goals: [agreement]

- scenario: notizie-attualita
  level: C1
  persona: es-f-erasmus
  history: [question-form]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, l'ho letta. In breve, il governo vuole limitare gli affitti brevi nei centri storici, perché i residenti non trovano più casa."
  - tutor: "Esatto. E tu sei d'accordo?"
    goals: [summarise]
  - learner: "In parte. Capisco il problema, ma temo che la legge colpisce soprattutto i piccoli proprietari."
    errors: [subjunctive-use]
  - tutor: "Temo che la legge... colpisce? Dopo un verbo di timore, che modo usiamo?"
    prompt: {text: "temo che la legge colpisce", tags: [subjunctive-use]}
  - learner: "Temo che colpisca soprattutto i piccoli proprietari."
  - tutor: "Lo sostiene anche un editoriale che ho letto. Tu dove l'hai letta, la notizia?"
    goals: [opinion]
  - learner: "Su due testate diverse. Una diceva che la legge era «storica», l'altra che sarebbe stata del tutto inutile."
  - tutor: "Classico: ognuno segue la propria linea editoriale. E tu quale credi che sia più affidabile?"
    goals: [sources]
  - learner: "Nessuna delle due, sinceramente. Ma che passerà con i prezzi?"
    errors: [word-choice]
  - tutor: "Cosa succederà? Secondo me gli affitti lunghi scenderanno un po', almeno all'inizio."
    recast: {text: "passerà", fix: "succederà", tags: [word-choice]}
  - learner: "Mi chiedo che quanto scenderanno, in realtà."
    errors: [question-form]
  - tutor: "Mi chiedo che quanto? Lì c'è una parola di troppo."
    prompt: {text: "che quanto", tags: [question-form]}
  - learner: "Mi chiedo di quanto scenderanno, in realtà."
  - tutor: "Ecco, questo nessuno lo sa. Ma se i proprietari tornano agli affitti lunghi, qualche effetto ci sarà."
    goals: [consequences]
  - learner: "Allora a che cosa serve tutta questa polemica?"
  - tutor: "A vendere copie, ovviamente! Scherzo... ma solo in parte."

- scenario: club-lettura
  level: C1
  persona: en-f-student
  history: [question-form]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Sì, finito ieri notte! Nel complesso mi è piaciuto, anche se la seconda parte mi è sembrata un po' lenta."
  - tutor: "Lenta? Per me è la parte migliore! E la protagonista, come l'hai trovata?"
    goals: [impression]
  - learner: "Ambigua. Non ho capito perché abbia lasciato il marito senza spiegazioni."
  - tutor: "Perché si era resa conto di vivere la vita di un'altra, no?"
  - learner: "Forse. Ma io, al suo posto, parlerei con lui prima di andarmene."
    errors: [conditional-form]
  - tutor: "Parlerei? Ma stiamo parlando di una scelta che ormai è nel passato..."
    prompt: {text: "parlerei", tags: [conditional-form]}
  - learner: "Al suo posto, avrei parlato con lui prima di andarmene."
  - tutor: "Esatto. Però lei non ne aveva il coraggio, ed è questo il punto."
    goals: [character]
  - learner: "Una cosa non mi è chiara: chi parla il narratore a, nei capitoli in corsivo?"
    errors: [question-form]
  - tutor: "Chi parla il narratore a? La preposizione è rimasta in fondo, all'inglese."
    prompt: {text: "chi parla il narratore a", tags: [question-form]}
  - learner: "Chi parla il narratore, nei capitoli in corsivo?"
    errors: [question-form]
  - tutor: "A chi parla il narratore? Al figlio, credo, anche se non lo dice mai apertamente."
    recast: {text: "Chi parla il narratore", fix: "A chi parla il narratore", tags: [question-form]}
  - learner: "Ah, ecco! Lo stile, però, l'ho adorato: frasi brevissime, quasi telegrafiche."
  - tutor: "Sì, scrive come se togliesse parole invece di aggiungerle."
    goals: [style]
  - learner: "Lo consiglierei a chi ama le novelle psicologiche, ma non a chi cerca azione."
    errors: [false-friend]
  - tutor: "A chi ama i romanzi psicologici, senz'altro. D'accordo su tutto, tranne sulla seconda parte. Ne riparliamo al prossimo incontro!"
    recast: {text: "le novelle psicologiche", fix: "i romanzi psicologici", tags: [false-friend]}
    goals: [recommend]

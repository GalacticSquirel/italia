# Set v-question, file 7: C1 pitch, AI debate, idioms, mass tourism, promotion; C2 letter to the rector, dialects, translation.
- scenario: presentazione-progetto
  level: C1
  persona: en-f-professional
  history: [question-form]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Certo. Proponiamo di digitalizzare l'archivio clienti: oggi ogni ricerca richiede in media venti minuti, domani ne richiederà due."
  - tutor: "Bella frase. Ma mi servono numeri, non belle frasi."
    goals: [pitch]
  - learner: "Stimiamo un risparmio di tremila ore di lavoro all'anno, cioè circa novantamila euro."
  - tutor: "E quanto ci costerebbe?"
    goals: [benefits]
  - learner: "L'investimento iniziale è di centoventimila euro. Attualmente è meno di quanto spendiamo in straordinari in un anno."
    errors: [false-friend]
  - tutor: "In realtà meno degli straordinari di un anno? Detto così, cambia parecchio la prospettiva. Ma se poi il sistema non funziona? Ne ho visti tanti, di progetti finiti in un cassetto."
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
  - learner: "Se il sistema non funzionerebbe, potremmo recedere dal contratto entro sei mesi."
    errors: [hypothetical]
  - tutor: "Se il sistema non funzionerebbe? Dopo questo «se» il condizionale non va."
    prompt: {text: "Se il sistema non funzionerebbe", tags: [hypothetical]}
  - learner: "Se il sistema non funzionasse, potremmo recedere dal contratto entro sei mesi, senza penali."
  - tutor: "Questo mi rassicura, lo ammetto."
    goals: [objection]
  - learner: "Bene. E chi devo mandare il piano dettagliato a?"
    errors: [question-form]
  - tutor: "Chi devo mandare il piano a? La preposizione è rimasta in fondo, all'inglese."
    prompt: {text: "chi devo mandare il piano dettagliato a", tags: [question-form]}
  - learner: "Chi devo mandare il piano dettagliato?"
    errors: [question-form]
  - tutor: "A chi devo mandare il piano, mi chiede? A me, direttamente, e in copia al responsabile acquisti."
    recast: {text: "Chi devo mandare", fix: "A chi devo mandare", tags: [question-form]}
  - learner: "Perfetto. Allora le mando tutto entro venerdì e ci rivediamo la settimana prossima?"
  - tutor: "D'accordo. E porti anche un piano B: mi piace dormire tranquillo."
    goals: [next-steps]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-m-worker
  history: [question-form]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco la paura, ma credo che è esagerata. La tecnologia ha sempre distrutto alcuni lavori e ne ha creati altri."
    errors: [subjunctive-use]
  - tutor: "Credo che è...? Dopo «credo che», di solito, che modo si usa?"
    prompt: {text: "credo che è esagerata", tags: [subjunctive-use]}
  - learner: "Credo che sia esagerata, la tua paura."
  - tutor: "Sarà... ma questa volta è diverso: le macchine imparano da sole."
    goals: [position]
  - learner: "Guarda le banche: con i bancomat tutti pensavano che sparivano gli impiegati allo sportello, e invece si sono occupati di consulenza."
    errors: [subjunctive-use]
  - tutor: "Pensavano che sparivano? Qui ci vuole un congiuntivo, oppure un condizionale passato."
    prompt: {text: "pensavano che sparivano", tags: [subjunctive-use]}
  - learner: "Tutti pensavano che sarebbero spariti, e invece si sono occupati di consulenza."
  - tutor: "Perfetto. Ok, ma un bancomat non scrive articoli e non fa diagnosi."
    goals: [evidence]
  - learner: "E chi ti dice che sia un male?"
  - tutor: "Lo dico io! Chi li controlla, questi algoritmi? Le regole non arriveranno mai."
  - learner: "Come che no? L'Unione Europea ha già approvato una legge."
    errors: [question-form]
  - tutor: "Come che no? Mmm, in italiano suona proprio strano."
    prompt: {text: "Come che no", tags: [question-form]}
  - learner: "Come sarebbe a dire no? L'Unione Europea ha già approvato una legge."
  - tutor: "Una legge, sì. Ma tra l'approvarla e l'applicarla c'è di mezzo il mare."
  - learner: "Su questo hai ragione. Se non ci saranno controlli seri, il rischio sarebbe enorme."
    errors: [hypothetical]
  - tutor: "Se non ci saranno... sarebbe? I due tempi non vanno d'accordo."
    prompt: {text: "Se non ci saranno controlli seri", tags: [hypothetical]}
  - learner: "Se non ci fossero controlli seri, il rischio sarebbe enorme."
  - tutor: "Ecco, vedi che alla fine mi dai ragione?"
    goals: [concede]
  - learner: "Diciamo che siamo d'accordo su una cosa: servono regole e formazione, non panico."
  - tutor: "Va bene, firmo. Ma il panico me lo tengo, per sicurezza."
    goals: [conclude]

- scenario: modi-di-dire
  level: C1
  persona: en-m-heritage
  history: [question-form]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Una giornata da dimenticare. Stamattina ho perso il treno perché la sveglia non suonava."
    errors: [tense-aspect]
  - tutor: "Non suonava? Ma è un fatto avvenuto prima di perdere il treno..."
    prompt: {text: "non suonava", tags: [tense-aspect]}
  - learner: "Perché la sveglia non aveva suonato."
  - tutor: "Ahi. Quando si dice partire col piede sbagliato!"
  - learner: "Col piede sbagliato? Cosa vuol dire, esattamente?"
  - tutor: "Cominciare male, come se tutta la giornata fosse già segnata."
  - learner: "Ecco, sono proprio partito col piede sbagliato: arrivando in ufficio, ho scoperto che avevo lasciato il portatile a casa."
  - tutor: "Una disdetta dopo l'altra! E di chi è la colpa, secondo te?"
    goals: [tell, react]
  - learner: "Chi è la colpa? Della sveglia, ovviamente!"
    errors: [question-form]
  - tutor: "Chi è la colpa? Ripeti bene la mia domanda: all'inizio manca qualcosa."
    prompt: {text: "Chi è la colpa", tags: [question-form]}
  - learner: "Chi colpa è? Della sveglia!"
    errors: [question-form]
  - tutor: "Di chi è la colpa? Della sveglia, certo... o di chi la sera prima non ha caricato il telefono?"
    recast: {text: "Chi colpa è", fix: "Di chi è la colpa", tags: [question-form]}
  - learner: "Va bene, un po' anche mia. Ho dimenticato di caricarlo."
  - tutor: "Eh, chi è causa del suo mal pianga se stesso!"
    goals: [blame]
  - learner: "Bellissimo. Cosa è il significato letterale?"
    errors: [question-form]
  - tutor: "Cosa è il significato? Prova a cominciare la domanda con un'altra parola."
    prompt: {text: "Cosa è il significato", tags: [question-form]}
  - learner: "Qual è il significato letterale?"
  - tutor: "Che chi si è procurato un guaio da solo non deve lamentarsi con gli altri."
  - learner: "Allora la morale è: da domani due sveglie e il telefono in carica. Meglio prevenire che curare!"
  - tutor: "Bravo, e con il proverbio giusto! Vedi che la giornata finisce meglio di come è cominciata?"
    goals: [moral]

- scenario: turismo-di-massa
  level: C1
  persona: en-f-student
  history: [question-form]
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno! Vivo a Venezia da cinque anni e sono decisamente a favore."
  - tutor: "A favore? Ma così Venezia diventa un museo a pagamento!"
    goals: [introduce]
  - learner: "Lo è già, purtroppo. L'agosto scorso, per via del sovraffollamento, non riuscivo nemmeno a uscire di casa."
  - tutor: "Ma il turismo dà lavoro a migliaia di persone. E lei vorrebbe vietare anche le crociere?"
    goals: [example]
  - learner: "Perché non? Altre città l'hanno già fatto."
    errors: [question-form]
  - tutor: "«Perché non?» In italiano, in questo caso, l'ultima parola è diversa."
    prompt: {text: "Perché non", tags: [question-form]}
  - learner: "Perché no? Altre città l'hanno già fatto."
  - tutor: "E lei crede davvero che un ticket da cinque euro cambi qualcosa?"
  - learner: "Da solo, no. Ma come altrimenti si controlla il flusso?"
    errors: [question-form]
  - tutor: "Come altrimenti si controlla? L'ordine delle parole sa d'inglese."
    prompt: {text: "come altrimenti si controlla", tags: [question-form]}
  - learner: "Come altrimenti lo controlliamo?"
    errors: [question-form]
  - tutor: "Come lo controlliamo altrimenti, dice lei? Con le prenotazioni obbligatorie, per esempio, senza far pagare nessuno."
    recast: {text: "Come altrimenti lo controlliamo", fix: "Come lo controlliamo altrimenti", tags: [question-form]}
    goals: [rebut]
  - learner: "Esatto: io proporrei un numero chiuso nei giorni di punta, e che i soldi del ticket vanno ai servizi per i residenti."
    errors: [subjunctive-use]
  - tutor: "E che i soldi... vanno? Dopo «proporrei che» serve un altro modo."
    prompt: {text: "che i soldi del ticket vanno", tags: [subjunctive-use]}
  - learner: "E che i soldi del ticket vadano ai servizi per i residenti."
  - tutor: "Una proposta concreta, finalmente. Grazie per la telefonata, e buona giornata a Venezia!"
    goals: [proposal]

- scenario: colloquio-promozione
  level: C1
  persona: es-f-erasmus
  history: [question-form]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Volevo presentarle i risultati dell'ultimo anno: il mio team ha superato gli obiettivi del quindici per cento."
  - tutor: "Lo so, ottimo lavoro. E quindi?"
    goals: [results]
  - learner: "Quindi credo di meritare una promozione a responsabile di area, con un aumento adeguato."
  - tutor: "Capisco. Però il budget di quest'anno è già chiuso."
    goals: [request]
  - learner: "Come è questo che il budget è già chiuso? A gennaio si parlava di nuove assunzioni."
    errors: [question-form]
  - tutor: "Come è questo che...? Mmm, così la costruzione non regge."
    prompt: {text: "Come è questo che", tags: [question-form]}
  - learner: "Com'è che il budget è già chiuso? A gennaio si parlava di assunzioni."
  - tutor: "Le assunzioni sono state congelate a marzo. Ma i suoi risultati verranno considerati, glielo assicuro: serve solo tempo."
  - learner: "Capisco, ma mi aspettavo che i risultati erano considerati subito."
    errors: [subjunctive-use]
  - tutor: "Mi aspettavo che... erano? Dopo «mi aspettavo che» ci vuole un congiuntivo."
    prompt: {text: "che i risultati erano considerati", tags: [subjunctive-use]}
  - learner: "Mi aspettavo che i risultati venissero considerati subito."
  - tutor: "Lo capisco. Intanto potremmo ragionare su una promozione senza aumento, per ora."
  - learner: "Di cosa dipende l'aumento, allora?"
    errors: [preposition]
  - tutor: "Di cosa dipende? Con «dipendere», la preposizione è un'altra."
    prompt: {text: "Di cosa dipende", tags: [preposition]}
  - learner: "Da cosa dipende l'aumento?"
  - tutor: "Dai conti del semestre. Se a giugno i numeri tengono, l'aumento arriva."
    goals: [handle]
  - learner: "Avrei preferito una soluzione immediata, ma va bene. Che ne dice di rivederci a giugno, con i dati alla mano?"
  - tutor: "D'accordo, primo lunedì di giugno. Le mando l'invito oggi stesso."
    goals: [next-steps]

- scenario: email-rettore
  level: C2
  persona: en-m-retired
  history: [question-form, register]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Sono docente a contratto e da quattro mesi non ricevo il compenso pattuito. Vorrei sollecitare il pagamento senza risultare scortese."
  - tutor: "Comprensibile. E come pensava di aprire la lettera?"
    goals: [situation]
  - learner: "Pensavo a «Caro Rettore». Troppo confidenziale, non è vero?"
  - tutor: "Decisamente. Si usa «Magnifico Rettore», seguito da una formula che richiami la sua attenzione con garbo."
  - learner: "«Magnifico Rettore, mi permetto di sottoporre alla Sua cortese attenzione una questione...» Va bene così?"
  - tutor: "Impeccabile. E il cuore della lettera?"
    goals: [opening-formula]
  - learner: "Avevo scritto: «Voglio sapere quando mi pagherete». Lo so, è brutale. Se il Rettore non risponderebbe entro un mese, però, cosa faccio?"
    errors: [hypothetical]
  - tutor: "Se non risponderebbe? Nella protasi il condizionale è un intruso, come lei sa benissimo."
    prompt: {text: "Se il Rettore non risponderebbe", tags: [hypothetical]}
  - learner: "Se non rispondesse entro un mese, cosa dovrei fare?"
  - tutor: "Esatto. Allora si passa al ricorso. Ma prima riformuliamo quella frase brutale."
  - learner: "«Le sarei grato se potesse indicarmi quando verrà effettuato il pagamento.»"
  - tutor: "Perfetto: fermo nella sostanza, cortese nella forma."
    goals: [tone]
  - learner: "E quale formula dovrei chiudere con?"
    errors: [question-form]
  - tutor: "Chiudere con, in fondo alla frase? La preposizione è rimasta orfana."
    prompt: {text: "quale formula dovrei chiudere con", tags: [question-form]}
  - learner: "Con quale formula dovrei chiudere con?"
    errors: [question-form]
  - tutor: "Con quale formula dovrei chiudere, mi chiede? «In attesa di un cortese riscontro, porgo distinti saluti»: classico, ma infallibile."
    recast: {text: "Con quale formula dovrei chiudere con", fix: "Con quale formula dovrei chiudere", tags: [question-form]}
  - learner: "Perfetto, la uso così. Grazie davvero."
  - tutor: "Si figuri. E se tra un mese tace, torni da me: il ricorso lo scriviamo insieme."
    goals: [closing]

- scenario: dialetti-regionali
  level: C2
  persona: es-f-teacher
  history: [question-form]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Solo in parte! Ho notato che le vocali finali quasi spariscono, come se le mangiassero."
  - tutor: "Esatto: nella parlata napoletana le vocali finali si riducono a una specie di sospiro."
    goals: [notice]
  - learner: "E una parola mi ha incuriosito: ripetevano sempre «guaglione». Che cosa significa, e da dove viene?"
  - tutor: "Significa «ragazzo». L'etimologia è controversa: c'è chi la fa risalire al latino, chi a una parola francese."
    goals: [example]
  - learner: "Lo che non capisco è perché il dialetto sia ancora così vivo qui e quasi scomparso altrove."
    errors: [relative-pronoun]
  - tutor: "«Lo che»? In italiano, per introdurre questa frase, si usa un'altra forma."
    prompt: {text: "Lo che", tags: [relative-pronoun]}
  - learner: "Quello che non capisco è perché qui sia ancora così vivo."
  - tutor: "Perché a Napoli il dialetto non è mai stato solo la lingua dei poveri: c'è il teatro, la canzone, una letteratura vera."
    goals: [standard]
  - learner: "E in Napoli, i giovani lo parlano ancora in famiglia?"
    errors: [preposition]
  - tutor: "In Napoli? Con il nome di una città, la preposizione è un'altra."
    prompt: {text: "in Napoli", tags: [preposition]}
  - learner: "A Napoli, voglio dire. Mi domando che se i giovani lo parlino ancora."
    errors: [question-form]
  - tutor: "Mi domando che se...? In quella domanda indiretta c'è una parola di troppo."
    prompt: {text: "che se i giovani", tags: [question-form]}
  - learner: "Sì, mi domando che se i giovani lo parlino ancora, tra amici."
    errors: [question-form]
  - tutor: "Se i giovani lo parlino ancora? Eccome, anzi: con i social è tornato di moda, anche tra chi a casa parla italiano."
    recast: {text: "che se i giovani", fix: "se i giovani", tags: [question-form]}
  - learner: "Allora direi che va tutelato, ma senza imporlo: una lingua sopravvive se la si usa, non se la si chiude in un museo."
  - tutor: "Lo sottoscrivo, parola per parola. E te lo dice uno che sui dialetti ci campa!"
    goals: [opinion]

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-professional
  history: [question-form, false-friend]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Me l'aspettavo. Il dialogo tra madre e figlia è tutto understatement, e la mia versione è venuta troppo eccitata."
    errors: [false-friend]
  - tutor: "Troppo enfatica, direi, e hai ragione: lei non alza mai la voce, e tu le fai usare tre punti esclamativi."
    recast: {text: "eccitata", fix: "enfatica", tags: [false-friend]}
    goals: [problem]
  - learner: "Infatti. «I'm fine» l'ho reso con «Sto bene», ma forse «Tutto a posto» sarebbe stato più naturale. Tu quale preferiresti?"
  - tutor: "Nessuna delle due: «Niente, niente» dice molto di più, proprio perché non dice nulla."
    goals: [options]
  - learner: "Ah, bellissimo. E a pagina dodici ho scritto «eventualmente ha capito»: è un falso amico, vero? Doveva essere «alla fine»."
  - tutor: "Brava, te ne sei accorta da sola. E il titolo? Hai lasciato «The Long Goodbye»."
    goals: [false-friend]
  - learner: "Sì. «Il lungo addio» è già preso da Chandler, non è?"
    errors: [question-form]
  - tutor: "«Non è?» Ti scappa ancora l'inglese, eh: in coda alla frase, cosa diciamo?"
    prompt: {text: "non è", tags: [question-form]}
  - learner: "È già preso da Chandler, vero?"
  - tutor: "Verissimo, e sarebbe un'eco imbarazzante."
  - learner: "Cosa se lo lasciamo in inglese?"
    errors: [question-form]
  - tutor: "«Cosa se»? È un calco: in italiano l'ipotesi si apre in un altro modo."
    prompt: {text: "Cosa se lo lasciamo", tags: [question-form]}
  - learner: "Cosa se lo lasciamo in inglese, allora?"
    errors: [question-form]
  - tutor: "E se lo lasciamo in inglese? Sarebbe una resa, nel senso militare del termine."
    recast: {text: "Cosa se lo lasciamo", fix: "E se lo lasciamo", tags: [question-form]}
  - learner: "Allora «Un lungo addio», con l'indeterminativo: cambia quanto basta da renderlo nostro."
  - tutor: "Approvato. Vedi che quando vuoi l'autore lo fai parlare?"
    goals: [decide]

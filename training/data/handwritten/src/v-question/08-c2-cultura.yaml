# Set v-question, file 8: C2 satire, dinner with in-laws, ethics seminar, radio, condominium, poetry, reading circle, Sunday lunch.
- scenario: umorismo-satira
  level: C2
  persona: en-m-traveller
  history: [question-form]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Colpito e affondato. Ho capito «carbonara», ma il resto mi è sfuggito. Cosa era il gioco?"
    errors: [question-form]
  - tutor: "Cosa era il gioco? Detta così, non si capisce bene che cosa mi stai chiedendo."
    prompt: {text: "Cosa era il gioco", tags: [question-form]}
  - learner: "Che era il gioco di parole?"
    errors: [question-form]
  - tutor: "Qual era il gioco di parole? Il ministro aveva promesso di «mantecare» la riforma: come la pasta, mescolando tutto finché non si lega, e possibilmente senza panna."
    recast: {text: "Che era il gioco di parole", fix: "Qual era il gioco di parole", tags: [question-form]}
    goals: [missed]
  - learner: "Ah, adesso ci arrivo! Quindi prendeva in giro il suo linguaggio da chef stellato. Tu ridi di tutto, non è?"
    errors: [question-form]
  - tutor: "«Non è?» Dai, a questo livello quel calco non te lo perdono: come si chiude una frase così?"
    prompt: {text: "non è", tags: [question-form]}
    goals: [wordplay]
  - learner: "Tu ridi di tutto, vero?"
  - tutor: "Quasi di tutto. E a te quale battuta è piaciuta di più?"
  - learner: "Quella sul treno in orario: «l'unico ritardo è stato l'applauso». Funziona perché ribalta un luogo comune."
  - tutor: "Fine, sì. Anche se un po' scontata."
    goals: [favourite]
  - learner: "Scontata? Se il pubblico la trovava scontata, non avrebbe riso così."
    errors: [hypothetical]
  - tutor: "Se il pubblico la trovava...? Con «avrebbe riso», la prima parte va al congiuntivo."
    prompt: {text: "Se il pubblico la trovava", tags: [hypothetical]}
  - learner: "Se il pubblico l'avesse trovata scontata, non avrebbe riso così."
  - tutor: "Touché. Ma la satira, secondo te, deve avere dei limiti?"
  - learner: "Credo di no, a meno che non colpisca chi non ha modo di difendersi. Il bersaglio dovrebbe essere sempre il potere."
  - tutor: "Ben detto. Allora il ministro, con la sua carbonara, se l'è proprio meritata."
    goals: [limits]

- scenario: cena-suoceri
  level: C2
  persona: es-f-teacher
  history: [question-form, register]
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Eccomi, in carne e ossa! Grazie dell'invito. Che profumo meraviglioso: cos'è che ha preparato la signora?"
  - tutor: "Un brasato al Barolo, ricetta di mia suocera. Speriamo sia all'altezza delle sue aspettative."
  - learner: "È squisito, davvero, e il vino lo accompagna alla perfezione. La ricetta... glie la chiedo dopo alla signora."
    errors: [combined-pronouns]
  - tutor: "Glie la chiedo? Quei due pronomi, in italiano, preferiscono stare uniti."
    prompt: {text: "glie la chiedo", tags: [combined-pronouns]}
    goals: [compliment]
  - learner: "Gliela chiedo dopo, se me la vuole dare."
  - tutor: "Ne dubito: è un segreto di famiglia. Ma mi dica, di che cosa si occupa? Mia figlia è sempre così vaga."
  - learner: "Insegno spagnolo al liceo e sto finendo un dottorato. Fra un anno vorrei tentare un concorso all'università."
  - tutor: "Ah, l'università: solida come una barca di carta, ma piena di soddisfazioni, immagino."
    goals: [background]
  - learner: "Solida come una barca di carta, sì, ma almeno galleggia finché non piove!"
  - tutor: "Ottima risposta. Senta, diamoci del tu: con il Lei mi sento un monumento."
    goals: [irony]
  - learner: "Con piacere. Allora... come vuoi che ti chiamo?"
    errors: [subjunctive-use]
  - tutor: "Come vuoi che ti chiamo? Dopo «vuoi che», ci vuole un altro modo."
    prompt: {text: "come vuoi che ti chiamo", tags: [subjunctive-use]}
  - learner: "Come vuoi che ti chiami? Bruno va bene?"
  - tutor: "Bruno va benissimo."
    goals: [tu-lei]
  - learner: "E voi, fa quanto tempo vivete in questa casa?"
    errors: [question-form]
  - tutor: "Fa quanto tempo? Per una cosa che dura ancora, la domanda si costruisce in un altro modo."
    prompt: {text: "fa quanto tempo vivete", tags: [question-form]}
  - learner: "Quanto tempo fa che vivete qui?"
    errors: [question-form]
  - tutor: "Da quanto tempo vivete qui, chiedi? Da trentadue anni: ormai questa casa ci conosce meglio di quanto ci conosciamo noi."
    recast: {text: "Quanto tempo fa che vivete", fix: "Da quanto tempo vivete", tags: [question-form]}
  - learner: "Allora brindo alla casa, e a chi la abita!"
  - tutor: "Salute! E benvenuta in famiglia, a quanto pare."

- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [question-form, register]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Prego, professore. La mia tesi è precisa: la responsabilità morale presuppone l'intenzionalità, e una macchina non ha intenzioni proprie."
  - tutor: "E se una macchina agisse in modo indistinguibile da un agente intenzionale?"
    goals: [thesis]
  - learner: "Se agirebbe così, sarebbe comunque una simulazione dell'intenzione, non un'intenzione."
    errors: [hypothetical]
  - tutor: "Se agirebbe? Proprio lei, così rigorosa, mi mette un condizionale dopo il «se»?"
    prompt: {text: "Se agirebbe", tags: [hypothetical]}
  - learner: "Se agisse così, sarebbe comunque una simulazione. Bisogna distinguere tra comportamento e coscienza: un termostato reagisce, ma non vuole niente."
  - tutor: "Bell'esempio. Ma anche la coscienza altrui, a ben vedere, la conosciamo solo attraverso il comportamento."
    goals: [distinguish]
  - learner: "Senti, prof, su che cosa basi questa affermazione?"
    errors: [register]
  - tutor: "«Senti, prof»? Siamo in un seminario, dottoressa: il tono non le sembra un po' troppo disinvolto?"
    prompt: {text: "Senti, prof", tags: [register]}
  - learner: "Mi scusi, professore: su che cosa basa questa affermazione?"
  - tutor: "Sull'impossibilità di accedere a una mente altrui: il vecchio problema delle altre menti."
  - learner: "Ammetto che sia un'obiezione seria. Ma, se l'accettassimo, dovremmo ritenere responsabile anche un'aspirapolvere difettoso."
    errors: [noun-gender]
  - tutor: "Un'aspirapolvere? Il genere, qui, la tradisce."
    prompt: {text: "un'aspirapolvere", tags: [noun-gender]}
  - learner: "Un aspirapolvere difettoso, appunto."
  - tutor: "Touché. Ma lei confonde il grado con la natura."
    goals: [objection]
  - learner: "Le chiedo allora su quale criterio ha Lei fondato questa distinzione."
    errors: [question-form]
  - tutor: "Ha Lei fondato? Il soggetto si è infilato tra l'ausiliare e il participio."
    prompt: {text: "ha Lei fondato", tags: [question-form]}
  - learner: "Le chiedo su quale criterio abbia fondato questa distinzione."
  - tutor: "Domanda legittima, e non ho una risposta definitiva. Glielo concedo."
  - learner: "Allora concedo anch'io che il confine sia sfumato; ma un confine sfumato resta pur sempre un confine."
    goals: [concede]
  - tutor: "E dunque, in una frase?"
  - learner: "Finché non si dimostra che una macchina abbia intenzioni proprie, la responsabilità resta di chi la progetta e di chi la usa."
  - tutor: "Rigoroso e inattaccabile, almeno per oggi. Complimenti, dottoressa."
    goals: [conclude]

- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [question-form]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie! Più incoscienza che coraggio, temo. Il libro racconta dieci anni a Torino, visti da una straniera che ha smesso di sentirsi straniera."
  - tutor: "E naturalmente non mancano gli stereotipi: mandolino, mamma e spaghetti?"
    goals: [present-book]
  - learner: "Ci sono, ma per smontarli. Non pensa che gli stereotipi danno fastidio soprattutto quando sono veri?"
    errors: [subjunctive-use]
  - tutor: "Non pensa che... danno? Una scrittrice come lei sa bene cosa vuole quel «pensa che»."
    prompt: {text: "gli stereotipi danno fastidio", tags: [subjunctive-use]}
  - learner: "Non pensa che gli stereotipi diano fastidio soprattutto quando sono veri?"
  - tutor: "Colpito e affondato! Ci regala un aneddoto?"
    goals: [stereotype]
  - learner: "Quando arrivavo a Torino, non parlavo una parola d'italiano. Il primo giorno ho chiesto un cappuccino alle tre del pomeriggio."
    errors: [tense-aspect]
  - tutor: "Quando arrivavo? L'arrivo è un fatto puntuale, uno solo..."
    prompt: {text: "Quando arrivavo", tags: [tense-aspect]}
  - learner: "Quando sono arrivata a Torino. Il barista mi ha guardata come se avessi bestemmiato in chiesa."
  - tutor: "Il cappuccino pomeridiano: peccato mortale! E l'italiano, come l'ha cambiata?"
    goals: [anecdote]
  - learner: "Adesso gesticolo, e alzo la voce quando sono felice. E a Lei, cosa è come intervistare una straniera?"
    errors: [question-form]
  - tutor: "Cosa è come...? Ricalca l'inglese, e qui la sento anche la regia."
    prompt: {text: "cosa è come intervistare", tags: [question-form]}
    goals: [language]
  - learner: "Sì: cosa è come, per Lei, intervistare una straniera?"
    errors: [question-form]
  - tutor: "Com'è intervistare una straniera? Rinfrescante: ci vedete meglio di quanto ci vediamo noi. Una battuta per salutare gli ascoltatori?"
    recast: {text: "cosa è come", fix: "Com'è", tags: [question-form]}
  - learner: "Mia nonna diceva: «Chi parla due lingue vive due volte». Io, con l'italiano, sono rinata."
  - tutor: "Non potevamo chiudere meglio. Grazie, e alla prossima puntata!"
    goals: [farewell]

- scenario: assemblea-condominio
  level: C2
  persona: en-m-retired
  history: [question-form]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Sono favorevole al rifacimento della facciata, ma non a queste condizioni: il preventivo mi sembra gonfiato."
  - tutor: "Il signore del terzo piano dice che chi non vuole pagare può sempre cambiare casa."
    goals: [position]
  - learner: "Capisco l'esasperazione, ma nessuno qui vuole sottrarsi. Vorrei solo che si confrontano almeno tre preventivi."
    errors: [subjunctive-use]
  - tutor: "Vorrei che si confrontano? Con «vorrei che», il congiuntivo presente non basta."
    prompt: {text: "che si confrontano", tags: [subjunctive-use]}
  - learner: "Vorrei solo che si confrontassero almeno tre preventivi, tutto qui."
  - tutor: "Bene, la temperatura scende. E chi li chiederebbe, questi preventivi? Io no di certo."
    goals: [defuse]
  - learner: "Me ne occupo io. Mi può dire entro quando devono arrivare?"
  - tutor: "Entro fine mese, se vogliamo votare a novembre."
    goals: [alternative]
  - learner: "Perfetto. E quanto ogni appartamento pagherebbe, più o meno?"
    errors: [question-form]
  - tutor: "Quanto ogni appartamento pagherebbe? In italiano, qui, il soggetto preferisce stare dopo il verbo."
    prompt: {text: "quanto ogni appartamento pagherebbe", tags: [question-form]}
  - learner: "Quanto ogni appartamento dovrebbe pagare?"
    errors: [question-form]
  - tutor: "Quanto dovrebbe pagare ogni appartamento? Dipende dai millesimi: in media milleottocento euro, in sei rate."
    recast: {text: "Quanto ogni appartamento dovrebbe pagare", fix: "Quanto dovrebbe pagare ogni appartamento", tags: [question-form]}
  - learner: "Allora propongo di mettere a verbale che la delibera è rinviata finché non saranno stato confrontati tre preventivi."
    errors: [passive]
  - tutor: "Saranno stato confrontati? Il participio di «essere» deve accordarsi anche lui."
    prompt: {text: "saranno stato confrontati", tags: [passive]}
  - learner: "Finché non saranno stati confrontati tre preventivi."
  - tutor: "Messo a verbale. Signori, mi sembra un compromesso ragionevole: chi è favorevole alzi la mano."
    goals: [compromise]

- scenario: poesia-montale
  level: C2
  persona: es-f-erasmus
  history: [question-form]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una sensazione di aridità, e insieme di attesa. Come se qualcosa dovesse succedere e non succedesse mai."
  - tutor: "Bellissimo. Su quale immagine si fonda, secondo lei, questa sensazione?"
    goals: [first-reading]
  - learner: "Sul muro con i cocci di bottiglia: è un'immagine in la quale il limite diventa ferita."
    errors: [relative-pronoun]
  - tutor: "In la quale? Dopo una preposizione, qui, c'è una forma più semplice e più elegante."
    prompt: {text: "in la quale", tags: [relative-pronoun]}
  - learner: "È un'immagine in cui il limite diventa ferita."
  - tutor: "Esatto. E il suono? Ha notato qualcosa?"
    goals: [image]
  - learner: "Sì, ci sono molte consonanti dure, «r» e «t», che rendono il verso molto rudo."
    errors: [word-choice]
  - tutor: "Molto aspro, sì: Montale cerca una musica scabra, senza ornamenti, che graffi l'orecchio."
    recast: {text: "rudo", fix: "aspro", tags: [word-choice]}
    goals: [sound]
  - learner: "Che vuol dire «scabra»?"
  - tutor: "Ruvida, spoglia, priva di qualsiasi dolcezza."
  - learner: "E la «divina Indifferenza», con chi si riferisce?"
    errors: [question-form]
  - tutor: "Con chi si riferisce? Con «riferirsi» la preposizione è un'altra, e qui non si tratta di una persona."
    prompt: {text: "con chi si riferisce", tags: [question-form]}
  - learner: "Di che cosa si riferisce?"
    errors: [question-form]
  - tutor: "A che cosa si riferisce? A un distacco quasi sacro dal dolore: l'unico bene che il poeta riesce a immaginare."
    recast: {text: "Di che cosa si riferisce", fix: "A che cosa si riferisce", tags: [question-form]}
  - learner: "Allora direi che la poesia è una rinuncia lucida: il miracolo forse esiste, ma il poeta sceglie di non aspettarlo."
  - tutor: "Una lettura matura e personale. Ci ritorneremo la prossima volta."
    goals: [meaning]

- scenario: circolo-lettura
  level: C2
  persona: en-m-heritage
  history: [question-form]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io no, anzi: l'ho trovato commovente. È un personaggio di cui la ribellione è ostinata ma mai arrogante."
    errors: [relative-pronoun]
  - tutor: "Di cui la ribellione? Per il possesso, il relativo ha una forma tutta sua."
    prompt: {text: "di cui la ribellione", tags: [relative-pronoun]}
  - learner: "È un personaggio la cui ribellione è ostinata, ma mai arrogante."
  - tutor: "Ostinata, certo: passa la vita sugli alberi per un piatto di lumache!"
    goals: [impression]
  - learner: "Ma le lumache sono solo il pretesto. Il tema vero è la distanza critica: guardare il mondo dall'alto per giudicarlo meglio."
  - tutor: "Interessante. E lo stile? Io lo trovo freddo, un esercizio d'intelligenza."
    goals: [theme]
  - learner: "È leggero nel senso migliore. Se Calvino sarebbe freddo, non ci commuoveremmo alla morte di Cosimo."
    errors: [hypothetical]
  - tutor: "Se Calvino sarebbe? Proprio nell'ipotesi decisiva, il condizionale si è intrufolato dove non deve."
    prompt: {text: "Se Calvino sarebbe", tags: [hypothetical]}
    goals: [style]
  - learner: "Se Calvino fosse freddo, non ci commuoveremmo alla morte di Cosimo."
  - tutor: "Mmm. Io non mi sono commosso affatto, ma ammetto che l'argomento regge."
    goals: [disagree]
  - learner: "Allora mi dica: cosa era la scena che più l'ha irritata?"
    errors: [question-form]
  - tutor: "Cosa era la scena? C'è un interrogativo più adatto, davanti a «era»."
    prompt: {text: "cosa era la scena", tags: [question-form]}
  - learner: "Che era la scena che più l'ha irritata?"
    errors: [question-form]
  - tutor: "Qual era la scena che più mi ha irritato? Quella con Viola: troppo zucchero, troppa letteratura."
    recast: {text: "Che era la scena", fix: "Qual era la scena", tags: [question-form]}
  - learner: "Allora come prossimo libro propongo «Il sentiero dei nidi di ragno»: è il Calvino meno leggero, così vediamo se lo trova ancora freddo."
  - tutor: "Provocazione accettata. Ci vediamo tra un mese, e preparatevi a difenderlo!"
    goals: [recommend]

- scenario: pranzo-domenicale
  level: C2
  persona: es-m-worker
  history: [question-form]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Meno male, temevo di dover lottare anch'io! Scusate se parlo poco, sono un po' costipato."
    errors: [false-friend]
  - tutor: "Raffreddato, speriamo! Allora ci vuole un bicchiere di rosso. E «scannarsi», l'hai capito?"
    recast: {text: "costipato", fix: "raffreddato", tags: [false-friend]}
  - learner: "Vuol dire litigare ferocemente, no? Letteralmente sarebbe tagliarsi la gola."
  - tutor: "Esatto, ma tra noi solo per la lasagna. Ne vuoi un pezzo?"
    goals: [react]
  - learner: "Sì, grazie, ne prendo un pezzetto. Buonissima! Quanto tempo vuole per prepararla?"
    errors: [ci-ne]
  - tutor: "Quanto tempo vuole? Così sembra che la lasagna abbia delle pretese!"
    prompt: {text: "Quanto tempo vuole", tags: [ci-ne]}
  - learner: "Quanto tempo si vuole, allora?"
    errors: [ci-ne]
  - tutor: "Quanto tempo ci vuole? Mezza giornata, tra ragù e besciamella. Ma raccontaci: com'è andata la settimana?"
    recast: {text: "Quanto tempo si vuole", fix: "Quanto tempo ci vuole", tags: [ci-ne]}
  - learner: "Un disastro: ho prestato la macchina a mio cugino e mi l'ha restituita senza benzina."
    errors: [combined-pronouns]
  - tutor: "Mi l'ha restituita? Quando i pronomi si incontrano, il primo cambia vestito."
    prompt: {text: "mi l'ha restituita", tags: [combined-pronouns]}
  - learner: "Me l'ha restituita a secco! Ma ho fatto buon viso a cattivo gioco: tanto, chi la fa l'aspetti."
  - tutor: "Due proverbi in una frase: sei pronto per sfidare la nonna!"
    goals: [use-idiom, anecdote]
  - learner: "Da noi si dice «el que la hace la paga», che è quasi uguale. E «chi la fa l'aspetti», di chi è?"
  - tutor: "Di nessuno e di tutti, come i proverbi migliori. Il vostro, però, è più spietato: lì si paga, da noi si aspetta."
    goals: [compare]

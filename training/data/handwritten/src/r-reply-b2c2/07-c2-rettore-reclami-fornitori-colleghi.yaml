# Round 10, set r-reply-b2c2. File 7 (C2): a letter about unpaid seminars, two formal complaints
# at the council, two supplier negotiations, two colleague mediations and a training-academy
# pitch. Errors are the subtle ones a near-native makes (concessives, consecutio, passive with
# «venire», relatives with prepositions, register slips, calques); sophisticated correct turns
# are left alone.
- scenario: email-rettore
  # facts: last semester the learner taught forty hours of seminars for the master's course at the coordinator's request; administration says no pay because no contract was signed before the start; the coordinator's email (12 March) promised the contract within days; she wants payment and the procedure clarified; salutation «Magnifico Rettore»; closing «Ringraziando per l'attenzione, porgo distinti saluti»; draft by Friday, sent on Monday through the protocol office
  level: C2
  persona: en-f-professional
  history: [passive, relative-pronoun]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il semestre scorso ho tenuto un ciclo di quaranta ore di seminari per la laurea magistrale, su richiesta del coordinatore. Ora l'amministrazione sostiene che, non essendo stato firmato un contratto prima dell'inizio, quelle ore non possono essere retribuite."
    - tutor: "Una situazione purtroppo non rara. Che cosa vorrebbe ottenere: il pagamento delle ore, o almeno il loro riconoscimento formale?"
    - learner: "Il pagamento, ovviamente, ma anche che si chiarisca la procedura, perché il coordinatore, di cui conservo l'email, mi aveva garantito che il contratto sarebbe arrivato a giorni."
    - tutor: "Quell'email è il suo asso nella manica: la citi con la data e l'oggetto. Quanto all'apertura, come intende presentarsi?"
      goals: [situation]
    - learner: "Pensavo: «Magnifico Rettore, la sottoscritta, ricercatrice ospite presso il Dipartimento di Lingue, si permette di sottoporre alla Sua attenzione una questione di cui è stata informata con notevole ritardo»."
    - tutor: "Formula impeccabile, e il riferimento al ritardo prepara bene il terreno. Proseguiamo: come ha scritto la richiesta vera e propria?"
      goals: [opening-formula]
    - learner: "Così: «Considerato che le ore sono state svolte, chiedo che mi vengano pagate entro il mese, altrimenti mi vedrò costretta a rivolgermi a un avvocato»."
    - tutor: "La minaccia dell'avvocato, in una prima lettera, rischia di chiudere le porte invece di aprirle. Come potrebbe dire la stessa cosa lasciando al Rettore lo spazio per intervenire?"
    - learner: "«Considerato che le ore sono state regolarmente svolte, confido che Ella vorrà disporne la retribuzione, riservandomi, in mancanza di riscontro, di tutelare i miei diritti nelle sedi opportune»."
    - tutor: "La fermezza c'è tutta, ma il tono resta istituzionale; «Ella», poi, è d'altri tempi, ma a un Rettore non dispiacerà. Per la chiusura, che cosa pensava?"
      goals: [tone]
    - learner: "«Ringraziando per l'attenzione, porgo distinti saluti», poi la firma e il ruolo, con in allegato l'email del coordinatore, che è venuta scritta il 12 marzo."
      errors: [passive]
      gold: {text: "è venuta scritta", fix: "è stata scritta"}
    - tutor: "«È venuta scritta»? Nei tempi composti, il passivo con «venire» non si può formare."
      prompt: {text: "è venuta scritta", tags: [passive]}
    - learner: "Con in allegato l'email del coordinatore, che è stata scritta il 12 marzo."
    - tutor: "Chiusura sobria e corretta, e l'allegato con la data è decisivo. Mi mandi la bozza entro venerdì: la rileggo, e lunedì la facciamo partire tramite il protocollo."
      goals: [closing]

- scenario: reclamo-comune
  # facts: via Manin 22; trench open for two months; last week's rain flooded the cellars of the whole building; clerk's first answer: the firm had problems with a supplier, works resume "as soon as possible"; formal note to the technical office; access-to-documents request, answer within thirty days; damage complaint protocol 6120, access request 6121; inspection requested for Tuesday; if no contact by Wednesday, call extension 315
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use, register]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Le espongo il problema in breve: in via Manin, davanti al civico 22, c'è uno scavo aperto da due mesi, e con le piogge della settimana scorsa l'acqua è filtrata nelle cantine di tutto il palazzo."
    - tutor: "Mi dispiace per le cantine. Mi risulta che la ditta incaricata abbia avuto dei problemi con un fornitore, e che i lavori riprenderanno appena possibile."
      goals: [describe]
    - learner: "«Appena possibile» non è una data, mi perdoni. Benché capisco le difficoltà della ditta, il Comune ha il dovere di vigilare sui cantieri che autorizza."
      errors: [subjunctive-use]
      gold: {text: "Benché capisco", fix: "Benché capisca"}
    - tutor: "«Benché capisco»? Dopo «benché», il verbo non può restare all'indicativo."
      prompt: {text: "Benché capisco", tags: [subjunctive-use]}
    - learner: "Benché capisca le difficoltà della ditta, il Comune ha il dovere di vigilare sui cantieri che autorizza."
    - tutor: "Su questo non posso darle torto. Posso sollecitare l'ufficio tecnico con una nota formale, anche se i tempi della ditta non dipendono da me."
      goals: [insist]
    - learner: "Capisco. A questo punto vorrei sapere quali strumenti ho a disposizione: posso chiedere di vedere il contratto con la ditta e il cronoprogramma dei lavori?"
    - tutor: "Sì, può presentare una richiesta di accesso agli atti: il modulo è questo, e l'ufficio ha trenta giorni per risponderle. Vuole che intanto protocolli anche il reclamo per i danni alle cantine?"
      goals: [rights]
    - learner: "Sì, entrambi. E mi scusi se prima ho alzato un po' la voce: dimmi pure dove devo firmare."
      errors: [register]
      gold: {text: "dimmi pure", fix: "mi dica pure"}
    - tutor: "«Dimmi pure»? Finora ci siamo dati del Lei: quale forma dell'imperativo è coerente?"
      prompt: {text: "dimmi pure", tags: [register]}
    - learner: "Mi dica pure dove devo firmare."
    - tutor: "Qui e qui, grazie. Quanto al tono, non si preoccupi: con l'acqua in cantina, è più che comprensibile."
    - learner: "Grazie. Mi può dare i numeri di protocollo e, se possibile, una data entro cui l'ufficio tecnico farà un sopralluogo?"
    - tutor: "Il reclamo ha il numero 6120 e la richiesta di accesso il 6121. Il sopralluogo lo chiedo per martedì: se entro mercoledì nessuno l'ha contattata, mi chiami all'interno 315."
      goals: [commitment]

- scenario: reclamo-comune
  # facts: learner runs a bakery in via Roma; stopped works outside the window for two months; technical office: works suspended pending a project variation; learner lost almost 40% of takings; written answer requested; council rules give a waste-tax reduction to businesses harmed by public works (form, receipts for the last six months and the same period last year); request for an "open shops" sign; mobile 338 410 7725 and the bakery email; protocol 7042, answer within ten days by email; clerk at the counter every morning except Thursday
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Ho un forno in via Roma, e da due mesi davanti alla mia vetrina c'è un cantiere fermo: transenne, cumuli di terra e nessuno che ci lavori. I clienti non riescono nemmeno a vedere che siamo aperti."
    - tutor: "Una situazione pesante, per un'attività commerciale. L'ufficio tecnico mi dice che il cantiere è sospeso in attesa di una variante al progetto."
      goals: [describe]
    - learner: "Una variante che dura da due mesi? Nel frattempo ho perso quasi il quaranta per cento dell'incasso. Non pretendo miracoli, ma qualcuno deve darmi una data, e la voglio per iscritto."
    - tutor: "Ha diritto a una risposta scritta, e la chiederò formalmente all'ufficio tecnico. Per le attività danneggiate da lavori pubblici, inoltre, il nostro regolamento prevede una riduzione della tassa sui rifiuti: lo sapeva?"
      goals: [insist]
    - learner: "No, nessuno me l'aveva detto. Che cosa serve per chiederla? Ho le ricevute degli ultimi sei mesi: se vuole, gliele porto domani."
    - tutor: "Servono la domanda su questo modulo, le ricevute degli ultimi sei mesi e quelle dello stesso periodo dell'anno scorso, per il confronto. Intanto vuole che protocolli il reclamo sul cantiere?"
      goals: [rights]
    - learner: "Sì, per favore. E vorrei anche che il Comune metta un cartello per dire che i negozi sono aperti: è una cosa che costa poco."
      errors: [subjunctive-use]
      gold: {text: "il Comune metta", fix: "il Comune mettesse"}
    - tutor: "«Vorrei che il Comune metta»? Il condizionale «vorrei» chiede un altro tempo del congiuntivo."
      prompt: {text: "il Comune metta", tags: [subjunctive-use]}
    - learner: "Vorrei che il Comune mettesse un cartello: «I negozi sono aperti»."
    - tutor: "È una richiesta ragionevole, e la aggiungo al reclamo. Mi lascia un recapito per la risposta?"
    - learner: "Il cellulare è il 338 410 7725, e la direzione email è quella del forno, che le scrivo qui."
      errors: [word-choice]
    - tutor: "Segno il cellulare e l'indirizzo email del forno. Il reclamo ha il protocollo 7042: entro dieci giorni riceverà per email la data di ripresa dei lavori, e il cartello lo chiedo già oggi."
      goals: [commitment]
      recast: {text: "la direzione email", fix: "l'indirizzo email", tags: [word-choice]}
    - learner: "Dieci giorni, va bene. Se non arriva niente, torno qui con il numero di protocollo."
    - tutor: "Torni pure, e chieda di me: mi trova a questo sportello tutte le mattine, tranne il giovedì."

- scenario: trattativa-fornitore
  # facts: +15% overnight would eat almost all the margin on bakery products; supplier's cardboard +22% on last year; eight years of collaboration, the learner never contested a price list; learner's offer: lighter board for outer packaging, +7% on the rest, primary packaging unchanged; supplier: +9% with the lighter board; learner: 9% if fixed for twelve months; agreed: 9%, fixed one year, lighter board for outer packaging; proposal within an hour, new list from the first order after signing; CEO signs
  level: C2
  persona: es-f-erasmus
  history: [subjunctive-use, hypothetical]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, e mi creda, non è una telefonata piacevole. Un quindici per cento applicato da un giorno all'altro si mangerebbe quasi tutto il nostro margine sui prodotti da forno."
    - tutor: "La capisco, e non è stata una decisione facile neanche per noi. Ma il cartone, oggi, ci costa il ventidue per cento in più rispetto all'anno scorso."
      goals: [problem]
    - learner: "Non lo metto in dubbio. Però, in otto anni di collaborazione, non abbiamo mai contestato un listino, neppure quando sarebbe stato legittimo farlo: mi sarei aspettata almeno un preavviso."
    - tutor: "Sul preavviso ha ragione, e me ne assumo la responsabilità. Ha una proposta concreta da mettere sul tavolo?"
      goals: [argue]
    - learner: "Per gli imballaggi esterni potremmo passare a un cartone più leggero, che vi costa meno; in cambio, sul resto, accetteremmo il sette per cento. Purché la qualità degli imballaggi primari resta la stessa, naturalmente."
      errors: [subjunctive-use]
      gold: {text: "Purché la qualità degli imballaggi primari resta", fix: "Purché la qualità degli imballaggi primari resti"}
    - tutor: "«Purché la qualità resta»? «Purché» regge sempre lo stesso modo, e non è l'indicativo."
      prompt: {text: "Purché la qualità degli imballaggi primari resta", tags: [subjunctive-use]}
    - learner: "Purché la qualità degli imballaggi primari resti la stessa."
    - tutor: "Il cartone leggero per gli esterni mi aiuta, è vero. Il sette per cento, però, non basta: con quella modifica posso arrivare al nove, non oltre."
      goals: [counteroffer]
    - learner: "Il nove sarebbe accettabile se lo blocchereste per dodici mesi."
      errors: [hypothetical]
      gold: {text: "se lo blocchereste", fix: "se lo bloccaste"}
    - tutor: "«Se lo blocchereste»? Dopo «se» il condizionale non va: quale forma regge questa ipotesi?"
      prompt: {text: "se lo blocchereste", tags: [hypothetical]}
    - learner: "Il nove sarebbe accettabile se lo bloccaste per dodici mesi."
    - tutor: "Un prezzo bloccato per un anno è un impegno importante, ma per un cliente di otto anni posso prenderlo. Mettiamo per iscritto: nove per cento, prezzo fisso per un anno, cartone leggero per gli imballaggi esterni?"
    - learner: "D'accordo. Me la mandi pure, la proposta: appena arriva, la giro all'amministratore delegato per la firma."
    - tutor: "Gliela mando entro un'ora. Il nuovo listino partirà dal primo ordine dopo la firma."
      goals: [agreement]

- scenario: trattativa-fornitore
  # facts: the board has asked the learner to call a tender; supplier's deliveries impeccable; new snack line could double orders next year; learner's offer: +6% now and 3% volume discount above 50,000 pieces a month; clause: if within six months they don't exceed 50,000, the increase rises to 9%; delivery five working days, four for the new line; contract sent tomorrow morning to the learner; board meets Thursday; new terms from the first January order if approved
  level: C2
  persona: en-m-traveller
  history: [false-friend, ci-ne]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Le dirò subito come stanno le cose: un aumento del quindici per cento, per noi, significa rimettere in discussione l'intera fornitura. Il consiglio mi ha già chiesto di indire una gara."
    - tutor: "Una gara è un vostro diritto, naturalmente. Prima di arrivarci, però, vorrei capire che cosa vi tratterrebbe."
      goals: [problem]
    - learner: "Il nostro rapporto, prima di tutto: in questi anni le vostre consegne sono state impeccabili. E poi i volumi: con la nuova linea di snack, l'anno prossimo potremmo raddoppiare gli ordini."
    - tutor: "Raddoppiare gli ordini cambierebbe molto il quadro. Su quali basi vorrebbe ragionare?"
      goals: [argue]
    - learner: "Proporrei un aumento del sei per cento adesso, e uno sconto di volume del tre per cento sopra i cinquantamila pezzi al mese. Così ne beneficeremmo entrambi."
    - tutor: "Il sei per cento mi lascia un margine molto sottile, ma con lo sconto legato ai volumi il ragionamento regge. Che garanzia avrei che quei volumi arrivino davvero?"
      goals: [counteroffer]
    - learner: "Possiamo scriverlo nel contratto: se entro sei mesi non superiamo i cinquantamila pezzi, l'aumento sale al nove per cento. Non voglio pretendere che i vostri costi non siano aumentati; chiedo solo un accordo equo."
      errors: [false-friend]
    - tutor: "Nessuno può fingere che i costi non siano aumentati, è vero, ma la sua clausola è equa. Accetto: sei per cento subito, tre di sconto sopra i cinquantamila pezzi, e nove se entro sei mesi non li raggiungete. Restano da fissare i tempi di consegna."
      recast: {text: "pretendere", fix: "fingere", tags: [false-friend]}
    - learner: "Cinque giorni lavorativi dall'ordine, come adesso. Se per la nuova linea riusciste a garantire quattro, sarebbe ancora meglio."
      errors: [ci-ne]
      gold: {text: "riusciste a garantire quattro", fix: "riusciste a garantirne quattro"}
    - tutor: "«Riusciste a garantire quattro»? Quattro... giorni: serve un pronome che li riprenda, attaccato all'infinito."
      prompt: {text: "riusciste a garantire quattro", tags: [ci-ne]}
    - learner: "Se per la nuova linea riusciste a garantirne quattro, sarebbe ancora meglio."
    - tutor: "Quattro giorni per la nuova linea si possono fare, cinque per il resto. Le preparo il contratto con tutte le condizioni: lo mando a lei o direttamente al consiglio?"
    - learner: "Lo mandi a me, per favore: lo rileggo e lo porto io in consiglio giovedì."
    - tutor: "Glielo mando domattina. Se giovedì il consiglio approva, le nuove condizioni partono dal primo ordine di gennaio."
      goals: [agreement]

- scenario: mediazione-colleghi
  # facts: publishing house; tutor's cover idea for the new series written in the shared document two weeks ago and proposed at Monday's brainstorming, where Davide said it did not convince him; yesterday Davide presented it to the editorial director as his; Davide worked on it over the weekend; solution: final presentation credits both (idea to the tutor, development to Davide), from Monday everyone signs their proposals in the shared document; learner meets both tomorrow morning before the director's meeting
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, preposition]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si accomodi, e mi dica pure: preferisco saperlo da lei piuttosto che sentirlo in corridoio."
    - tutor: "L'idea della copertina per la nuova collana era mia: l'avevo scritta nel documento condiviso due settimane fa. Ieri Davide l'ha presentata al direttore editoriale come se l'avesse avuta lui, e nessuno ha detto niente."
    - learner: "Immagino quanto sia stato spiacevole sentirla presentare da un altro, per di più davanti al direttore. Ha fatto bene a venire subito da me."
    - tutor: "Grazie. Non è una questione di vanità: in questa casa editrice le idee sono l'unica cosa che ci distingue."
      goals: [listen]
    - learner: "La capisco. Per essere sicura di avere il quadro completo: quell'idea era stata discussa anche al brainstorming del lunedì, o era rimasta soltanto nel documento?"
    - tutor: "Ne avevamo parlato al brainstorming, sì, ma l'avevo proposta io, e Davide aveva perfino detto che non lo convinceva."
      goals: [clarify]
    - learner: "Senza voler giustificare nessuno, nei brainstorming le idee finiscono spesso per diventare di tutti; e mi risulta che Davide ci abbia lavorato parecchio nel fine settimana, benché all'inizio non ne era convinto."
      errors: [subjunctive-use]
      gold: {text: "non ne era convinto", fix: "non ne fosse convinto"}
    - tutor: "«Benché all'inizio non ne era convinto»? Dopo «benché», l'indicativo non regge."
      prompt: {text: "non ne era convinto", tags: [subjunctive-use]}
    - learner: "Benché all'inizio non ne fosse convinto, ci ha lavorato parecchio."
    - tutor: "Può darsi che ci abbia lavorato, ma l'idea resta mia. Lei che cosa propone, allora?"
      goals: [perspective]
    - learner: "Due cose. Nella presentazione finale l'idea verrà attribuita a entrambi: a lei l'intuizione, a Davide lo sviluppo. E da lunedì, nel documento condiviso, ognuno firmerà le proprie proposte."
    - tutor: "Attribuirla a entrambi mi sembra onesto, e la firma nel documento è un'ottima regola. Al direttore, però, chi lo spiega?"
      goals: [solution]
    - learner: "Domani mattina convoco a entrambi nel mio ufficio, prima della riunione con il direttore, e poi glielo spiego io."
      errors: [preposition]
      gold: {text: "convoco a entrambi", fix: "convoco entrambi"}
    - tutor: "«Convoco a entrambi»? «Convocare» regge un complemento diretto: quella preposizione è di troppo."
      prompt: {text: "convoco a entrambi", tags: [preposition]}
    - learner: "Domani mattina convoco entrambi nel mio ufficio, e poi al direttore lo spiego io."
    - tutor: "Allora mi fido di lei. Se il direttore avrà dei dubbi, sono pronta a mostrargli il documento con le date."

- scenario: mediazione-colleghi
  # facts: Chiara sent the final client report under her name only; the tutor did the whole data analysis; this morning the client called Chiara to thank her; no page with the team's names; the client asked for a single contact person and the learner named Chiara; solution: learner writes to the client today presenting the team, with the tutor's name next to the analysis; tutor joins the December presentation; learner talks to Chiara
  level: C2
  persona: en-m-retired
  history: [relative-pronoun, register]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, la prego. Vedo che è turbata: mi racconti tutto, senza fretta."
    - tutor: "Il rapporto finale per il cliente l'ha mandato Chiara, solo a suo nome. L'analisi dei dati, però, l'ho fatta io, dalla prima all'ultima tabella. E stamattina il cliente l'ha chiamata per ringraziarla."
    - learner: "Capisco il suo disappunto: un'analisi di quella portata merita di essere riconosciuta, e il cliente avrebbe dovuto saperlo."
    - tutor: "Appunto. Non chiedo applausi, ma nemmeno di sparire."
      goals: [listen]
    - learner: "Una domanda, per capire bene: nel rapporto era prevista una pagina con i nomi del gruppo? E Chiara le aveva detto che l'avrebbe mandato lei?"
    - tutor: "Una pagina con i nomi non c'era, e nessuno l'aveva chiesta. Che l'avrebbe mandato lei lo sapevo, ma pensavo che avrebbe messo anche il mio nome."
      goals: [clarify]
    - learner: "Allora le devo una spiegazione anch'io. È stato il cliente a chiedere un unico referente, e Chiara è la persona che ho affidato i contatti: è probabile che abbia pensato di dover firmare da sola."
      errors: [relative-pronoun]
      gold: {text: "la persona che ho affidato", fix: "la persona a cui ho affidato"}
    - tutor: "«La persona che ho affidato i contatti»? Si affida qualcosa a qualcuno: il relativo deve portarsi dietro la preposizione."
      prompt: {text: "la persona che ho affidato", tags: [relative-pronoun]}
    - learner: "Chiara è la persona a cui ho affidato i contatti con il cliente."
    - tutor: "Questo non lo sapevo, e in parte la scagiona. Resta il fatto che il cliente crede che abbia fatto tutto lei: come rimediamo?"
      goals: [perspective]
    - learner: "Oggi stesso scrivo io al cliente, ringraziandolo e presentandogli il gruppo che ha lavorato al rapporto, con il suo nome accanto all'analisi dei dati. E alla presentazione di dicembre ci sarà anche lei, a illustrare i risultati."
    - tutor: "Per me è più che sufficiente. Lo dice lei a Chiara, o preferisce che le parli io?"
      goals: [solution]
    - learner: "Ci parlo io, ragazza, non ti preoccupare."
      errors: [register]
      gold: {text: "ragazza, non ti preoccupare", fix: "non si preoccupi"}
    - tutor: "«Ragazza, non ti preoccupare»? Finora ci siamo dati del Lei, e il contesto è formale: quale forma serve qui?"
      prompt: {text: "ragazza, non ti preoccupare", tags: [register]}
    - learner: "Mi scusi: ci parlo io, non si preoccupi."
    - tutor: "Grazie. Allora aspetto di vedere la mail al cliente, e intanto comincio a preparare la presentazione di dicembre."

- scenario: presentazione-progetto
  # facts: internal training academy for warehouse staff; today almost a third of new hires leave within the first year; target: turnover from 30% to 20%, about 150,000 euro a year saved on recruitment; retention clause of eighteen months, partial refund if leaving earlier; cost 90,000 euro in the first year for three editions; pilot with twenty people from March, first results in June; detailed calendar and draft clause by Wednesday for the legal office
  level: C2
  persona: es-m-worker
  history: [hypothetical, word-choice]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "La ringrazio. In sintesi: un'accademia interna di formazione per il personale di magazzino, perché oggi perdiamo quasi un terzo dei nuovi assunti entro il primo anno."
    - tutor: "Il turnover in magazzino lo conosco fin troppo bene. Che cosa promette, in numeri?"
      goals: [pitch]
    - learner: "Le aziende del settore che l'hanno introdotta hanno ridotto il turnover di circa un terzo. Nel nostro caso significherebbe passare dal trenta al venti per cento, e risparmiare intorno ai centocinquantamila euro l'anno in costi di selezione."

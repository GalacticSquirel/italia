# Round 10, set r-reply-b2c2. File 8 (C2): an online-sales pitch, a disputed door-and-scooter
# claim, a business dinner gone wrong, a birth record that has not arrived, a transfer request,
# a flat without the parking space, a CRM migration meeting and a seaside wedding. Figures and
# offers stay as first stated; the tutor proposes options and the learner decides.
- scenario: presentazione-progetto
  # facts: online direct-to-consumer channel starting with capsules and accessories for the company's coffee machines; margins about 35% online vs 18% through distributors; target 1.5 million euro turnover by year two; machines stay with distributors; distributors get a percentage on online sales in their area; distributors' council meets in January; feasibility study 15,000 euro, external firm, six weeks; quote sent this afternoon, director signs on Thursday
  level: C2
  persona: en-f-student
  history: [subjunctive-use, combined-pronouns]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "In due parole: proponiamo di aprire un canale di vendita online diretto ai consumatori, partendo da capsule e accessori per le nostre macchine da caffè."
    - tutor: "Vendere direttamente ai consumatori non l'abbiamo mai fatto. Perché adesso, e con quali numeri?"
      goals: [pitch]
    - learner: "Perché i margini sono doppi: sulle capsule vendute online guadagneremmo intorno al trentacinque per cento, contro il diciotto che ci resta passando dai distributori. Contiamo di arrivare a un milione e mezzo di fatturato entro il secondo anno."
    - tutor: "Il problema sono proprio i distributori: se vendiamo online, ce li mettiamo contro. Come pensa di evitarlo?"
      goals: [benefits]
    - learner: "Le macchine continuerebbero a venderle solo loro: online ci sarebbero esclusivamente capsule e accessori. Anzi, proporrei di riconoscere ai distributori una piccola percentuale sulle vendite online nella loro zona, perché nessuno si senta scavalcato."
    - tutor: "Una percentuale ai distributori cambia il discorso. Il loro consiglio si riunisce a gennaio: vorrebbe presentarla lei, la proposta?"
      goals: [objection]
    - learner: "Volentieri, ma prima vorrei che lei mi autorizzi uno studio di fattibilità, per arrivare con dei numeri solidi."
      errors: [subjunctive-use]
      gold: {text: "lei mi autorizzi", fix: "lei mi autorizzasse"}
    - tutor: "«Vorrei che lei mi autorizzi»? Dopo «vorrei», la concordanza chiede un altro tempo del congiuntivo."
      prompt: {text: "lei mi autorizzi", tags: [subjunctive-use]}
    - learner: "Vorrei che lei mi autorizzasse uno studio di fattibilità."
    - tutor: "Quanto costerebbe, lo studio, e in quanto tempo lo avrebbe pronto?"
    - learner: "Quindicimila euro, con una società esterna, e sei settimane di lavoro: se partissimo subito, saremmo pronti prima della riunione di gennaio. Le mando il preventivo oggi pomeriggio: se va bene, mi lo firma entro venerdì?"
      errors: [combined-pronouns]
      gold: {text: "mi lo firma", fix: "me lo firma"}
    - tutor: "«Mi lo firma»? Davanti a «lo», quel «mi» non può restare così."
      prompt: {text: "mi lo firma", tags: [combined-pronouns]}
    - learner: "Me lo firma entro venerdì?"
    - tutor: "Se il preventivo è quello che mi ha detto, glielo firmo giovedì. E a gennaio, al consiglio dei distributori, la voglio lì con lo studio completo."
      goals: [next-steps]

- scenario: assicurazione-sinistro
  # facts: yesterday afternoon, learner parked in via Sant'Anna, opening her door; a scooter overtaking a line of stopped cars hit it; the rider fell, no serious injuries; versions differ; rider refused to sign the constatazione; the vigili took measurements, their report reaches her company within ten days; a woman at the bus stop witnessed it and left her number; door bent almost in half; responsibility percentage decides the bonus-malus class; perito calls within a week
  level: C2
  persona: es-f-erasmus
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri pomeriggio ero parcheggiata in via Sant'Anna e, mentre aprivo la portiera per scendere, uno scooter ci è finito contro. Il ragazzo è caduto, per fortuna senza conseguenze gravi."
    - tutor: "Meno male che il ragazzo sta bene. Prima di aprire la portiera, lei aveva guardato nello specchietto?"
      goals: [what]
    - learner: "Sì, avevo guardato, ma lo scooter stava sorpassando una fila di macchine ferme. Il ragazzo sostiene che io abbia aperto la portiera all'improvviso, mentre io credo che lui avesse sbagliato a sorpassare in quel punto."
      errors: [subjunctive-use]
      gold: {text: "lui avesse sbagliato", fix: "lui abbia sbagliato"}
    - tutor: "«Io credo che lui avesse sbagliato»? Il verbo principale è al presente: il congiuntivo che esprime il fatto anteriore va concordato con quello."
      prompt: {text: "lui avesse sbagliato", tags: [subjunctive-use]}
    - learner: "Io credo che lui abbia sbagliato a sorpassare in quel punto."
    - tutor: "Quando le versioni non coincidono, spesso si arriva a un concorso di colpa. Avete compilato la constatazione amichevole?"
      goals: [responsibility]
    - learner: "No, lui si è rifiutato di firmarla. Però sono arrivati i vigili, che hanno fatto i rilievi, e mi hanno detto che il verbale verrà trasmesso alla mia compagnia entro dieci giorni."
    - tutor: "Il verbale dei vigili pesa più di qualsiasi constatazione. Ci sono dei testimoni, oltre a voi due?"
    - learner: "Sì, una signora che aspettava l'autobus ha visto tutto e mi ha lasciato il suo numero. Mi ha detto che lo scooter ha corso tantissimo, passando a pochi centimetri dalle macchine."
      errors: [tense-aspect]
      gold: {text: "lo scooter ha corso", fix: "lo scooter correva"}
    - tutor: "«Lo scooter ha corso tantissimo»? La signora descrive come andava lo scooter in quel momento: quale tempo serve?"
      prompt: {text: "lo scooter ha corso", tags: [tense-aspect]}
    - learner: "Mi ha detto che lo scooter correva tantissimo."
    - tutor: "Una testimone indipendente è preziosa: mi detti il suo numero, la contatteremo noi. Ha altre domande, prima che io apra il sinistro?"
      goals: [documents]
    - learner: "Sì. Se risultasse un concorso di colpa, la mia classe di merito peggiorerebbe? E chi paga la portiera, che è stata piegata quasi a metà?"
    - tutor: "Dipende dalla percentuale di responsabilità che verrà stabilita: se prevalesse la sua, la classe peggiorerebbe; se prevalesse quella del ragazzo, no. La portiera la valuterà il perito, che la chiamerà entro una settimana."
      goals: [next]

- scenario: recensione-ristorante
  # facts: business dinner with important guests; tasting menu with wine pairing at 90 euro per person booked; the sommelier proposed a Barolo without giving the price, 180 euro on the provisional bill; the next table has been celebrating a birthday loudly for two hours; she had said on the phone it was a business dinner; offer: remove the difference between the Barolo and the pairing, digestif in the back room (free tonight); learner accepts the wine correction, declines the digestif; back room reserved next time
  level: C2
  persona: en-m-heritage
  history: [register, word-choice]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Le chiedo scusa se la faccio venire al tavolo, ma stasera ho ospiti importanti, e preferirei risolvere la questione con discrezione."
    - tutor: "Ci mancherebbe, sono qui apposta. Mi dica pure."
    - learner: "Avevamo prenotato il menù degustazione con l'abbinamento dei vini, a novanta euro a persona. Il sommelier, invece, ci ha proposto una bottiglia di Barolo senza dirci il prezzo, e solo adesso, dal conto provvisorio, scopro che costa centottanta euro."
    - tutor: "Se il prezzo non vi è stato comunicato, l'errore è nostro. C'è stato altro che non ha funzionato?"
      goals: [complain]
    - learner: "Sì, purtroppo: il tavolo accanto festeggia un compleanno da due ore, a un volume che rende impossibile qualsiasi conversazione. I miei ospiti sono troppo educati per lamentarsene, ma l'imbarazzo si taglia col coltello."
    - tutor: "Me ne rendo conto: per una cena di lavoro è quanto di peggio potesse capitare. Che cosa si sarebbe aspettato da noi?"
      goals: [detail]
    - learner: "Mi sarei aspettato che il sommelier ci avvisasse del prezzo, e che ci venisse proposto un tavolo più tranquillo, visto che al telefono avevo specificato che si trattava di una cena d'affari."
    - tutor: "Aspettative più che legittime. Le propongo di togliere dal conto la differenza tra il Barolo e l'abbinamento previsto, e di offrirvi un digestivo nella saletta interna, che stasera è libera. Le va bene?"
      goals: [expectation]
    - learner: "La differenza sul vino la accetto volentieri, grazie. Il digestivo, invece, lasci stare: i miei ospiti hanno un treno presto domattina. Ah, e di' al sommelier che il Barolo era comunque eccellente."
      errors: [register]
      gold: {text: "di' al sommelier", fix: "dica al sommelier"}
    - tutor: "«Di' al sommelier»? Con il responsabile di sala sta usando il Lei: come diventa l'imperativo?"
      prompt: {text: "di' al sommelier", tags: [register]}
    - learner: "Mi scusi: dica al sommelier che il Barolo era comunque eccellente."
    - tutor: "Glielo riferirò, ne sarà felice. Le porto subito il conto corretto, e la prossima volta, per una cena di lavoro, le riserviamo la saletta interna."
      goals: [resolve]

- scenario: burocrazia-residenza
  # facts: ticket 47; learner's daughter born three weeks ago at Novara hospital, birth declared there; not yet in the family record here, needed for parental leave; birth record must come from Novara; hospital declaration in order; clerk requests it by certified email, about ten days; employer needs a document by Friday: certificate that the procedure is in progress with the protocol number; certificates online with SPID or at the counter Monday to Friday mornings
  level: C2
  persona: es-m-worker
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Mia figlia è nata tre settimane fa all'ospedale di Novara, e la nascita è stata dichiarata lì. Qui, però, dove siamo residenti, non risulta ancora nel nostro stato di famiglia, e mi serve per il congedo parentale."
    - tutor: "Congratulazioni, innanzitutto. Succede spesso: l'atto di nascita deve arrivarci da Novara, e talvolta ci vogliono settimane. Ha con sé una copia della dichiarazione fatta in ospedale?"
      goals: [request]
    - learner: "Ce l'ho qui, insieme ai nostri documenti. Mi avevano assicurato che tutto sarebbe stato trasmesso automaticamente nel giro di pochi giorni, e invece..."
    - tutor: "La dichiarazione è in regola, ma l'atto vero e proprio da Novara non ci è ancora arrivato. Posso sollecitarlo io, oppure lei può chiedere a Novara un estratto da portarci a mano: che cosa preferisce?"
      goals: [documents]
    - learner: "Preferirei che lo sollecita lei, se non le dispiace: con una neonata in casa, andare fino a Novara non è il massimo."
      errors: [subjunctive-use]
      gold: {text: "lo sollecita lei", fix: "lo sollecitasse lei"}
    - tutor: "«Preferirei che lo sollecita lei»? Dopo «preferirei che», il verbo deve cambiare modo e tempo."
      prompt: {text: "lo sollecita lei", tags: [subjunctive-use]}
    - learner: "Preferirei che lo sollecitasse lei. Quanto tempo ci vorrebbe, più o meno?"
    - tutor: "Con una richiesta per posta certificata, di solito una decina di giorni. Appena l'atto arriva, sua figlia viene iscritta nello stato di famiglia."
      goals: [problem]
    - learner: "Dieci giorni vanno bene. Il mio empleador, però, ha bisogno di un documento per il congedo entro venerdì: è possibile che nel frattempo si rilasci qualcosa di provvisorio?"
      errors: [word-choice]
    - tutor: "Per il suo datore di lavoro posso rilasciarle un'attestazione che la pratica è in corso, con il numero di protocollo della richiesta a Novara: per il congedo, di solito, basta."
      recast: {text: "empleador", fix: "datore di lavoro", tags: [word-choice]}
    - learner: "Perfetto. E una volta iscritta mia figlia, il certificato si chiede online o devo tornare allo sportello?"
    - tutor: "Può chiederlo online, con lo SPID, oppure qui, senza appuntamento, dal lunedì al venerdì mattina."
      goals: [next]
    - learner: "Grazie mille. Allora aspetto l'attestazione, e fra dieci giorni controllo online."
    - tutor: "Gliela preparo subito, mi dia cinque minuti. E ancora auguri per la bambina."

- scenario: colloquio-promozione
  # facts: Spanish market, almost lost two years ago, grew 40% this year, noticed by the board; learner asks to move to Madrid as country manager; he also coordinates the export team in Milan, nobody ready to replace him; plan: six months' transition, two weeks a month in Madrid and two in Milan, travel paid by the company; Paola as successor; manager talks to HR this week, formal decision in February; check-in at the end of January; transition plan by Friday
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use, false-friend]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Grazie, le rubo solo qualche minuto. Come sa, quest'anno il mercato spagnolo, che due anni fa sembrava perso, è cresciuto del quaranta per cento, e credo che i risultati parlino da soli."
    - tutor: "Parlano da soli, è vero, e sono stati notati anche in consiglio. Dove vuole arrivare?"
      goals: [results]
    - learner: "Vorrei proporle di trasferirmi a Madrid come responsabile per la Spagna. Seguire il mercato da Milano funziona, ma da lì potrei consolidare i rapporti con i distributori in modo ben diverso."
    - tutor: "Non nego che abbia senso. Il problema è che qui a Milano lei coordina anche il gruppo export, e non ho nessuno pronto a sostituirla da domani."
      goals: [request]
    - learner: "Lo so, e ci ho pensato. Potrei fare sei mesi di transizione, dividendomi tra Milano e Madrid, finché Paola non sarà in grado di prendere il mio posto: è la persona più preparata del gruppo, a patto che le si dia fiducia."
    - tutor: "Paola è un'ottima candidata, su questo concordo. Sei mesi a metà tempo, però, sono pesanti: come li organizzerebbe?"
      goals: [handle]
    - learner: "Due settimane al mese a Madrid e due a Milano, con le spese di viaggio a carico dell'azienda. Mi sembra il solo modo di non lasciare scoperto nessuno, a meno che lei non preferisce aspettare la fine dell'anno."
      errors: [subjunctive-use]
      gold: {text: "lei non preferisce", fix: "lei non preferisca"}
    - tutor: "«A meno che lei non preferisce»? «A meno che» regge un modo preciso, e non è l'indicativo."
      prompt: {text: "lei non preferisce", tags: [subjunctive-use]}
    - learner: "A meno che lei non preferisca aspettare la fine dell'anno."
    - tutor: "No, aspettare non conviene a nessuno. Ne parlo con le risorse umane questa settimana, e per una decisione formale penso a febbraio. Le sta bene?"
    - learner: "Febbraio mi sta benissimo. Nel frattempo, se è d'accordo, comincerei a educare Paola, così da guadagnare tempo."
      errors: [false-friend]
    - tutor: "Formare Paola fin da ora è una buona idea, e le può dire che ne abbiamo parlato. Ci rivediamo a fine gennaio per fare il punto prima della decisione."
      goals: [next-steps]
      recast: {text: "educare Paola", fix: "formare Paola", tags: [false-friend]}
    - learner: "Benissimo, grazie. Entro venerdì le mando un piano della transizione, mese per mese."
    - tutor: "Lo leggo volentieri. Se il piano regge, a febbraio la proposta in consiglio la porto io."

- scenario: trattativa-affitto
  # facts: bright, quiet flat near the learner's school; rent 1,300 euro including a parking space she doesn't need; she proposes 1,150 without it; contract 4+4 with six months' notice; compromise: three months for a documented job transfer, also when she requested it; owner accepts everything on condition that his grandmother's furniture stays in the cellar; cellar stays accessible for bikes; proposal sent tonight, signing at the agency on Thursday
  level: C2
  persona: es-f-teacher
  history: [combined-pronouns, subject-verb-agreement]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Molto, devo dire: luminoso, silenzioso e a due passi dalla scuola in cui insegno. Un solo punto mi lascia perplessa, ed è il posto auto: io non ho la macchina, e pagarlo mi sembra uno spreco."
    - tutor: "Il canone di 1300 euro comprende il posto auto, è vero. Il proprietario potrebbe affittarlo a parte: quanto le sembrerebbe giusto pagare, senza?"
      goals: [interest]
    - learner: "Direi 1150. I garage, da queste parti, si affitta facilmente a centocinquanta euro al mese."
      errors: [subject-verb-agreement]
      gold: {text: "si affitta", fix: "si affittano"}
    - tutor: "«I garage si affitta»? Con il «si» passivante il verbo concorda con il soggetto: qual è, qui?"
      prompt: {text: "si affitta", tags: [subject-verb-agreement]}
    - learner: "I garage, da queste parti, si affittano facilmente, quindi il proprietario non ci perderebbe niente."
    - tutor: "Il ragionamento fila, e glielo propongo. Lui, però, tiene molto a un contratto lungo: un quattro più quattro, con sei mesi di preavviso."
    - learner: "Il quattro più quattro mi va bene. Sei mesi di preavviso, invece, sono troppi: se venissi trasferita in un'altra scuola, lo saprei soltanto a luglio, per settembre."
    - tutor: "Tre mesi in caso di trasferimento documentato potrebbero essere un compromesso. Vuole che lo metta per iscritto come clausola?"
      goals: [negotiate]
    - learner: "Sì, ma vorrei che la clausola valesse anche se il trasferimento dipendesse da una mia richiesta. Se mi lo garantisse, firmerei anche domani."
      errors: [combined-pronouns]
      gold: {text: "Se mi lo garantisse", fix: "Se me lo garantisse"}
    - tutor: "«Se mi lo garantisse»? Davanti a «lo», «mi» non resta così."
      prompt: {text: "Se mi lo garantisse", tags: [combined-pronouns]}
    - learner: "Se me lo garantisse, firmerei anche domani."
    - tutor: "Credo che possa accettare, purché il trasferimento sia documentato. Lo chiamo adesso e le riferisco subito."
      goals: [conditions]
    - learner: "Allora, che cosa ha detto?"
    - tutor: "Accetta tutto: canone a 1150, posto auto escluso, e la clausola dei tre mesi. Pone soltanto una condizione: che in cantina restino i mobili di sua nonna, che non sa dove mettere."
    - learner: "Purché la cantina mi resti accessibile per le biciclette, accetto volentieri: i mobili della nonna non mi danno alcun fastidio."
    - tutor: "Allora siamo d'accordo. Le mando la proposta stasera stessa, e possiamo firmare in agenzia già giovedì."
      goals: [conclude]

- scenario: riunione-lavoro
  # facts: CRM migration, about 70% of data migrated; 12,000 duplicate customer records built up over the years; proposal: block manual entry for two days over the weekend and run a script that merges duplicates, the rest checked by hand on Monday; go-live slips by one week; learner emails sales tonight; Federica tells management tomorrow at the 9:00 meeting; new date sent to everyone tonight
  level: C2
  persona: es-m-worker
  history: [conditional-form, tense-aspect]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Diciamo che siamo a buon punto, ma non ancora in dirittura d'arrivo: abbiamo migrato circa il settanta per cento dei dati."
    - tutor: "Il settanta per cento non è poco. Che cosa vi rallenta sul restante trenta?"
      goals: [update]
    - learner: "I duplicati. Mentre controllavamo i dati dei clienti, abbiamo scoperto dodicimila schede doppie, che si erano accumulate negli anni perché ognuno inseriva i clienti a modo suo."
    - tutor: "Dodicimila sono tantissime: se le migriamo così, il nuovo sistema nasce già sporco. Hai una proposta?"
      goals: [problem]
    - learner: "Bloccherei l'inserimento manuale per due giorni, durante il fine settimana, e farei girare uno script che unisca le schede doppie. Quelle che lo script non riconosce le controlliamo a mano lunedì."
    - tutor: "Mi piace, ma bloccare l'inserimento vuol dire avvisare il commerciale con largo anticipo. Di quanto slitterebbe la messa in produzione?"
      goals: [proposal]
    - learner: "Di una settimana, non di più. Se avessimo scoperto i duplicati prima, avremmo potuto evitarlo, ma ormai è andata così."
    - tutor: "Una settimana si può difendere con la direzione, se la motiviamo bene. Al commerciale scrivi tu, o lo faccio io?"
    - learner: "Scrivo io stasera. Ma ti chiederei di dirlo tu alla direzione: io sono l'ultimo arrivato, e a me darebbero poca retta."
    - tutor: "Alla direzione ci penso io, domani alla riunione delle nove. Allora siamo d'accordo: messa in produzione spostata di una settimana?"
    - learner: "D'accordo. E se lo script dovesse dare problemi durante il fine settimana, vi avvisassi subito in chat."
      errors: [conditional-form]
      gold: {text: "vi avvisassi", fix: "vi avviserei"}
    - tutor: "«Vi avvisassi subito»? Questa è la frase principale: il congiuntivo qui non può stare."
      prompt: {text: "vi avvisassi", tags: [conditional-form]}
    - learner: "Se lo script dovesse dare problemi, vi avviserei subito in chat."
    - tutor: "Così siamo coperti. Segno la nuova data nel piano del progetto e la giro a tutti entro stasera."
      goals: [deadline]

- scenario: organizzare-matrimonio
  # facts: seaside wedding at the end of September, about 120 guests (English friends and the groom's relatives); budget 60,000 euro all included; options: castle on the headland 8,000 rent + catering 120/person (22,400) or beach club, no rent, catering 140/person (16,800), tent if it rains about 3,000 more; they choose the castle; brunch the next morning +1,500 euro; conditions: no disposable plastic, local suppliers (flowers, wine, fish); payments one third at signing, one third in June, balance after the wedding; detailed quote by Friday
  level: C2
  persona: en-f-student
  history: [relative-pronoun, word-choice]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Lo immaginiamo sul mare, a fine settembre, quando la luce è più morbida e i turisti se ne sono andati. Saremo circa centoventi, tra amici inglesi e parenti di lui."
    - tutor: "Fine settembre è una scelta saggia, sia per la luce sia per i prezzi. Avete già fissato un tetto di spesa?"
      goals: [vision]
    - learner: "Sessantamila euro, tutto compreso, e ci terremmo a non sforarli: preferiamo spendere meno per la festa e qualcosa in più per la luna di miele."
    - tutor: "È un tetto realistico, per centoventi invitati. Ho due proposte: un castello sul promontorio, con 8000 euro di affitto e il catering a 120 euro a persona, oppure uno stabilimento balneare, senza affitto, con il catering a 140 euro."
      goals: [budget]
    - learner: "Facendo i conti, il castello costerebbe 22.400 euro e lo stabilimento 16.800. La differenza non è da poco, ma il castello ha un salone in cui ripararsi se piove, cosa che sulla spiaggia, a fine settembre, non è da escludere."
    - tutor: "È proprio il punto debole dello stabilimento: in caso di pioggia, l'unica soluzione sarebbe un tendone, con circa tremila euro in più. Avete una preferenza?"
    - learner: "Anche con il tendone lo stabilimento resterebbe più economico, ma il castello è il castello. Lo prendiamo, a condizione che l'affitto comprenda anche la mattina dopo, per un brunch con chi resta a dormire."
    - tutor: "Il brunch del giorno dopo il castello lo concede, con un supplemento di 1500 euro. Ci sono altre condizioni che volete fissare con me?"
      goals: [choices]
    - learner: "Sì, due a cui teniamo molto: niente plastica usa e getta, e fornitori locali. Fiori, vino e pesce della zona, di cui i nostri amici inglesi apprezzerebbero moltissimo."
      errors: [relative-pronoun]
      gold: {text: "di cui i nostri amici inglesi apprezzerebbero", fix: "che i nostri amici inglesi apprezzerebbero"}
    - tutor: "«Di cui apprezzerebbero»? «Apprezzare» regge un complemento diretto: il relativo deve adeguarsi."
      prompt: {text: "di cui i nostri amici inglesi apprezzerebbero", tags: [relative-pronoun]}

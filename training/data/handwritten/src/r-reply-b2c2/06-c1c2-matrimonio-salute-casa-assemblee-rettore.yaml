# Round 10, set r-reply-b2c2. File 6: C1 a second wedding, a cardiology follow-up and a friend
# facing the end of home working; C2 three heated building meetings and two letters to the
# rector. The administrator voices the other residents and puts proposals to the vote only in
# the learner's own terms; the university administrator offers formulas and lets the learner
# choose.
- scenario: organizzare-matrimonio
  # facts: second marriage for both; town-hall ceremony and lunch for about thirty, children and grandchildren included; budget max 15,000 euro; options: historic restaurant 90 euro/person all-in (2,700) or villa garden 2,500 rent + catering 70/person (4,600); learner's mother, 91, in a wheelchair; garden has gravel paths, restaurant on the ground floor with an accessible toilet; they choose the restaurant; conditions: only a pianist (the planner knows him), menu agreed dish by dish at a tasting on a Saturday in March, date communicated by the end of January (his daughter flies from London)
  level: C1
  persona: en-m-retired
  history: [subjunctive-use, combined-pronouns]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Per tutti e due è il secondo matrimonio, quindi niente di sfarzoso: una cerimonia in comune e un pranzo con una trentina di persone, figli e nipoti compresi."
    - tutor: "Un matrimonio intimo, dunque, che spesso è il più bello. Avete pensato a quanto volete spendere?"
      goals: [vision]
    - learner: "Pensavamo a quindicimila euro al massimo. La mia futura moglie vorrebbe spendere anche meno, ma io le ho detto che un bel pranzo ce lo meritiamo."
    - tutor: "Con trenta invitati è un budget più che sufficiente. Vi propongo due soluzioni: un ristorante storico in centro, a 90 euro a persona tutto compreso, oppure il giardino di una villa, con 2500 euro di affitto più il catering a 70 euro a persona."
      goals: [budget]
    - learner: "Facendo due conti, il ristorante costerebbe 2700 euro e la villa 4600. La villa è incantevole, però mia madre ha novantun anni ed è in carrozzina: c'è il rischio che il giardino non sia accessibile?"
    - tutor: "Il giardino ha dei vialetti di ghiaia, piuttosto scomodi con la carrozzina. Il ristorante, invece, è al piano terra e ha un bagno accessibile. Volete che fissi una visita in tutti e due i posti?"
    - learner: "Non serve: per mia madre scegliamo il ristorante. Se ci fosse stato un giardino senza ghiaia, avremmo preferito la villa, ma pazienza."
    - tutor: "Una scelta pensata per chi conta di più. Prima di prenotare, ci sono delle condizioni che volete mettere nel contratto?"
      goals: [choices]
    - learner: "Sì: niente musica ad alto volume, solo un pianista. E vorrei che il menù venga concordato con noi, piatto per piatto."
      errors: [subjunctive-use]
      gold: {text: "il menù venga concordato", fix: "il menù venisse concordato"}
    - tutor: "«Vorrei che il menù venga concordato»? Con «vorrei» nella principale, il congiuntivo presente non va: quale tempo chiede la concordanza?"
      prompt: {text: "il menù venga concordato", tags: [subjunctive-use]}
    - learner: "Vorrei che il menù venisse concordato con noi, piatto per piatto."
    - tutor: "Il pianista lo conosco, suona spesso in quel ristorante; il menù, invece, lo decidiamo insieme durante una prova di assaggio. Ve la fisso per un sabato di marzo?"
    - learner: "Un sabato di marzo va bene, ma ci lo comunichi con un po' di anticipo, perché mia figlia viene da Londra."
      errors: [combined-pronouns]
      gold: {text: "ci lo comunichi", fix: "ce lo comunichi"}
    - tutor: "«Ci lo comunichi»? Davanti a «lo», «ci» cambia vocale."
      prompt: {text: "ci lo comunichi", tags: [combined-pronouns]}
    - learner: "Ce lo comunichi con un po' di anticipo, per favore: deve prenotare il volo."
    - tutor: "Ve lo comunico entro la fine di gennaio, così sua figlia ha tutto il tempo per il volo. Nel contratto scrivo il pianista, niente musica alta e il menù da concordare insieme."
      goals: [conditions]

- scenario: medico-specialista
  # facts: patient feels the heart skip a beat, mostly in the evening lying down, rarely on effort; worse with more than two coffees a day, last week four and a sleepless night; mother has atrial fibrillation since about sixty; 24-hour Holter shows only extrasystoles, no fibrillation; first step: max one coffee a day, none after lunch; if no better in a month, a light drug (low dose: some tiredness, cold hands in the first weeks, cycling usually fine); green tea one cup a day; new Holter prescribed, check-up in three months
  level: C1
  persona: en-m-heritage
  history: [ci-ne, subjunctive-use]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Buongiorno, dottoressa. Meglio di prima, ma ogni tanto sento ancora il cuore che salta un colpo, soprattutto la sera, quando sono sdraiato."
    - tutor: "È una sensazione che descrivono in molti. Le capita anche sotto sforzo, per esempio salendo le scale o facendo sport?"
    - learner: "Quasi mai. Ho notato, però, che peggiora quando bevo più di due caffè al giorno: la settimana scorsa ho bevuto quattro, e la notte non ho chiuso occhio."
      errors: [ci-ne]
      gold: {text: "ho bevuto quattro", fix: "ne ho bevuti quattro"}
    - tutor: "«Ho bevuto quattro»? Quattro... caffè: davanti al verbo serve un pronome che li riprenda."
      prompt: {text: "ho bevuto quattro", tags: [ci-ne]}
    - learner: "Ne ho bevuti quattro, e la notte non ho chiuso occhio."
    - tutor: "Il caffè è un indizio prezioso. In famiglia ci sono stati problemi di ritmo cardiaco?"
      goals: [symptoms]
    - learner: "Sì, mia madre soffre di fibrillazione atriale da quando aveva sessant'anni. Per questo, quando ho cominciato ad avere questi sintomi, sono venuto subito."
    - tutor: "Ha fatto bene a dirmelo. L'Holter delle ventiquattro ore, comunque, mostra solo delle extrasistoli, cioè dei battiti in più, senza segni di fibrillazione."
      goals: [history]
    - learner: "Quindi non è niente di grave? Pensavo che la mia situazione è più seria, visto quello che è successo a mia madre."
      errors: [subjunctive-use]
      gold: {text: "la mia situazione è", fix: "la mia situazione fosse"}
    - tutor: "«Pensavo che la mia situazione è»? Dopo «pensavo che», il verbo cambia modo, e il tempo deve seguire il passato."
      prompt: {text: "la mia situazione è", tags: [subjunctive-use]}
    - learner: "Pensavo che la mia situazione fosse più seria."
    - tutor: "È comprensibile, ma per ora le extrasistoli sono benigne e molto comuni. La prima cura è semplice: non più di un caffè al giorno, e niente dopo pranzo. Se fra un mese non migliora, valutiamo un farmaco leggero."
      goals: [understand]
    - learner: "E che effetti collaterali avrebbe, quel farmaco? Vado molto in bici e non vorrei ritrovarmi senza fiato."
    - tutor: "A dosi basse, al massimo un po' di stanchezza e mani fredde nelle prime settimane; con la bici, di solito, nessun problema. Ci rivediamo fra tre mesi, con un nuovo Holter."
      goals: [treatment]
    - learner: "Va bene. Un'ultima domanda: il tè verde lo posso bere, o ha lo stesso effetto?"
    - tutor: "Anche il tè verde contiene caffeina, ma meno del caffè: una tazza al giorno va bene. Le prescrivo subito il nuovo Holter, così lo prenota già oggi."

- scenario: smartworking
  # facts: learner works from home three days out of five until December; from January the company wants four days in the office; he takes his children to school and picks them up at four; the neighbour has been drilling for three months; Andrea knows the drilling problem; learner would ask for two days in the office and three at home; on Monday he talks to two colleagues with the same problem and they write to HR; Andrea offers to read the letter
  level: C1
  persona: es-m-worker
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Fino a dicembre lavoro da casa tre giorni su cinque. Ma da gennaio l'azienda vuole che torniamo in ufficio quattro giorni, e la cosa non mi entusiasma per niente."
    - tutor: "Quattro giorni su cinque è quasi un ritorno al passato. Che cosa perderesti di più, lavorando meno da casa?"
      goals: [situation]
    - learner: "Il tempo con i bambini, soprattutto. Adesso li porto io a scuola e alle quattro sono lì a prenderli; con l'ufficio dovrei pagare qualcuno che li vada a prendere."
    - tutor: "Altro che vantaggio: è un pezzo di vita. Però, sinceramente, a casa riesci davvero a concentrarti?"
      goals: [pros]
    - learner: "Non sempre. Il vicino sta facendo delle obras da tre mesi e trapana tutto il giorno; e poi mi mancano le chiacchiere con i colleghi alla macchinetta del caffè."
      errors: [word-choice]
    - tutor: "Un vicino che fa dei lavori da tre mesi è una tortura, lo so bene anch'io. Se potessi trattare con l'azienda, che cosa chiederesti?"
      goals: [cons]
      recast: {text: "delle obras", fix: "dei lavori", tags: [word-choice]}
    - learner: "Due giorni in ufficio e tre a casa. Bisogna che la direzione capisce che non siamo tutti uguali: chi ha figli piccoli ha altre esigenze."
      errors: [subjunctive-use]
      gold: {text: "la direzione capisce", fix: "la direzione capisca"}
    - tutor: "«Bisogna che la direzione capisce»? Dopo «bisogna che», il verbo non può restare all'indicativo."
      prompt: {text: "la direzione capisce", tags: [subjunctive-use]}
    - learner: "Bisogna che la direzione capisca che non siamo tutti uguali."
    - tutor: "Detto così, è un argomento forte. Perché non provi a mettere per iscritto una proposta, magari con altri colleghi nella tua stessa situazione?"
      goals: [preference]
    - learner: "Buona idea. Lunedì ne parlo con due colleghe che hanno lo stesso problema, e prepariamo una lettera per le risorse umane."
    - tutor: "Fammela leggere prima di mandarla, se vuoi: con le lettere formali me la cavo bene."

- scenario: assemblea-condominio
  # facts: façade estimate 180,000 euro, to approve tonight, six instalments within the year; signor Repetto (third floor) sarcastic about falling cornices; learner's alternative: make balconies and cornices safe now (about 25,000 from the estimate), full renovation postponed to the spring meeting with at least two new estimates from other firms; signora Ferraro objects prices will rise; Repetto insinuates the learner wants to sell, she has lived there fifteen years; vote: 18 in favour out of 22, safety works start in January
  level: C2
  persona: en-f-professional
  history: [word-choice, false-friend]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Premetto che nessuno qui nega che la facciata abbia bisogno di un intervento. Ma un preventivo di centottantamila euro, da approvare stasera e pagare in sei rate entro l'anno, per molte famiglie del palazzo è semplicemente insostenibile."
    - tutor: "Prendo nota. Il signor Repetto, dal terzo piano, mi fa notare che «chi non vuole spendere, poi non si lamenti quando gli cade un pezzo di cornicione in testa»."
      goals: [position]
    - learner: "Capisco la preoccupazione del signor Repetto, e la condivido più di quanto creda. Proprio per questo propongo di non fare tutto e subito: se avessimo fatto controllare i balconi l'anno scorso, oggi non ci troveremmo a decidere sotto pressione."
    - tutor: "Una risposta che abbassa i toni, grazie. Concretamente, allora, che cosa propone in alternativa?"
      goals: [defuse]
    - learner: "Di approvare subito la messa in sicurezza di balconi e cornicioni, che dal preventivo vale circa venticinquemila euro, e di rimandare il rifacimento completo alla primavera, così da non fare una decisione affrettata."
      errors: [word-choice]
    - tutor: "Prendere una decisione affrettata su una cifra simile, in effetti, non conviene a nessuno. La signora Ferraro, però, obietta che fra qualche mese i prezzi saranno più alti: come le risponde?"
      goals: [alternative]
      recast: {text: "fare una decisione", fix: "prendere una decisione", tags: [word-choice]}
    - learner: "Che è possibile, ma tutt'altro che certo; e se nel frattempo si liberassero dei fondi pubblici per le facciate, potremmo perfino risparmiare. Mi sembra la scelta più sensibile per tutti."
      errors: [false-friend]
    - tutor: "La scelta più sensata, dice lei; il signor Repetto, invece, insinua che lei voglia rimandare soltanto perché pensa di vendere l'appartamento."
      recast: {text: "più sensibile", fix: "più sensata", tags: [false-friend]}
    - learner: "Non è così, e mi stupisce che lo pensi: abito qui da quindici anni e conto di restarci. Ma se anche fosse, non vedo che cosa c'entri con la sicurezza dei balconi."
    - tutor: "Allora la formulo così: messa in sicurezza subito, per venticinquemila euro, e rifacimento completo rinviato all'assemblea di primavera, con almeno due nuovi preventivi. Le va bene?"
    - learner: "Sì, purché si aggiunga che i nuovi preventivi andranno chiesti a imprese diverse da quella di stasera."
    - tutor: "Aggiunto a verbale. Con diciotto voti favorevoli su ventidue la proposta passa: la messa in sicurezza parte a gennaio, e del resto si riparlerà in primavera."
      goals: [compromise]

- scenario: assemblea-condominio
  # facts: lift works paid last year; learner not against the façade works, against the timing; first-floor resident (damp problems) says those who can't pay should sell; learner's alternative: scaffolding once, two lots (street side this year, courtyard next year); signor Bianchi fears higher prices on the second lot; second option: approve everything tonight, twelve instalments instead of six; the firm confirmed twelve instalments with no increase; instalments start in March; minuted, then vote
  level: C2
  persona: es-f-teacher
  history: [hypothetical, passive]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Grazie, amministratore. Vorrei dire con molta calma che, dopo l'ascensore dell'anno scorso, chiederci un'altra spesa di questa portata nel giro di dodici mesi mi sembra eccessivo. Non sono contraria ai lavori: sono contraria ai tempi."
    - tutor: "Il suo punto è chiaro. La signora del primo piano, però, sta dicendo, e non proprio a bassa voce, che chi non può pagare farebbe meglio a vendere e andarsene."
      goals: [position]
    - learner: "Capisco che la signora sia esasperata dalle infiltrazioni, e ha tutte le ragioni di esserlo. Ma qui nessuno vuole lasciare il palazzo così com'è: stiamo discutendo di come pagare, non di se pagare."
    - tutor: "Grazie per il tono. Allora, lei come organizzerebbe i lavori, concretamente?"
      goals: [defuse]
    - learner: "Se il ponteggio verrebbe montato una volta sola, si potrebbero dividere i lavori in due lotti: quest'anno la facciata sulla strada, che è la più rovinata, e l'anno prossimo quella sul cortile."
      errors: [hypothetical]
      gold: {text: "verrebbe montato", fix: "venisse montato"}
    - tutor: "«Se il ponteggio verrebbe montato»? Dopo «se», in un'ipotesi come questa, il condizionale non è ammesso, nemmeno al passivo."
      prompt: {text: "verrebbe montato", tags: [hypothetical]}
    - learner: "Sì, scusi: se il ponteggio sarebbe montato una volta sola, si potrebbero dividere i lavori in due lotti."
      errors: [hypothetical]
    - tutor: "Se il ponteggio fosse montato una volta sola, il noleggio durerebbe di più, ma dividere i lavori in due lotti si può. Il signor Bianchi, però, teme che così l'impresa alzi i prezzi del secondo lotto."
      goals: [alternative]
      recast: {text: "sarebbe montato", fix: "fosse montato", tags: [hypothetical]}
    - learner: "È un timore legittimo, ma basterebbe bloccare nel contratto il prezzo di tutti e due i lotti. In alternativa, si potrebbe approvare tutto stasera e chiedere all'impresa di farsi pagare in dodici rate invece che in sei."
    - tutor: "Prima della riunione l'impresa mi ha confermato che accetterebbe le dodici rate senza aumenti. Vuole che metta ai voti questa seconda soluzione?"
    - learner: "Sì, la prego, e che a verbale risulti anche che le rate partiranno da marzo, non da gennaio, per dare respiro a chi ha appena pagato l'ascensore."
    - tutor: "Così sia: lavori approvati, dodici rate a partire da marzo, tutto a verbale. Se non ci sono altri interventi, passiamo al voto."
      goals: [compromise]

- scenario: assemblea-condominio
  # facts: estimate 180,000 euro, scaffolding alone 40,000; dottor Gatti's sarcasm about residents who become building experts on meeting night; learner's alternative: independent engineer with no links to the firm, two found, cheapest 2,000 euro for a full survey; signora Rossi fears delay and price changes; estimate price guaranteed until the end of February; plan: engineer appointed within the week, survey within thirty days, then an extraordinary meeting to vote; fee split by thousandths; learner's name minuted
  level: C2
  persona: en-m-retired
  history: [ci-ne, word-choice]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Non sono un tecnico, ma ho letto il preventivo con attenzione: il solo ponteggio vale quarantamila euro. Mi chiedo se non ci sia un margine di trattativa, prima di impegnare il condominio."
    - tutor: "Il preventivo è di centottantamila euro, e il ponteggio pesa parecchio, è vero. Il dottor Gatti, però, le ricorda con un certo sarcasmo che «gli esperti di edilizia si scoprono sempre la sera dell'assemblea»."
      goals: [position]
    - learner: "Il dottor Gatti ha ragione: esperto non lo sono affatto, e non pretendo di esserlo. Proprio per questo vorrei che lo dicesse qualcuno che se ne intende davvero, prima di firmare."
    - tutor: "Mi pare un modo elegante di chiudere la polemica. A chi pensa, esattamente?"
      goals: [defuse]
    - learner: "A un ingegnere indipendente, che non abbia rapporti con l'impresa. Ho chiesto in giro e ho trovato due: il più economico chiede duemila euro per una perizia completa."
      errors: [ci-ne]
      gold: {text: "ho trovato due", fix: "ne ho trovati due"}
    - tutor: "«Ho trovato due»? Due... ingegneri: quel numero, da solo, ha bisogno di un pronome davanti al verbo."
      prompt: {text: "ho trovato due", tags: [ci-ne]}
    - learner: "Ne ho trovati due, e il più economico chiede duemila euro per una perizia completa."
    - tutor: "Duemila euro su centottantamila sono poca cosa, lo riconosco. La signora Rossi, però, teme che così si perdano altri mesi e che l'impresa non tenga fermo il prezzo."
      goals: [alternative]
    - learner: "Nel preventivo il prezzo è garantito fino a fine febbraio: se l'ingegnere consegnasse la perizia entro trenta giorni, avremmo tutto il tempo di decidere. Mi sembra il modo più economico di salvare capra e cavoli."
    - tutor: "Allora formulo così: incarico all'ingegnere entro la settimana, perizia entro trenta giorni, e poi un'assemblea straordinaria per il voto. È d'accordo?"
    - learner: "D'accordo, a condizione che il compenso dell'ingegnere sia ripartito per millesimi, come le altre spese, e che il verbale riporti il nome di chi l'ha proposto: se sbaglio, la responsabilità è mia."
    - tutor: "Messo a verbale, con il suo nome, e con il compenso ripartito per millesimi. La proposta passa con la maggioranza dei presenti: entro la settimana contatto l'ingegnere."
      goals: [compromise]

- scenario: email-rettore
  # facts: visiting researcher in the Physics department since March; excluded from the research funds call because his appointment was registered late by the office, not by him; he has the emails proving it; salutation «Magnifico Rettore»; draft passages read aloud; closing chosen: «In attesa di cortese riscontro, porgo distinti saluti»; full draft by tonight with the emails attached, returned tomorrow morning with notes
  level: C2
  persona: en-m-heritage
  history: [register, combined-pronouns]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno, e grazie di ricevermi. Sono ricercatore ospite al dipartimento di Fisica da marzo. Sono stato escluso dal bando per i fondi di ricerca perché la mia nomina risultava registrata in ritardo, ma il ritardo era dell'ufficio, non mio: ho le email che lo dimostrano."
    - tutor: "Con quelle email il suo caso è solido. Cominciamo dall'intestazione: come pensava di rivolgersi al Rettore?"
      goals: [situation]
    - learner: "Pensavo a «Gentile Rettore», come si fa con un professore."
    - tutor: "«Gentile» è cortese, ma con il Rettore la tradizione vuole «Magnifico Rettore». Subito dopo serve una formula d'apertura: lei come comincerebbe?"
    - learner: "«Magnifico Rettore, mi permetto di sottoporre alla Sua cortese attenzione la mia esclusione dal bando...». Può andare?"
    - tutor: "Può andare benissimo, ed è nel registro giusto. Mi legga ora il passaggio centrale, quello che le sta più a cuore."
      goals: [opening-formula]
    - learner: "Ho scritto: «È inaccettabile che un errore dei vostri uffici ricada su di me, e pretendo che la decisione venga annullata subito»."
    - tutor: "Il contenuto è giusto, ma il tono rischia di irrigidire chi deve decidere. Provi a riformularlo come una richiesta argomentata, partendo dai fatti."
    - learner: "Vediamo: «Mi permetto di far presente che il ritardo nella registrazione della mia nomina non è a me imputabile, come risulta dalla corrispondenza allegata, e chiedo pertanto che la decisione possa essere riconsiderata». Mi sembra quasi troppo morbido."
    - tutor: "Morbido nella forma, ma fermo nella sostanza: è esattamente ciò che serve. Resta la chiusura: che formula aveva in mente?"
      goals: [tone]
    - learner: "Pensavo di finire con «Ti ringrazio in anticipo e ti saluto cordialmente»."
      errors: [register]
      gold: {text: "Ti ringrazio in anticipo e ti saluto", fix: "La ringrazio in anticipo e La saluto"}
    - tutor: "«Ti ringrazio... ti saluto»? Pensi a chi legge: con un Rettore, quella confidenza non è possibile."
      prompt: {text: "Ti ringrazio in anticipo e ti saluto", tags: [register]}
    - learner: "Ha ragione: «La ringrazio in anticipo e La saluto cordialmente»."
    - tutor: "Ora il registro è quello giusto. Per un Rettore, però, si usano di solito formule più solenni, come «In attesa di cortese riscontro, porgo distinti saluti» oppure «Con osservanza». Quale preferisce?"
    - learner: "«In attesa di cortese riscontro, porgo distinti saluti», senz'altro. Stasera finisco la bozza: mi la potrebbe rileggere domani?"
      errors: [combined-pronouns]
      gold: {text: "mi la potrebbe rileggere", fix: "me la potrebbe rileggere"}
    - tutor: "Ottima scelta per la chiusura. Riascolti però «mi la potrebbe rileggere»: davanti a «la», quel «mi» cambia vocale."
      goals: [closing]
      prompt: {text: "mi la potrebbe rileggere", tags: [combined-pronouns]}
    - learner: "Me la potrebbe rileggere domani mattina?"
    - tutor: "Volentieri: me la mandi stasera, con le email allegate, e domattina gliela restituisco con le mie note."

- scenario: email-rettore
  # facts: last month the department council rejected the learner's extension as a visiting researcher, citing lack of funds; a colleague in the same situation was granted it; her project is funded externally by a Spanish body; she wants a review (istanza di riesame); salutation «Magnifico Rettore»; closing chosen; full text with the decision and the Spanish body's letter by Thursday; protocolled Friday morning; replies usually within a month
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il mese scorso il consiglio di dipartimento ha respinto la mia richiesta di proroga come ricercatrice ospite, adducendo la mancanza di fondi. Il problema è che a un collega nella mia identica situazione la proroga è stata concessa."

# Round 10, set r-reply-b2c2. File 3: B2 wedding planning, a cardiology follow-up, home working
# with a friend and a radio interview; C1 a neighbourhood debate and a radio phone-in. The
# planner and the doctor state what their role knows; the friend and the hosts push the talk on.
- scenario: organizzare-matrimonio
  # facts: couple (learner and Giulia), informal outdoor party in June, about 80 guests; budget 25,000 euro including photographer and flowers; venues: lake villa 110 euro/person (8,800 for 80) or hill agriturismo 85 euro/person (6,800); they choose the agriturismo; visit Saturday at 10; a friend of Giulia takes the photos as a gift; conditions: an update every Friday, no extra spending without their yes
  level: B2
  persona: en-m-heritage
  history: [subjunctive-use, false-friend]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Io e Giulia vorremmo una festa casuale, all'aperto, con circa ottanta invitati. A giugno, se possibile."
      errors: [false-friend]
    - tutor: "Una festa informale all'aperto, a giugno, la sognano in tanti, quindi conviene muoversi presto. Avete già un'idea del budget?"
      goals: [vision]
      recast: {text: "casuale", fix: "informale", tags: [false-friend]}
    - learner: "Pensavamo a venticinquemila euro in tutto, compresi il fotografo e i fiori."
    - tutor: "Con ottanta invitati è un budget ragionevole. Vi propongo due posti: una villa sul lago, a 110 euro a persona, oppure un agriturismo in collina, a 85 euro. Quale vi attira di più?"
      goals: [budget]
      new: [{lemma: agriturismo, gloss: farm-stay venue}]
    - learner: "La villa sul lago sembra bellissima, ma 110 euro per ottanta persone sono quasi novemila euro. È troppo."
    - tutor: "Il conto è giusto. In collina, invece, spendereste 6800 euro, e resterebbe più spazio per il resto. Volete pensarci, o avete già deciso?"
    - learner: "L'agriturismo l'avevamo già visto sul sito, e a Giulia piaceva tantissimo. Scegliamo quello. Possiamo visitarlo prima di firmare?"
    - tutor: "Certo, il proprietario fa vedere il posto il sabato mattina. Vi prenoto per sabato prossimo alle dieci?"
      goals: [choices]
    - learner: "Sì, sabato va bene. Il fotografo, invece, non serve: un amico di Giulia ci fa le foto come regalo."
    - tutor: "Un bel regalo, e un bel risparmio. Prima di cominciare, ci sono delle condizioni che volete mettere nel contratto?"
    - learner: "Sì, due. Vorremmo che lei ci manda un aggiornamento ogni settimana, e che non spende niente fuori dal budget senza chiedercelo."
      errors: [subjunctive-use]
      gold: {text: "ci manda", fix: "ci mandasse"}
    - tutor: "«Vorremmo che lei ci manda»? Dopo «vorremmo che», il verbo non può restare così: deve cambiare modo. E vale anche per il secondo verbo."
      prompt: {text: "ci manda", tags: [subjunctive-use]}
    - learner: "Vorremmo che lei ci mandasse un aggiornamento ogni settimana, e che non spendesse niente senza chiedercelo."
    - tutor: "Lo scrivo nel contratto: un aggiornamento ogni venerdì, e nessuna spesa in più senza il vostro sì. Allora ci vediamo sabato alle dieci, in collina."
      goals: [conditions]

- scenario: organizzare-matrimonio
  # facts: small city wedding, about 40 guests, many from Spain; budget 12,000 euro; venues: restaurant in the centre with a private room 60 euro/person, or hotel terrace 75 euro/person (smaller indoor room if it rains); six children, children's menu 30 euro; restaurant has a small garden; chef always prepares vegetarian dishes; payment half at signing, half one week before; restaurant open until 2:00
  level: B2
  persona: es-f-erasmus
  history: [ci-ne, article-form]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Vogliamo un matrimonio piccolo, in città, con più o meno quaranta invitati. Molti vengono dalla Spagna."
    - tutor: "Un matrimonio in città è comodo per chi arriva da lontano. Quanto pensate di spendere, più o meno?"
      goals: [vision]
    - learner: "Il nostro budget è di dodicimila euro. Però non so se basta, perché non ho idea di quanto costa un matrimonio in Italia."
    - tutor: "Per quaranta persone basta, se scegliamo bene. Ho due proposte: un ristorante in centro con una sala solo per voi, a 60 euro a persona, oppure la terrazza di un hotel, a 75 euro. Quale preferite?"
      goals: [budget]
    - learner: "La terrazza è più romantica, però se piove? I miei nonni sono molto anziani."
    - tutor: "Se piove, l'hotel apre una sala interna, ma è più piccola e meno bella. Il ristorante, invece, non ha questo problema. Ci saranno anche dei bambini?"
    - learner: "Sì, avremo sei, i figli dei miei cugini. Allora forse è meglio il ristorante."
      errors: [ci-ne]
      gold: {text: "avremo sei", fix: "ne avremo sei"}
    - tutor: "«Avremo sei»? Sei... bambini: davanti al verbo serve un pronome che li riprenda."
      prompt: {text: "avremo sei", tags: [ci-ne]}
    - learner: "Ne avremo sei. Scegliamo il ristorante."
    - tutor: "Il ristorante ha anche un piccolo giardino, perfetto per i bambini, e per loro c'è un menù a 30 euro. Volete mettere qualche condizione, prima di firmare?"
      goals: [choices]
    - learner: "Sì: il menù deve avere anche dei piatti vegetariani, perché mia sorella non mangia carne. E vorrei pagare in due volte."
    - tutor: "Per i vegetariani nessun problema, lo chef li prepara sempre. Per il pagamento possiamo fare metà alla firma e metà una settimana prima del matrimonio: va bene?"
    - learner: "Sì, va bene. Un'altra cosa: la sala è libera fino a tardi? I spagnoli ballano fino alle tre!"
      errors: [article-form]
      gold: {text: "I spagnoli", fix: "Gli spagnoli"}
    - tutor: "«I spagnoli»? Davanti a «spagnoli», come davanti a «studenti», l'articolo è diverso."
      prompt: {text: "I spagnoli", tags: [article-form]}
    - learner: "Gli spagnoli ballano fino alle tre!"
    - tutor: "Il ristorante resta aperto fino alle due, non di più. Lo scrivo nel contratto, insieme ai piatti vegetariani e al pagamento in due volte."
      goals: [conditions]

- scenario: medico-specialista
  # facts: patient (male) tired, stops twice on the stairs to the third floor; heart beats hard at night two or three times a week, wakes him; no chest pain; father had a heart attack at sixty, now 75 and well; ECG normal; blood pressure 150/95; one pill (medicina) every morning; first days possible dizziness, sometimes swollen feet; check-up in two months
  level: B2
  persona: es-m-worker
  history: [tense-aspect, subjunctive-use]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Buongiorno, dottore. Mi sento sempre stanco. Quando faccio le scale per arrivare a casa, al terzo piano, devo fermarmi due volte."
    - tutor: "Quindi l'affaticamento arriva con lo sforzo. Ha notato anche il battito accelerato, o dolore al petto?"
    - learner: "Dolore no. Però la notte, due o tre volte alla settimana, il cuore batte molto forte e mi sveglio."
    - tutor: "Grazie, è molto chiaro. In famiglia qualcuno ha avuto problemi di cuore?"
      goals: [symptoms]
    - learner: "Sì, mio padre ha avuto un infarto quando ha avuto sessant'anni."
      errors: [tense-aspect]
      gold: {text: "quando ha avuto sessant'anni", fix: "quando aveva sessant'anni"}
    - tutor: "«Quando ha avuto sessant'anni»? L'età qui descrive la situazione di quel momento: quale tempo serve?"
      prompt: {text: "quando ha avuto sessant'anni", tags: [tense-aspect]}
    - learner: "Quando aveva sessant'anni. Adesso ne ha settantacinque e sta bene."
    - tutor: "È un dato importante, che spiega perché la teniamo sotto controllo. Vuole che le spieghi i risultati degli esami?"
      goals: [history]
    - learner: "Sì, per favore. L'elettrocardiogramma è andato bene? L'infermiera mi ha detto che era normale."
    - tutor: "L'elettrocardiogramma è normale, sì. La pressione, invece, è alta, 150 su 95, e può spiegare perché si sente stanco."
      goals: [understand]
    - learner: "Quindi devo prendere delle medicine? Ho paura che mi fanno male allo stomaco."
      errors: [subjunctive-use]
      gold: {text: "mi fanno male", fix: "mi facciano male"}
    - tutor: "«Ho paura che mi fanno male»? Dopo «ho paura che», il verbo cambia modo."
      prompt: {text: "mi fanno male", tags: [subjunctive-use]}
    - learner: "Ho paura che mi facciano male allo stomaco."
    - tutor: "Questa medicina, di solito, lo stomaco non lo disturba. Nei primi giorni può far girare un po' la testa, e a volte fa gonfiare i piedi. La prende una volta al giorno, la mattina."
      new: [{lemma: gonfiare, gloss: to swell}]
    - learner: "E se mi gira la testa, devo smettere di prenderla?"
    - tutor: "No, non la smetta da solo: mi chiami, e decidiamo insieme. Ci rivediamo fra due mesi per un controllo della pressione."
      goals: [treatment]

- scenario: smartworking
  # facts: learner works only from home for a Dutch company with no office in Italy, works from the living room; used to spend an hour getting to the office; misses colleagues, work never ends; would prefer three days in a coworking space and two at home; Andrea goes to the office every day; a new coworking space has opened near Andrea's office
  level: B2
  persona: en-m-traveller
  history: [piacere, comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Da casa, sempre. La mia azienda è olandese e in Italia non ha un ufficio, quindi lavoro dal soggiorno."
    - tutor: "Io in ufficio ci vado tutti i giorni, e a volte vorrei essere al tuo posto. Qual è la cosa più bella, per te?"
      goals: [situation]
    - learner: "Non perdo tempo nel traffico. Prima ci mettevo un'ora per arrivare in ufficio, e adesso mi organizzo gli orari come voglio."
    - tutor: "Un'ora di traffico in meno al giorno è tantissimo. Ma senza colleghi intorno non ti senti un po' solo?"
      goals: [pros]
    - learner: "Sì, un po'. Io manco i colleghi, soprattutto le pause caffè."
      errors: [piacere]
      gold: {text: "Io manco i colleghi", fix: "Mi mancano i colleghi"}
    - tutor: "«Io manco i colleghi»? «Mancare» funziona come «piacere»: chi è il soggetto, qui?"
      prompt: {text: "Io manco i colleghi", tags: [piacere]}
    - learner: "Mi mancano i colleghi. E il lavoro non finisce mai, perché il computer è sempre lì."
    - tutor: "Questo è il rischio vero: la casa diventa l'ufficio. Se potessi scegliere, come organizzeresti la settimana?"
      goals: [cons]
    - learner: "Preferirei lavorare tre giorni in un coworking e due da casa. Il coworking è più caro che il mio soggiorno, ma almeno vedo gente."
      errors: [comparative]
      gold: {text: "più caro che il mio soggiorno", fix: "più caro del mio soggiorno"}
    - tutor: "«Più caro che il mio soggiorno»? Qui confronti due nomi: «che» non è la parola giusta."
      prompt: {text: "più caro che il mio soggiorno", tags: [comparative]}
    - learner: "Il coworking è più caro del mio soggiorno, ma almeno vedo gente."
    - tutor: "Hai ragione, vedere gente conta. Vicino al mio ufficio ne hanno aperto uno nuovo: domani ti mando il nome, così qualche volta pranziamo insieme."
      goals: [preference]

- scenario: smartworking
  # facts: learner teaches three days at school and two days online from home; on home days she takes her daughter to school and avoids the 7:00 train; many students keep cameras off; she would prefer to teach always in class and correct homework at home on Fridays; Andrea works only from home; she will talk to the head teacher next week
  level: B2
  persona: es-f-teacher
  history: [adjective-agreement, preposition]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Un po' e un po'. Tre giorni insegno a scuola, e due giorni faccio lezione online da casa."
    - tutor: "Quindi hai tutte e due le cose. Io, ormai, lavoro solo da casa: tu cosa apprezzi dei giorni online?"
      goals: [situation]
    - learner: "La mattina posso accompagnare mia figlia a scuola, e non devo prendere il treno delle sette."
    - tutor: "Il treno delle sette non manca a nessuno. E le lezioni online come vanno? Gli studenti seguono?"
      goals: [pros]
    - learner: "Non sempre. Molti tengono la telecamera spenta, e così le lezioni sono molto stancante per me."
      errors: [adjective-agreement]
      gold: {text: "molto stancante", fix: "molto stancanti"}
    - tutor: "«Le lezioni sono molto stancante»? L'aggettivo si riferisce a «lezioni», che è plurale."
      prompt: {text: "molto stancante", tags: [adjective-agreement]}
    - learner: "Le lezioni sono molto stancanti, perché parlo con dei quadrati neri."
    - tutor: "Parlare a dei quadrati neri dev'essere terribile. Se potessi scegliere liberamente, cambieresti qualcosa?"
      goals: [cons]
    - learner: "Sì. Preferirei insegnare sempre in classe, e lavorare da casa solo il venerdì, per correggere i compiti."
    - tutor: "Mi sembra una buona soluzione, per te e per gli studenti. Ne hai già parlato a scuola?"
      goals: [preference]
    - learner: "Non ancora. Penso a parlarne con la direttrice la settimana prossima."
      errors: [preposition]
      gold: {text: "Penso a parlarne", fix: "Penso di parlarne"}
    - tutor: "«Penso a parlarne»? Qui «pensare» vuol dire «avere intenzione»: davanti all'infinito, la preposizione non è «a»."
      prompt: {text: "Penso a parlarne", tags: [preposition]}
    - learner: "Penso di parlarne con la direttrice la settimana prossima."
    - tutor: "Fai bene a non aspettare. Poi fammi sapere che cosa ti risponde, magari davanti a un altro aperitivo."

- scenario: vita-in-italia
  # facts: learner and wife moved to Umbria five years ago when they retired; had holidayed there for thirty years; registering their English car took six trips to the office, then they sold it and bought an Italian one; he became more patient and learnt to cook; advice: learn the language before leaving; misses tea and his grandchildren, who visit only in summer
  level: B2
  persona: en-m-retired
  history: [auxiliary-choice, participle-agreement]
  turns:
    - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a tutti. Io e mia moglie ci siamo trasferiti in Umbria cinque anni fa, quando siamo andati in pensione. Ci venivamo in vacanza da trent'anni."
    - tutor: "Trent'anni di vacanze: l'Umbria, quindi, la conoscevate bene. Che cosa è stato più difficile, una volta trasferiti?"
      goals: [story]
    - learner: "Senza dubbio la burocrazia. Per la targa italiana della nostra macchina inglese sono andato sei volte in ufficio, e alla fine l'abbiamo venduto."
      errors: [participle-agreement]
      gold: {text: "l'abbiamo venduto", fix: "l'abbiamo venduta"}
    - tutor: "«L'abbiamo venduto»? Quel «l'» sostituisce «la macchina»: anche il verbo deve essere al femminile."
      prompt: {text: "l'abbiamo venduto", tags: [participle-agreement]}
    - learner: "Alla fine l'abbiamo venduta, e ne abbiamo comprata una italiana."
    - tutor: "Sei volte in ufficio: credo che molti ascoltatori la capiscano benissimo. E lei, in questi cinque anni, è cambiato?"
      goals: [difficulties]
    - learner: "Sì, molto. Ho diventato più paziente, e ho imparato a cucinare."
      errors: [auxiliary-choice]
      gold: {text: "Ho diventato", fix: "Sono diventato"}
    - tutor: "«Ho diventato»? Con «diventare», al passato prossimo, «avere» non va bene."
      prompt: {text: "Ho diventato", tags: [auxiliary-choice]}
    - learner: "Sono diventato più paziente. In Inghilterra non cucinavo mai: mia moglie diceva che ero un disastro."
    - tutor: "Un inglese che impara a cucinare in Umbria: è una bella storia. Che consiglio darebbe a chi vuole trasferirsi in Italia?"
      goals: [change]
    - learner: "Gli consiglierei di imparare la lingua prima di partire. Senza l'italiano è difficile integrarsi davvero."
    - tutor: "Un consiglio prezioso. Prima di salutarci, c'è qualcosa che le manca ancora dell'Inghilterra?"
      goals: [advice]
    - learner: "Il tè come lo facciamo noi! E i miei nipoti, naturalmente, che vengono a trovarci solo d'estate."
    - tutor: "Allora speriamo che i nipoti la vengano a trovare presto. Grazie di essere stato con noi, e buona vita in Umbria."

- scenario: dibattito-ambiente
  # facts: learner favours closing the centre to cars, at least at weekends; opponent: shopkeepers in via Roma depend on drivers from the outskirts; learner proposes more public transport and park-and-ride with a shuttle; compromise: weekends only, six-month trial, assessed with the shopkeepers
  level: C1
  persona: en-f-professional
  history: [relative-pronoun, word-choice]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco la preoccupazione, ma io sono favorevole alla chiusura, almeno nei fine settimana. Il centro storico non è stato costruito per le macchine."
    - tutor: "Bella frase, ma i commercianti di via Roma vivono anche di chi arriva in macchina dalla periferia. Con quali argomenti li convincerebbe?"
      goals: [position]
    - learner: "Innanzitutto, dove sono state introdotte le zone pedonali, spesso le vendite sono aumentate: la gente cammina, si ferma, guarda le vetrine. In secondo luogo, l'inquinamento in centro è ormai insostenibile, soprattutto per i bambini."
    - tutor: "Sarà, ma gli esempi che si citano vengono quasi sempre da grandi città del nord Europa, non da un centro come il nostro. E chi abita fuori, senza un autobus decente, come ci arriva?"
      goals: [argue]
    - learner: "È proprio qui che deve intervenire il Comune: bisognerebbe potenziare i mezzi pubblici e creare dei parcheggi scambiatori a cui si possa lasciare la macchina e prendere una navetta."
      errors: [relative-pronoun]
      gold: {text: "a cui si possa lasciare", fix: "in cui si possa lasciare"}
    - tutor: "«Parcheggi a cui si possa lasciare la macchina»? La macchina la si lascia in un luogo: la preposizione davanti a «cui» va rivista."
      prompt: {text: "a cui si possa lasciare", tags: [relative-pronoun]}
    - learner: "Dei parcheggi scambiatori in cui si possa lasciare la macchina e prendere una navetta per il centro."
    - tutor: "Sulla carta funziona, lo ammetto. Ma finché la navetta non c'è, i negozi intanto chiudono: non le pare un rischio concreto?"
      goals: [counter]
    - learner: "Il rischio esiste, ma il suo argomento non fa senso fino in fondo: già oggi molti negozi del centro soffrono, perché nessuno trova parcheggio."
      errors: [word-choice]
    - tutor: "Dire che non ha senso mi sembra un po' forte, anche se è vero che a volte si gira mezz'ora per trovare un posto. Allora, concretamente, che cosa propone per non danneggiare chi lavora qui?"
      recast: {text: "non fa senso", fix: "non ha senso", tags: [word-choice]}
    - learner: "Su questo le do ragione: chiudere tutto da un giorno all'altro sarebbe imprudente. Propongo di cominciare con i soli fine settimana, per sei mesi, e di valutare con i commercianti come vanno gli incassi."
    - tutor: "Una prova di sei mesi, con i commercianti al tavolo, è più ragionevole di quanto mi aspettassi. Se stasera la mette ai voti, potrei perfino votare a favore."
      goals: [concede]

- scenario: turismo-di-massa
  # facts: caller Lucía, Spanish student, has lived in Venice for two years; against the entry ticket; in her area the baker, the haberdasher and the hardware shop have closed since she arrived, replaced by souvenir shops and short lets; host's objection: the ticket discourages day-trippers; her proposal: daily cap with compulsory booking and incentives to rent to residents
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-use, word-choice]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno! Mi chiamo Lucía, sono una studentessa spagnola e vivo a Venezia da due anni. Sono contraria, perché temo che il ticket trasformi la città in un parco a tema."
    - tutor: "Un'immagine forte, Lucía. Ma che cosa glielo fa pensare, concretamente?"
      goals: [introduce]
    - learner: "Nel mio quartiere, da quando sono arrivata, hanno chiuso il fornaio, la merceria e il ferramenta: al loro posto ci sono negozi di souvenir e affitti brevi. Il ticket non cambia niente di tutto questo."
    - tutor: "Eppure c'è chi sostiene che, facendo pagare chi resta solo qualche ora, si scoraggino proprio i visitatori mordi e fuggi. Non le sembra almeno un primo passo?"
      goals: [example]
    - learner: "Mi sembra un argomento debole. Molti di quei visitatori arrivano in crociera, e chi ha pagato un billete da mille euro non si spaventa per cinque euro."
      errors: [word-choice]
    - tutor: "Chi ha già pagato un biglietto da mille euro, in effetti, non si ferma per cinque. Ma il ticket non potrebbe essere almeno un segnale?"
      recast: {text: "un billete", fix: "un biglietto", tags: [word-choice]}
    - learner: "Non credo che il ticket cambia molto: è un segnale, d'accordo, ma senza conseguenze."
      errors: [subjunctive-use]
      gold: {text: "il ticket cambia", fix: "il ticket cambi"}
    - tutor: "«Non credo che il ticket cambia»? Dopo «non credo che», il verbo cambia modo."
      prompt: {text: "il ticket cambia", tags: [subjunctive-use]}
    - learner: "Non credo che il ticket cambi molto: è un segnale, ma senza conseguenze reali."
    - tutor: "Su questo, lo ammetto, è difficile darle torto. E allora, se lei fosse il sindaco, che cosa farebbe al posto del ticket?"
      goals: [rebut]
    - learner: "Metterei un numero massimo di visitatori al giorno, con prenotazione obbligatoria, e darei incentivi a chi affitta le case ai residenti invece che ai turisti. Così i giovani come me potrebbero restare."
    - tutor: "Numero chiuso e affitti ai residenti: due proposte chiare, che i nostri ascoltatori potranno commentare in diretta. Grazie, Lucía, e buona giornata a Venezia."
      goals: [proposal]

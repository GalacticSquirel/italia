# y-prep, file 06: B1, verb-governed prepositions (cominciare a, decidere di, interessarsi a), dates, articulated forms.
- scenario: reclamo-hotel
  level: B1
  persona: es-f-erasmus
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, sono nella camera 212 e l'aria condizionata non funziona."
    - tutor: "Mi dispiace molto. Da quando non funziona?"
      goals: [problem]
    - learner: "Da ieri sera. Ho chiamato a la reception due volte, ma nessuno è venuto."
      errors: [preposition]
    - tutor: "Mi scusi tanto. Però «ho chiamato a la reception»: il verbo chiamare vuole davvero una preposizione?"
      prompt: {text: "a la reception", tags: [preposition]}
    - learner: "Ho chiamato la reception due volte."
    - tutor: "Esatto, e le chiedo scusa. Di notte purtroppo non c'è nessuno che possa ripararla."
      goals: [since]
    - learner: "Allora potrei cambiare abitazione? Fa troppo caldo per dormire."
      errors: [false-friend]
    - tutor: "Purtroppo non posso cambiarle camera, l'hotel è pieno. Ma posso darle un ventilatore."
      recast: {text: "abitazione", fix: "camera", tags: [false-friend]}
      goals: [request]
      new: [{lemma: ventilatore, gloss: fan}]
    - learner: "Un ventilatore? Va bene, ma domani vorrei uno sconto su la camera."
      errors: [articulated-preposition]
    - tutor: "Ha ragione. Uno sconto «su la camera»? Ci pensi un attimo."
      prompt: {text: "su la camera", tags: [articulated-preposition]}
    - learner: "Uno sconto su camera?"
      errors: [articulated-preposition]
    - tutor: "Certo, domani le facciamo uno sconto sulla camera del venti per cento."
      recast: {text: "su camera", fix: "sulla camera", tags: [articulated-preposition]}
      goals: [agree]
    - learner: "Grazie, è molto gentile. Buonanotte."
    - tutor: "Buonanotte, e mi scusi ancora."

- scenario: restituire-prodotto
  level: B1
  persona: en-m-traveller
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato queste cuffie qui una settimana fa, ma non funzionano bene."
    - tutor: "Mi dispiace. Che problema hanno, esattamente?"
    - learner: "Il suono esce solo da una parte. Dipende sul cavo, credo."
      errors: [preposition]
    - tutor: "«Dipende sul cavo»? Pensi al verbo dipendere: che preposizione vuole?"
      prompt: {text: "Dipende sul cavo", tags: [preposition]}
    - learner: "Dipende dal cavo."
    - tutor: "Esatto, probabilmente sì. Ha lo scontrino?"
      goals: [problem]
    - learner: "Sì, eccolo. Le ho comprato il 3 marzo."
      errors: [participle-agreement]
    - tutor: "Grazie. «Le ho comprato»: attenzione, le cuffie sono femminili e plurali..."
      prompt: {text: "Le ho comprato", tags: [participle-agreement]}
    - learner: "Le ho comprate il 3 marzo."
    - tutor: "Perfetto, allora sono ancora in garanzia. Preferisce il rimborso o un altro paio?"
      goals: [proof]
    - learner: "Preferisco cambiarle. Sono interessato in un altro modello, quello senza filo."
      errors: [preposition]
    - tutor: "Interessato «in»? Mmm, provi un'altra preposizione."
      prompt: {text: "interessato in", tags: [preposition]}
    - learner: "Interessato su un altro modello?"
      errors: [preposition]
    - tutor: "Ah, è interessato a un altro modello! Quello senza filo costa venti euro in più."
      recast: {text: "Interessato su", fix: "interessato a", tags: [preposition]}
      goals: [request]
    - learner: "Va bene, pago la differenza."
    - tutor: "Perfetto, allora facciamo il cambio subito."
      goals: [agree]

- scenario: riunione-lavoro
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Va bene. Ho finito di preparare la presentazione per il cliente."
    - tutor: "Ottimo! Ci sono problemi?"
      goals: [update]
    - learner: "Sì, uno: il cliente non risponde a le nostre email da una settimana."
      errors: [articulated-preposition]
    - tutor: "Capisco. «A le nostre email»: ci pensi un momento?"
      prompt: {text: "a le nostre email", tags: [articulated-preposition]}
    - learner: "Non risponde alle nostre email."
    - tutor: "Esatto. È un bel problema. Cosa proponi?"
      goals: [problem]
    - learner: "Penso di chiamarlo domani. Se non risponde, posso andare in il suo ufficio."
      errors: [articulated-preposition]
    - tutor: "Andare «in il suo ufficio»? Attenzione, è come prima."
      prompt: {text: "in il suo ufficio", tags: [articulated-preposition]}
    - learner: "Andare in suo ufficio."
      errors: [articulated-preposition]
    - tutor: "Sì, andare nel suo ufficio è una buona idea, è qui vicino."
      recast: {text: "in suo ufficio", fix: "nel suo ufficio", tags: [articulated-preposition]}
      goals: [proposal]
    - learner: "Allora possiamo consegnare tutto tra due settimane?"
    - tutor: "Va bene: tra due settimane, cioè venerdì 20."
      goals: [deadline]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Lavoro in un ufficio tutto il giorno e la sera sono stanco. Mangio spesso fuori."
    - tutor: "Capisco, stai molto seduto. Qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Voglio cominciare di correre e perdere cinque chili."
      errors: [preposition]
    - tutor: "«Cominciare di correre»? Con cominciare, la preposizione è un'altra."
      prompt: {text: "cominciare di correre", tags: [preposition]}
    - learner: "Cominciare a correre!"
    - tutor: "Bravo! Correre è perfetto. Cosa ti ferma, di solito?"
      goals: [goal]
    - learner: "Il tempo. Torno a casa a le otto e poi devo cucinare."
      errors: [articulated-preposition]
    - tutor: "Torni «a le otto»? Ripetilo con calma."
      prompt: {text: "a le otto", tags: [articulated-preposition]}
    - learner: "Torno a casa a otto."
      errors: [articulated-preposition]
    - tutor: "Capito, alle otto è tardi. Allora possiamo allenarci la mattina presto."
      recast: {text: "a otto", fix: "alle otto", tags: [articulated-preposition]}
      goals: [obstacles]
    - learner: "Va bene: corro il lunedì, il mercoledì e il venerdì per mezz'ora."
    - tutor: "Perfetto, e il sabato facciamo pesi insieme in palestra."
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro da casa da un anno. Vado in ufficio solo una volta a la settimana."
      errors: [articulated-preposition]
    - tutor: "Una volta... ? Ripeti l'ultima parte."
      prompt: {text: "a la settimana", tags: [articulated-preposition]}
    - learner: "Una volta a settimana."
    - tutor: "Bene, quindi quasi sempre a casa! Ti piace?"
      goals: [situation]
    - learner: "Sì, non perdo tempo nel traffico e posso pranzare con i miei figli."
    - tutor: "Sono vantaggi importanti. E gli svantaggi?"
      goals: [pros]
    - learner: "Mi mancano i colleghi. E il mio appartamento è piccolo, lavoro su la cucina."
      errors: [preposition]
    - tutor: "Lavori «su la cucina»? Sopra la cucina, come un gatto?"
      prompt: {text: "su la cucina", tags: [preposition]}
    - learner: "No, no! Lavoro a la cucina."
      errors: [preposition]
    - tutor: "Ah, lavori in cucina! Allora capisco, non è comodo."
      recast: {text: "a la cucina", fix: "in cucina", tags: [preposition]}
      goals: [cons]
    - learner: "Preferirei lavorare due giorni in ufficio e tre a casa."
    - tutor: "Mi sembra la soluzione migliore, hai il meglio dei due mondi."
      goals: [preference]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra si mangia il tacchino e si aprono i regali su la mattina di Natale."
      errors: [preposition]
    - tutor: "Che bello! Ma «su la mattina di Natale»? In italiano non funziona così."
      prompt: {text: "su la mattina", tags: [preposition]}
    - learner: "La mattina di Natale."
    - tutor: "Esatto! E da piccola come festeggiavi?"
      goals: [compare]
    - learner: "Andavamo sempre da i miei nonni in Scozia. Mia nonna cucinava per tre giorni!"
      errors: [articulated-preposition]
    - tutor: "«Da i miei nonni»? Mmm, quasi."
      prompt: {text: "da i miei nonni", tags: [articulated-preposition]}
    - learner: "Andavamo dai miei nonni."
    - tutor: "Brava! Che bel ricordo."
      goals: [past]
    - learner: "E qui in Italia, cosa si mangia a Capodanno?"
    - tutor: "Le lenticchie: si dice che portino soldi per tutto l'anno!"
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Che cosa posso portare al pranzo?"
    - tutor: "Porta un dolce del tuo paese, ci farà felici!"
      goals: [plan]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera. Sono il vicino da sotto, abito al secondo piano."
      errors: [preposition]
    - tutor: "Piacere. Il vicino «da sotto»? Scusi, non ho capito bene."
      prompt: {text: "da sotto", tags: [preposition]}
    - learner: "Il vicino di sotto."
    - tutor: "Ah, piacere! Mi dica."
      goals: [greet]
    - learner: "Il problema è la musica. Ogni sera la sentiamo fino a mezzanotte."
    - tutor: "Oh, mi dispiace, non pensavo che si sentisse così tanto."
      goals: [problem]
    - learner: "Potrebbe abbassare il volume dopo le dieci? Mia moglie comincia di lavorare alle sei."
      errors: [preposition]
    - tutor: "Certo. Sua moglie «comincia di lavorare»? Ci pensi, con cominciare."
      prompt: {text: "comincia di lavorare", tags: [preposition]}
    - learner: "Comincia da lavorare alle sei."
      errors: [preposition]
    - tutor: "Ah, comincia a lavorare alle sei? Allora capisco, abbasserò il volume."
      recast: {text: "da lavorare", fix: "a lavorare", tags: [preposition]}
      goals: [request]
    - learner: "Grazie. Magari il sabato può tenerla più alta fino alle undici."
    - tutor: "Mi sembra giusto: dopo le dieci abbasso, il sabato fino alle undici."
      goals: [compromise]

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Ho deciso fare qualcosa per gli altri."
      errors: [preposition]
    - tutor: "Bellissimo! «Ho deciso fare»: manca una piccola parola, sai quale?"
      prompt: {text: "deciso fare", tags: [preposition]}
    - learner: "Ho deciso di fare qualcosa."
    - tutor: "Perfetto! E perché proprio adesso?"
    - learner: "Sono in Italia da due anni e voglio conoscere più persone e aiutare."
    - tutor: "È un'ottima ragione. Cosa sai fare?"
      goals: [motivation]
    - learner: "Sono cuoco. Posso cucinare o aiutare a la mensa."
      errors: [articulated-preposition]
    - tutor: "Un cuoco, che fortuna! «A la mensa»? Ripeti un attimo."
      prompt: {text: "a la mensa", tags: [articulated-preposition]}
    - learner: "Aiutare a mensa?"
      errors: [articulated-preposition]
    - tutor: "Sì, alla mensa abbiamo sempre bisogno di qualcuno in cucina. Quanto tempo hai?"
      recast: {text: "a mensa", fix: "alla mensa", tags: [articulated-preposition]}
      goals: [skills]
    - learner: "Sono libero il sabato tutto il giorno."
    - tutor: "Perfetto. Il sabato puoi cucinare con noi, oppure portare la spesa agli anziani. Cosa preferisci?"
      goals: [time]
    - learner: "Preferisco la mensa, mi piace cucinare per tante persone."
    - tutor: "Benissimo, ti aspettiamo sabato alle nove!"
      goals: [choose]

# y-prep, file 07: B2, verb-governed prepositions (pensare a, fidarsi di, interessarsi a), years, articulated forms.
- scenario: affittare-appartamento
  level: B2
  persona: es-f-teacher
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Che bella luce! Quanto è l'affitto, e le spese sono comprese?"
    - tutor: "L'affitto è di 1.100 euro al mese. Le spese di condominio sono comprese, il riscaldamento invece no: d'inverno sono circa 80 euro al mese."
      goals: [rent]
    - learner: "Capisco. Insegno all'università e il mio incarico finisce fra tre anni, quindi penso in un contratto di tre anni."
      errors: [preposition]
    - tutor: "Capisco. Però «penso in un contratto»: con pensare, in questo senso, che preposizione usiamo?"
      prompt: {text: "penso in un contratto", tags: [preposition]}
    - learner: "Penso a un contratto di tre anni."
    - tutor: "Esatto. Possiamo fare un contratto di tre anni più due, ma in quel caso la caparra sarebbe di tre mesi."
      goals: [contract]
    - learner: "Va bene. E gli elettrodomestici? La lavatrice sembra abbastanza nuova, ma il frigorifero no."
    - tutor: "La lavatrice ha un anno. Il frigorifero è vecchio, ma se lo desidera lo cambio prima che lei entri."
      goals: [condition]
    - learner: "Sarebbe perfetto. E il quartiere com'è la sera? Torno spesso tardi da la biblioteca."
      errors: [articulated-preposition]
    - tutor: "È molto tranquillo. Ma «da la biblioteca»? Ci pensi un attimo."
      prompt: {text: "da la biblioteca", tags: [articulated-preposition]}
    - learner: "Torno tardi da biblioteca."
      errors: [articulated-preposition]
    - tutor: "Non si preoccupi: tornando dalla biblioteca troverà strade ben illuminate e la fermata dell'autobus proprio sotto casa."
      recast: {text: "da biblioteca", fix: "dalla biblioteca", tags: [articulated-preposition]}
      goals: [neighbourhood]
    - learner: "Allora mi interessa molto. Le do una risposta entro venerdì."
    - tutor: "Benissimo, aspetto la sua chiamata."
      goals: [decide]

- scenario: arte-mostra
  level: B2
  persona: en-m-heritage
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce la luce: sembra che entri dalla finestra a sinistra."
    - tutor: "Esatto, la luce è tutto in quest'opera. Cosa vedi, nel dettaglio?"
      goals: [react]
    - learner: "C'è una donna che legge una lettera vicino a la finestra, e sul tavolo c'è un tappeto rosso."
      errors: [articulated-preposition]
    - tutor: "Hai visto bene. Ma «vicino a la finestra»? Prova a dirlo in un altro modo."
      prompt: {text: "vicino a la finestra", tags: [articulated-preposition]}
    - learner: "Vicino alla finestra."
    - tutor: "Perfetto. E secondo te, che cosa dice la lettera?"
      goals: [describe]
    - learner: "Secondo me è una lettera d'amore. Lei pensa di qualcuno che è lontano, forse in mare."
      errors: [preposition]
    - tutor: "Che interpretazione romantica! Però «pensa di qualcuno»: con questo significato, pensare vuole un'altra preposizione."
      prompt: {text: "pensa di qualcuno", tags: [preposition]}
    - learner: "Pensa su qualcuno?"
      errors: [preposition]
    - tutor: "Sì, pensa a qualcuno di lontano: molti esperti sono d'accordo con te."
      recast: {text: "Pensa su qualcuno", fix: "pensa a qualcuno", tags: [preposition]}
      goals: [interpret]
    - learner: "Mi ricorda un quadro che ho visto a il Louvre, ma non ricordo il pittore."
      errors: [articulated-preposition]
    - tutor: "«A il Louvre»? Ci sei quasi."
      prompt: {text: "a il Louvre", tags: [articulated-preposition]}
    - learner: "L'ho visto a Louvre."
      errors: [articulated-preposition]
    - tutor: "Ah, al Louvre! Forse un altro pittore olandese: lì ce ne sono tanti, con la stessa luce calma."
      recast: {text: "a Louvre", fix: "al Louvre", tags: [articulated-preposition]}
      goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri mattina ero fermo a il semaforo in via Garibaldi e una macchina mi ha tamponato."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Era fermo «a il semaforo»? Lo ripeta, per favore."
      prompt: {text: "a il semaforo", tags: [articulated-preposition]}
    - learner: "Ero fermo al semaforo."
    - tutor: "Chiaro. E l'altra persona ha riconosciuto di avere torto?"
      goals: [what]
    - learner: "Sì, ha detto che non aveva visto il rosso perché parlava a il telefono."
      errors: [articulated-preposition]
    - tutor: "Bene. «Parlava a il telefono»: è la stessa cosa di prima, ci faccia attenzione."
      prompt: {text: "a il telefono", tags: [articulated-preposition]}
    - learner: "Parlava a telefono."
      errors: [articulated-preposition]
    - tutor: "D'accordo, parlava al telefono: questo chiarisce la responsabilità."
      recast: {text: "a telefono", fix: "al telefono", tags: [articulated-preposition]}
      goals: [responsibility]
    - learner: "Abbiamo compilato la constatazione amichevole insieme e l'abbiamo firmata tutti e due."
    - tutor: "Perfetto. Ha indicato anche la targa dell'altra auto e i danni?"
    - learner: "Sì, la targa c'è. Il danno è al paraurti posteriore, che è tutto rotto."
    - tutor: "Molto bene, il modulo è completo."
      goals: [documents]
    - learner: "Cosa succede adesso? Quanto tempo devo aspettare per la perizia?"
    - tutor: "Un nostro esperto la chiamerà entro cinque giorni lavorativi per fissare la perizia."
      goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Sono arrivata in Italia in 2023 e vorrei chiedere la residenza."
      errors: [articulated-preposition]
    - tutor: "Benvenuta. Arrivata «in 2023»? Con gli anni manca qualcosa."
      prompt: {text: "in 2023", tags: [articulated-preposition]}
      goals: [request]
    - learner: "Sono arrivata in il 2023."
      errors: [articulated-preposition]
    - tutor: "Bene, nel 2023. Allora, ha un contratto d'affitto registrato e un documento?"
      recast: {text: "in il 2023", fix: "nel 2023", tags: [articulated-preposition]}
    - learner: "Sì, ho tutti e due. Il permesso di soggiorno serve anche per i cittadini britannici?"
    - tutor: "Sì, oggi serve anche a voi, insieme al passaporto."
      goals: [documents]
    - learner: "Ho fatto la domanda, ma il permesso non è ancora arrivato. Dipende su la questura, credo."
      errors: [preposition]
    - tutor: "Capisco. «Dipende su la questura»? Ci pensi: con dipendere, quale preposizione si usa?"
      prompt: {text: "Dipende su la questura", tags: [preposition]}
    - learner: "Dipende della questura."
      errors: [preposition]
    - tutor: "Sì, purtroppo dipende dalla questura, ma per ora basta la ricevuta della domanda."
      recast: {text: "della questura", fix: "dalla questura", tags: [preposition]}
      goals: [problem]
    - learner: "Perfetto, ho la ricevuta con me. E poi cosa succede?"
    - tutor: "Entro quarantacinque giorni i vigili passeranno a casa sua per un controllo; dopo, la pratica sarà conclusa."
      goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono ingegnere informatico, vengo di Saragozza e vivo a Torino da quattro anni."
      errors: [preposition]
    - tutor: "Molto bene. «Vengo di Saragozza»? Ci faccia caso: con venire, l'origine si indica in un altro modo."
      prompt: {text: "vengo di Saragozza", tags: [preposition]}
    - learner: "Vengo da Saragozza."
    - tutor: "Esatto. Mi racconti della sua esperienza."
      goals: [intro]
    - learner: "Ho lavorato in una piccola azienda per due anni, poi sono passata a una multinazionale, dove seguivo progetti con clienti tedeschi."
    - tutor: "Un percorso interessante. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Sono molto organizzata e so lavorare in squadra. Un punto debole: a volte mi fido poco in i colleghi e faccio tutto da sola."
      errors: [preposition]
    - tutor: "È bello che lo dica. Però «mi fido in i colleghi»? Con fidarsi, provi un'altra preposizione."
      prompt: {text: "in i colleghi", tags: [preposition]}
    - learner: "Mi fido poco dei colleghi."
    - tutor: "Esatto. E perché vuole lavorare proprio da noi?"
      goals: [strengths]
    - learner: "Perché la vostra azienda investe molto nella sostenibilità, e io sono interessata in questo settore da anni."
      errors: [preposition]
    - tutor: "«Interessata in questo settore»? Anche qui la preposizione non va."
      prompt: {text: "interessata in questo settore", tags: [preposition]}
    - learner: "Interessata di questo settore."
      errors: [preposition]
    - tutor: "Capisco, è interessata a questo settore da anni: è un punto a suo favore."
      recast: {text: "di questo settore", fix: "a questo settore", tags: [preposition]}
      goals: [why]
    - learner: "Posso chiederle com'è organizzata la squadra?"
    - tutor: "Certo: sono sei persone, e lei lavorerebbe con il responsabile tecnico."
      goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-heritage
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Lavoro qui per cinque anni e quest'anno il mio reparto ha superato tutti gli obiettivi."
      errors: [preposition]
    - tutor: "Ottimo lavoro. Ma «lavoro qui per cinque anni»: lei è ancora qui, giusto? Ci pensi."
      prompt: {text: "per cinque anni", tags: [preposition]}
    - learner: "Lavoro qui di cinque anni."
      errors: [preposition]
    - tutor: "Lo so, lavora qui da cinque anni, e i risultati sono ottimi."
      recast: {text: "di cinque anni", fix: "da cinque anni", tags: [preposition]}
      goals: [results]
    - learner: "Per questo ho deciso a chiederle una promozione."
      errors: [preposition]
    - tutor: "Mi fa piacere. «Ho deciso a chiederle»? Ci pensi un attimo."
      prompt: {text: "deciso a chiederle", tags: [preposition]}
    - learner: "Ho deciso di chiederle una promozione."
    - tutor: "Bene. Il problema è che il budget di quest'anno è già stato approvato."
      goals: [request]
    - learner: "Capisco, ma una promozione non è solo un aumento. Potrei avere più responsabilità subito e parlare del stipendio a gennaio."
      errors: [articulated-preposition]
    - tutor: "Proposta interessante. «Del stipendio», però? Attenzione alla parola che segue."
      prompt: {text: "del stipendio", tags: [articulated-preposition]}
    - learner: "Parlare di lo stipendio?"
      errors: [articulated-preposition]
    - tutor: "Sì, parlare dello stipendio a gennaio mi sembra ragionevole."
      recast: {text: "di lo stipendio", fix: "dello stipendio", tags: [articulated-preposition]}
      goals: [handle]
    - learner: "Allora possiamo rivederci tra un mese per definire il nuovo ruolo?"
    - tutor: "D'accordo: tra un mese ci rivediamo e fissiamo insieme gli obiettivi."
      goals: [next-steps]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io non sono d'accordo con lei. Credo che una zona pedonale porti più persone in il centro."
      errors: [articulated-preposition]
    - tutor: "È una posizione chiara. Più persone... dove, scusi?"
      prompt: {text: "in il centro", tags: [articulated-preposition]}
    - learner: "Più persone in centro."
    - tutor: "Ah, ecco. E perché dovrebbe essere così?"
      goals: [position]
    - learner: "Primo, perché la gente cammina più volentieri senza traffico. Secondo, perché l'inquinamento diminuisce."
    - tutor: "Sì, ma senza parcheggi i clienti andranno nei centri commerciali, non crede?"
      goals: [argue]
    - learner: "Dipende in come si organizzano i mezzi pubblici. Se gli autobus funzionano bene, la gente arriva lo stesso."
      errors: [preposition]
    - tutor: "«Dipende in come»? Attenzione al verbo dipendere."
      prompt: {text: "Dipende in come", tags: [preposition]}
    - learner: "Dipende di come si organizzano."
      errors: [preposition]
    - tutor: "Certo, dipende da come si organizzano i mezzi: su questo ha ragione."
      recast: {text: "di come", fix: "da come", tags: [preposition]}
      goals: [counter]
    - learner: "Anche lei ha ragione su una cosa: i negozianti hanno bisogno di tempo. Si potrebbe chiudere il centro solo nel fine settimana, all'inizio."
    - tutor: "Questa soluzione mi convince di più: proviamo con il fine settimana."
      goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Inizio io. Ho riletto «Il Gattopardo», un classico che non leggevo dal liceo."
    - tutor: "Che classico! Di cosa parla?"
    - learner: "Parla di una famiglia nobile siciliana a il momento dell'unità d'Italia."
      errors: [articulated-preposition]
    - tutor: "«A il momento»? Ci pensi un istante."
      prompt: {text: "a il momento", tags: [articulated-preposition]}
    - learner: "Al momento dell'unità d'Italia."
    - tutor: "Perfetto. E il principe, il personaggio principale, com'è?"
      goals: [summary]
    - learner: "È un uomo intelligente ma stanco, che sa che il suo mondo sta per finire. È diverso di tutti gli altri personaggi."
      errors: [preposition]
    - tutor: "Hai ragione. Ma «diverso di tutti»: ti suona bene?"
      prompt: {text: "diverso di tutti", tags: [preposition]}
    - learner: "Diverso a tutti gli altri?"
      errors: [preposition]
    - tutor: "Sì, è diverso da tutti gli altri, ed è proprio questo che lo rende così speciale. Ti è piaciuto?"
      recast: {text: "Diverso a", fix: "diverso da", tags: [preposition]}
      goals: [characters]
    - learner: "Moltissimo. All'inizio è un po' lento, ma lo stile è bellissimo."
    - tutor: "Sono d'accordo, il ritmo lento fa parte della sua bellezza. A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A chi ama la storia e le descrizioni lunghe, non a chi cerca azione."
    - tutor: "Consiglio perfetto, grazie!"
      goals: [recommend]

# y-prep, file 01: A1, prepositions with cities, countries and places; articulated forms.
- scenario: presentarsi
  level: A1
  persona: es-f-erasmus
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
    - learner: "Ciao Giulia! Mi chiamo Lucía. Sono spagnola."
    - tutor: "Piacere, Lucía! Di dove sei?"
      goals: [say-name]
    - learner: "Sono di Valencia, ma adesso abito in Bologna."
      errors: [preposition]
    - tutor: "In Bologna? Per una città, quale parola usiamo?"
      prompt: {text: "in Bologna", tags: [preposition]}
    - learner: "Abito per Bologna?"
      errors: [preposition]
    - tutor: "Ah, abiti a Bologna! E cosa fai qui?"
      recast: {text: "per Bologna", fix: "a Bologna", tags: [preposition]}
      goals: [say-origin]
    - learner: "Sono studentessa. Studio a la università."
      errors: [articulated-preposition]
    - tutor: "A la università? Qui le due parole stanno insieme."
      prompt: {text: "a la università", tags: [articulated-preposition]}
    - learner: "Studio a l'università."
      errors: [articulated-preposition]
    - tutor: "Ah, studi all'università! Anch'io studio lì."
      recast: {text: "a l'università", fix: "all'università", tags: [articulated-preposition]}
      goals: [say-job]
    - learner: "E tu, Giulia, di dove sei?"
    - tutor: "Sono di Napoli, ma studio qui."
      goals: [ask-back]

- scenario: giorno-tipico
  level: A1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Mi sveglio alle sette e faccio colazione."
    - tutor: "Presto! E poi cosa fai la mattina?"
      goals: [wake]
    - learner: "Prendo il treno e vado a il lavoro."
      errors: [articulated-preposition]
    - tutor: "A il lavoro? Due parole, ma diventano una."
      prompt: {text: "a il lavoro", tags: [articulated-preposition]}
    - learner: "Vado al lavoro."
    - tutor: "Perfetto! E la sera?"
      goals: [work]
    - learner: "La sera torno a casa e cucino. Poi guardo un film su il divano."
      errors: [articulated-preposition]
    - tutor: "Su il divano? Come prima, prova ancora."
      prompt: {text: "su il divano", tags: [articulated-preposition]}
    - learner: "Sul il divano?"
      errors: [articulated-preposition]
    - tutor: "Sul divano, che bello! Io la sera leggo."
      recast: {text: "Sul il divano", fix: "Sul divano", tags: [articulated-preposition]}
      goals: [evening]
    - learner: "E tu, Anna? A che ora ti svegli?"
    - tutor: "Alle sei e mezza. Lavoro in ospedale."
      goals: [ask]

- scenario: taxi
  level: A1
  persona: en-m-traveller
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Dove la porto?"
    - learner: "Buongiorno. Il mio albergo è in via Cavour, numero 12."
    - tutor: "Va bene, via Cavour. Ha una valigia?"
      goals: [destination]
    - learner: "Sì, due valigie. Quanto tempo ci vuole?"
    - tutor: "Venti minuti, più o meno."
      goals: [ask-time]
    - learner: "Va bene. Domani vado in Firenze in treno."
      errors: [preposition]
    - tutor: "In Firenze? Firenze è una città..."
      prompt: {text: "in Firenze", tags: [preposition]}
    - learner: "Vado per Firenze?"
      errors: [preposition]
    - tutor: "Ah, va a Firenze! Ecco, siamo arrivati."
      recast: {text: "per Firenze", fix: "a Firenze", tags: [preposition]}
    - learner: "Grazie. Quanto costa?"
    - tutor: "Diciotto euro."
      goals: [ask-price]
    - learner: "Ecco venti euro. Grazie, arrivederci!"
    - tutor: "Grazie a Lei! Ecco il resto."
      goals: [pay]

- scenario: chiedere-strada
  level: A1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Sì, scusi. Cerco la stazione. È lontana di qui?"
      errors: [preposition]
    - tutor: "Lontana di qui? Scusi, come?"
      prompt: {text: "di qui", tags: [preposition]}
      goals: [get-attention]
    - learner: "È lontana da qui?"
    - tutor: "No, è vicina! Dieci minuti a piedi."
      goals: [ask-place]
    - learner: "Vado dritto fino a il semaforo?"
      errors: [articulated-preposition]
    - tutor: "Fino a il semaforo? Provi ancora."
      prompt: {text: "a il semaforo", tags: [articulated-preposition]}
    - learner: "Fino a semaforo?"
      errors: [articulated-preposition]
    - tutor: "Sì, dritto fino al semaforo, poi a destra."
      recast: {text: "a semaforo", fix: "al semaforo", tags: [articulated-preposition]}
    - learner: "Va bene. E la stazione è in la piazza grande?"
      errors: [articulated-preposition]
    - tutor: "Attenzione: «in la» non va bene. Provi ancora!"
      prompt: {text: "in la piazza", tags: [articulated-preposition]}
    - learner: "La stazione è nella piazza grande?"
    - tutor: "Sì, esatto! La vede subito."
      goals: [understand]
    - learner: "Grazie mille, molto gentile!"
    - tutor: "Prego! Buon viaggio."
      goals: [thank]

- scenario: famiglia
  level: A1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono mia madre e mio padre. Abitano in Londra."
      errors: [preposition]
    - tutor: "Abitano... dove? Londra è una città."
      prompt: {text: "in Londra", tags: [preposition]}
    - learner: "Abitano a Londra."
    - tutor: "Brava! E questa ragazza chi è?"
      goals: [who]
    - learner: "È mia sorella Emma. Ha ventidue anni e studia a Spagna."
      errors: [preposition]
    - tutor: "A Spagna? Attenzione, la Spagna è un paese."
      prompt: {text: "a Spagna", tags: [preposition]}
      goals: [ages]
    - learner: "Ah... studia a la Spagna?"
      errors: [preposition]
    - tutor: "Ah, studia in Spagna! Dove, a Madrid?"
      recast: {text: "a la Spagna", fix: "in Spagna", tags: [preposition]}
    - learner: "Sì, a Madrid. Lei è molto simpatica e alta."
    - tutor: "Che bello! Anch'io ho una sorella."
      goals: [describe]
    - learner: "E tu, Marco? Hai fratelli?"
    - tutor: "Sì, ho un fratello. Ha trent'anni."
      goals: [ask]

- scenario: tempo-libero
  level: A1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Mi piace leggere e andare in bici. Vado sempre a il parco."
      errors: [articulated-preposition]
    - tutor: "Scusa, vai... dove?"
      prompt: {text: "a il parco", tags: [articulated-preposition]}
    - learner: "Vado al parco."
    - tutor: "Bene! E quante volte vai?"
      goals: [hobby]
    - learner: "Vado tutte le domeniche. E il sabato sera salgo con le amiche."
      errors: [false-friend]
    - tutor: "Brava! Anch'io esco spesso il sabato sera."
      recast: {text: "salgo", fix: "esco", tags: [false-friend]}
      goals: [frequency]
    - learner: "E tu, Sara? Cosa fai in il weekend?"
      errors: [articulated-preposition]
    - tutor: "In il weekend? Prova ancora, piano."
      prompt: {text: "in il weekend", tags: [articulated-preposition]}
    - learner: "Cosa fai in weekend?"
      errors: [articulated-preposition]
    - tutor: "Nel weekend? Vado spesso al cinema."
      recast: {text: "in weekend", fix: "Nel weekend", tags: [articulated-preposition]}
      goals: [ask]
    - learner: "Che bello! Andiamo insieme al cinema sabato?"
    - tutor: "Sì, bella idea! Sabato sera?"
      goals: [propose]

- scenario: casa-mia
  level: A1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    - learner: "Abito in una casa vicino a Siena."
    - tutor: "Una casa, che bello! Quante camere ci sono?"
      goals: [type]
    - learner: "Tre camere. La mia camera è su il primo piano."
      errors: [preposition]
    - tutor: "Su il primo piano? No, qui non usiamo «su»."
      prompt: {text: "su il primo piano", tags: [preposition]}
    - learner: "In il primo piano?"
      errors: [preposition]
    - tutor: "Ah, al primo piano! Ed è grande?"
      recast: {text: "In il primo piano", fix: "al primo piano", tags: [preposition]}
      goals: [rooms]
    - learner: "Sì, è la mia camera preferita. C'è un balcone con molti fiori."
    - tutor: "Che bello, un balcone con i fiori!"
      goals: [favourite]
    - learner: "E la tua casa, Luca? È grande?"
    - tutor: "No, è piccola. Ma è vicina al mare."
      goals: [ask]

- scenario: supermercato
  level: A1
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, cerca qualcosa?"
    - learner: "Sì, scusi. Dov'è il latte?"
    - tutor: "Il latte è in fondo, a destra."
      goals: [ask-product]
    - learner: "Grazie. E la pasta? È su lo scaffale lì?"
      errors: [articulated-preposition]
    - tutor: "Su lo scaffale? Lo dica in una parola sola."
      prompt: {text: "su lo scaffale", tags: [articulated-preposition]}
    - learner: "Sullo scaffale lì?"
    - tutor: "Sì, esatto! Lo scaffale blu."
      goals: [ask-other]
    - learner: "E le uova? Sono a la cassa?"
      errors: [articulated-preposition]
    - tutor: "A la cassa? Ci pensi un momento."
      prompt: {text: "a la cassa", tags: [articulated-preposition]}
    - learner: "Sono in la cassa?"
      errors: [articulated-preposition]
    - tutor: "Alla cassa? No, sono vicino al latte."
      recast: {text: "in la cassa", fix: "Alla cassa", tags: [articulated-preposition]}
    - learner: "Ah, va bene. Grazie mille, buona giornata!"
    - tutor: "Prego, buona giornata!"
      goals: [thank]

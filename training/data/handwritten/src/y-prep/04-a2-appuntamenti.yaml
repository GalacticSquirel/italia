# y-prep, file 04: A2, plans, times and verb-governed prepositions (pensare a, da with time).
- scenario: cercare-lavoro-a2
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Sì, buongiorno! Cercate un cameriere per l'estate?"
    - tutor: "Sì, da giugno a settembre. Ha esperienza?"
      goals: [ask]
    - learner: "Sì, ho lavorato di cameriera in Valencia per due anni."
      errors: [preposition]
    - tutor: "Ha lavorato «di cameriera»? Ci pensi un attimo."
      prompt: {text: "di cameriera", tags: [preposition]}
    - learner: "Ho lavorato come cameriera in Valencia."
      errors: [preposition]
    - tutor: "Ah, a Valencia! Brava, è un'ottima esperienza."
      recast: {text: "in Valencia", fix: "a Valencia", tags: [preposition]}
      goals: [experience]
    - learner: "Sono libera tutti i giorni, ma non la domenica mattina."
    - tutor: "Perfetto, la domenica mattina siamo chiusi."
      goals: [availability]
    - learner: "Le lascio il mio numero: 333 4567890."
    - tutor: "Grazie, la chiamo domani."
      goals: [contact]

- scenario: compleanno
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa su sabato sera?"
      errors: [preposition]
    - tutor: "Su sabato? Mmm, ripeti la domanda."
      prompt: {text: "su sabato", tags: [preposition]}
    - learner: "Facciamo una festa sabato sera?"
    - tutor: "Ottima idea! Dove? A casa mia?"
    - learner: "Sì, a casa tua è perfetto. Invitiamo i colleghi?"
    - tutor: "Sì, e anche gli amici di Sara."
      goals: [date, guests]
    - learner: "Io porto la torta da la pasticceria di mia zia."
      errors: [articulated-preposition]
    - tutor: "Da la pasticceria? Mmm, quasi."
      prompt: {text: "da la pasticceria", tags: [articulated-preposition]}
    - learner: "Da pasticceria di mia zia."
      errors: [articulated-preposition]
    - tutor: "Perfetto, una torta dalla pasticceria di tua zia!"
      recast: {text: "Da pasticceria", fix: "dalla pasticceria", tags: [articulated-preposition]}
      goals: [food]
    - learner: "E il regalo? Io penso di un libro."
      errors: [preposition]
    - tutor: "Pensi «di» un libro? Con pensare, qui serve un'altra parola."
      prompt: {text: "penso di un libro", tags: [preposition]}
    - learner: "Penso a un libro?"
    - tutor: "Esatto! Le compriamo un bel libro, le piacerà."
      goals: [gift]

- scenario: medico-base
  level: A2
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Ho mal di gola, un po' di febbre e sono costipato."
      errors: [false-friend]
    - tutor: "Mi dispiace. Quindi è raffreddato. Da quando sta male?"
      recast: {text: "costipato", fix: "raffreddato", tags: [false-friend]}
      new: [{lemma: raffreddato, gloss: having a cold}]
      goals: [symptoms]
    - learner: "Sto male per tre giorni."
      errors: [preposition]
    - tutor: "Per tre giorni? Ma lei sta ancora male, no? Allora...?"
      prompt: {text: "per tre giorni", tags: [preposition]}
    - learner: "Sto male da tre giorni."
    - tutor: "Bene, capito. È allergico a qualche medicina?"
      goals: [since-when]
    - learner: "No, non sono allergico. Ma prendo una medicina per la pressione."
    - tutor: "Va bene. Prenda questa medicina tre volte al giorno, dopo aver mangiato."
      goals: [history]
    - learner: "Allora tre volta a il giorno, dopo aver mangiato."
      errors: [noun-number, articulated-preposition]
    - tutor: "A il giorno? Ci pensi un attimo."
      prompt: {text: "a il giorno", tags: [articulated-preposition]}
    - learner: "Tre volte in il giorno?"
      errors: [articulated-preposition]
    - tutor: "Sì, tre volte al giorno, per cinque giorni. E beva molta acqua!"
      recast: {text: "in il giorno", fix: "al giorno", tags: [articulated-preposition]}
      goals: [instructions]
    - learner: "Grazie, dottore. Arrivederci."
    - tutor: "Arrivederci, e buona giornata."

- scenario: palestra
  level: A2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Ciao! Vuoi informazioni sull'abbonamento?"
    - learner: "Sì, grazie. Quanto costa l'abbonamento per un mese?"
    - tutor: "Un mese costa quaranta euro, tre mesi cento."
      goals: [ask-membership]
    - learner: "Ci sono corsi di yoga?"
    - tutor: "Sì, c'è yoga il martedì e il giovedì."
      goals: [classes]
    - learner: "A che ora? Io lavoro fino a le cinque."
      errors: [articulated-preposition]
    - tutor: "Fino a le cinque? Prova a dirlo meglio."
      prompt: {text: "a le cinque", tags: [articulated-preposition]}
    - learner: "Fino alle cinque."
    - tutor: "Perfetto, allora va bene: il corso è alle sei e mezza."
      goals: [timetable]
    - learner: "Benissimo, mi iscrivo. Comincio a lunedì?"
      errors: [preposition]
    - tutor: "Cominci a lunedì? Scusa, quando?"
      prompt: {text: "a lunedì", tags: [preposition]}
    - learner: "Comincio in lunedì?"
      errors: [preposition]
    - tutor: "Certo, cominci lunedì! Mi dai un documento?"
      recast: {text: "in lunedì", fix: "lunedì", tags: [preposition]}
      goals: [sign-up]
    - learner: "Ecco la carta d'identità."
    - tutor: "Grazie! Benvenuta in palestra."

- scenario: parrucchiere
  level: A2
  persona: en-f-student
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
    - learner: "Vorrei tagliare i capelli. Sono troppo lunghi."
    - tutor: "Va bene. Quanto li tagliamo?"
      goals: [book]
    - learner: "Corti, fino a le spalle, per favore."
      errors: [articulated-preposition]
    - tutor: "Scusi, fino... ?"
      prompt: {text: "a le spalle", tags: [articulated-preposition]}
    - learner: "Fino a spalle."
      errors: [articulated-preposition]
    - tutor: "Perfetto, fino alle spalle. E una frangia? Le starebbe bene."
      recast: {text: "a spalle", fix: "alle spalle", tags: [articulated-preposition]}
      goals: [length]
    - learner: "Mmm, no, la frangia no. Vado in la piscina tutti i giorni."
      errors: [articulated-preposition]
    - tutor: "In la piscina? Mmm, ci pensi."
      prompt: {text: "in la piscina", tags: [articulated-preposition]}
    - learner: "Vado in piscina tutti i giorni."
    - tutor: "Ah, giusto! Allora niente frangia."
      goals: [style]
    - learner: "Che bello, grazie! Quanto pago?"
    - tutor: "Sono trentacinque euro, grazie."
      goals: [pay]

- scenario: prenotare-tavolo
  level: A2
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera! Vorrei prenotare un tavolo per sabato."
    - tutor: "Certo. Per quante persone e a che ora?"
      goals: [book]
    - learner: "Per sei persone, a le otto e mezza."
      errors: [articulated-preposition]
    - tutor: "A le otto e mezza? Scusi, non sento bene... a che ora?"
      prompt: {text: "a le otto", tags: [articulated-preposition]}
    - learner: "A le otto e mezza."
      errors: [articulated-preposition]
    - tutor: "Alle otto e mezza, perfetto. Sei persone."
      recast: {text: "A le otto", fix: "Alle otto", tags: [articulated-preposition]}
      goals: [details]
    - learner: "È possibile un tavolo in la terrazza?"
      errors: [articulated-preposition]
    - tutor: "In la terrazza? Provi a dirlo in un altro modo."
      prompt: {text: "in la terrazza", tags: [articulated-preposition]}
    - learner: "Sulla terrazza?"
    - tutor: "Sì, sulla terrazza c'è posto."
      goals: [special]
    - learner: "Il nome è Davide Rossi."
    - tutor: "Perfetto, signor Rossi: sabato, sei persone, alle otto e mezza."
      goals: [name]

- scenario: ricordi-infanzia
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo in un paese piccolo, vicino di Siviglia."
      errors: [preposition]
    - tutor: "Vicino di Siviglia? Con «vicino» c'è un'altra parola."
      prompt: {text: "vicino di Siviglia", tags: [preposition]}
    - learner: "Vicino a Siviglia."
    - tutor: "Esatto! E cosa facevi d'estate?"
      goals: [place]
    - learner: "Andavo sempre a la spiaggia con mia nonna."
      errors: [articulated-preposition]
    - tutor: "Andavi... dove? Ripeti, per favore."
      prompt: {text: "a la spiaggia", tags: [articulated-preposition]}
    - learner: "Andavo in la spiaggia."
      errors: [articulated-preposition]
    - tutor: "Ah, andavi alla spiaggia con la nonna! E la scuola ti piaceva?"
      recast: {text: "in la spiaggia", fix: "alla spiaggia", tags: [articulated-preposition]}
      goals: [habits]
    - learner: "Sì, molto. La mia maestra era molto dolce."
    - tutor: "Che fortuna! Hai un ricordo speciale?"
      goals: [school]
    - learner: "Sì, una volta siamo andati a Madrid in treno con tutta la classe."
    - tutor: "Che bel viaggio, e che bel ricordo!"
      goals: [event]

- scenario: serata-cinema
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Sì! Andiamo a il cinema?"
      errors: [articulated-preposition]
    - tutor: "A il cinema? Ripeti, ma più veloce!"
      prompt: {text: "a il cinema", tags: [articulated-preposition]}
    - learner: "Andiamo al cinema?"
    - tutor: "Bella idea! Che film ti piacciono?"
      goals: [propose]
    - learner: "Mi piacciono le commedie. I film d'azione sono noiosi per me."
    - tutor: "Anche a me piacciono le commedie! C'è una commedia nuova al cinema Odeon."
      goals: [genre]
    - learner: "Perfetto. A che ora comincia?"
    - tutor: "Alle sette e mezza o alle nove."
    - learner: "Alle nove. Ci vediamo davanti di il cinema?"
      errors: [preposition]
    - tutor: "Va bene, alle nove. Davanti di il cinema? Mmm, prova ancora."
      prompt: {text: "davanti di il cinema", tags: [preposition]}
      goals: [choose]
    - learner: "Davanti del cinema?"
      errors: [preposition]
    - tutor: "Sì, davanti al cinema alle nove meno un quarto!"
      recast: {text: "Davanti del cinema", fix: "davanti al cinema", tags: [preposition]}
      goals: [meet]
    - learner: "Va bene, a stasera allora!"
    - tutor: "A stasera, ciao!"

# y-prep, file 02: A1, prepositions in shops, times and days; material and quantity with di.
- scenario: numero-telefono
  level: A1
  persona: en-m-traveller
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "È stata una bella lezione, vero?"
    - learner: "Sì, molto bella! Studiamo insieme su lunedì?"
      errors: [preposition]
    - tutor: "Su lunedì? Attenzione, con i giorni è diverso."
      prompt: {text: "su lunedì", tags: [preposition]}
    - learner: "Studiamo insieme lunedì?"
    - tutor: "Perfetto! Sì, lunedì va bene."
      goals: [propose]
    - learner: "Il mio numero è 347 8821903."
    - tutor: "Grazie! Ti scrivo un messaggio."
      goals: [number]
    - learner: "Ci vediamo a il bar di la scuola?"
      errors: [articulated-preposition]
    - tutor: "A il bar? Prova ancora."
      prompt: {text: "a il bar", tags: [articulated-preposition]}
    - learner: "Al bar di la scuola?"
      errors: [articulated-preposition]
    - tutor: "Sì, al bar della scuola, alle dieci!"
      recast: {text: "di la scuola", fix: "della scuola", tags: [articulated-preposition]}
    - learner: "Va bene, alle dieci. A lunedì!"
    - tutor: "A lunedì, ciao!"
      goals: [when]

- scenario: orari-negozio
  level: A1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Pronto, negozio Bianchi, buongiorno!"
    - learner: "Buongiorno! Chiamo per sapere gli orari."
    - tutor: "Certo, mi dica."
      goals: [greet]
    - learner: "A che ora aprite per la mattina?"
      errors: [preposition]
    - tutor: "Per la mattina? Scusi, non capisco bene."
      prompt: {text: "per la mattina", tags: [preposition]}
    - learner: "A che ora aprite la mattina?"
    - tutor: "Apriamo alle nove e chiudiamo alle sette."
      goals: [ask-hours]
    - learner: "E siete aperti la domenica?"
    - tutor: "No, la domenica siamo chiusi."
      goals: [ask-day]
    - learner: "Va bene, allora vengo a sabato."
      errors: [preposition]
    - tutor: "A sabato? Provi ancora, piano."
      prompt: {text: "a sabato", tags: [preposition]}
    - learner: "Vengo in sabato."
      errors: [preposition]
    - tutor: "Va bene, viene sabato. A presto!"
      recast: {text: "in sabato", fix: "sabato", tags: [preposition]}
    - learner: "Grazie, arrivederci!"
    - tutor: "Arrivederci, buona giornata!"
      goals: [goodbye]

- scenario: hotel-checkin
  level: A1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
    - learner: "Buonasera. Sì, per due notti."
    - tutor: "Bene. Il suo nome, per favore?"
    - learner: "Mi chiamo Sarah Miller."
    - tutor: "Ecco, la vedo. Un documento, per favore."
      goals: [booking]
    - learner: "Ecco il passaporto. A che ora è la colazione? È in la sala qui?"
      errors: [articulated-preposition]
    - tutor: "In la sala? Qui «in» e «la» diventano una parola."
      prompt: {text: "in la sala", tags: [articulated-preposition]}
      goals: [document]
    - learner: "Nella sala qui?"
    - tutor: "Sì, nella sala a destra, dalle sette alle dieci."
      goals: [breakfast]
    - learner: "Grazie. E la camera?"
    - tutor: "La camera è la 304. Ecco la chiave."
    - learner: "La 304 è a il terzo piano?"
      errors: [articulated-preposition]
    - tutor: "A il terzo piano? Come prima, provi ancora!"
      prompt: {text: "a il terzo piano", tags: [articulated-preposition]}
    - learner: "Alla terzo piano?"
      errors: [articulated-preposition]
    - tutor: "Sì, al terzo piano. Buonanotte!"
      recast: {text: "Alla terzo piano", fix: "al terzo piano", tags: [articulated-preposition]}
      goals: [key]

- scenario: ristorante-ordinare
  level: A1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, benvenuti! Quanti siete?"
    - learner: "Siamo tre. C'è un tavolo a fuori?"
      errors: [preposition]
    - tutor: "A fuori? Scusi, come?"
      prompt: {text: "a fuori", tags: [preposition]}
    - learner: "Un tavolo fuori?"
    - tutor: "Sì, certo. Prego, da questa parte."
      goals: [ask-table]
    - learner: "Per me spaghetti a la carbonara."
      errors: [articulated-preposition]
    - tutor: "A la carbonara? Come, scusi?"
      prompt: {text: "a la carbonara", tags: [articulated-preposition]}
    - learner: "Spaghetti a carbonara, per favore."
      errors: [articulated-preposition]
    - tutor: "Ottimo, spaghetti alla carbonara! E da bere?"
      recast: {text: "a carbonara", fix: "alla carbonara", tags: [articulated-preposition]}
      goals: [order-food]
    - learner: "Una bottiglia di vino rosso e acqua senza gas."
    - tutor: "Perfetto, arrivano subito."
      goals: [order-drink]
    - learner: "Scusi, il conto, per favore."
    - tutor: "Certo, ecco il conto. Sono 54 euro."
      goals: [ask-bill]

- scenario: bar-colazione
  level: A1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno! Un cappuccino e un cornetto di cioccolato, per favore."
      errors: [preposition]
    - tutor: "Di cioccolato? Il cornetto non è tutto di cioccolato!"
      prompt: {text: "di cioccolato", tags: [preposition]}
      goals: [greet]
    - learner: "Un cornetto con cioccolato?"
      errors: [preposition]
    - tutor: "Ah, un cornetto al cioccolato! Ecco."
      recast: {text: "con cioccolato", fix: "al cioccolato", tags: [preposition]}
      goals: [order-drink, order-food]
    - learner: "Grazie. Quanto pago?"
    - tutor: "Tre euro e venti."
    - learner: "Posso pagare a la cassa?"
      errors: [articulated-preposition]
    - tutor: "A la cassa? Ci pensi un attimo."
      prompt: {text: "a la cassa", tags: [articulated-preposition]}
    - learner: "Alla cassa?"
    - tutor: "Esatto, ma può pagare anche qui."
    - learner: "Ecco tre euro e venti. Arrivederci!"
    - tutor: "Grazie, arrivederci!"
      goals: [pay]

- scenario: panetteria
  level: A1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Mi dica."
    - learner: "Buongiorno! Vorrei un chilo pane, per favore."
      errors: [preposition]
    - tutor: "Un chilo... pane? Manca una parola."
      prompt: {text: "un chilo pane", tags: [preposition]}
      goals: [greet]
    - learner: "Un chilo di pane."
    - tutor: "Brava! Ecco il pane, altro?"
      goals: [order-bread]
    - learner: "Sì, due pezzi di pizza a le patate."
      errors: [articulated-preposition]
    - tutor: "A le patate? Mmm, non proprio."
      prompt: {text: "a le patate", tags: [articulated-preposition]}
    - learner: "Pizza alla patate?"
      errors: [articulated-preposition]
    - tutor: "Ecco due pezzi di pizza alle patate."
      recast: {text: "alla patate", fix: "alle patate", tags: [articulated-preposition]}
      goals: [order-extra]
    - learner: "Quanto costa tutto?"
    - tutor: "Sei euro e cinquanta."
    - learner: "Ecco, grazie. Arrivederci!"
    - tutor: "Grazie a Lei, arrivederci!"
      goals: [pay]

- scenario: mercato-frutta
  level: A1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Cosa ti do oggi?"
    - learner: "Ciao! Quanto costano le mele?"
    - tutor: "Due euro al chilo. Sono fresche!"
      goals: [ask-price]
    - learner: "Va bene, un chilo mele, per favore."
      errors: [preposition]
    - tutor: "Scusa? Un chilo mele?"
      prompt: {text: "un chilo mele", tags: [preposition]}
    - learner: "Un chilo per mele?"
      errors: [preposition]
    - tutor: "Ah, un chilo di mele! Ecco qui."
      recast: {text: "per mele", fix: "di mele", tags: [preposition]}
      goals: [buy-quantity]
    - learner: "Vorrei anche mezzo chilo di pomodori."
    - tutor: "Ecco i pomodori. Altro?"
      goals: [ask-other]
    - learner: "No, basta. Quanto pago?"
    - tutor: "Tre euro in tutto."
    - learner: "Ecco. Grazie, ciao!"
    - tutor: "Grazie a te, ciao!"
      goals: [pay]

- scenario: abbigliamento
  level: A1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Buongiorno. Cerco una maglietta da cotone."
      errors: [preposition]
    - tutor: "Da cotone? Per la stoffa usiamo un'altra parola."
      prompt: {text: "da cotone", tags: [preposition]}
      new: [{lemma: stoffa, gloss: fabric}]
    - learner: "Una maglietta di cotone."
    - tutor: "Perfetto. Che colore e che taglia?"
      goals: [ask-item]
    - learner: "Blu, taglia M. Quella in la vetrina è bella."
      errors: [articulated-preposition]
    - tutor: "In la vetrina? Attenzione alle due parole."
      prompt: {text: "in la vetrina", tags: [articulated-preposition]}
    - learner: "Quella a la vetrina."
      errors: [articulated-preposition]
    - tutor: "Sì, quella nella vetrina! È blu, taglia M."
      recast: {text: "a la vetrina", fix: "nella vetrina", tags: [articulated-preposition]}
      goals: [size-colour]
    - learner: "Posso provare?"
    - tutor: "Certo, il camerino è lì."
      goals: [try]
    - learner: "Va bene, la prendo. Quanto costa?"
    - tutor: "Venti euro, con lo sconto."
      goals: [decide]

# y-prep, file 05: B1, da with time, verb-governed prepositions (dipendere da, riuscire a, smettere di), origin.
- scenario: affittare-appartamento
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno! È molto luminoso. Quanto è l'affitto al mese?"
    - tutor: "Sono 800 euro, spese di condominio comprese."
      goals: [rent]
    - learner: "E il contratto quanto dura? E quanto è il deposito? Io resto in Italia per due anni."
      errors: [word-choice]
    - tutor: "La caparra è di due mesi. Il contratto è di quattro anni, ma può lasciare l'appartamento prima, con tre mesi di avviso."
      recast: {text: "deposito", fix: "caparra", tags: [word-choice]}
      goals: [contract]
    - learner: "Va bene. Il riscaldamento dipende di voi o è autonomo?"
      errors: [preposition]
    - tutor: "Buona domanda. Però «dipende di voi»: con dipendere, la preposizione è un'altra."
      prompt: {text: "dipende di voi", tags: [preposition]}
    - learner: "Dipende da voi?"
    - tutor: "Esatto. No, lo accende e lo spegne lei quando vuole, e la caldaia è nuova."
      goals: [condition]
      new: [{lemma: caldaia, gloss: boiler}]
    - learner: "Perfetto. E il quartiere? Il supermercato più vicino è lontano di qui?"
      errors: [preposition]
    - tutor: "«Lontano di qui»? Ci pensi un attimo."
      prompt: {text: "lontano di qui", tags: [preposition]}
    - learner: "Lontano per qui?"
      errors: [preposition]
    - tutor: "No, non è lontano da qui: il supermercato è a cinque minuti a piedi, e la metro anche."
      recast: {text: "per qui", fix: "da qui", tags: [preposition]}
      goals: [neighbourhood]
    - learner: "Allora mi interessa molto. Possiamo firmare lunedì?"
    - tutor: "Certo, lunedì preparo il contratto e ci vediamo qui."
      goals: [decide]

- scenario: banca-conto
  level: B1
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Vorrei aprire un conto. Vivo a Milano per sei mesi e adesso ho un contratto."
      errors: [preposition]
    - tutor: "Benvenuto! Lei vive a Milano «per sei mesi»: vuol dire che poi parte?"
      prompt: {text: "per sei mesi", tags: [preposition]}
    - learner: "No, no, resto! Vivo a Milano da sei mesi."
    - tutor: "Ah, ecco! Allora apriamo un conto corrente."
      goals: [purpose]
    - learner: "Quali documenti servono? Ho portato il passaporto e la mia contratto."
      errors: [noun-gender]
    - tutor: "Il passaporto va bene. Ma «la mia contratto»? Contratto è una parola maschile..."
      prompt: {text: "la mia contratto", tags: [noun-gender]}
    - learner: "Il mio contratto."
    - tutor: "Perfetto. Servono il passaporto, il codice fiscale e il contratto di lavoro."
      goals: [documents]
    - learner: "Li ho tutti con me. Quanto costa il conto a il mese?"
      errors: [articulated-preposition]
    - tutor: "«A il mese»? Ci pensi un momento."
      prompt: {text: "a il mese", tags: [articulated-preposition]}
    - learner: "Quanto costa al mese?"
    - tutor: "Esatto. Costa due euro al mese, ma i primi sei mesi sono gratis."
      goals: [costs]
    - learner: "Bene. Con la carta posso pagare anche online e usare l'app?"
    - tutor: "Sì, la carta di debito funziona online, e con l'app può fare bonifici dal telefono."
      goals: [card]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Daniel, sono nato in Boston, ma mia madre è di Napoli."
      errors: [preposition]
    - tutor: "Piacere. Nato «in Boston»? Ci pensi: Boston è una città."
      prompt: {text: "in Boston", tags: [preposition]}
    - learner: "Sono nato a Boston."
    - tutor: "Perfetto. E che esperienza ha?"
      goals: [intro]
    - learner: "Ho lavorato per tre anni in un'agenzia di viaggi. Mi occupavo dei clienti italiani."
    - tutor: "Interessante. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Sono bravo a parlare con le persone. Un difetto: a volte non riesco di dire di no."
      errors: [preposition]
    - tutor: "«Non riesco di dire»? Con riuscire ci vuole un'altra preposizione."
      prompt: {text: "riesco di dire", tags: [preposition]}
    - learner: "Non riesco da dire di no."
      errors: [preposition]
    - tutor: "Capisco, a volte non riesce a dire di no: succede a molti. Perché vuole lavorare con noi?"
      recast: {text: "da dire", fix: "a dire", tags: [preposition]}
      goals: [strengths]
    - learner: "Perché la vostra azienda lavora molto con gli Stati Uniti e io parlo due lingue."
    - tutor: "È un vantaggio importante. Ha domande per me?"
      goals: [why]
    - learner: "Sì, posso chiedere una domanda? Il lavoro è solo in ufficio o anche da casa?"
      errors: [word-choice]
    - tutor: "Certo, può fare una domanda, anzi tutte quelle che vuole. Due giorni alla settimana può lavorare da casa."
      recast: {text: "chiedere una domanda", fix: "fare una domanda", tags: [word-choice]}
      goals: [questions]

- scenario: consigli-viaggio
  level: B1
  persona: es-f-erasmus
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì! Resto una settimana e dormo da la mia amica Carmen."
      errors: [articulated-preposition]
    - tutor: "Che bello! Dormi «da la» tua amica? Mmm, quasi."
      prompt: {text: "da la mia amica", tags: [articulated-preposition]}
    - learner: "Dalla mia amica Carmen."
    - tutor: "Brava! Una settimana intera, che fortuna. Cosa vuoi sapere?"
      goals: [plans]
    - learner: "Cosa devo visitare? E dove si mangia la pizza migliore?"
    - tutor: "Visita assolutamente il centro e i musei. Per la pizza, vai nei vicoli: è buonissima dappertutto."
      goals: [advice]
      new: [{lemma: vicolo, gloss: alley}]
    - learner: "Un giorno voglio andare a Capri. Il traghetto parte di Napoli?"
      errors: [preposition]
    - tutor: "Il traghetto «parte di Napoli»? Scusa, non ho capito."
      prompt: {text: "parte di Napoli", tags: [preposition]}
    - learner: "Il traghetto parte da Napoli?"
    - tutor: "Sì, dal porto, ogni ora. In città invece usa la metro: è comoda."
      goals: [transport]
    - learner: "Perfetto. C'è qualcosa che devo evitare?"
    - tutor: "Evita la macchina in centro e fai attenzione alla borsa sull'autobus."
      goals: [warnings]

- scenario: dal-meccanico
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Fa un rumore strano quando freno."
    - tutor: "Un rumore dai freni, capisco. Da quando lo fa?"
      goals: [describe]
    - learner: "Lo fa per una settimana. L'ho notato martedì scorso."
      errors: [preposition]
    - tutor: "«Lo fa per una settimana»: quindi adesso ha smesso? Pensi bene alla frase."
      prompt: {text: "per una settimana", tags: [preposition]}
    - learner: "Ah no, lo fa ancora. Lo fa per sette giorni..."
      errors: [preposition]
    - tutor: "Capisco, lo fa da sette giorni, cioè da martedì. Probabilmente sono le pastiglie dei freni."
      recast: {text: "per sette giorni", fix: "da sette giorni", tags: [preposition]}
      goals: [when]
      new: [{lemma: pastiglia, gloss: brake pad}]
    - learner: "Quanto costerà la riparazione?"
    - tutor: "Più o meno 150 euro, pezzi compresi. Le preparo un preventivo."
      goals: [cost]
    - learner: "Va bene. Quando è pronta? Devo andare a l'aeroporto giovedì."
      errors: [articulated-preposition]
    - tutor: "D'accordo. «A l'aeroporto»? Ci pensi un attimo."
      prompt: {text: "a l'aeroporto", tags: [articulated-preposition]}
    - learner: "Alla aeroporto, scusi."
      errors: [articulated-preposition]
    - tutor: "Non si preoccupi: sarà pronta mercoledì sera, così giovedì va all'aeroporto tranquillo."
      recast: {text: "Alla aeroporto", fix: "all'aeroporto", tags: [articulated-preposition]}
      goals: [time]

- scenario: film-libro
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io! Ho letto «L'amica geniale», un romanzo su due amiche."
    - tutor: "Ottima scelta! Di cosa parla, senza rivelare il finale?"
    - learner: "Parla di due amiche che crescono in Napoli negli anni Cinquanta."
      errors: [preposition]
    - tutor: "Crescono «in Napoli»? Attenzione, Napoli è una città."
      prompt: {text: "in Napoli", tags: [preposition]}
    - learner: "Crescono a Napoli negli anni Cinquanta."
    - tutor: "Perfetto. E il personaggio principale com'è?"
      goals: [summary]
    - learner: "È timida ma molto intelligente. Si innamora con un ragazzo che si chiama Nino."
      errors: [preposition]
    - tutor: "Si innamora «con» un ragazzo? Prova con un'altra preposizione."
      prompt: {text: "innamora con", tags: [preposition]}
    - learner: "Si innamora a Nino?"
      errors: [preposition]
    - tutor: "Ah sì, si innamora di Nino, e lì cominciano i problemi! Ti è piaciuto?"
      recast: {text: "innamora a", fix: "innamora di", tags: [preposition]}
      goals: [characters]
    - learner: "Sì, tantissimo. È eccitante e molto realistico."
      errors: [false-friend]
    - tutor: "Sì, è davvero emozionante, sono d'accordo. A chi lo consiglieresti?"
      recast: {text: "eccitante", fix: "emozionante", tags: [false-friend]}
      goals: [opinion]
    - learner: "A chi ama le storie lunghe e le amicizie complicate."
    - tutor: "Bellissimo consiglio. Chi parla adesso?"
      goals: [recommend]

- scenario: medico-base
  level: B1
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottoressa. Ho un dolore forte a la schiena e non dormo bene."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Dove, scusi? Ripeta con calma."
      prompt: {text: "a la schiena", tags: [articulated-preposition]}
    - learner: "Alla schiena, qui in basso."
    - tutor: "Ho capito. Da quanto tempo ha questo dolore?"
      goals: [symptoms]
    - learner: "Da due settimane. Ho cominciato un lavoro nuovo in un magazzino."
    - tutor: "Capisco. È allergico a qualche medicina?"
      goals: [since-when]
    - learner: "No, nessuna allergia. Ma prendo l'ibuprofene in la sera."
      errors: [preposition]
    - tutor: "In la sera? Ci pensi un attimo."
      prompt: {text: "in la sera", tags: [preposition]}
    - learner: "Prendo l'ibuprofene per la sera."
      errors: [preposition]
    - tutor: "Va bene, l'ibuprofene la sera. Per due settimane niente pesi, e metta questa crema due volte al giorno."
      recast: {text: "per la sera", fix: "la sera", tags: [preposition]}
      goals: [history]
      new: [{lemma: crema, gloss: cream}]
    - learner: "Allora devo smettere a sollevare pesi per due settimane e mettere la crema due volte al giorno."
      errors: [preposition]
    - tutor: "«Smettere a sollevare»? Attenzione al verbo smettere."
      prompt: {text: "smettere a sollevare", tags: [preposition]}
    - learner: "Devo smettere di sollevare pesi."
    - tutor: "Esatto, ha capito tutto. Torni da me tra due settimane."
      goals: [instructions]

- scenario: prenotare-visita
  level: B1
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno. Vorrei prenotare una visita con il dermatologo."
    - tutor: "Certo. Ha l'impegnativa del medico o paga lei la visita?"
      goals: [type]
    - learner: "Pago io. Sono libera solo su martedì o giovedì."
      errors: [preposition]
    - tutor: "«Su martedì»? Con i giorni della settimana, in italiano...?"
      prompt: {text: "su martedì", tags: [preposition]}
    - learner: "Il martedì o il giovedì."
    - tutor: "Perfetto. Il primo posto libero è giovedì 14, alle 16:30."
      goals: [availability]
    - learner: "Va bene. Quanto costa la visita e cosa devo portare?"
    - tutor: "Costa 120 euro. Porti solo un documento d'identità."
      goals: [cost]
    - learner: "Allora giovedì 14 a le quattro e mezza, con il documento."
      errors: [articulated-preposition]
    - tutor: "Sì, giovedì 14... «a le quattro»? Lo ripeta, per favore."
      prompt: {text: "a le quattro", tags: [articulated-preposition]}
    - learner: "A la quattro e mezza?"
      errors: [articulated-preposition]
    - tutor: "Giovedì 14 alle quattro e mezza, perfetto. La aspettiamo!"
      recast: {text: "A la quattro", fix: "alle quattro", tags: [articulated-preposition]}
      goals: [confirm]
    - learner: "Grazie, arrivederci."
    - tutor: "Arrivederci, buona giornata!"

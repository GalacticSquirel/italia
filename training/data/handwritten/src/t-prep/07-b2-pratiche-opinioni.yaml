# t-prep, file 07: B2, prepositions after verbs and in fixed expressions (a causa di, rispetto a, invece di).
- scenario: affittare-appartamento
  level: B2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. È più grande di come sembrava nelle foto. Quanto viene l'affitto, spese comprese?"
    - tutor: "Ottocento euro, più cento di spese per il condominio, riscaldamento incluso."
      goals: [rent]
    - learner: "Capisco. Io cerco qualcosa a lungo termine: conto con un contratto di almeno quattro anni."
      errors: [preposition]
    - tutor: "Ottimo. Però «conto con un contratto»: in italiano, «contare» in questo senso vuole un'altra preposizione."
      prompt: {text: "conto con un contratto", tags: [preposition]}
    - learner: "Conto in un contratto di quattro anni?"
      errors: [preposition]
    - tutor: "Se conta su un contratto lungo, il quattro più quattro fa per lei. Chiedo tre mesi di caparra."
      recast: {text: "in un contratto", fix: "su un contratto", tags: [preposition]}
      goals: [contract]
    - learner: "Tre mesi mi sembrano tanti. In Spagna di solito sono due. E gli elettrodomestici sono nuovi?"
    - tutor: "La lavatrice e il frigorifero hanno due anni, il forno è nuovo. Gli infissi sono stati cambiati l'anno scorso."
      new: [{lemma: infissi, gloss: window frames}]
      goals: [condition]
    - learner: "Bene. E il quartiere com'è? Ho letto che è diverso che il centro, più tranquillo."
      errors: [preposition]
    - tutor: "È vero. Ma «diverso che il centro»: con «diverso», quale preposizione usiamo per fare un confronto?"
      prompt: {text: "diverso che il centro", tags: [preposition]}
    - learner: "Diverso dal centro, più residenziale."
    - tutor: "Esattamente: ci sono famiglie, un mercato il sabato e la metro a due passi."
      goals: [neighbourhood]
    - learner: "Mi interessa molto. Se lei è disposto a scendere a due mesi di caparra, lo prendo."
    - tutor: "Per qualcuno che resta quattro anni, si può fare. Affare fatto!"
      goals: [decide]

- scenario: arte-mostra
  level: B2
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce subito la luce. Sembra che venga da la finestra a sinistra e cada tutta su il viso della ragazza."
      errors: [articulated-preposition]
    - tutor: "Hai un buon occhio. Ma «da la finestra» e «su il viso»: preposizione e articolo qui diventano una parola sola, come?"
      prompt: {text: "da la finestra", tags: [articulated-preposition]}
    - learner: "Dalla finestra e sul viso."
    - tutor: "Perfetto. E cosa vedi sullo sfondo?"
      goals: [react]
    - learner: "Nello sfondo c'è un paesaggio con colline e un fiume, molto piccolo, quasi nascosto."
    - tutor: "Sì, un dettaglio tipico dei pittori veneti. E tu come lo interpreti?"
      goals: [describe]
    - learner: "Secondo me la ragazza pensa in qualcuno lontano. Ha uno sguardo malinconico."
      errors: [preposition]
    - tutor: "Bella lettura. Ma «pensa in qualcuno»: dopo «pensare», quale preposizione va prima della persona?"
      prompt: {text: "pensa in qualcuno", tags: [preposition]}
    - learner: "Pensa di qualcuno lontano?"
      errors: [preposition]
    - tutor: "Pensa a qualcuno lontano, sì, è possibile: forse un fidanzato partito per la guerra."
      recast: {text: "di qualcuno", fix: "a qualcuno", tags: [preposition]}
      goals: [interpret]
    - learner: "Rispetto il ritratto che abbiamo visto prima, questo è molto più intimo."
      errors: [articulated-preposition]
    - tutor: "D'accordo. Ma «rispetto il ritratto»: per fare un confronto, «rispetto» vuole una preposizione. Quale?"
      prompt: {text: "Rispetto il ritratto", tags: [articulated-preposition]}
    - learner: "Rispetto del ritratto?"
      errors: [articulated-preposition]
    - tutor: "Rispetto al ritratto di prima è molto più intimo, hai ragione: lì era tutto potere, qui solo emozione."
      recast: {text: "Rispetto del ritratto", fix: "Rispetto al ritratto", tags: [articulated-preposition]}
      goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri pomeriggio ero fermo a il semaforo di via Roma e una macchina mi ha tamponato."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Prima di tutto: «a il semaforo», come si uniscono le due parole?"
      prompt: {text: "a il semaforo", tags: [articulated-preposition]}
    - learner: "Al semaforo di via Roma."
    - tutor: "Bene. Lei si è fatto male?"
      goals: [what]
    - learner: "No, per fortuna. Ma il paraurti è rotto. L'altro conducente ha ammesso che guardava il telefono."
    - tutor: "Quindi la responsabilità è chiaramente sua. Avete compilato la constatazione amichevole?"
      goals: [responsibility]
    - learner: "Sì, l'abbiamo firmata tutti e due. Ho anche le foto, ma sono un po' scure a causa la pioggia."
      errors: [articulated-preposition]
    - tutor: "Ottimo. Ma «a causa la pioggia»: «a causa» vuole una preposizione prima del nome. Quale?"
      prompt: {text: "a causa la pioggia", tags: [articulated-preposition]}
    - learner: "A causa per la pioggia?"
      errors: [articulated-preposition]
    - tutor: "Sono scure a causa della pioggia? Non importa, ce le mandi lo stesso."
      recast: {text: "A causa per la pioggia", fix: "a causa della pioggia", tags: [articulated-preposition]}
      goals: [documents]
    - learner: "D'accordo. E adesso? Devo portare la macchina da un carrozziere?"
    - tutor: "Prima un nostro tecnico farà la perizia, entro cinque giorni. Poi potrà ripararla dove preferisce."
      goals: [next]
    - learner: "Perfetto. Allora aspetto la telefonata del perito invece portarla subito in officina."
      errors: [preposition]
    - tutor: "Esatto. Solo una cosa: «invece portarla»: tra «invece» e il verbo ci va una preposizione."
      prompt: {text: "invece portarla", tags: [preposition]}
    - learner: "Invece di portarla subito in officina."
    - tutor: "Perfetto. La chiamiamo noi entro venerdì."

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Vorrei chiedere la residenza. Vivo in questo comune per otto mesi."
      errors: [preposition]
    - tutor: "Certo. Ma «vivo in questo comune per otto mesi»: se ci vive ancora adesso, quale preposizione usiamo?"
      prompt: {text: "per otto mesi", tags: [preposition]}
    - learner: "Vivo qui da otto mesi."
    - tutor: "Benissimo. Ha il contratto d'affitto e il permesso di soggiorno?"
      goals: [request]
    - learner: "Ho il permesso. Il contratto invece è in nome di Laura, la mia coinquilina: io sono ospite."
      errors: [preposition]
    - tutor: "Capisco. Ma «in nome di Laura»: quando il contratto è di un'altra persona, come diciamo?"
      prompt: {text: "in nome di Laura", tags: [preposition]}
    - learner: "Per nome di Laura?"
      errors: [preposition]
    - tutor: "Se il contratto è a nome di Laura, serve una sua dichiarazione firmata, con la copia del documento."
      recast: {text: "Per nome di Laura", fix: "a nome di Laura", tags: [preposition]}
      goals: [documents]
    - learner: "Ah, non lo sapevo. Lei è in Spagna per lavoro fino a la fine del mese."
      errors: [articulated-preposition]
    - tutor: "Nessun problema, può firmarla da lì e mandarla per email. Però «fino a la fine»: come si uniscono?"
      prompt: {text: "fino a la fine", tags: [articulated-preposition]}
    - learner: "Fino alla fine del mese."
    - tutor: "Perfetto. Quando avrà la dichiarazione, la carica sul portale del comune."
      goals: [problem]
    - learner: "E poi quanto tempo ci vuole? Mi serve la residenza per iscrivermi a un corso."
    - tutor: "Entro quarantacinque giorni passano i vigili per il controllo. Se va tutto bene, la residenza è confermata."
      goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono Daniel, sono cresciuto a Boston ma mia madre è di Bari. Mi sono specializzato in marketing digitale."
    - tutor: "Una doppia identità, interessante. E la sua esperienza?"
      goals: [intro]
    - learner: "Negli ultimi tre anni sono stato responsabile per i social di una catena di hotel."
      errors: [preposition]
    - tutor: "Bene. Ma «responsabile per i social»: in italiano, «responsabile» di un settore vuole un'altra preposizione."
      prompt: {text: "responsabile per i social", tags: [preposition]}
    - learner: "Responsabile dei social."
    - tutor: "Perfetto. Che risultati ha ottenuto?"
    - learner: "Abbiamo raddoppiato i follower in un anno, grazie a una strategia basata sui video brevi."
    - tutor: "Notevole. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Sono creativo e mi piace partecipare in progetti di squadra. Il mio difetto: a volte fatico a delegare."
      errors: [preposition]
    - tutor: "Onesto. Ma «partecipare in progetti»: con «partecipare», quale preposizione?"
      prompt: {text: "partecipare in progetti", tags: [preposition]}
    - learner: "Partecipare con progetti di squadra?"
      errors: [preposition]
    - tutor: "Partecipare a progetti di squadra è molto importante qui, quindi ottimo. E perché proprio la nostra azienda?"
      recast: {text: "con progetti", fix: "a progetti", tags: [preposition]}
      goals: [strengths]
    - learner: "Ho sempre sognato lavorare in Italia, e il vostro marchio lo conosco da quando ero bambino."
      errors: [preposition]
    - tutor: "Che bello. Ma «ho sempre sognato lavorare»: dopo «sognare», quale preposizione va davanti al verbo?"
      prompt: {text: "sognato lavorare", tags: [preposition]}
    - learner: "Ho sempre sognato di lavorare in Italia."
    - tutor: "Bene, è una ragione chiara. Ha domande per noi?"
      goals: [why]
    - learner: "Sì: è previsto un periodo di formazione all'inizio?"
    - tutor: "Sì, due settimane nella sede di Milano, insieme agli altri nuovi assunti."
      goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Quest'anno ho superato tutti gli obiettivi: le iscrizioni a i corsi serali sono aumentate del trenta per cento."
      errors: [articulated-preposition]
    - tutor: "Un ottimo risultato. Ma «a i corsi»: come si uniscono le due parole?"
      prompt: {text: "a i corsi", tags: [articulated-preposition]}
    - learner: "Ai corsi serali."
    - tutor: "Perfetto. E cosa mi vuole chiedere?"
      goals: [results]
    - learner: "Penso di meritare un ruolo di coordinatrice, con un aumento adeguato."
    - tutor: "Capisco. Però il budget di quest'anno è già chiuso."
      goals: [request]
    - learner: "Lo so, ma potrei approfittare la riorganizzazione di gennaio per prendere più responsabilità."
      errors: [articulated-preposition]
    - tutor: "Interessante. Ma «approfittare la riorganizzazione»: «approfittare» vuole una preposizione. Quale?"
      prompt: {text: "approfittare la riorganizzazione", tags: [articulated-preposition]}
    - learner: "Approfittare per la riorganizzazione?"
      errors: [articulated-preposition]
    - tutor: "Approfittare della riorganizzazione di gennaio? Non è un'idea sbagliata, ci devo pensare."
      recast: {text: "Approfittare per la riorganizzazione", fix: "Approfittare della riorganizzazione", tags: [articulated-preposition]}
      goals: [handle]
    - learner: "Non le chiedo una risposta subito. Possiamo riparlarne a la fine di dicembre?"
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «a la fine»: come prima..."
      prompt: {text: "a la fine", tags: [articulated-preposition]}
    - learner: "Alla fine di dicembre."
    - tutor: "D'accordo, fissiamo un incontro il venti dicembre. Intanto mi prepari una proposta per email."
      goals: [next-steps]

- scenario: dibattito-ambiente
  level: B2
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Non sono d'accordo con lei. Credo che una zona pedonale sia un vantaggio per tutti, anche per i commercianti."
    - tutor: "Addirittura un vantaggio? Mi spieghi."
      goals: [position]
    - learner: "Primo, l'inquinamento in centro è altissimo. Secondo, le persone a piedi si fermano di più a le vetrine."
      errors: [articulated-preposition]
    - tutor: "Vedremo. Ma «si fermano a le vetrine»: come diventano «a» e «le»?"
      prompt: {text: "a le vetrine", tags: [articulated-preposition]}
    - learner: "Si fermano di più alle vetrine."
    - tutor: "Questo è vero, ma chi viene da fuori dove parcheggia?"
      goals: [argue]
    - learner: "Si può investire nei mezzi pubblici e costruire parcheggi fuori dal centro. In molte città funziona."
    - tutor: "Ma i residenti anziani? Non tutti possono camminare tanto."
      goals: [counter]
    - learner: "È vero, non avevo pensato in questo aspetto."
      errors: [preposition]
    - tutor: "Lo apprezzo. Ma «pensato in questo aspetto»: con «pensare», quale preposizione?"
      prompt: {text: "pensato in questo aspetto", tags: [preposition]}
    - learner: "Non avevo pensato su questo aspetto?"
      errors: [preposition]
    - tutor: "Ah, non aveva pensato a questo aspetto: almeno è onesta! E allora cosa propone?"
      recast: {text: "su questo aspetto", fix: "a questo aspetto", tags: [preposition]}
    - learner: "Propongo dei permessi per i residenti e una navetta gratuita. Così nessuno rinuncia a venire in centro."
    - tutor: "Con la navetta, forse potrei anche cambiare idea."
      new: [{lemma: navetta, gloss: shuttle bus}]
      goals: [concede]

- scenario: film-libro
  level: B2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io ho letto un giallo ambientato a Trieste. Il detective è un ex poliziotto che si è trasferito lì da Napoli."
    - tutor: "Trieste è perfetta per un giallo. Di cosa parla, senza dire troppo?"
    - learner: "Una donna sparisce e tutti sospettano del marito. Ma lui non assomiglia per niente al tipico colpevole."
    - tutor: "Sono già curioso. Com'è il detective?"
      goals: [summary]
    - learner: "È un uomo solitario che si fida solo in il suo cane. È ironico, ma anche molto triste."
      errors: [articulated-preposition]
    - tutor: "Che personaggio! Ma «si fida solo in il suo cane»: con «fidarsi», quale preposizione?"
      prompt: {text: "in il suo cane", tags: [articulated-preposition]}
    - learner: "Si fida solo nel suo cane?"
      errors: [articulated-preposition]
    - tutor: "Si fida solo del suo cane: una scelta saggia, forse! Ti è piaciuto?"
      recast: {text: "nel suo cane", fix: "del suo cane", tags: [articulated-preposition]}
      goals: [characters]
    - learner: "Molto. Lo stile è semplice, ma l'autore riesce di creare una tensione incredibile."
      errors: [preposition]
    - tutor: "Ottimo. Ma «riesce di creare»: con «riuscire», quale preposizione?"
      prompt: {text: "riesce di creare", tags: [preposition]}
    - learner: "Riesce per creare?"
      errors: [preposition]
    - tutor: "Se l'autore riesce a creare tensione con uno stile semplice, è davvero bravo. A chi lo consiglieresti?"
      recast: {text: "per creare", fix: "a creare", tags: [preposition]}
      goals: [opinion]
    - learner: "A chi ama i gialli nordici, ma anche a chi vuole conoscere Trieste."
    - tutor: "Allora lo metto in lista per il prossimo mese."
      goals: [recommend]

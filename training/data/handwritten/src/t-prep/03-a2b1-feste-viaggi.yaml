# t-prep, file 03: A2 and B1, prepositions with verbs, islands, regions and fixed phrases.
- scenario: compleanno
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a casa mia sabato sera?"
    - tutor: "Ottimo, casa tua è grande. A che ora?"
      goals: [date]
    - learner: "Alle otto. Invitiamo anche i colleghi di l'ufficio?"
      errors: [articulated-preposition]
    - tutor: "Sì! Ma «di l'ufficio»: «di» e «l'» si uniscono, come?"
      prompt: {text: "di l'ufficio", tags: [articulated-preposition]}
    - learner: "Del ufficio?"
      errors: [articulated-preposition]
    - tutor: "Sì, i colleghi dell'ufficio, perché no? Allora siamo in quindici."
      recast: {text: "Del ufficio", fix: "dell'ufficio", tags: [articulated-preposition]}
      goals: [guests]
    - learner: "Per mangiare, compro le pizze a la pizzeria sotto casa."
      errors: [articulated-preposition]
    - tutor: "Va bene. Ma «a la pizzeria»: come prima, due parole che diventano una."
      prompt: {text: "a la pizzeria", tags: [articulated-preposition]}
    - learner: "Alla pizzeria sotto casa."
    - tutor: "Perfetto. E la torta chi la fa?"
    - learner: "Mia sorella. È molto brava in cucinare i dolci."
      errors: [preposition]
    - tutor: "Che fortuna! Ma «brava in cucinare»: con un verbo dopo «brava», quale preposizione?"
      prompt: {text: "brava in cucinare", tags: [preposition]}
    - learner: "Brava a cucinare!"
    - tutor: "Esatto! Allora la torta è sua. E il regalo?"
      goals: [food]
    - learner: "Pensavo a un libro. A Sara piace molto leggere."
    - tutor: "Buona idea. Lo compriamo insieme venerdì?"
      goals: [gift]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo in un piccolo paese a Scozia."
      errors: [preposition]
    - tutor: "«A Scozia»? Attenzione: la Scozia non è una città."
      prompt: {text: "a Scozia", tags: [preposition]}
    - learner: "In Scozia, vicino al mare."
    - tutor: "Che posto bello! E cosa facevi di solito?"
      goals: [place]
    - learner: "D'estate andavo sempre da mia nonna. Lei abitava in campagna."
    - tutor: "E cosa facevate insieme?"
    - learner: "Andavamo a pescare a il fiume, ogni mattina."
      errors: [articulated-preposition]
    - tutor: "«A il fiume»? Pensa a come si dice: vado ... mare."
      prompt: {text: "a il fiume", tags: [articulated-preposition]}
    - learner: "Al fiume! Andavamo al fiume ogni mattina."
    - tutor: "Che bei ricordi. E a scuola come andavi?"
      goals: [habits]
    - learner: "Andavo con piedi, due chilometri!"
      errors: [preposition]
    - tutor: "«Con piedi»? Pensa: andavi in macchina, in treno... e senza niente?"
      prompt: {text: "con piedi", tags: [preposition]}
    - learner: "Andavo per piedi."
      errors: [preposition]
    - tutor: "Andavi a piedi, ogni giorno? Bravo! Com'era la scuola?"
      recast: {text: "per piedi", fix: "a piedi", tags: [preposition]}
    - learner: "Era piccola, solo dieci bambini. Il maestro era molto severo."
    - tutor: "Dieci bambini! Ti ricordi un giorno speciale?"
      goals: [school]
    - learner: "Sì, una volta siamo andati tutti a Edimburgo in treno, per vedere il castello."
    - tutor: "Che bel giorno! Avevi quanti anni, più o meno?"
      goals: [event]

- scenario: lavanderia
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie! Ho messo i vestiti e il detersivo, ma la lavatrice non parte."
    - tutor: "Hai messo il gettone?"
      goals: [problem]
    - learner: "No. Come funziona la macchina?"
    - tutor: "Scegli il programma, poi metti il gettone qui sopra."
      goals: [ask-how]
    - learner: "E dove compro il gettone? Devo pagare a la cassa?"
      errors: [articulated-preposition]
    - tutor: "Scusa, come? «A la cassa»?"
      prompt: {text: "a la cassa", tags: [articulated-preposition]}
    - learner: "Alla cassa?"
    - tutor: "No, qui non c'è una cassa. C'è una macchina vicino alla porta: prende monete."
      goals: [payment]
    - learner: "Oh no, ho solo una moneta. Ho dimenticato a prendere il portafoglio!"
      errors: [preposition]
    - tutor: "«Dimenticato a prendere»? Con «dimenticare», quale preposizione va prima del verbo?"
      prompt: {text: "dimenticato a prendere", tags: [preposition]}
    - learner: "Ho dimenticato per prendere?"
      errors: [preposition]
    - tutor: "Hai dimenticato di prendere i soldi? Tranquilla, ti do io tre euro."
      recast: {text: "per prendere", fix: "di prendere", tags: [preposition]}
    - learner: "Grazie mille, sei molto gentile! Domani ti porto i soldi."
    - tutor: "Ma di niente! Io sono qui ogni martedì."
      goals: [thank]

- scenario: prenotare-tavolo
  level: A2
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per sabato sera."
    - tutor: "Certo. Per quante persone e a che ora?"
      goals: [book]
    - learner: "Per sei persone, a le otto e mezza."
      errors: [articulated-preposition]
    - tutor: "Sei persone, va bene. E l'ora? «A le otto e mezza»..."
      prompt: {text: "a le otto e mezza", tags: [articulated-preposition]}
    - learner: "Alle otto e mezza."
    - tutor: "Benissimo, sabato alle otto e mezza per sei."
      goals: [details]
    - learner: "È possibile mangiare fuori, in il giardino?"
      errors: [articulated-preposition]
    - tutor: "«In il giardino»? Provi ancora."
      prompt: {text: "in il giardino", tags: [articulated-preposition]}
    - learner: "Fuori, in giardino?"
    - tutor: "Sì, abbiamo tre tavoli fuori. Lo segno."
    - learner: "Grazie. E avete un seggiolone per un bambino piccolo?"
    - tutor: "Sì, certo. A che nome prenoto?"
      goals: [special]
    - learner: "A nome Clarke. Due elle? No, una: C, L, A, R, K, E."
    - tutor: "Perfetto, signora Clarke. A sabato!"
      goals: [name]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-heritage
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Parto venerdì prossimo e resto per una settimana. Vengo con la mia ragazza."
    - tutor: "Una settimana è perfetta. Dove dormite?"
      goals: [plans]
    - learner: "Abbiamo trovato un piccolo B&B in i Quartieri Spagnoli."
      errors: [articulated-preposition]
    - tutor: "Bella zona! Ma «in i Quartieri Spagnoli»: il nome è plurale, quindi «in» più «i» diventa...?"
      prompt: {text: "in i Quartieri Spagnoli", tags: [articulated-preposition]}
    - learner: "Nei Quartieri Spagnoli."
    - tutor: "Esatto. È un quartiere pieno di vita. Cosa volete vedere?"
    - learner: "Pensiamo di visitare il museo archeologico. E cosa ci consigli di mangiare?"
    - tutor: "Assolutamente la pizza! E poi andate a Procida, l'isola: è vicinissima."
      goals: [advice]
    - learner: "Come si arriva in Procida? Con il traghetto?"
      errors: [preposition]
    - tutor: "Sì, con il traghetto. Ma «in Procida»: per un'isola piccola usiamo la stessa preposizione delle città."
      prompt: {text: "in Procida", tags: [preposition]}
    - learner: "Allora... da Procida?"
      errors: [preposition]
    - tutor: "A Procida, sì! Il traghetto parte dal porto e ci mette quaranta minuti. In città, invece, usate la metro."
      recast: {text: "da Procida", fix: "A Procida", tags: [preposition]}
      goals: [transport]
    - learner: "Ottimo. C'è qualcosa da evitare?"
    - tutor: "Evitate la macchina in centro: il traffico è un incubo!"
      new: [{lemma: incubo, gloss: nightmare}]
      goals: [warnings]

- scenario: biglietto-treno
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno. Dovrei andare in Firenze domani, per una riunione di lavoro."
      errors: [preposition]
    - tutor: "Certo. Ma «in Firenze»? Per le città, quale preposizione usiamo?"
      prompt: {text: "in Firenze", tags: [preposition]}
    - learner: "A Firenze, scusi."
    - tutor: "Perfetto. Domani c'è un Frecciarossa alle sette e un quarto e un regionale alle otto."
      goals: [destination]
    - learner: "Preferirei il Frecciarossa. Mi serve solo l'andata, perché torno in macchina con un collega."
    - tutor: "Solo andata, va bene. Prima o seconda classe?"
      goals: [type]
    - learner: "Seconda. Se è possibile, vorrei un posto a il finestrino."
      errors: [articulated-preposition]
    - tutor: "Vediamo... Ma «a il finestrino»: «a» più «il», come si dice?"
      prompt: {text: "a il finestrino", tags: [articulated-preposition]}
    - learner: "Un posto al finestrino."
    - tutor: "Ecco: posto quattordici, al finestrino."
      goals: [class]
    - learner: "Grazie. E da quale binario parte?"
    - tutor: "Dal binario otto, ma controlli il tabellone: a volte cambia all'ultimo momento."
      new: [{lemma: tabellone, gloss: departures board}]
      goals: [platform]
    - learner: "Va bene. Posso pagare con la carta?"
    - tutor: "Certo, ecco qui. Buon viaggio!"

- scenario: vacanze-passate
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono stata due settimane negli Stati Uniti, a Boston."
    - tutor: "Che viaggio! Che tempo faceva?"
      goals: [where]
    - learner: "Faceva caldissimo, ma vicino al mare c'era sempre un po' di vento."
    - tutor: "Con il vento si sta meglio. E cosa hai fatto?"
      goals: [weather]
    - learner: "Ho visitato a mia cugina, che vive lì da dieci anni."
      errors: [preposition]
    - tutor: "Che bello! Ma «visitato a mia cugina»: in spagnolo c'è quella «a», e in italiano?"
      prompt: {text: "visitato a mia cugina", tags: [preposition]}
    - learner: "Ah, ho visitato mia cugina."
    - tutor: "Proprio così. E cosa avete fatto insieme?"
    - learner: "Siamo andate a vedere una partita di baseball a lo stadio dei Red Sox."
      errors: [articulated-preposition]
    - tutor: "Wow! Ma «a lo stadio»: come uniamo «a» e «lo»?"
      prompt: {text: "a lo stadio", tags: [articulated-preposition]}
    - learner: "Allo stadio! Non ho capito niente del gioco, ma era divertente."
    - tutor: "Ah ah, ti capisco! E il momento più bello?"
      goals: [activities]
    - learner: "Una sera abbiamo cenato in la spiaggia con tutta la sua famiglia."
      errors: [articulated-preposition]
    - tutor: "Che bello! Ma «in la spiaggia»: per dire che eravate lì sopra, quale preposizione?"
      prompt: {text: "in la spiaggia", tags: [articulated-preposition]}
    - learner: "Sulla spiaggia!"
    - tutor: "Esatto. Una cena sul mare con la famiglia: che ricordo!"
      goals: [best]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Pensavo di organizzare una cena a sorpresa da Luigi, il ristorante in corso Vittorio."
    - tutor: "Da Luigi? Ottima idea, Sara lo adora. Quando?"
    - learner: "Sabato diciotto, così il giorno dopo nessuno lavora."
    - tutor: "Perfetto. Chi invitiamo?"
      goals: [date]
    - learner: "I suoi amici dell'università e sua sorella. Ma attenzione a Marco: non riesce di tenere un segreto!"
      errors: [preposition]
    - tutor: "Ah ah, è vero! Ma «non riesce di tenere»: con «riuscire», che preposizione usiamo?"
      prompt: {text: "riesce di tenere", tags: [preposition]}
    - learner: "Non riesce a tenere un segreto."
    - tutor: "Esatto, a lui lo diciamo all'ultimo momento. E per mangiare?"
      goals: [guests]
    - learner: "Da Luigi la pizza è ottima. La torta invece la ordino in la pasticceria vicino a casa mia."
      errors: [articulated-preposition]
    - tutor: "La ordini... dove? Ripeti solo la parte della pasticceria."
      prompt: {text: "in la pasticceria", tags: [articulated-preposition]}
    - learner: "Nella pasticceria vicino a casa mia."
    - tutor: "Perfetto, lì fanno dolci buonissimi. E il regalo?"
      goals: [food]
    - learner: "Ho pensato in un viaggio: un fine settimana a Venezia per lei e il suo ragazzo."
      errors: [preposition]
    - tutor: "Che regalo! Ma «ho pensato in un viaggio»: dopo «pensare», quale preposizione usiamo per un'idea?"
      prompt: {text: "pensato in un viaggio", tags: [preposition]}
    - learner: "Ho pensato di un viaggio?"
      errors: [preposition]
    - tutor: "Hai pensato a un viaggio? Bellissimo, ma costa! Dividiamo la spesa tra tutti?"
      recast: {text: "di un viaggio", fix: "a un viaggio", tags: [preposition]}
      goals: [gift]
    - learner: "Sì, certo. Stasera scrivo a tutti."
    - tutor: "Perfetto, e io chiamo Luigi per prenotare."

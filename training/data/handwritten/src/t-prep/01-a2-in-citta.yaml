# t-prep, file 01: A2, prepositions with places, transport and errands in town.
- scenario: autobus
  level: A2
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno! Dove deve andare?"
    - learner: "Buongiorno. Questo autobus va allo stadio?"
    - tutor: "Sì, la linea 7 va allo stadio. Ha già il biglietto?"
      goals: [route]
    - learner: "No, non ce l'ho. Dove lo compro?"
    - tutor: "In tabaccheria, qui di fronte. Fa un euro e cinquanta."
      goals: [ticket]
    - learner: "Va bene. Poi devo scendere a la fermata di via Dante?"
      errors: [articulated-preposition]
    - tutor: "«A la fermata»? Attenzione, qui «a» e «la» diventano una parola sola."
      prompt: {text: "a la fermata", tags: [articulated-preposition]}
    - learner: "Alla fermata di via Dante?"
    - tutor: "Esatto. Ma è meglio scendere alla fermata dopo, in piazza Verdi."
      goals: [stop]
    - learner: "Ah, grazie. E il biglietto lo timbro in l'autobus?"
      errors: [articulated-preposition]
    - tutor: "«In l'autobus»? Come prima: preposizione e articolo insieme."
      prompt: {text: "in l'autobus", tags: [articulated-preposition]}
    - learner: "Nel autobus?"
      errors: [articulated-preposition]
    - tutor: "Sì, nell'autobus, appena sale. La macchina gialla è vicino alla porta."
      recast: {text: "Nel autobus", fix: "nell'autobus", tags: [articulated-preposition]}
    - learner: "Perfetto. Grazie mille, buona giornata!"
    - tutor: "Grazie a Lei! E buona partita!"
      goals: [thank]

- scenario: chiedere-strada
  level: A2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Scusi, signora, cerco la stazione. Devo prendere il treno per Verona."
    - tutor: "La stazione è un po' lontana. Va a piedi o in macchina?"
      goals: [get-attention]
    - learner: "Vado con piedi. È possibile?"
      errors: [preposition]
    - tutor: "«Con piedi»? Pensi a come dice: vado in macchina, vado in treno... e senza mezzi?"
      prompt: {text: "con piedi", tags: [preposition]}
    - learner: "Vado a piedi."
    - tutor: "Benissimo, sono quindici minuti. Allora, vada dritto fino al semaforo."
      goals: [ask-place]
    - learner: "Dritto fino al semaforo, e poi?"
    - tutor: "Poi a sinistra, in via Garibaldi. La stazione è in fondo alla strada."
    - learner: "Allora, dritto, poi a sinistra, e la stazione è a fondo della strada?"
      errors: [articulated-preposition]
    - tutor: "«A fondo della strada»? Ripeta come ho detto io: la stazione è... dove?"
      prompt: {text: "a fondo della strada", tags: [articulated-preposition]}
    - learner: "In fondo alla strada!"
    - tutor: "Perfetto, ha capito tutto. Non può sbagliare!"
      goals: [understand]
    - learner: "Grazie mille, è molto gentile."
    - tutor: "Prego! Buon viaggio a Verona."
      goals: [thank]

- scenario: ufficio-postale
  level: A2
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire questo pacco a Germania, per mia sorella."
      errors: [preposition]
    - tutor: "Certo. Ma «a Germania»? La Germania è un paese, non una città."
      prompt: {text: "a Germania", tags: [preposition]}
    - learner: "Per Germania? A Monaco."
      errors: [preposition]
    - tutor: "Ah, in Germania, a Monaco. Lo vuole normale o veloce?"
      recast: {text: "Per Germania", fix: "in Germania", tags: [preposition]}
      goals: [send]
    - learner: "Veloce, per favore. Il suo compleanno è fra cinque giorni."
    - tutor: "Allora le consiglio il pacco veloce: arriva in tre giorni. Ecco il modulo."
      goals: [speed]
    - learner: "Grazie. Scrivo l'indirizzo qui, sopra la linea?"
    - tutor: "Sì, lì. E sotto scriva cosa c'è nel pacco."
    - learner: "Ci sono due libri e una sciarpa di lana."
    - tutor: "Va bene. Sono diciotto euro. Paga in contanti o con la carta?"
      goals: [form]
    - learner: "Con la carta. Ecco."
    - tutor: "Grazie. Ecco la ricevuta, la tenga fino all'arrivo del pacco."
      goals: [pay]

- scenario: weekend-scorso
  level: A2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Benissimo! Sabato sono andata in Verona con due amiche."
      errors: [preposition]
    - tutor: "Che bello! Ma «in Verona»: Verona è una città. Che preposizione usiamo?"
      prompt: {text: "in Verona", tags: [preposition]}
    - learner: "A Verona!"
    - tutor: "Esatto! E cosa avete fatto lì?"
      goals: [where]
    - learner: "Abbiamo visto l'Arena e abbiamo mangiato in una trattoria piccola."
    - tutor: "L'Arena è bellissima! Chi erano le tue amiche?"
      goals: [what]
    - learner: "Pilar e Marta, due ragazze di Siviglia. Studiano con me all'università."
    - tutor: "Ah, quindi un fine settimana tutto spagnolo! Come siete tornate?"
      goals: [with-who]
    - learner: "Siamo tornate per treno, la sera tardi."
      errors: [preposition]
    - tutor: "«Per treno»? Pensa: si dice in macchina, in aereo... e con il treno?"
      prompt: {text: "per treno", tags: [preposition]}
    - learner: "Siamo tornate per il treno?"
      errors: [preposition]
    - tutor: "Ah, siete tornate in treno, la sera. Stanche ma contente, immagino!"
      recast: {text: "per il treno", fix: "in treno", tags: [preposition]}
    - learner: "Sì, molto contente! E tu, cosa hai fatto?"
    - tutor: "Niente di speciale: sono rimasta a casa e ho dormito tanto!"
      goals: [opinion]

- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Siamo stati in Sardegna, in un piccolo albergo vicino al mare."
    - tutor: "In Sardegna, che bello! Che tempo avete trovato?"
      goals: [where]
    - learner: "Sempre sole e caldo. Ogni mattina andavamo a la spiaggia."
      errors: [articulated-preposition]
    - tutor: "Bello! Ma «a la spiaggia»: «a» più «la», come diventa?"
      prompt: {text: "a la spiaggia", tags: [articulated-preposition]}
    - learner: "Alla spiaggia! Ogni mattina andavamo alla spiaggia."
    - tutor: "Che fortuna! E cosa facevate in spiaggia?"
      goals: [weather]
    - learner: "Mia moglie leggeva sotto l'ombrellone e io nuotavo. Un giorno abbiamo fatto una gita in barca."
    - tutor: "In barca! Dove siete andati?"
      new: [{lemma: barca, gloss: boat}]
    - learner: "Siamo andati a un'isola piccola, vicino a la costa."
      errors: [articulated-preposition]
    - tutor: "«Vicino a la costa»: anche qui, come prima..."
      prompt: {text: "a la costa", tags: [articulated-preposition]}
    - learner: "Vicino della costa?"
      errors: [articulated-preposition]
    - tutor: "Ah, vicino alla costa! E com'era quel posto?"
      recast: {text: "Vicino della costa", fix: "Vicino alla costa", tags: [articulated-preposition]}
      goals: [activities]
    - learner: "Bellissima, con l'acqua verde. È stato il giorno più bello delle vacanze."
    - tutor: "Ci credo! Mi hai fatto venire voglia di partire."
      goals: [best]

- scenario: famiglia
  level: A2
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei nonni. Abitano in Irlanda, in un paese vicino a Galway."
    - tutor: "Che bel posto! Li vedi spesso?"
      goals: [who]
    - learner: "Due volte a l'anno. A Natale vado sempre da loro."
      errors: [articulated-preposition]
    - tutor: "Che bello. Ma «a l'anno»: come si uniscono «a» e «l'»?"
      prompt: {text: "a l'anno", tags: [articulated-preposition]}
    - learner: "Al anno?"
      errors: [articulated-preposition]
    - tutor: "Due volte all'anno, e sempre a Natale. Com'è tua nonna?"
      recast: {text: "Al anno", fix: "all'anno", tags: [articulated-preposition]}
    - learner: "È molto simpatica e cucina benissimo. Ha ottantadue anni, ma va ancora in bicicletta."
    - tutor: "Ottantadue anni e va in bicicletta? Bravissima!"
      goals: [describe, ages]
    - learner: "Sì! E questo è mio cugino Sean. Adesso lavora in Dublino, in una banca."
      errors: [preposition]
    - tutor: "«In Dublino»? Dublino è una città, come Roma..."
      prompt: {text: "in Dublino", tags: [preposition]}
    - learner: "Lavora a Dublino."
    - tutor: "Esatto. Che bella famiglia!"
    - learner: "E tu, Marco? Hai fratelli o sorelle?"
    - tutor: "Ho una sorella più piccola. Studia a Torino, al Politecnico."
      goals: [ask]

- scenario: tempo-libero
  level: A2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Mi piace molto ascoltare a musica e suonare la chitarra."
      errors: [preposition]
    - tutor: "Che bello! Ma «ascoltare a musica»: dopo «ascoltare» serve davvero una preposizione?"
      prompt: {text: "ascoltare a musica", tags: [preposition]}
    - learner: "Ascoltare la musica!"
    - tutor: "Perfetto. E quanto spesso suoni la chitarra?"
      goals: [hobby]
      new: [{lemma: chitarra, gloss: guitar}]
    - learner: "Quasi ogni sera, dopo cena. Il sabato suono con un gruppo di amici."
    - tutor: "Un gruppo! Dove suonate?"
      goals: [frequency]
    - learner: "Alla casa di Javier, il nostro batterista. Lui ha una cantina grande."
      errors: [articulated-preposition]
    - tutor: "«Alla casa di Javier»? Con «casa» e il nome di una persona, serve l'articolo?"
      prompt: {text: "Alla casa di Javier", tags: [articulated-preposition]}
    - learner: "Nella casa di Javier?"
      errors: [articulated-preposition]
    - tutor: "A casa di Javier, in cantina: perfetto per suonare forte! Io invece il sabato vado a ballare."
      recast: {text: "Nella casa di Javier", fix: "A casa di Javier", tags: [articulated-preposition]}
    - learner: "Ah sì? E dove vai a ballare?"
    - tutor: "In una scuola di ballo, in centro. Ci vado da due anni."
      goals: [ask]
    - learner: "Una scuola di ballo! Posso venire con te una volta?"
    - tutor: "Ma certo! Sabato prossimo, alle nove. Ti aspetto!"
      goals: [propose]

- scenario: noleggio-bici
  level: A2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno! Vuole una bicicletta?"
    - learner: "Sì, grazie. Vorrei noleggiare una bici per tutta la giornata."
    - tutor: "Benissimo. Per la giornata sono quindici euro."
      goals: [ask, duration]
    - learner: "Va bene. Il casco è compreso in il prezzo?"
      errors: [articulated-preposition]
    - tutor: "«In il prezzo»? Ricordi come si uniscono «in» e «il»?"
      prompt: {text: "in il prezzo", tags: [articulated-preposition]}
    - learner: "Nel prezzo!"
    - tutor: "Esatto. Sì, Le do anche il casco e il lucchetto."
      goals: [price]
    - learner: "Perfetto. Voglio andare a il lago. C'è un bel percorso?"
      errors: [articulated-preposition]
    - tutor: "«A il lago»: come prima, «a» e «il» insieme..."
      prompt: {text: "a il lago", tags: [articulated-preposition]}
    - learner: "A lo lago?"
      errors: [articulated-preposition]
    - tutor: "Al lago, sì! C'è un percorso bellissimo, tutto in piano."
      recast: {text: "A lo lago", fix: "Al lago", tags: [articulated-preposition]}
      goals: [route]
    - learner: "Tutto in piano? Ottimo, sono un po' fuori allenamento!"
    - tutor: "Allora è perfetto per Lei. Buona giornata!"

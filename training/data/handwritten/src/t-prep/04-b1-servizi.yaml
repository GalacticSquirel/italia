# t-prep, file 04: B1, prepositions in services, health, work and complaints.
- scenario: affittare-appartamento
  level: B1
  persona: en-m-traveller
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno! È molto luminoso. Sono davvero interessato in questo appartamento."
      errors: [preposition]
    - tutor: "Mi fa piacere! Ma «interessato in questo appartamento»: dopo «interessato», quale preposizione?"
      prompt: {text: "interessato in questo appartamento", tags: [preposition]}
    - learner: "Interessato per questo appartamento?"
      errors: [preposition]
    - tutor: "Bene, se è interessato a questo appartamento, le spiego tutto. L'affitto è di settecento euro al mese."
      recast: {text: "per questo appartamento", fix: "a questo appartamento", tags: [preposition]}
    - learner: "Le spese del condominio sono incluse in l'affitto?"
      errors: [articulated-preposition]
    - tutor: "«In l'affitto»: preposizione e articolo qui si uniscono. Come?"
      prompt: {text: "in l'affitto", tags: [articulated-preposition]}
    - learner: "Nell'affitto?"
    - tutor: "Esatto. No, le spese sono a parte: circa ottanta euro al mese."
      goals: [rent]
    - learner: "Capisco. E il contratto quanto dura? Vorrei restare per almeno due anni."
    - tutor: "È un contratto di quattro anni più quattro. Chiedo due mesi di caparra."
      goals: [contract]
    - learner: "Va bene. Il riscaldamento è autonomo? E ci sono problemi con l'umidità a l'inverno?"
      errors: [articulated-preposition]
    - tutor: "Il riscaldamento è autonomo, sì. Ma «a l'inverno»: per una stagione, come diciamo?"
      prompt: {text: "a l'inverno", tags: [articulated-preposition]}
    - learner: "All'inverno?"
      errors: [articulated-preposition]
    - tutor: "No, d'inverno nessun problema: la casa è calda e la caldaia è nuova."
      recast: {text: "All'inverno", fix: "d'inverno", tags: [articulated-preposition]}
      new: [{lemma: caldaia, gloss: boiler}]
      goals: [condition]
    - learner: "Ottimo. E il quartiere è tranquillo? Io lavoro in centro."
    - tutor: "Tranquillissimo, e con la metro arriva in centro in dieci minuti."
      goals: [neighbourhood]
    - learner: "Perfetto. Ci penso stasera e la chiamo domani mattina."
    - tutor: "Benissimo, aspetto la sua telefonata."
      goals: [decide]

- scenario: banca-conto
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Vorrei aprire un conto. Ho bisogno per un conto italiano per lo stipendio."
      errors: [preposition]
    - tutor: "Certo. Ma «ho bisogno per un conto»: con «avere bisogno», quale preposizione?"
      prompt: {text: "bisogno per un conto", tags: [preposition]}
    - learner: "Ho bisogno di un conto italiano."
    - tutor: "Benissimo. Lavora qui in Italia da molto?"
      goals: [purpose]
    - learner: "Da settembre. Insegno spagnolo a una scuola di lingue."
      errors: [preposition]
    - tutor: "Che bello! Ma «insegno a una scuola»: per il posto dove si lavora, quale preposizione usiamo?"
      prompt: {text: "a una scuola", tags: [preposition]}
    - learner: "Insegno per una scuola di lingue?"
      errors: [preposition]
    - tutor: "Ah, insegna in una scuola di lingue, perfetto. Le servono un documento e il codice fiscale."
      recast: {text: "per una scuola", fix: "in una scuola", tags: [preposition]}
      goals: [documents]
    - learner: "Li ho qui. Quanto costa il conto al mese?"
    - tutor: "Il conto base costa due euro al mese. È gratis per chi ha meno di trent'anni."
      goals: [costs]
    - learner: "Peccato, ne ho quaranta! Posso fare i bonifici da l'app?"
      errors: [articulated-preposition]
    - tutor: "Ah ah! Ma «da l'app»: due parole che diventano una, come?"
      prompt: {text: "da l'app", tags: [articulated-preposition]}
    - learner: "Dall'app."
    - tutor: "Sì, dall'app può fare tutto. E le diamo anche la carta di debito."
      goals: [card]
    - learner: "Perfetto. Dove devo firmare?"
    - tutor: "Qui in fondo, e poi qui accanto. Ecco fatto, benvenuta!"

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Hannah, ho ventisei anni e mi sono laureata in economia a l'università di Leeds."
      errors: [articulated-preposition]
    - tutor: "Piacere. Ma «a l'università»: «a» più «l'», come lo diciamo?"
      prompt: {text: "a l'università", tags: [articulated-preposition]}
    - learner: "All'università di Leeds."
    - tutor: "Perfetto. E che esperienza ha?"
      goals: [intro]
    - learner: "Ho lavorato per tre anni in Barcellona, in un'azienda di turismo."
      errors: [preposition]
    - tutor: "Interessante. Ma «in Barcellona»: per una città, quale preposizione?"
      prompt: {text: "in Barcellona", tags: [preposition]}
    - learner: "Ho lavorato per tre anni a Barcellona."
    - tutor: "Molto bene. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Sono brava in risolvere i problemi e lavoro bene in squadra. Però a volte sono troppo precisa."
      errors: [preposition]
    - tutor: "Anche essere precisi è utile! Ma «brava in risolvere»: con un verbo dopo «brava», quale preposizione?"
      prompt: {text: "brava in risolvere", tags: [preposition]}
    - learner: "Brava per risolvere?"
      errors: [preposition]
    - tutor: "Essere brava a risolvere i problemi è importante qui. Perché vuole lavorare con noi?"
      recast: {text: "per risolvere", fix: "a risolvere", tags: [preposition]}
      goals: [strengths]
    - learner: "Ho deciso a cambiare settore perché il vostro progetto sul turismo sostenibile mi piace molto."
      errors: [preposition]
    - tutor: "Ci fa piacere. Ma «ho deciso a cambiare»: dopo «decidere», quale preposizione?"
      prompt: {text: "deciso a cambiare", tags: [preposition]}
    - learner: "Ho deciso di cambiare settore."
    - tutor: "Chiaro. Ha qualche domanda per noi?"
      goals: [why]
    - learner: "Sì: con chi lavorerei ogni giorno?"
    - tutor: "Con una squadra di cinque persone, quasi tutte giovani come lei."
      goals: [questions]

- scenario: dal-meccanico
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Quando freno, si sente un rumore forte. Secondo me il problema è in i freni."
      errors: [articulated-preposition]
    - tutor: "Capisco. Ma «in i freni»: «in» più «i», come si dice?"
      prompt: {text: "in i freni", tags: [articulated-preposition]}
    - learner: "Nei freni."
    - tutor: "Ecco. Da quando sente questo rumore?"
      goals: [describe]
    - learner: "Da una settimana, più o meno. Dopo un viaggio in montagna."
    - tutor: "Sulle strade di montagna i freni lavorano tanto. Probabilmente sono da cambiare."
      goals: [when]
    - learner: "Quanto costa? Devo pagare tutto in una volta?"
    - tutor: "Le faccio un preventivo: circa duecento euro, pezzi compresi."
      goals: [cost]
    - learner: "Va bene. Ho bisogno della macchina per venerdì: venerdì devo andare a l'aeroporto."
      errors: [articulated-preposition]
    - tutor: "Per venerdì, d'accordo. Ma «a l'aeroporto»: come prima, le due parole si uniscono."
      prompt: {text: "a l'aeroporto", tags: [articulated-preposition]}
    - learner: "Al aeroporto?"
      errors: [articulated-preposition]
    - tutor: "Se deve andare all'aeroporto venerdì, gliela preparo per giovedì sera."
      recast: {text: "Al aeroporto", fix: "all'aeroporto", tags: [articulated-preposition]}
      goals: [time]
    - learner: "Grazie mille. Passo giovedì dopo le sei."
    - tutor: "Perfetto, a giovedì!"

- scenario: medico-base
  level: B1
  persona: en-m-retired
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Ho un dolore forte in la schiena, soprattutto la mattina."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Ma «in la schiena»: con «dolore», quale preposizione indica dove fa male?"
      prompt: {text: "in la schiena", tags: [articulated-preposition]}
    - learner: "Dolore nella schiena?"
      errors: [articulated-preposition]
    - tutor: "Un dolore alla schiena la mattina, capisco. Da quanto tempo?"
      recast: {text: "nella schiena", fix: "alla schiena", tags: [articulated-preposition]}
      goals: [symptoms]
    - learner: "Ho cominciato sentirlo dieci giorni fa, dopo un lavoro in giardino."
      errors: [preposition]
    - tutor: "Ah, il giardino! Ma «ho cominciato sentirlo»: dopo «cominciare», cosa mettiamo prima del verbo?"
      prompt: {text: "cominciato sentirlo", tags: [preposition]}
    - learner: "Ho cominciato a sentirlo dieci giorni fa."
    - tutor: "Va bene. Prende già qualche medicina?"
      goals: [since-when]
    - learner: "Sì, prendo una pillola per la pressione ogni mattina. Non sono allergico a niente."
    - tutor: "Bene. Allora le do un antinfiammatorio per cinque giorni, dopo mangiato. E niente lavori pesanti."
      new: [{lemma: antinfiammatorio, gloss: anti-inflammatory}]
      goals: [history]
    - learner: "Quindi una pillola dopo mangiato per cinque giorni, e smetto per lavorare in giardino?"
      errors: [preposition]
    - tutor: "Quasi. Ma «smetto per lavorare»: con «smettere», quale preposizione?"
      prompt: {text: "smetto per lavorare", tags: [preposition]}
    - learner: "Smetto di lavorare in giardino."
    - tutor: "Esatto, almeno per due settimane. Il giardino può aspettare!"
      goals: [instructions]

- scenario: prenotare-visita
  level: B1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno. Vorrei prenotare una visita a il dermatologo, per un problema alla pelle."
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «una visita a il dermatologo»: quale preposizione usiamo con un medico?"
      prompt: {text: "a il dermatologo", tags: [articulated-preposition]}
    - learner: "Una visita al dermatologo?"
      errors: [articulated-preposition]
    - tutor: "Sì, una visita dal dermatologo. Il primo posto libero è giovedì prossimo."
      recast: {text: "al dermatologo", fix: "dal dermatologo", tags: [articulated-preposition]}
      goals: [type]
    - learner: "Giovedì ho lezione fino a mezzogiorno. Posso venire da le tre?"
      errors: [articulated-preposition]
    - tutor: "Vediamo. Ma «da le tre»: come uniamo «da» e «le»?"
      prompt: {text: "da le tre", tags: [articulated-preposition]}
    - learner: "Dalle tre in poi."
    - tutor: "Perfetto, giovedì alle tre e mezza."
      goals: [availability]
    - learner: "Quanto costa la visita? Ho l'impegnativa di il mio medico."
      errors: [articulated-preposition]
    - tutor: "«Di il mio medico»? Provi ancora."
      prompt: {text: "di il mio medico", tags: [articulated-preposition]}
    - learner: "Del mio medico."
    - tutor: "Benissimo. Con l'impegnativa paga solo trentasei euro."
      goals: [cost]
    - learner: "Allora: giovedì alle tre e mezza dal dermatologo, con l'impegnativa e la tessera sanitaria."
    - tutor: "Esatto, e arrivi dieci minuti prima. Buona giornata!"
      goals: [confirm]

- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Sì, purtroppo. Nella mia camera c'è un rumore terribile che viene da la strada."
      errors: [articulated-preposition]
    - tutor: "Mi dispiace. Ma «da la strada»: come uniamo queste due parole?"
      prompt: {text: "da la strada", tags: [articulated-preposition]}
    - learner: "Dalla strada. C'è un bar sotto la finestra, con la musica alta."
    - tutor: "Ah, il bar all'angolo. Da quando c'è questo rumore?"
      goals: [problem]
    - learner: "Da ieri sera. Non ho dormito fino a le due."
      errors: [articulated-preposition]
    - tutor: "Che brutta notte. Ma «fino a le due»: «a» più «le»...?"
      prompt: {text: "a le due", tags: [articulated-preposition]}
    - learner: "Fino a due?"
      errors: [articulated-preposition]
    - tutor: "Fino alle due di notte, capisco. Mi dispiace davvero."
      recast: {text: "Fino a due", fix: "Fino alle due", tags: [articulated-preposition]}
      goals: [since]
    - learner: "Vorrei cambiare in un'altra camera, più tranquilla, sul retro."
      errors: [preposition]
    - tutor: "Certo. Ma «cambiare in un'altra camera»: con «cambiare camera», ci vuole davvero una preposizione?"
      prompt: {text: "cambiare in un'altra camera", tags: [preposition]}
    - learner: "Vorrei cambiare camera."
    - tutor: "Va bene. Ho una camera libera al quarto piano, sul cortile."
      goals: [request]
    - learner: "Perfetto, la prendo. Grazie per l'aiuto."
    - tutor: "Si figuri. Le mando subito qualcuno per le valigie."
      goals: [agree]

- scenario: restituire-prodotto
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato queste cuffie qui due settimane fa, ma si sentono solo in una parte."
      errors: [preposition]
    - tutor: "Mi dispiace. Ma «si sentono solo in una parte»: per dire quale lato, quale preposizione usiamo?"
      prompt: {text: "in una parte", tags: [preposition]}
    - learner: "Si sentono solo da una parte, la destra."
    - tutor: "Capisco, sono difettose. Ha lo scontrino?"
      goals: [problem]
    - learner: "Sì, eccolo. L'avevo in il portafoglio."
      errors: [articulated-preposition]
    - tutor: "«In il portafoglio»? Provi a unire le due parole."
      prompt: {text: "in il portafoglio", tags: [articulated-preposition]}
    - learner: "Nel portafoglio."
    - tutor: "Perfetto. Sono ancora in garanzia, non c'è problema."
      goals: [proof]
    - learner: "Preferirei il rimborso, perché ho pensato a comprare un altro modello."
      errors: [preposition]
    - tutor: "Va bene. Ma «ho pensato a comprare»: quando pensiamo di fare qualcosa, quale preposizione va prima del verbo?"
      prompt: {text: "pensato a comprare", tags: [preposition]}
    - learner: "Ho pensato per comprare un altro modello?"
      errors: [preposition]
    - tutor: "Se ha pensato di comprare un altro modello, allora le faccio il rimborso."
      recast: {text: "per comprare", fix: "di comprare", tags: [preposition]}
      goals: [request]
    - learner: "Grazie. Sulla carta, per favore."
    - tutor: "Certo, sulla carta. Tra tre o quattro giorni vede i soldi sul conto."
      goals: [agree]

# t-prep, file 05: B1, prepositions after verbs and adjectives, time phrases, places of work and home.
- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Sono nato in 1988 in un paese vicino a Salamanca. Abitavamo a una fattoria."
      errors: [articulated-preposition, preposition]
    - tutor: "Una fattoria, che bello! Ma «abitavamo a una fattoria»: per dire dentro un posto così, quale preposizione?"
      prompt: {text: "a una fattoria", tags: [preposition]}
    - learner: "Abitavamo per una fattoria?"
      errors: [preposition]
    - tutor: "Ah, abitavate in una fattoria! Con gli animali?"
      recast: {text: "per una fattoria", fix: "in una fattoria", tags: [preposition]}
      goals: [place]
    - learner: "Sì, avevamo mucche, galline e un cane enorme. Ogni mattina davo da mangiare alle galline."
    - tutor: "Che vita! E la scuola era lontana?"
      goals: [habits]
    - learner: "Abbastanza. Andavo a scuola con il pullman, con mio fratello. Il viaggio durava quaranta minuti."
    - tutor: "Quaranta minuti ogni mattina! E com'era la scuola?"
    - learner: "Era piccola. In la mia classe eravamo solo dodici."
      errors: [articulated-preposition]
    - tutor: "Dodici, pochissimi! Ma «in la mia classe»: preposizione e articolo diventano una parola."
      prompt: {text: "In la mia classe", tags: [articulated-preposition]}
    - learner: "Nella mia classe eravamo dodici."
    - tutor: "Perfetto. E c'è un ricordo speciale di quegli anni?"
      goals: [school]
    - learner: "Sì: un inverno è nevicato tanto e siamo rimasti tre giorni a casa senza la luce."
    - tutor: "Tre giorni senza luce! Per un bambino, che festa."
      goals: [event]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbastanza bene. Questa settimana ci siamo concentrati su il design del nuovo sito."
      errors: [articulated-preposition]
    - tutor: "Ottimo. Ma «su il design»: come diventano «su» e «il»?"
      prompt: {text: "su il design", tags: [articulated-preposition]}
    - learner: "Sul design."
    - tutor: "Esatto. E ci sono problemi?"
      goals: [update]
    - learner: "Sì, un problema: il cliente non ha ancora risposto. Stiamo aspettando per i testi da tre settimane."
      errors: [preposition]
    - tutor: "Tre settimane! Ma «aspettando per i testi»: dopo «aspettare», serve davvero «per»?"
      prompt: {text: "aspettando per i testi", tags: [preposition]}
    - learner: "Stiamo aspettando per loro testi?"
      errors: [preposition]
    - tutor: "Capisco, state aspettando i loro testi da tre settimane. È un bel ritardo."
      recast: {text: "aspettando per loro testi", fix: "aspettando i loro testi", tags: [preposition]}
      goals: [problem]
    - learner: "Propongo di scrivere noi i testi e mandarli a il cliente per l'approvazione."
      errors: [articulated-preposition]
    - tutor: "Buona idea. Ma «mandarli a il cliente»: provi a unire."
      prompt: {text: "a il cliente", tags: [articulated-preposition]}
    - learner: "Mandarli al cliente."
    - tutor: "Perfetto. Così risparmiamo tempo."
      goals: [proposal]
    - learner: "Allora il sito può essere pronto per la fine del mese, ma dipende di il cliente."
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «dipende di il cliente»: con «dipendere», quale preposizione?"
      prompt: {text: "di il cliente", tags: [articulated-preposition]}
    - learner: "Dipende del cliente?"
      errors: [articulated-preposition]
    - tutor: "Sì, dipende dal cliente. Diciamo il trenta, allora, e lo scrivo nel verbale."
      recast: {text: "del cliente", fix: "dal cliente", tags: [articulated-preposition]}
      new: [{lemma: verbale, gloss: minutes (of a meeting)}]
      goals: [deadline]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-traveller
  history: [preposition]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Non molto sane. Lavoro tanto al computer e la sera non riesco dormire prima dell'una."
      errors: [preposition]
    - tutor: "Ti capisco. Ma «non riesco dormire»: dopo «riuscire», cosa mettiamo prima del verbo?"
      prompt: {text: "riesco dormire", tags: [preposition]}
    - learner: "Non riesco di dormire?"
      errors: [preposition]
    - tutor: "Se non riesci a dormire, sei sempre stanco. E lo sport?"
      recast: {text: "di dormire", fix: "a dormire", tags: [preposition]}
    - learner: "Corro un po' la domenica, a il parco vicino a casa."
      errors: [articulated-preposition]
    - tutor: "Bene! Ma «a il parco»: come si uniscono le due parole?"
      prompt: {text: "a il parco", tags: [articulated-preposition]}
    - learner: "Al parco vicino a casa."
    - tutor: "Perfetto. E qual è il tuo obiettivo?"
      goals: [habits]
    - learner: "Vorrei perdere cinque chili e sentirmi meno stanco."
    - tutor: "Si può fare. Cosa ti ferma, di solito?"
      goals: [goal]
    - learner: "Il tempo, soprattutto. E quando torno a casa ho voglia solo di stare sul divano."
    - tutor: "Normale! Allora facciamo un piano semplice. Quante volte puoi allenarti?"
      goals: [obstacles]
    - learner: "Tre volte a la settimana, il lunedì, il mercoledì e il venerdì."
      errors: [articulated-preposition]
    - tutor: "Tre volte... come? «A la settimana»?"
      prompt: {text: "a la settimana", tags: [articulated-preposition]}
    - learner: "Tre volte alla settimana."
    - tutor: "Ottimo: lunedì, mercoledì e venerdì, alle sette. E niente telefono a letto!"
      goals: [plan]

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro da casa da un anno. Vado all'ufficio solo il venerdì."
      errors: [articulated-preposition]
    - tutor: "Da un anno, però! Ma «vado all'ufficio»: per il posto di lavoro, come diciamo di solito?"
      prompt: {text: "all'ufficio", tags: [articulated-preposition]}
    - learner: "Vado al ufficio?"
      errors: [articulated-preposition]
    - tutor: "Ah, vai in ufficio solo il venerdì. E a casa come ti trovi?"
      recast: {text: "al ufficio", fix: "in ufficio", tags: [articulated-preposition]}
      goals: [situation]
    - learner: "Bene. Non perdo tempo in il traffico e pranzo con mia figlia."
      errors: [articulated-preposition]
    - tutor: "Che bello. Ma «in il traffico»: come si uniscono «in» e «il»?"
      prompt: {text: "in il traffico", tags: [articulated-preposition]}
    - learner: "Nel traffico."
    - tutor: "Esatto. E gli svantaggi?"
      goals: [pros]
    - learner: "Mi mancano i colleghi. E poi pago di più per la luce e per il riscaldamento."
    - tutor: "Eh sì, le bollette salgono. Allora cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei lavorare due giorni da casa e tre giorni in ufficio. È più equilibrato."
    - tutor: "Mi sembra una buona via di mezzo. Ne hai parlato con il tuo capo?"
      goals: [preference]
    - learner: "Non ancora, ma penso di parlargli a la riunione di lunedì."
      errors: [articulated-preposition]
    - tutor: "Buona idea. Ma «a la riunione»: come diventano le due parole?"
      prompt: {text: "a la riunione", tags: [articulated-preposition]}
    - learner: "Alla riunione di lunedì!"
    - tutor: "Perfetto. In bocca al lupo per lunedì!"

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Messico la festa più importante è la notte del ventiquattro. Si mangia tardi, verso mezzanotte."
    - tutor: "Così tardi! E cosa si mangia?"
    - learner: "Il bacalao, i tamales e il ponche, una bevanda calda con la frutta."
    - tutor: "Che buono! E da piccola come festeggiavi?"
      goals: [compare]
    - learner: "Andavamo sempre da i nonni, in un paese vicino a Puebla."
      errors: [articulated-preposition]
    - tutor: "Che bello. Ma «da i nonni»: «da» più «i», come diventa?"
      prompt: {text: "da i nonni", tags: [articulated-preposition]}
    - learner: "Dei nonni?"
      errors: [articulated-preposition]
    - tutor: "Sempre dai nonni, che bello. Eravate in tanti?"
      recast: {text: "Dei nonni", fix: "dai nonni", tags: [articulated-preposition]}
    - learner: "Sì, più di trenta persone! E qui in Italia, cosa si mangia di tipico? Sono curiosa per assaggiare il panettone."
      errors: [preposition]
    - tutor: "Trenta, che festa! Ma «curiosa per assaggiare»: dopo «curiosa», con un verbo, quale preposizione?"
      prompt: {text: "curiosa per assaggiare", tags: [preposition]}
      goals: [past]
    - learner: "Sono curiosa di assaggiare il panettone."
    - tutor: "Allora lo provi da noi! E poi c'è la pasta fatta in casa da mia nonna."
      goals: [ask]
    - learner: "Che bello! Cosa devo portare a il pranzo?"
      errors: [articulated-preposition]
    - tutor: "Niente, davvero! Ma «a il pranzo»: provi a unire."
      prompt: {text: "a il pranzo", tags: [articulated-preposition]}
    - learner: "Cosa porto al pranzo?"
    - tutor: "Se vuoi, un dolce del tuo paese. Mia nonna ne sarà felicissima!"
      goals: [plan]

- scenario: vicino-rumoroso
  level: B1
  persona: en-m-retired
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, scusi il disturbo. Mi chiamo Peter, abito a il piano di sotto."
      errors: [articulated-preposition]
    - tutor: "Piacere, Peter. Ma «a il piano di sotto»: «a» più «il»...?"
      prompt: {text: "a il piano di sotto", tags: [articulated-preposition]}
    - learner: "Al piano di sotto."
    - tutor: "Ah, certo, al secondo. Mi dica pure."
      goals: [greet]
    - learner: "Ecco, ogni sera sento il pianoforte fino a mezzanotte. Io lavoro a l'ospedale e mi alzo alle cinque."
      errors: [articulated-preposition]
    - tutor: "Oh, mi dispiace! Ma «lavoro a l'ospedale»: per il posto di lavoro, come diciamo di solito?"
      prompt: {text: "a l'ospedale", tags: [articulated-preposition]}
    - learner: "Lavoro all'ospedale?"
      errors: [articulated-preposition]
    - tutor: "Lavora in ospedale e si alza alle cinque? Allora la capisco benissimo."
      recast: {text: "all'ospedale", fix: "in ospedale", tags: [articulated-preposition]}
      goals: [problem]
    - learner: "Potrebbe smettere a suonare dopo le dieci, per favore?"
      errors: [preposition]
    - tutor: "Ma certo. Solo una cosa: «smettere a suonare»? Con «smettere», quale preposizione?"
      prompt: {text: "smettere a suonare", tags: [preposition]}
    - learner: "Smettere di suonare dopo le dieci."
    - tutor: "Va bene, posso farlo. Ma il sabato posso suonare un po' di più?"
      goals: [request]
    - learner: "Il sabato va bene, fino alle undici. La domenica non lavoro."
    - tutor: "Affare fatto! E grazie per essere venuto a parlarmi."
      goals: [compromise]

- scenario: volontariato
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Vorrei aiutare a gli anziani del quartiere. Mi sento un po' solo qui."
      errors: [preposition]
    - tutor: "Bellissima idea. Ma «aiutare a gli anziani»: dopo «aiutare» una persona, ci vuole «a»?"
      prompt: {text: "aiutare a gli anziani", tags: [preposition]}
    - learner: "Aiutare gli anziani."
    - tutor: "Proprio così. Ti capisco: anche per conoscere gente è un'ottima cosa."
      goals: [motivation]
    - learner: "In Spagna mi occupavo da una vicina anziana. Le facevo la spesa e la accompagnavo da il medico."
      errors: [preposition, articulated-preposition]
    - tutor: "Che bravo! Ma «mi occupavo da una vicina»: con «occuparsi», quale preposizione?"
      prompt: {text: "occupavo da una vicina", tags: [preposition]}
    - learner: "Mi occupavo a una vicina?"
      errors: [preposition]
    - tutor: "Ti occupavi di una vicina anziana? Allora hai già esperienza, è proprio quello che cerchiamo."
      recast: {text: "a una vicina", fix: "di una vicina", tags: [preposition]}
      goals: [skills]
    - learner: "Ho tempo il sabato mattina e il mercoledì sera, dopo il lavoro."
    - tutor: "Perfetto. Il sabato portiamo la spesa a casa delle persone, il mercoledì c'è la tombola al centro anziani."
      new: [{lemma: tombola, gloss: bingo}]
      goals: [time]
    - learner: "La tombola! Mi piace, prendo il mercoledì. Comincio da questa settimana?"
    - tutor: "Sì, ti aspettiamo mercoledì alle sette. Porta un po' di pazienza!"
      goals: [choose]

- scenario: film-libro
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Io! Ho letto un romanzo che parla su una famiglia di pescatori."
      errors: [preposition]
    - tutor: "Interessante! Ma «parla su una famiglia»: con «parlare», quale preposizione usiamo per l'argomento?"
      prompt: {text: "parla su una famiglia", tags: [preposition]}
    - learner: "Parla di una famiglia di pescatori."
    - tutor: "Esatto. E dov'è ambientato?"
      new: [{lemma: ambientato, gloss: set (of a story)}]
    - learner: "È ambientato a Sicilia, in un piccolo porto, negli anni Cinquanta."
      errors: [preposition]
    - tutor: "Bello! Ma «a Sicilia»: la Sicilia è un'isola grande, non una città..."
      prompt: {text: "a Sicilia", tags: [preposition]}
    - learner: "In Sicilia, in un piccolo porto."
    - tutor: "Perfetto. Negli anni Cinquanta, poi: mi piace già. Chi è il personaggio principale?"
      goals: [summary]
    - learner: "Salvo, il figlio più giovane. Si innamora con una ragazza ricca e la famiglia non è d'accordo."
      errors: [preposition]
    - tutor: "Classico! Ma «si innamora con una ragazza»: con «innamorarsi», quale preposizione?"
      prompt: {text: "innamora con una ragazza", tags: [preposition]}
    - learner: "Si innamora a una ragazza?"
      errors: [preposition]
    - tutor: "Si innamora di una ragazza ricca, e la famiglia dice di no. E com'è Salvo come personaggio?"
      recast: {text: "a una ragazza", fix: "di una ragazza", tags: [preposition]}
    - learner: "È coraggioso ma testardo. Mi è piaciuto molto, anche se il finale è triste."
    - tutor: "Testardo e coraggioso, bella combinazione. A chi lo consiglieresti?"
      goals: [characters, opinion]
    - learner: "A chi ama le storie di famiglia e il mare."
    - tutor: "Allora lo leggo anch'io: adoro il mare!"
      goals: [recommend]

# t-prep, file 08: B2, prepositions governed by verbs and adjectives (soffrire di, insistere per, abituarsi a).
- scenario: medico-specialista
  level: B2
  persona: en-m-retired
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Non molto bene. Quando salgo le scale sento un peso a il petto e mi manca il fiato."
      errors: [articulated-preposition]
    - tutor: "Capisco. Ma «un peso a il petto»: come si uniscono «a» e «il»?"
      prompt: {text: "a il petto", tags: [articulated-preposition]}
    - learner: "Un peso al petto."
    - tutor: "Bene. E succede anche quando è a riposo?"
    - learner: "No, solo sotto sforzo. Dopo qualche minuto passa."
    - tutor: "D'accordo. In famiglia qualcuno ha avuto problemi di cuore?"
      goals: [symptoms]
    - learner: "Sì, mio padre soffriva con la pressione alta e ha avuto un infarto a sessant'anni."
      errors: [preposition]
    - tutor: "Questo è importante. Ma «soffriva con la pressione alta»: con «soffrire», quale preposizione?"
      prompt: {text: "soffriva con la pressione", tags: [preposition]}
    - learner: "Soffriva per la pressione alta?"
      errors: [preposition]
    - tutor: "Soffriva di pressione alta, quindi lo terremo presente. Gli esami confermano che anche la sua pressione è un po' alta."
      recast: {text: "per la pressione", fix: "di pressione", tags: [preposition]}
      goals: [history]
    - learner: "È grave? Devo rinunciare a il caffè e a la bicicletta?"
      errors: [articulated-preposition]
    - tutor: "Non è grave. Ma «rinunciare a il caffè»: come prima, le due parole si uniscono."
      prompt: {text: "a il caffè", tags: [articulated-preposition]}
    - learner: "Devo rinunciare al caffè e alla bicicletta?"
    - tutor: "Il caffè, uno al giorno va bene. La bicicletta anzi le fa bene, con calma."
      goals: [understand]
    - learner: "Meno male! E la terapia? Ho letto che queste pastiglie possono dare effetti collaterali."
    - tutor: "A volte un po' di tosse secca. Se succede, me lo dica e cambiamo farmaco. Controllo tra tre mesi."
      goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Ci siamo conosciuti a l'università di Bologna, quindi vorremmo sposarci in una villa vicino a Bologna, a giugno."
      errors: [articulated-preposition]
    - tutor: "Che bella storia! Ma «a l'università»: «a» più «l'», come diventa?"
      prompt: {text: "a l'università", tags: [articulated-preposition]}
    - learner: "All'università di Bologna."
    - tutor: "Perfetto. Una villa sui colli, allora. Quanti invitati?"
      goals: [vision]
    - learner: "Circa centoventi. Il budget è di trentamila euro, non possiamo spendere di più."
    - tutor: "Con centoventi persone è un budget giusto, ma senza sprechi."
      goals: [budget]
    - learner: "Abbiamo visto due posti: una villa con giardino e un agriturismo in collina. Preferiamo la villa, è più elegante."
    - tutor: "La villa costa un po' di più, ma ha la sala interna in caso di pioggia."
      goals: [choices]
    - learner: "Però insistiamo su avere un menù vegetariano per tutti, anche per i parenti spagnoli!"
      errors: [preposition]
    - tutor: "Coraggiosi! Ma «insistiamo su avere»: con «insistere» e un verbo, quale preposizione?"
      prompt: {text: "insistiamo su avere", tags: [preposition]}
    - learner: "Insistiamo a avere un menù vegetariano?"
      errors: [preposition]
    - tutor: "Se insistete per avere un menù vegetariano, troverò un cuoco che sa farlo bene. Altre condizioni?"
      recast: {text: "a avere", fix: "per avere", tags: [preposition]}
    - learner: "Sì: contiamo in lei per tenere i costi sotto controllo, e vogliamo vedere ogni preventivo prima di firmare."
      errors: [preposition]
    - tutor: "Giusto. Ma «contiamo in lei»: con «contare» nel senso di fidarsi, quale preposizione?"
      prompt: {text: "contiamo in lei", tags: [preposition]}
    - learner: "Contiamo su di lei."
    - tutor: "Può contarci. Vi mando ogni preventivo per email, e nessuna firma senza il vostro sì."
      goals: [conditions]

- scenario: politica-lavoro
  level: B2
  persona: en-f-student
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Molti lavori cambieranno, ma dipende di come gestiamo il cambiamento."
      errors: [preposition]
    - tutor: "Può darsi. Ma «dipende di come»: con «dipendere», quale preposizione?"
      prompt: {text: "dipende di come", tags: [preposition]}
    - learner: "Dipende da come gestiamo il cambiamento."
    - tutor: "E come dovremmo gestirlo, secondo te?"
      goals: [opinion]
    - learner: "Se i governi investissero di più su la formazione, le persone potrebbero cambiare settore."
      errors: [articulated-preposition]
    - tutor: "Interessante. Ma «investire su la formazione»: con «investire», quale preposizione si usa di solito?"
      prompt: {text: "su la formazione", tags: [articulated-preposition]}
    - learner: "Investire sulla formazione?"
      errors: [articulated-preposition]
    - tutor: "Investire nella formazione, certo, ma chi paga? E chi ha cinquant'anni?"
      recast: {text: "sulla formazione", fix: "nella formazione", tags: [articulated-preposition]}
      goals: [hypothesis]
    - learner: "Ti faccio un esempio. Mia zia lavorava in banca allo sportello. Adesso si occupa con i clienti sui mutui."
      errors: [preposition]
    - tutor: "Ah, interessante. Ma «si occupa con i clienti»: con «occuparsi», quale preposizione?"
      prompt: {text: "si occupa con i clienti", tags: [preposition]}
    - learner: "Si occupa dei clienti."
    - tutor: "Ecco. Quindi il lavoro è cambiato ma esiste ancora, è questo che dici?"
      goals: [example]
    - learner: "Esatto. Per concludere: la tecnologia è un rischio, ma anche un'opportunità. E tu cambieresti idea?"
    - tutor: "Forse un po'. Ma ho ancora paura per i lavori più semplici."
      goals: [conclude]

- scenario: recensione-ristorante
  level: B2
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Sì, purtroppo non sono soddisfatto con la serata. Abbiamo aspettato cinquanta minuti per i primi."
      errors: [preposition]
    - tutor: "Mi dispiace molto. Ma «soddisfatto con la serata»: con «soddisfatto», quale preposizione?"
      prompt: {text: "soddisfatto con la serata", tags: [preposition]}
    - learner: "Soddisfatto per la serata?"
      errors: [preposition]
    - tutor: "Capisco che non sia soddisfatto della serata, e ha ragione. Cinquanta minuti sono troppi."
      recast: {text: "per la serata", fix: "della serata", tags: [preposition]}
      goals: [complain]
    - learner: "E non solo. La carbonara era fredda e la carne era cotta troppo, anche se avevo chiesto al sangue."
    - tutor: "Questo non dovrebbe succedere. La cucina stasera era in difficoltà, ma non è una scusa."
      goals: [detail]
    - learner: "Da un ristorante come il vostro mi aspettavo molto di più. Ero venuto qui per il compleanno di mia madre."
    - tutor: "Ancora peggio, mi dispiace davvero. Vorrei offrirvi il dolce e uno sconto del trenta per cento sul conto."
      goals: [expectation]
    - learner: "Grazie, ma rinuncio a il dolce. Accetto lo sconto, però."
      errors: [articulated-preposition]
    - tutor: "Va bene. Ma «rinuncio a il dolce»: come si uniscono le due parole?"
      prompt: {text: "a il dolce", tags: [articulated-preposition]}
    - learner: "Rinuncio al dolce."
    - tutor: "Capisco. Allora il conto con lo sconto. E spero di rivedervi presto, in una serata migliore."
      goals: [resolve]

- scenario: riunione-lavoro
  level: B2
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Il magazzino nuovo è quasi pronto: mancano solo gli scaffali e il sistema di allarme."
    - tutor: "Bene. Ci sono problemi?"
      goals: [update]
    - learner: "Sì: ieri ci siamo accorti a un errore nell'ordine. Il fornitore ci ha mandato scaffali troppo bassi."
      errors: [preposition]
    - tutor: "Che peccato. Ma «ci siamo accorti a un errore»: dopo questo verbo, quale preposizione?"
      prompt: {text: "accorti a un errore", tags: [preposition]}
    - learner: "Ci siamo accorti di un errore."
    - tutor: "Ecco. E il fornitore cosa dice?"
      new: [{lemma: fornitore, gloss: supplier}]
      goals: [problem]
    - learner: "Dice che può cambiarli, ma ci vogliono tre settimane. Propongo di passare a un altro fornitore, più veloce."
    - tutor: "Ha senso. Ma il cliente cosa ha chiesto?"
      goals: [proposal]
    - learner: "Il cliente ha insistito a avere tutto pronto per il primo del mese."
      errors: [preposition]
    - tutor: "Lo so. Ma «insistito a avere»: con «insistere», quale preposizione si usa davanti al verbo?"
      prompt: {text: "insistito a avere", tags: [preposition]}
    - learner: "Ha insistito di avere tutto pronto?"
      errors: [preposition]
    - tutor: "Ha insistito per avere tutto pronto, sì. Allora cambia ditta e fissiamo la consegna al trenta."
      recast: {text: "insistito di avere", fix: "insistito per avere", tags: [preposition]}
      goals: [deadline]
    - learner: "D'accordo, chiamo il nuovo fornitore subito dopo la riunione."
    - tutor: "Perfetto. Tienimi aggiornato."

- scenario: smartworking
  level: B2
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Lavoro da remoto per tre anni, ormai. Vado in sede solo una volta al mese."
      errors: [preposition]
    - tutor: "Tre anni! Ma «lavoro da remoto per tre anni»: se lo fai ancora adesso, quale preposizione per la durata?"
      prompt: {text: "per tre anni", tags: [preposition]}
    - learner: "In tre anni?"
      errors: [preposition]
    - tutor: "Da tre anni, quindi ormai sei un'esperta! Come ti trovi?"
      recast: {text: "In tre anni", fix: "Da tre anni", tags: [preposition]}
      goals: [situation]
    - learner: "Bene. Il vantaggio principale è il tempo: non perdo due ore al giorno sul treno."
    - tutor: "Due ore al giorno sono tante. E gli svantaggi?"
      goals: [pros]
    - learner: "All'inizio è stato difficile abituarmi con il silenzio. E a volte faccio fatica di staccare la sera."
      errors: [articulated-preposition, preposition]
    - tutor: "Ti capisco. Ma «faccio fatica di staccare»: con «fare fatica», quale preposizione va prima del verbo?"
      prompt: {text: "fatica di staccare", tags: [preposition]}
    - learner: "Faccio fatica a staccare. E all'inizio è stato difficile abituarmi al silenzio."
    - tutor: "Esatto. Quindi, potendo scegliere, cosa faresti?"
      goals: [cons]
    - learner: "Preferirei un sistema misto: due giorni in ufficio, per vedere i colleghi, e tre a casa."
    - tutor: "Sembra la soluzione di molti. Io invece tornerei in ufficio tutti i giorni!"
      goals: [preference]

- scenario: trattativa-affitto
  level: B2
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto, soprattutto la luce. Ma il canone mi sembra un po' alto per questa zona."
    - tutor: "Capisco. Il proprietario però è stato chiaro sul prezzo."
      goals: [interest]
    - learner: "Sarei disposta a firmare per quattro anni, se si potesse scendere a settecentocinquanta."
    - tutor: "Ne posso parlare con lui. E da quando vorrebbe entrare?"
      goals: [negotiate]
    - learner: "Potrei entrare a partire di marzo, e vorrei sapere come funziona la disdetta."
      errors: [preposition]
    - tutor: "Certo. Ma «a partire di marzo»: «a partire» vuole un'altra preposizione. Quale?"
      prompt: {text: "a partire di marzo", tags: [preposition]}
    - learner: "A partire in marzo?"
      errors: [preposition]
    - tutor: "A partire da marzo va bene. La disdetta si dà con sei mesi di anticipo, con una raccomandata."
      recast: {text: "partire in marzo", fix: "partire da marzo", tags: [preposition]}
      goals: [conditions]
    - learner: "D'accordo. Mi fido nell'agenzia: se il proprietario accetta, firmo la settimana prossima."
      errors: [articulated-preposition]
    - tutor: "Grazie della fiducia. Ma «mi fido nell'agenzia»: con «fidarsi», quale preposizione?"
      prompt: {text: "nell'agenzia", tags: [articulated-preposition]}
    - learner: "Mi fido dell'agenzia."
    - tutor: "Perfetto. Lo chiamo oggi stesso e le faccio sapere entro domani."
      goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: en-m-traveller
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Buongiorno a tutti. Sono venuto in Italia nel 2017 per un anno di studio a Bologna, e non sono più ripartito."
    - tutor: "Un classico! Cosa l'ha convinto a restare?"
    - learner: "Mi sono innamorato di Bologna: della città, del cibo e poi anche di una bolognese!"
    - tutor: "Ah, ecco il vero motivo! E la cosa più difficile?"
      goals: [story]
    - learner: "Senza dubbio abituarmi con la burocrazia. Per un documento si va a tre uffici diversi."
      errors: [articulated-preposition]
    - tutor: "Lo sanno bene i nostri ascoltatori! Ma «abituarmi con la burocrazia»: con «abituarsi», quale preposizione?"
      prompt: {text: "con la burocrazia", tags: [articulated-preposition]}
    - learner: "Abituarmi della burocrazia?"
      errors: [articulated-preposition]
    - tutor: "Abituarsi alla burocrazia, già, è una bella sfida per tutti. E lei, in questi anni, come è cambiato?"
      recast: {text: "della burocrazia", fix: "alla burocrazia", tags: [articulated-preposition]}
      goals: [difficulties]
    - learner: "Ho imparato di non avere fretta. In Inghilterra correvo sempre, qui mi godo il pranzo."
      errors: [preposition]
    - tutor: "Che bella lezione. Ma «ho imparato di non avere fretta»: dopo «imparare», quale preposizione?"
      prompt: {text: "imparato di non avere", tags: [preposition]}
    - learner: "Ho imparato a non avere fretta."
    - tutor: "E cosa consiglierebbe a chi vuole trasferirsi qui?"
      goals: [change]
    - learner: "Di imparare la lingua prima di partire e di avere pazienza con gli uffici. Ne vale la pena."
    - tutor: "Ottimi consigli. Grazie per essere stato con noi!"
      goals: [advice]

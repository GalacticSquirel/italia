# t-prep, file 06: B1, prepositions in travel plans, recipes, bookings, holidays and housing.
- scenario: consigli-viaggio
  level: B1
  persona: en-f-professional
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Tra due settimane. Prima resto a Napoli quattro giorni, poi vorrei andare a la Costiera Amalfitana."
      errors: [articulated-preposition]
    - tutor: "Che bel programma! Ma «a la Costiera»: per una zona come la Costiera, quale preposizione usiamo?"
      prompt: {text: "a la Costiera", tags: [articulated-preposition]}
    - learner: "Alla Costiera Amalfitana?"
      errors: [articulated-preposition]
    - tutor: "Sì, in Costiera Amalfitana è bellissimo a maggio. Cosa vuoi sapere?"
      recast: {text: "Alla Costiera", fix: "in Costiera", tags: [articulated-preposition]}
      goals: [plans]
    - learner: "Cosa devo assolutamente vedere a Napoli? E dove si mangia bene?"
    - tutor: "Il centro e il museo di Capodimonte. Per mangiare, la pizza in via dei Tribunali."
      goals: [advice]
    - learner: "Perfetto. E per andare in Costiera? Sono abituata di guidare a destra, ma qui ho un po' di paura."
      errors: [preposition]
    - tutor: "Ti capisco! Ma «abituata di guidare»: dopo «abituato», quale preposizione?"
      prompt: {text: "abituata di guidare", tags: [preposition]}
    - learner: "Abituata a guidare."
    - tutor: "Esatto. Comunque non guidare: prendi il traghetto o l'autobus, è molto più facile."
      goals: [transport]
    - learner: "E in la città, come ci muoviamo? Con la metro?"
      errors: [articulated-preposition]
    - tutor: "Sì, la metro va bene. Ma «in la città»: con «città», come diciamo di solito?"
      prompt: {text: "in la città", tags: [articulated-preposition]}
    - learner: "Nella città?"
      errors: [articulated-preposition]
    - tutor: "In città la metro è comoda. Una cosa da evitare: lo zaino aperto sulla metro piena di gente!"
      recast: {text: "Nella città", fix: "In città", tags: [articulated-preposition]}
      goals: [warnings]

- scenario: cucina-ricetta
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Una tortilla di patate, la ricetta di mia madre. Servono patate, uova, cipolla, olio e sale."
    - tutor: "Che buona! Da dove cominciamo?"
      goals: [ingredients]
    - learner: "Prima taglia le patate a fette sottili e mettile in la padella con tanto olio."
      errors: [articulated-preposition]
    - tutor: "Va bene, capo! Ma «in la padella»: come uniamo le due parole?"
      prompt: {text: "in la padella", tags: [articulated-preposition]}
    - learner: "Nella padella, con tanto olio."
    - tutor: "Perfetto. E la cipolla?"
    - learner: "La cipolla va con le patate. Intanto sbatti le uova e aggiungi un po' di sale a le uova."
      errors: [articulated-preposition]
    - tutor: "Ok, sbatto. Ma «a le uova»: anche qui, due parole diventano una."
      prompt: {text: "a le uova", tags: [articulated-preposition]}
    - learner: "Alla uova?"
      errors: [articulated-preposition, noun-gender]
    - tutor: "Ecco, aggiungo il sale alle uova. E adesso?"
      recast: {text: "Alla uova", fix: "alle uova", tags: [articulated-preposition]}
      goals: [steps]
    - learner: "Quando le patate sono morbide, le mescoli con le uova e cuoci tutto per cinque minuti per lato."
    - tutor: "Cinque minuti per lato. E come la giriamo?"
      goals: [time]
    - learner: "Con un piatto grande! Poi la servi a il centro della tavola, calda o fredda."
      errors: [articulated-preposition]
    - tutor: "Che coraggio! Ma «a il centro»: come prima..."
      prompt: {text: "a il centro", tags: [articulated-preposition]}
    - learner: "Al centro della tavola."
    - tutor: "Perfetto, e la mangiamo subito!"
      goals: [serve]

- scenario: prenotare-tavolo
  level: B1
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per venerdì: è per il compleanno di mia moglie."
    - tutor: "Che bello, auguri! Per quante persone e a che ora?"
      goals: [book]
    - learner: "Siamo in otto, con due bambini. Verso le otto e mezza."
    - tutor: "Benissimo, venerdì alle otto e mezza per otto persone."
      goals: [details]
    - learner: "Possiamo mangiare a l'aperto, se fa bel tempo?"
      errors: [articulated-preposition]
    - tutor: "Certo, abbiamo il cortile. Ma «a l'aperto»: «a» più «l'», come diventa?"
      prompt: {text: "a l'aperto", tags: [articulated-preposition]}
    - learner: "Al aperto?"
      errors: [articulated-preposition]
    - tutor: "Sì, all'aperto, nel cortile. Vi tengo il tavolo grande sotto gli alberi."
      recast: {text: "Al aperto", fix: "all'aperto", tags: [articulated-preposition]}
    - learner: "Fantastico. Un'altra cosa: mia suocera è allergica de le noci."
      errors: [articulated-preposition]
    - tutor: "Nessun problema. Ma «allergica de le noci»: dopo «allergico», quale preposizione?"
      prompt: {text: "allergica de le noci", tags: [articulated-preposition]}
    - learner: "Allergica alle noci."
    - tutor: "Lo scrivo per la cucina. E per la torta di compleanno, la portate voi?"
      goals: [special]
    - learner: "Sì, la porto io, se non è un problema. La prenotazione è a nome Rossi."
    - tutor: "Nessun problema. Venerdì, otto persone, a nome Rossi. A presto!"
      goals: [name]

- scenario: vacanze-passate
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono stata dieci giorni in Portogallo con il mio ragazzo. Abbiamo viaggiato per macchina da Lisbona a Porto."
      errors: [preposition]
    - tutor: "Che bel viaggio! Ma «viaggiato per macchina»: per dire come avete viaggiato, quale preposizione?"
      prompt: {text: "per macchina", tags: [preposition]}
    - learner: "Con macchina?"
      errors: [preposition]
    - tutor: "Ah, in macchina, da Lisbona a Porto! E che tempo avete trovato?"
      recast: {text: "Con macchina", fix: "in macchina", tags: [preposition]}
      goals: [where]
    - learner: "Caldo, ma non troppo. Solo in il pomeriggio faceva molto caldo."
      errors: [articulated-preposition]
    - tutor: "Meglio così. Ma «in il pomeriggio»: come uniamo le due parole?"
      prompt: {text: "in il pomeriggio", tags: [articulated-preposition]}
    - learner: "Nel pomeriggio."
    - tutor: "Perfetto. E dove dormivate?"
      goals: [weather]
    - learner: "Per risparmiare, abbiamo dormito da un campeggio vicino alla spiaggia."
      errors: [preposition]
    - tutor: "Bella idea! Ma «dormito da un campeggio»: per un posto come un campeggio, quale preposizione?"
      prompt: {text: "da un campeggio", tags: [preposition]}
    - learner: "A un campeggio?"
      errors: [preposition]
    - tutor: "In un campeggio vicino al mare, bellissimo! E cosa facevate di giorno?"
      recast: {text: "A un campeggio", fix: "In un campeggio", tags: [preposition]}
    - learner: "Al mattino andavamo al mare, la sera visitavamo i paesi. A Porto abbiamo fatto un giro in barca sul fiume."
    - tutor: "Che bello! E la cosa più bella di tutte?"
      goals: [activities]
    - learner: "Il tramonto da la torre di Belém. Indimenticabile!"
      errors: [articulated-preposition]
    - tutor: "Lo immagino! Ma «da la torre»: «da» più «la»...?"
      prompt: {text: "da la torre", tags: [articulated-preposition]}
    - learner: "Dalla torre di Belém."
    - tutor: "Che bello. Mi hai fatto venire voglia di partire!"
      goals: [best]

- scenario: riunione-lavoro
  level: B1
  persona: es-f-teacher
  history: [preposition, articulated-preposition]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Questa settimana ho lavorato tutto il tempo a il nuovo corso online per i clienti."
      errors: [articulated-preposition]
    - tutor: "Bene. Ma «a il nuovo corso»: come si uniscono?"
      prompt: {text: "a il nuovo corso", tags: [articulated-preposition]}
    - learner: "Al nuovo corso online."
    - tutor: "Ottimo. A che punto sei?"
    - learner: "Ho finito di preparare otto lezioni su dieci. Ma c'è un problema con i video."
    - tutor: "Che problema?"
      goals: [update]
    - learner: "La piattaforma non carica i video lunghi. Ho provato di caricarli tre volte."
      errors: [preposition]
    - tutor: "Che fastidio. Ma «ho provato di caricarli»: dopo «provare», quale preposizione?"
      prompt: {text: "provato di caricarli", tags: [preposition]}
    - learner: "Ho provato per caricarli?"
      errors: [preposition]
    - tutor: "Hai provato a caricarli tre volte, e niente. Che cosa proponi?"
      recast: {text: "per caricarli", fix: "a caricarli", tags: [preposition]}
      goals: [problem]
    - learner: "Propongo di dividere ogni video in due parti più corte, di dieci minuti."
    - tutor: "Mi sembra un'ottima soluzione. Per quando puoi finire?"
      goals: [proposal]
    - learner: "Penso di finire per venerdì prossimo, se Marco mi aiuta con i video."
    - tutor: "Perfetto, venerdì prossimo. Parlo io con Marco."
      goals: [deadline]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì, molto! Amo gli animali e vorrei aiutare in il canile."
      errors: [articulated-preposition]
    - tutor: "Che bello! Ma «in il canile»: come uniamo «in» e «il»?"
      prompt: {text: "in il canile", tags: [articulated-preposition]}
      new: [{lemma: canile, gloss: dog shelter}]
    - learner: "Nel canile!"
    - tutor: "Esatto. Perché proprio i cani?"
    - learner: "Sono cresciuta in campagna, con tre cani. Qui in città mi mancano."
    - tutor: "Ti capisco. Cosa sai fare?"
      goals: [motivation]
    - learner: "Posso pulire, dare da mangiare ai cani e portarli fuori. E sono capace a guidare il furgone."
      errors: [preposition]
    - tutor: "Ottimo, ci serve! Ma «capace a guidare»: dopo «capace», quale preposizione?"
      prompt: {text: "capace a guidare", tags: [preposition]}
    - learner: "Capace per guidare?"
      errors: [preposition]
    - tutor: "Se sei capace di guidare il furgone, puoi portare i cani dal veterinario. Quanto tempo hai?"
      recast: {text: "per guidare", fix: "di guidare", tags: [preposition]}
      new: [{lemma: veterinario, gloss: vet}]
      goals: [skills]
    - learner: "Due mattine alla settimana. Il martedì e il giovedì, fino all'una."
    - tutor: "Perfetto. Il martedì portiamo fuori i cani, il giovedì li laviamo tutti."
      goals: [time]
    - learner: "Prendo tutti e due! Così faccio un po' di tutto."
    - tutor: "Benissimo! Ti aspettiamo martedì alle nove."
      goals: [choose]

- scenario: reclamo-hotel
  level: B1
  persona: es-m-worker
  history: [preposition]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Sì. L'aria condizionata nella mia camera non funziona da due giorni."
    - tutor: "Da due giorni? Mi dispiace molto. Ha già avvisato qualcuno?"
      goals: [problem, since]
    - learner: "Sì, ho chiamato a la reception ieri mattina, ma nessuno è venuto."
      errors: [articulated-preposition]
    - tutor: "Mi scusi. Ma «ho chiamato a la reception»: dopo «chiamare», ci vuole una preposizione?"
      prompt: {text: "chiamato a la reception", tags: [articulated-preposition]}
    - learner: "Ho chiamato alla reception?"
      errors: [articulated-preposition]
    - tutor: "Ha chiamato la reception e nessuno è venuto? Non doveva succedere, mi scusi ancora."
      recast: {text: "chiamato alla reception", fix: "chiamato la reception", tags: [articulated-preposition]}
    - learner: "Fa troppo caldo per dormire. Sono stanco di aspettare."
    - tutor: "Ha ragione. Cosa possiamo fare per lei?"
    - learner: "Vorrei cambiare camera o almeno avere uno sconto in il prezzo."
      errors: [articulated-preposition]
    - tutor: "Certo. Ma «uno sconto in il prezzo»: con «sconto», quale preposizione usiamo?"
      prompt: {text: "in il prezzo", tags: [articulated-preposition]}
    - learner: "Uno sconto sul prezzo."
    - tutor: "Le do una camera nuova e uno sconto del venti per cento."
      goals: [request]
    - learner: "Va bene, grazie. Mi aiuta a portare le valigie?"
    - tutor: "Certo, chiamo subito il ragazzo. Buona notte, questa volta al fresco!"
      goals: [agree]

- scenario: affittare-appartamento
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Che bello! Quanto costa l'affitto? Le spese sono comprese?"
    - tutor: "Seicentocinquanta euro, più le spese: circa sessanta euro al mese."
      goals: [rent]
    - learner: "E il contratto? La caparra si paga a l'inizio?"
      errors: [articulated-preposition]
    - tutor: "Sì, due mensilità. Ma «a l'inizio»: «a» più «l'», come si scrive e si dice?"
      prompt: {text: "a l'inizio", tags: [articulated-preposition]}
      new: [{lemma: mensilità, gloss: monthly payment}]
    - learner: "All'inizio, con la firma del contratto."
    - tutor: "Esatto. Il contratto è di quattro anni."
      goals: [contract]
    - learner: "La cucina è arredata? E il riscaldamento funziona bene?"
    - tutor: "Sì, la cucina è completa e la caldaia è stata cambiata l'anno scorso."
      new: [{lemma: caldaia, gloss: boiler}]
      goals: [condition]
    - learner: "Perfetto. Il palazzo è vicino de la metro? Lavoro a una scuola in centro."
      errors: [articulated-preposition, preposition]
    - tutor: "Abbastanza. Ma «vicino de la metro»: dopo «vicino», quale preposizione?"
      prompt: {text: "vicino de la metro", tags: [articulated-preposition]}
    - learner: "Vicino della metro?"
      errors: [articulated-preposition]
    - tutor: "Sì, è vicino alla metro: cinque minuti a piedi, e in dieci minuti è in centro."
      recast: {text: "Vicino della metro", fix: "vicino alla metro", tags: [articulated-preposition]}
      goals: [neighbourhood]
    - learner: "Mi piace molto. Posso entrare da il primo ottobre?"
      errors: [articulated-preposition]
    - tutor: "Credo di sì. Ma «da il primo ottobre»: come uniamo le due parole?"
      prompt: {text: "da il primo ottobre", tags: [articulated-preposition]}
    - learner: "Dal primo ottobre."
    - tutor: "Perfetto, allora prepariamo il contratto dal primo ottobre."
      goals: [decide]

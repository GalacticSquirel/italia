# B2: discussions and negotiations (second half of the scenarios). The learner argues, the tutor
# pushes back; corrections are rare and short. One dialogue has no learner errors.

- scenario: medico-specialista
  level: B2
  persona: en-f-professional
  history: [object-pronoun]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Onestamente, non bene. Da un mese dormo male e mi sveglio di notte con il cuore che batte forte. Al lavoro ho un periodo pesante, e non so se sia il cuore o lo stress."
  - tutor: "Ha fatto bene a venire, così lo capiamo insieme. Quando si sveglia con il battito forte, quanto dura? E sente anche altro?"
  - learner: "Dura dieci minuti, più o meno. Sento caldo e mi mancano un po' le forze, ma non ho dolore. Di giorno, invece, mi stanco subito: la settimana scorsa ho dovuto fermarmi due volte salendo le scale dell'ufficio."
  - tutor: "Chiaro, grazie. C'è qualcuno in famiglia che ha problemi di cuore o di pressione alta?"
    goals: [symptoms]
  - learner: "Mia madre ha la pressione alta da vent'anni. La telefono ogni domenica e mi dice sempre di controllarmi. Mio padre invece è sano, ma suo fratello ha avuto un problema al cuore a cinquant'anni."
    errors: [object-pronoun]
  - tutor: "Sua madre ha ragione, come tutte le madri. Ma «la telefono»? Si telefona «a» qualcuno: quale pronome serve?"
    prompt: {text: "La telefono", tags: [object-pronoun]}
  - learner: "Le telefono ogni domenica."
  - tutor: "Esatto. E ora le buone notizie: gli esami del cuore sono normali. Il battito veloce di notte è legato alla tensione e alla stanchezza, non a una malattia."
    goals: [history]
  - learner: "Che sollievo. Però la pressione? Prima me l'hanno misurata e mi hanno detto un numero, 145 su 95, ma non ho capito se sia grave."
  - tutor: "Non è grave, ma è un po' più alta del normale, soprattutto per la sua età. Vuol dire che il cuore lavora più del necessario. Per questo vorrei cominciare una terapia leggera."
    goals: [understand]
  - learner: "Preferirei evitare le medicine, se è possibile. Ho letto che hanno molti effetti collaterali. Non potrei provare prima a cambiare abitudini: meno caffè, più sport, meno lavoro la sera?"
  - tutor: "È una richiesta ragionevole, e mi piace che voglia provarci. Facciamo così: tre mesi di nuove abitudini, misurando la pressione ogni mattina. Se non scende, però, la terapia la cominciamo."
  - learner: "Affare fatto. Tre mesi, e le porto tutti i numeri."
  - tutor: "Benissimo. E dorma di più, mi raccomando: è la prima medicina. Ci vediamo a marzo per il controllo."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-m-heritage
  history: [conditional-form]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Io e Chiara vorremmo sposarci in Calabria, nel paese dei miei nonni, in agosto. Immaginiamo una festa in piazza, come si faceva una volta, con tutta la gente del paese e una banda che suona."
  - tutor: "Una festa in piazza con la banda: che bello, non me lo chiedono quasi mai! Di quanti invitati parliamo?"
  - learner: "Circa centoventi, perché i miei parenti dal Canada sono tanti. Il nostro budget è di venticinquemila euro. Vorrebbimo spendere soprattutto per il cibo: in Calabria, se gli invitati non mangiano bene, se lo ricordano per vent'anni."
    errors: [conditional-form]
  - tutor: "Verissimo, al Sud il menù è una cosa seria! Ma «vorrebbimo»? La forma per «noi» è più corta: l'ha usata benissimo un attimo fa."
    goals: [vision]
    prompt: {text: "Vorrebbimo", tags: [conditional-form]}
  - learner: "Vorremmo spendere soprattutto per il cibo, scusi."
  - tutor: "Perfetto. Con venticinquemila euro e centoventi persone bisogna scegliere bene. Per il pranzo ho due idee: il ristorante sul mare, elegante ma caro, oppure tavoli lunghi in piazza con un cuoco del posto."
    goals: [budget]
  - learner: "La piazza, senza dubbio: è più economica e più vera. Ma ho paura del tempo e del caldo. Che cosa succede se piove, o se ci sono quaranta gradi?"
  - tutor: "Ad agosto la pioggia è rara, ma teniamo pronta la sala del Comune. Per il caldo, si mangia la sera, dalle otto, con le luci sopra i tavoli. Allora siamo d'accordo sulla piazza?"
  - learner: "Sì, la piazza. Ma metto due condizioni. Voglio che chi lavora per noi sia del paese, dove è possibile. E voglio vedere ogni preventivo prima che Lei firma qualcosa."
    errors: [subjunctive-use]
  - tutor: "Condizioni chiare, mi piacciono. Però «prima che Lei firma»... dopo «prima che» ci vuole un altro modo."
    goals: [choices]
    prompt: {text: "prima che Lei firma", tags: [subjunctive-use]}
  - learner: "Prima che Lei firmi qualcosa."
  - tutor: "Giusto. E le accetto tutte e due: gente del posto, e ogni preventivo passa da voi prima della mia firma. Comincio a cercare la banda!"
    goals: [conditions]

- scenario: politica-lavoro
  level: B2
  persona: en-m-retired
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che questa storia l'ho già sentita. Quando ho cominciato a lavorare, negli anni Settanta, tutti dicevano che i computer avrebbero cancellato gli impiegati. Invece ne abbiamo avuti sempre di più."
  - tutor: "Sì, ma stavolta è diverso: queste macchine non fanno solo i conti, scrivono e ragionano. Non ti fa paura nemmeno un po'?"
    goals: [opinion]
  - learner: "Un po' sì, lo ammetto, ma non per me: per i miei nipoti. Se fossi giovane oggi, non saprei che mestiere scegliere. E se le aziende usassero l'automazione solo per tagliare i costi, il risultato sarebbe una disoccupazione che non abbiamo mai visto."
  - tutor: "Ecco, allora siamo d'accordo! È proprio quello che temo io. Ma tu che hai lavorato una vita nelle fabbriche, l'hai mai visto succedere?"
    goals: [hypothesis]
  - learner: "Certo. Nella mia fabbrica, in Ohio, nel 1995 sono arrivati i robot. In due anni, di sessanta operai di quel reparto ne sono rimasti quindici. Però è stato assunto un gruppo di tecnici per riparare le macchine, e molti erano gli stessi operai, dopo un corso."
  - tutor: "Quindici su sessanta! E gli altri quarantacinque? Non mi dirai che sono diventati tutti tecnici."
    goals: [example]
  - learner: "No, e qui hai ragione tu. Alcuni sono andati in pensione prima, altri hanno trovato lavori peggiori. Per questo dico che il problema non è la tecnologia, ma chi paga il prezzo del cambiamento. Insomma: i lavori non finiranno, ma senza una formazione seria molta gente resterà indietro. Tu come la risolveresti?"
  - tutor: "Io farei pagare la formazione a chi guadagna con le macchine. Ma su una cosa mi hai convinto: il lavoro non finisce, cambia. E adesso assaggia questo vino, che l'ha fatto mio cugino!"
    goals: [conclude]

- scenario: recensione-ristorante
  level: B2
  persona: en-f-professional
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e mi scuso se disturbo, ma ho portato qui dei clienti importanti e la serata è stata imbarazzante. Devo dirglielo, perché vengo spesso e vorrei continuare a farlo."
  - tutor: "Ha fatto benissimo a chiamarmi, e mi dispiace molto. Mi dica esattamente che cosa è successo."
    goals: [complain]
  - learner: "Avevo prenotato un tavolo tranquillo per sei, e ci hanno messi accanto alla cucina, dove non si sentiva niente. Poi due piatti sono arrivati sbagliati. E il vino che avevo scelto era finito, ma nessuno ce l'ha detto: ne hanno semplicemente portato un altro, più caro."
  - tutor: "Tre errori in una sera sono troppi, soprattutto il vino cambiato senza chiedere. Che cosa si aspettava, quando ha prenotato?"
    goals: [detail]
  - learner: "Mi aspettavo quello che ho sempre trovato qui. Avevo spiegato al telefono che era una cena di lavoro. Se qualcuno mi avrebbe avvisata del tavolo, avrei cambiato data."
    errors: [hypothetical]
  - tutor: "Ha ragione, avremmo dovuto chiamarla. Mi permetta solo: «se qualcuno mi avrebbe avvisata»? Dopo «se» serve un'altra forma."
    prompt: {text: "Se qualcuno mi avrebbe avvisata", tags: [hypothetical]}
  - learner: "Se qualcuno mi avesse avvisata, avrei cambiato data."
  - tutor: "Proprio così, e sarebbe stato il minimo. Mi lasci fare qualcosa: stasera il vino lo offriamo noi, e per la sua prossima cena di lavoro le tengo la sala privata, senza costi in più."
    goals: [expectation]
  - learner: "La sala privata mi interessa, grazie. Il vino però preferisco pagarlo: quello giusto, non quello più caro. Voglio solo fare sicuro che la prossima volta la prenotazione sia rispettata."
    errors: [word-choice]
  - tutor: "Giusto: pagherà il vino che aveva scelto, e basta. E per essere sicura che la prenotazione sia rispettata, la prossima volta chiami direttamente me: le lascio il mio numero."
    recast: {text: "fare sicuro", fix: "essere sicura", tags: [word-choice]}
  - learner: "Perfetto, lo accetto volentieri. Allora ci rivediamo il mese prossimo, con gli stessi clienti."
  - tutor: "L'aspetto, e questa volta andrà tutto come deve. Grazie della pazienza, e buona serata."
    goals: [resolve]

- scenario: riunione-lavoro
  level: B2
  persona: en-f-student
  history: [pronoun-position]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Il video per il cliente di Torino è montato: mancano solo la musica e i sottotitoli. Ho mandato la prima versione a Paolo ieri sera, e sono confidente che gli piacerà."
    errors: [false-friend]
  - tutor: "Brava, sei stata veloce. E se sei sicura che gli piacerà, è già un buon segno! Paolo ti ha già detto qualcosa?"
    goals: [update]
    recast: {text: "sono confidente", fix: "sei sicura", tags: [false-friend]}
  - learner: "Non ancora, e questo è il problema. Paolo è in ferie fino a lunedì, e senza il suo sì non posso andare avanti. Ho provato a scrivergli, ma non ho voluto lo disturbare troppo."
    errors: [pronoun-position]
  - tutor: "Capisco, non è facile. Ma «non ho voluto lo disturbare»? Quel «lo» è nel posto sbagliato."
    prompt: {text: "non ho voluto lo disturbare", tags: [pronoun-position]}
  - learner: "Non ho voluto disturbarlo troppo."
  - tutor: "Ecco. E hai fatto bene: quando uno è in vacanza, è giusto lasciarlo in pace. Però il cliente aspetta. Tu che cosa proponi?"
    goals: [problem]
  - learner: "Propongo due cose. Potresti guardare tu il video oggi, al posto di Paolo, così non perdiamo quattro giorni. Intanto io comincerei con i sottotitoli, che non dipendono dalle sue correzioni."
  - tutor: "Mi sembra giusto, lo guardo dopo pranzo. Però se ci sono cambiamenti grossi, la musica va rifatta. Quanto tempo ti serve, in quel caso?"
    goals: [proposal]
  - learner: "Se i cambiamenti sono piccoli, finirò mercoledì. Se bisogna rifare la musica, avrò bisogno di due giorni in più, quindi venerdì. Preferirei promettere venerdì al cliente e consegnare prima, piuttosto che il contrario."
  - tutor: "Giusto: meglio una bella sorpresa che una scusa. Allora diciamo venerdì al cliente, e noi puntiamo a mercoledì. Ti scrivo i miei commenti entro le quattro."
    goals: [deadline]

- scenario: smartworking
  level: B2
  persona: en-m-traveller
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, sempre. Faccio il programmatore per un'azienda di Dublino, quindi il mio ufficio è dove c'è una buona connessione. Questo mese lavoro da Palermo, il mese scorso ero a Lisbona."
  - tutor: "Che vita! Io invece vado in ufficio tutti i giorni da sei anni. E com'è, in pratica, una tua giornata?"
  - learner: "Mi sveglio tardi, lavoro dalle dieci alle sei in un bar o in appartamento, e la sera giro per la città. Il vantaggio è la libertà, ovvio. E poi la vita qui costa meno, e il cibo siciliano è più buono che il cibo irlandese."
    errors: [comparative]
  - tutor: "Sul cibo non posso che darti ragione! Ma «più buono che il cibo irlandese»? Tra due cose, la parola giusta non è «che»."
    goals: [situation]
    prompt: {text: "più buono che il cibo irlandese", tags: [comparative]}
  - learner: "Più buono che... non lo so. Più buono come il cibo irlandese?"
    errors: [comparative]
  - tutor: "Quasi: è più buono del cibo irlandese, con «di». Fin qui sembra tutto perfetto, però. Davvero non c'è niente che ti pesi?"
    goals: [pros]
    recast: {text: "Più buono come il cibo irlandese", fix: "più buono del cibo irlandese", tags: [comparative]}
  - learner: "Sì, due cose. Cambiando sempre città, non ho amici veri: conosco tanta gente, ma nessuno bene. E i miei colleghi non li vedo mai di persona, quindi quando c'è un problema è difficile capirsi."
  - tutor: "Tanta gente e nessun amico: questo sì che è uno svantaggio serio. E non hai mai voglia di un posto fisso?"
    goals: [cons]
  - learner: "Negli ultimi tempi, sì. Se potessi scegliere, vorrei una base, forse proprio qui in Sicilia, e viaggiare solo due o tre mesi all'anno. E mi piacerebbe un ufficio condiviso, per avere dei colleghi anche se non sono i miei."
  - tutor: "Una base in Sicilia e colleghi «in prestito»: mi sembra un bel progetto. Se resti a Palermo, sai già chi ti porta a mangiare il pesce. Salute!"
    goals: [preference]

- scenario: trattativa-affitto
  level: B2
  persona: en-m-retired
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, è piaciuto molto a me e a mia moglie, soprattutto per la luce. Siamo interessati. Ho solo una preoccupazione: le finestre sono vecchie, e d'inverno temo che le spese di riscaldamento siano alte."
  - tutor: "Lo capisco. Le finestre in effetti non sono nuove, ma il riscaldamento è autonomo e la casa prende il sole tutto il giorno. Il canone richiesto è di 1.300 euro."
    goals: [interest]
  - learner: "Per quella cifra mi aspetterei finestre nuove. Le faccio una proposta: se il proprietario le cambia, accetto i 1.300. Altrimenti offro 1.150, e le finestre restano come sono."
  - tutor: "È una proposta chiara, e la presenterò. Le dico già, però, che il proprietario difficilmente farà i lavori quest'anno. E su 1.150 temo che dica di no."
  - learner: "Allora troviamo una via di mezzo. Io potrei salire a 1.200, a condizione che il canone resta bloccato per tutta la durata del contratto. Mi sembra un compromesso onesto."
    errors: [subjunctive-use]
  - tutor: "Milleduecento è una cifra che posso difendere. Però «a condizione che il canone resta»... dopo «a condizione che» il verbo cambia."
    prompt: {text: "a condizione che il canone resta", tags: [subjunctive-use]}
  - learner: "A condizione che il canone resti bloccato."
  - tutor: "Benissimo. Con la cedolare secca il canone resta fermo per legge, quindi su questo siamo a posto. Che durata aveva in mente?"
    goals: [negotiate]
  - learner: "Quattro anni più quattro. Però alla nostra età non si sa mai: vorrei poter dare la disdetta con tre mesi di anticipo, non sei. E vorrei sapere quant'è la provvigione dell'agenzia."
  - tutor: "Tre mesi invece di sei si può chiedere, mettendo una clausola nel contratto. La provvigione è di un mese di canone. Se il proprietario accetta 1.200, firmiamo?"
    goals: [conditions]
  - learner: "Se accetta 1.200 con quella clausola, firmo anche domani. Se invece insiste su 1.300 senza lavori, la ringrazio ma cercherò altrove, senza rancore."
  - tutor: "Chiarissimo, e la ringrazio di parlare così chiaro. Lo chiamo oggi pomeriggio e le faccio sapere entro sera. Credo proprio che accetterà."
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno, grazie. Sono venuta a Padova con l'Erasmus tre anni fa, e dovevo restare nove mesi. Prima di partire avevo studiato l'italiano solo sei mesi, e pensavo che sarebbe stato facilissimo."
  - tutor: "E invece? Tanti spagnoli ci dicono che l'italiano sembra facile e poi sorprende."
  - learner: "Esatto! Capivo tutto, ma quando parlavo inventavo le parole. Comunque, alla fine dell'Erasmus mi hanno offerto un lavoro in un laboratorio dell'università, e ho deciso di restare. Non me ne pento."
  - tutor: "Per la nostra università è una bella notizia. Ma qual è stata la parte più difficile?"
    goals: [story]
  - learner: "Trovare casa, senza dubbio: molti proprietari non volevano affittare a una straniera con un contratto corto. E poi, il primo anno, mi sentivo sola: estrañavo molto la mia famiglia e ho guadagnato cinque chili."
    errors: [word-choice]
  - tutor: "Capisco: le mancava molto la famiglia, ed è la nostalgia che conoscono tutti quelli che partono. E oggi? In che cosa si sente cambiata?"
    goals: [difficulties]
    recast: {text: "estrañavo molto la mia famiglia", fix: "le mancava molto la famiglia", tags: [word-choice]}
  - learner: "Sono più indipendente e più coraggiosa. Prima avevo paura di sbagliare; adesso parlo con tutti, anche se faccio errori. E credo che l'Italia mi ha insegnato a prendere la vita con più calma."
    errors: [subjunctive-use]
  - tutor: "Bello: sbagliare senza paura è già molto. Ma «credo che l'Italia mi ha insegnato»... dopo «credo che» ci vuole un altro modo."
    prompt: {text: "credo che l'Italia mi ha insegnato", tags: [subjunctive-use]}
  - learner: "Credo che l'Italia mi abbia insegnato a vivere con più calma."
  - tutor: "Perfetto. E per chiudere: che cosa direbbe a una ragazza spagnola che sta pensando di trasferirsi qui?"
    goals: [change]
  - learner: "Le direi di venire, ma con pazienza per la burocrazia e con qualche risparmio per i primi mesi. E di cercare amici italiani fin dal primo giorno, anche se è più comodo stare con gli altri spagnoli."
  - tutor: "Pazienza, risparmi e amici italiani: consigli preziosi. Grazie di essere stata con noi, e buon lavoro in laboratorio!"
    goals: [advice]

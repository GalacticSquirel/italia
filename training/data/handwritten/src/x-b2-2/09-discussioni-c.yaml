# B2, discussions (third batch): the tutor disagrees, asks "why?", and pushes the learner to
# justify and elaborate; corrections stay rare and focused.

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io non sono d'accordo. Faccio il cuoco e ogni mattina vado al mercato con il furgone del ristorante: secondo me il centro dovrebbe essere chiuso alle auto private, ma non ai furgoni di chi lavora."
  - tutor: "Comodo, per lei! Però così il centro resta pieno di furgoni. Mi spieghi perché la sua proposta dovrebbe funzionare."
    goals: [position]
  - learner: "Perché i furgoni sono pochi rispetto alle auto, e potrebbero entrare solo la mattina. Il secondo argomento è l'aria: mia figlia ha l'asma, e nei giorni di traffico non può neanche andare a scuola a piedi."
  - tutor: "Mi dispiace per sua figlia, davvero. Ma i commercianti? Se i clienti non trovano parcheggio, vanno al centro commerciale e i negozi chiudono."
    goals: [argue]
  - learner: "Non credo che la gente vaya al centro commerciale solo per il parcheggio. Chi ci va, ci va già adesso. Se il centro diventasse più bello e tranquillo, la gente ci passeggerebbe di più."
    errors: [subjunctive-form]
  - tutor: "È una scommessa, però. E poi: «vaya»? Quella forma viene dallo spagnolo. In italiano, come si dice?"
    prompt: {text: "vaya", tags: [subjunctive-form]}
  - learner: "Non credo che la gente vada al centro commerciale solo per il parcheggio."
  - tutor: "Esatto. Va bene, ma chi viene da fuori città, dove lascia la macchina?"
    goals: [counter]
  - learner: "Su questo ha ragione lei: i parcheggi fuori dal centro oggi sono pochi e cari. Allora propongo questo: prima costruiamo un parcheggio grande vicino alla stazione, con un autobus gratuito, e solo dopo chiudiamo il centro."
  - tutor: "Prima il parcheggio e l'autobus, e solo dopo il centro chiuso... Detto così, forse potrei anche votare a favore."
    goals: [concede]

- scenario: politica-lavoro
  level: B2
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Secondo me esageri, Riccardo. I lavori non spariscono, si trasformano. Cento anni fa quasi tutti lavoravano nei campi, e oggi nessuno rimpiange quei tempi."
  - tutor: "Sì, ma allora ci sono voluti cinquant'anni; adesso tutto succede in cinque. Quindi secondo te non cambierà niente?"
    goals: [opinion]
  - learner: "No, cambierà moltissimo. Ma per me il rischio più grande non è la disoccupazione, è la formazione. Le scuole insegnano cose che le aziende non hanno più bisogno."
    errors: [relative-pronoun]
  - tutor: "Interessante. Ma «cose che le aziende non hanno più bisogno»? Pensa a come si dice: si ha bisogno... di qualcosa."
    prompt: {text: "cose che le aziende non hanno più bisogno", tags: [relative-pronoun]}
  - learner: "Cose di cui le aziende non hanno più bisogno."
  - tutor: "Esatto. E se tu decidessi i programmi delle scuole, che cosa cambieresti?"
  - learner: "Se decidessi io, metterei meno ore di teoria e più progetti con le aziende della zona. E insegnerei a tutti un po' di programmazione, anche a chi studia lettere."
  - tutor: "Programmazione a chi studia lettere? Mi sembra un po' forzato. A che cosa gli servirebbe?"
    goals: [hypothesis]
  - learner: "Non devono diventare programmatori, ma capire gli strumenti che useranno. Io faccio il fotografo, e con un piccolo programma ho organizzato migliaia di foto in automatico: così salvo due giorni al mese."
    errors: [word-choice]
  - tutor: "Ah, se risparmi due giorni al mese, devi insegnarlo anche a me! Ma tu sei curioso di natura. E chi non lo è?"
    goals: [example]
    recast: {text: "salvo due giorni", fix: "risparmi due giorni", tags: [word-choice]}
  - learner: "Anche chi non è curioso impara, se vede che gli conviene. Per riassumere: le macchine cambieranno tutto, ma la scuola può preparare le persone. E tu, dopo tutto questo, la pensi ancora come prima?"
  - tutor: "Un po' meno di prima, lo ammetto. Resto preoccupato, ma mi hai convinto che la partita si gioca a scuola."
    goals: [conclude]

- scenario: film-libro
  level: B2
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Questo mese non ho letto un libro, ma ho rivisto un film: «Nuovo Cinema Paradiso». L'avevo visto la prima volta nel 1990, a Cleveland, con mia moglie."
  - tutor: "Un film vale come un libro, qui. Senza rovinarci il finale: di che cosa parla?"
  - learner: "Un regista famoso torna nel suo paese in Sicilia dopo trent'anni, per il funerale di un vecchio amico. L'amico era l'uomo che faceva funzionare il cinema del paese, e il regista, da bambino, passava le giornate con lui."
  - tutor: "Bravo, e senza dire troppo. E com'è il bambino, Totò?"
    goals: [summary]
  - learner: "È curioso, furbo e un po' sfacciato. Passa tutto il tempo con il vecchio Alfredo, che il bambino è molto affezionato, e impara da lui ad amare il cinema."
    errors: [relative-pronoun]
  - tutor: "Sfacciato, sì, ma simpatico. Però «Alfredo, che il bambino è molto affezionato»? Ci vuole una preposizione. Come colleghi le due frasi?"
    prompt: {text: "che il bambino è molto affezionato", tags: [relative-pronoun]}
  - learner: "Alfredo, a cui il bambino è molto affezionato."
  - tutor: "Perfetto. E a te perché è piaciuto tanto, oltre ai ricordi?"
    goals: [characters]
  - learner: "È proprio la nostalgia il punto, ma non solo la mia. Il film parla di un mondo che è finito: il cinema come piazza del paese, dove tutti ridevano e piangevano insieme. Oggi guardiamo i film da soli, sul telefono."
  - tutor: "Però non è un po' troppo dolce? C'è chi dice che è un film fatto solo per far piangere."
  - learner: "Forse, ma secondo me lo fa con onestà. Non ci sono cattivi, e il finale non spiega niente: ti lascia solo le immagini. Io lo trovo emozionante proprio perché non urla."
  - tutor: "«Non urla»: bella difesa, mi hai convinto. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "Ai giovani che non l'hanno mai visto, per capire che cosa era il cinema per i loro nonni. E a chi ha lasciato il suo paese da giovane, ma con i fazzoletti a portata di mano."
  - tutor: "Fazzoletti a portata di mano, me lo segno. Il mese prossimo lo guardiamo tutti insieme qui in biblioteca!"
    goals: [recommend]

- scenario: arte-mostra
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Sinceramente? Non mi dice niente. È una tela tutta rossa con una riga nera in mezzo. Potrei farlo anch'io."
  - tutor: "Ah, la frase classica! Ma prova a guardarlo meglio: quel rosso è proprio tutto uguale?"
    goals: [react]
  - learner: "Vediamo... No, hai ragione. In alto il rosso è più scuro, quasi marrone, e vicino alla riga diventa più chiaro, come se ci fosse una luce dietro. E la riga non è dritta: trema un po'."
  - tutor: "Ecco, adesso stai guardando davvero. Secondo te, perché il pittore ha fatto tremare quella riga?"
    goals: [describe]
  - learner: "Forse vuole che sentiamo qualcosa di fragile. Però non sono convinta: per me un quadro deve essere difficile da fare, e questo... no lo so, mi sembra troppo facile."
    errors: [negation]
  - tutor: "Fragile, sì: è un'ottima lettura. Ma «no lo so»?"
    prompt: {text: "no lo so", tags: [negation]}
    new: [{lemma: lettura, gloss: "reading, interpretation"}]
  - learner: "Non lo so. È lo spagnolo che torna fuori!"
  - tutor: "Succede! Ma dimmi: perché un quadro deve essere difficile da fare? Una poesia breve è facile da scrivere?"
    goals: [interpret]
  - learner: "No, una poesia breve può essere difficilissima, perché ogni parola conta. Forse qui è uguale: ogni centimetro è stato deciso. Però continuo a preferire i quadri di Caravaggio della sala di sotto, dove la luce racconta una storia."
  - tutor: "Ottimo confronto: in Caravaggio la luce racconta una storia, qui la luce è la storia. Non ti ho fatto cambiare idea, ma almeno l'hai guardato per due minuti!"
    goals: [compare]

- scenario: smartworking
  level: B2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da casa, e non tornerei in ufficio per niente al mondo. Lavoro per una banca americana, e da quando hanno chiuso l'ufficio di Milano faccio tutto dal mio salotto."
  - tutor: "Per niente al mondo? Addirittura! E come organizzi la giornata?"
  - learner: "Comincio alle otto, a pranzo faccio una pausa lunga e porto il cane al parco. Alle cinque spengo il computer, e la giornata è finita. Prima perdevo un'ora e mezza al giorno in macchina."
  - tutor: "Un'ora e mezza, capisco. Quindi il vantaggio principale è il tempo?"
    goals: [situation]
  - learner: "Il tempo, sì, ma anche la concentrazione: a casa mi concentro più che in ufficio, dove c'era sempre qualcuno che voleva chiacchierare. E poi risparmio: prima per la benzina spendevo duecento euro al mese, adesso spendo solo trenta."
    errors: [ci-ne]
  - tutor: "Altro che vantaggio! Però: «adesso spendo solo trenta»... manca una piccola parola, prima del verbo."
    prompt: {text: "adesso spendo solo trenta", tags: [ci-ne]}
  - learner: "Adesso ne spendo solo trenta, giusto."
  - tutor: "Bravo. Ma non ti mancano i colleghi? Io, senza le chiacchiere davanti al caffè, impazzirei."
    goals: [pros]
  - learner: "Un po' sì, lo ammetto. E il problema più grande è che a volte non stacco mai: il computer è sempre lì, sul tavolo della cucina, e la sera ci torno per controllare le email. Esco di casa molto meno di prima."
  - tutor: "Ecco, questo è il rischio. Allora, se potessi scegliere liberamente, resteresti a casa cinque giorni su cinque?"
    goals: [cons]
  - learner: "Se potessi scegliere, lavorerei quattro giorni a casa e uno in un ufficio condiviso vicino a casa, per vedere gente. Sarebbe più sano che stare sempre chiuso in casa, e meno stancante che andare a Milano tutti i giorni."
  - tutor: "Sai che non è una cattiva idea? Quasi quasi la propongo anche al mio capo."
    goals: [preference]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie a voi. Io sono argentino e sono arrivato a Napoli otto anni fa. La verità è che non ho scelto l'Italia: ho scelto una ragazza napoletana, che oggi è mia moglie."
  - tutor: "Una ragione bellissima! E com'è stato l'arrivo? Che cosa le ha dato più difficoltà?"
    goals: [story]
  - learner: "All'inizio la lingua. Pensavo che, con lo spagnolo, avrei capito tutto, ma a Napoli molti parlano in dialetto. Ogni sera salivo con i colleghi della pizzeria e non capivo le battute."
    errors: [false-friend]
  - tutor: "Mi ricorda me stesso: anch'io a Londra uscivo con i colleghi e ridevo sempre un secondo dopo gli altri. E oggi il dialetto lo capisce?"
    goals: [difficulties]
    recast: {text: "salivo con i colleghi", fix: "uscivo con i colleghi", tags: [false-friend]}
  - learner: "Adesso lo capisco quasi tutto, e qualche parola la dico anch'io. I miei figli, invece, lo parlano meglio di me: quando sono arrabbiati, mi rispondono in napoletano!"
  - tutor: "Che bello! E lei, in questi otto anni, com'è cambiato?"
  - learner: "Sono diventato più calmo. In Argentina lavoravo in un grande hotel e correvo sempre. Qui ho imparato che un caffè con un cliente vale più di dieci email. Prima di venire non avevo mai pensato che il tempo poteva essere un regalo."
    errors: [subjunctive-use]
  - tutor: "Che bel pensiero. Ma «non avevo mai pensato che il tempo poteva»... con «pensare che», al passato, quale forma serve?"
    prompt: {text: "non avevo mai pensato che il tempo poteva", tags: [subjunctive-use]}
  - learner: "Non avevo mai pensato che il tempo potesse essere un regalo."
  - tutor: "Esatto. Ultima domanda: che consiglio darebbe a un ascoltatore che vuole trasferirsi in Italia?"
    goals: [change]
  - learner: "Di non chiudersi tra stranieri. Se fossi rimasto solo con gli altri argentini, oggi non parlerei italiano e non avrei tanti amici. Bisogna avere il coraggio di sbagliare davanti a tutti."
  - tutor: "Il coraggio di sbagliare: lo ripetiamo sempre anche ai nostri ascoltatori. Grazie di essere stato con noi!"
    goals: [advice]

- scenario: colloquio-promozione
  level: B2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Volevo parlarle dei risultati del mio gruppo quest'anno. Le iscrizioni ai corsi di spagnolo sono aumentate del quaranta per cento, e quasi tutti gli studenti hanno passato l'esame."
  - tutor: "Lo so, sono numeri ottimi. Secondo lei, da che cosa dipendono?"
    goals: [results]
  - learner: "Abbiamo cambiato metodo: meno grammatica alla lavagna e più conversazione. E ho organizzato dei corsi online per chi lavora, la sera. Per questo vorrei chiederle di diventare coordinatrice di tutti i corsi di lingue."
  - tutor: "Capisco. Però lei è qui da due anni, e altri colleghi lavorano con noi da dieci. Non teme che la prendano male?"
    goals: [request]
  - learner: "Ci ho pensato, e ne ho parlato con alcuni di loro. Penso che l'esperienza è importante, ma non basta: conta anche quello che uno porta di nuovo. E due colleghe mi hanno detto che mi appoggerebbero."
    errors: [subjunctive-use]
  - tutor: "Ne ha già parlato con loro? Interessante. Però «penso che l'esperienza è importante»..."
    prompt: {text: "Penso che l'esperienza è importante", tags: [subjunctive-use]}
  - learner: "Penso che l'esperienza sia importante, ma che non basti."
  - tutor: "Ecco. E devo dire che l'appoggio dei colleghi cambia molto le cose. Che cosa propone, in pratica?"
    goals: [handle]
  - learner: "Propongo sei mesi di prova. Se a giugno i risultati sono buoni, il ruolo diventa definitivo; se no, torno a fare solo l'insegnante, senza problemi. Avrei potuto chiederle subito il contratto, ma preferisco dimostrare che me lo merito."
  - tutor: "Sei mesi di prova mi sembrano una proposta seria. Ne parlo con la direzione e le do una risposta entro la fine del mese."
    goals: [next-steps]

- scenario: medico-specialista
  level: B2
  persona: en-f-student
  history: [reflexive]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Un po' meglio, grazie. Le palpitazioni ci sono ancora, ma meno spesso: forse due volte alla settimana, di solito la sera."
  - tutor: "Bene. E quando arrivano, di solito che cosa sta facendo?"
  - learner: "Quasi sempre sto studiando. Ho gli esami all'università, bevo cinque caffè al giorno e dormo poco. La settimana scorsa è successo mentre ero in biblioteca, e ho sentito anche un leggero dolore al petto."
  - tutor: "Cinque caffè sono tanti, ne parliamo dopo. E quel dolore quanto è durato? Che cosa ha fatto per farlo passare?"
  - learner: "È durato pochi minuti. Mi sono alzata, ho camminato un po' ed è passato. Io non mi sono spaventata molto, ma mia madre sì."
  - tutor: "Ha fatto bene a camminare. In famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Mio nonno ha avuto un infarto a cinquantacinque anni, e mio padre prende delle pillole per la pressione. Per questo mia madre preoccupa tanto per me."
    errors: [reflexive]
  - tutor: "La capisco. Ma «mia madre preoccupa tanto»? Al verbo manca qualcosa."
    prompt: {text: "mia madre preoccupa tanto", tags: [reflexive]}
  - learner: "Mia madre si preoccupa tanto per me. Ma gli esami cosa dicono? Devo preoccuparmi anch'io?"
  - tutor: "Esatto. E le do una buona notizia: gli esami sono normali e il cuore è sano. Quel battito veloce dipende quasi sicuramente dallo stress e dal caffè."
    goals: [history, understand]
  - learner: "Che sollievo! Quindi devo prendere delle medicine, o basta cambiare abitudini? Non vorrei pastiglie che mi facciano dormire durante gli esami."
  - tutor: "Per ora niente medicine: al massimo due caffè al giorno, sette ore di sonno e un po' di movimento. Se tra un mese il problema c'è ancora, facciamo un altro controllo."
    goals: [treatment]

# B2: prioritising among several errors, failed repairs followed by a recast, lexical recasts,
# with most learner turns left uncorrected because they are correct.

- scenario: medico-specialista
  level: B2
  persona: en-m-retired
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Non benissimo, purtroppo. Da circa un mese, quando salgo le scale o porto la spesa, sento un peso qui al petto e devo fermarmi. Dura due o tre minuti e poi passa."
  - tutor: "Ha fatto bene a venire. Questo peso lo sente solo sotto sforzo, o anche quando riposa? E c'è qualche altro problema insieme?"
  - learner: "Solo sotto sforzo; a riposo sto bene. Però la settimana scorsa, mentre ho camminato in salita con mio nipote, mi è girata la testa e sono dovuto sedermi su una panchina."
    errors: [tense-aspect, auxiliary-choice]
  - tutor: "Capisco, e sedersi è stata la cosa giusta. Un attimo, però: «mentre ho camminato in salita»? È l'azione che faceva da sfondo: quale tempo ci vuole?"
    prompt: {text: "mentre ho camminato in salita", tags: [tense-aspect]}
  - learner: "Mentre camminavo in salita, mi è girata la testa."
  - tutor: "Esatto. Allora i sintomi sono chiari: peso al petto e testa che gira, sempre sotto sforzo. Nella sua famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Sì. Mio fratello maggiore è stato operato al cuore a sessant'anni, e nostro padre è morto di infarto quando io avevo vent'anni. Fumava due pacchetti al giorno, però; io ho smesso trent'anni fa."
  - tutor: "È importante saperlo, grazie. E ha fatto benissimo a smettere di fumare. Veniamo agli esami: quello a riposo è normale, ma quello sotto sforzo mostra che il cuore fa fatica."
    goals: [history]
  - learner: "Che cosa significa «fa fatica», esattamente? Devo preoccuparmi? Preferisco che mi dice la verità, anche se è brutta."
    errors: [subjunctive-use]
  - tutor: "La verità la sentirà sempre da me, e non è brutta. Ma «preferisco che mi dice»... dopo «preferisco che» serve un altro modo del verbo."
    prompt: {text: "Preferisco che mi dice", tags: [subjunctive-use]}
  - learner: "Preferisco che mi dica la verità."
  - tutor: "Perfetto. Significa che sotto sforzo al cuore arriva un po' meno sangue del necessario. Non è grave, ma va curato: le do una terapia per proteggere il cuore e abbassare la pressione."
    goals: [understand]
  - learner: "Va bene. E ci sono effetti collaterali? Io guido ancora e lavoro nell'orto: non vorrei rinunciare."
  - tutor: "Nei primi giorni potrebbe sentirsi un po' stanco, quindi si alzi piano dalla sedia. Guidare e lavorare nell'orto vanno benissimo, senza esagerare. Ci rivediamo tra un mese per un controllo."
    goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-f-teacher
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie mille! Ci sposiamo a settembre. Immaginiamo una cerimonia civile, piccola, in un giardino, e poi un pranzo lungo come quelli delle domeniche in famiglia. Più che una festa elegante, vorrei una giornata calda e senza fretta."
  - tutor: "Un pranzo della domenica, ma in grande: mi piace moltissimo. Quante persone ci saranno intorno a quel tavolo?"
  - learner: "Sessanta, più o meno. I miei vengono da Valencia e sono venti; gli altri sono amici e la famiglia di Luca. Per il budget, pensavamo a quindicimila euro. Lei crede che bastano?"
    errors: [subjunctive-use]
  - tutor: "Sessanta è un bel numero. Però «Lei crede che bastano»... dopo «credere che» il verbo cambia. Mi ripete la domanda?"
    goals: [vision]
    prompt: {text: "Lei crede che bastano", tags: [subjunctive-use]}
  - learner: "Lei crede che bastino?"
  - tutor: "Brava. Sì, credo che bastino, se rinunciamo a qualche extra. Ho due posti in mente: una villa con giardino sul lago, oppure una cantina in collina, in mezzo ai campi."
    goals: [budget]
  - learner: "La villa sul lago deve essere romantica, ma la cantina mi piace di più: è più vicina alla nostra idea. E se piove, c'è uno spazio dentro? Mia nonna ha novant'anni e non può stare al freddo."
  - tutor: "Certo: c'è una grande sala calda, perfetta anche per la nonna. E il vino, naturalmente, è di casa. Allora scegliamo quella?"
  - learner: "Sì, scegliamo la cantina. Ho solo due condizioni. Il menù vogliamo provarlo prima di decidere. E il preventivo lo mandi anche a Luca, per favore: altrimenti poi se lo devo spiegare io, e lui fa mille domande."
    errors: [combined-pronouns]
  - tutor: "Condizioni giustissime. Solo una cosa: «se lo devo spiegare io»? In italiano «a lui» più «lo» diventa un'altra parola, tutta attaccata."
    goals: [choices]
    prompt: {text: "se lo devo spiegare io", tags: [combined-pronouns]}
  - learner: "Glielo devo spiegare io, certo. In spagnolo è «se lo»!"
  - tutor: "Proprio così! Allora: prova del menù a giugno, e il preventivo lo mando a tutti e due entro venerdì. Vedrete, sarà una domenica che non finisce più."
    goals: [conditions]

- scenario: politica-lavoro
  level: B2
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che in cucina non mi preoccupo. Una macchina può tagliare le cipolle, ma non può assaggiare un sugo e capire che manca qualcosa. Però per i camerieri e per chi lavora alla cassa, sì, vedo un rischio."
  - tutor: "Aspetta, aspetta: esistono già macchine che cucinano la pasta. Che cosa succederebbe se un giorno il tuo capo ne comprasse una?"
    goals: [opinion]
  - learner: "Se il mio capo comprerebbe una macchina così, i clienti andrebbero via dopo un mese. La gente viene da noi perché vuole mangiare qualcosa fatto da una persona."
    errors: [hypothetical]
  - tutor: "Può darsi! Ma senti come l'hai detto: «se il mio capo comprerebbe»? Dopo «se» ci vuole un'altra forma."
    prompt: {text: "Se il mio capo comprerebbe", tags: [hypothetical]}
  - learner: "Sì, se comprerebbe una macchina per risparmiare, perderebbe i clienti. Ne sono sicuro."
    errors: [hypothetical]
  - tutor: "D'accordo: se comprasse una macchina, forse perderebbe i clienti del sabato sera. Ma in un ospedale o in una scuola, chi se ne accorge? Conosci un posto dove è già successo?"
    goals: [hypothesis]
    recast: {text: "se comprerebbe", fix: "se comprasse", tags: [hypothetical]}
  - learner: "Sì. Un mio amico lavorava in una catena di pizzerie a Buenos Aires. Hanno messo gli schermi per ordinare e hanno mandato via la metà dei camerieri. Il servizio è più veloce, ma lui dice che i clienti restano di meno e non lasciano più la mancia."
  - tutor: "Ecco, vedi? Metà dei camerieri a casa. È esattamente quello che dicevo io."
    goals: [example]
  - learner: "Sì, ma non è tutta la storia. Due di quei camerieri hanno fatto un corso e adesso riparano proprio quegli schermi, e guadagnano più di prima. In conclusione: alcuni lavori spariscono, ma chi studia trova un'altra strada. Tu invece pensi davvero che non c'è speranza?"
    errors: [subjunctive-use]
  - tutor: "Bella conclusione, mi piace. Ma la domanda: «pensi davvero che non c'è speranza»? Dopo «pensi che» il verbo cambia."
    prompt: {text: "pensi davvero che non c'è speranza", tags: [subjunctive-use]}
  - learner: "Pensi davvero che non ci sia speranza?"
  - tutor: "Ora sì! E no, un po' di speranza c'è: me l'hai fatta venire tu con i tuoi camerieri. Però continuo a dire che la formazione dovrebbe pagarla chi compra le macchine. Beviamo a questo?"
    goals: [conclude]

- scenario: recensione-ristorante
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e mi dispiace disturbarla, ma preferisco dirlo a lei. Siamo quattro studentesse, abbiamo prenotato per le otto, e la cena è stata molto deludente, soprattutto per il prezzo."
  - tutor: "Non mi disturba affatto, la ringrazio di averlo fatto. Mi spieghi con calma che cosa è andato male."
    goals: [complain]
  - learner: "Per cominciare, abbiamo aspettato un'ora per ordinare. Poi il risotto era troppo salato e la mia amica ha trovato un capello nel piatto. E il cameriere, quando gli l'abbiamo detto, ci ha risposto in modo molto maleducato."
    errors: [combined-pronouns]
  - tutor: "Un capello nel piatto non deve succedere mai, mi scuso davvero. Ma mi permetta: «quando gli l'abbiamo detto»? I due pronomi, insieme, si uniscono in una parola sola."
    prompt: {text: "gli l'abbiamo detto", tags: [combined-pronouns]}
  - learner: "Quando gliel'abbiamo detto, ci ha risposto male."
  - tutor: "Esatto. E mi dispiace ancora di più per la risposta del cameriere. Mi dica: che cosa vi aspettavate, venendo qui?"
    goals: [detail]
  - learner: "Ci aspettavamo una cena speciale, perché una di noi festeggiava la laurea. Avevamo letto recensioni molto buone e ci faceva molta illusione venire qui. Sarebbe bastato che il cameriere si scusasse."
    errors: [word-choice]
  - tutor: "Capisco: non vedevate l'ora di venire, e vi abbiamo deluse proprio in una sera di festa. Vorrei farmi perdonare: i risotti non li pagate, e offro a tutte il dolce e qualcosa da bere per la laurea."
    goals: [expectation]
    recast: {text: "ci faceva molta illusione", fix: "non vedevate l'ora", tags: [word-choice]}
  - learner: "La ringrazio, è un gesto gentile e lo accettiamo. Però vorrei che parlasse anche con il cameriere, perché non succeda ad altri clienti."
  - tutor: "Lo farò questa sera, glielo prometto. E se tornate, chiedete di me: il tavolo migliore sarà vostro. Tanti auguri alla vostra amica!"
    goals: [resolve]

- scenario: riunione-lavoro
  level: B2
  persona: en-m-traveller
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, nel complesso. L'app per le prenotazioni è quasi pronta: questa settimana ho finito la parte dei pagamenti e ho cominciato le prove con dieci utenti veri."
  - tutor: "Ottimo, i pagamenti erano la parte che mi preoccupava di più. E dalle prove che cosa è venuto fuori?"
    goals: [update]
  - learner: "Niente di grave, ma c'è un problema: su alcuni telefoni vecchi l'app si blocca quando si carica una foto. Ho guardato per la causa tutto ieri e penso che dipende dalla memoria."
    errors: [word-choice, subjunctive-use]
  - tutor: "Meglio scoprirlo adesso che dopo la consegna. Però «penso che dipende»... dopo «penso che» serve un'altra forma."
    prompt: {text: "penso che dipende", tags: [subjunctive-use]}
  - learner: "Penso che dipenda dalla memoria dei telefoni vecchi."
  - tutor: "Giusto. E hai già in mente come risolverlo?"
    goals: [problem]
  - learner: "Sì, ho due idee. Potremmo ridurre le foto prima di caricarle, che è la soluzione più semplice. Oppure potrei scrivere di nuovo tutta quella parte, ma ci vorrebbe una settimana in più."
  - tutor: "La prima mi convince di più: semplice e veloce. Il cliente aspetta l'app da un mese, non possiamo regalargli un altro ritardo. Per quando pensi di farcela?"
    goals: [proposal]
  - learner: "Se scelgo la prima soluzione, finirò le prove entro mercoledì. Giovedì mandarò tutto al cliente, e venerdì potremo fare la presentazione."
    errors: [future-form]
  - tutor: "Mi piace il piano. Solo «mandarò»: al futuro, nei verbi come «mandare», quella «a» cambia."
    prompt: {text: "mandarò", tags: [future-form]}
  - learner: "Giovedì manderò tutto al cliente."
  - tutor: "Perfetto. Allora la scadenza è giovedì sera, e venerdì alle undici presentiamo. Se mercoledì vedi che non ce la fai, dimmelo subito."
    goals: [deadline]

- scenario: smartworking
  level: B2
  persona: es-f-teacher
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Io non ho scelta: sono insegnante, quindi vado a scuola tutte le mattine. Però correggo i compiti e preparo le lezioni a casa, il pomeriggio, e le riunioni con i colleghi ormai le facciamo quasi tutte online."
  - tutor: "Giusto, i ragazzi non si possono mettere tutti in uno schermo! E con questa metà del lavoro che fai da casa, come ti trovi?"
    goals: [situation]
  - learner: "Bene, per certi versi. Mi concentro meglio a casa che a scuola, dove c'è sempre rumore. E le riunioni online sono più corte, perché davanti allo schermo nessuno tiene voglia di parlare troppo."
    errors: [word-choice]
  - tutor: "Riunioni più corte perché nessuno ha voglia di parlare: questo sì che è un vantaggio! Da me durano due ore anche quando non c'è niente da dire. E il lato negativo?"
    goals: [pros]
    recast: {text: "nessuno tiene voglia", fix: "nessuno ha voglia", tags: [word-choice]}
  - learner: "Il lato negativo è che il lavoro non finisce mai. A casa correggo più compiti di a scuola, e a volte rispondo ai genitori alle dieci di sera. E poi lavorare sola è più noioso che lavorare con i colleghi."
    errors: [comparative]
  - tutor: "Le email alle dieci di sera le conosco bene, purtroppo. Ma «più compiti di a scuola»? Quando confronti due luoghi, la parola giusta non è «di»."
    prompt: {text: "più compiti di a scuola", tags: [comparative]}
  - learner: "Più compiti che a scuola. E pensare che lo spiego ai miei studenti!"
  - tutor: "Succede ai migliori! Dunque: ti concentri meglio, ma il lavoro non finisce mai. Se potessi decidere tu, come organizzeresti la settimana?"
    goals: [cons]
  - learner: "Mi piacerebbe avere un giorno alla settimana senza lezioni, per preparare tutto a scuola, in una stanza tranquilla. Così a casa non porterei più niente. Preferirei lavorare un'ora in più a scuola piuttosto che avere la cucina piena di quaderni."
  - tutor: "Un giorno senza lezioni e la casa libera dai quaderni: mi sembra un'idea piena di buon senso. Dovresti proporla a scuola. Intanto, prendiamo qualcos'altro da bere?"
    goals: [preference]

- scenario: trattativa-affitto
  level: B2
  persona: en-f-professional
  history: [conditional-form]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, molto, soprattutto il terrazzo. Sono interessata, ma devo essere sincera: il palazzo non ha l'ascensore, e io abiterei al quarto piano con una bicicletta. Questo per me è un vero problema."
  - tutor: "La capisco, quattro piani a piedi si sentono. Però al piano terra c'è una stanza comune per le biciclette, chiusa a chiave. Il canone richiesto è di 1.100 euro."
    goals: [interest]
  - learner: "Mille e cento senza ascensore mi sembra troppo, onestamente. Io potrebbe offrire 950, e in cambio pago sei mesi in anticipo. Penso che il proprietario sarebbe contento di avere questa garanzia."
    errors: [conditional-form]
  - tutor: "Sei mesi in anticipo sono un argomento forte. Ma «io potrebbe offrire»? Controlli la persona del verbo."
    prompt: {text: "Io potrebbe offrire", tags: [conditional-form]}
  - learner: "Io potrei offrire 950 euro, scusi."
  - tutor: "Perfetto. Guardi, 950 è troppo poco, ma con sei mesi in anticipo credo che il proprietario accetti 1.000. È il massimo che posso fare."
  - learner: "Mille può andare. Ma allora vorrei un contratto di quattro anni, non di uno, così il canone non cambia. E se devo partire prima, quanta notizia devo dare?"
    errors: [false-friend]
  - tutor: "Con quattro anni il canone resta fermo, d'accordo. Il preavviso da dare è di tre mesi, con una lettera: è scritto nella clausola sulla disdetta."
    goals: [negotiate, conditions]
    recast: {text: "quanta notizia", fix: "Il preavviso", tags: [false-friend]}
    new: [{lemma: preavviso, gloss: notice (period)}]
  - learner: "Tre mesi sono ragionevoli. Un'ultima domanda: la provvigione dell'agenzia è trattabile anche quella?"
  - tutor: "Bella domanda! Di solito no, ma visto che firma per quattro anni le faccio il dieci per cento di sconto. Allora, siamo d'accordo?"
    new: [{lemma: sconto, gloss: discount}]
  - learner: "Sì, siamo d'accordo: mille euro, quattro anni e lo sconto sulla provvigione. Mi mandi la proposta scritta e la firmo domani."
  - tutor: "Benissimo, gliela mando stasera. Brava, ha trattato meglio di molti italiani!"
    goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti. La verità è che l'Italia ha scelto me. Facevo il cuoco a Buenos Aires e un ristorante di Bologna cercava qualcuno per sei mesi. Sono passati otto anni e sono ancora qui."
  - tutor: "Sei mesi diventati otto anni: succede spesso, a chi arriva a Bologna! Che cosa l'ha fatta restare?"
  - learner: "La gente e il lavoro. In cucina ho trovato una seconda famiglia. Poi ho conosciuto mia moglie, che è di Modena. Due anni fa lei era imbarazzata, e adesso abbiamo un bambino. Ormai le mie radici sono qui."
    errors: [false-friend]
  - tutor: "Quindi sua moglie era incinta, e adesso c'è un piccolo emiliano in casa: auguri! Ma immagino che non sia stato tutto facile. Qual è stato il momento più duro?"
    goals: [story]
    recast: {text: "era imbarazzata", fix: "era incinta", tags: [false-friend]}
    new: [{lemma: incinta, gloss: pregnant}, {lemma: emiliano, gloss: from Emilia}]
  - learner: "Il primo inverno. Non conoscevo nessuno, e a Natale ho rimasto solo, a lavorare. E poi la lingua: una volta un collega mi ha chiesto il burro, e io ho pensato a un insulto, perché in spagnolo è un animale!"
    errors: [auxiliary-choice]
  - tutor: "Il burro, certo: in spagnolo è tutt'altra cosa! Ma torniamo al Natale: «ho rimasto solo»? Con «rimanere» il verbo che aiuta non è «avere»."
    prompt: {text: "ho rimasto solo", tags: [auxiliary-choice]}
  - learner: "Sono rimasto solo, è vero. Mi succede ancora, dopo otto anni!"
  - tutor: "Capita, e si capiva benissimo comunque. E in questi otto anni, Lei come è cambiato?"
    goals: [difficulties]
  - learner: "Sono diventato più tranquillo. In Argentina vivevo sempre di corsa e pensavo solo al lavoro. Qui ho imparato che un pranzo con gli amici non è tempo perso. Anche in cucina sono cambiato: prima volevo sorprendere, adesso voglio solo fare bene le cose semplici."
  - tutor: "Fare bene le cose semplici: è la lezione più difficile, in cucina e fuori. Un consiglio per chi ci ascolta e sogna di trasferirsi?"
    goals: [change]
  - learner: "Che venga con un mestiere in mano e senza aspettarsi troppo. E che non paragoni sempre tutto con il suo paese, perché così non ci si integra mai. L'Italia ti dà molto, ma prima devi avere pazienza."
  - tutor: "Un mestiere, pazienza e niente confronti: ce lo ricorderemo. Grazie di cuore, e buon lavoro in cucina. Alla prossima!"
    goals: [advice]

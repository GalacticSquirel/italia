# B2, negotiations and problem solving: the learner argues for conditions, the tutor resists and
# asks for reasons; a failed repair followed by a recast; many correct turns left alone.

- scenario: trattativa-affitto
  level: B2
  persona: en-f-professional
  history: [conditional-form]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Sì, è luminoso e la posizione è perfetta per il mio lavoro. Però ho notato che le finestre non sono doppie, e la casa è sulla strada principale. Temo che di notte ci sia molto rumore."
  - tutor: "Capisco la sua preoccupazione. Il traffico c'è, ma dopo le dieci di sera la strada diventa abbastanza tranquilla."
    goals: [interest]
  - learner: "Può darsi, ma lavoro spesso da casa e ho molte videochiamate. Per questo vorrei proporre una cosa: o il proprietario cambia le finestre, o il canone scende da 900 a 800 euro."
  - tutor: "Cambiare le finestre costa molto, quindi ne dubito. Il canone è trattabile, ma 800 mi sembra troppo poco. Perché proprio quella cifra?"
  - learner: "Perché nella stessa zona ho visto tre appartamenti simili, con le finestre nuove, a 850. Quindi senza finestre doppie 800 mi sembra giusto. In più posso dare una garanzia bancaria di sei mesi."
  - tutor: "Vedo che ha studiato bene il mercato. Posso proporre al proprietario 850 euro, ma non meno."
    goals: [negotiate]
  - learner: "Accettarei 850 euro, ma vorrei una clausola: se entro un anno le finestre non vengono cambiate, posso dare la disdetta con un mese di anticipo."
    errors: [conditional-form]
  - tutor: "Ne possiamo parlare. Ma ripeta il verbo: «accettarei»?"
    prompt: {text: "Accettarei", tags: [conditional-form]}
  - learner: "Accetterei 850 euro con quella clausola."
  - tutor: "Ecco. Un mese è poco, ma tre mesi il proprietario li accetterebbe di sicuro. E il contratto sarebbe di tre anni più due: le va bene?"
  - learner: "Tre mesi vanno bene, e anche tre anni più due. Però prima di firmare vorrei leggere tutto con calma: me lo può mandare per email?"
  - tutor: "Certo, glielo mando oggi pomeriggio, con la proposta a 850 euro e la clausola sulle finestre. Se il proprietario è d'accordo, firmiamo la settimana prossima."
    goals: [conditions, conclude]

- scenario: affittare-appartamento
  level: B2
  persona: en-m-retired
  history: [ce-ci-sono]
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno. Molto accogliente, complimenti. Io e mia moglie siamo in pensione e cerchiamo un appartamento per sei mesi all'anno, da ottobre a marzo. È possibile un contratto così?"
  - tutor: "Sì, si può fare un contratto breve, che va bene per periodi di pochi mesi. È arredato, quindi non dovete portare niente."
    goals: [contract]
  - learner: "Perfetto. E quanto sarebbe l'affitto? Sono comprese anche le spese per il riscaldamento? Veniamo dall'Ohio, ma alla nostra età il freddo lo sentiamo lo stesso."
  - tutor: "L'affitto è di 700 euro al mese, con il riscaldamento e le spese comprese: a parte pagate solo la luce. La caparra è di un mese."
    goals: [rent]
  - learner: "Benissimo. Un'altra domanda: è un ascensore? Mia moglie ha un problema al ginocchio, e tre piani a piedi sono troppi per lei."
    errors: [ce-ci-sono]
  - tutor: "Capisco. Lei vuole sapere se nel palazzo esiste un ascensore, giusto? Allora, «è un ascensore»... come si chiede?"
    prompt: {text: "è un ascensore", tags: [ce-ci-sono]}
  - learner: "Ah, sì: c'è un ascensore?"
  - tutor: "Esatto. Sì, c'è, ed è stato rifatto due anni fa. Anche la cucina e il bagno sono in ottime condizioni."
    goals: [condition]
  - learner: "Meno male. E il quartiere? Ci piace camminare, andare al mercato, sederci in un bar a leggere il giornale. Ci sono posti così qui vicino?"
  - tutor: "Ce ne sono tanti: il mercato è a due passi, e in piazza c'è un bar storico dove si incontrano tutti gli anziani del quartiere."
    goals: [neighbourhood]
  - learner: "Allora siamo nel posto giusto! Ne parlo con mia moglie stasera, ma credo proprio che lo prenderemo. Potremmo tornare domani insieme?"
  - tutor: "Certo, vi aspetto domani alle undici. Così la signora prova anche l'ascensore!"
    goals: [decide]

- scenario: recensione-ristorante
  level: B2
  persona: es-m-worker
  history: [register]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, guarda, ti spiego: ho ordinato un risotto ai funghi, e mi è arrivato freddo e scotto."
    errors: [register]
  - tutor: "Mi dica pure, l'ascolto. Solo una cosa: «guarda, ti spiego»... con me userebbe il tu?"
    prompt: {text: "guarda, ti spiego", tags: [register]}
  - learner: "Ha ragione, scusi. Guardi, le spiego: il risotto è arrivato freddo e scotto."
  - tutor: "Mi dispiace davvero: è proprio il contrario di come deve essere un risotto. Mi racconta com'è andata?"
    goals: [complain]
  - learner: "Io faccio il cuoco, quindi lo so: il riso era troppo cotto perché era rimasto fermo in cucina almeno dieci minuti. E quando l'ho detto al cameriere, mi ha risposto che era la ricetta della casa."
  - tutor: "Questo non doveva succedere, e ne parlerò con lui. Che cosa si aspettava, venendo da noi?"
    goals: [detail]
  - learner: "Mi aspettavo un risotto morbido e cremoso, come quello che ho mangiato qui l'anno scorso. Se il cameriere avesse ammesso l'errore, non avrei chiesto di parlare con lei."
  - tutor: "Ha perfettamente ragione. Le propongo di rifarle il risotto adesso, oppure di non farglielo pagare: decida lei."
    goals: [expectation]
  - learner: "Grazie, ma ormai non ho più fame. Preferisco di non pagarlo, e magari torno un'altra sera per provarlo come si deve."
    errors: [modal-infinitive]
  - tutor: "Mi sembra giusto. Però «preferisco di non pagarlo»: dopo «preferisco» serve davvero quel «di»?"
    prompt: {text: "Preferisco di non pagarlo", tags: [modal-infinitive]}
  - learner: "No: preferisco non pagarlo, grazie."
  - tutor: "Allora il risotto è offerto, e la prossima volta glielo preparo io personalmente, come si deve. Buona serata!"
    goals: [resolve]

- scenario: organizzare-matrimonio
  level: B2
  persona: en-f-student
  history: [combined-pronouns]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Io sono inglese e Matteo è di Verona, quindi immaginiamo un matrimonio a metà strada: una cerimonia all'aperto, in collina, e poi una festa con musica dal vivo e tanto ballo, come in Inghilterra."
  - tutor: "Un matrimonio tra due paesi: mi piace molto! Quanti invitati pensate di avere, e che budget avete?"
    goals: [vision]
  - learner: "Più o meno cento invitati. Il budget è di venticinquemila euro, ma i miei genitori preferirebbero che ne spendessimo meno."
  - tutor: "Con cento invitati, venticinquemila euro bastano, se scegliamo bene. Ho due posti: un agriturismo in collina, oppure una villa sul lago di Garda."
    goals: [budget]
    new: [{lemma: agriturismo, gloss: farm guesthouse}]
  - learner: "L'agriturismo ci piace di più, perché è più informale e possiamo ballare fino a tardi. La villa è bellissima, ma più fredda: sembra un museo."
  - tutor: "D'accordo, allora l'agriturismo. Ci sono condizioni che vuole scrivere nel contratto?"
    goals: [choices]
  - learner: "Sì. La musica non deve finire prima dell'una. E il fotografo: vorrei vedere le foto di altri matrimoni prima di sceglierlo. Mi le può mandare? Matteo le guarda sempre troppo di corsa."
    errors: [combined-pronouns]
  - tutor: "Nessun problema per la musica. Ma «mi le può mandare»? Quando i due pronomi sono vicini, il primo cambia."
    prompt: {text: "Mi le può mandare", tags: [combined-pronouns]}
  - learner: "Me li può mandare?"
    errors: [combined-pronouns]
  - tutor: "Certo, gliele mando stasera, solo a lei. E se ne vuole altre, me le può chiedere quando vuole. Altre condizioni?"
    recast: {text: "Me li può", fix: "me le può", tags: [combined-pronouns]}
  - learner: "Sì, un'ultima: niente sorprese sul preventivo. Ogni spesa in più ce la deve dire prima."
  - tutor: "Promesso: ogni cambiamento ve lo scrivo prima, e decidete voi. Ci vediamo sabato in collina, per vedere il posto?"
    goals: [conditions]

- scenario: riunione-lavoro
  level: B2
  persona: es-f-erasmus
  history: [stare-gerund]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Sono preparando la presentazione per il cliente di Bari: ho finito l'analisi dei dati, e adesso mancano solo i grafici."
    errors: [stare-gerund]
  - tutor: "Bene. Ma «sono preparando»? Davanti a «preparando», quale verbo usiamo?"
    prompt: {text: "Sono preparando", tags: [stare-gerund]}
  - learner: "Sto preparando, scusa. Sto preparando la presentazione."
  - tutor: "Perfetto. E i dati, che cosa dicono?"
    goals: [update]
  - learner: "Dicono una cosa che al cliente non piacerà: le vendite online sono scese del dodici per cento, mentre nei negozi sono salite. Ho paura che, se lo diciamo così, il cliente si arrabbi."
  - tutor: "È un rischio, sì. Ma non possiamo nascondere i numeri. Tu come lo presenteresti?"
    goals: [problem]
  - learner: "Non voglio nascondere niente. Propongo di mostrare prima i negozi, che vanno bene, e poi i numeri online, con tre idee per migliorarli. Così la riunione finisce con delle soluzioni, non con un problema."
  - tutor: "Mi piace. Ma tre idee serie richiedono tempo, e la riunione è giovedì. Ce la fai?"
    goals: [proposal]
  - learner: "Sinceramente, per giovedì è difficile. Se potessimo spostare la riunione a lunedì, avrei il fine settimana per controllare tutto con Giulia."
  - tutor: "Spostare la riunione non mi piace: l'ha chiesta il cliente. Perché non giovedì, con due idee invece di tre?"
  - learner: "Va bene, hai ragione: due idee buone sono meglio di tre fatte di corsa. Allora mercoledì sera ti mando tutto, così lo guardi prima della riunione."
  - tutor: "Perfetto: mercoledì sera a me, giovedì al cliente. E se ti serve una mano, chiedila pure a Giulia."
    goals: [deadline]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-retired
  history: [passive]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri ho avuto un incidente in una rotonda. Io ero già dentro, e un'altra macchina è entrata senza dare la precedenza e mi ha colpito sul lato."
  - tutor: "Capisco. Qualcuno si è fatto male? E l'altro autista ha ammesso di avere torto?"
    goals: [what]
  - learner: "Nessuno si è fatto male, per fortuna. Ma l'altro autista dice che la colpa è mia, perché secondo lui andavo troppo veloce. Io andavo a trenta all'ora, al massimo."
  - tutor: "Quindi non siete d'accordo su chi ha la colpa. C'erano testimoni, o una telecamera?"
  - learner: "Sì, c'era un signore alla fermata dell'autobus che ha visto tutto e mi ha lasciato il suo numero. E l'incidente è stata registrato dalla telecamera di un negozio."
    errors: [passive]
  - tutor: "Ottimo. Però «l'incidente è stata registrato»? Guardi bene il soggetto."
    prompt: {text: "è stata registrato", tags: [passive]}
  - learner: "L'incidente è stato registrato. È maschile."
  - tutor: "Esatto. Con un testimone e un video, la sua versione è molto più forte. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "No, perché lui non voleva firmarla. Però ho fatto le foto della sua targa e dei danni: la mia portiera è tutta piegata, e lo specchietto si è rotto."
  - tutor: "Ha fatto bene. Senza constatazione, apriamo noi il sinistro con l'assicurazione dell'altro autista. Mi manda le foto, il video e il numero del testimone?"
    goals: [documents]
  - learner: "Certo, glieli mando oggi. E quanto tempo ci vorrà per sapere chi ha ragione? Intanto devo pagare io la franchigia?"
  - tutor: "Di solito ci vogliono uno o due mesi. Per ora non paga niente: se la colpa è dell'altro, la franchigia non la paga affatto."
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-teacher
  history: [demonstrative]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Sono spagnola, insegno in una scuola di lingue qui a Verona, e vorrei iscrivermi all'anagrafe. Credo di avere tutti i documenti."
  - tutor: "Benissimo. Mi può dare un documento d'identità, il codice fiscale e il contratto di casa?"
    goals: [request]
    new: [{lemma: fiscale, gloss: tax (adjective)}]
  - learner: "Ecco qui. Però c'è un problema: sul codice fiscale c'è solo il mio primo cognome, mentre sul passaporto ci sono tutti e due, come si usa in Spagna."
  - tutor: "Ah, con i cittadini spagnoli succede spesso. Per noi è un problema, perché i dati devono essere uguali su tutti i documenti."
    goals: [documents]
  - learner: "E allora cosa posso fare? Devo tornare all'Agenzia delle Entrate? Quello ufficio è sempre pienissimo: l'ultima volta ho aspettato tre ore."
    errors: [demonstrative]
  - tutor: "La capisco. Ma «quello ufficio»? Davanti a una parola come «ufficio», «quello» cambia forma."
    prompt: {text: "Quello ufficio", tags: [demonstrative]}
  - learner: "Quell'ufficio! Quell'ufficio è sempre pienissimo."
  - tutor: "Esatto. Purtroppo il codice fiscale va corretto, ma si può fare anche online, senza code. Intanto io apro la pratica, e lei poi mi porta il certificato nuovo."
    goals: [problem]
  - learner: "Che sollievo, grazie. E dopo che porto il certificato, quanto tempo si deve aspettare per avere la residenza?"
  - tutor: "La residenza vale dal giorno della domanda, cioè da oggi. Poi entro quarantacinque giorni passano i vigili, e se è tutto in regola la pratica si chiude."
    goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: es-m-worker
  history: [comparative]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, grazie per l'invito. Mi chiamo Diego, ho trentaquattro anni e sono di Buenos Aires. Ho lavorato dieci anni come falegname, e da tre anni disegno mobili."
  - tutor: "Un percorso interessante, dal legno al computer. Come è nato questo cambiamento?"
    goals: [intro]
  - learner: "Quando ero in falegnameria, i clienti mi chiedevano sempre dei disegni prima di ordinare un mobile. Io li facevo a mano, e piano piano mi sono accorto che disegnare mi piaceva più che costruire."
  - tutor: "Capisco. E che tipo di progetti segue adesso?"
  - learner: "Adesso lavoro per una ditta di cucine. L'anno scorso ho disegnato una linea di tavoli in legno riciclato che si sono venduti molto bene, soprattutto in Germania."
  - tutor: "Ottimo risultato. Quali sono i suoi punti di forza? E un punto debole, se c'è?"
    goals: [experience]
  - learner: "Il mio punto di forza è che conosco il legno: so cosa si può costruire e cosa no. Il punto debole è il computer: i programmi di disegno li uso, ma mi piacciono meno che la matita, e a volte sono lento."
    errors: [comparative]
  - tutor: "È un punto debole onesto. Ma «meno che la matita»? Tra due nomi, quale parola usiamo?"
    prompt: {text: "meno che la matita", tags: [comparative]}
  - learner: "Meno della matita."
  - tutor: "Esatto. E perché vorrebbe lavorare proprio da noi?"
    goals: [strengths]
  - learner: "Perché voi fate mobili per bambini, e io ho due figli piccoli: so quanto è difficile trovare mobili belli e sicuri. Mi piacerebbe progettare cose che durino, che passino da un fratello all'altro."
  - tutor: "Una ragione molto personale, e si sente. Ha qualche domanda per noi?"
    goals: [why]
  - learner: "Sì: chi disegna i mobili lavora anche nel laboratorio, con gli artigiani, o solo in ufficio? Per me sarebbe importante restare vicino al legno."
  - tutor: "Lavora anche in laboratorio, almeno due giorni alla settimana: per noi è fondamentale. Le faremo sapere entro dieci giorni."
    goals: [questions]

# B2: negotiations and discussions where the tutor pushes the learner to justify a position.
# One dialogue has no learner errors at all; the others have one or two.

- scenario: affittare-appartamento
  level: B2
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
  - learner: "Buongiorno, e grazie di avermi ricevuto di sabato. È un bel soggiorno, anche se dalle foto me lo immaginavo più grande. Posso chiederle subito dell'affitto? L'annuncio diceva 1.200 euro, ma non era chiaro che cosa fosse compreso."
  - tutor: "Ha ragione, le foto fanno sempre sembrare tutto più grande. I 1.200 euro comprendono il condominio e il riscaldamento, che è centrale. A parte ci sono luce e gas."
    goals: [rent]
  - learner: "Capisco. Io e mia moglie pensiamo di restare almeno tre anni, finché nostra figlia non finisce l'università qui. Che tipo di contratto propone? E quanto chiede di caparra?"
  - tutor: "Per tre anni c'è un contratto adatto, di tre anni più due, con un affitto un po' più basso: potrei scendere a 1.100. La caparra è di due mesi."
    goals: [contract]
  - learner: "Millecento è già più interessante. Prima di decidere, però, vorrei sapere in che stato è la casa. Ho fatto l'ingegnere per quarant'anni, e la prima cosa che guardo sono i tubi e i fili della luce."
  - tutor: "Allora con Lei devo stare attento! Tubi e fili sono stati cambiati nel 2019, e ho tutti i documenti. Lavatrice e frigorifero sono nuovi; solo la lavastoviglie ha dieci anni, ma funziona."
    goals: [condition]
  - learner: "Se si rompesse, chi pagherebbe la riparazione? Preferirei che fosse scritto nel contratto, così evitiamo discussioni. E mi dica del quartiere: mia moglie ci tiene ad avere i negozi vicini, perché non guidiamo più volentieri."
  - tutor: "Giusto: se si rompe la cambio io, e lo scriviamo. Quanto al quartiere, in cinque minuti a piedi trova il mercato, la farmacia e due supermercati. Il tram per il centro ferma qui davanti."
    goals: [neighbourhood]
  - learner: "Mi sembra tutto molto ragionevole. Le dico sinceramente che siamo interessati, ma vorrei tornarci domani con mia moglie: in casa nostra l'ultima parola è sempre la sua."
  - tutor: "Come in casa mia! Venite pure domani alle undici, vi aspetto. Intanto le preparo una copia del contratto da leggere con calma."
    goals: [decide]

- scenario: arte-mostra
  level: B2
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi piace, ma mi confonde. Da lontano sembrava una fotografia, e adesso che sono vicina vedo solo macchie di colore. È come se il quadro cambiasse mentre cammino."
  - tutor: "È esattamente l'effetto che volevano ottenere. Fermati qui, a due metri, e descrivimi quello che riconosci."
    goals: [react]
  - learner: "Riconosco un fiume con delle barche e, sulla riva, gente che mangia sotto gli alberi. La luce del sole è dipinto con piccoli tocchi bianchi e gialli sull'acqua. Non ci sono linee: tutto è fatto di punti di colore."
    errors: [passive]
  - tutor: "Che occhio! Ma ascolta bene: «la luce del sole è dipinto»? Guarda la fine dell'ultima parola."
    prompt: {text: "La luce del sole è dipinto", tags: [passive]}
  - learner: "La luce è dipinta con piccoli tocchi, certo."
  - tutor: "Perfetto. Niente linee, solo colore: per l'epoca era una cosa mai vista. Secondo te, perché dipingevano così?"
    goals: [describe]
  - learner: "Penso che volessero dipingere non le cose, ma il momento. La luce cambia ogni minuto, quindi bisognava lavorare in fretta, all'aperto. Non importa che la barca sia precisa: importa che sentiamo il caldo di quel pomeriggio."
  - tutor: "Brava, è proprio così: non le cose ma il momento. E pensa che allora molti dicevano che questi quadri sembravano non finiti. Tu a che cosa lo avvicineresti?"
    goals: [interpret]
  - learner: "Lo confronto con i quadri di Sorolla, un pittore di Valencia che amo molto. Anche lui dipingeva la luce del mare e la gente sulla spiaggia. Però Sorolla è più realista: nei suoi quadri i bambini si riconoscono, qui invece le persone sono quasi delle ombre felici."
  - tutor: "Sorolla! Ottimo confronto: stessa passione per la luce, ma lui tiene il disegno e questi lo lasciano andare. «Ombre felici» è bellissimo, tra l'altro. Andiamo avanti?"
    goals: [compare]

- scenario: assicurazione-sinistro
  level: B2
  persona: en-f-student
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Chiamo perché ho avuto un incidente sabato mattina, a Bologna. Stavo uscendo da un parcheggio in retromarcia e ho toccato una macchina che stava passando dietro di me."
  - tutor: "Va bene, non si preoccupi, sono cose che capitano. Andava piano, immagino. Qualcuno si è fatto male?"
  - learner: "No, nessuno, andavo pianissimo. Ma la portiera dell'altra macchina è stata rovinato, e anche il mio paraurti. La signora era arrabbiata all'inizio, poi ci siamo calmate e abbiamo parlato."
    errors: [passive]
  - tutor: "Meno male che vi siete calmate. Solo un dettaglio: «la portiera è stata rovinato»? L'ultima parola deve andare d'accordo con «portiera»."
    prompt: {text: "è stata rovinato", tags: [passive]}
  - learner: "La portiera è stata rovinata, sì."
  - tutor: "Benissimo. Dunque: Lei usciva dal parcheggio all'indietro e l'altra auto passava sulla strada. Secondo Lei, di chi è la responsabilità?"
    goals: [what]
  - learner: "Mia, purtroppo. Lei aveva la precedenza, e io non l'ho vista perché c'era un furgone parcheggiato che mi copriva la strada. Non voglio trovare scuse: avrei dovuto uscire più lentamente."
  - tutor: "La ringrazio di essere così onesta, non è da tutti. In effetti chi esce da un parcheggio deve dare la precedenza. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo compilata insieme e l'abbiamo firmato tutte e due. Ho anche le foto. Solo che ho dimenticato di scrivere il numero della mia patente: è un problema?"
    errors: [participle-agreement]
  - tutor: "Per la patente non c'è problema, me lo dice adesso. Ma senta: «l'abbiamo firmato»? Quel «l'» è la constatazione, e la parola «firmato» deve seguirla."
    prompt: {text: "l'abbiamo firmato", tags: [participle-agreement]}
  - learner: "L'abbiamo firmata tutte e due. E il numero della patente è BO 5521783 K."
  - tutor: "Perfetto, ne ho preso nota. Allora ho tutto: mi mandi solo il modulo e le foto per email."
    goals: [documents]
  - learner: "Lo faccio subito. E adesso che cosa succede? Dovrò pagare di più l'anno prossimo?"
  - tutor: "Noi paghiamo il danno alla signora, e Lei non deve dare niente a nessuno. L'anno prossimo, però, il prezzo dell'assicurazione salirà un po', perché la responsabilità è sua. Le scrivo appena la pratica è chiusa."
    goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Sono spagnola, insegno in una scuola internazionale e abito a Verona da gennaio. Dovrei fare il cambio di residenza, e vorrei sapere se posso presentare la domanda oggi."
  - tutor: "Buongiorno. Sì, la domanda si può presentare oggi, se ha tutto. Servono il passaporto, il contratto d'affitto registrato e la prova che lavora qui."
    goals: [request]
  - learner: "Ho il passaporto e il contratto di lavoro. Il contratto d'affitto ce l'ho, però non so se sia registrato: ha fatto tutto il proprietario. Come si controlla?"
  - tutor: "Si vede subito: sul contratto registrato c'è un timbro dell'Agenzia delle Entrate, con una data e un numero. Me lo fa vedere?"
    goals: [documents]
    new: [{lemma: timbro, gloss: (rubber) stamp}]
  - learner: "Ecco. Mi sembra che non c'è nessun timbro... Quindi non è registrato? Ma io pago l'affitto da cinque mesi! È necessario che il proprietario lo facci subito, allora."
    errors: [subjunctive-use, subjunctive-form]
  - tutor: "Purtroppo no, non è registrato, e capisco che la cosa non le piaccia. Ma «mi sembra che non c'è»... dopo «mi sembra che» il verbo cambia modo."
    prompt: {text: "Mi sembra che non c'è", tags: [subjunctive-use]}
  - learner: "Mi sembra che non ci sia nessun timbro. E adesso cosa posso fare?"
  - tutor: "Giusto. Senza quel timbro la pratica non può essere accettata. Però c'è una soluzione: il proprietario può registrare il contratto online in pochi giorni, e Lei torna con la ricevuta."
    goals: [problem]
    new: [{lemma: timbro, gloss: (rubber) stamp}]
  - learner: "Va bene, lo chiamo oggi stesso. E se lui non volesse farlo? Non vorrei perdere altri mesi."
  - tutor: "In quel caso può registrarlo Lei, e poi chiedere a lui metà della spesa: è un suo diritto. Ma di solito basta una telefonata decisa."
  - learner: "Perfetto, grazie del consiglio. E una volta presentata la domanda, quanto bisogna aspettare?"
  - tutor: "La residenza parte dal giorno della domanda. Poi, entro quarantacinque giorni, vengono i vigili a casa per un controllo, e la pratica viene chiusa. La aspetto con la ricevuta, allora!"
    goals: [next]

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-erasmus
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, grazie. Mi chiamo Lucía Romero, ho ventitré anni e sono di Siviglia. Ho finito la carriera di Belle Arti l'anno scorso e adesso faccio un master in design a Milano."
    errors: [false-friend]
  - tutor: "Piacere. Quindi ha finito l'università a Siviglia e ora studia a Milano: una bella strada. Ha già lavorato, durante gli studi?"
    goals: [intro]
    recast: {text: "Ho finito la carriera", fix: "ha finito l'università", tags: [false-friend]}
  - learner: "Sì. Per due estati ho lavorato in una piccola casa editrice, dove disegnavo le copertine dei libri per ragazzi. E l'anno scorso ho vinto un concorso per il manifesto di un festival di cinema: è stato il mio primo lavoro pagato bene!"
  - tutor: "Le copertine le ho viste insieme al suo curriculum, sono molto fresche. Ma vorrei capire una cosa: perché ha lasciato la casa editrice, se si trovava bene?"
    goals: [experience]
  - learner: "Perché volevo crescere. Lì ero l'unica che disegnava, e non avevo nessuno da cui imparare. Era comodo, ma dopo due estati facevo sempre le stesse cose."
  - tutor: "È una risposta sincera, e la capisco. Allora mi dica: in che cosa è davvero brava, e in che cosa deve ancora migliorare?"
  - learner: "Sono brava con i colori e sono veloce: non ho mai consegnato in ritardo. Devo migliorare quando parlo in pubblico. All'università, ogni volta che ho presentato un progetto ero nervosissima, e ancora oggi mi trema la voce."
    errors: [tense-aspect]
  - tutor: "Tremava anche a me, alla sua età. Però «ogni volta che ho presentato un progetto»: è una cosa che si ripeteva. Quale tempo usiamo?"
    prompt: {text: "ogni volta che ho presentato un progetto", tags: [tense-aspect]}
  - learner: "Ogni volta che presentavo un progetto, ero nervosissima."
  - tutor: "Esatto. E qui avrà modo di fare pratica: parliamo con i clienti ogni settimana. Perché ha pensato proprio a noi?"
    goals: [strengths]
  - learner: "Perché lavorate molto con le case editrici e con i musei, che è il mondo che conosco e che amo. E perché siete pochi: in una squadra piccola potrei imparare da tutti. Posso chiederle com'è organizzata una settimana normale, per chi ha questo ruolo?"
  - tutor: "Certo. Il lunedì dividiamo i progetti, poi ognuno lavora con molta libertà, e il venerdì guardiamo insieme i risultati. Mi ha fatto una buona impressione: la chiamo entro martedì."
    goals: [why, questions]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-heritage
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Lavoro in magazzino da quattro anni, e da uno e mezzo organizzo i turni di dodici persone, anche se sul contratto sono ancora un semplice operaio. Vorrei parlare di questo."
  - tutor: "Ha fatto bene a venire. È vero, da quando c'è Lei i turni funzionano meglio. Ha qualche dato da mostrarmi?"
  - learner: "Sì. Quest'anno gli errori nelle spedizioni sono scesi da quaranta a dodici al mese, e le ore di straordinario sono diminuite del quindici per cento. Ho anche insegnato il sistema nuovo a tre ragazzi appena arrivati."
  - tutor: "Sono numeri importanti, e non li conoscevo così bene. Dunque, che cosa mi chiede?"
    goals: [results]
  - learner: "Chiedo di essere promosso a capo reparto, con lo stipendio giusto per quel ruolo. Non è giusto che io facci il lavoro di un capo con la paga di un operaio. Credo che Lei mi capisca."
    errors: [subjunctive-form]
  - tutor: "La capisco benissimo. Ma «che io facci»? Il modo è quello giusto, però la forma del verbo «fare» è un'altra."
    prompt: {text: "che io facci", tags: [subjunctive-form]}
  - learner: "Non è giusto che io faccia il lavoro di un capo."
  - tutor: "Esatto, e ha ragione. Però le devo dire una cosa: per quel ruolo l'azienda di solito chiede un titolo di studio tecnico, e Lei non ce l'ha. Come la mettiamo?"
    goals: [request]
  - learner: "Lo so, ed è un punto debole. Ma ho l'esperienza, che secondo me vale di più. E sono pronto ad attendere un corso serale, se l'azienda mi aiuta con gli orari. Se me l'avessero detto prima, l'avrei già cominciato."
    errors: [false-friend]
  - tutor: "Questa è la risposta che speravo. Se frequenta un corso serale, posso proporre la promozione subito, con una prova di sei mesi. Le sembra corretto?"
    goals: [handle]
    recast: {text: "attendere un corso serale", fix: "frequenta un corso serale", tags: [false-friend]}
  - learner: "Mi sembra corretto. Mi iscrivo questa settimana e le porto la ricevuta. Quando potremmo firmare il nuovo contratto?"
  - tutor: "Parlo con l'ufficio del personale domani, e conto di farle firmare entro la fine del mese. Bravo, la promozione l'ha meritata."
    goals: [next-steps]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io lavoro in un ristorante del centro, quindi capisco chi ha paura. Però sono a favore della chiusura, almeno la sera. Con le macchine davanti alla porta, nessuno vuole mangiare fuori."
  - tutor: "Proprio Lei, che lavora in centro? Mi sorprende. E i clienti che arrivano in macchina da fuori città, non ha paura di perderli?"
    goals: [position]
  - learner: "Un po' sì. Ma penso che i vantaggi sono più grandi. Primo: potremmo mettere venti tavoli in strada, e venti tavoli sono due camerieri in più. Secondo: i turisti cercano posti tranquilli, non il rumore dei motorini."
    errors: [subjunctive-use]
  - tutor: "Venti tavoli in più sono un argomento serio. Però «penso che i vantaggi sono»... con «penso che» come deve essere il verbo?"
    prompt: {text: "penso che i vantaggi sono", tags: [subjunctive-use]}
  - learner: "Penso che i vantaggi sono più grandi dei problemi. Non capisco l'errore, scusi."
    errors: [subjunctive-use]
  - tutor: "Non si preoccupi: anch'io penso che i vantaggi siano tanti, per un ristorante. Ma un negozio di mobili o di televisori non mette tavoli in strada. A loro che cosa dice?"
    goals: [argue]
    recast: {text: "che i vantaggi sono", fix: "che i vantaggi siano", tags: [subjunctive-use]}
  - learner: "Dico che hanno ragione a preoccuparsi, e che per loro bisogna trovare una soluzione diversa. Per esempio, si potrebbe lasciare aperto il centro la mattina, quando la gente compra le cose pesanti, e chiuderlo dalle sei di sera."
  - tutor: "Questo è già un altro discorso. Ma la sera i residenti dove lasciano la macchina? Io abito in centro e un posto al chiuso non ce l'ho."
    goals: [counter]
  - learner: "Ha ragione, per i residenti sarebbe ingiusto. Loro dovrebbero poter entrare sempre, con un permesso. Allora il compromesso potrebbe essere questo: centro chiuso solo la sera, solo a chi non ci abita, e per un periodo di prova."
  - tutor: "Chiuso la sera, aperto ai residenti e in prova: così mi sta bene. E magari una sera vengo a mangiare a uno di quei venti tavoli!"
    goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io. Ho letto «Novecento» di Alessandro Baricco, che è brevissimo: l'ho finito in una sera. È la storia di un pianista nato su una nave, all'inizio del secolo scorso, che cresce a bordo e diventa il più grande musicista dell'oceano."
  - tutor: "Un libro da una sera, perfetto per chi ha poco tempo! E questo pianista che vive in mezzo al mare, che uomo è?"
    goals: [summary]
  - learner: "È un carattere misterioso. Non ha documenti, non ha patria, e non è mai sceso dalla nave in tutta la sua vita. Conosce il mondo solo attraverso i passeggeri che incontra. È un genio, ma ha anche paura: la terra per lui è troppo grande."
    errors: [false-friend]
  - tutor: "È un personaggio misterioso davvero, e quel «troppo grande» è il cuore del libro, secondo me. E a te è piaciuto, o ti ha lasciata fredda?"
    goals: [characters]
    recast: {text: "un carattere misterioso", fix: "un personaggio misterioso", tags: [false-friend]}
  - learner: "Mi è piaciuto, ma non completamente. La lingua è bellissima, sembra musica. Però a volte l'autore mi sembra troppo innamorato delle proprie frasi, e il narratore, che la voce sentiamo sempre, resta un po' vuoto."
    errors: [relative-pronoun]
  - tutor: "Critica interessante, e non sei la sola a pensarla così. Ma «il narratore, che la voce sentiamo»? Per dire che la voce è sua serve un'altra forma, non solo «che»."
    prompt: {text: "che la voce sentiamo", tags: [relative-pronoun]}
    new: [{lemma: critica, gloss: critique}]
  - learner: "Il narratore, la cui voce sentiamo sempre, resta un po' vuoto."
  - tutor: "Perfetto, e non era facile! Quindi bella musica, ma personaggi un po' deboli. A chi lo faresti leggere?"
    goals: [opinion]
  - learner: "A chi ama la musica e il mare, e a chi studia italiano, perché le frasi sono corte e il libro è piccolo. Invece non lo consiglierei a chi vuole una trama complessa: succede pochissimo."
  - tutor: "Chiaro: per chi ama più il suono delle parole che le sorprese. Tra l'altro c'è anche un bel film, se a qualcuno interessa. Grazie!"
    goals: [recommend]

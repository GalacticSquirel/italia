    prompt: {text: "mi figlio", tags: [possessive]}
  - learner: "Ah, sì! Con mio figlio Diego."
  - tutor: "Perfetto! E cosa avete fatto?"
    goals: [where]
  # merlin-1395_0001066-2
  - learner: "Abiamo trovato una piccola casa vicino al mare."
    errors: [spelling]
  - tutor: "Che bello! Ma «abiamo», così... manca una lettera?"
    prompt: {text: "Abiamo", tags: [spelling]}
  - learner: "Abbiamo! Abbiamo trovato una casa e siamo andati al mare ogni giorno."
  - tutor: "Esatto! Mare ogni giorno, che vita! E la cosa più bella?"

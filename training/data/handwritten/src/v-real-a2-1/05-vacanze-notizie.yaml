  - tutor: "Ah, i signori della casa! Le persone sono importanti."
    goals: [best]

- scenario: vacanze-passate
  level: A2
  persona: en-f-professional
  history: [noun-number]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0000364-3
  - learner: "Purtroppo non posso andare in Italia."
  - tutor: "Peccato! Allora sei rimasta a casa, in Inghilterra? E com'era il tempo?"
    goals: [where]
  # merlin-1395_0000639-1
  - learner: "Qui non va bene: fa bruto tempo da tre setimane e piove ogni giorni."
    errors: [noun-number, spelling]
  - tutor: "Che peccato! Ma «ogni giorni»? Dopo «ogni»: uno o tanti?"
    prompt: {text: "ogni giorni", tags: [noun-number]}
  - learner: "Piove ogni giorni, sì."
    errors: [noun-number]
  - tutor: "Piove ogni giorno? Povera! Qui invece c'era il sole."
    recast: {text: "ogni giorni", fix: "ogni giorno", tags: [noun-number]}
    goals: [weather]
  # merlin-1395_0000341-0
  - learner: "Lavoro sempre alla pasticeria, tutto va bene"
    errors: [preposition, spelling]
  - tutor: "Ah, quindi hai lavorato! Ma «alla»... per i negozi, quale preposizione usiamo?"
    prompt: {text: "alla pasticeria", tags: [preposition]}
  - learner: "In pasticceria! Lavoro in pasticceria, faccio i dolci."
  - tutor: "Brava! Allora la prossima volta porta i tuoi dolci qui!"
    goals: [activities, best]


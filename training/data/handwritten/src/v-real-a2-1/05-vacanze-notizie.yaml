- scenario: weekend-scorso
  level: A2
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
  - tutor: "Ciao! Com'è andato il fine settimana?"
  # merlin-1395_0000630-6
  - learner: "Io invece sono andato con gli amici in montagna per fare mountain - bike."
  - tutor: "Che bello! E chi c'era?"
    goals: [where, what]
  # merlin-1395_0000458-3
  - learner: "La conosci della nostra vacanza nella Puglia."
    errors: [articulated-preposition, article-use]
  - tutor: "Chi? Ah, l'amica... ma «della nostra vacanza»? La conosco da dove?"
    prompt: {text: "della nostra vacanza", tags: [articulated-preposition]}
  - learner: "Della nostra vacanza, sì."
    errors: [articulated-preposition]
  - tutor: "Ah, dalla nostra vacanza! Certo, mi ricordo. Era con voi? Come sta?"
    recast: {text: "della nostra vacanza", fix: "dalla nostra vacanza", tags: [articulated-preposition]}
  # merlin-1365_0100098-2
  - learner: "E ancora tutto bene."
    errors: [spelling]
  - tutor: "Che bello! Ma qui «e» è il verbo? Guarda bene."
    prompt: {text: "E ancora", tags: [spelling]}
    goals: [with-who]
  - learner: "È ancora tutto bene, sì! Era con noi e sta bene."
  - tutor: "Esatto! Allora ti è piaciuto il weekend?"
  # merlin-1395_0001065-1
  - learner: "Meglio che niente!"
  - tutor: "Ah, così così? Io invece sono stata a casa tutto il weekend."
    goals: [opinion]


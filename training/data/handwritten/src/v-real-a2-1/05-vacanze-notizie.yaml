# Set v-real-a2-1, file 5: A2, holidays and news after a long time (real learner sentences, MERLIN pool).
- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
  # merlin-1395_0000361-1
  - learner: "Quest'estate siamo stati in vacanza a Egitto."
    errors: [preposition]
  - tutor: "In vacanza... «a Egitto»? Con i nomi dei paesi, quale preposizione usiamo?"
    prompt: {text: "a Egitto", tags: [preposition]}
  # merlin-1395_0000361-1
  - learner: "Quest'estate siamo stati in vacanza a Egitto."
    errors: [preposition]
  - tutor: "In Egitto, che bello! Faceva molto caldo?"
    recast: {text: "a Egitto", fix: "In Egitto", tags: [preposition]}
    goals: [where]
  # merlin-1395_0000548-4
  - learner: "Io ho passato la più parte del tempo in spiaggia e ho letto tanti libri."
    errors: [word-choice]
  - tutor: "La maggior parte del tempo in spiaggia? Che fortuna! E tua moglie?"
    recast: {text: "la più parte del tempo", fix: "La maggior parte del tempo", tags: [word-choice]}
    new: [{lemma: maggior, gloss: greater}]
  - learner: "Faceva troppo caldo per lei. Mia moglie è andato al museo ogni giorno."
    errors: [participle-agreement]
  - tutor: "Tua moglie è... «andato»? Pensa a chi è andato al museo."
    prompt: {text: "è andato", tags: [participle-agreement]}
    goals: [weather, activities]
  - learner: "Ah, mia moglie è andata al museo!"
  - tutor: "Perfetto! E cosa ti è piaciuto di più?"
  # merlin-1365_0100228-5
  - learner: "La regione è molto interessante."
  - tutor: "Lo credo, ha una storia lunghissima!"
    goals: [best]

- scenario: vacanze-passate
  level: A2
  persona: es-f-teacher

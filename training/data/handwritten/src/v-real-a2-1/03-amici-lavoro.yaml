    prompt: {text: "a Fiat", tags: [articulated-preposition]}
  - learner: "Alla Fiat! Hai lavorato alla Fiat?"
  - tutor: "Esatto, alla Fiat, per sei anni. Adesso basta!"
  # merlin-1385_0001149-3
  - learner: "Perché vuoi cambiarlo?"
  - tutor: "Voglio un lavoro più interessante, magari con il computer."
  # merlin-1385_0001152-5
  - learner: "E voglio sapere quando vorresti cominciare a lavorare."
  - tutor: "Il prima possibile! Mi aiuti a cercare?"
  # merlin-1385_0000042-1
  - learner: "Vorrei aiutarti, ma ho bisogno di qualche informazione in più."
  - tutor: "Certo! Domani ti racconto tutto."

- scenario: casa-mia

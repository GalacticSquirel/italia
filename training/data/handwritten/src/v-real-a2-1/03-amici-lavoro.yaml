  - tutor: "Io? No, parlavo di tuo fratello! Ma «una altra»: senti come suona?"
    prompt: {text: "una altra", tags: [article-form]}
  - learner: "Un'altra città! Sì, lui vuole un lavoro in un'altra città."
  - tutor: "Perfetto! Allora gli do il numero di mio cugino."


    prompt: {text: "una ditta piccolo", tags: [adjective-agreement]}
  - learner: "Ah, una ditta piccola o grande?"
  - tutor: "Brava! È piccola: dieci persone."
  # merlin-1385_0001129-3
  - learner: "Solo a Roma o anche a Napoli"

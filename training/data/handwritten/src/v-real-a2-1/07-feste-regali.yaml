- scenario: abbigliamento
  level: A2
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:
  - tutor: "Buongiorno! Posso aiutarla?"
  - learner: "Sì, cerco un vestito per un matrimonio, taglia quaranta, di un colore chiaro."
  - tutor: "Ecco questo, in rosa chiaro."
    goals: [ask-item]
  # merlin-1365_0100170-8
  - learner: "È un vestito bianco o rosso?"
  - tutor: "È bianco, ma con la luce sembra rosa. Vuole provarlo?"
    goals: [size-colour]
  - learner: "Sì, posso provarla? Dov'è il camerino?"
    errors: [object-pronoun]
  - tutor: "Provarla? Pensi alla parola «vestito»: maschile o femminile?"
    prompt: {text: "provarla", tags: [object-pronoun]}
  - learner: "Maschile! Posso provarlo?"
  - tutor: "Certo, il camerino è lì a destra."
    goals: [try]
  - learner: "Mi sta bene! Lo prendo. Posso pagare con la carta?"
  - tutor: "Certo, sono sessanta euro. Buon matrimonio!"
    goals: [decide]


- scenario: cucina-ricetta
  level: A2
  persona: en-m-traveller
  history: [articulated-preposition]
  turns:
  - tutor: "Che profumo! Cosa cuciniamo stasera?"
  # merlin-1395_0000593-5
  - learner: "Mangio molto bene, ma preferisco la pizza al quatro formaggi e il tiramisu."
    errors: [articulated-preposition, spelling]
  - tutor: "Anch'io! Ma «al quatro formaggi»? Sono tanti formaggi: «al» va bene?"
    prompt: {text: "al quatro formaggi", tags: [articulated-preposition]}
  - learner: "Al quatro formaggi, sì."
    errors: [articulated-preposition, spelling]
  - tutor: "Allora facciamo la pizza ai quattro formaggi! Cosa ci serve?"
    recast: {text: "al quatro formaggi", fix: "ai quattro formaggi", tags: [articulated-preposition]}
  - learner: "Farina, acqua, sale e olio. Prima mettiamo insieme la farina e l'acqua, poi aggiungiamo olio e sale."
  - tutor: "Benissimo. E quanto tempo deve cuocere?"
    goals: [ingredients, steps]
  - learner: "Quindici minuti. Poi la serviamo calda, con un po' di olio sopra."
  - tutor: "Che cena! Buon appetito a noi!"
    goals: [time, serve]

# Set v-real-a2-1, file 7: A2, parties, presents and a wedding (real learner sentences, MERLIN pool).
- scenario: compleanno
  level: A2
  persona: en-m-heritage
  history: [piacere]
  turns:
  - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
  # merlin-1385_0001162-2
  - learner: "Proporiamo un altro giorno per il vostro incontro per esempio sabato sera?"
    errors: [verb-form]
  - tutor: "Sabato sera, buona idea! Ma «proporiamo»? Attenzione al verbo con «noi»."
    prompt: {text: "Proporiamo", tags: [verb-form]}
  - learner: "Proponiamo sabato sera, a casa mia, con tutti i suoi amici!"
  - tutor: "Perfetto, sabato sera da te! Io porto la torta."

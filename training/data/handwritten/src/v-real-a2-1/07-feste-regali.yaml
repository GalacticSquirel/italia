  # merlin-1365_0100280-12
  - learner: "Sara piace il libri?"
    errors: [piacere, article-form]
  - tutor: "Per il regalo? Ma «Sara piace»... a chi piace? Manca qualcosa davanti."
    prompt: {text: "Sara piace", tags: [piacere]}
  # merlin-1365_0100280-12
  - learner: "Sara piace il libri?"
    errors: [piacere, article-form]
  - tutor: "A Sara piacciono tanto i libri, sì! Le regaliamo un romanzo?"
    recast: {text: "Sara piace", fix: "A Sara piacciono", tags: [piacere]}

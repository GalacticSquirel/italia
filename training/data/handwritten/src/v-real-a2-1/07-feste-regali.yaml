    new: [{lemma: romanzo, gloss: novel}]
  # merlin-1385_0001165-5
  - learner: "Fammi sapere se hai tempo e voglia."
  - tutor: "Per andare a comprarlo? Certo, domani pomeriggio!"

- scenario: compleanno

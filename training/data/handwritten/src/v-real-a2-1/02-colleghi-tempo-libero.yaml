    goals: [frequency, ask]
  # merlin-1385_0001189-3
  - learner: "Hai voglia di andare a cenare in un ristaurante tailandese?"
    errors: [spelling]
  - tutor: "Sì, ma scusa: un... «ristaurante»? Guarda bene la parola."
    prompt: {text: "ristaurante", tags: [spelling]}
  # merlin-1385_0001162-3
  - learner: "Andiamo a cena in un ristorante tailandese."
  - tutor: "Esatto, ristorante! Perfetto, venerdì sera andiamo al tailandese!"

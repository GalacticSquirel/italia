# Set v-real-a2-1, file 2: A2, chats with colleagues about free time and the weekend (MERLIN pool).
- scenario: tempo-libero
  level: A2
  persona: en-f-student
  history: [verb-form]
  turns:
  - tutor: "Allora, cosa fai di bello nel fine settimana?"
  # merlin-1395_0001150-0
  - learner: "Mi piace studiare la lingua italiana."
  - tutor: "Si sente, parli già bene! Perché proprio l'italiano?"
    goals: [hobby]
  # merlin-1395_0001033-0
  - learner: "Tu sai che imparare la vostra lingua mi fare molto piacere."
    errors: [verb-form]
  - tutor: "«Mi fare»? Attenzione al verbo: qui serve il presente."
    prompt: {text: "mi fare", tags: [verb-form]}
  - learner: "Sì... imparare l'italiano mi fare piacere ogni giorno."
    errors: [verb-form]
  - tutor: "Ah, ti fa piacere ogni giorno, che bello! Io invece il sabato vado a ballare."

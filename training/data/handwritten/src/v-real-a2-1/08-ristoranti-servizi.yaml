    errors: [word-order, tense-aspect]
  - tutor: "Il «tipico ristorante»? In italiano, dove va «tipico»?"
    prompt: {text: "Tipico Ristorante", tags: [word-order]}
  - learner: "Al tipico ristorante, sì."
    errors: [word-order]
  - tutor: "In un ristorante tipico, che bello! Avete mangiato bene?"
    recast: {text: "tipico ristorante", fix: "ristorante tipico", tags: [word-order]}
    goals: [what]
  # merlin-1395_0001133-1
  - learner: "È molto bello."
  - tutor: "Che bello! Io invece sono rimasta a casa."
    goals: [opinion]


# Set v-nearmiss, file 6: C1. Left alone: «non che mi sia piaciuto», «il più coinvolgente che
# abbia letto», «a meno che non cerchino» (expletive non), «magari fosse», passato remoto in a
# family story («partì», «non tornò»), «ci si lamenti», «gli ho chiesto» (= a loro), «pensava
# fosse», «se n'era andato», «me la sono presa», «dicono che ha già», «il fatto è che», «pare che
# siano», «qualora partisse», «se i dati sono corretti, risparmiamo», «nessuno è mai venuto», «va
# garantito», «nel caso in cui non si muova». Corrected twins: «sebbene la trama è», «se i governi
# avrebbero agito», «mentre ho aspettato», «le ho telefonato» (a Paolo), «non posso più di»,
# «ha detto che limiterebbe», «guarda, ti dico» (to a director), «vengono raccolto».
- scenario: club-lettura
  level: C1
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Finito ieri notte, alle due! Non che mi sia piaciuto tutto, ma è il romanzo più coinvolgente che abbia letto quest'anno."
  - tutor: "Alle due di notte: allora ti ha preso eccome! E il protagonista, come l'hai trovato?"
    goals: [impression]
  - learner: "Ambiguo. All'inizio lo detestavo, poi ho capito che le sue bugie erano l'unico modo che aveva per proteggere la figlia."
  - tutor: "Esatto, è lì che il libro cambia marcia e lo vedi con altri occhi. E lo stile?"
    goals: [character]
  - learner: "Asciutto, quasi giornalistico. Sebbene la trama è complicata, le frasi sono brevissime."
    errors: [subjunctive-use]
  - tutor: "«Sebbene la trama è»? Con «sebbene», quale modo ti aspetteresti?"
    prompt: {text: "la trama è complicata", tags: [subjunctive-use]}
  - learner: "Sì, sebbene la trama è complicata, si legge in un attimo."
    errors: [subjunctive-use]
  - tutor: "Verissimo: sebbene la trama sia complicata, non ti perdi mai, ed è questo il talento dell'autrice."
    recast: {text: "la trama è complicata", fix: "la trama sia complicata", tags: [subjunctive-use]}
    goals: [style]
  - learner: "Lo consiglierei a tutti, a meno che non cerchino una lettura rilassante prima di dormire!"
  - tutor: "Giusto, altrimenti fanno le due di notte come te! Lo propongo al gruppo per l'estate."
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco la paura, ma la vedo diversamente: è uno strumento, e come ogni strumento dipende da chi lo usa. Magari fosse sempre tutto così semplice, certo."
  - tutor: "Uno strumento? Mio cugino fa il traduttore e in un anno ha perso metà dei clienti."
    goals: [position]
  - learner: "Lo sento per lui. Però i dati dicono anche altro: in molte aziende questi sistemi non hanno sostituito le persone, le hanno liberate dai compiti più noiosi."
    errors: [word-choice]
  - tutor: "Sì, mi dispiace per lui, poveretto. Ma i dati, i dati... dipende sempre da chi li pubblica."
    recast: {text: "Lo sento per lui", fix: "mi dispiace per lui", tags: [word-choice]}
    goals: [evidence]
  - learner: "Su questo hai ragione. E ammetto che se i governi avrebbero agito prima, oggi non saremmo così impreparati."
    errors: [hypothetical]
  - tutor: "«Se i governi avrebbero agito»? Ripensa alla forma che va dopo «se», quando parli del passato."
    prompt: {text: "se i governi avrebbero agito", tags: [hypothetical]}
  - learner: "Sì: se i governi avrebbero agito prima, oggi saremmo molto più tranquilli."
    errors: [hypothetical]
  - tutor: "Eh, magari: se i governi avessero agito prima... Almeno questo me lo concedi!"
    recast: {text: "se i governi avrebbero agito", fix: "se i governi avessero agito", tags: [hypothetical]}
    goals: [concede]
  - learner: "Te lo concedo volentieri. In conclusione: né paura né entusiasmo cieco, ma regole chiare e tanta formazione."
  - tutor: "Va bene, su questo firmo anch'io. Ma il mio lavoro guai a chi lo tocca!"
    goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "È una storia di famiglia, in realtà. Mia nonna partì da Genova nel 1952 per l'Australia, e non tornò mai più. Io ho fatto il viaggio al contrario."
  - tutor: "Un cerchio che si chiude dopo settant'anni, bellissimo! E il primo impatto com'è stato?"
    goals: [story]
  - learner: "Uno shock. Non avevo mai visto tanta gente parlare tutta insieme. Mentre ho aspettato il mio primo caffè al bancone, tre persone mi sono passate davanti."
    errors: [tense-aspect]
  - tutor: "«Mentre ho aspettato»? Era un'azione in corso o un'azione conclusa?"
    prompt: {text: "Mentre ho aspettato", tags: [tense-aspect]}
  - learner: "In corso, certo: mentre aspettavo il caffè, tre persone mi sono passate davanti senza nemmeno guardarmi!"
  - tutor: "Il bancone del bar, la nostra prima scuola di sopravvivenza! C'è qualcosa che ancora oggi non sopporti?"
    goals: [culture-shock]
  - learner: "La burocrazia, senza dubbio. E il fatto che ci si lamenti di tutto, ma poi non si cambi niente."
  - tutor: "Colpita e affondata, temo. E che consiglio daresti a chi sta pensando di trasferirsi qui?"
    goals: [critique]
  - learner: "Di imparare la lingua prima di partire, e di non prenderla personalmente se all'inizio nessuno rispetta la fila."
    errors: [word-choice]
  - tutor: "Imparare a non prendersela: ecco il vero segreto, altro che consiglio d'oro. Grazie mille di essere stata con noi!"
    recast: {text: "non prenderla personalmente", fix: "non prendersela", tags: [word-choice]}
    goals: [advice]

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-professional
  history: [object-pronoun]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ha fatto bene a venire. Mi racconti con calma: che cosa l'ha ferita di più?"
  - tutor: "Che Paolo abbia presentato la mia idea come se fosse sua, davanti al direttore."
    goals: [listen]
  - learner: "Capisco. Mi faccia capire bene: l'idea dell'app per i clienti l'aveva proposta lei a Paolo prima della riunione?"
  - tutor: "Sì, gliel'avevo mandata per email la settimana scorsa. Ho ancora il messaggio."
    goals: [clarify]
  - learner: "Stamattina ho già sentito Paolo e Marta, e gli ho chiesto di spiegarmi come sono andate le cose. Paolo mi ha detto che pensava fosse un'idea di tutto il gruppo."
  - tutor: "Del gruppo? Ma se l'ho scritta io, parola per parola!"
    goals: [perspective]
  - learner: "Le credo. Per questo propongo di chiarire tutto domani, con Paolo presente. È già d'accordo: le ho telefonato un'ora fa."
    errors: [object-pronoun]
  - tutor: "«Le ho telefonato»? Stiamo parlando di Paolo, giusto?"
    prompt: {text: "le ho telefonato", tags: [object-pronoun]}
  - learner: "Sì, scusi: gli ho telefonato un'ora fa, e domani alle nove ci vediamo tutti e tre."
  - tutor: "Va bene. Se riconosce davanti a tutti che l'idea era mia, per me la questione è chiusa."
    goals: [solution]

- scenario: modi-di-dire
  level: C1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, una giornata da dimenticare. Stamattina ci ho messo un'ora e mezza per arrivare in ufficio, perché il treno si è fermato in aperta campagna."
  - tutor: "Classico: piove sempre sul bagnato. E poi?"
  - learner: "Aspetta, il bello deve ancora venire. Arrivo in ufficio e il capo mi dice che la presentazione era stata anticipata alle nove. Io non l'avevo nemmeno finita!"
  - tutor: "Ma dai! Ti sarà caduto il mondo addosso."
    goals: [tell]
  - learner: "Esatto. E il collega che doveva aiutarmi se n'era andato a casa con la febbre, guarda caso. Me la sono presa con lui, ma poi mi sono pentito."
  - tutor: "Eh, guarda caso... la febbre del venerdì è la più contagiosa."
    goals: [react]
  - learner: "Alla fine la colpa è stata mia: dovevo prepararla prima. Ma adesso non posso più di questo lavoro."
    errors: [ci-ne]
  - tutor: "«Non posso più di questo lavoro»? A questa espressione manca un piccolo pezzo, non ti pare?"
    prompt: {text: "non posso più di questo lavoro", tags: [ci-ne]}
  - learner: "Hai ragione: non ne posso più di questo lavoro!"
  - tutor: "Ecco, adesso sì che sembri un italiano esasperato. Comunque, morale della favola?"
    goals: [blame]
  - learner: "Che chi dorme non piglia pesci: la prossima volta preparo tutto tre giorni in avanzo!"
    errors: [word-choice]
  - tutor: "Tre giorni in anticipo, parole sante! E intanto ti offro un aperitivo, che te lo sei meritato."
    recast: {text: "in avanzo", fix: "in anticipo", tags: [word-choice]}
    goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "L'ho letta in treno. In breve: il Comune vuole limitare gli appartamenti per turisti in centro, perché i residenti se ne stanno andando."
  - tutor: "Riassunto perfetto. Il sindaco, però, è stato piuttosto vago, no?"
    goals: [summarise]
  - learner: "Abbastanza. Il sindaco ha detto che limiterebbe le licenze dal prossimo anno, ma senza dire quante."
    errors: [conditional-form]
  - tutor: "«Ha detto che limiterebbe»? È un futuro visto dal passato: che forma serve?"
    prompt: {text: "limiterebbe", tags: [conditional-form]}
  - learner: "Sì, ha detto che limiterebbe le licenze. Secondo me è giusto: il fatto è che in centro un affitto normale non si trova più."
    errors: [conditional-form]
  - tutor: "Già, ha detto che avrebbe limitato le licenze, poi vedremo. Su questo sono d'accordo, ma tu dove l'hai letto? Ogni giornale dà numeri diversi."
    recast: {text: "limiterebbe", fix: "avrebbe limitato", tags: [conditional-form]}
    goals: [opinion]
  - learner: "Su due quotidiani diversi, e tutti e due dicono che il Comune ha già i dati delle prenotazioni. Pare che i turisti siano aumentati del trenta per cento in tre anni."
  - tutor: "Se le fonti sono due, mi fido di più. E secondo te che cosa succederà?"
    goals: [sources]
  - learner: "Se la regola passa, gli affitti dovrebbero scendere un po'; ma temo che i proprietari trovino il modo di aggirarla."
  - tutor: "Lo temo anch'io: in Italia, fatta la legge, trovato l'inganno."
    goals: [consequences]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-retired
  history: [register]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo. Si tratta di digitalizzare l'archivio clienti: oggi un preventivo richiede tre giorni, con il nuovo sistema basterebbero due ore."
  - tutor: "Interessante. E in concreto, che vantaggi avremmo?"
    goals: [pitch]
  - learner: "Meno errori, risposte più rapide ai clienti e, se i nostri calcoli sono corretti, un risparmio di circa quarantamila euro l'anno."
  - tutor: "Quarantamila euro mi sembrano ottimistici. E i costi iniziali?"
    goals: [benefits]
  - learner: "Guarda, ti dico la verità: i costi iniziali sono alti, sui sessantamila."
    errors: [register]
  - tutor: "«Guarda, ti dico»? Non ricordavo che fossimo passati al tu."
    prompt: {text: "Guarda, ti dico la verità", tags: [register]}
  - learner: "Mi scusi. Le dico la verità: i costi iniziali sono alti, ma qualora il progetto partisse a gennaio, rientreremmo dell'investimento in un anno e mezzo."
  - tutor: "Così va meglio, e il conto torna. Mi ha convinto a metà: che cosa le serve?"
    goals: [objection]
  - learner: "Mi serve una luce verde per una fase pilota di tre mesi, con un solo reparto. Se funziona, estendiamo il sistema a tutta l'azienda."
    errors: [word-choice]
  - tutor: "D'accordo, un via libera per tre mesi si può fare: mi mandi un piano dettagliato entro venerdì e ne parliamo con il consiglio."
    recast: {text: "una luce verde", fix: "un via libera", tags: [word-choice]}
    goals: [next-steps]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Sono qui per la buca in via Roma: è stata segnalata tre volte da gennaio, e nessuno è mai venuto a ripararla."
  - tutor: "Capisco. Ha con sé i numeri delle segnalazioni?"
  - learner: "Eccoli. Le ultime due mi sono state confermate per email. E non è l'unico problema: in piazza i rifiuti non vengono raccolto da dieci giorni."
    errors: [passive]
  - tutor: "«Non vengono raccolto»? Guardi l'accordo con «i rifiuti»."
    prompt: {text: "vengono raccolto", tags: [passive]}
    goals: [describe]
  - learner: "Sì, non vengono raccolto da dieci giorni, e c'è un odore terribile."
    errors: [passive]
  - tutor: "Se i rifiuti non vengono raccolti da dieci giorni, il problema è serio, ha ragione. Purtroppo a marzo è cambiata la ditta."
    recast: {text: "vengono raccolto", fix: "vengono raccolti", tags: [passive]}
  - learner: "Questo, mi scusi, non mi riguarda. Si pagano le tasse per avere un servizio, e il servizio va garantito."
  - tutor: "Ha perfettamente ragione, non posso darle torto."
    goals: [insist]
  - learner: "Vorrei sapere a chi posso rivolgermi, nel caso in cui non si muova niente entro fine mese."
  - tutor: "Può presentare un reclamo formale al difensore civico, che risponde entro trenta giorni."
    goals: [rights]
  - learner: "La ringrazio. Allora aspetto notizie entro la settimana."
  - tutor: "Segnalo tutto oggi stesso all'ufficio tecnico, con priorità alta, e le scrivo io personalmente entro venerdì."
    goals: [commitment]

# Set v-nearmiss, file 8: C2. Left alone: «chiunque abbia letto», «finché non avremo», «a meno
# che il geometra non lo ritenga», «se ne intende», «ciò di cui non mi capacito», «da essa»,
# «l'unico che abbia», «pur essendo straniera», «vanno presi con le pinze», «mi chiese se avessi
# mangiato», «debbo dire», «viene solo messa lì», «si è ritenuti responsabili», «quand'anche
# prevedesse», «laddove sia», «se di problema si tratta», «a meno che tu non preferisca»,
# «magari non l'avessi capita», «finché non è esploso». Corrected twins: «fare in conto»,
# «le lo regalo», «cinquant'anni, che è assurdo», «è venuto pubblicato», «eventualmente» (=
# alla fine), «si è responsabile», «sale di casa» (= esce), «se me l'avresti spiegato».
- scenario: assemblea-condominio
  level: C2
  persona: es-m-worker
  history: [word-choice]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Chiunque abbia letto i tre preventivi si sarà accorto che differiscono del quaranta per cento. Prima di votare, vorrei che ci venisse spiegato il perché."
  - tutor: "Il geometra precisa che il più caro comprende anche il ponteggio e lo smaltimento delle macerie, gli altri due no."
    new: [{lemma: "smaltimento", gloss: "disposal"}, {lemma: "maceria", gloss: "rubble"}]
  - learner: "Appunto. Se ce l'avessero detto subito, ci saremmo risparmiati due riunioni. Propongo di rinviare il voto finché non avremo preventivi confrontabili."
  - tutor: "La signora del secondo piano insorge: dice che il tetto perde da mesi e che lei non può più aspettare."
    goals: [position]
  - learner: "La capisco, e infatti non dico di restare con le mani in mano. Bisogna però fare in conto anche chi ha appena pagato il rifacimento delle scale."
    errors: [word-choice]
  - tutor: "Certo, bisogna tenere conto anche di chi ha già fatto sacrifici: nessuno vuole pagare due volte. Vedo che la signora si è calmata un poco."
    recast: {text: "fare in conto", fix: "tenere conto", tags: [word-choice]}
    goals: [defuse]
  - learner: "Allora propongo un'alternativa: un intervento urgente sul tetto subito, a meno che il geometra non lo ritenga inutile, e il resto in primavera."
  - tutor: "Il geometra annuisce: con una riparazione provvisoria il tetto regge benissimo fino ad aprile."
    goals: [alternative]
  - learner: "Benissimo. Allora mettiamolo ai voti: così chi ha fretta ha il tetto riparato, e chi ha il portafoglio vuoto ha qualche mese di respiro."
  - tutor: "Mi sembra un compromesso ragionevole per tutti. Chi è favorevole alzi la mano."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Spero di non deludere le aspettative, allora! Grazie dell'invito. Che profumo: è lei che se ne intende di cucina, o sua moglie?"
  - tutor: "Mia moglie, io al massimo stappo il vino. E lei di che cosa si occupa, se non sono indiscreto?"
  - learner: "Insegno spagnolo in un liceo. Sono di Siviglia, ma vivo a Bologna da sei anni: è qui che ho conosciuto sua figlia, a un corso di tango."
  - tutor: "Il tango, addirittura! Non sapevo nemmeno che mia figlia ballasse."
    goals: [background]
  - learner: "E come balla! Comunque questo vino è eccezionale: con un rosso così, la cena è già un successo."
  - tutor: "Un Barolo del 2015, lo tenevo da parte per un'occasione speciale. O per un esame, chissà."
    goals: [compliment]
  - learner: "Allora spero di superarlo! Anch'io ho portato un vino andaluso: le lo regalo, così ricambio."
    errors: [combined-pronouns]
  - tutor: "«Le lo regalo»? Due pronomi vicini, riferiti a me: come si fondono?"
    prompt: {text: "le lo regalo", tags: [combined-pronouns]}
    goals: [irony]
  - learner: "Glielo regalo, così ricambio. Ma la avverto: è dolcissimo."
  - tutor: "Dolce come la sua diplomazia. Senta, facciamo così: diamoci del tu, che a forza di sentirmi dare del Lei mi sento vecchio."
  - learner: "Con piacere, allora: grazie, Giorgio. E se permetti, il tuo Barolo me lo verso da sola."
  - tutor: "Brava, così si fa. Benvenuta in famiglia!"
    goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: en-m-heritage
  history: [relative-pronoun]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Io no, anzi. Ciò di cui non mi capacito è come un ragazzino di dodici anni abbia una coerenza che molti adulti si sognano."
  - tutor: "Coerenza o testardaggine? Il confine, ammettiamolo, è sottile."
    goals: [impression]
  - learner: "Testardaggine all'inizio, coerenza poi. Il tema vero, secondo me, è la distanza: Cosimo partecipa alla vita del mondo restando sempre a un passo da essa."
  - tutor: "Bellissima formula: partecipare restando a un passo. E Calvino, come scrittore?"
    goals: [theme]
  - learner: "Una leggerezza che non è mai superficialità. Cosimo resta sugli alberi per oltre cinquant'anni, che è assurdo, eppure ci crediamo fino all'ultima pagina."
    errors: [relative-pronoun]
  - tutor: "«Per oltre cinquant'anni, che è assurdo»: a che cosa si riferisce quel «che»? Manca un pezzo."
    prompt: {text: "che è assurdo", tags: [relative-pronoun]}
  - learner: "Sì, che è assurdo, eppure ci crediamo fino all'ultima pagina."
    errors: [relative-pronoun]
  - tutor: "Esatto, il che è assurdo, ed è lì il miracolo di Calvino. Ma mi pare di capire che su Cosimo non sei d'accordo con me."
    recast: {text: "che è assurdo", fix: "il che è assurdo", tags: [relative-pronoun]}
    goals: [style]
  - learner: "No: insopportabile, semmai, è il barone padre, con le sue fisime nobiliari. Cosimo è l'unico che abbia il coraggio di dirgli di no."
  - tutor: "Il padre, eh? Te lo concedo. E per la prossima volta che cosa proponi?"
    goals: [disagree]
  - learner: "«Le città invisibili»: niente trama, così almeno non argomentiamo sui personaggi."
    errors: [false-friend]
  - tutor: "Furbo! Così non litighiamo sui personaggi, ma sulle città. Approvato, o quasi."
    recast: {text: "argomentiamo", fix: "litighiamo", tags: [false-friend]}
    goals: [recommend]

- scenario: intervista-radio
  level: C2
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, più incoscienza che coraggio, direi! Il libro raccoglie dieci anni di osservazioni: pur essendo straniera, o forse proprio per questo, ho notato cose che a voi sfuggono."
  - tutor: "Per esempio? Mi dica che non parla di pizza e mandolino, la supplico."
    goals: [present-book]
  - learner: "Al contrario: gli stereotipi vanno presi con le pinze, e nel libro li smonto uno per uno. Quello del mammone, per esempio, è vero solo a metà: molti giovani restano a casa per necessità, non per comodità."
  - tutor: "Un bel colpo per i nostri ascoltatori più giovani. C'è un aneddoto che le è rimasto nel cuore?"
    goals: [stereotype]
  - learner: "Il primo anno, a Lecce, una signora mi fermò per strada e mi chiese, senza conoscermi, se avessi mangiato. Quando l'ho raccontato a mia madre, non ci credeva."
  - tutor: "Tipico del Sud: prima il pranzo, poi le presentazioni! E con la lingua, com'è andata?"
    goals: [anecdote]
  - learner: "All'inizio è stata una lotta. Il manoscritto, poi, è venuto pubblicato solo dopo tre revisioni linguistiche."
    errors: [passive]
  - tutor: "«È venuto pubblicato»? Nei tempi composti, «venire» può fare da ausiliare del passivo?"
    prompt: {text: "è venuto pubblicato", tags: [passive]}
  - learner: "Sì, è venuto pubblicato solo l'anno scorso, dopo tre revisioni."
    errors: [passive]
  - tutor: "Ah, ecco: è stato pubblicato solo l'anno scorso, e infatti oggi il suo italiano è impeccabile."
    recast: {text: "è venuto pubblicato", fix: "è stato pubblicato", tags: [passive]}
    goals: [language]
  - learner: "Lei è troppo gentile. Grazie a voi, è stato un piacere."
  - tutor: "Il piacere è stato nostro. Cari ascoltatori, il libro è in libreria da oggi: buona lettura!"
    goals: [farewell]

- scenario: poesia-montale
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Debbo dire che mi è rimasta addosso soprattutto la sensazione di soffocamento: il rivo strozzato, la foglia riarsa, il cavallo stramazzato."
  - tutor: "Proprio così, è una poesia che toglie il fiato. Quale immagine la colpisce di più?"
    goals: [first-reading]
  - learner: "Il cavallo stramazzato. È un'immagine brutale, quasi cinematografica, e il poeta non la commenta: viene solo messa lì, accanto alle altre."
  - tutor: "Esatto, l'elenco senza commento è la forza del testo. E il suono?"
    goals: [image]
  - learner: "È aspro, pieno di consonanti doppie e di erre: «strozzato», «incartocciarsi», «stramazzato». Si sente quasi fisicamente l'attrito."
  - tutor: "Bravissima, quelle doppie sono come un rumore di fondo. E nella seconda strofa?"
    goals: [sound]
  - learner: "Eventualmente il poeta trova una via d'uscita: la divina Indifferenza, la statua, la nuvola, il falco alto levato."
    errors: [false-friend]
  - tutor: "Alla fine, sì, trova una via d'uscita. Ma è davvero una salvezza? Un'indifferenza «divina» assomiglia molto a una rinuncia."
    recast: {text: "Eventualmente", fix: "Alla fine", tags: [false-friend]}
  - learner: "Forse è proprio questo il senso: non c'è salvezza, c'è solo la possibilità di guardare il dolore dall'alto, come fa il falco."
  - tutor: "Una lettura lucida e amara, molto montaliana. Direi che per stasera possiamo fermarci qui."
    goals: [meaning]

- scenario: seminario-etica
  level: C2
  persona: en-f-professional
  history: [adjective-agreement]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Dubiti pure, professore, è il suo mestiere. La mia tesi è semplice: si è ritenuti responsabili solo se si è in grado di comprendere le conseguenze dei propri atti, e una macchina non comprende, calcola."
  - tutor: "Comprendere, calcolare: non le pare una distinzione un po' comoda?"
    goals: [thesis]
  - learner: "Non direi. Quand'anche un sistema prevedesse perfettamente le conseguenze, non le valuterebbe come buone o cattive per sé: gli mancherebbe la posta in gioco."
  - tutor: "Eppure un'azienda non comprende nulla, e la condanniamo comunque a risarcire i danni."
    goals: [distinguish]
  - learner: "Ottima obiezione. Ma l'azienda risponde attraverso le persone che la guidano: quando si è responsabile di un'organizzazione, si risponde anche delle sue scelte."
    errors: [adjective-agreement]
  - tutor: "«Quando si è responsabile»? Con il «si» impersonale, come si accorda l'aggettivo?"
    prompt: {text: "si è responsabile", tags: [adjective-agreement]}
  - learner: "Sì, quando si è responsabile di un'organizzazione, si risponde delle sue scelte."
    errors: [adjective-agreement]
  - tutor: "D'accordo: quando si è responsabili di un'organizzazione, se ne risponde. Dunque, secondo lei, la responsabilità ricadrebbe su chi progetta la macchina?"
    recast: {text: "si è responsabile", fix: "si è responsabili", tags: [adjective-agreement]}
    goals: [objection]
  - learner: "Su chi la progetta e su chi la usa, laddove l'uso sia improprio. Ammetto però che, se i sistemi diventassero davvero autonomi, la mia tesi andrebbe ripensata."
  - tutor: "Una concessione notevole, gliene do atto. E la sua conclusione?"
    goals: [concede]
  - learner: "Oggi la responsabilità resta umana, e attribuirla alle macchine sarebbe il modo più elegante per non attribuirla a nessuno."
  - tutor: "Chiusura brillante, dottoressa. Mi ha quasi convinto, e non è poco."
    goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Me l'aspettavo. Sapevo che avrei dovuto scegliere tra fedeltà e leggibilità, e ho scelto la seconda. Il problema, se di problema si tratta, è che l'originale è molto più spigoloso."
  - tutor: "Problema eccome. L'autore spezza le frasi apposta, e tu gliele ricuci tutte. Che alternative vedi?"
    goals: [problem]
  - learner: "Potrei ripristinare la punteggiatura originale, anche a costo di sembrare sgrammaticato, oppure lasciare la mia versione e compensare altrove, con un lessico più ruvido."
  - tutor: "La prima, senza dubbio. E poi c'è la scena del mattino, quella del padre."
    goals: [options]
  - learner: "Sì, quella in cui il padre sale di casa senza salutare nessuno."
    errors: [false-friend]
  - tutor: "Appunto, esce di casa senza salutare nessuno. E tu, invece, gli fai dire «arrivederci a tutti»: sembra un maggiordomo."
    recast: {text: "sale di casa", fix: "esce di casa", tags: [false-friend]}
  - learner: "Colpa di un falso amico: in spagnolo «salir» vuol dire proprio uscire, e mi è scappato. Quanto al saluto, lo tolgo: nell'originale il padre tace."
  - tutor: "Esatto, il silenzio è il punto. Allora, che cosa decidiamo?"
    goals: [false-friend]
  - learner: "Rivedo tutto il capitolo con la punteggiatura dell'autore e te lo rimando entro lunedì, a meno che tu non preferisca vederlo a metà."
  - tutor: "Lunedì va bene. E stavolta lascia parlare lui, non te."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Magari non l'avessi capita! L'ho capita benissimo, purtroppo: è che la storia della panna mi è sembrata un colpo basso."
  - tutor: "Un colpo basso? È satira, cara, non un trattato di cucina. E qual è il pezzo che ti è piaciuto di più?"
    goals: [missed]
  - learner: "Il monologo sul tram che non arriva mai: geniale. Non si rideva per la battuta in sé, ma per il crescendo, finché non è esploso tutto il teatro."
  - tutor: "Quello è un classico. E il gioco di parole sul «governo di transizione»?"
    goals: [favourite]
  - learner: "Quello mi è sfuggito, lo confesso. Se me l'avresti spiegato prima, avrei riso con gli altri."
    errors: [hypothetical]
  - tutor: "«Se me l'avresti spiegato»? Dopo quel «se», il condizionale proprio non ci sta."
    prompt: {text: "Se me l'avresti spiegato", tags: [hypothetical]}
  - learner: "Hai ragione: se me l'avessi spiegato prima, avrei riso anch'io!"
  - tutor: "Te lo spiego adesso: lui diceva «governo di transizione», ma pronunciava «di tradizione», perché sono sempre gli stessi da trent'anni. E secondo te, dove sta il limite della satira?"
    goals: [wordplay]
  - learner: "Per me la satira deve colpire chi ha il potere, mai chi è già a terra. Per il resto, si può ridere di tutto, purché lo si faccia con intelligenza."
  - tutor: "Su questo, una volta tanto, ti do ragione. Andiamo a bere qualcosa, va', che si è fatto tardi."
    goals: [limits]

# x-a2-1, file 01: correction-dense A2 dialogues (prompt -> self-repair), plus one clean one.
- scenario: weekend-scorso
  level: A2
  persona: en-m-heritage
  history: [reflexive]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Ciao Chiara! Benissimo. Sabato sono andato a Bologna con mio cugino."
    - tutor: "Bologna, che bella città! E cosa avete fatto?"
      goals: [where, with-who]
    - learner: "Abbiamo mangiato i tortellini e la sera siamo andati a un concerto. Ho divertito molto!"
      errors: [reflexive, auxiliary-choice]
    - tutor: "Che bella serata! Ma divertirsi vuole una piccola parola in più. Tu ti...?"
      prompt: {text: "Ho divertito", tags: [reflexive]}
    - learner: "Ah, giusto: mi sono divertito molto!"
    - tutor: "Ecco, perfetto! Che musica avete ascoltato?"
      goals: [what]
    - learner: "Musica rock, un gruppo di Bologna. E tu, cosa hai fatto?"
    - tutor: "Io ho visto un film a casa, niente di speciale. Sono contenta per te!"
      goals: [opinion]

- scenario: abbigliamento
  level: A2
  persona: es-f-erasmus
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Buongiorno. Cerco una maglietta per mia sorella."
    - tutor: "Certo! Che taglia porta sua sorella? E che colore preferisce?"
      goals: [ask-item]
    - learner: "Porta la taglia M. Vorrei una maglietta rosso."
      errors: [adjective-agreement]
    - tutor: "Una maglietta rosso? Guardi bene l'ultima lettera del colore."
      prompt: {text: "una maglietta rosso", tags: [adjective-agreement]}
    - learner: "Ah, sì: una maglietta rossa."
    - tutor: "Benissimo! Ecco, questa costa quindici euro."
      goals: [size-colour]
    - learner: "È carina. Posso provarla? Abbiamo la stessa taglia."
    - tutor: "Certo, il camerino è lì in fondo, a destra."
      goals: [try]
    - learner: "Mi sta bene. La prendo. C'è uno sconto?"
    - tutor: "Sì, oggi c'è uno sconto: dodici euro. Paga con la carta?"
    - learner: "Sì, con la carta. Grazie mille!"
    - tutor: "Grazie a lei! Ecco la maglietta. Buona giornata!"
      goals: [decide]

- scenario: famiglia
  level: A2
  persona: en-m-retired
  history: [possessive]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Grazie! Questa è la mia famiglia a Natale. Questa è la mia moglie, Susan."
      errors: [possessive]
    - tutor: "Che bella famiglia! Però: la mia moglie? Qui c'è una parola di troppo."
      prompt: {text: "la mia moglie", tags: [possessive]}
    - learner: "Ah, certo. Questa è mia moglie, Susan."
    - tutor: "Giusto! E questo ragazzo alto chi è?"
      goals: [who]
    - learner: "È mio figlio Daniel. È alto e magro, e fa il medico a Chicago."
    - tutor: "Che bravo! Quanti anni ha tuo figlio?"
      goals: [describe]
    - learner: "Ha trentaquattro anni. E questi sono i miei nipoti, hanno sei e quattro anni."
    - tutor: "Che belli! Siete proprio una bella famiglia."
      goals: [ages]
    - learner: "Grazie. E tu, Marco? Hai fratelli o sorelle?"
    - tutor: "Sì, ho una sorella più piccola. Abita a Torino e la vedo poco."
      goals: [ask]

- scenario: autobus
  level: A2
  persona: en-f-professional
  turns:
    - tutor: "Buongiorno! Dove deve andare?"
    - learner: "Buongiorno. Questo autobus va a il centro?"
      errors: [articulated-preposition]
    - tutor: "Va a il centro? Qui le due piccole parole diventano una sola."
      prompt: {text: "a il centro", tags: [articulated-preposition]}
    - learner: "Ah! Questo autobus va al centro?"
    - tutor: "Esatto! Sì, questa linea va proprio in centro."
      goals: [route]
    - learner: "Bene. Dove posso comprare il biglietto?"
    - tutor: "In tabaccheria, lì davanti. Poi deve timbrare il biglietto qui."
      goals: [ticket]
    - learner: "Va bene. E a quale fermata devo scendere per il Duomo?"
    - tutor: "Deve scendere alla quarta fermata, davanti alla banca."
      goals: [stop]
    - learner: "La quarta fermata. Grazie mille, Lei è molto gentile!"
    - tutor: "Di niente! Buona giornata e buon giro in centro."
      goals: [thank]

- scenario: ricordi-infanzia
  level: A2
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Abitavo in un paese vicino a Leeds, con i miei genitori e mio fratello."
    - tutor: "Un paese piccolo? E cosa facevi dopo la scuola?"
      goals: [place]
    - learner: "Sì, molto piccolo. Dopo la scuola ho giocato sempre in giardino con mio fratello."
      errors: [tense-aspect]
    - tutor: "Ho giocato sempre? Era una cosa di tutti i giorni. Allora tu...?"
      prompt: {text: "ho giocato sempre", tags: [tense-aspect]}
    - learner: "Giocavo sempre in giardino!"
    - tutor: "Brava, proprio così! E la scuola ti piaceva?"
      goals: [habits]
    - learner: "Sì, mi piaceva molto. La mia maestra era simpatica e leggevamo tante storie."
    - tutor: "Che fortuna! Hai un ricordo speciale di quegli anni?"
      goals: [school]
    - learner: "Sì! Un'estate siamo andati in Scozia dalla nonna e ho visto il mare per la prima volta."
    - tutor: "Che bel ricordo! Il primo mare non si dimentica mai."
      goals: [event]

- scenario: bar-colazione
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno! Un caffè macchiato, per favore."
    - tutor: "Subito! Vuole anche qualcosa da mangiare?"
      goals: [greet, order-drink]
    - learner: "Sì, voglio di provare un cornetto alla crema."
      errors: [modal-infinitive]
    - tutor: "Voglio di provare? Dopo volere c'è una parola in più, no?"
      prompt: {text: "voglio di provare", tags: [modal-infinitive]}
    - learner: "Sì, scusi. Voglio provare un cornetto alla crema."
    - tutor: "Perfetto! Ecco il caffè e il cornetto, ancora caldo."
      goals: [order-food]
    - learner: "Grazie, è buonissimo. Quanto pago?"
    - tutor: "Sono due euro e cinquanta. Ecco lo scontrino."
    - learner: "Ecco tre euro. Buona giornata!"
    - tutor: "Grazie, ecco il resto. Buona giornata anche a lei!"
      goals: [pay]

- scenario: giorno-tipico
  level: A2
  persona: en-m-traveller
  history: [reflexive]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Ciao Anna! Di solito sveglio alle sette e mezza."
      errors: [reflexive]
    - tutor: "Chi svegli alle sette e mezza? Un amico? Oppure tu...?"
      prompt: {text: "sveglio", tags: [reflexive]}
    - learner: "Ah no! Io mi sveglio alle sette e mezza."
    - tutor: "Ecco, adesso è chiaro! E poi cosa fai la mattina?"
      goals: [wake]
    - learner: "Faccio colazione con caffè e pane, poi lavoro in un ostello fino alle due."
    - tutor: "Che bel lavoro! E la sera, quando torni a casa?"
      goals: [work]
    - learner: "La sera cucino qualcosa e guardo una serie. Sometimes esco con amici."
      errors: [word-choice]
    - tutor: "A volte esci con gli amici, bello! Dove andate?"
      recast: {text: "Sometimes", fix: "A volte", tags: [word-choice]}
      goals: [evening]
    - learner: "Andiamo in un bar vicino al fiume. E tu, Anna? Com'è la tua giornata?"
    - tutor: "Io lavoro tutto il giorno e torno tardi. La sera ceno e dormo presto!"
      goals: [ask]

- scenario: casa-mia
  level: A2
  persona: es-f-teacher
  turns:
    - tutor: "Allora, com'è la tua casa?"
    - learner: "Abito in un appartamento al terzo piano, vicino al centro."
    - tutor: "Che bello, in centro! Quante camere ci sono?"
      goals: [type]
    - learner: "Ci sono due camere, una cucina, un bagno e un piccolo balcone."
    - tutor: "Perfetto per una persona! Qual è la tua stanza preferita?"
      goals: [rooms]
    - learner: "La cucina. È piccola ma luminosa, e la mattina c'è sempre il sole."
    - tutor: "Che bello fare colazione con il sole! Cucini molto?"
      goals: [favourite]
    - learner: "Sì, cucino ogni sera. E la tua casa, Luca? Com'è?"
    - tutor: "Io abito in una casa piccola fuori città. Vieni a vederla sabato!"
      goals: [ask]

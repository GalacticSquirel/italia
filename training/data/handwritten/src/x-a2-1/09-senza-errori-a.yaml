# x-a2-1, file 09: clean conversations (no learner errors, so no corrections).
- scenario: bar-colazione
  level: A2
  persona: en-m-heritage
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno! Un caffè lungo e un bicchiere d'acqua, per favore."
    - tutor: "Subito. Qualcosa da mangiare?"
      goals: [greet, order-drink]
    - learner: "Cosa avete di salato? Non mi piacciono molto i dolci la mattina."
    - tutor: "Abbiamo un panino con il formaggio, molto buono."
      new: [{lemma: panino, gloss: sandwich}]
    - learner: "Allora un panino con il formaggio. Lo può scaldare?"
    - tutor: "Certo, due minuti ed è pronto."
      goals: [order-food]
    - learner: "Grazie. Quanto pago in tutto?"
    - tutor: "Quattro euro e venti. Paga adesso o dopo?"
    - learner: "Pago adesso. Ecco cinque euro, tenga pure il resto."
    - tutor: "Grazie mille, molto gentile! Ecco lo scontrino."
      goals: [pay]

- scenario: biglietto-treno
  level: A2
  persona: en-f-student
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    - learner: "Buongiorno! Vorrei andare a Napoli oggi pomeriggio. A che ora c'è un treno?"
    - tutor: "C'è un regionale alle tre e uno alle cinque."
      goals: [destination]
    - learner: "Scusi, cosa vuol dire regionale?"
    - tutor: "È un treno meno veloce, ma costa poco. Si ferma in molte stazioni."
    - learner: "Ho capito. Va bene quello delle tre. Solo andata, per favore."
    - tutor: "Solo andata, bene. Seconda classe?"
      goals: [type]
    - learner: "Sì, seconda classe. È possibile avere un posto a sedere?"
    - tutor: "Certo, c'è posto. Sono quattordici euro."
      goals: [class]
    - learner: "Ecco. Da quale binario parte?"
    - tutor: "Dal binario nove. Parte tra venti minuti, buon viaggio!"
      goals: [platform]

- scenario: chiedere-strada
  level: A2
  persona: es-f-teacher
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Buongiorno, mi scusi. Sa dov'è la stazione dei treni?"
    - tutor: "Certo. Non è lontana, ma deve passare per il centro."
      goals: [get-attention, ask-place]
    - learner: "Posso andare a piedi o è meglio prendere l'autobus?"
    - tutor: "A piedi va benissimo, sono quindici minuti. Vada sempre dritto per questa strada."
    - learner: "Sempre dritto. E poi?"
    - tutor: "Alla seconda strada giri a sinistra. Dopo il semaforo vede la stazione."
    - learner: "Quindi dritto, alla seconda a sinistra e dopo il semaforo c'è la stazione."
    - tutor: "Perfetto, ha capito tutto!"
      goals: [understand]
    - learner: "Grazie mille, Lei è molto gentile. Buona giornata!"
    - tutor: "Buona giornata anche a lei!"
      goals: [thank]

- scenario: compleanno
  level: A2
  persona: es-f-erasmus
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Possiamo fare una festa a sorpresa a casa mia, venerdì sera."
    - tutor: "Bella idea! Venerdì va bene. Quante persone invitiamo?"
      goals: [date]
    - learner: "Dieci o dodici: i suoi amici dell'università e le ragazze della squadra."
    - tutor: "Perfetto, gli scrivo io stasera. E da mangiare?"
      goals: [guests]
    - learner: "Io farò una tortilla e tu puoi portare la torta. A Sara piace la torta al limone."
    - tutor: "Va bene, porterò una torta al limone. E il regalo?"
      goals: [food]
      new: [{lemma: limone, gloss: lemon}]
    - learner: "Le compriamo un biglietto per un concerto? Lei ama la musica."
    - tutor: "Sì, le piacerà molto! Facciamo metà e metà."
      goals: [gift]

- scenario: cucina-ricetta
  level: A2
  persona: en-m-retired
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Stasera ti insegno la zuppa di mia madre. Servono patate, carote, una cipolla e un po' di carne."
    - tutor: "Buona! Ho tutto in casa. Cosa faccio per prima cosa?"
      goals: [ingredients]
    - learner: "Taglia le verdure a pezzi piccoli. Io intanto metto l'acqua nella pentola."
    - tutor: "Ecco, le ho tagliate. Le metto subito nell'acqua?"
    - learner: "Sì, mettile nell'acqua con la carne e aggiungi un po' di sale."
    - tutor: "Fatto. Quanto tempo deve cuocere?"
      goals: [steps]
    - learner: "Deve cuocere piano per un'ora. Non avere fretta!"
    - tutor: "Un'ora! Allora adesso beviamo un po' di vino."
      goals: [time]
    - learner: "Buona idea. Poi la serviamo calda, con il pane e un po' di olio sopra."
    - tutor: "Benissimo. Non vedo l'ora di provarla!"
      goals: [serve]

- scenario: famiglia
  level: A2
  persona: es-f-teacher
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono i miei figli con i loro nonni, l'estate scorsa a Valencia."
    - tutor: "Che bella famiglia! Come si chiamano i tuoi figli?"
      goals: [who]
    - learner: "La grande si chiama Lucía e il piccolo Pablo. Lucía è tranquilla, ha i capelli lunghi e legge sempre."
    - tutor: "Come la mamma, allora! E quanti anni hanno?"
      goals: [describe]
    - learner: "Lucía ha dodici anni e Pablo ne ha sette."
    - tutor: "E i nonni sembrano molto giovani!"
      goals: [ages]
    - learner: "Grazie! Mio padre ha settant'anni ma gioca ancora a tennis. E i tuoi genitori, Marco?"
    - tutor: "I miei abitano a Napoli. Mio padre cucina e mia madre lavora ancora."
      goals: [ask]

- scenario: giorno-tipico
  level: A2
  persona: en-f-professional
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Ciao Anna! Mi sveglio alle sette, ma mi alzo alle sette e mezza. Non amo la mattina!"
    - tutor: "Ti capisco! E poi vai subito in ufficio?"
      goals: [wake]
    - learner: "Prima faccio colazione al bar. Poi lavoro dalle nove all'una, e ho molte riunioni."
    - tutor: "Che giornata piena! E la sera cosa fai?"
      goals: [work]
    - learner: "Torno a casa verso le sette. Preparo la cena e poi mi riposo sul divano."
    - tutor: "Brava. Vai a dormire tardi?"
      goals: [evening]
    - learner: "No, verso le undici. E tu, Anna? A che ora ti alzi?"
    - tutor: "Mi alzo alle sei per andare a correre. Poi lavoro tutto il giorno!"
      goals: [ask]

- scenario: medico-base
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottoressa. Ho un forte dolore alla schiena."
    - tutor: "Mi dispiace. Da quando ha questo dolore?"
      goals: [symptoms]
    - learner: "Da tre giorni. Lavoro in cucina e sto in piedi dieci ore."
    - tutor: "Capisco. Ha preso qualche medicina?"
      goals: [since-when]
    - learner: "Sì, ieri sera ho preso un'aspirina, ma non è cambiato niente."
    - tutor: "Va bene. È allergico a qualcosa?"
    - learner: "No, non sono allergico a niente."
    - tutor: "Bene. Prenda questa medicina dopo cena, per cinque giorni. E non lavori domani."
      goals: [history]
    - learner: "Allora: la medicina dopo cena, per cinque giorni, e domani non lavoro."
    - tutor: "Esatto. Se il dolore non passa, torni da me."
      goals: [instructions]

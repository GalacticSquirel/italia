# x-a2-1, file 02: auxiliaries, participles, future, imperative, piacere, register.
- scenario: vacanze-passate
  level: A2
  persona: en-f-professional
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao Elena! Sono andata in Sardegna con due amiche. Abbiamo rimasto dieci giorni."
      errors: [auxiliary-choice]
    - tutor: "In Sardegna, che bello! Ma abbiamo rimasto? Rimanere è come andare. Voi...?"
      prompt: {text: "Abbiamo rimasto", tags: [auxiliary-choice]}
    - learner: "Ah, sì! Siamo rimaste dieci giorni."
    - tutor: "Esatto! E che tempo faceva?"
      goals: [where]
    - learner: "Faceva caldo e c'era sempre il sole. Solo un giorno ha piovuto."
    - tutor: "Che fortuna! E cosa avete fatto tutto il giorno?"
      goals: [weather]
    - learner: "La mattina andavamo in spiaggia. Un giorno abbiamo visitato Alghero in barca."
    - tutor: "Bellissimo! E cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il mare, senza dubbio. L'acqua era chiara e calda."
    - tutor: "Ti capisco! Adesso voglio andare anch'io in Sardegna."
      goals: [best]

- scenario: cercare-lavoro-a2
  level: A2
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Buongiorno. Sì, cercate un cameriere? Vorrei sapere di più sul lavoro."
    - tutor: "Sì, cerchiamo un cameriere per l'estate. Lei ha esperienza?"
      goals: [ask]
    - learner: "Sì, sono lavorato due anni in un ristorante a Buenos Aires."
      errors: [auxiliary-choice]
    - tutor: "Sono lavorato? Mmm, lavorare non è come andare. Lei...?"
      prompt: {text: "sono lavorato", tags: [auxiliary-choice]}
    - learner: "Scusi. Ho lavorato due anni in un ristorante."
    - tutor: "Bene, due anni sono tanti! Quando può lavorare?"
      goals: [experience]
    - learner: "Sono disponibile tutte le sere e anche il fine settimana."
    - tutor: "Perfetto. L'orario è dalle sei alle undici di sera. Le va bene?"
    - learner: "Sì, va bene. E lo stipendio?"
    - tutor: "Sono nove euro all'ora. Mi lascia il suo numero?"
      goals: [availability]
    - learner: "Certo. Mi chiamo Diego Ramos, il mio numero è 333 456 7890."
    - tutor: "Grazie mille. La chiamo domani mattina!"
      goals: [contact]

- scenario: chiedere-strada
  level: A2
  persona: en-f-student
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Sì, grazie. Scusa, sai dov'è la stazione?"
      errors: [register]
    - tutor: "Certo! Ma non ci conosciamo: con me usa il tu o il lei?"
      prompt: {text: "Scusa, sai", tags: [register]}
    - learner: "Ah, mi scusi! Sa dov'è la stazione?"
    - tutor: "Benissimo! La stazione non è lontana. Vada dritto fino al semaforo."
      goals: [get-attention, ask-place]
    - learner: "Dritto fino al semaforo. E poi a destra o a sinistra?"
    - tutor: "Poi a sinistra. La stazione è dopo la piazza, sulla destra."
    - learner: "Allora: dritto, al semaforo a sinistra, e dopo la piazza a destra."
    - tutor: "Proprio così! Sono cinque minuti a piedi."
      goals: [understand]
    - learner: "Perfetto. Grazie mille, buona giornata!"
    - tutor: "Prego, buona giornata e buon viaggio!"
      goals: [thank]

- scenario: compleanno
  level: A2
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    - learner: "Facciamo una festa a sorpresa! Sabato sera, a casa mia?"
    - tutor: "Bella idea! Sabato va bene. Chi invitiamo?"
      goals: [date]
    - learner: "Invitiamo gli amici dell'università e sua sorella. Io scriverò a tutti domani."
    - tutor: "Perfetto. E per mangiare? Chi porta la torta?"
      goals: [guests]
    - learner: "Io comprarò la torta in pasticceria."
      errors: [future-form]
    - tutor: "Comprarò? Quasi! Nel futuro la a di comprare cambia. Prova ancora!"
      prompt: {text: "comprarò", tags: [future-form]}
    - learner: "Comprerò la torta in pasticceria!"
    - tutor: "Bravo! E io porterò le pizze. Manca solo il regalo."
      goals: [food]
    - learner: "Sara ama leggere. Le regaliamo un libro di cucina?"
    - tutor: "Che bella idea, le piacerà tanto! Allora a sabato."
      goals: [gift]

- scenario: cucina-ricetta
  level: A2
  persona: es-f-erasmus
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Stasera facciamo la tortilla di mia nonna! Servono patate, uova, una cipolla, olio e sale."
    - tutor: "Che buona! Ho tutto. Da dove comincio?"
      goals: [ingredients]
    - learner: "Prima taglia le patate e la cipolla. Poi metti l'olio nella pentola."
    - tutor: "Fatto! Aggiungo subito il sale?"
    - learner: "No, non aggiungi il sale adesso!"
      errors: [imperative-form]
    - tutor: "Non aggiungi? Mi dai un ordine con il non. Come si dice a un'amica?"
      prompt: {text: "non aggiungi", tags: [imperative-form]}
    - learner: "Ah, sì! Non aggiungere il sale adesso. Prima cuoci le patate per venti minuti."
    - tutor: "Perfetto, venti minuti. E dopo?"
      goals: [steps, time]
    - learner: "Dopo aggiungi le uova e il sale, e cuoci altri cinque minuti."
    - tutor: "Va bene. E come la serviamo?"
    - learner: "La serviamo tiepida, con un po' di pane e un'insalata."
    - tutor: "Che buona! Stasera si mangia come a Siviglia."
      goals: [serve]

- scenario: serata-cinema
  level: A2
  persona: en-m-retired
  history: [piacere]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Volentieri! Andiamo al cinema?"
    - tutor: "Sì, bella idea! Che tipo di film ti piace?"
      goals: [propose]
    - learner: "Io piaccio le commedie italiane."
      errors: [piacere]
    - tutor: "Tu piaci alle commedie? Forse volevi dire un'altra cosa. Prova ancora con mi..."
      prompt: {text: "Io piaccio le commedie", tags: [piacere]}
    - learner: "Ah! Mi piacciono le commedie italiane."
    - tutor: "Ecco! Anche a me, sono divertenti. C'è una commedia nuova alle otto."
      goals: [genre]
    - learner: "Alle otto è un po' presto per me. C'è uno spettacolo più tardi?"
    - tutor: "Sì, c'è anche alle nove e mezza. Va meglio?"
    - learner: "Sì, perfetto. Prendiamo i biglietti per le nove e mezza."
    - tutor: "D'accordo! Dove ci vediamo?"
      goals: [choose]
    - learner: "Ci vediamo davanti al cinema alle nove e un quarto?"
    - tutor: "Benissimo, a dopo! Io porto i biglietti."
      goals: [meet]

- scenario: tempo-libero
  level: A2
  persona: en-f-professional
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Mi piace molto correre al parco. E la domenica leggo un libro sul balcone."
    - tutor: "Che brava! Corri spesso?"
      goals: [hobby]
    - learner: "Tre volte alla settimana, di solito la mattina presto. E tu, Sara? Cosa fai nel tempo libero?"
    - tutor: "Io amo la musica e il cinema. Vado spesso a vedere un film."
      goals: [frequency, ask]
    - learner: "Che bello! Anch'io amo il cinema. Sabato andiamo a vedere un film insieme?"
    - tutor: "Sì, con piacere! C'è un film francese che voglio vedere."
    - learner: "Perfetto. Poi mangiamo una pizza?"
    - tutor: "Certo! Allora a sabato, non vedo l'ora."
      goals: [propose]

- scenario: medico-base
  level: A2
  persona: en-f-student
  history: [past-participle-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottoressa. Ho la tosse e un forte mal di testa."
    - tutor: "Mi dispiace. Da quanto tempo sta così?"
      goals: [symptoms]
    - learner: "Da lunedì. Ieri ho prenduto una medicina, ma non funziona."
      errors: [past-participle-form]
    - tutor: "Ha prenduto? Prendere al passato è speciale. Ieri ha...?"
      prompt: {text: "prenduto", tags: [past-participle-form]}
    - learner: "Ieri ho preso una medicina."
    - tutor: "Giusto! E che medicina era? È allergica a qualcosa?"
      goals: [since-when]
    - learner: "Era un'aspirina. No, non sono allergica a niente."
    - tutor: "Bene. Prenda questo sciroppo tre volte al giorno, per cinque giorni."
      goals: [history]
      new: [{lemma: sciroppo, gloss: syrup}]
    - learner: "Lo sciroppo tre volte al giorno, per cinque giorni. Posso andare all'università?"
    - tutor: "Domani resti a casa e dorma molto. Poi può uscire."
      goals: [instructions]
    - learner: "Va bene, domani resto a casa. Grazie, dottoressa."
    - tutor: "Brava. Arrivederci, e torni se la tosse non passa!"

# x-a2-1, file 10: clean conversations (no learner errors, so no corrections).
- scenario: noleggio-bici
  level: A2
  persona: en-m-retired
  turns:
    - tutor: "Buongiorno! Vuole una bicicletta?"
    - learner: "Buongiorno. Sì, vorrei noleggiare una bicicletta. Avete anche biciclette elettriche?"
    - tutor: "Sì, ne abbiamo tre. Vanno molto bene in montagna."
      goals: [ask]
    - learner: "Perfetto, ne prendo una. Quanto costa per mezza giornata?"
    - tutor: "Mezza giornata costa venti euro. Il casco c'è già nel prezzo."
      goals: [duration, price]
    - learner: "Bene. E se torno un po' più tardi?"
    - tutor: "Nessun problema, paga cinque euro per ogni ora in più."
    - learner: "Capisco. Mi può consigliare un percorso non troppo difficile?"
    - tutor: "Certo. Vada verso il lago: la strada è facile e tranquilla."
      goals: [route]
    - learner: "Perfetto, vado al lago. Grazie mille!"
    - tutor: "Prego! Ecco il casco e il lucchetto. Buon giro!"

- scenario: parrucchiere
  level: A2
  persona: es-f-erasmus
  turns:
    - tutor: "Buongiorno! Si accomodi. Cosa facciamo oggi?"
    - learner: "Buongiorno! Vorrei tagliare un po' i capelli e fare il colore."
    - tutor: "Benissimo. Che colore vuole?"
      goals: [book]
    - learner: "Un castano più chiaro del mio. E vorrei tagliare solo le punte, tre centimetri."
    - tutor: "Tre centimetri, perfetto. Facciamo anche una frangia lunga?"
      goals: [length]
    - learner: "Mmm, non sono sicura. La frangia è difficile da tenere, no?"
    - tutor: "Un po', sì. Allora facciamo senza: così è più facile."
      goals: [style]
    - learner: "Sì, meglio senza. Grazie per il consiglio."
    - tutor: "Ecco, abbiamo finito. Si guardi allo specchio!"
    - learner: "Mi piace tantissimo! Quanto le devo?"
    - tutor: "Sono cinquantacinque euro. Grazie e a presto!"
      goals: [pay]

- scenario: prenotare-tavolo
  level: A2
  persona: en-m-heritage
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera. Vorrei prenotare un tavolo per domani a pranzo, se è possibile."
    - tutor: "Certo. Per quante persone e a che ora?"
      goals: [book]
    - learner: "Siamo in cinque: tre adulti e due bambini. Verso l'una."
    - tutor: "Va bene, cinque persone all'una."
      goals: [details]
    - learner: "Avete un seggiolone per il bambino più piccolo? Ha due anni."
    - tutor: "Sì, abbiamo un seggiolone. Lo preparo al tavolo."
      goals: [special]
      new: [{lemma: seggiolone, gloss: high chair}]
    - learner: "Grazie mille. Il nome è Rossi, Daniel Rossi."
    - tutor: "Perfetto, signor Rossi. È tutto confermato, a domani!"
      goals: [name]

- scenario: ricordi-infanzia
  level: A2
  persona: en-m-traveller
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Cork, in Irlanda, in una casa vicino al fiume."
    - tutor: "Vicino al fiume, che bello! E cosa facevi nel tempo libero?"
      goals: [place]
    - learner: "Andavo sempre a pescare con mio nonno. E d'inverno giocavo a rugby con gli amici."
    - tutor: "Che bravo! E a scuola com'eri?"
      goals: [habits]
    - learner: "Non ero molto bravo. Mi piaceva solo la storia, perché il maestro raccontava bene."
    - tutor: "Un buon maestro cambia tutto! Ricordi un giorno speciale?"
      goals: [school]
    - learner: "Sì. A dieci anni ho preso un pesce enorme e mio nonno ha fatto una foto. Ce l'ho ancora!"
    - tutor: "Che bel ricordo! Devi farmi vedere quella foto."
      goals: [event]

- scenario: ristorante-ordinare
  level: A2
  persona: en-f-student
  turns:
    - tutor: "Buongiorno, benvenuti! Quanti siete?"
    - learner: "Buongiorno! Siamo in quattro. Possiamo sederci fuori?"
    - tutor: "Certo, prego. Ecco il menù. Volete ordinare subito?"
      goals: [ask-table]
    - learner: "Sì. Che cosa ci consiglia come primo?"
    - tutor: "Oggi abbiamo una pasta al pesce molto buona."
    - learner: "Allora pasta al pesce per tutti. E come secondo niente, grazie."
    - tutor: "Benissimo. E da bere?"
      goals: [order-food]
    - learner: "Una bottiglia di vino bianco e acqua frizzante, per favore."
    - tutor: "Arrivano subito. Buon appetito!"
      goals: [order-drink]
    - learner: "Grazie! Era tutto buonissimo. Possiamo avere il conto?"
    - tutor: "Certo, lo porto subito. Grazie a voi!"
      goals: [ask-bill]

- scenario: ufficio-postale
  level: A2
  persona: en-f-professional
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire questo pacco in Australia, a Sydney."
    - tutor: "In Australia, certo. Lo vuole spedire normale o veloce?"
      goals: [send]
    - learner: "Che differenza c'è?"
    - tutor: "Quello normale arriva in tre settimane. Quello veloce in sei giorni."
    - learner: "Non ho fretta, quello normale va bene. Quanto costa?"
    - tutor: "Costa trentacinque euro. Deve scrivere l'indirizzo su questo modulo."
      goals: [speed]
    - learner: "Ecco fatto. Devo scrivere anche cosa c'è dentro?"
    - tutor: "Sì, qui sotto, per favore."
    - learner: "Ci sono due libri e una maglietta. Ecco il modulo."
    - tutor: "Perfetto, grazie. Paga con la carta?"
      goals: [form]
    - learner: "Sì, con la carta. Posso avere la ricevuta?"
    - tutor: "Certo, ecco la ricevuta. Buona giornata!"
      goals: [pay]
      new: [{lemma: ricevuta, gloss: receipt}]

- scenario: vacanze-passate
  level: A2
  persona: en-m-retired
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ciao Elena! Sono stato due settimane in Toscana con mia moglie."
    - tutor: "Che bello! Avete avuto bel tempo?"
      goals: [where]
    - learner: "Sì, quasi sempre. Faceva caldo di giorno, ma la sera era fresco."
    - tutor: "Perfetto! E cosa avete fatto?"
      goals: [weather]
    - learner: "Abbiamo visitato Siena e Lucca. E ogni giorno mangiavamo in un posto diverso."
    - tutor: "Che fortuna! Cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Siena, soprattutto la piazza. Ci siamo seduti lì per ore a guardare la gente."
    - tutor: "Ti capisco, è bellissima. La prossima volta mandami una foto!"
      goals: [best]

- scenario: weekend-scorso
  level: A2
  persona: es-m-worker
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Ciao Chiara! Molto bene. Domenica sono andato a Rimini con due amici."
    - tutor: "Al mare, che bello! Siete andati in treno?"
      goals: [where, with-who]
    - learner: "No, in macchina. Siamo partiti presto, alle sette."
    - tutor: "Bravi! E cosa avete fatto lì?"
    - learner: "Abbiamo fatto il bagno e poi abbiamo mangiato pesce in un ristorante sulla spiaggia."
    - tutor: "Che buono! Ti è piaciuto il posto?"
      goals: [what]
    - learner: "Sì, mi è piaciuto molto, ma c'era troppa gente. E tu, cosa hai fatto?"
    - tutor: "Sono rimasta a casa e ho letto un libro. Un fine settimana tranquillo!"
      goals: [opinion]

# B1 real-learner set: childhood and school memories with a friend, and a personal trainer.
- scenario: ricordi-infanzia
  level: B1
  persona: en-f-student
  history: [article-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    # merlin-1325_1001032-3
    - learner: "In quella casa gialla, vicino al liceo. Qui ho superato l'esame di maturità nel 2006."
    - tutor: "Allora qui conosci tutti! E com'era la scuola? Cosa studiavate?"
      goals: [place]
    # merlin-1325_1001113-4
    - learner: "Era una buona scuola. Noi impariamo già alla scuola elementare due lingue stranieri."
      errors: [adjective-agreement]
    - tutor: "Già da piccoli, che fortuna! Ma «due lingue stranieri»: «lingua» è maschile o femminile?"
      prompt: {text: "due lingue stranieri", tags: [adjective-agreement]}
    # merlin-1365_0100451-2
    - learner: "Due lingue straniere! Ma io non sono mai riuscita a fare un esame con il massimo dei voti!"
    - tutor: "Esatto! Io invece all'ultimo esame del liceo ho preso il massimo, ma ho studiato giorno e notte."
      goals: [school]
    # merlin-1365_0100070-2
    - learner: "Li massimo dei voti - non è niente!"
      errors: [article-form]
    - tutor: "Grazie! Ma «li massimo»? Controlla l'articolo davanti a «massimo»."
      prompt: {text: "Li massimo", tags: [article-form]}
    - learner: "Lo massimo dei voti, bravo!"
      errors: [article-form]
    - tutor: "Il massimo dei voti, sì, e i miei genitori erano felicissimi! E tu, da piccola, cosa facevi il pomeriggio?"
      recast: {text: "Lo massimo", fix: "Il massimo", tags: [article-form]}
    - learner: "Giocavo in cortile con mio fratello. Una volta mi sono persa al mercato e un signore mi ha riportata a casa!"
    - tutor: "Che paura! Ma anche un bel ricordo, alla fine. Andiamo a vedere il mercato?"
      goals: [habits, event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [possessive]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    # merlin-1395_0000391-3
    - learner: "Lì, in quella via. Ma non ero molto felice: come lo sai, avevo qualche problema con miei genitori."
      errors: [object-pronoun, possessive]
    - tutor: "Mi dispiace... Ma «con miei genitori»: con i nomi di famiglia al plurale, manca qualcosa?"
      prompt: {text: "con miei genitori", tags: [possessive]}
    - learner: "Con i miei genitori. Litigavano sempre."
    - tutor: "Esatto. Deve essere stato difficile. E tu cosa facevi, per stare bene?"
      goals: [place]
    # merlin-1365_0100265-3
    - learner: "Suonavo la chitarra tutto il giorno. Adesso faccio molti giochi musicali con i bambini."
    - tutor: "Che bello, la musica ti ha aiutato e adesso aiuta i bambini! E a scuola com'eri?"
      goals: [habits]
    # merlin-1325_1001048-2
    - learner: "Studiavo poco. Solo l'italiano mi piaceva: ho provato parlare con gli altri, e ho provato conoscere la cultura itoliana, la vita, la gente."
      errors: [preposition, spelling]
    - tutor: "Già da ragazzo, bravo! Ma «ho provato parlare»: tra i due verbi non manca niente?"
      prompt: {text: "ho provato parlare", tags: [preposition]}
    - learner: "Sì, ho provato parlare con tutti in italiano."
      errors: [preposition]
    - tutor: "Hai provato a parlare con tutti in italiano? Si sente, sai! E qui c'è un ricordo speciale?"
      recast: {text: "provato parlare", fix: "provato a parlare", tags: [preposition]}
      goals: [school]
    - learner: "Sì, la prima volta che ho suonato davanti a tutta la scuola. Avevo dodici anni."
    - tutor: "Che emozione, a dodici anni! Un giorno devi suonare anche per me."
      goals: [event]
      new: [{lemma: emozione, gloss: thrill}]

- scenario: ricordi-infanzia
  level: B1
  persona: en-f-professional
  history: [subject-verb-agreement]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    # merlin-1325_1001167-1
    - learner: "Qui vicino, fino a diciotto anni. Ho frequentato un liceo classico, dopo sono andata all'università di Bologna."
    - tutor: "Il liceo classico, che bello! E al liceo cosa pensavi di fare dopo?"
      goals: [place]
    # merlin-1365_0100163-2
    - learner: "Quando ho preso la mia maturità ho anche pensato a iscrivermi all'Università o no siccome non aveva le idee chiare."
      errors: [preposition, subject-verb-agreement]
    - tutor: "Normale, a diciotto anni! Ma «non aveva le idee chiare»: chi è che non le aveva?"
      prompt: {text: "non aveva", tags: [subject-verb-agreement]}
    # merlin-1325_1001134-8
    - learner: "Io non avevo le idee chiare! Personalmente cominciare a studiare l'italiano grazie a mia sorella perché lei vive a Milano da tre anni."
      errors: [verb-form]
    - tutor: "Ah, ecco perché parli così bene! Ma «personalmente cominciare»: così il verbo non dice chi e quando. Prova di nuovo?"
      prompt: {text: "Personalmente cominciare", tags: [verb-form]}
    - learner: "Ho cominciato a studiare l'italiano grazie a lei. Ogni estate andavo a trovarla."
    - tutor: "Perfetto! E qual è il ricordo più bello di quegli anni?"
      goals: [school, habits]
    # merlin-1325_1001063-9
    - learner: "Io sono personalmente molto felice, perchè quando stavo a Parigi, ho conosciuto una ragazza bellissima che parla bene in francese però lei è ungherese."
      errors: [article-use, spelling]
    - tutor: "A Parigi, che bello! Ma «parla bene in francese»: con «parlare bene», la lingua come la diciamo?"
      prompt: {text: "parla bene in francese", tags: [article-use]}
    - learner: "Parla bene in francese, sì, e anche l'inglese."
      errors: [article-use]
    - tutor: "Una ragazza che parla bene il francese e l'inglese: brava lei! Siete ancora amiche?"
      recast: {text: "Parla bene in francese", fix: "parla bene il francese", tags: [article-use]}
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [comparative]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "In un paese vicino a Valencia, con il mare a cinque minuti."
    - tutor: "Il mare sotto casa, che fortuna! E cosa facevi tutto il giorno?"
      goals: [place]
    - learner: "D'estate andavamo in spiaggia ogni mattina, e il pomeriggio giocavamo nella piazza."
    - tutor: "Che bei ricordi! E a scuola? Studiavate le lingue?"
      goals: [habits]
    # merlin-1325_1001139-3
    - learner: "Sì, ma l'inglese e il tedesco. L'inglese e tedesco si parlano più d'italiano."
      errors: [comparative, article-use]
    - tutor: "È vero. Ma «più d'italiano»: cosa manca davanti a «italiano»?"
      prompt: {text: "più d'italiano", tags: [comparative]}
    # merlin-1325_1001134-9
    - learner: "Più dell'italiano. Però le lingue straniere sono molto importanti per cercare lavoro all'estero."
    - tutor: "Esatto, hai ragione! E l'italiano quando l'hai cominciato?"
      goals: [school]
    # merlin-1325_1001121-6
    - learner: "All'università. L'italiano più bello che englese, ma anche più difficile."
      errors: [comparative, spelling]
    - tutor: "Che bel complimento! Ma «più bello che englese»: con due lingue, qui va bene «che»?"
      prompt: {text: "più bello che englese", tags: [comparative]}
    - learner: "Più bello che l'inglese, sì!"
      errors: [comparative]
    - tutor: "Più bello dell'inglese, e lo dici a un italiano! E qui da noi, qual è il tuo ricordo più bello?"
      recast: {text: "Più bello che l'inglese", fix: "Più bello dell'inglese", tags: [comparative]}
    # merlin-1365_0100217-1
    - learner: "Il giorno dell'esame di italiano: ho preso trenta. Tutto il lavoro degli anni passati ha trovato una ricompensa fruttuosa!"
    - tutor: "Trenta, bravissima! Dobbiamo festeggiare con un gelato."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: en-m-heritage
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "A Londra. Ma ogni estate venivo qui, dalla nonna, in quella casa con il balcone."
    - tutor: "Ah, la casa della nonna! E cosa facevate insieme?"
      goals: [place]
    - learner: "Lei facevava la pasta a mano e io la aiutavo."
      errors: [imperfetto-form]
    - tutor: "Che bello! Ma «facevava»? Ripeti piano l'imperfetto di «fare»."
      prompt: {text: "facevava", tags: [imperfetto-form]}
    - learner: "Faceva! Faceva la pasta. Adesso lei non c'è più... così è la vita."
    - tutor: "Esatto. Mi dispiace, ma hai dei ricordi bellissimi. E a scuola, a Londra, studiavi l'italiano?"
      goals: [habits]
    # merlin-1365_0100069-3
    - learner: "No. Non ho fatto qualche cosa interessante... Ho fatto solo l'esame per l'Inglese è l'ho superato anche con il massimo dei voti!"
      errors: [negation, articulated-preposition, spelling]
    - tutor: "Il massimo dei voti, bravo! Ma «non ho fatto qualche cosa interessante»: con «non», come lo dici?"
      prompt: {text: "Non ho fatto qualche cosa interessante", tags: [negation]}
    - learner: "Non ho fatto niente interessante."
      errors: [negation]
    - tutor: "Non hai fatto niente di interessante? Per me un esame con il massimo dei voti è interessante! E un ricordo speciale di qui?"
      recast: {text: "niente interessante", fix: "niente di interessante", tags: [negation]}
      goals: [school]
    # @? event
    - learner: "La festa del paese: ballavamo in piazza fino all'una, anche la nonna!"
    - tutor: "Che bella immagine! Questa festa c'è ancora, ad agosto: ci andiamo insieme?"
      goals: [event]

- scenario: salute-stile-vita
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1365_0100212-0
    - learner: "Non molto sane. Mi dispiace di non averti scritto prima, ma in questo periodo il mio lavoro è molto duro."
    - tutor: "Tranquilla, l'importante è che sei qui! Mangi bene, almeno?"
    # merlin-1365_0100461-7
    - learner: "Ma il più principale per me che mangiare e vivere sana."
      errors: [comparative, adjective-agreement]
    - tutor: "Ottimo obiettivo! Ma «il più principale»: «principale» ha bisogno di «più»?"
      prompt: {text: "il più principale", tags: [comparative]}
    - learner: "La cosa principale per me è mangiare e vivere sano."
    - tutor: "Perfetto! E cosa ti impedisce di farlo?"
      goals: [habits, goal]
      new: [{lemma: impedire, gloss: to prevent}]
    - learner: "Il tempo. Ero veramente stanca la sera."
      errors: [tense-aspect]
    - tutor: "«Ero stanca»? Parli di adesso, di tutte le sere: quale tempo ci vuole?"
      prompt: {text: "Ero veramente stanca", tags: [tense-aspect]}
    - learner: "Sono veramente stanca la sera. E la mattina lavoro dalle otto."
    - tutor: "Esatto. Allora facciamo così: tre allenamenti da quaranta minuti, il sabato e due mattine prima del lavoro, alle sette."
      goals: [obstacles]
    - learner: "Alle sette? Va bene, ci provo. Così la sera posso riposare."
    - tutor: "Brava! Il primo mese è il più difficile, poi diventa un'abitudine."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: en-f-student
  history: [article-use]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Quest'anno è stato difficile: sono stata licenziata, ho divorziato e in più sono arrivati dei problemi con la salute."
    - tutor: "Mi dispiace molto, sono tante cose insieme. E adesso come stai?"
    - learner: "Meglio. Ho ricominciato a vedermi con gli amici di prima, faccio lo sport, esco di sera, vado a ballare."
      errors: [article-use]
    - tutor: "Che bello, sono contento! Ma «faccio lo sport»: quell'articolo serve?"
      prompt: {text: "faccio lo sport", tags: [article-use]}
    - learner: "Faccio sport! Ma solo un po'."
    - tutor: "Esatto. E qual è il tuo obiettivo con me?"
      goals: [habits]
    - learner: "Voglio stare bene, anche con la testa. Io, adesso, mi sento meglio, ma voglio continuare."
    - tutor: "Ottimo obiettivo. Cosa ti ferma di solito? La pigrizia, il tempo?"
      goals: [goal]
      new: [{lemma: pigrizia, gloss: laziness}]
    - learner: "Il tempo. E a volte dormo male, allora la mattina non ho la forza."
    - tutor: "Capisco. Allora iniziamo piano: due allenamenti a settimana, martedì e venerdì sera, e niente telefono a letto."
      goals: [obstacles]
    - learner: "Martedì e venerdì sera, perfetto. E il telefono lo lascio in cucina!"
    - tutor: "Brava, è un ottimo inizio! Ci vediamo martedì."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1365_0100069-2
    - learner: "Nell'ultimo periodo io ho lavorato molto. Mangio al bar e non faccio movimento."
    - tutor: "Capisco, è una situazione comune. E dormi abbastanza?"
    - learner: "Sei ore, a volte cinque. Al solito vado a letto all'una."
      errors: [word-choice]
    - tutor: "Di solito vai a letto all'una? È tardi! E cosa vorresti cambiare?"
      recast: {text: "Al solito", fix: "Di solito", tags: [word-choice]}
      goals: [habits]
    - learner: "Vorrei perdere cinque chili e avere più energia. Mia moglie dice che sono troppo stressato."
    - tutor: "Obiettivo chiaro. E cosa ti ferma, di solito?"
      goals: [goal]
    # merlin-1325_9000674-5
    - learner: "Dovevo vincere tante difficoltà per quanto riguarda fare lo sport."
    - tutor: "Quali difficoltà? Il lavoro, la famiglia?"
    - learner: "Il lavoro. Non ho tempo per la palestra, finisco alle sette e ho freddo uscire la sera."
      errors: [word-choice]
    - tutor: "Ti capisco, uscire la sera con il freddo è difficile. Allora alleniamoci a casa: venti minuti, quattro volte a settimana."
      recast: {text: "ho freddo uscire", fix: "uscire la sera con il freddo", tags: [word-choice]}
      goals: [obstacles]
    - learner: "Venti minuti a casa, va bene. Lo posso fare prima di cena."
    - tutor: "Perfetto! Ti mando un programma semplice stasera."
      goals: [plan]

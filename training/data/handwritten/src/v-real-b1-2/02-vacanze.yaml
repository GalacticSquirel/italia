# B1 real-learner set: friends back from holiday, plus a train ticket and a clinic call.
- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000388-4
    - learner: "Sono andata in Corsica, in Sardegna e in Sicilia."
    - tutor: "Tre isole in un'estate, che fortuna! E il tempo? Ha fatto bello?"
      goals: [where]
    # merlin-1395_0000557-5
    - learner: "Sempre sole, soprattutto in Sardegna. È una regione meravigliosa."
    - tutor: "Lo dicono tutti! E cosa avete fatto di bello?"
      goals: [weather]
    # merlin-1325_1001020-7
    - learner: "Abbiamo fatto una gita e dopo siamo andati bagnare nella piscina e l'acqua è stata molto brutta."
      errors: [preposition, reflexive, tense-aspect]
    - tutor: "Oh no! Però ascolta: «l'acqua è stata molto brutta». Stai dicendo com'è l'acqua, non racconti un fatto: che tempo usiamo?"
      prompt: {text: "è stata molto brutta", tags: [tense-aspect]}
    - learner: "L'acqua è stata sporca, molto brutta."
      errors: [tense-aspect]
    - tutor: "Ah, l'acqua era sporca! Che peccato, proprio in vacanza. E avete conosciuto qualcuno?"
      recast: {text: "è stata sporca", fix: "era sporca", tags: [tense-aspect]}
      goals: [activities]
    # merlin-1395_0000446-6
    - learner: "Sì, tante persone. Non mi credi: due ragazze sono di Giappone!"
      errors: [articulated-preposition]
    - tutor: "Davvero? Ma «di Giappone»: davanti al nome del paese manca qualcosa, no?"
      prompt: {text: "di Giappone", tags: [articulated-preposition]}
    - learner: "Sono del Giappone! È stata la cosa più bella della vacanza."
    - tutor: "Perfetto! Che bello, adesso hai due amiche dall'altra parte del mondo."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [auxiliary-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Ho stato una settimana sul lago di Garda, in un residence."
      errors: [auxiliary-choice]
    - tutor: "«Ho stato»? Pensa al verbo «stare»: vuole «avere» o un altro verbo?"
      prompt: {text: "Ho stato", tags: [auxiliary-choice]}
    - learner: "Sono stato una settimana sul lago di Garda."
    - tutor: "Bravo! Che bel posto. E l'albergo com'era?"
      goals: [where]
    # merlin-1325_9000136-1
    - learner: "Nell'annuncio c'erano tante cose che mi piacevano molto come il lago vicino, i campi da tennis o l'animazione."
    - tutor: "Nell'annuncio... e invece? Dalla tua faccia non sembra una storia felice."
    # merlin-1325_9000302-5
    - learner: "Ma la realtà é vecchio, scuro, piccolo."
      errors: [preposition, spelling]
    - tutor: "Mamma mia! Ma «la realtà è vecchio»? Così sembra vecchia la realtà! Manca una parola davanti."
      prompt: {text: "la realtà", tags: [preposition]}
    - learner: "Ma la realtà, il residence è vecchio."
      errors: [preposition]
    - tutor: "Ah, in realtà era vecchio e piccolo: che peccato! E almeno il tempo è stato bello?"
      recast: {text: "la realtà", fix: "in realtà", tags: [preposition]}
    # merlin-1325_9000139-8
    - learner: "No, pioveva quasi sempre. La nostra giornata è stata noiosa, giorno per giorno."
    - tutor: "Che tempo brutto! E con la pioggia cosa facevate? Tennis no, immagino..."
      goals: [weather]
    # merlin-1325_1001010-6
    - learner: "No, i campi erano chiusi. Così fare dello sport era difficile. Abbiamo letto molto e dormito tanto."
    - tutor: "Beh, anche riposare è importante! C'è stato almeno un momento bello?"
      goals: [activities]
    - learner: "Sì, l'ultima sera abbiamo mangiato in una trattoria sul lago: era bellissima."
    - tutor: "Meno male, almeno un bel ricordo! La prossima volta ti consiglio un posto io."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-f-teacher
  history: [imperfetto-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono stata in Trentino con mio marito, in un residence vicino a un lago."
    - tutor: "Che bello, la montagna! E il residence com'era?"
      goals: [where]
    # merlin-1325_1001018-2
    - learner: "Carino, ma il lago si trova lontano, dovovo passeggiare 20 minuti a giungerlo."
      errors: [imperfetto-form, preposition]
    - tutor: "«Dovovo»? Controlla l'imperfetto di «dovere»: come fa con «io»?"
      prompt: {text: "dovovo", tags: [imperfetto-form]}
    - learner: "Dovevo! Dovevo camminare venti minuti."
    - tutor: "Esatto. Beh, venti minuti a piedi fanno bene! E c'era una piscina?"
    # merlin-1325_1001119-5
    - learner: "La piscina era chiusa per lavori e così non ho avuto la possibilità di fare il corso di nuoto che avevo prenotato."
    - tutor: "Che peccato! Ma il tempo almeno era bello? Cosa facevate tutto il giorno?"
    # merlin-1395_0001145-6
    - learner: "Sempre sole, per fortuna. Ci piace andare a fare una passeggiata, andare in bicicletta ecc."
    - tutor: "Allora eravate nel posto giusto! Qual è stato il momento più bello?"
      goals: [weather, activities]
    # merlin-1365_0100222-2
    - learner: "La gita al parco naturale. Questo parco è veramente una maraviglia."
      errors: [spelling]
    - tutor: "Una «maraviglia»? Ascolta bene la lettera dopo la «m»."
      prompt: {text: "maraviglia", tags: [spelling]}
    - learner: "Sì, una maraviglia, con i laghi e gli animali."
      errors: [spelling]
    - tutor: "Una meraviglia, hai ragione: ci sono stata anch'io da piccola! Mi mandi qualche foto?"
      new: [{lemma: meraviglia, gloss: wonder}]
      recast: {text: "maraviglia", fix: "meraviglia", tags: [spelling]}
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [relative-pronoun]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100278-1
    - learner: "Quest'estate niente viaggi lunghi. Sai, che siamo diventati genitori da una bellissima e sana bambina, la cui si chiama Lisa."
      errors: [preposition, relative-pronoun]
    - tutor: "Ma che notizia, auguri! Però, una bambina «la cui si chiama» Lisa? Qui basta una parola più semplice, come in «il ragazzo che conosco»."
      prompt: {text: "la cui si chiama", tags: [relative-pronoun]}
    - learner: "Una bambina che si chiama Lisa!"
    - tutor: "Esatto. Che bel nome! Allora siete rimasti a casa tutta l'estate?"
    # merlin-1365_0100227-6
    - learner: "No, siamo stati una settimana dai miei genitori, al mare. Ero veramente stanca la sera."
    - tutor: "Con una bambina così piccola, ti credo! E com'era il mare ad agosto?"
      goals: [where]
    - learner: "Faceva molto caldo, e c'era sempre tanti turisti sulla spiaggia."
      errors: [ce-ci-sono]
    - tutor: "Eh, ad agosto... Ma «c'era tanti turisti»? I turisti sono tanti: il verbo va bene così?"
      prompt: {text: "c'era sempre tanti turisti", tags: [ce-ci-sono]}
    - learner: "C'è stato tanti turisti, sì."
      errors: [ce-ci-sono]
    - tutor: "Ci sono stati tanti turisti, certo: ad agosto il mare è pieno. E voi cosa facevate durante il giorno?"
      recast: {text: "C'è stato", fix: "Ci sono stati", tags: [ce-ci-sono]}
      goals: [weather]
    # merlin-1395_0000391-2
    - learner: "Passeggiate la mattina presto e tanto riposo. Io, adesso, mi sento meglio."
    - tutor: "Si vede, hai un'ottima faccia! E qual è stato il momento più bello?"
      goals: [activities]
    - learner: "Quando i miei genitori hanno visto Lisa per la prima volta: mia madre ha pianto!"
    - tutor: "Che emozione! Dai, la prossima volta portala anche da me."
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100220-13
    - learner: "Siamo andati al nord. Andiamo in Norvegia, ogni anno."
    - tutor: "In Norvegia! E quest'anno dove siete stati di preciso?"
    - learner: "A Bergen e poi sulle isole Lofoten. Abbiamo noleggiato una macchina."
    - tutor: "Che viaggio! E il tempo? Lassù d'estate fa freddo?"
      goals: [where]
    # merlin-1325_9000302-2
    - learner: "Un po' freddo, ma quando abbiamo visto le vostro foto subito eravamo inamorati nel posto."
      errors: [adjective-agreement, preposition, spelling]
    - tutor: "Le mie foto? Ah, quelle che ti ho mandato l'anno scorso! Ma attenzione: «le vostro foto»?"
      prompt: {text: "le vostro foto", tags: [adjective-agreement]}
    - learner: "Le vostre foto. Le tue foto, scusa!"
    - tutor: "Perfetto! Sono contenta che ti abbiano convinto. E lassù cosa avete fatto?"
      goals: [weather]
    # merlin-1365_0100275-4
    - learner: "Tante escursioni e un giro in barca tra i fiordi. Dopo farò il giro del mondo con i miei amici."
    - tutor: "Il giro del mondo? Grande! E qual è stato il momento più bello in Norvegia?"
      goals: [activities]
    - learner: "Una notte abbiamo visto il sole a mezzanotte. È stato molto eccitante."
      errors: [false-friend]
    - tutor: "Il sole a mezzanotte, che emozionante! Dev'essere stato bellissimo: lo voglio vedere anch'io."
      new: [{lemma: emozionante, gloss: thrilling}]
      recast: {text: "eccitante", fix: "emozionante", tags: [false-friend]}
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-m-heritage
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0001060-3
    - learner: "In Puglia, dai miei parenti. Siamo andati a trovare Giulia."
    - tutor: "Tua cugina? Che bello! Com'era il tempo giù?"
      goals: [where]
    - learner: "Caldissimo. Mia madre è venuto con me, ma lei non sopporta il caldo."
      errors: [participle-agreement]
    - tutor: "Tua madre «è venuto»? Parli di tua madre, una donna: allora «venuto» va bene così?"
      prompt: {text: "è venuto", tags: [participle-agreement]}
    - learner: "Mia madre è venuto, sì."
      errors: [participle-agreement]
    - tutor: "Ah, tua madre è venuta con te, che bello! E con quel caldo cosa facevate?"
      recast: {text: "è venuto", fix: "è venuta", tags: [participle-agreement]}
      goals: [weather]
    # merlin-1325_9000750-13
    - learner: "Tutte le mattine andavamo al mare. Faccio lo sport anche in vacanza, esco di sera, vado a ballare."
      errors: [article-use]
    - tutor: "Che energia! Però: «faccio lo sport»? Qui ti serve davvero «lo»?"
      prompt: {text: "faccio lo sport", tags: [article-use]}
    - learner: "Faccio lo sport tutti i giorni, sì."
      errors: [article-use]
    - tutor: "Faccio sport anch'io, ma tutti i giorni? Bravissimo, io invece in vacanza non faccio niente! E il ricordo più bello?"
      recast: {text: "Faccio lo sport", fix: "Faccio sport", tags: [article-use]}
      goals: [activities]
    # merlin-1325_1001058-3
    - learner: "La festa del paese. Lì Giulia mi ha presentato una ragazza italiana: fra cinque anni ho conosciuto sua sorella, all'università."
      errors: [word-choice]
    - tutor: "Ah, cinque anni fa hai conosciuto sua sorella, e adesso anche lei? Che caso! Allora la festa è stata speciale."
      recast: {text: "fra cinque anni", fix: "cinque anni fa", tags: [word-choice]}
      goals: [best]

- scenario: biglietto-treno
  level: B1
  persona: es-f-erasmus
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    # merlin-1395_0001158-1
    - learner: "A Roma, da un'amica. Arrivando il 23 dicembre, fino qundo posso rimanere a casa sua? Scusi, penso ad alta voce!"
      errors: [preposition, spelling]
    - tutor: "Nessun problema! Però «fino quando»: manca una piccola preposizione. Come si dice?"
      prompt: {text: "fino qundo", tags: [preposition]}
    - learner: "Fino a quando. Vorrei partire il 23 dicembre la mattina."
    - tutor: "Perfetto. C'è un Frecciarossa alle 8:10 da Bologna. Solo andata o anche ritorno?"
      goals: [destination]
    # merlin-1365_0100173-3
    - learner: "Andata e ritorno, per il 2 gennaio. A Roma sono già andata ci molti anni fa."
      errors: [pronoun-position]
    - tutor: "Ah, quindi conosce già la città! Ma «sono già andata ci»: dove va quel «ci»?"
      prompt: {text: "sono già andata ci", tags: [pronoun-position]}
    - learner: "Ci sono già andata molti anni fa."
    - tutor: "Esatto. Allora andata il 23 e ritorno il 2 gennaio. Preferisce la seconda classe o la prima?"
      goals: [type]
    - learner: "La seconda, vicino al finestrino se è possibile."
    - tutor: "Ecco qui: posto 14, vicino al finestrino. Sono 98 euro in tutto."
      goals: [class]
    # merlin-1365_0100020-10
    - learner: "Bene credo che è tutto. Da quale binario parte?"
    - tutor: "Il binario lo vede in stazione mezz'ora prima, ma di solito è il 5. Buon viaggio e buone feste!"
      goals: [platform]

- scenario: prenotare-visita
  level: B1
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Pronto, Centro Medico San Luca, buongiorno."
    - learner: "Buongiorno, vorrei prenotare una visita dal dermatologo, per una macchia sulla pelle."
    - tutor: "Certo. Il primo posto libero con il dermatologo è martedì alle 9. Le va bene?"
      goals: [type]
    # merlin-1385_0001717-4
    - learner: "Martedì ho lezione. Il dottore è libero la sera?"
    - tutor: "Il giovedì riceve fino alle sette. Giovedì alle 18:30?"
    # merlin-1365_0100278-8
    - learner: "Perfetto. In novembre comincerò di nuovo a lavorare, quindi meglio adesso."
    - tutor: "Benissimo, allora giovedì alle 18:30. Ha altre domande?"
      goals: [availability]
    - learner: "Sì: quanto costerà la visita? E dovrò portare qualche documento?"
    - tutor: "La visita costa 90 euro. Porti un documento e, se li ha, gli esami vecchi."
      goals: [cost]
    # merlin-1325_1001095-0
    - learner: "Allora giovedì alle 18:30 verrò con un documento e pagherò 90 euro. Mi chiamo Emma Clarke."
    - tutor: "Perfetto, signora Clarke, è tutto confermato. A giovedì!"
      goals: [confirm]

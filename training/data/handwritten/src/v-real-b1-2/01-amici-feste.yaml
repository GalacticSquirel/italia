# B1 real-learner set: parties, Christmas with friends, a book club, a restaurant booking.
- scenario: compleanno
  level: B1
  persona: en-f-professional
  history: [piacere]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Sai che si è appena fidanzata con Luca?"
    # merlin-1365_0100027-0
    - learner: "Che bella notizia!"
    - tutor: "Vero? Sono proprio carini insieme. Io pensavo a una festa a sorpresa: tu quando sei libera?"
    # merlin-1385_0001717-3
    - learner: "Ma che cosa fai a sabato?"
      errors: [preposition]
    - tutor: "Che cosa faccio «a sabato»? Mmh, con i giorni della settimana ti serve davvero quella «a»?"
      prompt: {text: "a sabato", tags: [preposition]}
    - learner: "Ah, no. Che cosa fai sabato?"
    - tutor: "Ecco, così va bene! Sabato sono libero: facciamo la festa da me, alle otto. Chi invitiamo?"
      goals: [date]
    # merlin-1365_0100176-5
    - learner: "I suoi colleghi e mio fratello con la sua ragazza. Sono insieme da due settimane e vorrebbe incontrare i miei amici."
    - tutor: "Benissimo, così finalmente la conosciamo! Ai colleghi scrivo io. E da mangiare? Tu e Sara cosa preferite?"
      goals: [guests]
    # merlin-1365_0100461-10
    - learner: "Ci piace molto lasagne e paste italiane."
      errors: [piacere, article-use]
    - tutor: "«Ci piace molto lasagne»? Attenzione: le lasagne sono tante, e il verbo deve andare d'accordo con loro."
      prompt: {text: "Ci piace molto lasagne", tags: [piacere]}
    - learner: "Ci piace molto le lasagne, sì!"
      errors: [piacere]
    - tutor: "Se a voi piacciono molto le lasagne, allora lasagne per tutti e una torta al cioccolato. Per il regalo, che ne dici di un buono per un weekend al mare?"
      recast: {text: "piace molto le lasagne", fix: "piacciono molto le lasagne", tags: [piacere]}
      goals: [food]
    - learner: "Sì, è un'idea fantastica. Spero che le piaccia!"
    - tutor: "Le piacerà di sicuro, ha proprio bisogno di riposo! Lo compro io domani, e ci vediamo sabato."
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [possessive]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Quest'anno festeggiamo anche il suo nuovo lavoro!"
    # merlin-1365_0100278-0
    - learner: "Mi fa tanto piacere!"
    - tutor: "Anche a me, l'ha cercato per mesi. Pensavo a una cena a sorpresa venerdì, da me. Ti va?"
    # merlin-1385_0001730-5
    - learner: "Venerdì lavoro fino a tardi. Ma hai tempo sabato sera?"
    - tutor: "Sì, sabato sono libero. Allora sabato alle nove, a casa mia. Chi chiamiamo?"
      goals: [date]
    # merlin-1325_1001023-11
    - learner: "Le sue colleghe e sua sorella. La mia amica può venire con me?"
    - tutor: "Certo, più siamo e meglio è! E da mangiare? Io in cucina sono un disastro..."
      goals: [guests]
    # merlin-1395_0000551-9
    - learner: "Potrei preparare la pasta con funghi... tu piatto preferito!"
      errors: [article-use, possessive]
    - tutor: "Il mio... «tu piatto preferito»? Prova a ripetere: di chi è il piatto?"
      prompt: {text: "tu piatto preferito", tags: [possessive]}
    - learner: "Il tuo piatto preferito, la pasta con i funghi!"
    - tutor: "Brava, te lo ricordi! Allora tu fai la pasta e io compro la torta. Per il regalo pensavo a un corso di ballo."
      goals: [food]
    # merlin-1365_0100482-8
    - learner: "Bella idea. Spero che lo si piacia."
      errors: [object-pronoun, subjunctive-form]
    - tutor: "Spero che «lo si piacia»? Il regalo deve piacere a Sara: quale pronome usiamo per dire «a lei»?"
      prompt: {text: "lo si piacia", tags: [object-pronoun]}
    - learner: "Ah, giusto: spero che le piaccia!"
    - tutor: "Perfetto! Vedrai che le piacerà moltissimo. A sabato, e non dire niente a Sara!"
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara? Io pensavo a sabato 20, a casa mia."
    # merlin-1365_0100092-2
    - learner: "Sono molto triste che devo andare a un congresso del 19 novembre al 22 novembre."
      errors: [articulated-preposition, subjunctive-use]
    - tutor: "Che peccato! Ma un congresso «del 19 novembre»? Per indicare il giorno in cui comincia, quale preposizione usiamo?"
      prompt: {text: "del 19 novembre", tags: [articulated-preposition]}
    - learner: "Ehm... al 19 novembre al 22?"
      errors: [articulated-preposition]
    - tutor: "Ah, dal 19 novembre al 22, capisco. Allora spostiamo la festa a sabato 27, quando sei già tornato. Ti va bene?"
      recast: {text: "al 19 novembre", fix: "dal 19 novembre", tags: [articulated-preposition]}
    # merlin-1385_0001724-5
    - learner: "Sì, perfetto. Conosco un ristorante dove si mangia bene."
    - tutor: "Ottimo, allora sabato 27 al ristorante: così niente piatti da lavare! Chi invitiamo?"
      goals: [date]
    # merlin-1395_0000446-7
    - learner: "Anche le ragazze del suo corso di ballo. Tutte le persone sono simpatiche e anche dopo il corso passiamo il tempo libero insieme."
    - tutor: "Che bello, allora le chiami tu. La torta la ordiniamo al ristorante, o la porta qualcuno?"
      goals: [guests]
    - learner: "La porto io: mia sorella fa una torta al limone buonissima."
    - tutor: "Perfetto: cena al ristorante e torta di tua sorella. Manca solo il regalo. Hai qualche idea?"
      goals: [food]
    - learner: "Le regaliamo due biglietti per un concerto? Lei ama la musica dal vivo. Che ne pensi?"
    - tutor: "Ottima idea, così ci va con Luca! Li compro io stasera su internet."
      goals: [gift]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [subject-verb-agreement]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    # merlin-1365_0100148-4
    - learner: "Da noi la cena della Vigilia è con tutta la famiglia. La sera possiamo uscire insieme oppure con altre famiglie."
    - tutor: "Che bello, una festa lunga! Qui invece il 24 si resta a casa a giocare a carte. E i regali, quando li aprite?"
      goals: [compare]
    - learner: "Il 6 gennaio, con i Re Magi. Da bambina la notte del 5 non dormivo mai!"
    - tutor: "Ti credo, che emozione! E a casa tua, cosa si regalava di solito?"
      goals: [past]
    # merlin-1365_0100183-8
    - learner: "Normalmente si regala le cose come le posate oppure le cose per cucinare qualcosa."
      errors: [subject-verb-agreement, article-use]
    - tutor: "«Si regala le cose»? Pensa al verbo: con il «si» deve andare d'accordo con quello che si regala."
      prompt: {text: "si regala le cose", tags: [subject-verb-agreement]}
    - learner: "Si regala le posate, le pentole..."
      errors: [subject-verb-agreement]
    - tutor: "Ah, si regalano le posate e le pentole: regali utili! Da noi invece i regali li porta Babbo Natale, la notte del 24."
      recast: {text: "Si regala le posate", fix: "Si regalano le posate", tags: [subject-verb-agreement]}
    # merlin-1365_0100287-6
    - learner: "Ho una domanda. Che cosa si mangia a Capodanno da voi?"
    - tutor: "Le lenticchie! Si dice che portino soldi per tutto l'anno."
      goals: [ask]
      new: [{lemma: lenticchia, gloss: lentil}]
    # merlin-1365_0100096-11
    - learner: "Domani posso portare un dolce. Oppure c'è una cosa particolare, che posso regalarvi?"
    - tutor: "Che gentile! Non serve niente, davvero. Se vuoi, porta un dolce spagnolo: i miei saranno curiosissimi."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-student
  history: [subject-verb-agreement]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra mangiamo il tacchino, e la mattina del 25 apriamo i regali."
    - tutor: "La mattina? Da noi molti li aprono già la sera del 24. Quest'anno ti manca un po' casa?"
      goals: [compare]
    # merlin-1365_0100229-3
    - learner: "Sì. Mi piace molto l'università ma mi manca casa mia e i miei animali."
      errors: [subject-verb-agreement]
    - tutor: "Ti capisco. Però ascolta la tua frase: «mi manca casa mia e i miei animali». Le cose sono due: il verbo va bene così?"
      prompt: {text: "mi manca casa mia e i miei animali", tags: [subject-verb-agreement]}
    - learner: "No: mi mancano casa mia e i miei animali."
    - tutor: "Esatto. Domani però sei con noi, e c'è anche il nostro gatto! Com'era il Natale quando eri piccola?"
    - learner: "Andavamo sempre dalla nonna. Lei preparava il pudding e noi cantavamo tutto il pomeriggio."
    - tutor: "Che bel ricordo! Anche noi da piccoli cantavamo con mio zio. Vuoi sapere qualcosa sul nostro pranzo?"
      goals: [past]
    - learner: "Sì: che cos'è il panettone? L'ho visto in tutti i supermercati."
    - tutor: "È un dolce di Milano, alto e leggero, con l'uvetta. Domani lo provi!"
      goals: [ask]
      new: [{lemma: uvetta, gloss: raisins}]
    # merlin-1365_0100199-4
    - learner: "Che cosa porto domani? Vi chiedo di aiutarmi e di farmi una proposta."
    - tutor: "Porta una bottiglia di vino, se vuoi: mio padre sarà contentissimo. Ci vediamo all'una!"
      goals: [plan]

- scenario: film-libro
  level: B1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto un romanzo che racconta la storia di una famiglia di Torino durante la guerra."
    - tutor: "Interessante! E chi è il personaggio principale?"
      goals: [summary]
    - learner: "È la figlia più piccola, che racconta tutto. Il padre è un uomo di cui tutti hanno paura, ma in realtà è molto buono."
    - tutor: "Che bel personaggio, quel padre! E a te il romanzo è piaciuto?"
      goals: [characters]
    # merlin-1365_0100226-9
    - learner: "Sì, molto. Il finale è un po' triste, perché alla fine tutti vanno via. Così è la vita."
    - tutor: "Hai ragione, a volte un finale così è il più vero. A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "Lo consiglio alle persone che piace leggere storie vere."
      errors: [relative-pronoun]
    - tutor: "Alle persone «che piace» leggere? Pensa: piace a qualcuno. Allora quale pronome ci vuole?"
      prompt: {text: "che piace", tags: [relative-pronoun]}
    - learner: "Alle persone che gli piace leggere storie vere."
      errors: [relative-pronoun]
    - tutor: "Giusto, alle persone a cui piace leggere storie vere! Allora lo mettiamo nella lista del mese prossimo. Grazie del consiglio!"
      recast: {text: "che gli piace", fix: "a cui piace", tags: [relative-pronoun]}
      goals: [recommend]

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-professional
  history: [object-pronoun]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera, vorrei prenotare un tavolo per sabato sera. È per una festa di compleanno."
    - tutor: "Certo! Per quante persone, e a che ora?"
      goals: [book]
    - learner: "Saremo in dodici, verso le otto e mezza."
    - tutor: "Benissimo, sabato alle otto e mezza per dodici persone. Ha qualche richiesta particolare?"
      goals: [details]
    # merlin-1325_1001082-4
    - learner: "L'ultima cosa che voglio sapere, se ho qualche allergia loro possono auitare a me e fare dei cibi quelli che posso mangiare?"
      errors: [object-pronoun, relative-pronoun, spelling]
    - tutor: "Certo, chiediamo al cuoco. Ma «a me», dopo il verbo? Provi con un pronome più corto, attaccato al verbo."
      prompt: {text: "auitare a me", tags: [object-pronoun]}
    - learner: "Possono aiutarmi? Sono allergica al pesce."
    - tutor: "Esatto. Nessun problema: lo dico al cuoco e le prepariamo un menù senza pesce. Volete anche un tavolo fuori?"
      goals: [special]
    # merlin-1325_1001133-2
    - learner: "No, grazie, dentro va bene. Sono Anna Bianchi."
    - tutor: "Perfetto, signora Bianchi: sabato alle otto e mezza, dodici persone e un menù senza pesce. A sabato!"
      goals: [name]

# B1 real-learner set: visiting a friend in Naples, plus a flat, a bank, a garage, a doctor, a neighbour.
- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0000360-0
    - learner: "Il 3 luglio! É passato tanto tempo dal nostro l'ultimo incontro."
      errors: [article-use, spelling]
    - tutor: "Davvero tanto! Ma «dal nostro l'ultimo incontro»: non c'è una parola di troppo?"
      prompt: {text: "dal nostro l'ultimo incontro", tags: [article-use]}
    - learner: "Sì: dal nostro ultimo incontro. Resto due settimane."
    - tutor: "Perfetto! Due settimane è il tempo giusto. E dove dormi?"
      goals: [plans]
    # merlin-1365_0100256-2
    - learner: "Non lo so ancora. Conosci una bella pensione vicino da te?"
      errors: [preposition]
    - tutor: "Vicino «da» me? Pensaci: dopo «vicino», è la preposizione giusta?"
      prompt: {text: "vicino da te", tags: [preposition]}
    - learner: "Sì, una pensione vicino da casa tua."
      errors: [preposition]
    - tutor: "Proprio vicino a casa mia c'è una pensione piccola ma pulitissima: ti mando il numero!"
      recast: {text: "vicino da", fix: "vicino a", tags: [preposition]}
    # merlin-1395_0001016-9 + @114
    - learner: "Grazie! Che cosa possiamo fare la sera a Napoli? E dalla stazione, come ci arrivo a casa tua?"
    - tutor: "La sera vai a vedere il mare e poi mangia una pizza in centro. Dalla stazione prendi la metro, linea 1, e scendi a Toledo."
      goals: [advice, transport]
    # merlin-1365_0100135-6
    - learner: "E se c'è qualcosa di pericoloso, mi fate sapere per favore."
      errors: [imperative-form]
    - tutor: "Certo! Ma «mi fate sapere»: parli solo con me, e mi chiedi un favore. Come lo dici?"
      prompt: {text: "mi fate sapere", tags: [imperative-form]}
    # merlin-1395_0000513-8
    - learner: "Fammi sapere, per favore."
    - tutor: "Brava! Allora: in metro tieni la borsa chiusa davanti a te, e di notte evita le strade vuote."
      goals: [warnings]

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [hypothetical]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0000626-8
    - learner: "Il 10 agosto. Così, forse, c'è una possibilità da vederti."
      errors: [preposition]
    - tutor: "Che bello! Ma una possibilità «da» vederti? Dopo «possibilità», va bene quella preposizione?"
      prompt: {text: "da vederti", tags: [preposition]}
    # merlin-1365_0100145-2
    - learner: "Una possibilità di vederti! Mi piacerebbe frequentare un corso di tre settimane a Napoli."
    - tutor: "Perfetto, un corso d'italiano qui è un'ottima idea. E per dormire, cosa pensi di fare?"
      goals: [plans]
    # merlin-1365_0100100-5
    - learner: "Se non sarei possibile di abitare in casa privata, preferirei un alloggio in un appartamento con altri studenti per la causa stessa."
      errors: [hypothetical, preposition, word-order]
    - tutor: "«Se non sarei possibile»? Parli di una cosa che forse non succede: dopo «se», quale forma del verbo usiamo?"
      prompt: {text: "Se non sarei possibile", tags: [hypothetical]}
    - learner: "Se non sarebbe possibile, un appartamento con studenti."
      errors: [hypothetical]
    - tutor: "Se non fosse possibile, nessun problema: conosco tanti studenti che cercano qualcuno per una stanza. Cosa vuoi vedere in città?"
      recast: {text: "Se non sarebbe possibile", fix: "Se non fosse possibile", tags: [hypothetical]}
    # merlin-1325_1001155-10
    - learner: "Non lo so ancora. Amo molto i cibi speciali e i cibi internazionali."
    - tutor: "Allora mangerai benissimo: prova le sfogliatelle, sono dolci buonissimi!"
      goals: [advice]
      new: [{lemma: sfogliatella, gloss: Neapolitan flaky pastry}]
    - learner: "E per andare a Pompei, quanto tempo vuole in treno?"
      errors: [ci-ne]
    - tutor: "«Quanto tempo vuole»? Così sembra una persona che vuole qualcosa! Manca una piccola parola."
      prompt: {text: "quanto tempo vuole", tags: [ci-ne]}
    - learner: "Quanto tempo si vuole? E cosa devo evitare?"
      errors: [ci-ne]
    - tutor: "Ci vuole mezz'ora. E evita i taxi senza tassametro: chiedi sempre il prezzo prima."
      recast: {text: "si vuole", fix: "ci vuole", tags: [ci-ne]}
      goals: [transport, warnings]
      new: [{lemma: tassametro, gloss: taxi meter}]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0001115-2
    - learner: "Il 5 maggio, con mia moglie. Spero che la tua familia anche sta bene."
      errors: [subjunctive-use, word-order, spelling]
    - tutor: "Sì, tutti bene! Ma «spero che... sta bene»: dopo «spero che», quale modo del verbo ci vuole?"
      prompt: {text: "sta bene", tags: [subjunctive-use]}
    # merlin-1365_0100270-8
    - learner: "Spero che stia bene! E come va il francese?"
    - tutor: "Bravissimo! Il francese va abbastanza bene, studio ogni sera. Ah, sai la novità? Mi sposo a settembre!"
      goals: [plans]
    # merlin-1365_0100069-7
    - learner: "Davvero? Sono molto contento con te!"
      errors: [preposition]
    - tutor: "Grazie! Ma «contento con te»: è proprio la preposizione giusta?"
      prompt: {text: "contento con te", tags: [preposition]}
    - learner: "Sì, sono contento con te e con il tuo ragazzo!"
      errors: [preposition]
    - tutor: "Che carino, sei contento per me e per Luca! Grazie. Allora, cosa volete fare a Napoli?"
      recast: {text: "contento con", fix: "contento per", tags: [preposition]}
    - learner: "Mia moglie ama l'arte e io amo la pizza! Che cosa ci consigli?"
    - tutor: "Visitate il Museo Archeologico e la parte vecchia della città, e mangiate la pizza dove la mangia la gente del posto."
      goals: [advice]
    - learner: "E come ci muoviamo in città? Cosa dobbiamo evitare?"
    - tutor: "Usate la metro, è comoda. E in autobus, quando c'è tanta gente, tenete i soldi in una tasca davanti."
      goals: [transport, warnings]

- scenario: affittare-appartamento
  level: B1
  persona: es-m-worker
  history: [ce-ci-sono]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. È molto grande! Quanto costa l'affitto al mese?"
    - tutor: "Sono 950 euro, spese di condominio comprese. È solo per lei?"
      goals: [rent]
    # merlin-1395_0000626-2
    - learner: "No, siamo in otto. Per mia moglie e tanto da fare con i 6 bambini, quindi cerchiamo una casa grande."
      errors: [ce-ci-sono, spelling]
    - tutor: "Sei bambini, che bello! Ma «per mia moglie è tanto da fare»: davanti al verbo manca qualcosa."
      prompt: {text: "e tanto da fare", tags: [ce-ci-sono]}
    - learner: "Per mia moglie è tanto da fare, sì."
      errors: [ce-ci-sono]
    - tutor: "Eh sì, con sei bambini c'è tanto da fare! Le camere sono quattro. E lei che lavoro fa? Per il contratto mi serve sapere quanto guadagna."
      recast: {text: "è tanto da fare", fix: "c'è tanto da fare", tags: [ce-ci-sono]}
    # merlin-1325_9000279-1
    - learner: "Mi chiamo Javier Ruiz, ho 41 anni e lavoro come infermiere da 7 anni."
    - tutor: "Perfetto. Il contratto è di quattro anni, con tre mesi di caparra."
      goals: [contract]
    - learner: "D'accordo. Il riscaldamento come funziona? Con i bambini la casa deve essere calda."
    - tutor: "Funziona benissimo, e la caldaia è nuova: l'ho cambiata l'anno scorso."
      goals: [condition]
      new: [{lemma: caldaia, gloss: boiler}]
    - learner: "E c'è una scuola vicino? Vorremmo che i bambini vanno a piedi."
      errors: [subjunctive-use]
    - tutor: "Ci sono due scuole a cinque minuti. Ma «vorremmo che i bambini vanno»: dopo «vorremmo che», che forma usiamo?"
      prompt: {text: "vanno", tags: [subjunctive-use]}
    - learner: "Vorremmo che i bambini vadano a piedi. Allora mi piace molto, ne parlo con mia moglie stasera."
    - tutor: "Esatto. Benissimo, aspetto la sua telefonata domani."
      goals: [neighbourhood, decide]

- scenario: banca-conto
  level: B1
  persona: es-f-erasmus
  history: [adjective-agreement]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    # merlin-1325_1001011-2
    - learner: "Buongiorno. Sono una studentessa universitaria e vorrei aprire un conto."
    - tutor: "Certo, abbiamo un conto per studenti. Ha con sé un documento?"
      goals: [purpose]
    - learner: "Sì, il passaporto. Serve anche il codice fiscale?"
    - tutor: "Sì, serve anche quello. Se non ce l'ha, lo può chiedere gratis in un ufficio pubblico."
      goals: [documents]
    - learner: "Ce l'ho già. Quanto costa il conto al mese? Non ho molto soldi."
      errors: [adjective-agreement]
    - tutor: "Capisco. Ma «molto soldi»: i soldi sono tanti, quindi «molto» cambia?"
      prompt: {text: "molto soldi", tags: [adjective-agreement]}
    - learner: "Non ho molto soldi, no."
      errors: [adjective-agreement]
    - tutor: "Se non ha molti soldi, nessun problema: per gli studenti il conto è gratis fino a 26 anni."
      recast: {text: "molto soldi", fix: "molti soldi", tags: [adjective-agreement]}
      goals: [costs]
    - learner: "Benissimo. E c'è anche una carta? Posso usare l'app?"
    - tutor: "Sì, la carta arriva a casa in dieci giorni, e l'app è gratis. Mi lascia un numero di telefono?"
      goals: [card]
    # merlin-1365_0100225-8
    - learner: "Il nummero di telefono è 333 - 4567890."
      errors: [spelling]
    - tutor: "Il «nummero»? Ascolti bene: con una «m» o con due?"
      prompt: {text: "nummero", tags: [spelling]}
    - learner: "Con una! Il numero è 333 4567890."
    - tutor: "Perfetto, grazie. Firmi qui, e il conto è aperto."

- scenario: dal-meccanico
  level: B1
  persona: en-f-professional
  history: [past-participle-form]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Quando freno, la macchina fa un rumore strano, come un fischio."
    - tutor: "Un fischio quando frena... Da quando lo sente?"
      goals: [describe]
      new: [{lemma: fischio, gloss: whistle}]
    # merlin-1365_0100227-5
    - learner: "Da lunedì. Ho devuto andare ai mio lavoro alle 8 la mattina e ho sentito il rumore per la prima volta."
      errors: [past-participle-form, articulated-preposition, possessive]
    - tutor: "«Ho devuto»? Controlli bene la forma di «dovere» al passato."
      prompt: {text: "Ho devuto", tags: [past-participle-form]}
    - learner: "Ho dovuto andare al lavoro presto, e ho sentito il rumore."
    - tutor: "Esatto. Allora da lunedì. Probabilmente sono i freni, sono vecchi."
      goals: [when]
    # merlin-1385_0001757-1
    - learner: "Per me è una settimana orribile. Quanto mi costerà?"
    - tutor: "Cambiare i freni costa circa 120 euro, lavoro compreso."
      goals: [cost]
    - learner: "Va bene. E quando sarà pronta? Domani mattina avrò bisogno della macchina."
    - tutor: "Gliela preparo per stasera alle sei, così domani mattina è a posto."
      goals: [time]

- scenario: medico-base
  level: B1
  persona: en-f-professional
  history: [reflexive]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    # merlin-1325_9000750-2
    - learner: "Non dormo e ho sempre mal di testa. Sono stata licenziata, ho divorziato e in più sono arrivati dei problemi con la salute."
    - tutor: "Mi dispiace, sono tanti cambiamenti insieme. Da quanto tempo non dorme bene?"
      goals: [symptoms]
    # merlin-1365_0100265-0
    - learner: "Da circa un mese. Nell'ultimo mese ho studiato molto, perché mi devo superare l'esame di lingua."
      errors: [reflexive]
    - tutor: "Capisco. Ma «mi devo superare l'esame»: quel «mi» qui serve?"
      prompt: {text: "mi devo superare", tags: [reflexive]}
    - learner: "No: devo superare l'esame di lingua."
    - tutor: "Esatto. Studio, stress, cambiamenti: è normale dormire male. Ha preso qualche medicina? È allergica a qualcosa?"
      goals: [since-when]
    - learner: "Ho prenduto una pastiglia per dormire due volte. Non sono allergica."
      errors: [past-participle-form]
    - tutor: "«Ho prenduto»? Pensi bene alla forma di «prendere» al passato: è un po' strana."
      prompt: {text: "Ho prenduto", tags: [past-participle-form]}
    - learner: "Sì, ho prenduto solo due."
      errors: [past-participle-form]
    - tutor: "Va bene, ha preso solo due medicine. Adesso le do delle gocce naturali: quindici la sera, prima di dormire."
      new: [{lemma: goccia, gloss: drop}]
      recast: {text: "prenduto", fix: "preso", tags: [past-participle-form]}
      goals: [history]
    - learner: "Quindici gocce la sera, prima di dormire. Va bene, grazie dottore."
    - tutor: "Esatto. Se tra due settimane dorme ancora male, torni da me."
      goals: [instructions]

- scenario: vicino-rumoroso
  level: B1
  persona: es-f-teacher
  history: [object-pronoun]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, sono Carmen, la vicina del secondo piano."
    - tutor: "Ah, piacere! Mi dica pure."
      goals: [greet]
    # merlin-1365_0100451-3
    - learner: "Come lo sai, faccio una pausa di maternità, sto a casa con la mia piccola figlia."
      errors: [object-pronoun, register]
    - tutor: "Sì, ho visto la bambina, è bellissima! Ma «come lo sai»: quel «lo» ci serve davvero?"
      prompt: {text: "Come lo sai", tags: [object-pronoun]}
    - learner: "Come sa, sto a casa con la bambina. Per me è una settimana orribile: la musica dopo mezzanotte la sveglia sempre."
    - tutor: "Oh, mi dispiace tanto, non lo sapevo! È mio figlio: suona con gli amici."
      goals: [problem]
    - learner: "Potrebbe dirle di finire prima delle dieci?"
      errors: [object-pronoun]
    - tutor: "«Dirle»? Parliamo di mio figlio, un ragazzo: quale pronome ci vuole?"
      prompt: {text: "dirle", tags: [object-pronoun]}
    - learner: "Dirle di finire prima, sì."
      errors: [object-pronoun]
    - tutor: "Certo, posso dirgli di finire prima delle dieci. Facciamo così: musica fino alle dieci, e il sabato fino alle undici?"
      recast: {text: "Dirle", fix: "dirgli", tags: [object-pronoun]}
      goals: [request]
    - learner: "Va bene, è un buon compromesso. Grazie mille, è molto gentile."
    - tutor: "Si figuri, grazie a lei per la pazienza. Buonanotte, e un bacio alla bambina!"
      goals: [compromise]

# B1 real-learner set: comparing jobs with a friend, a team meeting, cooking with a friend.
- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [conditional-form]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    # merlin-1395_0000449-4
    - learner: "Da casa, tre giorni su cinque. Il mio lavoro è un po' noioso, ma il lavoro di Maria è molto interessante."
    - tutor: "Ah, il lavoro degli altri sembra sempre più interessante! E a casa come ti trovi?"
      goals: [situation]
    # merlin-1365_0100270-2
    - learner: "Benissimo! Il mio capo è molto sensibile: posso decidere io l'orario. Anche con il lavoro, tutto va bene."
      errors: [false-friend]
    - tutor: "Che fortuna, un capo molto flessibile! E non c'è proprio nessuno svantaggio?"
      recast: {text: "molto sensibile", fix: "molto flessibile", tags: [false-friend]}
      goals: [pros]
    # merlin-1325_1001113-1
    - learner: "Sì: sono sempre sola. In ufficio farei nuove amicizie, ma per chiacchierare con gli amici mi serverebbe l'italiano ad un livello alto."
      errors: [conditional-form]
    - tutor: "Ma il tuo italiano è ottimo! Però, «mi serverebbe»: pensa all'infinito, «servire». Come fa?"
      prompt: {text: "mi serverebbe", tags: [conditional-form]}
    - learner: "Mi serverebbe un italiano migliore, sì."
      errors: [conditional-form]
    - tutor: "Al massimo ti servirebbe un po' di pratica, e la fai con me! Quindi cosa preferiresti?"
      recast: {text: "serverebbe", fix: "servirebbe", tags: [conditional-form]}
      goals: [cons]
    # merlin-1395_0000391-8
    - learner: "Restare a casa. Sarebbe una buona idea se potremmo rivederci, non pensi? Ogni venerdì, per un aperitivo."
      errors: [hypothetical]
    - tutor: "Bellissima idea! Ma «se potremmo»: dopo questo «se», quale forma del verbo ci vuole?"
      prompt: {text: "se potremmo", tags: [hypothetical]}
    - learner: "Se potessimo rivederci ogni venerdì!"
    - tutor: "Perfetto! Allora casa dal lunedì al giovedì, e il venerdì un bicchiere insieme."
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [comparative]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "In ufficio, tutti i giorni. E il viaggio è molto largo: un'ora in macchina."
      errors: [false-friend]
    - tutor: "Un'ora? Il viaggio è molto lungo, allora! E da casa non puoi lavorare mai?"
      recast: {text: "largo", fix: "lungo", tags: [false-friend]}
      goals: [situation]
    # merlin-1325_1001080-6
    - learner: "No. Ho studiato economiche, così penso che non avrebbe problema con il lavoro da casa."
      errors: [word-choice, conditional-form]
    - tutor: "Ti capisco. Ma «non avrebbe problema»: chi? Parli di te, quindi come cambia il verbo?"
      prompt: {text: "non avrebbe problema", tags: [conditional-form]}
    - learner: "Non avrei problemi! Ma il capo non vuole."
    - tutor: "Esatto. Che peccato! Ma almeno in ufficio c'è qualcosa di bello?"
      goals: [cons]
    - learner: "Sì: i colleghi sono simpatici e il capo è una persona molto educata, anche se non vuole il lavoro da casa."
    - tutor: "Le persone gentili contano tanto. Senti, mia sorella cerca lavoro: nella tua ditta cercano qualcuno?"
      goals: [pros]
    # merlin-1365_0100227-12
    - learner: "Sì! Questa ditta cerca una persona che parla italiano, che sa lavorare col computer e che vuole lavorare per 3 settimane solamente. Ci puoi mandare il suo curriculum."
    - tutor: "Grazie mille, glielo dico subito! E tu, se potessi scegliere, cosa preferiresti?"
    - learner: "Due giorni a casa: sarebbe più comodo che il viaggio ogni giorno."
      errors: [comparative]
    - tutor: "Certo! Ma «più comodo che il viaggio»: davanti a un nome, nel confronto usiamo «che»?"
      prompt: {text: "più comodo che il viaggio", tags: [comparative]}
    - learner: "Più comodo che la macchina, sì."
      errors: [comparative]
    - tutor: "Molto più comodo della macchina tutti i giorni, hai ragione! Prova a chiederlo al capo."
      recast: {text: "comodo che la macchina", fix: "comodo della macchina", tags: [comparative]}
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [hypothetical]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    # merlin-1325_1001050-1
    - learner: "Insegno spagnolo online da casa, tre giorni a settimana. Nel nostro mondo studiare la lingua straniera è molto importante."
    - tutor: "Verissimo! E ti piace insegnare da casa?"
      goals: [situation]
    - learner: "Sì, è più comodo, ma i ragazzi sono meno attenti che in classe."
    - tutor: "Lo immagino, davanti al computer è facile pensare ad altro. E per te, cosa non va?"
      goals: [pros]
    - learner: "Il problema è che non salgo mai di casa: passo il giorno davanti al computer."
      errors: [false-friend]
    - tutor: "Neanch'io esco mai, quando lavoro da casa! Sai che a me piacerebbe lavorare un anno in Spagna?"
      recast: {text: "salgo", fix: "esco", tags: [false-friend]}
      goals: [cons]
    # merlin-1365_0100061-1
    - learner: "Davvero? Mi pare che sia una bella idea se tu venissi qui a Valencia per lavorare."
      errors: [hypothetical]
    - tutor: "Grazie! Ma «mi pare che sia una bella idea, se venissi»: con questo «se», quale forma va nella prima parte?"
      prompt: {text: "sia una bella idea", tags: [hypothetical]}
    - learner: "Sì, sia una bella idea!"
      errors: [hypothetical]
    - tutor: "Sì, sarebbe una bella idea, ci penso davvero! E tu, potendo scegliere, cosa faresti?"
      recast: {text: "sia una bella idea", fix: "sarebbe una bella idea", tags: [hypothetical]}
    # merlin-1325_1001134-13
    - learner: "Preferirei lavorare in una scuola vera, con i colleghi. La vita sarà più facile così."
    - tutor: "Ti capisco, insegnare in classe è un'altra cosa. Speriamo di trovarla presto!"
      goals: [preference]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-professional
  history: [verb-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    # merlin-1365_0100164-4
    - learner: "Abbastanza bene. Ho finito le interviste ai clienti. Domani riceverò i risultati."
    - tutor: "Ottimo! E c'è qualche problema?"
      goals: [update]
    # merlin-1365_0100227-4
    - learner: "Sì. Scusa per le email: io non ho potuto scrivere prima perché ho lavorato tanto. E il cliente cambia sempre idea."
    - tutor: "Capita, con questo cliente! Hai una proposta?"
      goals: [problem]
    - learner: "Proporrebbi una riunione ogni lunedì, così lui decide prima."
      errors: [conditional-form]
    - tutor: "Buona idea! Ma «proporrebbi»: controlla il condizionale di «proporre» con «io»."
      prompt: {text: "Proporrebbi", tags: [conditional-form]}
    - learner: "Proporrei una riunione ogni lunedì!"
    - tutor: "Perfetto, mi piace. Allora entro quando ci mandi il rapporto finale?"
      goals: [proposal]
    # merlin-1365_0100125-8
    - learner: "Entro venerdì. Ma comunque in caso che sento qualcosa ti fai sapere subito."
      errors: [subjunctive-use, verb-form]
    - tutor: "Venerdì va bene. Ma «ti fai sapere»: chi fa sapere? Tu! Allora come cambia il verbo?"
      prompt: {text: "ti fai sapere", tags: [verb-form]}
    - learner: "Ti faccio sapere subito!"
    - tutor: "Esatto. Allora rapporto entro venerdì, e lunedì prima riunione con il cliente."
      goals: [deadline]

- scenario: riunione-lavoro
  level: B1
  persona: es-m-worker
  history: [future-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    # merlin-1365_0100120-9
    - learner: "Male. Cerco un fornitore nuovo: ogni giorno visito tante pagine d'aziende e ho visto troppe offerte di lavoro."
    - tutor: "Cercare su internet è lungo, lo so! E qual è il problema principale?"
      goals: [update]
    - learner: "Il problema è che il nostro fornitore finirà il materiale e consegnarà solo a marzo."
      errors: [future-form]
    - tutor: "Questo è un problema serio. Ma «consegnarà»: controlla il futuro di «consegnare»."
      prompt: {text: "consegnarà", tags: [future-form]}
    - learner: "Consegnarà a marzo, sì."
      errors: [future-form]
    - tutor: "Consegnerà a marzo? È troppo tardi per noi. Hai una proposta?"
      recast: {text: "Consegnarà", fix: "Consegnerà", tags: [future-form]}
      goals: [problem]
    # merlin-1325_1001131-9
    - learner: "Cerco un altro fornitore questa settimana. Se ancora avrei problemi, mi scriverai e proverò aiutarti di più."
      errors: [future-form, preposition]
    - tutor: "Va bene. Ma «se ancora avrei problemi»: parli del futuro, quindi quale forma va dopo «se»?"
      prompt: {text: "avrei problemi", tags: [future-form]}
    - learner: "Se avrò problemi, ti scrivo subito."
    - tutor: "Esatto. Allora mi porti il nome della nuova ditta entro giovedì, d'accordo?"
      goals: [proposal]
    - learner: "D'accordo, entro giovedì avrò il nome."
    - tutor: "Perfetto, grazie! Ne parliamo di nuovo giovedì."
      goals: [deadline]

- scenario: cucina-ricetta
  level: B1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    # merlin-1365_0100461-9
    - learner: "Una tortilla! Al solito preparo un piatto semplice ma se ho tempo (per esempio in fine settimana) e ho tutto ingradiente che necessario, cucino anche cibi italiani."
      errors: [word-choice, article-use, preposition, spelling]
    - tutor: "Di solito anch'io faccio cose semplici! Allora, cosa ci serve per la tortilla?"
      recast: {text: "Al solito", fix: "Di solito", tags: [word-choice]}
    - learner: "Patate, uova, cipolla e olio. Le patate li tagliamo sottili."
      errors: [object-pronoun]
    - tutor: "Facile! Ma «le patate li tagliamo»: le patate sono femminili, allora quel pronome va bene?"
      prompt: {text: "li tagliamo", tags: [object-pronoun]}
    - learner: "Sì, li tagliamo a fette."
      errors: [object-pronoun]
    - tutor: "Ok, le tagliamo a fette. E poi?"
      recast: {text: "li tagliamo", fix: "le tagliamo", tags: [object-pronoun]}
      goals: [ingredients]
    - learner: "Poi friggi le patate nell'olio. Non mettere il fuoco troppo forte: metta il fuoco medio."
      errors: [imperative-form]
    - tutor: "Ricevuto! Ma «metta il fuoco»: parli con me, che sono tua amica. Come lo dici?"
      prompt: {text: "metta il fuoco medio", tags: [imperative-form]}
    # merlin-1365_0100073-5
    - learner: "Metti il fuoco medio! Venti minuti per le patate, poi cinque con le uova. Che ne pensi?"
    - tutor: "Perfetto, venticinque minuti in tutto. E come la serviamo?"
      goals: [steps, time]
    - learner: "Calda o fredda, tagliata a pezzi, con un po' di pane."
    - tutor: "Che fame! Allora la mangiamo fuori, con un bicchiere di vino."
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: en-m-traveller
  history: [imperative-form]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    - learner: "Il curry di mia madre. Ci servono pollo, cipolla, aglio, pomodori e latte di cocco."
    - tutor: "Che buono! E da dove cominciamo?"
      goals: [ingredients]
    - learner: "Prima tagli la cipolla e l'aglio. Poi non bruciarli!"
    - tutor: "Ah ah, ci provo! E dopo?"
    - learner: "Aggiunga il pollo e le spezie, e gira per dieci minuti."
      errors: [imperative-form]
    - tutor: "Va bene. Ma «aggiunga»: parli con me, non con una signora! Come lo dici?"
      prompt: {text: "Aggiunga", tags: [imperative-form]}
    - learner: "Aggiungi il pollo e le spezie! Poi metti i pomodori e il latte."
    - tutor: "Esatto. Quanto tempo deve cuocere?"
      goals: [steps]
    - learner: "Trenta minuti. Non lo cuocere troppo, sennò il pollo diventa secco."
    - tutor: "Benissimo, trenta minuti. E come lo serviamo?"
      goals: [time]
    - learner: "Con il riso bianco. Il riso lo ho già preparato."
      errors: [pronoun-position]
    - tutor: "Che organizzazione! Ma «lo ho preparato»: davanti a «ho», come diventa quel «lo»?"
      prompt: {text: "lo ho", tags: [pronoun-position]}
    - learner: "L'ho già preparato!"
    - tutor: "Perfetto! Allora preparo la tavola, tra mezz'ora si mangia."
      goals: [serve]

- scenario: cucina-ricetta
  level: B1
  persona: en-f-student
  history: [object-pronoun]
  turns:
    - tutor: "Che profumo! Cosa cuciniamo stasera?"
    # merlin-1365_0100299-4
    - learner: "Un piatto della mia festa di cucina internazionale. Da quali paese sono i piatti stasera, secondo te?"
      errors: [noun-number, preposition]
    - tutor: "Ah ah, stasera solo uno! Ma «da quali paese»: «quali» è plurale, e «paese»?"
      prompt: {text: "quali paese", tags: [noun-number]}
    - learner: "Quali paesi! Stasera il piatto è inglese: il crumble di mele."
    - tutor: "Esatto. Che buono! Cosa ci serve?"
    - learner: "Mele, burro, zucchero e farina. Le mele lo tagliamo a pezzi piccoli."
      errors: [object-pronoun]
    - tutor: "Facile! Ma «le mele lo tagliamo»: le mele sono tante e femminili. Quale pronome?"
      prompt: {text: "lo tagliamo", tags: [object-pronoun]}
    - learner: "Le mele li tagliamo a pezzi piccoli."
      errors: [object-pronoun]
    - tutor: "Ok, le tagliamo a pezzi piccoli! E poi?"
      recast: {text: "li tagliamo", fix: "le tagliamo", tags: [object-pronoun]}
      goals: [ingredients]
    - learner: "Mettile in una teglia. Poi mescola burro, zucchero e farina con le mani."
    - tutor: "Con le mani, che bello! E dopo?"
      goals: [steps]
      new: [{lemma: teglia, gloss: baking tray}]
    - learner: "Mettiamo tutto sopra le mele e cuociamo in forno per quaranta minuti."
    - tutor: "Quaranta minuti, perfetto. Si mangia caldo o freddo?"
      goals: [time]
    - learner: "Caldo, con il gelato alla vaniglia. Lo abbiamo comprato ieri."
    - tutor: "Che meraviglia! Allora il gelato lo tiro fuori io alla fine."
      goals: [serve]
      new: [{lemma: meraviglia, gloss: wonder}]

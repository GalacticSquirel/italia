# B1, real learner sentences: advice to friends, a visit to Naples, holidays, Christmas, a trainer, an internship interview.
- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [word-order]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io ho finito gli esami, finalmente!"
    # merlin-1365_0100226-0
    - learner: "Hai superato l'esame con il massimo dei voti."
    - tutor: "Sì, cento su cento! Non ci credo ancora."
    # merlin-1365_0100227-3
    - learner: "Hai fatto una festa?"
    - tutor: "Sì, sabato, con tutti i compagni di classe: abbiamo ballato fino alle quattro!"
    # merlin-1365_0100227-1
    - learner: "Sono veramente contenta per te!"
    - tutor: "Grazie! Sono felice di non avere più esami, almeno per ora."
    # merlin-1365_0100456-3
    - learner: "Anch'io devo fare un esame."
    - tutor: "Ah sì? Di che cosa?"
    # merlin-1325_1001134-6
    - learner: "Ho superato l'esame d'inglese, l'italiano ancora no."
    - tutor: "Brava, vedrai che passi anche questo! Io invece adesso non so cosa fare. Mi piacerebbe partire per un po'..."
    # merlin-1365_0100475-15
    - learner: "Forse hai anche volta di andare all'estero?"
      errors: [word-choice]
      gold: {text: "volta", fix: "voglia"}
    - tutor: "Sì, ho proprio voglia di andare all'estero, magari in Inghilterra, per migliorare l'inglese."
      recast: {text: "volta", fix: "voglia", tags: [word-choice]}
    # merlin-1365_0100217-6
    - learner: "Forse c'è la possibilità per te di lavorare qualche mese alla pari all'estero per mantenere le tue conoscenze linguistiche ed allargare il tuo orizzonte culturale."
    - tutor: "Alla pari, con una famiglia? Non ci avevo pensato! Così ho una casa e imparo la lingua."
    # merlin-1365_0100475-1
    - learner: "Io ho saputo sempre che tu sei molto intelligente."
      errors: [word-order]
      gold: {text: "ho saputo sempre", fix: "ho sempre saputo"}
    - tutor: "«Ho saputo sempre»? Con il passato prossimo, dove mettiamo «sempre»?"
      prompt: {text: "ho saputo sempre", tags: [word-order]}
    - learner: "Ho sempre saputo che sei intelligente! Vedrai che andrà benissimo."
    - tutor: "Esatto. Grazie, sei gentilissima! E tu? Sempre lezioni da casa?"
    # merlin-1365_0100211-0
    - learner: "Mi sembra che tutto vada molto bene per te!"
    - tutor: "Speriamo! Ti scrivo appena trovo una famiglia."
    # merlin-1365_0100218-5
    - learner: "Spero di sentirti presto."
    - tutor: "Certo, a presto! E in bocca al lupo per l'esame d'italiano."

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [preposition]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io invece devo decidere: università o lavoro?"
    # merlin-1365_0100475-0
    - learner: "Penso che tu stia molto bene dopo la maturità."
    - tutor: "Sì, sono felice! E mio zio mi offre un lavoro in campagna per l'estate."
    # merlin-1365_0100212-5
    - learner: "Sarebbe un lavoro molto diverso, così sarà più facile deciderti o per gli studi o per un'altra cosa."
    - tutor: "Hai ragione. E poi d'estate lì c'è sempre bisogno di aiuto."
    # merlin-1365_0100480-4
    - learner: "Conosco che lì si cerca personale."
      errors: [word-choice]
      gold: {text: "Conosco che", fix: "So che"}
    - tutor: "Sì, so che lì si cerca personale, soprattutto per la frutta. Allora l'università la faccio dopo."
      recast: {text: "Conosco che", fix: "So che", tags: [word-choice]}
    # merlin-1365_0100457-1
    - learner: "Dopo gli studi il mondo sarà aperto per te."
    - tutor: "Che bella frase! Allora deciso: estate in campagna e a ottobre l'università."
    # merlin-1365_0100265-7
    - learner: "Spero che rivederci presto!"
      errors: [preposition]
      gold: {text: "Spero che rivederci", fix: "Spero di rivederci"}
    - tutor: "«Spero che» rivederci? Dopo «spero», con un infinito, che parola usiamo?"
      prompt: {text: "Spero che rivederci", tags: [preposition]}
    - learner: "Spero di rivederti presto, allora! Magari vengo a trovarti in campagna."
    - tutor: "Esatto. Vieni quando vuoi, c'è sempre un letto per te!"

- scenario: smartworking
  level: B1
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io ho appena lasciato il lavoro: il capo mi trattava malissimo."
    # merlin-1325_1001041-9
    - learner: "Continua la tua vita precedente come se tutte queste cose non fossero successo."
      errors: [participle-agreement]
      gold: {text: "non fossero successo", fix: "non fossero successe"}
    - tutor: "«Non fossero successo»? Parli di «tutte queste cose»: come deve finire «successo»?"
      prompt: {text: "non fossero successo", tags: [participle-agreement]}
    - learner: "Come se non fossero successe! Dimentica quel capo."
    - tutor: "Esatto. Hai ragione, è inutile pensarci ancora. Ma adesso devo trovare un altro lavoro."
    # merlin-1365_0100120-10
    - learner: "Quindi potrei dirti diversi posti da dove tu potresti cominciare la tua ricerca di lavoro."
    - tutor: "Davvero? Mi aiuteresti tantissimo."
    # merlin-1365_0100231-11
    - learner: "Puoi darmi il tuo curriculum."
    - tutor: "Certo, te lo mando stasera. E tu sei ancora contento di lavorare da casa?"
    # merlin-1365_0100223-6
    - learner: "Sto guardando per trovare un altro posto di lavoro nello stesso dominio."
      errors: [word-choice]
      gold: {text: "nello stesso dominio", fix: "nello stesso settore"}
    - tutor: "Anche tu cerchi un altro posto nello stesso settore? Allora cerchiamo insieme!"
      recast: {text: "nello stesso dominio", fix: "nello stesso settore", tags: [word-choice]}
      new: [{lemma: settore, gloss: field, sector}]
    # merlin-1325_9000185-4
    - learner: "Spero ti servono i miei consigli e spero sentirti!"
      errors: [subjunctive-use, preposition]
      gold: {text: "ti servono", fix: "ti servano"}
    - tutor: "Spero ti «servono»? Dopo «spero», quale modo del verbo usiamo?"
      prompt: {text: "ti servono", tags: [subjunctive-use]}
    - learner: "Spero che ti servano i miei consigli! Ci sentiamo domani."
    - tutor: "Esatto. Mi servono tantissimo, grazie! A domani."

- scenario: consigli-viaggio
  level: B1
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0000533-4
    - learner: "Abbiamo parlato della mia visita, l'ultima volta che ci siamo visti."
    - tutor: "Sì, me lo ricordo! Allora, hai deciso le date?"
    # merlin-1395_0001016-5
    - learner: "Quando possiamo andare a trovarti?"
    - tutor: "Io sono a Napoli da metà luglio a fine agosto. Venite quando volete!"
    # merlin-1395_0001115-5
    - learner: "Che cosa pensi di trovarci fra due settimane per cinque giorni?"
    - tutor: "Fra due settimane? Perfetto, sono già lì!"
      goals: [plans]
    # merlin-1395_0000533-6
    - learner: "Potresti mandarmi una carta della tua città, per favore?"
      errors: [word-choice]
      gold: {text: "una carta", fix: "una cartina"}
    - tutor: "Certo, ti mando una cartina del centro con la mia casa. È facile da trovare."
      recast: {text: "una carta", fix: "una cartina", tags: [word-choice]}
      new: [{lemma: cartina, gloss: map}]
    - learner: "E dalla stazione come arriviamo da te?"
    - tutor: "Prendete la metro, linea uno, e scendete a Toledo. Io abito lì vicino."
      goals: [transport]
    - learner: "Perfetto. E che cosa dobbiamo assolutamente vedere e mangiare?"
    - tutor: "Il centro, il mare a Posillipo e la pizza, naturalmente! Ma non andate nei ristoranti vicino alla stazione."
      goals: [advice, warnings]
    # merlin-1365_0100479-11
    - learner: "Mi piacerebbe vederti nella nostra città."
    - tutor: "Con piacere! In primavera vengo io da voi."
    # merlin-1365_0100073-11
    - learner: "E se trovi tempo, potremo visitare insieme il mio paese."
    - tutor: "Certo, così mi fai vedere dove sei cresciuta!"

- scenario: vacanze-passate
  level: B1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000366-5
    - learner: "In Egitto era meraviglioso: sole, mare."
    - tutor: "In Egitto, che bello! E che cosa avete fatto?"
      goals: [where, weather]
    - learner: "Abbiamo visto le piramidi. La sera prima eravamo molto eccitati e non abbiamo dormito."
      errors: [false-friend]
      gold: {text: "eccitati", fix: "emozionati"}
    - tutor: "Eravate emozionati, certo: le piramidi non si vedono tutti i giorni! E la tua famiglia come sta?"
      recast: {text: "eccitati", fix: "emozionati", tags: [false-friend]}
      new: [{lemma: emozionato, gloss: excited}]
      goals: [activities, best]
    # merlin-1395_0000398-1
    - learner: "Anche la mia famiglia sta bene."
    - tutor: "Che bello. Salutali tanto da parte mia!"
    # merlin-1395_0000365-7
    - learner: "Tu invece come stai?"
    - tutor: "Io bene, ma quest'anno niente vacanze: la prossima volta vengo con voi!"

- scenario: tradizioni-feste
  level: B1
  persona: es-m-worker
  history: [conditional-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! Il 26 venite a pranzo da noi, tu e tua moglie?"
    # merlin-1365_0100136-4
    - learner: "Per fortuna non devo lavorare in dicembre, per questo ho la possibilità di venire."
    - tutor: "Che bello! E tua moglie?"
    # merlin-1365_0100204-1
    - learner: "Con piacere vi confermo questo appuntamento per la vostra festa."
    - tutor: "Perfetto, allora siamo d'accordo! Ci divertiremo."
    # merlin-1365_0100094-7
    - learner: "Ancora una volta grazie mille per l'invitazione e una buona festa!"
      errors: [word-choice]
      gold: {text: "l'invitazione", fix: "l'invito"}
    - tutor: "Figurati, l'invito è un piacere per noi! Ma dimmi: da voi in Spagna come si festeggia?"
      recast: {text: "l'invitazione", fix: "l'invito", tags: [word-choice]}
    - learner: "Mangiamo il torrone e la sera del 24 tutta la famiglia cena insieme, fino a tardi."
    - tutor: "Il torrone c'è anche da noi! E la sera del 24 si mangia pesce."
      goals: [compare]
    # merlin-1365_0100133-4
    - learner: "Vorrei festeggiare con voi due. Ma vi devo chiedere qualche cosa sulla festa."
    - tutor: "Chiedi pure!"
    # merlin-1365_0100215-3
    - learner: "Vorremo volentieri farci un regalo."
      errors: [conditional-form, object-pronoun]
      gold: {text: "Vorremo", fix: "Vorremmo"}
    - tutor: "«Vorremo»? È un desiderio gentile: che forma del verbo ci vuole?"
      prompt: {text: "Vorremo", tags: [conditional-form]}
    - learner: "Vorremmo farvi un regalo. Che cosa vi serve?"
    - tutor: "Esatto, ma non serve niente! Portate solo un dolce spagnolo, se volete."
      goals: [plan]

- scenario: salute-stile-vita
  level: B1
  persona: es-f-erasmus
  history: [object-pronoun]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    # merlin-1395_0001145-5
    - learner: "Quando abbiamo del tempo libero lo passiamo in modo attivo; preferiamo visitare le chiese, i monumenti, camminare lungo le piazze, guardare le fontane, le mostre nei musei."
    - tutor: "Camminare tanto è già un ottimo inizio! E che cosa mangi di solito?"
    # merlin-1325_1001083-6
    - learner: "Mi piacciono i frutti e mi piace anche la carne."
      errors: [word-choice]
      gold: {text: "i frutti", fix: "la frutta"}
    - tutor: "La frutta è perfetta, e la carne va bene due o tre volte alla settimana. Cucini tu?"
      recast: {text: "i frutti", fix: "la frutta", tags: [word-choice]}
      goals: [habits]
    # merlin-1365_0100461-6
    - learner: "La preparazione di questi cibi è molto semplice e per questo mangio spesso."
      errors: [object-pronoun]
      gold: {text: "per questo mangio spesso", fix: "per questo li mangio spesso"}
    - tutor: "Per questo «mangio» spesso? Mangi che cosa? Manca una piccola parola."
      prompt: {text: "per questo mangio spesso", tags: [object-pronoun]}
    - learner: "Per questo li mangio spesso."
    - tutor: "Esatto. Brava! E qual è il tuo obiettivo con me?"
    - learner: "Vorrei correre dieci chilometri senza fermarmi entro l'estate, ma studio e lavoro, quindi la sera sono sempre stanchissima."
    - tutor: "Un bell'obiettivo, e ti capisco. Allora facciamo tre corse brevi alla settimana, la mattina presto, da trenta minuti."
      goals: [goal, obstacles]
    # merlin-1365_0100148-10
    - learner: "Non vedo l'ora!"
    - tutor: "Così mi piace! Allora lunedì alle sette al parco."
      goals: [plan]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001133-0
    - learner: "Desidero sottoporre alla Vostra attenzione la mia candidatura."
    - tutor: "Certo, l'abbiamo letta con interesse. Mi parli della sua esperienza."
      goals: [intro]
    # merlin-1325_1001169-4
    - learner: "Invece in Italia finora non avevo la possibilità di lavorare in un ufficio come stagista."
      errors: [tense-aspect]
      gold: {text: "finora non avevo la possibilità", fix: "finora non ho avuto la possibilità"}
    - tutor: "«Finora non avevo»? Con «finora» parli di un periodo che arriva fino a oggi: che tempo usi?"
      prompt: {text: "finora non avevo la possibilità", tags: [tense-aspect]}
    - learner: "Finora non ho avuto la possibilità di lavorare in un ufficio italiano, ma a Londra sì, per due anni."
    - tutor: "Esatto. Due anni a Londra sono già un buon inizio. Qual è il suo punto di forza?"
      goals: [experience]
    - learner: "Sono molto organizzata e non perdo mai la calma, anche quando c'è tanto lavoro."
    - tutor: "Ottimo. E perché ha scelto proprio noi?"
      goals: [strengths]
    # merlin-1325_1001080-1
    - learner: "Ho letto il loro annunzio e ho visto che cercano una assistente."
    - tutor: "Esatto, ci serve proprio un'assistente per l'ufficio. Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001093-12
    - learner: "Vorrei sapere quanti mesi intende il contratto"
      errors: [word-choice]
      gold: {text: "intende", fix: "dura"}
    - tutor: "Il contratto dura sei mesi, poi si può continuare."
      recast: {text: "intende", fix: "dura", tags: [word-choice]}
      goals: [questions]
    # merlin-1325_1001154-8
    - learner: "Spero pertanto che vorrete considerare la mia candidatura."
    - tutor: "Certamente. Le faremo sapere entro due settimane. Grazie e arrivederci!"

# B1, real learner sentences: back from holiday, tips for Naples, a train ticket.
- scenario: vacanze-passate
  level: B1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100073-0
    - learner: "Alcuni giorni fa sono tornata delle mie vacanze."
      errors: [articulated-preposition]
      gold: {text: "delle mie vacanze", fix: "dalle mie vacanze"}
    - tutor: "Sei tornata «delle mie vacanze»? Pensa a da dove torni: quale preposizione ci vuole?"
      prompt: {text: "delle mie vacanze", tags: [articulated-preposition]}
    - learner: "Sono tornata dalle vacanze sabato sera, stanchissima!"
    - tutor: "Esatto. Stanca ma felice, spero! E dove sei stata?"
    # merlin-1395_0000513-6
    - learner: "Siamo andati in Sicilia per le vacanze; hai ricevuto la cartolina?"
    - tutor: "Sì, è arrivata ieri ed è bellissima! E com'era il tempo?"
      goals: [where]
    # merlin-1395_0000388-6
    - learner: "Era bellissimo, il tempo, il mare, tutto!"
    - tutor: "Che fortuna, qui ha piovuto quasi tutto agosto. Siete rimasti sempre a Palermo?"
      goals: [weather]
    # merlin-1395_0000388-5
    - learner: "In ogni posto una settimana."
    - tutor: "Ah, una settimana a Palermo e una a Siracusa, allora. Che cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il mercato di Palermo e il mare di Siracusa: l'acqua era trasparente!"
    - tutor: "Mi hai fatto venire voglia di partire! Mi fai vedere le foto?"
      goals: [best]
    # merlin-1395_0000388-7
    - learner: "Ti ho portato qualche regalino, per questo ci dobbiamo vedere al più presto."
    - tutor: "Che carina! Allora vieni a cena da me venerdì, così mi racconti tutto con calma."

- scenario: vacanze-passate
  level: B1
  persona: en-m-heritage
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000557-4
    - learner: "Quest'estate siamo stati in Italia sul lago di Garda."
    - tutor: "Il Garda, che bello! E come ci siete arrivati?"
      goals: [where]
    # merlin-1395_0000557-6
    - learner: "Siamo andati con la motocicletta."
    - tutor: "In moto fino al lago, che bello! E il tempo com'era?"
    # merlin-1325_1001020-8
    - learner: "Abbiamo preso il sole ma il sole ha scalduto molto forte e non c'era ombrelloni."
      errors: [past-participle-form, tense-aspect, ce-ci-sono]
      gold: {text: "ha scalduto", fix: "scaldava"}
    - tutor: "Il sole «ha scalduto»? Stai descrivendo com'era il tempo: quale tempo del verbo usi?"
      prompt: {text: "ha scalduto", tags: [tense-aspect]}
    - learner: "Il sole scaldava molto forte e non c'erano ombrelloni."
    - tutor: "Esatto. Senza ombrellone, poveri voi! E che cosa avete fatto, oltre a prendere il sole?"
      goals: [weather]
    - learner: "Abbiamo fatto il giro del lago in barca e abbiamo preso tante foto di Sirmione."
      errors: [word-choice]
      gold: {text: "preso", fix: "fatto"}
    - tutor: "Avete fatto tante foto di Sirmione? È bellissima! Ti è piaciuta?"
      recast: {text: "preso", fix: "fatto", tags: [word-choice]}
      goals: [activities]
    # merlin-1395_0000514-4
    - learner: "La città è molto bella, ma troppo turistica secondo me."
    - tutor: "È vero, d'estate è pienissima. E la cosa più bella? Il giro in barca?"
    # merlin-1365_0100455-4
    - learner: "Era una esperienza molto interessante."
    - tutor: "Lo immagino, il lago visto dall'acqua è un'altra cosa. La prossima volta vengo anch'io!"
      goals: [best]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1365_0100223-3
    - learner: "Non ho avuto vacanze, sono andato a Parigi per la prima volta solo per 3 giorni."
    - tutor: "Solo tre giorni, peccato! Ma la prima volta a Parigi è speciale. Ti è piaciuta?"
      goals: [where]
    # merlin-1325_1001051-9
    - learner: "Mi è piaciuta tanto."
    - tutor: "Lo immagino! E il tempo?"
    - learner: "Il primo giorno è piovuto tanto, poi è uscito il sole."
    - tutor: "Meno male! E hai dormito da quel signore che affitta le camere a Montmartre? Com'era?"
      goals: [weather]
    # merlin-1395_0000443-4
    - learner: "È un signore di buon umore con i capelli grigi."
    - tutor: "Che bello trovare persone così. E che cosa hai visto?"
    - learner: "Ho visto tanti musei: ho visitato quattro in tre giorni!"
      errors: [ci-ne]
      gold: {text: "ho visitato quattro", fix: "ne ho visitati quattro"}
    - tutor: "«Ho visitato quattro»? Quattro musei: come lo dici senza ripetere «musei»?"
      prompt: {text: "ho visitato quattro", tags: [ci-ne]}
    - learner: "Ne ho visitati quattro, anche il Louvre!"
    - tutor: "Esatto! Quattro musei in tre giorni, che coraggio. E i tuoi, invece, sono andati via?"
      goals: [activities]
    # merlin-1395_0000398-2
    - learner: "I miei genitori sono andati in vacanza per due settimane, che fortuna che hanno."
    - tutor: "Che fortuna davvero! La prossima volta vai con loro, e per più di tre giorni!"

- scenario: vacanze-passate
  level: B1
  persona: es-f-teacher
  history: [participle-agreement]
  turns:
    - tutor: "Ciao! Raccontami tutto: ho visto le tue foto di Venezia!"
    # merlin-1325_1001008-0
    - learner: "Ci sono stata con il mio fidanzato per due settimane."
    - tutor: "Due settimane a Venezia, che fortuna! Che tempo avete trovato?"
      goals: [where]
    - learner: "Faceva caldo e le giornate erano molto larghe, ma un giorno c'era l'acqua alta in piazza San Marco!"
      errors: [false-friend]
      gold: {text: "larghe", fix: "lunghe"}
    - tutor: "Le giornate lunghe d'estate sono bellissime! Ma l'acqua alta d'estate, che strano! E che cosa avete visto?"
      recast: {text: "larghe", fix: "lunghe", tags: [false-friend]}
      goals: [weather]
    # merlin-1395_0001073-4
    - learner: "Ci sono molte cose da vedere: la laguna, le chiese, le piazze, i quartieri etc."
    - tutor: "Sì, due settimane non bastano mai. Siete andati anche in gondola?"
      new: [{lemma: gondola, gloss: gondola}]
      goals: [activities]
    - learner: "Sì, ma la gondola era carissima, quindi l'abbiamo preso solo una volta."
      errors: [participle-agreement]
      gold: {text: "l'abbiamo preso", fix: "l'abbiamo presa"}
    - tutor: "«L'abbiamo preso»? Parli della gondola: come deve finire «preso»?"
      prompt: {text: "l'abbiamo preso", tags: [participle-agreement]}
    - learner: "L'abbiamo presa solo una volta, l'ultima sera."
    - tutor: "Esatto. L'ultima sera, che romantico! Ah, ho visto anche l'anello nella foto..."
    # merlin-1365_0100281-5
    - learner: "Che bella sorpresa per me!"
    - tutor: "Quindi te l'ha chiesto quella sera? Allora è stato quello il momento più bello! Congratulazioni a tutti e due!"
      goals: [best]

- scenario: consigli-viaggio
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0001070-7
    - learner: "Spero di vederti in ottobre a Napoli."
    - tutor: "Sì, a ottobre sono a Napoli dai miei! Se vuoi, puoi dormire da noi."
      goals: [plans]
    # merlin-1395_0001132-3
    - learner: "per quanto potrei rimanerci?"
    - tutor: "Quanto vuoi! Mia madre sarà felicissima di avere un'ospite."
    # merlin-1395_0000533-5
    - learner: "Allora, per organizzare il mio viaggio, ho bisogno di sapere come posso arrivare a casa tua."
    - tutor: "Dall'aeroporto prendi l'autobus fino alla stazione, poi la metro fino al Vomero. È facile!"
      goals: [transport]
    # merlin-1395_0001115-7
    - learner: "Hai una idea che ancora potremmo fare?"
    - tutor: "Certo! Andiamo a Pompei e poi a mangiare la pizza più buona del mondo in centro."
      goals: [advice]
    - learner: "Perfetto! Ho sentito che in metro ci sono molti ladri: è vero che ci sono tanti?"
      errors: [ci-ne]
      gold: {text: "ci sono tanti", fix: "ce ne sono tanti"}
    - tutor: "«Ci sono tanti»? Tanti ladri: come lo dici senza ripetere «ladri»?"
      prompt: {text: "ci sono tanti", tags: [ci-ne]}
    - learner: "È vero che ce ne sono tanti?"
    - tutor: "Esatto. Non più che in altre città, ma tieni sempre la borsa davanti a te e non lasciare il telefono sul tavolo."
      goals: [warnings]
    # merlin-1365_0100226-12
    - learner: "Non vedo l'ora di rivederti."
    - tutor: "Anch'io! Allora ci vediamo a ottobre."

- scenario: consigli-viaggio
  level: B1
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    # merlin-1395_0001016-2
    - learner: "Carmen, Lucía ed io vogliamo andare a trovarti!"
    - tutor: "Davvero? Che bello, tutti e tre! Quando arrivate?"
    - learner: "A fine maggio, per cinque giorni. Io ci sono già stato due anni fa."
    - tutor: "Ah, è vero! Eri venuto per studiare, giusto?"
      goals: [plans]
    # merlin-1365_0100192-3
    - learner: "Ci ho fatto due corsi di lingua e cultura i quali ho trovato molto utili ed interessanti."
      errors: [relative-pronoun]
      gold: {text: "i quali", fix: "che"}
    - tutor: "Due corsi «i quali» ho trovato utili? Qui basta una parola più semplice: quale?"
      prompt: {text: "i quali", tags: [relative-pronoun]}
    - learner: "Due corsi che ho trovato molto utili, e lì ho conosciuto te!"
    - tutor: "Esatto, che ricordi! E questa volta dove dormite?"
    # merlin-1365_0100258-3
    - learner: "Ho prenotato una camera in albergo."
    - tutor: "Bene. Cosa volete fare, questa volta?"
    - learner: "Che cosa ci consigli di vedere, oltre al centro?"
    - tutor: "Vi consiglio Procida: è un'isola piccola e bellissima. Ci arrivate con la nave dal porto di Napoli, in un'ora circa."
      goals: [advice, transport]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Allora, quando parti per Napoli?"
    - learner: "Il quindici giugno! È la prima volta che vado al Sud."
    - tutor: "Che emozione! Ti piacerà da morire."
      goals: [plans]
    # merlin-1395_0001016-0
    - learner: "Com'è la tua città?"
    - tutor: "Piena di gente e bellissima! È viva giorno e notte."
    # merlin-1395_0001158-5
    - learner: "È grande la tua città"
    - tutor: "Abbastanza: quasi un milione di persone, e con i paesi vicini molte di più."
    - learner: "Allora come mi muovo? Prendo una macchina?"
    - tutor: "No, meglio di no! Il traffico è terribile: usa la metro e cammina tanto."
      goals: [transport]
    - learner: "E i Quartieri Spagnoli? Posso andarli da solo la sera?"
      errors: [ci-ne]
      gold: {text: "andarli", fix: "andarci"}
    - tutor: "«Andarli»? Parli di un posto: quale piccola parola ti serve per dire «lì»?"
      prompt: {text: "andarli", tags: [ci-ne]}
    - learner: "Posso andarci da solo la sera?"
    - tutor: "Esatto. Sì, ma resta nelle strade con tanta gente e non mostrare troppo il telefono. E mangia tanti dolci!"
      goals: [warnings, advice]
    # merlin-1395_0001016-7
    - learner: "Come sta la tua famiglia?"
    - tutor: "Benissimo, grazie! Mia nonna ti aspetta per il pranzo della domenica."

- scenario: biglietto-treno
  level: B1
  persona: es-f-teacher
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, dove deve andare?"
    # merlin-1325_1001023-9
    - learner: "Allora se c'è possibilità voglio andare dalle 3 agosto alle 13 agosto."
      errors: [article-use, articulated-preposition]
      gold: {text: "dalle 3 agosto alle 13 agosto", fix: "dal 3 agosto al 13 agosto"}
    - tutor: "«Dalle» 3 agosto «alle» 13? Parli di giorni, non di ore: come cambiano le preposizioni?"
      prompt: {text: "dalle 3 agosto alle 13 agosto", tags: [articulated-preposition]}
    - learner: "Dal 3 agosto al 13 agosto, a Lecce."
    - tutor: "Esatto. Quindi andata e ritorno per Lecce. Per quante persone?"
      goals: [destination, type]
    # merlin-1325_1001079-1
    - learner: "Ho 30 anni, sono sposata, ho 5 figli."
    - tutor: "Allora c'è l'offerta per le famiglie: i bambini sotto i dodici anni non pagano. Prima o seconda classe?"
    - learner: "Seconda classe, ma vorrei i posti tutti vicini, per favore. E sa già da quale binario parte il treno?"
    - tutor: "Nessun problema, vi metto tutti insieme. Di solito parte dal binario quattro, ma lo controlli in stazione il giorno della partenza. Buon viaggio!"
      goals: [class, platform]

# B1, real learner sentences: comparing jobs with a friend, team meetings, a bank account.
- scenario: smartworking
  level: B1
  persona: en-f-student
  history: [future-form]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io ho trovato lavoro in banca, comincio lunedì!"
    # merlin-1365_0100139-0
    - learner: "Che bella notizia!"
    - tutor: "Sì! E con i primi soldi cerco una casa tutta mia."
    # merlin-1365_0100178-6
    - learner: "So, che fra poco, avresti un proprio appartamento."
      errors: [future-form]
      gold: {text: "avresti", fix: "avrai"}
    - tutor: "«Avresti»? È una cosa sicura, che succederà presto: che tempo usi?"
      prompt: {text: "avresti", tags: [future-form]}
    - learner: "So che fra poco avrai un appartamento tutto tuo!"
    - tutor: "Esatto. Speriamo presto! Per ora però dormo ancora dai miei."
    # merlin-1365_0100227-14
    - learner: "Potresti stare con noi!"
    - tutor: "Sei gentilissima, ma siete già in quattro in casa! E tu, sempre in ufficio?"
    - learner: "No, adesso lavoro da casa tre giorni: è più comodo, ma esco poco."
    - tutor: "Allora sabato usciamo insieme a festeggiare il mio nuovo lavoro!"
      goals: [situation, pros, cons]
    # merlin-1365_0100211-13
    - learner: "Magari... Spero veramente di sentirti presto."
    - tutor: "Ti chiamo domani, promesso!"

- scenario: smartworking
  level: B1
  persona: en-m-heritage
  history: [conditional-form]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io sto cercando un lavoro nuovo, sai?"
    # merlin-1365_0100061-4
    - learner: "Dato che io lavoro dall'ufficio di collocamento, spero di trovare un bel posto per te!"
      errors: [articulated-preposition]
      gold: {text: "dall'ufficio", fix: "all'ufficio"}
    - tutor: "Lavori «dall'ufficio» di collocamento? Ci vai ogni giorno, quindi quale preposizione serve?"
      prompt: {text: "dall'ufficio", tags: [articulated-preposition]}
    - learner: "Lavoro all'ufficio di collocamento, in centro. Ci vado tutti i giorni, niente lavoro da casa."
    - tutor: "Esatto. Allora sei proprio la persona giusta! E come ti trovi con i colleghi?"
      goals: [situation]
    # merlin-1365_0100456-9
    - learner: "Sono molto simpatici."
    - tutor: "Che fortuna, è la cosa più importante. E c'è qualcosa che non va?"
      goals: [pros]
    - learner: "Lo stipendio è basso e c'è sempre tanta gente che aspetta."
    - tutor: "Eh, lo immagino. E secondo te, io da dove dovrei cominciare?"
      goals: [cons]
    # merlin-1365_0100121-6
    - learner: "Se cercassi un lavoro in Lombardia, ti consigliarei cominciare presto per trovare un posto per l'estate."
      errors: [conditional-form, preposition]
      gold: {text: "consigliarei", fix: "consiglierei"}
    - tutor: "«Consigliarei»? Controlla bene il condizionale di «consigliare»."
      prompt: {text: "consigliarei", tags: [conditional-form]}
    - learner: "Ti consiglierei di cominciare presto, perché d'estate cercano tante persone."
    - tutor: "Esatto, grazie del consiglio! E tu, se potessi, resteresti lì o cambieresti?"
    - learner: "Resterei lì, ma preferirei lavorare da casa almeno un giorno alla settimana."
    - tutor: "Una richiesta giusta. Magari il tuo capo ti dice di sì!"
      goals: [preference]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [comparative]
  turns:
    - tutor: "Ciao! Tu lavori ancora da casa o vai in ufficio? Io ho appena lasciato l'albergo e cerco un altro lavoro."
    - learner: "Io lavoro da casa il lunedì e il venerdì. Ma tu, che lavoro cerchi?"
    - tutor: "Sempre in un albergo, credo: è quello che so fare."
      goals: [situation]
    # merlin-1365_0100269-5
    - learner: "Mi hai detto che hai lavorato in un albergo e per questo penso che trovare il lavoro per te non sarà difficile."
    - tutor: "Speriamo! Però adesso in città gli alberghi sembrano tutti al completo."
    # merlin-1365_0100121-7
    - learner: "Da maggio arrivano i turisti e gli alberghi cercano adesso personale."
    - tutor: "Hai ragione, è il momento giusto per cercare. Ma dimmi di te: ti piace lavorare da casa?"
    - learner: "Sì, a casa sono più tranquilla e lavoro più bene."
      errors: [comparative]
      gold: {text: "più bene", fix: "meglio"}
    - tutor: "Lavori «più bene»? In italiano c'è una parola sola per dirlo."
      prompt: {text: "più bene", tags: [comparative]}
    - learner: "Lavoro meglio, perché nessuno mi disturba."
    - tutor: "Esatto! E non c'è niente che ti manca dell'ufficio?"
      goals: [pros]
    - learner: "Mi mancano i colleghi, quindi preferisco andare in ufficio almeno due giorni."
    - tutor: "Giusto, un po' e un po'. Grazie dei consigli: stasera scrivo a tutti gli alberghi!"
      goals: [cons, preference]

- scenario: consigli-viaggio
  level: B1
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Pronto? Ah, che bella sorpresa! Mi hanno detto che tu e tua moglie tornate in Italia a maggio. Passate anche da Lecce?"
    # merlin-1395_0000518-0
    - learner: "Ciao Francesco, come stai?"
    - tutor: "Benissimo, grazie! E voi come state?"
    # merlin-1395_0001070-1
    - learner: "Noi stiamo molto bene."
    - tutor: "Mi fa piacere! Allora, è vero? Venite anche qui da noi?"
      goals: [plans]
    # merlin-1395_0001145-8
    - learner: "Vorremmo incontrarci con voi!"
    - tutor: "Che bello! Allora il primo sabato venite a cena da noi. E poi che cosa volete fare?"
      goals: [plans]
    - learner: "Ci piacerebbe vedere il mare e qualche paese piccolo. Che cosa ci consigli?"
    - tutor: "Andate a Otranto: è a quaranta minuti da Lecce e il mare è bellissimo."
      goals: [advice]
    - learner: "Prendiamo il treno o è meglio una macchina?"
    - tutor: "Meglio la macchina: la domenica i treni quasi non ci sono. E attenzione ai parcheggi in centro, costano tanto! Anna è felicissima di rivedervi."
      goals: [transport, warnings]
    # merlin-1365_0100282-1
    - learner: "È da molto tempo che non ci vediamo."
    - tutor: "Quasi cinque anni, ti rendi conto? Abbiamo tante cose da raccontarci!"
    # merlin-1365_0100139-6
    - learner: "Forse avremo il tempo per parlare durante la cena."
    - tutor: "Certo, e anche dopo: da noi la cena finisce sempre molto tardi!"
    # merlin-1395_0000649-6
    - learner: "Non vedo l'ora"
    - tutor: "Anch'io! Salutami tanto tua moglie, a presto!"

- scenario: riunione-lavoro
  level: B1
  persona: es-m-worker
  history: [conditional-form]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    # merlin-1365_0100456-8
    - learner: "Nella nostra sezione due nuovi collaboratori hanno cominciato il loro lavoro."
    - tutor: "Sì, li ho conosciuti stamattina. E il sito per il cliente di Parma a che punto è?"
    - learner: "È quasi finito, ma il cliente ha cambiato la sua mente due volte sui colori."
      errors: [word-choice]
      gold: {text: "ha cambiato la sua mente", fix: "ha cambiato idea"}
    - tutor: "Il cliente ha cambiato idea due volte? E questo vi ha creato problemi?"
      recast: {text: "ha cambiato la sua mente", fix: "ha cambiato idea", tags: [word-choice]}
      goals: [update]
    # merlin-1325_1001008-5
    - learner: "Quando abbiamo chiesto aiuto non abbiamo trovato una sola persona per risolverlo."
    - tutor: "Mi dispiace, ad agosto mezzo ufficio era in vacanza. Che cosa proponi adesso?"
      goals: [problem]
    - learner: "Potrebbiamo chiedere ai nuovi colleghi di aiutarci con i testi."
      errors: [conditional-form]
      gold: {text: "Potrebbiamo", fix: "Potremmo"}
    - tutor: "«Potrebbiamo»? Controlla bene il condizionale di «potere» con «noi»."
      prompt: {text: "Potrebbiamo", tags: [conditional-form]}
    - learner: "Potremmo chiedere ai nuovi colleghi di aiutarci con i testi."
    - tutor: "Perfetto, mi sembra un'ottima idea. Così per quando pensi di finire?"
      goals: [proposal]
    # merlin-1365_0100461-11
    - learner: "Adesso devo finire scrivere."
      errors: [preposition]
      gold: {text: "finire scrivere", fix: "finire di scrivere"}
    - tutor: "Devi «finire scrivere»? Tra «finire» e l'infinito manca una piccola parola."
      prompt: {text: "finire scrivere", tags: [preposition]}
    - learner: "Devo finire di scrivere le pagine dei prodotti, poi in due giorni è pronto."
    - tutor: "Bene, allora diciamo giovedì prossimo. Lo scrivo subito per tutti."
      goals: [deadline]

- scenario: riunione-lavoro
  level: B1
  persona: en-f-student
  history: [adjective-agreement]
  turns:
    - tutor: "Bene, iniziamo. Allora, come va il tuo progetto?"
    - learner: "Bene, ho finito le tabelle per il nuovo cliente e adesso controllo i numeri."
    - tutor: "Ottimo. Come ti trovi con il lavoro, dopo il primo mese?"
      goals: [update]
    # merlin-1325_1001092-4
    - learner: "E io uso molto programmi informatici."
      errors: [adjective-agreement]
      gold: {text: "molto programmi", fix: "molti programmi"}
    - tutor: "«Molto programmi»? Qui «molto» va con un nome plurale: come cambia?"
      prompt: {text: "molto programmi", tags: [adjective-agreement]}
    - learner: "Molto programmi diversi, sì, e alcuni sono vecchi."
      errors: [adjective-agreement]
    - tutor: "Molti programmi diversi, sì, e qualcuno ha davvero dieci anni! È questo il problema?"
      recast: {text: "Molto programmi", fix: "Molti programmi", tags: [adjective-agreement]}
    - learner: "Sì, il programma per le fatture è molto lento e a volte si blocca."
    - tutor: "Lo so, si lamentano tutti. Hai un'idea?"
      goals: [problem]
    - learner: "Si potrebbe provare la versione nuova per un mese, solo nel nostro gruppo."
    - tutor: "Mi piace, così vediamo se funziona prima di cambiare per tutti. Quando potresti cominciare?"
      goals: [proposal]
    # merlin-1325_9000676-5
    - learner: "Il termine non ha importanza."
    - tutor: "Allora facciamo dal primo del mese: così abbiamo due settimane per prepararla."
      goals: [deadline]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Ciao! Scusa se ti scrivo solo adesso, è stato un mese un po' difficile."
    # merlin-1365_0100069-0
    - learner: "Sono molto felice da sentire da te."
      errors: [preposition]
      gold: {text: "felice da sentire da te", fix: "felice di sentire di te"}
    - tutor: "Felice «da» sentire? Dopo «felice», quale preposizione ci vuole?"
      prompt: {text: "felice da sentire da te", tags: [preposition]}
    - learner: "Sono molto felice di sentire di te!"
    - tutor: "Esatto. Anch'io! E tu come stai?"
    # merlin-1395_0000360-1
    - learner: "Io sto bene."
    - tutor: "Io un po' meno: la mia ditta ha chiuso l'ufficio e adesso lavoriamo tutti da casa, sempre. Tu invece come fai?"
      goals: [situation]
    - learner: "Io lavoro da casa due giorni e vado in ufficio tre, così vedo i colleghi."
    - tutor: "Che fortuna! All'inizio ero contento, ma ora mi sento solo e lavoro fino a tardi."
      goals: [pros, cons]
    # merlin-1325_1001128-7
    - learner: "Secondo me potresti fare la stessa cosa."
    - tutor: "Magari! Ma il capo vuole risparmiare sull'ufficio, quindi non credo."
    - learner: "Allora perché non cambi lavoro? Nella mia ditta cercano qualcuno per il sito internet."
    - tutor: "Davvero? Preferirei proprio un lavoro come il tuo, un po' a casa e un po' in ufficio!"
      goals: [preference]
    # merlin-1365_0100277-10
    - learner: "Mandami il tuo curriculum - ma subito!"
    - tutor: "Va bene, va bene, stasera te lo mando! Grazie mille."

- scenario: banca-conto
  level: B1
  persona: en-f-professional
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Mi sono trasferita a Genova per lavoro e vorrei aprire un account."
      errors: [word-choice]
      gold: {text: "un account", fix: "un conto"}
    - tutor: "Benvenuta! Aprire un conto è semplice: le spiego in breve come funziona, va bene?"
      recast: {text: "un account", fix: "un conto", tags: [word-choice]}
      goals: [purpose]
    # merlin-1325_1001023-8
    - learner: "Mi scusi, ma devo sapere tutto"
    - tutor: "Certo, ha ragione, le spiego tutto con calma. Prima di tutto, ha un documento e il codice fiscale?"
    - learner: "Ho il passaporto e il codice fiscale, ma non ho ancora la residenza."
    - tutor: "Non è un problema: per ora basta il contratto di lavoro."
      goals: [documents]
    - learner: "Va bene. E quanto costa il conto al mese? Posso avere anche una carta per pagare nei negozi?"
    - tutor: "Il conto costa tre euro al mese, ma se riceve qui i soldi del lavoro è gratis. E la carta di debito è compresa."
      goals: [costs, card]

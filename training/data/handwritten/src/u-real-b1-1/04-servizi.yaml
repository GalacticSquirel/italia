# B1, real learner sentences: a hotel without entertainment, a wedding announced at Christmas, a reunion, volunteering, a table, a flat, the doctor, a specialist.
- scenario: reclamo-hotel
  level: B1
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Sì. Sul vostro sito c'erano serate di musica e giochi, ma qui non c'è niente."
    - tutor: "Ha ragione, il gruppo che organizzava le serate è partito la settimana scorsa."
      goals: [problem]
    # merlin-1325_1001008-8
    - learner: "Una altra mancezza era l'équipe di animazione."
      errors: [word-choice]
      gold: {text: "mancezza", fix: "mancanza"}
    - tutor: "Sì, è una mancanza grave, mi scusi. Da quanti giorni è qui da noi?"
      recast: {text: "mancezza", fix: "mancanza", tags: [word-choice]}
      new: [{lemma: mancanza, gloss: lack, shortcoming}]
    - learner: "Da sabato, e resto fino a domenica prossima."
    - tutor: "Quindi una settimana intera senza serate. Capisco perché è arrabbiato."
      goals: [since]
    # merlin-1325_9000316-22
    - learner: "Il vostro posto non vale nulla."
    - tutor: "Mi dispiace molto che pensi questo. Che cosa possiamo fare per lei?"
    - learner: "Vorrei uno sconto, o almeno la cena gratis per qualche sera."
    - tutor: "Le offro la cena gratis per tre sere, e domani il direttore le darà una risposta sullo sconto."
      goals: [request]
    # merlin-1325_1001028-4
    - learner: "Non vedo l'ora di sentire il vostro risponde."
      errors: [word-choice]
      gold: {text: "risponde", fix: "risposta"}
    - tutor: "La risposta arriverà domani mattina, glielo prometto. E stasera la cena è offerta da noi: buonanotte e grazie per la pazienza."
      recast: {text: "risponde", fix: "risposta", tags: [word-choice]}
      goals: [agree]

- scenario: tradizioni-feste
  level: B1
  persona: en-m-retired
  history: [subject-verb-agreement]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E quest'anno abbiamo anche una notizia: io e Luca ci sposiamo!"
    # merlin-1365_0100290-2
    - learner: "Ma che bello, vi auguro le cose più belle del mondo."
    - tutor: "Grazie! Ci sposiamo a giugno, in una piccola chiesa sul mare."
    # merlin-1365_0100281-3
    - learner: "E quando abbiamo deciso di sposarvi?"
      errors: [subject-verb-agreement]
      gold: {text: "abbiamo deciso", fix: "avete deciso"}
    - tutor: "«Abbiamo» deciso? Parli di me e di Luca: chi ha deciso?"
      prompt: {text: "abbiamo deciso", tags: [subject-verb-agreement]}
    - learner: "Quando avete deciso di sposarvi?"
    - tutor: "Esatto. La sera di Capodanno, sotto la neve!"
    # merlin-1365_0100092-0
    - learner: "Sono molto contento che avete preso questa decisione."
    - tutor: "Grazie, anche noi! Ma dimmi, da voi in Inghilterra come si festeggia il Natale?"
    - learner: "Apriamo i regali la mattina presto e poi mangiamo il tacchino con le patate."
    - tutor: "I regali la mattina! Da noi molti li aprono la sera del 24."
      goals: [compare]
    # merlin-1365_0100135-4
    - learner: "Avete una lista di nozze?"
    - tutor: "Non ancora, ma forse chiederemo un aiuto per il viaggio di nozze."
    # merlin-1365_0100133-1
    - learner: "Vi auguro un lungo futuro insieme con grande felicità."
    - tutor: "Che belle parole, grazie! Allora alziamo i bicchieri: alla salute!"

- scenario: vacanze-passate
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Che bello rivederti! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000365-0
    - learner: "Non ci vediamo da tanto tempo, allora ci manchi da morire."
    - tutor: "Anche voi mi siete mancati tanto! Allora, dove siete stati?"
    - learner: "In Grecia, su un'isola molto piccola, per tre settimane."
    - tutor: "Tre settimane, che fortuna! E le persone del posto com'erano?"
      goals: [where]
    # merlin-1325_1001089-8
    - learner: "Erano molto carini."
    - tutor: "Che bello, si vede che sei tornata felice. Ti vedo proprio in forma!"
      goals: [best]
    # merlin-1395_0000388-1
    - learner: "Io sto bene, anzi benissimo."
    - tutor: "Si vede! Le vacanze fanno miracoli."
    # merlin-1395_0000551-7
    - learner: "Come va il lavoro?"
    - tutor: "Bene, ma adesso ho bisogno di vacanze anch'io!"
    # merlin-1395_0000376-9
    - learner: "Allora a presto - mi farebbe molto piacere rivederti!"
    - tutor: "Anche a me! Venerdì sera ti porto a mangiare la pizza."

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Abbiamo un corso di italiano per ragazzi stranieri."
    # merlin-1325_9000534-1
    - learner: "Amo questa lingua!"
    - tutor: "Si sente! Da quanto tempo la parli?"
    # merlin-1325_1001134-4
    - learner: "Parlo l'italiano da quasi quattro anni e l'inglese da otto anni."
    - tutor: "Brava! E perché vuoi fare volontariato con noi?"
    # merlin-1325_1001113-2
    - learner: "Voglio imparare la lingua anche per me stessa perché mi farebbe piacere capire bene la cultura italiana e credo che sapere più di una lingua sia molto importante per trovare un buon lavoro nel futuro."
    - tutor: "Quindi aiuti i ragazzi e nello stesso tempo impari anche tu: perfetto! Che cosa sai fare?"
      goals: [motivation]
    - learner: "Insegno spagnolo in una scuola da cinque anni, quindi so lavorare con i ragazzi."
    - tutor: "Fantastico, un'insegnante vera! Molti ragazzi vogliono imparare anche altre lingue."
      goals: [skills]
    # merlin-1325_1001050-7
    - learner: "Inoltre, può conoscere meglio il mondo se parla due o tre lingue."
    - tutor: "È proprio quello che diciamo sempre anche noi. Quando sei libera?"
    - learner: "Il martedì e il giovedì, dopo le cinque."
    - tutor: "Allora ti do il gruppo del martedì: sono otto ragazzi, quasi tutti dall'Africa."
      goals: [time, choose]

- scenario: prenotare-tavolo
  level: B1
  persona: en-m-retired
  history: [demonstrative]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera, vorrei prenotare un tavolo per sabato alle otto, per sei persone. È il compleanno di mia moglie."
    - tutor: "Certo, sabato alle otto abbiamo ancora posto. Auguri alla signora!"
      goals: [book, details]
    # merlin-1365_0100281-9
    - learner: "Un anno scorso ho mangiato in questa ristorante e secondo me era buonissimo."
      errors: [article-use, demonstrative]
      gold: {text: "questa ristorante", fix: "questo ristorante"}
    - tutor: "In «questa» ristorante? «Ristorante» è maschile: come cambia la parola prima?"
      prompt: {text: "questa ristorante", tags: [demonstrative]}
    - learner: "In questo ristorante, sì! Ricordo ancora le tagliatelle ai funghi."
    - tutor: "Esatto. Che piacere! Le tagliatelle ci sono anche sabato. Ha qualche richiesta?"
    - learner: "Potremmo avere un tavolo in giardino? Mia moglie ama stare fuori."
    - tutor: "Certo, le tengo il tavolo grande in giardino. A che nome?"
      goals: [special]
    - learner: "Harris, con due erre. Grazie mille!"
    - tutor: "Perfetto, signor Harris: sabato alle otto, sei persone, in giardino. A sabato!"
      goals: [name]

- scenario: affittare-appartamento
  level: B1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno. È qui per studio?"
    # merlin-1395_0001090-2
    - learner: "Seguo un corso intensivo per imparare l'italiano."
    - tutor: "Brava! Allora la casa è perfetta: la scuola è a dieci minuti. L'affitto è di 550 euro al mese."
    - learner: "Le spese sono comprese? E quanto dura il contratto?"
    - tutor: "L'acqua sì, la luce e il gas no. Il contratto è di un anno, e chiedo due mesi di affitto prima di entrare."
      goals: [rent, contract]
    - learner: "Il piso è molto bello, ma la cucina sembra un po' vecchia. Il forno funziona?"
      errors: [word-choice]
      gold: {text: "Il piso", fix: "L'appartamento"}
    - tutor: "L'appartamento è vecchio, sì, ma il forno e il frigorifero sono nuovi. E il quartiere è molto tranquillo: ci sono soprattutto famiglie."
      recast: {text: "Il piso", fix: "L'appartamento", tags: [word-choice]}
      goals: [condition, neighbourhood]
    - learner: "Mi piace molto. Posso darle una risposta domani mattina?"
    - tutor: "Certo, mi chiami pure domani entro le dodici. Arrivederci!"
      goals: [decide]

- scenario: medico-base
  level: B1
  persona: en-m-heritage
  history: [articulated-preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Ho mal di gola e da due giorni ho la febbre."
    - tutor: "Vediamo... la gola è molto rossa. E oggi come si sente?"
      goals: [symptoms, since-when]
    # merlin-1365_0100220-11
    - learner: "Ma adesso va meglio."
    - tutor: "Bene. È allergico a qualche medicina?"
    - learner: "Sì, sono allergico a la penicillina."
      errors: [articulated-preposition]
      gold: {text: "a la penicillina", fix: "alla penicillina"}
    - tutor: "Allergico «a la» penicillina? Quando «a» incontra «la», che cosa succede?"
      prompt: {text: "a la penicillina", tags: [articulated-preposition]}
    - learner: "Sono allergico alla penicillina, sì."
    - tutor: "Esatto. Allora le do un'altra medicina: una pastiglia ogni dodici ore, per sei giorni."
      goals: [history]
      new: [{lemma: pastiglia, gloss: tablet}]
    - learner: "Una pastiglia ogni dodici ore, per sei giorni. Va bene."
    - tutor: "Perfetto. E beva molta acqua! Se tra tre giorni non va meglio, torni da me."
      goals: [instructions]

- scenario: vacanze-passate
  level: B1
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    # merlin-1395_0000449-1
    - learner: "Non ti abbiamo veduto da molto tempo."
    - tutor: "È vero, da giugno! Allora, dove siete andati tu e tua madre?"
    - learner: "In Norvegia, con il camper: tre settimane tra montagne e laghi."
    - tutor: "Che bello! E come state, dopo un viaggio così lungo?"
      goals: [where, activities]
    # merlin-1395_0001115-1
    - learner: "Mia madre e io stiamo molto bene."
    - tutor: "Meno male! Però tu hai una faccia un po' stanca, sai?"
    # merlin-1325_9000602-7
    - learner: "Perché dopo queste vacanze sono tornato a lavoro ancora più strafatto di quando ero venuto."
      errors: [word-choice]
      gold: {text: "strafatto", fix: "stanco"}
    - tutor: "Ancora più stanco di prima? Allora la prossima volta niente montagne, ma una spiaggia e un buon libro!"
      recast: {text: "strafatto", fix: "stanco", tags: [word-choice]}
    # merlin-1395_0000557-9
    - learner: "Comunque mi rallegro molto di rivederti."
    - tutor: "Anch'io! Dai, ti offro un caffè e mi fai vedere le foto."

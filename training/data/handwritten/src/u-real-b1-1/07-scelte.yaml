# B1, real learner sentences: advising a friend after school, interviews, volunteering, school memories.
- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
    - tutor: "Ciao! Tu lavori ancora da casa o vai in ufficio? Io ho appena finito gli esami di fine scuola, sai?"
    # merlin-1365_0100252-0
    - learner: "Mi ha fatto molto piacere sentire che hai superato l'esame con grande successo."
    - tutor: "Grazie! Ho preso cento, il voto più alto."
    # merlin-1365_0100069-1
    - learner: "Sei molto bravo!"
    - tutor: "Grazie! Giovedì festeggio con gli amici: vieni anche tu?"
    # merlin-1385_0001198-1
    - learner: "In ufficio c'è molto lavoro e giovedì pomeriggio non posso uscire con te."
    - tutor: "Peccato! Quindi sei sempre in ufficio, niente lavoro da casa. Ti piace almeno?"
      goals: [situation]
    # merlin-1395_0000369-2
    - learner: "Il lavoro mi piace molto."
    - tutor: "Meno male. Io invece non so cosa fare: lavoro o università?"
      goals: [pros]
    # merlin-1365_0100164-7
    - learner: "Quindi, preferirei che tu studi."
      errors: [subjunctive-use]
      gold: {text: "che tu studi", fix: "che tu studiassi"}
    - tutor: "Preferirei «che tu studi»? Con «preferirei», il verbo dopo «che» cambia tempo: come diventa?"
      prompt: {text: "che tu studi", tags: [subjunctive-use]}
    - learner: "Preferirei che tu studiassi: all'università hai più tempo libero!"
    - tutor: "Esatto. Mmm, forse hai ragione. Ci penso ancora un po'."
    # merlin-1325_1001063-11
    - learner: "Spero che tu possa cercare qualcosa di interessante."
    - tutor: "Grazie, sei proprio un'amica vera!"

- scenario: smartworking
  level: B1
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io ho finito la scuola e non so cosa fare!"
    # merlin-1365_0100223-0
    - learner: "Sono veramente contento per te."
    - tutor: "Grazie! Ma adesso devo scegliere: lavoro o università?"
    # merlin-1365_0100163-6
    - learner: "Se non sai ancora che cosa vuoi fare nella tua vita, potresti anche cominciare a lavorare per qualche mese."
    - tutor: "Non è una cattiva idea. Ma dove? Qui in paese non c'è niente."
    # merlin-1365_0100455-5
    - learner: "Per il tuo lavoro penso che tu possa trovare un posto in un albergo o anche come guida turistica."
    - tutor: "Guida turistica... con le lingue che parlo, perché no?"
    # merlin-1365_0100475-17
    - learner: "Parli lo spagnolo e l'inglese perfettamente."
    - tutor: "Perfettamente è un po' troppo! E tu, sei contento di lavorare da casa?"
    - learner: "Sì, lavoro da casa quattro giorni e sono più tranquillo, ma a volte lavoro fino alle dieci di sera e non ho tempo di salire con gli amici."
      errors: [false-friend]
      gold: {text: "salire", fix: "uscire"}
    - tutor: "Non hai tempo di uscire con gli amici? Eh, è il problema di lavorare a casa! Comunque grazie dei consigli."
      recast: {text: "salire", fix: "uscire", tags: [false-friend]}
      goals: [situation, pros, cons]
    # merlin-1365_0100231-12
    - learner: "Spero che ho potuto aiutarti."
      errors: [subjunctive-use]
      gold: {text: "che ho potuto", fix: "che abbia potuto"}
    - tutor: "Spero «che ho potuto»? Dopo «spero che», quale modo del verbo usiamo?"
      prompt: {text: "che ho potuto", tags: [subjunctive-use]}
    - learner: "Spero che abbia potuto aiutarti, davvero."
    - tutor: "Esatto. Mi hai aiutato tantissimo! Domani scrivo a qualche albergo."

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [articulated-preposition]
  turns:
    - tutor: "Allora, tu lavori ancora da casa o vai in ufficio? Io sto cercando lavoro, ma è difficile."
    # merlin-1365_0100120-6
    - learner: "Nel tuo caso, prima di tutto devi decidere che cosa ti piace di più, e poi devi studiare il mercato di lavoro della tua scelta."
    - tutor: "Hai ragione, ma a me piace un po' tutto e un po' niente!"
    # merlin-1365_0100227-11
    - learner: "Senti, ho letto l'annuncio di una ditta vicino della nostra casa."
      errors: [articulated-preposition]
      gold: {text: "vicino della nostra casa", fix: "vicino alla nostra casa"}
    - tutor: "Vicino «della» nostra casa? Con «vicino», quale preposizione usiamo?"
      prompt: {text: "vicino della nostra casa", tags: [articulated-preposition]}
    - learner: "Vicino alla nostra casa, sì. Cercano un ragazzo per il magazzino."
    - tutor: "Esatto. Il magazzino? Mm, non so..."
    # merlin-1365_0100231-10
    - learner: "Potrebbe essere un lavoro per te?"
    - tutor: "Forse sì, almeno per qualche mese. E tu, come ti trovi a lavorare da casa?"
    - learner: "Bene: sono informatica per una banca e da casa lavoro meglio, ma sono sempre davanti al computer."
    - tutor: "Lo immagino, gli occhi alla sera sono stanchi! Senti, per quella ditta come faccio?"
      goals: [situation, pros, cons]
    # merlin-1365_0100120-8
    - learner: "Come informatica, ti posso aiutare con la ricerca su internet."
    - tutor: "Grazie, sei un tesoro! Allora stasera cerchiamo insieme."
    # merlin-1365_0100117-5
    - learner: "Fammi sapere se sei interessato."
    - tutor: "Certo che sono interessato! Domani mattina passo da quella ditta."

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001032-1
    - learner: "Ho 22 anni."
    - tutor: "Molto giovane! E che cosa fa adesso?"
    # merlin-1325_1001040-2
    - learner: "Studio tre lingue straniere: inglese, italiano e spagnolo."
    - tutor: "Tre lingue, brava! Ha già lavorato?"
      goals: [intro]
    # merlin-1325_1001040-9
    - learner: "Studiando l'italiano sono andata in Italia per lavorare in estate."
    - tutor: "Ah, e che lavoro faceva?"
    - learner: "Lavoravo in un negozio di vestiti a Firenze, per tre mesi."
    - tutor: "Bene, quindi conosce già i clienti italiani. Qual è il suo punto di forza?"
      goals: [experience]
    # merlin-1325_1001083-15
    - learner: "Sono molto motivata!"
    - tutor: "Si vede! E perché vuole lavorare proprio con noi?"
      goals: [strengths]
    # merlin-1365_0100148-0
    - learner: "Ho visto il vostro annuncio che mi piace tantissimo."
    - tutor: "Grazie! L'abbiamo disegnato noi, come tutto il resto. Ha qualche domanda?"
      goals: [why]
    - learner: "Sì, posso chiedere una domanda? Quante ore alla settimana dovrei lavorare?"
      errors: [word-choice]
      gold: {text: "chiedere una domanda", fix: "fare una domanda"}
    - tutor: "Certo, può fare una domanda quando vuole! Venti ore, così può continuare a studiare. Le faremo sapere presto!"
      goals: [questions]
      recast: {text: "chiedere una domanda", fix: "fare una domanda", tags: [word-choice]}

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-heritage
  history: [article-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_9000144-0
    - learner: "Io sono corrispondente per le lingue straniere."
    - tutor: "Interessante! Quali lingue parla?"
    # merlin-1325_1001109-2
    - learner: "Parlo perfettamente tedesco e francese."
    - tutor: "Ottimo. E l'inglese?"
    # merlin-1325_1001162-4
    - learner: "Parlo inglese e naturalmente italiano."
    - tutor: "Perfetto, per i nostri clienti è importantissimo. Perché dovremmo scegliere proprio lei?"
      goals: [intro]
    # merlin-1325_1001153-6
    - learner: "Secondo me io sarei l'ottima scielta perchè ho molto esperienza in questo mondo."
      errors: [article-use, adjective-agreement, spelling]
      gold: {text: "l'ottima", fix: "un'ottima"}
    - tutor: "Sarebbe «l'ottima» scelta? Qui quale articolo è più naturale?"
      prompt: {text: "l'ottima", tags: [article-use]}
    - learner: "Sarei un'ottima scelta, perché lavoro da dieci anni con aziende di tutta Europa."
    - tutor: "Esatto. Dieci anni sono tanti! Allora ha già esperienza con i clienti stranieri."
      goals: [experience, strengths, why]
    - learner: "Sì. E da voi quante ore al giorno si lavora?"
    - tutor: "Otto ore, ma il venerdì si finisce alle quattro. Ci mandi pure tutti i documenti."
      goals: [questions]
    # merlin-1325_1001079-7
    - learner: "Le invio il mio curriculum e rimango a sua disposizione per ulteriori informazioni."
    - tutor: "Benissimo. La chiameremo entro la fine del mese. Arrivederci!"

- scenario: colloquio-lavoro
  level: B1
  persona: es-f-teacher
  history: [article-use]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001133-3
    - learner: "Ho 25 anni."
    - tutor: "Bene. E dove vive adesso?"
    # merlin-1325_1001025-3
    - learner: "Vivo adesso a Siviglia, ma posso andare anche domani per lavorare."
    - tutor: "Ottimo, ci serve qualcuno subito! Dove ha imparato l'italiano così bene?"
      goals: [intro]
    # merlin-1325_9000700-7
    - learner: "Parlare la lingua nel paese è la ottima possibilità per imparare la lingua o approfondire le conoscienze."
      errors: [article-use, spelling]
      gold: {text: "la ottima possibilità", fix: "un'ottima possibilità"}
    - tutor: "È «la ottima» possibilità? Parli di una possibilità tra tante: quale articolo ci vuole?"
      prompt: {text: "la ottima possibilità", tags: [article-use]}
    - learner: "È un'ottima possibilità. Io ho vissuto due anni a Bologna e lavoravo in una scuola."
    - tutor: "Esatto. Quindi ha già lavorato con il pubblico. Qual è il suo punto di forza?"
      goals: [experience]
    # merlin-1325_1001125-4
    - learner: "Mi piace parlare con gli stranieri."
    - tutor: "Perfetto, molti nostri clienti vengono dall'estero. Perché ha scelto noi?"
      goals: [strengths]
      new: [{lemma: estero, gloss: abroad}]
    - learner: "Perché mi piacciono i vostri lavori per i musei: sono semplici ma bellissimi."
    - tutor: "Grazie, ne siamo molto orgogliosi. Ha qualche domanda per me?"
      goals: [why]
    # merlin-1325_1001160-10
    - learner: "Spero di ricevere presto una Vostra risposta."
    - tutor: "Certo, le scriviamo entro venerdì. Grazie e arrivederci!"

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [demonstrative]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000676-2
    - learner: "Sono stata in molti paesi africani e asiatici quindi conosco già un po' i problemi legati al sottosviluppo."
    - tutor: "Allora conosci già la realtà di quei paesi. Perché vuoi fare volontariato adesso?"
    - learner: "Io e la mia amica Carmen vogliamo aiutare i bambini: studiamo tutte e due per diventare maestre."
    - tutor: "Che bello, venite insieme allora!"
      goals: [motivation]
    # merlin-1325_1001084-3
    - learner: "Per questi motivazioni ci vogliamo iscrivere insieme."
      errors: [demonstrative]
      gold: {text: "questi motivazioni", fix: "queste motivazioni"}
    - tutor: "«Questi» motivazioni? La parola è femminile: come cambia «questi»?"
      prompt: {text: "questi motivazioni", tags: [demonstrative]}
    - learner: "Per queste motivazioni, sì. Ci iscriviamo oggi?"
    - tutor: "Esatto, anche subito! Avete già un po' di esperienza?"
    # merlin-1325_1001023-12
    - learner: "Veramente non abbiamo mai lavorato in un campo di lavoro."
    - tutor: "Non importa, si impara. Che cosa sapete fare con i bambini?"
    - learner: "Sappiamo giocare, cantare e aiutare con i compiti di inglese."
    - tutor: "Perfetto per il nostro gruppo del pomeriggio! Quanto spesso potete venire?"
      goals: [skills]
    # merlin-1325_9000534-5
    - learner: "Ogni 2 - 3 settimane!"
    - tutor: "Va benissimo. Allora vi metto con i bambini del sabato, una volta ogni tre settimane."
      goals: [time, choose]

- scenario: ricordi-infanzia
  level: B1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Proprio in questa strada, nella casa gialla con il balcone."
    - tutor: "Che carina! E la scuola com'era?"
      goals: [place]
    # merlin-1325_1001139-0
    - learner: "Quando sono stata più giovane studiavo la lingua italiana nel liceo."
      errors: [tense-aspect, articulated-preposition]
      gold: {text: "Quando sono stata", fix: "Quando ero"}
    - tutor: "«Quando sono stata» più giovane? Parli di un periodo lungo del passato: quale tempo usi?"
      prompt: {text: "Quando sono stata", tags: [tense-aspect]}
    - learner: "Quando ero più giovane studiavo l'italiano al liceo."
    - tutor: "Esatto. Già al liceo! E com'erano i professori?"
    # merlin-1325_1001057-3
    - learner: "Gli insegnanti erano bravissimi."
    - tutor: "Che fortuna! Ne ricordi uno in particolare?"
    # merlin-1325_1001110-9
    - learner: "Anche il nostro professore era molto amichevole e credo che questo sia molto importante."
    - tutor: "Sono d'accordo, con un professore simpatico si impara il doppio. E un ricordo speciale?"
      goals: [school]
    # merlin-1325_1001051-5
    - learner: "Dopo un anno sono andata a Camerino."
    - tutor: "A Camerino? Per studiare l'italiano?"
    - learner: "Sì, per un mese, con la scuola. Vivevamo in una famiglia e ogni mattina la signora ci ricordava alle sette!"
      errors: [false-friend]
      gold: {text: "ricordava", fix: "svegliava"}
    - tutor: "Vi svegliava alle sette? Che signora precisa! Forse è da lì che è nato il tuo amore per l'Italia."
      goals: [habits, event]
      recast: {text: "ricordava", fix: "svegliava", tags: [false-friend]}

# B1, real learner sentences: job interviews, volunteering, comparing jobs.
- scenario: colloquio-lavoro
  level: B1
  persona: en-f-professional
  history: [preposition]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    # merlin-1325_1001153-4
    - learner: "Ho finito il liceo 7 anni fa a Londra così parlo inglese molto bene."
    - tutor: "Ottimo, qui l'inglese serve ogni giorno: molti nostri clienti sono stranieri. E dopo il liceo ha già lavorato?"
      goals: [intro]
    # merlin-1325_1001120-6
    - learner: "Durante il mio lavoro presso la mia azienda precedente, Design Studio in Londra, ho avuto modo di approfondire le mie competenze e esperienze."
      errors: [preposition]
      gold: {text: "in Londra", fix: "a Londra"}
    - tutor: "Design Studio «in Londra»? Davanti al nome di una città, che preposizione ci vuole?"
      prompt: {text: "in Londra", tags: [preposition]}
    - learner: "A Londra, scusi. Lì facevo la grafica per i cataloghi."
    - tutor: "Esatto. I cataloghi sono anche il nostro lavoro principale. Qual è il suo punto di forza?"
      goals: [experience]
    # merlin-1325_1001032-7
    - learner: "Posso comunicare bene con la gente."
    - tutor: "Questo è utile, perché parliamo spesso con i clienti. E perché vuole lavorare proprio da noi?"
      goals: [strengths]
    - learner: "Conosco i vostri cataloghi da anni e mi piace il vostro stile semplice e pulito."
    - tutor: "Grazie, fa piacere sentirlo. Ha qualche domanda per me?"
      goals: [why]
    # merlin-1325_1001153-8
    - learner: "Quando è l'inizio dello stage?"
    - tutor: "Lo stage comincia il primo ottobre e dura sei mesi. Le faremo sapere entro venerdì: grazie e arrivederci!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: es-m-worker
  history: [article-use]
  turns:
    - tutor: "Buongiorno, si accomodi pure. Mi parli un po' di lei."
    # merlin-1325_1001092-3
    - learner: "Io ho studiato materie economiche."
    - tutor: "Bene, per i conti dell'ufficio ci serve proprio una persona così. Ha già esperienza in un ufficio?"
      goals: [intro]
    # merlin-1325_1001155-2
    - learner: "Ho già lavorato come un'assistente in un ufficio piccolo per un'estate."
      errors: [article-use]
      gold: {text: "come un'assistente", fix: "come assistente"}
    - tutor: "Ha lavorato «come un'assistente»? Quando dice un lavoro dopo «come», l'articolo serve?"
      prompt: {text: "come un'assistente", tags: [article-use]}
    - learner: "Come assistente, giusto. Rispondevo al telefono e preparavo le fatture."
    - tutor: "Perfetto, è proprio il lavoro che cerchiamo. Mi dica un suo punto di forza."
      goals: [experience]
    # merlin-1325_1001080-4
    - learner: "Se ho qualche lavoro, sempre lo faccio subito, perché amo lavorare."
      errors: [word-order]
      gold: {text: "sempre lo faccio", fix: "lo faccio sempre"}
    - tutor: "«Sempre lo faccio»? Mi sembra che «sempre» sia nel posto sbagliato: dove lo metterebbe?"
      prompt: {text: "sempre lo faccio", tags: [word-order]}
    - learner: "Lo faccio sempre subito. Però a volte sono un po' impaziente con i colleghi lenti."
    - tutor: "Esatto. E sapere qual è il proprio punto debole è già importante. Lavoriamo molto con altri paesi: perché le interessa questo posto?"
      goals: [strengths]
    # merlin-1325_9000215-5
    - learner: "A me piace tantissimo viaggiare e mi interessa conoscere delle culture nuove."
    - tutor: "Allora si troverà bene: per i clienti tedeschi e francesi si viaggia spesso. Ha qualche domanda?"
      goals: [why]
    # merlin-1325_1001098-11
    - learner: "E il lavoro da quando inizierà?"
    - tutor: "Dal primo marzo, se tutto va bene. La chiamiamo noi la settimana prossima. Arrivederci!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-f-student
  history: [tense-aspect]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi racconti qualcosa di lei."
    # merlin-1325_1001144-1
    - learner: "Mi chiamo Emily Clarke e ho ventidue anni."
    - tutor: "Piacere, Emily. E che cosa ha fatto finora, dopo la scuola?"
      goals: [intro]
    - learner: "Dopo la scuola lavoravo per sei mesi in un negozio di abbigliamento a Manchester."
      errors: [tense-aspect]
      gold: {text: "lavoravo per sei mesi", fix: "ho lavorato per sei mesi"}
    - tutor: "«Lavoravo per sei mesi»? È un periodo chiuso, con un inizio e una fine: che tempo usiamo?"
      prompt: {text: "lavoravo per sei mesi", tags: [tense-aspect]}
    - learner: "Ho lavorato per sei mesi in un negozio di abbigliamento."
    - tutor: "Esatto. E che cosa faceva in negozio?"
    # merlin-1325_1001162-8
    - learner: "Per esempio ho tenuto i contatti con i clienti italiani e anche inglesi così ho potuto praticare la lingua."
    - tutor: "Molto bene, il rapporto con i clienti è importante anche qui. Come si descriverebbe, in poche parole?"
      goals: [experience]
    # merlin-1325_1001045-12
    - learner: "Sono molto curiosa."
    - tutor: "Per il nostro lavoro è una qualità preziosa. E perché ha scelto proprio la nostra azienda?"
      goals: [strengths]
    - learner: "Perché disegnate vestiti con tessuti riciclati e questo per me è importante."
    - tutor: "Sì, è la nostra scelta da dieci anni. Vuole chiedermi qualcosa?"
      goals: [why]
    - learner: "Sì, lo stage è pagato?"
    - tutor: "Sì, seicento euro al mese, e il pranzo lo offriamo noi. Le scriveremo presto, arrivederci!"
      goals: [questions]

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [future-form]
  turns:
    - tutor: "Buongiorno, si accomodi. Allora, mi parli un po' di lei."
    # merlin-1325_9000505-0
    - learner: "Non sono sposato, vivo in una casa insieme a mia sorella e mio fratello."
    - tutor: "Bene. E per quanto riguarda gli studi?"
    # merlin-1325_9000504-2
    - learner: "Ho finito l'Università due anni fa."
    - tutor: "Vedo dal curriculum che poi ha lavorato in un'agenzia di viaggi. Com'era?"
      goals: [intro]
    # merlin-1325_1001162-7
    - learner: "Ho dovuto fare molte cose."
    - tutor: "Immagino, in agenzia non ci si annoia mai! E quali sono i suoi punti di forza?"
      goals: [experience]
    # merlin-1325_9000505-5
    - learner: "Allora, parlo l'inglese molto bene, parlo il francese abbastanza bene, sono una persona simpatica e seria."
    - tutor: "Simpatico e serio, una bella combinazione. E un punto debole? Poi mi dica perché vuole lavorare con noi."
    - learner: "Sono un po' disordinato. Vorrei lavorare qui perché il design mi piace da sempre."
    - tutor: "Beh, nessuno è perfetto! Ha qualche domanda?"
      goals: [strengths, why]
    - learner: "Sì: quando sapperò se ho il posto?"
      errors: [future-form]
      gold: {text: "sapperò", fix: "saprò"}
    - tutor: "«Sapperò»? Il futuro di «sapere» è un po' particolare: prova a dirlo di nuovo."
      prompt: {text: "sapperò", tags: [future-form]}
    - learner: "Quando saprò se ho il posto?"
    - tutor: "Perfetto. Lo saprà entro venerdì, le scriviamo noi. Grazie e buona giornata!"
      goals: [questions]

- scenario: volontariato
  level: B1
  persona: es-f-teacher
  history: [preposition]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000685-3
    - learner: "Mi interessano i problemi legati all'ambiente e allo sviluppo dei paesi in Africa oppure Asia."
    - tutor: "Allora sei nel posto giusto: abbiamo un progetto per l'acqua pulita in Kenya. Perché vuoi fare volontariato proprio adesso?"
    # merlin-1325_9000296-13
    - learner: "Sono molto felice quando si tratta di aiutare a qualcuno."
      errors: [preposition]
      gold: {text: "aiutare a qualcuno", fix: "aiutare qualcuno"}
    - tutor: "«Aiutare a qualcuno»? Pensa al verbo: ha bisogno di una preposizione?"
      prompt: {text: "aiutare a qualcuno", tags: [preposition]}
    - learner: "Aiutare qualcuno, sì! Mi fa sentire utile."
    - tutor: "Esatto. È la ragione più bella. E che cosa sai fare?"
      goals: [motivation]
    # merlin-1325_1001027-6
    - learner: "Parlo l'inglese e il francese oltre l'italiano."
    - tutor: "Con lo spagnolo sono quattro lingue! Ci serve proprio qualcuno per tradurre i documenti. Quanto tempo hai?"
      goals: [skills]
    # merlin-1325_9000088-5
    - learner: "Sono a disposizione dal 5 luglio al 30 settembre."
    - tutor: "Quasi tre mesi, perfetto. Preferisci tradurre da casa o partire per il Kenya con il gruppo?"
      goals: [time]
    - learner: "Preferisco partire: voglio vedere il progetto da vicino."
    - tutor: "Allora ti metto nel gruppo di luglio. Ti mando tutte le informazioni domani!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-m-heritage
  history: [word-order]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    # merlin-1325_9000685-4
    - learner: "Sono di carattere socievole, mi piace lavorare con le persone e vivere le nuove esperienze."
    - tutor: "Bene, da noi le persone non mancano! E perché proprio il volontariato?"
    # merlin-1325_1001164-7
    - learner: "Mi interessa conoscere nuove persone e altre culture se anche devo viaggiare tanto."
      errors: [word-order]
      gold: {text: "se anche", fix: "anche se"}
    - tutor: "«Se anche» devo viaggiare? Prova a scambiare l'ordine di queste due parole."
      prompt: {text: "se anche", tags: [word-order]}
    - learner: "Se anche devo viaggiare molto, per me va bene."
      errors: [word-order]
    - tutor: "Perfetto: anche se devi viaggiare molto, per te va bene. Abbiamo progetti anche in altri paesi. Che cosa sai fare?"
      recast: {text: "Se anche", fix: "anche se", tags: [word-order]}
      goals: [motivation]
    # merlin-1325_1001160-4
    - learner: "Se è necessario parlo perfettamente l'inglese, il francese e conosco bene anche lo spagnolo."
    - tutor: "Le lingue ci servono sempre, soprattutto il francese per i progetti in Africa. Quanto tempo hai libero?"
      goals: [skills]
    # merlin-1325_9000087-2
    - learner: "Sono libero per lavorare dal primo luglio al 31 agosto."
    - tutor: "Due mesi, ottimo. Puoi scegliere tra il campo d'estate in Senegal, con i bambini, oppure l'ufficio qui a Torino."
      goals: [time]
    - learner: "Il campo in Senegal, senza dubbio! Che documenti mi servono?"
    - tutor: "Il passaporto e alcune vaccinazioni: domani ti mando la lista. Benvenuto nel gruppo!"
      goals: [choose]

- scenario: volontariato
  level: B1
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi? Come mai?"
    # merlin-1365_0100217-3
    - learner: "Durante gli ultimi tempi aiutavo a mia madre degente in una casa di cura per persone anziane."
      errors: [preposition, tense-aspect]
      gold: {text: "aiutavo a mia madre", fix: "ho aiutato mia madre"}
    - tutor: "Aiutavo «a» mia madre? Il verbo «aiutare» ha bisogno di quella preposizione?"
      prompt: {text: "aiutavo a mia madre", tags: [preposition]}
    - learner: "Ho aiutato mia madre per due anni, quindi conosco bene la vita degli anziani. Vorrei aiutare anche altre persone."
    - tutor: "Esatto. È un motivo bellissimo: da noi molti volontari fanno compagnia agli anziani. E tu come sei?"
      goals: [motivation]
    # merlin-1325_1001014-8
    - learner: "Sono oculata, responsabile, amichevole e precisa."
    - tutor: "Proprio quello che serve. Sai anche fare qualcosa con le mani, per esempio cucinare?"
    # merlin-1325_1001096-4
    - learner: "Mi piace mangiare e cucinare."
    - tutor: "Perfetto, il giovedì prepariamo il pranzo per gli anziani! Quante ore alla settimana puoi darci?"
      goals: [skills]
    - learner: "Ho dieci ore libere, ma posso dare solo quattro."
      errors: [ci-ne]
      gold: {text: "posso dare solo quattro", fix: "posso darne solo quattro"}
    - tutor: "«Posso dare solo quattro»? Come lo dici senza ripetere «ore»?"
      prompt: {text: "posso dare solo quattro", tags: [ci-ne]}
    - learner: "Posso darne solo quattro, scusa."
    - tutor: "Esatto! E quattro ore vanno benissimo. Preferisci il pranzo del giovedì o le uscite al parco del sabato?"
      goals: [time]
    - learner: "Il pranzo del giovedì, così cucino anch'io!"
    - tutor: "Ottimo, allora ti aspettiamo giovedì alle dieci. Benvenuta!"
      goals: [choose]

- scenario: smartworking
  level: B1
  persona: en-f-professional
  history: [tense-aspect]
  turns:
    - tutor: "Ciao! Come va? Tu lavori ancora da casa o vai in ufficio?"
    # merlin-1365_0100163-12
    - learner: "Io sto molto bene ma lavoro troppo perché abbiamo chiuso due stabilimenti e ci sono molte richieste da parte dei giornalisti."
    - tutor: "Accidenti, due stabilimenti! E tu devi rispondere a tutti i giornalisti? Ma lavori da casa o in ufficio?"
    - learner: "Tre giorni in ufficio e due da casa. Sono l'addetta stampa, quindi parlo al telefono tutto il giorno."
    - tutor: "Capito, un po' e un po'. E che cosa ti piace del lavoro da casa?"
      goals: [situation]
    # merlin-1365_0100212-1
    - learner: "Sai, dovevo viaggiare tanto per la ditta quest'anno."
      errors: [tense-aspect]
      gold: {text: "dovevo viaggiare", fix: "ho dovuto viaggiare"}
    - tutor: "«Dovevo viaggiare»? Sono viaggi che hai fatto davvero: quale tempo ci vuole?"
      prompt: {text: "dovevo viaggiare", tags: [tense-aspect]}
    - learner: "Ho dovuto viaggiare tanto, quindi adesso sono contenta di stare a casa due giorni."
    - tutor: "Esatto. Certo, a casa niente valigie e niente aerei! Ci sono anche degli svantaggi?"
      goals: [pros]
    # merlin-1365_0100226-11
    - learner: "Guadagno bene ma non ho limiti di orario."
    - tutor: "Eh, il rischio è lavorare sempre. Se potessi scegliere, che cosa preferiresti?"
      goals: [cons]
    - learner: "Preferirei lavorare da casa tre giorni, ma con un orario più preciso."
    - tutor: "Mi sembra giusto. Parlane con il tuo capo, magari è d'accordo!"
      goals: [preference]

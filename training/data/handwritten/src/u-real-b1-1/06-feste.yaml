# B1, real learner sentences: a birthday surprise, Christmas invitations, cooking together, a book club.
- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [participle-agreement]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1385_0001757-4
    - learner: "Io conosco un ristorante tailandese."
    - tutor: "Ottimo! A Sara piace tantissimo il cibo forte! Che ne dici di sabato 20 novembre?"
    # merlin-1365_0100133-3
    - learner: "Il 20 novembre naturalmente posso venire."
    - tutor: "Perfetto, allora il 20 al ristorante. Chi invitiamo? Anche il nuovo ragazzo di Sara?"
      goals: [date]
    # merlin-1365_0100136-5
    - learner: "Marco non lo conosco ancora, ma sono secura, che Sara ha fatta la scelta giusta!"
      errors: [spelling, participle-agreement]
      gold: {text: "ha fatta", fix: "ha fatto"}
    - tutor: "Sara «ha fatta» la scelta? Con «avere», deve proprio finire in -a?"
      prompt: {text: "ha fatta", tags: [participle-agreement]}
    - learner: "Sara ha fatto la scelta giusta, secondo me. Invitiamo anche lui!"
    - tutor: "Esatto. Allora Marco, le sue colleghe e il nostro gruppo: venti persone circa. La torta la fa mia sorella, così il ristorante prepara solo la cena. E il regalo?"
      goals: [guests, food]
    # merlin-1325_1001083-12
    - learner: "Io vorrei comprare un libro di cucina internazionale."
    - tutor: "Ottima idea, Sara ama cucinare! Lo andiamo a scegliere insieme?"
    # merlin-1365_0100177-7
    - learner: "Lo possiamo fare insieme quando hai voglia."
    - tutor: "Allora sabato mattina andiamo a comprarlo, e poi un caffè!"
      goals: [gift]

- scenario: compleanno
  level: B1
  persona: es-m-worker
  history: [object-pronoun]
  turns:
    - tutor: "Allora, cosa facciamo per il compleanno di Sara?"
    # merlin-1365_0100169-8
    - learner: "Hai una idea?"
    - tutor: "Pensavo a una festa a sorpresa a casa mia, sabato sera."
    # merlin-1365_0100225-3
    - learner: "Mi piace molto!"
    - tutor: "Bene, allora sabato alle nove da me. Chi invitiamo?"
      goals: [date]
    - learner: "I suoi colleghi dell'ospedale. Li scrivo io stasera."
      errors: [object-pronoun]
      gold: {text: "Li scrivo", fix: "Gli scrivo"}
    - tutor: "«Li» scrivo? Scrivi «a» loro: quale pronome ci vuole?"
      prompt: {text: "Li scrivo", tags: [object-pronoun]}
    - learner: "Gli scrivo io stasera, così nessuno dice niente a Sara."
    - tutor: "Esatto, e attenzione: deve essere una sorpresa! E da mangiare?"
      goals: [guests]
    # merlin-1365_0100480-8
    - learner: "Che pensi tu?"
    - tutor: "Io direi pizza per tutti e una torta al cioccolato."
    - learner: "Va bene, la torta la porto io. E il regalo?"
    - tutor: "Pensavo a un fine settimana in montagna: lo paghiamo tutti insieme. Sara lavora tanto, ha bisogno di riposare!"
      goals: [food, gift]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [preposition]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna la festa più grande è il 6 gennaio, quando arrivano i Re Magi. Da bambina mettevo le scarpe vicino alla finestra."
    - tutor: "Che bello! Da noi il 6 gennaio arriva la Befana. Senti, il 25 vieni a pranzo da noi?"
      goals: [compare, past]
    # merlin-1365_0100184-1
    - learner: "Molte grazie per l'invito, sono molto felice e mi fa molto piacere!"
    - tutor: "Siamo noi a essere contenti! Ci sono anche i miei genitori e i nonni."
    # merlin-1365_0100134-3
    - learner: "È anche un grande piacere per me di incontrare ancora i vostri genitori e tutti gli amici italiani."
      errors: [preposition]
      gold: {text: "per me di incontrare", fix: "per me incontrare"}
    - tutor: "Un piacere per me «di» incontrare? Dopo «è un piacere», quella preposizione serve?"
      prompt: {text: "per me di incontrare", tags: [preposition]}
    - learner: "È un grande piacere per me incontrare i tuoi genitori."
    - tutor: "Esatto. Anche loro non vedono l'ora di rivederti!"
    - learner: "Che cosa si mangia di solito a Natale qui a Bologna?"
    - tutor: "I tortellini, sempre! Mia nonna li fa a mano, tutti uguali."
      new: [{lemma: tortellino, gloss: small filled pasta}]
      goals: [ask]
    # merlin-1365_0100133-6
    - learner: "E non so che cosa posso regalarvi."
    - tutor: "Niente regali! Se vuoi, porta un dolce spagnolo: i miei lo adoreranno."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: en-f-professional
  history: [word-order]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Inghilterra mangiamo il tacchino e il pudding, e alle tre tutta la famiglia ascolta il discorso del re."
    - tutor: "Il discorso del re, che tradizione! E a casa vostra si fa anche musica?"
      goals: [compare]
    # merlin-1395_0001070-3
    - learner: "Tom, mio figlio, sempre suona il flauto e a volte mio marito ha tempo di accompagnarlo."
      errors: [word-order]
      gold: {text: "sempre suona", fix: "suona sempre"}
    - tutor: "«Sempre suona»? Ricordi dove mettiamo «sempre» rispetto al verbo?"
      prompt: {text: "sempre suona", tags: [word-order]}
    - learner: "Tom suona sempre il flauto. Da bambina anch'io cantavo con mia nonna davanti al fuoco."
    - tutor: "Esatto. Che bei ricordi! Senti, quest'anno venite tutti da noi il 25?"
      goals: [past]
    # merlin-1365_0100289-3
    - learner: "È un gran piacere per noi e sicuramente veniamo."
    - tutor: "Che bello! Saremo in dodici, una vera festa."
    - learner: "E voi che cosa mangiate di solito il giorno di Natale?"
    - tutor: "Prima la pasta al forno, poi la carne e alla fine il panettone."
      new: [{lemma: panettone, gloss: Christmas cake}]
      goals: [ask]
    # merlin-1365_0100186-9
    - learner: "Ma che cosa possiamo regalarvi?"
    - tutor: "Niente, davvero! Tom porta la sua musica, così facciamo un piccolo concerto."
      goals: [plan]

- scenario: tradizioni-feste
  level: B1
  persona: es-f-teacher
  history: [participle-agreement]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Messico facciamo le posadas: per nove sere andiamo da una casa all'altra a cantare. Da piccola era la mia festa preferita."
    - tutor: "Che bella tradizione! Allora, vieni a passare il Natale con noi a Lecce?"
      goals: [compare, past]
    # merlin-1365_0100187-1
    - learner: "Vi vorrei ringraziare dell'invito e vi vorrei dire che mi avete fatta molto piacere con questo!"
      errors: [participle-agreement]
      gold: {text: "mi avete fatta molto piacere", fix: "mi avete fatto molto piacere"}
    - tutor: "Mi avete «fatta» piacere? Con «fare piacere», deve proprio finire in -a?"
      prompt: {text: "mi avete fatta molto piacere", tags: [participle-agreement]}
    - learner: "Mi avete fatto molto piacere, davvero."
    - tutor: "Esatto. Anche a noi fa piacere! Ma da Milano come arrivi?"
    # merlin-1365_0100133-10
    - learner: "potreste organizzare un posto dove posso dormire perché vorrei venire il 24 dicembre"
    - tutor: "Certo, dormi da noi: c'è la camera di mio fratello libera."
    - learner: "Grazie! E qual è il piatto tipico del Natale a Lecce?"
    - tutor: "La sera del 24 si mangia pesce, e poi tanti dolci fatti in casa."
      goals: [ask]
    # merlin-1365_0100135-3
    - learner: "E naturalmente vorrei comprare un bel regalo per voi."
    - tutor: "Non serve! Porta solo il tuo sorriso, e magari qualche dolce del tuo paese."
      goals: [plan]

- scenario: compleanno
  level: B1
  persona: en-f-student
  history: [preposition]
  turns:
    - tutor: "Ciao! Io e Giulia facciamo una festa per i miei trent'anni nella casa nuova, sabato prossimo alle otto. Venite anche tu e Tom?"
      goals: [date]
    # merlin-1365_0100186-4
    - learner: "Grazie mille per il vostro invito."
    - tutor: "Figurati! E Tom? Viene anche lui?"
      goals: [guests]
    # merlin-1365_0100178-10
    - learner: "Non vede l'ora di festeggiare questo giorno!"
    - tutor: "Che caro! Saremo in quindici, ci sono anche i colleghi di Giulia. Prepariamo la pasta al forno e tanti dolci."
      goals: [guests, food]
    - learner: "Buonissimo! Posso portare io il dolce? Faccio un ottimo tiramisù."
    - tutor: "Sì, grazie! Il tiramisù piace a tutti."
      goals: [food]
    # merlin-1365_0100290-9
    - learner: "Forse vi possiamo regalare qualcosa per la casa?"
    - tutor: "Non dovete, davvero! Però la casa è ancora un po' vuota..."
    # merlin-1365_0100176-7
    - learner: "Avete un desiderio speciale?"
    - tutor: "Beh, ci servirebbe una bella lampada grande. Ma solo se volete!"
      goals: [gift]
    # merlin-1365_0100258-5
    - learner: "Non sono stata sicura che cosa voglio regalarvi."
      errors: [preposition]
      gold: {text: "sicura che cosa", fix: "sicura di che cosa"}
    - tutor: "Sicura «che cosa»? Tra «sicura» e «che cosa» manca una piccola parola: quale?"
      prompt: {text: "sicura che cosa", tags: [preposition]}
    - learner: "Non ero sicura di che cosa regalarvi, ma una lampada è perfetta!"
    - tutor: "Esatto. Grazie, sei gentilissima! Allora ci vediamo sabato alle otto."
    # merlin-1365_0100480-0
    - learner: "Tanti auguri a te!"
    - tutor: "Ma il compleanno è sabato! Comunque grazie, a sabato!"

- scenario: smartworking
  level: B1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio? Io ho una notizia: mi hanno offerto un lavoro a Berlino, sono felicissimo!"
    # merlin-1365_0100061-9
    - learner: "Anch'io sono molto felice per te!"
    - tutor: "Grazie! Ma ho anche un po' paura: è lontano e il tedesco non lo parlo."
    # merlin-1365_0100224-1
    - learner: "Mi sembra una buona idea che tu provi qualche attività professionale prima di scegliere che cosa farai nel futuro."
    - tutor: "Hai ragione, è solo per un anno. E tu? Sempre lezioni da casa?"
    - learner: "Sì, insegno online tutte le mattine. È comodo, ma a volte mi sento un po' sola."
    - tutor: "Ti capisco. Allora vieni a trovarmi a Berlino, così cambi un po' aria!"
      goals: [situation, pros, cons]
    # merlin-1365_0100217-7
    - learner: "Penserò in ogni caso a te!"
    - tutor: "Anch'io a te! Ti scrivo appena arrivo."
    # merlin-1325_1001045-11
    - learner: "Per favore, riscrivimi domani!"
    - tutor: "Promesso: domani ti mando le foto della mia nuova casa."

- scenario: film-libro
  level: B1
  persona: en-f-student
  history: [relative-pronoun]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    # merlin-1325_1001096-15
    - learner: "Vorrei chiedere sul calendario degli incontri."
      errors: [preposition]
      gold: {text: "chiedere sul calendario", fix: "chiedere del calendario"}
    - tutor: "Chiedere «sul» calendario? Con «chiedere» in questo senso, che preposizione usiamo?"
      prompt: {text: "chiedere sul calendario", tags: [preposition]}
    - learner: "Vorrei chiedere del calendario: il prossimo incontro è a dicembre?"
    - tutor: "Esatto. Sì, il 12 dicembre. Ma ora parlaci del tuo libro!"
    - learner: "Ho letto una novella su una ragazza di quindici anni che passa tutto il giorno in chat e perde i suoi amici veri."
      errors: [false-friend]
      gold: {text: "una novella", fix: "un romanzo"}
    - tutor: "Un romanzo su un tema molto importante oggi! Com'è la ragazza?"
      recast: {text: "una novella", fix: "un romanzo", tags: [false-friend]}
      goals: [summary]
    - learner: "È una ragazza timida, che i genitori lavorano sempre e non hanno tempo per lei."
      errors: [relative-pronoun]
      gold: {text: "che i genitori", fix: "i cui genitori"}
    - tutor: "Una ragazza «che i genitori» lavorano sempre? Qui serve una parola che dice di chi sono i genitori: quale?"
      prompt: {text: "che i genitori", tags: [relative-pronoun]}
    - learner: "Una ragazza i cui genitori lavorano sempre, quindi è molto sola."
    - tutor: "Perfetto. Povera ragazza! E qual è il messaggio del libro, secondo te?"
      goals: [characters]
    # merlin-1325_1001056-14
    - learner: "Conoscete persone nuove nella vita vera!"
    - tutor: "Un bel consiglio per tutti noi! Allora ti è piaciuto? E a chi lo consiglieresti?"
    - learner: "Sì, molto, anche se la fine è un po' triste. Lo consiglierei ai ragazzi e anche ai loro genitori."
    - tutor: "Ottima idea, lo metto nella lista del prossimo mese!"
      goals: [opinion, recommend]

# Set s-c1c2-right, file 3: C1, culture, books, opinions. Long, correct learner turns left alone;
# a few independent subtle errors (demonstrative, hypothetical, false friend, preposition...).
- scenario: arte-mostra
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi trasmette una strana serenità, anche se il soggetto è un naufragio. Forse dipende dalla luce: il cielo è squarciato da un raggio di sole che illumina solo la barca, mentre tutto il resto viene lasciato nell'ombra."
  - tutor: "Proprio così, è la luce a comandare. Che cosa vedi, oltre alla barca?"
    goals: [react]
  - learner: "In primo piano ci sono tre pescatori aggrappati ai remi, e uno di loro guarda verso lo spettatore, come se ci chiedesse aiuto. Sullo sfondo si intravede un faro, dipinto con quel azzurro pallido che sembra quasi sciogliersi nella nebbia."
    errors: [demonstrative]
  - tutor: "Il faro non l'avevo nemmeno notato, sai? Ma ripeti «quel azzurro»: davanti a una vocale, quel dimostrativo resta così?"
    prompt: {text: "quel azzurro", tags: [demonstrative]}
    goals: [describe]
  - learner: "Hai ragione: quell'azzurro pallido. Secondo me il faro è la speranza: è lontano, ma c'è. E il pescatore che ci guarda forse vuole dirci che ci siamo dentro anche noi, che il naufragio riguarda tutti."
  - tutor: "Esatto. È un'interpretazione bella, e molto romantica, nel senso stretto della parola."
    goals: [interpret]
  - learner: "Infatti mi ricorda Turner, anche se qui tutto è più nitido. Turner avrebbe sciolto i pescatori nella tempesta, mentre questo pittore li ha voluti precisi, quasi fotografici, come se non volesse perdere nemmeno un volto."
  - tutor: "Il paragone con Turner regge, anche se qui il mare sembra più ordinato. Andiamo a vedere la sala accanto?"
    goals: [compare]

- scenario: club-lettura
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Ce l'ho fatta, sì, anche se mi ci sono volute tre settimane. All'inizio facevo fatica a tenere a mente tutti i parenti, ma da metà romanzo in poi non riuscivo più a smettere. Il capitolo dell'alluvione, poi, l'ho letto due volte."
  - tutor: "Quel capitolo è il cuore del libro, secondo me. Quindi nel complesso ti è piaciuto?"
  - learner: "Mi è piaciuto molto, sì. Il personaggio che mi ha colpito di più è la madre, Teresa: dopo che il marito se n'è andato in Argentina, avrebbe potuto vendere la terra e trasferirsi in città, invece è rimasta, e ha tirato su cinque figli da sola."
  - tutor: "Teresa è una roccia. Ma non ti sembra che abbia sacrificato le figlie per salvare la terra?"
    goals: [impression]
  - learner: "Un po' sì, e credo che l'autrice lo sappia benissimo. Teresa non è un'eroina: è una donna che ha fatto l'unica scelta che le sembrava possibile, e che forse, con un'altra educazione, avrebbe scelto diversamente. È proprio questo che la rende credibile."
  - tutor: "È credibile proprio perché sbaglia, hai ragione. E lo stile come l'hai trovato?"
    goals: [character]
  - learner: "Asciutto, quasi secco, e all'inizio mi ha spiazzato. Poi ho capito che l'autrice racconta le tragedie con lo stesso tono con cui descrive la vendemmia, e che è proprio questo distacco a renderle così forti."
  - tutor: "Bella osservazione. A chi lo consiglieresti, allora?"
    goals: [style]
  - learner: "A chi ama le saghe familiari e non ha fretta. A chi cerca un romanzo pieno di colpi di scena, invece, lo sconsiglierei: rischierebbe di abbandonarlo prima di arrivare all'alluvione."
  - tutor: "A chi non ha pazienza lo sconsiglierei anch'io. Il libro del mese prossimo, però, lo scegli tu."
    goals: [recommend]

- scenario: film-libro
  level: C1
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io, se permettete. Ho letto un giallo ambientato in un paesino della Val d'Aosta, durante una nevicata che isola il paese per una settimana. Un maestro in pensione trova il corpo del farmacista, e siccome i carabinieri non possono arrivare, decide di indagare da solo."
  - tutor: "Un paese isolato dalla neve: il classico delitto a porte chiuse, in versione alpina. Com'è il maestro?"
    goals: [summary]
  - learner: "È un uomo burbero, vedovo, che parla più con il suo cane che con i vicini. Proprio per questo conosce tutti senza che nessuno conosca davvero lui, il che lo rende un investigatore perfetto."
  - tutor: "Un investigatore che parla con il cane mi piace già. E il libro, nel complesso?"
    goals: [characters]
  - learner: "Mi è piaciuto, ma è troppo lungo. Se l'autore avrebbe tagliato un centinaio di pagine, sarebbe stato un capolavoro: la parte centrale, con le indagini sui conti della farmacia, è ripetitiva."
    errors: [hypothetical]
  - tutor: "Il difetto di tanti gialli. Ma ripeti «se l'autore avrebbe tagliato»: dopo quel «se», il condizionale ci sta?"
    prompt: {text: "avrebbe tagliato", tags: [hypothetical]}
  - learner: "Sì, se l'autore avrebbe tagliato quelle pagine, il ritmo non si sarebbe mai fermato. Il finale, comunque, ripaga dell'attesa."
    errors: [hypothetical]
  - tutor: "Se l'autore avesse tagliato quelle pagine, il ritmo avrebbe tenuto fino in fondo: ci credo. A chi lo consiglieresti?"
    recast: {text: "avrebbe tagliato", fix: "avesse tagliato", tags: [hypothetical]}
    goals: [opinion]
  - learner: "A chi ama i gialli all'antica, senza tecnologia e senza sangue. E anche a chi, come me, è cresciuto in montagna, perché quei silenzi li riconoscerà."
  - tutor: "Allora lo prendo in prestito io: sono di Belluno, e quei silenzi li conosco bene. Chi vuole continuare?"
    goals: [recommend]

- scenario: intervista-podcast
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Grazie a voi per l'invito! Sono arrivato quasi per caso: nel 2017 facevo il cuoco a Manchester, e il ristorante in cui lavoravo mi ha mandato tre mesi a Parma, a imparare tutto sul prosciutto e sul formaggio. Dovevano essere tre mesi, e sono diventati otto anni."
  - tutor: "Tre mesi che diventano otto anni: succede più spesso di quanto si creda. Quando hai capito che saresti rimasto?"
  - learner: "Credo il giorno in cui il proprietario del caseificio mi ha invitato a pranzo dalla sua famiglia. Eravamo in quindici a tavola, tutti parlavano insieme, e nessuno mi chiedeva niente, come se fossi sempre stato lì. In quel momento è stato facile realizzare che non sarei più tornato."
    errors: [false-friend]
  - tutor: "Capire che non saresti più tornato davanti a un pranzo in quindici è molto italiano, in effetti. E all'inizio, che cosa ti ha sorpreso di più?"
    recast: {text: "realizzare", fix: "capire", tags: [false-friend]}
    goals: [story]
  - learner: "Gli orari dei pasti, senza dubbio. In Inghilterra si cena alle sei, e i primi tempi alle sei e mezza io avevo già fame, mentre i miei colleghi cominciavano appena a pensare all'aperitivo. Ancora oggi, quando torno a Manchester, mi sembra che la gente ceni a metà pomeriggio."
  - tutor: "Cenare alle sei, per un italiano, è quasi fare merenda. E c'è qualcosa che invece non sopporti, dell'Italia?"
    goals: [culture-shock]
  - learner: "La burocrazia, come tutti. Per aprire la partita IVA ci sono voluti quattro mesi e sei visite allo stesso ufficio, e ogni volta mancava un documento diverso. Non è che non funzioni niente, anzi; è che nessuno ti spiega le regole finché non le hai già infrante."
  - tutor: "«Finché non le hai già infrante»: questa me la segno. Che consiglio daresti a chi sta pensando di trasferirsi qui?"
    goals: [critique]
  - learner: "Di imparare la lingua prima di partire, anche solo un po', e di non fidarsi troppo dei primi mesi: all'inizio è tutto bellissimo, poi arriva la burocrazia, e solo dopo un anno capisci se ci vuoi restare davvero. Io ci sono rimasto, e non me ne sono mai pentito."
  - tutor: "Un consiglio onesto, e anche una bella chiusura. Grazie di essere stato con noi!"
    goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a lei e a chi ci ascolta. Più che sceglierla, l'ho trovata per necessità: nel 2014 in Spagna gli infermieri non trovavano lavoro, e un ospedale di Trieste cercava personale. Avevo già fatto un Erasmus a Padova, quindi l'italiano un po' lo parlavo."
  - tutor: "Dalla Spagna a Trieste: un bel salto, anche di clima. Qual è stata la cosa più difficile?"
    goals: [story]
  - learner: "Il primo inverno, senza dubbio. La bora soffiava a cento all'ora, facevo i turni di notte e non conoscevo nessuno. Una sera, dopo un turno particolarmente duro, ho chiamato a mia madre piangendo e le ho detto che sarei tornata a casa."
    errors: [preposition]
  - tutor: "Che inverno difficile. Ripeta però «ho chiamato a mia madre»: in italiano, chiamare qualcuno vuole quella preposizione?"
    prompt: {text: "chiamato a mia madre", tags: [preposition]}
  - learner: "No, è lo spagnolo che mi tradisce: ho chiamato mia madre. Lei mi ha detto di resistere fino alla primavera, e aveva ragione: a maggio avevo già degli amici, e Trieste mi sembrava un'altra città."
  - tutor: "Esatto. Le mamme hanno spesso ragione. In che cosa è cambiata, in questi anni?"
    goals: [difficulties]
  - learner: "Sono diventata più paziente, credo. In Spagna, se un documento non arrivava, mi arrabbiavo; qui ho imparato che le cose arrivano, magari tardi, ma arrivano. E ho cominciato a bere il caffè in piedi al bancone, cosa che i miei amici di Siviglia trovano incomprensibile."
  - tutor: "Il caffè al bancone è la prova definitiva dell'integrazione. Che consiglio darebbe a chi sta pensando di trasferirsi qui?"
    goals: [change]
  - learner: "Di non aspettarsi che tutto sia come nei film, e di non giudicare l'Italia dal primo inverno. Se fossi tornata a casa dopo quella telefonata, mi sarei persa gli anni più belli della mia vita."
  - tutor: "Un consiglio prezioso, e grazie di averlo condiviso con noi. Buona giornata, e un saluto a Trieste!"
    goals: [advice]

- scenario: modi-di-dire
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia stare, una giornata da incubo. Avevo un appuntamento dal parrucchiere in centro, e siccome ero in ritardo, ho preso un taxi. Il tassista ha sbagliato strada due volte, e quando finalmente siamo arrivati, il parrucchiere aveva già dato il mio posto a un'altra cliente."
  - tutor: "Piove sul bagnato, come si dice. E il taxi, almeno, era economico?"
  - learner: "Macché: mi è costato un occhio della faccia, quaranta euro per un tragitto che a piedi avrei fatto in mezz'ora. E il bello è che, mentre pagavo, mi sono accorto che avevo lasciato il portafoglio a casa, e ho dovuto pagare con il telefono."
    errors: [word-choice]
  - tutor: "Un occhio della testa per mezz'ora di strada, che rabbia. E poi com'è andata a finire?"
    recast: {text: "un occhio della faccia", fix: "un occhio della testa", tags: [word-choice]}
  - learner: "È andata che sono tornato a casa a piedi, sotto la pioggia, e lì ho scoperto che, mentre ero fuori, era saltata la corrente, e il gelato che avevo comprato ieri si era sciolto nel congelatore. Altro che piove sul bagnato: qui diluviava!"
  - tutor: "Un diluvio vero e proprio, altro che pioggia. Ma di chi è la colpa, alla fine?"
    goals: [tell, react]
  - learner: "Un po' del tassista, un po' del parrucchiere, ma se devo essere sincero, soprattutto mia: se fossi uscito di casa in orario, non avrei preso il taxi, e tutto il resto non sarebbe successo. Il gelato, invece, è colpa del destino."
  - tutor: "Onesto, almeno. E la morale della storia?"
    goals: [blame]
  - learner: "Che chi va piano va sano e va lontano, e che il gelato va mangiato subito, senza aspettare il giorno dopo."
  - tutor: "Su tutte e due le cose sono d'accordissimo. Il prossimo gelato lo offro io, e lo mangiamo subito."
    goals: [moral]

- scenario: notizie-attualita
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "L'ho vista, sì, l'ho letta in treno. Se ho capito bene, chi affitta un appartamento ai turisti dovrà registrarlo con un codice nazionale ed esporlo all'ingresso, e i comuni potranno limitare il numero di case affittate nei centri storici."
  - tutor: "Più o meno, sì. Ma tu che cosa ne pensi, al di là della notizia?"
    goals: [summarise]
  - learner: "Penso che fosse ora che qualcuno intervenisse. Nel mio quartiere, a Napoli, metà dei palazzi sono ormai pieni di valigie, e una famiglia che cerca casa in affitto non trova niente sotto i mille euro. Detto questo, non mi sembra giusto colpire chi affitta una sola stanza per arrotondare lo stipendio."
  - tutor: "Sul proprietario con una sola stanza la penso come te. E hai visto come l'hanno raccontata i giornali?"
    goals: [opinion]
  - learner: "Sì, e sembrava che parlassero di due leggi diverse. Un quotidiano economico titolava sulla fine del libero mercato, un altro sulla rinascita dei centri storici. Secondo me la verità sta nel mezzo, e dipende di come la applicheranno i comuni."
    errors: [preposition]
  - tutor: "Nel mezzo, come quasi sempre. Ripeti però «dipende di come»: il verbo dipendere regge quella preposizione?"
    prompt: {text: "dipende di come", tags: [preposition]}
    goals: [sources]
  - learner: "No, giusto: dipende da come la applicheranno. Se i comuni la useranno davvero, tra qualche anno nei centri storici torneranno a vivere le famiglie; se no, cambierà solo la burocrazia."
  - tutor: "Esatto. E secondo te i comuni la useranno, o resterà sulla carta?"
  - learner: "Temo che molti comuni preferiscano non scontentare nessuno, almeno all'inizio. Ma se Firenze o Venezia dimostrassero che funziona, gli altri sarebbero costretti a seguirle, anche solo per non fare brutta figura."
  - tutor: "Speriamo nell'effetto domino, allora. Intanto io mi tengo stretto il mio affitto, finché dura."
    goals: [consequences]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco che faccia paura, ma secondo me la questione è mal posta. Non credo che una tecnologia, da sola, cancelli il lavoro: lo sposta, lo trasforma, e a volte ne crea di nuovo. Il problema, semmai, è chi resta indietro mentre succede."
  - tutor: "«Chi resta indietro»: ecco, appunto, saremo noi. Hai qualche prova del contrario?"
    goals: [position]
  - learner: "Una prova no, ma un esempio sì. Mia madre fa la traduttrice da trent'anni, e quando sono arrivati i traduttori automatici era convinta che avrebbe chiuso. Invece oggi rivede testi tradotti dalle macchine, lavora più in fretta di prima e i clienti non le mancano."
  - tutor: "Tua madre sarà brava, ma guadagna come prima? Rivedere un testo si paga meno che tradurlo."
    goals: [evidence]
  - learner: "Questo è vero, e lei stessa lo ammette: le tariffe sono scese, e i giovani traduttori fanno molta più fatica di lei a entrare nel mestiere. Anche se tutti stassero attenti a usarla bene, qualcuno ci perderebbe comunque."
    errors: [subjunctive-form]
  - tutor: "Almeno su questo siamo d'accordo. Ma rileggi «stassero»: come fa il congiuntivo imperfetto di stare?"
    prompt: {text: "stassero", tags: [subjunctive-form]}
    goals: [concede]
  - learner: "Stessero, scusa. Comunque sì, qualcuno ci perde: proprio per questo credo che servirebbe una formazione continua, pagata dalle aziende che usano queste tecnologie."
  - tutor: "Esatto. Su questo, vedi, possiamo trovarci d'accordo anche io e te."
  - learner: "Allora brindiamo a questo: tu un po' meno pessimista, io un po' meno ottimista, e l'intelligenza artificiale che, nel frattempo, ci lava i piatti."
  - tutor: "Se mi lava i piatti, la perdono subito. Alla salute!"
    goals: [conclude]

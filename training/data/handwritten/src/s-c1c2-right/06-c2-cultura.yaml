# Set s-c1c2-right, file 6: C2, ideas, humour, books, idioms. Sophisticated, correct turns left
# alone; a few independent subtle errors (ci with riuscire, concessive subjunctive, false friends,
# word order, articulated preposition, calqued idiom).
- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Meno male, temevo di aver perso il meglio! Se c'è da scannarsi per una lasagna, però, mi ritiro in buon ordine: ne ho già mangiata una fetta enorme ieri sera da mia suocera, e non vorrei fare la figura dell'ingordo."
  - tutor: "Qui l'ingordo non esiste: esiste solo chi ha fame e chi mente. Comunque, come dice mia nonna, chi tardi arriva male alloggia."
  - learner: "Chi tardi arriva male alloggia... immagino voglia dire che chi arriva in ritardo deve accontentarsi di quello che resta. In inglese abbiamo qualcosa di simile, ma al contrario: diciamo che è l'uccello mattiniero a prendersi il verme."
  - tutor: "L'hai capito al volo. Il vostro verme, però, mi sembra molto meno invitante della lasagna."
    goals: [react, compare]
  - learner: "Su questo non c'è gara. A proposito di lasagne, la settimana scorsa ho provato a farle io, con la sfoglia tirata a mano come mi aveva insegnato tua madre. Ho insistito per due ore, ma non sono riuscito: la sfoglia si rompeva di continuo, e alla fine ho comprato quella pronta."
    errors: [ci-ne]
  - tutor: "Due ore di sfoglia, che eroe. Ma ripeti «non sono riuscito»: se non ripeti «a farla», al verbo non serve una particella che la sostituisca?"
    prompt: {text: "non sono riuscito", tags: [ci-ne]}
  - learner: "Giusto: non ci sono riuscito. Ma la cosa più bella è stata la faccia di mio figlio quando l'ha assaggiata e mi ha detto che era più buona di quella della nonna. Gli ho risposto che le bugie hanno le gambe corte, e lui mi ha guardato come se parlassi arabo."
  - tutor: "Esatto. E il proverbio cade a pennello: adesso però mangia, che l'ultima lasagna te la sei guadagnata."
    goals: [use-idiom, anecdote]

- scenario: seminario-etica
  level: C2
  persona: en-f-student
  history: [subjunctive-use]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "Dubiti pure, professore, è il suo mestiere. Preciso però la tesi: sostengo che una macchina non possa essere ritenuta moralmente responsabile, il che non esclude che dei suoi atti rispondano, sul piano giuridico, chi l'ha progettata o chi la utilizza."
  - tutor: "Una precisazione utile. Ma su che cosa fonda questa differenza?"
    goals: [thesis]
  - learner: "Sulla distinzione tra causare un evento ed esserne l'autore. Una frana può provocare una strage, ma nessuno la accuserebbe di omicidio, perché le manca l'intenzionalità: non ha scelto, non avrebbe potuto agire diversamente. Allo stesso modo, per quanto una macchina è complessa, il suo comportamento resta l'esito di regole che non si è data."
    errors: [subjunctive-use]
  - tutor: "L'esempio della frana è efficace. Ma rilegga «per quanto una macchina è complessa»: dopo un «per quanto» concessivo, quale modo si usa?"
    prompt: {text: "è complessa", tags: [subjunctive-use]}
  - learner: "Sì, per quanto una macchina è complessa, resta il prodotto di un addestramento che non ha scelto."
    errors: [subjunctive-use]
  - tutor: "Per quanto sia complessa, dunque, resta il prodotto di un addestramento. Ma nemmeno noi abbiamo scelto i nostri geni, né l'educazione ricevuta: perché a noi la responsabilità sì, e alla macchina no?"
    recast: {text: "è complessa", fix: "sia complessa", tags: [subjunctive-use]}
    goals: [distinguish]
  - learner: "Perché noi, pur condizionati, possiamo riflettere sulle ragioni delle nostre azioni e rivederle. Se una persona cresciuta nella violenza decide di non ripeterla, compie un atto di cui risponde; una macchina, invece, modifica il proprio comportamento solo se qualcuno ne modifica i parametri."
  - tutor: "E se un sistema imparasse a correggersi da solo, rivedendo le proprie regole, lei che cosa direbbe?"
    goals: [objection]
  - learner: "Le concederei che il confine si farebbe più sottile, e che la mia distinzione andrebbe riformulata in termini di gradi, più che di natura. Ma resterei convinta che senza coscienza di sé non si dia responsabilità morale in senso pieno."
  - tutor: "Una concessione elegante, che non le costa la tesi. Mi riassuma la sua posizione in una frase, per il verbale del seminario."
    goals: [concede]
  - learner: "Una macchina può essere causa di un danno, e chi la governa può doverne rispondere; ma finché non saprà di agire, non potrà esserne moralmente colpevole."
  - tutor: "Rigorosa e concisa: la metto a verbale così com'è."
    goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Me l'aspettavo, ed è il complimento più crudele che potessi farmi. Il passaggio più difficile è il monologo della madre al funerale: in inglese parla per frasi spezzate, quasi senza verbi, e io temevo che in italiano sembrasse sgrammaticata, così l'ho resa più fluida."
  - tutor: "Ecco il delitto: quelle frasi spezzate erano il suo dolore, e tu gliel'hai stirato."
    goals: [problem]
  - learner: "Hai ragione. Il problema è anche il registro: l'autore usa un tono molto casuale, quasi da chiacchiera al bar, proprio mentre la madre parla della morte del figlio. È quel contrasto che fa male, e in italiano rischia di sembrare una mancanza di rispetto."
    errors: [false-friend]
  - tutor: "Un tono disinvolto, quasi da bar, proprio lì: è voluto, e va conservato. Hai provato altre soluzioni?"
    recast: {text: "casuale", fix: "disinvolto", tags: [false-friend]}
  - learner: "«Casuale», appunto: ecco un calco come quelli che rimprovero sempre agli altri. Comunque ho due versioni: una con frasi brevi ma complete, l'altra che ricalca la sintassi spezzata dell'originale, con i puntini e le frasi nominali. La seconda è più fedele, ma temo che il lettore italiano la trovi artificiosa."
  - tutor: "Almeno il calco l'hai visto da solo. Io terrei la seconda: un lettore italiano regge benissimo una frase senza verbo, se il dolore è vero."
    goals: [false-friend, options]
  - learner: "Allora tengo la seconda, ma limerei i puntini, che in italiano stancano più che in inglese. Se sei d'accordo, ne lascerei solo tre o quattro, nei punti in cui la madre si interrompe davvero."
  - tutor: "D'accordo: frasi spezzate, pochi puntini, e la madre torna a parlare con la sua voce. Mandami la nuova versione entro venerdì."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Mi hai scoperto. Ho capito che c'entrava la panna, ma non capivo perché tutto il pubblico si fosse messo a ridere come se il ministro avesse insultato la nonna di ognuno. Me la spieghi?"
  - tutor: "Perché la panna nella carbonara, per un romano, è proprio un insulto alla nonna."
    goals: [missed]
  - learner: "Adesso capisco! Quella che mi è piaciuta di più, invece, è stata la battuta sul treno regionale, «l'unico mezzo che ti fa arrivare in ritardo anche quando parti in anticipo», perché funziona anche in spagnolo, e lì ho anche io riso fino alle lacrime."
    errors: [word-order]
  - tutor: "Quella era bella, sì. Ma ripeti «ho anche io riso»: in quella frase, «anche io» ti sembra al posto giusto?"
    prompt: {text: "ho anche io riso", tags: [word-order]}
    goals: [favourite]
  - learner: "Hai ragione: ho riso anch'io fino alle lacrime. Anzi, ci provo anch'io: il regionale è davvero un mezzo di trasporto, nel senso che ti porta a metà strada e poi si ferma."
  - tutor: "Esatto. E il doppio senso di «mezzo» non è affatto male: la prossima volta ti mando sul palco."
    goals: [wordplay]
  - learner: "Detto questo, una cosa mi ha messo a disagio: la battuta sui migranti, nel finale. Non credo che la satira debba avere limiti per legge, ma credo che dovrebbe prendersela con chi ha potere, non con chi non ne ha. Se un comico ride dei deboli, non è satira: è bullismo con il microfono."
  - tutor: "«Bullismo con il microfono»: sottoscrivo. Il ministro della carbonara, invece, se l'è meritata tutta."
    goals: [limits]

- scenario: club-lettura
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "Ce l'ho fatta, ma a fatica, e ti confesso che sono tra quelli a cui non è piaciuto granché. Non che sia scritto male, tutt'altro: è che dopo duecento pagine di pranzi, battesimi e funerali, mi sembrava di essermi sorbita le cene di famiglia di qualcun altro."
  - tutor: "Le cene di famiglia di qualcun altro, che crudeltà! Ma qualcosa ti sarà pur rimasto."
    goals: [impression]
  - learner: "Il nonno, Ettore. Ha combattuto in guerra, è tornato e non ne ha mai parlato con nessuno, eppure tutte le scelte dei figli sembrano dipendere da quel silenzio. Se l'autrice gli avesse dedicato più spazio, forse il libro mi avrebbe presa di più."
  - tutor: "Ettore è il personaggio più riuscito, su questo hai ragione. E lo stile?"
    goals: [character]
  - learner: "Ricercato, a volte fin troppo. Ci sono pagine bellissime, come quella in cui la nonna stende le lenzuola mentre arrivano gli americani, ma altrove l'autrice sembra innamorata delle sue frasi, e il racconto si ferma ad ascoltarle."
  - tutor: "«Il racconto si ferma ad ascoltarle»: una perfidia elegantissima. A chi lo consiglieresti, allora?"
    goals: [style]
  - learner: "A chi ama le saghe familiari lente, quelle da leggere d'estate senza fretta, e a chi ha avuto un nonno che taceva sulla guerra: credo che ci si riconoscerebbe. A chi cerca una trama serrata, invece, consiglierei di lasciar perdere."
  - tutor: "Allora lo regalo a mio padre, che di nonni silenziosi se ne intende. E il prossimo libro lo scegli tu."
    goals: [recommend]

- scenario: notizie-attualita
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatta?"
  - learner: "L'ho seguita, sì, e con un interesse non del tutto disinteressato, visto che il mio padrone di casa mi ha appena comunicato che a giugno vuole trasformare il mio appartamento in un bed and breakfast. Se ho capito bene, la legge introduce un codice nazionale e un minimo di notti per gli affitti nei centri storici."
  - tutor: "Il tuo padrone di casa ha un tempismo perfetto. Più o meno è così, sì. E tu che ne pensi?"
    goals: [summarise]
  - learner: "Penso che sia una legge timida. Nel mio quartiere ormai la metà di appartamenti è affittata ai turisti, e un codice da appendere alla porta non riporterà indietro nessuna famiglia. Servirebbe un tetto vero, come hanno fatto altrove."
    errors: [articulated-preposition]
  - tutor: "Timida, forse. Ma ripeti «la metà di appartamenti»: dopo «la metà», davanti a un nome preciso, la preposizione resta semplice?"
    prompt: {text: "la metà di appartamenti", tags: [articulated-preposition]}
    goals: [opinion]
  - learner: "No, giusto: la metà degli appartamenti. Comunque mi ha colpito come ne hanno parlato i giornali: i quotidiani economici hanno gridato all'esproprio, quelli locali hanno intervistato solo gli inquilini sfrattati, e nessuno ha spiegato davvero che cosa cambia."
  - tutor: "Esatto. Ognuno ha scritto l'articolo che i suoi lettori volevano leggere."
    goals: [sources]
  - learner: "Proprio così. E temo che le conseguenze le vedremo tra un paio d'anni: se i comuni non useranno i poteri che la legge gli dà, i centri storici continueranno a svuotarsi, e noi inquilini finiremo tutti in periferia."
  - tutor: "E ci ritroveremo tutti in periferia, alla macchinetta del caffè di un'altra azienda. Intanto, però, il tuo contratto fallo leggere a qualcuno che se ne intende."
    goals: [consequences]

- scenario: intelligenza-artificiale
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "La paura la capisco, ma la profezia mi sembra azzardata. Ogni rivoluzione tecnologica ha distrutto dei mestieri e ne ha creati altri, e non c'è motivo di credere che questa volta vada diversamente, a meno che non siamo noi a gestirla male."
  - tutor: "Stavolta è diverso, però: le macchine non sostituiscono le braccia, sostituiscono il cervello."
    goals: [position]
  - learner: "In parte sì. L'altro giorno ho chiesto a un programma di riassumermi un contratto di venti pagine, e mi ha contestato in tre secondi, con un riassunto quasi perfetto. Quasi, però: aveva saltato proprio la clausola sulla penale, che era l'unica cosa che mi interessava."
    errors: [false-friend]
  - tutor: "Ti ha risposto in tre secondi, ma ha saltato l'unica clausola che contava: mi pare un ottimo esempio. Quindi un cervello ci vuole ancora."
    recast: {text: "contestato", fix: "risposto", tags: [false-friend]}
    goals: [evidence]
  - learner: "Ci vuole, eccome. Però ti concedo che i lavori di semplice routine, come la trascrizione o certe traduzioni tecniche, spariranno, e chi li fa oggi avrà bisogno di aiuto per reinventarsi. Su questo il tuo pessimismo è più che giustificato."
  - tutor: "Grazie della concessione: me la incornicio. E allora, dove ci incontriamo?"
    goals: [concede]
  - learner: "Troviamo un punto d'incontro: tu ammetti che non tutto è perduto, io ammetto che senza una formazione seria molti resteranno indietro. E il governo, anziché fare proclami, dovrebbe pagare i corsi a chi rischia di perdere il posto."
  - tutor: "Su questo firmo subito: meno proclami e più corsi. Brindiamo al compromesso?"
    goals: [conclude]

- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia perdere, è stata la classica giornata in cui tutto quello che poteva andare storto è andato storto. Stamattina avevo il colloquio per quel lavoro in biblioteca, e mi ero preparata per una settimana: avevo perfino stirato la camicia, cosa che non faccio mai."
  - tutor: "Una camicia stirata: allora era una cosa seria. E poi?"
  - learner: "Poi sono uscita, e piovevano gatti e cani: in cinque minuti ero fradicia, e la camicia sembrava uno straccio. Ho preso l'autobus, che ovviamente si è fermato a metà strada per un guasto."
    errors: [word-choice]
  - tutor: "Pioveva a catinelle e per giunta l'autobus guasto: piove sempre sul bagnato, eh? Almeno sei arrivata in tempo?"
    recast: {text: "piovevano gatti e cani", fix: "pioveva a catinelle", tags: [word-choice]}
  - learner: "Per miracolo sì, ma con dieci minuti di ritardo e i capelli incollati alla fronte. E lì è proprio piovuto sul bagnato: la persona che doveva farmi il colloquio era la stessa signora a cui, la settimana scorsa, avevo soffiato l'ultimo posto libero sul treno."
  - tutor: "No! Il mondo è piccolo, e a quanto pare anche vendicativo."
    goals: [tell, react]
  - learner: "Diciamo che la colpa è un po' mia e un po' del destino. Se le avessi lasciato quel posto, oggi forse avrei avuto un colloquio più sereno; ma se il destino non mi avesse messa sullo stesso treno, non avrei avuto niente da farmi perdonare."
  - tutor: "Mezza colpa a testa, quindi. E la morale?"
    goals: [blame]
  - learner: "Che bisogna sempre cedere il posto alle signore, soprattutto a quelle che un giorno potrebbero diventare il tuo capo. E che, come dite voi, non tutto il male viene per nuocere: alla fine mi hanno presa lo stesso!"
  - tutor: "Ti hanno presa! Allora stasera l'aperitivo lo offri tu, e il posto cedilo pure a chi vuoi."
    goals: [moral]

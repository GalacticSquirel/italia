# Set s-c1c2-right, file 8: C2, services and life in Italy. Sophisticated, correct turns (incl.
# correct colloquial forms such as «la sera che» and double negation) left alone; a few
# independent subtle errors (clitic with modal, false friend, si passivante, future stem,
# pluperfect, calqued idiom).
- scenario: assicurazione-sinistro
  level: C2
  persona: en-f-professional
  history: [pronoun-position]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri sera, verso le sette, uscivo in retromarcia dal garage condominiale, in via Saffi, a Forlì. Avevo già controllato gli specchietti, ma un ciclista che scendeva contromano lungo la rampa, senza luci, mi è arrivato addosso proprio mentre stavo per immettermi in strada."
  - tutor: "Mi dispiace. Il ciclista si è fatto male?"
    goals: [what]
  - learner: "Per fortuna no, solo un bello spavento. Ha detto che andava troppo veloce e che, quando mi ha vista, non si è potuto fermarsi in tempo. La bicicletta però mi ha rigato tutta la fiancata destra."
    errors: [pronoun-position]
  - tutor: "Meno male che si tratta solo della fiancata. Ma ripeta «non si è potuto fermarsi»: con il modale davanti, quel pronome può comparire due volte?"
    prompt: {text: "non si è potuto fermarsi", tags: [pronoun-position]}
  - learner: "No, certo: non ha potuto fermarsi in tempo. E l'ha ammesso davanti a un vicino, che ha visto tutto dalla finestra ed è disposto a testimoniare."
  - tutor: "Esatto. Un testimone è prezioso, soprattutto con un ciclista che andava contromano."
    goals: [responsibility]
  - learner: "Il problema è che il ciclista non ha un'assicurazione, e non abbiamo compilato nessuna constatazione: aveva fretta, e mi ha lasciato solo il suo numero di telefono. Vorrei sapere se, in casi come questo, il danno mi verrà risarcito comunque."
  - tutor: "Senza constatazione è più complicato, ma non impossibile. Mi serviranno le foto del danno, il numero del ciclista e una dichiarazione scritta del suo vicino."
    goals: [documents]
  - learner: "Gliele mando tutte entro stasera. E poi? Devo aspettare la perizia, o posso già chiedere un preventivo al carrozziere?"
  - tutor: "Il preventivo può chiederlo, ma non faccia riparare niente prima che passi il perito, che la contatterà entro una settimana."
    goals: [next]

- scenario: burocrazia-residenza
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Devo comunicare un cambio di indirizzo all'interno del comune: mi sono separato da poco, e da un mese vivo in un monolocale in via Pascoli. Mi è stato detto che la pratica si può fare anche online, ma il sito continuava a darmi errore, e ho preferito venire di persona."
  - tutor: "Ha fatto bene, il sito in questi giorni fa i capricci. Ha con sé il documento e il contratto del nuovo appartamento?"
    goals: [request]
  - learner: "Il documento sì, eccolo. Il contratto invece non ce l'ho ancora, perché il proprietario vive in Germania e me lo spedirà firmato solo la settimana prossima. Nel frattempo ho una sua email in cui conferma che l'appartamento è affittato a me da settembre."
  - tutor: "L'email può bastare per avviare la pratica, purché alleghi una copia del documento del proprietario. Il contratto lo porterà quando arriva."
    goals: [documents]
  - learner: "Il documento del proprietario non ce l'ho, ma posso chiederglielo oggi stesso; dubito però che riesca a mandarmelo prima di lunedì, perché è in viaggio. Si potrebbe aprire la pratica oggi e integrarla lunedì, o rischierei di dover rifare la fila da capo?"
  - tutor: "Apriamo la pratica oggi, e lunedì mi manda il documento per email, con il numero di pratica nell'oggetto. Non dovrà rifare la fila."
    goals: [problem]
  - learner: "Perfetto, la ringrazio. Un'ultima cosa: mia figlia, che vive con me a settimane alterne, risulta ancora residente all'indirizzo della madre. Va fatto qualcosa anche per lei, o resta tutto com'è?"
  - tutor: "Se la residenza della bambina resta con la madre, per lei non cambia nulla. Quanto a lei, entro quarantacinque giorni passerà un vigile a verificare il nuovo indirizzo."
    goals: [next]

- scenario: medico-specialista
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottore. Nel complesso bene, anche se dieci giorni fa ero molto constipata, con la febbre e la tosse, e per qualche giorno ho sospeso la camminata quotidiana. Da quando sto meglio, però, ho notato che il cuore mi batte più forte del solito anche a riposo."
    errors: [false-friend]
  - tutor: "Se era così raffreddata, con febbre e tosse, il battito accelerato può durare anche qualche settimana. Quando le succede, di preciso?"
    recast: {text: "constipata", fix: "raffreddata", tags: [false-friend]}
  - learner: "Soprattutto la sera, quando mi metto a letto: lo sento nelle orecchie, regolare ma veloce. Non ho dolore al petto né fiato corto, e di giorno, quando sono occupata, quasi non me ne accorgo."
  - tutor: "È un dettaglio importante. In famiglia qualcuno soffre di aritmie o di tiroide?"
    goals: [symptoms]
  - learner: "Mia madre ha avuto problemi di tiroide per anni, e mio fratello prende delle pastiglie per la pressione da quando ne aveva quaranta. Non so se c'entri qualcosa, ma preferisco dirglielo."
  - tutor: "C'entra eccome, e ha fatto bene a dirmelo: la tiroide può dare proprio questo tipo di battito."
    goals: [history]
  - learner: "Quindi pensa che il problema possa essere la tiroide e non il cuore? Dagli esami che ha davanti risulta qualcosa?"
  - tutor: "Il cuore è a posto: l'elettrocardiogramma è normale. Gli ormoni della tiroide, invece, sono un po' alti, e vanno ricontrollati."
    goals: [understand]
  - learner: "E se fossero davvero alti, che cosa dovrei fare? Ci sono farmaci con effetti collaterali particolari?"
  - tutor: "Se il nuovo esame lo conferma, le prescriverò una terapia leggera, che all'inizio a volte dà un po' di stanchezza. Ripetiamo gli esami tra due settimane, e poi decidiamo."
    goals: [treatment]

- scenario: recensione-ristorante
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e mi dispiace sollevarlo proprio stasera, perché siamo venuti a festeggiare: è il ristorante dove siamo venuti la sera che ci siamo fidanzati, dieci anni fa. Ma purtroppo la serata è stata deludente sotto più di un aspetto."
  - tutor: "Mi dispiace molto, soprattutto per l'occasione. Che cosa non è andato?"
    goals: [complain]
  - learner: "Avevamo prenotato il menù degustazione, che sul sito è descritto con sette portate. Dopo la quarta, il cameriere ci ha portato il dolce, e quando gli abbiamo chiesto spiegazioni ci ha detto che la cucina aveva finito il pesce. Non ci aveva detto niente nessuno prima, e il prezzo è rimasto lo stesso."
  - tutor: "Avreste dovuto essere avvisati subito, e il prezzo andava ridotto: ha perfettamente ragione."
    goals: [detail]
  - learner: "Ecco, è proprio questo che ci ha amareggiato. Non pretendevamo che la cucina facesse miracoli, ma ci saremmo aspettati che qualcuno venisse al tavolo a spiegarci la situazione e a proporci un'alternativa, magari un secondo di carne."
  - tutor: "È esattamente quello che si sarebbe dovuto fare. Le propongo di rimborsarvi metà del menù, e di offrirvi una bottiglia per il vostro anniversario."
    goals: [expectation]
  - learner: "La ringrazio, è un gesto che apprezziamo. Accettiamo il rimborso, ma la bottiglia, se non le dispiace, preferiremmo berla la prossima volta, quando torneremo a provare le sette portate complete."
  - tutor: "Allora la teniamo da parte per voi, con il vostro nome sopra. Vi aspettiamo, e buon anniversario."
    goals: [resolve]

- scenario: reclamo-comune
  level: C2
  persona: es-f-erasmus
  history: [passive]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Sono qui per il giardino pubblico di piazza Garibaldi, quello davanti alla biblioteca. Da quando, a luglio, è stato chiuso per la potatura degli alberi, i cancelli non sono più stati riaperti, e i bambini del quartiere giocano sul marciapiede, tra le macchine."
  - tutor: "Capisco. Purtroppo il verde pubblico dipende da un altro ufficio, che ha tempi lunghi."
    goals: [describe]
  - learner: "Lo so, me l'hanno detto anche al telefono, tre volte. In questi mesi si è fatto molte promesse, ma nessuno ha mai indicato una data. Non le chiedo miracoli, solo una risposta precisa."
    errors: [passive]
  - tutor: "Capisco la sua frustrazione. Ma ripeta «si è fatto molte promesse»: con il «si» passivante, il verbo concorda con che cosa?"
    prompt: {text: "si è fatto molte promesse", tags: [passive]}
  - learner: "Sì, intendo che si è fatto molte promesse, ma nessuna è stata mantenuta."
    errors: [passive]
  - tutor: "Si sono fatte molte promesse e nessuna è stata mantenuta, ha ragione. Allora chiamo l'ufficio del verde mentre lei è qui, così le do una data vera."
    recast: {text: "si è fatto molte promesse", fix: "si sono fatte molte promesse", tags: [passive]}
    goals: [insist]
  - learner: "La ringrazio. E se anche questa data non venisse rispettata, quali strumenti avrei a disposizione? Esiste una procedura formale per i reclami, con dei tempi di risposta garantiti?"
  - tutor: "Sì, può presentare un reclamo scritto, che viene protocollato: il Comune è tenuto a rispondere entro trenta giorni."
    goals: [rights]
  - learner: "Allora preferirei presentarlo comunque, così ne resta traccia. Mi può dare il modulo e, una volta protocollato, il numero di riferimento?"
  - tutor: "Ecco il modulo. Intanto l'ufficio del verde mi conferma la riapertura entro il quindici del mese prossimo: lo scrivo sulla ricevuta, insieme al numero di protocollo."
    goals: [commitment]

- scenario: organizzare-matrimonio
  level: C2
  persona: es-m-worker
  history: [future-form]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo come una grande festa di paese, più che come un ricevimento elegante. Ci sposiamo a giugno in Sardegna, nel paese di mia moglie, e lì un matrimonio coinvolge mezza comunità: ci saranno circa centoventi invitati, e la maggior parte rimaneranno fino a notte fonda."
    errors: [future-form]
  - tutor: "Una festa di paese in Sardegna, che meraviglia. Ma ripeta «rimaneranno»: com'è il futuro di rimanere?"
    prompt: {text: "rimaneranno", tags: [future-form]}
  - learner: "Sì, rimaneranno fino all'alba, conoscendo i parenti di mia moglie. Per questo cerchiamo un posto all'aperto, con spazio per ballare."
    errors: [future-form]
  - tutor: "Rimarranno fino all'alba, allora, e serve spazio per tutti. Che budget avete in mente?"
    recast: {text: "rimaneranno", fix: "rimarranno", tags: [future-form]}
    goals: [vision]
  - learner: "Vorremmo restare intorno ai trentamila euro. Il vino ce lo regala uno zio che ha una cantina, e i dolci li preparano le zie, che non ce lo perdonerebbero se ci rivolgessimo a una pasticceria; quindi il budget riguarda soprattutto il luogo, il pranzo e la musica."
  - tutor: "Con il vino e i dolci in famiglia, trentamila bastano. Ho due proposte: un agriturismo con un grande cortile, o una spiaggia privata con un ristorante."
    goals: [budget]
  - learner: "La spiaggia è suggestiva, ma a giugno il maestrale può rovinare tutto, e con centoventi persone non vorrei correre rischi. Sceglierei l'agriturismo, purché il cortile sia abbastanza grande per le danze tradizionali, che da quelle parti sono una cosa seria."
  - tutor: "Il cortile ospita fino a duecento persone, quindi lo spazio per ballare non manca. Avete altre condizioni?"
    goals: [choices]
  - learner: "Una sola, ma importante: vorremmo che lei si coordinasse direttamente con le zie per i dolci, e che nessuno si offendesse se volessero dire la loro anche sul menù. Glielo dico per esperienza: in Sardegna una zia offesa è peggio di una tempesta."
  - tutor: "Messaggio ricevuto: le zie le chiamo io la settimana prossima, e il menù lo decidiamo insieme a loro."
    goals: [conditions]

- scenario: vita-in-italia
  level: C2
  persona: en-m-traveller
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. In realtà non l'ho scelta per ragioni romantiche, ma per lavoro: nel 2015 una bottega di Torino che costruisce strumenti ad arco cercava un liutaio che parlasse inglese con i clienti stranieri, e io avevo appena finito la scuola di liuteria. Prima di trasferirmi, non sono mai stato in Italia, nemmeno in vacanza."
    errors: [tense-aspect]
  - tutor: "Un liutaio inglese a Torino: bella storia. Ma ripeta «prima di trasferirmi, non sono mai stato»: rispetto al trasferimento, che è già passato, quale tempo serve?"
    prompt: {text: "non sono mai stato in Italia", tags: [tense-aspect]}
  - learner: "Giusto: prima di trasferirmi non ero mai stato in Italia. Conoscevo solo i nomi dei grandi liutai di Cremona e un po' di italiano dei libri, che però al bar non serviva a niente."
  - tutor: "Esatto. E qual è stata la parte più difficile?"
    goals: [story]
  - learner: "Senza dubbio i primi mesi in bottega. Il mio maestro parlava piemontese con gli altri artigiani, e io capivo una parola su dieci; per di più, nessuno mi spiegava niente: si imparava guardando. Se non avessi avuto una pazienza quasi ostinata, sarei tornato in Inghilterra dopo tre mesi."
  - tutor: "Imparare guardando: un metodo antico, e severo. In che cosa l'ha cambiata, questa esperienza?"
    goals: [difficulties]
  - learner: "Mi ha insegnato a fare le cose lentamente, e a non considerare la lentezza una perdita di tempo. Un violino richiede centinaia di ore di lavoro, e qui ho capito che la fretta si sente nel suono. Credo che questo valga anche per le persone."
  - tutor: "«La fretta si sente nel suono»: bellissimo. Che consiglio darebbe a chi vuole trasferirsi?"
    goals: [change]
  - learner: "Di arrivare con molta curiosità e poche aspettative, e di imparare la lingua sul serio, anche il dialetto, se serve: è lì che le persone si aprono davvero."
  - tutor: "Un consiglio prezioso. Grazie di essere stato con noi, e buon lavoro in bottega."
    goals: [advice]

- scenario: film-libro
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Inizio io, se nessuno ha niente in contrario. Ho letto un romanzo ambientato a Trieste nel 1954, l'anno in cui la città tornò all'Italia, raccontato attraverso gli occhi di una sarta slovena che cuce i vestiti per le mogli degli ufficiali americani."
  - tutor: "Trieste nel 1954, un momento delicatissimo. Com'è la protagonista?"
    goals: [summary]
  - learner: "È una donna riservata, che ascolta molto e parla poco, e proprio per questo sente tutto: le chiacchiere delle signore, i segreti dei mariti, le paure di chi deve scegliere se restare o partire. Si capisce presto che sa più cose di quante ne dica."
  - tutor: "Una sarta che sa più di quanto dice: un personaggio perfetto. E il libro ti è piaciuto?"
    goals: [characters]
  - learner: "Molto, anche se il finale mi ha lasciato con un gusto amaro. Senza rivelare troppo, diciamo che la protagonista paga per un segreto che non era nemmeno suo, e che nessuno, alla fine, la ringrazia."
    errors: [word-choice]
  - tutor: "Ti ha lasciato con l'amaro in bocca, insomma: succede, con i finali onesti. Ma per te è un difetto o un pregio?"
    recast: {text: "con un gusto amaro", fix: "con l'amaro in bocca", tags: [word-choice]}
  - learner: "Un pregio, direi. Se l'autrice avesse scelto un lieto fine, avrebbe tradito tutto il resto del romanzo, che è costruito sul silenzio e sulle cose non dette."
  - tutor: "Giusta osservazione. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "A chi ama i romanzi storici che non sembrano manuali di storia, e a chi è curioso delle città di confine. E a chi, come me, ha sempre pensato che le sarte sappiano tutto."
  - tutor: "Le sarte e i barbieri, aggiungerei. Grazie, lo metto subito nella lista del prossimo mese."
    goals: [recommend]

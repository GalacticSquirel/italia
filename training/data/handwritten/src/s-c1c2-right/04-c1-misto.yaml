# Set s-c1c2-right, file 4: C1, mixed scenes. Long, correct complex turns left alone; a few
# independent subtle errors (comparative, participle form, register, conditional form...).
- scenario: dibattito-ambiente
  level: C1
  persona: en-m-retired
  history: [comparative]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco il timore, ma la penso diversamente. Abito in centro da vent'anni, e sono convinto che, se il traffico venisse ridotto davvero, i negozi ci guadagnerebbero. Chi cammina si ferma davanti alle vetrine; chi è in macchina pensa solo a trovare parcheggio."
  - tutor: "Bella teoria, ma la gente in centro ci viene in macchina, perché gli autobus non passano mai."
    goals: [position]
  - learner: "Proprio per questo la chiusura andrebbe accompagnata da più autobus, altrimenti è inutile. A York, dove sono cresciuto, il centro storico è pedonale da decenni, e i negozi del centro lavorano più che quelli dei centri commerciali in periferia."
    errors: [comparative]
  - tutor: "York è un esempio interessante. Ma ripeta «più che quelli»: davanti a un pronome, il secondo termine del paragone si introduce così?"
    prompt: {text: "più che quelli", tags: [comparative]}
  - learner: "Sì, lavorano più che quelli della periferia, e non solo d'estate. Anche l'aria, in centro, è molto più pulita che in passato."
    errors: [comparative]
  - tutor: "Più di quelli della periferia, e tutto l'anno: se è così, l'argomento è forte. Però York non è la nostra città, e qui i commercianti temono di perdere i clienti che arrivano dai paesi vicini."
    recast: {text: "più che quelli", fix: "più di quelli", tags: [comparative]}
    goals: [argue]
  - learner: "È un timore legittimo, e non lo sottovaluto. Ma se si costruissero dei parcheggi alle porte della città, con una navetta gratuita ogni dieci minuti, chi arriva dai paesi potrebbe lasciare la macchina e raggiungere il centro in cinque minuti."
  - tutor: "Una navetta ogni dieci minuti costa, però. E i soldi chi li mette?"
    goals: [counter]
  - learner: "Su questo ha ragione: senza un finanziamento serio, la navetta resterebbe un'idea sulla carta. Allora le propongo un compromesso: chiudiamo il centro solo il sabato e la domenica per un anno, e intanto verifichiamo se gli incassi dei negozi calano o crescono."
  - tutor: "Un anno di prova nei fine settimana mi sembra ragionevole: almeno decideremo sui numeri, non sulle paure."
    goals: [concede]

- scenario: assicurazione-sinistro
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Ieri pomeriggio avevo lasciato la macchina in sosta davanti alla farmacia, in via Dante. Mentre ero dentro, un furgone delle consegne, facendo manovra, mi ha urtato la fiancata e ha rotto il fanale posteriore. Una signora che aspettava l'autobus ha visto tutto."
  - tutor: "Per fortuna c'era una testimone. Il conducente del furgone si è fermato?"
    goals: [what]
  - learner: "Sì, è stato molto corretto. Ha ammesso subito di essere stato lui, e anzi mi ha offrito di pagare il danno in contanti, per non passare dall'assicurazione. Io però ho preferito fare tutto in regola."
    errors: [past-participle-form]
  - tutor: "Ha fatto bene a fare tutto in regola. Ma ripeta «mi ha offrito»: il participio di offrire è proprio quello?"
    prompt: {text: "ha offrito", tags: [past-participle-form]}
  - learner: "No, scusi: mi ha offerto di pagare in contanti. Comunque la responsabilità è sua senza dubbio: la mia macchina era parcheggiata regolarmente, dentro le strisce, e io non c'ero nemmeno."
  - tutor: "Esatto. Allora è un caso semplice. Avete compilato insieme il modulo di constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo firmato tutti e due, e la signora ci ha lasciato il suo numero di telefono, nel caso servisse una testimonianza. Le devo mandare anche le foto del danno, o basta il modulo?"
  - tutor: "Mi mandi anche le foto, con la targa del furgone ben leggibile. E inserisca nella pratica il numero della testimone, non si sa mai."
    goals: [documents]
  - learner: "Benissimo, gliele mando stasera. Quanto tempo ci vorrà, più o meno, perché il danno venga risarcito?"
  - tutor: "Se la responsabilità resta chiara, di solito ci vogliono trenta giorni dalla perizia. Il perito la chiamerà entro la settimana."
    goals: [next]

- scenario: burocrazia-residenza
  level: C1
  persona: en-m-traveller
  history: [register]
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno. Mi sono trasferito a Bologna a settembre per lavoro, e vorrei chiedere il cambio di residenza. Sono cittadino britannico, quindi immagino che, dopo la Brexit, serva anche il permesso di soggiorno."
  - tutor: "Immagina bene: ci vuole il permesso di soggiorno, oppure la ricevuta della richiesta. Ce l'ha con sé?"
    goals: [request]
  - learner: "Ho la ricevuta della questura, il passaporto e il contratto d'affitto. Mi hanno detto che serve anche una marca da bollo, però non ho capito bene di quanto. Scusa, puoi dirmi dove si compra?"
    errors: [register]
  - tutor: "Il bollo glielo spiego subito. Ma rifaccia la domanda, «scusa, puoi dirmi»: siamo a uno sportello e non ci conosciamo, quindi che forma userebbe?"
    prompt: {text: "Scusa, puoi dirmi", tags: [register]}
  - learner: "Ha ragione, mi scusi: può dirmi dove si compra? Con i colleghi do del tu a tutti, e a volte mi scappa."
  - tutor: "Esatto, capita a tutti. È una marca da sedici euro, e la trova in qualsiasi tabaccheria."
    goals: [documents]
  - learner: "Perfetto. Un'altra cosa: il contratto d'affitto non è ancora stato registrato, perché il proprietario è all'estero fino a dicembre. È un problema, o posso presentare lo stesso la domanda?"
  - tutor: "La domanda la può presentare lo stesso, con la copia del contratto che ha. Il proprietario, però, dovrà registrarlo appena torna."
    goals: [problem]
  - learner: "Meno male. E dopo che avrò presentato la domanda, quanto ci vorrà prima che la residenza diventi definitiva?"
  - tutor: "Entro quarantacinque giorni passerà un vigile a verificare che lei abiti lì. Se è tutto in regola, la residenza vale dalla data di oggi."
    goals: [next]

- scenario: presentazione-progetto
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo. Il progetto riguarda i nostri due stabilimenti, che distano quattro chilometri l'uno dall'altro: ogni giorno una quarantina di dipendenti li percorre in macchina, spesso da soli. Le propongo di acquistare venti biciclette elettriche aziendali, da usare per gli spostamenti interni."
  - tutor: "Venti biciclette. E che cosa ci guadagniamo, concretamente?"
    goals: [pitch]
  - learner: "Prima di tutto i rimborsi chilometrici, che l'anno scorso sono costati all'azienda circa diciottomila euro. Con le biciclette li ridurremmo almeno della metà, e l'investimento iniziale, di trentamila euro, verrebbe recuperato in poco più di tre anni. Senza contare il bilancio ambientale, che ai nostri clienti tedeschi interessa parecchio."
  - tutor: "Tre anni non sono pochi. E d'inverno, con la pioggia, chi la prende la bicicletta?"
    goals: [benefits]
  - learner: "È un'obiezione giusta, e non pretendo che tutti la usino tutto l'anno. Ma se il progetto funzionasse almeno da aprile a ottobre, dovressimo comunque risparmiare il sessanta per cento dei rimborsi."
    errors: [conditional-form]
  - tutor: "Sessanta per cento è una stima interessante. Ripeta però «dovressimo»: com'è il condizionale di dovere, alla prima persona plurale?"
    prompt: {text: "dovressimo", tags: [conditional-form]}
  - learner: "Dovremmo, mi scusi: dovremmo comunque risparmiare il sessanta per cento. E per i mesi invernali ho già chiesto un preventivo per delle mantelle impermeabili, che costano pochissimo."
  - tutor: "Esatto. Le mantelle sono un dettaglio, ma fanno la differenza."
    goals: [objection]
  - learner: "Allora le proporrei una prova di sei mesi con dieci biciclette a noleggio, invece di comprarle subito. Se i numeri confermano le mie stime, a ottobre passiamo all'acquisto."
  - tutor: "Il noleggio riduce il rischio, e questo mi convince. Mi prepari il contratto di noleggio per la prossima settimana: partiamo ad aprile."
    goals: [next-steps]

- scenario: arte-mostra
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "A prima vista mi sembra un ritratto come tanti, ma più lo guardo e più mi incuriosisce. La donna tiene un libro aperto, eppure non lo sta leggendo: guarda fuori dal quadro, come se qualcuno l'avesse appena chiamata."
  - tutor: "È proprio quello sguardo il segreto del quadro. Che cos'altro noti?"
    goals: [react]
  - learner: "Il vestito è dipinto con una cura incredibile: si vedono le pieghe della seta e perfino i riflessi della luce sulle perle. Lo sfondo invece è quasi vuoto, tranne una finestra in alto a destra, da cui si intravede un paesaggio di colline."
  - tutor: "Le perle, ovviamente, dicono che era ricca. Secondo te, chi era questa donna?"
    goals: [describe]
  - learner: "Secondo me era una donna colta, che voleva essere ricordata non solo per la sua bellezza ma anche per la sua intelligenza. Il libro, del resto, non è stato messo lì a caso: in un'epoca in cui le donne leggevano poco, era quasi una dichiarazione d'indipendenza."
  - tutor: "Una lettura molto moderna, ma ci sta. Ti ricorda qualcos'altro?"
    goals: [interpret]
  - learner: "Mi ricorda certi ritratti fiamminghi che ho visto al Prado, dove i tessuti sono resi con la stessa precisione. Solo che lì le figure sono più rigide, mentre qui la donna sembra viva, come se da un momento all'altro potesse chiudere il libro e alzarsi."
  - tutor: "Il confronto con i fiamminghi regge: la cura dei tessuti è la stessa. Vieni, nella sala accanto c'è un ritratto che ti piacerà ancora di più."
    goals: [compare]

- scenario: film-libro
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Posso cominciare io? Ho letto un romanzo per ragazzi, anche se ho venticinque anni: parla di una tredicenne di Palermo che, durante un'estate, scopre che il nonno era stato un famoso ladro di gioielli. Me l'aveva regalato la mia coinquilina, e l'ho finito in due giorni."
  - tutor: "Un nonno ladro di gioielli: mi piace già. Com'è la protagonista?"
    goals: [summary]
  - learner: "Si chiama Rosalia, è testarda, curiosa e un po' presuntuosa, e si mette continuamente nei guai. Però è anche molto sola, perché i genitori lavorano tutto il giorno, e forse è proprio per questo che si affeziona così tanto al nonno."
  - tutor: "Una ragazzina sola che trova un complice: bella premessa. E a te che cosa è piaciuto?"
    goals: [characters]
  - learner: "Soprattutto il ritmo: ogni capitolo finisce con un mistero, e non riuscivo a smettere. Per me è stato un libro davvero eccitante, anche se è scritto per i ragazzi."
    errors: [false-friend]
  - tutor: "Un libro avvincente, quindi, da leggere tutto d'un fiato. C'è qualcosa che invece non ti ha convinto?"
    recast: {text: "eccitante", fix: "avvincente", tags: [false-friend]}
  - learner: "Il finale, forse, è un po' troppo dolce: tutti si perdonano, il nonno restituisce i gioielli e nessuno va in prigione. Capisco che sia un libro per ragazzi, ma avrei preferito un finale un po' più ambiguo."
  - tutor: "Un finale meno dolce sarebbe stato più vero, in effetti. A chi lo consiglieresti?"
    goals: [opinion]
  - learner: "Ai ragazzi dai dieci anni in su, ovviamente, ma anche agli adulti che hanno voglia di qualcosa di leggero in vacanza. E a chi studia l'italiano, perché è scritto in modo chiaro, senza essere banale."
  - tutor: "Allora lo metto subito nella lista della biblioteca dei ragazzi. Grazie, chi è il prossimo?"
    goals: [recommend]

- scenario: recensione-ristorante
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, anche se mi dispiace disturbarla per una cosa del genere. Avevamo prenotato un tavolo per quattro alle otto e mezza, ma ci hanno fatto sedere solo alle nove e un quarto, in un angolo vicino alla porta della cucina, dove faceva un caldo insopportabile."
  - tutor: "Tre quarti d'ora di attesa, e per giunta quel tavolo: mi scuso davvero. È successo dell'altro?"
    goals: [complain]
  - learner: "La cameriera era gentilissima, ma la ho chiesto due volte il pane e non è mai arrivato. Poi le tagliate sono arrivate fredde, e una era molto più cotta del necessario, anche se l'avevamo chiesta al sangue."
    errors: [object-pronoun]
  - tutor: "Mi dispiace. Ma ripeta «la ho chiesto»: si chiede qualcosa «a qualcuno», quindi quel pronome va bene?"
    prompt: {text: "la ho chiesto", tags: [object-pronoun]}
  - learner: "No, scusi, è un errore che faccio spesso: le ho chiesto il pane due volte. Insomma, per un locale con questi prezzi e queste recensioni, mi aspettavo un'attenzione diversa, anche nei dettagli."
  - tutor: "Esatto. E con questi prezzi, ha ragione, i dettagli devono essere perfetti."
    goals: [detail, expectation]
  - learner: "Non vorrei sembrare esagerato: il primo era ottimo, e il vino che ci ha consigliato il sommelier era perfetto. È proprio per questo che mi dispiace, perché si vede che la cucina sa lavorare bene."
  - tutor: "La ringrazio dell'onestà. Vorrei offrirvi i secondi e il dolce, e invitarvi a tornare una sera a nostre spese."
  - learner: "Accetto volentieri che ci offriate i secondi e il dolce. Per l'invito la ringrazio, ma preferirei tornare pagando, così potrò giudicare il locale come un cliente qualsiasi."
  - tutor: "Rispetto la sua scelta. Allora i secondi e il dolce li offriamo noi, e spero di rivederla presto, da cliente qualsiasi."
    goals: [resolve]

- scenario: organizzare-matrimonio
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Ci sposiamo a settembre a Camogli, perché è lì che ci siamo conosciuti, durante una vacanza in barca. La tema che abbiamo scelto è il mare, ma senza esagerare: niente reti da pesca sui tavoli, per intenderci."
    errors: [noun-gender]
  - tutor: "Camogli a settembre è perfetta. Ma ripeta «la tema»: è una parola di origine greca, come «programma». Che genere ha?"
    prompt: {text: "La tema", tags: [noun-gender]}
  - learner: "Ha ragione, il tema. Vorremmo una cerimonia sulla spiaggia e una cena in un ristorante sul porto, con una settantina di invitati, quasi tutti inglesi."
  - tutor: "Esatto. Settanta invitati dall'Inghilterra: dovremo pensare anche agli alberghi. Che budget avete?"
    goals: [vision]
  - learner: "Circa trentamila euro, alberghi esclusi, perché gli invitati se li pagheranno da soli. Preferiremmo spendere di più per il cibo e la musica, e risparmiare sui fiori e sugli addobbi, che il giorno dopo nessuno ricorda."
  - tutor: "Una scelta sensata. Per la cena ho due proposte: un ristorante sul porto, più caro, o una terrazza in collina, con vista, ma un po' scomoda da raggiungere."
    goals: [budget]
  - learner: "Se la terrazza fosse più vicina, la sceglierei senza pensarci. Ma con settanta persone, molte delle quali anziane, non vorrei che qualcuno si sentisse male in salita. Prenderei il ristorante sul porto, anche se costa di più."
  - tutor: "Il porto è più comodo, e la vista sul mare c'è comunque. Ci sono condizioni che volete fissare fin da ora?"
    goals: [choices]
  - learner: "Sì: vorremmo che ogni fornitore ci venisse presentato prima di firmare, e che il menù fosse tradotto in inglese per gli invitati. E se dovesse piovere, ci piacerebbe che la cerimonia si potesse spostare nella chiesetta sopra il porto."
  - tutor: "Tutto fattibile: i fornitori ve li presento a giugno, e la chiesetta la prenoto come piano di riserva."
    goals: [conditions]

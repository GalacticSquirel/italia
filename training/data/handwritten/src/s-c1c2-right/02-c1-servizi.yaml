# Set s-c1c2-right, file 2: C1, services and practical matters. Long, correct learner turns
# (passive, subjunctive, hypotheticals, clitics) left alone; a few independent subtle errors.
- scenario: assicurazione-sinistro
  level: C1
  persona: en-m-retired
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Stamattina, verso le otto e mezza, ero fermo in coda in viale Marconi, a Pescara. Pioveva forte, e un ragazzo in motorino, che stava superando le macchine sulla destra, ha scivolato sulle strisce pedonali ed è finito contro la mia portiera."
    errors: [auxiliary-choice]
  - tutor: "Spero che il ragazzo non si sia fatto male. Ripeta però «ha scivolato»: con questo verbo di movimento, quale ausiliare usiamo?"
    prompt: {text: "ha scivolato", tags: [auxiliary-choice]}
  - learner: "È scivolato, giusto, come è caduto. Per fortuna si è rialzato subito: aveva solo un graffio sul gomito. La mia portiera, invece, è stata ammaccata parecchio, e lo specchietto è rotto."
  - tutor: "Esatto. Meno male che il ragazzo sta bene. Secondo lei, di chi è la responsabilità?"
    goals: [what]
  - learner: "Direi che è sua, visto che superava a destra in una corsia in cui non si poteva passare. Lui stesso, del resto, l'ha riconosciuto subito, e mi ha detto che avrebbe firmato qualsiasi cosa, purché non chiamassi i vigili."
  - tutor: "Se c'è accordo, i vigili non sono indispensabili. Avete compilato la constatazione amichevole?"
    goals: [responsibility]
  - learner: "Sì, l'abbiamo compilata insieme sul cofano della mia macchina, sotto l'ombrello. L'unico dubbio riguarda il disegno: l'ha fatto lui, e temo che non sia chiarissimo dove mi ha colpito. Gliela posso mandare per email, o va consegnata in originale?"
  - tutor: "Può mandarla per email, ma l'originale va conservato fino alla chiusura della pratica. Il disegno, comunque, lo valuterà il perito."
    goals: [documents]
  - learner: "Perfetto. E adesso che cosa succede? Devo aspettare che mi chiami il perito, o posso già portare la macchina dal carrozziere?"
  - tutor: "Aspetti la chiamata del perito, che arriverà entro cinque giorni lavorativi. Se porta la macchina dal carrozziere prima, rischia che il danno non le venga riconosciuto."
    goals: [next]

- scenario: burocrazia-residenza
  level: C1
  persona: en-f-student
  turns:
  - tutor: "Buongiorno. Numero 47? Prego, mi dica."
  - learner: "Buongiorno, sì, il 47 sono io. Sono inglese e frequento un master al Politecnico di Torino. Vorrei trasferire qui la residenza, perché mi è stato detto che altrimenti non posso scegliere un medico di base."
  - tutor: "Le hanno detto bene. Ha con sé un documento d'identità e il contratto d'affitto?"
    goals: [request]
  - learner: "Il passaporto ce l'ho, eccolo. Il contratto invece è a nome di mio compagno, che è italiano e vive con me da un anno. Non so se basti, oppure se serva qualcos'altro."
    errors: [possessive]
  - tutor: "Dipende da che cosa c'è scritto. Ma ripeta «di mio compagno»: con «compagno», a differenza di «marito», il possessivo può stare da solo?"
    prompt: {text: "di mio compagno", tags: [possessive]}
  - learner: "No, ha ragione: è a nome del mio compagno. Lui mi ha detto che può firmare una dichiarazione in cui conferma che abito lì, se serve."
  - tutor: "Esatto, è proprio quella che le serve: la dichiarazione del titolare del contratto, con una copia del suo documento."
    goals: [documents]
  - learner: "Il problema è che lui è a Bruxelles per lavoro fino a fine mese. Sarebbe possibile presentare intanto la domanda e consegnare la dichiarazione al suo ritorno, oppure bisogna che sia tutto completo fin dall'inizio?"
  - tutor: "La domanda può presentarla oggi. La dichiarazione, firmata e con il documento allegato, il suo compagno può mandarla da Bruxelles all'indirizzo che le scrivo qui."
    goals: [problem]
  - learner: "Benissimo, così non perdiamo un mese. E dopo, quanto tempo ci vuole perché la residenza venga registrata? Mi hanno detto che passano i vigili a controllare."
  - tutor: "Sì, entro quarantacinque giorni passa un vigile a verificare che lei abiti davvero lì. Se in quel periodo non riceve comunicazioni, la residenza si considera concessa."
    goals: [next]

- scenario: medico-specialista
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
  - learner: "Buongiorno, dottoressa. Direi meglio, da quando prendo le nuove pastiglie. Il battito accelerato di cui le avevo parlato si presenta ancora, ma più di rado, una volta alla settimana al massimo, e di solito dopo un caffè."
  - tutor: "Una volta alla settimana è già un bel miglioramento, ma con il caffè starei attenta. Ha notato altri sintomi, per esempio dei capogiri?"
    new: [{lemma: capogiro, gloss: dizzy spell}]
  - learner: "Qualche capogiro quando mi alzo in fretta dal letto, ma niente di preoccupante, credo. Faccio fatica soprattutto in salita: prima facevo le scale di casa senza pensarci, adesso arrivo al terzo piano con il fiato corto."
  - tutor: "Lo annoto. In famiglia ci sono stati problemi di cuore?"
    goals: [symptoms]
  - learner: "Sì, mio padre ha avuto un infarto a sessant'anni, e mia nonna soffriva di pressione alta. Io invece sono sempre stata sportiva: da bambina ho fatto nuoto tutti i giorni, e fino ai quarant'anni ho corso due mezze maratone all'anno."
    errors: [tense-aspect]
  - tutor: "Una famiglia da tenere sotto controllo, quindi. Ma torni su «ho fatto nuoto tutti i giorni»: per un'abitudine dell'infanzia, è il tempo giusto?"
    prompt: {text: "ho fatto nuoto tutti i giorni", tags: [tense-aspect]}
    goals: [history]
  - learner: "No, ha ragione: da bambina facevo nuoto tutti i giorni. Ma mi dica, dottoressa, dagli esami risulta qualcosa di preoccupante?"
  - tutor: "Esatto. Gli esami nel complesso sono buoni: solo il colesterolo è un po' alto, e la pressione va ancora regolata."
    goals: [understand]
  - learner: "Quindi dovrò continuare con le stesse pastiglie? Le confesso che mi danno un po' di sonnolenza, soprattutto nel pomeriggio, e con le lezioni che ho non è il massimo."
  - tutor: "Continuiamo con le stesse, ma le prenderà la sera: così la sonnolenza dovrebbe passare mentre dorme. Ci rivediamo tra tre mesi, con gli esami del colesterolo."
    goals: [treatment]

- scenario: recensione-ristorante
  level: C1
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e mi dispiace doverlo segnalare, perché il locale mi era stato consigliato da un collega. Avevamo prenotato per festeggiare l'anniversario di matrimonio, ma tra l'antipasto e il primo è passata quasi un'ora."
  - tutor: "Un'ora è davvero troppo, mi scuso. C'è stato altro?"
    goals: [complain]
  - learner: "Purtroppo sì. Quando finalmente sono arrivati i primi, il risotto di mia moglie era ancora quasi crudo, e quando l'abbiamo fatto notare al cameriere, ci ha risposto che il risotto si mangia così. Non mi sembra il modo di rivolgersi a un cliente."
  - tutor: "Quella risposta non doveva darla, e ne parlerò con lui stasera stessa."
    goals: [detail]
  - learner: "La ringrazio. Le confesso che, visto il prezzo e le recensioni, mi aspettavo che il servizio era più attento, soprattutto in una serata così importante per noi."
    errors: [subjunctive-use]
  - tutor: "La capisco. Ma ripeta «mi aspettavo che il servizio era»: dopo «mi aspettavo che», il modo del verbo è quello giusto?"
    prompt: {text: "era più attento", tags: [subjunctive-use]}
  - learner: "Sì, mi aspettavo che il servizio era più attento, e soprattutto più gentile. Non chiedo niente di speciale, solo un minimo di cortesia."
    errors: [subjunctive-use]
  - tutor: "Che il servizio fosse più attento era il minimo, ha ragione. Posso offrirvi la cena, e una bottiglia di prosecco per l'anniversario, se restate per il dolce."
    recast: {text: "era più attento", fix: "fosse più attento", tags: [subjunctive-use]}
    goals: [expectation]
  - learner: "È molto gentile, il dolce lo accettiamo volentieri. Quanto alla cena, preferirei pagare almeno i vini: non vorrei che pensasse che ci siamo lamentati per non pagare."
  - tutor: "Non lo pensavo affatto, ma rispetto la sua scelta. Allora i vini a parte e il resto lo offre la casa: buon anniversario a tutti e due."
    goals: [resolve]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Abito in via Cavour, al civico 32. Due mesi fa hanno aperto un cantiere davanti al portone per rifare le tubature, e da allora non si è più visto nessuno: la strada è rimasta scavata e transennata, e per entrare in casa bisogna passare su una tavola di legno."
  - tutor: "Una tavola di legno? Capisco il disagio. Ha già fatto una segnalazione?"
    goals: [describe]
  - learner: "Sì, ne ho fatte due, una per telefono e una per email, ma nessuno mi ha mai risposto. La segnalazione per email è stata protocollato il cinque marzo, e ho ancora il numero."
    errors: [passive]
  - tutor: "Meno male che ha il numero. Ma ripeta «è stata protocollato»: l'ultima parola concorda con «la segnalazione»?"
    prompt: {text: "è stata protocollato", tags: [passive]}
  - learner: "È stata protocollata, ha ragione. Il numero è il 2241. Mia madre ha ottantadue anni, e da quando c'è quella tavola non esce più di casa da sola."
  - tutor: "Esatto. Purtroppo i lavori dipendono dall'ufficio tecnico, che ha tempi che noi non possiamo controllare."
  - learner: "Lo capisco, ma non posso accettare che una strada resti in queste condizioni per mesi senza che nessuno se ne assuma la responsabilità. Mi basterebbe sapere chi segue il cantiere e quando è prevista la chiusura."
  - tutor: "Ha ragione a chiederlo. Contatto oggi stesso l'ufficio tecnico e le faccio sapere il nome del responsabile."
    goals: [insist]
  - learner: "La ringrazio. E se entro un mese non succede niente, che cosa posso fare, formalmente? Esiste un reclamo scritto, oltre alle segnalazioni?"
  - tutor: "Sì, può presentare un reclamo formale qui allo sportello, e il Comune è tenuto a risponderle entro trenta giorni."
    goals: [rights]
  - learner: "Allora lo presento subito, così rimane agli atti. Mi può dare il numero di protocollo, quando l'avrà registrato?"
  - tutor: "Certo. Ecco il modulo: appena lo firma, le rilascio la ricevuta con il numero di protocollo."
    goals: [commitment]

- scenario: trattativa-affitto
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Molto, devo ammetterlo. Il soggiorno è luminosissimo e la zona è comoda, a due passi dalla metro. L'unica cosa che mi lascia perplesso è il canone: novecento euro per sessanta metri quadri mi sembrano tanti, anche per Milano."
  - tutor: "È in linea con i prezzi della zona, glielo assicuro. Ma il proprietario è disposto a trattare, entro certi limiti."
    goals: [interest]
  - learner: "Allora le farei una proposta: ottocentoventi euro al mese, con un contratto di quattro anni più quattro. Per il proprietario significherebbe un inquilino stabile, e io mi impegnerei a lasciare la casa come l'ho trovata."
  - tutor: "Ottocentoventi è un po' poco. Credo però che accetterebbe ottocentocinquanta, con un contratto di quattro più quattro."
    goals: [negotiate]
  - learner: "Ottocentocinquanta mi va bene, a patto che la cucina venga sistemata prima che entri: il forno non funziona e un'anta è rotta. Se il proprietario mi lo conferma per iscritto, sono pronto a firmare."
    errors: [combined-pronouns]
  - tutor: "Il forno l'avevo notato anch'io. Ripeta però «mi lo conferma»: quando i due pronomi si incontrano, quel «mi» resta così?"
    prompt: {text: "mi lo conferma", tags: [combined-pronouns]}
  - learner: "No, mi scusi: me lo conferma. E a proposito del contratto, quanto preavviso dovrei dare se dovessi andarmene prima?"
  - tutor: "Esatto. Il preavviso è di sei mesi, con lettera raccomandata, come prevede la legge."
    goals: [conditions]
  - learner: "Sei mesi mi sembrano ragionevoli. Allora, se mi manda la bozza del contratto con la clausola sulla cucina, la faccio leggere a un amico avvocato e gliela riporto firmata entro lunedì."
  - tutor: "Le mando la bozza domattina, con la clausola sulla cucina già inserita. Allora aspetto il contratto firmato lunedì."
    goals: [conclude]

- scenario: organizzare-matrimonio
  level: C1
  persona: es-f-erasmus
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Lo immaginiamo all'aperto, in una cascina sui colli piacentini, con una cerimonia civile al tramonto e una cena lunga, senza troppe formalità. Gli invitati saranno un centinaio, metà dei quali arriveranno dalla Spagna."
  - tutor: "Una cascina al tramonto, che bella idea. Con cento invitati, che budget avete in mente?"
    goals: [vision]
  - learner: "Vorremmo restare sotto i venticinquemila euro, viaggi degli invitati esclusi. Mio padre si è offerto di pagarci il fotografo, quindi quella voce possiamo toglierla, ma per il resto preferiremmo che ci proponesse soluzioni semplici piuttosto che pacchetti completi."
  - tutor: "Venticinquemila senza il fotografo si gestiscono bene. Vi ho trovato due posti: una cascina con giardino e una villa con piscina, che costa il venti per cento in più."
    goals: [budget]
  - learner: "La villa è splendida, ma se dovessimo spendere il venti per cento in più per la piscina, dovremmo rinunciare a qualcos'altro, e non saprei a cosa. Sceglierei la cascina, anche perché, se piovesse, il fienile coperto ci salverebbe la serata."
  - tutor: "Scelta saggia: il fienile è il punto forte della cascina. Ci sono condizioni particolari che volete fissare con me?"
    goals: [choices]
  - learner: "Sì, due. La prima è che ogni spesa superiore ai cinquecento euro ci venga comunicata prima, per iscritto. La seconda è che il menù sia in parte spagnolo: mia nonna ci tiene tantissimo, e non vorrei che si sentisse esclusa. Ci piacerebbe che la paella la preparasse un cuoco di Valencia che conosciamo."
  - tutor: "Entrambe le condizioni sono più che ragionevoli. Per il cuoco di Valencia devo solo parlarne con la cascina, ma ve lo confermo entro la settimana."
    goals: [conditions]

- scenario: turismo-di-massa
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno a tutti. Sono una guida turistica spagnola, vivo a Firenze da otto anni, e sono favorevole, anche se con qualche riserva. Credo che un ticket da solo non basti, ma che possa essere un primo passo, purché i soldi raccolti vengano spesi per chi in città ci vive."
  - tutor: "Una guida turistica favorevole al ticket: questa non me l'aspettavo. Ha un esempio concreto?"
    goals: [introduce]
  - learner: "Sì. In via dei Calzaiuoli, ad agosto, si cammina a passo d'uomo dalle nove del mattino, e il rumore delle valigie sulla pietra molesta i residenti fino a mezzanotte. Molti miei vicini anziani si sono trasferiti in periferia, perché non riuscivano più a dormire."
    errors: [false-friend]
  - tutor: "Il rumore dei trolley che disturba i residenti è quasi un classico, ormai. Ma non teme che il ticket allontani proprio i turisti migliori, quelli che restano qualche giorno?"
    recast: {text: "molesta", fix: "disturba", tags: [false-friend]}
    goals: [example]
  - learner: "Al contrario: il ticket colpirebbe soprattutto chi viene per due ore, scende dal pullman, scatta due foto e riparte. Chi dorme in città paga già la tassa di soggiorno, e potrebbe esserne esentato. Se la regola fosse questa, nessun turista serio si sentirebbe penalizzato."
  - tutor: "Un argomento sensato, lo ammetto. Ma allora qual è la sua proposta concreta?"
    goals: [rebut]
  - learner: "Proporrei un numero massimo di visitatori al giorno, con prenotazione online, e un ticket più alto nei fine settimana. E vorrei che una parte degli incassi fosse destinata ad affitti agevolati per i residenti, perché senza residenti il centro storico diventa un museo."
  - tutor: "Un centro storico senza residenti è davvero un museo, ha ragione. Grazie della telefonata, e buon lavoro con i suoi turisti!"
    goals: [proposal]

# Set s-c1c2-right, file 7: C2, work and public debate. Sophisticated, correct turns (consecutio,
# passive, hypotheticals, concessives) left alone; a few independent subtle errors (register slip,
# passive with andare, future in the past, fixed-phrase preposition, false friends, agreement).
- scenario: colloquio-lavoro
  level: C2
  persona: en-m-heritage
  history: [register]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, e grazie di avermi convocato. Sono nato a Boston da genitori calabresi, e l'italiano l'ho imparato prima a tavola e poi, più seriamente, all'università. Da dieci anni faccio il designer di interni: ho cominciato in uno studio di Boston e da tre anni lavoro a Milano, per un'azienda che arreda alberghi."
  - tutor: "Alberghi: spazi da vivere, ma anche da vendere. Come mai vuole cambiare?"
    goals: [intro]
  - learner: "Nell'ultima azienda progettavo sempre la stessa camera, in cento varianti, e a un certo punto mi ero rotto le scatole. Avevo bisogno di progetti in cui la creatività contasse più del catalogo."
    errors: [register]
  - tutor: "La motivazione la capisco. Però rilegga «mi ero rotto le scatole»: in un colloquio come questo, è il registro più adatto?"
    prompt: {text: "mi ero rotto le scatole", tags: [register]}
  - learner: "Ha ragione, mi è scappata: diciamo che avevo bisogno di nuovi stimoli. In tre anni ho comunque coordinato l'arredo di quattordici alberghi, gestendo budget fino a due milioni di euro, e quella disciplina sui costi me la porto dietro volentieri."
  - tutor: "Esatto, «nuovi stimoli» suona decisamente meglio. E quattordici alberghi sono un'esperienza notevole: quali sono i suoi punti di forza?"
    goals: [experience]
  - learner: "Credo che il mio punto di forza sia la capacità di tradurre i desideri vaghi dei clienti in soluzioni concrete, senza sforare i costi. Il mio punto debole, invece, è una certa impazienza: quando un progetto ristagna, tendo a prendere in mano anche ciò che spetterebbe ad altri."
  - tutor: "L'impazienza, qui, la mettiamo spesso alla prova, glielo dico subito. Perché proprio noi?"
    goals: [strengths]
  - learner: "Perché i vostri progetti per le case di riposo mi hanno colpito: siete riusciti a renderle accoglienti senza farle sembrare né alberghi né ospedali. Mio nonno ha passato i suoi ultimi anni in una struttura di Cosenza che sembrava una sala d'attesa, e da allora ci penso spesso."
  - tutor: "È il lavoro di cui andiamo più orgogliosi. Ha qualche domanda per me?"
    goals: [why]
  - learner: "Sì: vorrei sapere come è organizzato il gruppo di progettazione, e se i designer seguono i cantieri di persona o se il lavoro si svolge prevalentemente in studio."
  - tutor: "Lavoriamo in gruppi di tre, e ogni designer segue di persona almeno un cantiere alla settimana. Le faremo sapere entro dieci giorni."
    goals: [questions]

- scenario: presentazione-progetto
  level: C2
  persona: es-f-teacher
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Li userò bene. Oggi vendiamo i nostri divani in sei paesi, ma non in Spagna, che pure è uno dei mercati europei più grandi per l'arredamento. Le propongo di aprire un negozio online in spagnolo, appoggiandoci a un magazzino logistico a Barcellona, senza aprire per ora nessun punto vendita."
  - tutor: "La Spagna l'abbiamo già valutata due anni fa, e non se n'è fatto niente. Che cosa è cambiato?"
    goals: [pitch]
  - learner: "È cambiato il contesto. Due anni fa il progetto andrebbe stato approvato, se i costi di spedizione non fossero stati così alti; oggi, con il magazzino di Barcellona, si dimezzano."
    errors: [passive]
  - tutor: "L'argomento delle spedizioni è solido. Ma ripeta «andrebbe stato approvato»: il passivo con «andare» funziona nei tempi composti?"
    prompt: {text: "andrebbe stato approvato", tags: [passive]}
  - learner: "No, ha ragione: sarebbe dovuto essere approvato. Le stime dicono che nel primo anno potremmo fatturare un milione e mezzo, con un margine simile a quello del mercato francese, e raggiungere il pareggio entro diciotto mesi."
  - tutor: "Esatto. Un milione e mezzo il primo anno mi sembra ottimistico, però. E se le vendite non decollassero?"
    goals: [benefits]
  - learner: "Ho previsto anche questo. Il contratto con il magazzino è rescindibile dopo dodici mesi senza penali, e il sito costerebbe meno di quanto spendiamo in un anno per una sola fiera. Se le cose andassero male, perderemmo al massimo duecentomila euro, il che, per un'azienda delle nostre dimensioni, è un rischio sostenibile."
  - tutor: "Duecentomila come perdita massima è una cifra che posso difendere davanti al consiglio."
    goals: [objection]
  - learner: "Allora le proporrei di presentarlo insieme al consiglio di marzo, con un piano dettagliato per i primi sei mesi. Nel frattempo potrei avviare i contatti con due agenzie spagnole per la traduzione del catalogo."
  - tutor: "Va bene: prepari il piano per marzo, e intanto senta le agenzie, ma senza firmare nulla."
    goals: [next-steps]

- scenario: trattativa-fornitore
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. La chiamo per quello, sì, e non le nascondo una certa sorpresa. Che i costi siano saliti lo capisco; meno comprensibile è che un aumento del quindici per cento ci venga comunicato con una semplice email, a ordini già pianificati per tutto il trimestre."
  - tutor: "Sul metodo ha ragione, e me ne scuso. Sul merito, però, i margini non ci permettono di fare diversamente."
    goals: [problem]
  - learner: "Le chiedo allora di considerare il nostro rapporto nel suo insieme. Lavoriamo insieme da un periodo molto largo, nove anni, e in tutto questo tempo non abbiamo mai contestato una fattura né cambiato fornitore, nemmeno quando la concorrenza ci offriva prezzi più bassi."
    errors: [false-friend]
  - tutor: "Nove anni sono un periodo lungo, e la vostra fedeltà ce la ricordiamo bene. Che cosa propone?"
    recast: {text: "largo", fix: "lungo", tags: [false-friend]}
    goals: [argue]
  - learner: "Le propongo un aumento dell'otto per cento, bloccato per dodici mesi, a fronte di un nostro impegno a garantirvi un volume minimo annuo superiore del venti per cento a quello dell'anno scorso. In questo modo voi avreste la certezza degli ordini, e noi quella dei costi."
  - tutor: "L'otto è sotto la nostra soglia. Con quel volume garantito, però, potrei arrivare all'undici, bloccato per dodici mesi."
    goals: [counteroffer]
  - learner: "Se arrivassimo al dieci, chiuderei oggi stesso, con il volume garantito e i pagamenti a trenta giorni anziché a sessanta, che per voi immagino non sia un dettaglio trascurabile."
  - tutor: "I pagamenti a trenta giorni cambiano le cose. D'accordo per il dieci, bloccato per dodici mesi, con volume garantito e pagamento a trenta giorni."
  - learner: "Perfetto. Allora attendo la sua proposta scritta entro domani, e gliela restituisco firmata non appena l'avrà approvata il nostro amministratore delegato."
  - tutor: "Gliela mando stasera stessa. È stato un piacere trattare con lei, come sempre."
    goals: [agreement]

- scenario: mediazione-colleghi
  level: C2
  persona: en-f-professional
  history: [conditional-form]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Ha fatto bene a venire subito, invece di tenerselo dentro. Si sieda, la prego, e mi racconti con calma: preferisco sentire la sua versione prima di farmi un'idea."
  - tutor: "Il cliente ha chiesto chi avesse curato il piano di comunicazione, e Giulia ha risposto «io», senza nominarmi. Quel piano l'ho scritto io per tre quarti."
  - learner: "Immagino quanto le sia bruciato, soprattutto davanti al cliente. Mi aiuti a ricostruire, però: prima della riunione vi eravate accordate su chi avrebbe presentato il piano?"
  - tutor: "Sì, a voce. Giulia aveva detto che l'avremmo presentato insieme, e invece ha parlato solo lei."
    goals: [listen, clarify]
  - learner: "Ne ho parlato con Giulia stamattina, e la sua versione è un po' diversa. Mi ha detto che temeva che il cliente si spazientisse, e che pensava che lei la interromperebbe se avesse dimenticato qualcosa. Non la giustifico, ma forse non c'era cattiveria."
    errors: [conditional-form]
  - tutor: "Può darsi. Ma rilegga «pensava che lei la interromperebbe»: per un futuro visto dal passato, quale condizionale ci vuole?"
    prompt: {text: "la interromperebbe", tags: [conditional-form]}
  - learner: "Ha ragione: pensava che lei l'avrebbe interrotta. Il che non cambia il risultato: davanti al cliente, il merito è andato a una persona sola."
  - tutor: "Esatto. Ed è proprio questo, per me, il punto."
    goals: [perspective]
  - learner: "Le propongo una soluzione concreta: al prossimo incontro con il cliente, la settimana prossima, presenterà lei la parte sui social, che è interamente sua, e io presenterò il gruppo spiegando chi ha fatto che cosa. E con Giulia parlerò di nuovo, perché episodi del genere non si ripetano."
  - tutor: "Mi sembra equo, e la ringrazio di averlo preso sul serio."
    goals: [solution]

- scenario: riunione-lavoro
  level: C2
  persona: es-f-erasmus
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Diciamo che procede, anche se meno speditamente di quanto avessi sperato. La parte tecnica del nuovo portale clienti è pronta da una settimana; quello che manca è l'approvazione dei testi da parte dell'ufficio legale, che li tiene fermi da dieci giorni."
  - tutor: "Dieci giorni per qualche testo? Che cosa li blocca, esattamente?"
    goals: [update]
  - learner: "Pare che non siano convinti delle condizioni sul trattamento dei dati, e che vogliano riscrivere mezza informativa. Se almeno l'ufficio legale ci dasse una data, potremmo organizzare il lancio; così, invece, rischiamo di slittare a fine mese."
    errors: [subjunctive-form]
  - tutor: "Brutta storia. Ma ripeti «ci dasse»: come fa il congiuntivo imperfetto di dare?"
    prompt: {text: "ci dasse", tags: [subjunctive-form]}
  - learner: "Hai ragione: se ci desse una data. Il problema vero è che il cliente ha già annunciato il portale ai suoi distributori per il quindici."
  - tutor: "Esatto. E il quindici è tra due settimane. Hai una proposta?"
    goals: [problem]
  - learner: "Sì: potremmo lanciare il portale il quindici in versione ridotta, senza l'area riservata, che è l'unica parte che richiede la nuova informativa. L'area riservata la aggiungeremmo appena arriva il via libera dell'ufficio legale."
  - tutor: "Mi piace: il cliente ha il suo lancio, e noi non rischiamo niente."
    goals: [proposal]
  - learner: "Allora confermo al cliente il lancio del quindici, e chiedo all'ufficio legale di darci i testi definitivi entro la fine del mese. Se non ce li danno, ne parlo con il loro responsabile."
  - tutor: "Perfetto: lancio ridotto il quindici e area riservata entro fine mese. Tienimi aggiornata."
    goals: [deadline]

- scenario: smartworking
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Né l'una né l'altra cosa, a dire il vero. Da quando l'azienda ha disdetto l'affitto della sede, lavoro un po' dove capita: due giorni a casa, gli altri in una libreria comunale vicino a casa, che ha una sala studio silenziosissima e la connessione più veloce del quartiere."
    errors: [false-friend]
  - tutor: "Una biblioteca comunale come ufficio: geniale. E ti trovi bene?"
    recast: {text: "libreria", fix: "biblioteca", tags: [false-friend]}
    goals: [situation]
  - learner: "Benissimo, per certe cose. Lì riesco a concentrarmi come non mi succedeva da anni: nessuno che ti interrompe, nessuna riunione improvvisata, e quando esco ho la sensazione di aver lavorato davvero. E poi risparmio un'ora di treno al giorno, che a fine mese non è poco."
  - tutor: "Un'ora di treno in meno vale oro. Ma qualche lato negativo ci sarà, no?"
    goals: [pros]
  - learner: "Più d'uno. Le telefonate, per esempio: in sala studio non si può parlare, e ogni volta devo uscire sulle scale, anche d'inverno. E mi mancano i colleghi, non tanto per il lavoro, quanto per quelle chiacchiere davanti alla macchinetta da cui nascevano le idee migliori."
  - tutor: "Le idee migliori nascono sempre alla macchinetta, è una legge di natura. Se potessi scegliere, come ti organizzeresti?"
    goals: [cons]
  - learner: "Se dipendesse da me, l'azienda prenderebbe in affitto un piccolo spazio condiviso, dove potremmo ritrovarci due giorni alla settimana. Il resto del tempo continuerei in biblioteca, che ormai è diventata quasi casa mia."
  - tutor: "E allora proponilo: uno spazio condiviso costa molto meno di una sede, e il tuo capo potrebbe anche dirti di sì."
    goals: [preference]

- scenario: politica-lavoro
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che fai il profeta da almeno cinque anni, Riccardo, e intanto i lavori ci sono ancora. Non escludo che molti mestieri cambino radicalmente, ma da qui a dire che metà spariranno ce ne passa."
  - tutor: "Cambiare radicalmente, per chi ha cinquant'anni, è come sparire."
    goals: [opinion]
  - learner: "Questo è un punto serio, e non lo sottovaluto. Se domani le banche sostituissero tutti gli sportellisti con dei programmi, chi ha cinquant'anni e ha fatto solo quel lavoro avrebbe enormi difficoltà a ricollocarsi. In lungo termine, però, nasceranno professioni che oggi non riusciamo nemmeno a immaginare."
    errors: [preposition]
  - tutor: "Professioni che non riusciamo a immaginare, appunto: comodo. Ma ripeti «in lungo termine»: in quell'espressione fissa, la preposizione è proprio quella?"
    prompt: {text: "In lungo termine", tags: [preposition]}
    goals: [hypothesis]
  - learner: "No, giusto: a lungo termine. E non è un argomento comodo: trent'anni fa nessuno avrebbe immaginato che un giorno si potesse vivere progettando applicazioni per telefoni."
  - tutor: "Esatto. Ma hai un esempio concreto, di qualcuno che conosci?"
  - learner: "Mio cognato faceva il tipografo a Leeds. Quando la tipografia ha chiuso, aveva quarantotto anni e due figli all'università; ha seguito un corso pagato dal comune e oggi gestisce la stampa digitale per una catena di negozi. Non dico che sia stato facile, ma dimostra che, con gli strumenti giusti, ci si può reinventare."
  - tutor: "Bella storia, e la prendo per buona."
    goals: [example]
  - learner: "Insomma, la tecnologia non è né buona né cattiva: tutto dipende da quanto investiremo nella formazione. Ma dimmi la verità, Riccardo: tu, se avessi vent'anni, che cosa studieresti?"
  - tutor: "Medicina, senza pensarci due volte: almeno finché i pazienti preferiranno lamentarsi con una persona in carne e ossa."
    goals: [conclude]

- scenario: turismo-di-massa
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore del ticket d'ingresso o contro?"
  - learner: "Buongiorno, e complimenti per la trasmissione. Sono contrario, e le spiego perché: gestisco una piccola trattoria a Cannaregio, e vedo ogni giorno che il problema non sono i turisti in quanto tali, ma il modo in cui vengono riversati in città, tutti alla stessa ora e negli stessi tre chilometri quadrati."
  - tutor: "Un ristoratore contrario al ticket: non è proprio una sorpresa. Ha un esempio concreto?"
    goals: [introduce]
  - learner: "Certo. Quando arrivano venti pullman di gite organizzate nello stesso giorno, tra le dieci e le quattro il ponte di Rialto diventa impraticabile, e dopo le cinque la città si svuota di colpo. Le calli e i vaporetti, a fine giornata, sono stremate, e i veneziani pure."
    errors: [adjective-agreement]
  - tutor: "Quel quadro lo conosciamo bene. Ma ripeta «sono stremate»: con un soggetto misto, maschile e femminile, l'aggettivo va bene così?"
    prompt: {text: "stremate", tags: [adjective-agreement]}
  - learner: "Ha ragione: sono stremati. E il ticket non cambia niente: chi viene per un giorno paga cinque euro e arriva lo stesso, alla stessa ora, nello stesso punto."
  - tutor: "Esatto. Ma senza ticket, come si governano i flussi? E qualche soldo per la città bisognerà pur trovarlo."
    goals: [example]
  - learner: "Lo so, e non pretendo che si rinunci agli incassi. Dico solo che il ticket è una tassa travestita da soluzione. Se si fissasse un numero massimo di ingressi giornalieri, con prenotazione obbligatoria per i gruppi, la città respirerebbe senza perdere un euro."
  - tutor: "Un tetto agli ingressi al posto del ticket: un'idea che piacerà a pochi politici."
    goals: [rebut]
  - learner: "Forse, ma piacerebbe a molti veneziani. E comincerei dai gruppi organizzati, che sono facili da contare: orari scaglionati, approdi diversi, e una parte del ricavato destinata alla manutenzione delle calli."
  - tutor: "Orari scaglionati e approdi diversi: è una proposta concreta, glielo riconosco. Grazie della telefonata, e buon lavoro in trattoria!"
    goals: [proposal]

# Set s-c1c2-right, file 1: C1, work. Long, correct, complex learner turns left alone with
# content-focused replies; a few independent subtle errors, corrected.
- scenario: colloquio-lavoro
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno, e grazie per l'invito. Sono scozzese, di Edimburgo, e mi sono trasferita a Bologna tre anni fa, quando mio marito ha avuto un posto all'università. Prima di partire lavoravo come grafica in un'agenzia che si occupava soprattutto di marchi alimentari."
  - tutor: "Bologna e i marchi alimentari vanno d'accordo, direi. Che cosa ha fatto da quando è arrivata qui?"
    goals: [intro]
  - learner: "Per il primo anno ho lavorato come libera professionista, perché il mio italiano non era ancora all'altezza di un ufficio. Poi un caseificio di Modena mi ha affidato il restyling di tutta la linea, e da lì sono arrivati altri clienti. Mi occupavo dei imballaggi, ma anche del sito e dei cataloghi."
    errors: [article-form]
  - tutor: "Un caseificio intero, niente male. Però torni su «dei imballaggi»: davanti a una parola che comincia per vocale, quell'articolo va bene?"
    prompt: {text: "dei imballaggi", tags: [article-form]}
  - learner: "Ha ragione: degli imballaggi. Del resto è il lavoro che preferisco, perché una confezione ben fatta viene notata prima ancora che si legga il nome del prodotto."
  - tutor: "Esatto. E quando funziona, viene anche ricordata. Mi dica un suo punto di forza e uno debole."
    goals: [experience]
  - learner: "Credo di essere brava ad ascoltare i clienti, anche quando non sanno bene che cosa vogliono, il che succede più spesso di quanto si pensi. Il mio difetto è che fatico a dire di no: se un cliente mi chiede una modifica all'ultimo minuto, finisco per accontentarlo anche a costo di lavorare di notte."
  - tutor: "Qualche notte per un cliente l'abbiamo passata tutti, qui dentro. Perché vorrebbe lavorare con noi, invece di restare libera professionista?"
    goals: [strengths]
  - learner: "Perché mi manca lavorare in squadra. Da sola posso scegliere i progetti, ma nessuno mi contraddice, e mi sono resa conto che le mie idee migliori sono sempre nate da una discussione. Il vostro studio, poi, lavora con piccole aziende del territorio, che è proprio il tipo di cliente che conosco meglio."
  - tutor: "Di discussioni qui non ne mancano, glielo garantisco. Ha qualche domanda da farmi sul ruolo?"
    goals: [why]
  - learner: "Sì, una sola. Vorrei sapere se il contratto prevede un periodo di prova e, nel caso, quanto durerebbe."
  - tutor: "Sì, tre mesi, come per tutti i nuovi assunti. In ogni caso le daremo una risposta entro venerdì prossimo."
    goals: [questions]

- scenario: colloquio-promozione
  level: C1
  persona: es-m-worker
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie per avermi ricevuto con così poco preavviso. Volevo fare il punto sull'ultimo anno: da quando mi è stato affidato il servizio clienti in lingua spagnola, i tempi di risposta si sono dimezzati, e le valutazioni dei clienti sono passate da tre a quattro stelle e mezzo."
  - tutor: "I numeri li ho visti, e sono notevoli. A che cosa pensa, concretamente?"
    goals: [results]
  - learner: "Penso che sia arrivato il momento di ufficializzare quello che di fatto faccio già. Coordino quattro colleghi, organizzo i turni e formo i nuovi arrivati, ma sul contratto risulto ancora operatore. Mi piacerebbe che mi venisse riconosciuto il ruolo di responsabile del gruppo, con l'aumento che ne consegue."
  - tutor: "La richiesta è comprensibile. Il problema è che il budget per gli aumenti di quest'anno è già stato assegnato fino a dicembre."
    goals: [request]
  - learner: "Lo immaginavo, e non pretendo che si trovino soldi che non ci sono. Le propongo una soluzione in due tempi: il titolo adesso, che all'azienda non costa nulla, e l'adeguamento dello stipendio a gennaio, con il nuovo budget. Sono disposto a sperare qualche mese, ma nei confronti dei colleghi avrei subito l'autorità per prendere certe decisioni."
    errors: [false-friend]
  - tutor: "Aspettare qualche mese è ragionevole, e il titolo prima dello stipendio mi sembra una proposta sensata. Ne parlerò con le risorse umane: come le piacerebbe procedere?"
    recast: {text: "sperare", fix: "aspettare", tags: [false-friend]}
    goals: [handle]
  - learner: "Se fosse possibile, vorrei che fissassimo già ora un incontro per gennaio, così da non dover ricominciare da capo. Nel frattempo le preparo una descrizione scritta delle mie mansioni, che potrà girare alle risorse umane."
  - tutor: "D'accordo: la descrizione me la manda entro fine mese, e l'incontro lo fissiamo per la seconda settimana di gennaio."
    goals: [next-steps]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Cercherò di essere breve. Ogni giorno i nostri autisti consegnano circa trecento bolle di carta, che poi vengono ricopiate a mano in ufficio. Le propongo di passare alla firma digitale al momento della consegna, in modo che i dati arrivino in sede in tempo reale."
  - tutor: "Ricopiate a mano? Non lo sapevo nemmeno. Quanto ci farebbe risparmiare?"
    goals: [pitch]
  - learner: "Secondo i miei calcoli, due persone dell'amministrazione passano metà della giornata su quelle bolle. Se il sistema fosse operativo da gennaio, recupereremmo circa duemila ore l'anno, senza contare gli errori di trascrizione, che oggi ci costano parecchio in contestazioni con i clienti."
  - tutor: "Duemila ore sono un argomento serio. Ma i nostri autisti non sono tutti giovani, e qualcuno il telefono lo usa a malapena."
    goals: [benefits]
  - learner: "È vero, e ci ho pensato. Per funzionare, è necessario che tutti gli autisti abbino un tablet semplice, con una sola schermata per la firma. Il fornitore offre anche una mezza giornata di formazione gratuita."
    errors: [subjunctive-form]
  - tutor: "La formazione gratuita aiuta. Però torni su «abbino»: qual è il congiuntivo presente di avere alla terza persona plurale?"
    prompt: {text: "abbino", tags: [subjunctive-form]}
  - learner: "Abbiano, mi scusi: è necessario che abbiano un tablet. Il costo è di circa trecento euro a testa, quindi per venti autisti parliamo di seimila euro, che recupereremmo in pochi mesi."
  - tutor: "Esatto. Seimila euro sono accettabili, a patto che la spesa rientri entro l'anno."
    goals: [objection]
  - learner: "Se è d'accordo, partirei con una prova su cinque autisti per due mesi, scegliendo anche quelli più diffidenti. Alla fine le porterei i dati reali, così potrà decidere con i numeri sotto gli occhi."
  - tutor: "Mi piace l'idea di coinvolgere proprio i più diffidenti. Proceda con la prova e mi presenti i risultati a fine marzo."
    goals: [next-steps]

- scenario: riunione-lavoro
  level: C1
  persona: es-f-teacher
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Bene, direi, anche se ci ho messo più del previsto. Il corso di formazione per i nuovi assunti è quasi pronto: i moduli sono stati scritti tutti, e tre su cinque sono già stati registrati in video."
  - tutor: "Tre su cinque, quindi siamo oltre la metà. E gli altri due?"
    goals: [update]
  - learner: "È lì che c'è il problema. Il collega dell'ufficio legale, a che avevamo affidato il modulo sulla privacy, si è ammalato la settimana scorsa e non si sa quando tornerà."
    errors: [relative-pronoun]
  - tutor: "Proprio lui, che sfortuna. Ripeti però «a che avevamo affidato»: dopo la preposizione «a», quel relativo funziona?"
    prompt: {text: "a che avevamo affidato", tags: [relative-pronoun]}
  - learner: "No, giusto: il collega a cui avevamo affidato il modulo. Senza di lui quella parte non la può fare nessuno, almeno non con la stessa competenza."
  - tutor: "Perfetto. Hai già pensato a un'alternativa?"
    goals: [problem]
  - learner: "Sì, ne ho pensate due. Potremmo rivolgerci a uno studio esterno, che però costerebbe circa ottocento euro, oppure far partire il corso senza quel modulo e aggiungerlo appena il collega sarà rientrato. Io sceglierei la seconda strada: i nuovi assunti arrivano il primo del mese, e mi sembra più importante che trovino il corso pronto."
  - tutor: "Sono d'accordo, la privacy può aspettare qualche settimana. Quando pensi di chiudere gli altri due moduli?"
    goals: [proposal]
  - learner: "Il quarto lo registro giovedì, e il quinto entro martedì prossimo, così ci restano un paio di giorni per i sottotitoli. Te lo mando appena è montato, se vuoi dargli un'occhiata prima."
  - tutor: "Sì, mandamelo pure. Allora tutto pronto entro martedì, e il modulo sulla privacy lo aggiungiamo dopo."
    goals: [deadline]

- scenario: trattativa-fornitore
  level: C1
  persona: en-f-professional
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo proprio per quello. Non metto in dubbio che i costi siano aumentati, ma un rincaro del quindici per cento da un mese all'altro, senza nessun preavviso, per un'azienda piccola come la nostra è difficile da assorbire."
  - tutor: "Mi dispiace che la comunicazione sia arrivata così tardi. Purtroppo, però, il listino vale per tutti i clienti."
    goals: [problem]
  - learner: "Lavoriamo con voi da sei anni e non abbiamo mai pagato in ritardo, nemmeno durante la pandemia. Attualmente siamo stati noi a consigliarvi a due aziende della nostra zona, che oggi sono vostri clienti. Credo che questo meriti almeno una riflessione."
    errors: [false-friend]
  - tutor: "In realtà lo so bene, e quei due clienti ci fanno molto comodo. Che cosa mi proporrebbe, allora?"
    recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    goals: [argue]
  - learner: "Le proporrei un aumento del sette per cento, valido fino a giugno, a condizione che ci garantiate le consegne entro cinque giorni. In cambio potremmo raddoppiare l'ordine trimestrale, così da compensare in parte il vostro margine."
  - tutor: "Il sette è troppo poco, glielo dico subito. Con l'ordine raddoppiato, però, potrei arrivare al dieci, consegne in cinque giorni comprese."
    goals: [counteroffer]
  - learner: "Dieci per cento con l'ordine raddoppiato e le consegne garantite: mi sembra un compromesso ragionevole. Se mi manda la proposta per iscritto entro domani, la sottopongo al mio direttore e gliela rimando firmata entro venerdì."
  - tutor: "Gliela mando stasera stessa. Restiamo così: dieci per cento fino a giugno, ordine doppio e consegna in cinque giorni."
    goals: [agreement]

- scenario: smartworking
  level: C1
  persona: es-m-worker
  history: [participle-agreement]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da quando ci siamo trasferiti in campagna, sopra Bergamo, vado in ufficio solo il martedì. Per il resto lavoro da una stanzetta che dà sull'orto, ed è molto più comodo che fare un'ora di coda in tangenziale tutte le mattine."
  - tutor: "Una stanza sull'orto, che invidia. E con le riunioni come fai?"
    goals: [situation]
  - learner: "Le riunioni le ho spostato tutte al martedì, così le faccio di persona. Il resto della settimana posso concentrarmi sui progetti senza che nessuno mi interrompa ogni dieci minuti."
    errors: [participle-agreement]
  - tutor: "Furbo. Ma ripeti quel «le ho spostato»: con «le» davanti, il participio può restare così?"
    prompt: {text: "le ho spostato", tags: [participle-agreement]}
  - learner: "Sì, le ho spostato tutte al martedì, anche quelle con i clienti. E da allora i progetti li consegno quasi sempre in anticipo."
    errors: [participle-agreement]
  - tutor: "Spostate tutte al martedì, anche quelle con i clienti: sei diventato un maestro dell'organizzazione. Ma qualche svantaggio ci sarà, no?"
    recast: {text: "spostato", fix: "spostate", tags: [participle-agreement]}
    goals: [pros]
  - learner: "Ce ne sono, certo. D'inverno, quando nevica, la connessione salta di continuo, e una volta ho dovuto presentare un progetto a un cliente dal parcheggio del supermercato, l'unico posto in cui il telefono prendeva. E poi mi mancano un po' i colleghi, soprattutto le pause pranzo insieme."
  - tutor: "Dal parcheggio del supermercato! Spero almeno che il cliente non se ne sia accorto. Se potessi scegliere, cambieresti qualcosa?"
    goals: [cons]
  - learner: "Se potessi, andrei in ufficio due giorni invece di uno, così vedrei i colleghi anche il giovedì. Ma con un'ora e mezza di viaggio, a meno che l'azienda non mi rimborsi la benzina, non credo che ne valga la pena."
  - tutor: "Allora chiedi il rimborso della benzina: male che vada, ti dicono di no."
    goals: [preference]

- scenario: mediazione-colleghi
  level: C1
  persona: en-m-traveller
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Nessun disturbo, anzi, ho notato anch'io che ieri era di cattivo umore. Si sieda pure e mi racconti con calma come sono andate le cose, dal suo punto di vista."
  - tutor: "Ho lavorato tre settimane al rapporto sui fornitori, e ieri Paolo l'ha presentato al direttore come se fosse tutto merito suo. Il mio nome non l'ha nemmeno citato."
  - learner: "Capisco che sia frustrante, soprattutto dopo tre settimane di lavoro. Al suo posto, probabilmente, sarei arrabbiato anch'io. Mi aiuti a capire una cosa, però: il rapporto l'avevate scritto insieme, o Paolo si era limitato a rileggerlo?"
  - tutor: "Lui ha fatto i grafici, in un pomeriggio. Tutto il resto, i dati e le interviste, è opera mia."
    goals: [listen, clarify]
  - learner: "Allora è giusto che il suo lavoro venga riconosciuto. Ho parlato con Paolo stamattina, e mi ha detto che pensava di presentarlo a nome di tutti e due. Credo che non si è reso conto di quanto la cosa l'abbia ferita."
    errors: [subjunctive-use]
  - tutor: "Può darsi. Però ripeta «non si è reso conto»: dopo «credo che», il verbo va bene così?"
    prompt: {text: "non si è reso conto", tags: [subjunctive-use]}
  - learner: "No, mi scusi: credo che non si sia reso conto. Questo non giustifica niente, ma forse non l'ha fatto apposta."
  - tutor: "Esatto. Forse no, ma intanto il direttore pensa che il rapporto sia suo."
    goals: [perspective]
  - learner: "Le propongo questo: venerdì, alla riunione di reparto, presenterà lei i risultati, e io dirò chiaramente al direttore chi ha scritto il rapporto. E d'ora in poi, nei documenti condivisi, indicheremo sempre chi ha lavorato a ogni parte."
  - tutor: "Mi sembra giusto, e la ringrazio. Venerdì, allora, preparo la presentazione."
    goals: [solution]

- scenario: politica-lavoro
  level: C1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Dico che lo si diceva anche quando sono arrivati i bancomat, Riccardo, e i bancari ci sono ancora. Non nego che molti lavori cambieranno, ma non è detto che spariscano: più probabilmente si trasformeranno."
  - tutor: "I bancari ci sono, ma metà delle filiali le hanno chiuse. E trasformarsi, a cinquant'anni, non è così semplice."
    goals: [opinion]
  - learner: "Su questo hai ragione. Se lo Stato non investisse nella formazione degli adulti, chi perde il lavoro a cinquant'anni resterebbe tagliato fuori per sempre. Ma se i corsi fossero seri e pagati, molti potrebbero reinventarsi, come è già successo in altri paesi."
  - tutor: "«Se i corsi fossero seri»: appunto, se. Hai un esempio concreto, o è solo una speranza?"
    goals: [hypothesis]
  - learner: "Ne ho uno in famiglia. Mia zia, a Siviglia, faceva la cassiera in un supermercato che ha installato le casse automatiche. L'hanno mandata a un corso di sei mesi, e oggi si occupa degli ordini online dello stesso negozio, guadagnando anche qualcosa in più."
  - tutor: "Bella storia, e tua zia è stata brava. Ma per una che ce la fa, quante restano a casa?"
    goals: [example]
  - learner: "Non pretendo che l'esempio di mia zia valga per tutti. Però di persone come lei conosco parecchie, e nessuna è rimasta a casa."
    errors: [ci-ne]
  - tutor: "Può essere. Ma rileggi «di persone come lei conosco parecchie»: se metti «di persone» in testa alla frase, il verbo non vuole un pronome che le riprenda?"
    prompt: {text: "di persone come lei conosco parecchie", tags: [ci-ne]}
  - learner: "Sì, certo: di persone come lei ne conosco parecchie. Insomma, il problema non è la tecnologia, ma come la gestiamo. E tu, onestamente, se avessi vent'anni, che lavoro sceglieresti?"
  - tutor: "Esatto. Onestamente? L'idraulico: nessuna macchina mi verrà a riparare il lavandino tanto presto."
    goals: [conclude]

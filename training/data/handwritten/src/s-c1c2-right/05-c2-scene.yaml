# Set s-c1c2-right, file 5: C2, social and literary scenes. Sophisticated, correct turns (formal
# register, combined pronouns, subjunctive, hypotheticals) left alone; a few independent subtle
# errors (idiom, relative, formal imperative, sequence of tenses, false friend).
- scenario: assemblea-condominio
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie, sarò breve. Nessuno contesta che la facciata abbia bisogno di un intervento; quello che contesto è la fretta. Il preventivo ci è stato consegnato solo dieci giorni fa, e mi sembra difficile che qualcuno di noi abbia avuto il tempo di confrontarlo con altre offerte."
  - tutor: "Messa così, è una posizione ragionevole. Ma la signora del terzo piano dice che lei vuole rimandare solo perché al piano terra le infiltrazioni non arrivano."
    goals: [position]
  - learner: "Capisco l'esasperazione della signora, e non vorrei gettare benzina sull'olio. Le assicuro però che, se abitassi al terzo piano, chiederei esattamente la stessa cosa: due preventivi in più, prima di firmare una spesa da duecentomila euro."
    errors: [word-choice]
  - tutor: "Gettare benzina sul fuoco, stasera, sarebbe facilissimo, quindi la ringrazio della calma. Ha una proposta concreta da mettere ai voti?"
    recast: {text: "gettare benzina sull'olio", fix: "gettare benzina sul fuoco", tags: [word-choice]}
    goals: [defuse]
  - learner: "Sì. Propongo che stasera si deliberi un intervento urgente sulle infiltrazioni del terzo piano, che non può aspettare, e che il rifacimento dell'intera facciata venga rinviato all'assemblea di marzo, dopo aver raccolto almeno due preventivi alternativi."
  - tutor: "L'intervento urgente avrebbe un costo contenuto, ripartito in millesimi come di consueto. Vedo parecchie mani alzate a favore, devo dire."
    goals: [alternative]
  - learner: "Se mi permette un'ultima cosa: vorrei che risultasse a verbale che nessuno qui intende bloccare i lavori, ma solo deciderli con cognizione di causa. E sarei disposto, insieme a un altro condomino, a occuparmi io di raccogliere i preventivi entro gennaio."
  - tutor: "Lo metto a verbale parola per parola: intervento urgente subito, facciata a marzo, e lei con un altro condomino incaricato dei preventivi entro gennaio."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-m-worker
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Le assicuro che esisto, anche se stasera, lo confesso, sono un po' emozionato. Grazie dell'invito, e complimenti per la casa: quel soffitto affrescato è una meraviglia. Laura mi aveva detto che era bella, ma non immaginavo fino a questo punto."
  - tutor: "Il soffitto è del Settecento, e le crepe pure. Ma assaggi l'arrosto: mia moglie lo prepara solo per le occasioni importanti."
    goals: [compliment]
  - learner: "Allora mi sento onorato due volte. È squisito, davvero: sento il rosmarino, e forse anche un po' di vino bianco? Mi ne ha parlato tanto anche Laura, dell'arrosto della mamma, e adesso capisco perché."
    errors: [combined-pronouns]
  - tutor: "Il vino bianco c'è, ha buon palato. Ma ripeta «mi ne ha parlato»: quando quei due pronomi si incontrano, il primo resta uguale?"
    prompt: {text: "Mi ne ha parlato", tags: [combined-pronouns]}
  - learner: "Ha ragione: me ne ha parlato, e non ha esagerato per niente. Se un giorno sua moglie volesse svelarmi il segreto, gliene sarei grato per sempre."
  - tutor: "Esatto. Il segreto non lo svela nemmeno a me, dopo trentacinque anni. Ma mi dica, di che cosa si occupa, esattamente?"
  - learner: "Sono ingegnere idraulico e lavoro per un consorzio di bonifica, qui in Toscana. Mi occupo soprattutto di prevenire le alluvioni: un lavoro poco romantico, ma di questi tempi piuttosto necessario. Con Laura stiamo pensando di comprare casa vicino a Prato, sempre che la banca ci conceda il mutuo."
  - tutor: "Un ingegnere che previene le alluvioni: finalmente qualcuno in famiglia che sa tenere l'acqua al suo posto. Io, come vede, so tenere a bada solo il vino."
    goals: [background]
  - learner: "Allora ci completiamo a vicenda: io mi occupo dell'acqua, e lei del vino. Anzi, se me lo permette, le proporrei di brindare proprio a questo."
  - tutor: "Brindiamo, allora. E visto che ormai siamo quasi parenti, che ne dice di darci del tu?"
    goals: [irony]
  - learner: "Ne sarei felicissimo, grazie. Allora alla tua salute, e a quella di tua moglie, che spero mi perdonerà se mi servo una seconda volta di arrosto."
  - tutor: "Servirsi due volte è il complimento più bello che si possa fare a una cuoca. Alla salute!"
    goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Insopportabile no, ma ostinato fino alla caparbietà, questo sì. Eppure è proprio la sua ostinazione a renderlo memorabile: se fosse sceso dagli alberi alla prima difficoltà, il romanzo non sarebbe altro che una favola per ragazzi."
  - tutor: "Una favola per ragazzi, in fondo, lo è. O no?"
    goals: [impression]
  - learner: "Non direi. Per me il tema centrale è la distanza: Cosimo si allontana dal mondo per poterlo vedere meglio, e dagli alberi partecipa alla vita della comunità più di quanto non facciano quelli rimasti a terra. È un'allegoria dell'intellettuale, la cui la libertà dipende proprio dal non appartenere del tutto."
    errors: [relative-pronoun]
  - tutor: "L'allegoria dell'intellettuale: bella tesi. Ma rileggi «la cui la libertà»: dopo «la cui», ci vuole davvero un altro articolo?"
    prompt: {text: "la cui la libertà", tags: [relative-pronoun]}
  - learner: "No, certo: la cui libertà. E ne è un esempio il momento in cui Cosimo aiuta i paesani a spegnere un incendio nel bosco: è lontano da tutti, ma è il primo ad accorgersene."
  - tutor: "Esatto. E lo stile? Io lo trovo fin troppo elegante, quasi freddo."
    goals: [theme]
  - learner: "Elegante sì, freddo no. Calvino racconta con una leggerezza ironica che a volte nasconde la malinconia: il narratore è il fratello, che ammira Cosimo ma non lo capisce fino in fondo, e questo crea una distanza che rende tutto più umano."
  - tutor: "Il fratello che non capisce fino in fondo: ottima osservazione. Ma io insisto, Cosimo è un egoista che ha sacrificato la famiglia a un capriccio."
    goals: [style]
  - learner: "Non sono d'accordo. Un capriccio dura un pomeriggio, non una vita intera. Se Cosimo fosse stato solo un egoista, non avrebbe passato gli anni a difendere il bosco e la gente del paese. La sua è una ribellione coerente, anche quando costa cara."
  - tutor: "«Un capriccio dura un pomeriggio»: questa me la rubo. E per il prossimo incontro, che cosa proporresti?"
    goals: [disagree]
  - learner: "Proporrei «Le città invisibili», sempre di Calvino: è più difficile, ma dopo il barone ci farebbe scoprire un Calvino completamente diverso."
  - tutor: "Mi hai convinto. Allora «Le città invisibili», e vediamo chi avrà il coraggio di dire che non gli sono piaciute."
    goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: en-m-heritage
  history: [imperative-form]
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non se lo doveva disturbare, con tutto il lavoro che ha."
  - learner: "Ci mancherebbe, non sarei potuto restare a Milano sapendo che lei era qui ad affrontare tutto questo. Le porgo le mie più sentite condoglianze, anche a nome dei colleghi dell'ufficio, che mi hanno pregato di dirle quanto le siano vicini."
  - tutor: "Siete stati molto gentili, tutti. La mamma se n'è andata serena, e questo è già qualcosa."
    goals: [condolences]
  - learner: "Me la ricordo bene, sua madre, da quella volta che venne a trovarla in ufficio con i taralli fatti in casa. Ne portò due vassoi, e prima di andarsene si assicurò che ognuno di noi li avesse assaggiati. Parlava di lei con un orgoglio che non ho dimenticato."
  - tutor: "Era fatta così: nessuno doveva andarsene a stomaco vuoto. Grazie di avermelo ricordato."
    goals: [memory]
  - learner: "Se c'è qualcosa che posso fare, qualsiasi cosa, mi chiami pure, non esita. Posso occuparmi io delle pratiche in ufficio mentre lei è qui, così non deve pensarci."
    errors: [imperative-form]
  - tutor: "È un pensiero molto gentile. Ma ripeta «non esita»: dando del lei, l'imperativo negativo prende quella forma?"
    prompt: {text: "non esita", tags: [imperative-form]}
  - learner: "Ha ragione, mi scusi: non esiti. Le pratiche le seguo io, e se per il cantiere di Lecce servisse una firma, gliela farei arrivare qui senza che lei debba muoversi."
  - tutor: "Esatto. Mi toglierebbe davvero un pensiero, la ringrazio."
    goals: [offer-help]
  - learner: "Allora non la trattengo oltre: immagino che abbia ancora molte persone da salutare. Si prenda tutto il tempo che le serve, e quando se la sentirà, la aspettiamo in ufficio."
  - tutor: "Grazie ancora, di cuore. Saluti tutti da parte mia, e faccia buon viaggio."
    goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Solo in parte, a dire il vero. Ho capito che uno prendeva in giro l'altro per una partita persa, ma metà delle parole mi sfuggiva. Quello che mi ha colpito è la musicalità: le frasi finivano tutte con un'intonazione che saliva, come se fossero domande anche quando non lo erano."
  - tutor: "Hai un buon orecchio: quella cadenza è tipica, e a Napoli la riconosce chiunque."
    goals: [notice]
  - learner: "Uno dei due, a un certo punto, ha detto «tengo fame», e mi è sembrato di capire che volesse dire «ho fame». In italiano standard suonerebbe strano, no? Si dice così anche quando si parla italiano, o è dialetto puro?"
  - tutor: "«Tengo fame» è un'espressione dialettale entrata nell'italiano regionale: molti napoletani la usano anche parlando italiano, senza accorgersene."
    goals: [example]
  - learner: "È affascinante. Mi chiedo se, a forza di televisione e di scuola, queste forme finiranno per sparire, o se invece sarà l'italiano standard ad assorbirle, un po' alla volta."
  - tutor: "Un po' tutte e due le cose: alcune spariscono, altre entrano nella lingua di tutti. Ma tu pensi che i dialetti vadano protetti?"
    goals: [standard]
  - learner: "Credo di sì, ma non come si protegge un monumento. Un dialetto che si impara solo a scuola, come una materia, è già un dialetto morto. Se fossi io a decidere, lo farei vivere nel teatro, nelle canzoni, nelle famiglie, senza però farne una bandiera contro l'italiano."
  - tutor: "«Senza farne una bandiera»: è proprio questo il punto delicato. Se passi da Napoli, ti porto a sentire una commedia in dialetto."
    goals: [opinion]

- scenario: email-rettore
  level: C2
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Buongiorno, e grazie di avermi ricevuta. Sono ricercatrice ospite al dipartimento di storia, e il mese scorso mi è stato negato l'accesso all'archivio storico dell'ateneo, nonostante il mio progetto fosse stato approvato dal consiglio di dipartimento. Vorrei che la decisione venisse rivista prima della fine del mio contratto, a febbraio."
  - tutor: "Una situazione spiacevole, ma risolvibile. Come pensava di cominciare la lettera?"
    goals: [situation]
  - learner: "Avevo pensato a «Gentile Rettore», ma mi sembra troppo poco, ed «Egregio» un po' antiquato. Mi hanno parlato di un'altra formula, più solenne, ma non me la ricordo."
  - tutor: "«Magnifico Rettore»: è la formula di rito, e conviene usarla. Poi può aprire con qualcosa come «Mi permetto di rivolgermi a Lei»."
    goals: [opening-formula]
  - learner: "Perfetto. Nella bozza avevo scritto «Pretendo che la decisione venga annullata», ma mi rendo conto che è troppo diretto. Forse potrei scrivere: «Le chiederei che riconsideri la decisione»."
    errors: [subjunctive-use]
  - tutor: "Molto meglio di «pretendo». Ma rilegga «le chiederei che riconsideri»: con un condizionale nella principale, il congiuntivo resta al presente?"
    prompt: {text: "riconsideri", tags: [subjunctive-use]}
  - learner: "Allora: «Le chiederei che riconsideri la decisione alla luce del parere favorevole del dipartimento». Così è anche più completo."
    errors: [subjunctive-use]
  - tutor: "«Le chiederei che riconsiderasse la decisione alla luce del parere favorevole del dipartimento»: così il tono è fermo ma cortese. E per la chiusura che cosa pensava?"
    recast: {text: "riconsideri", fix: "riconsiderasse", tags: [subjunctive-use]}
    goals: [tone]
  - learner: "Avevo pensato a «Distinti saluti», ma forse ci vuole qualcosa di più deferente."
  - tutor: "Può scrivere «Con osservanza», oppure «In attesa di un cortese riscontro, porgo distinti saluti»: vanno bene entrambe."
  - learner: "Sceglierei la seconda: «In attesa di un cortese riscontro» mi sembra che sottolinei con garbo che aspetto una risposta. Gliela posso mandare domani, prima di spedirla?"
  - tutor: "Certo, me la mandi pure: la rileggo volentieri prima che parta."
    goals: [closing]

- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, è un piacere, e un po' di incoscienza c'è stata, ha ragione. Il libro si intitola «Il caffè in piedi» ed è nato quasi per caso: per anni ho preso appunti su tutto ciò che mi stupiva, dalle code alle poste ai pranzi della domenica, finché un'amica editrice non mi ha convinta a farne un libro."
  - tutor: "«Il caffè in piedi», titolo perfetto. Ma ci dica la verità: non è il solito libro di stereotipi sugli italiani?"
    goals: [present-book]
  - learner: "Spero di no. Gli stereotipi ci sono, perché ogni stereotipo nasce da qualcosa di vero, ma ho cercato di guardarci dietro. Si dice, per esempio, che gli italiani abbiano una relazione conflittuale con le regole; in realtà ho scoperto che le rispettano moltissimo, purché siano quelle non scritte."
    errors: [word-choice]
  - tutor: "Un rapporto conflittuale con le regole scritte e una devozione assoluta per quelle non scritte: la metterei in copertina. Ha un aneddoto che lo dimostri?"
    recast: {text: "relazione", fix: "rapporto", tags: [word-choice]}
    goals: [stereotype]
  - learner: "Più d'uno. Il mio preferito risale al primo mese a Bologna: avevo ordinato un cappuccino alle tre del pomeriggio, e il barista, dopo avermelo preparato, mi ha guardata con una tale compassione che mi sono sentita in dovere di scusarmi. Nessuna legge lo vieta, eppure lo sapevano tutti tranne me."
  - tutor: "Il cappuccino dopo pranzo: un reato non scritto, ma gravissimo. In che cosa l'ha cambiata, l'italiano?"
    goals: [anecdote]
  - learner: "Mi ha resa più lenta, nel senso migliore del termine. In inglese andavo dritta al punto; in italiano ho imparato che a volte il punto è proprio il giro che si fa per arrivarci, e che una conversazione può valere anche se non ha concluso niente."
  - tutor: "Bellissimo. Ci lasci con una frase per i nostri ascoltatori."
    goals: [language]
  - learner: "Direi che l'Italia è un paese in cui niente funziona come dovrebbe, eppure tutto, alla fine, si risolve: e dopo dieci anni, confesso di non aver ancora capito come."
  - tutor: "Nemmeno noi, glielo garantisco. Grazie per essere stata con noi, e buona fortuna con il libro!"
    goals: [farewell]

- scenario: poesia-montale
  level: C2
  persona: en-m-retired
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Un senso di aridità, quasi fisico. È come se il poeta avesse voluto togliere alla poesia ogni consolazione: il male non viene spiegato né compianto, viene semplicemente mostrato, in tre immagini secche, una dopo l'altra."
  - tutor: "Tre immagini, sì: il rivo strozzato, la foglia riarsa, il cavallo stramazzato. Ce n'è una che l'ha colpita più delle altre?"
    goals: [first-reading]
  - learner: "Il cavallo stramazzato, senza dubbio. È l'unica immagine in cui c'è un essere vivo, e proprio per questo è la più crudele. Non si dice perché sia caduto né se si rialzerà: resta lì, a terra, come un fatto di cui nessuno è responsabile."
  - tutor: "Un fatto di cui nessuno è responsabile: è proprio il correlativo oggettivo. E il suono dei versi, che effetto le fa?"
    goals: [image]
  - learner: "Mi colpiscono le consonanti doppie, quasi stridenti, della prima strofa: strozzato, incartocciarsi, stramazzato. Nella seconda, invece, il ritmo si distende, come se dopo il male arrivasse una specie di calma, anche se fredda."
  - tutor: "Ottima osservazione: la seconda strofa respira di più. E il senso complessivo?"
    goals: [sound]
  - learner: "Penso che l'unica salvezza che Montale concede sia l'indifferenza: la statua, la nuvola, il falco, cose che stanno in alto e non soffrono. Mi sembra un'interpretazione sensibile, anche se un po' cupa."
    errors: [false-friend]
  - tutor: "Un'interpretazione sensata, e niente affatto cupa: è il cuore della poesia. Ma quella «divina Indifferenza», secondo lei, è un elogio o un'ironia?"
    recast: {text: "sensibile", fix: "sensata", tags: [false-friend]}
  - learner: "Forse tutte e due le cose. È divina perché ci salva dal dolore, ma ci salva togliendoci anche tutto il resto: un prezzo che, personalmente, non sarei disposto a pagare."
  - tutor: "Un prezzo che forse nemmeno Montale era disposto a pagare. Ne riparliamo la prossima settimana, con un'altra sua poesia."
    goals: [meaning]

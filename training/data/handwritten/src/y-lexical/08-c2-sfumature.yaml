# Round 3, set y-lexical: false friends, calques and collocations. C2, file 8.
- scenario: circolo-lettura
  level: C2
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no, anzi: l'ho trovato commovente. Un ragazzo che sale sugli alberi per protesta e non ne scende più per tutta la vita è un'immagine che non si dimentica."
    - tutor: "Commovente, dici? Io ci vedo soprattutto un adolescente testardo che non sa perdere. Ma dimmi: che cosa rappresentano, per te, quegli alberi?"
      goals: [impression]
    - learner: "Secondo me Calvino pretende di mostrarci che si può partecipare al mondo restando a distanza: Cosimo non fugge, osserva da un'altra prospettiva."
      errors: [false-friend]
    - tutor: "Calvino intende mostrarci proprio questo, sì: la distanza come forma di partecipazione. Detto «pretende», sembrava quasi che ce lo imponesse a bacchettate!"
      goals: [theme]
      recast: {text: "pretende di mostrarci", fix: "intende mostrarci", tags: [false-friend]}
    - learner: "Calvino con la bacchetta, che immagine! Quanto allo stile, mi incanta quell'ironia leggera, quasi settecentesca."
    - tutor: "Leggera, sì, ma mai superficiale: per Calvino la leggerezza era una conquista. Io però resto convinto che Cosimo sia, in fondo, un egoista."
      goals: [style]
    - learner: "Non sono d'accordo: se sarebbe un egoista, non avrebbe aiutato i contadini né combattuto i pirati."
      errors: [hypothetical]
    - tutor: "Argomento solido, ma la forma zoppica: «se sarebbe un egoista»? Quel «se» non sopporta il condizionale."
      prompt: {text: "se sarebbe un egoista", tags: [hypothetical]}
    - learner: "Ha ragione: se fosse un egoista, non avrebbe aiutato i contadini né combattuto i pirati. La sua ribellione ha una dimensione civile."
    - tutor: "Touché, mi hai messo con le spalle al muro. Per il prossimo incontro, che cosa proponi?"
      goals: [disagree]
    - learner: "«Le città invisibili»: è breve ma densissimo, perfetto per una lectura lenta."
      errors: [word-choice]
    - tutor: "Una lettura lenta, di quelle da assaporare una pagina per sera: approvato all'unanimità, almeno da me."
      goals: [recommend]
      recast: {text: "una lectura lenta", fix: "Una lettura lenta", tags: [word-choice]}
    - learner: "Allora siamo d'accordo! La prossima volta porto io i dolci."
    - tutor: "Ecco un argomento che non ammette repliche. Alla prossima!"

- scenario: condoglianze
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe. Le porgo le mie più sentite condoglianze: ho saputo di sua madre solo ieri sera, e mi è dispiaciuto moltissimo."
    - tutor: "La ringrazio. È stato tutto molto improvviso: fino a una settimana fa stava bene."
      goals: [condolences]
    - learner: "Me l'aveva presentata alla festa di Natale, ricorda? Ci raccontò di quando ballava il tango da giovane. Aveva un grande senso dell'umore."
      errors: [false-friend]
    - tutor: "Sì, aveva un grande senso dell'umorismo, fino all'ultimo. Mi fa bene che lei se ne ricordi."
      goals: [memory]
      recast: {text: "senso dell'umore", fix: "senso dell'umorismo", tags: [false-friend]}
    - learner: "Se c'è qualcosa che posso fare, per favore mi lasci sapere: questa settimana posso seguire io le sue pratiche in ufficio."
      errors: [word-choice]
    - tutor: "Glielo farò sapere, grazie. Anzi, se potesse seguire la pratica Bianchi, mi toglierebbe un grande peso."
      goals: [offer-help]
      recast: {text: "mi lasci sapere", fix: "Glielo farò sapere", tags: [word-choice]}
    - learner: "Consideri la cosa fatta. E si prenda tutto il tempo che le serve: in ufficio ci organizziamo."
    - tutor: "Lei è molto gentile. Credo che ne avrò bisogno."
    - learner: "Ora la lascio riposare. Le sono vicino, e al funerale ci sarò."
    - tutor: "Grazie, davvero. La accompagno alla porta."
      goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Solo a metà, confesso! Mi ha colpito la cadenza: sembrava che cantassero più che parlare."
    - tutor: "È la musicalità del napoletano: le vocali finali quasi spariscono, e tutto va a ritmo. Ti è rimasta in mente qualche parola?"
      goals: [notice]
    - learner: "Sì, uno dei due ha detto «stongo scucciato». Che significa? Il suono è molto grazioso."
      errors: [false-friend]
    - tutor: "Buffo, vero? Significa «sono stufo», ed è proprio il suono a renderlo comico. Grazioso, poi, è un complimento che a Napoli accetterebbero volentieri!"
      goals: [example]
      recast: {text: "grazioso", fix: "Buffo", tags: [false-friend]}
    - learner: "Quindi «scucciato» viene da «scocciato»? Però credo che molti giovani parlino dialetto solo per scherzo, mentre a scuola gli insegnano a evitarlo."
    - tutor: "Esatto, la radice è la stessa. Ed ecco il paradosso: il dialetto non è un italiano storpiato, ma una lingua nata dal latino come lo standard, eppure chi lo parla impara a vergognarsene. Secondo te, andrebbe tutelato?"
      goals: [standard]
    - learner: "Sì, ma senza imposizioni. Se un dialetto si insegnerebbe a scuola come una materia qualsiasi, morirebbe due volte."
      errors: [hypothetical]
    - tutor: "Bella provocazione! Ma «se un dialetto si insegnerebbe»: quel «se» non vuole il condizionale."
      prompt: {text: "si insegnerebbe", tags: [hypothetical]}
    - learner: "Giusto: se un dialetto si insegnasse a scuola come una materia qualsiasi, morirebbe due volte."
    - tutor: "Perfetto, e la provocazione regge: un dialetto vive nelle strade, non sui banchi."
      goals: [opinion]
    - learner: "Esatto! Mi daresti un consejo per capire meglio il napoletano?"
      errors: [word-choice]
    - tutor: "Un consiglio? Ascolta le canzoni napoletane, quelle vecchie: impari più lì che da qualsiasi manuale."
      recast: {text: "consejo", fix: "consiglio", tags: [word-choice]}
    - learner: "Lo farò! Grazie, è stato il viaggio più istruttivo della mia vita."
    - tutor: "Grazie a te. E se passi da Napoli, fatti sentire!"

- scenario: email-rettore
  level: C2
  persona: en-f-student
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Sono ricercatrice in visita al dipartimento di fisica: il mio contratto scade a gennaio, ma il progetto non sarà finito. Vorrei chiedere al Rettore un'estensione di sei mesi."
      errors: [word-choice]
    - tutor: "Una proroga di sei mesi, dunque: richiesta del tutto legittima. Partiamo dall'intestazione: come pensava di rivolgersi al Rettore?"
      goals: [situation]
      recast: {text: "un'estensione", fix: "Una proroga", tags: [word-choice]}
      new: [{lemma: proroga, gloss: extension}]
    - learner: "Avevo pensato a «Caro Rettore», ma temo che sia troppo confidenziale. Lei che cosa suggerisce?"
    - tutor: "Teme bene. La formula di rito è «Magnifico Rettore», seguita da qualcosa come «mi permetto di sottoporre alla Sua cortese attenzione»."
      goals: [opening-formula]
    - learner: "Perfetto. Nel testo, poi, avevo scritto: «Ho bisogno della proroga entro dicembre, altrimenti perdo i fondi.» È troppo diretto?"
    - tutor: "Decisamente: suona come un ultimatum. Provi a riformularlo in modo fermo ma cortese."
    - learner: "«Le sarei grata se vorrebbe esaminare la mia istanza entro dicembre, poiché in caso contrario i fondi andrebbero perduti.»"
      errors: [hypothetical]
    - tutor: "Quasi impeccabile. Ma «se vorrebbe»? Quel «se» chiede un altro modo."
      prompt: {text: "se vorrebbe", tags: [hypothetical]}
    - learner: "Certo: «Le sarei grata se volesse esaminare la mia istanza entro dicembre.»"
    - tutor: "Così è perfetta: ferma, ma garbata. Resta la chiusa."
      goals: [tone]
    - learner: "Pensavo a «In attesa di un Suo cortese riscontro, porgo distinti saluti». Prima, però, vorrei aggiungere che eventualmente pubblicherò i risultati con l'ateneo."
      errors: [false-friend]
    - tutor: "Che a tempo debito pubblicherà i risultati con l'ateneo è un ottimo argomento: lo metta subito prima della chiusa, che va benissimo così."
      goals: [closing]
      recast: {text: "eventualmente", fix: "a tempo debito", tags: [false-friend]}
    - learner: "Perfetto. Stasera la riscrivo e domani gliela porto per un'ultima occhiata."
    - tutor: "Volentieri. Con una lettera così, il Rettore farà fatica a dirle di no."

- scenario: intervista-radio
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
    - learner: "Grazie, è un piacere. Più incoscienza che coraggio, direi! Il libro nasce da dieci anni di appunti: volevo disfare alcuni miti sugli italiani, e anche prendermi un po' in giro."
      errors: [word-choice]
    - tutor: "Sfatare alcuni miti è un'impresa nobile, prendersi in giro lo è ancora di più. Ma andiamo al sodo: gli italiani sono davvero tutti mammoni?"
      goals: [present-book]
      recast: {text: "disfare alcuni miti", fix: "Sfatare alcuni miti", tags: [word-choice]}
    - learner: "Lo stereotipo ha un fondo di verità, ma i giovani restano a casa soprattutto perché gli affitti sono altissimi, non per amore della pasta della mamma."
    - tutor: "Risposta diplomatica, ma la accetto. Ci racconti un aneddoto che spieghi l'Italia meglio di un saggio."
      goals: [stereotype]
    - learner: "Il primo giorno a Milano ho chiesto un cappuccino alle quattro del pomeriggio: il barista mi ha guardata come se avessi chiesto la mano di sua figlia."
    - tutor: "Un classico intramontabile! E l'italiano, invece, che cosa ha cambiato in lei?"
      goals: [anecdote]
    - learner: "Moltissimo. Quando sono arrivata, ogni volta che ho parlato sembravo arrabbiata: in inglese sono molto diretta."
      errors: [tense-aspect]
    - tutor: "Interessante. Ma «ogni volta che ho parlato»? Era un'abitudine: quale tempo racconta meglio le abitudini?"
      prompt: {text: "ogni volta che ho parlato", tags: [tense-aspect]}
    - learner: "Giusto: ogni volta che parlavo sembravo arrabbiata. L'italiano mi ha insegnato il condizionale della cortesia."
    - tutor: "Il condizionale della cortesia, che bella definizione. Siamo ai saluti: ci lasci con una frase da ricordare."
      goals: [language]
    - learner: "Grazie per avermi avuta! La mia frase: in Italia le mani dicono più del vocabolario."
      errors: [word-choice]
    - tutor: "Il piacere di averla ospitata è tutto nostro, e la frase è da incorniciare."
      goals: [farewell]
      recast: {text: "avermi avuta", fix: "averla ospitata", tags: [word-choice]}
    - learner: "Grazie a voi, e un saluto a tutti gli ascoltatori!"
    - tutor: "Grazie a lei! E voi, cari ascoltatori, restate con noi: dopo la pubblicità si parla di cucina."

- scenario: pranzo-domenicale
  level: C2
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Allora mi siedo subito, prima che finisca! Però scannarsi per una lasagna mi sembra un po' esagerato."
    - tutor: "Esagerato? Qui si litiga per molto meno! «Scannarsi» vuol dire litigare di brutto, ma tranquillo, senza sangue. Te ne taglio una fetta?"
      goals: [react]
    - learner: "Sì, grazie, anzi: voglio due, ho saltato la colazione."
      errors: [ci-ne]
    - tutor: "«Voglio due»? Due di che cosa? Manca una paroletta che riprenda la lasagna."
      prompt: {text: "voglio due", tags: [ci-ne]}
    - learner: "Ah, giusto: ne voglio due!"
    - tutor: "Ecco, così va meglio, ingordo che non sei altro! E tu conosci qualche modo di dire sul cibo?"
    - learner: "Sì: «essere buono come il pane». Mio nonno lo era davvero: una volta ha regalato il suo ristorante a un cameriere."
    - tutor: "Il ristorante intero? Altro che buono come il pane, era un santo! In spagnolo esiste qualcosa di simile?"
      goals: [use-idiom]
    - learner: "Sì, diciamo «ser un pedazo de pan», essere un pezzo di pane. Ma con gli animali cambia tutto: «estar como una cabra» vuol dire essere un po' matto."
    - tutor: "Da noi la capra, invece, è solo ignorante: «capra!» si urla a chi non sa niente. Gli animali cambiano carattere quando passano il confine! E tu, qualche disastro ai fornelli?"
      goals: [compare]
    - learner: "Altroché! L'anno scorso ho fatto una paella per trenta persone e il riso si è quemato."
      errors: [word-choice]
    - tutor: "Il riso si è bruciato davanti a trenta ospiti? Che dramma! E com'è finita?"
      recast: {text: "si è quemato", fix: "si è bruciato", tags: [word-choice]}
    - learner: "Abbiamo ordinato trenta pizze. Insomma, ho fatto il passo più lungo della gamba!"
    - tutor: "Perfetto, proverbio azzeccato! E consolati: anche le migliori famiglie hanno una paella bruciata nel cassetto."
      goals: [anecdote]

- scenario: seminario-etica
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Grazie, professore. La mia tesi è che la responsabilità morale richieda intenzionalità, e che una macchina, per quanto sofisticata, ne sia priva."
    - tutor: "Formulazione elegante. Ma che cosa intende, esattamente, per intenzionalità?"
      goals: [thesis]
    - learner: "Distinguo tra agire e fare: una macchina fa, nel senso che produce effetti, ma non agisce, perché non ha scopi propri. È una distinzione aristotelica, eventualmente ripresa da Anscombe."
      errors: [false-friend]
    - tutor: "Una distinzione aristotelica, ripresa in seguito da Anscombe, certo. Ma un sistema che ottimizza un obiettivo non ha, in qualche modo, uno scopo?"
      goals: [distinguish]
      recast: {text: "eventualmente", fix: "in seguito", tags: [false-friend]}
    - learner: "Ha uno scopo assegnato, non proprio. Se il sistema avrebbe scelto da sé i suoi obiettivi, la mia tesi vacillerebbe."
      errors: [hypothetical]
    - tutor: "Un'ammissione interessante, ma la forma vacilla prima della tesi: «se il sistema avrebbe scelto»?"
      prompt: {text: "Se il sistema avrebbe scelto", tags: [hypothetical]}
    - learner: "Ha ragione: se il sistema avesse scelto da sé i suoi obiettivi, la mia tesi vacillerebbe."
    - tutor: "Esatto. E la risposta all'obiezione regge: lo scopo assegnato non è uno scopo proprio."
      goals: [objection]
    - learner: "Le concedo però che la questione non è chiusa: un giorno potremmo avere sistemi capaci di darsi scopi propri. In quel caso dovremmo disegnare conclusioni diverse."
      errors: [word-choice]
    - tutor: "Dovremmo trarre conclusioni diverse, certo: nessun disegno, per carità, solo un po' di onestà intellettuale. Concessione apprezzata."
      goals: [concede]
      recast: {text: "disegnare conclusioni diverse", fix: "trarre conclusioni diverse", tags: [word-choice]}
    - learner: "Riassumendo: finché una macchina non ha scopi propri, la responsabilità resta di chi la progetta e di chi la usa."
    - tutor: "Conclusione rigorosa, e difficile da smontare. Per oggi le do partita vinta, dottoressa."
      goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, il registro mi è sfuggito di mano. Il punto più difficile è il dialogo tra madre e figlia: in spagnolo è pieno di diminutivi carinosi che in italiano suonano ridicoli."
      errors: [word-choice]
    - tutor: "Diminutivi affettuosi, sì, ed è proprio lì che la tua versione inciampa: «mamita» non la puoi rendere con «mammina», a meno di voler fare una telenovela. Che alternative hai?"
      goals: [problem]
      recast: {text: "carinosi", fix: "affettuosi", tags: [word-choice]}
    - learner: "Ne vedo due: tenere «mamma» e affidare l'affetto al tono, oppure usare «mà», più colloquiale ma un po' regionale."
    - tutor: "«Mà» sa di Roma: rischi di trasferire la famiglia da Siviglia a Trastevere. Io punterei sul tono. Altre trappole?"
      goals: [options]
    - learner: "Sì: la figlia dice «estoy embarazada», e alla prima stesura avevo scritto «sono imbarazzata». Questo capitolo mi ha costato tantissimo!"
      errors: [auxiliary-choice]
    - tutor: "Altro che sfumatura: avresti trasformato una gravidanza in un attacco di timidezza! Ma «mi ha costato»? Pensa a quale ausiliare regge «costare»."
      goals: [false-friend]
      prompt: {text: "mi ha costato", tags: [auxiliary-choice]}
    - learner: "Giusto: mi è costato tantissimo. Per fortuna me ne sono accorta in tempo."
    - tutor: "Esatto. E per la madre, alla fine, che cosa decidi?"
    - learner: "Tengo «mamma» e affido l'affetto al tono. Me lo revisi tu alla fine?"
      errors: [word-choice]
    - tutor: "Te lo rivedo io, matita rossa alla mano. E la scelta di «mamma» mi convince."
      goals: [decide]
      recast: {text: "revisi", fix: "rivedo", tags: [word-choice]}
    - learner: "Perfetto. Allora stasera mi chiudo in casa con il dizionario."
    - tutor: "Brava. E ricordati: un falso amico è peggio di un nemico dichiarato."

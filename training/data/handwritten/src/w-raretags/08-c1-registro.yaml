# w-raretags, file 08: C1, word-order, spelling, reflexive, imperative-form, pronoun-position,
# possessive, article-use and verb-form surviving in otherwise advanced speech.
- scenario: colloquio-lavoro
  level: C1
  persona: en-f-professional
  history: [word-order]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono un'ingegnera gestionale e negli ultimi sei anni ho lavorato nella logistica, prima a Manchester e poi a Milano."
    - tutor: "Un percorso internazionale, interessante. Che cosa faceva esattamente a Milano?"
      goals: [intro]
    - learner: "Coordinavo un gruppo di dodici persone. Non solo ho gestito il budget, ma anche ho riorganizzato l'intera rete di consegne."
      errors: [word-order]
    - tutor: "Notevole. Però in «ma anche ho riorganizzato» qualcosa non torna: dove metterebbe «anche»?"
      prompt: {text: "ma anche ho riorganizzato", tags: [word-order]}
    - learner: "Ma ho anche riorganizzato l'intera rete di consegne, riducendo i tempi del venti per cento."
    - tutor: "Ora la frase è impeccabile, e il dato parla da sé. Quali ritiene siano i suoi punti di forza?"
      goals: [experience]
    - learner: "Direi la capacità di mediare. Il mio punto debole, invece, è che tendo a fare troppo da sola invece di delegare: sto imparando a fidarmi di più."
    - tutor: "Un difetto onesto, e già in via di correzione. Perché proprio la nostra azienda?"
      goals: [strengths]
    - learner: "Perché la vostra attenzione per la sostenibilità corrisponde ai miei valori, e mi piacerebbe portare la mia esperienza in un settore che cresce."
    - tutor: "Risposta convincente. Ha qualche domanda per me?"
      goals: [why]
    - learner: "Sì: quanto spesso è previsto di viaggiare? E il ruolo prevede di gestire anche i fornitori esteri direttamente?"
    - tutor: "Una settimana al mese, all'incirca, e sì, i fornitori esteri sarebbero di sua competenza."
      goals: [questions]

- scenario: intervista-podcast
  level: C1
  persona: es-f-erasmus
  history: [spelling]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Per amore, come nei film! Ho conosciuto il mio compagno durante l'Erasmus a Bologna, e qual'è la cosa più folle che puoi fare a ventitré anni? Restare."
      errors: [spelling]
    - tutor: "Che storia! Una piccola cosa sullo scritto, però: «qual'è» ti convince, con quell'apostrofo?"
      goals: [story]
      prompt: {text: "qual'è", tags: [spelling]}
    - learner: "Hai ragione: qual è, senza apostrofo. Me lo dimentico sempre."
    - tutor: "Lo sbagliano anche tanti italiani, consolati. Che cosa ti ha sorpreso di più, all'inizio?"
    - learner: "Il rapporto con il cibo: in Spagna mangiamo tardi, ma qui il pranzo della domenica dura quattro ore e nessuno si alza dalla tavola prima del caffè."
    - tutor: "Il pranzo della domenica come rito sacro, eh? E se dovessi criticare qualcosa?"
      goals: [culture-shock]
    - learner: "La burocrazia, senza dubbio. Per avere la residenza ho fatto la fila tre volte, e ogni volta mi chiedevano un documento diverso: era un vero incubo, sopratutto senza la tessera sanitaria."
      errors: [spelling]
    - tutor: "Un classico intramontabile. «Sopratutto», però: manca una lettera, ti pare?"
      goals: [critique]
      prompt: {text: "sopratutto", tags: [spelling]}
    - learner: "Soprattutto, con due t! Che ortografia traditrice."
    - tutor: "Perfetto. Ultima domanda: che consiglio daresti a chi sta pensando di trasferirsi?"
    - learner: "Di imparare la lingua prima di partire e di armarsi di pazienza: l'Italia ti ricambia, ma con i suoi tempi."
    - tutor: "Con i suoi tempi: mi sembra la chiusura perfetta. Grazie mille di essere stata con noi!"
      goals: [advice]

- scenario: vita-in-italia
  level: C1
  persona: en-m-retired
  history: [reflexive]
  turns:
    - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da tempo. Ci racconta perché si è trasferito?"
    - learner: "Volentieri. Dopo la pensione, mia moglie e io abbiamo deciso di stabilire in Umbria, dove passavamo le vacanze da vent'anni."
      errors: [reflexive]
    - tutor: "Una scelta coraggiosa. Avete deciso di «stabilire»... che cosa, esattamente?"
      prompt: {text: "stabilire in Umbria", tags: [reflexive]}
    - learner: "Di stabilirci in Umbria, naturalmente."
    - tutor: "Ecco, ora è chiaro. E qual è stata la difficoltà più grande?"
      goals: [story]
    - learner: "All'inizio non abituavo al ritmo del paese: i negozi chiusi all'ora di pranzo mi facevano impazzire."
      errors: [reflexive]
    - tutor: "Lo capisco bene. «Non abituavo»: manca un pezzo al verbo, non trova?"
      prompt: {text: "non abituavo", tags: [reflexive]}
    - learner: "Non mi abituavo, e ancora oggi ogni tanto mi capita di trovare la porta chiusa."
    - tutor: "La famosa pausa pranzo! E lei, in questi anni, com'è cambiato?"
      goals: [difficulties]
    - learner: "Sono diventato più paziente. In Inghilterra tutto era programmato; qui ho imparato che un caffè con il vicino è più importante di qualsiasi agenda."
    - tutor: "Una bella lezione. Che consiglio darebbe a chi vuole fare come lei?"
      goals: [change]
    - learner: "Di non arrabbiarsi con la burocrazia e di fare amicizia con il bar del paese: lì si scopre tutto quello che serve sapere."
    - tutor: "Consiglio prezioso, e molto italiano. Grazie di essere stato con noi."
      goals: [advice]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  history: [imperative-form]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Da tre mesi c'è un cantiere sotto casa mia che lavora fino alle dieci di sera, anche il sabato. Mi creda, è insopportabile."
    - tutor: "Capisco il disagio. Ha già presentato una segnalazione all'ufficio tecnico?"
      goals: [describe]
    - learner: "Due volte, ma nessuno mi ha risposto. Venghi a vedere lei stessa, se non mi crede."
      errors: [imperative-form]
    - tutor: "Le credo, non si preoccupi. «Venghi», però: è proprio la forma che vuole usare con me?"
      prompt: {text: "Venghi", tags: [imperative-form]}
    - learner: "Mi scusi, mi ero arrabbiato. Venga pure a vedere, quando vuole."
    - tutor: "Ci mancherebbe. Purtroppo i tempi dell'ufficio tecnico sono lunghi."
    - learner: "Con tutto il rispetto, «tempi lunghi» non è una risposta. Lavorano oltre l'orario consentito: è una violazione del regolamento comunale."
    - tutor: "Ha ragione, e prendo nota. Vedo qui che l'autorizzazione prevede la chiusura alle diciotto."
      goals: [insist]
    - learner: "Allora quali sono i miei diritti? Posso fare un reclamo formale? Me lo spieghi, per favore, perché non conosco la procedura."
    - tutor: "Certo: compila il modulo di reclamo, e il Comune ha trenta giorni per rispondere per iscritto."
      goals: [rights]
    - learner: "Perfetto. Mi dia il numero di protocollo, così posso fare un sollecito se non mi risponde nessuno."
    - tutor: "Ecco il numero di protocollo: 2026/4817. Le assicuro che oggi stesso giro la pratica ai vigili."
      goals: [commitment]

- scenario: trattativa-affitto
  level: C1
  persona: en-m-heritage
  history: [pronoun-position]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Molto, soprattutto la terrazza. Avendo lo visitato due volte, però, ho notato che gli infissi lasciano passare parecchio freddo."
      errors: [pronoun-position]
    - tutor: "Lo terrò presente. «Avendo lo visitato», però: con il gerundio, dove finisce il pronome?"
      goals: [interest]
      prompt: {text: "Avendo lo visitato", tags: [pronoun-position]}
    - learner: "Avendolo visitato due volte, dicevo. Proprio per gli infissi, chiederei un canone di milleduecento invece di milletrecento."
    - tutor: "Il proprietario difficilmente accetterebbe meno di milleduecentocinquanta euro, ma potrei chiedergli di cambiare gli infissi a sue spese."
      goals: [negotiate]
    - learner: "Sarebbe un buon compromesso. E la durata del contratto? Preferirei un quattro più quattro, con la possibilità di disdetta con sei mesi di preavviso."
    - tutor: "È la formula standard, quindi nessun problema. La provvigione dell'agenzia è di una mensilità."
      goals: [conditions]
    - learner: "Va bene. Potrebbe mettere lo per iscritto e mandarmelo entro domani?"
      errors: [pronoun-position]
    - tutor: "Mettere lo? Rifletta sulla posizione di quel pronome, è la stessa questione di prima."
      prompt: {text: "mettere lo", tags: [pronoun-position]}
    - learner: "Potrebbe metterlo per iscritto entro domani?"
    - tutor: "Senz'altro: entro domani le invio la proposta scritta, con gli infissi nuovi a carico del proprietario."
      goals: [conclude]

- scenario: modi-di-dire
  level: C1
  persona: en-f-student
  history: [possessive]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Una giornata da dimenticare. Stamattina sono scivolata sul ghiaccio davanti all'università e ho rotto il mio polso."
      errors: [possessive]
    - tutor: "Mamma mia! Però «ho rotto il mio polso» suona inglesissimo: come lo diremmo noi?"
      prompt: {text: "ho rotto il mio polso", tags: [possessive]}
    - learner: "Mi sono rotta il polso, ecco. E come se non bastasse, al pronto soccorso ho aspettato cinque ore."
    - tutor: "Piove sul bagnato, proprio! E poi?"
      goals: [tell]
      new: [{lemma: bagnato, gloss: wet}]
    - learner: "Piove sul bagnato, davvero: quando finalmente sono tornata a casa, mi sono accorta di aver perso le chiavi."
    - tutor: "Brava, l'hai usato benissimo. Ma di chi è la colpa, secondo te?"
      goals: [react]
    - learner: "In parte mia, perché avevo le scarpe sbagliate. Ma in parte del Comune: il marciapiede non era stato pulito da nessuno."
    - tutor: "Diciamo che la colpa è un po' a metà. E la morale della giornata?"
      goals: [blame]
    - learner: "Che la prossima volta compro degli stivali seri e metto una copia delle chiavi da una amica di mia."
      errors: [possessive]
    - tutor: "Morale saggissima! Una piccola cosa: «una amica di mia»... come lo diresti in modo naturale?"
      prompt: {text: "una amica di mia", tags: [possessive]}
    - learner: "Da una mia amica! Così, almeno, non resto chiusa fuori."
    - tutor: "Esatto: chi va piano va sano e va lontano, e con gli stivali giusti anche meglio!"
      goals: [moral]

- scenario: organizzare-matrimonio
  level: C1
  persona: en-m-traveller
  history: [article-use]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Immaginiamo una cerimonia all'aperto in Toscana, con pochi invitati. Penso che matrimoni italiani siano troppo lunghi per la mia famiglia inglese."
      errors: [article-use]
    - tutor: "Che bella idea. Però «penso che matrimoni italiani»: non le manca qualcosa davanti a «matrimoni»?"
      goals: [vision]
      prompt: {text: "matrimoni italiani", tags: [article-use]}
    - learner: "Penso che i matrimoni italiani siano lunghissimi, ecco: sette portate e balli fino all'alba."
    - tutor: "Non ha tutti i torti! Che budget avete in mente?"
    - learner: "Al massimo trentamila euro, viaggio degli ospiti escluso. Vorremmo spendere di più per il cibo e meno per i fiori."
    - tutor: "Con sessanta invitati è un budget ragionevole."
      goals: [budget]
    - learner: "Abbiamo visto due posti: una villa vicino a Siena e un agriturismo in Val d'Orcia. La villa costa di più, ma ha la cappella."
    - tutor: "L'agriturismo è più intimo, la villa più elegante. Voi che cosa preferite?"
    - learner: "Per l'agriturismo: preferiamo atmosfera semplice e il panorama della Val d'Orcia."
      errors: [article-use]
    - tutor: "Ottima scelta. Però «preferiamo atmosfera semplice»: lì l'articolo non è un optional."
      prompt: {text: "preferiamo atmosfera semplice", tags: [article-use]}
    - learner: "Preferiamo un'atmosfera semplice. E abbiamo una condizione: niente sorprese nel preventivo finale."
    - tutor: "Promesso: un'atmosfera semplice e un preventivo chiaro, voce per voce."
      goals: [choices, conditions]

- scenario: medico-specialista
  level: C1
  persona: es-m-worker
  history: [verb-form]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Meglio, ma quando rimano seduto a lungo in ufficio, sento un peso al petto e mi manca un po' il fiato."
      errors: [verb-form]
    - tutor: "È un dettaglio importante. «Quando rimano», però: rimanere ha una prima persona un po' capricciosa."
      prompt: {text: "rimano", tags: [verb-form]}
    - learner: "Quando rimango seduto a lungo, sì. Soprattutto il pomeriggio."
    - tutor: "Bene, lo annoto. In famiglia ci sono precedenti di malattie cardiache?"
      goals: [symptoms]
    - learner: "Mio padre ha l'ipertensione da anni, e mia nonna è morta di infarto a settant'anni."
    - tutor: "Grazie, è utile saperlo. Gli esami mostrano una pressione un po' alta, ma il cuore funziona bene."
      goals: [history]
    - learner: "Quindi non è grave? Cosa significa di preciso «un po' alta»? Non vorrei che mi tolgono la patente o il lavoro."
      errors: [subjunctive-use]
    - tutor: "Nessuno le toglierà niente, stia tranquillo. «Non vorrei che mi tolgono», però: dopo «vorrei che» quale modo serve?"
      prompt: {text: "che mi tolgono", tags: [subjunctive-use]}
    - learner: "Non vorrei che mi togliessero la patente, intendevo."
    - tutor: "Perfetto. Significa centoquaranta di massima: da tenere sotto controllo, niente di più."
      goals: [understand]
    - learner: "E la terapia? Ho letto che queste pastiglie possono dare tosse come effetto collaterale."
    - tutor: "Con alcune succede, sì. Iniziamo con un dosaggio basso e, se compare la tosse, cambiamo farmaco. Ci rivediamo tra un mese."
      goals: [treatment]

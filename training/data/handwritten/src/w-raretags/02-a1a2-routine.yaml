# w-raretags, file 02: A1-A2, reflexive, modal-infinitive, essere-avere, article-use,
# demonstrative, ce-ci-sono and word-order in daily errands.
- scenario: giorno-tipico
  level: A1
  persona: en-f-student
  history: [reflexive]
  turns:
    - tutor: "Ciao! Com'è la tua giornata di solito?"
    - learner: "Io sveglio alle sette e bevo un caffè."
      errors: [reflexive]
    - tutor: "Io sveglio? Chi svegli la mattina?"
      prompt: {text: "Io sveglio", tags: [reflexive]}
    - learner: "Ah, mi sveglio alle sette!"
    - tutor: "Ecco! E poi cosa fai la mattina?"
      goals: [wake]
    - learner: "Vado all'università in autobus. Studio fino a l'una."
      errors: [articulated-preposition]
    - tutor: "Fino a l'una? Guarda bene quelle due parole."
      prompt: {text: "a l'una", tags: [articulated-preposition]}
    - learner: "Studio fino all'una!"
    - tutor: "Brava! È una mattina lunga."
      goals: [work]
    - learner: "Sì. La sera cucino, poi io riposo sul divano."
      errors: [reflexive]
    - tutor: "Io riposo? Pensa al verbo «svegliarsi»!"
      prompt: {text: "io riposo", tags: [reflexive]}
    - learner: "Mi riposo sul divano! E tu, Anna?"
    - tutor: "Io mi sveglio tardi e lavoro da casa."
      goals: [evening, ask]

- scenario: bar-colazione
  level: A2
  persona: en-m-retired
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno! Cosa prende?"
    - learner: "Buongiorno! Vorrei di prendere un cappuccino, per favore."
      errors: [modal-infinitive]
    - tutor: "Buongiorno! Vorrei di prendere? C'è una parola in più, mi sembra."
      goals: [greet]
      prompt: {text: "Vorrei di prendere", tags: [modal-infinitive]}
    - learner: "Ah, scusi. Vorrei di prendere un cappuccino."
      errors: [modal-infinitive]
    - tutor: "Certo, se vuole prendere un cappuccino al tavolo, glielo porto io."
      goals: [order-drink]
      recast: {text: "di prendere un cappuccino", fix: "prendere un cappuccino", tags: [modal-infinitive]}
    - learner: "No, grazie, resto al bancone. E anche un cornetto con la crema."
    - tutor: "Ecco il cornetto, è ancora caldo."
      goals: [order-food]
    - learner: "Grazie. Quanto pago? Ho solo un biglietto da cinquanta."
    - tutor: "Non si preoccupi, ho il resto. Sono tre euro e dieci."
    - learner: "Ecco. Grazie, e buona giornata!"
    - tutor: "Grazie a lei, ecco il resto. A domani!"
      goals: [pay]

- scenario: hotel-checkin
  level: A1
  persona: en-f-professional
  history: [essere-avere]
  turns:
    - tutor: "Buonasera e benvenuti! Ha una prenotazione?"
    - learner: "Sì, a nome Clarke. Siamo io e il mio figlio."
      errors: [possessive]
    - tutor: "Il mio figlio? Attenzione: è famiglia!"
      prompt: {text: "il mio figlio", tags: [possessive]}
    - learner: "Io e mio figlio."
    - tutor: "Ecco, una camera per due notti. Ha un documento?"
      goals: [booking]
    - learner: "Sì, ecco il passaporto. Mio figlio è otto anni."
      errors: [essere-avere]
    - tutor: "Grazie. Suo figlio... otto anni?"
      goals: [document]
      prompt: {text: "è otto anni", tags: [essere-avere]}
    - learner: "Mio figlio è otto anni, sì."
      errors: [essere-avere]
    - tutor: "Ah, ha otto anni! Allora la colazione non si paga."
      recast: {text: "è otto anni", fix: "ha otto anni", tags: [essere-avere]}
    - learner: "Grazie! A che ora è la colazione?"
    - tutor: "Dalle sette alle dieci, al primo piano."
      goals: [breakfast]
    - learner: "Perfetto. E la chiave, per favore?"
    - tutor: "Ecco la chiave. Camera ventuno, secondo piano."
      goals: [key]

- scenario: ristorante-ordinare
  level: A1
  persona: en-m-heritage
  history: [article-use]
  turns:
    - tutor: "Buongiorno, benvenuti! Quanti siete?"
    - learner: "Siamo tre. C'è un tavolo fuori?"
    - tutor: "Sì, ecco un tavolo fuori. Prego!"
      goals: [ask-table]
    - learner: "Grazie. Io prendo gli spaghetti. Non mi piace carne."
      errors: [article-use]
    - tutor: "Non le piace... carne? Manca una parola."
      prompt: {text: "Non mi piace carne", tags: [article-use]}
    - learner: "Non mi piace la carne."
    - tutor: "Capito, allora niente carne. Da bere?"
      goals: [order-food]
    - learner: "Una acqua frizzante, per favore."
      errors: [article-form]
    - tutor: "Una acqua? Provi a dirlo meglio!"
      prompt: {text: "Una acqua", tags: [article-form]}
    - learner: "Un'acqua frizzante!"
    - tutor: "Benissimo, arriva subito."
      goals: [order-drink]
    - learner: "Scusi, il conto, per favore."
    - tutor: "Certo, ecco il conto. Grazie e arrivederci!"
      goals: [ask-bill]

- scenario: mercato-frutta
  level: A1
  persona: es-f-teacher
  history: [demonstrative]
  turns:
    - tutor: "Ciao! Cosa ti do oggi?"
    - learner: "Ciao! Quanto costano questi pesche?"
      errors: [demonstrative]
    - tutor: "Questi pesche? Ma le pesche sono maschili?"
      prompt: {text: "questi pesche", tags: [demonstrative]}
    - learner: "Queste pesche! Quanto costano?"
    - tutor: "Brava! Due euro al chilo."
      goals: [ask-price]
    - learner: "Allora un chilo e mezzo, per favore."
    - tutor: "Ecco qui. Ti serve altro?"
      goals: [buy-quantity]
    - learner: "Sì, vorrei anche quello melone."
      errors: [demonstrative]
    - tutor: "Quale melone, scusa? Non ho capito."
      prompt: {text: "quello melone", tags: [demonstrative]}
    - learner: "Quello melone, lì."
      errors: [demonstrative]
    - tutor: "Ah, quel melone giallo! Ecco, sono sei euro."
      goals: [ask-other]
      recast: {text: "Quello melone", fix: "quel melone", tags: [demonstrative]}
    - learner: "Ecco dieci euro. Grazie!"
    - tutor: "Grazie a te! Ecco quattro euro. Ciao!"
      goals: [pay]

- scenario: chiedere-strada
  level: A1
  persona: en-m-retired
  history: [ce-ci-sono]
  turns:
    - tutor: "Sì, mi dica. Ha bisogno di aiuto?"
    - learner: "Mi scusi, signora. Dov'è la stazione?"
    - tutor: "La stazione è vicino, a dieci minuti a piedi."
      goals: [get-attention, ask-place]
    - learner: "Grazie. È una farmacia sulla strada?"
      errors: [ce-ci-sono]
    - tutor: "È una farmacia? Scusi, non capisco."
      prompt: {text: "È una farmacia", tags: [ce-ci-sono]}
    - learner: "È una farmacia... vicino?"
      errors: [ce-ci-sono]
    - tutor: "Ah, sì, c'è una farmacia in piazza!"
      recast: {text: "È una farmacia", fix: "c'è una farmacia", tags: [ce-ci-sono]}
    - learner: "Bene. Allora vado dritto e poi a destra?"
    - tutor: "Sì, dritto fino al semaforo, poi a destra."
      goals: [understand]
    - learner: "Grazie mille, lei è molto gentile!"
    - tutor: "Prego, buona giornata e buon viaggio!"
      goals: [thank]

- scenario: presentarsi
  level: A1
  persona: es-m-worker
  history: [word-order]
  turns:
    - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
    - learner: "Ciao! Mi chiamo Diego. Sono messicano, de Monterrey."
      errors: [preposition]
    - tutor: "De Monterrey? Scusa, non ho capito."
      goals: [say-name]
      prompt: {text: "de Monterrey", tags: [preposition]}
    - learner: "Di Monterrey, in Messico."
    - tutor: "Ah, che bello! E che lavoro fai?"
      goals: [say-origin]
    - learner: "Sono cuoco. Io sempre lavoro il sabato e la domenica."
      errors: [word-order]
    - tutor: "Io sempre lavoro? Dove va «sempre»?"
      goals: [say-job]
      prompt: {text: "Io sempre lavoro", tags: [word-order]}
    - learner: "Io lavoro sempre il sabato e la domenica."
    - tutor: "Esatto! Allora lavori tanto."
    - learner: "Sì, ma è il mio lavoro preferito. E tu sei studentessa?"
    - tutor: "Sì, studio musica. È difficile, ma bello!"
      goals: [ask-back]

- scenario: taxi
  level: A1
  persona: en-f-student
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno! Dove la porto?"
    - learner: "Buongiorno! Devo a andare alla stazione centrale."
      errors: [modal-infinitive]
    - tutor: "Devo a andare? C'è una parola di troppo."
      prompt: {text: "Devo a andare", tags: [modal-infinitive]}
    - learner: "Devo andare alla stazione centrale."
    - tutor: "Va bene, andiamo subito."
      goals: [destination]
    - learner: "Quanto tempo ci vuole?"
    - tutor: "Ci vogliono venti minuti, più o meno."
      goals: [ask-time]
    - learner: "E quanto costa? Posso a pagare con la carta?"
      errors: [modal-infinitive]
    - tutor: "Posso a pagare? Di nuovo quella parola in più!"
      prompt: {text: "Posso a pagare", tags: [modal-infinitive]}
    - learner: "Posso pagare con la carta?"
    - tutor: "Sì, certo. Sono quindici o sedici euro."
      goals: [ask-price]
    - learner: "Ecco la carta. Grazie e arrivederci!"
    - tutor: "Grazie a lei, buon viaggio!"
      goals: [pay]

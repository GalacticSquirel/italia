# w-raretags, file 05: B1, imperfetto-form, past-participle-form, stare-gerund, pronoun-position,
# reflexive, negation, modal-infinitive and piacere in stories, repairs and requests.
- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [imperfetto-form]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "Da noi la sera più importante è la Nochebuena, il 24 dicembre. Tutta la famiglia cena insieme e si mangia molto pesce."
    - tutor: "Anche al Sud facciamo la cena di pesce la sera del 24! E quando eri piccola, come passavi il Natale?"
      goals: [compare]
    - learner: "Quando ero piccola, le famiglie del mio quartiere mettavano luci dappertutto e noi bambini cantavamo per le strade."
      errors: [imperfetto-form]
    - tutor: "Che bel ricordo! Ma «mettavano»... pensa bene al verbo mettere."
      prompt: {text: "mettavano", tags: [imperfetto-form]}
    - learner: "Sì, le famiglie mettavano tante luci colorate."
      errors: [imperfetto-form]
    - tutor: "Le famiglie mettevano luci dappertutto, che bello! E i regali, chi li portava?"
      recast: {text: "mettavano", fix: "mettevano", tags: [imperfetto-form]}
    - learner: "Li portavano i Re Magi, il 6 gennaio. Era il giorno che aspettavo di più in tutto l'anno."
    - tutor: "Da noi il 6 gennaio arriva la Befana con le calze piene di dolci. C'è una tradizione italiana che ti incuriosisce?"
      goals: [past]
      new: [{lemma: incuriosire, gloss: to make curious}]
    - learner: "Sì! Ho sentito che a Capodanno si mangia le lenticchie. Perché?"
      errors: [subject-verb-agreement]
    - tutor: "Si mangia le lenticchie? Le lenticchie sono tante, guarda il verbo."
      prompt: {text: "si mangia le lenticchie", tags: [subject-verb-agreement]}
      new: [{lemma: lenticchia, gloss: lentil}]
    - learner: "Si mangiano le lenticchie!"
    - tutor: "Esatto! Si dice che portino soldi per tutto l'anno, quindi ne mangiamo tantissime."
      goals: [ask]
    - learner: "Allora le mangerò anch'io! E per il pranzo del 25, pensavo a portare un dolce spagnolo, il turrón."
      errors: [preposition]
    - tutor: "Pensavo a portare? Attenzione alla preposizione dopo «pensare»."
      prompt: {text: "pensavo a portare", tags: [preposition]}
    - learner: "Pensavo di portare il turrón."
    - tutor: "Perfetto! Mia nonna adora i dolci: sarà felicissima."
      goals: [plan]

- scenario: vacanze-passate
  level: B1
  persona: en-m-retired
  history: [past-participle-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Siamo stati in Puglia, a Lecce, per dieci giorni. Il primo giorno, purtroppo, ho rompito la valigia sulle scale della stazione."
      errors: [past-participle-form]
    - tutor: "Oh no! Ma «rompito»... sei sicuro?"
      goals: [where]
      prompt: {text: "rompito", tags: [past-participle-form]}
    - learner: "Sì, ho rompito la valigia, completamente!"
      errors: [past-participle-form]
    - tutor: "Hai rotto la valigia il primo giorno? Che peccato! E il tempo com'è stato?"
      recast: {text: "rompito", fix: "rotto", tags: [past-participle-form]}
    - learner: "Il tempo era perfetto, sempre sole e trenta gradi. Abbiamo visitato le chiese barocche e ogni sera abbiamo apruto una bottiglia di vino locale."
      errors: [past-participle-form]
    - tutor: "Che vacanza! Però attenzione: «apruto»? Anche aprire è un verbo speciale."
      goals: [weather]
      prompt: {text: "apruto", tags: [past-participle-form]}
    - learner: "Abbiamo aperto una bottiglia ogni sera!"
    - tutor: "Esatto! E che cosa ti è piaciuto di più?"
      goals: [activities]
    - learner: "Il mare di Otranto. L'acqua era così transparente che si vedevano i pesci."
      errors: [spelling]
    - tutor: "Transparente? In italiano c'è una lettera in meno."
      prompt: {text: "transparente", tags: [spelling]}
    - learner: "Trasparente, giusto!"
    - tutor: "Proprio così. Otranto è un sogno: valigia rotta a parte, che bella vacanza!"
      goals: [best]

- scenario: dal-meccanico
  level: B1
  persona: es-m-worker
  history: [stare-gerund, imperfetto-form]
  turns:
    - tutor: "Buongiorno! Che problema ha la macchina?"
    - learner: "Buongiorno. Quando sono guidando in autostrada, la macchina fa un rumore strano, come un fischio."
      errors: [stare-gerund]
    - tutor: "Un fischio, capisco. Quando... sono guidando? Ci pensi un attimo."
      prompt: {text: "sono guidando", tags: [stare-gerund]}
    - learner: "Quando sto guidando in autostrada."
    - tutor: "Ecco, perfetto. E da quando sente questo rumore?"
      goals: [describe]
    - learner: "È cominciato la settimana scorsa, quando tornavo da Firenze. Prima la macchina andeva benissimo."
      errors: [imperfetto-form]
    - tutor: "Andeva? Mmm, il verbo è andare."
      prompt: {text: "andeva", tags: [imperfetto-form]}
    - learner: "Sì, prima andeva benissimo, nessun problema."
      errors: [imperfetto-form]
    - tutor: "Quindi prima andava benissimo e il rumore è arrivato all'improvviso. Potrebbe essere la cinghia."
      goals: [when]
      recast: {text: "andeva", fix: "andava", tags: [imperfetto-form]}
      new: [{lemma: cinghia, gloss: belt}]
    - learner: "Mi può fare un presupposto prima di riparare?"
      errors: [false-friend]
    - tutor: "Certo, le preparo un preventivo appena controllo il motore. Se è un piccolo problema, sono circa centoventi euro."
      goals: [cost]
      recast: {text: "un presupposto", fix: "un preventivo", tags: [false-friend]}
    - learner: "Va bene. E quando sarà pronta? Domani mattina devo andare al lavoro."
    - tutor: "Se non ci sono altri problemi, gliela preparo per stasera alle sei."
      goals: [time]

- scenario: restituire-prodotto
  level: B1
  persona: en-f-student
  history: [pronoun-position]
  turns:
    - tutor: "Buongiorno, mi dica pure."
    - learner: "Buongiorno. Ho comprato queste cuffie dieci giorni fa, ma sono defettose: il suono arriva solo da una parte."
      errors: [spelling]
    - tutor: "Defettose? Guardi bene l'inizio della parola."
      prompt: {text: "defettose", tags: [spelling]}
    - learner: "Difettose, scusi!"
    - tutor: "Esatto. Mi dispiace per le cuffie. Ha lo scontrino?"
      goals: [problem]
    - learner: "Sì, eccolo. Le ho comprate qui, il cinque marzo."
    - tutor: "Perfetto, sono ancora in garanzia. Che cosa preferisce fare?"
      goals: [proof]
    - learner: "Voglio le restituire e avere i soldi indietro."
      errors: [pronoun-position]
    - tutor: "Voglio le restituire? Mmm, come lo direbbe meglio?"
      prompt: {text: "Voglio le restituire", tags: [pronoun-position]}
    - learner: "Le voglio... voglio le restituire?"
      errors: [pronoun-position]
    - tutor: "Certo, può restituirle. Però per i prodotti difettosi non facciamo rimborsi: le diamo un paio nuovo oppure un buono."
      goals: [request]
      recast: {text: "le restituire", fix: "restituirle", tags: [pronoun-position]}
    - learner: "Mmm, preferisco il buono. Posso usarlo anche negli altri negozi?"
    - tutor: "Sì, vale in tutti i nostri negozi per un anno. Ecco il buono, e mi scusi ancora."
      goals: [agree]

- scenario: salute-stile-vita
  level: B1
  persona: en-m-heritage
  history: [reflexive]
  turns:
    - tutor: "Ciao! Allora, raccontami: come sono le tue abitudini?"
    - learner: "Allora, di solito alzo alle sei, lavoro in ufficio tutto il giorno e la sera sono molto stanco."
      errors: [reflexive]
    - tutor: "Alzi alle sei... che cosa alzi?"
      prompt: {text: "alzo alle sei", tags: [reflexive]}
    - learner: "Ah, mi alzo alle sei."
    - tutor: "Ecco! E fai un po' di sport?"
      goals: [habits]
    - learner: "Poco. Prima correvo, ma adesso non ho tempo. Vorrei perdere cinque chili e avere più energia."
    - tutor: "Cinque chili è un obiettivo giusto. Che cosa ti blocca, secondo te?"
      goals: [goal]
    - learner: "Il problema è che la sera non riesco rilassare e mangio troppo davanti alla TV."
      errors: [preposition, reflexive]
    - tutor: "Rilassare... chi? Pensa a quello che hai detto per «alzarsi»."
      prompt: {text: "rilassare", tags: [reflexive]}
    - learner: "Non riesco rilassarmi."
      errors: [preposition]
    - tutor: "Meglio! Però dopo «riesco» manca ancora qualcosa."
      prompt: {text: "riesco rilassarmi", tags: [preposition]}
    - learner: "Non riesco a rilassarmi."
    - tutor: "Perfetto. Succede a tanti: stanchezza e televisione sono una coppia pericolosa!"
      goals: [obstacles]
      new: [{lemma: stanchezza, gloss: tiredness}]
    - learner: "Che cosa mi consigli? Posso venire il lunedì, il mercoledì e il venerdì dopo il lavoro."
    - tutor: "Allora facciamo così: tre allenamenti a settimana alle sette e niente TV dopo le dieci. Ci stai?"
      goals: [plan]

- scenario: vicino-rumoroso
  level: B1
  persona: es-f-teacher
  history: [negation]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, sono Elena, la vecina del secondo piano. Scusi il disturbo a quest'ora."
      errors: [spelling]
    - tutor: "La... vecina? Scusi, non conosco questa parola."
      prompt: {text: "vecina", tags: [spelling]}
    - learner: "La vicina! Abito al secondo piano."
    - tutor: "Ah, piacere, Elena! Nessun disturbo, mi dica."
      goals: [greet]
    - learner: "Ecco, ogni sera dopo mezzanotte sentiamo musica molto alta. Fino a oggi ho detto niente, ma mio figlio ha gli esami e non riesce a dormire."
      errors: [negation]
    - tutor: "Ha detto niente? Manca un pezzo, mi pare."
      prompt: {text: "ho detto niente", tags: [negation]}
    - learner: "Fino a oggi non ho detto niente."
    - tutor: "Ha ragione, mi scusi. Non pensavo che si sentisse così tanto."
      goals: [problem]
    - learner: "Le dispiacerebbe abbassare il volume dopo le undici?"
    - tutor: "Certo, nessun problema. Solo sabato prossimo ho una festa per il mio compleanno: posso tenere la musica un po' più a lungo?"
      goals: [request]
    - learner: "Va bene, per una sera non c'è problema. Spero di non essere molesta."
      errors: [false-friend]
    - tutor: "Ma no, non è per niente fastidiosa, anzi, grazie di essere salita. Allora: musica bassa dopo le undici, tranne sabato."
      goals: [compromise]
      recast: {text: "molesta", fix: "fastidiosa", tags: [false-friend]}
      new: [{lemma: fastidioso, gloss: annoying}]

- scenario: banca-conto
  level: B1
  persona: en-m-traveller
  history: [modal-infinitive]
  turns:
    - tutor: "Buongiorno, come posso esserle utile?"
    - learner: "Buongiorno. Mi sono trasferito qui per lavoro e vorrei di aprire un conto corrente."
      errors: [modal-infinitive]
    - tutor: "Vorrei di aprire? C'è una parola che non serve."
      prompt: {text: "vorrei di aprire", tags: [modal-infinitive]}
    - learner: "Vorrei aprire un conto corrente."
    - tutor: "Benissimo. Abita in Italia da molto?"
      goals: [purpose]
    - learner: "Sì, da due mesi. Quali documenti devo di portare?"
      errors: [modal-infinitive]
    - tutor: "Devo di portare? Guardi bene, è la stessa cosa di prima."
      prompt: {text: "devo di portare", tags: [modal-infinitive]}
    - learner: "Scusi... quali documenti devo di portare?"
      errors: [modal-infinitive]
    - tutor: "Deve portare il passaporto, il codice fiscale e il contratto di lavoro."
      goals: [documents]
      recast: {text: "di portare", fix: "portare", tags: [modal-infinitive]}
    - learner: "Perfetto. E quanto costa il conto ogni mese?"
    - tutor: "Il conto base costa tre euro al mese, ma per chi ha meno di trent'anni è gratis."
      goals: [costs]
    - learner: "Ho trentadue anni, purtroppo! Posso avere anche una carta di debito e l'app per il telefono?"
    - tutor: "Certo, la carta arriva a casa in una settimana e l'app la scarica oggi stesso."
      goals: [card]

- scenario: volontariato
  level: B1
  persona: en-f-professional
  history: [piacere]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Lavoro part-time e ho i pomeriggi liberi. Voglio fare qualcosa di utile, e gli anziani mi piace tanto."
      errors: [piacere]
    - tutor: "Gli anziani ti piace? Ma sono tanti, gli anziani..."
      prompt: {text: "gli anziani mi piace", tags: [piacere]}
    - learner: "Gli anziani mi piacciono tanto!"
    - tutor: "Che bello. E che cosa sai fare?"
      goals: [motivation]
    - learner: "Sono infermiera, quindi posso aiutare con le medicine. E so suonare il pianoforte: forse a loro piace la musica?"
    - tutor: "Moltissimo! Un'infermiera che suona il pianoforte è un regalo per noi. Quanto tempo hai?"
      goals: [skills]
    - learner: "Due pomeriggi a settimana, il martedì e il giovedì. Il sabato no, perché lo passo con la mia figlia."
      errors: [possessive]
    - tutor: "Con la mia figlia? Qui l'articolo non serve, ricordi?"
      prompt: {text: "con la mia figlia", tags: [possessive]}
    - learner: "Con mia figlia, scusa."
    - tutor: "Brava! Allora, preferisci la casa di riposo o portare la spesa a casa degli anziani?"
      goals: [time]
    - learner: "La casa di riposo! Sono molto eccitata di cominciare."
      errors: [false-friend]
    - tutor: "Che bello vederti così emozionata! Ti aspettiamo martedì alle tre alla casa di riposo."
      goals: [choose]
      recast: {text: "eccitata", fix: "emozionata", tags: [false-friend]}
      new: [{lemma: emozionato, gloss: excited}]

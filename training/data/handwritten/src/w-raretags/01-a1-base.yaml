# w-raretags, file 01: A1, rarely used tags (essere-avere, possessive, ce-ci-sono, negation,
# demonstrative, verb-form, piacere, spelling, word-order) in everyday first conversations.
- scenario: presentarsi
  level: A1
  persona: en-m-traveller
  history: [essere-avere, word-order]
  turns:
    - tutor: "Ciao! Io sono Giulia. E tu, come ti chiami?"
    - learner: "Ciao Giulia! Mi chiamo Tom. Sono inglese, di Leeds."
    - tutor: "Piacere, Tom! Che cosa fai a Leeds?"
      goals: [say-name, say-origin]
    - learner: "Sono infermiere in un ospedale. Sono trentaquattro anni."
      errors: [essere-avere]
    - tutor: "Sono trentaquattro anni? Pensa al verbo per l'età."
      goals: [say-job]
      prompt: {text: "Sono trentaquattro anni", tags: [essere-avere]}
    - learner: "Ah, ho trentaquattro anni!"
    - tutor: "Esatto! Io ne ho ventidue. Studio lingue."
    - learner: "Che bello! Dove tu abiti?"
      errors: [word-order]
    - tutor: "Dove tu abiti? Così non va, prova ancora!"
      prompt: {text: "Dove tu abiti", tags: [word-order]}
    - learner: "Tu dove abiti?"
    - tutor: "Abito vicino all'università. Ci vediamo a lezione!"
      goals: [ask-back]

- scenario: famiglia
  level: A1
  persona: es-f-teacher
  history: [possessive]
  turns:
    - tutor: "Che bella foto! Chi sono queste persone?"
    - learner: "Sono la mia madre e il mio padre, a Valencia."
      errors: [possessive]
    - tutor: "La mia madre? Prova di nuovo, attenzione!"
      prompt: {text: "la mia madre", tags: [possessive]}
    - learner: "Mia madre e mio padre!"
    - tutor: "Brava! Che bella famiglia. Come si chiama tua madre?"
      goals: [who]
    - learner: "Si chiama Carmen. È molto alta e ha i capelli nero."
      errors: [adjective-agreement]
    - tutor: "I capelli nero? Guarda bene la fine della parola."
      prompt: {text: "i capelli nero", tags: [adjective-agreement]}
    - learner: "I capelli neri!"
    - tutor: "Perfetto. E quanti anni ha?"
      goals: [describe]
    - learner: "Ha sessanta anni. E la tua famiglia? Hai fratelli?"
    - tutor: "Sì, ho una sorella. Ha diciotto anni."
      goals: [ages, ask]

- scenario: casa-mia
  level: A1
  persona: en-f-student
  history: [ce-ci-sono]
  turns:
    - tutor: "Allora, com'è la tua casa?"
    - learner: "Abito in un appartamento piccolo, vicino al centro."
    - tutor: "Che bello! Quante stanze ci sono?"
      goals: [type]
    - learner: "Ci sono due camere e un bagno. È anche un balcone grande."
      errors: [ce-ci-sono]
    - tutor: "È anche un balcone? Prova come per le camere."
      prompt: {text: "È anche un balcone", tags: [ce-ci-sono]}
    - learner: "C'è anche un balcone grande!"
    - tutor: "Perfetto! E qual è la tua stanza preferita?"
      goals: [rooms]
    - learner: "La cucina! È piccolo, ma molto bello."
      errors: [adjective-agreement]
    - tutor: "Piccolo? Ma parli della cucina, no?"
      prompt: {text: "È piccolo, ma molto bello", tags: [adjective-agreement]}
    - learner: "È piccola, ma molto bella!"
    - tutor: "Che bello! Anche io amo la mia cucina."
      goals: [favourite]
    - learner: "E la tua casa com'è, Luca?"
    - tutor: "È una casa vecchia, con due balconi. Vieni a vederla!"
      goals: [ask]

- scenario: supermercato
  level: A1
  persona: es-m-worker
  history: [negation]
  turns:
    - tutor: "Buongiorno, cerca qualcosa?"
    - learner: "Sì, cerco il latte senza lattosio. Trovo niente qui."
      errors: [negation]
    - tutor: "Trova niente? Manca una parola prima del verbo."
      prompt: {text: "Trovo niente", tags: [negation]}
    - learner: "Non trovo niente!"
    - tutor: "Giusto! Il latte è in fondo, a destra."
      goals: [ask-product]
    - learner: "Grazie. E dove sono gli uovi?"
      errors: [noun-number]
    - tutor: "Gli uovi? Attenzione, è un plurale strano!"
      prompt: {text: "gli uovi", tags: [noun-number]}
    - learner: "Le uova! Dove sono le uova?"
    - tutor: "Bravo! Sono nel reparto tre, vicino alla pasta."
      goals: [ask-other]
    - learner: "Perfetto, mille grazie! È molto gentile."
    - tutor: "Grazie a lei, buona giornata!"
      goals: [thank]

- scenario: abbigliamento
  level: A1
  persona: en-f-professional
  history: [demonstrative]
  turns:
    - tutor: "Buongiorno! Posso aiutarla?"
    - learner: "Sì, cerco una maglietta per l'estate."
    - tutor: "Abbiamo queste qui, sono nuove. Che taglia porta?"
      goals: [ask-item]
    - learner: "Porto la M. Mi piace quella rosso."
      errors: [adjective-agreement]
    - tutor: "Quella rosso? Pensi alla maglietta."
      prompt: {text: "quella rosso", tags: [adjective-agreement]}
    - learner: "Quella rossa!"
    - tutor: "Ecco la M in rosso. È molto bella!"
      goals: [size-colour]
    - learner: "Grazie. Posso provare anche quelli pantaloni?"
      errors: [demonstrative]
    - tutor: "Quelli pantaloni? Attenzione alla parola prima di «pantaloni»."
      prompt: {text: "quelli pantaloni", tags: [demonstrative]}
    - learner: "Quegli pantaloni?"
      errors: [demonstrative]
    - tutor: "Ah, quei pantaloni! Certo, il camerino è lì."
      goals: [try]
      recast: {text: "Quegli pantaloni", fix: "quei pantaloni", tags: [demonstrative]}
    - learner: "Vanno bene tutti e due. Quanto costano?"
    - tutor: "Cinquanta euro, con lo sconto. Paga con la carta?"
    - learner: "Sì, con la carta. Ecco."
    - tutor: "Grazie mille, buona giornata!"
      goals: [decide]

- scenario: orari-negozio
  level: A1
  persona: en-m-retired
  history: [verb-form]
  turns:
    - tutor: "Pronto, negozio Bianchi, buongiorno!"
    - learner: "Buongiorno. Chiamo per sapere gli orari."
    - tutor: "Certo, mi dica pure."
      goals: [greet]
    - learner: "A che ora aprete domani mattina?"
      errors: [verb-form]
    - tutor: "Scusi, come? Non ho capito il verbo."
      prompt: {text: "aprete", tags: [verb-form]}
    - learner: "A che ora aprite domani mattina?"
    - tutor: "Apriamo alle nove e chiudiamo alle sette."
      goals: [ask-hours]
    - learner: "Bene. E domenica siete aperto?"
      errors: [adjective-agreement]
    - tutor: "Siete aperto? Guardi bene la fine della parola."
      prompt: {text: "siete aperto", tags: [adjective-agreement]}
    - learner: "Siete aperti domenica?"
    - tutor: "Sì, ma solo la mattina, fino all'una."
      goals: [ask-day]
    - learner: "Allora io venio domenica alle dieci."
      errors: [verb-form]
    - tutor: "Io venio? Attenzione al verbo venire."
      prompt: {text: "io venio", tags: [verb-form]}
    - learner: "Vengo! Vengo domenica alle dieci. Grazie, arrivederci!"
    - tutor: "Bravo, esatto! Arrivederci, a domenica!"
      goals: [goodbye]

- scenario: tempo-libero
  level: A1
  persona: es-f-erasmus
  history: [piacere]
  turns:
    - tutor: "Allora, cosa fai di bello nel fine settimana?"
    - learner: "Il sabato vado a correre al parco. Mi piace molto lo sport."
    - tutor: "Brava! Quante volte corri?"
      goals: [hobby]
    - learner: "Corro due volte alla settimana. La sera mi piace i film italiani."
      errors: [piacere]
    - tutor: "Mi piace i film? Pensa: i film sono tanti."
      goals: [frequency]
      prompt: {text: "mi piace i film", tags: [piacere]}
    - learner: "Mi piacciono i film italiani!"
    - tutor: "Perfetto! Anche a me piacciono molto."
    - learner: "E tu, cosa fai nel weekend?"
    - tutor: "Io vado spesso al cinema con gli amici."
      goals: [ask]
    - learner: "Andiamo insieme sabato sera? Io compro le biglietti."
      errors: [noun-gender]
    - tutor: "Le biglietti? Biglietto è maschile o femminile?"
      prompt: {text: "le biglietti", tags: [noun-gender]}
    - learner: "I biglietti! Li compro io."
    - tutor: "Perfetto, allora a sabato sera!"
      goals: [propose]

- scenario: numero-telefono
  level: A1
  persona: en-m-heritage
  history: [spelling]
  turns:
    - tutor: "È stata una bella lezione, vero?"
    - learner: "Sì, molto! Perché non studiamo insieme qualche volta?"
    - tutor: "Buona idea! Mi dai il tuo numero?"
      goals: [propose]
    - learner: "Certo, il mio numero e 340 512 7788."
      errors: [spelling]
    - tutor: "Scusa, guarda bene: manca un accento."
      prompt: {text: "il mio numero e", tags: [spelling]}
    - learner: "Il mio numero è 340 512 7788."
    - tutor: "Perfetto, grazie! Quando sei libero?"
      goals: [number]
    - learner: "Sono libero lunedi pomeriggio."
      errors: [spelling]
    - tutor: "Lunedi? Anche qui manca qualcosa."
      prompt: {text: "lunedi", tags: [spelling]}
    - learner: "Lunedì! Va bene per te?"
    - tutor: "Sì, lunedì va benissimo. A lunedì!"
      goals: [when]

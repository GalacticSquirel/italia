# w-raretags, file 07: B2, pronoun-position, word-order, imperative-form, reflexive,
# stare-gerund, spelling, past-participle-form and demonstrative in work and city life.
- scenario: affittare-appartamento
  level: B2
  persona: en-f-professional
  history: [pronoun-position]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. È molto luminoso! Quanto è l'affitto, e sono incluse le spese di condominio?"
    - tutor: "Sono novecento euro al mese, spese escluse: circa ottanta euro in più."
      goals: [rent]
    - learner: "Capisco. Il contratto è di quattro anni? Vorrei lo leggere con calma prima di firmare."
      errors: [pronoun-position]
    - tutor: "Quattro più quattro, sì. Vorrei lo leggere? Il pronome, lì, non sta comodo."
      prompt: {text: "Vorrei lo leggere", tags: [pronoun-position]}
    - learner: "Sì, vorrei lo leggere a casa."
      errors: [pronoun-position]
    - tutor: "Certo, può leggerlo a casa, glielo mando stasera via email. La caparra è di due mensilità."
      goals: [contract]
      recast: {text: "lo leggere", fix: "leggerlo", tags: [pronoun-position]}
    - learner: "Va bene. Il riscaldamento è autonomo? L'ultimo inverno nel mio vecchio appartamento sono stato freddo tutto il tempo."
      errors: [essere-avere]
    - tutor: "Sono stato freddo? Attenzione: con il freddo che si sente, quale verbo usiamo?"
      prompt: {text: "sono stato freddo", tags: [essere-avere]}
    - learner: "Ho avuto freddo tutto l'inverno, scusi."
    - tutor: "Qui non succederà: ogni appartamento ha il suo riscaldamento e la caldaia è nuova."
      goals: [condition]
      new: [{lemma: caldaia, gloss: boiler}]
    - learner: "Perfetto. E il quartiere com'è? È tranquillo la sera? Ci sono negozi vicino?"
    - tutor: "È molto tranquillo, e sotto casa ci sono un supermercato, una farmacia e la fermata del tram."
      goals: [neighbourhood]
    - learner: "Mi interessa molto. Mi mandi il contratto e la confermo entro venerdì."
      errors: [object-pronoun]
    - tutor: "La conferma? Che cosa mi conferma, esattamente?"
      prompt: {text: "la confermo", tags: [object-pronoun]}
    - learner: "Le confermo entro venerdì, volevo dire."
    - tutor: "Perfetto, allora aspetto sue notizie entro venerdì."
      goals: [decide]

- scenario: arte-mostra
  level: B2
  persona: en-m-traveller
  history: [word-order]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce subito la luce. Però ho visto già questo quadro in un libro, ma dal vivo è un'altra cosa."
      errors: [word-order]
    - tutor: "Ho visto già? Prova a mettere «già» in un altro posto."
      prompt: {text: "ho visto già", tags: [word-order]}
    - learner: "L'ho già visto in un libro."
    - tutor: "Esatto. E dal vivo, che cosa noti?"
      goals: [react]
    - learner: "In primo piano c'è una donna che legge una lettera, e nello sfondo si vede un paesaggio molto calmo, quasi vuoto."
    - tutor: "Ottima osservazione. Secondo te, perché il pittore ha messo la lettera al centro?"
      goals: [describe]
    - learner: "Forse è una lettera d'amore, e la donna sta aspettando qualcuno. Mi sembra molto sensibile la sua espressione."
      errors: [word-order]
    - tutor: "Mi sembra molto sensibile la sua espressione: l'ordine è un po' strano. Proviamo un altro?"
      prompt: {text: "Mi sembra molto sensibile la sua espressione", tags: [word-order]}
    - learner: "La sua espressione mi sembra molto sensibile."
    - tutor: "Perfetto. E la tua lettura mi convince: c'è attesa in quello sguardo."
      goals: [interpret]
    - learner: "Mi ricorda i quadri di Vermeer che ho visto in Olanda, ma i colori qui sono più calde."
      errors: [adjective-agreement]
    - tutor: "I colori sono più calde? Guarda bene la fine dell'aggettivo."
      prompt: {text: "più calde", tags: [adjective-agreement]}
    - learner: "I colori sono più caldi, e la luce è meno fredda."
    - tutor: "Esatto, Vermeer è il confronto giusto. Andiamo nella sala accanto: c'è un'opera che ti piacerà."
      goals: [compare]

- scenario: colloquio-promozione
  level: B2
  persona: en-f-professional
  history: [imperative-form]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Mi scusa se le rubo qualche minuto, ma volevo parlarle dei risultati di quest'anno."
      errors: [imperative-form]
    - tutor: "Mi scusa? Con il «lei», come diventa quella forma?"
      prompt: {text: "Mi scusa", tags: [imperative-form]}
    - learner: "Mi scusi, volevo dire."
    - tutor: "Nessun problema, mi dica pure."
    - learner: "Quest'anno il mio gruppo ha aumentato le vendite del diciotto per cento e abbiamo acquisito tre nuovi clienti."
    - tutor: "Sono numeri notevoli, lo so bene."
      goals: [results]
    - learner: "Per questo credo di meritare una promozione a responsabile di area. Guarda questi dati: il mio gruppo ha i risultati migliori di tutta la regione."
      errors: [imperative-form]
    - tutor: "Guarda questi dati? Anche qui, con il «lei»..."
      prompt: {text: "Guarda questi dati", tags: [imperative-form]}
    - learner: "Guarda... no, li guardi lei stessa: sono i migliori della regione."
    - tutor: "Li ho visti, e sono ottimi. Però il budget per le promozioni quest'anno è molto limitato."
      goals: [request]
    - learner: "Capisco. Allora proporrei una soluzione intermedia: più responsabilità adesso e l'aumento da gennaio, quando il budget sarà approvato."
    - tutor: "È una proposta ragionevole. Ne devo parlare con la direzione, ma mi sembra fattibile."
      goals: [handle]
    - learner: "Perfetto. Mi faccia sapere entro la fine del mese, per favore?"
    - tutor: "Senz'altro: ci rivediamo il trenta, con una risposta chiara."
      goals: [next-steps]

- scenario: burocrazia-residenza
  level: B2
  persona: es-m-worker
  history: [reflexive]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Ho trasferito a Bologna tre mesi fa e vorrei chiedere la residenza."
      errors: [reflexive]
    - tutor: "Ha trasferito... che cosa?"
      prompt: {text: "Ho trasferito", tags: [reflexive]}
    - learner: "Mi sono trasferito a Bologna tre mesi fa."
    - tutor: "Bene. Mi servono il permesso di soggiorno, il passaporto e il contratto d'affitto."
      goals: [request]
    - learner: "Ho tutto, però il contratto non è ancora registrato. Il padrone di casa ha detto che lo registra la prossima settimana."
    - tutor: "Senza la registrazione la pratica non può partire, purtroppo."
      goals: [documents]
    - learner: "Posso portare intanto una copia della ricevuta di pagamento? Il proprietario me la ha data ieri."
      errors: [combined-pronouns]
    - tutor: "Me la ha data? Quei due pronomi si uniscono in un modo particolare."
      prompt: {text: "me la ha data", tags: [combined-pronouns]}
    - learner: "Me l'ha data ieri."
    - tutor: "Va bene, la ricevuta la accettiamo in attesa del contratto registrato."
      goals: [problem]
    - learner: "E dopo, cosa succede? Mi preoccupo un po', perché non conosco la procedura."
    - tutor: "Entro quarantacinque giorni passano i vigili a controllare l'indirizzo. Se lei non c'è, lasciano un avviso."
      goals: [next]
    - learner: "Allora metto il mio nome sul campanello oggi stesso. Grazie per la pazienza!"
    - tutor: "Ottima idea, è proprio la prima cosa che controllano. Buona giornata."

- scenario: medico-specialista
  level: B2
  persona: en-m-heritage
  history: [stare-gerund]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Abbastanza bene, ma quando salgo le scale mi manca il fiato. E da un mese sono prendendo le pastiglie per la pressione."
      errors: [stare-gerund]
    - tutor: "Il fiato corto va controllato. Ma «sono prendendo»: che verbo serve, lì?"
      goals: [symptoms]
      prompt: {text: "sono prendendo", tags: [stare-gerund]}
    - learner: "Sto prendendo le pastiglie da un mese."
    - tutor: "Bene. In famiglia ci sono stati problemi di cuore?"
    - learner: "Sì, mio padre ha avuto un infarto a cinquantacinque anni, e mio nonno anche è morto di cuore."
      errors: [word-order]
    - tutor: "Mio nonno anche? Suona un po' all'inglese, no?"
      goals: [history]
      prompt: {text: "mio nonno anche", tags: [word-order]}
    - learner: "Anche mio nonno è morto di cuore."
    - tutor: "Capisco. Gli esami, comunque, sono buoni: il colesterolo è un po' alto, ma il battito è regolare."
    - learner: "Quindi il colesterolo è il problema principale? Cosa significa per me, concretamente?"
    - tutor: "Significa che dobbiamo abbassarlo, mangiando in modo più sano e forse con un farmaco."
      goals: [understand]
    - learner: "Il farmaco ha effetti collaterali? Non mi piace prendere troppe medicine."
    - tutor: "Qualcuno può avere dolori muscolari, ma è raro. Ci rivediamo tra tre mesi per un controllo."
      goals: [treatment]

- scenario: smartworking
  level: B2
  persona: es-f-teacher
  history: [spelling]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Insegno online due giorni a settimana e il resto in presenza. Da casa lavoro un po meglio, perché nessuno mi interrompe."
      errors: [spelling]
    - tutor: "Un po meglio? Manca un segno alla fine di «po»."
      prompt: {text: "un po meglio", tags: [spelling]}
    - learner: "Un po' meglio, giusto."
    - tutor: "Esatto. Quindi ti trovi bene con questo sistema?"
      goals: [situation]
    - learner: "Sì, perchè risparmio tempo e posso preparare le lezioni con calma."
      errors: [spelling]
    - tutor: "Perchè? Guarda bene l'accento: va in un'altra direzione."
      prompt: {text: "perchè", tags: [spelling]}
    - learner: "Perché risparmio tempo, ecco."
    - tutor: "Perfetto. E gli svantaggi?"
      goals: [pros]
    - learner: "Con gli studenti online è difficile capire se seguono: molti tengono la cámara spenta."
      errors: [word-choice]
    - tutor: "Eh sì, con la telecamera spenta non sai mai se ti ascoltano davvero."
      goals: [cons]
      recast: {text: "la cámara", fix: "la telecamera", tags: [word-choice]}
    - learner: "Esatto. Se potessi scegliere, farei tutto in presenza tranne le riunioni, che sono più comode online."
    - tutor: "Mi sembra una soluzione molto intelligente: le persone in classe, le riunioni sullo schermo."
      goals: [preference]

- scenario: film-libro
  level: B2
  persona: en-f-student
  history: [past-participle-form]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Ho letto un giallo di Camilleri. Un uomo viene trovato morto in una villa e il commissario Montalbano deve scoprire chi l'ha ucciso."
    - tutor: "Ottimo inizio, senza raccontare troppo. Com'è Montalbano come personaggio?"
      goals: [summary]
    - learner: "È ironico, testardo e mangia sempre benissimo. Alla fine ha risolvuto il caso grazie a un dettaglio che nessuno aveva notato."
      errors: [past-participle-form]
    - tutor: "Risolvuto? Quella forma del verbo non mi torna."
      goals: [characters]
      prompt: {text: "risolvuto", tags: [past-participle-form]}
    - learner: "Sì, ha risolvuto il caso in modo geniale."
      errors: [past-participle-form]
    - tutor: "Montalbano ha risolto il caso con un dettaglio da niente: tipico suo! E a te, è piaciuto?"
      recast: {text: "risolvuto", fix: "risolto", tags: [past-participle-form]}
    - learner: "Moltissimo. Il dialetto siciliano all'inizio era difficile, ma ha dato molto colore alla storia. Le scene di cibo mi hanno fatto venire fame!"
    - tutor: "Succede a tutti quelli che leggono Camilleri! A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A chi ama i gialli leggeri e a chi vuole scoprire la Sicilia. Però non lo consiglio a chi non ha pazienza con le parole dialettali."
    - tutor: "Consiglio onesto. La prossima volta portiamo qualcosa di siciliano da mangiare, così entriamo nell'atmosfera."
      goals: [recommend]

- scenario: riunione-lavoro
  level: B2
  persona: en-m-traveller
  history: [demonstrative]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Abbiamo finito la prima fase. Però ci sono ancora quei aspetti tecnici che non abbiamo risolto con il cliente."
      errors: [demonstrative]
    - tutor: "Quei aspetti? Davanti alla «a», quella forma cambia."
      goals: [update]
      prompt: {text: "quei aspetti", tags: [demonstrative]}
    - learner: "Quegli aspetti tecnici, sì."
    - tutor: "Esatto. Qual è il problema principale?"
    - learner: "Il cliente vuole cambiare il design della piattaforma, ma noi abbiamo già sviluppato quello vecchio e non c'è più tempo."
    - tutor: "Sì, il cliente vuole cambiare il design proprio adesso: un classico."
      goals: [problem]
    - learner: "Proporrei di consegnare questa versione a fine mese e fare le modifiche in una seconda fase."
    - tutor: "Mi sembra giusto. Lo proponi tu al cliente o lo faccio io?"
      goals: [proposal]
    - learner: "Glielo dico io domani. Quegli dettagli li possiamo discutere giovedì."
      errors: [demonstrative]
    - tutor: "Quegli dettagli? Pensa a come hai corretto «quegli aspetti»."
      prompt: {text: "Quegli dettagli", tags: [demonstrative]}
    - learner: "Quei dettagli li discutiamo giovedì."
    - tutor: "Perfetto: tu parli con il cliente domani, e la consegna resta fissata al trenta."
      goals: [deadline]

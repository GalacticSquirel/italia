# w-raretags, file 03: A2-B1, past-participle-form, imperfetto-form, pronoun-position,
# stare-gerund, possessive and demonstrative in stories, errands and plans.
- scenario: weekend-scorso
  level: A2
  persona: en-m-traveller
  history: [past-participle-form]
  turns:
    - tutor: "Ciao! Com'è andato il fine settimana?"
    - learner: "Benissimo! Sabato sono andato al lago con mia sorella."
    - tutor: "Che bello! E cosa avete fatto al lago?"
      goals: [where, with-who]
    - learner: "Abbiamo fatto una passeggiata e la sera abbiamo vedato un film all'aperto."
      errors: [past-participle-form]
    - tutor: "Un film all'aperto? Aspetta: vedato? Pensa bene al verbo vedere."
      prompt: {text: "vedato", tags: [past-participle-form]}
    - learner: "Sì, abbiamo... vedato? Non sono sicuro."
      errors: [past-participle-form]
    - tutor: "Avete visto un film sotto le stelle, che bello! Quale film era?"
      goals: [what]
      recast: {text: "vedato", fix: "visto", tags: [past-participle-form]}
    - learner: "Un film italiano molto vecchio, in bianco e nero. Mi è piaciuto tantissimo."
    - tutor: "Allora è stato un weekend perfetto! Io invece sono rimasta a casa."
    - learner: "Perché? Cosa hai facciuto domenica?"
      errors: [past-participle-form]
    - tutor: "Facciuto? Prova di nuovo, anche fare è speciale."
      prompt: {text: "facciuto", tags: [past-participle-form]}
    - learner: "Cosa hai fatto domenica?"
    - tutor: "Bravo! Ho dormito fino a tardi e poi ho cucinato per i miei genitori."
      goals: [opinion]

- scenario: vacanze-passate
  level: A2
  persona: es-f-erasmus
  history: [past-participle-form]
  turns:
    - tutor: "Ciao! Raccontami tutto: dove hai passato le vacanze?"
    - learner: "Sono stata in Sardegna con le mie amiche, per due settimane."
    - tutor: "Che bello! Che tempo ha fatto?"
      goals: [where]
    - learner: "Ha fatto molto caldo. Ogni giorno abbiamo prenduto il sole in spiaggia."
      errors: [past-participle-form]
    - tutor: "Prenduto? Pensa bene al verbo prendere."
      goals: [weather]
      prompt: {text: "prenduto", tags: [past-participle-form]}
    - learner: "Abbiamo preso il sole!"
    - tutor: "Perfetto! E cosa avete fatto, oltre alla spiaggia?"
    - learner: "Abbiamo visitato un paese in montagna. Il formaggio era buonissima."
      errors: [adjective-agreement]
    - tutor: "Il formaggio era buonissima? Guarda bene la fine della parola."
      goals: [activities]
      prompt: {text: "era buonissima", tags: [adjective-agreement]}
    - learner: "Era buonissimo!"
    - tutor: "Che fame! E qual è stata la cosa più bella?"
    - learner: "Il mare! L'acqua era chiarissima, come in una piscina."
    - tutor: "Che fortuna! L'anno prossimo vengo anch'io con voi."
      goals: [best]

- scenario: ricordi-infanzia
  level: A2
  persona: en-f-student
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccola?"
    - learner: "Da piccola io abitevo in campagna, vicino a Bristol."
      errors: [imperfetto-form]
    - tutor: "Abitevo? Attenzione: il verbo è abitare."
      prompt: {text: "abitevo", tags: [imperfetto-form]}
    - learner: "Abitavo in campagna!"
    - tutor: "Esatto! E che cosa facevi tutto il giorno?"
      goals: [place]
    - learner: "Giocavo sempre fuori con il mio cane. Lui correva e io correvo dietro."
    - tutor: "Che bello, un cane! E la scuola com'era?"
      goals: [habits]
    - learner: "Era piccola. La maestra raccontava sempre storie e noi la ascoltevamo."
      errors: [imperfetto-form]
    - tutor: "Ascoltevamo? Stesso problema di prima!"
      prompt: {text: "ascoltevamo", tags: [imperfetto-form]}
    - learner: "Ascoltavamo! Scusa."
    - tutor: "Brava! E hai un ricordo speciale?"
      goals: [school]
    - learner: "Sì, una volta è nevicato tantissimo e non siamo andati a scuola per tre giorni!"
    - tutor: "Tre giorni di neve, che fortuna! Avete giocato tutto il giorno, immagino."
      goals: [event]

- scenario: ricordi-infanzia
  level: B1
  persona: es-m-worker
  history: [imperfetto-form]
  turns:
    - tutor: "Che bello qui! Tu dove abitavi da piccolo?"
    - learner: "Abitavo a Cadice, vicino al mare. Mio padre facava il pescatore."
      errors: [imperfetto-form]
    - tutor: "Al mare, che bello! Tuo padre... facava? Pensa bene al verbo fare."
      goals: [place]
      prompt: {text: "facava", tags: [imperfetto-form]}
    - learner: "Sì, mio padre facava il pescatore."
      errors: [imperfetto-form]
    - tutor: "Quindi tuo padre faceva il pescatore! A casa mangiavate pesce ogni giorno?"
      recast: {text: "facava", fix: "faceva", tags: [imperfetto-form]}
    - learner: "Sì, sempre! La domenica io andevo con lui in barca."
      errors: [imperfetto-form]
    - tutor: "Andevo? Ma il verbo è andare, no?"
      prompt: {text: "andevo", tags: [imperfetto-form]}
    - learner: "Andavo con lui in barca."
    - tutor: "Che fortuna! E a scuola come ti trovavi?"
      goals: [habits]
    - learner: "Non mi piaceva molto. Ero un bambino timido e non parlavo mai in classe."
    - tutor: "Ti capisco, anch'io ero timido. C'è un giorno che ricordi in modo speciale?"
      goals: [school]
    - learner: "Sì, un giorno ho vinto una gara di nuoto e tutta la scuola mi ha applaudito."
    - tutor: "Che bel ricordo! Tuo padre era sicuramente molto contento."
      goals: [event]

- scenario: lavanderia
  level: A2
  persona: en-m-heritage
  history: [pronoun-position]
  turns:
    - tutor: "Tutto bene? Hai bisogno di una mano?"
    - learner: "Sì, grazie! È la prima volta qui e non capisco come funziona la lavatrice."
    - tutor: "Nessun problema, ti spiego io."
      goals: [problem]
    - learner: "Ho una maglia di lana. Posso la lavare a quaranta gradi?"
      errors: [pronoun-position]
    - tutor: "Posso la lavare? Dove metti «la»?"
      prompt: {text: "Posso la lavare", tags: [pronoun-position]}
    - learner: "Posso lavarla a quaranta gradi?"
    - tutor: "Esatto! Ma è meglio a trenta gradi, con l'acqua fredda."
      goals: [ask-how]
    - learner: "Ok. E il detersivo, devo lo comprare?"
      errors: [pronoun-position]
    - tutor: "Devo lo comprare? Stesso problema di prima, prova ancora."
      prompt: {text: "devo lo comprare", tags: [pronoun-position]}
    - learner: "Devo comprarlo?"
    - tutor: "No, il detersivo è già dentro la lavatrice."
    - learner: "Perfetto. E come pago? Devo comprare le gettoni?"
      errors: [noun-gender]
    - tutor: "Le gettoni? Gettone è maschile, sai?"
      prompt: {text: "le gettoni", tags: [noun-gender]}
    - learner: "I gettoni! Dove li compro?"
    - tutor: "Lì, vicino alla porta. Ne servono quattro."
      goals: [payment]
    - learner: "Grazie mille, sei molto gentile!"
    - tutor: "Di niente! Se hai bisogno, sono qui."
      goals: [thank]

- scenario: serata-cinema
  level: A2
  persona: en-f-professional
  history: [stare-gerund]
  turns:
    - tutor: "Stasera sono libera. Facciamo qualcosa?"
    - learner: "Sì! Andiamo al cinema? Sono guardando il programma sul telefono."
      errors: [stare-gerund]
    - tutor: "Sono guardando? Scusa, non ho capito."
      goals: [propose]
      prompt: {text: "Sono guardando", tags: [stare-gerund]}
    - learner: "Sto guardando il programma!"
    - tutor: "Ah, ecco! E che film danno?"
    - learner: "C'è una commedia francese e un film d'azione. A me piace di più le commedie."
      errors: [piacere]
    - tutor: "Ti piace di più le commedie? Ascolta bene il verbo."
      prompt: {text: "piace di più le commedie", tags: [piacere]}
    - learner: "Mi piacciono di più le commedie."
    - tutor: "Anche a me! Allora la commedia. A che ora?"
      goals: [genre]
    - learner: "Alle otto e mezza va bene? Dopo possiamo mangiare una pizza."
    - tutor: "Perfetto, commedia e pizza! Dove ci vediamo?"
      goals: [choose]
    - learner: "Davanti al cinema alle otto e un quarto?"
    - tutor: "Va benissimo. A stasera!"
      goals: [meet]

- scenario: cercare-lavoro-a2
  level: A2
  persona: es-f-teacher
  history: [possessive]
  turns:
    - tutor: "Buongiorno! Ha visto il cartello?"
    - learner: "Sì, buongiorno! Cercate una cameriera per l'estate?"
    - tutor: "Sì, per luglio e agosto. Ha esperienza?"
      goals: [ask]
    - learner: "Sì, ho lavorato due anni nel ristorante del mio zio, a Siviglia."
      errors: [possessive]
    - tutor: "Del mio zio? Pensi bene: lo zio è famiglia."
      prompt: {text: "del mio zio", tags: [possessive]}
    - learner: "Nel ristorante di mio zio!"
    - tutor: "Brava. E che cosa faceva lì?"
    - learner: "Servivo ai tavoli e qualche volta lavoravo a la cassa."
      errors: [articulated-preposition]
    - tutor: "A la cassa? Quelle due parole stanno insieme."
      prompt: {text: "a la cassa", tags: [articulated-preposition]}
    - learner: "Lavoravo alla cassa."
    - tutor: "Perfetto, è proprio quello che ci serve. Quando può cominciare?"
      goals: [experience]
    - learner: "Sono disponibile desde lunedì, anche la sera."
      errors: [word-choice]
    - tutor: "Da lunedì va benissimo. Mi lascia un numero di telefono?"
      goals: [availability]
      recast: {text: "desde lunedì", fix: "da lunedì", tags: [word-choice]}
    - learner: "Certo: 333 418 2290. Mi chiamo Lucía Romero."
    - tutor: "Grazie, Lucía. La chiamo domani."
      goals: [contact]

- scenario: ufficio-postale
  level: A2
  persona: en-m-retired
  history: [demonstrative]
  turns:
    - tutor: "Buongiorno, mi dica."
    - learner: "Buongiorno. Vorrei spedire questo pacco a Londra."
    - tutor: "Certo, mi dia pure il pacco."
      goals: [send]
    - learner: "E vorrei spedire anche quelli libri in una busta."
      errors: [demonstrative]
    - tutor: "Quelli libri? Mmm, quella parola non va."
      prompt: {text: "quelli libri", tags: [demonstrative]}
    - learner: "Quei libri! Scusi."
    - tutor: "Bravo! Vuole la spedizione normale o veloce?"
    - learner: "Quanto costa la veloce? E quanti giorni ci vuole?"
      errors: [subject-verb-agreement]
    - tutor: "Quanti giorni ci vuole? Attenzione: i giorni sono tanti!"
      prompt: {text: "ci vuole", tags: [subject-verb-agreement]}
    - learner: "Quanti giorni ci vogliono?"
    - tutor: "Tre giorni, e costa venti euro. La normale ci mette una settimana."
    - learner: "Allora la veloce. Ecco il modulo, ma non so il codice di il mio figlio."
      errors: [possessive]
    - tutor: "Scusi, il codice di chi?"
      goals: [speed]
      prompt: {text: "di il mio figlio", tags: [possessive]}
    - learner: "Di mio figlio. Abita a Londra."
    - tutor: "Non si preoccupi, lo cerco io sul computer. Sono venti euro in tutto."
      goals: [form]
    - learner: "Ecco. Mi dà la ricevuta, per favore?"
    - tutor: "Certo, ecco la ricevuta. Buona giornata!"
      goals: [pay]

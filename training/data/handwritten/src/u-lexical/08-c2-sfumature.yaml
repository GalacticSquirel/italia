# Round 6, set u-lexical: false friends and calques, C2, file 8.
- scenario: assemblea-condominio
  level: C2
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
    - learner: "Sì, grazie. Propongo di aplazare i lavori della facciata all'anno prossimo."
      errors: [word-choice]
    - tutor: "Rinviare i lavori all'anno prossimo? Le ricordo che la delibera è stata approvata già a maggio."
      recast: {text: "aplazare i lavori", fix: "Rinviare i lavori", tags: [word-choice]}
      goals: [position]
    - learner: "Lo so, ma molti condomini sono jubilati e non possono pagare tremila euro in due mesi."
      errors: [word-choice]
    - tutor: "Molti sono pensionati, è vero, e il signor Bassi mi ha già detto che per lui sarebbe impossibile."
      recast: {text: "jubilati", fix: "pensionati", tags: [word-choice]}
    - learner: "Esatto. E poi il preventivo mi sembra gonfiato: il ponteggio da solo costa un terzo del totale."
    - tutor: "Il geometra sostiene che il prezzo sia in linea con il mercato, ma capisco i suoi dubbi."
    - learner: "Vorrei che l'amministratore chiede almeno altri due preventivi prima di firmare."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che l'amministratore chiede»? Dopo «vorrei che», quale forma ci vuole?"
      prompt: {text: "chiede", tags: [subjunctive-use]}
    - learner: "Mi correggo: vorrei che l'amministratore chiedesse almeno altri due preventivi."
    - tutor: "Me ne occupo io, nessun problema. Ma i signori del terzo piano temono infiltrazioni, se aspettiamo un anno."
      goals: [defuse]
    - learner: "Allora facciamo così: i lavori urgenti sul tetto adesso, e la facciata in primavera, pagando a plazos."
      errors: [word-choice]
    - tutor: "Pagare a rate è un'alternativa sensata. Dodici rate mensili le sembrerebbero sostenibili per tutti?"
      recast: {text: "a plazos", fix: "a rate", tags: [word-choice]}
      goals: [alternative]
    - learner: "Sì, dodici rate vanno bene. Chiedo solo che resti tutto scritto nell'acta dell'assemblea."
      errors: [word-choice]
    - tutor: "Resterà tutto nel verbale, parola per parola. Mettiamo ai voti la proposta?"
      recast: {text: "nell'acta", fix: "nel verbale", tags: [word-choice]}
      goals: [compromise]
    - learner: "Sì, mettiamola ai voti. E grazie della pazienza."
    - tutor: "Grazie a lei. Chi è favorevole alzi la mano... Approvata a maggioranza!"

- scenario: email-rettore
  level: C2
  persona: en-m-heritage
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
    - learner: "Buongiorno. Il mio contratto di ricerca espira a dicembre, e vorrei chiedere che venga rinnovato per un altro anno."
      errors: [false-friend]
    - tutor: "Se scade a dicembre, il tempo stringe. È una richiesta formale, quindi la lettera va curata in ogni dettaglio: ha già una bozza?"
      recast: {text: "espira a dicembre", fix: "scade a dicembre", tags: [false-friend]}
      goals: [situation]
    - learner: "Sì, ma non so qual è il modo giusto per indirizzare il Rettore all'inizio della lettera."
      errors: [false-friend]
    - tutor: "Per rivolgersi al Rettore si usa «Magnifico Rettore», seguito da una virgola; poi si va a capo."
      recast: {text: "indirizzare il Rettore", fix: "rivolgersi al Rettore", tags: [false-friend]}
      goals: [opening-formula]
    - learner: "«Magnifico»? Sembra quasi ironico! Nella bozza ho scritto: «Le sarei grato se potrebbe considerare la mia richiesta»."
      errors: [hypothetical]
    - tutor: "«Se potrebbe considerare»? In una lettera al Rettore quel «se» non perdona: che cosa ci vuole?"
      prompt: {text: "se potrebbe", tags: [hypothetical]}
    - learner: "Ah, certo: «Le sarei grato se potesse considerare la mia richiesta»."
    - tutor: "Esatto. Anzi, per alzare il registro: «Le sarei grato se volesse prendere in considerazione la presente istanza»."
      goals: [tone]
    - learner: "Perfetto. Allego anche una lettera del mio direttore di ricerca, che endorsa pienamente la richiesta."
      errors: [word-choice]
    - tutor: "Una lettera che appoggia pienamente la richiesta è preziosa: la citi in modo esplicito tra gli allegati."
      recast: {text: "endorsa", fix: "appoggia", tags: [word-choice]}
    - learner: "E per chiudere? Scrivo «Sinceramente suo»?"
      errors: [word-choice]
    - tutor: "Meglio «Distinti saluti», oppure il più solenne «Con osservanza», seguito dalla firma."
      recast: {text: "Sinceramente suo", fix: "Distinti saluti", tags: [word-choice]}
      goals: [closing]
    - learner: "«Con osservanza»... mi piace, sembra di un altro secolo."
    - tutor: "Lo è, ed è proprio per questo che piace ai rettori. Mi mandi la versione definitiva e la rileggo prima dell'invio."

- scenario: dialetti-regionali
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
    - learner: "Ah, ridevo per il tono, non per le parole! Ho capito pochissimo: il loro accento era molto spesso."
      errors: [word-choice]
    - tutor: "Un accento molto marcato, sì: erano due napoletani veraci, e parlavano in dialetto stretto."
      recast: {text: "molto spesso", fix: "molto marcato", tags: [word-choice]}
      goals: [notice]
    - learner: "Ho notato solo che ripetevano spesso «uè» e «jamme», come un ritornello."
    - tutor: "«Jamme» vuol dire «andiamo»: lo conosci di sicuro da «Funiculì funiculà»!"
      goals: [example]
    - learner: "Ma certo! E il napoletano è una lingua a sé o una variante dell'italiano?"
    - tutor: "Molti linguisti lo considerano una lingua a sé, con una sua storia e una letteratura importante."
    - learner: "È strano che i giovani lo parlano ancora così tanto."
      errors: [subjunctive-use]
    - tutor: "«È strano che i giovani lo parlano»? Dopo «è strano che», quale modo ci vuole?"
      prompt: {text: "lo parlano", tags: [subjunctive-use]}
    - learner: "Hai ragione: è strano che i giovani lo parlino ancora così tanto."
    - tutor: "Strano per te, forse! Qui i ragazzi passano dal dialetto all'italiano a metà frase, senza nemmeno farci caso."
      goals: [standard]
    - learner: "Quando sono arrivata a Londra dal nord, mi sono sentita un po' alienata da tutti quegli accenti. Qui è lo stesso!"
      errors: [false-friend]
    - tutor: "Ti sei sentita un po' esclusa, capisco. Ma credimi, anche un milanese a Napoli si sente così."
      recast: {text: "alienata", fix: "esclusa", tags: [false-friend]}
    - learner: "Secondo me i dialetti sono un patrimonio, non un difetto da correggere a scuola."
    - tutor: "Sottoscrivo ogni parola. Peccato che per decenni a scuola si sia fatto esattamente il contrario."
      goals: [opinion]
    - learner: "Allora insegnami qualcosa! Come si dice «ci vediamo» in napoletano?"
    - tutor: "Si dice «ce vedimmo». E adesso tocca a te: ripetilo con la cadenza giusta!"

- scenario: pranzo-domenicale
  level: C2
  persona: en-m-traveller
  history: [word-choice]
  turns:
    - tutor: "Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
    - learner: "Scusate il ritardo! Ho cercato di uccidere due uccelli con una pietra e sono passato anche in pasticceria."
      errors: [word-choice]
    - tutor: "Hai voluto prendere due piccioni con una fava, eh? E dalla pasticceria cosa ci hai portato?"
      recast: {text: "uccidere due uccelli con una pietra", fix: "prendere due piccioni con una fava", tags: [word-choice]}
    - learner: "Cannoli, dalla pasticceria all'angolo: il pasticcere è un vero carattere! Ne ho presi sei, e siamo in dieci."
      errors: [false-friend]
    - tutor: "Un vero personaggio, sì: Gennaro canta l'opera mentre farcisce i cannoli. Ma sei per dieci persone? Qui scoppia una guerra peggio che per la lasagna."
      recast: {text: "un vero carattere", fix: "un vero personaggio", tags: [false-friend]}
      goals: [react]
    - learner: "Allora prima la lasagna. Quanta ce n'è ancora?"
    - tutor: "Ne è rimasta mezza teglia, ma te la devi vedere con zia Pina. E dei cannoli, quanti ne tieni per te?"
    - learner: "Voglio due, ovviamente: l'ospite ha i suoi privilegi!"
      errors: [ci-ne]
    - tutor: "«Voglio due»? Due cannoli, d'accordo, ma manca la parolina che li riprende."
      prompt: {text: "Voglio due", tags: [ci-ne]}
    - learner: "Ah, sì: ne voglio due, ovviamente!"
    - tutor: "Ecco, così sì. Però occhio, zia Pina li conta tutti."
    - learner: "Zia Pina mi fa paura: le lascerò l'ultimo cannolo quando i maiali voleranno!"
      errors: [word-choice]
    - tutor: "Quando gli asini voleranno, semmai! Da noi volano gli asini, non i maiali."
      recast: {text: "quando i maiali voleranno", fix: "quando gli asini voleranno", tags: [word-choice]}
      goals: [use-idiom]
    - learner: "In Irlanda diciamo i maiali, voi gli asini: in fondo il senso è lo stesso."
    - tutor: "Il senso sì, ma l'immagine cambia tutto: un asino che vola è molto più ridicolo!"
      goals: [compare]
    - learner: "Una volta ho tradotto alla lettera «break a leg» a un'amica attrice prima dello spettacolo, e lei si è spaventata!"
    - tutor: "Ci credo! Le avresti dovuto dire «in bocca al lupo», e lei ti avrebbe risposto «crepi»."
      goals: [anecdote]

- scenario: circolo-lettura
  level: C2
  persona: es-f-teacher
  history: [false-friend]
  turns:
    - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
    - learner: "Io no! Cosimo è testardo, certo, ma ha molto genio: quando decide una cosa, non torna indietro."
      errors: [false-friend]
    - tutor: "Ha un bel caratterino, altroché: dodici anni, sale su un albero e decide di non scendere mai più."
      recast: {text: "ha molto genio", fix: "ha un bel caratterino", tags: [false-friend]}
      goals: [impression]
    - learner: "Per me la sua ribellione è un'allegoria dell'intellettuale che si allontana dalla società per osservarla meglio."
    - tutor: "Lettura classica, ma convincente. E Calvino, in fondo, non l'ha mai smentita."
      goals: [theme]
    - learner: "Credevo che Cosimo scendeva almeno alla morte del padre, e invece no."
      errors: [subjunctive-use]
    - tutor: "«Credevo che Cosimo scendeva»? Con «credevo che», quale modo e quale tempo ci vogliono?"
      prompt: {text: "scendeva", tags: [subjunctive-use]}
    - learner: "Credevo che Cosimo scendesse almeno alla morte del padre."
    - tutor: "Esatto, e lo credevano anche i lettori del 1957. È lì che il romanzo diventa davvero coraggioso."
    - learner: "Lo stile mi è sembrato leggerissimo, e Calvino è molto ocurrente: certe frasi mi hanno fatto ridere ad alta voce."
      errors: [word-choice]
    - tutor: "Molto arguto, sì: è quella leggerezza di cui parlerà poi nelle «Lezioni americane»."
      recast: {text: "molto ocurrente", fix: "molto arguto", tags: [word-choice]}
      goals: [style]
    - learner: "Il narratore, invece, mi è sembrato un po' soso, quasi un notaio che registra i fatti."
      errors: [word-choice]
    - tutor: "Un po' insipido, Biagio? Che crudeltà! Io credo che la sua prudenza grigia serva proprio a far brillare Cosimo."
      recast: {text: "un po' soso", fix: "un po' insipido", tags: [word-choice]}
      goals: [disagree]
    - learner: "Forse ha ragione. Comunque lo consiglierei a chiunque, anche ai ragazzi: è una lettura molto amena."
    - tutor: "Amena e profonda insieme, cosa rara. Lo mettiamo tra i consigli per la biblioteca della scuola."
      goals: [recommend]

- scenario: intelligenza-artificiale
  level: C2
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Capisco la tua paura, ma la storia insegna altro: ogni rivoluzione tecnologica ha distrutto mestieri e ne ha creati di nuovi."
    - tutor: "Sì, ma stavolta è diverso: le macchine non sostituiscono più le braccia, sostituiscono le teste."
      goals: [position]
    - learner: "Non è certo un problema triviale, ma ci sono dati interessanti: secondo uno studio recente, le aziende che adottano l'IA assumono di più, non di meno."
      errors: [false-friend]
    - tutor: "Un problema banale non lo è di sicuro. Ma quello studio chi l'ha finanziato, le aziende stesse?"
      recast: {text: "triviale", fix: "banale", tags: [false-friend]}
      goals: [evidence]
    - learner: "Buona domanda. Ammetto che non l'ho verificato."
    - tutor: "Ecco. E anche se fosse vero, i nuovi posti richiedono competenze che un cinquantenne spesso non ha."
    - learner: "Su questo ti do ragione: la formazione è il vero nodo. Dobbiamo tenere un occhio sulle persone più a rischio."
      errors: [word-choice]
    - tutor: "Tenere d'occhio le persone più a rischio, certo: ma chi deve farlo, lo Stato o le aziende?"
      recast: {text: "tenere un occhio sulle persone", fix: "tenere d'occhio le persone", tags: [word-choice]}
      goals: [concede]
    - learner: "Tutti e due. Se lo Stato avrebbe investito prima nella formazione digitale, oggi saremmo più pronti."
      errors: [hypothetical]
    - tutor: "«Se lo Stato avrebbe investito»? Tu che sei sempre così preciso: che cosa ci vuole dopo quel «se»?"
      prompt: {text: "avrebbe investito", tags: [hypothetical]}
    - learner: "Hai ragione: se lo Stato avesse investito prima, oggi saremmo più pronti."
    - tutor: "Esatto. E su questo, almeno, siamo d'accordo."
    - learner: "Quindi la mia conclusione è che non bisogna avere paura, ma nemmeno dormire sugli allori."
    - tutor: "Né panico né illusioni, insomma. Mi hai quasi tranquillizzato... quasi."
      goals: [conclude]

- scenario: colloquio-promozione
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Quest'anno il mio gruppo ha ecceduto le aspettative su tutti gli indicatori."
      errors: [word-choice]
    - tutor: "Ha superato le aspettative, lo riconosco: i numeri parlano chiaro. Dove vuole arrivare?"
      recast: {text: "ecceduto le aspettative", fix: "superato le aspettative", tags: [word-choice]}
      goals: [results]
    - learner: "Ritengo di aver dimostrato di poter guidare l'intera area commerciale, e vorrei candidarmi al ruolo di direttrice."
    - tutor: "Una richiesta ambiziosa. Sa che anche Ferri ambisce allo stesso posto?"
      goals: [request]
    - learner: "Lo so, e lo stimo. Non ho un'agenda nascosta: voglio solo che la scelta sia fatta sui risultati."
      errors: [word-choice]
    - tutor: "Non ho mai pensato che avesse secondi fini, stia tranquilla. Ma i risultati non sono l'unico criterio."
      recast: {text: "un'agenda nascosta", fix: "secondi fini", tags: [word-choice]}
    - learner: "Vorrei che lei mi considerava anche per come gestisco il gruppo: in tre anni non si è dimesso nessuno."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che lei mi considerava»? Dopo «vorrei che», quale forma serve?"
      prompt: {text: "mi considerava", tags: [subjunctive-use]}
    - learner: "Mi scusi: vorrei che lei mi considerasse anche per come gestisco il gruppo."
    - tutor: "Lo farò, e la stabilità del suo gruppo pesa molto, glielo assicuro."
      goals: [handle]
    - learner: "Se non dovessi ottenere il ruolo, sarei comunque disposta a guidare l'espansione in Spagna."
    - tutor: "Questa disponibilità le fa onore. Porterò la sua candidatura in consiglio entro la fine del mese."
    - learner: "La ringrazio. Le mando un riepilogo con le cifre, e se servono altre referenze me lo dica."
    - tutor: "Perfetto. Ci aggiorniamo dopo il consiglio, e grazie per la franchezza."
      goals: [next-steps]

- scenario: umorismo-satira
  level: C2
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
    - learner: "Lo ammetto, non l'avevo capita! Però a quella sul tram ho riso a carcajadas."
      errors: [word-choice]
    - tutor: "Hai riso a crepapelle, ti ho sentita da tre file di distanza! Quella però era facile."
      recast: {text: "a carcajadas", fix: "a crepapelle", tags: [word-choice]}
      goals: [favourite]
    - learner: "Allora spiegami quella del ministro: c'era un doppio senso? Non ho capito il chiste."
      errors: [word-choice]
    - tutor: "La battuta era questa: il ministro aveva detto che la riforma andava «cotta a fuoco lento», e il comico ha aggiunto: «Come la carbonara: alla fine ci mettono la panna»."
      recast: {text: "il chiste", fix: "La battuta", tags: [word-choice]}
      goals: [missed]
    - learner: "Ah! Perché la panna nella carbonara è un sacrilegio! Se l'avessi saputo, avrei riso anch'io."
    - tutor: "Esatto, un gioco di parole culinario e politico insieme. Il pubblico romano non perdona né la panna né i ministri."
      goals: [wordplay]
    - learner: "Pensavo che la satira in Italia era più dura, come in Spagna."
      errors: [subjunctive-use]
    - tutor: "«Pensavo che la satira era»? Proprio stasera, con tutte queste sfumature: quale modo ci vuole?"
      prompt: {text: "era più dura", tags: [subjunctive-use]}
    - learner: "Pensavo che la satira fosse più dura, volevo dire."
    - tutor: "Lo era, una volta. Oggi molti comici preferiscono l'ironia alla cattiveria."
    - learner: "A un certo punto ha raccontato una battuta verde su un cardinale, e lì metà sala non ha riso."
      errors: [false-friend]
    - tutor: "Una battuta spinta su un cardinale, a Roma: coraggio o incoscienza, dipende dai punti di vista!"
      recast: {text: "una battuta verde", fix: "una battuta spinta", tags: [false-friend]}
    - learner: "Secondo te la satira ha dei limiti? Io penso che non si debba ridere delle vittime."
    - tutor: "Sono d'accordo: si ride del potere, mai di chi lo subisce. È quello il confine."
      goals: [limits]
    - learner: "Allora siamo d'accordo. La prossima volta però scegli tu lo spettacolo, e mi spieghi le battute prima!"
    - tutor: "Affare fatto: ti preparo un piccolo glossario della satira romana."

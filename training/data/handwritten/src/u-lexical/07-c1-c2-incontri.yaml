# Round 6, set u-lexical: false friends and calques, C1 and C2, file 7.
- scenario: colloquio-lavoro
  level: C1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Lucía, ho venticinque anni e mi sono laureata in Economia a Siviglia, con una beca per un semestre a Bologna."
      errors: [word-choice]
    - tutor: "Una borsa di studio a Bologna, quindi l'Italia la conosce già. E dopo la laurea?"
      recast: {text: "una beca", fix: "una borsa di studio", tags: [word-choice]}
      goals: [intro]
    - learner: "Dopo ho fatto delle practicas in un'agenzia di marketing a Madrid, per sei mesi."
      errors: [word-choice]
    - tutor: "Un tirocinio di sei mesi, bene. Di che cosa si occupava, esattamente?"
      recast: {text: "delle practicas", fix: "un tirocinio", tags: [word-choice]}
      new: [{lemma: tirocinio, gloss: internship}]
    - learner: "Gestivo i social di tre clienti. Nel frattempo ho seguito anche un corso serale di analisi dei dati."
    - tutor: "Una combinazione interessante. Quali sono i suoi punti di forza?"
      goals: [experience]
    - learner: "Domino perfettamente l'inglese e lo spagnolo, e sono molto resolutiva: quando c'è un problema, cerco subito una soluzione."
      errors: [word-choice]
    - tutor: "Molto concreta, quindi: è una qualità che qui apprezziamo parecchio, insieme alle lingue."
      recast: {text: "molto resolutiva", fix: "molto concreta", tags: [word-choice]}
    - learner: "Ho lavorato anche con clienti molto esigenti, quindi non mi spavento facilmente."
    - tutor: "Ottimo, ne abbiamo diversi. Perché vuole lavorare proprio da noi?"
      goals: [strengths]
    - learner: "Perché lavorate con l'America Latina, e vorrei che il mio spagnolo serve a qualcosa."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che il mio spagnolo serve»? Dopo «vorrei che», quale forma ci vuole?"
      prompt: {text: "serve a qualcosa", tags: [subjunctive-use]}
    - learner: "Ah, certo: vorrei che il mio spagnolo servisse a qualcosa."
    - tutor: "Esatto. E servirebbe eccome: metà dei nostri clienti è in Messico e in Cile."
      goals: [why]
    - learner: "Posso fare una domanda? Il contratto è a tempo indeterminato?"
    - tutor: "All'inizio è di un anno, poi di solito diventa a tempo indeterminato. Le faremo sapere entro due settimane."
      goals: [questions]

- scenario: modi-di-dire
  level: C1
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Che giornata! Stanotte non ho chiuso occhio, io che di solito dormo come un tronco."
      errors: [word-choice]
    - tutor: "Tu che di solito dormi come un ghiro? Allora è grave. Perché non hai dormito?"
      recast: {text: "come un tronco", fix: "come un ghiro", tags: [word-choice]}
    - learner: "Il vicino ha fatto una festa fino alle quattro. Poi stamattina il capo era di mala leche e ha urlato a tutti."
      errors: [word-choice]
    - tutor: "Era di cattivo umore, eh? Proprio la giornata giusta."
      recast: {text: "di mala leche", fix: "di cattivo umore", tags: [word-choice]}
    - learner: "E quando sono arrivato al mercato, il pescatore aveva già venduto tutto il pesce."
      errors: [false-friend]
    - tutor: "Il pescivendolo aveva già finito tutto? Piove sempre sul bagnato!"
      recast: {text: "il pescatore", fix: "il pescivendolo", tags: [false-friend]}
      goals: [tell]
      new: [{lemma: pescivendolo, gloss: fishmonger}]
    - learner: "Esatto, piove sul bagnato! Ho dovuto cambiare il menù, e un cliente si è lamentato perché il suo piatto preferito non c'era."
    - tutor: "Che sfortuna nera! E di chi è la colpa, secondo te?"
      goals: [react]
    - learner: "Del vicino, ovviamente! Se il vicino non avrebbe fatto la festa, sarei arrivato al mercato presto."
      errors: [hypothetical]
    - tutor: "«Se il vicino non avrebbe fatto»? Per un'ipotesi nel passato, cosa ci vuole dopo «se»?"
      prompt: {text: "non avrebbe fatto", tags: [hypothetical]}
    - learner: "Se il vicino non avesse fatto la festa, sarei arrivato presto."
    - tutor: "Esatto. Però non puoi scaricare tutta la colpa sul vicino: perché non sei andato al mercato ieri?"
      goals: [blame]
    - learner: "Hai ragione, ho voluto fare il furbo e ho rimandato. Ho imparato la lezione: mai rimandare a domani quello che puoi fare oggi."
    - tutor: "Ecco la morale! E stasera a letto presto, con i tappi nelle orecchie."
      goals: [moral]

- scenario: riunione-lavoro
  level: C1
  persona: en-m-heritage
  history: [word-choice]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Bene, nel complesso. Abbiamo consegnato la prima versione dell'app, e il cliente è soddisfatto."
    - tutor: "Ottimo. E i problemi di cui parlavi la settimana scorsa?"
      goals: [update]
    - learner: "Il server va in crash due volte al giorno. Dobbiamo addressare il problema prima del lancio."
      errors: [word-choice]
    - tutor: "Sì, dobbiamo affrontare il problema subito, prima che lo noti il cliente."
      recast: {text: "addressare il problema", fix: "affrontare il problema", tags: [word-choice]}
      goals: [problem]
    - learner: "Esatto. E chi deve attendere la riunione con il fornitore del server, giovedì?"
      errors: [false-friend]
    - tutor: "Deve partecipare alla riunione chi conosce meglio il sistema: tu e Marco, direi."
      recast: {text: "attendere la riunione", fix: "partecipare alla riunione", tags: [false-friend]}
    - learner: "Va bene. Propongo di passare a un server più potente: costa di più, ma è la soluzione più sicura."
    - tutor: "Sono d'accordo, ma serve l'approvazione del direttore. Mi prepari due righe con i costi?"
      goals: [proposal]
    - learner: "Certo. Saria meglio mandarle oggi, così le legge prima del fine settimana."
      errors: [conditional-form]
    - tutor: "«Saria»? Quella forma si trova in poesia o in qualche dialetto. In italiano standard?"
      prompt: {text: "Saria", tags: [conditional-form]}
    - learner: "Sarebbe meglio mandarle oggi, scusa."
    - tutor: "Esatto. Allora mandale entro le cinque. E il lancio resta fissato per il quindici?"
    - learner: "Sì, se il fornitore ci dà il nuovo server entro lunedì. Altrimenti dobbiamo posporre il lancio di una settimana."
      errors: [word-choice]
    - tutor: "Rinviare il lancio di una settimana non sarebbe la fine del mondo, purché avvisiamo il cliente per tempo."
      recast: {text: "posporre il lancio", fix: "Rinviare il lancio", tags: [word-choice]}
      goals: [deadline]
    - learner: "D'accordo. Ti tengo aggiornata dopo la chiamata di giovedì."
    - tutor: "Perfetto, buon lavoro!"

- scenario: film-libro
  level: C1
  persona: en-m-retired
  history: [false-friend]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Questo mese, più che leggere, ho visto il film tratto da un romanzo che amavo da giovane. È basato su eventi attuali, accaduti negli anni Sessanta."
      errors: [false-friend]
    - tutor: "Su eventi reali, quindi: una storia vera. E il film è all'altezza del romanzo?"
      recast: {text: "eventi attuali", fix: "eventi reali", tags: [false-friend]}
      goals: [summary]
    - learner: "Quasi. L'attrice protagonista ha dato una performance straordinaria."
      errors: [word-choice]
    - tutor: "Un'interpretazione straordinaria, addirittura? Allora devo vederlo. Che ruolo ha?"
      recast: {text: "una performance straordinaria", fix: "un'interpretazione straordinaria", tags: [word-choice]}
    - learner: "Fa una maestra di paese che si oppone a un sindaco corrotto."
    - tutor: "Che bel personaggio. E il sindaco com'è?"
    - learner: "Il sindaco è il vero villano: simpatico in pubblico, crudele in privato."
      errors: [false-friend]
    - tutor: "Il vero cattivo, insomma. I cattivi più riusciti sono proprio quelli simpatici! E la fotografia?"
      recast: {text: "il vero villano", fix: "il vero cattivo", tags: [false-friend]}
      goals: [characters]
    - learner: "La fotografia è magnifica, soprattutto nelle scene in campagna. Alcune scene violente, però, mi sono sembrate gratuite."
    - tutor: "Capisco, a volte il cinema calca la mano per impressionare. Nel complesso, che giudizio dai?"
    - learner: "Penso che il regista ha tradito un po' il libro, ma ha fatto un buon film."
      errors: [subjunctive-use]
    - tutor: "«Penso che il regista ha tradito»? Dopo «penso che», quale modo usiamo?"
      prompt: {text: "ha tradito", tags: [subjunctive-use]}
    - learner: "Penso che il regista abbia tradito un po' il libro, ma il film è buono."
    - tutor: "Esatto. Succede spesso, ed è quasi inevitabile. Lo consiglieresti?"
      goals: [opinion]
    - learner: "Sì, ma leggete prima il libro. E portate i fazzoletti: io ho pianto come una fontana."
    - tutor: "Se ha commosso te, allora dev'essere proprio toccante! Lo mettiamo in programma per il prossimo mese."
      goals: [recommend]

- scenario: cena-suoceri
  level: C2
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
    - learner: "Eccomi, in carne e ossa! Grazie per l'invito, la vostra casa è splendida."
    - tutor: "Troppo gentile. Mia moglie è ai fornelli da stamattina, quindi si prepari a mangiare per tre."
      goals: [compliment]
    - learner: "Allora devo pagare un complimento alla cuoca: questo risotto è squisito."
      errors: [word-choice]
    - tutor: "Può fare un complimento alla cuoca, ma a voce alta: è in cucina e ci tiene moltissimo."
      recast: {text: "pagare un complimento", fix: "fare un complimento", tags: [word-choice]}
    - learner: "Mi chiedevo se posso già darle del tu, o se è troppo presto. Non vorrei sembrare troppo familiare."
      errors: [false-friend]
    - tutor: "Troppo confidenziale, dice? Diamoci pure del tu, ma dopo il secondo bicchiere: è una tradizione di famiglia."
      recast: {text: "troppo familiare", fix: "troppo confidenziale", tags: [false-friend]}
      goals: [tu-lei]
    - learner: "Allora brindiamo subito! Mia madre è una persona molto educata e mi ha insegnato ad aspettare sempre l'invito del padrone di casa."
    - tutor: "Sua madre ha fatto un ottimo lavoro. E Lei di che cosa si occupa, quando non conquista le nostre figlie?"
    - learner: "Lavoro nel marketing di un'azienda di cosmetici. Il mese scorso abbiamo rilasciato una nuova linea per la pelle sensibile."
      errors: [false-friend]
    - tutor: "Avete lanciato una nuova linea? Mia moglie sarà felicissima di provarla, gratuitamente s'intende."
      recast: {text: "rilasciato", fix: "lanciato", tags: [false-friend]}
      goals: [background]
    - learner: "Glie la porto volentieri la prossima volta!"
      errors: [combined-pronouns]
    - tutor: "«Glie la porto»? Quei due pronomi, così separati, non stanno bene insieme: come si uniscono?"
      prompt: {text: "Glie la porto", tags: [combined-pronouns]}
    - learner: "Ah, sì: gliela porto volentieri la prossima volta."
    - tutor: "Ecco, ha appena ammesso che ci sarà una prossima volta. Ottimo segno."
    - learner: "Che ironia sottile, la sua! Comincio a capire da chi ha preso sua figlia."
    - tutor: "Lo prendo come un complimento. Benvenuta in famiglia, allora: e adesso, il tiramisù."
      goals: [irony]

- scenario: condoglianze
  level: C2
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Grazie di essere venuta, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
    - learner: "Ci mancherebbe. Le porgo le mie più sentite condoglianze, a nome mio e di tutto l'ufficio."
    - tutor: "Grazie. Sapere che mi siete vicini mi conforta più di quanto immagini."
      goals: [condolences]
    - learner: "Suo padre era molto querido da tutti noi: ogni volta che veniva a prenderla, portava i cioccolatini alla segreteria."
      errors: [word-choice]
    - tutor: "Era molto amato, sì. Quei cioccolatini erano il suo modo di ringraziare tutti, anche chi non conosceva."
      recast: {text: "molto querido", fix: "molto amato", tags: [word-choice]}
      goals: [memory]
    - learner: "Una volta mi ha raccontato dei suoi anni in Spagna: parlava ancora un po' di castigliano, con un accento buffissimo."
    - tutor: "Sì, aveva lavorato due anni a Valencia, e ne parlava sempre come del periodo più felice della sua vita."
    - learner: "Per il lavoro, se vuole, posso occuparmi io dei trámites con l'ufficio del personale."
      errors: [word-choice]
    - tutor: "Se potesse occuparsi lei delle pratiche con l'ufficio del personale, mi toglierebbe un grosso peso."
      recast: {text: "dei trámites", fix: "delle pratiche", tags: [word-choice]}
      goals: [offer-help]
    - learner: "Certo. E non si preoccupa di niente: prenda tutto il tempo che le serve."
      errors: [imperative-form]
    - tutor: "«Non si preoccupa»? È un invito gentile, quasi un ordine: con il «lei», che forma usiamo?"
      prompt: {text: "non si preoccupa", tags: [imperative-form]}
    - learner: "Mi scusi: non si preoccupi di niente, prenda tutto il tempo che le serve."
    - tutor: "Grazie, davvero. Lei è sempre stata una collega preziosa."
    - learner: "Adesso la lascio riposare. Domani, se le fa piacere, posso lasciarmi cadere da lei con qualcosa da mangiare."
      errors: [word-choice]
    - tutor: "Se vuole fare un salto domani, mi farà piacere. Grazie ancora, di cuore."
      recast: {text: "lasciarmi cadere", fix: "fare un salto", tags: [word-choice]}
      goals: [leave]
    - learner: "A domani, allora. Un abbraccio."
    - tutor: "A domani. E grazie per le pratiche: me ne ricorderò."

- scenario: traduzione-sfumature
  level: C2
  persona: en-f-student
  history: [false-friend]
  turns:
    - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
    - learner: "Lo so, mi sono presa alcune libertà, ma volevo una resa più fluente dell'originale."
      errors: [false-friend]
    - tutor: "Più scorrevole dell'originale? Ecco il problema: l'autore è volutamente spigoloso, e tu l'hai levigato."
      recast: {text: "più fluente", fix: "più scorrevole", tags: [false-friend]}
      goals: [problem]
    - learner: "Capisco. Ma una resa letterale suonerebbe goffa al lettore domestico."
      errors: [false-friend]
    - tutor: "Il lettore italiano non è uno sprovveduto: un po' di attrito lo regge benissimo."
      recast: {text: "lettore domestico", fix: "lettore italiano", tags: [false-friend]}
    - learner: "A pagina dodici, per esempio, ho tradotto «eventually» con «alla fine», non con «eventualmente», proprio per evitare il falso amico."
    - tutor: "E lì hai fatto benissimo. Il problema non sono i falsi amici, ma il tono."
      goals: [false-friend]
    - learner: "Allora quali opzioni ho? Potrei mantenere la sintassi spezzata e ammorbidire solo il lessico."
    - tutor: "Oppure il contrario: tenere il lessico ruvido e sciogliere un po' la sintassi. Dipende da che cosa conta di più per lui."
      goals: [options]
    - learner: "La mia scelta di ammorbidire è stata deliberata: credo che il pubblico italiano preferisce una prosa elegante."
      errors: [subjunctive-use]
    - tutor: "«Credo che il pubblico preferisce»? Proprio tu, così attenta alla forma: che modo ci vuole dopo «credo che»?"
      prompt: {text: "preferisce", tags: [subjunctive-use]}
    - learner: "Hai ragione: credo che il pubblico preferisca una prosa elegante. Ma forse sbaglio."
    - tutor: "Forse sì. Il pubblico preferisce ciò a cui lo abituiamo, e qui la responsabilità è nostra."
    - learner: "D'accordo, rifaccio il capitolo da scratch, conservando le asperità dell'autore."
      errors: [word-choice]
    - tutor: "Non serve rifarlo da zero: basta togliere la vernice che ci hai steso sopra. Mandamelo lunedì."
      recast: {text: "da scratch", fix: "da zero", tags: [word-choice]}
      goals: [decide]
    - learner: "Va bene, lunedì. Grazie per la franchezza, anche se brucia un po'."
    - tutor: "Brucia perché sei brava. Se fossi mediocre, non perderei tempo a dirtelo."

- scenario: seminario-etica
  level: C2
  persona: es-f-erasmus
  history: [false-friend]
  turns:
    - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
    - learner: "Prego, professore. Il mio argomento centrale è che la macchina carece di intenzionalità: esegue, ma non vuole."
      errors: [word-choice]
    - tutor: "La macchina è priva di intenzionalità, dice. Ma come fa a esserne così certa, se non sappiamo definirla nemmeno negli esseri umani?"
      recast: {text: "carece di", fix: "è priva di", tags: [word-choice]}
      goals: [thesis]
    - learner: "Distinguo tra due livelli: la causalità, che la macchina possiede, e l'imputabilità, che presuppone una coscienza."
    - tutor: "Distinzione elegante. Eppure un'azienda non ha coscienza, e la riteniamo comunque responsabile."
      goals: [distinguish]
    - learner: "Il suo esempio è molto suggestivo, ma l'azienda risponde attraverso le persone che la compongono."
      errors: [false-friend]
    - tutor: "Molto stimolante, spero, più che evocativo! Ma allora la macchina risponderebbe attraverso chi l'ha progettata?"
      recast: {text: "molto suggestivo", fix: "molto stimolante", tags: [false-friend]}
      goals: [objection]
    - learner: "Esattamente. Se una macchina avrebbe una coscienza, il discorso cambierebbe; ma non è così."
      errors: [hypothetical]
    - tutor: "«Se una macchina avrebbe»? In un seminario di filosofia, quel periodo ipotetico non passa inosservato."
      prompt: {text: "avrebbe una coscienza", tags: [hypothetical]}
    - learner: "Mi correggo: se una macchina avesse una coscienza, il discorso cambierebbe."
    - tutor: "Così va meglio. E ammetto che, allo stato attuale, nessuna macchina ce l'ha, o almeno non ne abbiamo prova."
    - learner: "Concedo anch'io che il confine è sfumato. È un'obviedad che la tecnologia corre più veloce dell'etica."
      errors: [word-choice]
    - tutor: "È un'ovvietà, certo, ma le ovvietà sono spesso le più difficili da prendere sul serio."
      recast: {text: "un'obviedad", fix: "un'ovvietà", tags: [word-choice]}
      goals: [concede]
    - learner: "In conclusione, sostengo che oggi la responsabilità resti umana, e che la legge debba seguire chi progetta e chi usa."
    - tutor: "Una conclusione prudente e ben argomentata. Per oggi le do ragione, ma solo per oggi."
      goals: [conclude]

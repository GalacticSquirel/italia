    - learner: "Perfetto. Se il proprietario accetta tutto, firmo la settimana prossima."
    - tutor: "Allora ci risentiamo domani, appena ho la sua risposta."

- scenario: medico-specialista
  # facts: a giorni alterni sente il cuore saltare un battito, soprattutto la sera da sdraiato, non sotto sforzo; almeno cinque caffè al giorno, lavora in uno studio legale; nessuno in famiglia con problemi di cuore; esami: extrasistoli, di solito innocue; holter di 24 ore prescritto oggi, si può fare la settimana prossima; per ora nessun farmaco, caffè ridotto a due al giorno; se l'holter mostrasse molte extrasistoli, betabloccante a basso dosaggio; possibili stanchezza e mani fredde all'inizio, di solito passano in qualche settimana
  level: C1
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
    - learner: "Diciamo a fasi alterne. Ci sono giorni in cui sto benissimo, e altri in cui sento il cuore che salta un battito, soprattutto la sera, quando sono sdraiato."
    - tutor: "Le succede anche sotto sforzo, per esempio salendo le scale?"
      goals: [symptoms]
    - learner: "No, curiosamente sotto sforzo non me ne accorgo mai. Succede piuttosto quando sono a riposo, o dopo aver bevuto parecchi caffè."
    - tutor: "Quanti caffè beve, in media? E in famiglia c'è qualcuno con problemi di cuore?"
    - learner: "Almeno cinque al giorno: lavoro in uno studio legale, e senza caffè non funziono. In famiglia, invece, nessuno ha mai sofferto di cuore."
    - tutor: "Bene saperlo. Dagli esami risultano delle extrasistoli, cioè battiti in più, che nella maggior parte dei casi sono innocui."
      goals: [history]
      new: [{lemma: extrasistole, gloss: extra heartbeat}]
    # decoy: «affatto» is correct; only «conviene che facessi» is wrong
    - learner: "Innocui nel senso che non devo preoccuparmi affatto? O conviene che facessi altri accertamenti?"
      errors: [subjunctive-use]
    - tutor: "Non sono pericolose, ma vorrei vederci chiaro con un holter di ventiquattro ore. Ma «conviene che facessi»? «Conviene» è al presente: il congiuntivo deve seguirlo."
      prompt: {text: "conviene che facessi", tags: [subjunctive-use]}
      new: [{lemma: holter, gloss: 24-hour heart monitor}]
    - learner: "Conviene che facessi l'holter, allora."
      errors: [subjunctive-use]
    - tutor: "«Conviene che faccia l'holter?» Sì: glielo prescrivo oggi, e può farlo già la settimana prossima."
      goals: [understand]
      recast: {text: "Conviene che facessi", fix: "Conviene che faccia", tags: [subjunctive-use]}
    - learner: "E nel frattempo devo prendere qualche farmaci?"
      errors: [noun-number]
    - tutor: "Per ora le chiedo soprattutto di ridurre il caffè a due al giorno. Ma «qualche farmaci»? Dopo «qualche», il nome resta al singolare."
      prompt: {text: "qualche farmaci", tags: [noun-number]}
    - learner: "Qualche farmaco, intendevo. Quindi per ora nessuno?"
    - tutor: "Esatto, nessuno per ora. Se l'esame mostrasse molte extrasistoli, le prescriverei un betabloccante a basso dosaggio."
      new: [{lemma: extrasistole, gloss: extra heartbeat}, {lemma: betabloccante, gloss: beta blocker}, {lemma: dosaggio, gloss: dose}]
    - learner: "Due caffè al giorno sarà durissimo, ma ci proverò. Il betabloccante, se dovessi prenderlo, che effetti collaterali ha?"
    - tutor: "Può dare un po' di stanchezza o le mani fredde, soprattutto all'inizio; di solito passano in qualche settimana."
      goals: [treatment]
    # near-miss: «esaustiva» is a correct, slightly formal word for «thorough»
    - learner: "D'accordo. Allora prenoto l'holter e la ricontatto quando avrò i risultati. Grazie, è stata molto esaustiva."
    - tutor: "Si figuri. E non si spaventi se sente un battito strano: nel suo caso il cuore è sano."

# Set r-clue-answer, file 7 (C1): a formal complaint at the town hall, a supplier's price rise, a
# hurt colleague, a project pitch, registering residence with an expired permit, a parking-lot
# scrape, renegotiating a flat and a cardiology follow-up. Correct «eventualmente», «attualmente»,
# «qualora», «recedere», «esaustiva» and correct imperfect subjunctives are left alone; the clue
# names the conjunction or verb that governs the real error.
- scenario: reclamo-comune
  # facts: cantiere in via Garibaldi davanti a casa; lavori iniziati tre mesi fa, previsti sei settimane; rumore dalle sette anche il sabato; passo carraio bloccato senza avviso; terza segnalazione senza risposta; i tempi li gestisce l'ufficio tecnico; reclamo formale protocollato, risposta scritta di norma entro trenta giorni; poi sollecito con il numero di protocollo o difensore civico; foto e email precedenti allegate; data del sopralluogo non garantita; protocollo numero 18342 con la data di oggi, anche sulla ricevuta
  level: C1
  persona: en-f-professional
  history: [passive]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Vorrei presentare un reclamo per il cantiere in via Garibaldi, proprio davanti a casa mia. I lavori sono iniziati tre mesi fa e sarebbero dovuti durare sei settimane."
    - tutor: "Capisco il disagio. Oltre alla durata, che cosa le crea problemi, esattamente?"
    # decoy: «senza che nessuno ci avvisasse» is a correct subjunctive; only «è venuto bloccato» is wrong
    - learner: "Il rumore comincia alle sette, anche il sabato, e il passo carraio è venuto bloccato senza che nessuno ci avvisasse."
      errors: [passive]
    - tutor: "«È venuto bloccato»? Il passivo con «venire» si usa solo nei tempi semplici, e qui il tempo è composto."
      prompt: {text: "è venuto bloccato", tags: [passive]}
    - learner: "Il passo carraio è stato bloccato senza che nessuno ci avvisasse, ecco."
    - tutor: "Esatto, e la ringrazio della precisione. I tempi dei lavori, però, li gestisce l'ufficio tecnico: io posso inoltrare la segnalazione."
      goals: [describe]
    - learner: "Mi scusi, ma è la terza segnalazione che faccio, e finora nessuno mi ha risposto. Non vorrei che anche questa finisse in un cassetto."
    - tutor: "Ha ragione a insistere. Allora le consiglio un reclamo formale: viene protocollato, e l'ufficio è tenuto a rispondere per iscritto."
      goals: [insist]
    - learner: "Entro quanto tempo sono obbligati a rispondermi? E se non lo fanno, che strumenti ho a disposizione?"
    - tutor: "Di norma l'amministrazione deve rispondere entro trenta giorni. Se non succede, può mandare un sollecito citando il numero di protocollo, oppure rivolgersi al difensore civico."
      goals: [rights]
    - learner: "Va bene, lo presento adesso. Ho portato le foto del cantiere e le email precedenti: hai bisogno anche di quelle?"
      errors: [register]
    - tutor: "Sì, le alleghi pure al reclamo. Ma «hai bisogno»? Finora mi ha dato del Lei: qui è passata al «tu»."
      prompt: {text: "hai bisogno", tags: [register]}
    - learner: "Ha bisogno anche di quelle, scusi?"
    - tutor: "Sì, tutte: così il reclamo è completo. Ecco il modulo, lo compili pure qui."
    # decoy: «vorrei che il tecnico venisse» is a correct imperfect subjunctive; only «prima che i lavori ricominciano» is wrong
    - learner: "Ecco fatto. Vorrei che il tecnico venisse a fare un sopralluogo prima che i lavori ricominciano, lunedì."
      errors: [subjunctive-use]
    - tutor: "«Prima che i lavori ricominciano»? Dopo «prima che», il verbo cambia modo."
      prompt: {text: "prima che i lavori ricominciano", tags: [subjunctive-use]}
    - learner: "Prima che i lavori ricomincino, lunedì."
    - tutor: "Esatto. Lo scrivo nella richiesta, ma la data non posso garantirgliela: dipende dall'ufficio tecnico."
    - learner: "Capisco. Almeno mi può dare il numero di protocollo, così posso seguire la pratica?"
    - tutor: "Certo: è il 18342, con la data di oggi. Lo trova anche sulla ricevuta."
      goals: [commitment]

- scenario: trattativa-fornitore
  # facts: aumento del listino del dodici per cento; la farina costa al fornitore quasi il venti per cento in più; rapporto di otto anni, pagamenti sempre puntuali; nessun preavviso, il fornitore si scusa; controproposta del cliente: sei per cento con ordini fissi ogni tre mesi; il fornitore offre l'otto per cento con contratto di dodici mesi e prezzo bloccato; consegne ogni due settimane senza costi aggiuntivi; attualmente consegne mensili; proposta di contratto per email oggi, valida una settimana
  level: C1
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per quello: un aumento del dodici per cento, così all'improvviso, per noi è difficile da sostenere."
    - tutor: "Lo capisco, ma a noi la farina costa quasi il venti per cento in più rispetto all'anno scorso. Una parte dell'aumento l'abbiamo già assorbita noi."
      goals: [problem]
    - learner: "Non lo metto in dubbio. Però lavoriamo insieme da otto anni e abbiamo sempre pagato puntualmente: mi sarei aspettato che ci avvisaste almeno qualche mese prima."
    - tutor: "Ha ragione, avremmo dovuto avvisarvi prima, e me ne scuso. Che cosa propone?"
      goals: [argue]
    # decoy: «Se l'aumento fosse» is correct; only «potremo» in the main clause is wrong
    - learner: "Se l'aumento fosse del sei per cento, potremo garantirvi ordini fissi ogni tre mesi."
      errors: [hypothetical]
    - tutor: "«Potremo garantirvi»? Con «se fosse», la frase principale non va al futuro."
      prompt: {text: "potremo garantirvi", tags: [hypothetical]}
    - learner: "Potremmo garantirvi ordini fissi ogni tre mesi, intendevo."
    - tutor: "Esatto. Un impegno trimestrale è interessante, ma al sei per cento non ci arriviamo: potrei scendere all'otto, con un contratto di dodici mesi."
      goals: [counteroffer]
    - learner: "All'otto, con dodici mesi... In quel caso il prezzo resterebbe bloccato per tutto l'anno, anche se la farina aumentasse ancora?"
    - tutor: "Sì, il prezzo resterebbe fisso per dodici mesi, qualunque cosa succeda sul mercato."
    # decoy: «attualmente» in its real meaning («at present») is correct; only «arrivano» after «vorrei che» is wrong
    - learner: "Mi sembra un compromesso accettabile. Però vorrei anche che le consegne arrivano ogni due settimane, e non una volta al mese, come attualmente."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che le consegne arrivano»? Dopo «vorrei che» serve il congiuntivo, e al tempo giusto."
      prompt: {text: "le consegne arrivano", tags: [subjunctive-use]}
    - learner: "Vorrei che le consegne arrivino ogni due settimane."
      errors: [subjunctive-use]
    - tutor: "«Vorrei che le consegne arrivassero ogni due settimane»: si può fare, e senza costi aggiuntivi."
      recast: {text: "le consegne arrivino", fix: "le consegne arrivassero", tags: [subjunctive-use]}
    - learner: "Benissimo. Allora riepilogo: aumento dell'otto per cento, prezzo bloccato per dodici mesi e consegne ogni due settimane. Me lo può confermare per iscritto?"
    - tutor: "Certo, le mando oggi stesso la proposta di contratto per email. E la ringrazio della franchezza."
      goals: [agreement]
    - learner: "Grazie a lei. Appena l'avrò letta, farò una decisione con il mio direttore."
      errors: [word-choice]
    - tutor: "«Prenderò una decisione con il mio direttore»: certo, con calma. La proposta resta valida per una settimana."
      recast: {text: "farò una decisione", fix: "prenderò una decisione", tags: [word-choice]}
    - learner: "Perfetto. Allora ci sentiamo entro la settimana."
    - tutor: "D'accordo. Buona giornata, e a presto."

- scenario: mediazione-colleghi
  # facts: ieri alla riunione Marco ha presentato l'analisi del cliente come se fosse solo sua; la collega ci ha lavorato tre settimane, anche di sera, e nessuno l'ha nominata; le slide erano sue tranne l'ultima; Marco ha parlato di «la mia analisi»; secondo il responsabile, Marco era sotto pressione perché il cliente l'aveva criticato la settimana scorsa; soluzione: alla prossima riunione la collega presenta la sua parte, il responsabile scrive al cliente chi ha fatto cosa, parla con Marco domani
  level: C1
  persona: en-m-heritage
  history: [participle-agreement]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, per favore. Mi dica con calma che cosa è successo: voglio capire bene."
    - tutor: "Marco ha presentato l'analisi del cliente come se fosse solo sua. Io ci ho lavorato tre settimane, anche di sera, e nessuno mi ha nominata."
    - learner: "Capisco perfettamente che ci sia rimasta male: se fosse successo a me, sarei arrabbiato anch'io."
    - tutor: "Grazie. Non cerco applausi, ma un minimo di riconoscimento sì."
      goals: [listen]
    # decoy: «le aveva fatte» agrees correctly in the same question; only «le aveva preparato» is wrong
    - learner: "Mi aiuti a chiarire un punto: le slide che ha mostrato le aveva preparato lei, o le aveva fatte Marco?"
      errors: [participle-agreement]
    - tutor: "Erano mie, tutte tranne l'ultima. Ma «le aveva preparato»? Subito dopo lei dice «le aveva fatte»: lo stesso accordo vale anche qui."
      prompt: {text: "le aveva preparato", tags: [participle-agreement]}
    - learner: "Le aveva preparate lei, quindi. E Marco ha detto esplicitamente che erano sue?"
    - tutor: "Non con queste parole: ha parlato di «la mia analisi». Ma il risultato è lo stesso."
      goals: [clarify]
    - learner: "Non lo dico per giustificarlo, ma attualmente Marco era sotto pressione: il cliente l'aveva criticato la settimana scorsa."
      errors: [false-friend]
    - tutor: "In realtà era sotto pressione, dice? Può darsi. Ma allora perché non me ne ha parlato prima della riunione?"
      goals: [perspective]
      recast: {text: "attualmente", fix: "In realtà", tags: [false-friend]}
    - learner: "È una domanda giusta, e gliela farò io stesso. Propongo così: alla prossima riunione presenta lei la parte dell'analisi che ha curato, e io scriverò al cliente specificando chi ha fatto cosa."
    - tutor: "Mi sembra corretto. E con Marco come pensa di fare?"
      goals: [solution]
    # decoy: «Vorrei che discutessimo» is a correct subjunctive; only «in modo che non si ripete» is wrong
    - learner: "Parlerò con lui domani. Vorrei che in futuro discutessimo prima chi presenta che cosa, in modo che non si ripete una situazione del genere."
      errors: [subjunctive-use]
    - tutor: "«In modo che non si ripete»? «In modo che», quando indica uno scopo, regge un altro modo."
      prompt: {text: "in modo che non si ripete", tags: [subjunctive-use]}
    - learner: "In modo che non si ripeta più una situazione del genere."
    - tutor: "Esatto. Se fa così, per me la questione è chiusa."
    - learner: "La ringrazio di essere venuta a parlarmene subito: è proprio quello che spero da tutti."
    - tutor: "Grazie a lei per avermi ascoltata."

- scenario: presentazione-progetto
  # facts: app per prenotare i prodotti e ritirarli in negozio senza fila; stima: vendite più dieci per cento nel primo anno, meno tempo alla cassa; dati di due concorrenti; costo complessivo 120.000 euro, di cui 80.000 per lo sviluppo; prova in tre negozi per tre mesi; agenzia esterna con manutenzione per il primo anno; qualora i risultati non fossero buoni, stop senza costi; preventivo entro venerdì per il consiglio del 15; se approvato, partenza a gennaio
  level: C1
  persona: en-m-traveller
  history: [passive]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Le basta un minuto. Vogliamo creare un'app con cui i clienti possano prenotare i prodotti e ritirarli in negozio, senza fare la fila."
    - tutor: "Di app ne abbiamo già fin troppe. Che cosa ci guadagniamo, concretamente?"
      goals: [pitch]
    - learner: "Secondo le nostre stime, le vendite aumenterebbero del dieci per cento nel primo anno, e il personale perderebbe meno tempo alla cassa."
    - tutor: "Stime basate su che cosa? E quanto costa?"
    # decoy: «di cui» is a correct relative; only «vanno spese» for the euros is wrong
    - learner: "Sui dati di due concorrenti che l'hanno già introdotta. Il costo complessivo è di centoventimila euro, di cui ottantamila vanno spese per lo sviluppo."
      errors: [passive]
    - tutor: "«Ottantamila vanno spese»? Il soggetto sono gli euro: guardi la fine del participio."
      prompt: {text: "vanno spese", tags: [passive]}
    - learner: "Ottantamila euro vanno spese, sì, solo per lo sviluppo."
      errors: [passive]
    - tutor: "Ottantamila vanno spesi solo per lo sviluppo? È una cifra importante, per un'azienda come la nostra."
      goals: [benefits]
      recast: {text: "vanno spese", fix: "vanno spesi", tags: [passive]}
    - learner: "Lo so, ma non dobbiamo spenderli tutti subito: potremmo partire con un pilota in tre negozi e decidere dopo tre mesi."
      errors: [word-choice]
    - tutor: "Un progetto pilota in tre negozi riduce la spesa, d'accordo. Il rischio però resta: in azienda non abbiamo nessuno che sappia gestire un'app."
      recast: {text: "un pilota", fix: "Un progetto pilota", tags: [word-choice]}
    - learner: "Per questo lavoreremo con un'agenzia esterna, che si occuperà anche della manutenzione per il primo anno. Qualora i risultati non fossero buoni, potremmo fermarci senza ulteriori costi."
    - tutor: "Questo mi convince un po' di più. Che cosa propone come primo passo?"
      goals: [objection]
    - learner: "Le proporrei di approvare la prova in tre negozi. Preferisce che le presento un preventivo dettagliato già la settimana prossima?"
      errors: [subjunctive-use]
    - tutor: "Sì, mi serve entro venerdì, così lo porto al consiglio del quindici. Ma «preferisce che le presento»? Dopo «preferire che», il verbo cambia modo."
      prompt: {text: "preferisce che le presento", tags: [subjunctive-use]}
    - learner: "Preferisce che le presenti il preventivo entro venerdì, allora. Glielo mando senz'altro."
    - tutor: "Esatto. Venerdì, dunque."
      goals: [next-steps]
    - learner: "Se il consiglio lo approva, lei crede che potremo cominciare già a gennaio?"
    - tutor: "Se lo approva, sì: gennaio è realistico. Ora però devo proprio andare."

- scenario: burocrazia-residenza
  # facts: trasferita da Milano il mese scorso, cittadina americana; servono documento, contratto d'affitto e permesso di soggiorno; permesso scaduto a settembre, rinnovo chiesto, ricevuta portata con copia del vecchio permesso; con la ricevuta si procede; contratto intestato a lei e al compagno, che è ancora a Milano; se sposta la residenza solo lei, il compagno non deve venire; vigili entro quarantacinque giorni; certificato allo sportello sette, senza numero, entro due giorni lavorativi
  level: C1
  persona: en-f-student
  history: [subjunctive-use]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Mi sono trasferita qui da Milano il mese scorso, e dovrei spostare la residenza."
    - tutor: "Bene. Mi servono un documento e il contratto d'affitto; se non è cittadina europea, anche il permesso di soggiorno."
      goals: [request]
    - learner: "Sono americana, quindi sì. Il problema è che il permesso mi è scaduto a settembre: ho chiesto il rinnovo, ma non me l'hanno ancora dato."
    - tutor: "Ha con sé la ricevuta della richiesta di rinnovo?"
      goals: [documents]
    - learner: "Sì, ce l'ho. Non sapevo se fosse valida anche qui, per questo l'ho portata insieme a una copia del vecchio permesso."
    - tutor: "Ha fatto bene: con la ricevuta possiamo procedere. Il contratto è intestato a lei?"
    # decoy: «il quale» is a correct, formal relative; only «viene» after «bisognerà che» is wrong
    - learner: "Sì, a me e al mio compagno, il quale però è ancora a Milano per lavoro. Bisognerà che anche lui viene qui?"
      errors: [subjunctive-use]
    - tutor: "Se sposta la residenza solo lei, no. Ma «bisognerà che anche lui viene»? Dopo «bisognerà che», il verbo cambia modo."
      prompt: {text: "anche lui viene", tags: [subjunctive-use]}
    - learner: "Bisognerà che anche lui venisse qui, intendevo."
      errors: [subjunctive-use]
    - tutor: "«Bisognerà che anche lui venga?» No, non è necessario: la residenza, per ora, la sposta solo lei."
      goals: [problem]
      recast: {text: "anche lui venisse", fix: "anche lui venga", tags: [subjunctive-use]}
    - learner: "Benissimo. E i tempi? Mi serve il certificato per iscrivermi in un corso entro fine mese."
      errors: [preposition]
    - tutor: "I vigili passano entro quarantacinque giorni, ma il certificato può chiederlo già fra due giorni lavorativi. Però «iscrivermi in un corso»? Con «iscriversi», per un corso si usa un'altra preposizione."
      prompt: {text: "iscrivermi in un corso", tags: [preposition]}
    - learner: "Iscrivermi a un corso, sì, all'università. Devo prendere di nuovo il numero, o vado direttamente allo sportello?"
    - tutor: "Esatto. Per i certificati c'è lo sportello sette, senza numero. Ecco la ricevuta della sua domanda."
      goals: [next]
    - learner: "Grazie, è stata molto disponibile. È stato tutto molto più semplice di quanto pensassi."
    - tutor: "Mi fa piacere. Buona giornata, e benvenuta in città!"

- scenario: assicurazione-sinistro
  # facts: sabato, parcheggio del supermercato; fiancata rigata e specchietto rotto; biglietto con un numero sul parabrezza; la signora al telefono ha ammesso di averlo urtato ma ora si rifiuta di firmare e dice che il danno c'era già; testimone: una cassiera che fumava fuori in pausa, ha lasciato il nome; senza constatazione: denuncia di sinistro con dichiarazione della testimone; nella denuncia data, ora, luogo, targa, dati della testimone, biglietto e foto; la dichiarazione può arrivare per email firmata; se le prove confermano, paga l'assicurazione della signora, senza franchigia; perito entro una settimana
  level: C1
  persona: en-m-retired
  history: [preposition]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Sabato ho lasciato la macchina nel parcheggio del supermercato e, quando sono uscito, la fiancata era rigata e lo specchietto rotto. Sul parabrezza c'era un biglietto con un numero di telefono."
    - tutor: "Almeno ha lasciato un recapito, cosa piuttosto rara. Ha chiamato quel numero?"
      goals: [what]
    # decoy: «ha ammesso di avermi urtato» is correct; only «si rifiuta a firmare» is wrong
    - learner: "Sì, e la signora ha ammesso di avermi urtato, ma adesso si rifiuta a firmare la constatazione: dice che il danno c'era già."
      errors: [preposition]
    - tutor: "«Si rifiuta a firmare»? Con «rifiutarsi», davanti all'infinito, la preposizione è un'altra."
      prompt: {text: "si rifiuta a firmare", tags: [preposition]}
    - learner: "Si rifiuta di firmare, sì, anche se al telefono era stata chiarissima."
    - tutor: "Esatto. Lei è sicuro che il danno l'abbia fatto proprio lei?"
    - learner: "Sicurissimo: una cassiera che fumava fuori, durante la pausa, ha visto tutto e mi ha lasciato il suo nome. E poi, se non fosse stata lei, perché mi avrebbe lasciato il biglietto?"
    - tutor: "Ottima osservazione. Senza constatazione firmata, però, dovremo procedere con una denuncia di sinistro e la dichiarazione della testimone."
      goals: [responsibility]
    - learner: "Che cosa devo indicare nella denuncia? Ho la targa della signora, il biglietto e alcune foto."
    - tutor: "Indichi data, ora e luogo, la targa e i dati della testimone, e alleghi il biglietto e le foto: sono prove preziose."
      goals: [documents]
    # decoy: «rilasciare la sua dichiarazione» is a correct formal collocation; only «purché non deve» is wrong
    - learner: "D'accordo. La testimone è disposta a rilasciare la sua dichiarazione, purché non deve venire di persona in ufficio."
      errors: [subjunctive-use]
    - tutor: "«Purché non deve venire»? Dopo «purché», il verbo cambia modo."
      prompt: {text: "purché non deve venire", tags: [subjunctive-use]}
    - learner: "Purché non dovesse venire di persona, appunto."
      errors: [subjunctive-use]
    - tutor: "Purché non debba venire di persona: nessun problema, la dichiarazione può mandarla per email, firmata."
      recast: {text: "Purché non dovesse venire", fix: "Purché non debba venire", tags: [subjunctive-use]}
    - learner: "Perfetto. E dovrò pagare la franchigia, se la signora continua a negare?"
    - tutor: "No: se le prove confermano la sua versione, il danno lo paga l'assicurazione della signora, senza franchigia. Il perito la contatterà entro una settimana."
      goals: [next]
    - learner: "Bene. Allora compilo la denuncia stasera e gliela mando domattina, insieme alle foto."
    - tutor: "Perfetto. Se ha dubbi mentre la compila, mi chiami pure a questo numero."

- scenario: trattativa-affitto
  # facts: cucina da rinnovare, elettrodomestici vecchi; canone 1.400 euro, il proprietario è rigido sul prezzo; il proprietario cambierebbe lavatrice e frigorifero e ridipingerebbe le pareti; cedolare secca: canone non aggiornato ogni anno con l'inflazione; quattro più quattro con recesso con tre mesi di preavviso dopo il primo anno; provvigione dieci per cento del canone di un anno, non trattabile; proposta scritta entro domani; firma la settimana prossima se il proprietario accetta
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto, anche se devo ammettere che la cucina andrebbe rinnovata: gli elettrodomestici avranno vent'anni."
    - tutor: "Ha ragione, la cucina è un po' datata. Il proprietario però chiede millequattrocento euro, e sul prezzo è piuttosto rigido."
      goals: [interest]
    - learner: "Allora proviamo un'altra strada: se il canone resta quello, il proprietario sarebbe disposto a cambiare almeno la lavatrice e il frigorifero?"
    - tutor: "Credo di sì, me ne aveva già accennato. Potrebbe anche ridipingere le pareti prima del vostro ingresso."
      goals: [negotiate]
    - learner: "Sarebbe perfetto. Un'altra cosa: nell'annuncio c'era scritto «cedolare secca». In pratica, che cosa comporta per me?"
    - tutor: "Per lei è un vantaggio: con la cedolare secca il canone non viene aggiornato ogni anno in base all'inflazione."
    # decoy: «recedere» is a correct technical verb; only «nel caso mi trasferiscono» is wrong
    - learner: "Bene. Per la durata preferirei un quattro più quattro, con la possibilità di recedere con tre mesi di preavviso, nel caso mi trasferiscono per lavoro."
      errors: [subjunctive-use]
    - tutor: "«Nel caso mi trasferiscono»? «Nel caso» introduce un'ipotesi e regge il congiuntivo."

    - learner: "Nel caso mi trasferiscano per lavoro, certo."
    - tutor: "Esatto. Una clausola di recesso con tre mesi di preavviso, dopo il primo anno, si può inserire: il proprietario di solito la accetta."
      goals: [conditions]
    - learner: "E la provvigione dell'agenzia? Spero che sia trattabile anch'essa."
    - tutor: "La provvigione è il dieci per cento del canone di un anno, e quella, purtroppo, non è trattabile."
    # decoy: the colloquial «ci sto» is correct; only the extra «ne» is wrong
    - learner: "È parecchio, ma se il proprietario mi garantisce gli elettrodomestici e le pareti nuove, ci sto. Me ne può mandare una proposta scritta?"

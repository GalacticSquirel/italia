# Set r-clue-answer, file 8 (C1): a podcast interview, a book club, a news story on short lets,
# a radio phone-in on mass tourism, artificial intelligence over coffee, a bad day told with
# idioms, a forgotten birthday cake and a promotion talk. Idioms, «gli» for «a loro», «ne» and
# «ci» used correctly stay untouched; clues point at the conjunction, the auxiliary or the
# fixed expression that is really wrong.
- scenario: intervista-podcast
  # facts: arrivata dodici anni fa con una borsa di studio per un dottorato a Padova, pensava di restare un anno; l'ha colpita che a pranzo si parlasse di cibo; critica: quasi due anni per il riconoscimento del titolo, senza poter insegnare; nel frattempo traduzioni e lezioni private di spagnolo; il conduttore a vent'anni ha vissuto sei mesi a Dublino; consiglio: armarsi di pazienza e imparare la lingua
  level: C1
  persona: es-f-teacher
  history: [word-order]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Grazie a te! Sono arrivata dodici anni fa con una borsa di studio per un dottorato a Padova. Pensavo di restare un anno, e invece eccomi qui."
    - tutor: "Un classico! E che cosa ti ha colpito di più, i primi tempi?"
      goals: [story]
    # decoy: «parlassero» is a correct subjunctive after «mi ha colpito che»; only «Da noi si fa anche» is wrong
    - learner: "Mi ha colpito che a pranzo tutti parlassero di cibo... mentre mangiavano! Da noi si fa anche, ma non così tanto."
      errors: [word-order]
    - tutor: "«Da noi si fa anche»? «Anche» deve stare vicino alla cosa a cui si riferisce, cioè «da noi»."
      prompt: {text: "Da noi si fa anche", tags: [word-order]}
    - learner: "Anche da noi si fa, ma non così tanto."
    - tutor: "Esatto! Noi a pranzo parliamo già della cena. E c'è qualcosa che invece ti dà fastidio, dell'Italia?"
      goals: [culture-shock]
    - learner: "Se devo essere sincera, la lentezza della burocrazia. Per il riconoscimento del mio titolo ho aspettato quasi due anni, e nel frattempo non potevo insegnare."
    - tutor: "Due anni! E come hai fatto, nel frattempo?"
      goals: [critique]
    - learner: "Ho fatto traduzioni e ho dato lezioni private di spagnolo. Col senno di poi è stata una fortuna: ho conosciuto persone di cui oggi sono molto amica."
    - tutor: "Il lato positivo della burocrazia, chi l'avrebbe detto!"
    - learner: "Posso farti io una domanda? Tu hai mai pensato di vivere all'estero?"
    - tutor: "Sì, a vent'anni sono stato sei mesi a Dublino, ma la pioggia mi ha sconfitto! Tu che consiglio daresti a chi vuole trasferirsi qui?"
    - learner: "Gli direi di armarsi con pazienza e di imparare bene la lingua, perché è l'unico modo per sentirsi a casa."
      errors: [preposition]
    - tutor: "«Armarsi con pazienza»? È un'espressione fissa, e la preposizione non è «con»."
      prompt: {text: "armarsi con pazienza", tags: [preposition]}
    - learner: "Gli direi di armarsi in pazienza, allora."
      errors: [preposition]
    - tutor: "Armarsi di pazienza, sì: un consiglio d'oro, soprattutto davanti agli sportelli!"
      goals: [advice]
      recast: {text: "armarsi in pazienza", fix: "Armarsi di pazienza", tags: [preposition]}
    - learner: "Esatto! E soprattutto non perdere il senso dell'umorismo."
    - tutor: "Parole sante. Grazie mille, è stato un piacere averti qui."

- scenario: club-lettura
  # facts: il membro storico ha letto il romanzo in tre sere; per il learner le prime cento pagine sono interminabili, poi la storia decolla; narratore molto descrittivo; la lentezza serve a far sentire chiusi in casa con Elena; Elena scopre la lettera del marito e fa finta di niente per tre capitoli; stile elegante, dialoghi vivi; consigliato a chi ha pazienza e ama le storie di famiglia; alla moglie del learner piacciono i gialli con ritmo; il membro le presterà il giallo in lista per il mese prossimo; il club si vede il primo giovedì del mese
  level: C1
  persona: en-m-retired
  history: [hypothetical]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Ce l'ho fatta, sì, ma con fatica. Le prime cento pagine mi sono sembrate interminabili; poi, per fortuna, la storia decolla."
    - tutor: "Interminabili? Per me erano la parte migliore! Che cosa non ti ha convinto?"
      goals: [impression]
    # decoy: «per molto tempo non succede niente» is a correct double negative; only «entrava» is wrong
    - learner: "Il narratore descrive ogni dettaglio della casa, ma per molto tempo non succede niente. Avrei preferito che l'autrice entrava subito nel vivo."
      errors: [subjunctive-use]
    - tutor: "«Avrei preferito che l'autrice entrava»? Dopo «avrei preferito che» serve un congiuntivo, e di un tempo passato."
      prompt: {text: "l'autrice entrava", tags: [subjunctive-use]}
    - learner: "Avrei preferito che entrasse subito nel vivo, ecco."
    - tutor: "Capisco, ma quella lentezza serve a farci sentire chiusi in casa con lei. E di Elena, che idea ti sei fatto?"
    - learner: "Elena mi ha fatto arrabbiare. Quando scopre la lettera del marito, invece di affrontarlo, fa finta di niente per tre capitoli."
    - tutor: "Ma è proprio questo il punto! Tu, al suo posto, che cosa avresti fatto?"
      goals: [character]
    # decoy: «gliene avrei parlato» is a correct combined pronoun; only «Se ero in lei» is wrong
    - learner: "Se ero in lei, gliene avrei parlato subito."
      errors: [hypothetical]
    - tutor: "«Se ero in lei»? Con «avrei parlato», nella parte con «se» serve un altro modo."
      prompt: {text: "Se ero in lei", tags: [hypothetical]}
    - learner: "Se fossi in lei, gliene avrei parlato subito."
    - tutor: "Esatto. Ma Elena ha paura di perdere tutto. E lo stile, ti è piaciuto?"
    - learner: "Lo stile è elegante, quasi troppo: certe frasi le ho dovute rileggere due volte. I dialoghi però sono vivi, lo ammetto."
    - tutor: "Su questo siamo d'accordo. A chi lo consiglieresti, allora?"
      goals: [style]
    # decoy: «Lo consiglierei a chi ha pazienza» is correct; only «gli» for the wife is wrong
    - learner: "Lo consiglierei a chi ha pazienza e ama le storie di famiglia. A mia moglie no, invece: gli piacciono i gialli con molto ritmo."
      errors: [object-pronoun]
    - tutor: "«A mia moglie... gli piacciono»? Parli di tua moglie: quel pronome non va bene."
      prompt: {text: "gli piacciono", tags: [object-pronoun]}
    - learner: "Gli piacciono i gialli, sì, quelli veloci."
      errors: [object-pronoun]
    - tutor: "Le piacciono i gialli veloci? Allora il mese prossimo le presto io quello che abbiamo in lista."
      goals: [recommend]
      recast: {text: "Gli piacciono", fix: "Le piacciono", tags: [object-pronoun]}
    - learner: "Ottima idea, glielo dico stasera. Ci vediamo il primo giovedì del mese, come sempre?"
    - tutor: "Sì, il primo giovedì, come sempre: ci vediamo lì, con il giallo!"

- scenario: notizie-attualita
  # facts: il Comune vorrebbe limitare gli affitti brevi nel centro storico a novanta giorni l'anno, perché i residenti non trovano casa; il collega la trova una misura tardiva; il learner teme che senza controlli serva a poco; due articoli letti dal learner: uno di un quotidiano nazionale sui residenti, uno di un sito locale sui proprietari; il collega è scettico: in centro forse scenderanno un po', ma gli affitti brevi si sposteranno in periferia; appuntamento fra un anno per i dati
  level: C1
  persona: es-m-worker
  history: [auxiliary-choice]
  turns:
    - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
    - learner: "Sì, l'ho vista. In sintesi, il Comune vorrebbe limitare gli affitti brevi nel centro storico a novanta giorni l'anno, perché i residenti non trovano più casa."
    - tutor: "Esatto. E tu che ne pensi? A me sembra una misura un po' tardiva."
      goals: [summarise]
    # decoy: «Penso che sia» is correct; only «temo che non serve» is wrong
    - learner: "Penso che sia giusta in linea di principio, ma temo che non serve a molto senza controlli seri."
      errors: [subjunctive-use]
    - tutor: "«Temo che non serve»? Anche «temere che», come il tuo «penso che» di prima, vuole un altro modo."
      prompt: {text: "temo che non serve", tags: [subjunctive-use]}
    - learner: "Temo che non serva a molto, senza controlli seri."
    - tutor: "Controlli seri, appunto: e chi li fa? Hai notato come ne hanno parlato i giornali?"
      goals: [opinion]
    - learner: "Sì, ho letto due articoli molto diversi. Quello di un quotidiano nazionale insisteva sui residenti cacciati dal centro; quello di un sito locale dava voce soprattutto ai proprietari, che si sentono penalizzati."
    - tutor: "Lo stesso fatto, due racconti opposti. Secondo te, quale dei due era più onesto?"
      goals: [sources]
    # decoy: «gli facevano comodo», with «gli» for «a loro», is correct; only «Mi avrebbe piaciuto» is wrong
    - learner: "Nessuno dei due: entrambi hanno scelto le citazioni che gli facevano comodo. Mi avrebbe piaciuto leggere qualche dato in più."
      errors: [auxiliary-choice]
    - tutor: "«Mi avrebbe piaciuto»? Con «piacere», nei tempi composti, l'ausiliare non è «avere»."
      prompt: {text: "Mi avrebbe piaciuto", tags: [auxiliary-choice]}
    - learner: "Mi avrebbe piaciuto, sì, qualche numero vero."
      errors: [auxiliary-choice]
    - tutor: "«Mi sarebbe piaciuto leggere qualche dato in più»: è il problema di quasi tutti gli articoli, purtroppo."
      recast: {text: "Mi avrebbe piaciuto", fix: "Mi sarebbe piaciuto", tags: [auxiliary-choice]}
    - learner: "Tu che cosa pensi che succederà, se la proposta passa? Gli affitti scenderanno davvero?"
    - tutor: "Io sono scettico: in centro forse scenderanno un po', ma gli affitti brevi si sposteranno in periferia."
    - learner: "Può darsi. Oppure molti proprietari venderanno, e i prezzi delle case caleranno. In ogni caso ne riparleremo fra un anno, quando ci saranno i primi dati."
    - tutor: "Lo segno in agenda: fra un anno, un caffè e i dati!"
      goals: [consequences]

- scenario: turismo-di-massa
  # facts: Tom, inglese, a Venezia da quindici anni, contrario al ticket d'ingresso; nel suo quartiere in dieci anni hanno chiuso il fornaio, la ferramenta e il fruttivendolo, sostituiti da negozi per turisti; per lui il ticket non riporta i residenti; nessuno ha spiegato come verranno spesi i soldi; proposta: limitare grandi navi e pullman al giorno, incentivi a chi affitta ai residenti, pagati magari con i soldi del ticket; resterà a Venezia
  level: C1
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno, mi chiamo Tom, sono inglese ma vivo a Venezia da quindici anni. Sono contrario: il ticket rischia di trasformare la città in un museo a pagamento."
    - tutor: "Però, mi scusi, qualcosa bisogna pur fare. Che esempio concreto ci porta?"
      goals: [introduce]
    # decoy: «hanno chiuso», with avere for a shop closing, is correct; only «che i veneziani non ci entrano» is wrong
    - learner: "Nel mio quartiere, in dieci anni, hanno chiuso il fornaio, la ferramenta e il fruttivendolo. Adesso ci sono solo negozi per turisti, che i veneziani non ci entrano mai."
      errors: [relative-pronoun]
    - tutor: "«Negozi che i veneziani non ci entrano»? Quel «che» seguito da «ci» non è italiano standard: serve un relativo che dica il luogo."
      prompt: {text: "che i veneziani non ci entrano", tags: [relative-pronoun]}
    - learner: "Negozi in cui i veneziani non entrano mai. Il ticket non risolve questo problema."
    - tutor: "Esatto. Ma il ticket porta soldi al Comune, che potrebbe usarli proprio per i residenti. Non è così?"
      goals: [example]
    # decoy: «come verranno spesi» is a correct future passive; only «Anche se verrebbero spesi» is wrong
    - learner: "In teoria sì, ma finora nessuno ha spiegato come verranno spesi. Anche se verrebbero spesi bene, i turisti in giornata continuerebbero a venire."
      errors: [hypothetical]
    - tutor: "«Anche se verrebbero spesi»? Nell'ipotesi con «se», il condizionale va nell'altra parte della frase, non qui."
      prompt: {text: "Anche se verrebbero spesi", tags: [hypothetical]}
    - learner: "Anche se fossero spesi bene, i turisti continuerebbero a venire: qualche euro, per loro, non è niente."
    - tutor: "Esatto. Allora che cosa propone, in alternativa?"
      goals: [rebut]
    - learner: "Proporrei di limitare il numero di grandi navi e di pullman al giorno, e di dare incentivi a chi affitta casa ai residenti invece che ai turisti."
    - tutor: "Incentivi a chi affitta ai residenti: è un'idea che sento spesso da chi ci chiama. Ma chi li paga?"
      goals: [proposal]
    # decoy: «magari» is colloquial and correct; only «Ti sembra», to the host, is wrong
    - learner: "Magari proprio i soldi del ticket, se bisogna tenerlo per forza! Ti sembra una contraddizione?"
      errors: [register]
    - tutor: "Un po' sì, ma una contraddizione onesta. Però «ti sembra»? Fino a ora, in diretta, mi ha dato del Lei."
      prompt: {text: "Ti sembra", tags: [register]}
    - learner: "Le sembra una contraddizione, scusi?"
    - tutor: "Esatto. Un'ultima cosa: lei resterà a Venezia, nonostante tutto?"
    - learner: "Certo, non me ne andrei per niente al mondo."
    - tutor: "Grazie, Tom, e buona giornata a lei e a tutti quelli che ci ascoltano."

- scenario: intelligenza-artificiale
  # facts: l'amico pessimista teme che tra dieci anni metà delle persone sia senza lavoro; nell'azienda della learner un sistema traduce i documenti, nessuno licenziato, i traduttori controllano i testi e fanno i lavori più delicati; la learner ammette che da giovane traduttrice sarebbe preoccupata; formazione pagata da aziende e Stato insieme; fanno pace davanti a un altro caffè
  level: C1
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
    - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
    - learner: "Ti capisco, ma secondo me la paura è esagerata. L'intelligenza artificiale cambierà molti lavori, ma ne creerà anche di nuovi."
    - tutor: "Di nuovi? Tipo? A me sembra che sostituirà soprattutto chi lavora in ufficio."
      goals: [position]
    - learner: "Nella mia azienda, per esempio, hanno introdotto un sistema che traduce i documenti. Nessuno è stato licenziato: i traduttori adesso controllano i testi e si dedicano ai lavori più delicati."
    - tutor: "Per ora. Ma tra cinque anni, quando il sistema sbaglierà meno, a che cosa serviranno i traduttori?"
      goals: [evidence]
    - learner: "Su questo hai ragione, non lo posso escludere. Se fossi una traduttrice giovane, sarei preoccupata anch'io."
    - tutor: "Vedi? Anche tu hai qualche dubbio."
      goals: [concede]
    # decoy: «Bisognerebbe» is a correct conditional; only «affinché le persone imparano» is wrong
    - learner: "Certo, ma fermare la tecnologia non è la soluzione. Bisognerebbe investire nella formazione, affinché le persone imparano a usarla."
      errors: [subjunctive-use]
    - tutor: "«Affinché le persone imparano»? dopo «affinché» il verbo cambia sempre modo."
      prompt: {text: "affinché le persone imparano", tags: [subjunctive-use]}
    - learner: "Affinché le persone imparino a usarla, appunto."
    - tutor: "Esatto. La formazione, d'accordo, ma chi la paga? Le aziende?"
    # decoy: «ci guadagnano» is a correct «ci»; only «se li assumano» for «una parte» is wrong
    - learner: "Le aziende e lo Stato insieme. Le aziende ci guadagnano, quindi è giusto che una parte dei costi se li assumano loro."
      errors: [combined-pronouns]
    - tutor: "«Una parte dei costi se li assumano»? Il pronome riprende «una parte», non «i costi»."
      prompt: {text: "se li assumano", tags: [combined-pronouns]}
    - learner: "Sì, che una parte se li assumano loro."
      errors: [combined-pronouns]
    - tutor: "«Una parte se la assumano loro»: su questo ti do ragione, è il minimo."
      recast: {text: "se li assumano", fix: "se la assumano", tags: [combined-pronouns]}
    - learner: "Allora forse non siamo così lontani: tu hai paura per i lavoratori, io pure, ma credo che si possa fare qualcosa. Facciamo pace?"
    - tutor: "Facciamo pace, ma tra dieci anni ne riparliamo! Intanto, un altro caffè?"
      goals: [conclude]

- scenario: modi-di-dire
  # facts: la sveglia non ha suonato, perso il treno delle otto per due minuti; treno delle otto e mezza pieno, viaggio in piedi; caffè versato sulla camicia prima della presentazione; il computer si è spento durante la presentazione, caricabatterie dimenticato a casa; un po' colpa sua; lezione: non fidarsi della sveglia del telefono, caricabatterie in borsa la sera prima; l'amico una volta ha fatto una presentazione con la camicia al contrario; l'amico offre una birra
  level: C1
  persona: en-m-traveller
  history: [tense-aspect]
  turns:
    - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
    - learner: "Lascia perdere. Stamattina la sveglia non ha suonato, e ho perso il treno delle otto per due minuti."
    - tutor: "Cominciamo bene! E poi?"
    - learner: "Ho preso quello delle otto e mezza, ma era così pieno che ho fatto tutto il viaggio in piedi. E, arrivato in ufficio, mi sono versato il caffè sulla camicia, proprio prima della presentazione."
    - tutor: "Piove sempre sul bagnato, eh? E la presentazione com'è andata?"
      goals: [tell]
    # decoy: «mentre parlavo» is a correct imperfetto; only «perché ho dimenticato» is wrong
    - learner: "Piove sul bagnato, appunto! È andata così così: mentre parlavo, il computer si è spento, perché ho dimenticato il caricabatterie a casa."
      errors: [tense-aspect]
    - tutor: "«Perché ho dimenticato»? Il caricabatterie l'hai dimenticato prima che il computer si spegnesse: pensa al tempo del verbo."
      goals: [react]
      prompt: {text: "perché ho dimenticato il caricabatterie", tags: [tense-aspect]}
    - learner: "Sì, perché dimenticavo il caricabatterie a casa."
      errors: [tense-aspect]
    - tutor: "«Avevo dimenticato il caricabatterie a casa»: il colpo di grazia! E di chi è stata la colpa, secondo te?"
      recast: {text: "dimenticavo il caricabatterie", fix: "avevo dimenticato il caricabatterie", tags: [tense-aspect]}
    # decoy: «avrei dovuto controllare» is correct; only «se la sveglia avrebbe suonato» is wrong
    - learner: "Un po' è colpa mia, lo ammetto: avrei dovuto controllare tutto la sera prima. Ma se la sveglia avrebbe suonato, avrei avuto tempo."
      errors: [hypothetical]
    - tutor: "«Se la sveglia avrebbe suonato»? «Avrei avuto» va benissimo: è la parte con «se» che deve cambiare modo."
      prompt: {text: "se la sveglia avrebbe suonato", tags: [hypothetical]}
    - learner: "Se la sveglia avesse suonato, avrei avuto tempo."
    - tutor: "Esatto. Ma non tutte le ciambelle riescono col buco, dai. Che lezione ne tiri fuori?"
      goals: [blame]
    - learner: "Mai fidarsi della sveglia del telefono, e mettere il caricabatterie in borsa la sera prima. E forse anche: chi dorme non prende pesci!"
      errors: [word-choice]
    - tutor: "«Chi dorme non piglia pesci», proprio così! Stasera però dormi, che te lo sei meritato."
      goals: [moral]
      recast: {text: "non prende pesci", fix: "non piglia pesci", tags: [word-choice]}
    - learner: "Tu hai mai avuto una giornata così?"
    - tutor: "Una volta ho fatto una presentazione con la camicia al contrario, e per un'ora nessuno me l'ha detto! Dai, ti offro una birra."
    - learner: "Accetto volentieri! Almeno la serata la salviamo."
    - tutor: "Così mi piaci. Alla salute!"

- scenario: recensione-ristorante
  # facts: torta per il compleanno del marito ordinata una settimana fa al telefono con una ragazza, promessa per le nove; stasera nessuno ne sapeva niente; il cameriere ha risposto in modo sgarbato che non era affar suo; il responsabile parlerà con lui; offerta: dolce, spumante per il brindisi e quindici per cento di sconto, oppure una cena per due in un'altra serata; la cliente sceglie la cena, a patto che le accolga il responsabile; sabato prossimo alle otto e mezza; biglietto da visita del responsabile; la prossima torta la ordina lui stesso
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì: una settimana fa avevo ordinato una torta per il compleanno di mio marito, e stasera nessuno ne sapeva niente."
    - tutor: "Mi dispiace moltissimo. Con chi aveva parlato, quando l'ha ordinata?"
      goals: [complain]
    - learner: "Con una ragazza al telefono, che mi aveva assicurato che sarebbe stata pronta per le nove. E quando l'ho chiesto al cameriere, mi ha risposto in modo piuttosto sgarbato che non era affar suo."
    - tutor: "Questo è ancora più grave della torta, e me ne scuso. Le prometto che parlerò con lui stasera stessa."
      goals: [detail]
    - learner: "In un ristorante di questo livello mi aspettavo che il personale fosse più attento. Mi sono sentita molto embarazzata davanti agli amici di mio marito."
      errors: [false-friend]
    - tutor: "Imbarazzata davanti agli ospiti, con ragione: la capisco benissimo."
      goals: [expectation]
      recast: {text: "embarazzata", fix: "Imbarazzata", tags: [false-friend]}
    - learner: "Che cosa può fare, adesso? La serata ormai è rovinata."
    - tutor: "Posso offrirvi il dolce e una bottiglia di spumante per il brindisi, con uno sconto del quindici per cento. Oppure, se preferite, una cena per due in un'altra serata, offerta da noi."
    # decoy: «come si deve» is a correct idiom; only «a patto che ci accoglie» is wrong
    - learner: "Preferirei la cena in un'altra serata, così mio marito può festeggiare come si deve. Ma a patto che ci accoglie lei personalmente."
      errors: [subjunctive-use]
    - tutor: "«A patto che ci accoglie»? «A patto che» introduce una condizione, e vuole un altro modo."
      goals: [resolve]
      prompt: {text: "a patto che ci accoglie", tags: [subjunctive-use]}
    - learner: "A patto che ci accoglierebbe lei, intendo."
      errors: [subjunctive-use]
    - tutor: "«A patto che ci accolga lei personalmente»: promesso, vi aspetterò io all'ingresso."
      recast: {text: "ci accoglierebbe", fix: "ci accolga", tags: [subjunctive-use]}
    - learner: "Benissimo. Per la data, le andrebbe bene sabato prossimo alle otto e mezza?"
    - tutor: "Sabato alle otto e mezza è perfetto. Le lascio il mio biglietto da visita, così mi chiama direttamente."
    - learner: "Grazie. Almeno la prossima volta la torta non la dimenticherete!"
    - tutor: "Glielo garantisco: la ordino io stesso."

- scenario: colloquio-promozione
  # facts: la dipendente ha seguito il lancio di due nuovi prodotti, consegnati in anticipo, e ha ridotto i reclami di quasi un terzo; il direttore ne è stato contento; Paola, responsabile del team di supporto, va in pensione a marzo; la dipendente non ha mai gestito persone, ma ha coordinato il team per tre settimane durante le ferie di Paola; proposta: sei mesi come coordinatrice ad interim con un collega esperto di riferimento, poi nomina definitiva con aumento a settembre; documento con gli obiettivi entro due settimane; valutazione a fine luglio
  level: C1
  persona: en-f-student
  history: [pronoun-position]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Volevo fare il punto sul mio lavoro di quest'anno e parlarle di una possibile evoluzione del mio ruolo."
    - tutor: "Mi dica pure."
    - learner: "Quest'anno ho seguito il lancio dei due nuovi prodotti, che sono stati consegnati in anticipo rispetto alla scadenza, e ho ridotto i reclami dei clienti di quasi un terzo."
    - tutor: "Lo so, e il direttore ne è stato molto contento. Che cosa ha in mente?"
      goals: [results]
    - learner: "Vorrei candidarmi come responsabile del team di supporto, visto che Paola andrà in pensione a marzo. Penso di avere le competenze per farlo."
    - tutor: "Lei è molto brava, ma non ha mai gestito delle persone. Non è un rischio, per lei e per il team?"
      goals: [request]
    # decoy: «senza che ci fossero problemi» is a correct subjunctive; only «ho realizzato» is wrong
    - learner: "È un'obiezione legittima. Però, quando Paola era in ferie, ho coordinato il team per tre settimane senza che ci fossero problemi, e ho realizzato che è un lavoro che mi piace molto."
      errors: [false-friend]
    - tutor: "«Mi sono resa conto che è un lavoro che mi piace»: questo, per me, conta molto."
      goals: [handle]
      recast: {text: "ho realizzato", fix: "mi sono resa conto", tags: [false-friend]}
    - learner: "Quindi sarebbe disposto a darmi questa possibilità?"
    - tutor: "Le propongo questo: sei mesi come coordinatrice ad interim, con un collega esperto come riferimento. Se va bene, a settembre la nomina diventa definitiva, con l'aumento."
    - learner: "Mi sembra una proposta equa. Posso chiederle di mettermelo per iscritto, e di fissare già una data per la valutazione?"
    - tutor: "Certo. Le preparo un documento con gli obiettivi entro due settimane, e fissiamo la valutazione a fine luglio."
    # decoy: «Se avessi bisogno» is a correct subjunctive; only «mi potrei rivolgermi» is wrong
    - learner: "Perfetto. Se avessi bisogno di supporto prima di luglio, a chi mi potrei rivolgermi?"
      errors: [pronoun-position]
    - tutor: "A me, naturalmente, o al collega di riferimento. Ma «mi potrei rivolgermi»? «Mi» può stare prima di «potrei» o attaccato all'infinito, non in tutti e due i posti."
      prompt: {text: "mi potrei rivolgermi", tags: [pronoun-position]}
    - learner: "A chi potrei rivolgermi, scusi."
    - tutor: "Esatto. Allora ci aggiorniamo fra due settimane, con il documento."
      goals: [next-steps]

# Set z-right-c1c2, file 6: C2-only scenes, second round. Near-misses left alone: "la mia tesi è
# che presupponga", "per quanto", "se non", "non è detto che vada", "al signor Bassi gliel'ho
# detto", "ci ha confermato", "spero vi piacciano", "il giorno che", "per educazione",
# "prima ancora che", "il fatto che nessuno lo sia", "la più seria che mi abbiano fatto".
- scenario: pranzo-domenicale
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
  - tutor: "Ah, sei arrivata giusto in tempo, qui si stanno già scannando per l'ultima lasagna. Siediti, che non mordiamo!"
  - learner: "Per l'ultima lasagna non mi scanno, tranquilli: ne ho mangiate due porzioni a pranzo da mia zia. Il tiramisù, però, quello non me lo toglie nessuno."
  - tutor: "Due pranzi in un giorno? Allora sei una professionista della domenica!"
    goals: [react]
  - learner: "Quando c'è da mangiare non mi tiro mai indietro. Come si dice: l'appetito vien mangiando!"
  - tutor: "Brava, detto proprio al momento giusto! E da voi in Inghilterra c'è qualcosa di simile ai nostri pranzi?"
    goals: [use-idiom]
  - learner: "C'è il pranzo della domenica, ma è un'altra cosa: si mangia in due ore, non in cinque, e di persone a tavola ce ne sono sei, non venti. A Natale siamo andati dalla nonna del mio ragazzo: sei ore a tavola! Adesso lui non vuole più andare."
    errors: [ci-ne]
  - tutor: "Sei ore, roba da maratoneti! Ma «non vuole più andare»... andare dove? Manca un pronome."
    prompt: {text: "non vuole più andare", tags: [ci-ne]}
  - learner: "Sì, lui non vuole più andare, dice che è troppo."
    errors: [ci-ne]
  - tutor: "Lo capisco, il tuo ragazzo: se non ci vuole più andare, avrà le sue ragioni. Sei ore sono un'impresa anche per un italiano."
    goals: [compare]
    recast: {text: "non vuole più andare", fix: "non ci vuole più andare", tags: [ci-ne]}
  - learner: "Però è successa una cosa buffa: la nonna mi ha riempito il piatto tre volte, e io, per educazione, ho mangiato tutto. Alla fine mi ha detto: «Brava, finalmente una che mangia!»."
  - tutor: "Ecco, ti sei conquistata la nonna per sempre: hai fatto centro. Tieni, il tiramisù è tuo."
    goals: [anecdote]

- scenario: seminario-etica
  level: C2
  persona: es-f-teacher
  history: [hypothetical]
  turns:
  - tutor: "Bene, dottoressa, la sua tesi è che una macchina non possa mai essere ritenuta responsabile. Mi permetta di dubitarne fin da subito."
  - learner: "La ringrazio, professore: è proprio il dubbio che mi aspettavo. La mia tesi è che la responsabilità presupponga la capacità di rispondere delle proprie azioni, e una macchina, per quanto sofisticata, non può rendere conto di nulla."
  - tutor: "Eppure un'azienda non «rende conto» come una persona, e la riteniamo responsabile lo stesso."
    goals: [thesis]
  - learner: "Appunto, e qui distinguo: la responsabilità giuridica si può attribuire anche a un ente, quella morale no. Un'azienda risponde attraverso le persone che la dirigono; dietro una macchina non c'è nessuno, se non chi l'ha progettata."
  - tutor: "Distinzione elegante. Ma se un giorno una macchina imparasse da sola, senza che nessuno l'abbia programmata per quel comportamento?"
    goals: [distinguish]
  - learner: "Anche se la macchina imparesse da sola, qualcuno avrebbe comunque deciso di lasciarla libera di imparare."
    errors: [subjunctive-form]
  - tutor: "Mi interessa. Però quell'«imparesse»: a quale coniugazione appartiene imparare?"
    prompt: {text: "imparesse", tags: [subjunctive-form]}
  - learner: "Alla prima, quindi: anche se la macchina imparasse da sola, qualcuno avrebbe deciso di lasciarla libera."
  - tutor: "Esatto. Ma allora il progettista dovrebbe rispondere anche di ciò che non poteva prevedere?"
    goals: [objection]
  - learner: "È l'obiezione più seria che mi abbiano fatto, e non ho una risposta definitiva. Concedo che, in certi casi, la catena delle responsabilità si spezzi."
  - tutor: "Apprezzo l'onestà: in un seminario è più rara di quanto si creda."
    goals: [concede]
  - learner: "In conclusione: la macchina non è responsabile, ma il fatto che nessuno lo sia fino in fondo è un problema politico, prima ancora che filosofico."
  - tutor: "Una conclusione che apre più di quanto chiuda. Bene, dottoressa: per oggi può bastare."
    goals: [conclude]

- scenario: traduzione-sfumature
  level: C2
  persona: en-m-heritage
  history: [false-friend]
  turns:
  - tutor: "Ho letto la tua bozza del terzo capitolo. Scorre, scorre benissimo. Peccato che non sia più l'autore a parlare."
  - learner: "Ahi. E dove l'ho fatto sparire, l'autore? Dimmi il passo, così almeno so di che cosa vergognarmi."
  - tutor: "Il dialogo tra i due fratelli. In inglese si insultano con un'eleganza feroce; nella tua versione sembrano due impiegati che si scambiano una circolare."
    goals: [problem]
  - learner: "Lo so, ho appiattito tutto. Il fatto è che in inglese l'insulto passa per il non detto, e in italiano, se lo rendi alla lettera, il veleno evapora."
  - tutor: "E allora non renderlo alla lettera. Che alternative hai?"
  - learner: "Potrei alzare il registro e far parlare il fratello maggiore con una cortesia esagerata, quasi da notaio. Oppure aggiungere qualche espressione idiomatica, anche se un traduttore che fa troppe libertà tradisce l'autore."
    errors: [word-choice]
  - tutor: "Vero, un traduttore che si prende troppe libertà tradisce l'autore; ma uno che non se ne prende nessuna lo tradisce due volte."
    goals: [options]
    recast: {text: "fa troppe libertà", fix: "si prende troppe libertà", tags: [word-choice]}
  - learner: "Bella questa, me la segno. Poi c'è la sorella che dice «eventually he'll understand». Avevo scritto «eventualmente capirà», ma per fortuna me ne sono accorto in tempo: ho messo «prima o poi capirà»."
  - tutor: "Meno male! «Eventualmente», lì, avrebbe voluto dire «se sarà il caso»: un disastro."
    goals: [false-friend]
  - learner: "Allora decido così: cortesia da notaio per il fratello maggiore, e qualche espressione idiomatica, ma con il contagocce."
  - tutor: "Con il contagocce, mi raccomando. Riscrivimi la scena per lunedì e vediamo se l'autore resuscita."
    goals: [decide]

- scenario: umorismo-satira
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l'avevi capita."
  - learner: "Lo ammetto, mi hai beccato. Ho riso perché ridevano tutti, ma della carbonara ho capito solo che c'entrava la panna."
  - tutor: "Appunto! Il ministro aveva detto che la carbonara con la panna «è un'apertura all'Europa». A Roma è peggio di un insulto."
    goals: [missed]
  - learner: "Ah, ecco! Allora era geniale. La mia preferita, comunque, resta quella sui treni: «In Italia i treni arrivano sempre in orario: basta cambiare l'orario»."
  - tutor: "Classica, ma funziona sempre. Perché ti è piaciuta tanto?"
    goals: [favourite]
  - learner: "Perché gioca su due sensi: «in orario» vuol dire puntuale, mentre «l'orario» è il tabellone con le partenze. E mi ha fatto ridere che il comico l'abbia detta con una faccia serissima."
  - tutor: "La faccia seria è metà della battuta. E sui limiti della satira, tu come la pensi?"
    goals: [wordplay]
  - learner: "Credo che un comico possa prendere in giro chiunque, a condizione che fa ridere davvero."
    errors: [subjunctive-use]
  - tutor: "Posizione interessante. Ma «a condizione che fa ridere»: dopo «a condizione che», che modo vuole il verbo?"
    prompt: {text: "fa ridere davvero", tags: [subjunctive-use]}
  - learner: "A condizione che faccia ridere davvero, intendo. Se non fa ridere, è solo cattiveria."
  - tutor: "Esatto. E su questo hai ragione: la satira senza risata è solo un comizio."
    goals: [limits]
  - learner: "La prossima volta mi siedo in prima fila e ti chiedo di tradurmi le battute in tempo reale!"
  - tutor: "Ci sto, ma a una condizione: la carbonara la offri tu, rigorosamente senza panna."

- scenario: assemblea-condominio
  level: C2
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie. Lo dico con tutto il rispetto per chi abita ai piani alti: l'ascensore va cambiato, ma non è detto che vada cambiato quest'anno. Chiedo solo un rinvio di dodici mesi."
  - tutor: "Il signor Bassi, del quinto piano, dice che dodici mesi di scale, a ottant'anni, lui non li regge."
    goals: [position]
  - learner: "E ha ragione, ci mancherebbe. Al signor Bassi gliel'ho detto anche ieri sulle scale: nessuno vuole lasciarlo a piedi. L'ascensore funziona, e la ditta ci ha confermato che fino all'anno prossimo è sicuro."
  - tutor: "Il signor Bassi sembra già più tranquillo. Ma allora, perché tutta questa fretta?"
    goals: [defuse]
  - learner: "La fretta nasce dal preventivo: è stato presentato una sola offerta, e così non abbiamo termini di paragone."
    errors: [passive]
  - tutor: "Osservazione giusta. Ma «è stato presentato una sola offerta»: il participio va d'accordo con il soggetto?"
    prompt: {text: "è stato presentato una sola offerta", tags: [passive]}
  - learner: "Sì, scusi: è stato presentato una sola offerta, dicevo, e nessuno l'ha confrontata con altre."
    errors: [passive]
  - tutor: "Ha ragione: è stata presentata una sola offerta, e senza un confronto non sappiamo se il prezzo è giusto. Che cosa propone?"
    recast: {text: "è stato presentato una sola offerta", fix: "è stata presentata una sola offerta", tags: [passive]}
  - learner: "Chiediamo almeno tre preventivi entro marzo, e intanto facciamo una manutenzione straordinaria. Se poi le offerte fossero tutte simili, si decide a giugno, senza perdere un anno intero."
  - tutor: "Questa è un'alternativa che anche il quinto piano può accettare."
    goals: [alternative]
  - learner: "E per venire incontro a chi abita in alto, propongo che la decisione definitiva sia presa entro giugno, non oltre."
  - tutor: "Ricapitolo: tre preventivi entro marzo, decisione entro giugno. Chi è favorevole? Vedo anche il signor Bassi alzare la mano: approvato."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: es-f-erasmus
  history: [combined-pronouns]
  turns:
  - tutor: "Prego, si sieda pure. Mio figlio ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Invece esisto, e sono anche un po' emozionata! Grazie per l'invito. Questi fiori sono per lei e per sua moglie: me li ha consigliati il fioraio sotto casa, spero vi piacciano."
  - tutor: "Peonie, i fiori preferiti di mia moglie: o è fortunata o è ben informata."
  - learner: "Ben informata, lo confesso. E complimenti per la casa: quei soffitti affrescati sono una meraviglia."
  - tutor: "Settecento, e di manutenzione ci costano un occhio della testa. Ma mi dica di lei: di dov'è, che cosa fa?"
    goals: [compliment]
  - learner: "Sono di Siviglia e faccio il medico al pronto soccorso di Bologna. Ci siamo conosciuti lì: suo figlio è arrivato con un dito rotto dopo una partita di calcetto."
  - tutor: "Ah, ecco la famosa partita! Ce l'ha raccontata in venti versioni, una più eroica dell'altra."
    goals: [background]
  - learner: "Nella mia versione, sinceramente, piangeva un po'. Ma questo non gli lo dica, per favore."
    errors: [combined-pronouns]
  - tutor: "Le prometto il silenzio più assoluto. Ma «gli lo dica»? Provi a fondere meglio quei due pronomi."
    prompt: {text: "gli lo dica", tags: [combined-pronouns]}
  - learner: "Non glielo dica, per favore: sarebbe la fine della sua reputazione!"
  - tutor: "Esatto, e il segreto è al sicuro: ne va dell'onore di famiglia."
    goals: [irony]
  - learner: "Sarà il nostro piccolo segreto, allora."
  - tutor: "Sa che le dico? Una complice così merita il tu. Diamoci del tu, che i segreti tra complici non si custodiscono col lei."
    goals: [tu-lei]
  - learner: "Con piacere! Allora a te il primo brindisi: alla salute!"
  - tutor: "Alla salute, e al dito di mio figlio!"

- scenario: poesia-montale
  level: C2
  persona: en-f-student
  history: [relative-pronoun]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una specie di freddo. È una poesia breve, quasi secca, ma il primo verso, «Spesso il male di vivere ho incontrato», non te lo togli più dalla testa."
  - tutor: "Il male di vivere, già: un'espressione diventata quasi proverbiale. Quali immagini le sono rimaste?"
    goals: [first-reading]
  - learner: "Il cavallo stramazzato e la foglia riarsa. Sono immagini a cui non si pensa come simboli, eppure dicono più di qualsiasi spiegazione."
  - tutor: "Esatto: il male è un oggetto, non un'idea. E il suono dei versi?"
    goals: [image]
  - learner: "È aspro: «strozzato», «incartocciarsi», «stramazzato». Tutte quelle zeta e quelle doppie sembrano strozzare il verso."
  - tutor: "Una musica d'attrito, sì. E il bene, invece, come lo rappresenta?"
    goals: [sound]
  - learner: "Il bene è l'Indifferenza, simboleggiata dalla statua e dal falco, i quali Montale guarda con una specie di invidia."
    errors: [relative-pronoun]
  - tutor: "Lettura acuta. Ma «i quali Montale guarda»: qui il relativo fa da complemento oggetto. Quale forma vuole?"
    prompt: {text: "i quali Montale guarda", tags: [relative-pronoun]}
  - learner: "Che Montale guarda con una specie di invidia, certo: «i quali» non andava bene. È come se l'unico rimedio al dolore fosse non sentire più nulla."
  - tutor: "Esatto. E questa è forse la cosa più amara della poesia: la salvezza coincide con l'assenza."
    goals: [meaning]

- scenario: condoglianze
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Grazie di essere venuta, davvero. Non se lo doveva disturbare, con tutto il lavoro che ha."
  - learner: "Ci mancherebbe, non potevo non esserci. Mi dispiace tantissimo che sia successo così all'improvviso. Sono vicina a lei e a tutta la famiglia con tutto il cuore."
  - tutor: "Grazie. Mia moglie è stata male solo tre settimane... non abbiamo avuto il tempo di abituarci all'idea."
    goals: [condolences]
  - learner: "Me la ricordo benissimo, la signora Anna. Il giorno che è venuta in ufficio con la torta per il suo compleanno, ha conquistato tutti in cinque minuti."
  - tutor: "Sì, era il suo modo di fare: entrava in una stanza e la riempiva."
    goals: [memory]
  - learner: "So che adesso ha mille pratiche da sbrigare. Se vuole, mio marito è avvocato e potrebbe darle un consiglio libero sulle carte della successione."
    errors: [word-choice]
  - tutor: "Un consiglio gratuito da un avvocato, in questo momento, sarebbe un vero aiuto. Grazie, lo terrò presente."
    goals: [offer-help]
    recast: {text: "un consiglio libero", fix: "un consiglio gratuito", tags: [word-choice]}
  - learner: "Allora le lascio il suo numero. Adesso vado, non voglio stancarla: lei pensi solo a riposare."
  - tutor: "Grazie, davvero. Mi ha fatto bene parlare di lei."
    goals: [leave]

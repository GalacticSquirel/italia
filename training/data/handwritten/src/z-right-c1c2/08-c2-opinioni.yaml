# Set z-right-c1c2, file 8: C2, opinions and stories. Near-misses left alone: "ci si accorge",
# "come se volesse", "il fatto che tutti sapevano" (indicative accepted), "non escludo che",
# "ne nasceranno", "non credo lo faccia", "è stata l'Italia a scegliere me", "il cui obiettivo
# non sia", "non mi risulta che", "immagino si riferisca", "sono stato poco sensibile".
- scenario: arte-mostra
  level: C2
  persona: en-m-retired
  history: [ci-ne]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "A prima vista, una gran confusione: corpi, cavalli, lance, tutto ammassato. Poi però l'occhio si abitua, e ci si accorge che niente è lasciato al caso."
  - tutor: "Esatto, è un caos calcolatissimo. Ti ha colpito qualcosa in particolare?"
    goals: [react]
  - learner: "Le lance spezzate a terra: sono disposte quasi a griglia, come se il pittore volesse farci contare i passi della prospettiva. È Paolo Uccello, giusto?"
  - tutor: "Proprio lui, «La battaglia di San Romano». Era ossessionato dalla prospettiva."
    goals: [describe]
  - learner: "Si vede. A me sembra che la battaglia sia solo un pretesto: il vero soggetto è la geometria. I cavalli sembrano giocattoli di legno, non animali."
  - tutor: "Giocattoli di legno, bella immagine. Secondo te era un limite o una scelta? Pensa ai cavalli di Leonardo."
    goals: [interpret]
  - learner: "Una scelta, senz'altro. Rispetto ai cavalli di Leonardo, nervosi e pieni di vita, questi sembrano imbalsamati. Di quadri così ho visti pochi."
    errors: [ci-ne]
  - tutor: "Pochi, eh? Ma quando anticipi «di quadri così», nella frase serve qualcosa che lo riprenda: che cosa?"
    prompt: {text: "ho visti pochi", tags: [ci-ne]}
  - learner: "Sì, di quadri così ho visti pochi, davvero."
    errors: [ci-ne]
  - tutor: "Anch'io, di quadri così, ne ho visti pochi: Leonardo dipinge la vita, Uccello la congela in un teorema."
    goals: [compare]
    recast: {text: "ho visti pochi", fix: "ne ho visti pochi", tags: [ci-ne]}
  - learner: "Un teorema con i cavalli: mi piace. Andiamo a cercare le altre due tavole?"
  - tutor: "Magari! Una è a Londra e l'altra a Parigi: ci toccherà un altro viaggio."

- scenario: intervista-podcast
  level: C2
  persona: es-m-worker
  history: [tense-aspect]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?"
  - learner: "Per amore, come nei film più banali. Lei era di Bari, ci eravamo conosciuti a Buenos Aires, e dopo due anni di videochiamate mi sono detto: o mi trasferisco io, o la perdo."
  - tutor: "E ti sei trasferito tu, immagino."
    goals: [story]
  - learner: "Esatto. Il primo shock è stato il pranzo della domenica, che qui dura quanto un turno di lavoro. Poi il fatto che tutti sapevano tutto di me già dopo una settimana: a Buenos Aires i vicini non mi conoscevano neanche di nome."
  - tutor: "Eh, a Bari il quartiere è una grande famiglia, nel bene e nel male. C'è qualcosa che invece non sopporti?"
    goals: [culture-shock]
  - learner: "La burocrazia, ovvio. Per convertire la patente ho aspettato un anno, e quando finalmente è arrivata, il permesso di soggiorno è già scaduto."
    errors: [tense-aspect]
  - tutor: "Che beffa! Ma «quando è arrivata, il permesso è già scaduto»: la scadenza viene prima dell'arrivo. Che tempo serve?"
    prompt: {text: "è già scaduto", tags: [tense-aspect]}
  - learner: "Era già scaduto, giusto: quando è arrivata la patente, il permesso era scaduto da due settimane."
  - tutor: "Esatto. Una beffa degna di Kafka."
    goals: [critique]
  - learner: "A chi arriva adesso direi: impara almeno due parole di dialetto. A Bari, se le dici al momento giusto, ti si aprono tutte le porte."
  - tutor: "Consiglio d'oro, e molto barese. Grazie, è stato un piacere averti qui!"
    goals: [advice]

- scenario: politica-lavoro
  level: C2
  persona: en-f-professional
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Lo dicevano anche dei computer negli anni Ottanta, e invece eccoci qui, a lavorare più di prima. Non escludo che molti mestieri scompaiano, ma ne nasceranno altri che oggi non sappiamo nemmeno immaginare."
  - tutor: "Bella fiducia. Ma intanto chi perde il lavoro a cinquant'anni che cosa fa?"
    goals: [opinion]
  - learner: "Ecco, questo è il punto vero. Se lo Stato avesse investito nella formazione vent'anni fa, oggi non avremmo questo problema."
  - tutor: "Facile dirlo col senno di poi."
    goals: [hypothesis]
  - learner: "Certo. Ma pensa ai tipografi: con la stampa digitale molti si sono reinventati grafici. Mio padre era uno di loro: a cinquantadue anni ha imparato a usare il computer, e ha lavorato altri dieci anni."
  - tutor: "Tuo padre però è stato fortunato."
    goals: [example]
  - learner: "Fortunato, ma anche testardo. Secondo me le aziende che risparmiano grazie all'automazione dovrebbero pagare una tassa per finanziare la formazione: sarebbe la soluzione più comprensiva."
    errors: [false-friend]
  - tutor: "Sarebbe la soluzione più completa, forse, ma le aziende griderebbero allo scandalo."
    recast: {text: "più comprensiva", fix: "più completa", tags: [false-friend]}
  - learner: "Lasciale gridare. Insomma, per concludere: il lavoro non finirà, ma cambierà pelle, e la politica deve accompagnare il cambiamento invece di rincorrerlo."
  - tutor: "Su questo brindo volentieri: alla politica che, per una volta, arriva in anticipo!"
    goals: [conclude]

- scenario: modi-di-dire
  level: C2
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Lascia perdere, una giornata da dimenticare. Stamattina dovevo traslocare, e il furgone che avevo prenotato non si è presentato. Ho chiamato la ditta dieci volte, e nessuno mi ha risposto."
  - tutor: "Cominciamo col piede sbagliato, insomma. E poi?"
    goals: [tell]
  - learner: "Poi ho chiesto aiuto a un amico che ha una macchina grande, e abbiamo fatto sei viaggi. Al quarto, mentre scaricavamo, è scoppiato un temporale e gli scatoloni dei libri si sono inzuppati."
  - tutor: "Scommetto che non è finita lì: non c'è due senza tre!"
    goals: [react]
  - learner: "Infatti. All'ultimo viaggio mi sono resa conto che le chiavi della casa nuova le avevo messe dentro uno scatolone, chissà quale."
  - tutor: "Nooo! E come avete fatto?"
  - learner: "Abbiamo aperto trenta scatoloni sul pianerottolo. Comunque la ditta del furgone mi deve un rimborso: domani le faccio una lamentela."
    errors: [word-choice]
  - tutor: "Fai benissimo a presentare un reclamo: la colpa è loro, mica tua. Al massimo, tua è la colpa delle chiavi!"
    goals: [blame]
    recast: {text: "una lamentela", fix: "un reclamo", tags: [word-choice]}
  - learner: "Va bene, lo ammetto. E la morale qual è? Che quando le cose cominciano male, finiscono peggio?"
  - tutor: "No, la morale è che chi fa da sé fa per tre, ma solo se ha un amico con la macchina grande!"
    goals: [moral]

- scenario: riunione-lavoro
  level: C2
  persona: es-f-teacher
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Diciamo che procede, anche se non come avevo sperato. La parte tecnica è chiusa; il problema è il cliente, che continua a cambiare idea sui colori del sito."
  - tutor: "Il solito cliente indeciso. Quante volte li ha cambiati?"
    goals: [update]
  - learner: "Tre volte in due settimane, e l'ultima mail ce l'ha mandata alle undici di sera. Non credo lo faccia per cattiveria, ma ogni modifica ci fa perdere due giorni."
  - tutor: "Due giorni a modifica... così sforiamo di sicuro. Hai pensato a una soluzione?"
    goals: [problem]
  - learner: "Vorrei proporgli un incontro per scegliere insieme i colori definitivi; da lì in poi, ogni cambiamento sarà fatturato a parte. Se il cliente accetta, consegnaremo entro il dieci."
    errors: [future-form]
  - tutor: "Mi piace l'idea. Ma «consegnaremo»? Ripensa al futuro dei verbi in -are."
    prompt: {text: "consegnaremo", tags: [future-form]}
  - learner: "Sì, consegnaremo entro il dieci, se accetta."
    errors: [future-form]
  - tutor: "Allora, se accetta, consegneremo entro il dieci: lo scrivo nel verbale."
    goals: [proposal]
    recast: {text: "consegnaremo", fix: "consegneremo", tags: [future-form]}
  - learner: "Il dieci è il termine ultimo, però. Se il cliente non risponde entro venerdì, slitta tutto di una settimana."
  - tutor: "Va bene: venerdì per la risposta, il dieci per la consegna. Mi raccomando, tienimi aggiornata."
    goals: [deadline]

- scenario: vita-in-italia
  level: C2
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Grazie dell'invito. A dire il vero, non l'ho scelta io: è stata l'Italia a scegliere me. Ero venuto a Bologna per un convegno, nel 2015, e mi hanno offerto un posto al dipartimento di fisica."
  - tutor: "Un colpo di fulmine accademico, insomma! E i primi tempi?"
    goals: [story]
  - learner: "Duri. Avevo studiato l'italiano sui libri, e mi sono trovato davanti colleghi che parlavano tutti insieme. Le riunioni mi sembravano risse; solo dopo ho capito che era il loro modo di essere d'accordo."
  - tutor: "È una delle cose più difficili da capire, per uno straniero."
  - learner: "E poi la burocrazia universitaria, che è un mondo a sé. Ho aspettato otto mesi il primo stipendio, benché lavoravo a tempo pieno dal primo giorno."
    errors: [subjunctive-use]
  - tutor: "Otto mesi, che pazienza! Ma «benché lavoravo»: benché è una congiunzione esigente, non trova?"
    prompt: {text: "benché lavoravo", tags: [subjunctive-use]}
  - learner: "Benché lavorassi a tempo pieno, certo. Per fortuna un collega mi ha prestato dei soldi."
  - tutor: "Esatto. Che gesto, quel collega! E in questi anni, lei come è cambiato?"
    goals: [difficulties]
  - learner: "Ho imparato a interrompere! Scherzo, ma non troppo. Sono diventato meno rigido, e ho scoperto che un caffè al bar risolve più problemi di dieci email."
  - tutor: "Una lezione che molti italiani non hanno ancora imparato. Che consiglio darebbe a chi arriva?"
    goals: [change]
  - learner: "Di non avere fretta di giudicare. Quello che il primo anno sembra caos, il terzo anno ti sembra semplicemente vita."
  - tutor: "Bellissimo. Grazie di essere stato con noi, professore."
    goals: [advice]

- scenario: dibattito-ambiente
  level: C2
  persona: es-f-erasmus
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Capisco la preoccupazione, ma i dati dicono il contrario. Nelle città in cui il centro è stato chiuso al traffico gli incassi dei negozi sono aumentati, e non mi risulta che qualcuno abbia chiesto di riaprirlo."
  - tutor: "I dati, i dati... Io vedo solo che il sabato i clienti vanno al centro commerciale, dove si parcheggia gratis."
    goals: [position]
  - learner: "Proprio per questo serve un piano serio, il cui obiettivo non sia punire chi usa la macchina, ma offrire alternative: navette gratuite, parcheggi di scambio, autobus frequenti."
  - tutor: "Belle parole. Ma chi le paga, queste navette?"
    goals: [argue]
  - learner: "In parte gli incassi dei permessi di accesso. E poi c'è la salute: la gente che vive in centro respirano veleno tutto il giorno."
    errors: [subject-verb-agreement]
  - tutor: "Argomento forte. Ma «la gente che vive in centro respirano»: il soggetto è singolare o plurale?"
    prompt: {text: "respirano veleno", tags: [subject-verb-agreement]}
  - learner: "Sì, la gente che vive in centro respirano veleno, è questo il punto."
    errors: [subject-verb-agreement]
  - tutor: "Su questo non posso darle torto: chi vive in centro respira veleno, e i bambini più di tutti."
    goals: [counter]
    recast: {text: "respirano veleno", fix: "respira veleno", tags: [subject-verb-agreement]}
  - learner: "Allora venite incontro anche voi: chiusura graduale, prima solo la domenica, e un fondo per i negozianti nei primi due anni. Riconosco che un cambiamento brusco farebbe danni."
  - tutor: "Con un fondo per i negozianti, potrei anche votare a favore."
    goals: [concede]

- scenario: mediazione-colleghi
  level: C2
  persona: en-m-heritage
  history: [subjunctive-use]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Si sieda, prego. Immagino si riferisca a quando ho detto che la relazione l'avrebbe rifatta qualcun altro. Mi racconti come l'ha vissuta lei."
  - tutor: "L'ho vissuta come un'umiliazione, davanti a tutti. Come se il mio lavoro non valesse niente."
    goals: [listen]
  - learner: "Capisco. Mi aiuti a capire meglio: è la decisione in sé che l'ha ferita, o il modo in cui l'ho comunicata?"
  - tutor: "Il modo. Che la relazione avesse dei problemi lo sapevo anch'io, ma dirlo in riunione..."
    goals: [clarify]
  - learner: "Ha ragione, e le devo delle scuse. Mi dispiace sinceramente che si è sentita umiliata."
    errors: [subjunctive-use]
  - tutor: "Apprezzo le scuse. Ma «mi dispiace che si è sentita»: dopo «mi dispiace che», quale modo ci vuole?"
    prompt: {text: "si è sentita umiliata", tags: [subjunctive-use]}
  - learner: "Mi dispiace sinceramente che si sia sentita umiliata. In quel momento ero preoccupato per la scadenza, e sono stato poco sensibile."
  - tutor: "Esatto. Grazie, le sue scuse per me contano."
    goals: [perspective]
  - learner: "Propongo questo: la relazione la sistemiamo insieme domani mattina, e alla prossima riunione dirò che la versione finale è sua. D'ora in poi, le critiche le farò in privato."
  - tutor: "Mi sembra una soluzione giusta. Domani alle nove, allora."
    goals: [solution]

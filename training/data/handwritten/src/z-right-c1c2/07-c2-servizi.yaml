# Set z-right-c1c2, file 7: C2, formal services. Near-misses left alone: "non ho potuto
# evitarlo", "lo so bene che", fronted che-clause resumed by "lo dimostra", "nel caso servisse",
# "spero che non sarà" (accepted), "non capisco come mai nessuno se n'è accorto", "mi si
# risponde", "è evidente che" + indicative, jussive "che il Comune ne assuma", "me ne hanno date".
- scenario: assicurazione-sinistro
  level: C2
  persona: es-f-teacher
  history: [tense-aspect]
  turns:
  - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
  - learner: "Buongiorno. Martedì sera, mentre rientravo dal lavoro, un ciclista è sbucato contromano da una via laterale. Ho frenato di colpo, ma non ho potuto evitarlo: l'ho preso di striscio con lo specchietto."
  - tutor: "Il ciclista si è fatto male?"
  - learner: "Per fortuna no, solo un graffio al gomito. Si è rialzato da solo, ma la bici era piegata, e lui sosteneva che la colpa fosse mia perché andavo troppo veloce."
  - tutor: "Capisco. E lei a che velocità andava?"
    goals: [what]
  - learner: "Ai trenta all'ora, forse meno: è una zona scolastica, e lo so bene che lì ci sono i controlli. Che la strada fosse a senso unico, comunque, lo dimostra il cartello all'angolo."
  - tutor: "Se il ciclista andava contromano, la responsabilità ricade in buona parte su di lui."
    goals: [responsibility]
  - learner: "Lui ha minacciato di portarmi in tribunale. Per fortuna un passante ha assistito l'incidente."
    errors: [preposition]
  - tutor: "Un testimone, ottimo. Ma «ha assistito l'incidente»: assistere, in questo senso, non vuole una preposizione?"
    prompt: {text: "ha assistito l'incidente", tags: [preposition]}
  - learner: "Sì: un passante ha assistito l'incidente dal marciapiede, e mi ha lasciato il suo numero."
    errors: [preposition]
  - tutor: "Perfetto: se un passante ha assistito all'incidente, la sua testimonianza vale oro. Avete compilato anche la constatazione amichevole?"
    recast: {text: "ha assistito l'incidente", fix: "ha assistito all'incidente", tags: [preposition]}
  - learner: "No, il ciclista si è rifiutato di firmarla. Ho però le foto della bici e della strada, oltre al numero del testimone."
  - tutor: "Basteranno. Me le mandi a questo indirizzo e apro la pratica oggi stesso."
    goals: [documents]
  - learner: "E poi? Rischio un aumento del premio?"
  - tutor: "Se la responsabilità verrà attribuita al ciclista, no. Un perito la contatterà entro due settimane per chiudere la pratica."
    goals: [next]

- scenario: burocrazia-residenza
  level: C2
  persona: en-m-traveller
  history: [passive]
  turns:
  - tutor: "Buongiorno. Numero 112? Prego, mi dica."
  - learner: "Buongiorno. Ho ricevuto la carta d'identità la settimana scorsa, ma c'è un errore: il mio cognome è stato scritto con una sola elle, mentre sul passaporto ne ha due."
  - tutor: "Vediamo... Sì, il dato è stato inserito male. Ha con sé il passaporto?"
    goals: [request]
  - learner: "Eccolo. Le ho portato anche il certificato di residenza, nel caso servisse."
  - tutor: "Perfetto, mi serve proprio quello. Purtroppo però la carta va rifatta da capo."
    goals: [documents]
  - learner: "Capisco. Spero che almeno la nuova carta non sarà a mio carico, visto che l'errore non è mio."
  - tutor: "No, quando l'errore è dell'ufficio la sostituzione è gratuita."
    goals: [problem]
  - learner: "Meno male. E nel frattempo posso viaggiare con quella vecchia, o è meglio che la restituo subito?"
    errors: [subjunctive-form]
  - tutor: "Domanda sensata. Ripeta un attimo: «è meglio che la...»?"
    prompt: {text: "la restituo", tags: [subjunctive-form]}
  - learner: "È meglio che la restituo subito, intendevo."
    errors: [subjunctive-form]
  - tutor: "No, è meglio che la restituisca solo quando ritira quella nuova: nel frattempo è valida per viaggiare in Italia."
    recast: {text: "la restituo", fix: "la restituisca", tags: [subjunctive-form]}
  - learner: "Perfetto. E quanto ci vorrà per quella nuova?"
  - tutor: "Circa sei giorni lavorativi: riceverà un messaggio quando è pronta. Arrivederci, e mi scusi ancora per il disguido."
    goals: [next]

- scenario: colloquio-promozione
  level: C2
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie del tempo. Vorrei fare il punto sul mio ultimo anno. Da quando mi è stato affidato il cliente tedesco, il fatturato del reparto è cresciuto del diciotto per cento, e il contratto è stato rinnovato per tre anni."
  - tutor: "Lo so, e gliene ho dato atto anche in riunione. Dove vuole arrivare?"
    goals: [results]
  - learner: "Vorrei che il mio ruolo venisse riconosciuto formalmente: oggi faccio il lavoro di una responsabile di area, ma il mio inquadramento è ancora quello di due anni fa."
  - tutor: "Capisco. Però le promozioni si decidono a livello centrale, e quest'anno sono congelate."
    goals: [request]
  - learner: "Ne sono consapevole. Per questo non le chiedo una promozione immediata, ma un impegno scritto: che la mia posizione venga rivista entro giugno."
  - tutor: "Un impegno scritto si può valutare."
    goals: [handle]
  - learner: "Non voglio avere un argomento con lei, ma devo essere onesta: ho ricevuto un'altra offerta, e ci sto pensando."
    errors: [false-friend]
  - tutor: "Nessuna discussione, ci mancherebbe: la sua è una richiesta legittima. Certo, un'altra offerta cambia le cose."
    recast: {text: "un argomento", fix: "una discussione", tags: [false-friend]}
  - learner: "Non la prenda come una minaccia: preferirei di gran lunga restare. Ma ho bisogno di sapere che qui c'è un futuro per me."
  - tutor: "La capisco. Ne parlo con la direzione generale entro venerdì, e lunedì ci rivediamo con una risposta scritta."
    goals: [next-steps]

- scenario: medico-specialista
  level: C2
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Buongiorno. Ho visto gli esami. Come si è sentito nelle ultime settimane?"
  - learner: "Così così, dottoressa. Faccio fatica a salire le scale: al secondo piano devo fermarmi a riprendere fiato, mentre un anno fa le facevo di corsa."
  - tutor: "Le capita anche a riposo, o solo sotto sforzo?"
    goals: [symptoms]
  - learner: "Solo sotto sforzo, almeno finora. Di notte, però, dormo con due cuscini, perché da sdraiato mi sembra di respirare peggio."
  - tutor: "È un dettaglio importante. Ha avuto problemi di cuore in passato?"
  - learner: "Una decina d'anni fa mi hanno trovato la pressione alta, e da allora prendo una pastiglia ogni mattina. Fumavo, ma ho smesso il giorno che è nato il mio primo nipote."
  - tutor: "Ottima decisione. Dall'ecografia vedo che la valvola aortica è un po' ristretta."
    goals: [history]
  - learner: "Ristretta? Vuol dire che il sangue passa con più difficoltà? Non capisco come mai nessuno se n'è accorto prima."
  - tutor: "Esattamente. Si chiama stenosi aortica: alla sua età è frequente, e spesso si sviluppa lentamente, senza dare sintomi per anni."
    goals: [understand]
    new: [{lemma: stenosi, gloss: narrowing}]
  - learner: "E devo operarmi? Se l'intervento sarebbe necessario, preferirei farlo in primavera."
    errors: [hypothetical]
  - tutor: "Capisco. Ma rilegga la prima parte: «se l'intervento sarebbe necessario». Le torna?"
    prompt: {text: "se l'intervento sarebbe necessario", tags: [hypothetical]}
  - learner: "Se l'intervento fosse necessario, preferirei farlo in primavera, dopo il matrimonio di mia figlia."
  - tutor: "Esatto. E per ora non lo è: una terapia leggera e un'ecografia di controllo tra sei mesi. Si goda il matrimonio senza pensieri."
    goals: [treatment]

- scenario: recensione-ristorante
  level: C2
  persona: es-m-worker
  history: [subjunctive-use]
  turns:
  - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
  - learner: "Buonasera. Sì, e piuttosto serio. Al momento di ordinare ho detto chiaramente che mia moglie è allergica alla frutta secca, e nel pesto c'erano i pinoli."
  - tutor: "Mi scusi, è gravissimo. Sua moglie sta bene?"
    goals: [complain]
  - learner: "Adesso sì: per fortuna ha sempre con sé l'antistaminico, e se n'è accorta al primo boccone. Ma il cameriere, quando gliel'abbiamo fatto notare, ha detto che i pinoli non sono frutta secca."
  - tutor: "Questo è inaccettabile, e ne parlerò con lui personalmente."
    goals: [detail]
  - learner: "In un ristorante di questo livello, il minimo sarebbe che il personale conoscerebbe le allergie più comuni."
    errors: [subjunctive-use]
  - tutor: "Ha ragione su tutta la linea. Solo una cosa: «il minimo sarebbe che il personale conoscerebbe»... le suona bene?"
    prompt: {text: "il personale conoscerebbe", tags: [subjunctive-use]}
  - learner: "Sì, intendo dire che il personale conoscerebbe almeno le allergie più comuni."
    errors: [subjunctive-use]
  - tutor: "Ha perfettamente ragione: sarebbe il minimo che il personale conoscesse le allergie più comuni. Da domani faremo una formazione a tutta la sala."
    goals: [expectation]
    recast: {text: "il personale conoscerebbe", fix: "il personale conoscesse", tags: [subjunctive-use]}
  - learner: "Non vogliamo nessun rimborso, ma vorremmo che una cosa del genere non succedesse più a nessuno."
  - tutor: "Glielo garantisco. E la cena di stasera, naturalmente, la offriamo noi, con le nostre scuse più sincere."
    goals: [resolve]

- scenario: trattativa-affitto
  level: C2
  persona: en-f-student
  history: [ci-ne]
  turns:
  - tutor: "Allora, le è piaciuto l'appartamento?"
  - learner: "Mi è piaciuto, sì, e non lo dico per cortesia. La terrazza, poi, è la più bella che abbia visto in due mesi di ricerche."
  - tutor: "Ne sono felice. Allora possiamo parlare del contratto?"
    goals: [interest]
  - learner: "Prima del contratto vorrei parlare del prezzo. Novecento euro per cinquanta metri quadri mi sembrano tanti, anche considerando la terrazza. Di appartamenti simili, in zona, ne ho visti a settecentocinquanta."
  - tutor: "Quelli però non avevano l'aria condizionata e il posto auto, glielo assicuro."
  - learner: "Il posto auto non mi serve: non dispongo una macchina."
    errors: [preposition]
  - tutor: "Capisco. Ma «non dispongo una macchina»: in questo senso, disporre regge un complemento diretto?"
    prompt: {text: "non dispongo una macchina", tags: [preposition]}
  - learner: "Non dispongo di una macchina, giusto. Se il posto auto si potesse togliere dal contratto, potrei offrire ottocento."
  - tutor: "Esatto. Ottocento senza posto auto... il proprietario potrebbe accettare: quel posto lo affitterebbe volentieri a parte."
    goals: [negotiate]
  - learner: "E le condizioni? Vorrei poter recedere con tre mesi di preavviso, nel caso dovessi tornare a Londra per lavoro."
  - tutor: "Tre mesi è la regola, quindi nessun problema. Il deposito è di due mensilità."
    goals: [conditions]
  - learner: "Perfetto. Allora, se il proprietario accetta gli ottocento, mi dica quando possiamo firmare."
  - tutor: "Lo chiamo oggi stesso: se dice di sì, firmiamo giovedì mattina."
    goals: [conclude]

- scenario: trattativa-fornitore
  level: C2
  persona: en-m-heritage
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo per il listino, ma non solo. Al di là dell'aumento, che pure è pesante, negli ultimi tre mesi due consegne su cinque sono arrivate in ritardo."
  - tutor: "Lo so, e me ne scuso: abbiamo avuto problemi con un trasportatore."
    goals: [problem]
  - learner: "Capisco, ma non è la prima volta, e per noi un giorno di ritardo vuol dire scaffali vuoti. Un aumento del dieci per cento, con questo servizio, mi pare difficile da giustificare."
  - tutor: "Il servizio sta tornando alla normalità, glielo garantisco."
    goals: [argue]
  - learner: "Le propongo questo: accettiamo il dieci per cento, a patto che inseriate una multa per ogni consegna in ritardo, diciamo il due per cento dell'ordine."
    errors: [word-choice]
  - tutor: "Una penale per ogni ritardo... è una richiesta forte, ma la capisco."
    goals: [counteroffer]
    recast: {text: "una multa", fix: "una penale", tags: [word-choice]}
  - learner: "Garanzie a voce me ne hanno date tante, in questi anni: preferirei averle per iscritto. E se in sei mesi non ci saranno ritardi, la penale la togliamo."
  - tutor: "Mi sembra equo. Preparo l'integrazione al contratto e gliela mando entro domani."
    goals: [agreement]

- scenario: reclamo-comune
  level: C2
  persona: es-f-erasmus
  history: [subject-verb-agreement]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Abito in piazza delle Erbe, e da quando hanno aperto i nuovi locali non si dorme prima delle tre. Il regolamento dice che la musica va spenta a mezzanotte, ma nessuno lo fa rispettare."
  - tutor: "Capisco il disagio. Le segnalazioni sul rumore vengono passate alla polizia locale."
    goals: [describe]
  - learner: "Lo so, e ne ho già fatte sei. Ogni volta mi si risponde che la pattuglia è impegnata altrove. È evidente che il problema non viene preso sul serio."
  - tutor: "Non dico che lei abbia torto, ma le pattuglie notturne sono due per tutta la città."
  - learner: "Allora che il Comune ne assuma di più, o che faccia rispettare gli orari ai gestori. Non è possibile che centinaia di residenti debbano pagare per il divertimento di pochi."
  - tutor: "La sua posizione è chiarissima, e ne prendo nota."
    goals: [insist]
  - learner: "Quali strumenti ho, come residente? Possiamo fare un esposto tutti insieme, o devono farlo ognuno per conto suo?"
    errors: [subject-verb-agreement]
  - tutor: "Bella domanda. Ma «devono farlo ognuno»: con ognuno come soggetto, come va il verbo?"
    prompt: {text: "devono farlo ognuno", tags: [subject-verb-agreement]}
  - learner: "Deve farlo ognuno per conto suo, intendevo."
  - tutor: "Esatto. E no, non serve: potete presentare un esposto collettivo, firmato da tutti, all'ufficio del sindaco e alla polizia locale."
    goals: [rights]
  - learner: "Benissimo, lo prepariamo questa settimana. E lei, nel frattempo, che cosa può fare?"
  - tutor: "Inoltro oggi stesso le sue sei segnalazioni al comandante, con la richiesta di un controllo entro il fine settimana."
    goals: [commitment]

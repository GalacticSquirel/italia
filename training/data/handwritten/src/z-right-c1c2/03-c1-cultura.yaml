# Set z-right-c1c2, file 3: C1, culture and opinions. Near-misses left alone: "è chiaro che" +
# indicative, inversion ("Bello, ma inquietante"), superlative and "l'unica di cui" + subjunctive,
# "più ... di quanto" + subjunctive, "l'anno che", optional agreement with "mi", "sensibile",
# "eventualmente", "ai proprietari gli conviene", "sono dovuta uscire".
- scenario: arte-mostra
  level: C1
  persona: es-f-teacher
  history: [passive]
  turns:
  - tutor: "Guarda questo quadro. Che impressione ti fa?"
  - learner: "Mi mette un po' d'inquietudine, a dire il vero. Bello, ma inquietante: quella donna alla finestra sembra aspettare qualcuno che non arriverà mai."
  - tutor: "Inquietante è la parola giusta. Che cosa ti colpisce di più?"
    goals: [react]
  - learner: "La luce. Entra da sinistra e illumina solo il viso e le mani, mentre il resto della stanza è lasciato nell'ombra. È chiaro che il pittore voleva farci guardare proprio lì."
  - tutor: "Esatto, è una luce quasi teatrale. Sai che l'ha dipinto pochi mesi dopo la morte del marito?"
    goals: [describe]
  - learner: "Non lo sapevo. Allora la finestra cambia significato: forse non aspetta nessuno, ricorda. Il quadro è stato dipinto per sé, non per un committente?"
  - tutor: "Per sé, sì: l'ha tenuto in camera fino alla fine dei suoi giorni."
    goals: [interpret]
  - learner: "Mi ricorda Vermeer, però è più triste che i suoi quadri: nelle sue stanze c'è sempre una certa serenità."
    errors: [comparative]
  - tutor: "Vermeer, ottimo confronto! Ma «più triste che i suoi quadri»: davanti a un nome, quel «che» funziona?"
    prompt: {text: "più triste che i suoi quadri", tags: [comparative]}
  - learner: "Sì, voglio dire che è più triste che i quadri di Vermeer."
    errors: [comparative]
  - tutor: "Hai ragione, è più triste dei quadri di Vermeer: lì la finestra porta luce, qui porta assenza."
    goals: [compare]
    recast: {text: "più triste che i quadri di Vermeer", fix: "più triste dei quadri di Vermeer", tags: [comparative]}
  - learner: "Che bella frase, me la rubo. Andiamo a vedere la sala successiva?"
  - tutor: "Andiamo, ma preparati: lì ci sono i ritratti di famiglia, ancora più malinconici."
    new: [{lemma: malinconico, gloss: melancholy}]

- scenario: club-lettura
  level: C1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
  - learner: "L'ho finito ieri notte, e devo dire che le ultime cento pagine le ho divorate. L'inizio, invece, l'ho trovato lento."
  - tutor: "Lento sì, ma serve a preparare il colpo finale. E la protagonista? Io l'ho adorata."
    goals: [impression]
  - learner: "Io no, almeno all'inizio. È il personaggio più egoista che abbia mai incontrato in un romanzo. Però è anche l'unica di cui ci si possa fidare fino in fondo, e alla fine questo me l'ha resa simpatica."
  - tutor: "Ecco, la contraddizione è proprio quella. E lo stile, ti ha convinto?"
    goals: [character]
  - learner: "Molto. Frasi brevi, quasi secche, e poi all'improvviso una pagina intera senza un punto. L'autrice è molto sensibile ai silenzi: quello che i personaggi non dicono pesa più di quello che dicono."
  - tutor: "Bella osservazione. E il finale?"
    goals: [style]
  - learner: "Il finale mi ha distrutto. Ho chiuso il libro e ho rimasto in silenzio per dieci minuti."
    errors: [auxiliary-choice]
  - tutor: "Ti capisco benissimo! Ma «ho rimasto»? Ripensa un attimo all'ausiliare."
    prompt: {text: "ho rimasto", tags: [auxiliary-choice]}
  - learner: "Sono rimasto in silenzio, hai ragione. Comunque lo consiglierei a tutti, tranne a chi cerca una lettura leggera da ombrellone."
  - tutor: "Esatto. E l'ombrellone ormai è lontano: è il libro perfetto per novembre. Il prossimo lo scegli tu?"
    goals: [recommend]

- scenario: film-libro
  level: C1
  persona: es-m-worker
  history: [relative-pronoun]
  turns:
  - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
  - learner: "Comincio io. Ho letto «Il sentiero dei nidi di ragno», il primo romanzo di Calvino. Racconta la Resistenza vista da un bambino, Pin, che vive in un vicolo con la sorella."
  - tutor: "Un classico! E com'è raccontata la guerra, con gli occhi di un bambino?"
    goals: [summary]
  - learner: "In modo strano, quasi come un gioco. Pin non capisce bene chi sono i buoni e chi i cattivi, e i partigiani che incontra non sono eroi: sono uomini stanchi, a volte ridicoli."
  - tutor: "Ed è proprio questo il bello. C'è un personaggio che ti è rimasto in mente?"
  - learner: "Il Cugino, un partigiano grande e grosso che diventa il suo unico amico. La scena che camminano insieme sotto le lucciole è bellissima."
    errors: [relative-pronoun]
  - tutor: "Bellissima davvero. Ma «la scena che camminano»: ti suona bene quel «che»?"
    prompt: {text: "La scena che camminano", tags: [relative-pronoun]}
  - learner: "No: la scena in cui camminano insieme sotto le lucciole. È l'ultima pagina."
  - tutor: "Esatto, e chiude il libro con una luce inattesa."
    goals: [characters]
  - learner: "Secondo me è un libro più maturo di quanto Calvino stesso pensasse. Nella prefazione lo critica, ma io lo trovo sincero proprio perché è imperfetto."
  - tutor: "Concordo, quella prefazione è severissima. Lo consiglieresti al gruppo?"
    goals: [opinion]
  - learner: "Sì, soprattutto a chi conosce solo il Calvino delle «Città invisibili». È breve: si legge in un fine settimana."
  - tutor: "Allora è deciso, sarà la lettura di dicembre. Grazie, hai rotto il ghiaccio benissimo."
    goals: [recommend]

- scenario: intelligenza-artificiale
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Capisco la paura, ma non sono così pessimista. Credo sia uno strumento, come lo è stato il computer: cambierà il modo di lavorare, non lo eliminerà."
  - tutor: "Il computer però non scriveva le relazioni al posto tuo."
    goals: [position]
  - learner: "Vero. Però guarda il mio studio: da quando usiamo la traduzione automatica, il lavoro è aumentato, non diminuito. Si traducono più testi, e qualcuno li deve pur rivedere."
  - tutor: "Sarà un caso. Hai altri dati?"
  - learner: "Un'indagine che ho letto dimostra che le aziende che usano questi strumenti hanno assunto di più, non di meno. Ammetto però che i lavori più ripetitivi sono a rischio."
  - tutor: "Ecco, almeno questo lo ammetti. E allora?"
    goals: [evidence]
  - learner: "Su una cosa ti do ragione: è necessario che i governi intervengono presto."
    errors: [subjunctive-use]
  - tutor: "Finalmente mi dai ragione su qualcosa! Però ripeti con calma: «è necessario che i governi...»?"
    prompt: {text: "i governi intervengono", tags: [subjunctive-use]}
  - learner: "Sì, è necessario che i governi intervengono, anche a livello europeo."
    errors: [subjunctive-use]
  - tutor: "Su questo siamo d'accordo: è necessario che i governi intervengano, e in fretta, perché la tecnologia corre più delle leggi."
    goals: [concede]
    recast: {text: "i governi intervengono", fix: "i governi intervengano", tags: [subjunctive-use]}
  - learner: "Quindi, per concludere: paura no, ma attenzione sì. E tu, ti senti un po' meno pessimista?"
  - tutor: "Un pochino. Diciamo che prima ero catastrofista, ora sono solo preoccupato."
    goals: [conclude]

- scenario: intervista-podcast
  level: C1
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
  - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
  - learner: "Grazie a voi! Sono arrivata nel 2019 con l'Erasmus, a Padova. Dovevo restare sei mesi, e invece eccomi qui, cinque anni dopo."
  - tutor: "Classico! E che cosa ti ha fatto restare?"
    goals: [story]
  - learner: "Un po' l'università, un po' le persone. L'anno che ho finito la laurea mi hanno offerto un dottorato, e non ho saputo dire di no."
  - tutor: "E il primo impatto? Qualche shock culturale?"
  - learner: "Tanti! Il primo giorno sono entrata in un bar e ho chiesto un caffè con latte grande da portare via. Il barista mi ha guardato come se fossi matta."
  - tutor: "Immagino la faccia! In Spagna il caffè da portare via è normale, no?"
    goals: [culture-shock]
  - learner: "Normalissimo. E poi la cena: in Spagna ceniamo alle dieci, qui alle sette e mezza i miei coinquilini erano già a tavola."
  - tutor: "Due mondi! E c'è qualcosa che proprio non sopporti dell'Italia?"
  - learner: "La burocrazia, senza dubbio. Per il codice fiscale sono andata all'ufficio quattro volte, e ogni volta mi chiedevano un documento distinto."
    errors: [false-friend]
  - tutor: "Ogni volta un documento diverso: un classico italiano, purtroppo! Ma alla fine ne vale la pena?"
    goals: [critique]
    recast: {text: "un documento distinto", fix: "un documento diverso", tags: [false-friend]}
  - learner: "Sì, assolutamente. A chi arriva adesso direi: imparate la lingua subito, anche male, e non abbiate paura di sbagliare. Gli italiani apprezzano tantissimo chi ci prova."
  - tutor: "Consiglio d'oro. Grazie mille, è stato un piacere averti qui!"
    goals: [advice]

- scenario: notizie-attualita
  level: C1
  persona: en-m-traveller
  history: [relative-pronoun]
  turns:
  - tutor: "Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?"
  - learner: "Sì, ho letto tre articoli e ognuno diceva una cosa diversa. Pare che il governo voglia obbligare i proprietari a registrare gli appartamenti in una banca dati nazionale."
  - tutor: "Una banca dati, già. Basterà, secondo te?"
    goals: [summarise]
  - learner: "Da sola no. So che a Barcellona hanno fatto qualcosa di simile e gli affitti sono scesi un po'. Non esistono soluzioni che funzionino ovunque, ma è un inizio."
  - tutor: "Ma tu, alla fine, da che parte stai?"
  - learner: "Dalla parte di chi ci vive. Ai proprietari gli conviene affittare ai turisti, è ovvio, ma una città senza residenti non è più una città."
  - tutor: "Una posizione chiara. Io però non mi fido dei numeri che circolano."
    goals: [opinion]
  - learner: "Anch'io. Un giornale diceva che gli affitti erano scesi del venti per cento, un altro che non erano scesi affatto. Vorrei che i giornalisti citerebbero le fonti."
    errors: [subjunctive-use]
  - tutor: "Hai proprio ragione. Però «vorrei che i giornalisti citerebbero»: dopo «vorrei che» serve un altro modo."
    prompt: {text: "citerebbero", tags: [subjunctive-use]}
  - learner: "Vorrei che i giornalisti citassero le fonti, ecco. Se no ognuno tira acqua al suo mulino."
  - tutor: "Esatto, e lo fanno tutti, a destra e a sinistra."
    goals: [sources]
  - learner: "E le conseguenze? Se la legge passa, molti proprietari torneranno agli affitti lunghi, eventualmente con contratti a canone concordato."
  - tutor: "Oppure venderanno, e allora vedremo scendere i prezzi delle case. In ogni caso, se ne parlerà per mesi."
    goals: [consequences]

- scenario: dibattito-ambiente
  level: C1
  persona: en-m-retired
  history: [relative-pronoun]
  turns:
  - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
  - learner: "Io la vedo diversamente. Una città in cui si cammina bene attira più gente, non meno. Il fornaio da cui compro il pane è il primo a dire che la piazza pedonale gli ha portato clienti."
  - tutor: "Un fornaio, d'accordo. Ma chi vende mobili o lavatrici?"
    goals: [position]
  - learner: "Per loro serve un servizio di consegne, e il Comune potrebbe finanziarlo. In Spagna c'è una cittadina che ha chiuso il centro alle auto vent'anni fa, e da allora i negozi sono aumentati."
  - tutor: "Esempio interessante, ma una cittadina non è una grande città."
    goals: [argue]
  - learner: "Lo so, il paragone vale fino a un certo punto. Ma pensi ai bambini. Lei ha figli? Io ho due, e non posso mandarli a scuola in bici perché è troppo pericoloso."
    errors: [ci-ne]
  - tutor: "Capisco la preoccupazione. Però in «io ho due» c'è un pronome che si è perso per strada: quale?"
    prompt: {text: "Io ho due", tags: [ci-ne]}
  - learner: "Ne ho due, giusto. E non li lascio andare in bici: con tutte quelle macchine, non mi fido."
  - tutor: "Esatto. E su questo le do ragione: per i bambini, oggi, il centro è una giungla."
    goals: [counter]
  - learner: "Allora troviamo un punto d'incontro: all'inizio chiudiamo il centro solo nel fine settimana, e vediamo come reagiscono i negozi. Riconosco che una chiusura totale da un giorno all'altro sarebbe un rischio."
  - tutor: "Un esperimento nel fine settimana... questo potrei accettarlo anch'io."
    goals: [concede]

- scenario: modi-di-dire
  level: C1
  persona: en-f-student
  history: [tense-aspect]
  turns:
  - tutor: "Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?"
  - learner: "Non me ne parlare. Avevo un esame alle nove, e quando sono arrivata all'aula mi sono accorta che avevo lasciato la carta d'identità a casa."
  - tutor: "Ahia. E sei tornata a prenderla?"
    goals: [tell]
  - learner: "Sì, di corsa. Ma quando sono tornata, il professore aveva già chiamato tutti, e il mio nome l'aveva saltato."
  - tutor: "Ma che sfortuna nera! E poi?"
    goals: [react]
  - learner: "Mi ha detto che potevo farlo alla fine, se avevo pazienza. Ho aspettato tre ore, e sono dovuta uscire due volte per calmarmi."
  - tutor: "Tre ore! E com'è andata, alla fine?"
  - learner: "Ho preso ventisei, quindi è andata bene. Ma la colpa è mia: sono sempre con la testa sulle nuvole."
    errors: [word-choice]
  - tutor: "Ventisei, complimenti! Eh, vivere con la testa tra le nuvole costa caro. Ma un po' di colpa ce l'ha anche il professore, dai."
    goals: [blame]
    recast: {text: "con la testa sulle nuvole", fix: "con la testa tra le nuvole", tags: [word-choice]}
  - learner: "Forse. Comunque la morale è chiara: lo zaino si prepara la sera prima, non la mattina di corsa."
  - tutor: "Esatto: chi va piano va sano e va lontano. E chi prepara lo zaino la sera, pure!"
    goals: [moral]

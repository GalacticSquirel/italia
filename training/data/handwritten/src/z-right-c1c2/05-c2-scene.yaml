# Set z-right-c1c2, file 5: C2-only scenes. Near-misses left alone: "nessuno nega che vada
# rifatta", fronted che-clause resumed by "lo", "l'unico di cui abbia", "il che", "è grazie a
# lei che", "ci parlava" (= a noi), "gliela sistemo io, la credenza", "li ho potuti consultare",
# "di queste cose ne sa", "non mi ha nemmeno salutata", "più di quanto immaginassi", "purché".
- scenario: assemblea-condominio
  level: C2
  persona: en-m-retired
  history: [preposition]
  turns:
  - tutor: "Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?"
  - learner: "Sì, grazie, sarò breve. Nessuno qui nega che la facciata vada rifatta; dico solo che farlo adesso, con i prezzi attuali, sarebbe un salasso. Propongo di rinviare i lavori alla primavera."
  - tutor: "La signora del terzo piano obietta che i calcinacci cadono già sul marciapiede, e che se qualcuno si fa male la responsabilità è nostra."
    goals: [position]
  - learner: "La signora ha perfettamente ragione, e infatti non propongo di aspettare con le mani in mano. Che il cornicione sia pericoloso, lo vediamo tutti; ma per metterlo in sicurezza basta un intervento urgente, che costa un decimo."
  - tutor: "Vedo che la signora annuisce, il che è già un miracolo. Il geometra, però, sostiene che un intervento parziale sarebbe denaro buttato."
    goals: [defuse]
  - learner: "Buttato no. Se rinviamo di qualche mese, potremo chiedere più preventivi e approfittare gli incentivi annunciati per gennaio."
    errors: [preposition]
  - tutor: "Argomento interessante. Però «approfittare gli incentivi»: approfittare regge davvero un complemento diretto?"
    prompt: {text: "approfittare gli incentivi", tags: [preposition]}
  - learner: "Sì, approfittare gli incentivi, quelli per le facciate."
    errors: [preposition]
  - tutor: "Capisco: aspettare per approfittare degli incentivi potrebbe far risparmiare a tutti un buon trenta per cento. Lo metto a verbale come alternativa."
    goals: [alternative]
    recast: {text: "approfittare gli incentivi", fix: "approfittare degli incentivi", tags: [preposition]}
  - learner: "Allora formulo la proposta: messa in sicurezza del cornicione subito, rifacimento della facciata in primavera, e tre preventivi da valutare entro febbraio. Se qualcuno avesse un'idea migliore, sono tutto orecchi."
  - tutor: "Mi sembra un compromesso ragionevole per tutti. Mettiamo ai voti: chi è favorevole alzi la mano."
    goals: [compromise]

- scenario: cena-suoceri
  level: C2
  persona: en-m-traveller
  history: [register]
  turns:
  - tutor: "Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario."
  - learner: "Eccomi qui, in carne e ossa! Grazie dell'invito. Che casa splendida: quella libreria in noce è un pezzo d'antiquariato?"
  - tutor: "Ottocentesca, la mia passione. Vedo che ha occhio. E lei che cosa fa nella vita, oltre a rubarci la figlia?"
    goals: [compliment]
  - learner: "Faccio l'architetto, mi occupo soprattutto di restauri. Sono cresciuto a Edimburgo, ma mia madre è di Trieste, ed è grazie a lei che parlo italiano: in casa ci parlava solo in italiano."
  - tutor: "Un restauratore, ottimo: in questa casa c'è sempre qualcosa da aggiustare, me compreso."
    goals: [background]
  - learner: "Su questo non mi pronuncio, almeno non prima del dolce! Mi dicono però che l'arrosto lo prepara lei, e già dal profumo si capisce che è un maestro."
  - tutor: "Adulatore! Mia figlia l'ha istruito bene, vedo."
    goals: [irony]
  - learner: "Nessuna istruzione, giuro: è tutta farina del mio sacco. Anzi, se ti va, dopo cena ti aiuto a sistemare quella credenza che cigola."
    errors: [register]
  - tutor: "«Se ti va»? Ah, siamo già passati al tu, vedo! Mica male, per una prima sera."
    prompt: {text: "se ti va", tags: [register]}
  - learner: "Ha ragione, mi scusi, mi è scappato. Se le va, dopo cena gliela sistemo io, la credenza."
  - tutor: "Così va meglio. Anzi, sa che le dico? Diamoci del tu: ormai sei di famiglia, e la credenza ti aspetta."
    goals: [tu-lei]

- scenario: circolo-lettura
  level: C2
  persona: es-f-teacher
  history: [relative-pronoun]
  turns:
  - tutor: "Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po' sì."
  - learner: "Insopportabile no, testardo sì, e meno male. Un ragazzo che a dodici anni sale su un albero e non scende più: chi non l'ha sognato almeno una volta?"
  - tutor: "Io no, soffro di vertigini! Ma a parte la testardaggine, che cosa ti è rimasto?"
    goals: [impression]
  - learner: "Il rapporto con Viola. È l'unico personaggio di cui Cosimo abbia davvero paura, perché lei non accetta le sue regole. La loro storia mi è sembrata la parte più moderna del libro."
  - tutor: "Viola, già, la vera rivale degli alberi. E il senso di tutta la vicenda?"
  - learner: "La coerenza. Cosimo resta fedele per tutta la vita a una scelta presa per un piatto di lumache, il che è ridicolo e grandioso allo stesso tempo."
  - tutor: "Ridicolo e grandioso: Calvino in tre parole. E la scrittura, come l'hai trovata?"
    goals: [theme]
  - learner: "È una prosa leggera, quasi settecentesca, la quale ritmo ti porta avanti senza fatica."
    errors: [relative-pronoun]
  - tutor: "Bella definizione. Ma «la quale ritmo»: quando il relativo indica un possesso, che forma usiamo?"
    prompt: {text: "la quale ritmo", tags: [relative-pronoun]}
  - learner: "Sì: una prosa la quale ritmo è leggerissimo, volevo dire."
    errors: [relative-pronoun]
  - tutor: "Una prosa il cui ritmo è leggerissimo, sì, e che finge di essere un memoriale del Settecento. Calvino si divertiva a travestirsi."
    goals: [style]
    recast: {text: "la quale ritmo", fix: "il cui ritmo", tags: [relative-pronoun]}
  - learner: "Su una cosa però non sono d'accordo con te: il finale non è triste. Cosimo che vola via aggrappato alla mongolfiera è la conclusione più coerente che potesse avere."
  - tutor: "Triste, invece, lo è eccome: un uomo che non tocca terra nemmeno da morto."
    goals: [disagree]
  - learner: "Allora la prossima volta propongo «Il cavaliere inesistente»: lì il protagonista non ha nemmeno un corpo, così sul finale non litighiamo."
  - tutor: "Ottima scelta, e chiudiamo la trilogia. Ci vediamo tra un mese, armati di matita."
    goals: [recommend]

- scenario: condoglianze
  level: C2
  persona: en-m-heritage
  history: [imperative-form]
  turns:
  - tutor: "Grazie di essere venuto, davvero. Non doveva disturbarsi, con tutto il lavoro che ha."
  - learner: "Si figuri, era il minimo. Sono profondamente addolorato per la sua perdita. Suo padre era una persona che non si dimentica facilmente."
  - tutor: "Grazie. È stato tutto così improvviso... non ce lo aspettavamo."
    goals: [condolences]
  - learner: "Lo ricordo alla festa di Natale dell'anno scorso: è stato l'unico che abbia avuto il coraggio di ballare con il direttore. Ne parlavano tutti ancora a gennaio."
  - tutor: "È vero, era fatto così: non si prendeva mai troppo sul serio."
    goals: [memory]
  - learner: "Se ha bisogno di qualcosa, qualsiasi cosa, non esita a chiamarmi."
    errors: [imperative-form]
  - tutor: "È molto gentile. «Non esita a chiamarmi», mi diceva?"
    prompt: {text: "non esita a chiamarmi", tags: [imperative-form]}
  - learner: "Mi scusi: non esiti a chiamarmi, a qualsiasi ora. In ufficio, intanto, ci organizziamo noi: nessuno si aspetta che lei torni prima di sentirsi pronto."
  - tutor: "Lo farò, glielo prometto. Lei è sempre stato molto comprensivo, e adesso ancora di più."
    goals: [offer-help]
  - learner: "Adesso la lascio con la sua famiglia. Le sono vicino, e mi saluti sua madre."
  - tutor: "Lo farò. Grazie ancora di essere passato."
    goals: [leave]

- scenario: dialetti-regionali
  level: C2
  persona: es-m-worker
  history: [comparative]
  turns:
  - tutor: "Scusa se mi intrometto, ma ti ho visto ridere: hai capito cosa si dicevano quei due signori? Perché non è mica facile."
  - learner: "Più o meno! Ho capito che parlavano di calcio, ma una frase mi ha lasciato perplesso: uno ha detto «tengo fame». Pensavo che fosse spagnolo!"
  - tutor: "Eh, «tengo fame» è napoletano puro, ma lo senti anche nell'italiano di tanti napoletani. In spagnolo è uguale, no?"
    goals: [notice]
  - learner: "Identico. E poi ho notato che usano il passato remoto anche per cose successe stamattina: «stamattina andai al mercato». Dove lavoro io, a Milano, nessuno parla così."
  - tutor: "Esatto, al Sud il passato remoto è vivissimo, al Nord è quasi sparito dal parlato."
    goals: [example]
  - learner: "Ma allora qual è l'italiano «giusto»? Quello standard è più vicino a quello di Firenze che quello di Napoli?"
    errors: [comparative]
  - tutor: "Bella domanda. Ma rileggi la seconda metà: «che quello di Napoli». Al parallelo manca qualcosa?"
    prompt: {text: "che quello di Napoli", tags: [comparative]}
  - learner: "Sì: più vicino a quello di Firenze che quello di Napoli, intendevo."
    errors: [comparative]
  - tutor: "Storicamente sì, è più vicino a quello di Firenze che a quello di Napoli, perché nasce dal fiorentino di Dante. Ma oggi lo standard lo fa soprattutto la televisione."
    goals: [standard]
    recast: {text: "che quello di Napoli", fix: "che a quello di Napoli", tags: [comparative]}
  - learner: "Allora l'italiano di oggi è una specie di compromesso. Secondo me i dialetti arricchiscono la lingua, purché nessuno si vergogni di parlarli."
  - tutor: "Parole sante. E il mio, di dialetto, quando vuoi te lo insegno: si comincia da «tengo fame»!"
    goals: [opinion]

- scenario: email-rettore
  level: C2
  persona: en-f-student
  history: [register]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?"
  - learner: "Il mio periodo come ricercatrice ospite scade a dicembre, ma i documenti dell'archivio li ho potuti consultare solo da ottobre, perché la sala era chiusa per lavori. Vorrei chiedere una proroga di tre mesi."
  - tutor: "Capisco. Una proroga è possibile, ma la richiesta deve essere impeccabile. Come pensava di cominciare?"
    goals: [situation]
  - learner: "Con «Magnifico Rettore», visto che è la formula tradizionale. Me l'ha consigliata il mio tutor, che di queste cose ne sa più di me."
  - tutor: "Ottima scelta, il suo tutor ha ragione. E il corpo della lettera?"
    goals: [opening-formula]
  - learner: "Ho scritto così: «Le chiedo altri tre mesi, perché per colpa vostra ho perso un mese di lavoro»."
    errors: [register]
  - tutor: "Mmm, «per colpa vostra»... Le pare il tono adatto a un Rettore?"
    prompt: {text: "per colpa vostra", tags: [register]}
  - learner: "Ha ragione, è troppo diretto. Forse: «A causa della chiusura temporanea dell'archivio, non mi è stato possibile completare la ricerca nei tempi previsti»."
  - tutor: "Ecco, così sì: nessuna accusa, solo i fatti."
    goals: [tone]
  - learner: "E per congedarmi? Avevo pensato a «Con osservanza», ma non so se si usi ancora."
  - tutor: "Si usa ancora, ed è perfetto per un Rettore. Prima, magari, una riga di ringraziamento per l'attenzione."
    goals: [closing]
  - learner: "Allora: «Ringraziandola per l'attenzione, Le porgo i miei più deferenti saluti». Troppo?"
  - tutor: "Un filo barocco, ma in un ateneo il barocco è di casa. Lo lasci così."

- scenario: intervista-radio
  level: C2
  persona: es-f-erasmus
  history: [tense-aspect]
  turns:
  - tutor: "Bentornati, cari ascoltatori. In studio con noi c'è un'autrice che ha avuto il coraggio, o l'incoscienza, di scrivere un libro su di noi italiani. Benvenuta!"
  - learner: "Grazie, è un piacere. Coraggio o incoscienza, lo decideranno i lettori! Il libro si intitola «Quasi milanese» e racconta dieci anni di vita a Milano, tra uffici e portinerie."
  - tutor: "Un titolo che promette bene. Ma una straniera che spiega gli italiani agli italiani: non teme le critiche?"
    goals: [present-book]
  - learner: "Un po', ma non sono io a spiegare: lascio parlare le persone che ho incontrato. Gli stereotipi ci sono, certo, ma li ho usati per smontarli, non per confermarli."
  - tutor: "Mi faccia un esempio: quale stereotipo ha smontato?"
  - learner: "Quello del milanese freddo. La mia portinaia, il primo giorno, non mi ha nemmeno salutata; al terzo mese mi portava il minestrone quando ero malata."
  - tutor: "Il minestrone della portinaia: più efficace di qualsiasi saggio sociologico."
    goals: [stereotype]
  - learner: "Proprio così. Una volta che sono partita per un mese, mi ha lasciato un biglietto sotto la porta: «Torni presto, che senza di lei il palazzo è vuoto». Ho pianto come una bambina: fino a quel momento, in Italia, nessuno mi diceva mai una cosa così bella."
    errors: [tense-aspect]
  - tutor: "Che storia! Ma «fino a quel momento nessuno mi diceva mai»: rispetto al biglietto, quel «mai» viene prima o dopo?"
    prompt: {text: "diceva mai", tags: [tense-aspect]}
  - learner: "Prima, certo: nessuno mi diceva mai una cosa così bella, prima di quel biglietto."
    errors: [tense-aspect]
  - tutor: "Capisco: fino a quel giorno nessuno le aveva mai detto una cosa così bella. E la lingua, in tutto questo, come l'ha cambiata?"
    goals: [anecdote]
    recast: {text: "diceva mai", fix: "aveva mai detto", tags: [tense-aspect]}
  - learner: "Più di quanto immaginassi. In spagnolo sono diretta; in italiano ho imparato le sfumature: il «magari», il «semmai», il «quasi quasi»."
  - tutor: "Il «quasi quasi» è un capolavoro della nostra indecisione nazionale. Un saluto finale a chi ci ascolta?"
    goals: [language]
  - learner: "Quasi quasi vi consiglio di leggerlo! Scherzi a parte: salutate sempre la vostra portinaia."
  - tutor: "Lo faremo. Grazie di essere stata con noi, e in bocca al lupo per il libro!"
    goals: [farewell]

- scenario: poesia-montale
  level: C2
  persona: en-m-retired
  history: [hypothetical]
  turns:
  - tutor: "Lasciamo un attimo di silenzio dopo la lettura. Ecco. Che cosa le è rimasto addosso, di questi versi?"
  - learner: "Una sensazione di caldo e di fatica. Leggendola, mi sembrava quasi di sentire il sole sulla nuca."
  - tutor: "È proprio l'effetto che Montale cercava. Quale immagine l'ha colpita di più?"
    goals: [first-reading]
  - learner: "Il muro con i cocci di bottiglia, alla fine. È un'immagine povera, quotidiana, eppure è quella che dà senso a tutta la poesia: la vita come una muraglia che non si può scavalcare."
  - tutor: "Esatto, la muraglia dell'ultimo verso. E il suono, che cosa le dice?"
    goals: [image]
  - learner: "I suoni sono duri, pieni di doppie e di consonanti aspre: «schiocchi di merli», «frusci di serpi». Sembra quasi che la natura scricchioli sotto il sole."
  - tutor: "Scricchiola, sì: Montale voleva una lingua che graffiasse. E il senso ultimo, secondo lei?"
    goals: [sound]
  - learner: "Un senso di prigionia. Se Montale avrebbe scritto questa poesia da vecchio, forse sarebbe stata meno amara."
    errors: [hypothetical]
  - tutor: "Ipotesi affascinante. Ma «se Montale avrebbe scritto»: il periodo ipotetico è a posto?"
    prompt: {text: "se Montale avrebbe scritto", tags: [hypothetical]}
  - learner: "Se Montale avesse scritto questa poesia da vecchio, forse sarebbe stata meno amara. O forse no: a vent'anni era già vecchio dentro."
  - tutor: "Esatto. «Vecchio dentro a vent'anni»: la sua lettura è più profonda di quanto lei stesso creda."
    goals: [meaning]

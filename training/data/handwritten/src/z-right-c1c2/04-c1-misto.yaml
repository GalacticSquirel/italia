# Set z-right-c1c2, file 4: C1, mixed situations. Near-misses left alone: mixed hypothetical
# ("se non fossi stato... sarei tornato"), "qualcuno che sappia", "il primo progetto che si
# ripaghi", "preferisco perdere un'ora... che impazzire", "speriamo non serva", "se dovesse",
# "ci è caduto", "non me n'ero accorta", dislocations ("l'ultima parola ce l'ha il medico").
- scenario: vita-in-italia
  level: C1
  persona: en-m-heritage
  history: [hypothetical]
  turns:
  - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
  - learner: "Buongiorno a tutti. In realtà l'Italia l'ho scelta solo a metà: mio nonno era di Lecce, e a Toronto in casa si parlava un po' di dialetto. Quando ho perso il lavoro, nel 2018, mi sono detto: o adesso o mai più."
  - tutor: "O adesso o mai più: una bella scommessa. E com'è andata all'inizio?"
    goals: [story]
  - learner: "All'inizio è stata dura. Pensavo di sapere l'italiano, e invece conoscevo solo le parole di cucina di mia nonna. Per avere la cittadinanza ho aspettato tre anni, anche se ho avuto tutti i documenti dal primo giorno."
    errors: [tense-aspect]
  - tutor: "Tre anni! Ma «anche se ho avuto tutti i documenti dal primo giorno»: è un fatto puntuale o una situazione che dura?"
    prompt: {text: "ho avuto tutti i documenti", tags: [tense-aspect]}
  - learner: "Una situazione: anche se avevo tutti i documenti dal primo giorno. Mi è sembrata un'eternità."
  - tutor: "Esatto. Ci vuole una pazienza infinita, davvero."
    goals: [difficulties]
  - learner: "Se non fossi stato testardo, sarei tornato in Canada dopo sei mesi. Invece sono rimasto, e adesso ho un lavoro che mi piace in un'azienda di Bari."
  - tutor: "E in questi anni, lei come è cambiato?"
  - learner: "Sono diventato più paziente, e meno puntuale, lo confesso! E ho imparato a godermi le piccole cose: una cena con gli amici, una passeggiata sul lungomare."
  - tutor: "Una lezione molto italiana! Che consiglio darebbe a chi pensa di trasferirsi?"
    goals: [change]
  - learner: "Di venire con un piano, ma di non affezionarsi troppo al piano. Qui le cose vanno raramente come previsto, però spesso vanno meglio."
  - tutor: "Un consiglio prezioso. Grazie di essere stato con noi!"
    goals: [advice]

- scenario: colloquio-lavoro
  level: C1
  persona: es-f-teacher
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono messicana, ho trentaquattro anni e insegno spagnolo da dieci. Da due anni vivo a Torino, dove lavoro in una scuola di lingue privata."
  - tutor: "Benissimo. Mi racconti la sua esperienza."
    goals: [intro]
  - learner: "In Messico ho insegnato in un liceo per sei anni, poi ho lavorato online con aziende europee. Gli studenti più difficili che abbia mai avuto erano dirigenti che non avevano mai tempo di fare i compiti!"
  - tutor: "Li conosco bene! E quali sono i suoi punti di forza?"
    goals: [experience]
  - learner: "Sono molto organizzata e cerco sempre di rendere le lezioni divertenti. E ho molta esperienza con i studenti adulti."
    errors: [article-form]
  - tutor: "Molto bene. Solo una cosa: «i studenti»? Che articolo vuole una parola che comincia per s più consonante?"
    prompt: {text: "i studenti", tags: [article-form]}
  - learner: "Gli studenti, certo! Con gli studenti adulti mi trovo benissimo."
  - tutor: "Perfetto. E perché ha scelto proprio la nostra scuola?"
    goals: [strengths]
  - learner: "Perché siete conosciuti per i corsi aziendali, ed è proprio il settore in cui voglio crescere. Ho visto che cercate qualcuno che sappia preparare anche materiali digitali, e questo lo so fare."
  - tutor: "Proprio così. Ha qualche domanda per noi?"
    goals: [why]
  - learner: "Sì, due: quante ore settimanali prevedete, e se è possibile insegnare anche online."
  - tutor: "Venti ore, di cui cinque online, se vuole. La richiamiamo entro la settimana prossima."
    goals: [questions]

- scenario: reclamo-comune
  level: C1
  persona: es-m-worker
  history: [passive]
  turns:
  - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
  - learner: "Buongiorno. Sono qui per la buca in via Garibaldi, davanti alla scuola. È lì da due mesi, e la settimana scorsa mio figlio ci è caduto con la bici."
  - tutor: "Mi dispiace molto. Si è fatto male?"
  - learner: "Si è rotto il polso, per fortuna niente di peggio. La buca era stata segnalata da altri genitori già a settembre, ma nessuno è venuto a ripararla."
  - tutor: "Capisco. Purtroppo abbiamo centinaia di segnalazioni, e le squadre sono poche."
    goals: [describe]
  - learner: "Questa però è pericolosa. Deve essere riparata subito, prima che qualcun altro si fa male."
    errors: [subjunctive-use]
  - tutor: "Ha tutte le ragioni di insistere. Ma «prima che qualcun altro si fa male»: dopo «prima che», il modo è quello giusto?"
    prompt: {text: "qualcun altro si fa male", tags: [subjunctive-use]}
  - learner: "Sì, prima che qualcun altro si fa male, dicevo."
    errors: [subjunctive-use]
  - tutor: "Ha ragione: bisogna intervenire prima che qualcun altro si faccia male. Segno la buca come urgente, con la data dell'incidente."
    goals: [insist]
    recast: {text: "qualcun altro si fa male", fix: "qualcun altro si faccia male", tags: [subjunctive-use]}
  - learner: "E per le spese mediche? Ho qualche diritto?"
  - tutor: "Sì: può chiedere un risarcimento al Comune, presentando il referto del pronto soccorso e le foto della buca."
    goals: [rights]
  - learner: "Il referto ce l'ho qui. Le foto gliele mando stasera, appena torno a casa."
  - tutor: "Perfetto. E le prometto che entro giovedì la squadra sarà lì: la chiamo io per confermarglielo."
    goals: [commitment]

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-student
  history: [object-pronoun]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Mi dica pure, ho visto che ieri era nervosa. Che cosa è successo, esattamente?"
  - tutor: "Ogni volta che provavo a parlare, la collega del marketing mi interrompeva. Alla fine ho smesso di intervenire."
    goals: [listen]
  - learner: "Quante volte è successo? Glielo chiedo perché voglio capire se è stata una cosa di ieri o se succede sempre."
  - tutor: "Almeno tre volte ieri, e non è la prima riunione così."
    goals: [clarify]
  - learner: "Capisco. Le dico la verità: non me n'ero accorta, e mi dispiace. Penso che lei non lo faccia con cattiveria: quando è entusiasta parla sopra tutti, anche sopra di me."
  - tutor: "Sarà, ma il risultato è che le mie idee non le sente nessuno."
    goals: [perspective]
  - learner: "Ha ragione. Alla prossima riunione introdurrò una regola: chi parla finisce il suo intervento, e io controllo i tempi. E con la collega avrò una parola privata."
    errors: [word-choice]
  - tutor: "Un colloquio privato mi sembra la soluzione migliore, così nessuno si sente messo alla gogna. E la regola sui tempi mi piace."
    goals: [solution]
    recast: {text: "una parola privata", fix: "un colloquio privato", tags: [word-choice]}
  - learner: "Allora facciamo così, e tra un mese ne riparliamo. Se dovesse ripetersi, me lo dica subito, senza aspettare."
  - tutor: "D'accordo. Grazie, mi sento già più leggera."

- scenario: organizzare-matrimonio
  level: C1
  persona: en-m-retired
  history: [subjunctive-use]
  turns:
  - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
  - learner: "Grazie! Per noi è il secondo matrimonio, quindi niente di sfarzoso: pranzo in una trattoria sul mare, pochi amici e i nipoti. La mia futura moglie vuole che sia una festa, non una cerimonia."
  - tutor: "Una festa tra persone care: è la formula più bella. Quanti sarete, più o meno?"
    goals: [vision]
  - learner: "Una quarantina. Pensavamo di spendere al massimo ottomila euro, viaggio escluso. Sappiamo che è un budget ridotto, ma preferiamo investire nel viaggio."
  - tutor: "Con quaranta persone ci stiamo tranquillamente. E per la musica e gli addobbi?"
    goals: [budget]
  - learner: "Niente musica registrata, per favore! Un nostro amico suona la chitarra e ci ha promesso tre canzoni. Le fiori, invece, le vorremmo semplici, di campo."
    errors: [noun-gender]
  - tutor: "Tre canzoni dal vivo, che bello! Ma «le fiori»? Ripensi al genere della parola fiore."
    prompt: {text: "Le fiori", tags: [noun-gender]}
  - learner: "Sì, sì: le fiori di campo, margherite, papaveri..."
    errors: [noun-gender]
  - tutor: "I fiori di campo sono perfetti per un pranzo al mare: margherite e lavanda costano poco e profumano tanto."
    goals: [choices]
    recast: {text: "le fiori di campo", fix: "i fiori di campo", tags: [noun-gender]}
  - learner: "Ottimo. E le condizioni della trattoria? Bisogna pagare tutto in anticipo?"
  - tutor: "Chiedono un acconto del venti per cento, e il saldo il giorno stesso. Se piove, hanno una sala interna con vista sul mare."
    goals: [conditions]
  - learner: "Speriamo non serva! Ma è bello saperlo."
  - tutor: "Incrociamo le dita per il sole. Vi mando il preventivo domani."

- scenario: smartworking
  level: C1
  persona: en-f-professional
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Io sono tornata in ufficio a tempo pieno, e per scelta. A casa avevo un bambino piccolo e un cane, figurati: lavorare era impossibile."
  - tutor: "Ah, quindi per te l'ufficio è quasi una vacanza!"
    goals: [situation]
  - learner: "Quasi! Scherzi a parte, in ufficio sono più concentrata, e le idee migliori mi vengono davanti alla macchinetta del caffè, chiacchierando con i colleghi."
  - tutor: "Vero, quelle chiacchiere non le sostituisce nessuna videochiamata."
    new: [{lemma: videochiamata, gloss: video call}]
    goals: [pros]
  - learner: "Il lato negativo è il viaggio: quaranta minuti di tram all'andata e quaranta al ritorno. E d'inverno, col buio, è pesante."
  - tutor: "Ottanta minuti al giorno non sono pochi."
    goals: [cons]
  - learner: "No, ma preferisco perdere un'ora e mezza sul tram che impazzire a casa. Certo, se il mio capo me lo permetterebbe, farei un giorno a casa al mese."
    errors: [hypothetical]
  - tutor: "Un giorno al mese, ragionevole. Ma ascolta: «se il mio capo me lo permetterebbe». Ti suona bene?"
    prompt: {text: "se il mio capo me lo permetterebbe", tags: [hypothetical]}
  - learner: "No: se il mio capo me lo permettesse, farei un giorno a casa al mese, per le cose amministrative."
  - tutor: "Esatto. Allora, in fondo, un giorno di lavoro da casa non ti dispiacerebbe!"
    goals: [preference]

- scenario: intelligenza-artificiale
  level: C1
  persona: es-m-worker
  history: [hypothetical]
  turns:
  - tutor: "Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai."
  - learner: "Paura no, ma rispetto sì. Mia sorella fa la radiologa, e dice che i programmi che leggono le radiografie sono diventati bravissimi. Però l'ultima parola ce l'ha sempre il medico."
  - tutor: "Per ora. Ma tra qualche anno chi avrà bisogno della radiologa?"
    goals: [position]
  - learner: "Il paziente! Se la macchina sbaglia, chi ne risponde? Un programma non lo puoi mica portare in tribunale."
  - tutor: "Questo è un punto. Hai qualche esempio concreto?"
  - learner: "Sì: in un ospedale di Milano usano un sistema che trova anche i tumori più piccoli, e ora i medici hanno più tempo per attendere i pazienti."
    errors: [false-friend]
  - tutor: "Più tempo per seguire i pazienti, quindi: questo sì che è un bel risultato. Ma non temi che gli ospedali ne approfittino per tagliare il personale?"
    goals: [evidence]
    recast: {text: "attendere i pazienti", fix: "seguire i pazienti", tags: [false-friend]}
  - learner: "Un po' sì, lo ammetto. Se lo facessero, sarebbe un errore enorme, e qui hai ragione tu: servono regole chiare."
  - tutor: "Vedi che qualche ragione ce l'ho anch'io?"
    goals: [concede]
  - learner: "Ce l'hai, ce l'hai. Insomma, conclusione: la macchina aiuta, ma decide l'uomo. E finché sarà così, dormo tranquillo."
  - tutor: "Speriamo che resti così a lungo. Brindiamo alla tua radiologa, allora!"
    goals: [conclude]

- scenario: presentazione-progetto
  level: C1
  persona: es-f-erasmus
  history: [subjunctive-use]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie. Le propongo di installare pannelli solari sul tetto del magazzino di Verona. Il tetto è ampio, esposto a sud, e attualmente non è utilizzato."
  - tutor: "Pannelli solari. Me ne propongono uno all'anno. Perché il suo dovrebbe essere diverso?"
    goals: [pitch]
  - learner: "Perché è il primo progetto che si ripaghi in meno di cinque anni. Gli altri, se ricordo bene, erano basati su prezzi dell'energia più bassi di quelli di oggi."
  - tutor: "Cinque anni... E dopo?"
  - learner: "Dopo, l'energia è praticamente gratis per altri vent'anni. Risparmieremmo circa novantamila euro all'anno, senza contare l'immagine: i clienti apprezzano sempre di più le aziende sostenibili."
  - tutor: "I numeri li verificherà il controllo di gestione. Ma il tetto regge il peso?"
    goals: [benefits]
  - learner: "Sì, è stato controllato da un ingegnere a ottobre, e la sua relazione è positiva. Se la posso mandare oggi stesso."
    errors: [combined-pronouns]
  - tutor: "Ottimo, la voglio vedere. Ma «se la posso mandare»: quel «se» qui non funziona. Quale pronome serve per dire «a lei»?"
    prompt: {text: "Se la posso mandare", tags: [combined-pronouns]}
  - learner: "Gliela posso mandare oggi stesso, giusto. In spagnolo si dice proprio così, con «se»."
  - tutor: "Esatto. Bene: se la relazione è positiva, l'obiezione principale è superata."
    goals: [objection]
  - learner: "Allora, come passo successivo, preparo un preventivo con tre ditte diverse e glielo presento entro fine mese?"
  - tutor: "D'accordo. E ci metta anche gli incentivi statali: se ci sono, li voglio vedere nero su bianco."
    goals: [next-steps]

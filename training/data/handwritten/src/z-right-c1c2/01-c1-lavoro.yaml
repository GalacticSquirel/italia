# Set z-right-c1c2, file 1: C1, work. Mostly correct near-misses the tutor leaves alone:
# "so che" + indicative, superlative + subjunctive, "credo sia", modal with essere, dislocations,
# "il fatto è che" / "il fatto che", "meglio che in", "mi sa che", attualmente, eventualmente.
- scenario: colloquio-lavoro
  level: C1
  persona: en-f-professional
  history: [subjunctive-use]
  turns:
  - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
  - learner: "Buongiorno. Sono inglese e vivo a Bologna da sei anni. Attualmente lavoro come responsabile logistica in un'azienda di imballaggi."
  - tutor: "Sei anni: ormai Bologna sarà casa sua. E prima di questo lavoro, di che cosa si occupava?"
    goals: [intro]
  - learner: "Ho lavorato quattro anni a Manchester per una ditta di trasporti. Poi sono dovuta tornare a Londra per motivi familiari, e solo nel 2020 mi sono trasferita qui."
  - tutor: "Un percorso internazionale, interessante. Quali sono, secondo lei, i suoi punti di forza?"
    goals: [experience]
  - learner: "So che la mia esperienza nel vostro settore è limitata, ma so organizzare una squadra anche sotto pressione. L'anno scorso abbiamo cambiato fornitore in tre settimane senza un solo ritardo."
  - tutor: "Tre settimane è un tempo record. E perché vorrebbe lavorare proprio da noi?"
    goals: [strengths]
  - learner: "Perché siete l'azienda più innovativa che abbia trovato in Emilia. Il vostro magazzino automatico l'ho visto a una fiera a Parma, e mi ha colpito moltissimo."
  - tutor: "Ci fa piacere sentirlo. Ha qualche domanda per noi?"
    goals: [why]
  - learner: "Sì: vorrei sapere se è prevista una formazione iniziale e quante persone ci sono nel gruppo."
  - tutor: "Certo: due settimane di affiancamento, e il gruppo è di otto persone. Le faremo sapere entro venerdì."
    goals: [questions]

- scenario: colloquio-promozione
  level: C1
  persona: es-m-worker
  history: [tense-aspect]
  turns:
  - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
  - learner: "Sì, grazie. Volevo parlarle del mio ruolo. Quest'anno il mio reparto ha ridotto i resi del trenta per cento, e credo sia anche merito del sistema di controllo che ho proposto io."
  - tutor: "Lo so bene, i dati li ho visti anch'io. Quindi?"
    goals: [results]
  - learner: "Quindi vorrei diventare responsabile qualità. Da quando il vecchio responsabile è andato in pensione, quel lavoro lo faccio già io, ma senza il titolo né lo stipendio."
  - tutor: "Capisco. Il problema è che il budget di quest'anno è già chiuso."
    goals: [request]
  - learner: "Lo immaginavo. Però negli ultimi tre anni non chiedevo mai niente, e mi sembra il momento giusto."
    errors: [tense-aspect]
  - tutor: "È vero, non è uno che bussa spesso alla mia porta. Ma «negli ultimi tre anni non chiedevo mai»: è un periodo chiuso, che arriva fino a oggi. Quale tempo serve?"
    prompt: {text: "non chiedevo mai", tags: [tense-aspect]}
  - learner: "Giusto: in tre anni non ho mai chiesto niente. E se il budget è chiuso, potremmo formalizzare subito il titolo e rimandare l'aumento a gennaio."
  - tutor: "Esatto. E la proposta è ragionevole: il titolo non costa nulla, e l'aumento si può prevedere nel budget nuovo."
    goals: [handle]
  - learner: "Allora quando ne riparliamo? Così mi organizzo."
  - tutor: "Ne parlo con la direzione e ci rivediamo il quindici dicembre. Intanto mi prepari una breve relazione sui risultati."
    goals: [next-steps]

- scenario: riunione-lavoro
  level: C1
  persona: en-m-heritage
  history: [future-form]
  turns:
  - tutor: "Bene, iniziamo. Come va il tuo progetto?"
  - learner: "Abbastanza bene. Il sito nuovo è quasi pronto: mancano solo le traduzioni, che arriveranno entro giovedì."
  - tutor: "Ottimo. Ma qualcosa mi dice che c'è un «però»."
    goals: [update]
  - learner: "Eh sì. Il fatto è che il fornitore ci ha mandato foto di bassa qualità, e il fatto che nessuno se ne sia accorto prima mi preoccupa un po'."
  - tutor: "Hai ragione a preoccuparti. E l'agenzia lo sa?"
    goals: [problem]
  - learner: "Ai grafici gliel'ho detto lunedì, ma finora niente. Potremmo usare le foto del catalogo dell'anno scorso, che abbiamo fatto noi. Se le usiamo, risparmieremmo almeno duemila euro."
    errors: [hypothetical]
  - tutor: "Idea interessante. Però ascolta bene la frase: «se le usiamo, risparmieremmo». Le due metà vanno d'accordo?"
    prompt: {text: "risparmieremmo", tags: [hypothetical]}
  - learner: "Hai ragione: se le usiamo, risparmieremo almeno duemila euro. E sono foto di ottima qualità."
  - tutor: "Perfetto. Allora d'accordo, proviamo con le nostre. Per quando riesci a chiudere tutto?"
    goals: [proposal]
  - learner: "Se le traduzioni arrivano giovedì, venerdì sera il sito sarà online. Al massimo lunedì mattina."
  - tutor: "Lunedì mattina allora, come limite massimo. Mi raccomando, aggiornami venerdì."
    goals: [deadline]

- scenario: presentazione-progetto
  level: C1
  persona: es-f-teacher
  history: [register]
  turns:
  - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
  - learner: "Grazie del tempo che mi dedica. Proponiamo una piattaforma di formazione online per le filiali: oggi i corsi si fanno solo a Milano, e chi lavora al Sud deve viaggiare."
  - tutor: "Fin qui ci siamo. Ma i costi?"
    goals: [pitch]
  - learner: "L'investimento iniziale è di cinquantamila euro, ma di trasferte ne risparmiamo ottantamila all'anno. E i dati dimostrano che un dipendente su tre rinuncia ai corsi per non viaggiare."
  - tutor: "Numeri convincenti. Però i nostri dipendenti non sono esattamente nativi digitali."
    goals: [benefits]
  - learner: "Ci ho pensato. Nelle filiali non c'è nessuno che non usi il computer ogni giorno, e per i primi tre mesi prevediamo un tutor. Eventualmente si possono aggiungere due incontri in presenza."
  - tutor: "D'accordo, mi ha convinto a metà, che per me è già molto."
    goals: [objection]
  - learner: "Allora, se lei è d'accordo, partiamo con un pilota in due filiali per tre mesi."
    errors: [word-choice]
  - tutor: "Un progetto pilota in due filiali mi sembra prudente. Mi mandi una proposta scritta entro fine mese."
    goals: [next-steps]
    recast: {text: "un pilota", fix: "un progetto pilota", tags: [word-choice]}
  - learner: "Perfetto, gliela mando entro il trenta. Grazie ancora."
  - tutor: "Grazie a lei. E scelga due filiali lontane tra loro, così vediamo subito se funziona."

- scenario: mediazione-colleghi
  level: C1
  persona: en-m-traveller
  history: [subjunctive-use]
  turns:
  - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
  - learner: "Nessun disturbo, anzi, ha fatto bene a venire. Si sieda pure e mi racconti con calma."
  - tutor: "Il collega Rossi ha presentato come sua l'idea del nuovo calendario. Quell'idea l'avevo proposta io, a settembre!"
    goals: [listen]
  - learner: "Capisco che sia frustrante. Mi aiuti a capire: l'aveva proposta per scritto o a voce?"
  - tutor: "Per email, a tutto il gruppo. Ce l'ho ancora, se vuole gliela inoltro."
    goals: [clarify]
  - learner: "Sì, me la inoltri. È chiaro che c'è stato un problema di comunicazione, ma non credo che Rossi l'abbia fatto apposta: a settembre era in ferie, e quell'email forse non l'ha mai letta."
  - tutor: "Può darsi. Ma la sensazione resta: che nessuno si accorga del mio lavoro."
    goals: [perspective]
  - learner: "Questa sensazione la prendo sul serio. Alla prossima riunione dirò davanti a tutti di chi era l'idea, ma molto dipende su come lo dico."
    errors: [preposition]
  - tutor: "Lo apprezzo davvero. Ma ricontrolli quel «dipende su come»: dopo dipendere, quale preposizione ci vuole?"
    prompt: {text: "dipende su come", tags: [preposition]}
  - learner: "Dipende da come lo dico, certo. Lo dirò con leggerezza, senza accusare nessuno. E d'ora in poi le proposte le raccogliamo in un documento condiviso, con il nome di chi le fa."
  - tutor: "Esatto. Il documento condiviso mi piace: per me, a questo punto, la questione è chiusa."
    goals: [solution]

- scenario: trattativa-fornitore
  level: C1
  persona: es-f-erasmus
  history: [conditional-form]
  turns:
  - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
  - learner: "Buongiorno. Sì, la chiamo proprio per quello. L'aumento me l'aspettavo, ma non del dodici per cento: con questi prezzi i nostri biscotti diventerebbero i più cari del supermercato."
  - tutor: "La capisco, ma la farina ci costa un quarto in più rispetto a un anno fa."
    goals: [problem]
  - learner: "È vero che i costi sono saliti per tutti, però siamo vostri clienti da dieci anni e paghiamo sempre a trenta giorni. Mi pare evidente che un cliente così vale più di un listino."
  - tutor: "Su questo non discuto. Che cosa mi propone, allora?"
    goals: [argue]
  - learner: "Le proporrei un aumento del sei per cento subito, e un altro due per cento a luglio, ma solo se il prezzo della farina non sarà sceso."
  - tutor: "Sei più due... E se facessimo sette subito e niente a luglio?"
    goals: [counteroffer]
  - learner: "Sette subito è troppo. Dai, facciamo sei e mezzo e raddoppiamo l'ordine di dicembre, che ne dici?"
    errors: [register]
  - tutor: "L'ordine doppio mi interessa. Ma «che ne dici», a me? Finora ci siamo sempre dati del lei."
    prompt: {text: "che ne dici", tags: [register]}
  - learner: "Mi scusi, mi è scappato! Facciamo sei e mezzo con l'ordine doppio a dicembre: che ne dice?"
  - tutor: "Che le devo dire... sei e mezzo, affare fatto. Le mando il listino aggiornato in giornata."
    goals: [agreement]

- scenario: smartworking
  level: C1
  persona: es-m-worker
  history: [comparative]
  turns:
  - tutor: "Tu lavori ancora da casa o vai in ufficio?"
  - learner: "Da gennaio facciamo tre giorni a casa e due in ufficio. Il primo anno, invece, ci sono dovuto andare tutti i giorni, perché ero appena arrivato."
  - tutor: "Ah, una via di mezzo. E ti trovi bene?"
    goals: [situation]
  - learner: "Benissimo. A casa lavoro meglio che in ufficio: nessuno mi interrompe, e risparmio un'ora e mezza di treno al giorno."
  - tutor: "Un'ora e mezza! Sono quasi otto ore a settimana regalate a te stesso."
    goals: [pros]
  - learner: "Esatto. Però mi mancano i colleghi. A volte passo una giornata intera senza parlare con nessuno, e la sera sono più stanco di quando andavo in ufficio."
  - tutor: "Eh, la solitudine è il prezzo da pagare. E poi c'è chi non riesce più a staccare."
    goals: [cons]
  - learner: "Sì, anche quello. Mia moglie dice che sono sempre collegato, anche alla cena."
    errors: [articulated-preposition]
  - tutor: "Tua moglie ha occhio! Però «anche alla cena»: in questa espressione l'articolo serve davvero?"
    prompt: {text: "alla cena", tags: [articulated-preposition]}
  - learner: "No, hai ragione: anche a cena. Il telefono lo tengo sempre sul tavolo."
  - tutor: "Proprio così. E se potessi scegliere liberamente, che cosa faresti?"
  - learner: "Terrei questa formula: due giorni in ufficio per vedere la gente e tre a casa per concentrarmi. Mi sa che è la soluzione più equilibrata."
  - tutor: "Sono d'accordo, è il meglio dei due mondi. Ma il telefono, a cena, lascialo in un'altra stanza!"
    goals: [preference]

- scenario: politica-lavoro
  level: C1
  persona: en-f-student
  history: [hypothetical]
  turns:
  - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
  - learner: "Metà mi sembra esagerato. Sono sicura che molti lavori cambieranno, ma non credo spariranno così tanti."
  - tutor: "Ottimista, tu. E se ti sbagliassi?"
    goals: [opinion]
  - learner: "Se mi sbagliassi, lo Stato dovrebbe intervenire con corsi di formazione seri, non con i soliti bonus. Ma la storia insegna che ogni rivoluzione tecnologica ha creato più lavori di quanti ne abbia distrutti."
  - tutor: "Questa la sento sempre. Fammi un esempio concreto."
    goals: [hypothesis]
  - learner: "Pensa a mia nonna: negli anni Sessanta lavorava in una fattoria di scarpe, e quando sono arrivate le macchine tutti avevano paura. Invece lei è diventata capo reparto."
    errors: [false-friend]
  - tutor: "In una fabbrica di scarpe, quindi, e da operaia a capo reparto: bella storia. Ma oggi le macchine non sostituiscono solo le mani, anche la testa."
    goals: [example]
    recast: {text: "fattoria di scarpe", fix: "fabbrica di scarpe", tags: [false-friend]}
  - learner: "È vero, ed è questo che mi preoccupa di più. Però la gente si adatta: ci si abitua a tutto, anche a lavorare con un programma accanto."
  - tutor: "Speriamo che tu abbia ragione. Quindi, per tirare le somme?"
  - learner: "Per tirare le somme: i lavori non spariranno, cambieranno. Chi si forma resta a galla, chi aspetta rischia di affondare."
  - tutor: "Su questo, almeno, siamo d'accordo. Brindiamo ai lavori del futuro, qualunque essi siano!"
    goals: [conclude]

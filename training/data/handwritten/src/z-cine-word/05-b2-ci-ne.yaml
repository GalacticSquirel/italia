# z-cine-word, file 05 (B2): ne with di-verbs, dislocated partitive, volerne/valerne, farcela, andarsene, rinunciarci.
- scenario: assicurazione-sinistro
  level: B2
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Ieri sera, in un parcheggio, una signora ha fatto retromarcia e ha colpito il mio bumper."
      errors: [word-choice]
    - tutor: "Ha colpito il paraurti, capisco. Lei era fermo in quel momento?"
      recast: {text: "bumper", fix: "paraurti", tags: [word-choice]}
      goals: [what]
    - learner: "Sì, ero fermo e stavo per scendere. Ho suonato la tromba, ma lei non se n'era accorta."
      errors: [word-choice]
    - tutor: "Ha suonato il clacson e lei non l'ha sentito? Quindi la responsabilità sembra chiaramente sua. L'ha riconosciuto anche lei?"
      recast: {text: "la tromba", fix: "il clacson", tags: [word-choice]}
    - learner: "Sì, l'ha ammesso subito, e abbiamo compilato la constatazione amichevole insieme. Io ho fatto anche delle foto: ho fatto dieci, del paraurti e della targa."
      errors: [ci-ne]
      gold: {text: "ho fatto dieci", fix: "ne ho fatte dieci"}
    - tutor: "Benissimo, le foto sono preziose. Però «ho fatto dieci» non funziona: provi a dirlo di nuovo senza la parola «foto»."
      prompt: {text: "ho fatto dieci", tags: [ci-ne]}
      goals: [responsibility]
    - learner: "Ah, certo: ne ho fatte dieci, del paraurti e della targa."
    - tutor: "Perfetto. Me le può mandare via email, insieme alla constatazione firmata?"
      goals: [documents]
    - learner: "Certo, gliele mando oggi. E il perito quanto mette a venire? Uso la macchina tutti i giorni per lavoro."
      errors: [ci-ne]
      gold: {text: "quanto mette", fix: "quanto ci mette"}
    - tutor: "Quanto «mette»? Quando si parla del tempo necessario, a questo verbo manca un pronome."
      prompt: {text: "quanto mette", tags: [ci-ne]}
    - learner: "Sì, scusi: il perito quanto mette, più o meno?"
      errors: [ci-ne]
    - tutor: "Quanto ci mette? Di solito la contatta entro cinque giorni lavorativi e fissa la perizia dal meccanico."
      recast: {text: "quanto mette", fix: "Quanto ci mette", tags: [ci-ne]}
    - learner: "Va bene. E la franchigia? Devo pagarla io?"
    - tutor: "No, visto che la responsabilità è dell'altra parte, lei non paga nessuna franchigia."
      goals: [next]

- scenario: burocrazia-residenza
  level: B2
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno. Numero 47? Prego, mi dica."
    - learner: "Buongiorno. Mi sono trasferita qui da Valencia due mesi fa e vorrei chiedere la residenza."
    - tutor: "Bene. Ha già compilato il modulo?"
      goals: [request]
    - learner: "Sì, eccolo. Ho portato anche il contratto di alquiler e il passaporto."
      errors: [word-choice]
    - tutor: "Perfetto, il contratto d'affitto va bene. Le manca però la dichiarazione del proprietario, che conferma che lei abita lì."
      recast: {text: "il contratto di alquiler", fix: "il contratto d'affitto", tags: [word-choice]}
      goals: [documents]
    - learner: "La dichiarazione? Non ho mai sentito parlare."
      errors: [ci-ne]
      gold: {text: "Non ho mai sentito parlare", fix: "Non ne ho mai sentito parlare"}
    - tutor: "Mai sentito parlare... di che cosa? Manca un pronome che riprenda «la dichiarazione»."
      prompt: {text: "Non ho mai sentito parlare", tags: [ci-ne]}
    - learner: "Ah: non ne ho mai sentito parlare! Il problema è che il proprietario vive in Germania."
    - tutor: "Non si preoccupi, succede spesso. Il proprietario può firmarla e mandarla per email, con una copia del suo documento."
      goals: [problem]
    - learner: "Meno male. E dopo? I vigili vengono a casa a controllare, giusto?"
    - tutor: "Sì, di solito entro quarantacinque giorni. Se non la trovano, lasciano un avviso nella cassetta della posta."
    - learner: "Ma quanti avvisi lasciano, al massimo? Una mia collega dice che lasciano solo uno."
      errors: [ci-ne]
      gold: {text: "lasciano solo uno", fix: "ne lasciano solo uno"}
    - tutor: "«Lasciano solo uno»: uno che cosa? La frase ha bisogno di un pronome."
      prompt: {text: "lasciano solo uno", tags: [ci-ne]}
    - learner: "Sì, la mia collega dice che lasciano solo uno."
      errors: [ci-ne]
    - tutor: "Di solito ne lasciano solo uno, è vero, ma lei può sempre chiamare i vigili e fissare un appuntamento."
      recast: {text: "lasciano solo uno", fix: "ne lasciano solo uno", tags: [ci-ne]}
      goals: [next]
    - learner: "Perfetto, grazie mille per la pazienza."
    - tutor: "Si figuri. Torni con la dichiarazione firmata e completiamo la pratica."

- scenario: medico-specialista
  level: B2
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno. Ho visto gli esami. Come si è sentita nelle ultime settimane?"
    - learner: "Abbastanza bene, ma quando salgo le scale mi manca il fiato e il cuore batte fortissimo."
    - tutor: "Le succede anche a riposo, o solo sotto sforzo?"
      goals: [symptoms]
    - learner: "Solo sotto sforzo. Prima facevo quattro piani a piedi senza problemi; adesso, dopo due, devo fermarmi."
    - tutor: "Capisco. In famiglia qualcuno ha avuto problemi di cuore o di pressione?"
    - learner: "Sì, mio padre soffriva di pressione alta, e anche mia nonna soffriva di questo."
      errors: [ci-ne]
      gold: {text: "soffriva di questo", fix: "ne soffriva"}
    - tutor: "«Soffriva di questo» si capisce, ma suona pesante. Come lo direbbe con un solo pronome, prima del verbo?"
      prompt: {text: "soffriva di questo", tags: [ci-ne]}
    - learner: "Sì, anche mia nonna soffriva di questo."
      errors: [ci-ne]
    - tutor: "Quindi anche sua nonna ne soffriva: è un dato importante, perché la pressione alta passa spesso dai genitori ai figli."
      recast: {text: "soffriva di questo", fix: "ne soffriva", tags: [ci-ne]}
      goals: [history]
    - learner: "E gli esami cosa dicono? È grave?"
    - tutor: "Non è grave, ma la pressione è un po' alta e sotto sforzo il cuore batte in modo un po' strano."
      goals: [understand]
    - learner: "Devo prendere delle medicine? Ne prendo già due per la tiroide, e non vorrei prenderne altre."
    - tutor: "La capisco, ma in questo caso servono. Le scrivo una medicina da prendere una volta al giorno, la mattina."
    - learner: "Ci sono effetti collaterali? E lo sport? Corro tre volte alla settimana e non voglio rinunciare."
      errors: [ci-ne]
      gold: {text: "non voglio rinunciare", fix: "non voglio rinunciarci"}
    - tutor: "«Non voglio rinunciare»... a che cosa? Il verbo, da solo, resta un po' sospeso: gli manca un pronome."
      prompt: {text: "non voglio rinunciare", tags: [ci-ne]}
    - learner: "Ah, giusto: non voglio rinunciarci!"
    - tutor: "E non deve rinunciarci del tutto: corsa leggera, niente gare. All'inizio potrebbe sentirsi un po' stanca, ma di solito ci si abitua in due settimane."
      goals: [treatment]

- scenario: organizzare-matrimonio
  level: B2
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Congratulazioni! Allora, come immaginate il grande giorno?"
    - learner: "Grazie! Vorremmo una cerimonia all'aperto, in campagna, a settembre. Niente di troppo elegante."
    - tutor: "Bellissimo. Quanti invitati prevedete?"
      goals: [vision]
    - learner: "La mia fidanzata dice cento, ma la mia famiglia è enorme: solo di cugini ho trenta."
      errors: [ci-ne]
      gold: {text: "di cugini ho trenta", fix: "di cugini ne ho trenta"}
    - tutor: "Trenta cugini, che famiglia! Ma se mette «di cugini» all'inizio, nella frase serve un pronome che lo riprenda."
      prompt: {text: "di cugini ho trenta", tags: [ci-ne]}
    - learner: "Ah, sì: solo di cugini ne ho trenta!"
    - tutor: "Esatto! Allora contiamo centoventi persone. Che budget avete in mente?"
    - learner: "Circa trentamila euro, tutto compreso. È possibile?"
    - tutor: "È possibile, se scegliamo bene la location. Ho due posti da farvi vedere: una casa di campagna vicino a Siena e una villa sul lago di Garda."
      goals: [budget]
    - learner: "La casa di campagna mi piace di più: la mia fidanzata ama la Toscana. Quanto costa?"
    - tutor: "18.000 euro con il menù, mentre la villa ne chiede 22.000."
    - learner: "Allora la casa di campagna, sicuro. Il fotografo però vogliamo sceglierlo noi: è mio cugino e ci tiene molto."
    - tutor: "Nessun problema, ma deve organizzarsi con noi per gli orari."
      goals: [choices]
    - learner: "Certo. E una condizione: se ci sono costi in più, vogliamo essere informati di essi prima di firmare."
      errors: [ci-ne]
      gold: {text: "essere informati di essi", fix: "esserne informati"}
    - tutor: "Giustissimo. Però «informati di essi» suona da documento antico: con un solo pronome attaccato al verbo, come diventa?"
      prompt: {text: "essere informati di essi", tags: [ci-ne]}
    - learner: "Vogliamo essere informati di essi, sì, prima di firmare."
      errors: [ci-ne]
    - tutor: "Certo, avete il diritto di esserne informati prima di firmare: lo scriviamo nel contratto."
      recast: {text: "essere informati di essi", fix: "esserne informati", tags: [ci-ne]}
      goals: [conditions]
    - learner: "Perfetto, allora siamo d'accordo."
    - tutor: "Benissimo! Vi mando il preventivo entro venerdì."

- scenario: smartworking
  level: B2
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Da casa, quasi sempre. L'azienda ha chiuso metà degli uffici e adesso ci vado solo il venerdì."
    - tutor: "E come ti trovi?"
      goals: [situation]
    - learner: "Benissimo: niente traffico, pranzo a casa e più tempo per il gym."
      errors: [word-choice]
    - tutor: "Più tempo per la palestra e niente traffico... quindi solo vantaggi?"
      recast: {text: "il gym", fix: "la palestra", tags: [word-choice]}
      goals: [pros]
    - learner: "Non proprio. La connessione è spesso lenta: durante le videochiamate perdo pezzi di conversazione e non mi accorgo."
      errors: [ci-ne]
      gold: {text: "non mi accorgo", fix: "non me ne accorgo"}
    - tutor: "«Non mi accorgo»... di che cosa? Del fatto che perdi dei pezzi, no? Allora manca un pronome."
      prompt: {text: "non mi accorgo", tags: [ci-ne]}
    - learner: "Ah: non me ne accorgo, e poi rispondo a domande che nessuno ha fatto!"
    - tutor: "Che situazione! E l'azienda non vi aiuta a pagare internet più veloce?"
      goals: [cons]
    - learner: "Ci danno venti euro al mese, ma la fibra ne costa trenta. Comunque ho deciso di cambiare operatore."
    - tutor: "Fai bene. E i colleghi non ti mancano?"
    - learner: "Un po', sì. Il venerdì in ufficio c'è un'altra atmosfera, e le idee migliori nascono davanti alla macchinetta del caffè."
    - tutor: "Allora, potendo scegliere, cosa preferiresti?"
    - learner: "Due giorni in ufficio, forse. Ma con due ore di viaggio, non so se vale la pena."
      errors: [ci-ne]
      gold: {text: "vale la pena", fix: "ne vale la pena"}
    - tutor: "«Se vale la pena»... la pena di che cosa? Nell'espressione manca un piccolo pronome."
      prompt: {text: "vale la pena", tags: [ci-ne]}
    - learner: "Sì, appunto, non so se vale la pena."
      errors: [ci-ne]
    - tutor: "Secondo me ne vale la pena, almeno per vedere i colleghi. Perché non proponi al capo il martedì e il venerdì?"
      recast: {text: "vale la pena", fix: "ne vale la pena", tags: [ci-ne]}
      goals: [preference]
    - learner: "Buona idea, glielo propongo lunedì."
    - tutor: "Poi fammi sapere com'è andata!"

- scenario: recensione-ristorante
  level: B2
  persona: es-f-teacher
  history: [ci-ne]
  turns:
    - tutor: "Buonasera, sono il responsabile di sala. Mi hanno detto che c'è stato un problema."
    - learner: "Buonasera. Sì, mi dispiace, ma la serata è stata deludente. Abbiamo aspettato quasi un'ora per i primi."
    - tutor: "Mi dispiace molto. Mi può spiegare meglio cosa è successo?"
      goals: [complain]
    - learner: "Eravamo in quattro e abbiamo ordinato quattro piatti di pesce. Ma dopo un'ora sono arrivati solo tre."
      errors: [ci-ne]
      gold: {text: "sono arrivati solo tre", fix: "ne sono arrivati solo tre"}
    - tutor: "Solo tre... tre che cosa? Ripeta la frase con il pronome giusto."
      prompt: {text: "sono arrivati solo tre", tags: [ci-ne]}
    - learner: "Sì, sono arrivati solo tre, e il quarto venti minuti dopo."
      errors: [ci-ne]
    - tutor: "Ne sono arrivati solo tre? Quindi uno di voi ha mangiato da solo, dopo gli altri: non doveva succedere."
      recast: {text: "sono arrivati solo tre", fix: "ne sono arrivati solo tre", tags: [ci-ne]}
    - learner: "Esatto. E nel mio piatto le cozze erano pochissime: c'erano solo cinque."
      errors: [ci-ne]
      gold: {text: "c'erano solo cinque", fix: "ce n'erano solo cinque"}
    - tutor: "Cinque cozze in un piatto di pesce, davvero poche. Ma «c'erano solo cinque»: con un numero, quel «c'erano» da solo non basta."
      prompt: {text: "c'erano solo cinque", tags: [ci-ne]}
    - learner: "Ah, giusto: ce n'erano solo cinque!"
    - tutor: "Mi scuso davvero. Che cosa si sarebbe aspettata da noi, stasera?"
      goals: [detail]
    - learner: "Un servizio più attento, visto che la cena costa sessanta euro per cabeza."
      errors: [word-choice]
    - tutor: "Sessanta euro a testa: ha perfettamente ragione. Posso offrirvi il dolce e uno sconto del venti per cento sul conto?"
      recast: {text: "per cabeza", fix: "a testa", tags: [word-choice]}
      goals: [expectation]
    - learner: "Lo sconto lo accetto volentieri. Il dolce no, grazie, ma il mio amico ci tiene: adora il tiramisù."
    - tutor: "Allora un tiramisù per il signore e lo sconto sul conto. Speriamo di rivedervi presto, in una serata migliore."
      goals: [resolve]

- scenario: trattativa-affitto
  level: B2
  persona: en-f-student
  history: [ci-ne]
  turns:
    - tutor: "Allora, le è piaciuto l'appartamento?"
    - learner: "Sì, molto. Però il canone è alto per un bilocale: ne ho visti altri in zona a cento euro in meno."
    - tutor: "Capisco, ma questo è tutto nuovo. Quanto vorrebbe offrire?"
      goals: [interest]
    - learner: "Ottocentocinquanta invece di novecentocinquanta. Ho un contratto a tempo indeterminato, quindi sono una tenente affidabile."
      errors: [false-friend]
    - tutor: "Un'inquilina affidabile è sempre un buon argomento: posso parlarne con il proprietario. Lui però chiede anche tre mesi di deposito come garanzia."
      recast: {text: "una tenente affidabile", fix: "Un'inquilina affidabile", tags: [false-friend]}
      goals: [negotiate]
    - learner: "Tre mesi sono tanti. Posso dare due, al massimo."
      errors: [ci-ne]
      gold: {text: "Posso dare due", fix: "Posso darne due"}
    - tutor: "Due... due che cosa? Al verbo manca un pronome."
      prompt: {text: "Posso dare due", tags: [ci-ne]}
    - learner: "Sì, posso dare due, non di più."
      errors: [ci-ne]
    - tutor: "Se può darne due, proverò a convincerlo. Sulla durata: quattro anni più quattro, con sei mesi di preavviso per la disdetta."
      new: [{lemma: preavviso, gloss: notice}]
      recast: {text: "dare due", fix: "darne due", tags: [ci-ne]}
    - learner: "Sei mesi mi sembrano tanti. Se cambio lavoro, vorrei potermi andare con tre mesi di preavviso."
      errors: [ci-ne]
      gold: {text: "potermi andare", fix: "potermene andare"}
    - tutor: "«Potermi andare»? Così manca ancora un piccolo pronome: quale?"
      prompt: {text: "potermi andare", tags: [ci-ne]}
    - learner: "Ah: vorrei potermene andare con tre mesi di preavviso."
    - tutor: "Capisco. Chiederò tre mesi, ma non le garantisco nulla."
      goals: [conditions]
    - learner: "Va bene. Se il proprietario accetta ottocentocinquanta e tre mesi di preavviso, firmo subito. Posso contare su di lei?"
    - tutor: "Ci può contare. La chiamo domani con la risposta."
      goals: [conclude]

- scenario: vita-in-italia
  level: B2
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Benvenuta, e un saluto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie dell'invito. Sono arrivato da Bogotá otto anni fa, per amore: mia moglie è di Bari."
    - tutor: "Una storia romantica! E all'inizio com'è stato?"
      goals: [story]
    - learner: "Difficile. La lingua soprattutto: per parlare bene ho messo almeno tre anni."
      errors: [ci-ne]
      gold: {text: "ho messo almeno tre anni", fix: "ci ho messo almeno tre anni"}
    - tutor: "Tre anni, è comprensibile. Ma «ho messo»: per il tempo necessario, l'espressione ha bisogno di un pronome. Vuole riprovare?"
      prompt: {text: "ho messo almeno tre anni", tags: [ci-ne]}
    - learner: "Certo: ci ho messo almeno tre anni."
    - tutor: "Perfetto. E oltre alla lingua, qual è stata la cosa più difficile?"
    - learner: "La burocrazia, senza dubbio. Per il permesso di soggiorno facevo la cola in questura dalle cinque del mattino."
      errors: [false-friend]
    - tutor: "La fila in questura dalle cinque! Molti ascoltatori lo sanno bene. E lei come è cambiato in questi anni?"
      recast: {text: "la cola", fix: "La fila", tags: [false-friend]}
      goals: [difficulties]
    - learner: "Sono diventato più paziente. E ormai sono abituato a cenare alle nove: in Colombia ceniamo alle sette."
    - tutor: "Allora è diventato un vero italiano! Che consiglio darebbe a chi vuole trasferirsi qui?"
      goals: [change]
    - learner: "Di imparare la lingua prima di partire, e di non arrendersi con la burocrazia. È dura, ma chi ha pazienza alla fine la fa."
      errors: [ci-ne]
      gold: {text: "la fa", fix: "ce la fa"}
    - tutor: "«Alla fine la fa»? La fa... che cosa? In questa espressione manca un pezzo."
      prompt: {text: "la fa", tags: [ci-ne]}
    - learner: "Sì, chi ha pazienza la fa, sicuro."
      errors: [ci-ne]
    - tutor: "Chi ha pazienza alla fine ce la fa: un messaggio bellissimo per i nostri ascoltatori."
      recast: {text: "la fa", fix: "ce la fa", tags: [ci-ne]}
      goals: [advice]
    - learner: "Grazie a voi, è stato un piacere."
    - tutor: "Il piacere è stato nostro. Alla prossima!"

# z-cine-word, file 07 (C1): venirne a capo, rimetterci, tenerci, andarci piano, c'entrare, starci dietro, uscirne.
- scenario: assicurazione-sinistro
  level: C1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, ufficio sinistri. Mi racconti cosa è successo."
    - learner: "Buongiorno. Sabato notte qualcuno ha urtato la mia auto parcheggiata sotto casa e se n'è andato senza lasciare nemmeno un biglietto."
    - tutor: "Che brutta sorpresa. Ha idea di chi possa essere stato?"
      goals: [what]
    - learner: "Sì, un vicino ha visto tutto dalla finestra e ha annotato il numero della placca di un furgone bianco."
      errors: [word-choice]
    - tutor: "Ottimo: un testimone che ha annotato la targa cambia tutto, perché la responsabilità ricadrebbe interamente sul conducente del furgone."
      recast: {text: "il numero della placca", fix: "la targa", tags: [word-choice]}
      goals: [responsibility]
    - learner: "Speriamo. Ho provato a leggere la polizza da sola, ma tra franchigie e massimali non riesco a venire a capo."
      errors: [ci-ne]
      gold: {text: "venire a capo", fix: "venirne a capo"}
    - tutor: "La capisco, le polizze sono dei labirinti. Però «venire a capo», detto così, resta sospeso: a capo di che cosa? Manca un pronome."
      prompt: {text: "venire a capo", tags: [ci-ne]}
    - learner: "Sì, è proprio così: non riesco a venire a capo di niente."
      errors: [ci-ne]
    - tutor: "Non riesce a venirne a capo, ed è comprensibile: gliela riassumo io in due parole. Ha già fatto le foto dei danni?"
      recast: {text: "venire a capo", fix: "venirne a capo", tags: [ci-ne]}
    - learner: "Sì, ne ho fatte una ventina, e il vicino è disposto a firmare una dichiarazione."
    - tutor: "Perfetto. Visto che il conducente è fuggito, però, serve anche la denuncia ai Carabinieri."
      goals: [documents]
    - learner: "La denuncia? Pensavo che non fosse necessaria. E se non trovano il furgone, rimetto io?"
      errors: [ci-ne]
      gold: {text: "rimetto io", fix: "ci rimetto io"}
    - tutor: "«Rimetto io»? Così sembra che lei debba rimettere a posto qualcosa. Nel senso di «perdere dei soldi», al verbo manca un pronome."
      prompt: {text: "rimetto io", tags: [ci-ne]}
    - learner: "Ah, giusto: e se non trovano il furgone, ci rimetto io?"
    - tutor: "No, in quel caso interviene il Fondo di garanzia per le vittime della strada, con una franchigia di cinquecento euro. Le mando tutto per email entro stasera."
      goals: [next]

- scenario: colloquio-promozione
  level: C1
  persona: es-m-worker
  history: [ci-ne]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie del tempo. Vorrei fare il punto sull'ultimo anno, che per il mio gruppo è stato intenso ma molto positivo."
    - tutor: "Mi dica pure: ho sentito parlare molto bene del lancio in Spagna."
    - learner: "Abbiamo aperto il mercato spagnolo in sei mesi invece dei dodici previsti, e di clienti ne abbiamo acquisiti quaranta."
    - tutor: "Risultati notevoli, non c'è dubbio. Che cosa mi sta chiedendo, esattamente?"
      goals: [results]
    - learner: "Vorrei la responsabilità di tutta l'area internazionale. Ci penso da mesi, e lo tengo molto."
      errors: [ci-ne]
      gold: {text: "lo tengo molto", fix: "ci tengo molto"}
    - tutor: "«Lo tengo molto»? Con «tenere» nel senso di dare importanza a qualcosa, il pronome è un altro."
      prompt: {text: "lo tengo molto", tags: [ci-ne]}
    - learner: "Ah, certo: ci tengo molto."
    - tutor: "Lo immaginavo. Il problema è che quel ruolo richiede più esperienza di gestione di quanta lei ne abbia finora."
      goals: [request]
    - learner: "È vero che ho gestito solo sei persone, ma la gestione si impara sul campo, e ho già assistito a un corso di leadership."
      errors: [false-friend]
    - tutor: "So che ha già frequentato un corso, ed è un punto a suo favore. E se le proponessi sei mesi di prova, affiancato dall'attuale responsabile?"
      recast: {text: "assistito a un corso", fix: "frequentato un corso", tags: [false-friend]}
      goals: [handle]
    - learner: "Ci sto, a patto che dopo sei mesi la promozione diventi ufficiale."
    - tutor: "D'accordo, lo mettiamo per iscritto. Posso contare su di lei anche per il budget dell'anno prossimo?"
    - learner: "Certo, può contare."
      errors: [ci-ne]
      gold: {text: "può contare", fix: "ci può contare"}
    - tutor: "«Può contare»... su che cosa? Detto così, al verbo manca il pronome."
      prompt: {text: "può contare", tags: [ci-ne]}
    - learner: "Ci può contare!"
    - tutor: "Perfetto. Ci rivediamo a fine mese per formalizzare tutto."
      goals: [next-steps]

- scenario: dibattito-ambiente
  level: C1
  persona: en-m-heritage
  history: [ci-ne]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Capisco la preoccupazione dei negozianti, ma credo che ne vada della salute di tutti. Il traffico in centro è ormai insostenibile."
    - tutor: "Della salute? Mi sembra un'esagerazione. Che cosa c'entra la salute con qualche macchina in più?"
      goals: [position]
    - learner: "C'entra eccome: l'anno scorso le centraline hanno superato la soglia delle polveri sottili per quaranta giorni. E poi c'è un argomento economico: a Pontevedra, in Spagna, dopo la chiusura del centro hanno aperto più negozi di quanti hanno chiuso."
      errors: [ci-ne]
      gold: {text: "di quanti hanno chiuso", fix: "di quanti ne hanno chiusi"}
    - tutor: "Dati interessanti. Però «più negozi di quanti hanno chiuso» zoppica: nella seconda parte i negozi vanno ripresi. Come?"
      prompt: {text: "di quanti hanno chiuso", tags: [ci-ne]}
    - learner: "Sì, hanno aperto più negozi di quanti hanno chiuso, questo dicono i dati."
      errors: [ci-ne]
    - tutor: "Quindi ne hanno aperti più di quanti ne hanno chiusi: se è vero, è un argomento serio. Ma quella città spagnola non è la nostra: qui metà dei clienti arriva in macchina dalla provincia."
      recast: {text: "di quanti hanno chiuso", fix: "di quanti ne hanno chiusi", tags: [ci-ne]}
      goals: [argue]
    - learner: "È proprio per questo che servono parcheggi di scambio e navette. Mi rendo conto che non si fa in un giorno."
    - tutor: "Almeno su questo siamo d'accordo. Ma i commercianti non possono aspettare cinque anni."
      goals: [counter]
    - learner: "Su questo le do ragione. Bisogna andare piano: magari una chiusura parziale, solo nei fine settimana, per un anno."
      errors: [ci-ne]
      gold: {text: "andare piano", fix: "andarci piano"}
    - tutor: "«Andare piano», così, vuol dire guidare lentamente. Per dire «essere prudenti», all'espressione serve un pronome."
      prompt: {text: "andare piano", tags: [ci-ne]}
    - learner: "Sì, intendo che bisogna andare piano con i cambiamenti."
      errors: [ci-ne]
    - tutor: "Andarci piano, certo: una sperimentazione di un anno, solo nei fine settimana, potrei sostenerla anch'io."
      recast: {text: "andare piano", fix: "andarci piano", tags: [ci-ne]}
      goals: [concede]
    - learner: "Allora proponiamola insieme alla prossima assemblea di quartiere."
    - tutor: "Volentieri. Chi l'avrebbe mai detto, noi due dalla stessa parte!"

- scenario: film-libro
  level: C1
  persona: es-f-erasmus
  history: [ci-ne]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Comincio io, anche se ho barato un po': ho letto il primo volume di una saga napoletana, ma prima avevo visto la serie."
    - tutor: "Il classico dilemma: prima il libro o il film? Raccontaci la trama, senza svelare troppo."
    - learner: "È la storia di due amiche cresciute in un barrio povero di Napoli, seguite dall'infanzia fino all'età adulta."
      errors: [word-choice]
    - tutor: "Un quartiere povero di Napoli, il famoso rione. E le due protagoniste come le hai trovate?"
      recast: {text: "un barrio povero", fix: "Un quartiere povero", tags: [word-choice]}
      goals: [summary]
    - learner: "Una è geniale e insopportabile allo stesso tempo; l'altra sembra passiva, ma a lungo andare si rivela la più forte."
    - tutor: "Lettura acuta. E la serie ti è piaciuta altrettanto?"
      goals: [characters]
    - learner: "Anche di più, lo confesso: di stagioni ho visto quattro in due settimane!"
      errors: [ci-ne]
      gold: {text: "di stagioni ho visto quattro", fix: "di stagioni ne ho viste quattro"}
    - tutor: "Una maratona! Però, con «di stagioni» in testa alla frase, il seguito ha bisogno di un pronome... e di un accordo."
      prompt: {text: "di stagioni ho visto quattro", tags: [ci-ne]}
    - learner: "Ah, giusto: di stagioni ne ho viste quattro in due settimane!"
    - tutor: "Ecco. E il libro, invece? Qualcuno dice che l'inizio è faticoso."
    - learner: "Il primo volume è lento, lo ammetto: vuole pazienza per le prime cento pagine."
      errors: [ci-ne]
      gold: {text: "vuole pazienza", fix: "ci vuole pazienza"}
    - tutor: "«Vuole pazienza»? E chi la vuole? In questa espressione, che non ha un soggetto vero, manca qualcosa."
      prompt: {text: "vuole pazienza", tags: [ci-ne]}
    - learner: "Sì, all'inizio vuole molta pazienza."
      errors: [ci-ne]
    - tutor: "Ci vuole molta pazienza, è vero, ma poi la storia ti prende e non ti molla più. A chi lo consiglieresti?"
      recast: {text: "vuole molta pazienza", fix: "Ci vuole molta pazienza", tags: [ci-ne]}
      goals: [opinion]
    - learner: "A chi ama le saghe e non ha fretta. A chi vuole solo distrarsi, consiglierei qualcos'altro."
    - tutor: "Giusto. Lo mettiamo in lista per l'estate, quando c'è più tempo per leggere."
      goals: [recommend]

- scenario: politica-lavoro
  level: C1
  persona: en-m-retired
  history: [ci-ne]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Che sei il solito catastrofista. Di previsioni del genere ne ho sentite tante negli anni Ottanta, e non se n'è avverata nessuna."
    - tutor: "Stavolta è diverso: le macchine non sostituiscono più solo i muscoli, ma anche la testa."
      goals: [opinion]
    - learner: "Se fosse davvero così, i paesi più automatizzati avrebbero la disoccupazione più alta, e invece in Corea e in Germania è bassissima."
    - tutor: "Dati di oggi, però. Fammi un esempio concreto di un mestiere che si è salvato."
      goals: [hypothesis]
    - learner: "Mia figlia fa la radiologa. Dieci anni fa dicevano che l'intelligenza artificiale avrebbe sostituito i radiologi; oggi il suo ospedale cerca tre in più."
      errors: [ci-ne]
      gold: {text: "cerca tre in più", fix: "ne cerca tre in più"}
    - tutor: "Tre in più... tre che cosa? I radiologi sono spariti dalla frase: riprendili con un pronome."
      prompt: {text: "cerca tre in più", tags: [ci-ne]}
    - learner: "Sì, adesso l'ospedale cerca tre in più, perché il lavoro è aumentato."
      errors: [ci-ne]
    - tutor: "Ne cerca tre in più? Questo smonta un po' la mia teoria, lo ammetto. Ma chi ha cinquant'anni e perde il posto, come fa?"
      recast: {text: "cerca tre in più", fix: "ne cerca tre in più", tags: [ci-ne]}
      goals: [example]
    - learner: "Lì hai ragione: per loro è durissima, e molti da soli non riescono a uscire."
      errors: [ci-ne]
      gold: {text: "non riescono a uscire", fix: "non riescono a uscirne"}
    - tutor: "«Non riescono a uscire»... da dove? Da quella situazione, immagino: manca il pronome."
      prompt: {text: "non riescono a uscire", tags: [ci-ne]}
    - learner: "Sì, da soli non riescono a uscire, è questo il punto."
      errors: [ci-ne]
    - tutor: "Da soli non riescono a uscirne, appunto: servirebbe un sistema pubblico di formazione serio. E quindi, la tua conclusione?"
      recast: {text: "non riescono a uscire", fix: "non riescono a uscirne", tags: [ci-ne]}
    - learner: "Il lavoro non sparirà, ma senza politiche di formazione molti resteranno indietro. Tu che ne pensi, alla fine?"
    - tutor: "Che sei meno ingenuo di quanto pensassi. Su questo, ci sto."
      goals: [conclude]

- scenario: riunione-lavoro
  level: C1
  persona: en-f-professional
  history: [ci-ne]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Benino. La migrazione dei dati è quasi completata, ma venerdì abbiamo avuto un singhiozzo con i backup."
      errors: [word-choice]
    - tutor: "Un intoppo? Di che tipo?"
      recast: {text: "un singhiozzo", fix: "Un intoppo", tags: [word-choice]}
      new: [{lemma: intoppo, gloss: hitch}]
      goals: [update]
    - learner: "Una parte dei backup notturni era corrotta da settimane, e ce ne siamo accorti solo quando abbiamo provato a ripristinarli."
    - tutor: "Da settimane? È grave. Quanti file sono andati persi?"
      goals: [problem]
    - learner: "Pochi, per fortuna: su diecimila file abbiamo perso circa duecento, e li stiamo recuperando a mano."
      errors: [ci-ne]
      gold: {text: "abbiamo perso circa duecento", fix: "ne abbiamo persi circa duecento"}
    - tutor: "Duecento... duecento che cosa? Con «su diecimila file» davanti, la frase ha bisogno di un pronome, e il participio di un accordo."
      prompt: {text: "abbiamo perso circa duecento", tags: [ci-ne]}
    - learner: "Ah, sì: ne abbiamo persi circa duecento."
    - tutor: "Meno male, poteva andare molto peggio. Che cosa proponi?"
    - learner: "Di cambiare fornitore per i backup e aggiungere un controllo automatico ogni mattina. Ne ho già parlato con l'ufficio acquisti."
    - tutor: "Mi sembra sensato. E il vecchio fornitore che cosa dice?"
      goals: [proposal]
    - learner: "Ovviamente dice che lui non entra niente con i backup corrotti."
      errors: [ci-ne]
      gold: {text: "non entra niente", fix: "non c'entra niente"}
    - tutor: "«Non entra niente»? Detto così sembra una valigia troppo piena! Nel senso di «non avere responsabilità», al verbo manca un pezzo."
      prompt: {text: "non entra niente", tags: [ci-ne]}
    - learner: "Sì, secondo lui non entra niente, è colpa del nostro sistema."
      errors: [ci-ne]
    - tutor: "Dice che non c'entra niente? Classico. Allora chiediamo i registri dei loro server prima di pagare l'ultima fattura."
      recast: {text: "non entra niente", fix: "non c'entra niente", tags: [ci-ne]}
    - learner: "D'accordo. Quindi il passaggio al nuovo fornitore va chiuso entro il 30?"
    - tutor: "Sì, entro il 30, e mi aggiorni ogni lunedì."
      goals: [deadline]

- scenario: smartworking
  level: C1
  persona: es-f-teacher
  history: [ci-ne]
  turns:
    - tutor: "Tu lavori ancora da casa o vai in ufficio?"
    - learner: "Ormai lavoro da casa quattro giorni su cinque, e devo dire che ci ho fatto l'abitudine molto in fretta."
    - tutor: "Che fortuna. E che cosa ti piace di più?"
      goals: [situation]
    - learner: "La libertà di organizzarmi: se la mattina sono concentrata lavoro, se ho un bajón vado a correre e recupero la sera."
      errors: [word-choice]
    - tutor: "Un calo, una corsa e via: sembra il paradiso. Nessun lato negativo?"
      recast: {text: "un bajón", fix: "Un calo", tags: [word-choice]}
      goals: [pros]
    - learner: "Sì, la vita sociale ne risente parecchio. E poi il mio capo manda messaggi a tutte le ore: non riesco più a stare dietro."
      errors: [ci-ne]
      gold: {text: "stare dietro", fix: "starci dietro"}
    - tutor: "«Non riesco a stare dietro»... dietro a che cosa? Ai messaggi, immagino: al verbo manca un pronome."
      prompt: {text: "stare dietro", tags: [ci-ne]}
    - learner: "Esatto, non riesco più a stare dietro, sono troppi."
      errors: [ci-ne]
    - tutor: "Non riesci più a starci dietro, è comprensibile. Non hai mai provato a mettere dei limiti?"
      recast: {text: "stare dietro", fix: "starci dietro", tags: [ci-ne]}
      goals: [cons]
    - learner: "Ci ho provato, ma lui si molesta: dice che in ufficio eravamo più disponibili."
      errors: [false-friend]
    - tutor: "Se la prende? Classico. E allora, potendo scegliere, che cosa preferiresti?"
      recast: {text: "si molesta", fix: "se la prende", tags: [false-friend]}
    - learner: "Tre giorni a casa e due in ufficio, con orari chiari. Ne ho parlato con i colleghi e sono tutti d'accordo."
    - tutor: "Mi sembra un compromesso sensato. Proponetelo insieme, con i numeri della produttività alla mano: sarà difficile dirvi di no."
      goals: [preference]

- scenario: colloquio-lavoro
  level: C1
  persona: en-m-traveller
  history: [ci-ne]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Sono project manager, ho dodici anni di esperienza nel settore farmaceutico, gli ultimi cinque a Basilea."
    - tutor: "Interessante. Ha esperienza con lanci di nuovi farmaci su più mercati?"
      goals: [intro]
    - learner: "Sì, ho seguito dieci, quasi tutti con team internazionali e budget fino a venti milioni."
      errors: [ci-ne]
      gold: {text: "ho seguito dieci", fix: "ne ho seguiti dieci"}
    - tutor: "Dieci di che cosa, scusi? Ripeta la frase come se io non avessi appena nominato i lanci."
      prompt: {text: "ho seguito dieci", tags: [ci-ne]}
    - learner: "Ah, certo: ne ho seguiti dieci, quasi tutti con team internazionali."
    - tutor: "Notevole. Quali sono i suoi punti di forza, e un punto debole?"
      goals: [experience]
    - learner: "So mediare tra reparti che non si parlano. Il mio punto debole è l'impazienza: quando un progetto si blocca, tendo a occuparmene in prima persona invece di delegare."
    - tutor: "Un difetto da manager, direi. Perché ha scelto proprio noi?"
      goals: [strengths]
    - learner: "Perché lavorate sulle malattie rare, e mia sorella ne ha una. Per me non è solo un lavoro: credo in esso profondamente."
      errors: [ci-ne]
      gold: {text: "credo in esso", fix: "ci credo"}
    - tutor: "«Credo in esso» si capisce benissimo, ma suona da testo giuridico. Come lo direbbe in modo naturale, con un pronome breve?"
      prompt: {text: "credo in esso", tags: [ci-ne]}
    - learner: "Ci credo profondamente."
    - tutor: "E si sente. Ha qualche domanda per noi?"
      goals: [why]
    - learner: "Sì: quante persone avrei nel mio gruppo, e con quale margine di autonomia?"
    - tutor: "Sette persone, e piena autonomia sul budget operativo. Ci risentiamo entro due settimane per il secondo colloquio."
      goals: [questions]

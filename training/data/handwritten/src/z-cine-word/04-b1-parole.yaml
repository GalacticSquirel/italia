# z-cine-word, file 04 (B1): collocations, calques, false friends, sapere/conoscere, portare/prendere, sentire/ascoltare.
- scenario: reclamo-hotel
  level: B1
  persona: en-f-professional
  history: [word-choice]
  turns:
    - tutor: "Buonasera. Mi dica, c'è qualche problema?"
    - learner: "Buonasera. Sì, sono nella camera 108 e nella doccia non c'è acqua calda."
    - tutor: "Mi dispiace molto. Da quando ha questo problema?"
      goals: [problem]
    - learner: "Da stamattina. Ho chiamato la reception alle nove, mi hanno detto che arrivava un tecnico, ma nessuno è apparso."
      errors: [word-choice]
    - tutor: "Nessuno è venuto? Questo non doveva succedere, mi scusi davvero."
      recast: {text: "nessuno è apparso", fix: "nessuno è venuto", tags: [word-choice]}
      goals: [since]
    - learner: "Domani ho una riunione importante alle otto e devo lavarmi prima. Cosa possiamo fare?"
    - tutor: "Posso darle subito un'altra camera, al terzo piano, con una doccia che funziona. Le va bene?"
      goals: [request]
    - learner: "Sì, va bene. Però vorrei anche un discount sul prezzo, per la notte di ieri."
      errors: [word-choice]
    - tutor: "Uno sconto è giusto: le faccio il venti per cento sulla notte di ieri."
      recast: {text: "un discount", fix: "Uno sconto", tags: [word-choice]}
      new: [{lemma: sconto, gloss: discount}]
    - learner: "Grazie, è molto gentile. Allora porto le valigie a la camera nuova?"
      errors: [articulated-preposition]
      gold: {text: "a la camera nuova", fix: "alla camera nuova"}
    - tutor: "«A la camera»? In italiano queste due parole si uniscono. Come diventano?"
      prompt: {text: "a la camera nuova", tags: [articulated-preposition]}
    - learner: "Ah, sì: alla camera nuova!"
    - tutor: "Esatto. Ma non si preoccupi, le porta un collega. Ecco la chiave della 305, buona notte!"
      goals: [agree]

- scenario: vicino-rumoroso
  level: B1
  persona: es-f-teacher
  history: [false-friend]
  turns:
    - tutor: "Sì? Buonasera, posso aiutarla?"
    - learner: "Buonasera, sono Carmen, la vicina del secondo piano. Ha un minuto?"
    - tutor: "Piacere, Carmen! Certo, mi dica."
      goals: [greet]
    - learner: "Ecco... quando lei esce, il suo cane abbaia per ore. Il rumore molesta tutto il palazzo."
      errors: [false-friend]
    - tutor: "Disturba tutto il palazzo? Mi dispiace, non lo sapevo proprio! Per quante ore abbaia?"
      recast: {text: "molesta tutto il palazzo", fix: "disturba tutto il palazzo", tags: [false-friend]}
      goals: [problem]
    - learner: "Due o tre ore, la mattina. Io faccio lezioni online e i miei studenti sentono tutto."
    - tutor: "Mi dispiace davvero! Ha ragione, bisogna trovare una soluzione."
    - learner: "Forse potrebbe lasciarlo da qualcuno, quando va al lavoro?"
    - tutor: "Mia sorella abita qui vicino, ma lavora anche lei."
      goals: [request]
    - learner: "Oppure potrebbe pagare un ragazzo per camminarlo la mattina."
      errors: [word-choice]
    - tutor: "Portarlo a spasso la mattina? Ottima idea: al quarto piano c'è uno studente che lo fa già per altri cani."
      recast: {text: "camminarlo", fix: "Portarlo a spasso", tags: [word-choice]}
      new: [{lemma: spasso, gloss: "a spasso: for a walk"}]
    - learner: "Perfetto! Allora proviamo per una settimana e poi ne parliamo."
    - tutor: "D'accordo. Grazie per la pazienza, e mi scusi ancora."
      goals: [compromise]

- scenario: volontariato
  level: B1
  persona: en-m-retired
  history: [word-choice]
  turns:
    - tutor: "Ciao! Ti interessa fare volontariato con noi?"
    - learner: "Sì! Sono in pensione da un anno e voglio spendere il tempo libero in modo utile."
      errors: [word-choice]
    - tutor: "Passare il tempo libero aiutando gli altri è bellissimo! Che cosa sai fare?"
      recast: {text: "spendere il tempo libero", fix: "Passare il tempo libero", tags: [word-choice]}
      goals: [motivation]
    - learner: "Ho lavorato quarant'anni come elettricista. Posso aiutare gli anziani con le piccole riparazioni in casa."
    - tutor: "Un elettricista! Ci serve proprio. Sai fare anche altre cose?"
    - learner: "So riparare quasi tutto. E mia moglie conosce usare il computer molto bene."
      errors: [word-choice]
    - tutor: "Se tua moglie sa usare il computer, può fare un corso per gli anziani: ne abbiamo bisogno!"
      recast: {text: "conosce usare il computer", fix: "sa usare il computer", tags: [word-choice]}
      goals: [skills]
    - learner: "Ottima idea, glielo chiedo stasera. Quanto tempo devo dare alla settimana?"
    - tutor: "Almeno quattro ore. Tu quanto tempo hai?"
    - learner: "Tutto il tempo del mondo! Solo il giovedì porto mio nipote in piscina."
    - tutor: "Allora tutti i giorni tranne il giovedì. Preferisci le riparazioni o la compagnia agli anziani?"
      goals: [time]
    - learner: "Le riparazioni, ovviamente. Quando posso cominciare?"
    - tutor: "Lunedì prossimo! Ti presento subito il responsabile."
      goals: [choose]

- scenario: medico-base
  level: B1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Buongiorno, si accomodi. Che cosa si sente?"
    - learner: "Buongiorno, dottore. Sono molto costipato da una settimana: ho il naso chiuso e mal di gola."
      errors: [false-friend]
    - tutor: "Ah, è molto raffreddato! Attenzione, «costipato» in italiano vuol dire un'altra cosa. Ha anche la febbre?"
      recast: {text: "costipato", fix: "raffreddato", tags: [false-friend]}
      new: [{lemma: raffreddato, gloss: with a cold}]
      goals: [symptoms, since-when]
    - learner: "Ah, che vergogna! No, febbre no, ma tossisco molto di notte."
    - tutor: "Capisco. È allergico a qualche medicina?"
    - learner: "Sì, alla penicillina. Adesso prendo solo un jarabe che mi ha dato mia moglie."
      errors: [word-choice]
    - tutor: "Bene che me lo dice. Le scrivo una ricetta per una medicina per il naso e uno sciroppo senza penicillina."
      recast: {text: "un jarabe", fix: "uno sciroppo", tags: [word-choice]}
      new: [{lemma: sciroppo, gloss: syrup}]
      goals: [history]
    - learner: "Posso andare a lavorare? Lavoro in una obra, sempre all'aperto."
      errors: [word-choice]
    - tutor: "In un cantiere, all'aperto? Per tre giorni è meglio restare a casa. Le faccio un certificato per il lavoro."
      recast: {text: "in una obra", fix: "In un cantiere", tags: [word-choice]}
      new: [{lemma: certificato, gloss: sick note}, {lemma: cantiere, gloss: building site}]
    - learner: "Va bene. E la medicina per il naso, quante volte al giorno la uso?"
    - tutor: "Due volte al giorno, la mattina e la sera, per una settimana."
    - learner: "Allora: la medicina per il naso due volte al giorno, lo sciroppo la sera e tre giorni a casa. Devo pagare qualcosa? Ho solo effettivo."
      errors: [false-friend]
    - tutor: "Ha solo contanti? Non importa, qui non si paga niente. Ha capito tutto perfettamente."
      recast: {text: "effettivo", fix: "contanti", tags: [false-friend]}
      goals: [instructions]
    - learner: "Perfetto, grazie mille. Arrivederci!"
    - tutor: "Arrivederci, e si riguardi!"

- scenario: tradizioni-feste
  level: B1
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Da noi a Natale si mangia tantissimo! E da voi come si festeggia?"
    - learner: "In Spagna la festa più importante per i bambini è il 6 gennaio, il giorno dei Re Magi: arrivano i regali."
    - tutor: "Un po' come la nostra Befana! E da piccola come festeggiavi?"
      goals: [compare]
    - learner: "La notte prima lasciavamo latte e biscotti per i Re. E mia nonna mi ha imparato a fare un dolce tipico, il roscón."
      errors: [word-choice]
    - tutor: "Che bello che tua nonna ti ha insegnato a fare un dolce tipico! Lo prepari ancora?"
      recast: {text: "ha imparato a fare un dolce", fix: "ha insegnato a fare un dolce", tags: [word-choice]}
      goals: [past]
    - learner: "Sì, ne preparo uno ogni anno per i miei amici. E qui in Italia, che dolce si mangia a Natale?"
    - tutor: "Dipende dalla città, ma il panettone c'è in tutte le case."
      goals: [ask]
      new: [{lemma: panettone, gloss: Christmas cake}]
    - learner: "Il panettone mi piace tantissimo! L'anno scorso ho mangiato uno intero da sola."
      errors: [ci-ne]
      gold: {text: "ho mangiato uno intero", fix: "ne ho mangiato uno intero"}
    - tutor: "Uno intero? Uno di che cosa? Ripeti la frase con un piccolo pronome."
      prompt: {text: "ho mangiato uno intero", tags: [ci-ne]}
    - learner: "Ah: ne ho mangiato uno intero da sola!"
    - tutor: "Brava, che coraggio! Allora il 25 vieni a pranzo da noi?"
    - learner: "Volentieri! Cosa porto? Posso fare il roscón, ma devo comprare la levadura."
      errors: [word-choice]
    - tutor: "Il lievito lo trovi in tutti i supermercati. Sì, porta il tuo dolce, così facciamo una gara tra Spagna e Italia!"
      recast: {text: "la levadura", fix: "Il lievito", tags: [word-choice]}
      new: [{lemma: lievito, gloss: yeast}]
      goals: [plan]
    - learner: "Perfetto, allora a Natale!"
    - tutor: "A Natale! Ti aspettiamo all'una."

- scenario: colloquio-lavoro
  level: B1
  persona: en-m-traveller
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Tom, sono inglese e vivo a Milano da tre anni. Faccio il grafico."
    - tutor: "Bene. E che esperienza ha?"
      goals: [intro]
    - learner: "Ho lavorato cinque anni in un'agenzia a Londra. Attualmente lavoro da solo, ma preferisco lavorare in una squadra."
    - tutor: "Capisco. Quali sono i suoi punti forti?"
      goals: [experience]
    - learner: "Lavoro bene sotto pressione e rispetto sempre le linee morte."
      errors: [word-choice]
    - tutor: "Rispetta sempre le scadenze: per noi è molto importante. E un punto debole?"
      new: [{lemma: scadenza, gloss: deadline}]
      recast: {text: "le linee morte", fix: "le scadenze", tags: [word-choice]}
    - learner: "A volte sono troppo perfezionista e perdo tempo sui dettagli."
    - tutor: "Lo conosciamo bene, questo! Perché vuole lavorare con noi?"
      goals: [strengths]
    - learner: "Ho visto i vostri lavori per i musei e mi piacciono molto. Eventualmente vorrei lavorare su progetti culturali."
      errors: [false-friend]
    - tutor: "In futuro, perché no? Abbiamo diversi clienti tra musei e teatri."
      recast: {text: "Eventualmente", fix: "In futuro", tags: [false-friend]}
      goals: [why]
    - learner: "Ho una domanda: il lavoro è tutto in ufficio o anche da casa?"
    - tutor: "Due giorni alla settimana da casa, gli altri in ufficio. Le va bene?"
      goals: [questions]
    - learner: "Sì, è perfetto per me."
    - tutor: "Bene. Le faremo sapere entro la fine della settimana. Grazie e arrivederci!"

- scenario: prenotare-tavolo
  level: B1
  persona: en-f-student
  history: [word-choice]
  turns:
    - tutor: "Pronto, Trattoria da Mario, buonasera!"
    - learner: "Buonasera! Scusi, si ascolta molto male, sono in treno. Vorrei prenotare un tavolo per venerdì."
      errors: [word-choice]
    - tutor: "Sì, si sente molto male, ma la capisco. Per venerdì, quante persone?"
      recast: {text: "si ascolta molto male", fix: "si sente molto male", tags: [word-choice]}
      goals: [book]
    - learner: "Siamo sei, alle otto e mezza. È il compleanno di mio padre."
    - tutor: "Perfetto, sei persone alle otto e mezza."
      goals: [details]
    - learner: "Mia madre è celiaca: avete pasta senza glutine?"
    - tutor: "Sì, abbiamo pasta e pane senza glutine, non c'è problema."
      goals: [special]
    - learner: "Benissimo. E per il dolce, possiamo portare una torta da casa? Mio padre ha un dente dolce."
      errors: [word-choice]
    - tutor: "Se è goloso, la torta ci vuole! Sì, potete portarla."
      recast: {text: "ha un dente dolce", fix: "è goloso", tags: [word-choice]}
      new: [{lemma: goloso, gloss: with a sweet tooth}]
    - learner: "Grazie! Il nome è Wilson: W, I, L, S, O, N."
    - tutor: "Perfetto: venerdì alle otto e mezza, sei persone, con la torta. A venerdì!"
      goals: [name]

- scenario: affittare-appartamento
  level: B1
  persona: en-m-heritage
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. È molto bello e luminoso! Quant'è l'affitto al mese?"
    - tutor: "Sono settecento euro, più le spese del condominio."
    - learner: "Quanto sono le spese? E il riscaldamento è incluso?"
    - tutor: "Le spese sono cinquanta euro al mese. Il riscaldamento non è incluso: lo paga a parte."
      goals: [rent]
    - learner: "D'accordo. La lavatrice e il frigorifero lavorano bene?"
      errors: [word-choice]
    - tutor: "Sì, funzionano bene: sono nuovi, li ho comprati l'anno scorso."
      recast: {text: "lavorano bene", fix: "funzionano bene", tags: [word-choice]}
      goals: [condition]
    - learner: "E il contratto quanto dura? Quanti mesi di caparra chiede?"
    - tutor: "Quattro anni più quattro, e chiedo due mesi di caparra."
      goals: [contract]
    - learner: "Va bene. E il quartiere? Ci sono scuole vicino? Ogni mattina devo prendere i bambini a scuola prima del lavoro."
      errors: [word-choice]
    - tutor: "Per portare i bambini a scuola è perfetto: ce n'è una a cinque minuti a piedi."
      recast: {text: "prendere i bambini a scuola", fix: "portare i bambini a scuola", tags: [word-choice]}
      goals: [neighbourhood]
    - learner: "Ottimo. Sono molto interessato, ma devo parlarne con mia moglie. La chiamo domani mattina?"
    - tutor: "Certo, aspetto la sua telefonata. Arrivederci!"
      goals: [decide]

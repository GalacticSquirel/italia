# z-cine-word, file 08 (C1): calques (giocare un ruolo, alla fine del giorno, sulla stessa pagina), collocations, false friends.
- scenario: vita-in-italia
  level: C1
  persona: es-f-teacher
  history: [word-choice]
  turns:
    - tutor: "Benvenuta e benvenuto ai nostri ascoltatori. Oggi parliamo con una persona che vive in Italia da qualche anno. Perché ha scelto l'Italia?"
    - learner: "Grazie per l'invito. Sono arrivata da Montevideo nel 2015: mio nonno era emigrato da Genova e, quando ero bambina, mi contava sempre storie sull'Italia."
      errors: [false-friend]
    - tutor: "Suo nonno le raccontava sempre storie sull'Italia: in un certo senso, quindi, è tornata a casa. È stato facile, all'inizio?"
      recast: {text: "contava sempre storie", fix: "raccontava sempre storie", tags: [false-friend]}
      goals: [story]
    - learner: "Per niente. La cosa più dura è stata la burocrazia: per la cittadinanza ho aspettato quasi quattro anni, e mi è costato molto lavoro non arrendermi."
      errors: [word-choice]
    - tutor: "Le è costato molta fatica, immagino: quattro anni sono un'eternità. E lei, in che cosa è cambiata da allora?"
      recast: {text: "è costato molto lavoro", fix: "è costato molta fatica", tags: [word-choice]}
      goals: [difficulties]
    - learner: "Sono diventata più paziente, e più diffidente verso le scorciatoie. In Uruguay si risolve tutto con una telefonata; qui ho imparato che un documento scritto conta più di mille promesse."
    - tutor: "Un'osservazione molto acuta, e credo che molti ascoltatori ci si ritroveranno."
      goals: [change]
    - learner: "E ho imparato a godermi il tempo a tavola: i pranzi della domenica dai miei suoceri durano cinque ore, e all'inizio non lo sopportavo."
    - tutor: "Cinque ore sono una prova di resistenza! Che consiglio darebbe a chi sta pensando di trasferirsi qui?"
    - learner: "Di imparare la lingua sul serio, e di non prendere per garantito niente: né i tempi degli uffici, né le parole dei funzionari."
      errors: [word-choice]
    - tutor: "Non dare per scontato niente: un consiglio prezioso, soprattutto davanti a uno sportello."
      recast: {text: "prendere per garantito", fix: "dare per scontato", tags: [word-choice]}
      goals: [advice]
    - learner: "Esatto. Grazie a voi, è stato un piacere."
    - tutor: "Il piacere è stato nostro. Buona fortuna, e alla prossima!"

- scenario: mediazione-colleghi
  level: C1
  persona: en-f-professional
  history: [word-choice, false-friend]
  turns:
    - tutor: "Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù."
    - learner: "Si sieda, prego. Mi racconti tutto con calma: che cosa è successo, esattamente?"
    - tutor: "Alla riunione con il cliente, Paolo ha presentato il piano di comunicazione come se fosse solo suo. Ci abbiamo lavorato in due per tre settimane!"
    - learner: "Capisco che sia frustrante, e ha fatto bene a parlarmene. Mi sembra di capire che lei abbia perso la confidenza in Paolo."
      errors: [false-friend]
    - tutor: "Sì, ho perso la fiducia in lui, e non so se riuscirò a lavorarci ancora insieme."
      recast: {text: "la confidenza", fix: "la fiducia", tags: [false-friend]}
      goals: [listen]
    - learner: "Le faccio una domanda, senza voler difendere nessuno: Paolo ha detto esplicitamente che il lavoro era solo suo, o semplicemente non l'ha nominata?"
    - tutor: "Non ha detto che era solo suo... ma ha parlato sempre in prima persona: «ho pensato», «ho deciso»."
      goals: [clarify]
    - learner: "Conosco Paolo da anni: quando è nervoso tende a parlare così, ma non credo che lo faccia in malafede. E alla fine del giorno, il cliente sa che è un lavoro di squadra."
      errors: [word-choice]
    - tutor: "In fin dei conti sarà anche così, ma io mi sono sentita invisibile, e non è la prima volta."
      recast: {text: "alla fine del giorno", fix: "In fin dei conti", tags: [word-choice]}
      goals: [perspective]
    - learner: "La capisco. Propongo questo: ne parliamo tutti e tre insieme, e alla prossima riunione presenterete il piano in due. Così siamo tutti sulla stessa pagina."
      errors: [word-choice]
    - tutor: "Se servirà a metterci sulla stessa lunghezza d'onda, sono d'accordo. Ma voglio che Paolo riconosca il mio contributo davanti a tutti."
      recast: {text: "sulla stessa pagina", fix: "sulla stessa lunghezza d'onda", tags: [word-choice]}
      goals: [solution]
    - learner: "È giusto, e glielo chiederò io stessa. Ci vediamo domani alle dieci, tutti e tre."
    - tutor: "Grazie. Mi sento già più leggera."

- scenario: trattativa-fornitore
  level: C1
  persona: es-m-worker
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti."
    - learner: "Buongiorno. Sì, la chiamo proprio per quello: un aumento del quindici per cento, con un mese di preavviso, per noi è un colpo durissimo."
    - tutor: "Lo capisco, ma la carta e la plastica costano ormai il doppio rispetto a due anni fa."
      goals: [problem]
    - learner: "Lo so, ma siamo vostri clienti da otto anni e non abbiamo mai ritardato un pagamento. Credo che dobbiate tenere in conto anche questo."
      errors: [word-choice]
    - tutor: "Dobbiamo tenere conto di tutto, è vero, e la vostra puntualità per noi è preziosa. Ma i margini sono quelli che sono."
      recast: {text: "tenere in conto", fix: "tenere conto", tags: [word-choice]}
      goals: [argue]
    - learner: "Allora facciamo così: accettiamo un aumento del sette per cento, se ci garantite il prezzo per diciotto mesi."
    - tutor: "Il sette è troppo poco. Posso arrivare al dieci, con il prezzo bloccato per dodici mesi."
      goals: [counteroffer]
    - learner: "Il dieci è ancora alto. I nostri biscotti si vendono come pane caldo, ma i margini sono già ridotti al minimo."
      errors: [word-choice]
    - tutor: "Se i vostri biscotti vanno a ruba, aumentate gli ordini: con volumi più alti posso fare uno sforzo."
      recast: {text: "si vendono come pane caldo", fix: "vanno a ruba", tags: [word-choice]}
    - learner: "Se raddoppiamo l'ordine trimestrale, ci fate l'otto per cento con il prezzo garantito per diciotto mesi?"
    - tutor: "Otto per cento e diciotto mesi, con l'ordine raddoppiato: affare fatto. Le mando la conferma per email entro stasera."
      goals: [agreement]

- scenario: reclamo-comune
  level: C1
  persona: es-f-erasmus
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, mi dica pure. Di che cosa si tratta?"
    - learner: "Buongiorno. Abito in via dei Mille: da due mesi davanti a casa mia c'è un cantiere abbandonato, con le transenne in mezzo al marciapiede e nessun obrero."
      errors: [word-choice]
    - tutor: "Nessun operaio da due mesi, capisco. Ha già presentato qualcosa per iscritto?"
      recast: {text: "nessun obrero", fix: "Nessun operaio", tags: [word-choice]}
      goals: [describe]
    - learner: "Sì, ho fatto una petizione all'ufficio tecnico a settembre, ma nessuno mi ha risposto."
      errors: [false-friend]
    - tutor: "Ha già fatto una segnalazione a settembre, quindi. Probabilmente i lavori sono fermi per qualche problema con la ditta."
      recast: {text: "fatto una petizione", fix: "fatto una segnalazione", tags: [false-friend]}
    - learner: "Con tutto il rispetto, «probabilmente» non mi basta. Mia madre ha ottant'anni e per uscire deve camminare in mezzo alla strada: è pericoloso."
    - tutor: "Ha perfettamente ragione. Purtroppo da qui non ho accesso alle pratiche dell'ufficio tecnico."
      goals: [insist]
    - learner: "Allora vorrei sapere qual è la procedura formale. Ho diritto a una risposta scritta entro un plazo preciso?"
      errors: [word-choice]
    - tutor: "Sì, c'è un termine preciso: se presenta un reclamo formale, il Comune è tenuto a risponderle entro trenta giorni."
      recast: {text: "un plazo preciso", fix: "un termine preciso", tags: [word-choice]}
      goals: [rights]
    - learner: "Bene, lo presento subito. Ma nel frattempo? Non posso esperare trenta giorni con mia madre chiusa in casa."
      errors: [word-choice]
    - tutor: "Non può aspettare trenta giorni, ha ragione: allego al reclamo una richiesta di intervento urgente per la sicurezza del marciapiede."
      recast: {text: "esperare trenta giorni", fix: "aspettare trenta giorni", tags: [word-choice]}
    - learner: "Grazie. Mi può dare un numero di protocollo?"
    - tutor: "Certo: è il 4521. Con questo numero può seguire la pratica anche online."
      goals: [commitment]

- scenario: presentazione-progetto
  level: C1
  persona: en-m-heritage
  history: [word-choice]
  turns:
    - tutor: "Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto."
    - learner: "Grazie. In breve: vogliamo digitalizzare l'archivio clienti, che oggi è ancora per metà su carta. Il progetto gioca un ruolo chiave nella nostra strategia per i prossimi tre anni."
      errors: [word-choice]
    - tutor: "Svolge un ruolo chiave, dice lei. Ma in concreto, che cosa ci guadagniamo?"
      recast: {text: "gioca un ruolo chiave", fix: "Svolge un ruolo chiave", tags: [word-choice]}
      goals: [pitch]
    - learner: "Tre cose: i tempi di risposta ai clienti scenderebbero da cinque giorni a uno, eviteremmo gli errori di trascrizione e libereremmo due persone per l'attività commerciale."
    - tutor: "Cifre interessanti. E quanto costa?"
      goals: [benefits]
    - learner: "Centoventimila euro, distribuiti su due anni. Il ritorno dell'investimento è previsto entro trenta mesi."
    - tutor: "Centoventimila euro, in un anno difficile. E se il fornitore del software fallisce a metà strada? Non voglio correre rischi inutili."
    - learner: "Capisco la preoccupazione. Per questo abbiamo scelto un software aperto: se il fornitore sparisce, possiamo cambiarlo senza perdere i dati. E lo pagheremo in installments, solo a obiettivi raggiunti."
      errors: [word-choice]
    - tutor: "Pagare a rate, solo a obiettivi raggiunti: questo mi rassicura. E come partireste?"
      recast: {text: "in installments", fix: "a rate", tags: [word-choice]}
      new: [{lemma: rata, gloss: instalment}]
      goals: [objection]
    - learner: "Con un progetto pilota in un solo reparto, per tre mesi, così misuriamo i risultati prima di estenderlo. Vorrei introdurre anche la collega che ha preparato l'analisi dei costi: potrebbe venire alla prossima riunione?"
      errors: [false-friend]
    - tutor: "Volentieri, me la può presentare giovedì alle nove: in quell'occasione decidiamo il budget del pilota."
      recast: {text: "introdurre", fix: "presentare", tags: [false-friend]}
      goals: [next-steps]
    - learner: "Perfetto, giovedì alle nove. Grazie del tempo."
    - tutor: "Grazie a lei. A giovedì."

- scenario: intervista-podcast
  level: C1
  persona: en-f-student
  history: [word-choice]
  turns:
    - tutor: "Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivata proprio in Italia?"
    - learner: "Ciao, grazie a te! È cominciato tutto con un Erasmus a Bologna, dieci anni fa: dovevo restare sei mesi, e invece eccomi qua."
    - tutor: "Il classico anno di studio all'estero che non finisce mai! E che cosa ti ha sorpresa di più, all'inizio?"
      goals: [story]
    - learner: "Il rapporto con il tempo. La prima volta che un amico mi ha detto «ci vediamo alle otto», io ero lì alle otto affilate, e lui è arrivato alle nove meno un quarto come se niente fosse."
      errors: [word-choice]
    - tutor: "Tu alle otto in punto e lui alle nove meno un quarto: il famoso quarto d'ora accademico, un po' allungato! E c'è qualcosa che proprio non ti va giù?"
      recast: {text: "alle otto affilate", fix: "alle otto in punto", tags: [word-choice]}
      goals: [culture-shock]
    - learner: "La burocrazia. Per rinnovare la carta d'identità ho dovuto andare in Comune tre volte: costa un braccio e una gamba, almeno in termini di tempo."
      errors: [word-choice]
    - tutor: "Costa un occhio della testa, in termini di tempo, hai ragione. Ma secondo te dov'è il vero problema?"
      recast: {text: "costa un braccio e una gamba", fix: "costa un occhio della testa", tags: [word-choice]}
    - learner: "Non nelle persone, che spesso fanno miracoli, ma nei processi: molte pratiche si potrebbero fare online, e invece si va ancora allo sportello con la marca da bollo."
    - tutor: "Critica giusta, e fatta con eleganza. A chi sta pensando di trasferirsi in Italia, che cosa consiglieresti?"
      goals: [critique]
    - learner: "Di non idealizzare l'Italia delle vacanze: viverci è un'altra cosa. Bisogna mettere molto sforzo per integrarsi, soprattutto con la lingua."
      errors: [word-choice]
    - tutor: "Impegnarsi molto, soprattutto con la lingua: un consiglio sacrosanto. Grazie, è stata una chiacchierata bellissima!"
      recast: {text: "mettere molto sforzo", fix: "Impegnarsi molto", tags: [word-choice]}
      goals: [advice]
    - learner: "Grazie a te, mi sono divertita tantissimo!"
    - tutor: "Alla prossima, allora, e buon ascolto a tutti!"

- scenario: turismo-di-massa
  level: C1
  persona: en-m-retired
  history: [word-choice]
  turns:
    - tutor: "Abbiamo in linea un'altra persona. Buongiorno, è in diretta! Lei è a favore o contro il ticket d'ingresso?"
    - learner: "Buongiorno, mi chiamo Peter, sono inglese ma vivo a Venezia da vent'anni. Sono a favore del ticket, anche se da solo non basta."
    - tutor: "Un residente, quindi! Perché a favore?"
      goals: [introduce]
    - learner: "Perché il centro storico è al collasso. Nel mio palazzo eravamo otto famiglie: sei se ne sono andate in ordine di trovare case più economiche in terraferma."
      errors: [word-choice]
    - tutor: "Se ne sono andate per trovare case più economiche, certo. Ma il ticket non rischia di trasformare Venezia in un museo a pagamento?"
      recast: {text: "in ordine di trovare", fix: "per trovare", tags: [word-choice]}
      goals: [example]
    - learner: "Il rischio esiste, ma è già un museo, e per giunta gratuito. Il ticket almeno scoraggia le gite di poche ore, che portano folla e pochissimi soldi."
    - tutor: "Eppure i commercianti sostengono che anche i turisti di giornata spendono."
      goals: [rebut]
    - learner: "Spendono in panini e souvenir prodotti altrove. L'economia locale, quella vera, ne ricava poco."
    - tutor: "E quindi, la sua proposta?"
    - learner: "Un tetto giornaliero di ingressi con prenotazione obbligatoria, e i soldi del ticket usati per gli affitti dei residenti. Bisogna prendere un approccio più coraggioso."
      errors: [word-choice]
    - tutor: "Adottare un approccio più coraggioso: tetto agli ingressi e fondi per la casa. Proposta chiarissima, grazie!"
      recast: {text: "prendere un approccio più coraggioso", fix: "Adottare un approccio più coraggioso", tags: [word-choice]}
      goals: [proposal]
    - learner: "Grazie a voi per lo spazio."
    - tutor: "È stato un piacere. Passiamo subito a un'altra telefonata!"

- scenario: club-lettura
  level: C1
  persona: es-m-worker
  history: [false-friend]
  turns:
    - tutor: "Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti."
    - learner: "Sì, l'ho finito ieri notte. Mi è piaciuto, però la prima parte è molto larga: più di duecento pagine prima che succeda qualcosa."
      errors: [false-friend]
    - tutor: "La prima parte è molto lunga, lo ammetto anch'io: duecento pagine di preparazione. Ma nel complesso ti ha convinto?"
      recast: {text: "molto larga", fix: "molto lunga", tags: [false-friend]}
    - learner: "Nel complesso sì. Il ritratto dell'Italia del dopoguerra è vivido, e il finale mi ha lasciato un nodo in gola."
    - tutor: "Anche a me! E Teresa, la madre? Io l'ho trovata straordinaria."
      goals: [impression]
    - learner: "Io meno. Capisco che non avesse alternative, ma lasciare il figlio più piccolo ai parenti per anni... Non riesco a giustificarla, anche se l'autore fa di tutto per renderla simpatica."
    - tutor: "Io la vedo piuttosto come una vittima delle circostanze. E lo stile, invece?"
      goals: [character]
    - learner: "La redazione è sobria, quasi giornalistica: l'autore non cerca mai l'effetto facile."
      errors: [false-friend]
    - tutor: "La scrittura è sobria, sì, quasi da cronaca: secondo me è il suo vero punto di forza. A chi lo consiglieresti?"
      recast: {text: "La redazione", fix: "La scrittura", tags: [false-friend]}
      goals: [style]
    - learner: "A chi ama i romanzi storici e non ha fretta; a chi cerca colpi di scena, invece, no."
    - tutor: "Sottoscrivo. Il mese prossimo, però, scegli tu: e niente mattoni da seicento pagine!"
      goals: [recommend]

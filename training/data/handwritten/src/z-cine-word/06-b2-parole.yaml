# z-cine-word, file 06 (B2): collocations (dare/fare/prendere), calques, false friends (esito, attualmente, sensibile, realizzare).
- scenario: arte-mostra
  level: B2
  persona: en-f-student
  history: [word-choice]
  turns:
    - tutor: "Guarda questo quadro. Che impressione ti fa?"
    - learner: "Mi colpisce subito: è pieno di luce, quasi accecante. Mi mette di buon umore."
    - tutor: "Vero, la luce è la cosa più forte. Cosa vedi, esattamente?"
      goals: [react]
    - learner: "In primo piano c'è una donna che legge vicino a una finestra, e nel fondo si vede un porto con delle barche."
      errors: [word-choice]
    - tutor: "Sullo sfondo, sì: un porto, con barche dipinte in modo veloce, quasi delle macchie di colore."
      recast: {text: "nel fondo", fix: "Sullo sfondo", tags: [word-choice]}
      goals: [describe]
    - learner: "Secondo me la donna aspetta qualcuno che arriva dal mare. Forse il marito, un pescatore."
    - tutor: "Lettura romantica! Io ci vedo piuttosto una donna che si gode un momento tutto per sé."
      goals: [interpret]
    - learner: "Può darsi: in effetti guarda il libro, non il mare."
    - tutor: "Appunto. Ti ricorda qualche altro pittore?"
    - learner: "Un po' Vermeer, per la luce che entra dalla finestra. Ma qui i colori sono molto più vivi, quasi impressionisti."
    - tutor: "Ottimo confronto. Lui però dipingeva una luce calma e ferma; qui invece tutto si muove."
      goals: [compare]
    - learner: "Hai ragione. Andiamo a prendere un'occhiata alla sala successiva?"
      errors: [word-choice]
    - tutor: "Sì, andiamo a dare un'occhiata: di là ci sono i volti dei grandi pittori, ti piaceranno."
      recast: {text: "prendere un'occhiata", fix: "dare un'occhiata", tags: [word-choice]}
    - learner: "Perfetto, i volti sono i miei soggetti preferiti."
    - tutor: "Allora andiamo, e poi mi dici quale ti porteresti a casa!"

- scenario: colloquio-lavoro
  level: B2
  persona: es-f-teacher
  history: [false-friend, word-choice]
  turns:
    - tutor: "Buongiorno, si accomodi. Mi parli un po' di lei."
    - learner: "Buongiorno. Mi chiamo Ana, sono di Siviglia e da dieci anni insegno spagnolo. Adesso vorrei lavorare nella formazione aziendale."
    - tutor: "Un bel cambiamento. Che cosa ha fatto finora?"
      goals: [intro]
    - learner: "Ho insegnato in una scuola di lingue e ho organizzato corsi per aziende. Il mio ultimo progetto è stato un esito: trenta dipendenti hanno superato l'esame."
      errors: [false-friend]
    - tutor: "Un successo, direi, con trenta esami superati! Come ha organizzato il corso?"
      recast: {text: "un esito", fix: "Un successo", tags: [false-friend]}
      goals: [experience]
    - learner: "Ho diviso il gruppo per livelli e ho preparato materiali sul loro lavoro reale: email, telefonate, riunioni."
    - tutor: "Ottimo metodo. Quali sono i suoi punti di forza, e un punto debole?"
    - learner: "Sono organizzata e paziente. Il mio difetto è che a volte non so dire di no e accetto troppi incarichi."
    - tutor: "È un difetto molto comune. Perché vuole lavorare proprio con noi?"
      goals: [strengths]
    - learner: "Perché lavorate con aziende internazionali. Ho applicato per questo posto appena ho visto l'annuncio."
      errors: [word-choice]
    - tutor: "Ha fatto domanda per questo posto al momento giusto: stiamo crescendo molto."
      recast: {text: "applicato per questo posto", fix: "fatto domanda per questo posto", tags: [word-choice]}
      goals: [why]
    - learner: "Che bello. Posso fare una domanda? Il lavoro prevede viaggi?"
    - tutor: "Sì, due o tre volte al mese, in Italia e in Spagna."
      goals: [questions]

- scenario: colloquio-promozione
  level: B2
  persona: en-m-heritage
  history: [word-choice]
  turns:
    - tutor: "Prego, si sieda. Voleva parlarmi di qualcosa?"
    - learner: "Sì, grazie. Vorrei parlarle dei miei risultati di quest'anno e del mio futuro in azienda."
    - tutor: "Volentieri, mi dica."
    - learner: "Quest'anno ho firmato quattro nuovi clienti, e il mio reparto ha aumentato il fatturato del dodici per cento."
      errors: [word-choice]
    - tutor: "Ha acquisito quattro nuovi clienti: sono risultati notevoli, lo riconosco."
      recast: {text: "firmato quattro nuovi clienti", fix: "acquisito quattro nuovi clienti", tags: [word-choice]}
      new: [{lemma: acquisire, gloss: to win (clients)}]
      goals: [results]
    - learner: "Per questo credo di meritare una promozione. Vorrei chiedere per un aumento e più responsabilità."
      errors: [word-choice]
    - tutor: "Chiedere un aumento dopo un anno così è legittimo. Però il budget di quest'anno è già chiuso."
      recast: {text: "chiedere per un aumento", fix: "Chiedere un aumento", tags: [word-choice]}
      goals: [request]
    - learner: "Capisco, ma non fa senso aspettare un altro anno: un'altra azienda mi ha già contattato."
      errors: [word-choice]
    - tutor: "Non ha senso perdere una persona come lei, su questo siamo d'accordo. Vediamo che cosa possiamo fare."
      recast: {text: "non fa senso", fix: "Non ha senso", tags: [word-choice]}
    - learner: "Potremmo fare così: la promozione adesso e l'aumento a gennaio, con il nuovo budget."
    - tutor: "Mi sembra una proposta ragionevole. Ne parlo con la direzione e le do una risposta entro venerdì."
      goals: [handle]
    - learner: "Perfetto. Allora ci rivediamo venerdì per prendere la decisione finale?"
    - tutor: "Sì, venerdì alle dieci. Grazie per essere stato così chiaro."
      goals: [next-steps]

- scenario: dibattito-ambiente
  level: B2
  persona: es-m-worker
  history: [false-friend, word-choice]
  turns:
    - tutor: "Secondo me chiudere il centro alle auto sarebbe un disastro per i negozi. Lei cosa ne pensa?"
    - learner: "Io non sono d'accordo. Chiudere il centro è positivo, soprattutto per la contaminazione dell'aria."
      errors: [false-friend]
    - tutor: "L'inquinamento dell'aria, certo, è un argomento forte. Ma i negozi? Senza macchine, chi viene a comprare?"
      recast: {text: "la contaminazione dell'aria", fix: "L'inquinamento dell'aria", tags: [false-friend]}
      goals: [position]
    - learner: "I clienti arrivano a piedi, in bici o con i mezzi pubblici. In altre città, dopo la zona pedonale, i negozi hanno facturato di più."
      errors: [word-choice]
    - tutor: "Avranno anche fatturato di più, ma in quelle città i mezzi pubblici funzionano. Qui l'autobus passa ogni mezz'ora!"
      recast: {text: "facturato", fix: "fatturato", tags: [word-choice]}
      goals: [argue]
    - learner: "Allora bisogna aumentare gli autobus. Non possiamo usare la macchina come scusa per tutto: è una questione di salute."
    - tutor: "Lei vede tutto facile. E chi abita in centro e deve parcheggiare?"
    - learner: "Per i residenti si possono dare permessi speciali. E poi molti usano la macchina solo per fare la compra al supermercato."
      errors: [word-choice]
    - tutor: "Per fare la spesa, in effetti, la macchina non serve sempre. Però i commercianti hanno paura di perdere clienti."
      recast: {text: "fare la compra", fix: "fare la spesa", tags: [word-choice]}
      goals: [counter]
    - learner: "Capisco la loro paura. Possiamo fare una prova: chiudere il centro solo nel fine settimana, per sei mesi, e poi valutare i risultati."
    - tutor: "Una prova di sei mesi... questa è una proposta che potrei accettare anch'io."
      goals: [concede]

- scenario: film-libro
  level: B2
  persona: en-f-professional
  history: [false-friend]
  turns:
    - tutor: "Benvenuti! Chi vuole iniziare? Cosa hai letto questo mese?"
    - learner: "Inizio io! Ho letto un romanzo ambientato a Trieste, su una famiglia di librai durante la guerra."
    - tutor: "Interessante! Di che cosa parla, senza raccontare il finale?"
    - learner: "Il padre nasconde dei libri proibiti nel basamento e il figlio lo scopre per caso. Da quel momento deve scegliere tra la famiglia e la carriera nell'esercito."
      errors: [word-choice]
    - tutor: "Libri proibiti in cantina: che scelta difficile per il figlio! E com'è il personaggio principale?"
      recast: {text: "nel basamento", fix: "in cantina", tags: [word-choice]}
      goals: [summary]
    - learner: "È un ragazzo molto sensibile: capisce subito il pericolo e non fa mai scelte stupide."
      errors: [false-friend]
    - tutor: "Un ragazzo molto giudizioso, quindi, più adulto della sua età. Ti è piaciuto?"
      recast: {text: "molto sensibile", fix: "molto giudizioso", tags: [false-friend]}
      new: [{lemma: giudizioso, gloss: sensible}]
      goals: [characters]
    - learner: "Sì, anche se è lungo. Attualmente la prima parte è un po' noiosa, ma poi la storia accelera."
      errors: [false-friend]
    - tutor: "In realtà succede spesso con i romanzi storici: l'inizio serve a costruire il mondo. E il finale?"
      recast: {text: "Attualmente", fix: "In realtà", tags: [false-friend]}
    - learner: "Il finale mi ha commossa. Non vi dico niente, ma ho pianto in treno!"
    - tutor: "Allora ne vale la pena! A chi lo consiglieresti?"
      goals: [opinion]
    - learner: "A chi ama la storia e le saghe familiari. A chi cerca azione, no."
    - tutor: "Perfetto, lo mettiamo nella lista del mese prossimo!"
      goals: [recommend]

- scenario: politica-lavoro
  level: B2
  persona: es-f-erasmus
  history: [word-choice]
  turns:
    - tutor: "Io dico che tra dieci anni metà dei lavori non esisterà più. Tu che dici?"
    - learner: "Secondo me esageri. Alcuni lavori spariranno, è vero, ma ne nasceranno altri che oggi non immaginiamo."
    - tutor: "Belle parole. Ma un esempio reale?"
      goals: [opinion]
    - learner: "Mio cugino lavorava in banca. Quando hanno chiuso la sua sucursal, ha fatto un corso di programmazione e adesso sviluppa app."
      errors: [word-choice]
    - tutor: "Hanno chiuso la sua filiale e lui si è rimesso in gioco: è stato fortunato. Ma se domani tutti gli impiegati di banca dovessero cambiare lavoro?"
      recast: {text: "la sua sucursal", fix: "la sua filiale", tags: [word-choice]}
      goals: [example]
    - learner: "Se succedesse, lo Stato dovrebbe pagare la formazione. E dovrebbe prendere una decisione adesso, non tra dieci anni."
    - tutor: "E con quali soldi?"
      goals: [hypothesis]
    - learner: "Con le tasse sulle aziende che usano l'automazione. Se un robot sostituisce dieci persone, l'azienda salva molti soldi."
      errors: [word-choice]
    - tutor: "Risparmia molti soldi, certo, ma se le tasse sono troppo alte, l'azienda va a produrre in un altro paese."
      recast: {text: "salva molti soldi", fix: "risparmia molti soldi", tags: [word-choice]}
    - learner: "Forse. Comunque io penso che la tecnologia non è il problema: il problema è come la usiamo."
      errors: [subjunctive-use]
      gold: {text: "penso che la tecnologia non è", fix: "penso che la tecnologia non sia"}
    - tutor: "Bella conclusione. Però «penso che la tecnologia non è»: dopo «penso che», quale modo serve?"
      prompt: {text: "penso che la tecnologia non è", tags: [subjunctive-use]}
    - learner: "Ah, giusto: penso che la tecnologia non sia il problema. E tu, alla fine, cosa ne pensi?"
    - tutor: "Che hai ragione a metà: la tecnologia non è il problema, ma la politica è troppo lenta."
      goals: [conclude]

- scenario: riunione-lavoro
  level: B2
  persona: en-m-traveller
  history: [word-choice, false-friend]
  turns:
    - tutor: "Bene, iniziamo. Come va il tuo progetto?"
    - learner: "Quasi bene. Abbiamo finito il nuovo sito per il cliente di Torino, ma la presentazione di giovedì mi preoccupa."
    - tutor: "Perché? Che cosa ti preoccupa?"
      goals: [update]
    - learner: "Il cliente ha cambiato idea sui colori tre volte. Ieri Marco ha letto le nuove richieste e ha realizzato che non abbiamo abbastanza tempo."
      errors: [false-friend]
    - tutor: "Marco si è reso conto che non c'è tempo? Allora il problema è serio. Quanti giorni vi mancano?"
      recast: {text: "ha realizzato", fix: "si è reso conto", tags: [false-friend]}
      goals: [problem]
    - learner: "Almeno cinque. Propongo di dare la presentazione giovedì con le pagine principali, e di finire il resto la settimana dopo."
      errors: [word-choice]
    - tutor: "Fare la presentazione giovedì solo con le pagine principali mi sembra ragionevole. Il cliente sarà d'accordo?"
      recast: {text: "dare la presentazione", fix: "fare la presentazione", tags: [word-choice]}
      goals: [proposal]
    - learner: "Penso di sì, se gli spieghiamo bene il motivo. Posso chiamarlo io oggi pomeriggio."
    - tutor: "Va bene, chiamalo tu. E per il resto del sito, che data proponi?"
    - learner: "Mercoledì 14. Così abbiamo anche un giorno per i test."
    - tutor: "Perfetto, mercoledì 14. Scrivimi un messaggio dopo la telefonata."
      goals: [deadline]

- scenario: affittare-appartamento
  level: B2
  persona: en-m-retired
  history: [word-choice]
  turns:
    - tutor: "Buongiorno, prego, entri pure. Questo è il soggiorno."
    - learner: "Buongiorno. Che bella luce! L'appartamento è arredato?"
    - tutor: "Sì, completamente: divano, letti e una cucina nuova."
    - learner: "E quanto è l'affitto? Che cosa include?"
    - tutor: "Ottocento euro al mese, spese del condominio comprese. Il riscaldamento invece si paga a parte."
      goals: [rent]
    - learner: "Il riscaldamento è centralizzato? Sono ritirato e d'inverno sto molto a casa: non vorrei avere freddo."
      errors: [false-friend]
    - tutor: "No, ogni appartamento ha il suo: così, ora che è in pensione, lo regola lei come vuole."
      recast: {text: "ritirato", fix: "in pensione", tags: [false-friend]}
      goals: [condition]
    - learner: "Ottimo. E il contratto? Vorrei un contratto lungo: alla mia età non ho voglia di muovermi ogni due anni."
      errors: [word-choice]
    - tutor: "Capisco, nessuno ha voglia di traslocare spesso. Le propongo quattro anni più quattro, con due mesi di caparra."
      recast: {text: "muovermi", fix: "traslocare", tags: [word-choice]}
      new: [{lemma: traslocare, gloss: to move house}]
      goals: [contract]
    - learner: "Mi va bene. E il quartiere? Ci sono negozi a distanza di camminata? Non guido più."
      errors: [word-choice]
    - tutor: "Sì, a pochi passi ci sono un supermercato, una farmacia e il mercato del martedì."
      recast: {text: "a distanza di camminata", fix: "a pochi passi", tags: [word-choice]}
      goals: [neighbourhood]
    - learner: "Benissimo. Un'ultima domanda: c'è l'ascensore? Ho un ginocchio cattivo."
      errors: [word-choice]
    - tutor: "Sì, c'è l'ascensore: con un ginocchio malandato è necessario, lo capisco. Allora, che ne pensa?"
      recast: {text: "un ginocchio cattivo", fix: "un ginocchio malandato", tags: [word-choice]}
      new: [{lemma: malandato, gloss: in bad shape}]
    - learner: "Mi piace molto. Sono interessato: possiamo preparare il contratto?"
    - tutor: "Certo, la chiamo domani per fissare la firma."
      goals: [decide]

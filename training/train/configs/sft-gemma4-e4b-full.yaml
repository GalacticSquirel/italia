# Full fine-tune (release model) with accelerate + FSDP on 8x H100 80 GB, ~6-12 h.
# Effective batch 2 x 4 x 8 GPUs = 64 dialogues.
extends: _gemma4-e4b-base.yaml
name: sft-gemma4-e4b-full
method: full
backend: transformers
trainFile: work/sft/sft.train.jsonl
valFile: work/sft/sft.val.jsonl
maxSeqLength: 4096
optim:
  learningRate: 1.0e-5
  epochs: 2
  perDeviceBatchSize: 2
  gradientAccumulationSteps: 4
  warmupRatio: 0.03
  weightDecay: 0.0
  lrScheduler: cosine
  optimizer: adamw_torch_fused
outputDir: out/sft-gemma4-e4b-full

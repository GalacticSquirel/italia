# Shared base-model block for Gemma 4 E2B. Start from Google's QAT checkpoint (unquantized
# weights trained to survive Q4_0), so the shipped Q4_0 GGUF loses less after fine-tuning.
baseModel:
  id: google/gemma-4-E2B-it-qat-q4_0-unquantized
  revision: null # pin a commit sha before the release run
  loader: image-text-to-text
  freezePatterns: [vision_tower, audio_tower, embed_vision, embed_audio, multi_modal_projector]
  licence: Apache-2.0
  systemRole: native

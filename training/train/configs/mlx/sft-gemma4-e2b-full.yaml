# Full fine-tune of Gemma 4 E2B with MLX: fits 64 GB at micro-batch 1 (about 40 GB peak).
# The token and per-layer embeddings stay frozen (they are ~2.3B of the ~4.6B language-model
# parameters and barely move in SFT); unfreezing them roughly doubles the optimizer memory.
extends: ../_gemma4-e2b-base.yaml
name: mlx-sft-gemma4-e2b-full
method: full
backend: mlx
baseModel:
  freezePatterns:
    [vision_tower, audio_tower, embed_vision, embed_audio, multi_modal_projector, embed_tokens]
trainFile: work/sft/sft.train.jsonl
valFile: work/sft/sft.val.jsonl
maxSeqLength: 4096
optim:
  learningRate: 1.0e-5
  epochs: 2
  perDeviceBatchSize: 1
  gradientAccumulationSteps: 16
  warmupRatio: 0.03
  lrScheduler: cosine
  optimizer: adamw
  weightDecay: 0.01
gradientCheckpointing: true
loggingSteps: 10
evalSteps: 250
saveSteps: 100
mlx: {keepCheckpoints: 2, clearCacheEvery: 50}
outputDir: out/mlx/sft-gemma4-e2b-full

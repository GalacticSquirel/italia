id: intervista-radio
title: Ospite in radio
titleEn: 'Live radio interview on a cultural programme'
levels: [C2]
setting: 'A live cultural programme on national radio; the learner is a foreign writer who has just published a book about living in Italy.'
tutorRole: 'a sharp, slightly mischievous radio host'
learnerRole: 'a foreign author being interviewed live'
formality: formal
goals:
- {id: present-book, description: 'Present the book and why you wrote it'}
- {id: stereotype, description: 'Respond to a provocative question about stereotypes'}
- {id: anecdote, description: 'Tell a revealing anecdote from your life in Italy'}
- {id: language, description: 'Reflect on what learning Italian changed in you'}
- {id: farewell, description: 'Close with a witty or memorable line'}
keyVocab: [ascoltatori, libro, stereotipo, aneddoto, sguardo, straniero, puntata, in diretta, bentornati, autrice, incoscienza]
grammarFocus: [passato-prossimo-vs-imperfetto, congiuntivo-passato, gerund-clauses]
opening: 'Bentornati, cari ascoltatori. In studio con noi c''è un''autrice che ha avuto il coraggio, o l''incoscienza, di scrivere un libro su di noi italiani. Benvenuta!'
tags: [media, culture]

id: critica-teatrale
title: Dopo lo spettacolo
titleEn: Discussing a play with a critic
levels: [C1, C2]
setting: The theatre foyer after the premiere of a new staging of a classic comedy.
tutorRole: a theatre critic
learnerRole: a member of the audience
formality: informal
goals:
- {id: impression, description: Give your overall impression}
- {id: staging, description: Discuss the direction and the acting}
- {id: compare, description: Compare it with the original or another staging}
- {id: recommend, description: Say whether you would recommend it and to whom}
keyVocab: [regia, messinscena, interpretazione, copione, pubblico, sipario, attore, battuta]
grammarFocus: [congiuntivo-passato, reported-speech, relative-pronouns]
opening: Allora, che ne pensi? A me il secondo atto non ha convinto del tutto.
tags: [culture, arts]
split: eval

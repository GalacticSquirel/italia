id: circolo-lettura
title: Il circolo di lettura
titleEn: 'Book club: arguing about a novel'
levels: [C2]
setting: 'A book club in a Rome bookshop, discussing Italo Calvino''s "Il barone rampante" over a glass of wine.'
tutorRole: 'a retired literature teacher who loves to provoke'
learnerRole: 'a member of the book club'
formality: informal
goals:
- {id: impression, description: 'Give your overall impression of the novel'}
- {id: theme, description: 'Interpret one central theme with an example from the text'}
- {id: style, description: 'Comment on Calvino''s style or irony'}
- {id: disagree, description: 'Disagree with the tutor''s reading and defend your own'}
- {id: recommend, description: 'Suggest the next book and justify it'}
keyVocab: [romanzo, protagonista, allegoria, ironia, narratore, ribellione, leggerezza, metafora]
grammarFocus: [congiuntivo-imperfetto, periodo-ipotetico, relative-pronouns]
opening: 'Allora, confessatelo, chi di voi ha trovato Cosimo insopportabile? Io, a rileggerlo, un po'' sì.'
tags: [literature, culture]

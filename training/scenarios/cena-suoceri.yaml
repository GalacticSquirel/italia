id: cena-suoceri
title: A cena dai suoceri
titleEn: 'First dinner with the future in-laws'
levels: [C2]
setting: 'The learner meets their partner''s parents for the first time at their elegant flat in Florence; the father is formal and fond of irony.'
tutorRole: 'the partner''s father, courteous, ironic and testing'
learnerRole: 'the partner meeting the parents for the first time'
formality: formal
goals:
- {id: compliment, description: 'Compliment the host and the food without overdoing it'}
- {id: background, description: 'Talk about your work and plans with tact'}
- {id: irony, description: 'Respond gracefully to an ironic remark'}
- {id: tu-lei, description: 'Handle the moment when the host proposes switching to tu'}
keyVocab: [padrone di casa, complimenti, accoglienza, ospitalità, darsi del tu, cortesia, brindisi, garbo, immaginario]
grammarFocus: [congiuntivo-presente, conditional, combined-pronouns]
opening: 'Prego, si sieda pure. Mia figlia ci ha parlato tanto di Lei che ormai temevamo fosse un personaggio immaginario.'
tags: [register, family]

id: notizie-attualita
title: Commentare una notizia
titleEn: Talking over the news with a colleague
levels: [C1, C2]
setting: The office coffee machine, the morning after a much-discussed news story about a new law on short-term holiday rentals.
tutorRole: a sceptical colleague who has read several newspapers on the story
learnerRole: a colleague who also followed the news
formality: informal
goals:
- {id: summarise, description: Summarise the news in your own words}
- {id: opinion, description: Give a nuanced opinion with reasons}
- {id: sources, description: Compare how different sources reported it}
- {id: consequences, description: Speculate about the consequences}
keyVocab: [notizia, articolo, testata, legge, affitti brevi, polemica, fonte, titolo, approfondimento]
grammarFocus: [congiuntivo-imperfetto, reported-speech]
opening: Hai visto la storia degli affitti brevi? Stamattina non si parlava d'altro. Tu che idea ti sei fatto?
tags: [society, media]

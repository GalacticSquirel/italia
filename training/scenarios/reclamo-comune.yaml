id: reclamo-comune
title: Un reclamo al Comune
titleEn: Complaining to the town council
levels: [C1, C2]
setting: The public relations office (URP) of the town council; the street outside the learner's home has had roadworks abandoned for two months.
tutorRole: a civil servant at the counter, courteous but bureaucratic
learnerRole: a resident making a formal complaint
formality: formal
goals:
- {id: describe, description: Describe the problem precisely}
- {id: insist, description: Insist politely when given a vague answer}
- {id: rights, description: Ask about the formal procedure and your rights}
- {id: commitment, description: Obtain a concrete commitment or reference number}
keyVocab: [reclamo, cantiere, lavori, ufficio tecnico, protocollo, segnalazione, disagio, sollecito]
grammarFocus: [passive-voice, si-impersonale]
opening: Buongiorno, mi dica pure. Di che cosa si tratta?
tags: [bureaucracy]

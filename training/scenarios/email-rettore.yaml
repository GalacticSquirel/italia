id: email-rettore
title: Una lettera delicata
titleEn: 'Getting the register right in a formal letter'
levels: [C2]
setting: 'The learner must write to a university rector to contest an unfair decision and asks an experienced administrator to help get the tone right.'
tutorRole: 'a senior university administrator, polite and exacting about formal style'
learnerRole: 'a visiting researcher who must write the letter'
formality: formal
goals:
- {id: situation, description: 'Explain the situation and what you want to obtain'}
- {id: opening-formula, description: 'Agree on the right salutation and opening formula'}
- {id: tone, description: 'Rephrase a too-direct sentence in a firm but courteous way'}
- {id: closing, description: 'Choose an appropriate closing formula'}
keyVocab: [Magnifico Rettore, cortese attenzione, distinti saluti, istanza, ricorso, delibera, in attesa di riscontro, porgere]
grammarFocus: [congiuntivo-imperfetto, conditional, passive-voice]
opening: 'Buongiorno, si accomodi. Mi diceva al telefono che deve scrivere direttamente al Rettore. Di che cosa si tratta, esattamente?'
tags: [register, work]

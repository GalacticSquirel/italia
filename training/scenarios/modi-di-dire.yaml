id: modi-di-dire
title: Una giornata storta
titleEn: Telling a friend about a disastrous day
levels: [C1, C2]
setting: An aperitivo with an Italian friend who loves idioms; the learner tells the story of a day where everything went wrong.
tutorRole: a witty Italian friend who comments with idioms and colloquial expressions
learnerRole: a friend recounting a bad day
formality: informal
goals:
- {id: tell, description: 'Tell what went wrong, in order'}
- {id: react, description: React to and use an idiom the friend uses}
- {id: blame, description: 'Say whose fault it was, with nuance'}
- {id: moral, description: 'Draw a lesson from it, light-heartedly'}
keyVocab: [giornata, guaio, sfortuna, capitare, ritardo, figuraccia, pazienza, colpa, scherzo]
grammarFocus: [trapassato-prossimo, gerund-clauses]
opening: Hai una faccia... Dai, siediti e racconta. Cos'è successo stavolta?
tags: [social, idioms]

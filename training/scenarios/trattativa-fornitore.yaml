id: trattativa-fornitore
title: Trattativa con un fornitore
titleEn: Negotiating with a supplier
levels: [C1, C2]
setting: A video call with a supplier of packaging materials whose prices have just gone up by fifteen per cent.
tutorRole: a supplier's sales manager, polite but firm
learnerRole: a purchasing manager for a small food company
formality: formal
goals:
- {id: problem, description: Raise the problem of the price increase}
- {id: argue, description: Argue your case using the business relationship}
- {id: counteroffer, description: Make a counter-offer}
- {id: agreement, description: Reach and confirm an agreement}
keyVocab: [fornitore, aumento, listino, sconto, ordine, contratto, consegna, margine, condizioni]
grammarFocus: [conditional, congiuntivo-imperfetto]
opening: Buongiorno, immagino che mi chiami per il nuovo listino. Purtroppo i costi delle materie prime sono saliti per tutti.
tags: [work, negotiation]

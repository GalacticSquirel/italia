id: assemblea-condominio
title: L'assemblea di condominio
titleEn: 'A tense building meeting'
levels: [C2]
setting: 'An annual building meeting in a Genoa apartment block; tempers are rising over the cost of renovating the façade.'
tutorRole: 'the building administrator, diplomatic but weary, who also voices the other residents'' objections'
learnerRole: 'a resident who wants to postpone the works'
formality: formal
goals:
- {id: position, description: 'State your position without escalating'}
- {id: defuse, description: 'Defuse a sarcastic or aggressive remark'}
- {id: alternative, description: 'Propose a concrete alternative'}
- {id: compromise, description: 'Reach a compromise and get it minuted'}
keyVocab: [amministratore, facciata, preventivo, millesimi, verbale, delibera, rata, ponteggio]
grammarFocus: [congiuntivo-imperfetto, conditional-past, passive-voice]
opening: 'Allora, signori, se riusciamo a parlare uno alla volta forse finiamo prima di mezzanotte. Lei voleva intervenire?'
tags: [register, housing]

id: assicurazione-sinistro
title: Un incidente in macchina
titleEn: Reporting a car accident
levels: [B2, C1, C2]
setting: A phone call to the car insurance company after a minor accident.
tutorRole: the insurance claims handler
learnerRole: a driver reporting an accident
formality: formal
goals:
- {id: what, description: Describe what happened}
- {id: responsibility, description: Explain who was responsible}
- {id: documents, description: Answer questions about the accident report}
- {id: next, description: Ask what happens next}
keyVocab: [incidente, constatazione amichevole, danno, paraurti, sinistro, perizia, targa, franchigia]
grammarFocus: [passive-voice, passato-prossimo-vs-imperfetto, trapassato-prossimo]
opening: Buongiorno, ufficio sinistri. Mi racconti cosa è successo.
tags: [problems, phone]

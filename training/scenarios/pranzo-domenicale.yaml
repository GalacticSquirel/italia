id: pranzo-domenicale
title: Modi di dire a tavola
titleEn: 'Idioms over Sunday lunch'
levels: [C2]
setting: 'A long Sunday lunch at a friend''s family home in Bologna; the conversation drifts to idioms and sayings.'
tutorRole: 'a witty friend who peppers every sentence with idioms'
learnerRole: 'a guest who wants to sound like a native'
formality: informal
goals:
- {id: react, description: 'React to an idiom the tutor uses and guess its meaning'}
- {id: use-idiom, description: 'Use an idiom correctly in your own story'}
- {id: compare, description: 'Compare an Italian idiom with one from your language'}
- {id: anecdote, description: 'Tell a short anecdote that ends with a fitting saying'}
keyVocab: [modo di dire, proverbio, espressione, significato, letterale, figurato, battuta, sfumatura, scannarsi, lasagna]
grammarFocus: [ci-locative, ne-partitive, combined-pronouns]
opening: 'Ah, sei arrivato giusto in tempo, qui si stanno già scannando per l''ultima lasagna. Siediti, che non mordiamo!'
tags: [idioms, culture]

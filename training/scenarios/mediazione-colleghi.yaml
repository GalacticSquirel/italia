id: mediazione-colleghi
title: Mediare un conflitto
titleEn: Mediating a conflict in the team
levels: [C1, C2]
setting: A one-to-one in the learner's office; a team member is upset because a colleague took credit for shared work.
tutorRole: an upset team member who feels treated unfairly
learnerRole: the team leader
formality: formal
goals:
- {id: listen, description: Let them explain and show you understand}
- {id: clarify, description: Ask tactful questions to clarify the facts}
- {id: perspective, description: Offer the other side's perspective diplomatically}
- {id: solution, description: Propose a fair way forward}
keyVocab: [collega, merito, riunione, malinteso, fiducia, responsabilità, chiarimento, squadra]
grammarFocus: [congiuntivo-passato, reported-speech]
opening: Scusi se la disturbo, ma devo parlarle di quello che è successo ieri alla riunione. Non mi è andato giù.
tags: [work]

id: umorismo-satira
title: Ridere in italiano
titleEn: 'Explaining jokes and satire'
levels: [C2]
setting: 'A bar after a stand-up comedy night in Rome; the friends dissect the jokes, puns and political satire they heard.'
tutorRole: 'a Roman friend with a dry sense of humour'
learnerRole: 'a friend who came to the show'
formality: informal
goals:
- {id: favourite, description: 'Say which joke you liked and why it worked'}
- {id: missed, description: 'Admit a joke you did not get and ask for an explanation'}
- {id: wordplay, description: 'Explain or attempt a play on words'}
- {id: limits, description: 'Discuss whether satire should have limits'}
keyVocab: [battuta, gioco di parole, ironia, sarcasmo, satira, comico, doppio senso, freddura, carbonara]
grammarFocus: [congiuntivo-imperfetto, periodo-ipotetico, reported-speech]
opening: 'Dai, ammettilo, alla battuta sul ministro e la carbonara non hai riso perché non l''avevi capita.'
tags: [humour, culture]

id: intelligenza-artificiale
title: Lavoro e intelligenza artificiale
titleEn: 'Debate with a friend: AI and jobs'
levels: [C1, C2]
setting: A long dinner at a friend's house; the conversation turns to whether artificial intelligence will destroy or create jobs.
tutorRole: a friend who is a pessimist about technology
learnerRole: a friend with a more balanced view
formality: informal
goals:
- {id: position, description: State and qualify your position}
- {id: evidence, description: Bring an example or piece of evidence}
- {id: concede, description: Concede a valid point}
- {id: conclude, description: Find common ground}
keyVocab: [intelligenza artificiale, posto di lavoro, automazione, competenze, formazione, rischio, settore, tecnologia]
grammarFocus: [congiuntivo-imperfetto, periodo-ipotetico]
opening: Ti dico la verità, a me questa intelligenza artificiale fa un po' paura. Tra dieci anni metà di noi sarà a casa, vedrai.
tags: [society, debate, technology]

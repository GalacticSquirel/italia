id: presentazione-progetto
title: Presentare un progetto
titleEn: Pitching a project to a director
levels: [C1, C2]
setting: A meeting room in a Milan company; the learner is pitching a new project and the director has doubts about budget and timing.
tutorRole: a demanding department director
learnerRole: a project manager presenting a proposal
formality: formal
goals:
- {id: pitch, description: Present the project and its goal}
- {id: benefits, description: Explain the expected benefits with figures}
- {id: objection, description: Handle an objection about cost or risk}
- {id: next-steps, description: Agree on the next steps}
keyVocab: [progetto, budget, scadenza, obiettivo, rischio, risorse, fatturato, cliente, investimento]
grammarFocus: [periodo-ipotetico, congiuntivo-presente]
opening: Ho dieci minuti prima della prossima riunione. Mi spieghi in breve perché dovremmo investire in questo progetto.
tags: [work]

id: club-lettura
title: Il club di lettura
titleEn: Book club discussion
levels: [C1, C2]
setting: A monthly book club in a Turin bookshop; this month's novel is a family saga set in post-war Italy.
tutorRole: a long-standing member who loved the book and likes a good argument
learnerRole: a newer member who finished the book
formality: informal
goals:
- {id: impression, description: Give your overall impression of the novel}
- {id: character, description: Analyse one character's choices}
- {id: style, description: Comment on the author's style}
- {id: recommend, description: Say who you would or would not recommend it to}
keyVocab: [romanzo, trama, personaggio, protagonista, stile, finale, narratore, ambientazione, capitolo]
grammarFocus: [congiuntivo-passato, conditional-past]
opening: Allora, ce l'hai fatta a finirlo? Io l'ho letto in tre sere, ma so che non è piaciuto a tutti.
tags: [culture, books]

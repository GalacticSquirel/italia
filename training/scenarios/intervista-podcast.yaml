id: intervista-podcast
title: Ospite in un podcast
titleEn: Guest on a podcast about living in Italy
levels: [C1, C2]
setting: A recording studio for a podcast about foreigners who have chosen to live in Italy.
tutorRole: a curious, friendly podcast host
learnerRole: a guest who has lived in Italy for some years
formality: informal
goals:
- {id: story, description: Tell how and why you came to Italy}
- {id: culture-shock, description: Describe a cultural difference that surprised you}
- {id: critique, description: 'Criticise something about Italy, tactfully'}
- {id: advice, description: Give advice to someone thinking of moving}
keyVocab: [trasferirsi, abitudini, burocrazia, mentalità, nostalgia, integrarsi, stereotipo, accoglienza]
grammarFocus: [congiuntivo-imperfetto, trapassato-prossimo]
opening: Ciao e grazie di essere qui! Partiamo dall'inizio. Com'è che sei arrivato proprio in Italia?
tags: [culture]

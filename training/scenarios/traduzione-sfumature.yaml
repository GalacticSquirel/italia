id: traduzione-sfumature
title: Questione di sfumature
titleEn: 'Translating nuance with a colleague'
levels: [C2]
setting: 'Two translators at a Milan publishing house argue over how to render an English novel''s tone into Italian.'
tutorRole: 'a senior translator, perfectionist and sarcastic'
learnerRole: 'a junior translator defending their draft'
formality: informal
goals:
- {id: problem, description: 'Present a passage that is hard to translate and why'}
- {id: options, description: 'Weigh two possible Italian renderings'}
- {id: false-friend, description: 'Spot or discuss a false friend or calque'}
- {id: decide, description: 'Agree on a final choice and justify it'}
keyVocab: [traduzione, resa, calco, falso amico, registro, fedeltà, tono, scorrevole]
grammarFocus: [congiuntivo-presente, conditional-past, reported-speech]
opening: 'Ho letto la tua bozza del terzo capitolo. Scorre, eh, scorre benissimo. Peccato che non sia più l''autore a parlare.'
tags: [language, work]

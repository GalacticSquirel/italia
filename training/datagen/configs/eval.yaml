# Held-out evaluation set: dialogues on the `split: eval` scenarios only (never trained on).
# ~700 jobs -> ~500 accepted dialogues, stratified by level, as in the research plan.
extends: train.yaml
name: eval-v1
seed: 777
outputDir: work/datagen/eval-v1
split: eval
targetDialogues: 700
learner:
  levelMix: {A1: 0.25, A2: 0.25, B1: 0.25, B2: 0.25}

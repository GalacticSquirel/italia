# Held-out evaluation set generated by the local teacher (see local-mac.yaml): the `split: eval`
# scenarios only, ~700 jobs -> ~500 accepted dialogues, stratified by level.
extends: local-mac.yaml
name: eval-local-v1
seed: 777
outputDir: work/datagen/eval-local-v1
split: eval
targetDialogues: 700
learner:
  levelMix: {A1: 0.25, A2: 0.25, B1: 0.25, B2: 0.25}

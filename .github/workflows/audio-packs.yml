name: Audio packs

# Records the app's pre-made Italian audio (see audio/README.md) and publishes it to the
# project's Hugging Face repository:
#
#   plan     what each pack still needs (published shards are skipped, so re-runs are cheap)
#   record   parallel slices: synthetic voices, native word recordings, word timings
#   publish  pack each pack's new clips into its next shard, upload it with
#            models/scripts/publish_files.py, upload the shard indexes, and commit the manifest
#
# Needs the same settings as "Publish model files": the HF_TOKEN (or HF_WRITE) secret and the
# HF_MODELS_REPO variable.

on:
  # A workflow can be started by hand only once it is on the default branch, so it also runs
  # when the audio pipeline changes on the branch that adds it.
  push:
    branches: [claude/project-thread-9uarzt]
    paths:
      - '.github/workflows/audio-packs.yml'
      - 'audio/italia_audio/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'Pack ids, space separated (empty: all)'
        required: false
        default: ''
      limit:
        description: 'Record only the first N utterances per pack (0: all)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: audio-packs
  cancel-in-progress: false

env:
  HF_MODELS_REPO: ${{ vars.HF_MODELS_REPO }}
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    defaults:
      run:
        working-directory: audio
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_WRITE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_MODELS_REPO" ]; then
            echo "::error::Set the HF_TOKEN (or HF_WRITE) secret and the HF_MODELS_REPO variable first."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: audio/uv.lock

      - run: uv sync --frozen

      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          only=()
          for id in $ONLY; do only+=(--only "$id"); done
          uv run python -m italia_audio --work work plan --limit "$LIMIT" "${only[@]}"
          echo "matrix=$(jq -c '{include: .}' work/plan/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length work/plan/matrix.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: audio/work/plan
          retention-days: 3

  record:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: audio
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: audio/uv.lock

      - run: uv sync --frozen --extra tts

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            audio/work/voices
          key: audio-models-v1

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: audio/work/plan

      - run: >-
          uv run python -m italia_audio --work work
          synth --pack ${{ matrix.pack }} --part ${{ matrix.part }} --parts ${{ matrix.parts }}

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.pack }}-${{ matrix.part }}
          path: audio/work/out
          retention-days: 3

  publish:
    needs: [plan, record]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_WRITE }}
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: audio/uv.lock

      - run: uv sync --frozen --extra publish
        working-directory: audio

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: audio/work/out
          merge-multiple: true

      - name: Pack the new shards
        working-directory: audio
        run: |
          packs=$(ls work/out | tr '\n' ' ')
          for pack in $packs; do uv run python -m italia_audio --work work assemble --pack "$pack"; done
          echo "PACKS=$packs" >> "$GITHUB_ENV"

      - name: Upload the shards and point the manifest at them
        run: |
          args=()
          for pack in $PACKS; do args+=(--only "$pack" --local-dir "models/build/audio/$pack"); done
          audio/.venv/bin/python -I models/scripts/publish_files.py --repo "$HF_MODELS_REPO" "${args[@]}"
          audio/.venv/bin/python -m italia_audio upload-indexes
          npx --yes prettier@3.10.1 --write models/manifest.json
        env:
          PYTHONPATH: audio

      - name: Commit the manifest
        run: |
          if git diff --quiet models/manifest.json; then
            echo "Manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish new audio pack shards" models/manifest.json
          git push

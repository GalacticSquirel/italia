[project]
name = "italia-audio"
version = "0.1.0"
description = "Pre-recorded Italian audio packs (words, sentences, stories) for the Italia app"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
# Core: content, clip keys, pack format and the native-recording client (no ML).
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
# Synthesis and alignment (CPU). Kokoro brings torch; torchaudio provides the MMS aligner.
tts = [
  "kokoro==0.9.4",
  "piper-tts==1.8.0",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "soundfile==0.13.1",
]
publish = ["huggingface_hub[hf_xet]>=0.34"]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "work"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PL", "TID"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["^\\.venv/", "^work/"]

[[tool.mypy.overrides]]
module = ["kokoro.*", "piper.*", "torch.*", "torchaudio.*", "scipy.*", "zstandard.*", "huggingface_hub.*", "soundfile.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
